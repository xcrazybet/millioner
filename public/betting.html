<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Betting Platform</title>
  <style>
    body { font-family: Arial, sans-serif; background:#111; color:#eee; margin:0; padding:20px; }
    h1 { text-align:center; }
    .section { margin-top:30px; }
    .match, .item { background:#222; margin:10px 0; padding:15px; border-radius:8px; }
    .teams { font-size:1.2em; font-weight:bold; }
    .info { margin-top:5px; font-size:0.9em; color:#ccc; }
    .countdown { color:#0f0; font-weight:bold; }
  </style>
</head>
<body>
  <h1>⚽ Betting Platform</h1>

  <div class="section"><h2>Live Matches</h2><div id="live"></div></div>
  <div class="section"><h2>Upcoming Matches</h2><div id="upcoming"></div></div>
  <div class="section"><h2>Leagues</h2><div id="leagues"></div></div>
  <div class="section"><h2>Teams</h2><div id="teams"></div></div>
  <div class="section"><h2>Players</h2><div id="players"></div></div>
  <div class="section"><h2>Standings</h2><div id="standings"></div></div>
  <div class="section"><h2>Odds</h2><div id="odds"></div></div>

  <script>
    async function load(endpoint, containerId, formatter) {
      try {
        const res = await fetch(endpoint);
        const json = await res.json();
        const data = json.data || [];
        const container = document.getElementById(containerId);
        container.innerHTML = "";

        if (data.length === 0) {
          container.innerHTML = "<p>No data available.</p>";
          return;
        }

        data.forEach(item => {
          const div = document.createElement("div");
          div.className = "item";
          div.innerHTML = formatter(item);
          container.appendChild(div);
        });
      } catch (err) {
        document.getElementById(containerId).innerHTML = "<p>Error loading data.</p>";
      }
    }

    function refresh() {
      load("/api/inplay", "live", m => {
        const home = m.participants?.[0]?.name || "Home";
        const away = m.participants?.[1]?.name || "Away";
        const start = new Date(m.starting_at);
        const now = new Date();
        const elapsed = Math.floor((now - start) / 60000);
        return \`
          <div class="teams">\${home} vs \${away}</div>
          <div class="info">Date: \${start.toLocaleDateString()} | Time: \${start.toLocaleTimeString()}</div>
          <div class="info">Status: \${m.state?.name || "Unknown"}</div>
          <div class="countdown">Elapsed: \${elapsed} min</div>
        \`;
      });

      load("/api/upcoming", "upcoming", m => {
        const home = m.participants?.[0]?.name || "Home";
        const away = m.participants?.[1]?.name || "Away";
        const start = new Date(m.starting_at);
        const now = new Date();
        const countdown = Math.max(0, Math.floor((start - now) / 60000));
        return \`
          <div class="teams">\${home} vs \${away}</div>
          <div class="info">Starts in \${countdown} min</div>
        \`;
      });

      load("/api/leagues", "leagues", l => \`<div class="info">\${l.name}</div>\`);
      load("/api/teams", "teams", t => \`<div class="info">\${t.name}</div>\`);
      load("/api/players", "players", p => \`<div class="info">\${p.display_name}</div>\`);
      load("/api/standings", "standings", s => \`<div class="info">\${s.participant?.name} - \${s.points} pts</div>\`);
      load("/api/odds", "odds", o => \`<div class="info">Fixture \${o.fixture_id} - Market: \${o.market?.name}</div>\`);
    }

    refresh();
    setInterval(refresh, 30000);
  </script>
</body>
</html>
