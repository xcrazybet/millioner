<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Betting Platform</title>
  <style>
    body { font-family: Arial, sans-serif; background:#111; color:#eee; margin:0; padding:20px; }
    h1 { text-align:center; }
    .menu { display:flex; justify-content:center; gap:10px; margin-bottom:20px; }
    button { padding:10px 15px; background:#333; color:#eee; border:none; cursor:pointer; }
    button:hover { background:#555; }
    .section { display:none; }
    .item { background:#222; margin:10px 0; padding:15px; border-radius:8px; }
    .teams { font-size:1.2em; font-weight:bold; }
    .info { margin-top:5px; font-size:0.9em; color:#ccc; }
    .countdown { color:#0f0; font-weight:bold; }
    table { width:100%; border-collapse:collapse; margin-top:10px; }
    th, td { border:1px solid #444; padding:8px; text-align:center; }
    th { background:#333; }
    .card { background:#222; padding:15px; border-radius:8px; margin:10px 0; }
  </style>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore.js"></script>
</head>
<body>
  <h1>⚽ Betting Platform</h1>
  <div class="menu">
    <button onclick="showSection('live')">Live</button>
    <button onclick="showSection('finished')">Finished</button>
    <button onclick="showSection('upcoming')">Upcoming</button>
    <button onclick="showSection('standings')">Standings</button>
    <button onclick="showSection('teams')">Teams</button>
    <button onclick="showSection('players')">Players</button>
    <button onclick="showSection('odds')">Odds</button>
  </div>

  <div id="live" class="section"></div>
  <div id="finished" class="section"></div>
  <div id="upcoming" class="section"></div>
  <div id="standings" class="section"></div>
  <div id="teams" class="section"></div>
  <div id="players" class="section"></div>
  <div id="odds" class="section"></div>

  <script type="module">
    // Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
      authDomain: "x-bet-prod-jd.firebaseapp.com",
      projectId: "x-bet-prod-jd",
      storageBucket: "x-bet-prod-jd.firebasestorage.app",
      messagingSenderId: "499334334535",
      appId: "1:499334334535:web:bebc1bf817e24d9e3c4962",
      measurementId: "G-PTV4XMYQ6P"
    };

    const app = firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore(app);

    function showSection(id) {
      document.querySelectorAll('.section').forEach(sec => sec.style.display = 'none');
      document.getElementById(id).style.display = 'block';
    }

    // Render helpers
    function renderMatch(match) {
      const home = match.participants?.[0]?.name || "Home";
      const away = match.participants?.[1]?.name || "Away";
      const start = new Date(match.starting_at);
      return `
        <div class="teams">${home} vs ${away}</div>
        <div class="info">Date: ${start.toLocaleDateString()} | Time: ${start.toLocaleTimeString()}</div>
        <div class="info">Status: ${match.state?.name || "Unknown"}</div>
      `;
    }

    function renderOdds(odd) {
      return `
        <div class="card">
          <div class="info">Fixture ${odd.fixture_id}</div>
          <div class="info">Market: ${odd.market?.name || "Unknown"}</div>
          <div class="info">Bookmaker: ${odd.bookmaker?.name || "N/A"}</div>
        </div>
      `;
    }

    // Real-time listeners
    db.collection("games").onSnapshot(snapshot => {
      const liveContainer = document.getElementById("live");
      const finishedContainer = document.getElementById("finished");
      const upcomingContainer = document.getElementById("upcoming");
      liveContainer.innerHTML = "";
      finishedContainer.innerHTML = "";
      upcomingContainer.innerHTML = "";

      snapshot.forEach(doc => {
        const match = doc.data();
        const div = document.createElement("div");
        div.className = "item";
        div.innerHTML = renderMatch(match);

        const state = match.state?.name?.toLowerCase() || "";
        if (state.includes("live") || state.includes("inplay")) {
          liveContainer.appendChild(div);
        } else if (state.includes("finished") || state.includes("ended") || state.includes("ft")) {
          finishedContainer.appendChild(div);
        } else {
          upcomingContainer.appendChild(div);
        }
      });
    });

    db.collection("standings").onSnapshot(snapshot => {
      const container = document.getElementById("standings");
      let html = "<table><tr><th>Team</th><th>Points</th><th>Wins</th><th>Losses</th></tr>";
      snapshot.forEach(doc => {
        const s = doc.data();
        html += `<tr><td>${s.participant?.name || "Team"}</td><td>${s.points || 0}</td><td>${s.wins || 0}</td><td>${s.losses || 0}</td></tr>`;
      });
      html += "</table>";
      container.innerHTML = html;
    });

    db.collection("teams").onSnapshot(snapshot => {
      const container = document.getElementById("teams");
      container.innerHTML = "";
      snapshot.forEach(doc => {
        const t = doc.data();
        const div = document.createElement("div");
        div.className = "item";
        div.innerHTML = `<div class="info">${t.name}</div>`;
        container.appendChild(div);
      });
    });

    db.collection("players").onSnapshot(snapshot => {
      const container = document.getElementById("players");
      container.innerHTML = "";
      snapshot.forEach(doc => {
        const p = doc.data();
        const div = document.createElement("div");
        div.className = "item";
        div.innerHTML = `<div class="info">${p.display_name} - ${p.position?.name || "Unknown"}</div>`;
        container.appendChild(div);
      });
    });

    db.collection("odds").onSnapshot(snapshot => {
      const container = document.getElementById("odds");
      container.innerHTML = "";
      snapshot.forEach(doc => {
        const odd = doc.data();
        const div = document.createElement("div");
        div.className = "item";
        div.innerHTML = renderOdds(odd);
        container.appendChild(div);
      });
    });

    // Default view
    showSection('live');
  </script>
</body>
</html>
