<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Betting Platform</title>
  <style>
    body { font-family: Arial, sans-serif; background:#111; color:#eee; margin:0; padding:20px; }
    h1 { text-align:center; }
    .menu { display:flex; justify-content:center; gap:10px; margin-bottom:20px; }
    button { padding:10px 15px; background:#333; color:#eee; border:none; cursor:pointer; }
    button:hover { background:#555; }
    .section { display:none; }
    .item { background:#222; margin:10px 0; padding:15px; border-radius:8px; }
    .teams { font-size:1.2em; font-weight:bold; }
    .info { margin-top:5px; font-size:0.9em; color:#ccc; }
    .countdown { color:#0f0; font-weight:bold; }
  </style>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore.js"></script>
</head>
<body>
  <h1>⚽ Betting Platform</h1>
  <div class="menu">
    <button onclick="showSection('live')">Live</button>
    <button onclick="showSection('upcoming')">Upcoming</button>
    <button onclick="showSection('odds')">Odds</button>
  </div>

  <div id="live" class="section"></div>
  <div id="upcoming" class="section"></div>
  <div id="odds" class="section"></div>

  <script type="module">
    // Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
      authDomain: "x-bet-prod-jd.firebaseapp.com",
      projectId: "x-bet-prod-jd",
      storageBucket: "x-bet-prod-jd.firebasestorage.app",
      messagingSenderId: "499334334535",
      appId: "1:499334334535:web:bebc1bf817e24d9e3c4962",
      measurementId: "G-PTV4XMYQ6P"
    };

    // Init Firebase
    const app = firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore(app);

    function showSection(id) {
      document.querySelectorAll('.section').forEach(sec => sec.style.display = 'none');
      document.getElementById(id).style.display = 'block';
    }

    // Render helpers
    function renderLive(doc) {
      const match = doc.data();
      const home = match.participants?.[0]?.name || "Home";
      const away = match.participants?.[1]?.name || "Away";
      const start = new Date(match.starting_at);
      const now = new Date();
      const elapsed = Math.floor((now - start) / 60000);
      return `
        <div class="teams">${home} vs ${away}</div>
        <div class="info">Date: ${start.toLocaleDateString()} | Time: ${start.toLocaleTimeString()}</div>
        <div class="info">Status: ${match.state?.name || "Unknown"}</div>
        <div class="countdown">Elapsed: ${elapsed} min</div>
      `;
    }

    function renderUpcoming(doc) {
      const match = doc.data();
      const home = match.participants?.[0]?.name || "Home";
      const away = match.participants?.[1]?.name || "Away";
      const start = new Date(match.starting_at);
      const now = new Date();
      const countdown = Math.max(0, Math.floor((start - now) / 60000));
      return `
        <div class="teams">${home} vs ${away}</div>
        <div class="info">Starts in ${countdown} min</div>
      `;
    }

    function renderOdds(doc) {
      const odd = doc.data();
      return `
        <div class="info">Fixture ${odd.fixture_id} - Market: ${odd.market?.name || "Unknown"}</div>
      `;
    }

    // Real-time listeners
    db.collection("games").onSnapshot(snapshot => {
      const container = document.getElementById("live");
      container.innerHTML = "";
      snapshot.forEach(doc => {
        const div = document.createElement("div");
        div.className = "item";
        div.innerHTML = renderLive(doc);
        container.appendChild(div);
      });
    });

    db.collection("fixtures").onSnapshot(snapshot => {
      const container = document.getElementById("upcoming");
      container.innerHTML = "";
      snapshot.forEach(doc => {
        const div = document.createElement("div");
        div.className = "item";
        div.innerHTML = renderUpcoming(doc);
        container.appendChild(div);
      });
    });

    db.collection("odds").onSnapshot(snapshot => {
      const container = document.getElementById("odds");
      container.innerHTML = "";
      snapshot.forEach(doc => {
        const div = document.createElement("div");
        div.className = "item";
        div.innerHTML = renderOdds(doc);
        container.appendChild(div);
      });
    });

    // Default view
    showSection('live');
  </script>
</body>
</html>
