      let minute = match.time?.minute ?? 0;

          else if (ev.type?.name?.toLowerCase().includes("card")) cls += " card";
          else if (ev.type?.name?.toLowerCase().includes("substitution")) cls += " sub";
          eventsHtml += `<div class="${cls}">${ev.minute}' - ${ev.player?.name || "Player"} (${ev.type?.name})</div>`;
        });
        eventsHtml += `</div>`;
      }

      return `
        <div class="teams">${home?.name || "Home"} vs ${away?.name || "Away"}</div>

        <div class="info">Status: ${match.state?.name || "Unknown"}</div>

        <div class="timeline"><div class="progress" style="width:${progressWidth}%"></div></div>
        <div class="minute-label">${minute}'</div>

      `;

      return `

          <div class="info">Fixture ${odd.fixture_id}</div>
          <div class="info">Market: ${odd.market?.name || "Unknown"}</div>
          <div class="info">Bookmaker: ${odd.bookmaker?.name || "N/A"}</div>
        </div>
      `;
    }

    function refreshMatches(snapshot) {
      const liveContainer = document.getElementById("live");
      const finishedContainer = document.getElementById("finished");
      const upcomingContainer = document.getElementById("upcoming");
      liveContainer.innerHTML = "";
      finishedContainer.innerHTML = "";
      upcomingContainer.innerHTML = "";

      snapshot.forEach(doc => {
        const match = doc.data();
        const div = document.createElement("div");
        div.className = "item";
        div.innerHTML = renderMatch(match);

        const state = match.state?.name?.toLowerCase() || "";

          liveContainer.appendChild(div);
        } else if (state.includes("finished") || state.includes("ended") || state.includes("ft")) {
          finishedContainer.appendChild(div);

          upcomingContainer.appendChild(div);
        }
      });

      document.getElementById("lastUpdated").innerText = "Last Updated: " + new Date().toLocaleTimeString();
    }

    let latestSnapshot = null;
