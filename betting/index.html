<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Betting UI - Real API</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #0a0a1a; color: #fff; }
    .header { padding: 16px; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,.4); position: sticky; top: 0; z-index: 100; }
    .logo { font-weight: bold; font-size: 1.4rem; }
    .balance { display: flex; align-items: center; gap: 12px; }
    .balance .amount { font-size: 1.2rem; font-weight: bold; color: #ffd700; }
    .main { max-width: 1200px; margin: 20px auto; padding: 0 12px; }
    .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .btn { border: 1px solid rgba(255,255,255,.3); background: rgba(255,255,255,.08); color: #fff; padding: 8px 12px; border-radius: 999px; cursor: pointer; }
    .btn.active { background: linear-gradient(135deg, #ffd700, #ff6b6b); color: #0a0a1a; border: none; }
    .fixtures { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
    .card { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15); padding: 12px; border-radius: 12px; }
    .league { font-size: 0.85rem; color: #ffd700; margin-bottom: 6px; }
    .teams { text-align: center; font-weight: 700; margin: 6px 0; }
    .kick { font-size: 0.85rem; color: #ccc; }
    .odds { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
    .odd { background: rgba(0,0,0,.25); padding: 8px; border-radius: 8px; text-align: center; cursor: pointer; }
    .odd:hover { transform: translateY(-1px); background: rgba(255,215,0,.25); }
    .bet-slip-toggle { position: fixed; right: 20px; bottom: 20px; width: 60px; height: 60px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; background: linear-gradient(135deg, #ffd700, #ff6b6b); }
    .bet-slip { position: fixed; right: 0; top: 0; width: 420px; height: 100vh; background: rgba(2,2,20,.98); border-left: 1px solid rgba(255,215,0,.3); padding: 16px; overflow-y: auto; transform: translateX(100%); transition: transform .3s ease; }
    .bet-slip.open { transform: translateX(0); }
    .bet-item { background: rgba(255,255,255,.08); padding: 12px; border-radius: 10px; margin-bottom: 12px; }
    .stake { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid rgba(255,255,255,.4); background: rgba(255,255,255,.15); color: #fff; }
    .place { width: 100%; padding: 10px; border-radius: 8px; border: none; background: linear-gradient(135deg, #ffd700, #ff6b6b); color: #0a0a1a; font-weight: bold; cursor: pointer; margin-top: 6px; }
    .toast { position: fixed; left: 20px; bottom: 20px; background: #0f172a; color: #fff; padding: 10px 14px; border-radius: 8px; border-left: 4px solid #ffd700; }
  </style>
</head>
<body>
  <header class="header">
    <div class="logo">BetPlay.Live</div>
    <div class="balance">
      <span>Balance</span>
      <span class="amount" id="balanceAmount">$100.00</span>
      <button class="btn" onclick="addFunds()">Add Funds</button>
    </div>
  </header>

  <main class="main">
    <div class="filters" id="filters">
      <button class="btn active" data-filter="all" onclick="setFilter(event)">All</button>
      <!-- You can add more filters (league, sport) later -->
    </div>

    <section class="fixtures" id="fixtures">
      <!-- Matches render here -->
    </section>

  </main>

  <div class="bet-slip-toggle" id="betSlipToggle" title="Open bet slip" onclick="toggleBetSlip()">💼</div>

  <aside class="bet-slip" id="betSlip" aria-label="bet-slip">
    <h3>Your Bet Slip</h3>
    <div id="betItems"></div>
    <div style="margin-top:8px;">
      <label>Stake ($)</label>
      <input class="stake" id="stakeInput" type="number" min="1" step="1" value="10" />
    </div>
    <button class="place" id="placeBetBtn" onclick="placeBet()">Place Bet</button>
  </aside>

  <div id="toast" class="toast" style="display:none;"></div>

  <script>
    // Replace these placeholders with your real values
    const BASE_URL = "DkFdWG9jFZvH8XSEgLrRfGwczABWVg5rlV25GvIRyN06zdPsOI48Nsv9Wooy"; // e.g., https://api.yourdomain.com/v1
    const API_KEY = "DkFdWG9jFZvH8XSEgLrRfGwczABWVg5rlV25GvIRyN06zdPsOI48Nsv9Wooy";   // if your API uses a Bearer token
    const USE_KEY = API_KEY && API_KEY !== "DkFdWG9jFZvH8XSEgLrRfGwczABWVg5rlV25GvIRyN06zdPsOI48Nsv9Wooy";

    // If you want to try without auth, set USE_AUTH = false
    const USE_AUTH = USE_KEY;

    // Simple in-memory data for UI state
    let balance = 100.0;
    let betSlip = [];
    let currentFilter = 'all';
    const balanceAmountEl = document.getElementById('balanceAmount');
    const fixturesEl = document.getElementById('fixtures');
    const betSlipEl = document.getElementById('betSlip');
    const betSlipToggleEl = document.getElementById('betSlipToggle');
    const betItemsEl = document.getElementById('betItems');
    const stakeInput = document.getElementById('stakeInput');
    const placeBetBtn = document.getElementById('placeBetBtn');
    const toastEl = document.getElementById('toast');

    function renderBalance() {
      balanceAmountEl.textContent = `$${balance.toFixed(2)}`;
    }

    function showToast(msg, ms = 1800) {
      toastEl.textContent = msg;
      toastEl.style.display = 'block';
      setTimeout(() => { toastEl.style.display = 'none'; }, ms);
    }

    function toggleBetSlip() {
      betSlipEl.classList.toggle('open');
    }

    function updateBetCount() {
      // simple: show count on cardless UI if needed
    }

    function renderBetSlip() {
      betItemsEl.innerHTML = '';
      if (betSlip.length === 0) {
        betItemsEl.innerHTML = '<div class="bet-item" style="opacity:.8;">Your bet slip is empty.</div>';
        return;
      }
      betSlip.forEach((b, idx) => {
        const div = document.createElement('div');
        div.className = 'bet-item';
        div.innerHTML = `
          <div><strong>${b.match.home} vs ${b.match.away}</strong> • ${b.match.league}</div>
          <div>Bet: ${b.choice} at odds ${b.odds.home} / ${b.odds.draw} / ${b.odds.away}</div>
          <div>Stake: $${b.stake.toFixed(2)}  Potential: $${(b.stake * b.multiplier).toFixed(2)}</div>
          <button onclick="removeBet(${idx})" class="btn" style="margin-top:6px;">Remove</button>
        `;
        betItemsEl.appendChild(div);
      });
    }

    function addFunds() {
      const amount = parseFloat(prompt('Add funds (e.g., 50):', '50')) || 50;
      balance += amount;
      renderBalance();
      showToast(`Funds added: $${amount.toFixed(2)}`);
    }

    function removeBet(index) {
      betSlip.splice(index, 1);
      renderBetSlip();
    }

    async function fetchMatches() {
      // Primary data fetch
      const url = `${BASE_URL}/matches`;
      const headers = USE_AUTH ? { 'Authorization': `Bearer ${API_KEY}` } : {};
      try {
        const resp = await fetch(url, { headers });
        if (!resp.ok) throw new Error(`Network: ${resp.status}`);
        const data = await resp.json();

        // Normalize: support both shapes
        // Shape A: data.matches = [ { id, league, home, away, kickoff, status, odds: { home, draw, away } }, ... ]
        // Shape B: data = [ ...matches ... ] or { matches: [...] }
        const matches = Array.isArray(data) ? data : data.matches ?? [];
        // Sometimes odds may be inline; if not, fetch per-match odds
        for (const m of matches) {
          if (!m.odds && USE_AUTH) {
            // Try to fetch per-match odds if endpoint exists
            try {
              const odUrl = `${BASE_URL}/matches/${m.id}/odds`;
              const odResp = await fetch(odUrl, { headers });
              if (odResp.ok) {
                const od = await odResp.json();
                m.odds = od.odds ?? od;
              }
            } catch (e) {
              // ignore, we'll render with whatever we have
            }
          }
        }
        renderFixtures(matches);
      } catch (err) {
        console.error(err);
        fixturesEl.innerHTML = '<div class="card" style="opacity:.8;">Failed to load matches. Check API URL and CORS.</div>';
      }
    }

    function renderFixtures(matches) {
      fixturesEl.innerHTML = '';
      const list = matches.filter(m => currentFilter === 'all' || (m.league && m.league.toLowerCase().includes(currentFilter)));
      if (list.length === 0) {
        fixturesEl.innerHTML = '<div class="card" style="opacity:.8;">No matches available</div>';
        return;
      }
      list.forEach(m => {
        const card = document.createElement('div');
        card.className = 'card';
        const odds = m.odds || { home: null, draw: null, away: null };
        const kickoff = m.kickoff ? new Date(m.kickoff).toUTCString() : '';
        card.innerHTML = `
          <div class="league">${m.league ?? 'Unknown League'}</div>
          <div class="teams">${m.home ?? 'Team A'} vs ${m.away ?? 'Team B'}</div>
          <div class="kick">${kickoff}</div>
          <div class="odds">
            <div class="odd" onclick="placeBetFromMatch('${m.id}', 'home')">
              Home ${odds.home ?? ''}<br><small>Home odds</small>
            </div>
            <div class="odd" onclick="placeBetFromMatch('${m.id}', 'draw')">
              Draw ${odds.draw ?? ''}<br><small>Draw odds</small>
            </div>
            <div class="odd" onclick="placeBetFromMatch('${m.id}', 'away')">
              Away ${odds.away ?? ''}<br><small>Away odds</small>
            </div>
          </div>
        `;
        fixturesEl.appendChild(card);
      });
    }

    // Helpers for placing bets directly from a match card
    async function getOddsForMatch(match) {
      if (match.odds) return match.odds;
      try {
        const url = `${BASE_URL}/matches/${match.id}/odds`;
        const headers = USE_AUTH ? { 'Authorization': `Bearer ${API_KEY}` } : {};
        const resp = await fetch(url, { headers });
        if (!resp.ok) return null;
        const od = await resp.json();
        return od.odds ?? od;
      } catch {
        return null;
      }
    }

    // Place bet from a match id and chosen outcome
    async function placeBetFromMatch(matchId, chosen) {
      // fetch the match to get details
      // Try to locate match in current DOM data (best-effort)
      let match = null;
      // In a real app, you’d keep a local cache. Here we try a lightweight approach:
      // You can extend this to cache matches when you fetch them.
      // For simplicity, we’ll fetch the match by id if your API supports /matches/{id}
      try {
        const url = `${BASE_URL}/matches/${matchId}`;
        const headers = USE_AUTH ? { 'Authorization': `Bearer ${API_KEY}` } : {};
        const resp = await fetch(url, { headers });
        if (resp.ok) {
          match = await resp.json();
        }
      } catch { /* ignore */ }

      if (!match) {
        showToast('Match data not available');
        return;
      }

      const odds = await getOddsForMatch(match) || match.odds || { home: null, draw: null, away: null };
      const multiplier = chosen === 'home' ? odds.home : chosen === 'draw' ? odds.draw : odds.away;
      const stake = parseFloat(stakeInput.value) || 10;
      if (balance < stake) {
        showToast('Insufficient balance');
        return;
      }

      betSlip.push({
        match,
        choice: chosen,
        odds,
        multiplier,
        stake
      });
      renderBetSlip();
      showToast('Added bet to slip');
      toggleBetSlip();
    }

    function placeBet() {
      if (betSlip.length === 0) return;
      const totalStake = betSlip.reduce((s, b) => s + b.stake, 0);
      if (totalStake > balance) {
        showToast('Insufficient balance');
        return;
      }
      balance -= totalStake;
      renderBalance();
      betSlip = [];
      renderBetSlip();
      showToast('Bet placed! Good luck.');
      toggleBetSlip();
    }

    // Filtering
    function setFilter(e) {
      const btns = document.querySelectorAll('.filters .btn');
      btns.forEach(b => b.classList.remove('active'));
      e.currentTarget.classList.add('active');
      currentFilter = e.currentTarget.dataset.filter;
      // Re-render matches if you keep a cache; here we simply re-fetch
      fetchMatches();
    }

    // Init
    function bootstrap() {
      renderBalance();
      // Load matches from API
      fetchMatches();
      // Hook up initial UI
      betSlipToggleEl.style.display = 'grid';
    }
    window.addEventListener('DOMContentLoaded', bootstrap);
  </script>
</body>
</html>
