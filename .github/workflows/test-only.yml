name: Test Betting Platform

on:
  workflow_dispatch:  # Manual trigger only
  push:
    paths:
      - 'server.js'
      - 'package.json'
      - 'betting/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Test Sportmonks API
        env:
          API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
        run: |
          echo "Testing API with token: ${#API_TOKEN} chars"
          curl -I "https://api.sportmonks.com/v3/football/livescores?api_token=$API_TOKEN"
      
      - name: Test server startup
        run: |
          timeout 5 node server.js & 
          sleep 2
          kill %1 || true
          echo "✅ Server starts successfully"
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            *.log
            test-output.txt
