name: Test Sportmonks API

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  test-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Test Sportmonks API
        env:
          API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
        run: |
          echo "Testing Sportmonks API..."
          echo "Token exists: ${#API_TOKEN} characters"
          
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            "https://api.sportmonks.com/v3/football/livescores?api_token=$API_TOKEN&per_page=3")
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          
          if [ $HTTP_CODE -eq 200 ]; then
            echo "✅ API Success! (HTTP $HTTP_CODE)"
            echo "$RESPONSE" | head -c 300
          else
            echo "❌ API Failed (HTTP $HTTP_CODE)"
            exit 1
          fi
