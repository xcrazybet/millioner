name: Test Sportmonks API Connection

on:
  workflow_dispatch:  # Add this line!
  push:
    branches: [ main, master ]

jobs:
  test-api:
    runs-on: ubuntu-latest
    steps:
      - name: Test API Connection
        env:
          API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
        run: |
          echo "Testing API..."
          curl -X GET "https://api.sportmonks.com/v3/football/livescores?api_token=$API_TOKEN&per_page=5"
