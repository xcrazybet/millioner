name: Test Betting Platform API

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  test-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm install
      
      - name: Test API endpoints
        env:
          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
        run: |
          echo "Testing Sportmonks API connection..."
          curl -s "https://api.sportmonks.com/v3/football/livescores?api_token=$SPORTMONKS_API_TOKEN&per_page=3" | head -c 200
          echo ""
          echo "✅ API test complete"
      
      - name: Check server.js syntax
        run: node -c server.js
      
      - name: Validate package.json
        run: npm run test --if-present || echo "No tests defined"
