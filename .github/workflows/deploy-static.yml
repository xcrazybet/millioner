name: Deploy Static Betting Platform to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Prepare static files
        run: |
          # Create a dist folder for GitHub Pages
          mkdir -p dist
          
          # Copy your betting HTML files
          cp -r betting/* dist/ 2>/dev/null || true
          cp -r node-html/*.html dist/ 2>/dev/null || true
          
          # Create a simple static version
          echo '<html><body><h1>Betting Platform</h1><p>Static version</p></body></html>' > dist/index.html
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
