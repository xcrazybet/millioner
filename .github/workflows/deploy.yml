name: Deploy Worker to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-worker.js'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to Cloudflare Workers
        run: |
          curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_ID }}/workers/scripts/muddy-wildflower-a70d" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/javascript" \
            --data-binary "@cloudflare-worker.js" | tee /dev/stderr | grep -q '"success":true' && echo "✅ Deploy successful!" || echo "❌ Deploy failed"
