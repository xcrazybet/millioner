<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎲 Royal Risk - XCrazyBet</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- Howler.js for Audio -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-functions-compat.js"></script>

    <style>
        :root {
            --royal-gold: #D4AF37;
            --royal-burgundy: #800020;
            --midnight-blue: #0A0F2D;
            --royal-silver: #C0C0C0;
            --win-glow: #FFD700;
            --lose-glow: #8B0000;
            --success: #00ff9d;
            --danger: #ff5252;
            --warning: #ff9800;
            --text: #ffffff;
            --text-dim: #a0a8c9;
            --surface: rgba(17, 24, 39, 0.95);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Segoe UI', 'Roboto', system-ui, -apple-system, sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--midnight-blue);
            color: var(--text);
        }

        /* Background Effects */
        .royal-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: 
                radial-gradient(circle at 20% 30%, rgba(212, 175, 55, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(128, 0, 32, 0.15) 0%, transparent 50%),
                linear-gradient(135deg, #000814 0%, var(--midnight-blue) 100%);
        }

        /* Game Container - Full Screen */
        .game-container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Top Banner */
        .top-banner {
            background: linear-gradient(90deg, rgba(212, 175, 55, 0.9), rgba(128, 0, 32, 0.9));
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--royal-gold);
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .royal-logo {
            font-size: 22px;
            font-weight: 800;
            color: var(--royal-gold);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .balance-display {
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 25px;
            border: 2px solid var(--royal-gold);
            color: var(--royal-gold);
            font-weight: 700;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Result Display */
        .result-display {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1001;
            background: rgba(0, 0, 0, 0.9);
            padding: 15px 40px;
            border-radius: 15px;
            border: 3px solid var(--royal-gold);
            font-size: 24px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.5s;
            backdrop-filter: blur(10px);
        }

        .result-display.show {
            opacity: 1;
            visibility: visible;
            animation: bannerPulse 0.5s ease-out;
        }

        .result-display.win {
            border-color: var(--win-glow);
            color: var(--win-glow);
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.5);
        }

        .result-display.lose {
            border-color: var(--lose-glow);
            color: var(--lose-glow);
            box-shadow: 0 0 40px rgba(139, 0, 0, 0.5);
        }

        /* 3D Game Area */
        .game-area {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        #royal-scene {
            width: 100%;
            height: 100%;
        }

        /* Stage Indicators */
        .stage-indicators {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            gap: 15px;
            z-index: 100;
        }

        .stage {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid var(--royal-silver);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
            color: var(--royal-silver);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .stage.active {
            border-color: var(--royal-gold);
            color: var(--royal-gold);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
            transform: scale(1.1);
        }

        .stage.completed {
            background: linear-gradient(135deg, var(--royal-gold), #FFD700);
            color: #000;
            border-color: #FFD700;
        }

        .stage.lost {
            background: linear-gradient(135deg, var(--lose-glow), #ff0000);
            color: #fff;
            border-color: #ff0000;
        }

        .stage::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, transparent 30%, rgba(255, 255, 255, 0.1) 50%, transparent 70%);
            top: 0;
            left: -100%;
            transition: left 0.5s;
        }

        .stage.active::after {
            left: 100%;
        }

        /* Multiplier Display */
        .multiplier-display {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 25px;
            border-radius: 15px;
            border: 2px solid var(--royal-gold);
            text-align: center;
            min-width: 150px;
        }

        .multiplier-label {
            font-size: 12px;
            color: var(--text-dim);
            margin-bottom: 5px;
        }

        .multiplier-value {
            font-size: 32px;
            font-weight: 800;
            color: var(--royal-gold);
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        /* Control Panel */
        .control-panel {
            background: linear-gradient(180deg, rgba(10, 15, 45, 0.95), rgba(5, 10, 30, 0.98));
            padding: 20px;
            border-top: 3px solid var(--royal-gold);
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        /* Bet Controls */
        .bet-controls {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 20px;
            margin-bottom: 20px;
        }

        .bet-input-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .bet-input {
            flex: 1;
            padding: 18px 20px;
            background: rgba(0, 0, 0, 0.7);
            border: 3px solid var(--royal-gold);
            border-radius: 15px;
            color: var(--royal-gold);
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            transition: all 0.3s;
        }

        .bet-input:focus {
            outline: none;
            border-color: var(--win-glow);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        .bet-currency {
            color: var(--royal-gold);
            font-size: 24px;
            font-weight: 700;
            min-width: 40px;
        }

        /* Quick Bets */
        .quick-bets {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .quick-bet {
            padding: 12px 8px;
            background: rgba(212, 175, 55, 0.1);
            border: 2px solid var(--royal-gold);
            border-radius: 10px;
            color: var(--royal-gold);
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }

        .quick-bet:hover {
            background: var(--royal-gold);
            color: #000;
            transform: translateY(-2px);
        }

        /* Action Buttons */
        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 18px;
            border: none;
            border-radius: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--royal-gold), #B8860B);
            color: #000;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(212, 175, 55, 0.4);
        }

        .btn-secondary {
            background: linear-gradient(135deg, var(--royal-silver), #808080);
            color: #000;
        }

        .btn-secondary:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(192, 192, 192, 0.4);
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--lose-glow), #ff0000);
            color: #fff;
        }

        .btn-danger:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(139, 0, 0, 0.4);
        }

        /* Countdown Timer */
        .countdown-timer {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1002;
            font-size: 120px;
            font-weight: 900;
            color: var(--royal-gold);
            text-shadow: 
                0 0 30px rgba(212, 175, 55, 0.8),
                0 0 60px rgba(212, 175, 55, 0.6);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .countdown-timer.show {
            opacity: 1;
            visibility: visible;
            animation: countdownPulse 0.5s ease-out;
        }

        /* Cash Out Button */
        .cash-out-btn {
            position: absolute;
            bottom: 200px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1001;
            background: linear-gradient(135deg, #4CAF50, #2E7D32);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 20px 50px;
            font-size: 24px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 15px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(76, 175, 80, 0.3);
        }

        .cash-out-btn.show {
            opacity: 1;
            visibility: visible;
            animation: cashOutPulse 2s infinite;
        }

        .cash-out-btn:hover {
            transform: translateX(-50%) scale(1.05);
            box-shadow: 0 15px 40px rgba(76, 175, 80, 0.5);
        }

        /* Recent Winners */
        .recent-winners {
            background: rgba(0, 0, 0, 0.8);
            border-top: 2px solid var(--royal-gold);
            padding: 15px;
            max-height: 120px;
            overflow-y: auto;
        }

        .winners-title {
            color: var(--royal-gold);
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .winners-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .winner-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: rgba(212, 175, 55, 0.1);
            border-radius: 8px;
            font-size: 13px;
            animation: slideInRight 0.3s ease-out;
        }

        .winner-name {
            color: var(--royal-gold);
            font-weight: 600;
        }

        .winner-amount {
            color: var(--success);
            font-weight: 700;
        }

        /* Game History */
        .game-history {
            position: absolute;
            bottom: 120px;
            left: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.9);
            border-radius: 15px;
            padding: 15px;
            border: 2px solid var(--royal-gold);
            z-index: 1001;
            max-height: 200px;
            overflow-y: auto;
            display: none;
            backdrop-filter: blur(10px);
        }

        .game-history.show {
            display: block;
            animation: slideUp 0.3s ease-out;
        }

        .history-title {
            color: var(--royal-gold);
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .history-item {
            display: grid;
            grid-template-columns: 50px 1fr 1fr 80px;
            gap: 10px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            font-size: 12px;
            align-items: center;
        }

        .history-time {
            color: var(--text-dim);
        }

        .history-bet {
            color: var(--royal-gold);
        }

        .history-stage {
            color: var(--royal-silver);
        }

        .history-result {
            font-weight: 700;
            text-align: right;
        }

        .history-result.win {
            color: var(--success);
        }

        .history-result.lose {
            color: var(--danger);
        }

        /* Return to Games Button */
        .return-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1003;
            background: linear-gradient(135deg, var(--royal-gold), var(--royal-burgundy));
            color: white;
            border: none;
            border-radius: 50px;
            padding: 20px 40px;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 15px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
            text-decoration: none;
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.4);
        }

        .return-button.show {
            opacity: 1;
            visibility: visible;
            animation: buttonPulse 2s infinite;
        }

        /* Particle Overlay */
        .particle-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Animations */
        @keyframes bannerPulse {
            0% { transform: translateX(-50%) scale(0.8); opacity: 0; }
            70% { transform: translateX(-50%) scale(1.05); }
            100% { transform: translateX(-50%) scale(1); opacity: 1; }
        }

        @keyframes countdownPulse {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.2); }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        @keyframes cashOutPulse {
            0%, 100% { box-shadow: 0 10px 30px rgba(76, 175, 80, 0.3); }
            50% { box-shadow: 0 10px 40px rgba(76, 175, 80, 0.6); }
        }

        @keyframes buttonPulse {
            0%, 100% { box-shadow: 0 10px 30px rgba(212, 175, 55, 0.4); }
            50% { box-shadow: 0 10px 40px rgba(212, 175, 55, 0.7); }
        }

        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes goldRain {
            0% { transform: translateY(-100px) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }

        @keyframes redFlash {
            0%, 100% { background-color: transparent; }
            50% { background-color: rgba(139, 0, 0, 0.3); }
        }

        /* Shake Animation */
        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .top-banner {
                padding: 10px 15px;
            }

            .royal-logo {
                font-size: 18px;
            }

            .balance-display {
                padding: 8px 15px;
                font-size: 16px;
            }

            .stage {
                width: 40px;
                height: 40px;
                font-size: 16px;
            }

            .multiplier-display {
                padding: 10px 15px;
                min-width: 120px;
            }

            .multiplier-value {
                font-size: 24px;
            }

            .bet-controls {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .quick-bets {
                grid-template-columns: repeat(3, 1fr);
            }

            .action-buttons {
                grid-template-columns: 1fr;
            }

            .btn {
                padding: 16px;
                font-size: 16px;
            }

            .countdown-timer {
                font-size: 80px;
            }

            .cash-out-btn {
                padding: 15px 30px;
                font-size: 20px;
                bottom: 180px;
            }

            .history-item {
                grid-template-columns: 40px 1fr 1fr 70px;
                font-size: 11px;
            }
        }

        @media (max-width: 480px) {
            .stage {
                width: 35px;
                height: 35px;
                font-size: 14px;
            }

            .quick-bets {
                grid-template-columns: repeat(2, 1fr);
            }

            .countdown-timer {
                font-size: 60px;
            }

            .cash-out-btn {
                padding: 12px 24px;
                font-size: 18px;
                bottom: 160px;
            }

            .return-button {
                padding: 15px 30px;
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <!-- Background Effects -->
    <div class="royal-bg"></div>

    <!-- Game Container -->
    <div class="game-container">
        
        <!-- Top Banner -->
        <div class="top-banner">
            <div class="logo-area">
                <a href="https://xcrazybet.github.io/millioner/games.html" style="color: inherit; text-decoration: none;">
                    <div class="royal-logo">
                        <i class="fas fa-crown"></i>
                        ROYAL RISK
                    </div>
                </a>
            </div>
            
            <div class="balance-display">
                <i class="fas fa-coins"></i>
                $<span id="balance-val">0.00</span>
            </div>
        </div>

        <!-- Result Display -->
        <div class="result-display" id="result-display">
            <span id="result-text">YOU WIN!</span>
        </div>

        <!-- 3D Game Area -->
        <div class="game-area">
            <div id="royal-scene"></div>
            
            <!-- Stage Indicators -->
            <div class="stage-indicators" id="stage-indicators">
                <div class="stage" data-stage="1">
                    <i class="fas fa-gate"></i>
                </div>
                <div class="stage" data-stage="2">
                    <i class="fas fa-shield-alt"></i>
                </div>
                <div class="stage" data-stage="3">
                    <i class="fas fa-chair"></i>
                </div>
                <div class="stage" data-stage="4">
                    <i class="fas fa-crown"></i>
                </div>
            </div>

            <!-- Multiplier Display -->
            <div class="multiplier-display">
                <div class="multiplier-label">MULTIPLIER</div>
                <div class="multiplier-value" id="multiplier-value">1.0x</div>
            </div>

            <!-- Countdown Timer -->
            <div class="countdown-timer" id="countdown-timer">5</div>

            <!-- Cash Out Button -->
            <button class="cash-out-btn" id="cash-out-btn">
                <i class="fas fa-money-bill-wave"></i>
                CASH OUT: $<span id="cash-out-amount">0.00</span>
            </button>

            <!-- Return to Games Button -->
            <a href="https://xcrazybet.github.io/millioner/games.html" class="return-button" id="return-button">
                <i class="fas fa-gamepad"></i>
                RETURN TO GAMES
            </a>

            <!-- Particle Overlay -->
            <div class="particle-overlay" id="particle-overlay"></div>
        </div>

        <!-- Control Panel -->
        <div class="control-panel">
            <!-- Bet Controls -->
            <div class="bet-controls">
                <div class="bet-input-group">
                    <input type="number" class="bet-input" id="bet-amount" value="5" min="1" max="1000" step="1">
                    <div class="bet-currency">$</div>
                </div>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <div style="color: var(--royal-silver); font-size: 14px;">Max:</div>
                    <div style="color: var(--royal-gold); font-size: 20px; font-weight: 700;">$1000</div>
                </div>
            </div>

            <!-- Quick Bets -->
            <div class="quick-bets">
                <div class="quick-bet" data-amount="1">$1</div>
                <div class="quick-bet" data-amount="5">$5</div>
                <div class="quick-bet" data-amount="10">$10</div>
                <div class="quick-bet" data-amount="25">$25</div>
                <div class="quick-bet" data-amount="50">$50</div>
            </div>

            <!-- Action Buttons -->
            <div class="action-buttons">
                <button id="play-btn" class="btn btn-primary">
                    <i class="fas fa-play"></i> PLACE BET
                </button>
                <button id="history-btn" class="btn btn-secondary">
                    <i class="fas fa-history"></i> HISTORY
                </button>
            </div>

            <!-- Recent Winners -->
            <div class="recent-winners">
                <div class="winners-title">
                    <i class="fas fa-trophy"></i>
                    RECENT WINNERS
                </div>
                <div class="winners-list" id="winners-list">
                    <!-- Winners will be loaded here -->
                </div>
            </div>
        </div>

        <!-- Game History Panel -->

        function createParticles(position) {

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.style.cssText = `

                    height: 8px;
                    background: radial-gradient(circle, #FFD700, #D4AF37);

                // Calculate screen position

                const screenY = (position.y + 5) * (window.innerHeight / 10);
                
                particle.style.left = `${screenX}px`;
                particle.style.top = `${screenY}px`;
                
                overlay.appendChild(particle);
                
                // Animate particle
                const angle = Math.random() * Math.PI * 2;
                const velocity = 2 + Math.random() * 3;
                const duration = 1000 + Math.random() * 500;
                
                const startX = screenX;
                const startY = screenY;
                const endX = startX + Math.cos(angle) * velocity * 100;
                const endY = startY + Math.sin(angle) * velocity * 100;
                
                const animation = particle.animate([
                    {
                        transform: 'translate(0, 0) scale(1)',
                        opacity: 1
                    },
                    {
                        transform: `translate(${endX - startX}px, ${endY - startY}px) scale(0)`,
                        opacity: 0
                    }
                ], {
                    duration: duration,
                    easing: 'cubic-bezier(0.215, 0.610, 0.355, 1)'
                });
                
                animation.onfinish = () => particle.remove();
            }
        }

        // ===== SECURE GAME SESSION MANAGEMENT =====
        async function createGameSession(betAmount) {
            try {
                // Generate seeds for provably fair system
                const clientSeed = generateRandomSeed();

                    serverSeed: serverSeed,

                    userId: gameState.currentUser.uid,

                    createdAt: new Date(),
                    stagesReached: 0,

                });

        async function generateServerSeed() {
            // In production, this should be a Cloud Function
            // For now, we'll simulate it
            return `server_${Date.now()}_${Math.random().toString(36).substr(2, 16)}`;
        }

        function generateRandomSeed() {
            return `client_${Date.now()}_${Math.random().toString(36).substr(2, 16)}`;
        }

        function hashSeed(seed) {
            // Simple hash for demonstration
            let hash = 0;
            for (let i = 0; i < seed.length; i++) {
                const char = seed.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash;
            }
            return hash.toString(16);
        }

        // ===== PROBABILITY SYSTEM (10-15% WIN RATE) =====
        function calculateStageResult(stage) {
            const probability = gameState.stageProbabilities[stage - 1];
            
            // Combine seeds for deterministic randomness
            const combinedSeed = gameState.sessionData.serverSeed + gameState.sessionData.clientSeed + stage;
            const randomValue = seededRandom(combinedSeed);
            
            return randomValue <= probability;
        }

        function seededRandom(seed) {
            let hash = 0;
            for (let i = 0; i < seed.length; i++) {
                hash = ((hash << 5) - hash) + seed.charCodeAt(i);
                hash |= 0;
            }
            return (Math.abs(hash) % 10000) / 10000;
        }

        // ===== GAME FLOW CONTROL =====
        async function startGame() {
            const betAmount = parseFloat(document.getElementById('bet-amount').value);
            
            // Validation
            if (betAmount < 1 || betAmount > Math.min(gameState.balance, 1000)) {
                showToast('Invalid bet amount', 'error');
                return;
            }
            
            if (gameState.isPlaying) {
                showToast('Game already in progress', 'warning');
                return;
            }
            
            if (gameState.balance < betAmount) {
                showToast('Insufficient balance', 'error');
                return;
            }
            
            // Lock bet and create session
            const sessionCreated = await createGameSession(betAmount);
            if (!sessionCreated) {
                showToast('Failed to start game', 'error');
                return;
            }
            
            // Deduct bet from balance
            await processTransaction(-betAmount, 'royalrisk_bet', `Royal Risk bet of $${betAmount}`);
            
            // Start game
            gameState.betAmount = betAmount;
            gameState.isPlaying = true;
            gameState.currentStage = 0;
            gameState.currentGame = {
                bet: betAmount,
                stagesReached: 0,
                multiplier: 1.0,
                payout: 0,
                win: false,
                cashedOut: false

                    // Start game stages
                    startNextStage();

        async function startNextStage() {
            if (!gameState.isPlaying) return;
            
            gameState.currentStage++;
            
            // Update stage indicators
            updateStageIndicators();
            
            // Update multiplier
            const multiplier = gameState.multipliers[gameState.currentStage - 1] || 1.0;
            document.getElementById('multiplier-value').textContent = `${multiplier.toFixed(1)}x`;
            gameState.currentGame.multiplier = multiplier;
            
            // Update cash out amount
            const cashOutAmount = gameState.betAmount * multiplier;
            document.getElementById('cash-out-amount').textContent = cashOutAmount.toFixed(2);
            
            // Show cash out button after first stage
            if (gameState.currentStage > 1) {
                document.getElementById('cash-out-btn').classList.add('show');
                gameState.cashOutAvailable = true;
            }
            
            // Update 3D visuals
            updateStageVisuals(gameState.currentStage);
            
            // Wait for dramatic effect
            await new Promise(resolve => setTimeout(resolve, 1500));
            
            // Calculate stage result
            const stageResult = calculateStageResult(gameState.currentStage);
            
            if (stageResult) {
                // Stage passed
                gameState.audio.stagePass.play();
                gameState.currentGame.stagesReached = gameState.currentStage;
                
                if (gameState.currentStage === gameState.maxStages) {
                    // Reached final stage - WIN
                    await completeGame(true);
                } else {
                    // Continue to next stage
                    setTimeout(startNextStage, 1000);
                }
            } else {
                // Stage failed - LOSE
                gameState.audio.lose.play();
                await completeGame(false);
            }
        }

        async function cashOut() {
            if (!gameState.isPlaying || !gameState.cashOutAvailable) return;
            
            gameState.audio.cashOut.play();
            gameState.currentGame.cashedOut = true;
            gameState.currentGame.win = true;
            gameState.currentGame.payout = gameState.betAmount * gameState.currentGame.multiplier;
            
            await completeGame(true, true);
        }

        async function completeGame(win, cashedOut = false) {
            gameState.isPlaying = false;
            gameState.cashOutAvailable = false;
            
            // Hide cash out button
            document.getElementById('cash-out-btn').classList.remove('show');
            
            // Update game result
            gameState.currentGame.win = win;
            if (win) {
                if (!cashedOut) {
                    // Full win - reached final stage
                    gameState.currentGame.payout = gameState.betAmount * gameState.multipliers[gameState.maxStages - 1];
                }
                
                // Add bonus for full completion
                if (!cashedOut && gameState.currentStage === gameState.maxStages) {
                    gameState.currentGame.payout *= 1.2; // 20% bonus
                    gameState.audio.royalFanfare.play();
                    createGoldRain();
                }
            } else {
                gameState.currentGame.payout = 0;
            }
            
            // Show result banner
            const resultDisplay = document.getElementById('result-display');
            const resultText = document.getElementById('result-text');
            
            if (win) {
                resultDisplay.className = 'result-display show win';
                resultText.textContent = cashedOut ? 'CASHED OUT!' : 'ROYAL VICTORY!';
                
                // Play win sound
                gameState.audio.win.play();
                
                // Process win transaction
                if (gameState.currentGame.payout > 0) {
                    await processTransaction(
                        gameState.currentGame.payout,
                        'royalrisk_win',
                        `Royal Risk win of $${gameState.currentGame.payout.toFixed(2)}`
                    );
                }
            } else {
                resultDisplay.className = 'result-display show lose';
                resultText.textContent = 'ROYAL DEFEAT';
                
                // Play lose sound and shake screen
                gameState.audio.lose.play();
                document.querySelector('.game-area').classList.add('shake');
                setTimeout(() => {
                    document.querySelector('.game-area').classList.remove('shake');
                }, 500);
            }
            
            // Update stage indicators with result
            updateStageIndicators(win);
            
            // Add to game history
            addGameHistory();
            
            // Show return button after delay
            setTimeout(() => {
                document.getElementById('return-button').classList.add('show');
            }, 3000);
            
            // Reset UI
            document.getElementById('play-btn').disabled = false;
            document.getElementById('play-btn').innerHTML = '<i class="fas fa-play"></i> PLACE BET';
            
            // Update session record
            await updateGameSession();
        }

        function updateStageIndicators(win = null) {
            const stages = document.querySelectorAll('.stage');
            
            stages.forEach((stage, index) => {
                stage.classList.remove('active', 'completed', 'lost');
                
                if (index < gameState.currentStage) {
                    if (win === null) {
                        // Game in progress
                        if (index === gameState.currentStage - 1) {
                            stage.classList.add('active');
                        } else {
                            stage.classList.add('completed');
                        }
                    } else {
                        // Game finished
                        if (win) {
                            stage.classList.add('completed');
                        } else {
                            if (index === gameState.currentStage - 1) {
                                stage.classList.add('lost');
                            } else if (index < gameState.currentStage - 1) {
                                stage.classList.add('completed');
                            }
                        }
                    }
                }
            });
        }

        async function updateGameSession() {
            try {
                await db.collection("royalRiskSessions").doc(gameState.gameId).update({
                    status: 'completed',
                    stagesReached: gameState.currentGame.stagesReached,
                    result: gameState.currentGame.win ? 'win' : 'lose',
                    payout: gameState.currentGame.payout,
                    multiplier: gameState.currentGame.multiplier,
                    cashedOut: gameState.currentGame.cashedOut,
                    completedAt: new Date()
                });
            } catch (error) {
                console.error('Error updating game session:', error);
            }
        }

        // ===== TRANSACTION SYSTEM =====
        async function processTransaction(amount, type, description) {
            try {
                const walletRef = db.collection("wallets").doc(gameState.currentUser.uid);
                
                // Use transaction for atomic update
                await db.runTransaction(async (transaction) => {
                    const walletDoc = await transaction.get(walletRef);
                    
                    if (!walletDoc.exists) {
                        throw new Error("Wallet not found");
                    }
                    
                    const currentBalance = walletDoc.data().balance || 0;
                    const newBalance = currentBalance + amount;
                    
                    if (newBalance < 0) {
                        throw new Error("Insufficient funds");
                    }
                    
                    // Update wallet
                    transaction.update(walletRef, {
                        balance: newBalance,
                        updatedAt: new Date()
                    });
                    
                    // Create transaction record
                    const transactionRef = db.collection("transactions").doc();
                    transaction.set(transactionRef, {
                        userId: gameState.currentUser.uid,
                        type: type,
                        amount: amount,
                        description: description,
                        gameId: gameState.gameId,
                        beforeBalance: currentBalance,
                        afterBalance: newBalance,
                        createdAt: new Date(),
                        status: 'completed'
                    });
                    
                    // Update local balance
                    gameState.balance = newBalance;
                    updateBalanceDisplay();
                    
                    return { success: true, newBalance };
                });
            } catch (error) {
                console.error('Transaction failed:', error);
                showToast('Transaction failed: ' + error.message, 'error');
                return { success: false, error: error.message };
            }
        }

        // ===== GAME HISTORY =====
        function addGameHistory() {
            const historyItem = {
                time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                bet: gameState.currentGame.bet,
                stage: gameState.currentGame.stagesReached,
                result: gameState.currentGame.win ? 'WIN' : 'LOSE',
                amount: gameState.currentGame.win ? gameState.currentGame.payout : -gameState.currentGame.bet,
                multiplier: gameState.currentGame.multiplier.toFixed(1)
            };
            
            gameState.gameHistory.unshift(historyItem);
            if (gameState.gameHistory.length > 20) {
                gameState.gameHistory.pop();
            }
            
            updateHistoryDisplay();
            saveGameHistory();
        }

        function updateHistoryDisplay() {
            const historyList = document.getElementById('history-list');
            historyList.innerHTML = '';
            
            gameState.gameHistory.forEach(item => {
                const historyItem = document.createElement('div');
                historyItem.className = 'history-item';
                
                historyItem.innerHTML = `
                    <div class="history-time">${item.time}</div>
                    <div class="history-bet">$${item.bet.toFixed(2)}</div>
                    <div class="history-stage">Stage ${item.stage}</div>
                    <div class="history-result ${item.result.toLowerCase()}">
                        ${item.amount > 0 ? '+' : ''}$${Math.abs(item.amount).toFixed(2)}
                    </div>
                `;
                
                historyList.appendChild(historyItem);
            });
        }

        async function saveGameHistory() {
            try {
                await db.collection("royalRiskHistory").doc(gameState.currentUser.uid).collection("games").add({
                    userId: gameState.currentUser.uid,
                    ...gameState.currentGame,
                    timestamp: new Date(),
                    gameId: gameState.gameId
                });
            } catch (error) {
                console.error('Error saving game history:', error);
            }
        }

        // ===== RECENT WINNERS SYSTEM =====
        async function loadRecentWinners() {
            try {
                // Get real winners from database
                const snapshot = await db.collection("royalRiskHistory")
                    .where("result.win", "==", true)
                    .orderBy("timestamp", "desc")
                    .limit(10)
                    .get();
                
                const winnersList = document.getElementById('winners-list');
                winnersList.innerHTML = '';
                
                if (snapshot.empty) {
                    // Generate fake winners for display
                    generateFakeWinners();
                    return;
                }
                
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const winnerItem = document.createElement('div');
                    winnerItem.className = 'winner-item';
                    
                    const randomNickname = nicknamePool[Math.floor(Math.random() * nicknamePool.length)];
                    
                    winnerItem.innerHTML = `
                        <div class="winner-name">${randomNickname}</div>
                        <div class="winner-amount">+$${data.payout.toFixed(2)}</div>
                    `;
                    
                    winnersList.appendChild(winnerItem);
                });
                
                // Auto-refresh winners every 30 seconds
                setTimeout(loadRecentWinners, 30000);
                
            } catch (error) {
                console.error('Error loading winners:', error);
                generateFakeWinners();
            }
        }

        function generateFakeWinners() {
            const winnersList = document.getElementById('winners-list');
            winnersList.innerHTML = '';
            
            // Generate 5-8 fake recent winners
            const winnerCount = 5 + Math.floor(Math.random() * 4);
            
            for (let i = 0; i < winnerCount; i++) {
                const winnerItem = document.createElement('div');
                winnerItem.className = 'winner-item';
                
                const randomNickname = nicknamePool[Math.floor(Math.random() * nicknamePool.length)];
                const randomAmount = (5 + Math.random() * 95).toFixed(2); // $5-$100
                const randomMultiplier = (1.5 + Math.random() * 3.5).toFixed(1); // 1.5x-5x
                
                winnerItem.innerHTML = `
                    <div class="winner-name">${randomNickname}</div>
                    <div class="winner-amount">+$${randomAmount} (${randomMultiplier}x)</div>
                `;
                
                winnersList.appendChild(winnerItem);
            }
            
            // Auto-refresh every 30 seconds
            setTimeout(generateFakeWinners, 30000);
        }

        // ===== UI FUNCTIONS =====
        function showToast(message, type = 'info') {
            // Create toast element
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            toast.style.cssText = `
                position: fixed;
                top: 100px;
                left: 50%;
                transform: translateX(-50%);
                background: rgba(17, 24, 39, 0.95);
                color: white;
                padding: 15px 25px;
                border-radius: 10px;
                border-left: 4px solid ${type === 'error' ? 'var(--danger)' : type === 'success' ? 'var(--success)' : 'var(--warning)'};
                z-index: 10000;
                animation: slideDown 0.3s ease-out;
                backdrop-filter: blur(10px);
                font-weight: 600;
            `;
            
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.animation = 'slideUp 0.3s ease-out';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // ===== EVENT LISTENERS =====
        function setupEventListeners() {
            // Play button
            document.getElementById('play-btn').addEventListener('click', startGame);
            
            // Cash out button
            document.getElementById('cash-out-btn').addEventListener('click', cashOut);
            
            // History button
            document.getElementById('history-btn').addEventListener('click', () => {
                document.getElementById('game-history').classList.add('show');
            });
            
            // Close history
            document.getElementById('close-history').addEventListener('click', () => {
                document.getElementById('game-history').classList.remove('show');
            });
            
            // Quick bet buttons
            document.querySelectorAll('.quick-bet').forEach(btn => {
                btn.addEventListener('click', () => {
                    const amount = parseFloat(btn.dataset.amount);
                    document.getElementById('bet-amount').value = amount;
                    gameState.betAmount = amount;
                });
            });
            
            // Bet input
            document.getElementById('bet-amount').addEventListener('input', (e) => {
                let value = parseFloat(e.target.value) || 1;
                const maxBet = Math.min(gameState.balance, 1000);
                value = Math.max(1, Math.min(value, maxBet));
                e.target.value = value;
                gameState.betAmount = value;
            });
            
            // Touch gestures for mobile
            let touchStartY = 0;
            let touchStartX = 0;
            
            document.addEventListener('touchstart', (e) => {
                touchStartY = e.touches[0].clientY;
                touchStartX = e.touches[0].clientX;
            });
            
            document.addEventListener('touchend', (e) => {
                if (!gameState.isPlaying) return;
                
                const touchEndY = e.changedTouches[0].clientY;
                const touchEndX = e.changedTouches[0].clientX;
                
                const deltaY = touchStartY - touchEndY;
                const deltaX = touchStartX - touchEndX;
                
                // Swipe up to cash out
                if (deltaY > 100 && Math.abs(deltaX) < 50 && gameState.cashOutAvailable) {
                    cashOut();
                }
            });
            
            // Handle window resize for Three.js
            window.addEventListener('resize', onWindowResize);
        }

        // ===== INITIALIZATION =====
        async function initializeGame() {
            // Check authentication
            const authenticated = await checkAuth();
            if (!authenticated) return;
            
            // Initialize systems
            initAudio();
            init3DScene();
            setupEventListeners();
            
            // Load initial data
            loadRecentWinners();
            updateHistoryDisplay();
            
            // Show welcome message
            setTimeout(() => {
                showToast('Welcome to Royal Risk! Place your bet and ascend the throne.', 'success');
            }, 1000);
        }

        // ===== START THE GAME =====
        document.addEventListener('DOMContentLoaded', initializeGame);
    </script>
</body>
</html>
