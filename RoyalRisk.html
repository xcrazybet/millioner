<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Royal Risk</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body{
margin:0;
background:#0b0f1a;
font-family:Poppins;
color:white;
overflow:hidden;
}

#gameContainer{
position:fixed;
width:100%;
height:100%;
display:flex;
flex-direction:column;
}

#resultBanner{
height:60px;
text-align:center;
font-size:24px;
font-weight:bold;
background:#111;
display:flex;
align-items:center;
justify-content:center;
}

#canvasArea{
flex:1;
position:relative;
background:radial-gradient(circle,#1a2238,#000);
display:flex;
align-items:center;
justify-content:center;
font-size:40px;
}

#controls{
height:130px;
background:#10141f;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

input,button{
padding:10px;
margin:5px;
border-radius:8px;
border:none;
font-size:16px;
}

button{
background:#f0b90b;
font-weight:bold;
cursor:pointer;
}

#history{
height:120px;
overflow:auto;
background:#0d1019;
font-size:14px;
padding:5px;
}

#returnGames{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:#222;
padding:15px;
border-radius:10px;
display:none;
}

.fullscreen-btn{
position:absolute;
top:10px;
right:10px;
background:#333;
padding:8px;
border-radius:8px;
}
</style>
</head>

<body>

<div id="gameContainer">

<div id="resultBanner">👑 Royal Risk</div>

<div id="canvasArea">
<div class="fullscreen-btn" onclick="toggleFull()">📱</div>
<div id="stageDisplay">Ready</div>

<div id="returnGames">
<a href="https://xcrazybet.github.io/millioner/games.html">🎮 Return To Games</a>
</div>

</div>

<div id="controls">

<input type="number" id="betAmount" placeholder="Enter Bet" />

<div>
<button onclick="startBet()">Start Bet</button>
<button onclick="cashOut()">Cash Out</button>
</div>

</div>

<div id="history"></div>

</div>

<!-- SOUNDS -->
<audio id="winSound" src="https://soundbible.com/mp3/confirm.mp3"></audio>
<audio id="loseSound" src="https://soundbible.com/mp3/lose.mp3"></audio>
<audio id="openSound" src="https://soundbible.com/mp3/open.mp3"></audio>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>

/* ---------------- Firebase Config ---------------- */

const firebaseConfig = {
apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
authDomain: "x-bet-prod-jd.firebaseapp.com",
projectId: "x-bet-prod-jd",
storageBucket: "x-bet-prod-jd.firebasestorage.app",
messagingSenderId: "499334334535",
appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();
const auth = firebase.auth();

/* ---------------- Game Data ---------------- */

let walletBalance = 0;
let betLocked = false;
let currentStage = 0;
let currentBet = 0;

const stages = [
{ name:"Gate", multiplier:1.2, chance:0.6 },
{ name:"Knight", multiplier:1.6, chance:0.4 },
{ name:"Throne", multiplier:2.2, chance:0.25 },
{ name:"Crown", multiplier:3.5, chance:0.15 }
];

/* ---------------- Wallet Load ---------------- */

auth.onAuthStateChanged(async user => {
if(!user) return;

const doc = await db.collection("users").doc(user.uid).get();
walletBalance = doc.data().walletBalance || 0;
});

/* ---------------- Full Screen ---------------- */

function toggleFull(){
if(!document.fullscreenElement){
document.documentElement.requestFullscreen();
}else{
document.exitFullscreen();
}
}

/* ---------------- Countdown ---------------- */

async function countdown(){
document.getElementById("openSound").play();
for(let i=5;i>0;i--){
updateStage("Starting in "+i);
await sleep(1000);
}
}

/* ---------------- Start Bet ---------------- */

async function startBet(){

if(betLocked) return;

currentBet = Number(document.getElementById("betAmount").value);
if(currentBet <= 0) return;

if(currentBet > walletBalance){
alert("Not enough balance");
return;
}

betLocked = true;
await countdown();

await deductWallet(currentBet);

currentStage = 0;
playStage();
}

/* ---------------- Stage Logic ---------------- */

async function playStage(){

if(currentStage >= stages.length){
winGame();
return;
}

let stage = stages[currentStage];
updateStage(stage.name + " Stage");

await sleep(1500);

if(Math.random() <= stage.chance){
currentStage++;
playStage();
}else{
loseGame();
}

}

/* ---------------- Cashout ---------------- */

async function cashOut(){

if(!betLocked) return;

let stage = stages[currentStage-1];
if(!stage) return;

let winAmount = currentBet * stage.multiplier;

await settleWallet(winAmount,"WIN");

addHistory("WIN",winAmount);
resetGame();
}

/* ---------------- Win ---------------- */

async function winGame(){

let stage = stages[stages.length-1];
let winAmount = currentBet * stage.multiplier;

document.getElementById("winSound").play();

await settleWallet(winAmount,"WIN");
addHistory("WIN",winAmount);

resetGame();
}

/* ---------------- Lose ---------------- */

async function loseGame(){

document.getElementById("loseSound").play();

await settleWallet(0,"LOSE");
addHistory("LOSE",0);

resetGame();
}

/* ---------------- Wallet Functions ---------------- */

async function deductWallet(amount){

const user = auth.currentUser;

walletBalance -= amount;

await db.collection("users").doc(user.uid).update({
walletBalance: walletBalance
});

}

/* NOTE:
FINAL VERSION MUST MOVE THIS TO CLOUD FUNCTIONS
FOR SECURITY + ATOMIC TRANSACTION
*/

async function settleWallet(winAmount,result){

const user = auth.currentUser;

walletBalance += winAmount;

await db.collection("users").doc(user.uid).update({
walletBalance: walletBalance
});

await db.collection("transactions").add({
userId:user.uid,
game:"Royal Risk",
bet:currentBet,
win:winAmount,
result:result,
time:new Date()
});

}

/* ---------------- UI Helpers ---------------- */

function updateStage(text){
document.getElementById("stageDisplay").innerText = text;
document.getElementById("resultBanner").innerText = text;
}

function addHistory(result,amount){

let el = document.getElementById("history");

let div = document.createElement("div");
div.innerText = result + " | " + amount + " | " + new Date().toLocaleTimeString();

el.prepend(div);
}

/* ---------------- Reset ---------------- */

function resetGame(){
betLocked=false;
currentStage=0;
updateStage("Ready");
}

/* ---------------- Utils ---------------- */

function sleep(ms){
return new Promise(r=>setTimeout(r,ms));
}

/* ---------------- Fake Live Winners ---------------- */

const fakeNames=[
"stormKing","goldTiger","nightFalcon","redGhost","emeraldFox",
"neoPrince","darkSultan","alphaKnight","moonSamurai","ironCobra",
"solarBear","queenPixel","luckyFalcon","ultraPrince","ghostOrhan"
];

setInterval(()=>{
let name = fakeNames[Math.floor(Math.random()*fakeNames.length)];
let amount = (Math.random()*100).toFixed(2);
addHistory(name + " WON",amount);
},8000);

</script>

</body>
</html>
