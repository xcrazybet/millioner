<!DOCTYPE html>

    <title>🏰 ROYAL RISK MOBILE - XCrazyBet</title>
    
    <!-- Font Awesome Local Fallback -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Font Awesome fallback if CDN fails */
        @font-face {
            font-family: 'FontAwesome';
            src: url('data:font/woff2;base64,d09GMgABAAAAAA=') format('woff2');
            font-weight: normal;
            font-style: normal;
        }

    <!-- Local Three.js Fallbacks -->
    <script>
        // Three.js fallback - if CDN fails, we'll use simplified 2D rendering
        window.threeJsLoaded = false;
        window.orbitControlsLoaded = false;
        
        function loadFallbackThreeJS() {
            console.log('Using fallback 2D rendering mode');
            window.THREE = {
                Scene: function() { 
                    this.children = []; 
                    this.add = function(obj) { this.children.push(obj); };
                    this.fog = null;
                },
                PerspectiveCamera: function() {
                    this.position = { set: function() {} };
                    this.lookAt = function() {};
                    this.aspect = 1;
                    this.updateProjectionMatrix = function() {};
                },
                WebGLRenderer: function() {
                    this.setSize = function() {};
                    this.setPixelRatio = function() {};
                    this.shadowMap = { enabled: false };
                    this.render = function() {};
                    this.domElement = document.createElement('canvas');
                },
                Vector2: function() { this.x = 0; this.y = 0; },
                Vector3: function() { this.x = 0; this.y = 0; this.z = 0; },
                Raycaster: function() {
                    this.setFromCamera = function() {};
                    this.intersectObjects = function() { return []; };
                },
                AmbientLight: function() { this.type = 'AmbientLight'; },
                DirectionalLight: function() { 
                    this.position = { set: function() {} };
                    this.castShadow = false;
                    this.type = 'DirectionalLight';
                },
                Mesh: function() { 
                    this.position = { set: function() {}, y: 0 };
                    this.rotation = { x: 0 };
                    this.scale = { set: function() {} };
                    this.visible = true;
                    this.castShadow = false;
                    this.receiveShadow = false;
                    this.userData = {};
                },
                Group: function() {
                    this.children = [];
                    this.position = { set: function() {}, y: 0 };
                    this.add = function(obj) { this.children.push(obj); };
                },
                MeshStandardMaterial: function() { 
                    this.color = { setHex: function() {} };
                    this.roughness = 0.8;
                    this.metalness = 0.2;
                    this.emissive = { setHex: function() {} };
                    this.emissiveIntensity = 0.1;
                    this.transparent = false;
                    this.opacity = 1;
                },
                MeshBasicMaterial: function() { 
                    this.color = { setHex: function() {} };
                    this.transparent = false;
                    this.opacity = 1;
                    this.side = null;
                },
                CylinderGeometry: function() { this.type = 'CylinderGeometry'; },
                BoxGeometry: function() { this.type = 'BoxGeometry'; },
                PlaneGeometry: function() { this.type = 'PlaneGeometry'; },
                TorusGeometry: function() { this.type = 'TorusGeometry'; },
                Fog: function() { this.type = 'Fog'; },
                GridHelper: function() { 
                    this.position = { y: 0 };
                    this.type = 'GridHelper';
                },
                PCFSoftShadowMap: 2
            };
            window.threeJsLoaded = true;
        }
        
        // OrbitControls fallback
        function loadFallbackOrbitControls() {
            window.THREE.OrbitControls = function(camera, element) {
                this.enableDamping = true;
                this.dampingFactor = 0.05;
                this.screenSpacePanning = false;
                this.maxPolarAngle = Math.PI / 2;
                this.minDistance = 10;
                this.maxDistance = 50;
                this.enablePan = true;
                this.enableZoom = true;
                this.update = function() {};
                this.dollyIn = function() {};
                this.dollyOut = function() {};
            };
            window.orbitControlsLoaded = true;
        }
    </script>
    
    <!-- Try to load Three.js, fallback if fails -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" 
            onerror="loadFallbackThreeJS()"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.min.js" 
            onerror="loadFallbackOrbitControls()"></script>

    <style>
        :root {
            --player-blue: #4169E1;
            --player-dark-blue: #2A4FB3;
            --enemy-red: #DC143C;
            --enemy-dark-red: #B01030;
            --neutral-grey: #708090;
            --neutral-dark-grey: #5A6873;
            --crown-gold: #FFD700;
            --crown-dark-gold: #CCA300;
            --ui-silver: #C0C0C0;
            --bg-dark: #1B1B1B;
            --bg-surface: #2A2A2A;
            --bg-surface-light: #3A3A3A;
            --text: #FFFFFF;
            --text-dim: #AAAAAA;
            --success: #00FF9D;
            --danger: #FF1C1C;
            --warning: #FFD700;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Arial', 'Segoe UI', system-ui, sans-serif;
            user-select: none;
        }

        body {
            background: var(--bg-dark);
            color: var(--text);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: fixed;
            touch-action: none;
        }

        /* Loading Screen */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-dark);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            transition: opacity 0.5s;
        }

        .loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-icon {
            width: 80px;
            height: 80px;
            border: 4px solid var(--crown-gold);
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            color: var(--crown-gold);
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .loading-warning {
            color: var(--warning);
            font-size: 12px;
            margin-top: 10px;
            text-align: center;
            padding: 0 20px;
            display: none;
        }

        /* Game Container - Vertical Mobile Layout */
        .game-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Header */
        .game-header {
            background: rgba(43, 43, 43, 0.95);
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--crown-gold);
            z-index: 100;
            position: relative;
            backdrop-filter: blur(10px);
        }

        .game-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--crown-gold);
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .balance-display {
            background: linear-gradient(45deg, #2A2A2A, #1A1A1A);
            padding: 8px 15px;
            border-radius: 20px;
            border: 1px solid var(--crown-gold);
            color: var(--crown-gold);
            font-weight: 700;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 2D/3D Map Container - Top 40% */
        .map-container {
            flex: 4;
            position: relative;
            background: linear-gradient(180deg, #0A0A1A 0%, #1A1A2A 100%);
            overflow: hidden;
            border-bottom: 2px solid rgba(255, 215, 0, 0.3);
        }

        #game-canvas {
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
            background: linear-gradient(135deg, #0A0A1A, #1A1A2A);
        }

        .map-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            z-index: 10;
            pointer-events: none;
        }

        .map-info {
            background: rgba(26, 26, 26, 0.8);
            padding: 8px 12px;
            border-radius: 10px;
            border: 1px solid var(--ui-silver);
            backdrop-filter: blur(5px);
            pointer-events: auto;
        }

        .turn-counter {
            color: var(--crown-gold);
            font-weight: 700;
            font-size: 14px;
        }

        /* Simplified 2D Territory Grid (Fallback) */
        .territory-grid-2d {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 10px;
            padding: 20px;
            z-index: 1;
        }

        .territory-cell-2d {
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
            position: relative;
            overflow: hidden;
        }

        .territory-cell-2d.player {
            background: linear-gradient(135deg, var(--player-blue), var(--player-dark-blue));
            border-color: var(--player-blue);
        }

        .territory-cell-2d.enemy {
            background: linear-gradient(135deg, var(--enemy-red), var(--enemy-dark-red));
            border-color: var(--enemy-red);
        }

        .territory-cell-2d.neutral {
            background: linear-gradient(135deg, var(--neutral-grey), var(--neutral-dark-grey));
            border-color: var(--neutral-grey);
        }

        .territory-cell-2d.selected {
            border-color: var(--crown-gold);
            border-width: 3px;
            box-shadow: 0 0 15px var(--crown-gold);
            transform: scale(1.05);
        }

        .territory-cell-2d:hover {
            transform: scale(1.03);
        }

        .territory-name-2d {
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            text-align: center;
            padding: 5px;
            font-size: 10px;
        }

        .territory-stats-2d {
            position: absolute;
            bottom: 2px;
            left: 2px;
            right: 2px;
            display: flex;
            justify-content: space-between;
            font-size: 8px;
            color: white;
            text-shadow: 1px 1px 1px rgba(0,0,0,0.8);
        }

        /* Territory Info Panel */
        .territory-info {
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            background: rgba(26, 26, 26, 0.9);
            padding: 15px;
            border-radius: 15px;
            border: 2px solid var(--player-blue);
            display: none;
            backdrop-filter: blur(10px);
            z-index: 20;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
        }

        .territory-info.show {
            display: block;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .territory-name {
            color: var(--crown-gold);
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .territory-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .territory-stat {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
        }

        .stat-label {
            color: var(--text-dim);
            font-size: 10px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .stat-value {
            color: var(--text);
            font-size: 14px;
            font-weight: 700;
        }

        /* Action Panel - Middle 35% */
        .action-panel {
            flex: 3.5;
            background: rgba(26, 26, 26, 0.95);
            padding: 15px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 10px;
            border-bottom: 2px solid rgba(255, 215, 0, 0.3);
            backdrop-filter: blur(10px);
        }

        .action-btn {
            background: linear-gradient(135deg, var(--bg-surface), var(--bg-surface-light));
            border: 2px solid;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s;
            padding: 10px;
            position: relative;
            overflow: hidden;
        }

        .action-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.5s;
        }

        .action-btn:hover::before {
            left: 100%;
        }

        .action-btn:active {
            transform: scale(0.95);
        }

        .action-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none !important;
        }

        .action-btn:disabled::before {
            display: none;
        }

        .action-icon {
            font-size: 24px;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            margin-bottom: 5px;
        }

        .action-label {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-align: center;
        }

        .action-cost {
            position: absolute;
            bottom: 5px;
            right: 5px;
            font-size: 10px;
            color: var(--text-dim);
            background: rgba(0, 0, 0, 0.5);
            padding: 2px 6px;
            border-radius: 10px;
        }

        .btn-attack {
            border-color: var(--enemy-red);
            color: var(--enemy-red);
        }

        .btn-attack .action-icon {
            background: rgba(220, 20, 60, 0.2);
        }

        .btn-fortify {
            border-color: var(--player-blue);
            color: var(--player-blue);
        }

        .btn-fortify .action-icon {
            background: rgba(65, 105, 225, 0.2);
        }

        .btn-diplomacy {
            border-color: var(--success);
            color: var(--success);
        }

        .btn-diplomacy .action-icon {
            background: rgba(0, 255, 157, 0.2);
        }

        .btn-spy {
            border-color: var(--warning);
            color: var(--warning);
        }

        .btn-spy .action-icon {
            background: rgba(255, 215, 0, 0.2);
        }

        .btn-sabotage {
            border-color: #FF6B6B;
            color: #FF6B6B;
        }

        .btn-sabotage .action-icon {
            background: rgba(255, 107, 107, 0.2);
        }

        .btn-crown {
            border-color: var(--crown-gold);
            color: var(--crown-gold);
            grid-column: span 3;
        }

        .btn-crown .action-icon {
            background: rgba(255, 215, 0, 0.2);
        }

        /* Resource HUD - Bottom 25% */
        .resource-hud {
            flex: 2.5;
            background: rgba(26, 26, 26, 0.95);
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            backdrop-filter: blur(10px);
        }

        .resource-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .resource-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .resource-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 700;
        }

        .resource-gold { background: var(--crown-gold); color: #000; }
        .resource-soldiers { background: var(--player-blue); color: #fff; }
        .resource-food { background: var(--success); color: #000; }
        .resource-influence { background: var(--warning); color: #000; }

        .resource-info {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .resource-label {
            color: var(--text-dim);
            font-size: 10px;
            text-transform: uppercase;
        }

        .resource-value {
            color: var(--text);
            font-size: 16px;
            font-weight: 700;
        }

        .crown-progress {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 10px;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .progress-label {
            color: var(--crown-gold);
            font-size: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .progress-percent {
            color: var(--crown-gold);
            font-size: 14px;
            font-weight: 700;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--crown-gold), var(--crown-dark-gold));
            border-radius: 5px;
            transition: width 0.5s ease;
            position: relative;
            overflow: hidden;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: progressShine 2s infinite;
        }

        @keyframes progressShine {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        /* Bet Controls Overlay */
        .bet-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 11, 11, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .bet-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .bet-controls {
            background: rgba(26, 26, 26, 0.95);
            padding: 30px;
            border-radius: 20px;
            border: 3px solid var(--crown-gold);
            max-width: 400px;
            width: 90%;
            backdrop-filter: blur(20px);
            box-shadow: 0 10px 40px rgba(255, 215, 0, 0.3);
        }

        .bet-title {
            color: var(--crown-gold);
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
            text-align: center;
        }

        .bet-input-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .bet-input {
            flex: 1;
            padding: 15px;
            background: rgba(17, 17, 17, 0.8);
            border: 2px solid var(--crown-gold);
            border-radius: 10px;
            color: var(--text);
            font-size: 18px;
            font-weight: 600;
            text-align: center;
        }

        .currency {
            color: var(--crown-gold);
            font-weight: 700;
            font-size: 18px;
            min-width: 20px;
        }

        .quick-bets {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .quick-bet {
            padding: 10px 5px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: var(--text-dim);
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .quick-bet:hover {
            background: rgba(255, 215, 0, 0.1);
            border-color: var(--crown-gold);
            color: var(--crown-gold);
        }

        .play-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--crown-gold), var(--crown-dark-gold));
            border: none;
            border-radius: 10px;
            color: #000;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .play-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.4);
        }

        /* Result Overlay */
        .result-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 11, 11, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .result-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .result-content {
            background: rgba(26, 26, 26, 0.95);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            backdrop-filter: blur(20px);
            border: 3px solid;
            animation: resultAppear 0.5s ease-out;
        }

        @keyframes resultAppear {
            from {
                opacity: 0;
                transform: scale(0.9) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .result-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .result-victory {
            color: var(--crown-gold);
            border-color: var(--crown-gold);
        }

        .result-defeat {
            color: var(--danger);
            border-color: var(--danger);
        }

        .result-details {
            font-size: 16px;
            margin: 15px 0;
            color: var(--text);
        }

        .result-amount {
            font-size: 32px;
            font-weight: 900;
            margin: 20px 0;
            color: var(--crown-gold);
        }

        .result-amount.lose {
            color: var(--danger);
        }

        /* Toast Notifications */
        .toast-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 300px;
            width: 90%;
        }

        .toast {
            padding: 15px;
            background: rgba(26, 26, 26, 0.95);
            border-radius: 10px;
            border-left: 4px solid var(--crown-gold);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
            transform: translateY(100%);
            opacity: 0;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
            font-size: 14px;

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.success {
            border-color: var(--crown-gold);
        }

        .toast.error {
            border-color: var(--danger);
        }

        .toast.warning {
            border-color: var(--warning);
        }

        /* Mobile Controls */
        .mobile-controls {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 50;
        }

        .control-btn {
            width: 50px;
            height: 50px;
            background: rgba(26, 26, 26, 0.9);
            border-radius: 50%;
            border: 2px solid var(--crown-gold);
            color: var(--crown-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .control-btn:active {
            transform: scale(0.9);
            background: var(--crown-gold);
            color: #000;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .game-header {
                padding: 10px;
            }

            .game-title {
                font-size: 16px;
            }

            .balance-display {
                padding: 6px 12px;
                font-size: 12px;
            }

            .action-panel {
                padding: 10px;
                gap: 8px;
            }

            .action-label {
                font-size: 10px;
            }

            .action-icon {
                font-size: 20px;
                width: 32px;
                height: 32px;
            }

            .resource-hud {
                padding: 10px;
            }

            .resource-value {
                font-size: 14px;
            }

            .territory-info {
                padding: 12px;
            }

            .bet-controls {
                padding: 20px;
            }

            .bet-title {
                font-size: 20px;
            }
        }

        @media (max-width: 480px) {
            .game-title {
                font-size: 14px;
            }

            .action-panel {
                grid-template-columns: repeat(2, 1fr);
                grid-template-rows: repeat(3, 1fr);
            }

            .btn-crown {
                grid-column: span 2;
            }

            .resource-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .control-btn {
                width: 40px;
                height: 40px;
                font-size: 16px;

        }

        /* Fullscreen Toggle */
        .fullscreen-toggle {
            position: fixed;
            top: 15px;

            height: 40px;
            background: rgba(26, 26, 26, 0.9);

            cursor: pointer;
            z-index: 1001;

            transition: all 0.3s;
        }

        .fullscreen-toggle:hover {
            background: var(--crown-gold);
            color: #000;

    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div class="loading-screen" id="loading-screen">
        <div class="loading-icon"></div>

    <!-- Game Container -->

        <!-- Header -->

        <!-- Map Container (3D Canvas + 2D Fallback) -->
        <div class="map-container">

        <!-- Action Panel -->
        <div class="action-panel">

            <button class="action-btn btn-fortify" id="btn-fortify">

            </button>
            <button class="action-btn btn-diplomacy" id="btn-diplomacy">

            </button>
            <button class="action-btn btn-crown" id="btn-crown">
                <div class="action-icon">
                    <i class="fas fa-crown"></i>

        <!-- Resource HUD -->
        <div class="resource-hud">

                    </div>

            <div class="crown-progress">
                <div class="progress-header">
                    <div class="progress-label">
                        <i class="fas fa-crown"></i>

                    </div>
                    <div class="progress-percent" id="crown-progress">65%</div>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill" style="width: 65%"></div>
                </div>

    </div>

    <!-- Mobile Controls -->
    <div class="mobile-controls">
        <div class="control-btn" id="btn-zoom-in" title="Zoom In">
            <i class="fas fa-plus"></i>
        </div>
        <div class="control-btn" id="btn-zoom-out" title="Zoom Out">

        </div>
        <div class="control-btn" id="btn-reset-camera" title="Reset Camera">

    <!-- Bet Controls Overlay -->
    <div class="bet-overlay" id="bet-overlay">
        <div class="bet-controls">

            </div>
            <div class="bet-input-group">

                <input type="number" class="bet-input" id="bet-amount" value="5" min="1" step="1">
                <div class="currency">USD</div>
            </div>
            <div class="quick-bets">
                <div class="quick-bet" data-amount="1">$1</div>
                <div class="quick-bet" data-amount="5">$5</div>
                <div class="quick-bet" data-amount="10">$10</div>
                <div class="quick-bet" data-amount="25">$25</div>

            <button class="play-btn" id="start-game-btn">
                <i class="fas fa-play"></i>

            </button>
        </div>

    <!-- Result Overlay -->
    <div class="result-overlay" id="result-overlay">
        <div class="result-content" id="result-content">
            <div class="result-title" id="result-title">VICTORY!</div>
            <div class="result-details" id="result-details">
                Territory conquered successfully!
            </div>
            <div class="result-amount" id="result-amount">+$0.00</div>
            <button id="continue-btn" class="play-btn" style="margin-top: 20px;">
                <i class="fas fa-redo"></i>
                CONTINUE
            </button>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>

    <!-- No external audio - all sounds will be simulated -->
    
    <script>
        // ===== GAME STATE =====
        const gameState = {
            // Player Resources
            balance: 100.00,
            gold: 1500,
            soldiers: 250,
            food: 800,
            influence: 65,
            turn: 1,
            maxTurns: 15,
            
            // Game State
            betAmount: 5,
            maxBet: 1000,
            isPlaying: false,
            gameActive: false,
            gameId: null,
            selectedTerritory: null,
            
            // Territories Data
            territories: [],
            mapSize: { width: 5, height: 4 },
            
            // Action Costs
            actionCosts: {
                attack: { gold: 50, soldiers: 0, food: 20 },
                fortify: { gold: 30, soldiers: 10, food: 10 },
                diplomacy: { gold: 20, soldiers: 0, food: 5 },
                spy: { gold: 15, soldiers: 5, food: 5 },
                sabotage: { gold: 40, soldiers: 20, food: 10 },
                crown: { gold: 100, soldiers: 50, food: 50 }
            },
            
            // Game statistics
            territoriesConquered: 0,
            totalBattles: 0,
            battlesWon: 0,
            winRate: 0,
            currentStreak: 0,
            
            // Current round
            currentRound: {
                action: null,
                target: null,
                outcome: null,
                payout: 0,
                influenceChange: 0,
                resourcesLost: { gold: 0, soldiers: 0, food: 0 }
            },
            
            // 3D/2D Mode
            use3D: true,
            
            // Bonus system
            bonusSystem: {
                turnsPlayed: 0,
                turnsForBonus: 10,
                bonusAmount: 5,
                bonusEarned: false
            }
        };

        // ===== INITIALIZATION =====
        document.addEventListener('DOMContentLoaded', () => {
            console.log('Royal Risk Mobile Initializing...');
            
            // Check for Three.js
            setTimeout(() => {
                if (!window.THREE || !window.threeJsLoaded) {
                    console.log('Three.js not loaded, using 2D fallback');
                    gameState.use3D = false;
                    document.getElementById('loading-warning').textContent = 'Using 2D Mode (3D failed to load)';
                    document.getElementById('loading-warning').style.display = 'block';
                }
                
                // Setup event listeners
                setupEventListeners();
                
                // Show bet overlay
                setTimeout(() => {
                    document.getElementById('bet-overlay').classList.add('show');
                    hideLoadingScreen();
                }, 1500);
            }, 2000);
        });

        function hideLoadingScreen() {
            document.getElementById('loading-screen').classList.add('hidden');
        }

        // ===== 2D MAP FALLBACK =====
        function init2DMap() {
            console.log('Initializing 2D map fallback');
            
            const grid = document.getElementById('territory-grid-2d');
            grid.style.display = 'grid';
            
            // Create territory cells
            const rows = gameState.mapSize.height;
            const cols = gameState.mapSize.width;
            
            for (let row = 0; row < rows; row++) {
                for (let col = 0; col < cols; col++) {
                    // Determine territory type
                    let owner, soldiers, defense;
                    const random = Math.random();
                    
                    if (random < 0.3) {
                        owner = 'player';
                        soldiers = Math.floor(Math.random() * 50) + 50;
                        defense = Math.floor(Math.random() * 30) + 20;
                    } else if (random < 0.7) {
                        owner = 'enemy';
                        soldiers = Math.floor(Math.random() * 100) + 100;
                        defense = Math.floor(Math.random() * 50) + 30;
                    } else {
                        owner = 'neutral';
                        soldiers = Math.floor(Math.random() * 30) + 10;
                        defense = Math.floor(Math.random() * 20) + 10;
                    }
                    
                    const territory = {
                        id: `territory_${row}_${col}`,
                        name: getTerritoryName(row, col),
                        position: { row, col },
                        owner: owner,
                        soldiers: soldiers,
                        defense: defense,
                        resources: {
                            gold: Math.floor(Math.random() * 100) + 50,
                            food: Math.floor(Math.random() * 200) + 100
                        }
                    };
                    
                    gameState.territories.push(territory);
                    
                    // Create cell
                    const cell = document.createElement('div');
                    cell.className = `territory-cell-2d ${owner}`;
                    cell.dataset.id = territory.id;
                    
                    cell.innerHTML = `
                        <div class="territory-name-2d">${territory.name}</div>
                        <div class="territory-stats-2d">
                            <span>⚔️${soldiers}</span>
                            <span>🛡️${defense}%</span>
                        </div>
                    `;
                    
                    cell.addEventListener('click', () => {
                        // Deselect previous
                        document.querySelectorAll('.territory-cell-2d').forEach(c => {
                            c.classList.remove('selected');
                        });
                        
                        // Select this
                        cell.classList.add('selected');
                        selectTerritory(territory);
                    });
                    
                    grid.appendChild(cell);
                }
            }
        }

        function getTerritoryName(row, col) {
            const prefixes = ['Royal', 'Golden', 'Silver', 'Iron', 'Crystal', 'Emerald', 'Ruby', 'Sapphire'];
            const suffixes = ['Keep', 'Castle', 'Fortress', 'Tower', 'Citadel', 'Stronghold', 'Bastion', 'Redoubt'];
            return `${prefixes[col % prefixes.length]} ${suffixes[row % suffixes.length]}`;
        }

        function selectTerritory(territory) {
            gameState.selectedTerritory = territory;
            
            // Show territory info
            document.getElementById('territory-name').textContent = territory.name;
            document.getElementById('territory-owner').textContent = 
                territory.owner.charAt(0).toUpperCase() + territory.owner.slice(1);
            document.getElementById('territory-soldiers').textContent = territory.soldiers;
            document.getElementById('territory-defense').textContent = `${territory.defense}%`;
            
            const infoPanel = document.getElementById('territory-info');
            infoPanel.classList.add('show');
            
            // Update border color based on owner
            let borderColor;
            switch(territory.owner) {
                case 'player': borderColor = 'var(--player-blue)'; break;
                case 'enemy': borderColor = 'var(--enemy-red)'; break;
                case 'neutral': borderColor = 'var(--neutral-grey)'; break;
            }
            infoPanel.style.borderColor = borderColor;
            
            // Update action buttons
            updateActionButtons(territory);
            
            // Play sound
            playSound('click');
        }

        function updateActionButtons(territory) {
            const actions = ['attack', 'fortify', 'diplomacy', 'spy', 'sabotage', 'crown'];
            
            actions.forEach(action => {
                const btn = document.getElementById(`btn-${action}`);
                const cost = gameState.actionCosts[action];
                
                // Check if player has enough resources
                const canAfford = gameState.gold >= cost.gold && 
                                  gameState.soldiers >= cost.soldiers && 
                                  gameState.food >= cost.food;
                
                // Check if action is valid for this territory
                const isValid = isActionValid(action, territory);
                
                btn.disabled = !canAfford || !isValid;
                
                if (btn.disabled) {
                    btn.style.opacity = '0.5';
                } else {
                    btn.style.opacity = '1';
                }
            });
        }

        function isActionValid(action, territory) {
            switch(action) {
                case 'attack':
                    return territory.owner === 'enemy' || territory.owner === 'neutral';
                case 'fortify':
                    return territory.owner === 'player';
                case 'diplomacy':
                    return territory.owner === 'neutral';
                case 'spy':
                    return territory.owner === 'enemy';
                case 'sabotage':
                    return territory.owner === 'enemy';
                case 'crown':
                    return gameState.influence >= 100;
                default:
                    return false;
            }
        }

        // ===== GAME FUNCTIONS =====
        function startGame() {
            const betAmount = parseFloat(document.getElementById('bet-amount').value);
            
            // Validation
            if (betAmount < 1 || betAmount > gameState.maxBet) {
                showToast('Invalid royal stake', 'error');
                return;
            }
            
            if (betAmount > gameState.balance) {
                showToast('Insufficient royal funds', 'error');
                return;
            }
            
            // Start the game
            gameState.betAmount = betAmount;
            gameState.gameId = 'royalrisk_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            
            // Deduct bet from balance
            gameState.balance -= betAmount;
            updateBalanceDisplay();
            
            // Hide bet overlay
            document.getElementById('bet-overlay').classList.remove('show');
            
            // Initialize map
            if (gameState.use3D) {
                try {
                    init3DMap();
                } catch (error) {
                    console.error('3D map failed:', error);
                    gameState.use3D = false;
                    init2DMap();
                }
            } else {
                init2DMap();
            }
            
            // Show game UI
            showToast('Royal conquest initiated! Select a territory to begin.', 'success');
            
            gameState.isPlaying = true;
            gameState.gameActive = true;
            
            updateResources();
        }

        function init3DMap() {
            console.log('Attempting 3D map initialization...');
            // This is a simplified version - in production you'd implement full Three.js here
            showToast('3D map loaded (simulated)', 'success');
        }

        async function executeAction(action) {
            if (!gameState.gameActive || !gameState.selectedTerritory) {
                showToast('Select a territory first', 'warning');
                return;
            }
            
            const territory = gameState.selectedTerritory;
            const cost = gameState.actionCosts[action];
            
            // Check resources
            if (gameState.gold < cost.gold || gameState.soldiers < cost.soldiers || gameState.food < cost.food) {
                showToast('Insufficient resources', 'error');
                return;
            }
            
            // Set current round
            gameState.currentRound = {
                action: action,
                target: territory,
                outcome: null,
                payout: 0,
                influenceChange: 0,
                resourcesLost: { gold: 0, soldiers: 0, food: 0 }
            };
            
            // Deduct resources
            gameState.gold -= cost.gold;
            gameState.soldiers -= cost.soldiers;
            gameState.food -= cost.food;
            
            updateResources();
            
            // Calculate outcome
            calculateActionOutcome(action, territory);
            
            // Update game stats
            gameState.totalBattles++;
            gameState.turn++;
            
            // Update bonus progress
            updateBonusProgress();
            
            // Show result
            showActionResult();
        }

        function calculateActionOutcome(action, territory) {
            // Hidden lose system: 85-90% lose rate
            const baseWinChance = 0.12; // 12% base win chance
            let winChance = baseWinChance;
            
            // Adjust based on action
            const actionMultipliers = {
                attack: 0.8,
                fortify: 1.5,
                diplomacy: 1.2,
                spy: 1.3,
                sabotage: 0.7,
                crown: 0.4
            };
            
            winChance *= actionMultipliers[action] || 1;
            
            // Adjust based on territory defense
            winChance *= (1 - territory.defense / 200);
            
            // Apply streak penalty
            if (gameState.currentStreak > 2) {
                winChance *= 0.8;
            }
            
            // Ensure min/max
            winChance = Math.max(0.05, Math.min(0.35, winChance));
            
            // Determine outcome
            const isWin = Math.random() < winChance;
            
            if (isWin) {
                // Victory
                gameState.currentRound.outcome = 'victory';
                gameState.currentRound.influenceChange = calculateInfluenceGain(action, territory);
                gameState.currentRound.payout = calculatePayout(action, territory);
                gameState.currentRound.resourcesLost = { gold: 0, soldiers: 0, food: 0 };
                
                // Update territory if attack
                if (action === 'attack') {
                    territory.owner = 'player';
                    territory.soldiers = Math.floor(territory.soldiers * 0.3);
                    territory.defense = 20;
                    gameState.territoriesConquered++;
                    
                    // Update 2D display
                    if (!gameState.use3D) {
                        update2DTerritoryDisplay(territory);
                    }
                }
                
                gameState.battlesWon++;
                gameState.currentStreak++;
            } else {
                // Defeat
                gameState.currentRound.outcome = 'defeat';
                gameState.currentRound.influenceChange = -5;
                gameState.currentRound.payout = 0;
                gameState.currentRound.resourcesLost = calculateResourcesLost(action, territory);
                
                gameState.currentStreak = 0;
            }
            
            // Apply changes
            gameState.influence = Math.max(0, Math.min(100, gameState.influence + gameState.currentRound.influenceChange));
            gameState.gold = Math.max(0, gameState.gold - gameState.currentRound.resourcesLost.gold);
            gameState.soldiers = Math.max(0, gameState.soldiers - gameState.currentRound.resourcesLost.soldiers);
            gameState.food = Math.max(0, gameState.food - gameState.currentRound.resourcesLost.food);
            
            // Update win rate
            gameState.winRate = gameState.totalBattles > 0 ? 
                Math.round((gameState.battlesWon / gameState.totalBattles) * 100) : 0;
            
            // Check for game end
            if (gameState.turn >= gameState.maxTurns || gameState.influence <= 0) {
                setTimeout(() => endGame(false), 1000);
            } else if (gameState.influence >= 100) {
                setTimeout(() => endGame(true), 1000);
            }
        }

        function calculateInfluenceGain(action, territory) {
            switch(action) {
                case 'attack':
                    return territory.owner === 'enemy' ? 10 : 5;
                case 'fortify':
                    return 3;
                case 'diplomacy':
                    return 8;
                case 'spy':
                    return 2;
                case 'sabotage':
                    return 6;
                case 'crown':
                    return 15;
                default:
                    return 0;
            }
        }

        function calculateResourcesLost(action, territory) {
            const baseLoss = {
                attack: { gold: 30, soldiers: 40, food: 15 },
                fortify: { gold: 10, soldiers: 5, food: 5 },
                diplomacy: { gold: 5, soldiers: 0, food: 2 },
                spy: { gold: 8, soldiers: 10, food: 3 },
                sabotage: { gold: 20, soldiers: 25, food: 8 },
                crown: { gold: 50, soldiers: 30, food: 25 }
            };
            
            const loss = baseLoss[action];
            const defenseMultiplier = 1 + (territory.defense / 100);
            
            return {
                gold: Math.floor(loss.gold * defenseMultiplier),
                soldiers: Math.floor(loss.soldiers * defenseMultiplier),
                food: Math.floor(loss.food * defenseMultiplier)
            };
        }

        function calculatePayout(action, territory) {
            const baseMultiplier = {
                attack: 1.8,
                fortify: 1.2,
                diplomacy: 1.5,
                spy: 1.3,
                sabotage: 2.0,
                crown: 5.0
            };
            
            const multiplier = baseMultiplier[action];
            const defenseBonus = 1 - (territory.defense / 200);
            const streakBonus = 1 + (gameState.currentStreak * 0.1);
            
            return gameState.betAmount * multiplier * defenseBonus * streakBonus;
        }

        function update2DTerritoryDisplay(territory) {
            const cell = document.querySelector(`[data-id="${territory.id}"]`);
            if (cell) {
                cell.className = `territory-cell-2d player`;
                cell.querySelector('.territory-stats-2d').innerHTML = `
                    <span>⚔️${territory.soldiers}</span>
                    <span>🛡️${territory.defense}%</span>
                `;
            }
        }

        function showActionResult() {
            const round = gameState.currentRound;
            
            // Update result overlay
            const resultContent = document.getElementById('result-content');
            const resultTitle = document.getElementById('result-title');
            const resultDetails = document.getElementById('result-details');
            const resultAmount = document.getElementById('result-amount');
            
            if (round.outcome === 'victory') {
                resultContent.className = 'result-content result-victory';
                resultTitle.textContent = 'VICTORY!';
                resultTitle.className = 'result-title result-victory';
                
                let details = '';
                switch(round.action) {
                    case 'attack': details = 'Territory conquered!'; break;
                    case 'fortify': details = 'Defenses strengthened!'; break;
                    case 'diplomacy': details = 'Alliance formed!'; break;
                    case 'spy': details = 'Intel gathered!'; break;
                    case 'sabotage': details = 'Enemy weakened!'; break;
                    case 'crown': details = 'CROWN CLAIMED!'; break;
                }
                resultDetails.textContent = details;
                
                if (round.payout > 0) {
                    resultAmount.textContent = `+$${round.payout.toFixed(2)}`;
                    resultAmount.className = 'result-amount';
                    
                    // Add to balance
                    gameState.balance += round.payout;
                    updateBalanceDisplay();
                } else {
                    resultAmount.textContent = '';
                }
                
                playSound('victory');
            } else {
                resultContent.className = 'result-content result-defeat';
                resultTitle.textContent = 'DEFEAT';
                resultTitle.className = 'result-title result-defeat';
                
                let details = '';
                switch(round.action) {
                    case 'attack': details = 'Attack repelled!'; break;
                    case 'fortify': details = 'Construction failed!'; break;
                    case 'diplomacy': details = 'Negotiations failed!'; break;
                    case 'spy': details = 'Spy captured!'; break;
                    case 'sabotage': details = 'Sabotage discovered!'; break;
                    case 'crown': details = 'Crown claim rejected!'; break;
                }
                resultDetails.textContent = details;
                
                resultAmount.textContent = `-$${gameState.betAmount.toFixed(2)}`;
                resultAmount.className = 'result-amount lose';
                
                playSound('defeat');
            }
            
            // Show result overlay
            document.getElementById('result-overlay').classList.add('show');
            
            // Update UI
            updateResources();
            
            // Hide territory info
            document.getElementById('territory-info').classList.remove('show');
        }

        function endGame(victory) {
            gameState.gameActive = false;
            
            // Calculate final payout
            let finalPayout = 0;
            if (victory) {
                finalPayout = gameState.betAmount * 3;
                showToast('ROYAL VICTORY! Crown claimed!', 'success');
            } else {
                showToast('Royal campaign ended', 'error');
            }
            
            // Show final result
            const resultContent = document.getElementById('result-content');
            const resultTitle = document.getElementById('result-title');
            const resultDetails = document.getElementById('result-details');
            const resultAmount = document.getElementById('result-amount');
            
            if (victory) {
                resultContent.className = 'result-content result-victory';
                resultTitle.textContent = 'ROYAL VICTORY';
                resultDetails.textContent = `You claimed the crown in ${gameState.turn} turns!`;
                resultAmount.textContent = `+$${finalPayout.toFixed(2)}`;
                resultAmount.className = 'result-amount';
                
                // Add to balance
                if (finalPayout > 0) {
                    gameState.balance += finalPayout;
                    updateBalanceDisplay();
                }
            } else {
                resultContent.className = 'result-content result-defeat';
                resultTitle.textContent = 'CAMPAIGN ENDED';
                resultDetails.textContent = 'Your royal campaign has come to an end.';
                resultAmount.textContent = `-$${gameState.betAmount.toFixed(2)}`;
                resultAmount.className = 'result-amount lose';
            }
            
            document.getElementById('result-overlay').classList.add('show');
        }

        // ===== BONUS SYSTEM =====
        function updateBonusProgress() {
            const bonus = gameState.bonusSystem;
            bonus.turnsPlayed++;
            
            if (bonus.turnsPlayed >= bonus.turnsForBonus && !bonus.bonusEarned) {
                bonus.bonusEarned = true;
                bonus.turnsPlayed = 0;
                
                // Award bonus
                gameState.balance += bonus.bonusAmount;
                gameState.gold += 200;
                gameState.soldiers += 100;
                gameState.food += 150;
                
                updateBalanceDisplay();
                updateResources();
                
                showToast(`Royal Bonus: $${bonus.bonusAmount} + Resources!`, 'success');
            }
        }

        // ===== SOUND SYSTEM =====
        function playSound(type) {
            // Simple sound simulation - no external files needed
            console.log(`Playing sound: ${type}`);
            
            // Create a simple beep for victory
            if (type === 'victory') {
                try {
                    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    const oscillator = audioContext.createOscillator();
                    const gainNode = audioContext.createGain();
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.destination);
                    
                    oscillator.frequency.value = 800;
                    oscillator.type = 'sine';
                    
                    gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 1);
                    
                    oscillator.start(audioContext.currentTime);
                    oscillator.stop(audioContext.currentTime + 1);
                } catch (e) {
                    console.log('Web Audio API not supported');
                }
            }
        }

        // ===== UI UPDATES =====
        function updateBalanceDisplay() {
            document.getElementById('balance-val').textContent = gameState.balance.toFixed(2);
        }

        function updateResources() {
            document.getElementById('gold-val').textContent = gameState.gold;
            document.getElementById('soldiers-val').textContent = gameState.soldiers;
            document.getElementById('food-val').textContent = gameState.food;
            document.getElementById('influence-val').textContent = `${gameState.influence}%`;
            
            // Update crown progress
            document.getElementById('crown-progress').textContent = `${gameState.influence}%`;
            document.getElementById('progress-fill').style.width = `${gameState.influence}%`;
            
            // Update turn counter
            document.getElementById('turn-count').textContent = gameState.turn;
        }

        // ===== EVENT LISTENERS =====
        function setupEventListeners() {
            // Start game button
            document.getElementById('start-game-btn').addEventListener('click', startGame);
            
            // Continue button
            document.getElementById('continue-btn').addEventListener('click', () => {
                document.getElementById('result-overlay').classList.remove('show');
                
                // If game ended, show bet overlay again
                if (!gameState.gameActive) {
                    document.getElementById('bet-overlay').classList.add('show');
                }
            });
            
            // Action buttons
            document.getElementById('btn-attack').addEventListener('click', () => executeAction('attack'));
            document.getElementById('btn-fortify').addEventListener('click', () => executeAction('fortify'));
            document.getElementById('btn-diplomacy').addEventListener('click', () => executeAction('diplomacy'));
            document.getElementById('btn-spy').addEventListener('click', () => executeAction('spy'));
            document.getElementById('btn-sabotage').addEventListener('click', () => executeAction('sabotage'));
            document.getElementById('btn-crown').addEventListener('click', () => executeAction('crown'));
            
            // Quick bet buttons
            document.querySelectorAll('.quick-bet').forEach(btn => {
                btn.addEventListener('click', () => {
                    const amount = parseFloat(btn.dataset.amount);
                    document.getElementById('bet-amount').value = amount;
                    gameState.betAmount = amount;
                    playSound('click');
                });
            });
            
            // Bet input
            document.getElementById('bet-amount').addEventListener('input', (e) => {
                let value = parseFloat(e.target.value) || 1;
                value = Math.max(1, Math.min(value, gameState.maxBet));
                e.target.value = value;
                gameState.betAmount = value;
            });
            
            // Mobile controls (simulated for 2D)
            document.getElementById('btn-zoom-in').addEventListener('click', () => {
                showToast('Zoom In', 'info');
            });
            
            document.getElementById('btn-zoom-out').addEventListener('click', () => {
                showToast('Zoom Out', 'info');
            });
            
            document.getElementById('btn-reset-camera').addEventListener('click', () => {
                showToast('View Reset', 'info');
            });
            
            // Fullscreen toggle
            document.getElementById('fullscreen-toggle').addEventListener('click', toggleFullscreen);
            
            // Click sound for all buttons
            document.querySelectorAll('button').forEach(btn => {
                btn.addEventListener('click', () => {
                    if (!btn.id.includes('start-game') && !btn.id.includes('continue')) {
                        playSound('click');
                    }
                });
            });
        }

        // ===== FULLSCREEN FUNCTION =====
        function toggleFullscreen() {
            const toggleBtn = document.getElementById('fullscreen-toggle');
            
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
                toggleBtn.innerHTML = '<i class="fas fa-compress"></i>';
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                    toggleBtn.innerHTML = '<i class="fas fa-expand"></i>';
                }
            }
        }

        // ===== TOAST NOTIFICATIONS =====
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.add('show');
            }, 10);
            
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => {
                    if (container.contains(toast)) {
                        container.removeChild(toast);
                    }
                }, 300);
            }, 3000);
        }

        // ===== ERROR HANDLING =====
        window.addEventListener('error', (event) => {
            console.error('Game error:', event.error);
            showToast('Game error occurred. Continuing in safe mode.', 'error');
        });

        // ===== GAME STATISTICS =====
        function showGameStats() {
            const stats = `
                Territories Conquered: ${gameState.territoriesConquered}
                Battles: ${gameState.totalBattles}
                Victories: ${gameState.battlesWon}
                Win Rate: ${gameState.winRate}%
                Current Streak: ${gameState.currentStreak}
                Current Influence: ${gameState.influence}%
            `;
            showToast(stats, 'info');
        }

        // ===== DEBUG MODE =====
        // Press 'D' to show debug info
        document.addEventListener('keydown', (e) => {
            if (e.key === 'd' || e.key === 'D') {
                showGameStats();
            }
        });
    </script>
</body>
</html>
