<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🪙 Coin Flip Pro - XCrazyBet</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Playfair+Display:wght@700&family=Roboto+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --primary-gold: #FFD700;
            --primary-gold-dark: #FFC300;
            --secondary-blue: #4169E1;
            --secondary-blue-dark: #2547C0;
            --accent-emerald: #50C878;
            --danger-red: #DC143C;
            --warning-orange: #FF8C00;
            --success-green: #32CD32;
            --bg-dark: #0A0A0A;
            --bg-medium: #1A1A1A;
            --bg-light: #2A2A2A;
            --text-primary: #FFFFFF;
            --text-secondary: #B0B0B0;
            --text-dim: #888888;
            --coin-glow: rgba(255, 215, 0, 0.3);
            --multiplier-glow: rgba(80, 200, 120, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--bg-dark) 0%, #000000 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            touch-action: manipulation;
        }

        /* Background Particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            background: radial-gradient(circle, var(--primary-gold) 0%, transparent 70%);
            border-radius: 50%;
            animation: float 15s infinite linear;
        }

        /* Main Container */
        .game-container {
            width: 100vw;
            min-height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Bar */
        .top-bar {
            background: rgba(10, 10, 10, 0.95);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary-gold);
            backdrop-filter: blur(10px);
            z-index: 1000;
            position: sticky;
            top: 0;
        }

        .top-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            font-size: 24px;
            color: var(--primary-gold);
            animation: gentlePulse 3s infinite;
        }

        .logo-text {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(45deg, var(--primary-gold), var(--warning-orange));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .balance-display {
            background: linear-gradient(45deg, var(--bg-medium), var(--bg-light));
            padding: 10px 20px;
            border-radius: 12px;
            border: 2px solid var(--primary-gold);
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 16px;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.2);
        }

        .balance-amount {
            color: var(--primary-gold);
            font-weight: 700;
            font-size: 18px;
        }

        /* Recent Winners Feed */
        .winners-feed {
            flex: 1;
            background: rgba(26, 26, 26, 0.8);
            border-radius: 10px;
            padding: 8px 15px;
            margin: 0 15px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            position: relative;
            overflow: hidden;
            max-width: 300px;
        }

        .winners-title {
            font-size: 12px;
            color: var(--text-dim);
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .winners-list {
            height: 24px;
            overflow: hidden;
            position: relative;
        }

        .winner-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2px 0;
            font-size: 12px;
            animation: slideUp 10s infinite linear;
        }

        .winner-name {
            color: var(--text-primary);
            font-weight: 500;
        }

        .winner-amount {
            color: var(--primary-gold);
            font-weight: 600;
        }

        /* Main Game Area */
        .main-game {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        /* Multiplier Display */
        .multiplier-display {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
        }

        .multiplier-label {
            font-size: 14px;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            font-family: 'Roboto Mono', monospace;
        }

        .multiplier-value {
            font-size: 64px;
            font-weight: 800;
            color: var(--primary-gold);
            text-shadow: 0 0 30px var(--coin-glow);
            position: relative;
            display: inline-block;
            min-width: 200px;
        }

        .multiplier-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: 4px solid transparent;
            box-shadow: 0 0 30px var(--multiplier-glow);
            z-index: -1;
        }

        /* Coin Area */
        .coin-area {
            position: relative;
            margin: 30px 0;
        }

        .coin-container {
            position: relative;
            width: 200px;
            height: 200px;
            perspective: 1000px;
        }

        .coin {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s ease-out;
        }

        .coin-face {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 30% 30%, #E8C048, #B8860B);
            box-shadow: 
                inset 0 0 50px rgba(0, 0, 0, 0.5),
                0 10px 30px rgba(0, 0, 0, 0.5);
            border: 8px solid #DAA520;
        }

        .coin-front {
            transform: rotateY(0deg);
        }

        .coin-back {
            transform: rotateY(180deg);
            background: radial-gradient(circle at 30% 30%, #C0C0C0, #808080);
        }

        .coin-symbol {
            font-size: 80px;
            font-weight: 700;
            color: #000;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .coin-glow {
            position: absolute;
            top: -20px;
            left: -20px;
            right: -20px;
            bottom: -20px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--primary-gold) 0%, transparent 70%);
            opacity: 0;
            z-index: -1;
            transition: opacity 0.3s;
        }

        /* Choice Buttons */
        .choice-buttons {
            display: flex;
            gap: 30px;
            margin: 30px 0;
        }

        .choice-btn {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .choice-btn-heads {
            background: linear-gradient(135deg, var(--secondary-blue), var(--secondary-blue-dark));
            color: white;
        }

        .choice-btn-tails {
            background: linear-gradient(135deg, var(--danger-red), #B22222);
            color: white;
        }

        .choice-btn.active {
            transform: scale(1.1);
            box-shadow: 0 0 40px currentColor;
            border: 4px solid white;
        }

        .choice-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        /* Control Panel */
        .control-panel {
            background: rgba(26, 26, 26, 0.9);
            border-radius: 20px;
            padding: 25px;
            border: 2px solid rgba(255, 215, 0, 0.3);
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 800px;
            margin: 20px auto;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        /* Bet Controls */
        .bet-controls {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 20px;
            margin-bottom: 25px;
            align-items: center;
        }

        .bet-input-group {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .bet-input {
            flex: 1;
            padding: 18px;
            background: rgba(10, 10, 10, 0.8);
            border: 3px solid var(--primary-gold);
            border-radius: 15px;
            color: var(--text-primary);
            font-size: 20px;
            font-weight: 600;
            text-align: center;
            font-family: 'Roboto Mono', monospace;
            transition: all 0.3s;
        }

        .bet-input:focus {
            outline: none;
            border-color: var(--accent-emerald);
            box-shadow: 0 0 0 3px rgba(80, 200, 120, 0.2);
        }

        .currency {
            color: var(--primary-gold);
            font-weight: 700;
            font-size: 20px;
        }

        .potential-win {
            text-align: center;
            background: rgba(10, 10, 10, 0.6);
            padding: 15px 25px;
            border-radius: 15px;
            border: 2px solid rgba(80, 200, 120, 0.3);
        }

        .potential-label {
            color: var(--text-dim);
            font-size: 14px;
            margin-bottom: 5px;
        }

        .potential-amount {
            color: var(--accent-emerald);
            font-size: 24px;
            font-weight: 700;
        }

        /* Quick Bets */
        .quick-bets {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }

        .quick-bet {
            padding: 15px;
            background: rgba(10, 10, 10, 0.8);
            border: 2px solid var(--primary-gold);
            border-radius: 10px;
            color: var(--primary-gold);
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 16px;
            position: relative;
            overflow: hidden;
        }

        .quick-bet:hover, .quick-bet.active {
            background: var(--primary-gold);
            color: #000;
            transform: translateY(-3px);
        }

        /* Action Buttons */
        .action-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 20px;
            border: none;
            border-radius: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-gold), var(--primary-gold-dark));
            color: #000;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(255, 215, 0, 0.4);
        }

        .btn-secondary {
            background: linear-gradient(135deg, var(--accent-emerald), #3CB371);
            color: #000;
        }

        .btn-secondary:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(80, 200, 120, 0.4);
        }

        .cashout-btn {
            grid-column: span 2;
            background: linear-gradient(135deg, var(--warning-orange), var(--danger-red));
            color: #000;
            font-size: 22px;
            font-weight: 800;
            padding: 25px;
        }

        .cashout-btn.pulsing {
            animation: dangerPulse 1s infinite;
        }

        /* Game Stats */
        .game-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 20px;
            background: rgba(10, 10, 10, 0.6);
            padding: 15px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-item {
            text-align: center;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        .stat-label {
            color: var(--text-dim);
            font-size: 12px;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            color: var(--text-primary);
            font-size: 18px;
            font-weight: 700;
            font-family: 'Roboto Mono', monospace;
        }

        /* Game History */
        .game-history {
            background: rgba(26, 26, 26, 0.8);
            border-radius: 15px;
            padding: 15px;
            margin-top: 20px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            max-height: 150px;
            overflow-y: auto;
        }

        .history-title {
            font-size: 14px;
            color: var(--primary-gold);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 215, 0, 0.2);
        }

        .history-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .history-item {
            min-width: 60px;
            padding: 8px;
            background: rgba(10, 10, 10, 0.6);
            border-radius: 8px;
            text-align: center;
            font-size: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-family: 'Roboto Mono', monospace;
        }

        .history-item.win {
            background: rgba(80, 200, 120, 0.15);
            border-color: var(--accent-emerald);
            color: var(--accent-emerald);
        }

        .history-item.lose {
            background: rgba(220, 20, 60, 0.15);
            border-color: var(--danger-red);
            color: var(--danger-red);
        }

        /* Result Overlay */
        .result-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .result-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .result-content {
            background: linear-gradient(135deg, rgba(26, 26, 26, 0.95), rgba(10, 10, 10, 0.95));
            padding: 40px;
            border-radius: 25px;
            border: 3px solid var(--primary-gold);
            text-align: center;
            max-width: 400px;
            width: 90%;
            backdrop-filter: blur(20px);
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.3);
            transform: scale(0.9);
            animation: resultAppear 0.5s forwards;
        }

        .result-title {
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .result-win {
            color: var(--primary-gold);
            text-shadow: 0 0 20px var(--coin-glow);
        }

        .result-lose {
            color: var(--danger-red);
            text-shadow: 0 0 20px rgba(220, 20, 60, 0.5);
        }

        .result-details {
            font-size: 20px;
            margin: 20px 0;
            color: var(--text-primary);
        }

        .result-amount {
            font-size: 48px;
            font-weight: 900;
            margin: 25px 0;
            font-family: 'Playfair Display', serif;
        }

        .result-amount.win {
            color: var(--primary-gold);
            text-shadow: 0 0 30px var(--coin-glow);
        }

        .result-amount.lose {
            color: var(--danger-red);
            text-shadow: 0 0 30px rgba(220, 20, 60, 0.5);
        }

        /* Toast Notifications */
        .toast-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 300px;
            width: 90%;
        }

        .toast {
            padding: 15px 20px;
            background: rgba(26, 26, 26, 0.95);
            border-radius: 10px;
            border-left: 4px solid var(--primary-gold);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
            transform: translateY(100%);
            opacity: 0;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
            font-size: 14px;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.success {
            border-color: var(--accent-emerald);
        }

        .toast.error {
            border-color: var(--danger-red);
        }

        .toast.warning {
            border-color: var(--warning-orange);
        }

        /* Bottom Navigation */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            background: rgba(10, 10, 10, 0.95);
            padding: 15px;
            border-top: 1px solid rgba(255, 215, 0, 0.2);
            backdrop-filter: blur(10px);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--text-dim);
            font-size: 12px;
            gap: 5px;
            transition: all 0.3s;
            padding: 8px 15px;
            border-radius: 10px;
        }

        .nav-item i {
            font-size: 20px;
        }

        .nav-item.active {
            color: var(--primary-gold);
            background: rgba(255, 215, 0, 0.1);
        }

        .nav-item:hover {
            color: var(--primary-gold);
            transform: translateY(-2px);
        }

        /* Fullscreen Toggle */
        .fullscreen-toggle {
            position: fixed;
            top: 80px;
            right: 20px;
            width: 45px;
            height: 45px;
            background: rgba(26, 26, 26, 0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
            font-size: 20px;
            cursor: pointer;
            z-index: 1001;
            border: 2px solid var(--primary-gold);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        /* Animations */
        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-1000px) rotate(720deg); opacity: 0; }
        }

        @keyframes gentlePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes slideUp {
            0% { transform: translateY(100%); }
            10% { transform: translateY(0); }
            90% { transform: translateY(0); }
            100% { transform: translateY(-100%); }
        }

        @keyframes dangerPulse {
            0%, 100% { 
                box-shadow: 0 0 0 0 rgba(255, 140, 0, 0.7);
                transform: scale(1);
            }
            50% { 
                box-shadow: 0 0 0 20px rgba(255, 140, 0, 0);
                transform: scale(1.05);
            }
        }

        @keyframes resultAppear {
            to { transform: scale(1); }
        }

        @keyframes coinFlip {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(1800deg); }
        }

        @keyframes multiplierPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50% { transform: translate(-50%, -50%) scale(1.1); opacity: 0.8; }
        }

        @keyframes winExplosion {
            0% { transform: scale(0); opacity: 1; }
            100% { transform: scale(3); opacity: 0; }
        }

        /* Win Animation */
        .win-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1500;
        }

        .win-particle {
            position: absolute;
            width: 20px;
            height: 20px;
            background: radial-gradient(circle, var(--primary-gold) 0%, transparent 70%);
            border-radius: 50%;
            animation: winExplosion 1s ease-out forwards;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .top-bar {
                flex-direction: column;
                gap: 10px;
                padding: 10px;
            }

            .top-left {
                width: 100%;
                justify-content: space-between;
            }

            .winners-feed {
                max-width: 100%;
                margin: 10px 0;
            }

            .multiplier-value {
                font-size: 48px;
            }

            .coin-container {
                width: 150px;
                height: 150px;
            }

            .choice-buttons {
                gap: 15px;
            }

            .choice-btn {
                width: 100px;
                height: 100px;
                font-size: 16px;
            }

            .choice-icon {
                font-size: 30px;
            }

            .bet-controls {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .quick-bets {
                grid-template-columns: repeat(2, 1fr);
            }

            .action-buttons {
                grid-template-columns: 1fr;
            }

            .cashout-btn {
                grid-column: span 1;
            }

            .game-stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 480px) {
            .multiplier-value {
                font-size: 36px;
            }

            .coin-container {
                width: 120px;
                height: 120px;
            }

            .choice-btn {
                width: 80px;
                height: 80px;
                font-size: 14px;
            }

            .choice-icon {
                font-size: 24px;
            }

            .btn {
                padding: 16px;
                font-size: 16px;
            }

            .bet-input {
                padding: 15px;
                font-size: 18px;
            }

            .game-stats {
                grid-template-columns: 1fr;
            }
        }

        /* Loading Spinner */
        .loading {
            display: inline-block;
            width: 24px;

        // ===== INITIALIZATION =====

        // ===== AUTHENTICATION =====

        // ===== BALANCE MANAGEMENT =====
        async function loadBalance() {
            try {
                const db = firebase.firestore();
                const doc = await db.collection("wallets").doc(gameState.currentUser.uid).get();
                
                if (doc.exists) {
                    gameState.balance = doc.data().balance || 0;
                    updateBalanceDisplay();
                    showToast('Welcome to Coin Flip Pro!', 'success');
                    console.log("💰 Balance loaded:", gameState.balance);
                } else {
                    // Create wallet if doesn't exist
                    await db.collection("wallets").doc(gameState.currentUser.uid).set({
                        balance: 100,
                        createdAt: new Date(),
                        updatedAt: new Date()
                    });
                    gameState.balance = 100;
                    updateBalanceDisplay();
                    showToast('New wallet created with $100', 'success');
                }
                
                // Setup real-time balance listener
                setupBalanceListener();
                
            } catch (error) {
                console.error('Error loading balance:', error);
                showToast('Error loading balance', 'error');
            }
        }

        function updateBalanceDisplay() {
            document.getElementById('balance-val').textContent = gameState.balance.toFixed(2);
        }

        // ===== REAL-TIME BALANCE LISTENER =====
        function setupBalanceListener() {
            const db = firebase.firestore();
            const walletRef = db.collection("wallets").doc(gameState.currentUser.uid);
            
            walletRef.onSnapshot((doc) => {
                if (doc.exists) {
                    const newBalance = doc.data().balance || 0;
                    if (newBalance !== gameState.balance) {
                        gameState.balance = newBalance;
                        updateBalanceDisplay();
                        updateBetLimits();
                    }
                }
            }, (error) => {
                console.error('Balance listener error:', error);
            });
        }

        // ===== ATOMIC TRANSACTIONS =====
        async function processTransaction(amount, type, description) {
            try {
                const db = firebase.firestore();
                const walletRef = db.collection("wallets").doc(gameState.currentUser.uid);
                
                return await db.runTransaction(async (transaction) => {
                    const walletDoc = await transaction.get(walletRef);
                    
                    if (!walletDoc.exists) {
                        throw new Error("Wallet not found");
                    }
                    
                    const currentBalance = walletDoc.data().balance || 0;
                    const newBalance = currentBalance + amount;
                    
                    if (newBalance < 0) {
                        throw new Error("Insufficient funds");
                    }
                    
                    // Update main balance
                    transaction.update(walletRef, {
                        balance: newBalance,
                        updatedAt: new Date()
                    });
                    
                    // Record transaction
                    const transactionRef = walletRef.collection("transactions").doc();
                    transaction.set(transactionRef, {
                        type: type,
                        amount: amount,
                        description: description,
                        createdAt: new Date(),
                        gameId: 'coinflip_pro',
                        beforeBalance: currentBalance,
                        afterBalance: newBalance
                    });
                    
                    // Update local balance
                    gameState.balance = newBalance;
                    updateBalanceDisplay();
                    
                    return { success: true, newBalance };
                    
                });
            } catch (error) {
                console.error('Transaction failed:', error);
                showToast('Transaction failed: ' + error.message, 'error');
                return { success: false, error: error.message };
            }
        }

        // ===== GAME FUNCTIONS =====
        function getNextMultiplier() {
            if (gameState.streak >= gameState.multiplierSequence.length) {
                return gameState.multiplierSequence[gameState.multiplierSequence.length - 1];
            }
            return gameState.multiplierSequence[gameState.streak];
        }

        function calculateWinProbability() {
            const streak = gameState.streak + 1;
            const loseChance = gameState.loseProbability[streak] || 0.05;
            
            // Total lose probability: 90%
            // For streak 1: 40% lose, 60% win (appears 50/50)
            // For streak 2: 30% lose, 70% win (encourages continuing)
            // And so on...
            
            return 1 - loseChance;
        }

        async function flipCoin() {
            if (!gameState.selectedChoice) {
                showToast('Please choose Heads or Tails', 'warning');
                return;
            }
            
            const betAmount = parseFloat(document.getElementById('bet-amount').value);
            
            // Validation
            if (betAmount < 1 || betAmount > Math.min(gameState.balance, 1000)) {
                showToast('Invalid bet amount', 'error');
                return;
            }
            
            if (gameState.gameActive) {
                showToast('Game already in progress', 'warning');
                return;
            }
            
            // Disable buttons
            gameState.gameActive = true;
            document.getElementById('flip-btn').disabled = true;
            document.getElementById('heads-btn').disabled = true;
            document.getElementById('tails-btn').disabled = true;
            
            // Process bet transaction
            const result = await processTransaction(
                -betAmount,
                "coinflip_bet",
                `Coin Flip bet of $${betAmount} on ${gameState.selectedChoice}`
            );
            
            if (!result.success) {
                gameState.gameActive = false;
                enableButtons();
                return;
            }
            
            // Set current game
            gameState.currentGame = {
                bet: betAmount,
                choice: gameState.selectedChoice,
                result: null,
                multiplier: getNextMultiplier(),
                winAmount: 0,
                win: false
            };
            
            // Play coin flip sound
            AudioManager.playCoinFlip();
            
            // Animate coin flip
            animateCoinFlip();
            
            // Calculate result after animation
            setTimeout(() => {
                determineResult();
            }, 1500);
        }

        function animateCoinFlip() {
            const coin = document.getElementById('coin');
            const glow = document.getElementById('coin-glow');
            
            // Reset coin position
            coin.style.transform = 'rotateY(0deg)';
            
            // Start glow
            glow.style.opacity = '0.5';
            
            // Animate flip
            coin.style.animation = 'coinFlip 1.5s ease-out forwards';
            
            // Remove animation after completion
            setTimeout(() => {
                coin.style.animation = '';
            }, 1500);
        }

        function determineResult() {
            const winProbability = calculateWinProbability();
            const random = Math.random();
            const isWin = random < winProbability;
            
            // Apply hidden 90% lose system
            let actualResult;
            if (isWin) {
                // Player wins - coin matches their choice
                actualResult = gameState.selectedChoice;
                gameState.currentGame.win = true;
                gameState.currentGame.result = actualResult;
                gameState.currentGame.winAmount = gameState.currentGame.bet * gameState.currentGame.multiplier;
                
                // Increase streak
                gameState.streak++;
                gameState.currentMultiplier = getNextMultiplier();
                
                // Process win transaction
                processTransaction(
                    gameState.currentGame.winAmount,
                    "coinflip_win",
                    `Coin Flip win at ${gameState.currentGame.multiplier.toFixed(2)}x - $${gameState.currentGame.winAmount.toFixed(2)}`
                );
                
                // Update stats
                gameState.totalWon += gameState.currentGame.winAmount;
                gameState.gamesPlayed++;
                
                // Show win
                showWinResult();
            } else {
                // Player loses - coin is opposite of their choice
                actualResult = gameState.selectedChoice === 'heads' ? 'tails' : 'heads';
                gameState.currentGame.win = false;
                gameState.currentGame.result = actualResult;
                gameState.currentGame.winAmount = 0;
                
                // Reset streak
                gameState.streak = 0;
                gameState.currentMultiplier = 1.00;
                
                // Update stats
                gameState.gamesPlayed++;
                
                // Show lose
                showLoseResult();
            }
            
            // Update UI
            updateMultiplierDisplay();
            updateGameStats();
            addToHistory();
            enableButtons();
            
            // If auto mode is on, continue
            if (gameState.autoMode && gameState.balance > 0) {
                setTimeout(() => {
                    if (gameState.autoMode) {
                        flipCoin();
                    }
                }, 2000);
            }
        }

        // ===== UI FUNCTIONS =====
        function updateMultiplierDisplay() {
            document.getElementById('multiplier-value').textContent = gameState.currentMultiplier.toFixed(2) + 'x';
            
            // Update multiplier ring
            const ring = document.getElementById('multiplier-ring');
            const maxMultiplier = gameState.multiplierSequence[gameState.multiplierSequence.length - 1];
            const progress = gameState.currentMultiplier / maxMultiplier;
            
            // Update color based on risk level
            let ringColor;
            if (gameState.currentMultiplier < 2) {
                ringColor = 'rgba(80, 200, 120, 0.4)'; // Green (safe)
            } else if (gameState.currentMultiplier < 5) {
                ringColor = 'rgba(255, 215, 0, 0.4)'; // Yellow (warning)
            } else if (gameState.currentMultiplier < 10) {
                ringColor = 'rgba(255, 140, 0, 0.4)'; // Orange (danger)
            } else {
                ringColor = 'rgba(220, 20, 60, 0.4)'; // Red (high danger)
            }
            
            ring.style.borderColor = ringColor;
            ring.style.boxShadow = `0 0 ${20 + progress * 50}px ${ringColor}`;
            ring.style.width = `${150 + progress * 100}px`;
            ring.style.height = `${150 + progress * 100}px`;
        }

        function updatePotentialWin() {
            const betAmount = parseFloat(document.getElementById('bet-amount').value) || 0;
            const multiplier = gameState.currentMultiplier;
            const potentialWin = (betAmount * multiplier).toFixed(2);
            document.getElementById('potential-win').textContent = `$${potentialWin}`;

            const betInput = document.getElementById('bet-amount');
            const maxBet = Math.min(gameState.balance, 1000);
            betInput.max = maxBet;
            
            if (parseFloat(betInput.value) > maxBet) {
                betInput.value = maxBet;
                gameState.betAmount = maxBet;

            updatePotentialWin();

            document.getElementById('streak-count').textContent = gameState.streak;

            document.getElementById('games-played').textContent = gameState.gamesPlayed;

        function addToHistory() {
            const historyList = document.getElementById('history-list');
            const historyItem = document.createElement('div');
            historyItem.className = `history-item ${gameState.currentGame.win ? 'win' : 'lose'}`;
            
            const choice = gameState.currentGame.choice === 'heads' ? 'H' : 'T';
            const result = gameState.currentGame.result === 'heads' ? 'H' : 'T';
            const amount = gameState.currentGame.win ? `+$${gameState.currentGame.winAmount.toFixed(0)}` : `-$${gameState.currentGame.bet.toFixed(0)}`;
            
            historyItem.textContent = `${choice}→${result} ${amount}`;
            historyList.appendChild(historyItem);
            
            // Keep only last 10 items
            if (historyList.children.length > 10) {
                historyList.removeChild(historyList.firstChild);
            }
        }

        // ===== FAKE WINNERS SYSTEM (Social Proof) =====
        function generateFakeWinners() {
            const winnersList = document.getElementById('winners-list');
            
            // Clear existing
            winnersList.innerHTML = '';
            
            // Generate 5 fake winners
            for (let i = 0; i < 5; i++) {
                const winner = createFakeWinner();
                winnersList.appendChild(winner);
            }
            
            // Start animation
            startWinnersAnimation();
        }

        function createFakeWinner() {
            const winnerItem = document.createElement('div');
            winnerItem.className = 'winner-item';
            
            const randomName = gameState.playerNames[Math.floor(Math.random() * gameState.playerNames.length)];
            const randomAmount = gameState.winAmounts[Math.floor(Math.random() * gameState.winAmounts.length)];
            
            winnerItem.innerHTML = `
                <span class="winner-name">${randomName}</span>
                <span class="winner-amount">$${randomAmount}</span>
            `;
            
            return winnerItem;
        }

        function addFakeWinner() {
            const winnersList = document.getElementById('winners-list');
            const newWinner = createFakeWinner();
            
            // Add to the end (will animate in)
            winnersList.appendChild(newWinner);
            
            // Keep only 5 items
            if (winnersList.children.length > 5) {
                winnersList.removeChild(winnersList.firstChild);
            }
        }

        function startWinnersAnimation() {
            const winnersList = document.getElementById('winners-list');
            const items = winnersList.children;
            const itemHeight = 24;
            
            // Calculate total height and animation duration
            const totalHeight = items.length * itemHeight;
            const duration = items.length * 2; // 2 seconds per item
            
            winnersList.style.height = `${itemHeight}px`;
            winnersList.style.animation = `slideUp ${duration}s infinite linear`;
        }

        // ===== PARTICLES SYSTEM =====
        function setupParticles() {
            const particlesContainer = document.getElementById('particles');
            
            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                
                // Random properties
                const size = Math.random() * 4 + 1;
                const posX = Math.random() * 100;
                const delay = Math.random() * 15;
                const duration = Math.random() * 10 + 15;
                
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${posX}%`;
                particle.style.bottom = `-20px`;
                particle.style.animationDelay = `${delay}s`;
                particle.style.animationDuration = `${duration}s`;
                particle.style.opacity = Math.random() * 0.3 + 0.1;
                
                particlesContainer.appendChild(particle);
            }
        }

        function createWinParticles() {
            const particlesContainer = document.getElementById('win-particles');
            
            // Clear existing particles
            particlesContainer.innerHTML = '';
            
            // Create 20 explosion particles
            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.className = 'win-particle';
                
                // Random properties
                const size = Math.random() * 15 + 5;
                const posX = Math.random() * 100;
                const posY = Math.random() * 100;
                const delay = Math.random() * 0.5;
                const duration = Math.random() * 0.5 + 0.5;
                
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${posX}%`;
                particle.style.top = `${posY}%`;
                particle.style.animationDelay = `${delay}s`;
                particle.style.animationDuration = `${duration}s`;
                
                particlesContainer.appendChild(particle);
            }
            
            // Remove particles after animation
            setTimeout(() => {
                particlesContainer.innerHTML = '';
            }, 1500);
        }

        // ===== FULLSCREEN FUNCTIONS =====
        function setupFullscreen() {
            const toggleBtn = document.getElementById('fullscreen-toggle');
            
            toggleBtn.addEventListener('click', () => {
                const container = document.getElementById('game-container');
                
                if (!document.fullscreenElement) {
                    if (container.requestFullscreen) {
                        container.requestFullscreen();
                    } else if (container.webkitRequestFullscreen) {
                        container.webkitRequestFullscreen();
                    }
                    toggleBtn.innerHTML = '<i class="fas fa-compress"></i>';
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    } else if (document.webkitExitFullscreen) {
                        document.webkitExitFullscreen();
                    }
                    toggleBtn.innerHTML = '<i class="fas fa-expand"></i>';
                }
            });
            
            // Update button on fullscreen change
            document.addEventListener('fullscreenchange', updateFullscreenButton);
            document.addEventListener('webkitfullscreenchange', updateFullscreenButton);
        }
        
        function updateFullscreenButton() {
            const toggleBtn = document.getElementById('fullscreen-toggle');
            toggleBtn.innerHTML = document.fullscreenElement 
                ? '<i class="fas fa-compress"></i>' 
                : '<i class="fas fa-expand"></i>';
        }

        // ===== EVENT LISTENERS =====
        function setupEventListeners() {
            console.log("Setting up event listeners...");
            
            // Choice buttons
            document.getElementById('heads-btn').addEventListener('click', () => {
                AudioManager.playButton();
                gameState.selectedChoice = 'heads';
                document.getElementById('heads-btn').classList.add('active');
                document.getElementById('tails-btn').classList.remove('active');
            });
            
            document.getElementById('tails-btn').addEventListener('click', () => {
                AudioManager.playButton();
                gameState.selectedChoice = 'tails';
                document.getElementById('tails-btn').classList.add('active');
                document.getElementById('heads-btn').classList.remove('active');
            });
            
            // Flip button
            document.getElementById('flip-btn').addEventListener('click', flipCoin);
            
            // Cashout button
            document.getElementById('cashout-btn').addEventListener('click', cashout);
            
            // Auto button
            document.getElementById('auto-btn').addEventListener('click', () => {
                AudioManager.playButton();
                gameState.autoMode = !gameState.autoMode;
                const autoBtn = document.getElementById('auto-btn');
                
                if (gameState.autoMode) {
                    autoBtn.innerHTML = '<i class="fas fa-stop"></i> STOP AUTO';
                    autoBtn.classList.add('pulsing');
                    showToast('Auto mode enabled', 'info');
                    
                    // Start auto flipping if choice is selected
                    if (gameState.selectedChoice && !gameState.gameActive) {
                        setTimeout(() => flipCoin(), 1000);
                    }
                } else {
                    autoBtn.innerHTML = '<i class="fas fa-robot"></i> AUTO FLIP';
                    autoBtn.classList.remove('pulsing');
                    showToast('Auto mode disabled', 'info');
                }
            });
            
            // Play again button
            document.getElementById('play-again-btn').addEventListener('click', () => {
                document.getElementById('result-overlay').classList.remove('show');
                AudioManager.playButton();
            });
            
            // Quick bet buttons
            document.querySelectorAll('.quick-bet').forEach(btn => {
                btn.addEventListener('click', () => {
                    AudioManager.playButton();
                    const amount = parseFloat(btn.dataset.amount);
                    document.getElementById('bet-amount').value = amount;
                    gameState.betAmount = amount;
                    updatePotentialWin();
                    
                    // Visual feedback
                    document.querySelectorAll('.quick-bet').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                });
            });
            
            // Bet input
            document.getElementById('bet-amount').addEventListener('input', (e) => {
                let value = parseFloat(e.target.value) || 1;
                value = Math.max(1, Math.min(value, Math.min(gameState.balance, 1000)));
                e.target.value = value;
                gameState.betAmount = value;
                updatePotentialWin();
                
                // Update quick bet selection
                document.querySelectorAll('.quick-bet').forEach(btn => {
                    btn.classList.toggle('active', parseFloat(btn.dataset.amount) === value);
                });
            });
            
            // Enter key to flip
            document.getElementById('bet-amount').addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && !gameState.gameActive && gameState.selectedChoice) {
                    flipCoin();
                }
            });
            
            // Keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                // H for heads
                if (e.key === 'h' || e.key === 'H') {
                    e.preventDefault();
                    document.getElementById('heads-btn').click();
                }
                // T for tails
                if (e.key === 't' || e.key === 'T') {
                    e.preventDefault();
                    document.getElementById('tails-btn').click();
                }
                // Space to flip
                if (e.code === 'Space' && !gameState.gameActive && gameState.selectedChoice) {
                    e.preventDefault();
                    flipCoin();
                }
                // C for cashout
                if (e.code === 'KeyC' && !gameState.gameActive && gameState.streak > 0) {
                    e.preventDefault();
                    cashout();
                }
            });
            
            console.log("✅ Event listeners setup complete!");
        }

        // ===== TOAST NOTIFICATIONS =====
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.add('show');
            }, 10);
            
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => {
                    if (container.contains(toast)) {
                        container.removeChild(toast);
                    }
                }, 300);
            }, 3000);
        }

        // ===== INITIAL SETUP =====
        // Update UI when balance is loaded
        setTimeout(() => {
            if (gameState.balance > 0) {
                updateBetLimits();
                showToast('Welcome to Coin Flip Pro! Choose Heads or Tails and start flipping!', 'success');
            }
        }, 2000);

        console.log("🪙 Coin Flip Pro Ready!");
        console.log("💰 Real Money Integration: ACTIVE");
        console.log("🎯 90% Lose Rate System: ACTIVE");
        console.log("👥 Fake Winners System: ACTIVE");
        console.log("🚀 Premium Features: ALL ENABLED");
    </script>
