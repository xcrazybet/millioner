<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🍀 Lucky Draw - XCrazyBet</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --primary: #FFD700;
            --primary-dark: #FFC300;
            --secondary: #FF6B6B;
            --success: #4CAF50;
            --danger: #FF5252;
            --warning: #FF9800;
            --info: #2196F3;
            --bg: #0A0E17;
            --surface: #1A1F2E;
            --surface-light: #2A2F3E;
            --text: #FFFFFF;
            --text-dim: #B0B8D0;
            --gold-gradient: linear-gradient(135deg, #FFD700, #FFA500);
            --silver-gradient: linear-gradient(135deg, #C0C0C0, #A0A0A0);
            --bronze-gradient: linear-gradient(135deg, #CD7F32, #8B4513);
            --jackpot-glow: radial-gradient(circle, rgba(255,215,0,0.3) 0%, transparent 70%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Segoe UI', 'Montserrat', 'Roboto', system-ui, sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            touch-action: manipulation;
        }

        /* Background Effects */
        .bg-effects {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255, 215, 0, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(255, 107, 107, 0.08) 0%, transparent 50%),
                linear-gradient(135deg, #0A0E17 0%, #1A1F2E 100%);
        }

        /* Particle Background */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        /* Game Container */
        .game-container {
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        .game-header {
            background: rgba(26, 31, 46, 0.95);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
            backdrop-filter: blur(10px);
            z-index: 1000;
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .home-btn {
            width: 40px;
            height: 40px;
            background: var(--primary);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #000;
            font-size: 20px;
            transition: all 0.3s;
        }

        .home-btn:hover {
            background: var(--primary-dark);
            transform: scale(1.1);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            font-size: 28px;
            color: var(--primary);
            animation: glow 2s infinite alternate;
        }

        .logo-text {
            font-size: 22px;
            font-weight: 800;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        .balance-display {
            background: linear-gradient(45deg, rgba(26, 31, 46, 0.9), rgba(42, 47, 62, 0.9));
            padding: 10px 20px;
            border-radius: 15px;
            border: 2px solid var(--primary);
            color: var(--primary);
            font-weight: 800;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        /* Jackpot Display */
        .jackpot-display {
            background: linear-gradient(90deg, #1a1f2e, #2a2f3e);
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 215, 0, 0.2);
        }

        .jackpot-label {
            font-size: 14px;
            color: var(--text-dim);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .jackpot-value {
            font-size: 32px;
            font-weight: 900;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
        }

        /* Timer */
        .timer-display {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
            font-size: 14px;
            color: var(--text-dim);
        }

        .timer-value {
            background: var(--surface);
            padding: 5px 15px;
            border-radius: 20px;
            color: var(--primary);
            font-weight: 700;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        /* Game Area */
        .game-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 20px;
            overflow-y: auto;
        }

        /* Draw Chamber */
        .draw-chamber-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            min-height: 300px;
        }

        .draw-chamber {
            width: 280px;
            height: 280px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255, 215, 0, 0.1), transparent 70%);
            border: 3px solid rgba(255, 215, 0, 0.3);
            position: relative;
            overflow: hidden;
            box-shadow: 
                0 0 50px rgba(255, 215, 0, 0.2),
                inset 0 0 50px rgba(0, 0, 0, 0.5);
        }

        .chamber-glass {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 40%, transparent 30%, rgba(255, 255, 255, 0.05) 70%);
            z-index: 1;
        }

        .tickets-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        .ticket {
            position: absolute;
            width: 40px;
            height: 60px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: #000;
            font-size: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            transform-origin: center;
            transition: all 0.3s;
            border: 2px solid rgba(255, 255, 255, 0.3);
            cursor: pointer;
        }

        .ticket.winner {
            animation: winnerGlow 1s infinite alternate;
            z-index: 10;
        }

        .ticket.user-ticket {
            border: 3px solid #FF6B6B;
            box-shadow: 0 0 20px rgba(255, 107, 107, 0.5);
        }

        .spotlight {
            position: absolute;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.3), transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
            z-index: 3;
        }

        /* Control Panel */
        .control-panel {
            background: rgba(26, 31, 46, 0.95);
            border-radius: 20px;
            padding: 20px;
            border: 2px solid rgba(255, 215, 0, 0.2);
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        /* Ticket Purchase */
        .ticket-purchase {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .ticket-option {
            padding: 15px;
            background: linear-gradient(135deg, var(--surface), var(--surface-light));
            border-radius: 12px;
            border: 2px solid rgba(255, 215, 0, 0.3);
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .ticket-option:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
            box-shadow: 0 10px 20px rgba(255, 215, 0, 0.2);
        }

        .ticket-option.active {
            background: var(--gold-gradient);
            border-color: var(--primary);
            transform: translateY(-5px);
        }

        .ticket-option.active .ticket-price {
            color: #000;
            font-weight: 900;
        }

        .ticket-icon {
            font-size: 24px;
            color: var(--primary);
        }

        .ticket-option.active .ticket-icon {
            color: #000;
        }

        .ticket-price {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
        }

        .ticket-count {
            font-size: 12px;
            color: var(--text-dim);
        }

        /* Action Button */
        .action-button {
            width: 100%;
            padding: 20px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: none;
            border-radius: 15px;
            color: #000;
            font-size: 24px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .action-button:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(255, 215, 0, 0.4);
        }

        .action-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        /* Recent Winners */
        .recent-winners {
            background: rgba(42, 47, 62, 0.8);
            border-radius: 15px;
            padding: 15px;
            margin-top: 20px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            max-height: 200px;
            overflow-y: auto;
        }

        .winners-title {
            font-size: 16px;
            color: var(--primary);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 215, 0, 0.2);
        }

        .winners-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .winner-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: rgba(26, 31, 46, 0.6);
            border-radius: 10px;
            border-left: 4px solid var(--primary);
            animation: slideIn 0.5s ease-out;
        }

        .winner-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .winner-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: var(--gold-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #000;
            font-weight: 700;
        }

        .winner-name {
            font-weight: 600;
            color: var(--text);
        }

        .winner-amount {
            color: var(--primary);
            font-weight: 800;
            font-size: 16px;
        }

        .winner-time {
            font-size: 12px;
            color: var(--text-dim);
        }

        /* Game History */
        .game-history {
            background: rgba(42, 47, 62, 0.8);
            border-radius: 15px;
            padding: 15px;
            margin-top: 15px;
            border: 1px solid rgba(255, 107, 107, 0.2);
            max-height: 150px;
            overflow-y: auto;
        }

        .history-title {
            font-size: 16px;
            color: var(--secondary);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 107, 107, 0.2);
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: rgba(26, 31, 46, 0.6);
            border-radius: 8px;
            font-size: 14px;
        }

        .history-item.win {
            border-left: 4px solid var(--primary);
        }

        .history-item.lose {
            border-left: 4px solid var(--danger);
        }

        .history-result {
            font-weight: 700;
        }

        .history-result.win {
            color: var(--primary);
        }

        .history-result.lose {
            color: var(--danger);
        }

        /* Result Overlay */
        .result-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 14, 23, 0.98);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .result-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .result-content {
            background: linear-gradient(135deg, #1A1F2E, #2A2F3E);
            padding: 40px;
            border-radius: 30px;
            border: 4px solid var(--primary);
            text-align: center;
            max-width: 400px;
            width: 90%;
            backdrop-filter: blur(20px);
            box-shadow: 
                0 0 60px rgba(255, 215, 0, 0.4),
                inset 0 0 30px rgba(255, 215, 0, 0.1);
            animation: resultAppear 0.5s ease-out;
        }

        .result-icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: bounce 1s infinite alternate;
        }

        .result-title {
            font-size: 36px;
            font-weight: 900;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .result-title.win {
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .result-title.lose {
            color: var(--danger);
        }

        .result-details {
            font-size: 18px;
            color: var(--text-dim);
            margin-bottom: 10px;
        }

        .result-amount {
            font-size: 48px;
            font-weight: 900;
            margin: 20px 0;
            color: var(--primary);
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.7);
        }

        .result-amount.lose {
            color: var(--danger);
            text-shadow: 0 0 30px rgba(255, 82, 82, 0.7);
        }

        /* Fullscreen Toggle */
        .fullscreen-toggle {
            position: fixed;
            top: 80px;
            right: 20px;
            width: 45px;
            height: 45px;
            background: rgba(26, 31, 46, 0.9);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            font-size: 20px;
            cursor: pointer;
            z-index: 1001;
            border: 2px solid var(--primary);
            transition: all 0.3s;
        }

        .fullscreen-toggle:hover {
            background: var(--primary);
            color: #000;
        }

        /* Confetti */
        .confetti-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1500;
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 20px;
            background: var(--gold-gradient);
            opacity: 0;
        }

        /* Toast Notifications */
        .toast-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 300px;
            width: 90%;
        }

        .toast {
            padding: 15px 20px;
            background: rgba(26, 31, 46, 0.95);
            border-radius: 12px;
            border-left: 5px solid var(--primary);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            transform: translateY(100%);
            opacity: 0;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
            font-size: 14px;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.success {
            border-color: var(--primary);
        }

        .toast.error {
            border-color: var(--danger);
        }

        .toast.warning {
            border-color: var(--warning);
        }

        /* Animations */
        @keyframes glow {
            0% { filter: drop-shadow(0 0 5px rgba(255, 215, 0, 0.5)); }
            100% { filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.8)); }
        }

        @keyframes winnerGlow {
            0% { 
                transform: scale(1);
                box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            }
            100% { 
                transform: scale(1.1);
                box-shadow: 0 0 40px rgba(255, 215, 0, 0.8);
            }
        }

        @keyframes slideIn {
            from { transform: translateX(-100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes resultAppear {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        @keyframes ticketFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(5deg); }
        }

        @keyframes chamberRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .game-header {
                flex-direction: column;
                gap: 10px;
                padding: 10px;
            }

            .header-left {
                width: 100%;
                justify-content: space-between;
            }

            .balance-display {
                width: 100%;
                justify-content: center;
            }

            .draw-chamber {
                width: 240px;
                height: 240px;
            }

            .ticket {
                width: 35px;
                height: 50px;
                font-size: 16px;
            }

            .ticket-purchase {
                grid-template-columns: repeat(2, 1fr);
            }

            .action-button {
                padding: 18px;
                font-size: 20px;
            }

            .jackpot-value {
                font-size: 28px;
            }

            .result-content {
                padding: 30px 20px;
            }

            .result-title {
                font-size: 28px;
            }

            .result-amount {
                font-size: 36px;
            }
        }

        @media (max-width: 480px) {
            .draw-chamber {
                width: 200px;
                height: 200px;
            }

            .ticket {
                width: 30px;
                height: 45px;
                font-size: 14px;
            }

            .ticket-purchase {
                grid-template-columns: 1fr;
            }

            .jackpot-value {
                font-size: 24px;
            }

            .result-icon {
                font-size: 60px;
            }

            .result-title {
                font-size: 24px;
            }

            .result-amount {
                font-size: 32px;
            }
        }

        /* Loading */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 215, 0, 0.3);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Touch Optimizations */
        .touch-button {
            min-height: 44px;
            min-width: 44px;
        }

        /* Games Button */
        .games-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-size: 24px;
            text-decoration: none;
            z-index: 1001;
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.3);
            transition: all 0.3s;
        }

        .games-button:hover {
            transform: scale(1.1) rotate(15deg);
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.5);
        }
    </style>
</head>
<body>
    <!-- Background Effects -->
    <div class="bg-effects"></div>
    <div class="particles" id="particles"></div>

    <!-- Fullscreen Toggle -->
    <div class="fullscreen-toggle" id="fullscreen-toggle" title="Toggle Fullscreen">
        <i class="fas fa-expand"></i>
    </div>

    <!-- Games Button -->
    <a href="https://xcrazybet.github.io/millioner/games.html" class="games-button" title="All Games">
        <i class="fas fa-gamepad"></i>
    </a>

    <!-- Game Container -->
    <div class="game-container" id="game-container">
        <!-- Header -->
        <header class="game-header">
            <div class="header-left">
                <a href="https://xcrazybet.github.io/millioner" class="home-btn" title="Return to Home">
                    <i class="fas fa-home"></i>
                </a>
                <div class="logo">
                    <div class="logo-icon">🍀</div>
                    <div class="logo-text">LUCKY DRAW</div>
                </div>
            </div>
            <div class="balance-display">
                <i class="fas fa-wallet"></i>
                $<span id="balance-val">0.00</span>
            </div>
        </header>

        <!-- Jackpot Display -->
        <div class="jackpot-display">
            <div class="jackpot-label">Current Jackpot</div>
            <div class="jackpot-value" id="jackpot-value">$5,000</div>
            <div class="timer-display">
                <i class="fas fa-clock"></i>
                Next Draw: <span class="timer-value" id="timer-value">1:45</span>
            </div>
        </div>

        <!-- Game Area -->
        <div class="game-area">
            <!-- Draw Chamber -->
            <div class="draw-chamber-container">
                <div class="draw-chamber" id="draw-chamber">

            walletRef.onSnapshot((doc) => {
                if (doc.exists) {
                    const newBalance = doc.data().balance || 0;

                        gameState.balance = newBalance;
                        updateBalanceDisplay();
                    }
                }
            }, (error) => {

            });

        // ===== ATOMIC TRANSACTIONS =====
        async function processTransaction(amount, type, description) {
            try {
                const db = firebase.firestore();
                const auth = firebase.auth();
                const walletRef = db.collection("wallets").doc(gameState.currentUser.uid);
                
                return await db.runTransaction(async (transaction) => {
                    const walletDoc = await transaction.get(walletRef);
                    
                    if (!walletDoc.exists) {
                        throw new Error("Wallet not found");
                    }
                    
                    const currentBalance = walletDoc.data().balance || 0;
                    const newBalance = currentBalance + amount;
                    
                    if (newBalance < 0) {
                        throw new Error("Insufficient funds");
                    }
                    
                    // Update main balance
                    transaction.update(walletRef, {
                        balance: newBalance,
                        updatedAt: new Date()
                    });
                    
                    // Record transaction
                    const transactionRef = walletRef.collection("transactions").doc();
                    transaction.set(transactionRef, {
                        type: type,
                        amount: amount,
                        description: description,
                        createdAt: new Date(),
                        gameId: 'lucky_draw',
                        beforeBalance: currentBalance,
                        afterBalance: newBalance
                    });
                    
                    // Update local balance
                    gameState.balance = newBalance;
                    updateBalanceDisplay();
                    
                    return { success: true, newBalance };
                    
                });
            } catch (error) {
                console.error('Transaction failed:', error);
                showToast('Transaction failed: ' + error.message, 'error');
                return { success: false, error: error.message };
            }
        }

            if (gameState.drawActive) {
                showToast('Draw already in progress', 'warning');

            // Process transaction
            const result = await processTransaction(

            if (!result.success) {

        function createTickets(count) {
            gameState.tickets = [];
            const container = document.getElementById('tickets-container');
            container.innerHTML = '';
            
            // Create user tickets
            for (let i = 0; i < count; i++) {

                ticket.style.animationDelay = `${i * 0.1}s`;
                ticket.classList.add('animate__animated', 'animate__bounceIn');
                
                container.appendChild(ticket);
                gameState.tickets.push({
                    element: ticket,
                    isUser: true,
                    id: `user_${i}`
                });
            }
            
            // Create fake player tickets
            for (let i = 0; i < gameState.fakePlayers; i++) {
                const ticket = document.createElement('div');
                ticket.className = 'ticket';
                ticket.textContent = '🎫';
                ticket.style.left = `${Math.random() * 80 + 10}%`;
                ticket.style.top = `${Math.random() * 80 + 10}%`;
                ticket.style.transform = `rotate(${Math.random() * 360}deg)`;
                ticket.style.animationDelay = `${(count + i) * 0.1}s`;
                ticket.classList.add('animate__animated', 'animate__bounceIn');
                
                container.appendChild(ticket);
                gameState.tickets.push({
                    element: ticket,
                    isUser: false,
                    id: `fake_${i}`,
                    name: gameState.winnerNames[Math.floor(Math.random() * gameState.winnerNames.length)]
                });

                setTimeout(() => {
                    ticket.element.style.animation = 'ticketFloat 3s infinite ease-in-out';
                }, index * 50);
            });

        function startDraw() {
            gameState.drawActive = true;
            SoundManager.play('draw-sound');
            
            // Animate chamber rotation
            const chamber = document.getElementById('draw-chamber');
            chamber.style.animation = 'chamberRotate 10s linear infinite';
            
            // Start countdown
            let countdown = 10;
            const countdownInterval = setInterval(() => {
                if (countdown === 0) {
                    clearInterval(countdownInterval);
                    selectWinner();
                    return;
                }
                countdown--;
            }, 1000);
            
            showToast('🎪 Draw started! Good luck!', 'warning');

        function selectWinner() {
            const chamber = document.getElementById('draw-chamber');
            chamber.style.animation = '';
            
            // Apply house edge (85-90% lose rate)
            const random = Math.random();
            let winnerType;
            
            if (random < gameState.winRates.noWin) {
                winnerType = 'noWin'; // 85% chance
            } else if (random < gameState.winRates.noWin + gameState.winRates.smallWin) {
                winnerType = 'smallWin'; // 10% chance
            } else if (random < gameState.winRates.noWin + gameState.winRates.smallWin + gameState.winRates.bigWin) {
                winnerType = 'bigWin'; // 4% chance
            } else {
                winnerType = 'jackpot'; // 1% chance
            }
            
            // Select winner based on type
            let winnerTicket;
            if (winnerType === 'noWin') {
                // User loses, fake player wins
                winnerTicket = gameState.tickets.find(t => !t.isUser);
            } else {
                // User wins
                winnerTicket = gameState.tickets.find(t => t.isUser);
            }
            
            if (!winnerTicket) {
                winnerTicket = gameState.tickets[0];
            }
            
            // Highlight winner
            highlightWinner(winnerTicket);
            
            // Calculate win amount
            let winAmount = 0;
            let multiplier = 1;
            
            switch (winnerType) {
                case 'smallWin':
                    multiplier = 1.5 + Math.random() * 1.5; // 1.5-3x
                    break;
                case 'bigWin':
                    multiplier = 5 + Math.random() * 5; // 5-10x
                    break;
                case 'jackpot':
                    multiplier = 50 + Math.random() * 50; // 50-100x
                    break;
            }
            
            winAmount = gameState.ticketPrice * multiplier;
            
            // Animate spotlight
            const spotlight = document.getElementById('spotlight');
            const rect = winnerTicket.element.getBoundingClientRect();
            const chamberRect = document.getElementById('draw-chamber').getBoundingClientRect();
            
            spotlight.style.left = `${rect.left - chamberRect.left + rect.width/2 - 50}px`;
            spotlight.style.top = `${rect.top - chamberRect.top + rect.height/2 - 50}px`;
            spotlight.style.opacity = '1';
            
            // Add winner glow
            winnerTicket.element.classList.add('winner');
            
            // Wait 2 seconds then show result
            setTimeout(() => {
                showResult(winnerTicket, winAmount, winnerType === 'noWin');
                
                // Record in history
                recordGameResult(winnerTicket.isUser, winAmount);
                
                // Add to recent winners if user won
                if (winnerTicket.isUser) {
                    addToRecentWinners(winAmount);
                    awardWinnings(winAmount);
                } else {
                    // Add fake winner to recent winners
                    addFakeWinner();
                }
                
                // Reset for next draw
                setTimeout(() => {
                    resetDraw();
                }, 5000);
                
            }, 2000);
        }

        function highlightWinner(ticket) {
            // Move all tickets to background
            gameState.tickets.forEach(t => {
                t.element.style.zIndex = '1';
                t.element.style.transform = 'scale(0.8)';

            // Move winner to center
            const chamber = document.getElementById('draw-chamber');
            const chamberWidth = chamber.offsetWidth;

            ticket.element.style.top = `${chamberHeight/2 - 30}px`;

            clearInterval(gameState.timerInterval);
            
            gameState.timerInterval = setInterval(() => {
                const now = Date.now();
                const timeLeft = Math.max(0, gameState.nextDrawTime - now);
                
                if (timeLeft <= 0) {
                    // Reset timer for next draw
                    gameState.nextDrawTime = Date.now() + 105000; // 1:45
                    if (!gameState.drawActive) {
                        showToast('🎪 New draw available!', 'warning');
                    }
                }
                
                const minutes = Math.floor(timeLeft / 60000);
                const seconds = Math.floor((timeLeft % 60000) / 1000);
                
                document.getElementById('timer-value').textContent = 
                    `${minutes}:${seconds.toString().padStart(2, '0')}`;
                    
            }, 1000);
        }

                        gameState.currentUser.email.split('@')[0] || 
                        'You';
            const timeAgo = 'Just now';
            
            addWinnerToList(name, amount, timeAgo, true);
            
            // Also save to Firebase
            saveWinnerToFirebase(name, amount);
        }

        function addWinnerToList(name, amount, timeAgo, isUser = false) {
            const winnersList = document.getElementById('winners-list');
            const winnerItem = document.createElement('div');
            winnerItem.className = 'winner-item';
            if (isUser) winnerItem.classList.add('user-winner');
            
            const avatarText = name.charAt(0).toUpperCase();
            
            winnerItem.innerHTML = `
                <div class="winner-info">
                    <div class="winner-avatar">${avatarText}</div>
                    <div>
                        <div class="winner-name">${name}</div>
                        <div class="winner-time">${timeAgo}</div>
                    </div>
                </div>
                <div class="winner-amount">$ ${amount.toLocaleString()}</div>
            `;
            
            winnersList.insertBefore(winnerItem, winnersList.firstChild);
            
            // Limit to 10 winners
            if (winnersList.children.length > 10) {
                winnersList.removeChild(winnersList.lastChild);
            }
            
            // Add animation
            winnerItem.classList.add('animate__animated', 'animate__fadeIn');
            setTimeout(() => {
                winnerItem.classList.remove('animate__animated', 'animate__fadeIn');
            }, 1000);
        }

        async function saveWinnerToFirebase(name, amount) {
            try {
                const db = firebase.firestore();
                await db.collection('lucky_draw_winners').add({
                    userId: gameState.currentUser.uid,
                    name: name,
                    amount: amount,
                    timestamp: new Date(),
                    gameId: 'lucky_draw'
                });
            } catch (error) {
                console.error('Error saving winner:', error);
            }
        }

        // ===== GAME HISTORY =====
        function recordGameResult(isWin, amount) {
            const historyList = document.getElementById('history-list');
            const historyItem = document.createElement('div');
            
            historyItem.className = `history-item ${isWin ? 'win' : 'lose'}`;
            historyItem.innerHTML = `
                <span>Lucky Draw #${gameState.gameHistory.length + 1}</span>
                <span class="history-result ${isWin ? 'win' : 'lose'}">
                    ${isWin ? '+$' + amount.toFixed(2) : '-$' + gameState.ticketPrice.toFixed(2)}
                </span>
            `;
            
            historyList.insertBefore(historyItem, historyList.firstChild);
            
            // Limit to 10 history items
            if (historyList.children.length > 10) {
                historyList.removeChild(historyList.lastChild);
            }
            
            // Save to game state
            gameState.gameHistory.push({
                isWin: isWin,
                amount: amount,
                ticketPrice: gameState.ticketPrice,
                timestamp: new Date()
            });
            
            // Save to Firebase
            saveHistoryToFirebase(isWin, amount);
        }

        async function loadUserHistory() {
            try {
                const db = firebase.firestore();
                const snapshot = await db.collection('lucky_draw_history')
                    .where('userId', '==', gameState.currentUser.uid)
                    .orderBy('timestamp', 'desc')
                    .limit(10)
                    .get();
                
                const historyList = document.getElementById('history-list');
                historyList.innerHTML = '';
                
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const historyItem = document.createElement('div');
                    
                    historyItem.className = `history-item ${data.isWin ? 'win' : 'lose'}`;
                    historyItem.innerHTML = `
                        <span>Lucky Draw</span>
                        <span class="history-result ${data.isWin ? 'win' : 'lose'}">
                            ${data.isWin ? '+$' + data.amount.toFixed(2) : '-$' + data.ticketPrice.toFixed(2)}
                        </span>
                    `;
                    
                    historyList.appendChild(historyItem);
                    
                    gameState.gameHistory.push({
                        isWin: data.isWin,
                        amount: data.amount,
                        ticketPrice: data.ticketPrice,
                        timestamp: data.timestamp.toDate()
                    });
                });
                
            } catch (error) {
                console.error('Error loading history:', error);
            }
        }

        async function saveHistoryToFirebase(isWin, amount) {
            try {
                const db = firebase.firestore();
                await db.collection('lucky_draw_history').add({
                    userId: gameState.currentUser.uid,
                    isWin: isWin,
                    amount: amount,
                    ticketPrice: gameState.ticketPrice,
                    timestamp: new Date(),
                    gameId: 'lucky_draw'
                });
            } catch (error) {
                console.error('Error saving history:', error);
            }
        }

        // ===== VISUAL EFFECTS =====
        function setupParticles() {
            const container = document.getElementById('particles');
            const particleCount = 30;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.style.position = 'absolute';
                particle.style.width = `${Math.random() * 3 + 1}px`;
                particle.style.height = particle.style.width;
                particle.style.background = 'rgba(255, 215, 0, 0.5)';
                particle.style.borderRadius = '50%';
                particle.style.left = `${Math.random() * 100}%`;
                particle.style.top = `${Math.random() * 100}%`;
                particle.style.opacity = Math.random() * 0.5 + 0.2;
                
                container.appendChild(particle);
                
                // Animate particle
                animateParticle(particle);
            }
        }

        function animateParticle(particle) {
            let x = parseFloat(particle.style.left);
            let y = parseFloat(particle.style.top);
            let dx = (Math.random() - 0.5) * 0.2;
            let dy = (Math.random() - 0.5) * 0.2;
            
            function move() {
                x += dx;
                y += dy;
                
                // Bounce off edges
                if (x <= 0 || x >= 100) dx *= -1;
                if (y <= 0 || y >= 100) dy *= -1;
                
                particle.style.left = `${x}%`;
                particle.style.top = `${y}%`;
                
                requestAnimationFrame(move);
            }
            
            move();
        }

        function createConfetti() {
            const container = document.getElementById('confetti-container');
            const colors = ['#FFD700', '#FF6B6B', '#4CAF50', '#2196F3', '#9C27B0'];
            
            for (let i = 0; i < 150; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.left = `${Math.random() * 100}%`;
                confetti.style.top = '-20px';
                confetti.style.opacity = '1';
                confetti.style.transform = `rotate(${Math.random() * 360}deg)`;
                
                container.appendChild(confetti);
                
                // Animate confetti falling
                const duration = 2 + Math.random() * 2;
                const delay = Math.random() * 1;
                
                confetti.animate([
                    { transform: 'translateY(0) rotate(0deg)', opacity: 1 },
                    { transform: `translateY(100vh) rotate(${Math.random() * 720}deg)`, opacity: 0 }
                ], {
                    duration: duration * 1000,
                    delay: delay * 1000,
                    easing: 'cubic-bezier(0.215, 0.610, 0.355, 1)'
                });
                
                // Remove after animation
                setTimeout(() => {
                    if (confetti.parentNode) {
                        confetti.parentNode.removeChild(confetti);
                    }
                }, (duration + delay) * 1000);
            }
        }

        // ===== FULLSCREEN =====
        function toggleFullscreen() {
            const container = document.getElementById('game-container');
            
            if (!document.fullscreenElement) {
                if (container.requestFullscreen) {
                    container.requestFullscreen();
                } else if (container.webkitRequestFullscreen) {
                    container.webkitRequestFullscreen();
                }
                document.getElementById('fullscreen-toggle').innerHTML = '<i class="fas fa-compress"></i>';
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
                document.getElementById('fullscreen-toggle').innerHTML = '<i class="fas fa-expand"></i>';
            }
        }

        // Update button on fullscreen change
        document.addEventListener('fullscreenchange', updateFullscreenButton);
        document.addEventListener('webkitfullscreenchange', updateFullscreenButton);

        function updateFullscreenButton() {
            const toggleBtn = document.getElementById('fullscreen-toggle');
            toggleBtn.innerHTML = document.fullscreenElement 
                ? '<i class="fas fa-compress"></i>' 
                : '<i class="fas fa-expand"></i>';
        }

        // ===== TOAST NOTIFICATIONS =====
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.add('show');
            }, 10);
            
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => {
                    container.removeChild(toast);
                }, 300);
            }, 3000);
        }

        // ===== INITIAL SETUP =====
        // Show welcome message
        setTimeout(() => {
            if (gameState.balance > 0) {
                showToast('🎪 Welcome to Lucky Draw! Buy tickets for a chance to win big!', 'success');
            }
        }, 2000);

        console.log("🍀 Lucky Draw Game Ready!");
        console.log("💰 Real Money Integration: ACTIVE");
        console.log("🎯 House Edge: 85-90% lose rate");
        console.log("🎪 Draw Frequency: Every 2 minutes");
        console.log("🚀 Ready to play!");
    </script>
