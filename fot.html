<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Live Football Scores</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #0f172a;
            color: #fff;
        }

        header {
            background: #020617;
            padding: 15px 25px;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .container {
            padding: 20px;
        }

        .widget {
            background: #020617;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 25px;
            box-shadow: 0 0 15px rgba(0,0,0,.6);
        }

        .widget h2 {
            margin: 0;
            padding: 12px 15px;
            font-size: 16px;
            background: #020617;
            border-bottom: 1px solid #1e293b;
        }

        iframe {
            width: 100%;
            border: none;
        }

        footer {
            text-align: center;
            padding: 15px;
            font-size: 12px;
            color: #94a3b8;
        }
    </style>
</head>

<body>

<header>
    ⚽ LIVE FOOTBALL CENTER
</header>

<div class="container">

    <!-- Live Scores -->
    <div class="widget">
        <h2>Live Scores</h2>
        <iframe
            src="https://www.scorebat.com/embed/livescore/"
            height="600"
            loading="lazy">
        </iframe>
    </div>

    <!-- Match Highlights -->
    <div class="widget">
        <h2>Match Highlights</h2>
        <iframe
            src="https://www.scorebat.com/embed/"
            height="450"
            loading="lazy">
        </iframe>
    </div>

    <!-- League Tables -->
    <div class="widget">
        <h2>League Tables</h2>
        <iframe
            src="https://footystats.org/widgets/league-table"
            height="500"
            loading="lazy">
        </iframe>
    </div>

</div>

<footer>
    Data provided by public football widgets • No API required
</footer>

</body>
</html>
