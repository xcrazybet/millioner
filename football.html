<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>⚽ Xlodon Bet - Football Betting</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        :root {
            --primary: #00ff9d;
            --secondary: #ff9800;
            --danger: #ff4757;
            --success: #4caf50;
            --warning: #ffc107;
            --bg: #0a0f1a;
            --surface: #111827;
            --surface-light: #1a2332;
            --text: #ffffff;
            --text-dim: #94a3b8;
            --border: #1e293b;
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 70px;
        }

        .header {
            background: var(--surface);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
        }

        .logo a {
            color: var(--primary);
            text-decoration: none;
        }

        .balance-display {
            background: var(--surface-light);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid var(--primary);
            color: var(--primary);
            font-weight: 600;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 16px;
            max-width: 1400px;
            margin: 16px auto;
            padding: 0 16px;
        }

        .market-tabs {
            background: var(--surface);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .tabs-header, .league-filter {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 12px;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        .tab-btn, .league-btn {
            padding: 8px 16px;
            background: var(--surface-light);
            border: 1px solid var(--border);
            border-radius: 30px;
            color: var(--text);
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
        }

        .tab-btn.active, .league-btn.active {
            background: var(--primary);
            color: #000;
            border-color: var(--primary);
        }

        .matches-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 500px;
            overflow-y: auto;
        }

        .match-card {
            background: var(--surface);
            border-radius: 16px;
            padding: 12px;
            border: 1px solid var(--border);
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 12px;
            color: var(--text-dim);
        }

        .teams {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .team-name {
            font-weight: 600;
            font-size: 14px;
        }

        .score {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
        }

        .market-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 8px;
        }

        .market-btn {
            padding: 8px;
            background: var(--surface-light);
            border: 1px solid var(--border);
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
        }

        .market-name {
            font-size: 10px;
            color: var(--text-dim);
        }

        .market-odds {
            font-weight: 700;
            color: var(--primary);
        }

        .betslip-section {
            background: var(--surface);
            border-radius: 20px;
            padding: 16px;
            border: 2px solid var(--primary);
            position: sticky;
            top: 80px;
        }

        .betslip-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .betslip-tab {
            flex: 1;
            padding: 10px;
            background: var(--surface-light);
            border: none;
            border-radius: 30px;
            color: var(--text);
            cursor: pointer;
        }

        .betslip-tab.active {
            background: var(--primary);
            color: #000;
        }

        .betslip-items {
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 12px;
        }

        .betslip-item {
            background: var(--surface-light);
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 8px;
        }

        .betslip-item-header {
            display: flex;
            justify-content: space-between;
        }

        .remove-bet {
            color: var(--danger);
            cursor: pointer;
        }

        .bet-input-group {
            display: flex;
            background: var(--surface-light);
            border-radius: 30px;
            padding: 0 16px;
            margin: 12px 0;
        }

        .bet-input {
            flex: 1;
            padding: 14px 0;
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 16px;
        }

        .place-bet-btn {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            border: none;
            border-radius: 30px;
            color: #000;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
        }

        .place-bet-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .open-bets-section, .history-section {
            background: var(--surface);
            border-radius: 16px;
            padding: 16px;
            margin-top: 16px;
        }

        .bet-card {
            background: var(--surface-light);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 8px;
            border-left: 4px solid var(--secondary);
        }

        .bet-card-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .cashout-btn {
            padding: 4px 12px;
            background: var(--warning);
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--surface);
            display: flex;
            justify-content: space-around;
            padding: 8px 16px;
            border-top: 2px solid var(--primary);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--text-dim);
            font-size: 11px;
            gap: 4px;
        }

        .nav-item i { font-size: 20px; }
        .nav-item.active { color: var(--primary); }

        .toast-container {
            position: fixed;
            bottom: 80px;
            left: 16px;
            right: 16px;
            z-index: 1000;
        }

        .toast {
            padding: 12px 16px;
            background: var(--surface);
            border-radius: 30px;
            border-left: 4px solid var(--primary);
            margin-bottom: 8px;
        }

        .empty-state {
            text-align: center;
            padding: 30px;
            color: var(--text-dim);
        }

        @media (max-width: 900px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <a href="https://xcrazybet.github.io/millioner/index.html">⚽ Xlodon Bet</a>
        </div>
        <div class="balance-display">
            <i class="fas fa-wallet"></i> $<span id="balance">0.00</span>
        </div>
    </header>

    <div class="main-layout">
        <div class="left-column">
            <div class="market-tabs">
                <div class="tabs-header">
                    <button class="tab-btn active" data-market="all">All</button>
                    <button class="tab-btn" data-market="live">Live</button>
                    <button class="tab-btn" data-market="upcoming">Upcoming</button>
                </div>
                <div class="league-filter" id="leagueFilter">
                    <button class="league-btn active" data-league="all">ALL</button>
                    <button class="league-btn" data-league="39">PREMIER</button>
                    <button class="league-btn" data-league="140">LA LIGA</button>
                    <button class="league-btn" data-league="78">BUNDES</button>
                </div>
                <div id="matchesContainer" class="matches-grid"></div>
            </div>

            <div class="open-bets-section">
                <h3><i class="fas fa-ticket-alt"></i> MY OPEN BETS</h3>
                <div id="openBetsContainer"></div>
            </div>
        </div>

        <div class="betslip-section">
            <div class="betslip-tabs">
                <button class="betslip-tab active" data-type="single">SINGLE</button>
                <button class="betslip-tab" data-type="accumulator">ACCUMULATOR</button>
            </div>
            <div class="betslip-header">
                <h4>BET SLIP</h4>
                <button id="clearSlip" style="background: none; border: none; color: var(--danger); cursor: pointer;">CLEAR</button>
            </div>
            <div id="betslipItems" class="betslip-items">
                <div class="empty-state">Click odds to add bets</div>
            </div>
            <div class="bet-input-group">
                <input type="number" id="betAmount" class="bet-input" value="10" min="1" step="1">
                <span>$</span>
            </div>
            <div style="display: flex; justify-content: space-between; margin: 12px 0;">
                <span>Total Odds:</span>
                <span id="totalOdds" style="color: var(--primary); font-size: 20px; font-weight: bold;">0.00</span>
            </div>
            <div style="margin: 12px 0;">
                <span>Potential Return:</span>
                <span id="potentialReturn" style="float: right; font-weight: bold;">$0.00</span>
            </div>
            <button id="placeBetBtn" class="place-bet-btn" disabled>PLACE BET</button>
        </div>
    </div>

    <div class="history-section">
        <h3><i class="fas fa-history"></i> BETTING HISTORY</h3>
        <div id="historyContainer"></div>
    </div>

    <nav class="bottom-nav">
        <a href="football.html" class="nav-item active"><i class="fas fa-futbol"></i><span>Football</span></a>
        <a href="bets.html" class="nav-item"><i class="fas fa-ticket-alt"></i><span>My Bets</span></a>
        <a href="https://xcrazybet.github.io/millioner/" class="nav-item"><i class="fas fa-home"></i><span>Home</span></a>
        <a href="#" class="nav-item"><i class="fas fa-chart-line"></i><span>Stats</span></a>
        <a href="#" class="nav-item"><i class="fas fa-wallet"></i><span>Wallet</span></a>
    </nav>

    <div id="toastContainer" class="toast-container"></div>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // App State
        let currentUser = null;
        let balance = 0;
        let selectedBets = [];
        let betType = 'single';
        let matches = [];

        // Sample matches
        const sampleMatches = [
            { id: 1, leagueId: 39, leagueName: "Premier League", homeTeam: "Manchester Utd", awayTeam: "Liverpool", homeScore: null, awayScore: null, status: "NS", time: "15:00", odds: { home: 2.10, draw: 3.40, away: 3.20, over25: 1.85, under25: 1.95 } },
            { id: 2, leagueId: 140, leagueName: "La Liga", homeTeam: "Barcelona", awayTeam: "Real Madrid", homeScore: null, awayScore: null, status: "NS", time: "17:00", odds: { home: 2.30, draw: 3.30, away: 2.90, over25: 1.80, under25: 2.00 } },
            { id: 3, leagueId: 78, leagueName: "Bundesliga", homeTeam: "Bayern Munich", awayTeam: "Dortmund", homeScore: null, awayScore: null, status: "NS", time: "19:30", odds: { home: 1.75, draw: 3.80, away: 4.20, over25: 1.70, under25: 2.10 } }
        ];

        // Check Auth
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                currentUser = user;
                await loadBalance();
                await loadMatches();
                await loadOpenBets();
                await loadHistory();
                setupListeners();
                showToast('Welcome back!', 'success');
            } else {
                showToast('Please login to continue', 'error');
                setTimeout(() => {
                    window.location.href = 'https://xcrazybet.github.io/millioner/login.html';
                }, 2000);
            }
        });

        // Load Balance
        async function loadBalance() {
            try {
                const doc = await db.collection("wallets").doc(currentUser.uid).get();
                if (doc.exists) {
                    balance = doc.data().balance || 0;
                } else {
                    balance = 100;
                    await db.collection("wallets").doc(currentUser.uid).set({ balance: 100 });
                }
                document.getElementById('balance').textContent = balance.toFixed(2);
            } catch (error) {
                console.error('Balance error:', error);
            }
        }

        // Load Matches
        async function loadMatches() {
            matches = sampleMatches;
            displayMatches('all');
        }

        function displayMatches(leagueFilter) {
            const container = document.getElementById('matchesContainer');
            let filtered = leagueFilter === 'all' ? matches : matches.filter(m => m.leagueId.toString() === leagueFilter);
            
            container.innerHTML = filtered.map(match => `
                <div class="match-card">
                    <div class="match-header">
                        <span>${match.leagueName}</span>
                        <span>${match.time}</span>
                    </div>
                    <div class="teams">
                        <span class="team-name">${match.homeTeam}</span>
                        <span class="score">${match.homeScore !== null ? match.homeScore : '-'} - ${match.awayScore !== null ? match.awayScore : '-'}</span>
                        <span class="team-name">${match.awayTeam}</span>
                    </div>
                    <div class="market-grid">
                        <div class="market-btn" onclick="addToBetSlip(${match.id}, '1', ${match.odds.home}, '1', 'Match Winner')">
                            <div class="market-name">1</div>
                            <div class="market-odds">${match.odds.home.toFixed(2)}</div>
                        </div>
                        <div class="market-btn" onclick="addToBetSlip(${match.id}, 'X', ${match.odds.draw}, 'X', 'Match Winner')">
                            <div class="market-name">X</div>
                            <div class="market-odds">${match.odds.draw.toFixed(2)}</div>
                        </div>
                        <div class="market-btn" onclick="addToBetSlip(${match.id}, '2', ${match.odds.away}, '2', 'Match Winner')">
                            <div class="market-name">2</div>
                            <div class="market-odds">${match.odds.away.toFixed(2)}</div>
                        </div>
                        <div class="market-btn" onclick="addToBetSlip(${match.id}, 'Over 2.5', ${match.odds.over25}, 'O2.5', 'Total Goals')">
                            <div class="market-name">O2.5</div>
                            <div class="market-odds">${match.odds.over25.toFixed(2)}</div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Add to Bet Slip
        window.addToBetSlip = function(matchId, selection, odds, display, market) {
            const match = matches.find(m => m.id === matchId);
            if (!match) return;
            
            const bet = {
                matchId: match.id,
                matchName: `${match.homeTeam} vs ${match.awayTeam}`,
                market: market,
                selection: selection,
                display: display,
                odds: odds
            };
            
            if (betType === 'single') {
                selectedBets = [bet];
            } else {
                if (selectedBets.some(b => b.matchId === matchId)) {
                    showToast('Only one bet per match allowed', 'error');
                    return;
                }
                selectedBets.push(bet);
            }
            
            updateBetSlip();
            showToast('Bet added to slip', 'success');
        };

        function updateBetSlip() {
            const container = document.getElementById('betslipItems');
            const totalOddsSpan = document.getElementById('totalOdds');
            const potentialSpan = document.getElementById('potentialReturn');
            const placeBtn = document.getElementById('placeBetBtn');
            
            if (selectedBets.length === 0) {
                container.innerHTML = '<div class="empty-state">Click odds to add bets</div>';
                totalOddsSpan.textContent = '0.00';
                potentialSpan.textContent = '$0.00';
                placeBtn.disabled = true;
                return;
            }
            
            const totalOdds = selectedBets.reduce((acc, bet) => acc * bet.odds, 1);
            const betAmount = parseFloat(document.getElementById('betAmount').value) || 10;
            const potentialReturn = betAmount * totalOdds;
            
            totalOddsSpan.textContent = totalOdds.toFixed(2);
            potentialSpan.textContent = `$${potentialReturn.toFixed(2)}`;
            placeBtn.disabled = false;
            
            container.innerHTML = selectedBets.map((bet, index) => `
                <div class="betslip-item">
                    <div class="betslip-item-header">
                        <span>${bet.matchName}</span>
                        <span class="remove-bet" onclick="removeBet(${index})">✕</span>
                    </div>
                    <div>${bet.market} - ${bet.display}</div>
                    <div style="color: var(--primary);">${bet.odds.toFixed(2)}</div>
                </div>
            `).join('');
        }

        window.removeBet = function(index) {
            selectedBets.splice(index, 1);
            updateBetSlip();
        };

        // Generate Ticket Number
        function generateTicketNumber() {
            const date = new Date();
            const random = Math.random().toString(36).substring(2, 6).toUpperCase();
            return `TKT-${date.getFullYear()}${('0'+(date.getMonth()+1)).slice(-2)}${('0'+date.getDate()).slice(-2)}-${('0'+date.getHours()).slice(-2)}${('0'+date.getMinutes()).slice(-2)}${('0'+date.getSeconds()).slice(-2)}-${random}`;
        }

        // Place Bet
        async function placeBet() {
            const betAmount = parseFloat(document.getElementById('betAmount').value);
            
            if (selectedBets.length === 0) {
                showToast('No bets selected', 'error');
                return;
            }
            
            if (betAmount < 1 || betAmount > 1000) {
                showToast('Bet amount must be between $1 and $1000', 'error');
                return;
            }
            
            if (betAmount > balance) {
                showToast('Insufficient funds', 'error');
                return;
            }
            
            const totalOdds = selectedBets.reduce((acc, bet) => acc * bet.odds, 1);
            const ticketNumber = generateTicketNumber();
            
            try {
                // Process transaction
                const walletRef = db.collection("wallets").doc(currentUser.uid);
                await db.runTransaction(async (transaction) => {
                    const doc = await transaction.get(walletRef);
                    const newBalance = doc.data().balance - betAmount;
                    if (newBalance < 0) throw new Error('Insufficient funds');
                    transaction.update(walletRef, { balance: newBalance });
                });
                
                // Save bet to Firebase
                const betData = {
                    userId: currentUser.uid,
                    ticketNumber: ticketNumber,
                    selections: selectedBets,
                    stake: betAmount,
                    totalOdds: totalOdds,
                    potentialReturn: betAmount * totalOdds,
                    betType: betType,
                    status: 'pending',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    createdAtDate: new Date().toISOString()
                };
                
                await db.collection("football_bets").doc(ticketNumber).set(betData);
                
                // Update balance
                balance -= betAmount;
                document.getElementById('balance').textContent = balance.toFixed(2);
                
                // Clear bet slip
                selectedBets = [];
                updateBetSlip();
                
                showToast(`Bet placed! Ticket #${ticketNumber}`, 'success');
                
                // Reload open bets and history
                await loadOpenBets();
                await loadHistory();
                
            } catch (error) {
                console.error('Place bet error:', error);
                showToast('Failed to place bet: ' + error.message, 'error');
            }
        }

        // Load Open Bets
        async function loadOpenBets() {
            try {
                const snapshot = await db.collection("football_bets")
                    .where("userId", "==", currentUser.uid)
                    .where("status", "==", "pending")
                    .get();
                
                const container = document.getElementById('openBetsContainer');
                
                if (snapshot.empty) {
                    container.innerHTML = '<div class="empty-state">No open bets</div>';
                    return;
                }
                
                let html = '';
                snapshot.forEach(doc => {
                    const bet = doc.data();
                    const selectionsText = bet.selections.map(s => `${s.matchName} - ${s.display} @ ${s.odds.toFixed(2)}`).join('<br>');
                    html += `
                        <div class="bet-card">
                            <div class="bet-card-header">
                                <span style="font-size: 12px;">#${doc.id}</span>
                                <span style="background: var(--secondary); padding: 2px 8px; border-radius: 20px;">PENDING</span>
                            </div>
                            <div style="font-size: 12px; margin: 8px 0;">${selectionsText}</div>
                            <div style="display: flex; justify-content: space-between; margin-top: 8px;">
                                <span>$${bet.stake.toFixed(2)}</span>
                                <span>$${(bet.stake * bet.totalOdds).toFixed(2)}</span>
                                <button class="cashout-btn" onclick="cashOut('${doc.id}', ${bet.stake})">CASH OUT</button>
                            </div>
                        </div>
                    `;
                });
                
                container.innerHTML = html;
            } catch (error) {
                console.error('Load open bets error:', error);
            }
        }

        // Cash Out
        window.cashOut = async function(ticketNumber, stake) {
            const cashoutValue = stake * 0.7;
            if (!confirm(`Cash out for $${cashoutValue.toFixed(2)}?`)) return;
            
            try {
                const walletRef = db.collection("wallets").doc(currentUser.uid);
                await db.runTransaction(async (transaction) => {
                    const doc = await transaction.get(walletRef);
                    transaction.update(walletRef, { balance: doc.data().balance + cashoutValue });
                });
                
                await db.collection("football_bets").doc(ticketNumber).update({
                    status: 'cashed_out',
                    return: cashoutValue,
                    cashedOutAt: new Date().toISOString()
                });
                
                balance += cashoutValue;
                document.getElementById('balance').textContent = balance.toFixed(2);
                
                await loadOpenBets();
                await loadHistory();
                showToast(`Cashed out $${cashoutValue.toFixed(2)}`, 'success');
            } catch (error) {
                showToast('Cashout failed', 'error');
            }
        };

        // Load History
        async function loadHistory() {
            try {
                const snapshot = await db.collection("football_bets")
                    .where("userId", "==", currentUser.uid)
                    .where("status", "in", ["won", "lost", "cashed_out"])
                    .orderBy("createdAt", "desc")
                    .limit(20)
                    .get();
                
                const container = document.getElementById('historyContainer');
                
                if (snapshot.empty) {
                    container.innerHTML = '<div class="empty-state">No betting history</div>';
                    return;
                }
                
                let html = '';
                snapshot.forEach(doc => {
                    const bet = doc.data();
                    const returnAmount = bet.return || (bet.status === 'won' ? bet.stake * bet.totalOdds : 0);
                    html += `
                        <div class="bet-card" style="border-left-color: ${bet.status === 'won' ? 'var(--success)' : bet.status === 'lost' ? 'var(--danger)' : 'var(--warning)'}">
                            <div class="bet-card-header">
                                <span style="font-size: 12px;">#${doc.id}</span>
                                <span style="background: ${bet.status === 'won' ? 'var(--success)' : bet.status === 'lost' ? 'var(--danger)' : 'var(--warning)'}; padding: 2px 8px; border-radius: 20px;">${bet.status.toUpperCase()}</span>
                            </div>
                            <div style="font-size: 12px; margin: 8px 0;">${bet.selections.length} selections @ ${bet.totalOdds.toFixed(2)}</div>
                            <div style="display: flex; justify-content: space-between;">
                                <span>$${bet.stake.toFixed(2)}</span>
                                <span>${bet.status === 'won' ? '+' : ''}$${returnAmount.toFixed(2)}</span>
                            </div>
                        </div>
                    `;
                });
                
                container.innerHTML = html;
            } catch (error) {
                console.error('Load history error:', error);
            }
        }

        // Setup Listeners
        function setupListeners() {
            // Real-time balance updates
            db.collection("wallets").doc(currentUser.uid).onSnapshot((doc) => {
                if (doc.exists) {
                    balance = doc.data().balance;
                    document.getElementById('balance').textContent = balance.toFixed(2);
                }
            });
            
            // Real-time bet updates
            db.collection("football_bets")
                .where("userId", "==", currentUser.uid)
                .onSnapshot(() => {
                    loadOpenBets();
                    loadHistory();
                });
        }

        // Toast
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.style.borderLeftColor = type === 'success' ? 'var(--success)' : type === 'error' ? 'var(--danger)' : 'var(--primary)';
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // Event Listeners
        document.getElementById('placeBetBtn').addEventListener('click', placeBet);
        document.getElementById('clearSlip').addEventListener('click', () => {
            selectedBets = [];
            updateBetSlip();
        });
        document.getElementById('betAmount').addEventListener('input', updateBetSlip);
        
        document.querySelectorAll('.betslip-tab').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.betslip-tab').forEach(t => t.classList.remove('active'));
                btn.classList.add('active');
                betType = btn.dataset.type;
                selectedBets = [];
                updateBetSlip();
            });
        });
        
        document.querySelectorAll('.league-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.league-btn').forEach(l => l.classList.remove('active'));
                btn.classList.add('active');
                displayMatches(btn.dataset.league);
            });
        });
    </script>
</body>
</html>
