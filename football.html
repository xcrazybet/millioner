<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚽ XCrazyBet Pro - Professional Football Betting</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        :root {
            --primary: #00ff9d;
            --primary-dark: #00cc7a;
            --secondary: #ff9800;
            --danger: #ff4757;
            --success: #4caf50;
            --warning: #ffc107;
            --info: #2196f3;
            --bg: #0a0f1a;
            --surface: #111827;
            --surface-light: #1a2332;
            --surface-lighter: #2a3440;
            --text: #ffffff;
            --text-dim: #a0a8c9;
            --text-dimmer: #6b7280;
            --border: #2a3440;
            --border-light: #3a4455;
        }

        * {
            scrollbar-width: thin;
            scrollbar-color: var(--primary) var(--surface);
        }

        *::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        *::-webkit-scrollbar-track {
            background: var(--surface);
        }

        *::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            opacity: 0;
            animation: fadeIn 0.3s ease forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* Header */
        .header {
            background: var(--surface);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
            text-shadow: 0 0 10px rgba(0,255,157,0.3);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .balance-display {
            background: linear-gradient(135deg, var(--surface-light), var(--surface));
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--primary);
            color: var(--primary);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 0 15px rgba(0,255,157,0.1);
        }

        .stats-badge {
            background: var(--surface-light);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--secondary);
            color: var(--secondary);
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sync-status {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 10px var(--success);
            transition: all 0.3s;
        }

        .sync-status.offline {
            background: var(--text-dimmer);
            box-shadow: none;
        }

        .sync-status.syncing {
            background: var(--warning);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Main Layout */
        .main-layout {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 20px;
            max-width: 1600px;
            margin: 20px auto;
            padding: 0 20px;
        }

        /* Left Column */
        .left-column {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Market Tabs */
        .market-tabs {
            background: var(--surface);
            border-radius: 12px;
            padding: 15px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .tabs-header {
            display: flex;
            gap: 10px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 8px 16px;
            background: transparent;
            border: none;
            color: var(--text-dim);
            font-weight: 600;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
            font-size: 13px;
        }

        .tab-btn:hover {
            background: var(--surface-light);
            color: var(--primary);
        }

        .tab-btn.active {
            background: var(--primary);
            color: #000;
        }

        /* League Filter */
        .league-filter {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }

        .league-btn {
            padding: 6px 15px;
            background: var(--surface-light);
            border: 1px solid var(--border);
            border-radius: 20px;
            color: var(--text);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .league-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .league-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: #000;
        }

        /* Status Bar */
        .status-bar {
            display: flex;
            gap: 20px;
            padding: 10px;
            background: var(--surface-light);
            border-radius: 8px;
            font-size: 12px;
            margin-bottom: 15px;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-item.live i { color: var(--danger); animation: blink 1s infinite; }
        .status-item.upcoming i { color: var(--secondary); }
        .status-item.finished i { color: var(--success); }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Matches Grid */
        .matches-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: calc(100vh - 350px);
            overflow-y: auto;
            padding-right: 5px;
        }

        .match-card {
            background: var(--surface);
            border-radius: 12px;
            padding: 15px;
            border: 1px solid var(--border);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .match-card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0,255,157,0.1);
        }

        .match-card.live {
            border-left: 4px solid var(--danger);
            background: linear-gradient(90deg, rgba(255,71,87,0.05), var(--surface));
        }

        .match-card.featured {
            border: 2px solid var(--secondary);
            background: linear-gradient(135deg, var(--surface), rgba(255,152,0,0.1));
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 12px;
        }

        .league-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .league-logo {
            width: 20px;
            height: 20px;
            object-fit: contain;
            border-radius: 4px;
        }

        .league-name {
            color: var(--text-dim);
            font-weight: 500;
        }

        .match-time {
            padding: 4px 10px;
            background: var(--surface-light);
            border-radius: 4px;
            color: var(--secondary);
            font-weight: 600;
            font-size: 11px;
        }

        .match-time.live {
            background: var(--danger);
            color: white;
            animation: pulse 2s infinite;
        }

        .teams {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .team {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }

        .team.away {
            justify-content: flex-end;
        }

        .team-logo {
            width: 36px;
            height: 36px;
            object-fit: contain;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.3));
        }

        .team-name {
            font-weight: 600;
            font-size: 14px;
        }

        .score {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
            margin: 0 20px;
            text-shadow: 0 0 10px rgba(0,255,157,0.3);
            min-width: 60px;
            text-align: center;
        }

        /* Match Analytics */
        .match-analytics {
            margin: 15px 0;
            padding: 10px;
            background: var(--surface-light);
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .analytics-tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 10px;
            overflow-x: auto;
            padding-bottom: 2px;
        }

        .analytics-tab {
            padding: 6px 12px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text);
            font-size: 11px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .analytics-tab:hover {
            border-color: var(--primary);
        }

        .analytics-tab.active {
            background: var(--primary);
            color: #000;
            border-color: var(--primary);
        }

        .analytics-content {
            font-size: 12px;
            min-height: 60px;
        }

        /* H2H Stats */
        .h2h-stats {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 10px;
            text-align: center;
            margin: 10px 0;
        }

        .h2h-team {
            padding: 8px;
            background: var(--surface);
            border-radius: 6px;
        }

        .h2h-wins {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
        }

        .recent-meetings {
            margin-top: 10px;
            max-height: 100px;
            overflow-y: auto;
        }

        .meeting-item {
            display: flex;
            justify-content: space-between;
            padding: 5px;
            border-bottom: 1px solid var(--border);
            font-size: 11px;
        }

        /* Predictions */
        .predictions-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .prediction-item {
            display: grid;
            grid-template-columns: 80px 1fr 50px;
            align-items: center;
            gap: 10px;
        }

        .prediction-bar {
            height: 6px;
            background: var(--surface);
            border-radius: 3px;
            overflow: hidden;
        }

        .prediction-fill {
            height: 100%;
            background: var(--primary);
            border-radius: 3px;
            transition: width 0.3s;
        }

        .prediction-value {
            color: var(--primary);
            font-weight: 600;
            text-align: right;
        }

        .advice-section {
            margin-top: 10px;
            padding: 8px;
            background: var(--surface);
            border-radius: 6px;
            border-left: 3px solid var(--secondary);
        }

        .advice-title {
            color: var(--secondary);
            font-weight: 600;
            margin-bottom: 3px;
        }

        /* Live Stats */
        .live-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 10px;
            padding: 10px;
            background: var(--surface);
            border-radius: 6px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-label {
            color: var(--text-dim);
            font-size: 10px;
        }

        .stat-value {
            font-weight: 700;
            font-size: 14px;
            color: var(--primary);
        }

        /* Enhanced Markets */
        .enhanced-markets {
            margin-top: 15px;
        }

        .market-category {
            margin-bottom: 15px;
        }

        .market-title {
            color: var(--secondary);
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .market-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .market-btn {
            padding: 8px;
            background: var(--surface-light);
            border: 1px solid var(--border);
            border-radius: 6px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 11px;
        }

        .market-btn:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 2px 8px rgba(0,255,157,0.2);
        }

        .market-btn.selected {
            background: rgba(0,255,157,0.1);
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(0,255,157,0.2);
        }

        .market-name {
            color: var(--text-dim);
            margin-bottom: 2px;
            font-size: 10px;
        }

        .market-odds {
            color: var(--primary);
            font-weight: 700;
            font-size: 14px;
        }

        /* Bet Slip */
        .betslip-section {
            background: var(--surface);
            border-radius: 12px;
            padding: 15px;
            border: 2px solid var(--primary);
            position: sticky;
            top: 80px;
            height: fit-content;
            box-shadow: 0 5px 25px rgba(0,255,157,0.15);
        }

        .betslip-tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
        }

        .betslip-tab {
            flex: 1;
            padding: 8px;
            background: var(--surface-light);
            border: none;
            color: var(--text);
            cursor: pointer;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .betslip-tab:hover {
            background: var(--surface-lighter);
        }

        .betslip-tab.active {
            background: var(--primary);
            color: #000;
        }

        .betslip-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .betslip-title {
            color: var(--primary);
            font-weight: 700;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .betslip-clear {
            color: var(--danger);
            cursor: pointer;
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .betslip-clear:hover {
            background: rgba(255,71,87,0.1);
        }

        .betslip-items {
            max-height: 300px;
            overflow-y: auto;
            margin-bottom: 12px;
        }

        .betslip-item {
            background: var(--surface-light);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 8px;
            border: 1px solid var(--border);
            transition: all 0.2s;
        }

        .betslip-item:hover {
            border-color: var(--primary);
        }

        .betslip-item-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        .betslip-match {
            font-weight: 600;
            font-size: 12px;
        }

        .betslip-market {
            color: var(--secondary);
            font-size: 11px;
        }

        .betslip-details {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .betslip-odds {
            color: var(--primary);
            font-weight: 700;
            font-size: 14px;
        }

        .betslip-remove {
            color: var(--danger);
            cursor: pointer;
            font-size: 12px;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .betslip-remove:hover {
            background: rgba(255,71,87,0.1);
        }

        .system-options {
            margin: 10px 0;
            padding: 10px;
            background: var(--surface-light);
            border-radius: 6px;
        }

        .system-select {
            width: 100%;
            padding: 8px;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 4px;
            font-size: 12px;
        }

        .each-way-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 10px 0;
            padding: 10px;
            background: var(--surface-light);
            border-radius: 6px;
            font-size: 12px;
        }

        .each-way-toggle input {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: var(--primary);
        }

        .betslip-total {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-top: 1px solid var(--border);
            font-weight: 600;
        }

        .total-odds {
            color: var(--primary);
            font-size: 20px;
            font-weight: 700;
        }

        .bet-input-group {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--surface-light);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0 10px;
            margin: 10px 0;
        }

        .bet-input {
            flex: 1;
            padding: 12px 0;
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 16px;
            font-weight: 600;
        }

        .bet-input:focus {
            outline: none;
        }

        .bet-input::-webkit-inner-spin-button,
        .bet-input::-webkit-outer-spin-button {
            opacity: 0.5;
        }

        .quick-bets {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            margin: 10px 0;
        }

        .quick-bet-btn {
            padding: 8px;
            background: var(--surface-light);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text);
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .quick-bet-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .potential-returns {
            background: linear-gradient(135deg, var(--surface-light), var(--surface));
            padding: 12px;
            border-radius: 8px;
            margin: 10px 0;
            border: 1px solid var(--border);
        }

        .return-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin: 5px 0;
        }

        .return-row.total {
            font-weight: 700;
            color: var(--primary);
            border-top: 1px solid var(--border);
            padding-top: 8px;
            margin-top: 8px;
            font-size: 16px;
        }

        .place-bet-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: none;
            border-radius: 8px;
            color: #000;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .place-bet-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0,255,157,0.4);
        }

        .place-bet-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Open Bets Section */
        .open-bets-section {
            background: var(--surface);
            border-radius: 12px;
            padding: 15px;
            border: 1px solid var(--secondary);
            margin-top: 20px;
        }

        .section-title {
            color: var(--secondary);
            font-size: 14px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .bets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 10px;
            max-height: 300px;
            overflow-y: auto;
        }

        .bet-card {
            background: var(--surface-light);
            border-radius: 8px;
            padding: 12px;
            border-left: 3px solid;
            transition: all 0.2s;
        }

        .bet-card:hover {
            transform: translateX(2px);
        }

        .bet-card.pending { border-color: var(--secondary); }
        .bet-card.won { border-color: var(--success); }
        .bet-card.lost { border-color: var(--danger); }
        .bet-card.cashed_out { border-color: var(--info); }

        .bet-card-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 11px;
        }

        .bet-ticket {
            color: var(--text-dim);
            font-family: monospace;
        }

        .bet-status {
            padding: 2px 8px;
            border-radius: 3px;
            font-weight: 600;
            font-size: 10px;
        }

        .bet-status.pending { background: var(--secondary); color: #000; }
        .bet-status.won { background: var(--success); color: #000; }
        .bet-status.lost { background: var(--danger); color: #000; }
        .bet-status.cashed_out { background: var(--info); color: #000; }

        .bet-details {
            font-size: 12px;
            margin: 8px 0;
            max-height: 60px;
            overflow-y: auto;
        }

        .bet-selection-item {
            padding: 2px 0;
            border-bottom: 1px dashed var(--border);
        }

        .bet-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            border-top: 1px solid var(--border);
            padding-top: 8px;
            margin-top: 8px;
        }

        .bet-stake {
            color: var(--text-dim);
        }

        .bet-return {
            font-weight: 700;
        }

        .bet-return.won { color: var(--success); }
        .bet-return.lost { color: var(--danger); }

        .cashout-btn {
            padding: 4px 12px;
            background: var(--warning);
            border: none;
            border-radius: 4px;
            color: #000;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .cashout-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 2px 10px rgba(255,193,7,0.3);
        }

        /* History Section */
        .history-section {
            background: var(--surface);
            border-radius: 12px;
            padding: 15px;
            border: 1px solid var(--border);

            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            overflow-x: auto;
        }

        .history-tab {
            padding: 6px 15px;
            background: var(--surface-light);
            border: none;
            color: var(--text);
            cursor: pointer;
            border-radius: 20px;
            font-size: 12px;
            transition: all 0.2s;
            white-space: nowrap;

        .history-tab:hover {
            background: var(--surface-lighter);

            background: var(--primary);

        .history-list {
            display: flex;

            gap: 8px;
            max-height: 300px;
            overflow-y: auto;

            color: var(--text-dimmer);
            font-size: 10px;

        .loading {
            text-align: center;
            padding: 40px;

        .loading-spinner {
            border: 3px solid var(--surface-light);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 10px auto;
        }

        .loading-spinner.small {
            width: 20px;
            height: 20px;
            border-width: 2px;
        }

        /* Toast */
        .toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 300px;

        .toast {
            padding: 12px 15px;
            background: var(--surface);
            border-radius: 8px;
            border-left: 4px solid var(--primary);
            color: white;
            font-size: 13px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transform: translateX(100%);
            opacity: 0;
            transition: all 0.3s;
            animation: slideIn 0.3s forwards;
        }

        @keyframes slideIn {
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .toast.success { border-color: var(--success); }
        .toast.error { border-color: var(--danger); }
        .toast.warning { border-color: var(--warning); }
        .toast.info { border-color: var(--info); }

        /* Bottom Nav */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            background: var(--surface);
            padding: 10px 15px;
            border-top: 2px solid var(--primary);
            margin-top: 30px;
            position: sticky;
            bottom: 0;
            z-index: 99;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--text-dim);
            font-size: 11px;
            gap: 3px;
            padding: 5px 15px;
            border-radius: 20px;
            transition: all 0.2s;
        }

        .nav-item i { font-size: 18px; }
        .nav-item:hover { color: var(--primary); }
        .nav-item.active { 
            color: var(--primary);
            background: var(--surface-light);
        }

        /* Result Overlay */
        .result-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
            backdrop-filter: blur(5px);
        }

        .result-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .result-content {
            background: var(--surface);
            padding: 30px;
            border-radius: 20px;
            border: 3px solid var(--primary);
            text-align: center;
            max-width: 350px;
            width: 90%;
            transform: scale(0.9);
            transition: transform 0.3s;
        }

        .result-overlay.show .result-content {
            transform: scale(1);
        }

        .result-icon {
            font-size: 60px;
            margin-bottom: 15px;
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .result-icon.win { color: var(--success); }
        .result-icon.lose { color: var(--danger); }

        .result-title {

        /* Responsive */

    <script>
        // ===== FIREBASE CONFIG =====
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        
        // Enable offline persistence
        firebase.firestore().enablePersistence({ synchronizeTabs: true })
            .catch((err) => {
                if (err.code === 'failed-precondition') {
                    console.warn('Multiple tabs open, persistence disabled');
                } else if (err.code === 'unimplemented') {
                    console.warn('Browser doesn\'t support persistence');
                }
            });
        
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ===== API CONFIG =====
        const API_KEY = '2396236d9d5cd07468ce280da8390ad5';
        const BASE_URL = 'https://v3.football.api-sports.io';

        // ===== BETTING RULES =====
        const BETTING_RULES = {
            minBet: 1,
            maxBet: 1000,
            maxSelections: 10,
            minSelections: 1,
            houseEdge: 0.07,
            dailyMax: 5000,
            eachWayPlaceTerms: 4,
            eachWayPlaces: 3,
            cashoutPenalty: 0.3 // 30% reduction for cashout
        };

        // ===== LEAGUE CONFIG =====
        const LEAGUES = {
            39: { name: 'Premier League', country: 'England', flag: '🏴' },
            140: { name: 'La Liga', country: 'Spain', flag: '🇪🇸' },
            78: { name: 'Bundesliga', country: 'Germany', flag: '🇩🇪' },
            135: { name: 'Serie A', country: 'Italy', flag: '🇮🇹' },
            61: { name: 'Ligue 1', country: 'France', flag: '🇫🇷' },
            2: { name: 'Champions League', country: 'Europe', flag: '🇪🇺' },
            3: { name: 'Europa League', country: 'Europe', flag: '🇪🇺' }
        };

        // ===== GAME STATE =====
        const gameState = {
            currentUser: null,
            balance: 0,
            betAmount: 10,
            selectedBets: [],
            betType: 'single',
            systemType: '2/3',
            eachWay: false,
            isPlacingBet: false,
            gameId: null,
            matches: [],
            filteredMatches: [],
            currentLeague: 'all',
            currentMarket: 'all',
            openBets: [],
            betHistory: [],
            stats: {
                totalBets: 0,
                wonBets: 0,
                lostBets: 0,
                totalWon: 0,
                totalLost: 0,
                totalStaked: 0,
                winRate: 0
            },
            userLimits: {
                dailyMax: 5000,
                perBetMin: 1,
                perBetMax: 1000,
                todayWagered: 0,
                lastReset: new Date().toDateString()
            },
            matchDetails: {},
            refreshInterval: null,
            syncStatus: 'online', // online, offline, syncing
            pendingSync: new Map(),
            transactionQueue: []
        };

        // ===== BETTING SYSTEM CLASS =====
        class BettingSystem {
            constructor() {
                this.db = db;
                this.pendingTransactions = new Map();
                this.setupNetworkListeners();
            }

            setupNetworkListeners() {
                window.addEventListener('online', () => {
                    gameState.syncStatus = 'online';
                    this.updateSyncStatus();
                    this.syncOfflineData();
                });

                window.addEventListener('offline', () => {
                    gameState.syncStatus = 'offline';
                    this.updateSyncStatus();
                    showToast('You are offline - bets will be saved locally', 'warning');
                });
            }

            updateSyncStatus() {
                const statusEl = document.getElementById('sync-status');
                statusEl.className = `sync-status ${gameState.syncStatus}`;
                statusEl.title = gameState.syncStatus === 'online' ? 'Online' : 
                                gameState.syncStatus === 'syncing' ? 'Syncing...' : 'Offline';
            }

            async placeBet(betData) {
                const user = auth.currentUser;
                if (!user) throw new Error('Not authenticated');

                // If offline, queue the bet
                if (gameState.syncStatus === 'offline') {
                    return this.queueOfflineBet(betData);
                }

                const betId = this.generateBetId();
                const walletRef = this.db.collection('wallets').doc(user.uid);
                const betRef = this.db.collection('football_bets').doc(betId);

                try {
                    gameState.syncStatus = 'syncing';
                    this.updateSyncStatus();

                    const result = await this.db.runTransaction(async (transaction) => {
                        const walletDoc = await transaction.get(walletRef);
                        
                        if (!walletDoc.exists) {
                            throw new Error('Wallet not found');
                        }
                        
                        const balance = walletDoc.data().balance || 0;
                        
                        if (balance < betData.stake) {
                            throw new Error('Insufficient balance');
                        }

                        // Check daily limit
                        const today = new Date().toDateString();
                        const userLimitsRef = this.db.collection('user_limits').doc(user.uid);
                        const limitsDoc = await transaction.get(userLimitsRef);
                        
                        let todayWagered = 0;
                        if (limitsDoc.exists && limitsDoc.data().date === today) {
                            todayWagered = limitsDoc.data().wagered || 0;
                        }

                        if (todayWagered + betData.stake > BETTING_RULES.dailyMax) {
                            throw new Error('Daily betting limit exceeded');
                        }
                        
                        // Update wallet
                        transaction.update(walletRef, {
                            balance: balance - betData.stake,
                            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                        });

                        // Update daily limits
                        transaction.set(userLimitsRef, {
                            date: today,
                            wagered: todayWagered + betData.stake,
                            lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
                        }, { merge: true });
                        
                        // Create bet record
                        const betRecord = {
                            ...betData,
                            betId: betId,
                            userId: user.uid,
                            ticketNumber: this.generateTicketNumber(),
                            status: 'pending',
                            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                            synced: true,
                            cashoutAvailable: true,
                            cashoutValue: betData.stake * 0.7
                        };
                        
                        transaction.set(betRef, betRecord);
                        
                        return {
                            success: true,
                            newBalance: balance - betData.stake,
                            betId: betId,
                            ticketNumber: betRecord.ticketNumber
                        };
                    });

                    // Cache locally
                    this.cacheBetLocally(betId, betData);
                    
                    gameState.syncStatus = 'online';
                    this.updateSyncStatus();
                    
                    return result;

                } catch (error) {
                    console.error('Transaction failed:', error);
                    gameState.syncStatus = 'online';
                    this.updateSyncStatus();
                    
                    // If transaction failed but we're online, try to save locally
                    if (error.message.includes('network')) {
                        return this.queueOfflineBet(betData);
                    }
                    
                    throw error;
                }
            }

            queueOfflineBet(betData) {
                const betId = this.generateBetId();
                const offlineBet = {
                    ...betData,
                    betId: betId,
                    ticketNumber: `OFF-${Date.now()}-${Math.random().toString(36).substr(2, 6)}`,
                    status: 'pending',
                    createdAt: new Date(),
                    synced: false,
                    offline: true
                };

                // Store in localStorage
                const offlineBets = JSON.parse(localStorage.getItem('offlineBets') || '[]');
                offlineBets.push(offlineBet);
                localStorage.setItem('offlineBets', JSON.stringify(offlineBets));

                // Add to game state
                gameState.openBets.unshift(offlineBet);
                gameState.pendingSync.set(betId, offlineBet);

                showToast('Bet saved offline - will sync when online', 'warning');
                
                return {
                    success: true,
                    betId: betId,
                    ticketNumber: offlineBet.ticketNumber,
                    offline: true
                };
            }

            async syncOfflineData() {
                if (gameState.syncStatus !== 'online') return;

                const offlineBets = JSON.parse(localStorage.getItem('offlineBets') || '[]');
                if (offlineBets.length === 0) return;

                gameState.syncStatus = 'syncing';
                this.updateSyncStatus();

                let synced = 0;
                let failed = 0;

                for (const bet of offlineBets) {
                    try {
                        await this.placeBet(bet);
                        synced++;
                    } catch (error) {
                        console.error('Failed to sync bet:', error);
                        failed++;
                    }
                }

                // Clear synced bets
                localStorage.setItem('offlineBets', '[]');

                showToast(`Synced ${synced} bets${failed ? `, ${failed} failed` : ''}`, 
                         failed ? 'warning' : 'success');

                gameState.syncStatus = 'online';
                this.updateSyncStatus();
            }

            cacheBetLocally(betId, betData) {
                try {
                    const localBets = JSON.parse(localStorage.getItem('placedBets') || '{}');
                    localBets[betId] = {
                        ...betData,
                        cachedAt: Date.now()
                    };
                    localStorage.setItem('placedBets', JSON.stringify(localBets));
                } catch (e) {
                    console.warn('Local cache failed:', e);
                }
            }

            generateBetId() {
                return `bet_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
            }

            generateTicketNumber() {
                const prefix = gameState.betType === 'system' ? 'SYS' : 
                              gameState.selectedBets.length > 1 ? 'ACC' : 'TKT';
                const date = new Date();
                const yy = date.getFullYear().toString().slice(-2);
                const mm = ('0' + (date.getMonth() + 1)).slice(-2);
                const dd = ('0' + date.getDate()).slice(-2);
                const random = Math.random().toString(36).substring(2, 8).toUpperCase();
                
                return `${prefix}-${yy}${mm}${dd}-${random}`;
            }

            async cashOut(betId) {
                const user = auth.currentUser;
                if (!user) throw new Error('Not authenticated');

                const bet = gameState.openBets.find(b => b.betId === betId);
                if (!bet) throw new Error('Bet not found');

                const cashoutAmount = bet.stake * (1 - BETTING_RULES.cashoutPenalty);
                const walletRef = this.db.collection('wallets').doc(user.uid);
                const betRef = this.db.collection('football_bets').doc(betId);

                try {

                        });

                        transaction.update(betRef, {
                            status: 'cashed_out',
                            cashoutAmount: cashoutAmount,
                            cashedOutAt: firebase.firestore.FieldValue.serverTimestamp()
                        });

                        return { success: true, newBalance: currentBalance + cashoutAmount };
                    });

                    // Update local state

                    return result;

        // ===== MATCH DATA MANAGER =====
        class MatchDataManager {
            constructor() {
                this.cache = new Map();
                this.apiKey = API_KEY;
                this.baseUrl = BASE_URL;
            }

            async loadMatches(date = null) {
                const targetDate = date || new Date().toISOString().split('T')[0];
                const cacheKey = `matches_${targetDate}`;

                // Check cache first
                const cached = this.getFromCache(cacheKey);
                if (cached) return cached;

                try {
                    // Try API with multiple date range
                    const matches = await this.fetchFromAPI(targetDate);
                    
                    if (matches && matches.length > 0) {
                        this.saveToCache(cacheKey, matches);
                        return matches;
                    }

                    // Fallback to sample data
                    return this.getSampleMatches();

                } catch (error) {
                    console.error('Error loading matches:', error);
                    return this.getSampleMatches();
                }
            }

            async fetchFromAPI(date) {
                const promises = [];

                // Fetch for 7-day period
                for (let i = 0; i < 7; i++) {
                    const d = new Date(date);
                    d.setDate(d.getDate() + i);
                    const dateStr = d.toISOString().split('T')[0];
                    
                    promises.push(
                        fetch(`${this.baseUrl}/fixtures?date=${dateStr}&season=2026`, {
                            headers: { 'x-apisports-key': this.apiKey }
                        }).then(res => res.json())
                    );
                }

                const results = await Promise.allSettled(promises);
                let allMatches = [];

                results.forEach(result => {
                    if (result.status === 'fulfilled' && result.value.response) {
                        allMatches = allMatches.concat(result.value.response);
                    }
                });

                return this.transformMatches(allMatches);
            }

            async loadMatchDetails(matchId) {
                const cacheKey = `details_${matchId}`;
                
                const cached = this.getFromCache(cacheKey);
                if (cached) return cached;

                try {
                    const [fixture, odds, predictions, h2h] = await Promise.all([
                        this.fetchFixture(matchId),
                        this.fetchOdds(matchId),
                        this.fetchPredictions(matchId),
                        this.fetchH2H(matchId)
                    ]);

                    const details = {
                        fixture: fixture,
                        odds: this.processOdds(odds),
                        predictions: predictions,
                        h2h: h2h,
                        lastUpdated: new Date()
                    };

                    this.saveToCache(cacheKey, details);
                    return details;

                } catch (error) {
                    console.error('Error loading match details:', error);
                    return this.generateDefaultDetails(matchId);
                }
            }

            async fetchFixture(matchId) {
                const response = await fetch(`${this.baseUrl}/fixtures?id=${matchId}`, {
                    headers: { 'x-apisports-key': this.apiKey }
                });
                const data = await response.json();
                return data.response?.[0] || null;
            }

            async fetchOdds(matchId) {
                const response = await fetch(`${this.baseUrl}/odds?fixture=${matchId}`, {
                    headers: { 'x-apisports-key': this.apiKey }
                });
                const data = await response.json();
                return data.response?.[0] || null;
            }

            async fetchPredictions(matchId) {
                const response = await fetch(`${this.baseUrl}/predictions?fixture=${matchId}`, {
                    headers: { 'x-apisports-key': this.apiKey }
                });
                const data = await response.json();
                return data.response?.[0] || null;
            }

            async fetchH2H(matchId) {
                // First get the fixture to know teams
                const fixture = await this.fetchFixture(matchId);
                if (!fixture) return null;

                const team1Id = fixture.teams.home.id;
                const team2Id = fixture.teams.away.id;

                const response = await fetch(`${this.baseUrl}/fixtures/headtohead?h2h=${team1Id}-${team2Id}&last=5`, {
                    headers: { 'x-apisports-key': this.apiKey }
                });
                const data = await response.json();
                return data.response || [];
            }

            processOdds(rawOdds) {
                if (!rawOdds) return this.generateDefaultOdds();

                const odds = rawOdds.bookmakers?.[0]?.bets || [];
                
                return {
                    main: this.extractMainOdds(odds),
                    totals: this.extractTotalOdds(odds),
                    btts: this.extractBTTSOdds(odds),
                    handicap: this.extractHandicapOdds(odds),
                    correctScore: this.extractCorrectScoreOdds(odds)
                };
            }

            extractMainOdds(odds) {
                const matchWinner = odds.find(b => b.name === 'Match Winner')?.values || [];
                return {
                    home: this.findOdds(matchWinner, 'Home') || 1.90,
                    draw: this.findOdds(matchWinner, 'Draw') || 3.40,
                    away: this.findOdds(matchWinner, 'Away') || 3.10
                };
            }

            extractTotalOdds(odds) {
                const overUnder = odds.find(b => b.name.includes('Over/Under'))?.values || [];
                return {
                    over05: this.findOdds(overUnder, 'Over 0.5') || 1.10,
                    under05: this.findOdds(overUnder, 'Under 0.5') || 6.50,
                    over15: this.findOdds(overUnder, 'Over 1.5') || 1.40,
                    under15: this.findOdds(overUnder, 'Under 1.5') || 2.80,
                    over25: this.findOdds(overUnder, 'Over 2.5') || 1.85,
                    under25: this.findOdds(overUnder, 'Under 2.5') || 1.95,
                    over35: this.findOdds(overUnder, 'Over 3.5') || 2.60,
                    under35: this.findOdds(overUnder, 'Under 3.5') || 1.45
                };
            }

            extractBTTSOdds(odds) {
                const btts = odds.find(b => b.name.includes('Both Teams Score'))?.values || [];
                return {
                    yes: this.findOdds(btts, 'Yes') || 1.80,
                    no: this.findOdds(btts, 'No') || 1.90
                };
            }

            extractHandicapOdds(odds) {
                const handicap = odds.find(b => b.name.includes('Handicap'))?.values || [];
                return {
                    home_1: this.findOdds(handicap, 'Home -1') || 2.10,
                    away_1: this.findOdds(handicap, 'Away +1') || 1.70,
                    home_2: this.findOdds(handicap, 'Home -2') || 3.20,
                    away_2: this.findOdds(handicap, 'Away +2') || 1.30
                };
            }

            extractCorrectScoreOdds(odds) {
                const cs = odds.find(b => b.name.includes('Correct Score'))?.values || [];
                const scores = {};
                const commonScores = ['1-0', '2-0', '2-1', '3-0', '3-1', '3-2', '0-0', '1-1', '2-2', '0-1', '0-2', '1-2'];
                
                commonScores.forEach(score => {
                    scores[score] = this.findOdds(cs, score) || this.generateCorrectScoreOdds(score);
                });
                
                return scores;
            }

            findOdds(values, name) {
                const found = values.find(v => v.value === name);
                return found ? parseFloat(found.odd) : null;
            }

            generateCorrectScoreOdds(score) {
                const [h, a] = score.split('-').map(Number);
                const total = h + a;
                if (total === 0) return 12.00;
                if (total === 1) return 7.50;
                if (total === 2) return 8.50;
                if (total === 3) return 9.00;
                if (total === 4) return 15.00;
                return 20.00;
            }

            generateDefaultOdds() {
                return {
                    main: { home: 1.90, draw: 3.40, away: 3.10 },
                    totals: {
                        over05: 1.10, under05: 6.50,
                        over15: 1.40, under15: 2.80,
                        over25: 1.85, under25: 1.95,
                        over35: 2.60, under35: 1.45
                    },
                    btts: { yes: 1.80, no: 1.90 },
                    handicap: { home_1: 2.10, away_1: 1.70, home_2: 3.20, away_2: 1.30 },
                    correctScore: {
                        '1-0': 7.50, '2-0': 8.50, '2-1': 9.00,
                        '3-0': 15.00, '3-1': 17.00, '3-2': 25.00,
                        '0-0': 12.00, '1-1': 8.00, '2-2': 16.00,
                        '0-1': 8.00, '0-2': 9.50, '1-2': 12.00
                    }
                };
            }

            generateDefaultDetails(matchId) {
                return {
                    fixture: { id: matchId },
                    odds: this.generateDefaultOdds(),
                    predictions: {
                        home: 45,
                        draw: 25,
                        away: 30,
                        advice: 'Balanced match'
                    },
                    h2h: [],
                    lastUpdated: new Date()
                };
            }

            transformMatches(apiMatches) {
                return apiMatches.map(m => ({
                    fixture: {
                        id: m.fixture.id,
                        date: m.fixture.date,
                        status: m.fixture.status,
                        venue: m.fixture.venue
                    },
                    league: {
                        id: m.league.id,
                        name: m.league.name,
                        logo: m.league.logo,
                        country: m.league.country
                    },
                    teams: {
                        home: {
                            id: m.teams.home.id,
                            name: m.teams.home.name,
                            logo: m.teams.home.logo,
                            winner: m.teams.home.winner
                        },
                        away: {
                            id: m.teams.away.id,
                            name: m.teams.away.name,
                            logo: m.teams.away.logo,
                            winner: m.teams.away.winner
                        }
                    },
                    goals: m.goals,
                    score: m.score,
                    odds: this.generateDefaultOdds() // Will be updated with real odds
                }));
            }

            getFromCache(key) {
                const cached = this.cache.get(key);
                if (cached && Date.now() - cached.timestamp < 300000) { // 5 minutes
                    return cached.data;
                }
                return null;
            }

            saveToCache(key, data) {
                this.cache.set(key, {
                    data: data,
                    timestamp: Date.now()
                });
            }

        // ===== SELECT MARKET =====
        window.selectMarket = function(matchId, selection, odds, display, market) {

                return;
            }

            if (gameState.betType === 'single') {
                // Single bet - replace selection
                gameState.selectedBets = [{
                    matchId,
                    matchName,
                    market,
                    selection,
                    display,
                    odds,
                    match
                }];
                showToast('Bet added', 'success');
            } else {
                // Accumulator/System - add to existing
                if (gameState.selectedBets.length >= BETTING_RULES.maxSelections) {
                    showToast(`Maximum ${BETTING_RULES.maxSelections} selections`, 'error');
                    return;
                }
                
                // Check for duplicate match
                if (gameState.selectedBets.some(b => b.matchId === matchId)) {
                    showToast('Only one bet per match allowed', 'error');

                gameState.selectedBets.push({

                    match
                });

        // ===== UPDATE BET SLIP =====
        function updateBetSlip() {
            const container = document.getElementById('betslip-items');
            const totalOddsEl = document.getElementById('total-odds');
            const potentialWinEl = document.getElementById('potential-win');
            const placeReturnEl = document.getElementById('place-return');
            const totalReturnEl = document.getElementById('total-return');
            const placeBetBtn = document.getElementById('place-bet-btn');
            
            if (gameState.selectedBets.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: var(--text-dim); padding: 30px;"><i class="fas fa-arrow-up" style="font-size: 20px; margin-bottom: 10px;"></i><div>Click odds to add bets</div></div>';
                totalOddsEl.textContent = '0.00';
                potentialWinEl.textContent = '$0.00';
                placeReturnEl.textContent = '$0.00';
                totalReturnEl.textContent = '$0.00';
                placeBetBtn.disabled = true;
                return;
            }
            
            // Calculate total odds
            let totalOdds = gameState.selectedBets.reduce((acc, bet) => acc * bet.odds, 1);
            totalOdds = parseFloat(totalOdds.toFixed(2));
            
            const betAmount = parseFloat(document.getElementById('bet-amount').value) || BETTING_RULES.minBet;
            
            // Calculate returns
            let winReturn = betAmount * totalOdds;
            let placeReturn = 0;
            let totalReturn = winReturn;
            
            if (gameState.eachWay) {
                const placeOdds = (totalOdds - 1) / BETTING_RULES.eachWayPlaceTerms + 1;
                placeReturn = betAmount * placeOdds;
                totalReturn = winReturn + placeReturn;
            }
            
            // System bets calculation
            if (gameState.betType === 'system' && gameState.selectedBets.length >= 2) {
                const [k] = gameState.systemType.split('/').map(Number);
                const combinations = calculateCombinations(gameState.selectedBets, k);
                totalOdds = combinations.reduce((sum, combo) => {
                    const comboOdds = combo.reduce((acc, bet) => acc * bet.odds, 1);
                    return sum + comboOdds;
                }, 0) / combinations.length;
                totalReturn = betAmount * totalOdds;
            }
            
            totalOddsEl.textContent = totalOdds.toFixed(2);
            potentialWinEl.textContent = `$${winReturn.toFixed(2)}`;
            placeReturnEl.textContent = `$${placeReturn.toFixed(2)}`;
            totalReturnEl.textContent = `$${totalReturn.toFixed(2)}`;
            placeBetBtn.disabled = false;
            
            let html = '';
            gameState.selectedBets.forEach((bet, index) => {
                html += `
                    <div class="betslip-item">
                        <div class="betslip-item-header">
                            <span class="betslip-match">${bet.matchName}</span>
                            <span class="betslip-remove" onclick="removeBet(${index})">
                                <i class="fas fa-times"></i>
                            </span>
                        </div>
                        <div class="betslip-market">${bet.market} - ${bet.display}</div>
                        <div class="betslip-details">
                            <span class="betslip-odds">${bet.odds.toFixed(2)}</span>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }

        // ===== CALCULATE COMBINATIONS =====
        function calculateCombinations(selections, k) {
            const combinations = [];
            
            function combine(arr, k, start, current) {
                if (current.length === k) {
                    combinations.push([...current]);
                    return;
                }
                
                for (let i = start; i < arr.length; i++) {
                    current.push(arr[i]);
                    combine(arr, k, i + 1, current);
                    current.pop();
                }
            }
            
            combine(selections, k, 0, []);
            return combinations;
        }

        // ===== REMOVE BET =====
        window.removeBet = function(index) {
            gameState.selectedBets.splice(index, 1);
            updateBetSlip();
            showToast('Bet removed', 'info');

        // ===== PLACE BET =====
        async function placeBet() {
            const betAmount = parseFloat(document.getElementById('bet-amount').value);
            
            // Validation
            if (gameState.selectedBets.length === 0) {
                showToast('Select at least one bet', 'error');
                return;
            }
            
            if (betAmount < BETTING_RULES.minBet || betAmount > BETTING_RULES.maxBet) {
                showToast(`Bet must be between $${BETTING_RULES.minBet} and $${BETTING_RULES.maxBet}`, 'error');
                return;
            }
            
            if (betAmount > gameState.balance) {
                showToast('Insufficient funds', 'error');
                return;
            }
            
            if (gameState.userLimits.todayWagered + betAmount > gameState.userLimits.dailyMax) {
                showToast('Daily limit exceeded', 'error');
                return;
            }
            
            if (gameState.isPlacingBet) return;
            
            gameState.isPlacingBet = true;
            document.getElementById('place-bet-btn').disabled = true;
            
            const totalOdds = gameState.selectedBets.reduce((acc, bet) => acc * bet.odds, 1);
            
            const betData = {
                selections: gameState.selectedBets.map(s => ({
                    matchId: s.matchId,
                    matchName: s.matchName,
                    market: s.market,
                    selection: s.selection,
                    display: s.display,
                    odds: s.odds
                })),
                stake: betAmount,
                totalOdds: totalOdds,
                potentialWin: betAmount * totalOdds,
                betType: gameState.betType,
                systemType: gameState.betType === 'system' ? gameState.systemType : null,
                eachWay: gameState.eachWay
            };
            
            try {
                const result = await bettingSystem.placeBet(betData);
                
                if (result.offline) {
                    // Offline bet queued
                    gameState.selectedBets = [];
                    updateBetSlip();
                    displayOpenBets();
                } else {
                    // Online bet placed
                    gameState.balance = result.newBalance;
                    updateBalanceDisplay();
                    
                    gameState.selectedBets = [];
                    updateBetSlip();
                    
                    // Reload open bets
                    await loadOpenBets();
                    
                    showToast(`Bet placed! Ticket #${result.ticketNumber}`, 'success');
                }
                
            } catch (error) {
                console.error('Bet placement failed:', error);
                showToast(error.message, 'error');
            }
            
            gameState.isPlacingBet = false;
            document.getElementById('place-bet-btn').disabled = false;
        }

        // ===== LOAD OPEN BETS =====
        async function loadOpenBets() {
            try {
                const snapshot = await db.collection("football_bets")
                    .where("userId", "==", gameState.currentUser.uid)
                    .where("status", "==", "pending")
                    .orderBy("createdAt", "desc")
                    .limit(20)
                    .get();
                
                gameState.openBets = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    gameState.openBets.push({
                        ...data,
                        betId: doc.id,
                        createdAt: data.createdAt?.toDate() || new Date()
                    });
                });
                
                // Add offline bets
                const offlineBets = JSON.parse(localStorage.getItem('offlineBets') || '[]');
                offlineBets.forEach(bet => {
                    if (!gameState.openBets.some(b => b.betId === bet.betId)) {
                        gameState.openBets.push(bet);
                    }
                });
                
                displayOpenBets();
                
            } catch (error) {
                console.error('Error loading open bets:', error);
                // Show offline bets if online fetch fails
                const offlineBets = JSON.parse(localStorage.getItem('offlineBets') || '[]');
                gameState.openBets = offlineBets;
                displayOpenBets();
            }
        }
