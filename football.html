<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>⚽ XCrazyBet - Football Betting</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        :root {
            --primary: #00ff9d;
            --primary-dark: #00cc7a;
            --secondary: #ff9800;
            --danger: #ff4757;
            --success: #4caf50;
            --warning: #ffc107;
            --bg: #0a0f1a;
            --surface: #111827;
            --surface-light: #1a2332;
            --text: #ffffff;
            --text-dim: #a0a8c9;
            --border: #333;
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 70px;
        }

        /* Header */
        .header {
            background: var(--surface);
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 16px;
            font-weight: 700;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .logo i {
            font-size: 18px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stats-badge {
            background: var(--surface-light);
            padding: 4px 8px;
            border-radius: 20px;
            border: 1px solid var(--secondary);
            color: var(--secondary);
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .balance-display {
            background: var(--surface-light);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid var(--primary);
            color: var(--primary);
            font-weight: 600;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Main Layout */
        .main-layout {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 100%;
            margin: 12px auto;
            padding: 0 12px;
        }

        /* Date Selector */
        .date-selector {
            background: var(--surface);
            border-radius: 12px;
            padding: 12px;
            border: 1px solid var(--secondary);
        }

        .date-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .date-title {
            color: var(--primary);
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .date-nav {
            display: flex;
            gap: 8px;
        }

        .date-nav-btn {
            background: var(--surface-light);
            border: 1px solid var(--border);
            color: var(--text);
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
        }

        .date-nav-btn:active {
            background: var(--primary);
            color: #000;
        }

        .date-grid {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 4px 0;
            scrollbar-width: none;
        }

        .date-grid::-webkit-scrollbar {
            display: none;
        }

        .date-item {
            min-width: 60px;
            background: var(--surface-light);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 4px;
            text-align: center;
            cursor: pointer;
        }

        .date-item.active {
            background: var(--primary);
            border-color: var(--primary);
        }

        .date-item.active * {
            color: #000;
        }

        .date-weekday {
            font-size: 11px;
            color: var(--text-dim);
        }

        .date-day {
            font-size: 16px;
            font-weight: 700;
            color: var(--primary);
        }

        .date-month {
            font-size: 10px;
            color: var(--text-dim);
        }

        /* League Filter */
        .league-filter {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 8px 0;
            scrollbar-width: none;
        }

        .league-filter::-webkit-scrollbar {
            display: none;
        }

        .league-btn {
            padding: 6px 12px;
            background: var(--surface-light);
            border: 1px solid var(--border);
            border-radius: 20px;
            color: var(--text);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .league-btn:active {
            transform: scale(0.95);
        }

        .league-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: #000;
        }

        /* Matches Grid */
        .matches-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 500px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .match-card {
            background: var(--surface);
            border-radius: 12px;
            padding: 12px;
            border: 1px solid var(--border);
        }

        .match-card.live {
            border-left: 4px solid var(--danger);
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 10px;
        }

        .league-info {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .league-logo {
            width: 16px;
            height: 16px;
            object-fit: contain;
        }

        .league-name {
            color: var(--text-dim);
            font-weight: 500;
        }

        .match-datetime {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .match-time {
            padding: 4px 8px;
            background: var(--surface-light);
            border-radius: 4px;
            color: var(--secondary);
            font-weight: 600;
            font-size: 10px;
        }

        .match-time.live {
            background: var(--danger);
            color: white;
        }

        .match-venue {
            color: var(--text-dim);
            font-size: 9px;
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .teams {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .team {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
        }

        .team.away {
            justify-content: flex-end;
        }

        .team-logo {
            width: 28px;
            height: 28px;
            object-fit: contain;
        }

        .team-name {
            font-weight: 600;
            font-size: 12px;
        }

        .score {
            font-size: 16px;
            font-weight: 700;
            color: var(--primary);
            margin: 0 10px;
        }

        /* Market Sections */
        .market-section {
            margin-top: 12px;
        }

        .market-title {
            color: var(--text-dim);
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .market-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .market-btn {
            padding: 8px 4px;
            background: var(--surface-light);
            border: 1px solid var(--border);
            border-radius: 6px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 11px;
        }

        .market-btn:active {
            background: var(--primary);
            border-color: var(--primary);
            transform: scale(0.95);
        }

        .market-btn.selected {
            background: rgba(0,255,157,0.2);
            border-color: var(--primary);
        }

        .market-name {
            color: var(--text-dim);
            margin-bottom: 2px;
            font-size: 9px;
        }

        .market-odds {
            color: var(--primary);
            font-weight: 700;
            font-size: 12px;
        }

        /* Bet Slip */
        .betslip-section {
            background: var(--surface);
            border-radius: 12px;
            padding: 12px;
            border: 2px solid var(--primary);
            margin-top: 8px;
        }

        .betslip-tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 12px;
        }

        .betslip-tab {
            flex: 1;
            padding: 8px;
            background: var(--surface-light);
            border: none;
            color: var(--text);
            cursor: pointer;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
        }

        .betslip-tab.active {
            background: var(--primary);
            color: #000;
        }

        .betslip-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .betslip-title {
            color: var(--primary);
            font-weight: 700;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .betslip-clear {
            color: var(--danger);
            cursor: pointer;
            font-size: 11px;
            padding: 4px 8px;
            background: var(--surface-light);
            border-radius: 4px;
        }

        .betslip-items {
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 10px;
        }

        .betslip-item {
            background: var(--surface-light);
            border-radius: 8px;
            padding: 8px;
            margin-bottom: 6px;
        }

        .betslip-item-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .betslip-match {
            font-weight: 600;
            font-size: 11px;
        }

        .betslip-market {
            color: var(--secondary);
            font-size: 10px;
        }

        .betslip-details {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .betslip-odds {
            color: var(--primary);
            font-weight: 700;
            font-size: 13px;
        }

        .betslip-remove {
            color: var(--danger);
            cursor: pointer;
            font-size: 11px;
            padding: 2px 6px;
            background: rgba(255,71,87,0.1);
            border-radius: 4px;
        }

        .betslip-total {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-top: 1px solid var(--border);
            font-weight: 600;
            font-size: 13px;
        }

        .total-odds {
            color: var(--primary);
            font-size: 16px;
        }

        .bet-input-group {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--surface-light);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0 10px;
            margin: 8px 0;
        }

        .bet-input {
            flex: 1;
            padding: 10px 0;
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 14px;
            font-weight: 600;
        }

        .quick-bets {
            display: flex;
            gap: 6px;
            margin: 8px 0;
        }

        .quick-bet {
            flex: 1;
            padding: 6px;
            background: var(--surface-light);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
        }

        .potential-returns {
            background: var(--surface-light);
            padding: 8px;
            border-radius: 6px;
            margin: 8px 0;
        }

        .return-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin: 4px 0;
        }

        .return-row.total {
            font-weight: 700;
            color: var(--primary);
            border-top: 1px solid var(--border);
            padding-top: 6px;
            margin-top: 6px;
        }

        .place-bet-btn {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            border: none;
            border-radius: 8px;
            color: #000;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
        }

        .place-bet-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Open Bets Section */
        .open-bets-section {
            background: var(--surface);
            border-radius: 12px;
            padding: 12px;
            border: 1px solid var(--secondary);
            margin-top: 8px;
        }

        .section-title {
            color: var(--secondary);
            font-size: 13px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .section-title a {
            margin-left: auto;
            color: var(--primary);
            text-decoration: none;
            font-size: 11px;
        }

        .bets-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
        }

        .bet-card {
            background: var(--surface-light);
            border-radius: 8px;
            padding: 10px;
            border-left: 3px solid;
        }

        .bet-card.pending { border-color: var(--secondary); }
        .bet-card.won { border-color: var(--success); }
        .bet-card.lost { border-color: var(--danger); }

        .bet-card-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 10px;
        }

        .bet-ticket {
            color: var(--text-dim);
        }

        .bet-status {
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: 600;
            font-size: 9px;
        }

        .bet-status.pending { background: var(--secondary); color: #000; }
        .bet-status.won { background: var(--success); color: #000; }
        .bet-status.lost { background: var(--danger); color: #000; }

        .bet-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            border-top: 1px solid var(--border);
            padding-top: 6px;
            margin-top: 6px;
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--surface);
            display: flex;
            justify-content: space-around;
            padding: 8px 12px;
            border-top: 2px solid var(--primary);
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--text-dim);
            font-size: 10px;
            gap: 4px;
            padding: 6px 12px;
            border-radius: 8px;
        }

        .nav-item i { 
            font-size: 18px; 
        }

        .nav-item.active { 
            color: var(--primary);
            background: var(--surface-light);
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 30px;
        }

        .loading-spinner {
            border: 3px solid var(--surface-light);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 10px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Toast */
        .toast-container {
            position: fixed;
            bottom: 80px;
            left: 12px;
            right: 12px;
            z-index: 1000;
        }

        .toast {
            padding: 12px 16px;
            background: var(--surface);
            border-radius: 8px;
            border-left: 4px solid var(--primary);
            color: white;
            margin-top: 8px;
            font-size: 12px;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(100%);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .toast.success { border-left-color: var(--success); }
        .toast.error { border-left-color: var(--danger); }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <i class="fas fa-futbol"></i>
            XCrazyBet
        </div>
        <div class="user-info">
            <div class="stats-badge">
                <i class="fas fa-chart-line"></i>
                <span id="win-rate">0%</span>
            </div>
            <div class="balance-display">
                <i class="fas fa-wallet"></i>
                $<span id="balance-val">0.00</span>
            </div>
        </div>
    </header>

    <div class="main-layout">
        <!-- Date Selector -->
        <div class="date-selector">
            <div class="date-header">
                <div class="date-title">
                    <i class="fas fa-calendar"></i> MATCH DATES
                </div>
                <div class="date-nav">
                    <button class="date-nav-btn" id="prev-week"><i class="fas fa-chevron-left"></i></button>
                    <button class="date-nav-btn" id="next-week"><i class="fas fa-chevron-right"></i></button>
                </div>
            </div>
            <div class="date-grid" id="date-grid">
                <!-- Dates loaded here -->
            </div>
        </div>

        <!-- League Filter -->
        <div class="league-filter" id="league-buttons">

        <!-- Matches Grid -->
        <div class="market-tabs">
            <div id="matches-grid" class="matches-grid">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>Loading matches...</p>
                </div>
            </div>
        </div>

        <!-- Bet Slip -->
        <div class="betslip-section">
            <div class="betslip-tabs">
                <button class="betslip-tab active" data-betslip="single">SINGLE</button>

            <div class="betslip-header">
                <div class="betslip-title">

                    <i class="fas fa-trash"></i> CLEAR
                </div>

            <div class="betslip-total">
                <span>Total Odds:</span>
                <span class="total-odds" id="total-odds">0.00</span>
            </div>

            <div class="quick-bets">
                <button class="quick-bet" data-amount="10">$10</button>
                <button class="quick-bet" data-amount="25">$25</button>
                <button class="quick-bet" data-amount="50">$50</button>
                <button class="quick-bet" data-amount="100">$100</button>
            </div>

            <div class="bet-input-group">
                <input type="number" class="bet-input" id="bet-amount" value="10" min="1" max="1000" step="1">
                <span class="currency">$</span>
            </div>

            <div class="potential-returns">
                <div class="return-row">
                    <span>Potential Returns:</span>
                    <span id="potential-win">$0.00</span>
                </div>
                <div class="return-row total">
                    <span>Total:</span>
                    <span id="total-return">$0.00</span>
                </div>
            </div>

            <button class="place-bet-btn" id="place-bet-btn" disabled>
                <i class="fas fa-coins"></i> PLACE BET
            </button>
        </div>

        <!-- Open Bets -->
        <div class="open-bets-section">
            <div class="section-title">
                <i class="fas fa-ticket-alt"></i> MY OPEN BETS
                <a href="list.bets.html">VIEW ALL <i class="fas fa-arrow-right"></i></a>
            </div>
            <div id="open-bets-grid" class="bets-grid"></div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="#" class="nav-item active">
            <i class="fas fa-futbol"></i> Football
        </a>
        <a href="list.bets.html" class="nav-item">
            <i class="fas fa-ticket-alt"></i> My Bets
        </a>
        <a href="#" class="nav-item">
            <i class="fas fa-chart-line"></i> Stats
        </a>
        <a href="#" class="nav-item">
            <i class="fas fa-wallet"></i> Wallet
        </a>
    </nav>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962",
            measurementId: "G-PTV4XMYQ6P"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // API Config
        const API_KEY = '2396236d9d5cd07468ce280da8390ad5';
        const BASE_URL = 'https://v3.football.api-sports.io';

        // Betting Rules
        const BETTING_RULES = {
            minBet: 1,
            maxBet: 1000,
            maxSelections: 10,
            dailyMax: 500
        };

        // State
        const gameState = {
            currentUser: null,
            balance: 0,
            selectedBets: [],
            betType: 'single',
            matches: [],
            filteredMatches: [],
            currentLeague: 'all',
            currentDate: new Date(),
            openBets: [],
            stats: { totalBets: 0, wonBets: 0 }
        };

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            setupEventListeners();
            generateDateGrid();
        });

        // Auth
        function checkAuth() {
            auth.onAuthStateChanged((user) => {
                if (user) {
                    gameState.currentUser = user;
                    loadBalance();
                    loadMatches();
                    loadOpenBets();
                    loadUserStats();
                    setupRealTimeListeners();
                    startBetSettlement();
                } else {
                    showToast('Please login to continue', 'error');
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                }

        async function loadUserStats() {

            const today = new Date();
            
            for (let i = -3; i <= 3; i++) {
                const date = new Date(today);
                date.setDate(today.getDate() + i);
                
                const isToday = i === 0;
                const day = date.getDate();
                const month = date.toLocaleString('default', { month: 'short' });
                const weekday = date.toLocaleString('default', { weekday: 'short' });
                const dateStr = date.toISOString().split('T')[0];
                
                const div = document.createElement('div');
                div.className = `date-item ${isToday ? 'active' : ''}`;
                div.dataset.date = dateStr;
                div.innerHTML = `
                    <div class="date-weekday">${weekday}</div>
                    <div class="date-day">${day}</div>
                    <div class="date-month">${month}</div>
                `;
                
                div.addEventListener('click', () => {
                    document.querySelectorAll('.date-item').forEach(d => d.classList.remove('active'));
                    div.classList.add('active');
                    gameState.currentDate = date;
                    loadMatches();

        // Load Matches (7-day window)
        async function loadMatches() {
            const grid = document.getElementById('matches-grid');
            grid.innerHTML = '<div class="loading"><div class="loading-spinner"></div><p>Loading matches...</p></div>';
            
            try {
                // Calculate date range (7 days)
                const fromDate = new Date(gameState.currentDate);
                fromDate.setDate(fromDate.getDate() - 3);
                const toDate = new Date(gameState.currentDate);
                toDate.setDate(toDate.getDate() + 3);
                
                const fromStr = fromDate.toISOString().split('T')[0];
                const toStr = toDate.toISOString().split('T')[0];
                
                // Fetch fixtures for date range
                const response = await fetch(
                    `${BASE_URL}/fixtures?from=${fromStr}&to=${toStr}&timezone=America/New_York`,
                    {
                        headers: { 'x-apisports-key': API_KEY }
                    }
                );
                
                if (!response.ok) throw new Error('API error');
                
                const data = await response.json();
                
                if (data.response && data.response.length > 0) {
                    gameState.matches = await Promise.all(data.response.map(f => enrichMatchWithOdds(f)));
                } else {
                    gameState.matches = [];
                }
                
                extractLeagues();
                filterMatches(gameState.currentLeague);
                
            } catch (error) {
                console.error('Error loading matches:', error);
                loadSampleMatches();
            }
        }

        // Enrich match with odds
        async function enrichMatchWithOdds(fixture) {
            try {
                // Fetch odds for this fixture
                const oddsResponse = await fetch(
                    `${BASE_URL}/odds?fixture=${fixture.fixture.id}`,
                    {
                        headers: { 'x-apisports-key': API_KEY }
                    }
                );
                
                let odds = {
                    home: 1.95,
                    draw: 3.40,
                    away: 3.80,
                    over25: 1.85,
                    under25: 1.95,
                    btts_yes: 1.90,
                    btts_no: 1.90
                };
                
                if (oddsResponse.ok) {
                    const oddsData = await oddsResponse.json();
                    if (oddsData.response && oddsData.response[0]) {
                        odds = extractOddsFromResponse(oddsData.response[0]);
                    }
                }
                
                return {
                    fixture: {
                        id: fixture.fixture.id,
                        date: fixture.fixture.date,
                        status: fixture.fixture.status,
                        venue: fixture.fixture.venue
                    },
                    league: {
                        id: fixture.league.id,
                        name: fixture.league.name,
                        logo: fixture.league.logo
                    },
                    teams: {
                        home: { 
                            id: fixture.teams.home.id, 
                            name: fixture.teams.home.name, 
                            logo: fixture.teams.home.logo 
                        },
                        away: { 
                            id: fixture.teams.away.id, 
                            name: fixture.teams.away.name, 
                            logo: fixture.teams.away.logo 
                        }
                    },
                    goals: fixture.goals,
                    odds: odds
                };
            } catch (error) {
                console.error('Error enriching match:', error);
                return fixture;
            }
        }

        // Extract odds from API response
        function extractOddsFromResponse(oddsData) {
            const odds = {
                home: 1.95,
                draw: 3.40,
                away: 3.80,
                over25: 1.85,
                under25: 1.95,
                btts_yes: 1.90,
                btts_no: 1.90
            };
            
            if (oddsData.bookmakers && oddsData.bookmakers[0]) {
                const bookie = oddsData.bookmakers[0];
                bookie.bets.forEach(bet => {
                    if (bet.name === 'Match Winner') {
                        bet.values.forEach(v => {
                            if (v.value === 'Home') odds.home = parseFloat(v.odd);
                            if (v.value === 'Draw') odds.draw = parseFloat(v.odd);
                            if (v.value === 'Away') odds.away = parseFloat(v.odd);
                        });
                    }
                    if (bet.name === 'Over/Under' && bet.values[0]?.value === 'Over 2.5') {
                        odds.over25 = parseFloat(bet.values[0].odd);
                        odds.under25 = parseFloat(bet.values[1].odd);
                    }
                    if (bet.name === 'Both Teams Score') {
                        bet.values.forEach(v => {
                            if (v.value === 'Yes') odds.btts_yes = parseFloat(v.odd);
                            if (v.value === 'No') odds.btts_no = parseFloat(v.odd);
                        });
                    }
                });
            }
            
            return odds;
        }

        // Select market
        window.selectMarket = function(matchId, selection, odds, display, market) {
            const match = gameState.matches.find(m => m.fixture.id === matchId);
            if (!match) return;
            
            if (!['NS', 'TBD'].includes(match.fixture.status.short)) {
                showToast('Match already started', 'error');
                return;
            }
            
            const matchName = `${match.teams.home.name} vs ${match.teams.away.name}`;
            
            if (gameState.betType === 'single') {
                gameState.selectedBets = [{
                    matchId,
                    matchName,
                    market,
                    selection,
                    display,
                    odds
                }];
            } else {
                if (gameState.selectedBets.length >= BETTING_RULES.maxSelections) {
                    showToast(`Max ${BETTING_RULES.maxSelections} selections`, 'error');
                    return;
                }
                
                if (gameState.selectedBets.some(b => b.matchId === matchId)) {
                    showToast('Only one bet per match', 'error');
                    return;
                }
                
                gameState.selectedBets.push({
                    matchId,
                    matchName,
                    market,
                    selection,
                    display,
                    odds
                });
            }
            
            updateBetSlip();
            showToast('Bet added', 'success');
        };

        // Update bet slip
        function updateBetSlip() {
            const container = document.getElementById('betslip-items');
            const totalOddsEl = document.getElementById('total-odds');
            const potentialWinEl = document.getElementById('potential-win');
            const totalReturnEl = document.getElementById('total-return');
            const placeBetBtn = document.getElementById('place-bet-btn');
            
            if (gameState.selectedBets.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: var(--text-dim); padding: 15px;"><i class="fas fa-arrow-up"></i> Click odds to add bets</div>';
                totalOddsEl.textContent = '0.00';
                potentialWinEl.textContent = '$0.00';
                totalReturnEl.textContent = '$0.00';
                placeBetBtn.disabled = true;
                return;
            }
            
            const totalOdds = gameState.selectedBets.reduce((acc, bet) => acc * bet.odds, 1);
            const betAmount = parseFloat(document.getElementById('bet-amount').value) || 10;
            const winReturn = betAmount * totalOdds;
            
            totalOddsEl.textContent = totalOdds.toFixed(2);
            potentialWinEl.textContent = `$${winReturn.toFixed(2)}`;
            totalReturnEl.textContent = `$${winReturn.toFixed(2)}`;

        // Generate ticket number
        function generateTicketNumber() {
            const date = new Date();
            const random = Math.random().toString(36).substring(2, 8).toUpperCase();
            return `TKT-${date.getFullYear()}${('0'+(date.getMonth()+1)).slice(-2)}${('0'+date.getDate()).slice(-2)}-${random}`;
        }

        // Place bet
        async function placeBet() {
            const betAmount = parseFloat(document.getElementById('bet-amount').value);
            
            if (gameState.selectedBets.length === 0) {
                showToast('Select at least one bet', 'error');
                return;
            }
            
            if (betAmount < BETTING_RULES.minBet || betAmount > BETTING_RULES.maxBet) {
                showToast(`Bet must be between $${BETTING_RULES.minBet} and $${BETTING_RULES.maxBet}`, 'error');
                return;
            }
            
            if (betAmount > gameState.balance) {
                showToast('Insufficient funds', 'error');
                return;
            }
            
            const totalOdds = gameState.selectedBets.reduce((acc, bet) => acc * bet.odds, 1);
            const ticketNumber = generateTicketNumber();
            
            try {
                // Deduct from wallet
                await db.runTransaction(async (transaction) => {
                    const walletRef = db.collection("wallets").doc(gameState.currentUser.uid);
                    const walletDoc = await transaction.get(walletRef);
                    
                    const newBalance = walletDoc.data().balance - betAmount;
                    if (newBalance < 0) throw new Error("Insufficient funds");
                    
                    transaction.update(walletRef, { balance: newBalance });
                });
                
                // Save bet
                await db.collection("football_bets").doc(ticketNumber).set({
                    ticketNumber,
                    userId: gameState.currentUser.uid,
                    selections: gameState.selectedBets,
                    stake: betAmount,
                    totalOdds,
                    status: 'pending',
                    createdAt: new Date()
                });
                
                gameState.balance -= betAmount;
                updateBalanceDisplay();
                
                showToast(`Bet placed! #${ticketNumber}`, 'success');
                
                gameState.selectedBets = [];
                updateBetSlip();
                await loadOpenBets();
                
            } catch (error) {
                console.error('Error placing bet:', error);
                showToast('Failed to place bet', 'error');
            }
        }

        // Load open bets
        async function loadOpenBets() {
            try {
                const snapshot = await db.collection("football_bets")
                    .where("userId", "==", gameState.currentUser.uid)
                    .where("status", "==", "pending")
                    .orderBy("createdAt", "desc")
                    .limit(3)
                    .get();
                
                const grid = document.getElementById('open-bets-grid');
                
                if (snapshot.empty) {
                    grid.innerHTML = '<div style="text-align: center; padding: 20px; color: var(--text-dim);">No open bets</div>';
                    return;
                }
                
                let html = '';
                snapshot.forEach(doc => {
                    const bet = doc.data();
                    html += `
                        <div class="bet-card pending">
                            <div class="bet-card-header">
                                <span class="bet-ticket">#${bet.ticketNumber}</span>
                                <span class="bet-status pending">PENDING</span>
                            </div>
                            <div class="bet-details">
                                ${bet.selections.length} selections @ ${bet.totalOdds.toFixed(2)}
                            </div>
                            <div class="bet-footer">
                                <span class="bet-stake">$${bet.stake.toFixed(2)}</span>
                                <span class="bet-return">$${(bet.stake * bet.totalOdds).toFixed(2)}</span>
                            </div>
                        </div>
                    `;
                });
                
                grid.innerHTML = html;
            } catch (error) {
                console.error('Error loading open bets:', error);
            }
        }

        // Bet settlement service
        function startBetSettlement() {
            setInterval(async () => {
                if (!auth.currentUser) return;
                
                try {
                    const snapshot = await db.collection("football_bets")
                        .where("status", "==", "pending")
                        .get();
                    
                    for (const doc of snapshot.docs) {
                        const bet = doc.data();
                        
                        // Check if all matches are finished
                        const allFinished = await checkMatchesFinished(bet.selections);
                        
                        if (allFinished) {
                            await settleBet(bet, doc.id);
                        }
                    }
                } catch (error) {
                    console.error('Error in bet settlement:', error);
                }
            }, 60000);
        }

        // Check if matches are finished
        async function checkMatchesFinished(selections) {
            for (const selection of selections) {
                try {
                    const response = await fetch(
                        `${BASE_URL}/fixtures?id=${selection.matchId}`,
                        { headers: { 'x-apisports-key': API_KEY } }
                    );
                    
                    if (response.ok) {
                        const data = await response.json();
                        const match = data.response[0];
                        
                        if (!match || !['FT', 'AET', 'PEN'].includes(match.fixture.status.short)) {
                            return false;
                        }
                    }
                } catch (error) {
                    console.error('Error checking match:', error);
                    return false;
                }
            }
            return true;
        }

        // Settle bet
        async function settleBet(bet, betId) {
            try {
                const won = await checkBetWins(bet.selections);
                
                if (won) {
                    const winAmount = bet.stake * bet.totalOdds;
                    
                    // Credit winnings
                    await db.runTransaction(async (transaction) => {
                        const walletRef = db.collection("wallets").doc(bet.userId);
                        const walletDoc = await transaction.get(walletRef);
                        
                        transaction.update(walletRef, {
                            balance: walletDoc.data().balance + winAmount
                        });
                    });
                    
                    await db.collection("football_bets").doc(betId).update({
                        status: 'won',
                        return: winAmount,
                        settledAt: new Date()
                    });
                    
                    if (bet.userId === auth.currentUser?.uid) {
                        showToast(`🎉 Bet won! +$${winAmount.toFixed(2)}`, 'success');
                    }
                } else {
                    await db.collection("football_bets").doc(betId).update({
                        status: 'lost',
                        return: 0,
                        settledAt: new Date()
                    });
                    
                    if (bet.userId === auth.currentUser?.uid) {
                        showToast('😞 Bet lost', 'error');
                    }
                }
                
                if (bet.userId === auth.currentUser?.uid) {
                    await loadOpenBets();
                    await loadUserStats();
                }
                
            } catch (error) {
                console.error('Error settling bet:', error);
            }
        }

        // Check if bet wins
        async function checkBetWins(selections) {
            for (const selection of selections) {
                try {
                    const response = await fetch(
                        `${BASE_URL}/fixtures?id=${selection.matchId}`,
                        { headers: { 'x-apisports-key': API_KEY } }
                    );
                    
                    if (!response.ok) return false;
                    
                    const data = await response.json();
                    const match = data.response[0];
                    
                    if (!match) return false;
                    
                    const homeGoals = match.goals.home;
                    const awayGoals = match.goals.away;
                    
                    let won = false;
                    
                    switch(selection.market) {
                        case 'Match Winner':
                            if (selection.selection === '1') won = homeGoals > awayGoals;
                            else if (selection.selection === 'X') won = homeGoals === awayGoals;
                            else if (selection.selection === '2') won = awayGoals > homeGoals;
                            break;
                            
                        case 'Total Goals':
                            const totalGoals = homeGoals + awayGoals;
                            if (selection.selection.includes('Over')) won = totalGoals > 2.5;
                            else won = totalGoals < 2.5;
                            break;
                            
                        case 'BTTS':
                            const bothScored = homeGoals > 0 && awayGoals > 0;
                            won = bothScored === (selection.selection === 'Yes');
                            break;
                    }
                    
                    if (!won) return false;
                    
                } catch (error) {
                    console.error('Error checking bet win:', error);
                    return false;
                }
            }
            
            return true;
        }

        // Setup real-time listeners
        function setupRealTimeListeners() {
            db.collection("wallets").doc(gameState.currentUser.uid).onSnapshot((doc) => {
                if (doc.exists) {
                    gameState.balance = doc.data().balance || 0;
                    updateBalanceDisplay();
                }
            });
        }

        // Toast notifications
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        // Event listeners
        function setupEventListeners() {
            document.getElementById('prev-week').addEventListener('click', () => {
                gameState.currentDate.setDate(gameState.currentDate.getDate() - 7);
                generateDateGrid();
                loadMatches();
            });
            
            document.getElementById('next-week').addEventListener('click', () => {
                gameState.currentDate.setDate(gameState.currentDate.getDate() + 7);
                generateDateGrid();
                loadMatches();
            });
            
            document.querySelectorAll('.betslip-tab').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.betslip-tab').forEach(t => t.classList.remove('active'));
                    btn.classList.add('active');
                    gameState.betType = btn.dataset.betslip;
                    gameState.selectedBets = [];
                    updateBetSlip();
                });
            });
            
            document.getElementById('clear-betslip').addEventListener('click', clearBetSlip);
            document.getElementById('place-bet-btn').addEventListener('click', placeBet);
            
            document.querySelectorAll('.quick-bet').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.getElementById('bet-amount').value = btn.dataset.amount;
                    updateBetSlip();
                });
            });
            
            document.getElementById('bet-amount').addEventListener('input', updateBetSlip);
        }
    </script>
</body>
</html>
