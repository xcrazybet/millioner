        // ===== HANDLE BET UPDATE =====
        function handleBetUpdate(bet) {
            const index = gameState.openBets.findIndex(b => b.betId === bet.betId);
            
            if (bet.status !== 'pending') {
                // Remove from open bets
                if (index !== -1) {
                    gameState.openBets.splice(index, 1);
                }
                
                // Add to history
                gameState.betHistory.unshift({
                    ...bet,
                    timestamp: bet.settledAt?.toDate() || new Date()
                });
                
                // Show result
                if (bet.status === 'won') {
                    showBetResult(true, bet.return, bet.stake, bet.ticketNumber);
                    showToast(`🎉 Bet won! +$${bet.return.toFixed(2)}`, 'success');
                } else if (bet.status === 'lost') {
                    showBetResult(false, 0, bet.stake, bet.ticketNumber);
                    showToast('😞 Bet lost', 'error');
                }
                
                displayOpenBets();
                displayHistory();
                updateStats();
            }
        }

        // ===== CHECK BET SETTLEMENT =====
        async function checkBetSettlement() {
            // Check finished matches
            const finishedMatches = gameState.matches.filter(m => 
                ['FT', 'AET', 'PEN'].includes(m.fixture.status.short)
            );
            
            if (finishedMatches.length === 0) return;
            
            // Update match results
            finishedMatches.forEach(match => {
                gameState.matchDetails[match.fixture.id] = {
                    goals: match.goals,
                    status: match.fixture.status
                };
            });
            
            // Check pending bets
            for (const bet of gameState.openBets) {
                if (bet.offline) continue;
                
                const allMatchesFinished = bet.selections.every(s => 
                    gameState.matchDetails[s.matchId] !== undefined
                );
                
                if (allMatchesFinished) {
                    await settleBet(bet);
                }
            }
        }

        async function settleBet(bet) {
            const won = bet.selections.every(s => checkBetWin(s, gameState.matchDetails[s.matchId]));
            
            let winAmount = 0;
            let status = 'lost';
            
            if (won) {
                winAmount = bet.stake * bet.totalOdds;
                status = 'won';
                
                // Process win transaction
                await processWin(bet, winAmount);
            }
            
            // Update bet in Firebase
            try {
                await db.collection("football_bets").doc(bet.betId).update({
                    status: status,
                    return: winAmount,
                    settledAt: firebase.firestore.FieldValue.serverTimestamp()
                });
            } catch (error) {
                console.error('Error updating bet:', error);
            }
        }

        function checkBetWin(bet, matchResult) {
            if (!matchResult) return false;
            
            const homeGoals = matchResult.goals.home;
            const awayGoals = matchResult.goals.away;
            const totalGoals = homeGoals + awayGoals;
            
            switch(bet.market) {
                case 'Match Winner':
                    if (bet.selection === '1') return homeGoals > awayGoals;
                    if (bet.selection === 'X') return homeGoals === awayGoals;
                    if (bet.selection === '2') return awayGoals > homeGoals;
                    break;
                    
                case 'Total Goals':
                    const threshold = parseFloat(bet.display.includes('O') ? bet.display.substring(1) : bet.display.substring(1));
                    if (bet.selection.includes('Over')) return totalGoals > threshold;
                    if (bet.selection.includes('Under')) return totalGoals < threshold;
                    break;
                    
                case 'BTTS':
                    const bothScored = homeGoals > 0 && awayGoals > 0;
                    return bothScored === (bet.selection === 'Yes');
                    
                case 'Double Chance':
                    if (bet.selection === '1X') return homeGoals >= awayGoals;
                    if (bet.selection === '12') return homeGoals !== awayGoals;
                    if (bet.selection === 'X2') return awayGoals >= homeGoals;
                    break;
            }
            
            return false;
        }

        async function processWin(bet, amount) {
            const walletRef = db.collection("wallets").doc(gameState.currentUser.uid);
            
            try {
                await db.runTransaction(async (transaction) => {
                    const walletDoc = await transaction.get(walletRef);
                    const currentBalance = walletDoc.data().balance || 0;
                    
                    transaction.update(walletRef, {
                        balance: currentBalance + amount,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                });
                
                gameState.balance += amount;
                updateBalanceDisplay();
                
            } catch (error) {
                console.error('Error processing win:', error);
            }
        }

        // ===== LOAD BET HISTORY =====
        async function loadBetHistory() {
            try {
                const snapshot = await db.collection("football_bets")
                    .where("userId", "==", gameState.currentUser.uid)
                    .where("status", "in", ["won", "lost", "cashed_out"])
                    .orderBy("createdAt", "desc")
                    .limit(50)
                    .get();
                
                gameState.betHistory = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    gameState.betHistory.push({
                        ...data,
                        timestamp: data.createdAt?.toDate() || new Date()
                    });
                });
                
                displayHistory();
                updateStats();
                
            } catch (error) {
                console.error('Error loading history:', error);
            }
        }

        function displayHistory(filter = 'all') {
            const list = document.getElementById('history-list');
            
            let filtered = gameState.betHistory;
            if (filter !== 'all') {
                filtered = gameState.betHistory.filter(b => b.status === filter);
            }
            
            if (filtered.length === 0) {
                list.innerHTML = '<div style="text-align: center; padding: 30px; color: var(--text-dim);">No history</div>';
                return;
            }
            
            let html = '';
            filtered.slice(0, 15).forEach(bet => {
                const date = bet.timestamp.toLocaleDateString();
                const time = bet.timestamp.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                const returnAmount = bet.return || 0;
                const profitLoss = returnAmount - bet.stake;
                
                html += `
                    <div class="bet-card ${bet.status}">
                        <div class="bet-card-header">
                            <span class="bet-ticket">#${bet.ticketNumber}</span>
                            <span class="bet-status ${bet.status}">${bet.status.toUpperCase()}</span>
                        </div>
                        <div class="bet-details">
                            ${bet.selections.length} selections @ ${bet.totalOdds.toFixed(2)}
                        </div>
                        <div class="bet-footer">
                            <span class="bet-stake">$${bet.stake.toFixed(2)}</span>
                            <span class="bet-return ${bet.status}">
                                ${profitLoss > 0 ? '+' : ''}$${returnAmount.toFixed(2)}
                            </span>
                            <span class="history-time">${date}</span>
                        </div>
                    </div>
                `;
            });
            
            list.innerHTML = html;
        }

        // ===== UPDATE STATS =====
        function updateStats() {
            const won = gameState.betHistory.filter(b => b.status === 'won').length;
            const total = gameState.betHistory.length;
            const winRate = total > 0 ? (won / total * 100).toFixed(1) : 0;
            
            document.getElementById('win-rate').textContent = `${winRate}%`;
        }

        // ===== SHOW BET RESULT =====
        function showBetResult(win, winAmount, stake, ticketNumber) {
            const overlay = document.getElementById('result-overlay');
            const icon = document.getElementById('result-icon');
            const title = document.getElementById('result-title');
            const amount = document.getElementById('result-amount');
            
            icon.innerHTML = win ? '🎉' : '😞';
            icon.className = `result-icon ${win ? 'win' : 'lose'}`;
            
            title.textContent = win ? 'YOU WIN!' : 'BET LOST';
            title.className = `result-title ${win ? 'win' : 'lose'}`;
            
            document.getElementById('result-details').innerHTML = `
                Ticket: ${ticketNumber}<br>
                Stake: $${stake.toFixed(2)}
            `;
            
            amount.textContent = win ? `+$${winAmount.toFixed(2)}` : `-$${stake.toFixed(2)}`;
            amount.className = `result-amount ${win ? 'win' : 'lose'}`;
            
            overlay.classList.add('show');
        }

        function closeResultOverlay() {
            document.getElementById('result-overlay').classList.remove('show');
        }

        // ===== TOAST NOTIFICATIONS =====
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        // ===== EVENT LISTENERS =====
        function setupEventListeners() {
            // League filter
            document.querySelectorAll('.league-btn').forEach(btn => {
                btn.addEventListener('click', () => filterMatches(btn.dataset.league));
            });
            
            // Market tabs
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', () => filterMarket(btn.dataset.market));
            });
            
            // Bet slip tabs
            document.querySelectorAll('.betslip-tab').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.betslip-tab').forEach(t => t.classList.remove('active'));
                    btn.classList.add('active');
                    gameState.betType = btn.dataset.betslip;
                    
                    // Show/hide system options
                    document.getElementById('system-options').style.display = 
                        gameState.betType === 'system' ? 'block' : 'none';
                    
                    // Clear selections when switching modes
                    gameState.selectedBets = [];
                    updateBetSlip();
                });
            });
            
            // System type change
            document.getElementById('system-type').addEventListener('change', (e) => {
                gameState.systemType = e.target.value;
                updateBetSlip();
            });
            
            // Each way toggle
            document.getElementById('each-way').addEventListener('change', (e) => {
                gameState.eachWay = e.target.checked;
                updateBetSlip();
            });
            
            // Clear bet slip
            document.getElementById('clear-betslip').addEventListener('click', clearBetSlip);
            
            // Place bet button
            document.getElementById('place-bet-btn').addEventListener('click', placeBet);
            
            // Quick bet amounts
            document.querySelectorAll('.quick-bet-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const amount = parseFloat(btn.dataset.amount);
                    document.getElementById('bet-amount').value = amount;
                    updateBetSlip();
                });
            });
            
            // Bet amount input
            document.getElementById('bet-amount').addEventListener('input', (e) => {
                let value = parseFloat(e.target.value) || BETTING_RULES.minBet;
                value = Math.max(BETTING_RULES.minBet, Math.min(value, BETTING_RULES.maxBet));
                e.target.value = value;
                updateBetSlip();
            });
            
            // History tabs
            document.querySelectorAll('.history-tab').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.history-tab').forEach(t => t.classList.remove('active'));
                    btn.classList.add('active');
                    displayHistory(btn.dataset.history);
                });
            });
            
            // Close overlay
            document.getElementById('result-overlay').addEventListener('click', (e) => {
                if (e.target === document.getElementById('result-overlay')) {
                    closeResultOverlay();
                }
            });
        }

        // ===== INITIALIZATION =====
        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            setupEventListeners();
        });

        // Make functions global
        window.closeResultOverlay = closeResultOverlay;
        window.selectMarket = selectMarket;
        window.removeBet = removeBet;
        window.showMatchAnalytics = showMatchAnalytics;
    </script>
</body>
</html>
