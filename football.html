<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚽ XCrazyBet Pro - Professional Football Betting</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        :root {
            --primary: #00ff9d;
            --primary-dark: #00cc7a;
            --secondary: #ff9800;
            --danger: #ff4757;
            --success: #4caf50;
            --warning: #ffc107;
            --info: #2196f3;
            --bg: #0a0f1a;
            --surface: #111827;
            --surface-light: #1a2332;
            --surface-lighter: #2a3440;
            --text: #ffffff;
            --text-dim: #a0a8c9;
            --text-dimmer: #6b7280;
            --border: #2a3440;
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* Header */
        .header {
            background: var(--surface);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .balance-display {
            background: var(--surface-light);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--primary);
            color: var(--primary);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stats-badge {
            background: var(--surface-light);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--secondary);
            color: var(--secondary);
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Main Layout */
        .main-layout {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 20px;
            max-width: 1600px;
            margin: 20px auto;
            padding: 0 20px;
        }

        /* Left Column */
        .left-column {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Market Tabs */
        .market-tabs {
            background: var(--surface);
            border-radius: 12px;
            padding: 15px;
            border: 1px solid var(--border);
        }

        .tabs-header {
            display: flex;
            gap: 10px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 8px 16px;
            background: transparent;
            border: none;
            color: var(--text-dim);
            font-weight: 600;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
            font-size: 13px;
        }

        .tab-btn:hover {
            background: var(--surface-light);
            color: var(--primary);
        }

        .tab-btn.active {
            background: var(--primary);
            color: #000;
        }

        /* League Filter */
        .league-filter {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }

        .league-btn {
            padding: 6px 15px;
            background: var(--surface-light);
            border: 1px solid var(--border);
            border-radius: 20px;
            color: var(--text);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .league-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .league-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: #000;
        }

        /* Status Bar */
        .status-bar {
            display: flex;
            gap: 20px;
            padding: 10px;
            background: var(--surface-light);
            border-radius: 8px;
            font-size: 12px;
            margin-bottom: 15px;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-item.live i { color: var(--danger); animation: blink 1s infinite; }
        .status-item.upcoming i { color: var(--secondary); }
        .status-item.finished i { color: var(--success); }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Matches Grid */
        .matches-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: calc(100vh - 300px);
            overflow-y: auto;
            padding-right: 5px;
        }

        .match-card {
            background: var(--surface);
            border-radius: 12px;
            padding: 15px;
            border: 1px solid var(--border);
            transition: all 0.3s;
        }

        .match-card:hover {
            border-color: var(--primary);
            box-shadow: 0 5px 15px rgba(0,255,157,0.1);
        }

        .match-card.live {
            border-left: 4px solid var(--danger);
            background: linear-gradient(90deg, rgba(255,71,87,0.05), var(--surface));
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 12px;
        }

        .league-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .league-logo {
            width: 20px;
            height: 20px;
            border-radius: 4px;
        }

        .league-name {
            color: var(--text-dim);
            font-weight: 500;
        }

        .match-time {
            padding: 4px 10px;
            background: var(--surface-light);
            border-radius: 4px;
            color: var(--secondary);
            font-weight: 600;
            font-size: 11px;
        }

        .match-time.live {
            background: var(--danger);
            color: white;
        }

        .teams {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .team {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }

        .team.away {
            justify-content: flex-end;
        }

        .team-logo {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: contain;
        }

        .team-name {
            font-weight: 600;
            font-size: 14px;
        }

        .score {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
            margin: 0 20px;
            min-width: 60px;
            text-align: center;
        }

        /* Market Grid - FULLY VISIBLE */
        .market-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .market-btn {
            padding: 12px 8px;
            background: var(--surface-light);
            border: 2px solid var(--border);
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 12px;
            min-height: 70px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .market-btn:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
            background: var(--surface-lighter);
        }

        .market-btn.selected {
            background: rgba(0,255,157,0.15);
            border-color: var(--primary);
            border-width: 2px;
        }

        .market-name {
            color: var(--text-dim);
            margin-bottom: 5px;
            font-size: 11px;
            font-weight: 500;
        }

        .market-odds {
            color: var(--primary);
            font-weight: 700;
            font-size: 18px;
            line-height: 1.2;
        }

        .market-odds small {
            font-size: 10px;
            color: var(--text-dim);
            font-weight: normal;
        }

        /* Additional Markets */
        .additional-markets {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--border);
        }

        .additional-market-btn {
            padding: 8px 4px;
            background: var(--surface-light);
            border: 1px solid var(--border);
            border-radius: 6px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 10px;
        }

        .additional-market-btn:hover {
            border-color: var(--secondary);
        }

        .additional-market-name {
            color: var(--text-dim);
            margin-bottom: 2px;
            font-size: 9px;
        }

        .additional-market-odds {
            color: var(--secondary);
            font-weight: 600;
            font-size: 12px;
        }

        /* Bet Slip - RIGHT SIDE VISIBLE */
        .betslip-section {
            background: var(--surface);
            border-radius: 12px;
            padding: 15px;
            border: 2px solid var(--primary);
            position: sticky;
            top: 80px;
            height: fit-content;
        }

        .betslip-tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
        }

        .betslip-tab {
            flex: 1;
            padding: 10px;
            background: var(--surface-light);
            border: none;
            color: var(--text);
            cursor: pointer;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .betslip-tab:hover {
            background: var(--surface-lighter);
        }

        .betslip-tab.active {
            background: var(--primary);
            color: #000;
        }

        .betslip-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .betslip-title {
            color: var(--primary);
            font-weight: 700;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .betslip-clear {
            color: var(--danger);
            cursor: pointer;
            font-size: 13px;
            padding: 5px 10px;
            border-radius: 4px;
        }

        .betslip-clear:hover {
            background: rgba(255,71,87,0.1);
        }

        .betslip-items {
            max-height: 300px;
            overflow-y: auto;
            margin-bottom: 15px;
            min-height: 100px;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
        }

        .betslip-item {
            background: var(--surface-light);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            border: 1px solid var(--border);
        }

        .betslip-item-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .betslip-match {
            font-weight: 600;
            font-size: 13px;
        }

        .betslip-market {
            color: var(--secondary);
            font-size: 12px;
            margin-bottom: 5px;
        }

        .betslip-details {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .betslip-odds {
            color: var(--primary);
            font-weight: 700;
            font-size: 16px;
        }

        .betslip-remove {
            color: var(--danger);
            cursor: pointer;
            font-size: 14px;
            padding: 2px 8px;
        }

        .betslip-remove:hover {
            background: rgba(255,71,87,0.1);
            border-radius: 4px;
        }

        .system-options {
            margin: 15px 0;
            padding: 12px;
            background: var(--surface-light);
            border-radius: 8px;
        }

        .system-select {
            width: 100%;
            padding: 10px;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 6px;
            font-size: 13px;
        }

        .each-way-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 15px 0;
            padding: 12px;
            background: var(--surface-light);
            border-radius: 8px;
            font-size: 13px;
        }

        .each-way-toggle input {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--primary);
        }

        .quick-bets {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin: 15px 0;
        }

        .quick-bet-btn {
            padding: 10px;
            background: var(--surface-light);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .quick-bet-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .bet-input-group {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--surface-light);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0 15px;
            margin: 15px 0;
        }

        .bet-input {
            flex: 1;
            padding: 15px 0;
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 18px;
            font-weight: 600;
        }

        .bet-input:focus {
            outline: none;
        }

        .betslip-total {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-top: 1px solid var(--border);
            font-weight: 600;
            font-size: 16px;
        }

        .total-odds {
            color: var(--primary);
            font-size: 24px;
            font-weight: 700;
        }

        .potential-returns {
            background: var(--surface-light);
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
        }

        .return-row {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin: 8px 0;
        }

        .return-row.total {
            font-weight: 700;
            color: var(--primary);
            border-top: 1px solid var(--border);
            padding-top: 10px;
            margin-top: 10px;
            font-size: 18px;
        }

        .place-bet-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: none;
            border-radius: 8px;
            color: #000;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .place-bet-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0,255,157,0.4);
        }

        .place-bet-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Open Bets Section */
        .open-bets-section {
            background: var(--surface);
            border-radius: 12px;
            padding: 15px;
            border: 1px solid var(--secondary);
        }

        .section-title {
            color: var(--secondary);
            font-size: 16px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .bets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 10px;
            max-height: 300px;
            overflow-y: auto;
        }

        .bet-card {
            background: var(--surface-light);
            border-radius: 8px;
            padding: 12px;
            border-left: 3px solid;
        }

        .bet-card.pending { border-color: var(--secondary); }
        .bet-card.won { border-color: var(--success); }
        .bet-card.lost { border-color: var(--danger); }

        .bet-card-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 11px;
        }

        .bet-ticket {
            color: var(--text-dim);
        }

        .bet-status {
            padding: 2px 8px;
            border-radius: 3px;
            font-weight: 600;
            font-size: 10px;
        }

        .bet-status.pending { background: var(--secondary); color: #000; }
        .bet-status.won { background: var(--success); color: #000; }
        .bet-status.lost { background: var(--danger); color: #000; }

        .bet-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            border-top: 1px solid var(--border);
            padding-top: 8px;
            margin-top: 8px;
        }

        /* History Section */
        .history-section {
            background: var(--surface);
            border-radius: 12px;
            padding: 15px;
            border: 1px solid var(--border);
            margin: 20px;
        }

        .history-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            overflow-x: auto;
        }

        .history-tab {
            padding: 6px 15px;
            background: var(--surface-light);
            border: none;
            color: var(--text);
            cursor: pointer;
            border-radius: 20px;
            font-size: 12px;
            white-space: nowrap;
        }

        .history-tab.active {
            background: var(--primary);
            color: #000;
        }

        .history-list {
            max-height: 300px;
            overflow-y: auto;
        }

        /* Bottom Nav */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            background: var(--surface);
            padding: 10px 15px;
            border-top: 2px solid var(--primary);
            margin-top: 20px;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--text-dim);
            font-size: 11px;
            gap: 3px;
        }

        .nav-item i { font-size: 18px; }
        .nav-item:hover { color: var(--primary); }
        .nav-item.active { color: var(--primary); }

        /* Result Overlay */
        .result-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .result-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .result-content {
            background: var(--surface);
            padding: 30px;
            border-radius: 20px;
            border: 3px solid var(--primary);
            text-align: center;
            max-width: 350px;
            width: 90%;
        }

        .result-icon {
            font-size: 60px;
            margin-bottom: 15px;
        }

        .result-icon.win { color: var(--success); }
        .result-icon.lose { color: var(--danger); }

        .result-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .result-title.win { color: var(--success); }
        .result-title.lose { color: var(--danger); }

        .result-amount {
            font-size: 40px;
            font-weight: 700;
            margin: 15px 0;
        }

        .result-amount.win { color: var(--success); }
        .result-amount.lose { color: var(--danger); }

        .ok-btn {
            padding: 12px 30px;
            background: var(--primary);
            border: none;
            border-radius: 8px;
            color: #000;
            font-weight: 700;
            cursor: pointer;
        }

        /* Toast */
        .toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 10000;
        }

        .toast {
            padding: 12px 20px;
            background: var(--surface);
            border-radius: 8px;
            border-left: 4px solid var(--primary);
            color: white;
            font-size: 13px;
            margin-top: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .toast.success { border-color: var(--success); }
        .toast.error { border-color: var(--danger); }
        .toast.warning { border-color: var(--warning); }

        /* Loading */
        .loading {
            text-align: center;
            padding: 40px;
        }

        .loading-spinner {
            border: 3px solid var(--surface-light);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 10px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .market-grid {
                grid-template-columns: repeat(3, 1fr);
            }
            .additional-markets {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        @media (max-width: 1000px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
            .betslip-section {
                position: static;
            }
            .market-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        @media (max-width: 600px) {
            .market-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .additional-markets {
                grid-template-columns: repeat(3, 1fr);
            }
            .teams {
                flex-direction: column;
                gap: 10px;
            }
            .team.away {
                justify-content: flex-start;
            }
            .score {
                margin: 10px 0;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="logo">
            <i class="fas fa-futbol"></i>
            XCrazyBet Pro
        </div>
        <div class="user-info">
            <div class="stats-badge">
                <i class="fas fa-chart-line"></i>
                <span id="win-rate">0%</span>
            </div>
            <div class="balance-display">
                <i class="fas fa-wallet"></i>
                $<span id="balance-val">7.08</span>
            </div>
        </div>
    </header>

    <!-- Main Layout -->
    <div class="main-layout">
        <!-- Left Column -->
        <div class="left-column">
            <!-- Market Tabs -->
            <div class="market-tabs">
                <div class="tabs-header">
                    <button class="tab-btn active" data-market="all">⚽ All Markets</button>

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            setupEventListeners();
            loadMatches();
        });

        function checkAuth() {
            auth.onAuthStateChanged((user) => {
                if (user) {
                    gameState.currentUser = user;
                    loadBalance();
                    loadOpenBets();
                    loadBetHistory();
                } else {
                    // For testing without login
                    gameState.currentUser = { uid: 'test-user' };
                    gameState.balance = 7.08;
                    updateBalanceDisplay();
                    loadMatches();
                }
            });
        }

        async function loadBalance() {
            try {
                const doc = await db.collection("wallets").doc(gameState.currentUser.uid).get();
                if (doc.exists) {
                    gameState.balance = doc.data().balance || 0;
                }
                updateBalanceDisplay();
            } catch (error) {
                console.error('Error loading balance:', error);
            }
        }

        function updateBalanceDisplay() {
            document.getElementById('balance-val').textContent = gameState.balance.toFixed(2);
        }

        function loadMatches() {
            gameState.matches = sampleMatches;
            filterMatches('all');
            updateStatusCounts();
        }

        function updateStatusCounts() {
            document.getElementById('live-count').textContent = '2';
            document.getElementById('upcoming-count').textContent = '741';
            document.getElementById('finished-count').textContent = '12';
        }

        function filterMatches(leagueId) {
            gameState.currentLeague = leagueId;
            
            if (leagueId === 'all') {
                gameState.filteredMatches = gameState.matches;
            } else {
                gameState.filteredMatches = gameState.matches.filter(m => m.league.id.toString() === leagueId);
            }
            
            displayMatches();
            
            document.querySelectorAll('.league-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.league === leagueId) {
                    btn.classList.add('active');
                }
            });
        }

        function filterMarket(market) {
            gameState.currentMarket = market;
            
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.market === market) {
                    btn.classList.add('active');
                }
            });
            
            filterMatches(gameState.currentLeague);
        }

        function displayMatches() {
            const grid = document.getElementById('matches-grid');
            grid.innerHTML = '';
            
            if (gameState.filteredMatches.length === 0) {
                grid.innerHTML = '<div style="text-align: center; padding: 30px; color: var(--text-dim);">No matches found</div>';
                return;
            }
            
            gameState.filteredMatches.forEach(match => {
                const card = createMatchCard(match);
                grid.appendChild(card);
            });
        }

        function createMatchCard(match) {
            const isLive = match.fixture.status.short === 'LIVE';
            const isUpcoming = match.fixture.status.short === 'NS';
            
            const matchTime = isLive ? `LIVE ${match.fixture.status.elapsed || ''}'` : 
                             new Date(match.fixture.date).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            
            const homeScore = match.goals.home !== null ? match.goals.home : '-';
            const awayScore = match.goals.away !== null ? match.goals.away : '-';
            
            const card = document.createElement('div');
            card.className = `match-card ${isLive ? 'live' : ''}`;
            
            // Main Markets (FULLY VISIBLE)
            card.innerHTML = `
                <div class="match-header">
                    <div class="league-info">
                        <img class="league-logo" src="${match.league.logo}" alt="">
                        <span class="league-name">${match.league.name}</span>
                    </div>
                    <div class="match-time ${isLive ? 'live' : ''}">${matchTime}</div>
                </div>
                
                <div class="teams">
                    <div class="team">
                        <img class="team-logo" src="${match.teams.home.logo}" alt="">
                        <span class="team-name">${match.teams.home.name}</span>
                    </div>
                    <div class="score">${homeScore} - ${awayScore}</div>
                    <div class="team away">
                        <span class="team-name">${match.teams.away.name}</span>
                        <img class="team-logo" src="${match.teams.away.logo}" alt="">
                    </div>
                </div>
                
                <!-- MAIN MARKETS GRID - 1X2 & Over/Under -->
                <div class="market-grid">
                    <div class="market-btn" onclick="selectMarket(${match.fixture.id}, '1', ${match.odds.home}, '1', 'Match Winner')">
                        <div class="market-name">HOME</div>
                        <div class="market-odds">${match.odds.home.toFixed(2)}</div>
                    </div>
                    <div class="market-btn" onclick="selectMarket(${match.fixture.id}, 'X', ${match.odds.draw}, 'X', 'Match Winner')">
                        <div class="market-name">DRAW</div>
                        <div class="market-odds">${match.odds.draw.toFixed(2)}</div>
                    </div>
                    <div class="market-btn" onclick="selectMarket(${match.fixture.id}, '2', ${match.odds.away}, '2', 'Match Winner')">
                        <div class="market-name">AWAY</div>
                        <div class="market-odds">${match.odds.away.toFixed(2)}</div>
                    </div>
                    <div class="market-btn" onclick="selectMarket(${match.fixture.id}, 'Over 2.5', ${match.odds.over25}, 'O2.5', 'Total Goals')">
                        <div class="market-name">OVER 2.5</div>
                        <div class="market-odds">${match.odds.over25.toFixed(2)}</div>
                    </div>
                </div>
                
                <!-- ADDITIONAL MARKETS - BTTS & Handicap -->
                <div class="additional-markets">
                    <div class="additional-market-btn" onclick="selectMarket(${match.fixture.id}, 'BTTS Yes', ${match.odds.btts_yes}, 'YES', 'BTTS')">
                        <div class="additional-market-name">BTTS YES</div>
                        <div class="additional-market-odds">${match.odds.btts_yes.toFixed(2)}</div>
                    </div>
                    <div class="additional-market-btn" onclick="selectMarket(${match.fixture.id}, 'BTTS No', ${match.odds.btts_no}, 'NO', 'BTTS')">
                        <div class="additional-market-name">BTTS NO</div>
                        <div class="additional-market-odds">${match.odds.btts_no.toFixed(2)}</div>
                    </div>
                    <div class="additional-market-btn" onclick="selectMarket(${match.fixture.id}, 'Under 2.5', ${match.odds.under25}, 'U2.5', 'Total Goals')">
                        <div class="additional-market-name">UNDER 2.5</div>
                        <div class="additional-market-odds">${match.odds.under25.toFixed(2)}</div>
                    </div>
                    <div class="additional-market-btn" onclick="selectMarket(${match.fixture.id}, 'Handicap -1', ${match.odds.handicap_home || 2.10}, '-1', 'Handicap')">
                        <div class="additional-market-name">H -1</div>
                        <div class="additional-market-odds">${(match.odds.handicap_home || 2.10).toFixed(2)}</div>
                    </div>
                    <div class="additional-market-btn" onclick="selectMarket(${match.fixture.id}, 'Handicap +1', ${match.odds.handicap_away || 1.80}, '+1', 'Handicap')">
                        <div class="additional-market-name">A +1</div>
                        <div class="additional-market-odds">${(match.odds.handicap_away || 1.80).toFixed(2)}</div>
                    </div>
                    <div class="additional-market-btn" onclick="selectMarket(${match.fixture.id}, 'Correct Score 1-0', 7.50, '1-0', 'Correct Score')">
                        <div class="additional-market-name">1-0</div>
                        <div class="additional-market-odds">7.50</div>
                    </div>
                </div>
            `;
            
            return card;
        }

        // SELECT MARKET FUNCTION - CLICKABLE
        window.selectMarket = function(matchId, selection, odds, display, market) {
            const match = gameState.matches.find(m => m.fixture.id === matchId);
            if (!match) return;
            
            const matchName = `${match.teams.home.name} vs ${match.teams.away.name}`;
            
            // Check if match is available for betting
            if (match.fixture.status.short !== 'NS') {
                showToast('Match already started or finished', 'error');
                return;
            }
            
            if (gameState.betType === 'single') {
                // Single bet - replace selection
                gameState.selectedBets = [{
                    matchId,
                    matchName,
                    market,
                    selection,
                    display,
                    odds,
                    match
                }];
                showToast('Bet added to slip', 'success');
            } else {
                // Accumulator/System - add to existing
                if (gameState.selectedBets.length >= 10) {
                    showToast('Maximum 10 selections', 'error');
                    return;
                }
                
                // Check for duplicate match
                if (gameState.selectedBets.some(b => b.matchId === matchId)) {
                    showToast('Only one bet per match allowed', 'error');
                    return;
                }
                
                gameState.selectedBets.push({
                    matchId,
                    matchName,
                    market,
                    selection,
                    display,
                    odds,
                    match
                });
                showToast('Added to accumulator', 'success');
            }
            
            updateBetSlip();
        };

        function updateBetSlip() {
            const container = document.getElementById('betslip-items');
            const totalOddsEl = document.getElementById('total-odds');
            const potentialWinEl = document.getElementById('potential-win');
            const totalReturnEl = document.getElementById('total-return');
            const placeBetBtn = document.getElementById('place-bet-btn');
            
            if (gameState.selectedBets.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: var(--text-dim); padding: 20px;"><i class="fas fa-arrow-up" style="font-size: 24px; margin-bottom: 10px;"></i><div>Click odds to add bets</div></div>';
                totalOddsEl.textContent = '0.00';
                potentialWinEl.textContent = '$0.00';
                totalReturnEl.textContent = '$0.00';
                placeBetBtn.disabled = true;
                return;
            }
            
            // Calculate total odds
            let totalOdds = gameState.selectedBets.reduce((acc, bet) => acc * bet.odds, 1);
            totalOdds = parseFloat(totalOdds.toFixed(2));
            
            const betAmount = parseFloat(document.getElementById('bet-amount').value) || 10;
            const winReturn = betAmount * totalOdds;
            
            totalOddsEl.textContent = totalOdds.toFixed(2);
            potentialWinEl.textContent = `$${winReturn.toFixed(2)}`;
            totalReturnEl.textContent = `$${winReturn.toFixed(2)}`;
            placeBetBtn.disabled = false;
            
            // Build bet items HTML
            let html = '';
            gameState.selectedBets.forEach((bet, index) => {
                html += `
                    <div class="betslip-item">
                        <div class="betslip-item-header">
                            <span class="betslip-match">${bet.matchName}</span>
                            <span class="betslip-remove" onclick="removeBet(${index})">
                                <i class="fas fa-times"></i>
                            </span>
                        </div>
                        <div class="betslip-market">${bet.market} - ${bet.display}</div>
                        <div class="betslip-details">
                            <span class="betslip-odds">${bet.odds.toFixed(2)}</span>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }

        window.removeBet = function(index) {
            gameState.selectedBets.splice(index, 1);
            updateBetSlip();
            showToast('Bet removed', 'info');
        };

        function clearBetSlip() {
            gameState.selectedBets = [];
            updateBetSlip();
            showToast('Bet slip cleared', 'info');
        }

        async function placeBet() {
            const betAmount = parseFloat(document.getElementById('bet-amount').value);
            
            // Validation
            if (gameState.selectedBets.length === 0) {
                showToast('Select at least one bet', 'error');
                return;
            }
            
            if (betAmount < 1 || betAmount > 1000) {
                showToast('Bet must be between $1 and $1000', 'error');
                return;
            }
            
            if (betAmount > gameState.balance) {
                showToast('Insufficient funds', 'error');
                return;
            }
            
            const totalOdds = gameState.selectedBets.reduce((acc, bet) => acc * bet.odds, 1);
            const ticketNumber = 'TKT-' + Date.now().toString().slice(-8);
            
            // Create bet object
            const bet = {
                ticketNumber,
                selections: gameState.selectedBets.map(s => ({
                    matchId: s.matchId,
                    matchName: s.matchName,
                    market: s.market,
                    display: s.display,
                    odds: s.odds
                })),
                stake: betAmount,
                totalOdds,
                potentialWin: betAmount * totalOdds,
                status: 'pending',
                createdAt: new Date()
            };
            
            // Update balance
            gameState.balance -= betAmount;
            updateBalanceDisplay();
            
            // Add to open bets
            gameState.openBets.unshift(bet);
            displayOpenBets();
            
            // Clear bet slip
            gameState.selectedBets = [];
            updateBetSlip();
            
            showToast(`Bet placed! Ticket #${ticketNumber}`, 'success');
        }

        function displayOpenBets() {
            const grid = document.getElementById('open-bets-grid');
            const countEl = document.getElementById('open-bets-count');
            
            countEl.textContent = gameState.openBets.length;
            
            if (gameState.openBets.length === 0) {
                grid.innerHTML = '<div style="text-align: center; padding: 20px; color: var(--text-dim);">No open bets</div>';
                return;
            }
            
            let html = '';
            gameState.openBets.slice(0, 5).forEach(bet => {
                const selectionsText = bet.selections.map(s => 
                    `${s.matchName} - ${s.display} @ ${s.odds.toFixed(2)}`
                ).join('<br>');
                
                html += `
                    <div class="bet-card pending">
                        <div class="bet-card-header">
                            <span class="bet-ticket">#${bet.ticketNumber}</span>
                            <span class="bet-status pending">PENDING</span>
                        </div>
                        <div class="bet-details" style="font-size: 11px; margin: 5px 0;">
                            ${selectionsText}
                        </div>
                        <div class="bet-footer">
                            <span class="bet-stake">$${bet.stake.toFixed(2)}</span>
                            <span class="bet-return">$${(bet.stake * bet.totalOdds).toFixed(2)}</span>
                        </div>
                    </div>
                `;
            });
            
            grid.innerHTML = html;
        }

        async function loadOpenBets() {
            // For demo, just use empty array
            gameState.openBets = [];
            displayOpenBets();
        }

        async function loadBetHistory() {
            // For demo, just use empty array
            displayHistory();
        }

        function displayHistory(filter = 'all') {
            const list = document.getElementById('history-list');
            list.innerHTML = '<div style="text-align: center; padding: 20px; color: var(--text-dim);">No betting history</div>';
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        function closeResultOverlay() {
            document.getElementById('result-overlay').classList.remove('show');
        }

        function setupEventListeners() {
            // League filter
            document.querySelectorAll('.league-btn').forEach(btn => {
                btn.addEventListener('click', () => filterMatches(btn.dataset.league));
            });
            
            // Market tabs
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', () => filterMarket(btn.dataset.market));
            });
            
            // Bet slip tabs
            document.querySelectorAll('.betslip-tab').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.betslip-tab').forEach(t => t.classList.remove('active'));
                    btn.classList.add('active');
                    gameState.betType = btn.dataset.betslip;
                    
                    // Show/hide system options
                    document.getElementById('system-options').style.display = 
                        gameState.betType === 'system' ? 'block' : 'none';
                    
                    // Clear selections when switching modes
                    gameState.selectedBets = [];
                    updateBetSlip();
                });
            });
            
            // System type change
            document.getElementById('system-type').addEventListener('change', (e) => {
                gameState.systemType = e.target.value;
                updateBetSlip();
            });
            
            // Each way toggle
            document.getElementById('each-way').addEventListener('change', (e) => {
                gameState.eachWay = e.target.checked;
                updateBetSlip();
            });
            
            // Clear bet slip
            document.getElementById('clear-betslip').addEventListener('click', clearBetSlip);
            
            // Place bet button
            document.getElementById('place-bet-btn').addEventListener('click', placeBet);
            
            // Quick bet amounts
            document.querySelectorAll('.quick-bet-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const amount = parseFloat(btn.dataset.amount);
                    document.getElementById('bet-amount').value = amount;
                    updateBetSlip();
                });
            });
            
            // Bet amount input
            document.getElementById('bet-amount').addEventListener('input', (e) => {
                let value = parseFloat(e.target.value) || 1;
                value = Math.max(1, Math.min(value, 1000));
                e.target.value = value;
                updateBetSlip();
            });
            
            // History tabs
            document.querySelectorAll('.history-tab').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.history-tab').forEach(t => t.classList.remove('active'));
                    btn.classList.add('active');
                    displayHistory(btn.dataset.history);
                });
            });
            
            // Close overlay
            document.getElementById('result-overlay').addEventListener('click', (e) => {
                if (e.target === document.getElementById('result-overlay')) {
                    closeResultOverlay();
                }
            });
        }

        // Make functions global
        window.closeResultOverlay = closeResultOverlay;
        window.selectMarket = selectMarket;
        window.removeBet = removeBet;
    </script>
</body>
</html>
