<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>⚽ Xlodon Bet - Live Football Betting</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        :root {
            --primary: #00ff9d;
            --secondary: #ff9800;
            --danger: #ff4757;
            --success: #4caf50;
            --warning: #ffc107;
            --bg: #0a0f1a;
            --surface: #111827;
            --surface-light: #1a2332;
            --text: #ffffff;
            --text-dim: #94a3b8;
            --border: #1e293b;
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 70px;
        }

        .header {
            background: var(--surface);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
        }

        .logo a {
            color: var(--primary);
            text-decoration: none;
        }

        .balance-display {
            background: var(--surface-light);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid var(--primary);
            color: var(--primary);
            font-weight: 600;
        }

        .last-update {
            font-size: 10px;
            color: var(--text-dim);
            text-align: center;
            padding: 5px;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 16px;
            max-width: 1400px;
            margin: 16px auto;
            padding: 0 16px;
        }

        .market-tabs {
            background: var(--surface);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .tabs-header, .league-filter {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 12px;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        .tab-btn, .league-btn {
            padding: 8px 16px;
            background: var(--surface-light);
            border: 1px solid var(--border);
            border-radius: 30px;
            color: var(--text);
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .tab-btn.active, .league-btn.active {
            background: var(--primary);
            color: #000;
            border-color: var(--primary);
        }

        .refresh-btn {
            background: var(--surface-light);
            border: 1px solid var(--primary);
            border-radius: 30px;
            padding: 6px 12px;
            color: var(--primary);
            cursor: pointer;
            font-size: 12px;
            margin-left: 10px;
        }

        .refresh-btn:hover {
            background: var(--primary);
            color: #000;
        }

        .matches-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 550px;
            overflow-y: auto;
        }

        .match-card {
            background: var(--surface);
            border-radius: 16px;
            padding: 12px;
            border: 1px solid var(--border);
            transition: transform 0.2s;
        }

        .match-card:hover {
            transform: translateY(-2px);
            border-color: var(--primary);
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 12px;
            color: var(--text-dim);
        }

        .teams {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .team-name {
            font-weight: 600;
            font-size: 14px;
        }

        .score {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
        }

        .live-badge {
            background: var(--danger);
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 10px;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .market-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 8px;
        }

        .market-btn {
            padding: 8px;
            background: var(--surface-light);
            border: 1px solid var(--border);
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .market-btn:hover {
            background: var(--primary);
            transform: scale(1.05);
        }

        .market-btn:hover .market-odds {
            color: #000;
        }

        .market-name {
            font-size: 10px;
            color: var(--text-dim);
        }

        .market-odds {
            font-weight: 700;
            color: var(--primary);
        }

        .betslip-section {
            background: var(--surface);
            border-radius: 20px;
            padding: 16px;
            border: 2px solid var(--primary);
            position: sticky;
            top: 80px;
        }

        .betslip-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .betslip-tab {
            flex: 1;
            padding: 10px;
            background: var(--surface-light);
            border: none;
            border-radius: 30px;
            color: var(--text);
            cursor: pointer;
            transition: all 0.2s;
        }

        .betslip-tab.active {
            background: var(--primary);
            color: #000;
        }

        .betslip-items {
            max-height: 250px;
            overflow-y: auto;
            margin-bottom: 12px;
        }

        .betslip-item {
            background: var(--surface-light);
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 8px;
        }

        .betslip-item-header {
            display: flex;
            justify-content: space-between;
        }

        .remove-bet {
            color: var(--danger);
            cursor: pointer;
            font-weight: bold;
        }

        .bet-input-group {
            display: flex;
            background: var(--surface-light);
            border-radius: 30px;
            padding: 0 16px;
            margin: 12px 0;
        }

        .bet-input {
            flex: 1;
            padding: 14px 0;
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 16px;
            outline: none;
        }

        .place-bet-btn {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            border: none;
            border-radius: 30px;
            color: #000;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .place-bet-btn:hover:not(:disabled) {
            transform: scale(1.02);
        }

        .place-bet-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .open-bets-section, .history-section {
            background: var(--surface);
            border-radius: 16px;
            padding: 16px;
            margin-top: 16px;
        }

        .bet-card {
            background: var(--surface-light);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 8px;
            border-left: 4px solid var(--secondary);
        }

        .bet-card-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .cashout-btn {
            padding: 4px 12px;
            background: var(--warning);
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--surface);
            display: flex;
            justify-content: space-around;
            padding: 8px 16px;
            border-top: 2px solid var(--primary);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--text-dim);
            font-size: 11px;
            gap: 4px;
            transition: color 0.2s;
        }

        .nav-item i { font-size: 20px; }
        .nav-item.active { color: var(--primary); }
        .nav-item:hover { color: var(--primary); }

        .toast-container {
            position: fixed;
            bottom: 80px;
            left: 16px;
            right: 16px;
            z-index: 1000;
        }

        .toast {
            padding: 12px 16px;
            background: var(--surface);
            border-radius: 30px;
            border-left: 4px solid var(--primary);
            margin-bottom: 8px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .empty-state {
            text-align: center;
            padding: 30px;
            color: var(--text-dim);
        }

        .loading-spinner {
            border: 3px solid var(--surface-light);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 900px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <a href="#">⚽ Xlodon Bet</a>
        </div>
        <div class="balance-display">
            <i class="fas fa-wallet"></i> $<span id="balance">0.00</span>
        </div>
    </header>

    <div class="main-layout">
        <div class="left-column">
            <div class="market-tabs">
                <div class="tabs-header">
                    <button class="tab-btn active" data-market="all">📋 All Matches</button>
                    <button class="tab-btn" data-market="live">🔴 Live</button>
                    <button class="tab-btn" data-market="upcoming">📅 Upcoming</button>
                </div>
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <div class="league-filter" id="leagueFilter">
                        <button class="league-btn active" data-league="all">🌍 ALL</button>
                        <button class="league-btn" data-league="39">🏴 PREMIER</button>
                        <button class="league-btn" data-league="140">🇪🇸 LA LIGA</button>
                        <button class="league-btn" data-league="78">🇩🇪 BUNDES</button>
                        <button class="league-btn" data-league="135">🇮🇹 SERIE A</button>
                        <button class="league-btn" data-league="61">🇫🇷 LIGUE 1</button>
                    </div>
                    <button class="refresh-btn" onclick="window.refreshMatches()"><i class="fas fa-sync-alt"></i> Refresh</button>
                </div>
                <div id="matchesContainer" class="matches-grid"><div class="loading-spinner"></div></div>
                <div class="last-update" id="lastUpdate"></div>
            </div>

            <div class="open-bets-section">
                <h3><i class="fas fa-ticket-alt"></i> MY OPEN BETS</h3>
                <div id="openBetsContainer"><div class="loading-spinner"></div></div>
            </div>
        </div>

        <div class="betslip-section">
            <div class="betslip-tabs">
                <button class="betslip-tab active" data-type="single">🎯 SINGLE</button>
                <button class="betslip-tab" data-type="accumulator">📈 ACCUMULATOR</button>
            </div>
            <div class="betslip-header" style="display: flex; justify-content: space-between;">
                <h4>BET SLIP</h4>
                <button id="clearSlip" style="background: none; border: none; color: var(--danger); cursor: pointer;">🗑️ CLEAR</button>
            </div>
            <div id="betslipItems" class="betslip-items">
                <div class="empty-state">➕ Click odds to add bets</div>
            </div>
            <div class="bet-input-group">
                <input type="number" id="betAmount" class="bet-input" value="10" min="1" step="1">
                <span>$</span>
            </div>
            <div style="display: flex; justify-content: space-between; margin: 12px 0;">
                <span>⚡ Total Odds:</span>
                <span id="totalOdds" style="color: var(--primary); font-size: 20px; font-weight: bold;">0.00</span>
            </div>
            <div style="margin: 12px 0;">
                <span>💰 Potential Return:</span>
                <span id="potentialReturn" style="float: right; font-weight: bold;">$0.00</span>
            </div>
            <button id="placeBetBtn" class="place-bet-btn" disabled>🚀 PLACE BET</button>
        </div>
    </div>

    <div class="history-section">
        <h3><i class="fas fa-history"></i> BETTING HISTORY</h3>
        <div id="historyContainer"><div class="loading-spinner"></div></div>
    </div>

    <nav class="bottom-nav">
        <a href="#" class="nav-item active"><i class="fas fa-futbol"></i><span>Football</span></a>
        <a href="#" class="nav-item"><i class="fas fa-ticket-alt"></i><span>My Bets</span></a>
        <a href="#" class="nav-item"><i class="fas fa-home"></i><span>Home</span></a>
        <a href="#" class="nav-item"><i class="fas fa-chart-line"></i><span>Stats</span></a>
        <a href="#" class="nav-item"><i class="fas fa-wallet"></i><span>Wallet</span></a>
    </nav>

    <div id="toastContainer" class="toast-container"></div>

    <script>
        // ==================== FIREBASE CONFIG ====================
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ==================== iSPORTS API KEY & ENDPOINT ====================
        const ISPORTS_API_KEY = "YOUR_API_KEY_HERE";  // <--- REPLACE WITH YOUR REAL iSPORTS API KEY
        const ISPORTS_BASE_URL = "https://api2.isportsapi.com"; // fallback primary: api2.isportsapi.com
        
        // Helper to build iSports request URL
        function buildISportsUrl(path, params = {}) {
            const url = new URL(ISPORTS_BASE_URL + path);
            url.searchParams.append("api_key", ISPORTS_API_KEY);
            for (let [key, val] of Object.entries(params)) {
                url.searchParams.append(key, val);
            }
            return url.toString();
        }

        // ==================== APP STATE ====================
        let currentUser = null;
        let balance = 0;
        let selectedBets = [];
        let betType = 'single';
        let matches = [];
        let currentLeague = 'all';
        let currentMarket = 'all';
        let autoRefreshInterval = null;

        // Auth check
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                currentUser = user;
                console.log('User logged in:', user.uid);
                await loadBalance();
                await fetchLiveMatches();      // using iSports
                await loadOpenBets();
                await loadHistory();
                setupListeners();
                startAutoRefresh();
                showToast('Welcome back! Live football data from iSports', 'success');
            } else {
                showToast('Please login to continue', 'error');
                setTimeout(() => {
                    // redirect to login page (if exists) – for demo we keep same page but inform
                    window.location.href = 'https://xcrazybet.github.io/millioner/login.html';
                }, 2000);
            }
        });

        // FETCH MATCHES FROM iSPORTS API (Football Livescores)
        async function fetchLiveMatches() {
            const container = document.getElementById('matchesContainer');
            container.innerHTML = '<div class="loading-spinner"></div><p style="text-align:center;">Fetching live matches from iSports...</p>';
            
            try {
                // Using iSports livescores endpoint (today's fixtures)
                // According to docs: /sport/football/livescores
                const url = buildISportsUrl("/sport/football/livescores", {});
                console.log("Fetching iSports:", url);
                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const data = await response.json();
                console.log("iSports API Response:", data);
                
                // iSports typical response: { status: true, data: { matches: [...] } }
                if (!data.status || !data.data || !data.data.matches) {
                    throw new Error("Invalid response format from iSports");
                }
                
                const rawMatches = data.data.matches || [];
                if (rawMatches.length === 0) {
                    container.innerHTML = '<div class="empty-state"><i class="fas fa-futbol"></i><br>No matches today from iSports</div>';
                    document.getElementById('lastUpdate').textContent = `Last update: ${new Date().toLocaleTimeString()} - 0 matches`;
                    matches = [];
                    displayMatches(currentLeague, currentMarket);
                    return;
                }
                
                // Transform iSports match structure to our internal format
                matches = rawMatches.map(m => {
                    // Generate odds dynamically based on realistic football odds (iSports may not provide odds directly, we simulate fair odds)
                    const homeOdds = m.odds_home ? parseFloat(m.odds_home) : (Math.random() * (3.0 - 1.5) + 1.5).toFixed(2);
                    const drawOdds = m.odds_draw ? parseFloat(m.odds_draw) : (Math.random() * (3.5 - 2.8) + 2.8).toFixed(2);
                    const awayOdds = m.odds_away ? parseFloat(m.odds_away) : (Math.random() * (4.0 - 2.0) + 2.0).toFixed(2);
                    
                    // Determine league ID mapping: iSports provides league_id
                    let leagueId = (m.league_id || "0").toString();
                    // Map popular leagues for filters (Premier 39, LaLiga 140, etc) - we try to match via name if needed
                    const leagueName = m.league_name || "Unknown League";
                    let mappedLeagueId = leagueId;
                    if (leagueName.includes("Premier")) mappedLeagueId = "39";
                    else if (leagueName.includes("La Liga")) mappedLeagueId = "140";
                    else if (leagueName.includes("Bundesliga")) mappedLeagueId = "78";
                    else if (leagueName.includes("Serie A")) mappedLeagueId = "135";
                    else if (leagueName.includes("Ligue 1")) mappedLeagueId = "61";
                    
                    // Determine match status (live or not)
                    const status = m.status || "NS";
                    const isLive = (status === "1H" || status === "2H" || status === "HT" || status === "LIVE");
                    const timeDisplay = isLive ? "LIVE" : (m.time || m.match_time || "Scheduled");
                    
                    return {
                        id: m.match_id ? m.match_id.toString() : `match_${Date.now()}_${Math.random()}`,
                        leagueId: mappedLeagueId,
                        leagueName: leagueName,
                        homeTeam: m.home_team_name || m.home_name || "Home",
                        awayTeam: m.away_team_name || m.away_name || "Away",
                        homeScore: m.home_score !== undefined ? m.home_score : (m.score_home ?? null),
                        awayScore: m.away_score !== undefined ? m.away_score : (m.score_away ?? null),
                        status: status,
                        time: timeDisplay,
                        isLive: isLive,
                        odds: {
                            home: parseFloat(homeOdds),
                            draw: parseFloat(drawOdds),
                            away: parseFloat(awayOdds),
                            over25: 1.85,
                            under25: 1.95
                        }
                    };
                });
                
                document.getElementById('lastUpdate').textContent = `Last update: ${new Date().toLocaleTimeString()} - ${matches.length} matches (iSports)`;
                displayMatches(currentLeague, currentMarket);
                
            } catch (error) {
                console.error('iSports API Error:', error);
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle"></i>
                        <h3>iSports API Error</h3>
                        <p>${error.message}</p>
                        <button onclick="window.refreshMatches()" class="refresh-btn" style="margin-top: 10px;">Retry</button>
                    </div>
                `;
                showToast('Failed to fetch matches from iSports. Check API key.', 'error');
            }
        }

        window.refreshMatches = function() {
            fetchLiveMatches();
        };

        function displayMatches(leagueFilter, marketFilter) {
            const container = document.getElementById('matchesContainer');
            let filtered = leagueFilter === 'all' ? matches : matches.filter(m => m.leagueId === leagueFilter);
            
            if (marketFilter === 'live') {
                filtered = filtered.filter(m => m.isLive === true);
            } else if (marketFilter === 'upcoming') {
                filtered = filtered.filter(m => !m.isLive && (m.status === 'NS' || m.status === 'FT' ? false : true));
                // keep only not started
                filtered = filtered.filter(m => !m.isLive && (m.homeScore === null || m.homeScore === undefined));
            }
            
            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty-state"><i class="fas fa-futbol"></i><br>No matches found</div>';
                return;
            }
            
            container.innerHTML = filtered.map(match => `
                <div class="match-card">
                    <div class="match-header">
                        <span><i class="fas fa-trophy"></i> ${match.leagueName}</span>
                        <span>${match.isLive ? '<span class="live-badge">🔴 LIVE</span>' : match.time}</span>
                    </div>
                    <div class="teams">
                        <span class="team-name">${match.homeTeam}</span>
                        <span class="score">${(match.homeScore !== null && match.homeScore !== undefined) ? match.homeScore : '-'} : ${(match.awayScore !== null && match.awayScore !== undefined) ? match.awayScore : '-'}</span>
                        <span class="team-name">${match.awayTeam}</span>
                    </div>
                    <div class="market-grid">
                        <div class="market-btn" onclick="addToBetSlip('${match.id}', '1', ${match.odds.home}, '1', 'Match Winner')">
                            <div class="market-name">1 (HOME)</div>
                            <div class="market-odds">${match.odds.home.toFixed(2)}</div>
                        </div>
                        <div class="market-btn" onclick="addToBetSlip('${match.id}', 'X', ${match.odds.draw}, 'X', 'Match Winner')">
                            <div class="market-name">X (DRAW)</div>
                            <div class="market-odds">${match.odds.draw.toFixed(2)}</div>
                        </div>
                        <div class="market-btn" onclick="addToBetSlip('${match.id}', '2', ${match.odds.away}, '2', 'Match Winner')">
                            <div class="market-name">2 (AWAY)</div>
                            <div class="market-odds">${match.odds.away.toFixed(2)}</div>
                        </div>
                        <div class="market-btn" onclick="addToBetSlip('${match.id}', 'Over 2.5', ${match.odds.over25}, 'O2.5', 'Total Goals')">
                            <div class="market-name">OVER 2.5</div>
                            <div class="market-odds">${match.odds.over25.toFixed(2)}</div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function startAutoRefresh() {
            if (autoRefreshInterval) clearInterval(autoRefreshInterval);
            autoRefreshInterval = setInterval(() => {
                fetchLiveMatches();
            }, 60000); // 60 sec
        }

        async function loadBalance() {
            try {
                const doc = await db.collection("wallets").doc(currentUser.uid).get();
                if (doc.exists) {
                    balance = doc.data().balance || 0;
                } else {
                    balance = 100;
                    await db.collection("wallets").doc(currentUser.uid).set({ balance: 100 });
                }
                document.getElementById('balance').textContent = balance.toFixed(2);
            } catch (error) {
                console.error('Balance error:', error);
            }
        }

        window.addToBetSlip = function(matchId, selection, odds, display, market) {
            const match = matches.find(m => m.id === matchId);
            if (!match) return;
            
            const bet = {
                matchId: match.id,
                matchName: `${match.homeTeam} vs ${match.awayTeam}`,
                market: market,
                selection: selection,
                display: display,
                odds: odds
            };
            
            if (betType === 'single') {
                selectedBets = [bet];
            } else {
                if (selectedBets.some(b => b.matchId === matchId)) {
                    showToast('Only one bet per match allowed in ACCA', 'error');
                    return;
                }
                selectedBets.push(bet);
            }
            updateBetSlip();
            showToast(`Added: ${bet.matchName} - ${display} @ ${odds.toFixed(2)}`, 'success');
        };

        function updateBetSlip() {
            const container = document.getElementById('betslipItems');
            const totalOddsSpan = document.getElementById('totalOdds');
            const potentialSpan = document.getElementById('potentialReturn');
            const placeBtn = document.getElementById('placeBetBtn');
            
            if (selectedBets.length === 0) {
                container.innerHTML = '<div class="empty-state">➕ Click odds to add bets</div>';
                totalOddsSpan.textContent = '0.00';
                potentialSpan.textContent = '$0.00';
                placeBtn.disabled = true;
                return;
            }
            
            const totalOdds = selectedBets.reduce((acc, bet) => acc * bet.odds, 1);
            const betAmount = parseFloat(document.getElementById('betAmount').value) || 10;
            const potentialReturn = betAmount * totalOdds;
            
            totalOddsSpan.textContent = totalOdds.toFixed(2);
            potentialSpan.textContent = `$${potentialReturn.toFixed(2)}`;
            placeBtn.disabled = false;
            
            container.innerHTML = selectedBets.map((bet, index) => `
                <div class="betslip-item">
                    <div class="betslip-item-header">
                        <span><strong>${bet.matchName}</strong></span>
                        <span class="remove-bet" onclick="removeBet(${index})">✖</span>
                    </div>
                    <div>${bet.market} - ${bet.display}</div>
                    <div style="color: var(--primary); font-weight: bold;">${bet.odds.toFixed(2)}</div>
                </div>
            `).join('');
        }

        window.removeBet = function(index) {
            selectedBets.splice(index, 1);
            updateBetSlip();
        };

        function generateTicketNumber() {
            const date = new Date();
            const random = Math.random().toString(36).substring(2, 8).toUpperCase();
            return `TKT-${date.getFullYear()}${(date.getMonth()+1).toString().padStart(2,'0')}${date.getDate().toString().padStart(2,'0')}-${date.getHours().toString().padStart(2,'0')}${date.getMinutes().toString().padStart(2,'0')}${date.getSeconds().toString().padStart(2,'0')}-${random}`;
        }

        async function placeBet() {
            const betAmount = parseFloat(document.getElementById('betAmount').value);
            if (selectedBets.length === 0) { showToast('No bets selected', 'error'); return; }
            if (betAmount < 1 || betAmount > 5000) { showToast('Bet amount must be $1-$5000', 'error'); return; }
            if (betAmount > balance) { showToast('Insufficient funds', 'error'); return; }
            
            const totalOdds = selectedBets.reduce((acc, bet) => acc * bet.odds, 1);
            const ticketNumber = generateTicketNumber();
            
            try {
                const walletRef = db.collection("wallets").doc(currentUser.uid);
                await db.runTransaction(async (transaction) => {
                    const doc = await transaction.get(walletRef);
                    const newBalance = doc.data().balance - betAmount;
                    if (newBalance < 0) throw new Error('Insufficient funds');
                    transaction.update(walletRef, { balance: newBalance });
                });
                
                const betData = {
                    userId: currentUser.uid,
                    ticketNumber: ticketNumber,
                    selections: selectedBets,
                    stake: betAmount,
                    totalOdds: totalOdds,
                    potentialReturn: betAmount * totalOdds,
                    betType: betType,
                    status: 'pending',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    createdAtDate: new Date().toISOString(),
                    return: 0
                };
                await db.collection("football_bets").doc(ticketNumber).set(betData);
                balance -= betAmount;
                document.getElementById('balance').textContent = balance.toFixed(2);
                selectedBets = [];
                updateBetSlip();
                showToast(`✅ Bet placed! Ticket: ${ticketNumber}`, 'success');
                await loadOpenBets();
                await loadHistory();
            } catch (error) {
                showToast('Failed to place bet: ' + error.message, 'error');
            }
        }

        async function loadOpenBets() {
            try {
                const snapshot = await db.collection("football_bets").where("userId", "==", currentUser.uid).where("status", "==", "pending").get();
                const container = document.getElementById('openBetsContainer');
                if (snapshot.empty) { container.innerHTML = '<div class="empty-state">✨ No open bets</div>'; return; }
                let html = '';
                snapshot.forEach(doc => {
                    const bet = doc.data();
                    const selectionsText = bet.selections.map(s => `${s.matchName} - ${s.display} @ ${s.odds.toFixed(2)}`).join('<br>');
                    html += `<div class="bet-card"><div class="bet-card-header"><span>🎫 ${bet.ticketNumber.substring(0,15)}</span><span style="background: var(--secondary); padding:2px 8px; border-radius:20px;">PENDING</span></div>
                    <div style="font-size:12px; margin:8px 0;">${selectionsText}</div>
                    <div style="display:flex; justify-content:space-between;"><span>Stake: $${bet.stake.toFixed(2)}</span><span>To Win: $${(bet.stake*bet.totalOdds).toFixed(2)}</span>
                    <button class="cashout-btn" onclick="cashOut('${bet.ticketNumber}', ${bet.stake})">💸 CASH OUT (70%)</button></div></div>`;
                });
                container.innerHTML = html;
            } catch(e) { console.error(e); }
        }

        window.cashOut = async function(ticketNumber, stake) {
            const cashoutValue = stake * 0.7;
            if (!confirm(`Cash out for $${cashoutValue.toFixed(2)}?`)) return;
            try {
                const walletRef = db.collection("wallets").doc(currentUser.uid);
                await db.runTransaction(async (transaction) => {
                    const doc = await transaction.get(walletRef);
                    transaction.update(walletRef, { balance: doc.data().balance + cashoutValue });
                });
                await db.collection("football_bets").doc(ticketNumber).update({ status: 'cashed_out', return: cashoutValue, cashedOutAt: new Date().toISOString() });
                balance += cashoutValue;
                document.getElementById('balance').textContent = balance.toFixed(2);
                await loadOpenBets();
                await loadHistory();
                showToast(`💰 Cashed out $${cashoutValue.toFixed(2)}`, 'success');
            } catch(e) { showToast('Cashout failed', 'error'); }
        };

        async function loadHistory() {
            try {
                const snapshot = await db.collection("football_bets").where("userId", "==", currentUser.uid).where("status", "in", ["won", "lost", "cashed_out"]).get();
                const container = document.getElementById('historyContainer');
                if (snapshot.empty) { container.innerHTML = '<div class="empty-state">📜 No betting history</div>'; return; }
                let html = '';
                snapshot.forEach(doc => {
                    const bet = doc.data();
                    const returnAmount = bet.return || (bet.status === 'won' ? bet.stake * bet.totalOdds : 0);
                    const borderColor = bet.status === 'won' ? 'var(--success)' : bet.status === 'lost' ? 'var(--danger)' : 'var(--warning)';
                    html += `<div class="bet-card" style="border-left-color:${borderColor}"><div class="bet-card-header"><span>🎫 ${bet.ticketNumber.substring(0,15)}</span><span>${bet.status.toUpperCase()}</span></div>
                    <div>${bet.selections.length} selections @ ${bet.totalOdds.toFixed(2)}</div><div>Stake: $${bet.stake.toFixed(2)} | ${bet.status === 'won' ? '+' : ''}$${returnAmount.toFixed(2)}</div></div>`;
                });
                container.innerHTML = html;
            } catch(e) { console.error(e); }
        }

        function setupListeners() {
            db.collection("wallets").doc(currentUser.uid).onSnapshot((doc) => { if(doc.exists){ balance = doc.data().balance; document.getElementById('balance').textContent = balance.toFixed(2); } });
            db.collection("football_bets").where("userId", "==", currentUser.uid).onSnapshot(() => { loadOpenBets(); loadHistory(); });
        }

        function showToast(message, type) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.style.borderLeftColor = type === 'success' ? 'var(--success)' : type === 'error' ? 'var(--danger)' : 'var(--primary)';
            toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-triangle' : 'fa-info-circle'}"></i> ${message}`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        document.getElementById('placeBetBtn').addEventListener('click', placeBet);
        document.getElementById('clearSlip').addEventListener('click', () => { selectedBets = []; updateBetSlip(); });
        document.getElementById('betAmount').addEventListener('input', updateBetSlip);
        document.querySelectorAll('.betslip-tab').forEach(btn => btn.addEventListener('click', () => {
            document.querySelectorAll('.betslip-tab').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            betType = btn.dataset.type;
            selectedBets = [];
            updateBetSlip();
        }));
        document.querySelectorAll('.tab-btn').forEach(btn => btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            currentMarket = btn.dataset.market;
            displayMatches(currentLeague, currentMarket);
        }));
        document.querySelectorAll('.league-btn').forEach(btn => btn.addEventListener('click', () => {
            document.querySelectorAll('.league-btn').forEach(l => l.classList.remove('active'));
            btn.classList.add('active');
            currentLeague = btn.dataset.league;
            displayMatches(currentLeague, currentMarket);
        }));
    </script>
</body>
</html>
