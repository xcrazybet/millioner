<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProBet - Live Sports Betting Platform (CORS Fixed)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0b0e1a;
            color: #ffffff;
        }

        .header {
            background: linear-gradient(135deg, #0f1322 0%, #0b0e1a 100%);
            padding: 1rem 2rem;
            border-bottom: 1px solid #2a2f4a;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo h1 {
            font-size: 1.75rem;
            background: linear-gradient(135deg, #00d4ff, #7c3aed, #ec4899);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .wallet-card {
            background: linear-gradient(135deg, #1f2937, #111827);
            padding: 0.5rem 1.5rem;
            border-radius: 16px;
            border: 1px solid #374151;
        }

        .wallet-balance {
            font-size: 1.75rem;
            font-weight: bold;
            color: #10b981;
        }

        .nav-tabs {
            display: flex;
            gap: 0.5rem;
            background: #1a1f2e;
            padding: 0.5rem;
            border-radius: 12px;
        }

        .nav-tab {
            padding: 0.5rem 1.5rem;
            background: transparent;
            border: none;
            color: #9ca3af;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .nav-tab.active {
            background: #7c3aed;
            color: white;
        }

        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            gap: 1.5rem;
            padding: 1.5rem;
            min-height: calc(100vh - 90px);
        }

        .events-panel {
            flex: 3;
            background: #0f1322;
            border-radius: 20px;
            padding: 1.5rem;
            border: 1px solid #2a2f4a;
            overflow-y: auto;
            max-height: calc(100vh - 120px);
        }

        .slip-panel {
            width: 380px;
            background: #0f1322;
            border-radius: 20px;
            border: 1px solid #2a2f4a;
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 100px;
            height: fit-content;
        }

        .match-card {
            background: #1a1f3a;
            border-radius: 16px;
            padding: 1.25rem;
            margin-bottom: 1rem;
            border: 1px solid #2a2f4a;
            transition: all 0.25s ease;
        }

        .match-card:hover {
            border-color: #7c3aed;
            transform: translateY(-2px);
        }

        .teams {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .team {
            flex: 1;
            text-align: center;
        }

        .team-name {
            font-weight: 700;
            font-size: 1rem;
        }

        .team-score {
            font-size: 1.5rem;
            font-weight: 800;
            color: #00d4ff;
        }

        .bet-options {
            display: flex;
            gap: 0.75rem;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid #2a2f4a;
        }

        .bet-option {
            flex: 1;
            background: #0f1322;
            border: 1px solid #374151;
            border-radius: 12px;
            padding: 0.75rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .bet-option:hover {
            background: #7c3aed20;
            border-color: #7c3aed;
        }

        .bet-option-odds {
            font-size: 1.1rem;
            font-weight: 700;
            color: #10b981;
        }

        .slip-items {
            padding: 1rem;
            max-height: 300px;
            overflow-y: auto;
        }

        .slip-item {
            background: #1a1f3a;
            border-radius: 12px;
            padding: 0.75rem;
            margin-bottom: 0.75rem;
            border-left: 3px solid #7c3aed;
            position: relative;
        }

        .remove-btn {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
        }

        .slip-footer {
            padding: 1.25rem;
            border-top: 1px solid #2a2f4a;
        }

        .stake-input input {
            width: 100%;
            padding: 0.75rem;
            background: #1a1f3a;
            border: 1px solid #374151;
            border-radius: 12px;
            color: white;
            margin: 0.5rem 0;
        }

        .place-bet-btn {
            width: 100%;
            background: linear-gradient(135deg, #10b981, #059669);
            border: none;
            color: white;
            padding: 0.875rem;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .loading-spinner {
            text-align: center;
            padding: 3rem;
            color: #6b7280;
        }

        .error-message {
            background: #ef444420;
            border: 1px solid #ef4444;
            border-radius: 12px;
            padding: 1rem;
            text-align: center;
            color: #ef4444;
        }

        .api-status {
            font-size: 0.7rem;
            padding: 0.25rem 0.5rem;
            border-radius: 8px;
            margin-top: 0.5rem;
        }

        .api-status.success {
            background: #10b98120;
            color: #10b981;
        }

        .api-status.error {
            background: #ef444420;
            color: #ef4444;
        }

        @media (max-width: 1024px) {
            .main-container {
                flex-direction: column;
            }
            .slip-panel {
                width: 100%;
                position: static;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <div class="logo">
                <h1>⚡ PROBET</h1>
                <p>Live Sports Betting Platform</p>
            </div>
            <div class="nav-tabs">
                <button class="nav-tab active" data-tab="live">LIVE</button>
                <button class="nav-tab" data-tab="fixtures">FIXTURES</button>
                <button class="nav-tab" data-tab="leagues">LEAGUES</button>
            </div>
            <div class="wallet-card">
                <div>DEMO BALANCE</div>
                <div class="wallet-balance" id="balance">$1,000.00</div>
            </div>
        </div>
    </div>

    <div class="main-container">
        <div class="events-panel" id="eventsPanel">
            <div class="loading-spinner">
                <div>🔄 Loading data from Sportmonks API...</div>
                <div id="apiStatus" class="api-status" style="margin-top: 1rem;">Attempting to connect...</div>
            </div>
        </div>

        <div class="slip-panel">
            <div style="padding: 1.25rem; border-bottom: 1px solid #2a2f4a;">
                <h3>📋 BETTING SLIP</h3>
            </div>
            <div class="slip-items" id="slipItems">
                <div style="text-align: center; color: #6b7280;">No selections</div>
            </div>
            <div class="slip-footer">
                <div class="stake-input">
                    <label>STAKE AMOUNT</label>
                    <input type="number" id="stakeAmount" value="10" step="5">
                </div>
                <div id="potentialWinnings" style="margin: 0.5rem 0; font-size: 0.9rem;">
                    Potential: <strong>$0.00</strong>
                </div>
                <button class="place-bet-btn" id="placeBetBtn">🎲 PLACE DEMO BET</button>
                <button id="clearSlipBtn" style="width: 100%; margin-top: 0.5rem; padding: 0.5rem; background: #2a2f4a; border: none; color: white; border-radius: 8px; cursor: pointer;">Clear</button>
                <div style="font-size: 0.65rem; color: #ef4444; text-align: center; margin-top: 1rem;">
                    ⚠️ DEMO MODE - No real money
                </div>
            </div>
        </div>
    </div>

    <script>
        // Your API Token
        const API_TOKEN = 'DkFdWG9jFZvH8XSEgLrRfGwczABWVg5rlV25GvIRyN06zdPsOI48Nsv9Wooy';
        
        // CORS proxies to try (in order)
        const CORS_PROXIES = [
            'https://cors-anywhere.herokuapp.com/',
            'https://api.allorigins.win/raw?url=',
            'https://corsproxy.io/?'
        ];
        
        // Multiple endpoints to try
        const ENDPOINTS = {
            live: `/v3/football/livescores/inplay?api_token=${API_TOKEN}&include=participants;league`,
            fixtures: `/v3/football/fixtures?api_token=${API_TOKEN}&include=participants;league&filter=upcoming&limit=30`,
            leagues: `/v3/football/leagues?api_token=${API_TOKEN}&include=season&limit=20`
        };
        
        let userBalance = 1000.00;
        let betSlip = [];
        let currentData = [];
        let activeTab = 'live';
        
        // DOM Elements
        const balanceEl = document.getElementById('balance');
        const eventsPanel = document.getElementById('eventsPanel');
        const slipItemsEl = document.getElementById('slipItems');
        const stakeInput = document.getElementById('stakeAmount');
        const potentialWinningsEl = document.getElementById('potentialWinnings');
        
        function formatMoney(amount) {
            return `$${amount.toFixed(2)}`;
        }
        
        function updateBalanceDisplay() {
            balanceEl.textContent = formatMoney(userBalance);
        }
        
        function calculateTotalOdds() {
            if (betSlip.length === 0) return 0;
            return betSlip.reduce((total, bet) => total * bet.odds, 1);
        }
        
        function updatePotentialWinnings() {
            const stake = parseFloat(stakeInput.value) || 0;
            const winnings = stake * calculateTotalOdds();
            potentialWinningsEl.innerHTML = `Potential: <strong>${formatMoney(winnings)}</strong>`;
        }
        
        function renderBetSlip() {
            if (betSlip.length === 0) {
                slipItemsEl.innerHTML = '<div style="text-align: center; color: #6b7280; padding: 2rem;">No selections</div>';
                updatePotentialWinnings();
                return;
            }
            
            slipItemsEl.innerHTML = betSlip.map((bet, idx) => `
                <div class="slip-item">
                    <button class="remove-btn" data-index="${idx}">✖</button>
                    <div style="font-size: 0.7rem; color: #9ca3af;">${bet.matchName}</div>
                    <div style="font-weight: 600;">${bet.selection}</div>
                    <div style="font-size: 0.75rem; color: #10b981;">Odds: ${bet.odds.toFixed(2)}</div>
                </div>
            `).join('');
            
            document.querySelectorAll('.remove-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const idx = parseInt(btn.dataset.index);
                    betSlip.splice(idx, 1);
                    renderBetSlip();
                    updatePotentialWinnings();
                });
            });
            
            updatePotentialWinnings();
        }
        
        function addToBetSlip(matchId, matchName, selection, odds) {
            if (betSlip.some(b => b.matchId === matchId && b.selection === selection)) {
                alert('Already in slip!');
                return;
            }
            
            betSlip.push({ matchId, matchName, selection, odds });
            renderBetSlip();
        }
        
        function placeDemoBet() {
            if (betSlip.length === 0) {
                alert('Add selections first!');
                return;
            }
            
            const stake = parseFloat(stakeInput.value);
            if (isNaN(stake) || stake <= 0) {
                alert('Enter valid stake');
                return;
            }
            
            if (stake > userBalance) {
                alert('Insufficient balance!');
                return;
            }
            
            const winnings = stake * calculateTotalOdds();
            userBalance = userBalance - stake + winnings;
            updateBalanceDisplay();
            
            betSlip = [];
            renderBetSlip();
            stakeInput.value = '10';
            
            alert(`✅ Bet placed!\nStake: ${formatMoney(stake)}\nWinnings: ${formatMoney(winnings)}\nNew Balance: ${formatMoney(userBalance)}`);
            updatePotentialWinnings();
        }
        
        // API Call with CORS proxy fallback
        async function fetchWithCORS(url, retryCount = 0) {
            if (retryCount >= CORS_PROXIES.length) {
                throw new Error('All CORS proxies failed');
            }
            
            const proxy = CORS_PROXIES[retryCount];
            const fullUrl = proxy + 'https://api.sportmonks.com' + url;
            
            try {
                console.log(`Trying proxy ${retryCount + 1}: ${proxy}`);
                const response = await fetch(fullUrl, {
                    headers: {
                        'Origin': window.location.origin
                    }
                });
                
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                return data;
            } catch (error) {
                console.warn(`Proxy ${retryCount + 1} failed:`, error);
                return fetchWithCORS(url, retryCount + 1);
            }
        }
        
        // Generate demo data if API fails
        function getDemoData(type) {
            const demoLeagues = ['Premier League', 'La Liga', 'Bundesliga', 'Serie A', 'Ligue 1'];
            const demoTeams = ['Manchester United', 'Liverpool', 'Real Madrid', 'Barcelona', 'Bayern Munich', 'PSG', 'Juventus', 'Arsenal'];
            
            if (type === 'leagues') {
                return demoLeagues.map((name, i) => ({
                    id: i + 1,
                    name: name,
                    season: { name: '2024/2025' }
                }));
            }
            
            // Generate demo matches
            return Array(8).fill(null).map((_, i) => ({
                id: i + 1,
                name: `Match ${i + 1}`,
                league: { name: demoLeagues[i % demoLeagues.length] },
                participants: [
                    { name: demoTeams[i % demoTeams.length], meta: { location: 'home' } },
                    { name: demoTeams[(i + 3) % demoTeams.length], meta: { location: 'away' } }
                ],
                scores: type === 'live' ? { home: Math.floor(Math.random() * 3), away: Math.floor(Math.random() * 3) } : null,
                starting_at: type === 'fixtures' ? new Date(Date.now() + (i * 86400000)).toISOString() : null
            }));
        }
        
        async function fetchData(type) {
            const endpoint = ENDPOINTS[type];
            if (!endpoint) return getDemoData(type);
            
            const statusDiv = document.getElementById('apiStatus');
            if (statusDiv) {
                statusDiv.textContent = '🔄 Fetching from Sportmonks API...';
                statusDiv.className = 'api-status';
            }
            
            try {
                const data = await fetchWithCORS(endpoint);
                
                if (statusDiv) {
                    statusDiv.textContent = '✅ Connected to Sportmonks API!';
                    statusDiv.className = 'api-status success';
                }
                
                if (type === 'leagues') {
                    return data.data || [];
                }
                return data.data || [];
            } catch (error) {
                console.error('API Error:', error);
                
                if (statusDiv) {
                    statusDiv.textContent = `⚠️ Using demo data (API Error: ${error.message})`;
                    statusDiv.className = 'api-status error';
                }
                
                return getDemoData(type);
            }
        }
        
        function renderMatches(data, type) {
            if (!data || data.length === 0) {
                eventsPanel.innerHTML = '<div class="loading-spinner">No data available</div>';
                return;
            }
            
            eventsPanel.innerHTML = `
                <div style="margin-bottom: 1rem;">
                    <strong>${data.length} ${type === 'live' ? 'LIVE' : type === 'fixtures' ? 'UPCOMING' : 'LEAGUES'}</strong>
                </div>
                ${data.map(item => {
                    if (type === 'leagues') {
                        return `
                            <div class="match-card">
                                <div class="teams">
                                    <div class="team">
                                        <div class="team-name">🏆 ${item.name}</div>
                                        <div style="font-size: 0.8rem; color: #9ca3af;">${item.season?.name || 'Current Season'}</div>
                                    </div>
                                </div>
                            </div>
                        `;
                    }
                    
                    const participants = item.participants || [];
                    const homeTeam = participants.find(p => p.meta?.location === 'home') || participants[0] || { name: 'Home' };
                    const awayTeam = participants.find(p => p.meta?.location === 'away') || participants[1] || { name: 'Away' };
                    
                    const homeName = homeTeam.name || 'Home Team';
                    const awayName = awayTeam.name || 'Away Team';
                    const leagueName = item.league?.name || 'Unknown League';
                    const homeScore = item.scores?.home ?? item.scores?.score?.home ?? '-';
                    const awayScore = item.scores?.away ?? item.scores?.score?.away ?? '-';
                    
                    const homeOdds = (Math.random() * 2 + 1.2).toFixed(2);
                    const drawOdds = (Math.random() * 1.5 + 2.5).toFixed(2);
                    const awayOdds = (Math.random() * 2 + 1.2).toFixed(2);
                    const matchName = `${homeName} vs ${awayName}`;
                    
                    return `
                        <div class="match-card">
                            <div style="font-size: 0.7rem; color: #7c3aed; margin-bottom: 0.5rem;">⚽ ${leagueName}</div>
                            <div class="teams">
                                <div class="team">
                                    <div class="team-name">${homeName}</div>
                                    <div class="team-score">${homeScore}</div>
                                </div>
                                <div style="padding: 0 1rem; color: #6b7280;">VS</div>
                                <div class="team">
                                    <div class="team-name">${awayName}</div>
                                    <div class="team-score">${awayScore}</div>
                                </div>
                            </div>
                            <div class="bet-options">
                                <div class="bet-option" onclick="window.addToBetSlip('${item.id}', '${matchName.replace(/'/g, "\\'")}', '${homeName.replace(/'/g, "\\'")}', ${homeOdds})">
                                    <div>${homeName}</div>
                                    <div class="bet-option-odds">${homeOdds}</div>
                                </div>
                                <div class="bet-option" onclick="window.addToBetSlip('${item.id}', '${matchName.replace(/'/g, "\\'")}', 'Draw', ${drawOdds})">
                                    <div>Draw</div>
                                    <div class="bet-option-odds">${drawOdds}</div>
                                </div>
                                <div class="bet-option" onclick="window.addToBetSlip('${item.id}', '${matchName.replace(/'/g, "\\'")}', '${awayName.replace(/'/g, "\\'")}', ${awayOdds})">
                                    <div>${awayName}</div>
                                    <div class="bet-option-odds">${awayOdds}</div>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('')}
            `;
        }
        
        async function loadTab(tab) {
            activeTab = tab;
            eventsPanel.innerHTML = '<div class="loading-spinner"><div>🔄 Loading...</div><div id="apiStatus" class="api-status">Connecting to Sportmonks...</div></div>';
            
            const data = await fetchData(tab);
            currentData = data;
            renderMatches(data, tab);
        }
        
        // Make addToBetSlip available globally
        window.addToBetSlip = addToBetSlip;
        
        // Event Listeners
        document.getElementById('placeBetBtn').addEventListener('click', placeDemoBet);
        document.getElementById('clearSlipBtn').addEventListener('click', () => {
            betSlip = [];
            renderBetSlip();
        });
        stakeInput.addEventListener('input', updatePotentialWinnings);
        
        document.querySelectorAll('.nav-tab').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                loadTab(btn.dataset.tab);
            });
        });
        
        // Initialize
        updateBalanceDisplay();
        loadTab('live');
        
        // Auto-refresh live every 30 seconds
        setInterval(() => {
            if (activeTab === 'live') {
                loadTab('live');
            }
        }, 30000);
    </script>
</body>
</html>
