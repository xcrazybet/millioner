    // ---------- SPORTMONKS FETCH with robust CORS and fallback ----------
    async function fetchWithCorsProxy(url) {
        // Using multiple proxy fallbacks for reliability
        const proxies = [
            'https://api.allorigins.win/raw?url=',
            'https://cors-anywhere.herokuapp.com/',
            'https://thingproxy.freeboard.io/fetch/'
        ];
        
        for (const proxy of proxies) {
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 8000);
                const proxyUrl = proxy + encodeURIComponent(url);
                const response = await fetch(proxyUrl, { signal: controller.signal });
                clearTimeout(timeoutId);
                if (response.ok) {
                    const text = await response.text();
                    return JSON.parse(text);
                }
            } catch (error) {
                console.warn(`Proxy ${proxy} failed:`, error);
                continue;
            }
        }
        return null;
    }

    // Generate rich demo data that never disappears - persistent and diverse
    function getPersistentDemoData() {
        const now = new Date();
        const todayStr = now.toISOString().split('T')[0];
        const timeSlots = ["12:30", "15:00", "17:30", "20:00", "21:00"];
        
        const leagues = [
            { name: "Premier League", filter: "premier", country: "England" },
            { name: "La Liga", filter: "laliga", country: "Spain" },
            { name: "Serie A", filter: "seriea", country: "Italy" },
            { name: "Bundesliga", filter: "bundesliga", country: "Germany" },
            { name: "Ligue 1", filter: "ligue1", country: "France" }
        ];
        
        const teams = {
            "Premier League": ["Manchester City", "Liverpool", "Arsenal", "Chelsea", "Manchester United", "Tottenham", "Newcastle", "Aston Villa"],
            "La Liga": ["Real Madrid", "Barcelona", "Atletico Madrid", "Sevilla", "Real Sociedad", "Villarreal", "Athletic Bilbao"],
            "Serie A": ["Inter Milan", "AC Milan", "Juventus", "Napoli", "Roma", "Lazio", "Atalanta"],
            "Bundesliga": ["Bayern Munich", "Borussia Dortmund", "RB Leipzig", "Bayer Leverkusen", "Eintracht Frankfurt"],
            "Ligue 1": ["PSG", "Marseille", "Monaco", "Lyon", "Lille"]
        };
        
        const demoFixtures = [];
        let id = 1000;
        
        // Generate 12-15 fixtures for variety
        for (let i = 0; i < 14; i++) {
            const leagueIdx = i % leagues.length;
            const league = leagues[leagueIdx];
            const teamList = teams[league.name];
            if (!teamList) continue;
            
            const homeIdx = (i * 2) % teamList.length;
            let awayIdx = (homeIdx + 1 + i) % teamList.length;
            if (awayIdx === homeIdx) awayIdx = (awayIdx + 1) % teamList.length;
            
            // Determine status: some inplay, some scheduled, some finished
            let state = 'scheduled';
            let homeScore = 0, awayScore = 0;
            const randomStatus = Math.random();
            
            if (i < 3) {
                state = 'inplay';
                homeScore = Math.floor(Math.random() * 4);
                awayScore = Math.floor(Math.random() * 4);
            } else if (i >= 10 && i < 12) {
                state = 'finished';
                homeScore = Math.floor(Math.random() * 5);
                awayScore = Math.floor(Math.random() * 5);
            } else {
                state = 'scheduled';
            }
            
            // Generate realistic odds (fluctuate slightly each refresh)
            const baseHomeOdds = 1.8 + Math.random() * 1.5;
            const baseDrawOdds = 3.0 + Math.random() * 1.2;
            const baseAwayOdds = 2.0 + Math.random() * 1.8;
            
            const odds = [
                { label: "Home", value: parseFloat(baseHomeOdds.toFixed(2)), type: "home" },
                { label: "Draw", value: parseFloat(baseDrawOdds.toFixed(2)), type: "draw" },
                { label: "Away", value: parseFloat(baseAwayOdds.toFixed(2)), type: "away" }
            ];
            
            const timeSlot = timeSlots[i % timeSlots.length];
            
            demoFixtures.push({
                id: id + i,
                league: { name: league.name, country: league.country },
                participants: [{ name: teamList[homeIdx] }, { name: teamList[awayIdx] }],
                starting_at: `${todayStr}T${timeSlot}:00Z`,
                state: state,
                scores: state !== 'scheduled' ? [{ type: "home", score: homeScore }, { type: "away", score: awayScore }] : [],
                odds: odds,
                time: { starting_at: { time: timeSlot } }
            });
        }
        
        // Add some specific high-profile matches
        const topMatches = [
            { league: "Premier League", home: "Manchester United", away: "Liverpool", state: "inplay", homeScore: 1, awayScore: 1, odds: [2.50, 3.40, 2.80] },
            { league: "La Liga", home: "Barcelona", away: "Real Madrid", state: "scheduled", odds: [2.60, 3.30, 2.70] },
            { league: "Serie A", home: "Inter Milan", away: "AC Milan", state: "scheduled", odds: [2.40, 3.20, 3.00] }
        ];
        
        topMatches.forEach((match, idx) => {
            demoFixtures.push({
                id: 2000 + idx,
                league: { name: match.league },
                participants: [{ name: match.home }, { name: match.away }],
                starting_at: `${todayStr}T19:45:00Z`,
                state: match.state,
                scores: match.state === 'inplay' ? [{ type: "home", score: match.homeScore }, { type: "away", score: match.awayScore }] : [],
                odds: match.odds.map((val, i) => ({ label: i === 0 ? "Home" : (i === 1 ? "Draw" : "Away"), value: val })),
                time: { starting_at: { time: "19:45" } }
            });
        });
        
        return demoFixtures;
    }
    
    // Update odds dynamically to simulate live movement
    function updateOddsDynamically(fixtures) {
        return fixtures.map(f => {
            if (f.state === 'finished') return f;
            const newOdds = f.odds.map(odd => {
                let variation = (Math.random() - 0.5) * 0.08; // Small fluctuation
                let newVal = odd.value + variation;
                newVal = Math.max(1.01, Math.min(10.0, newVal));
                return { ...odd, value: parseFloat(newVal.toFixed(2)) };
            });
            return { ...f, odds: newOdds };
        });
    }
    
    // Update live scores for inplay matches
    function updateLiveScores(fixtures) {
        return fixtures.map(f => {
            if (f.state === 'inplay' && Math.random() > 0.7) {
                const newScores = [...(f.scores || [])];
                const randomEvent = Math.random();
                if (randomEvent > 0.8) {
                    if (newScores.length === 0) {
                        newScores.push({ type: "home", score: 0 }, { type: "away", score: 0 });
                    }
                    const isHomeGoal = Math.random() > 0.5;
                    if (isHomeGoal) {
                        newScores[0].score += 1;
                    } else {
                        newScores[1].score += 1;
                    }
                    showToast(`⚽ GOAL! ${f.participants[isHomeGoal ? 0 : 1].name} scores!`, "info");
                }
                return { ...f, scores: newScores };
            }
            return f;
        });
    }
    
    async function fetchLiveFixtures() {
        // Prevent multiple simultaneous fetches
        if (isFetching) return;
        isFetching = true;
        
        // Update indicator
        const indicator = document.getElementById('refreshIndicator');
        if (indicator) indicator.style.opacity = '1';
        
        try {
            // Try API but with shorter timeout and better error handling
            let apiSuccess = false;
            let apiData = null;
            
            // Attempt API fetch with race condition (fail fast if slow)
            const apiPromise = (async () => {
                const todayDate = new Date().toISOString().split('T')[0];
                const url = `https://api.sportmonks.com/v3/football/fixtures/date/${todayDate}?api_token=${SPORTMONKS_TOKEN}&include=participants;scores;league`;
                const result = await fetchWithCorsProxy(url);
                if (result && result.data && result.data.length > 0) {
                    return result;
                }
                return null;
            })();
            
            const timeoutPromise = new Promise((_, reject) => 
                setTimeout(() => reject(new Error('API timeout')), 5000)
            );
            
            try {
                apiData = await Promise.race([apiPromise, timeoutPromise]);
                if (apiData && apiData.data && apiData.data.length > 0) {
                    apiSuccess = true;
                }
            } catch(e) {
                console.log("API fetch slow or failed, using demo data");
            }
            
            let formattedFixtures = [];
            
            if (apiSuccess && apiData && apiData.data) {
                // Transform API data
                for (const f of apiData.data) {
                    const participants = f.participants || [];
                    const home = participants.find(p => p.meta?.location === 'home') || participants[0];
                    const away = participants.find(p => p.meta?.location === 'away') || participants[1];
                    
                    let homeScore = 0, awayScore = 0;
                    if (f.scores && f.scores.length) {
                        const homeScoreObj = f.scores.find(s => s.type === 'home' || s.type === 'home_team');
                        const awayScoreObj = f.scores.find(s => s.type === 'away' || s.type === 'away_team');
                        if (homeScoreObj) homeScore = homeScoreObj.score;
                        if (awayScoreObj) awayScore = awayScoreObj.score;
                    }
                    
                    let state = 'scheduled';
                    if (f.time?.status === 'inplay' || f.state === 'inplay') state = 'inplay';
                    if (f.time?.status === 'finished' || f.state === 'finished') state = 'finished';
                    
                    const oddsList = [
                        { label: "Home", value: parseFloat((Math.random() * 2 + 1.5).toFixed(2)) },
                        { label: "Draw", value: parseFloat((Math.random() * 1.5 + 2.8).toFixed(2)) },
                        { label: "Away", value: parseFloat((Math.random() * 2 + 1.8).toFixed(2)) }
                    ];
                    
                    formattedFixtures.push({
                        id: f.id,
                        league: { name: f.league?.name || "Football" },
                        participants: [{ name: home?.name || "Home" }, { name: away?.name || "Away" }],
                        starting_at: f.starting_at,
                        state: state,
                        scores: [{ type: "home", score: homeScore }, { type: "away", score: awayScore }],
                        odds: oddsList,
                        time: { starting_at: { time: new Date(f.starting_at).toLocaleTimeString([], { hour: '2-digit', minute:'2-digit' }) } }
                    });
                }
            }
            
            // If API returned no data or failed, use enhanced demo data
            if (formattedFixtures.length === 0) {
                formattedFixtures = getPersistentDemoData();
            }
            
            // Apply live updates: dynamic odds and scores
            let updatedFixtures = updateOddsDynamically(formattedFixtures);
            updatedFixtures = updateLiveScores(updatedFixtures);
            
            // Update the map - this preserves fixtures and prevents disappearance
            for (const f of updatedFixtures) {
                // Preserve existing if ID matches but update live fields
                if (fixturesMap.has(f.id)) {
                    const existing = fixturesMap.get(f.id);
                    // Keep the fixture but update odds, scores, state
                    existing.odds = f.odds;
                    existing.scores = f.scores;
                    existing.state = f.state;
                    if (f.state === 'inplay' && existing.state !== 'inplay') {
                        showToast(`🔴 ${existing.participants[0].name} vs ${existing.participants[1].name} is now LIVE!`, "info");
                    }
                    fixturesMap.set(f.id, existing);
                } else {
                    fixturesMap.set(f.id, f);
                }
            }
            
            // Remove any fixtures older than 2 hours that are finished (cleanup but keep visible ones)
            const twoHoursAgo = new Date(Date.now() - 2 * 60 * 60 * 1000);
            for (const [id, fixture] of fixturesMap.entries()) {
                if (fixture.state === 'finished' && new Date(fixture.starting_at) < twoHoursAgo) {
                    fixturesMap.delete(id);
                }
            }
            
            renderFixtures();
            
        } catch (err) {
            console.error("Fetch error:", err);
            // Ensure we always have data - never show empty grid
            if (fixturesMap.size === 0) {
                const fallbackData = getPersistentDemoData();
                for (const f of fallbackData) fixturesMap.set(f.id, f);
                renderFixtures();
                showToast("Using live demo data with real-time updates", "info");
            }
        } finally {
            isFetching = false;
            if (indicator) indicator.style.opacity = '0.7';
        }
    }
    
    function renderFixtures() {
        let filtered = Array.from(fixturesMap.values());
        const now = new Date().toISOString().split('T')[0];
        
        if (currentFilter === 'inplay') filtered = filtered.filter(f => f.state === 'inplay');
        else if (currentFilter === 'today') filtered = filtered.filter(f => f.starting_at?.split('T')[0] === now);
        else if (currentFilter === 'premier') filtered = filtered.filter(f => f.league.name === 'Premier League');
        else if (currentFilter === 'laliga') filtered = filtered.filter(f => f.league.name === 'La Liga');
        else if (currentFilter === 'seriea') filtered = filtered.filter(f => f.league.name === 'Serie A');
        
        if (filtered.length === 0) {
            document.getElementById('fixturesGrid').innerHTML = '<div class="empty-state">⚽ No matches for this filter. Try another league!</div>';
            return;
        }
        
        // Sort: inplay first, then scheduled, then finished
        filtered.sort((a, b) => {
            const order = { 'inplay': 0, 'scheduled': 1, 'finished': 2 };
            return order[a.state] - order[b.state];
        });
        
        const html = `<div class="fixtures-grid">${filtered.map(f => {
            const homeScore = f.scores?.find(s=>s.type==='home')?.score ?? 0;
            const awayScore = f.scores?.find(s=>s.type==='away')?.score ?? 0;
            const hasScore = f.state === 'inplay' || f.state === 'finished';
            const statusClass = f.state === 'inplay' ? 'status-inplay' : (f.state === 'finished' ? 'status-finished' : 'status-scheduled');
            const statusText = f.state === 'inplay' ? '🔴 LIVE' : (f.state === 'finished' ? '✅ FINISHED' : (f.time?.starting_at?.time || 'Scheduled'));
            return `
                <div class="fixture-card">
                    <div class="fixture-header"><span class="league-name">${f.league.name}</span><span class="fixture-status ${statusClass}">${statusText}</span></div>
                    <div class="fixture-teams">
                        <div class="team">${f.participants[0].name}</div>
                        ${hasScore ? `<div class="score">${homeScore} - ${awayScore}</div>` : '<div class="vs">VS</div>'}
                        <div class="team">${f.participants[1].name}</div>
                    </div>
                    ${f.state !== 'finished' ? `<div class="odds-container">
                        ${f.odds.map(odd => `<div class="odd-btn" onclick="addToBetSlip(${f.id}, '${odd.label}', ${odd.value}, '${f.participants[0].name} vs ${f.participants[1].name}')"><div class="odd-label">${odd.label}</div><div class="odd-value">${odd.value.toFixed(2)}</div></div>`).join('')}
                    </div>` : '<div style="text-align:center;opacity:0.6;">Match Finished</div>'}
                </div>
            `;
        }).join('')}</div>`;
        document.getElementById('fixturesGrid').innerHTML = html;
    }
    
    // ---------- BET SLIP LOGIC (unchanged but reliable) ----------
    function addToBetSlip(fixtureId, selection, odds, fixtureName) {
        if (betSlipItems.some(item => item.fixtureId === fixtureId && item.selection === selection)) {
            showToast("Already in slip", "info");
            return;
        }
        betSlipItems.push({ fixtureId, fixtureName, selection, odds, stake: null });
        updateBetSlipUI();
        updateBetCount();
        showToast(`Added: ${fixtureName} - ${selection} @ ${odds}`, "success");
    }
    
    function updateBetSlipUI() {
        const container = document.getElementById('betSlipContent');
        if (betSlipItems.length === 0) { container.innerHTML = '<div class="empty-state" style="text-align:center; padding:2rem;">No selections added</div>'; return; }
        let totalStake = 0, totalPotential = 0;
        const itemsHtml = betSlipItems.map((item, idx) => {
            const potential = item.stake ? (item.stake * item.odds).toFixed(2) : 0;
            if(item.stake) { totalStake += item.stake; totalPotential += parseFloat(potential); }
            return `<div class="bet-item">
                <div class="bet-fixture" style="font-weight:bold;">${item.fixtureName}</div>
                <div style="margin:0.5rem 0;">${item.selection} | Odds: ${item.odds.toFixed(2)}</div>
                <input type="number" class="stake-input" placeholder="Stake (£)" min="0.5" step="0.5" value="${item.stake || ''}" onchange="updateStake(${idx}, this.value)">
                ${item.stake ? `<div style="color:#ffd700;">💰 Potential: £${potential}</div>` : ''}
                <button class="remove-bet" style="background:rgba(255,71,87,0.3); border:none; padding:0.3rem 0.8rem; border-radius:8px; color:#ff4757; cursor:pointer; margin-top:0.5rem;" onclick="removeFromSlip(${idx})">Remove</button>
            </div>`;
        }).join('');
        container.innerHTML = `${itemsHtml}
            <div class="bet-summary" style="background:rgba(255,215,0,0.1); padding:1rem; border-radius:16px; margin-top:1rem;">
                <div>Total Stake: £${totalStake.toFixed(2)}</div>
                <div>Total Potential: £${totalPotential.toFixed(2)}</div>
            </div>
            <button class="place-bet-btn" onclick="placeBetsAction()" ${totalStake === 0 ? 'disabled' : ''}>Place Bets (£${totalStake.toFixed(2)})</button>`;
    }
    
    window.updateStake = (idx, val) => {
        const stake = parseFloat(val);
        if (isNaN(stake) || stake < 0.5) { betSlipItems[idx].stake = null; showToast("Min stake £0.50", "warning"); }
        else if (stake > userBalance) { betSlipItems[idx].stake = null; showToast("Insufficient balance", "error"); }
        else betSlipItems[idx].stake = stake;
        updateBetSlipUI();
    };
    
    window.removeFromSlip = (idx) => { betSlipItems.splice(idx,1); updateBetSlipUI(); updateBetCount(); };
    
    function updateBetCount() { document.getElementById('betCount').innerText = betSlipItems.length; }
    
    async function placeBetsAction() {
        const valid = betSlipItems.filter(i => i.stake && i.stake > 0);
        if (valid.length === 0) { showToast("Enter stakes", "warning"); return; }
        const total = valid.reduce((s,b)=> s + b.stake,0);
        if (total > userBalance) { showToast("Insufficient balance", "error"); return; }
        
        userBalance -= total;
        todayStats.betsCount += valid.length;
        todayStats.totalStake += total;
        
        for (const bet of valid) {
            const potential = bet.stake * bet.odds;
            const newBet = { 
                id: Date.now() + Math.random(), 
                fixtureName: bet.fixtureName, 
                selection: bet.selection, 
                odds: bet.odds, 
                stake: bet.stake, 
                potentialWin: potential, 
                status: 'active', 
                createdAt: new Date().toISOString() 
            };
            betHistory.push(newBet);
            showToast(`Bet placed: ${bet.fixtureName} - £${bet.stake} @ ${bet.odds}`, "success");
        }
        
        betSlipItems = [];
        updateBetSlipUI();
        updateBetCount();
        updateBalanceUI();
        updateStatsUI();
        saveToFirestore();
        toggleBetSlip(false);
        
        setTimeout(() => simulateSettlement(), 35000);
    }
    
    function simulateSettlement() {
        const activeBets = betHistory.filter(b => b.status === 'active');
        if (activeBets.length === 0) return;
        activeBets.forEach(bet => {
            const isWin = Math.random() > 0.45;
            if (isWin) {
                bet.status = 'won';
                userBalance += bet.potentialWin;
                showToast(`🎉 WIN! ${bet.fixtureName} +£${bet.potentialWin.toFixed(2)}`, "success");
            } else {
                bet.status = 'lost';
                showToast(`❌ LOST: ${bet.fixtureName}`, "error");
            }
        });
        updateBalanceUI();
        updateStatsUI();
        saveToFirestore();
    }
    
    function toggleBetSlip(open = null) {
        const slip = document.getElementById('betSlip');
        if (open === true) slip.classList.add('open');
        else if (open === false) slip.classList.remove('open');
        else slip.classList.toggle('open');
    }
    
    window.filterFixtures = (filter, btn) => {
        currentFilter = filter;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderFixtures();
    };
    
    window.showAddFundsModal = () => {
        const amt = prompt("Enter amount to add (£5 - £1000):", "50");
        if (amt) {
            const val = parseFloat(amt);
            if (val >= 5 && val <= 1000) { 
                userBalance += val; 
                updateBalanceUI(); 
                saveToFirestore(); 
                showToast(`Added £${val}`, "success");
            } else showToast("Amount 5-1000 only", "warning");
        }
    };
    
    // Start the app with faster refresh (8 seconds instead of 10)
    async function init() {
        await loadFromFirestore();
        await fetchLiveFixtures();
        // Refresh every 8 seconds for fast odds updates
        if (liveUpdateInterval) clearInterval(liveUpdateInterval);
        liveUpdateInterval = setInterval(() => fetchLiveFixtures(), 8000);
    }
    
    init();
</script>
