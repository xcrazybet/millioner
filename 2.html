<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X-Bet Live - Real Time Betting System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .live-badge {
            background: #ff4444;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        .stats {
            display: flex;
            gap: 20px;
            font-size: 14px;
            color: #666;
        }

        .stats span {
            font-weight: bold;
            color: #667eea;
        }

        .filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 20px;
            border: none;
            border-radius: 25px;
            background: #f0f0f0;
            cursor: pointer;
            transition: all 0.3s;
        }

        .filter-btn.active {
            background: #667eea;
            color: white;
        }

        .matches-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .match-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            position: relative;
        }

        .match-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(0,0,0,0.2);
        }

        .match-status {
            padding: 8px 15px;
            font-size: 12px;
            font-weight: bold;
            text-align: center;
        }

        .status-live {
            background: #ff4444;
            color: white;
            animation: pulse 2s infinite;
        }

        .status-ft {
            background: #4CAF50;
            color: white;
        }

        .status-NS {
            background: #ff9800;
            color: white;
        }

        .match-info {
            padding: 20px;
        }

        .teams {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .team {
            flex: 1;
            text-align: center;
        }

        .team-name {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .score {
            font-size: 28px;
            font-weight: bold;
            margin: 0 15px;
            min-width: 80px;
            text-align: center;
            color: #667eea;
        }

        .match-details {
            border-top: 1px solid #eee;
            padding-top: 15px;
            font-size: 13px;
            color: #666;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .odds {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }

        .odd {
            text-align: center;
            padding: 5px 10px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .odd-label {
            font-size: 11px;
            color: #999;
        }

        .odd-value {
            font-size: 16px;
            font-weight: bold;
            color: #667eea;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: white;
        }

        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            background: #ff4444;
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .last-update {
            font-size: 12px;
            color: #999;
            text-align: right;
        }

        @media (max-width: 768px) {
            .matches-grid {
                grid-template-columns: 1fr;
            }
            
            .status-bar {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="status-bar">
                <div class="live-badge">🔴 LIVE BETTING</div>
                <div class="stats">
                    <div>📊 Live Matches: <span id="liveCount">0</span></div>
                    <div>🏆 Today's Matches: <span id="totalCount">0</span></div>
                    <div>🔄 Last Update: <span id="lastUpdate">--:--:--</span></div>
                </div>
            </div>
            <div class="filters">
                <button class="filter-btn active" data-filter="all">All Matches</button>
                <button class="filter-btn" data-filter="live">Live Now</button>
                <button class="filter-btn" data-filter="today">Today's Matches</button>
                <button class="filter-btn" data-filter="upcoming">Upcoming</button>
            </div>
        </div>

        <div id="errorMessage" class="error-message"></div>
        
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Loading live matches...</p>
        </div>

        <div id="matchesContainer" class="matches-grid"></div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        // Import Firebase modules
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
        import { getFirestore, collection, doc, setDoc, getDocs, query, where, deleteDoc } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';
        import { getAuth, signInAnonymously } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962",
            measurementId: "G-PTV4XMYQ6P"
        };

        // IMPORTANT: You MUST regenerate your Sportmonks token immediately!
        // This token is exposed - replace with your new token from Sportmonks dashboard
        const SPORTMONKS_TOKEN = "YOUR_NEW_TOKEN_HERE"; // REPLACE THIS WITH YOUR REGENERATED TOKEN!
        
        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // App State
        let allMatches = [];
        let currentFilter = 'all';
        let pollingInterval = null;
        let lastSyncTime = null;
        let deletedMatches = new Set();

        // Initialize app
        async function init() {
            await setupFirebaseAuth();
            await loadInitialData();
            startPolling();
            setupEventListeners();
        }

        // Setup Firebase Authentication
        async function setupFirebaseAuth() {
            try {
                const userCredential = await signInAnonymously(auth);
                console.log('Firebase auth successful:', userCredential.user.uid);
            } catch (error) {
                console.error('Firebase auth error:', error);
                showError('Failed to authenticate with Firebase');
            }
        }

        // Load initial data
        async function loadInitialData() {
            showLoading(true);
            try {
                // Fetch live scores first
                await fetchLiveScores();
                // Fetch today's fixtures
                await fetchTodayFixtures();
                // Sync to Firebase
                await syncToFirebase();
                hideLoading();
            } catch (error) {
                console.error('Initial load error:', error);
                showError('Failed to load initial data: ' + error.message);
                hideLoading();
            }
        }

        // Fetch live scores
        async function fetchLiveScores() {
            const url = `https://api.sportmonks.com/v3/football/livescores/inplay?api_token=${SPORTMONKS_TOKEN}&include=participants;scores;localTeam;visitorTeam`;
            
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                
                if (data.data && Array.isArray(data.data)) {
                    data.data.forEach(match => {
                        match.is_live = true;
                        match.status = 'LIVE';
                        updateOrAddMatch(match);
                    });
                }
            } catch (error) {
                console.error('Fetch live scores error:', error);
            }
        }

        // Fetch today's fixtures
        async function fetchTodayFixtures() {
            const today = new Date().toISOString().split('T')[0];
            const url = `https://api.sportmonks.com/v3/football/fixtures/date/${today}?api_token=${SPORTMONKS_TOKEN}&include=participants;scores;localTeam;visitorTeam;odds`;
            
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                
                if (data.data && Array.isArray(data.data)) {
                    data.data.forEach(match => {
                        if (!match.is_live) {
                            match.is_live = false;
                            updateOrAddMatch(match);
                        }
                    });
                }
            } catch (error) {
                console.error('Fetch fixtures error:', error);
            }
        }

        // Get latest updates (every 5-8 seconds)
        async function fetchLatestUpdates() {
            const url = `https://api.sportmonks.com/v3/football/fixtures/latest?api_token=${SPORTMONKS_TOKEN}&include=participants;scores;events;odds`;
            
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                
                if (data.data && Array.isArray(data.data) && data.data.length > 0) {
                    console.log(`Received ${data.data.length} updates`);
                    data.data.forEach(match => {
                        updateOrAddMatch(match);
                    });
                    await syncToFirebase();
                    updateLastUpdateTime();
                } else {
                    console.log('No updates in last 10 seconds');
                }
            } catch (error) {
                console.error('Fetch latest updates error:', error);
            }
        }

        // Check for deleted fixtures
        async function checkDeletedFixtures() {
            const today = new Date().toISOString().split('T')[0];
            const url = `https://api.sportmonks.com/v3/football/fixtures/date/${today}?api_token=${SPORTMONKS_TOKEN}&filters=deleted`;
            
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                
                if (data.data && Array.isArray(data.data)) {
                    for (const deletedMatch of data.data) {
                        if (!deletedMatches.has(deletedMatch.id)) {
                            deletedMatches.add(deletedMatch.id);
                            await removeMatchFromFirebase(deletedMatch.id);
                            removeMatchFromLocal(deletedMatch.id);
                            console.log(`Removed deleted match: ${deletedMatch.id}`);
                        }
                    }
                }
            } catch (error) {
                console.error('Check deleted fixtures error:', error);
            }
        }

        // Update or add match to local state
        function updateOrAddMatch(newMatch) {
            const index = allMatches.findIndex(m => m.id === newMatch.id);
            
            if (index !== -1) {
                // Update existing match
                allMatches[index] = {
                    ...allMatches[index],
                    ...newMatch,
                    last_updated: Date.now()
                };
            } else {
                // Add new match
                allMatches.push({
                    ...newMatch,
                    last_updated: Date.now()
                });
            }
            
            renderMatches();
        }

        // Remove match from local state
        function removeMatchFromLocal(matchId) {
            allMatches = allMatches.filter(m => m.id !== matchId);
            renderMatches();
        }

        // Sync to Firebase
        async function syncToFirebase() {
            if (!auth.currentUser) {
                console.log('Waiting for auth...');
                return;
            }

            try {
                for (const match of allMatches) {
                    const matchRef = doc(db, 'games', match.id.toString());
                    const matchData = formatMatchForFirebase(match);
                    await setDoc(matchRef, matchData, { merge: true });
                }
                console.log(`Synced ${allMatches.length} matches to Firebase`);
            } catch (error) {
                console.error('Firebase sync error:', error);
            }
        }

        // Remove match from Firebase
        async function removeMatchFromFirebase(matchId) {
            if (!auth.currentUser) return;
            
            try {
                const matchRef = doc(db, 'games', matchId.toString());
                await deleteDoc(matchRef);
                console.log(`Removed match ${matchId} from Firebase`);
            } catch (error) {
                console.error('Firebase delete error:', error);
            }
        }

        // Format match for Firebase storage
        function formatMatchForFirebase(match) {
            return {
                id: match.id,
                name: `${match.localTeam?.name || 'Team A'} vs ${match.visitorTeam?.name || 'Team B'}`,
                localTeam: match.localTeam?.name || 'Unknown',
                visitorTeam: match.visitorTeam?.name || 'Unknown',
                score: {
                    local: match.scores?.localteam_score || 0,
                    visitor: match.scores?.visitorteam_score || 0
                },
                status: match.time?.status || match.state || 'NS',
                is_live: match.is_live || false,
                starting_at: match.starting_at,
                odds: {
                    home: match.odds?.home || null,
                    draw: match.odds?.draw || null,
                    away: match.odds?.away || null
                },
                last_synced: new Date().toISOString(),
                source: 'sportmonks_live'
            };
        }

        // Render matches based on current filter
        function renderMatches() {
            let filteredMatches = allMatches;
            
            switch(currentFilter) {
                case 'live':
                    filteredMatches = allMatches.filter(m => m.is_live === true);
                    break;
                case 'today':
                    const today = new Date().toISOString().split('T')[0];
                    filteredMatches = allMatches.filter(m => m.starting_at?.split('T')[0] === today);
                    break;
                case 'upcoming':
                    const now = new Date();
                    filteredMatches = allMatches.filter(m => !m.is_live && new Date(m.starting_at) > now);
                    break;
                default:
                    filteredMatches = allMatches;
            }
            
            const container = document.getElementById('matchesContainer');
            const liveCount = allMatches.filter(m => m.is_live === true).length;
            const totalCount = allMatches.length;
            
            document.getElementById('liveCount').textContent = liveCount;
            document.getElementById('totalCount').textContent = totalCount;
            
            if (filteredMatches.length === 0) {
                container.innerHTML = '<div class="loading" style="background: rgba(255,255,255,0.1); border-radius: 15px;"><p>No matches available</p></div>';
                return;
            }
            
            container.innerHTML = filteredMatches.map(match => createMatchCard(match)).join('');
        }

        // Create match card HTML
        function createMatchCard(match) {
            const localScore = match.scores?.localteam_score || 0;
            const visitorScore = match.scores?.visitorteam_score || 0;
            const status = match.is_live ? 'LIVE' : (match.time?.status || 'NS');
            const statusClass = match.is_live ? 'status-live' : (status === 'FT' ? 'status-ft' : 'status-NS');
            
            return `
                <div class="match-card" data-match-id="${match.id}">
                    <div class="match-status ${statusClass}">
                        ${status === 'LIVE' ? '🔴 LIVE' : status}
                    </div>
                    <div class="match-info">
                        <div class="teams">
                            <div class="team">
                                <div class="team-name">${match.localTeam?.name || 'Unknown'}</div>
                            </div>
                            <div class="score">
                                ${match.is_live || status === 'FT' ? `${localScore} - ${visitorScore}` : 'vs'}
                            </div>
                            <div class="team">
                                <div class="team-name">${match.visitorTeam?.name || 'Unknown'}</div>
                            </div>
                        </div>
                        <div class="match-details">
                            <div class="detail-row">
                                <span>🏟️ ${match.venue?.name || 'Venue TBD'}</span>
                                <span>📅 ${match.starting_at ? new Date(match.starting_at).toLocaleTimeString() : 'Time TBD'}</span>
                            </div>
                        </div>
                        ${match.odds ? `
                            <div class="odds">
                                <div class="odd">
                                    <div class="odd-label">1</div>
                                    <div class="odd-value">${match.odds.home || '-'}</div>
                                </div>
                                <div class="odd">
                                    <div class="odd-label">X</div>
                                    <div class="odd-value">${match.odds.draw || '-'}</div>
                                </div>
                                <div class="odd">
                                    <div class="odd-label">2</div>
                                    <div class="odd-value">${match.odds.away || '-'}</div>
                                </div>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        // Start polling for updates
        function startPolling() {
            if (pollingInterval) clearInterval(pollingInterval);
            
            // Poll every 7 seconds for live updates
            pollingInterval = setInterval(async () => {
                await fetchLatestUpdates();
                await checkDeletedFixtures();
            }, 7000);
        }

        // Update last update time display
        function updateLastUpdateTime() {
            const now = new Date();
            document.getElementById('lastUpdate').textContent = now.toLocaleTimeString();
        }

        // Setup event listeners
        function setupEventListeners() {
            const filterBtns = document.querySelectorAll('.filter-btn');
            filterBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    filterBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentFilter = btn.dataset.filter;
                    renderMatches();
                });
            });
        }

        // Show error message
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }

        // Show/hide loading
        function showLoading(show) {
            const loadingDiv = document.getElementById('loading');
            const container = document.getElementById('matchesContainer');
            if (show) {
                loadingDiv.style.display = 'block';
                container.style.display = 'none';
            } else {
                loadingDiv.style.display = 'none';
                container.style.display = 'grid';
            }
        }

        function hideLoading() {
            showLoading(false);
        }

        // Clean up on page unload
        window.addEventListener('beforeunload', () => {
            if (pollingInterval) {
                clearInterval(pollingInterval);
            }
        });

        // Start the app
        init();
    </script>
</body>
</html>
