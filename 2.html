<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>BetArena · Live Sports Betting | Next 7 Days</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0a0f1e 0%, #0c1222 100%);
            color: #eef2ff;
            padding: 20px 16px 60px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo h1 {
            font-size: 1.8rem;
            background: linear-gradient(135deg, #c084fc, #60a5fa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
        }

        .logo p {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-top: 4px;
        }

        .stats-badge {
            background: #1e293b;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 0.85rem;
            display: flex;
            gap: 16px;
        }

        .stats-badge span {
            color: #fbbf24;
            font-weight: 600;
        }

        /* filters */
        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 28px;
            background: #111827;
            padding: 14px 20px;
            border-radius: 48px;
            backdrop-filter: blur(4px);
        }

        .filter-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.85rem;
        }

        .filter-btn.active {
            background: #3b82f6;
            color: white;
            box-shadow: 0 4px 12px rgba(59,130,246,0.3);
        }

        .filter-btn:hover:not(.active) {
            background: #1f2937;
            color: #e2e8f0;
        }

        /* match grid */
        .section-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin: 24px 0 16px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title i {
            font-size: 1.3rem;
        }

        .matches-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        /* match card */
        .match-card {
            background: #111827;
            border-radius: 24px;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .match-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 30px -12px rgba(0,0,0,0.5);
            border-color: rgba(59,130,246,0.3);
        }

        .league-info {
            background: #0f172a;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #1e293b;
        }

        .league-name {
            font-size: 0.75rem;
            font-weight: 500;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .match-date {
            margin-left: auto;
            font-size: 0.7rem;
            background: #1e293b;
            padding: 4px 10px;
            border-radius: 20px;
            color: #cbd5e1;
        }

        .teams {
            padding: 20px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .team {
            flex: 1;
            text-align: center;
        }

        .team-name {
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 6px;
        }

        .vs {
            font-size: 0.8rem;
            background: #1f2937;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-weight: 800;
            color: #facc15;
        }

        /* odds row */
        .odds-row {
            display: flex;
            justify-content: space-around;
            padding: 12px 16px;
            background: #0f172a;
            margin: 0 12px 12px 12px;
            border-radius: 48px;
        }

        .odd-box {
            text-align: center;
            flex: 1;
        }

        .odd-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            color: #64748b;
        }

        .odd-value {
            font-weight: 700;
            font-size: 1.1rem;
            color: #fbbf24;
        }

        .bet-btn {
            background: #3b82f6;
            border: none;
            width: calc(100% - 32px);
            margin: 0 16px 18px 16px;
            padding: 10px;
            border-radius: 40px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.85rem;
        }

        .bet-btn:hover {
            background: #2563eb;
            transform: scale(0.98);
        }

        /* loading & empty state */
        .loading-spinner {
            text-align: center;
            padding: 60px;
            color: #94a3b8;
        }

        .empty-state {
            text-align: center;
            padding: 60px;
            background: #111827;
            border-radius: 32px;
            margin: 20px 0;
        }

        .status-badge {
            display: inline-block;
            background: #10b98120;
            color: #10b981;
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 30px;
            margin-left: 10px;
        }

        footer {
            text-align: center;
            margin-top: 48px;
            font-size: 0.75rem;
            color: #475569;
        }

        @media (max-width: 640px) {
            .matches-grid {
                grid-template-columns: 1fr;
            }
            .filters {
                border-radius: 24px;
                overflow-x: auto;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo">
            <h1>⚡ BETARENA</h1>
            <p>live odds · next 7 days matches</p>
        </div>
        <div class="stats-badge">
            <div>🏆 <span id="matchCount">0</span> fixtures</div>
            <div>📅 <span id="dateRange">loading...</span></div>
        </div>
    </div>

    <!-- filters: live / upcoming (next 7d) -->
    <div class="filters">
        <button class="filter-btn active" data-filter="all">📋 All (7d)</button>
        <button class="filter-btn" data-filter="live">🔴 Live / In-Play</button>
        <button class="filter-btn" data-filter="upcoming">⏳ Upcoming (0-7d)</button>
    </div>

    <div id="matchesContainer">
        <div class="loading-spinner">🔄 Fetching live fixtures & next 7 days schedule...<br>using Sportmonks API</div>
    </div>
    <footer>
        ⚡ Betting simulator — odds displayed are for demo. Real-time data from Sportmonks (next 7 days).
    </footer>
</div>

<script>
    // ---------- CONFIGURATION ----------
    const API_TOKEN = 'DkFdWG9jFZvH8XSEgLrRfGwczABWVg5rlV25GvIRyN06zdPsOI48Nsv9Wooy';
    const BASE_URL = 'https://api.sportmonks.com/v3';
    
    // Helper: date manipulation (next 7 days)
    function getDateRange() {
        const today = new Date();
        const sevenDaysLater = new Date();
        sevenDaysLater.setDate(today.getDate() + 7);
        const format = (d) => d.toISOString().split('T')[0];
        return { from: format(today), to: format(sevenDaysLater) };
    }

    // Format match date to readable (relative)
    function formatMatchDate(dateStr) {
        if (!dateStr) return 'TBD';
        const matchDate = new Date(dateStr);
        const now = new Date();
        const diffDays = Math.floor((matchDate - now) / (1000 * 60 * 60 * 24));
        if (diffDays < 0 && matchDate < now) return `🔴 LIVE / FT`;
        if (diffDays === 0) return `⚡ Today ${matchDate.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}`;
        if (diffDays === 1) return `📅 Tomorrow ${matchDate.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}`;
        if (diffDays <= 7) return `📅 In ${diffDays} days`;
        return matchDate.toLocaleDateString();
    }

    // check if match is live (state_id: 1-4 in many APIs, but we rely on fixture state, also we use starting_at comparison)
    // For simplicity: if starting_at <= now and not finished we treat as live/inplay (but we also have state_id filter).
    // We'll use state_id: 1=NS, 2=Live, 3=HT, 4=FT etc. Based on typical Sportmonks: state_id 1=not started, 2=live, 3=half time, 4=finished, 5=postponed.
    // In the sample data we saw state_id:5 = finished (old). But we'll add live detection.
    function isLiveMatch(fixture) {
        if (!fixture.starting_at) return false;
        const start = new Date(fixture.starting_at);
        const now = new Date();
        const isOngoing = (start <= now && fixture.state_id !== undefined && (fixture.state_id === 2 || fixture.state_id === 3));
        // also if state missing but time elapsed and not finished
        if (!fixture.state_id && start <= now && (!fixture.result_info || !fixture.result_info.includes('won'))) return true;
        return isOngoing;
    }

    // Helper to generate mock odds (since our current subscription returns has_odds but not odds object, we generate realistic odds based on fixture id)
    // Real platform would fetch odds endpoint, but for demo we produce dynamic odds for 1X2.
    function generateOdds(fixture) {
        const seed = (fixture.id * 9301 + 49297) % 233280;
        const homeOdd = (2.0 + (seed % 100) / 100).toFixed(2);
        const drawOdd = (3.0 + ((seed * 13) % 80) / 100).toFixed(2);
        const awayOdd = (2.5 + ((seed * 37) % 150) / 100).toFixed(2);
        return { home: homeOdd, draw: drawOdd, away: awayOdd };
    }

    // ---- fetch fixtures from multiple endpoints: livescores + fixtures with date filter ----
    // Because we need matches from next 7 days, we fetch /football/fixtures/between/{from}/{to}
    // And also live/inplay fixtures
    async function fetchMatchesNext7Days() {
        const { from, to } = getDateRange();
        const endpoints = [
            // 1) live inplay matches (important for live section)
            `${BASE_URL}/football/livescores/inplay?api_token=${API_TOKEN}&include=participants;league;state;venue`,
            // 2) fixtures between dates: next 7 days (upcoming)
            `${BASE_URL}/football/fixtures/between/${from}/${to}?api_token=${API_TOKEN}&include=participants;league;state;venue`
        ];
        
        let allFixtures = [];
        let errors = [];

        for (const url of endpoints) {
            try {
                const response = await fetch(url);
                if (!response.ok) {
                    console.warn(`API error ${response.status} for ${url}`);
                    continue;
                }
                const json = await response.json();
                if (json.data && Array.isArray(json.data)) {
                    allFixtures.push(...json.data);
                } else if (json.data && !Array.isArray(json.data)) {
                    // some responses might wrap
                }
            } catch (err) {
                console.error("Fetch error", err);
                errors.push(err);
            }
        }

        // fallback: if both endpoints fail, we try generic fixtures endpoint with pagination (first 100)
        if (allFixtures.length === 0) {
            console.warn("Falling back to /football/fixtures?per_page=100");
            try {
                const fallbackUrl = `${BASE_URL}/football/fixtures?api_token=${API_TOKEN}&per_page=100&include=participants;league;state`;
                const res = await fetch(fallbackUrl);
                if (res.ok) {
                    const fallbackJson = await res.json();
                    if (fallbackJson.data && Array.isArray(fallbackJson.data)) {
                        allFixtures = fallbackJson.data;
                    }
                }
            } catch(e) {}
        }

        // deduplicate by fixture id
        const unique = new Map();
        for (const fix of allFixtures) {
            if (!unique.has(fix.id)) {
                unique.set(fix.id, fix);
            }
        }
        let fixtures = Array.from(unique.values());

        // filter only matches within next 7 days OR live (any date if live)
        const now = new Date();
        const sevenDaysLater = new Date();
        sevenDaysLater.setDate(now.getDate() + 7);
        sevenDaysLater.setHours(23,59,59,999);
        
        fixtures = fixtures.filter(f => {
            if (!f.starting_at) return false;
            const matchDate = new Date(f.starting_at);
            const isLive = isLiveMatch(f);
            // keep if live OR upcoming within next 7 days
            if (isLive) return true;
            return (matchDate >= now && matchDate <= sevenDaysLater);
        });

        // sort by starting_at (earliest first)
        fixtures.sort((a,b) => new Date(a.starting_at) - new Date(b.starting_at));
        return fixtures;
    }

    // Enhance fixture with participants details from include or fallback
    function extractParticipants(fixture) {
        let homeTeam = { name: "Home", id: null };
        let awayTeam = { name: "Away", id: null };
        
        if (fixture.participants && Array.isArray(fixture.participants)) {
            const home = fixture.participants.find(p => p.meta?.location === 'home' || p.position === 'home');
            const away = fixture.participants.find(p => p.meta?.location === 'away' || p.position === 'away');
            if (home) homeTeam.name = home.name || home.display_name || "Home";
            if (away) awayTeam.name = away.name || away.display_name || "Away";
            if (!home && fixture.participants[0]) homeTeam.name = fixture.participants[0].name;
            if (!away && fixture.participants[1]) awayTeam.name = fixture.participants[1].name;
        } else {
            // fallback: parse from fixture.name
            if (fixture.name && fixture.name.includes(' vs ')) {
                const parts = fixture.name.split(' vs ');
                if (parts.length === 2) {
                    homeTeam.name = parts[0];
                    awayTeam.name = parts[1];
                }
            }
        }
        return { homeTeam, awayTeam };
    }

    // Get league name
    function getLeagueName(fixture) {
        if (fixture.league && fixture.league.name) return fixture.league.name;
        if (fixture.league_id) return `League ID ${fixture.league_id}`;
        return "International / Cup";
    }

    // render matches with filter
    let currentFixtures = [];
    let activeFilter = "all";

    function renderMatches(filter = activeFilter) {
        const container = document.getElementById('matchesContainer');
        if (!currentFixtures.length) {
            container.innerHTML = `<div class="empty-state">⚽ No matches found for the next 7 days.<br>Check back later or adjust filters.</div>`;
            document.getElementById('matchCount').innerText = '0';
            return;
        }

        let filtered = [...currentFixtures];
        if (filter === 'live') {
            filtered = filtered.filter(m => isLiveMatch(m));
        } else if (filter === 'upcoming') {
            filtered = filtered.filter(m => !isLiveMatch(m) && new Date(m.starting_at) > new Date());
        }

        document.getElementById('matchCount').innerText = filtered.length;
        const range = getDateRange();
        document.getElementById('dateRange').innerHTML = `${range.from} → ${range.to}`;

        if (filtered.length === 0) {
            container.innerHTML = `<div class="empty-state">📭 No ${filter === 'live' ? 'live' : 'upcoming'} matches right now. Try another filter.</div>`;
            return;
        }

        const grid = document.createElement('div');
        grid.className = 'matches-grid';

        for (const fixture of filtered) {
            const { homeTeam, awayTeam } = extractParticipants(fixture);
            const leagueName = getLeagueName(fixture);
            const matchDateFormatted = formatMatchDate(fixture.starting_at);
            const isLive = isLiveMatch(fixture);
            const odds = generateOdds(fixture);
            
            const card = document.createElement('div');
            card.className = 'match-card';
            card.innerHTML = `
                <div class="league-info">
                    <span class="league-name">⚽ ${leagueName}</span>
                    <span class="match-date">${matchDateFormatted} ${isLive ? '<span class="status-badge">🔴 LIVE</span>' : ''}</span>
                </div>
                <div class="teams">
                    <div class="team">
                        <div class="team-name">${escapeHtml(homeTeam.name)}</div>
                    </div>
                    <div class="vs">VS</div>
                    <div class="team">
                        <div class="team-name">${escapeHtml(awayTeam.name)}</div>
                    </div>
                </div>
                <div class="odds-row">
                    <div class="odd-box">
                        <div class="odd-label">1 (HOME)</div>
                        <div class="odd-value">${odds.home}</div>
                    </div>
                    <div class="odd-box">
                        <div class="odd-label">X (DRAW)</div>
                        <div class="odd-value">${odds.draw}</div>
                    </div>
                    <div class="odd-box">
                        <div class="odd-label">2 (AWAY)</div>
                        <div class="odd-value">${odds.away}</div>
                    </div>
                </div>
                <button class="bet-btn" data-fixture='${JSON.stringify({id: fixture.id, home: homeTeam.name, away: awayTeam.name, odds})}'>💰 PLACE BET (SIMULATED)</button>
            `;
            grid.appendChild(card);
        }

        container.innerHTML = '';
        container.appendChild(grid);

        // attach bet events
        document.querySelectorAll('.bet-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const data = JSON.parse(btn.getAttribute('data-fixture'));
                alert(`⚡ SIMULATION: You placed a bet on ${data.home} vs ${data.away}\nOdds: 1:${data.odds.home} | X:${data.odds.draw} | 2:${data.odds.away}\n(This is a demo — no real money involved.)`);
            });
        });
    }

    function escapeHtml(str) { 
        if(!str) return '?';
        return str.replace(/[&<>]/g, function(m) {
            if(m === '&') return '&amp;';
            if(m === '<') return '&lt;';
            if(m === '>') return '&gt;';
            return m;
        });
    }

    // initialize data fetching
    async function init() {
        const container = document.getElementById('matchesContainer');
        container.innerHTML = `<div class="loading-spinner">🔄 Loading live & next 7 days fixtures from Sportmonks API...<br>Using token & includes (participants, league)</div>`;
        
        try {
            const matches = await fetchMatchesNext7Days();
            currentFixtures = matches;
            renderMatches(activeFilter);
            
            // if still empty after fetching but maybe API returned no data due to subscription or limited scope, provide demo fallback?
            if (currentFixtures.length === 0) {
                // fallback: inject demo data for demonstration only if API returns zero (but user has valid trial)
                // but we trust the API; if zero, show note but provide sample
                container.innerHTML = `<div class="empty-state">⚠️ No fixtures in the next 7 days from API response.<br>Your subscription may have limited fixtures, but you can still enjoy demo UI. Try refreshing later.</div>`;
                document.getElementById('matchCount').innerText = '0';
            }
        } catch (err) {
            console.error(err);
            container.innerHTML = `<div class="empty-state">❌ Failed to fetch matches. Network or API token issue.<br>Check console or API limits. ${err.message}</div>`;
        }
    }

    // filter buttons
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            activeFilter = btn.getAttribute('data-filter');
            renderMatches(activeFilter);
        });
    });

    init();
    
    // auto-refresh every 45 seconds for live updates (optional)
    let refreshInterval = setInterval(async () => {
        if (document.visibilityState === 'visible') {
            try {
                const fresh = await fetchMatchesNext7Days();
                if (fresh.length > 0) {
                    currentFixtures = fresh;
                    renderMatches(activeFilter);
                }
            } catch(e) {}
        }
    }, 45000);
</script>
</body>
</html>
