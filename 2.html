<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Betting Platform - Sportmonks Integration</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #0a0e27;
            color: #fff;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #1a1f3a 0%, #0a0e27 100%);
            padding: 1rem 2rem;
            border-bottom: 1px solid #2a2f4a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo h1 {
            font-size: 1.5rem;
            background: linear-gradient(135deg, #00d4ff, #7c3aed);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .logo p {
            font-size: 0.75rem;
            color: #6b7280;
        }

        .wallet {
            background: #1f2937;
            padding: 0.5rem 1.5rem;
            border-radius: 999px;
            border: 1px solid #374151;
        }

        .wallet .label {
            font-size: 0.75rem;
            color: #9ca3af;
        }

        .wallet .balance {
            font-size: 1.5rem;
            font-weight: bold;
            color: #10b981;
        }

        /* Main layout */
        .container {
            display: flex;
            min-height: calc(100vh - 80px);
        }

        /* Events panel */
        .events-panel {
            flex: 2;
            padding: 1.5rem;
            overflow-y: auto;
            max-height: calc(100vh - 80px);
        }

        /* Betting slip */
        .slip-panel {
            width: 350px;
            background: #0f1322;
            border-left: 1px solid #2a2f4a;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 0;
            height: calc(100vh - 80px);
        }

        /* Match cards */
        .match-card {
            background: #1a1f3a;
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1rem;
            border: 1px solid #2a2f4a;
            transition: all 0.2s;
        }

        .match-card:hover {
            border-color: #7c3aed;
            transform: translateY(-2px);
        }

        .league-name {
            font-size: 0.7rem;
            color: #7c3aed;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        .teams {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .team {
            font-weight: 600;
            font-size: 1rem;
        }

        .vs {
            color: #6b7280;
            font-size: 0.75rem;
        }

        .score {
            text-align: center;
            font-size: 1.25rem;
            font-weight: bold;
            color: #00d4ff;
            margin-bottom: 0.75rem;
        }

        .bet-buttons {
            display: flex;
            gap: 0.5rem;
        }

        .bet-btn {
            flex: 1;
            background: #2a2f4a;
            border: none;
            color: white;
            padding: 0.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
        }

        .bet-btn:hover {
            background: #7c3aed;
            transform: scale(1.02);
        }

        .bet-odds {
            font-size: 0.7rem;
            color: #10b981;
            margin-top: 0.25rem;
            text-align: center;
        }

        /* Slip styling */
        .slip-title {
            font-size: 1.25rem;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid #2a2f4a;
        }

        .slip-items {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 1rem;
        }

        .slip-item {
            background: #1a1f3a;
            border-radius: 8px;
            padding: 0.75rem;
            margin-bottom: 0.5rem;
            font-size: 0.8rem;
            position: relative;
        }

        .slip-item .remove {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 1rem;
        }

        .slip-stake {
            margin: 1rem 0;
        }

        .slip-stake input {
            width: 100%;
            padding: 0.5rem;
            background: #2a2f4a;
            border: 1px solid #374151;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
        }

        .place-bet-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            border: none;
            color: white;
            padding: 0.75rem;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 0.5rem;
        }

        .place-bet-btn:hover {
            transform: scale(1.02);
        }

        .demo-warning {
            margin-top: 1rem;
            font-size: 0.7rem;
            color: #ef4444;
            text-align: center;
            border-top: 1px solid #2a2f4a;
            padding-top: 1rem;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: #6b7280;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            .slip-panel {
                width: 100%;
                position: relative;
                height: auto;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">
            <h1>⚡ DemoBet</h1>
            <p>Powered by Sportmonks | Demo Mode - No Real Money</p>
        </div>
        <div class="wallet">
            <div class="label">Demo Balance</div>
            <div class="balance" id="balance">$1,000.00</div>
        </div>
    </div>

    <div class="container">
        <div class="events-panel" id="events-panel">
            <div class="loading">📡 Loading live matches from Sportmonks API...</div>
        </div>

        <div class="slip-panel">
            <div class="slip-title">📋 Betting Slip</div>
            <div class="slip-items" id="slip-items">
                <div style="color: #6b7280; text-align: center;">No selections yet</div>
            </div>
            <div class="slip-stake">
                <input type="number" id="stake" placeholder="Enter stake amount ($)" value="10">
            </div>
            <div style="margin-bottom: 0.5rem;">
                <span>Potential Winnings: </span>
                <strong id="potential-winnings">$0.00</strong>
            </div>
            <button class="place-bet-btn" id="place-bet">Place Demo Bet</button>
            <div class="demo-warning">
                ⚠️ DEMO MODE - No real money involved.<br>
                This is a demonstration of Sportmonks API integration only.
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // YOUR SPORTMONKS API TOKEN - REPLACE THIS
        // ============================================
        const API_TOKEN = 'DkFdWG9jFZvH8XSEgLrRfGwczABWVg5rlV25GvIRyN06zdPsOI48Nsv9Wooy';
        
        // Demo state
        let balance = 1000.00;
        let betSlip = []; // Each item: { matchId, teamName, odds, selection }
        
        // DOM elements
        const balanceEl = document.getElementById('balance');
        const eventsPanel = document.getElementById('events-panel');
        const slipItemsEl = document.getElementById('slip-items');
        const stakeInput = document.getElementById('stake');
        const potentialWinningsEl = document.getElementById('potential-winnings');
        const placeBetBtn = document.getElementById('place-bet');
        
        // Update balance display
        function updateBalanceDisplay() {
            balanceEl.textContent = `$${balance.toFixed(2)}`;
        }
        
        // Calculate potential winnings
        function calculateWinnings() {
            const stake = parseFloat(stakeInput.value) || 0;
            if (betSlip.length === 0) return 0;
            
            // Multiply odds for accumulator (demo)
            let totalOdds = 1;
            for (let bet of betSlip) {
                totalOdds *= bet.odds;
            }
            return stake * totalOdds;
        }
        
        function updatePotentialWinnings() {
            const winnings = calculateWinnings();
            potentialWinningsEl.textContent = `$${winnings.toFixed(2)}`;
        }
        
        // Render betting slip
        function renderBetSlip() {
            if (betSlip.length === 0) {
                slipItemsEl.innerHTML = '<div style="color: #6b7280; text-align: center;">No selections yet</div>';
                updatePotentialWinnings();
                return;
            }
            
            slipItemsEl.innerHTML = betSlip.map((bet, idx) => `
                <div class="slip-item">
                    <button class="remove" data-index="${idx}">✖</button>
                    <strong>${bet.teamName}</strong><br>
                    <small>Odds: ${bet.odds.toFixed(2)}</small>
                </div>
            `).join('');
            
            // Add remove event listeners
            document.querySelectorAll('.remove').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const idx = parseInt(btn.dataset.index);
                    betSlip.splice(idx, 1);
                    renderBetSlip();
                    updatePotentialWinnings();
                });
            });
            
            updatePotentialWinnings();
        }
        
        // Add bet to slip
        function addToSlip(matchId, teamName, odds) {
            betSlip.push({ matchId, teamName, odds });
            renderBetSlip();
        }
        
        // Place demo bet
        function placeDemoBet() {
            if (betSlip.length === 0) {
                alert('Add some selections to your betting slip first!');
                return;
            }
            
            const stake = parseFloat(stakeInput.value);
            if (isNaN(stake) || stake <= 0) {
                alert('Please enter a valid stake amount');
                return;
            }
            
            const winnings = calculateWinnings();
            
            if (stake > balance) {
                alert(`Insufficient balance! Your demo balance is $${balance.toFixed(2)}`);
                return;
            }
            
            // Deduct stake, add winnings (demo only - always "wins" for demonstration)
            balance = balance - stake + winnings;
            updateBalanceDisplay();
            
            // Clear bet slip
            betSlip = [];
            renderBetSlip();
            stakeInput.value = '10';
            
            alert(`✅ Demo bet placed!\nStake: $${stake.toFixed(2)}\nWinnings: $${winnings.toFixed(2)}\nNew Balance: $${balance.toFixed(2)}`);
        }
        
        // Fetch live matches from Sportmonks
        async function fetchLiveMatches() {
            eventsPanel.innerHTML = '<div class="loading">📡 Loading live matches from Sportmonks API...</div>';
            
            try {
                // Using the livescores/inplay endpoint you provided
                const url = `https://api.sportmonks.com/v3/football/livescores/inplay?api_token=${API_TOKEN}&include=participants;league`;
                
                console.log('Fetching from:', url);
                
                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error(`API Error: ${response.status} ${response.statusText}`);
                }
                
                const data = await response.json();
                console.log('API Response:', data);
                
                if (!data.data || data.data.length === 0) {
                    eventsPanel.innerHTML = '<div class="loading">⚽ No live matches at the moment. Check back during games!</div>';
                    return;
                }
                
                renderMatches(data.data);
                
            } catch (error) {
                console.error('Fetch error:', error);
                eventsPanel.innerHTML = `
                    <div class="loading" style="color: #ef4444;">
                        ❌ Failed to load matches<br>
                        Error: ${error.message}<br><br>
                        <small>Make sure your API token is valid and you have permission for the /livescores endpoint.</small>
                    </div>
                `;
            }
        }
        
        // Render matches with demo odds
        function renderMatches(matches) {
            if (!matches || matches.length === 0) {
                eventsPanel.innerHTML = '<div class="loading">⚽ No live matches found</div>';
                return;
            }
            
            eventsPanel.innerHTML = matches.map(match => {
                const participants = match.participants || [];
                const homeTeam = participants.find(p => p.meta?.location === 'home') || participants[0];
                const awayTeam = participants.find(p => p.meta?.location === 'away') || participants[1];
                
                const homeName = homeTeam?.name || 'Home Team';
                const awayName = awayTeam?.name || 'Away Team';
                const leagueName = match.league?.name || 'Unknown League';
                
                // Demo odds (in a real platform, these come from an odds provider)
                const homeOdds = (Math.random() * 2 + 1.5).toFixed(2);
                const drawOdds = (Math.random() * 2 + 2).toFixed(2);
                const awayOdds = (Math.random() * 2 + 1.5).toFixed(2);
                
                const scores = match.scores || {};
                const homeScore = scores.home || scores.score?.home || '-';
                const awayScore = scores.away || scores.score?.away || '-';
                
                return `
                    <div class="match-card" data-match-id="${match.id}">
                        <div class="league-name">⚽ ${leagueName}</div>
                        <div class="teams">
                            <span class="team">${homeName}</span>
                            <span class="vs">vs</span>
                            <span class="team">${awayName}</span>
                        </div>
                        <div class="score">${homeScore} - ${awayScore}</div>
                        <div class="bet-buttons">
                            <button class="bet-btn" data-team="${homeName}" data-odds="${homeOdds}">${homeName}<br><span class="bet-odds">${homeOdds}</span></button>
                            <button class="bet-btn" data-team="Draw" data-odds="${drawOdds}">Draw<br><span class="bet-odds">${drawOdds}</span></button>
                            <button class="bet-btn" data-team="${awayName}" data-odds="${awayOdds}">${awayName}<br><span class="bet-odds">${awayOdds}</span></button>
                        </div>
                    </div>
                `;
            }).join('');
            
            // Add event listeners to bet buttons
            document.querySelectorAll('.bet-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const teamName = btn.dataset.team;
                    const odds = parseFloat(btn.dataset.odds);
                    const matchCard = btn.closest('.match-card');
                    const matchId = matchCard.dataset.matchId;
                    
                    addToSlip(matchId, teamName, odds);
                    
                    // Visual feedback
                    btn.style.transform = 'scale(0.95)';
                    setTimeout(() => { btn.style.transform = ''; }, 150);
                });
            });
        }
        
        // Also try fixtures endpoint as fallback
        async function fetchFixturesAsFallback() {
            try {
                const url = `https://api.sportmonks.com/v3/football/fixtures?api_token=${API_TOKEN}&include=participants;league&filter=upcoming`;
                const response = await fetch(url);
                if (response.ok) {
                    const data = await response.json();
                    if (data.data && data.data.length > 0) {
                        console.log('Using upcoming fixtures as fallback');
                        renderMatches(data.data);
                    }
                }
            } catch (e) {
                console.log('Fallback also failed');
            }
        }
        
        // Event listeners
        stakeInput.addEventListener('input', updatePotentialWinnings);
        placeBetBtn.addEventListener('click', placeDemoBet);
        
        // Initialize
        updateBalanceDisplay();
        fetchLiveMatches().catch(() => fetchFixturesAsFallback());
        
        // Refresh every 30 seconds
        setInterval(() => {
            fetchLiveMatches().catch(() => {});
        }, 30000);
    </script>
</body>
</html>
