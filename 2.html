            --secondary: #ff9800;
            --danger: #ff4757;
            --success: #4caf50;
            --warning: #ffc107;
            --info: #2196f3;
            --bg: #0a0f1a;
            --surface: #111827;
            --surface-light: #1a2332;
            --surface-hover: #1f2a3a;
            --text: #ffffff;
            --text-dim: #94a3b8;
            --border: #1e293b;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            padding-bottom: 80px;

        /* Header */
        .header {
            background: var(--surface);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--info));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .balance-card {
            background: var(--surface-light);
            padding: 8px 16px;
            border-radius: 30px;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .balance-amount {
            color: var(--primary);
            font-weight: 700;
            font-size: 18px;
        }

        /* Main Layout */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 20px;
        }

        /* Filters */
        .filters-section {
            background: var(--surface);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .filters {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            flex-wrap: wrap;
        }

        .filter-btn, .league-btn {
            padding: 8px 20px;
            background: var(--surface-light);
            border: 1px solid var(--border);
            border-radius: 30px;
            color: var(--text);
            cursor: pointer;
            transition: all 0.3s;
            font-size: 13px;
            white-space: nowrap;
        }

        .filter-btn.active, .league-btn.active {
            background: var(--primary);
            color: #000;
            border-color: var(--primary);
        }

        /* Matches */
        .matches-container {
            background: var(--surface);
            border-radius: 20px;
            padding: 20px;
        }

        .matches-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: 600px;
            overflow-y: auto;
        }

        .match-card {
            background: var(--surface-light);
            border-radius: 16px;
            padding: 15px;
            border: 1px solid var(--border);
            transition: all 0.3s;
        }

        .match-card:hover {
            transform: translateY(-2px);
            border-color: var(--primary);
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 12px;
            color: var(--text-dim);
        }

        .live-badge {
            background: var(--danger);
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 10px;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .match-teams {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .team {
            font-weight: 600;
            font-size: 15px;
            flex: 1;
        }

        .team.home { text-align: left; }
        .team.away { text-align: right; }

        .score {
            font-size: 20px;
            font-weight: 800;
            color: var(--primary);
            margin: 0 15px;
        }

        .markets {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 12px;
        }

        .market-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;

        .market-btn:hover {
            background: var(--primary);
            transform: scale(1.02);
        }

        .market-name {

            color: var(--text-dim);

        .market-odds {

            color: var(--primary);

        /* Bet Slip */
        .betslip {

            border-radius: 20px;
            padding: 20px;
            position: sticky;
            top: 80px;
            border: 2px solid var(--primary);

            align-items: center;

        .bet-type {

            border: none;
            border-radius: 30px;
            color: var(--text);
            cursor: pointer;

        .bet-type-btn.active {

        }

        .betslip-items {
            max-height: 300px;

            margin-bottom: 15px;

        .betslip-item {
            background: var(--surface-light);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            position: relative;
        }

        .remove-bet {
            position: absolute;

            right: 8px;
            color: var(--danger);
            cursor: pointer;
            font-size: 12px;

        .stake-input {
            background: var(--surface-light);

            padding: 0 16px;
            margin: 15px 0;

                    headers: { 'Accept': 'application/json' }
                });
                
                if (fixturesResponse.ok) {
                    const fixturesData = await fixturesResponse.json();
                    if (fixturesData.data) {
                        fixtures = fixturesData.data;
                    }
                }
                
                // Also try getting livescores
                const livescoresResponse = await fetch(`${API_BASE}/livescores?api_token=${SPORTMONKS_TOKEN_2}&include=league;localTeam;visitorTeam;scores`, {
                    headers: { 'Accept': 'application/json' }
                });
                
                if (livescoresResponse.ok) {
                    const livescoresData = await livescoresResponse.json();
                    if (livescoresData.data) {
                        fixtures.push(...livescoresData.data);
                    }
                }
                
                if (fixtures.length > 0) {
                    matches = processFixtures(fixtures);
                } else {
                    // Use demo 2026 matches if API returns empty
                    load2026DemoMatches();
                }
                
                displayMatches();
                showToast(`Loaded ${matches.length} matches for 2026`, 'success');
                
            } catch (error) {
                console.error('API Error:', error);
                load2026DemoMatches();
                displayMatches();
                showToast('Using demo 2026 matches data', 'info');
            }
        }

        // Process fixtures from API
        function processFixtures(fixtures) {
            return fixtures.map(fixture => {
                const participants = fixture.participants || [];
                const homeTeam = participants.find(p => p.meta?.location === 'home') || participants[0];
                const awayTeam = participants.find(p => p.meta?.location === 'away') || participants[1];
                
                const scores = fixture.scores || [];
                const homeScore = scores.find(s => s.participant_id === homeTeam?.id)?.score?.goals || null;
                const awayScore = scores.find(s => s.participant_id === awayTeam?.id)?.score?.goals || null;
                
                const isLive = fixture.state?.name === 'In Progress' || fixture.state?.name === 'Live';
                
                return {
                    id: fixture.id,
                    leagueId: fixture.league?.id,
                    leagueName: fixture.league?.name || 'International',
                    homeTeam: homeTeam?.name || 'Team A',
                    awayTeam: awayTeam?.name || 'Team B',
                    homeScore: homeScore,
                    awayScore: awayScore,
                    status: isLive ? 'live' : (homeScore !== null ? 'finished' : 'upcoming'),
                    time: fixture.starting_at ? new Date(fixture.starting_at).toLocaleTimeString() : 'TBD',
                    isLive: isLive,
                    odds: generateRealisticOdds(homeTeam?.name, awayTeam?.name)
                };
            }).slice(0, 30);
        }

        // Generate realistic odds based on team strength
        function generateRealisticOdds(homeTeam, awayTeam) {
            // Base odds
            let homeOdds = 2.50;
            let drawOdds = 3.20;
            let awayOdds = 2.80;
            
            // Adjust based on team names (popular teams have lower odds)
            const strongTeams = ['Real Madrid', 'Barcelona', 'Manchester', 'Liverpool', 'Bayern', 'PSG', 'Inter', 'Milan', 'Juventus', 'Arsenal', 'Chelsea'];
            const weakTeams = ['Alaves', 'Getafe', 'Cadiz', 'Empoli', 'Salernitana', 'Brentford'];
            
            if (strongTeams.some(team => homeTeam?.includes(team))) {
                homeOdds = 1.80;
                drawOdds = 3.50;
                awayOdds = 4.50;
            }
            if (strongTeams.some(team => awayTeam?.includes(team))) {
                homeOdds = 4.50;
                drawOdds = 3.50;
                awayOdds = 1.80;
            }
            if (weakTeams.some(team => homeTeam?.includes(team))) {
                homeOdds = 3.80;
                awayOdds = 2.10;
            }
            
            return {
                home: homeOdds.toFixed(2),
                draw: drawOdds.toFixed(2),
                away: awayOdds.toFixed(2),
                over15: (Math.random() * 0.4 + 1.6).toFixed(2),
                under15: (Math.random() * 0.4 + 1.6).toFixed(2),
                over25: (Math.random() * 0.5 + 1.7).toFixed(2),
                under25: (Math.random() * 0.5 + 1.7).toFixed(2),
                btts: (Math.random() * 0.4 + 1.7).toFixed(2)
            };
        }

                // Bundesliga 2026
                {

                    leagueId: '82',

                },
                // Serie A 2026
                {
                    id: 5001,
                    leagueId: '384',
                    leagueName: '🇮🇹 Serie A',
                    homeTeam: 'Inter Milan',
                    awayTeam: 'AC Milan',
                    homeScore: null,
                    awayScore: null,

                },
                // Ligue 1 2026
                {
                    id: 6001,
                    leagueId: '301',
                    leagueName: '🇫🇷 Ligue 1',
                    homeTeam: 'PSG',
                    awayTeam: 'Marseille',
                    homeScore: null,
                    awayScore: null,
                    status: 'upcoming',
                    time: 'Tomorrow 17:00',
                    isLive: false,
                    odds: { home: 1.50, draw: 4.20, away: 6.00, over25: 1.60, under25: 2.30, btts: 1.85 }
                },
                // Champions League 2026
                {
                    id: 7001,
                    leagueId: 'UCL',
                    leagueName: '⭐ UEFA Champions League',
                    homeTeam: 'Real Madrid',
                    awayTeam: 'Bayern Munich',
                    homeScore: null,
                    awayScore: null,
                    status: 'upcoming',
                    time: 'May 28, 2026 - 20:00',
                    isLive: false,
                    odds: { home: 2.20, draw: 3.40, away: 3.20, over25: 1.85, under25: 1.95, btts: 1.70 }
                }
            ];
        }

        // Display matches based on filters
        function displayMatches() {
            let filtered = [...matches];
            
            // Apply league filter
            if (currentLeague !== 'all') {
                filtered = filtered.filter(m => m.leagueId === currentLeague);
            }
            
            // Apply status filter
            if (currentFilter === 'live') {
                filtered = filtered.filter(m => m.isLive === true);
            } else if (currentFilter === 'upcoming') {
                filtered = filtered.filter(m => m.status === 'upcoming');
            } else if (currentFilter === 'today') {
                filtered = filtered.filter(m => m.time.includes('Today'));
            }
            
            const container = document.getElementById('matchesList');
            
            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty-state"><i class="fas fa-futbol"></i><br>No matches found</div>';
                return;
            }
            
            container.innerHTML = filtered.map(match => `
                <div class="match-card">
                    <div class="match-header">
                        <span><i class="fas fa-trophy"></i> ${match.leagueName}</span>
                        <span>${match.isLive ? '<span class="live-badge">🔴 LIVE</span>' : match.time}</span>
                    </div>
                    <div class="match-teams">
                        <div class="team home">${match.homeTeam}</div>
                        <div class="score">${match.homeScore !== null ? match.homeScore : '-'} : ${match.awayScore !== null ? match.awayScore : '-'}</div>
                        <div class="team away">${match.awayTeam}</div>
                    </div>
                    <div class="markets">
                        <div class="market-btn" onclick="addToBetSlip('${match.id}', '1', ${match.odds.home}, 'Home Win')">
                            <div class="market-name">1 (HOME)</div>
                            <div class="market-odds">${match.odds.home}</div>
                        </div>
                        <div class="market-btn" onclick="addToBetSlip('${match.id}', 'X', ${match.odds.draw}, 'Draw')">
                            <div class="market-name">X (DRAW)</div>
                            <div class="market-odds">${match.odds.draw}</div>
                        </div>
                        <div class="market-btn" onclick="addToBetSlip('${match.id}', '2', ${match.odds.away}, 'Away Win')">
                            <div class="market-name">2 (AWAY)</div>
                            <div class="market-odds">${match.odds.away}</div>
                        </div>
                        <div class="market-btn" onclick="addToBetSlip('${match.id}', 'Over 2.5', ${match.odds.over25}, 'Over 2.5')">
                            <div class="market-name">OVER 2.5</div>
                            <div class="market-odds">${match.odds.over25}</div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Add to bet slip
        window.addToBetSlip = function(matchId, selection, odds, display) {
            const match = matches.find(m => m.id == matchId);
            if (!match) return;
            
            const bet = {
                id: `${matchId}_${selection}_${Date.now()}`,
                matchId: match.id,
                matchName: `${match.homeTeam} vs ${match.awayTeam}`,
                selection: selection,
                display: display,
                odds: parseFloat(odds),
                league: match.leagueName
            };
            
            if (betType === 'single') {
                selectedBets = [bet];
            } else {
                if (selectedBets.some(b => b.matchId === matchId)) {
                    showToast('Only one bet per match in accumulator', 'error');
                    return;
                }
                selectedBets.push(bet);
            }
            
            updateBetSlip();
            showToast(`Added: ${bet.matchName} - ${display} @ ${odds}`, 'success');
        };

        // Update bet slip UI
        function updateBetSlip() {
            const container = document.getElementById('betslipItems');
            const totalOddsSpan = document.getElementById('totalOdds');
            const potentialSpan = document.getElementById('potentialWin');
            const placeBtn = document.getElementById('placeBetBtn');
            const stake = parseFloat(document.getElementById('stakeAmount').value) || 0;
            
            if (selectedBets.length === 0) {
                container.innerHTML = '<div class="empty-state">➕ Click odds to add bets</div>';
                totalOddsSpan.textContent = '0.00';
                potentialSpan.textContent = '$0.00';
                placeBtn.disabled = true;
                return;
            }
            
            const totalOdds = selectedBets.reduce((acc, bet) => acc * bet.odds, 1);
            const potentialWin = stake * totalOdds;
            
            totalOddsSpan.textContent = totalOdds.toFixed(2);
            potentialSpan.textContent = `$${potentialWin.toFixed(2)}`;
            placeBtn.disabled = stake < 1 || stake > balance;
            
            container.innerHTML = selectedBets.map((bet, index) => `
                <div class="betslip-item">
                    <span class="remove-bet" onclick="removeBet('${bet.id}')">✖</span>
                    <div><strong>${bet.matchName}</strong></div>
                    <div style="font-size: 12px; color: var(--text-dim);">${bet.league}</div>
                    <div>${bet.display}</div>
                    <div style="color: var(--primary); font-weight: bold;">${bet.odds.toFixed(2)}</div>
                </div>
            `).join('');
        }

        window.removeBet = function(betId) {
            selectedBets = selectedBets.filter(b => b.id !== betId);
            updateBetSlip();
        };

        // Generate ticket number
        function generateTicketNumber() {
            const date = new Date();
            const random = Math.random().toString(36).substring(2, 8).toUpperCase();
            return `TKT-${date.getFullYear()}${(date.getMonth()+1).toString().padStart(2,'0')}${date.getDate().toString().padStart(2,'0')}-${date.getHours().toString().padStart(2,'0')}${date.getMinutes().toString().padStart(2,'0')}${date.getSeconds().toString().padStart(2,'0')}-${random}`;
        }

        // Place bet
        async function placeBet() {
            const stake = parseFloat(document.getElementById('stakeAmount').value);
            
            if (selectedBets.length === 0) {
                showToast('No bets selected', 'error');
                return;
            }
            
            if (stake < 1 || stake > 5000) {
                showToast('Stake must be between $1 and $5000', 'error');
                return;
            }
            
            if (stake > balance) {
                showToast('Insufficient balance', 'error');
                return;
            }
            
            const totalOdds = selectedBets.reduce((acc, bet) => acc * bet.odds, 1);
            const potentialWin = stake * totalOdds;
            const ticketNumber = generateTicketNumber();
            
            try {
                // Deduct from wallet
                const walletRef = db.collection("wallets").doc(currentUser.uid);
                await db.runTransaction(async (transaction) => {
                    const doc = await transaction.get(walletRef);
                    const newBalance = (doc.data()?.balance || 0) - stake;
                    if (newBalance < 0) throw new Error('Insufficient funds');
                    transaction.set(walletRef, { balance: newBalance, lastUpdated: new Date() }, { merge: true });
                });
                
                // Save bet
                const betData = {
                    userId: currentUser.uid,
                    ticketNumber: ticketNumber,
                    selections: selectedBets,
                    stake: stake,
                    totalOdds: totalOdds,
                    potentialWin: potentialWin,
                    betType: betType,
                    status: 'pending',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    createdAtDate: new Date().toISOString()
                };
                
                await db.collection("bets").doc(ticketNumber).set(betData);
                
                // Update local balance
                balance -= stake;
                document.getElementById('balance').textContent = balance.toFixed(2);
                
                // Clear bet slip
                selectedBets = [];
                updateBetSlip();
                
                showToast(`✅ Bet placed! Ticket: ${ticketNumber}`, 'success');
                
                // Refresh open bets
                loadOpenBets();
                loadHistory();
                
            } catch (error) {
                console.error('Place bet error:', error);
                showToast('Failed to place bet: ' + error.message, 'error');
            }
        }

        // Load balance
        async function loadBalance() {
            try {
                const doc = await db.collection("wallets").doc(currentUser.uid).get();
                if (doc.exists) {
                    balance = doc.data().balance || 0;
                } else {
                    balance = 1000;
                    await db.collection("wallets").doc(currentUser.uid).set({ balance: 1000 });
                }
                document.getElementById('balance').textContent = balance.toFixed(2);
            } catch (error) {
                console.error('Load balance error:', error);
                balance = 1000;
                document.getElementById('balance').textContent = '1000.00';
            }
        }

        // Load open bets
        async function loadOpenBets() {
            try {
                const snapshot = await db.collection("bets")
                    .where("userId", "==", currentUser.uid)
                    .where("status", "==", "pending")
                    .orderBy("createdAt", "desc")
                    .get();
                
                const container = document.getElementById('openBetsList');
                
                if (snapshot.empty) {
                    container.innerHTML = '<div class="empty-state">No open bets</div>';
                    return;
                }
                
                let html = '';
                snapshot.forEach(doc => {
                    const bet = doc.data();
                    const selectionsText = bet.selections.map(s => `${s.matchName} - ${s.display} @ ${s.odds.toFixed(2)}`).join('<br>');
                    html += `
                        <div class="bet-card">
                            <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                                <span style="font-size: 12px;">🎫 ${bet.ticketNumber.substring(0, 15)}</span>
                                <span style="background: var(--warning); padding: 2px 8px; border-radius: 20px;">PENDING</span>
                            </div>
                            <div style="font-size: 12px; margin: 8px 0;">${selectionsText}</div>
                            <div style="display: flex; justify-content: space-between; margin-top: 8px;">
                                <span>Stake: $${bet.stake.toFixed(2)}</span>
                                <span>To Win: $${bet.potentialWin.toFixed(2)}</span>
                                <button class="cashout-btn" onclick="cashOut('${bet.ticketNumber}', ${bet.stake})">💸 Cash Out (70%)</button>
                            </div>
                        </div>
                    `;
                });
                
                container.innerHTML = html;
            } catch (error) {
                console.error('Load open bets error:', error);
            }
        }

        // Cash out bet
        window.cashOut = async function(ticketNumber, stake) {
            const cashoutValue = stake * 0.7;
            if (!confirm(`Cash out for $${cashoutValue.toFixed(2)}?`)) return;
            
            try {
                const walletRef = db.collection("wallets").doc(currentUser.uid);
                await db.runTransaction(async (transaction) => {
                    const doc = await transaction.get(walletRef);
                    transaction.update(walletRef, { balance: (doc.data().balance || 0) + cashoutValue });
                });
                
                await db.collection("bets").doc(ticketNumber).update({
                    status: 'cashed_out',
                    cashoutValue: cashoutValue,
                    cashedOutAt: new Date().toISOString()
                });
                
                balance += cashoutValue;
                document.getElementById('balance').textContent = balance.toFixed(2);
                
                await loadOpenBets();
                await loadHistory();
                showToast(`💰 Cashed out $${cashoutValue.toFixed(2)}`, 'success');
            } catch (error) {
                showToast('Cashout failed', 'error');
            }
        };

        // Load bet history
        async function loadHistory() {
            try {
                const snapshot = await db.collection("bets")
                    .where("userId", "==", currentUser.uid)
                    .where("status", "in", ["won", "lost", "cashed_out"])
                    .orderBy("createdAt", "desc")
                    .limit(20)
                    .get();
                
                const container = document.getElementById('historyList');
                
                if (snapshot.empty) {
                    container.innerHTML = '<div class="empty-state">No betting history</div>';
                    return;
                }
                
                let html = '';
                snapshot.forEach(doc => {
                    const bet = doc.data();
                    const statusColor = bet.status === 'won' ? 'var(--success)' : bet.status === 'lost' ? 'var(--danger)' : 'var(--warning)';
                    html += `
                        <div class="bet-card" style="border-left-color: ${statusColor}">
                            <div style="display: flex; justify-content: space-between;">
                                <span style="font-size: 12px;">🎫 ${bet.ticketNumber.substring(0, 15)}</span>
                                <span style="background: ${statusColor}; padding: 2px 8px; border-radius: 20px;">${bet.status.toUpperCase()}</span>
                            </div>
                            <div style="font-size: 12px; margin: 8px 0;">${bet.selections.length} selections @ ${bet.totalOdds.toFixed(2)}</div>
                            <div style="display: flex; justify-content: space-between;">
                                <span>Stake: $${bet.stake.toFixed(2)}</span>
                                <span>${bet.status === 'won' ? '+' : ''}$${(bet.potentialWin || 0).toFixed(2)}</span>
                            </div>
                        </div>
                    `;
                });
                
                container.innerHTML = html;
            } catch (error) {
                console.error('Load history error:', error);
            }
        }

        // Setup realtime listeners
        function setupRealtimeListeners() {
            db.collection("wallets").doc(currentUser.uid).onSnapshot((doc) => {
                if (doc.exists) {
                    balance = doc.data().balance || 0;
                    document.getElementById('balance').textContent = balance.toFixed(2);
                }
            });
            
            db.collection("bets").where("userId", "==", currentUser.uid).onSnapshot(() => {
                loadOpenBets();
                loadHistory();
            });
        }

        // Show toast notification
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.style.borderLeftColor = type === 'success' ? 'var(--success)' : type === 'error' ? 'var(--danger)' : 'var(--primary)';
            toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-triangle' : 'fa-info-circle'}"></i> ${message}`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // Event Listeners
        document.getElementById('placeBetBtn').addEventListener('click', placeBet);
        document.getElementById('clearSlip').addEventListener('click', () => {
            selectedBets = [];
            updateBetSlip();
        });
        document.getElementById('stakeAmount').addEventListener('input', updateBetSlip);
        
        // Bet type tabs
        document.querySelectorAll('.bet-type-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.bet-type-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                betType = btn.dataset.type;
                selectedBets = [];
                updateBetSlip();
            });
        });
        
        // Filter buttons
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(f => f.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                displayMatches();
            });
        });
        
        // League filter buttons
        document.querySelectorAll('.league-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.league-btn').forEach(l => l.classList.remove('active'));
                btn.classList.add('active');
                currentLeague = btn.dataset.league;
                displayMatches();
            });
        });

        // Auto refresh every 60 seconds
        setInterval(() => {
            if (currentUser) {
                fetch2026Matches();
            }
        }, 60000);
    </script>
</body>
</html>
