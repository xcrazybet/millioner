<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<title>SportMonks API Tester</title>

<style>
body {
  font-family: Arial;
  background: #0f172a;
  color: white;
  padding: 20px;
}

h1 { color: #38bdf8; }

button {
  margin: 5px;
  padding: 10px 15px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  background: #2563eb;
  color: white;
}

button:hover {
  background: #1d4ed8;
}

.card {
  background: #1e293b;
  padding: 15px;
  margin: 10px 0;
  border-radius: 10px;
}

pre {
  background: black;
  padding: 10px;
  max-height: 300px;
  overflow: auto;
}
</style>

</head>

<body>

<h1>⚽ SportMonks API Tester</h1>

<div>
  <button onclick="loadData('fixtures')">Load Fixtures</button>
  <button onclick="loadData('leagues')">Load Leagues</button>
  <button onclick="loadData('teams')">Load Teams</button>
</div>

<h2>Formatted Data</h2>
<div id="output">Click a button to load data...</div>

<h2>Raw JSON</h2>
<pre id="raw"></pre>

<script>
const API_TOKEN = "DkFdWG9jFZvH8XSEgLrRfGwczABWVg5rlV25GvIRyN06zdPsOI48Nsv9Wooy";

async function loadData(type) {
  let url = "";

  if (type === "fixtures") {
    url = `https://api.sportmonks.com/v3/football/fixtures?api_token=${API_TOKEN}`;
  }
  else if (type === "leagues") {
    url = `https://api.sportmonks.com/v3/football/leagues?api_token=${API_TOKEN}`;
  }
  else if (type === "teams") {
    url = `https://api.sportmonks.com/v3/football/teams?api_token=${API_TOKEN}`;
  }

  try {
    const res = await fetch(url);
    const data = await res.json();

    // Show raw JSON
    document.getElementById("raw").textContent =
      JSON.stringify(data, null, 2);

    // Show simplified data
    const output = document.getElementById("output");
    output.innerHTML = "";

    data.data.slice(0, 10).forEach(item => {
      const div = document.createElement("div");
      div.className = "card";

      div.innerHTML = `
        <p><strong>ID:</strong> ${item.id}</p>
        <p><strong>Name:</strong> ${item.name || "N/A"}</p>
      `;

      output.appendChild(div);
    });

  } catch (err) {
    console.error(err);
    document.getElementById("output").innerHTML =
      "❌ Error loading data. Check console.";
  }
}
</script>

</body>
</html>
