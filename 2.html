<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WC 2026 - Live Scoreboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --border: #30363d;
            --accent: #238636;
            --text: #c9d1d9;
            --live: #f85149;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container { width: 100%; max-width: 700px; }

        header {
            text-align: center;
            padding: 40px 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 30px;
        }

        h1 { margin: 0; color: #fff; font-weight: 900; letter-spacing: -1px; }
        .date-label { color: var(--accent); font-weight: bold; text-transform: uppercase; margin-top: 5px; }

        .match-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: transform 0.2s ease;
        }

        .match-card:hover { transform: translateY(-2px); border-color: #8b949e; }

        .team { width: 35%; display: flex; flex-direction: column; align-items: center; text-align: center; }
        .team img { width: 55px; height: 55px; border-radius: 50%; background: #30363d; padding: 5px; margin-bottom: 10px; }
        .team-name { font-weight: 700; font-size: 0.95rem; color: #fff; }

        .score-center { width: 30%; text-align: center; }
        .score { font-size: 2.2rem; font-weight: 900; color: #fff; margin: 5px 0; }
        
        .status-badge {
            font-size: 0.65rem;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 4px;
            background: #21262d;
            border: 1px solid var(--border);
        }
        
        .status-live { color: var(--live); border-color: var(--live); animation: blink 1.5s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }

        .loader { 
            text-align: center; 
            padding: 50px; 
            color: var(--accent); 
            font-weight: bold; 
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>FIFA WORLD CUP</h1>
            <div class="date-label">June 15, 2026 • Group Stage</div>
        </header>

        <div id="dashboard">
            <div class="loader">SYNCING DATA...</div>
        </div>
    </div>

    <script>
        /**
         * CONFIGURATION
         * Replace the date here to check other World Cup days
         */
        const API_TOKEN = "DkFdWG9jFZvH8XSEgLrRfGwczABWVg5rlV25GvIRyN06zdPsOI48Nsv9Wooy";
        const TARGET_DATE = "2026-06-15"; 
        const API_URL = `https://api.sportmonks.com/v3/football/fixtures/date/${TARGET_DATE}?api_token=${API_TOKEN}&include=participants;scores;state`;

        async function updateScores() {
            const display = document.getElementById('dashboard');

            try {
                const response = await fetch(API_URL);
                const result = await response.json();

                if (!result.data || result.data.length === 0) {
                    display.innerHTML = '<div style="text-align:center; padding:20px;">No matches scheduled for this date.</div>';
                    return;
                }

                display.innerHTML = '';
                result.data.forEach(match => {
                    // Logic to ensure Home/Away positioning
                    const home = match.participants.find(p => p.meta.location === 'home') || { name: "TBD", image_path: "" };
                    const away = match.participants.find(p => p.meta.location === 'away') || { name: "TBD", image_path: "" };
                    
                    // Extracting scores (Default to 0 if not started)
                    const hScore = match.scores?.find(s => s.description === 'CURRENT' && s.score.participant === 'home')?.score.goals || 0;
                    const aScore = match.scores?.find(s => s.description === 'CURRENT' && s.score.participant === 'away')?.score.goals || 0;
                    
                    const isLive = match.state?.state === 'INPLAY';
                    const time = match.starting_at.split(' ')[1].substring(0, 5);

                    display.innerHTML += `
                        <div class="match-card">
                            <div class="team">
                                <img src="${home.image_path}" onerror="this.src='https://cdn.sportmonks.com/images/soccer/leagues/8.png'">
                                <div class="team-name">${home.name}</div>
                            </div>

                            <div class="score-center">
                                <div class="status-badge ${isLive ? 'status-live' : ''}">
                                    ${isLive ? '● LIVE' : time + ' UTC'}
                                </div>
                                <div class="score">${hScore} - ${aScore}</div>
                                <div style="font-size: 0.7rem; color: #8b949e;">${match.name}</div>
                            </div>

                            <div class="team">
                                <img src="${away.image_path}" onerror="this.src='https://cdn.sportmonks.com/images/soccer/leagues/8.png'">
                                <div class="team-name">${away.name}</div>
                            </div>
                        </div>
                    `;
                });

            } catch (err) {
                console.error(err);
                display.innerHTML = '<div class="match-card" style="color:red">ERROR: Connection Failed.</div>';
            }
        }

        // Initial fetch
        updateScores();
        // Refresh every 2 minutes (Sportmonks rate limits vary)
        setInterval(updateScores, 120000);
    </script>
</body>
</html>
