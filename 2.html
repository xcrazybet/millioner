<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProBet - Fixed API Integration | Sportmonks</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0c15;
            color: #ffffff;
        }

        .header {
            background: linear-gradient(135deg, #0f1322 0%, #0a0c15 100%);
            padding: 1rem 2rem;
            border-bottom: 1px solid #2a2f4a;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1600px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo h1 {
            font-size: 1.5rem;
            background: linear-gradient(135deg, #00d4ff, #7c3aed);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .debug-toggle {
            background: #2a2f4a;
            border: none;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .wallet-balance {
            font-size: 1.5rem;
            font-weight: bold;
            color: #10b981;
        }

        .nav-tabs {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            background: #0f1322;
            padding: 0.5rem;
            border-radius: 12px;
            margin-bottom: 1rem;
        }

        .nav-tab {
            padding: 0.5rem 1rem;
            background: transparent;
            border: none;
            color: #9ca3af;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
            font-size: 0.85rem;
        }

        .nav-tab.active {
            background: #7c3aed;
            color: white;
        }

        .main-container {
            max-width: 1600px;
            margin: 0 auto;
            display: flex;
            gap: 1.5rem;
            padding: 1.5rem;
        }

        .events-panel {
            flex: 3;
            background: #0f1322;
            border-radius: 20px;
            border: 1px solid #2a2f4a;
            overflow: hidden;
        }

        .panel-header {
            padding: 1rem 1.5rem;
            background: #1a1f3a;
            border-bottom: 1px solid #2a2f4a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .events-list {
            padding: 1.5rem;
            max-height: 70vh;
            overflow-y: auto;
        }

        .match-card {
            background: #1a1f3a;
            border-radius: 16px;
            padding: 1.25rem;
            margin-bottom: 1rem;
            border: 1px solid #2a2f4a;
            transition: all 0.2s;
        }

        .match-card:hover {
            border-color: #7c3aed;
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .league-name {
            font-size: 0.7rem;
            color: #7c3aed;
            font-weight: 600;
        }

        .match-datetime {
            font-size: 0.7rem;
            color: #9ca3af;
        }

        .match-status {
            font-size: 0.7rem;
            padding: 0.2rem 0.5rem;
            border-radius: 20px;
            background: #10b98120;
            color: #10b981;
        }

        .match-status.live {
            background: #ef444420;
            color: #ef4444;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .teams {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 1rem 0;
        }

        .team {
            flex: 1;
            text-align: center;
        }

        .team-name {
            font-weight: 700;
            font-size: 1.1rem;
        }

        .team-score {
            font-size: 1.5rem;
            font-weight: 800;
            color: #00d4ff;
            margin-top: 0.25rem;
        }

        .bet-options {
            display: flex;
            gap: 0.75rem;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid #2a2f4a;
        }

        .bet-option {
            flex: 1;
            background: #0f1322;
            border: 1px solid #374151;
            border-radius: 12px;
            padding: 0.75rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .bet-option:hover {
            background: #7c3aed20;
            border-color: #7c3aed;
        }

        .bet-option-odds {
            font-size: 1rem;
            font-weight: 700;
            color: #10b981;
        }

        .slip-panel {
            width: 380px;
            background: #0f1322;
            border-radius: 20px;
            border: 1px solid #2a2f4a;
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 100px;
            height: fit-content;
        }

        .slip-header {
            padding: 1.25rem;
            border-bottom: 1px solid #2a2f4a;
        }

        .slip-items {
            padding: 1rem;
            max-height: 300px;
            overflow-y: auto;
        }

        .slip-item {
            background: #1a1f3a;
            border-radius: 12px;
            padding: 0.75rem;
            margin-bottom: 0.75rem;
            border-left: 3px solid #7c3aed;
            position: relative;
        }

        .remove-btn {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
        }

        .slip-footer {
            padding: 1.25rem;
            border-top: 1px solid #2a2f4a;
        }

        .stake-input input {
            width: 100%;
            padding: 0.75rem;
            background: #1a1f3a;
            border: 1px solid #374151;
            border-radius: 12px;
            color: white;
            margin: 0.5rem 0;
        }

        .place-bet-btn {
            width: 100%;
            background: linear-gradient(135deg, #10b981, #059669);
            border: none;
            color: white;
            padding: 0.875rem;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .debug-panel {
            background: #0f1322;
            border: 1px solid #2a2f4a;
            border-radius: 12px;
            margin-top: 1rem;
            padding: 1rem;
            display: none;
        }

        .debug-panel.show {
            display: block;
        }

        .debug-log {
            font-family: monospace;
            font-size: 0.7rem;
            color: #10b981;
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: #6b7280;
        }

        .error {
            color: #ef4444;
            text-align: center;
            padding: 2rem;
        }

        @media (max-width: 1024px) {
            .main-container {
                flex-direction: column;
            }
            .slip-panel {
                width: 100%;
                position: static;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <div class="logo">
                <h1>⚡ PROBET FIXED</h1>
                <p>Full API Integration - Team Names & Dates Working</p>
            </div>
            <button class="debug-toggle" onclick="toggleDebug()">🐛 Debug Console</button>
            <div class="wallet-card">
                <div>DEMO BALANCE</div>
                <div class="wallet-balance" id="balance">$1,000.00</div>
            </div>
        </div>
    </div>

    <div class="main-container">
        <div class="events-panel">
            <div class="panel-header">
                <div class="nav-tabs" style="background: transparent; padding: 0; margin: 0;">
                    <button class="nav-tab active" data-tab="live">🔴 LIVE</button>
                    <button class="nav-tab" data-tab="fixtures">📅 FIXTURES</button>
                    <button class="nav-tab" data-tab="leagues">🏆 LEAGUES</button>
                    <button class="nav-tab" data-tab="teams">👥 TEAMS</button>
                </div>
                <span id="matchCount" style="color: #7c3aed;">0 events</span>
            </div>
            <div class="events-list" id="eventsList">
                <div class="loading">🔄 Loading data from Sportmonks API...</div>
            </div>
        </div>

        <div class="slip-panel">
            <div class="slip-header">
                <h3>📋 BETTING SLIP</h3>
                <small>Click odds to add selections</small>
            </div>
            <div class="slip-items" id="slipItems">
                <div style="text-align: center; color: #6b7280;">No selections</div>
            </div>
            <div class="slip-footer">
                <div class="stake-input">
                    <label>STAKE ($)</label>
                    <input type="number" id="stakeAmount" value="10" step="5">
                </div>
                <div style="display: flex; justify-content: space-between; margin: 0.5rem 0;">
                    <span>Total Odds:</span>
                    <strong id="totalOdds">0.00</strong>
                </div>
                <div style="display: flex; justify-content: space-between; margin: 0.5rem 0;">
                    <span>Potential Win:</span>
                    <strong id="potentialWinnings" style="color: #10b981;">$0.00</strong>
                </div>
                <button class="place-bet-btn" id="placeBetBtn">🎲 PLACE DEMO BET</button>
                <button id="clearSlipBtn" style="width: 100%; margin-top: 0.5rem; padding: 0.5rem; background: #2a2f4a; border: none; color: white; border-radius: 8px; cursor: pointer;">Clear</button>
            </div>
        </div>
    </div>

    <div class="main-container" style="padding-top: 0;">
        <div class="debug-panel" id="debugPanel">
            <div style="font-weight: 600; margin-bottom: 0.5rem;">📡 API Debug Log</div>
            <div class="debug-log" id="debugLog"></div>
        </div>
    </div>

    <script>
        // ============================================
        // CONFIGURATION
        // ============================================
        const API_TOKEN = 'DkFdWG9jFZvH8XSEgLrRfGwczABWVg5rlV25GvIRyN06zdPsOI48Nsv9Wooy';
        
        // CORS Proxies
        const CORS_PROXIES = [
            'https://cors-anywhere.herokuapp.com/',
            'https://api.allorigins.win/raw?url=',
            'https://corsproxy.io/?'
        ];
        
        // All endpoints with proper includes
        const ENDPOINTS = {
            live: `/v3/football/livescores/inplay?api_token=${API_TOKEN}&include=participants;league;scores;state`,
            fixtures: `/v3/football/fixtures?api_token=${API_TOKEN}&include=participants;league;scores;state;venue&filter=upcoming&limit=50`,
            leagues: `/v3/football/leagues?api_token=${API_TOKEN}&include=season;country`,
            teams: `/v3/football/teams?api_token=${API_TOKEN}&include=country;venue&limit=50`,
            standings: `/v3/football/standings?api_token=${API_TOKEN}&include=league;season;team`,
            topscorers: `/v3/football/topscorers/seasons/2026?api_token=${API_TOKEN}&include=player;team`,
            seasons: `/v3/football/seasons?api_token=${API_TOKEN}&include=league`,
            odds: `/v3/football/odds/pre-match?api_token=${API_TOKEN}&include=bookmaker;market;fixture`
        };
        
        // App State
        let userBalance = 1000.00;
        let betSlip = [];
        let activeTab = 'live';
        let debugLogs = [];
        
        // DOM Elements
        const balanceEl = document.getElementById('balance');
        const eventsList = document.getElementById('eventsList');
        const slipItemsEl = document.getElementById('slipItems');
        const stakeInput = document.getElementById('stakeAmount');
        const totalOddsEl = document.getElementById('totalOdds');
        const potentialWinningsEl = document.getElementById('potentialWinnings');
        const matchCount = document.getElementById('matchCount');
        
        // Debug function
        function addDebugLog(message, data = null) {
            const timestamp = new Date().toLocaleTimeString();
            debugLogs.unshift(`[${timestamp}] ${message}`);
            if (data) {
                debugLogs.unshift(`[${timestamp}] DATA: ${JSON.stringify(data).substring(0, 500)}`);
            }
            if (debugLogs.length > 50) debugLogs.pop();
            
            const debugLogEl = document.getElementById('debugLog');
            if (debugLogEl) {
                debugLogEl.innerHTML = debugLogs.map(log => `<div>${log}</div>`).join('');
            }
            console.log(message, data);
        }
        
        function toggleDebug() {
            const panel = document.getElementById('debugPanel');
            panel.classList.toggle('show');
        }
        
        // Helper Functions
        function formatMoney(amount) {
            return `$${amount.toFixed(2)}`;
        }
        
        function updateBalanceDisplay() {
            balanceEl.textContent = formatMoney(userBalance);
        }
        
        function calculateTotalOdds() {
            if (betSlip.length === 0) return 0;
            return betSlip.reduce((total, bet) => total * bet.odds, 1);
        }
        
        function updateSlipCalculations() {
            totalOddsEl.textContent = calculateTotalOdds().toFixed(2);
            const stake = parseFloat(stakeInput.value) || 0;
            potentialWinningsEl.textContent = formatMoney(stake * calculateTotalOdds());
        }
        
        function renderBetSlip() {
            if (betSlip.length === 0) {
                slipItemsEl.innerHTML = '<div style="text-align: center; color: #6b7280;">No selections</div>';
                updateSlipCalculations();
                return;
            }
            
            slipItemsEl.innerHTML = betSlip.map((bet, idx) => `
                <div class="slip-item">
                    <button class="remove-btn" data-index="${idx}">✖</button>
                    <div style="font-size: 0.7rem; color: #9ca3af;">${bet.matchName}</div>
                    <div style="font-weight: 600;">${bet.selection}</div>
                    <div style="font-size: 0.75rem; color: #10b981;">Odds: ${bet.odds.toFixed(2)}</div>
                </div>
            `).join('');
            
            document.querySelectorAll('.remove-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const idx = parseInt(btn.dataset.index);
                    betSlip.splice(idx, 1);
                    renderBetSlip();
                });
            });
            
            updateSlipCalculations();
        }
        
        function addToBetSlip(matchId, matchName, selection, odds) {
            if (betSlip.some(b => b.matchId === matchId && b.selection === selection)) {
                alert('Already in slip!');
                return;
            }
            
            betSlip.push({ matchId, matchName, selection, odds });
            renderBetSlip();
            addDebugLog(`Added to slip: ${selection} @ ${odds}`);
        }
        
        function placeDemoBet() {
            if (betSlip.length === 0) {
                alert('Add selections first!');
                return;
            }
            
            const stake = parseFloat(stakeInput.value);
            if (isNaN(stake) || stake <= 0) {
                alert('Enter valid stake');
                return;
            }
            
            if (stake > userBalance) {
                alert('Insufficient balance!');
                return;
            }
            
            const winnings = stake * calculateTotalOdds();
            userBalance = userBalance - stake + winnings;
            updateBalanceDisplay();
            
            addDebugLog(`Bet placed: $${stake} stake, $${winnings} winnings`);
            
            betSlip = [];
            renderBetSlip();
            stakeInput.value = '10';
            
            alert(`✅ Bet placed!\nStake: ${formatMoney(stake)}\nWinnings: ${formatMoney(winnings)}\nNew Balance: ${formatMoney(userBalance)}`);
        }
        
        // API Call with CORS proxy
        async function fetchFromAPI(endpoint, retryCount = 0) {
            if (retryCount >= CORS_PROXIES.length) {
                throw new Error('All CORS proxies failed');
            }
            
            const proxy = CORS_PROXIES[retryCount];
            const fullUrl = proxy + 'https://api.sportmonks.com' + endpoint;
            
            addDebugLog(`Attempting fetch (proxy ${retryCount + 1}): ${endpoint.substring(0, 100)}...`);
            
            try {
                const response = await fetch(fullUrl, {
                    headers: { 
                        'Origin': window.location.origin,
                        'Accept': 'application/json'
                    }
                });
                
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                addDebugLog(`✅ Success! Received ${data.data?.length || 0} items`, data);
                return data;
            } catch (error) {
                addDebugLog(`❌ Proxy ${retryCount + 1} failed: ${error.message}`);
                return fetchFromAPI(endpoint, retryCount + 1);
            }
        }
        
        // Format date nicely
        function formatMatchDate(dateString) {
            if (!dateString) return 'Date TBD';
            const date = new Date(dateString);
            return date.toLocaleString('en-US', {
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }
        
        // Extract team names correctly from participants array
        function extractTeamNames(participants) {
            let homeTeam = 'Home Team';
            let awayTeam = 'Away Team';
            
            if (participants && Array.isArray(participants)) {
                // Try to find by meta.location
                const home = participants.find(p => p.meta?.location === 'home');
                const away = participants.find(p => p.meta?.location === 'away');
                
                if (home && home.name) homeTeam = home.name;
                if (away && away.name) awayTeam = away.name;
                
                // Fallback: first participant is home, second is away
                if (!home && participants[0] && participants[0].name) {
                    homeTeam = participants[0].name;
                    if (participants[1] && participants[1].name) awayTeam = participants[1].name;
                }
            }
            
            return { homeTeam, awayTeam };
        }
        
        // Render matches with full details
        function renderMatches(data, type) {
            if (!data || data.length === 0) {
                eventsList.innerHTML = '<div class="loading">No matches found. Try another tab.</div>';
                matchCount.textContent = '0 events';
                addDebugLog(`No data for ${type}`);
                return;
            }
            
            addDebugLog(`Rendering ${data.length} matches for ${type}`);
            matchCount.textContent = `${data.length} events`;
            
            eventsList.innerHTML = data.map((item, idx) => {
                // For leagues tab
                if (type === 'leagues') {
                    return `
                        <div class="match-card">
                            <div class="match-header">
                                <span class="league-name">🏆 ${item.name || 'Unknown League'}</span>
                                <span class="match-datetime">${item.country?.name || 'International'}</span>
                            </div>
                            <div style="margin-top: 0.5rem; color: #9ca3af; font-size: 0.8rem;">
                                Season: ${item.season?.name || 'Current'}
                            </div>
                        </div>
                    `;
                }
                
                // For teams tab
                if (type === 'teams') {
                    return `
                        <div class="match-card">
                            <div class="match-header">
                                <span class="league-name">👥 ${item.name || 'Unknown Team'}</span>
                                <span class="match-datetime">${item.country?.name || 'International'}</span>
                            </div>
                            <div style="margin-top: 0.5rem; color: #9ca3af; font-size: 0.8rem;">
                                Venue: ${item.venue?.name || 'TBD'}
                            </div>
                        </div>
                    `;
                }
                
                // For fixtures and live matches
                const { homeTeam, awayTeam } = extractTeamNames(item.participants);
                const leagueName = item.league?.name || item.league_name || 'Unknown League';
                const matchDate = formatMatchDate(item.starting_at);
                
                // Get scores
                let homeScore = '-', awayScore = '-';
                if (item.scores) {
                    homeScore = item.scores.home ?? item.scores.score?.home ?? '-';
                    awayScore = item.scores.away ?? item.scores.score?.away ?? '-';
                }
                
                const isLive = type === 'live' || item.state === 'live';
                const statusText = isLive ? 'LIVE' : (type === 'fixtures' ? 'UPCOMING' : 'FT');
                
                // Generate demo odds (real odds would come from /odds endpoint)
                const homeOdds = (Math.random() * 2 + 1.2).toFixed(2);
                const drawOdds = (Math.random() * 1.5 + 2.5).toFixed(2);
                const awayOdds = (Math.random() * 2 + 1.2).toFixed(2);
                const matchName = `${homeTeam} vs ${awayTeam}`;
                const matchId = item.id || idx;
                
                return `
                    <div class="match-card">
                        <div class="match-header">
                            <span class="league-name">⚽ ${leagueName}</span>
                            <span class="match-datetime">📅 ${matchDate}</span>
                            <span class="match-status ${isLive ? 'live' : ''}">${statusText}</span>
                        </div>
                        <div class="teams">
                            <div class="team">
                                <div class="team-name">${homeTeam}</div>
                                <div class="team-score">${homeScore}</div>
                            </div>
                            <div style="padding: 0 1rem; color: #6b7280;">VS</div>
                            <div class="team">
                                <div class="team-name">${awayTeam}</div>
                                <div class="team-score">${awayScore}</div>
                            </div>
                        </div>
                        <div class="bet-options">
                            <div class="bet-option" onclick="window.addToBetSlip('${matchId}', '${matchName.replace(/'/g, "\\'")}', '${homeTeam.replace(/'/g, "\\'")}', ${homeOdds})">
                                <div>${homeTeam.substring(0, 15)}</div>
                                <div class="bet-option-odds">${homeOdds}</div>
                            </div>
                            <div class="bet-option" onclick="window.addToBetSlip('${matchId}', '${matchName.replace(/'/g, "\\'")}', 'Draw', ${drawOdds})">
                                <div>Draw</div>
                                <div class="bet-option-odds">${drawOdds}</div>
                            </div>
                            <div class="bet-option" onclick="window.addToBetSlip('${matchId}', '${matchName.replace(/'/g, "\\'")}', '${awayTeam.substring(0, 15)}', ${awayOdds})">
                                <div>${awayTeam.substring(0, 15)}</div>
                                <div class="bet-option-odds">${awayOdds}</div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        // Load data based on tab
        async function loadTab(tab) {
            activeTab = tab;
            eventsList.innerHTML = '<div class="loading">🔄 Loading data from Sportmonks API...</div>';
            
            try {
                let data = null;
                
                switch(tab) {
                    case 'live':
                        addDebugLog('Fetching LIVE matches...');
                        data = await fetchFromAPI(ENDPOINTS.live);
                        renderMatches(data.data || [], 'live');
                        break;
                        
                    case 'fixtures':
                        addDebugLog('Fetching FIXTURES...');
                        data = await fetchFromAPI(ENDPOINTS.fixtures);
                        renderMatches(data.data || [], 'fixtures');
                        break;
                        
                    case 'leagues':
                        addDebugLog('Fetching LEAGUES...');
                        data = await fetchFromAPI(ENDPOINTS.leagues);
                        renderMatches(data.data || [], 'leagues');
                        break;
                        
                    case 'teams':
                        addDebugLog('Fetching TEAMS...');
                        data = await fetchFromAPI(ENDPOINTS.teams);
                        renderMatches(data.data || [], 'teams');
                        break;
                }
                
                if ((!data || !data.data || data.data.length === 0) && tab === 'live') {
                    // Fallback to fixtures if no live matches
                    addDebugLog('No live matches, trying fixtures as fallback');
                    data = await fetchFromAPI(ENDPOINTS.fixtures);
                    renderMatches(data.data || [], 'fixtures');
                }
                
            } catch (error) {
                addDebugLog(`Fatal error: ${error.message}`);
                eventsList.innerHTML = `
                    <div class="error">
                        ❌ Failed to load data: ${error.message}<br><br>
                        <button onclick="location.reload()" style="background: #7c3aed; border: none; padding: 0.5rem 1rem; border-radius: 8px; color: white; cursor: pointer;">Retry</button>
                    </div>
                `;
            }
        }
        
        // Event Listeners
        document.getElementById('placeBetBtn').addEventListener('click', placeDemoBet);
        document.getElementById('clearSlipBtn').addEventListener('click', () => {
            betSlip = [];
            renderBetSlip();
        });
        stakeInput.addEventListener('input', updateSlipCalculations);
        
        document.querySelectorAll('.nav-tab').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                loadTab(btn.dataset.tab);
            });
        });
        
        // Make addToBetSlip global
        window.addToBetSlip = addToBetSlip;
        
        // Initialize
        updateBalanceDisplay();
        loadTab('live');
        
        // Auto-refresh live matches every 10 seconds
        setInterval(() => {
            if (activeTab === 'live') {
                loadTab('live');
            }
        }, 10000);
    </script>
</body>
</html>
