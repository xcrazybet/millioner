<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>📋 My Bets - XCrazyBet</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        :root {
            --primary: #00ff9d;
            --primary-dark: #00cc7a;
            --secondary: #ff9800;
            --danger: #ff4757;
            --success: #4caf50;
            --warning: #ffc107;
            --bg: #0a0f1a;
            --surface: #111827;
            --surface-light: #1a2332;
            --text: #ffffff;
            --text-dim: #a0a8c9;
            --border: #333;
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 70px;
        }

        /* Header */
        .header {
            background: var(--surface);
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 16px;
            font-weight: 700;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .back-btn {
            background: var(--surface-light);
            border: none;
            color: var(--text);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 16px;
        }

        .balance-badge {
            background: var(--surface-light);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid var(--primary);
            color: var(--primary);
            font-weight: 600;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            padding: 16px;
            background: var(--surface);
            margin: 12px;
            border-radius: 12px;
        }

        .stat-card {
            background: var(--surface-light);
            border-radius: 10px;
            padding: 10px 5px;
            text-align: center;
        }

        .stat-value {
            font-size: 16px;
            font-weight: 700;
            color: var(--primary);
        }

        .stat-label {
            font-size: 9px;
            color: var(--text-dim);
            margin-top: 3px;
        }

        /* Calendar Section */
        .calendar-section {
            background: var(--surface);
            border-radius: 12px;
            padding: 16px;
            margin: 12px;
            border: 1px solid var(--secondary);
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .calendar-title {
            color: var(--primary);
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .calendar-nav {
            display: flex;
            gap: 12px;
        }

        .calendar-nav-btn {
            background: var(--surface-light);
            border: 1px solid var(--border);
            color: var(--text);
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .calendar-nav-btn:active {
            background: var(--primary);
            color: #000;
        }

        .month-year {
            font-size: 16px;
            font-weight: 600;
            color: var(--primary);
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            margin-bottom: 8px;
            text-align: center;
        }

        .weekday {
            font-size: 11px;
            color: var(--text-dim);
            font-weight: 600;
            padding: 4px;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }

        .calendar-day {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--surface-light);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            position: relative;
        }

        .calendar-day.has-matches {
            border-color: var(--primary);
            background: rgba(0,255,157,0.1);
        }

        .calendar-day.has-bets {
            border-color: var(--secondary);
        }

        .calendar-day.today {
            background: var(--primary);
            color: #000;
        }

        .calendar-day.today .match-count {
            background: #000;
            color: var(--primary);
        }

        .match-count {
            font-size: 8px;
            background: var(--primary);
            color: #000;
            border-radius: 10px;
            padding: 2px 4px;
            margin-top: 2px;
        }

        .day-number {
            font-size: 14px;
            font-weight: 700;
        }

        /* Filter Tabs */
        .filter-tabs {
            display: flex;
            gap: 8px;
            padding: 0 12px 12px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .filter-tabs::-webkit-scrollbar {
            display: none;
        }

        .filter-btn {
            padding: 8px 16px;
            background: var(--surface-light);
            border: 1px solid var(--border);
            border-radius: 25px;
            color: var(--text);
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
        }

        .filter-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: #000;
        }

        /* Bets List */
        .bets-list {
            padding: 0 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .bet-card {
            background: var(--surface);
            border-radius: 12px;
            padding: 14px;
            border-left: 4px solid;
        }

        .bet-card.pending { border-left-color: var(--secondary); }
        .bet-card.won { border-left-color: var(--success); }
        .bet-card.lost { border-left-color: var(--danger); }

        .bet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .ticket-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ticket-number {
            font-size: 11px;
            color: var(--text-dim);
            background: var(--surface-light);
            padding: 4px 8px;
            border-radius: 4px;
        }

        .bet-status {
            font-size: 10px;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 4px;
        }

        .bet-status.pending { background: var(--secondary); color: #000; }
        .bet-status.won { background: var(--success); color: #000; }
        .bet-status.lost { background: var(--danger); color: #fff; }

        .bet-date {
            font-size: 10px;
            color: var(--text-dim);
        }

        .selections {
            margin: 12px 0;
        }

        .selection-item {
            background: var(--surface-light);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 8px;
        }

        .selection-match {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .selection-details {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
        }

        .selection-market {
            color: var(--text-dim);
        }

        .selection-odds {
            color: var(--primary);
            font-weight: 600;
        }

        .bet-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }

        .bet-stats {
            display: flex;
            gap: 16px;
        }

        .stat small {
            font-size: 9px;
            color: var(--text-dim);
        }

        .stat strong {
            font-size: 13px;
        }

        .bet-return {
            font-weight: 700;
            font-size: 15px;
        }

        .bet-return.won { color: var(--success); }
        .bet-return.lost { color: var(--danger); }
        .bet-return.pending { color: var(--secondary); }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-dim);
        }

        .empty-state i {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 40px;
        }

        .loading-spinner {
            border: 3px solid var(--surface-light);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 10px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--surface);
            display: flex;
            justify-content: space-around;
            padding: 8px 12px;
            border-top: 2px solid var(--primary);
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--text-dim);
            font-size: 10px;
            gap: 4px;
            padding: 6px 12px;
            border-radius: 8px;
        }

        .nav-item i { 
            font-size: 18px; 
        }

        .nav-item.active { 
            color: var(--primary);
            background: var(--surface-light);
        }

        /* Toast */
        .toast-container {
            position: fixed;
            bottom: 80px;
            left: 12px;
            right: 12px;
            z-index: 1000;
        }

        .toast {
            padding: 12px 16px;
            background: var(--surface);
            border-radius: 8px;
            border-left: 4px solid var(--primary);
            color: white;
            margin-top: 8px;
            font-size: 12px;
            animation: slideUp 0.3s ease;
        }

        .toast.success { border-left-color: var(--success); }
        .toast.error { border-left-color: var(--danger); }
    </style>
</head>
<body>
    <header class="header">
        <button class="back-btn" onclick="goBack()">
            <i class="fas fa-arrow-left"></i>
        </button>
        <div class="logo">
            <i class="fas fa-ticket-alt"></i>
            My Bets
        </div>
        <div class="balance-badge" id="balance-display">
            <i class="fas fa-wallet"></i>
            $<span id="balance-val">0.00</span>
        </div>
    </header>

    <!-- Stats Cards -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-value" id="total-bets">0</div>
            <div class="stat-label">Total</div>
        </div>
        <div class="stat-card">

        </div>
        <div class="stat-card">
            <div class="stat-value" id="lost-bets">0</div>

    <!-- Calendar Section (2 Years) -->
    <div class="calendar-section">
        <div class="calendar-header">

            </div>
            <div class="calendar-nav">
                <button class="calendar-nav-btn" id="prev-month"><i class="fas fa-chevron-left"></i></button>
                <span class="month-year" id="current-month-year">March 2026</span>
                <button class="calendar-nav-btn" id="next-month"><i class="fas fa-chevron-right"></i></button>

        </div>
        
        <div class="weekdays">
            <div class="weekday">SUN</div>

            <div class="weekday">TUE</div>
            <div class="weekday">WED</div>
            <div class="weekday">THU</div>
            <div class="weekday">FRI</div>
            <div class="weekday">SAT</div>
        </div>
        
        <div class="calendar-grid" id="calendar-grid">
            <!-- Calendar days loaded here -->
        </div>
    </div>

    <!-- Filter Tabs -->
    <div class="filter-tabs">
        <button class="filter-btn active" data-filter="all">ALL</button>
        <button class="filter-btn" data-filter="pending">PENDING</button>
        <button class="filter-btn" data-filter="won">WON</button>
        <button class="filter-btn" data-filter="lost">LOST</button>
    </div>

    <!-- Bets List -->
    <div class="bets-list" id="bets-list">
        <div class="loading">
            <div class="loading-spinner"></div>
            <p>Loading your bets...</p>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="football.html" class="nav-item">

            Football
        </a>
        <a href="#" class="nav-item active">

            My Bets
        </a>
        <a href="#" class="nav-item">
            <i class="fas fa-chart-line"></i>
            Stats
        </a>
        <a href="#" class="nav-item">
            <i class="fas fa-wallet"></i>
            Wallet
        </a>
    </nav>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962",
            measurementId: "G-PTV4XMYQ6P"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // API Config
        const API_KEY = '2396236d9d5cd07468ce280da8390ad5';
        const BASE_URL = 'https://v3.football.api-sports.io';

        // State
        let currentUser = null;
        let allBets = [];
        let balance = 0;
        let currentDate = new Date();
        let matchCache = new Map(); // Cache matches by date

        // Check Auth
        auth.onAuthStateChanged((user) => {
            if (user) {
                currentUser = user;
                loadBalance();
                loadBets();
                setupRealtimeListener();
                loadUpcomingMatches();
                setupBetSettlement(); // Auto-settle bets
            } else {
                window.location.href = 'login.html';
            }
        });

        // Load Balance
        async function loadBalance() {
            try {
                const doc = await db.collection("wallets").doc(auth.currentUser.uid).get();
                if (doc.exists) {
                    balance = doc.data().balance || 0;
                    document.getElementById('balance-val').textContent = balance.toFixed(2);
                } else {
                    // Create wallet if not exists
                    await db.collection("wallets").doc(auth.currentUser.uid).set({
                        balance: 100,
                        createdAt: new Date()
                    });
                    balance = 100;
                    document.getElementById('balance-val').textContent = '100.00';
                }
            } catch (error) {
                console.error('Error loading balance:', error);
            }
        }

        // Real-time Balance Listener
        function setupRealtimeListener() {
            db.collection("wallets").doc(auth.currentUser.uid).onSnapshot((doc) => {
                if (doc.exists) {
                    balance = doc.data().balance || 0;
                    document.getElementById('balance-val').textContent = balance.toFixed(2);
                }
            });
        }

        // Load All Bets (PERSISTENT STORAGE)
        async function loadBets() {
            try {
                const snapshot = await db.collection("football_bets")
                    .where("userId", "==", auth.currentUser.uid)
                    .orderBy("createdAt", "desc")
                    .get();

                allBets = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    allBets.push({
                        ...data,
                        id: doc.id,
                        createdAt: data.createdAt?.toDate() || new Date(),
                        // Ensure all fields are preserved
                        ticketNumber: data.ticketNumber,
                        stake: data.stake,
                        totalOdds: data.totalOdds,
                        status: data.status,
                        selections: data.selections || [],
                        return: data.return || 0
                    });
                });

                updateStats();
                displayBets('all');
                
                // Check for pending bets to settle
                checkPendingBets();
            } catch (error) {
                console.error('Error loading bets:', error);
                showToast('Error loading bets', 'error');
            }
        }

        // Update Statistics
        function updateStats() {
            const total = allBets.length;
            const won = allBets.filter(b => b.status === 'won').length;
            const lost = allBets.filter(b => b.status === 'lost').length;
            const winRate = total > 0 ? ((won / total) * 100).toFixed(1) : 0;

            document.getElementById('total-bets').textContent = total;
            document.getElementById('won-bets').textContent = won;
            document.getElementById('lost-bets').textContent = lost;
            document.getElementById('win-rate').textContent = winRate + '%';
        }

        // Display Bets
        function displayBets(filter = 'all') {
            const container = document.getElementById('bets-list');
            
            let filtered = allBets;
            if (filter !== 'all') {
                filtered = allBets.filter(b => b.status === filter);
            }

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-ticket-alt"></i>
                        <h3>No bets found</h3>
                        <p style="color: var(--text-dim); margin-top: 8px;">Go to Football page to place your first bet!</p>
                    </div>
                `;
                return;
            }

            let html = '';
            filtered.forEach(bet => {
                const date = bet.createdAt.toLocaleDateString();
                const time = bet.createdAt.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                
                const returnAmount = bet.return || (bet.status === 'won' ? bet.stake * bet.totalOdds : 0);
                const returnClass = bet.status;

                let selectionsHTML = '';
                if (bet.selections && bet.selections.length > 0) {
                    bet.selections.forEach(sel => {
                        selectionsHTML += `
                            <div class="selection-item">
                                <div class="selection-match">${sel.matchName || 'Unknown Match'}</div>
                                <div class="selection-details">
                                    <span class="selection-market">${sel.market || 'Market'} - ${sel.display || sel.selection || 'Selection'}</span>
                                    <span class="selection-odds">${(sel.odds || 0).toFixed(2)}</span>
                                </div>
                            </div>
                        `;
                    });
                }

                html += `
                    <div class="bet-card ${bet.status}">
                        <div class="bet-header">
                            <div class="ticket-info">
                                <span class="ticket-number">#${bet.ticketNumber || 'N/A'}</span>
                                <span class="bet-status ${bet.status}">${(bet.status || 'PENDING').toUpperCase()}</span>
                            </div>
                            <div class="bet-date">${date} ${time}</div>
                        </div>

                        <div class="selections">
                            ${selectionsHTML}
                        </div>

                        <div class="bet-footer">
                            <div class="bet-stats">
                                <div class="stat">
                                    <small>Stake</small>
                                    <strong>$${(bet.stake || 0).toFixed(2)}</strong>
                                </div>
                                <div class="stat">
                                    <small>Odds</small>
                                    <strong>${(bet.totalOdds || 1).toFixed(2)}</strong>
                                </div>
                            </div>
                            <div class="bet-return ${returnClass}">
                                ${bet.status === 'pending' ? 'Pending' : (returnAmount > 0 ? '+' : '') + '$' + returnAmount.toFixed(2)}
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // Load Upcoming Matches for 2 Years
        async function loadUpcomingMatches() {
            try {
                const today = new Date();
                const twoYearsLater = new Date();
                twoYearsLater.setFullYear(today.getFullYear() + 2);
                
                const fromStr = today.toISOString().split('T')[0];
                const toStr = twoYearsLater.toISOString().split('T')[0];
                
                // Fetch fixtures for 2 years
                const response = await fetch(
                    `${BASE_URL}/fixtures?from=${fromStr}&to=${toStr}`,
                    {
                        headers: { 'x-apisports-key': API_KEY }
                    }
                );
                
                if (response.ok) {
                    const data = await response.json();
                    if (data.response) {
                        // Group matches by date
                        data.response.forEach(match => {
                            const dateStr = match.fixture.date.split('T')[0];
                            if (!matchCache.has(dateStr)) {
                                matchCache.set(dateStr, []);
                            }
                            matchCache.get(dateStr).push(match);
                        });
                    }
                }
            } catch (error) {
                console.error('Error loading upcoming matches:', error);
            }
            
            // Generate calendar with current month
            generateCalendar(currentDate);
        }

        // Generate Calendar
        function generateCalendar(date) {
            const year = date.getFullYear();
            const month = date.getMonth();
            
            document.getElementById('current-month-year').textContent = 
                date.toLocaleString('default', { month: 'long', year: 'numeric' });
            
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            
            const startingDay = firstDay.getDay(); // 0 = Sunday
            const totalDays = lastDay.getDate();
            
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';
            
            // Empty cells for days before month starts
            for (let i = 0; i < startingDay; i++) {
                const emptyDay = document.createElement('div');
                emptyDay.className = 'calendar-day';
                emptyDay.style.opacity = '0.3';
                grid.appendChild(emptyDay);
            }
            
            // Fill in the days
            const today = new Date().toDateString();
            
            for (let day = 1; day <= totalDays; day++) {
                const currentDateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const cellDate = new Date(year, month, day);
                const isToday = cellDate.toDateString() === today;
                
                // Check if there are matches on this day
                const hasMatches = matchCache.has(currentDateStr);
                
                // Check if user has bets on this day
                const hasBets = allBets.some(bet => {
                    if (bet.createdAt) {
                        const betDate = bet.createdAt.toISOString().split('T')[0];
                        return betDate === currentDateStr;
                    }
                    return false;
                });
                
                const dayDiv = document.createElement('div');
                dayDiv.className = `calendar-day ${isToday ? 'today' : ''} ${hasMatches ? 'has-matches' : ''} ${hasBets ? 'has-bets' : ''}`;
                dayDiv.dataset.date = currentDateStr;
                
                dayDiv.innerHTML = `
                    <span class="day-number">${day}</span>
                    ${hasMatches ? '<span class="match-count">⚽ ' + matchCache.get(currentDateStr).length + '</span>' : ''}
                `;
                
                dayDiv.addEventListener('click', () => {
                    showToast(`Matches on ${currentDateStr}: ${hasMatches ? matchCache.get(currentDateStr).length : 0} games`, 'info');
                });
                
                grid.appendChild(dayDiv);
            }
        }

        // Check and Settle Pending Bets
        async function checkPendingBets() {
            const pendingBets = allBets.filter(b => b.status === 'pending');
            
            for (const bet of pendingBets) {
                try {
                    // Check if all matches are finished
                    const allFinished = await checkMatchesFinished(bet.selections);
                    
                    if (allFinished) {
                        await settleBet(bet);
                    }
                } catch (error) {
                    console.error('Error checking bet:', error);
                }
            }
        }

        // Check if matches are finished
        async function checkMatchesFinished(selections) {
            if (!selections || selections.length === 0) return false;
            
            for (const selection of selections) {
                try {
                    const response = await fetch(
                        `${BASE_URL}/fixtures?id=${selection.matchId}`,
                        { headers: { 'x-apisports-key': API_KEY } }
                    );
                    
                    if (response.ok) {
                        const data = await response.json();
                        const match = data.response[0];
                        
                        if (!match || !['FT', 'AET', 'PEN'].includes(match.fixture.status.short)) {
                            return false;
                        }
                    } else {
                        return false;
                    }
                } catch (error) {
                    console.error('Error checking match:', error);
                    return false;
                }
            }
            return true;
        }

        // Settle Bet
        async function settleBet(bet) {
            try {
                const won = await checkBetWins(bet.selections);
                
                let winAmount = 0;
                let status = 'lost';
                
                if (won) {
                    winAmount = bet.stake * bet.totalOdds;
                    status = 'won';
                    
                    // Credit winnings to user
                    await creditWinnings(bet.userId, winAmount);
                }
                
                // Update bet status in Firebase
                await db.collection("football_bets").doc(bet.ticketNumber).update({
                    status: status,
                    return: won ? winAmount : 0,
                    settledAt: new Date()
                });
                
                // Update local state
                bet.status = status;
                bet.return = won ? winAmount : 0;
                
                // Show notification
                showToast(
                    won ? `🎉 Bet won! +$${winAmount.toFixed(2)}` : '😞 Bet lost',
                    won ? 'success' : 'error'
                );
                
                // Refresh display
                updateStats();
                displayBets(document.querySelector('.filter-btn.active').dataset.filter);
                
            } catch (error) {
                console.error('Error settling bet:', error);
            }
        }

        // Credit winnings to user
        async function creditWinnings(userId, amount) {
            try {
                const walletRef = db.collection("wallets").doc(userId);
                
                await db.runTransaction(async (transaction) => {
                    const walletDoc = await transaction.get(walletRef);
                    
                    if (!walletDoc.exists) {
                        throw new Error("Wallet not found");
                    }
                    
                    const currentBalance = walletDoc.data().balance || 0;
                    const newBalance = currentBalance + amount;
                    
                    transaction.update(walletRef, {
                        balance: newBalance,
                        updatedAt: new Date()
                    });
                    
                    // Record transaction
                    const transactionRef = walletRef.collection("transactions").doc();
                    transaction.set(transactionRef, {
                        type: 'football_win',
                        amount: amount,
                        description: `Bet winnings`,
                        createdAt: new Date(),
                        beforeBalance: currentBalance,
                        afterBalance: newBalance
                    });
                });
                
            } catch (error) {
                console.error('Error crediting winnings:', error);
            }
        }

        // Check if bet wins
        async function checkBetWins(selections) {
            for (const selection of selections) {
                try {
                    const response = await fetch(
                        `${BASE_URL}/fixtures?id=${selection.matchId}`,
                        { headers: { 'x-apisports-key': API_KEY } }
                    );
                    
                    if (!response.ok) return false;
                    
                    const data = await response.json();
                    const match = data.response[0];
                    
                    if (!match) return false;
                    
                    const homeGoals = match.goals.home;
                    const awayGoals = match.goals.away;
                    
                    let won = false;
                    
                    switch(selection.market) {
                        case 'Match Winner':
                            if (selection.selection === '1') won = homeGoals > awayGoals;
                            else if (selection.selection === 'X') won = homeGoals === awayGoals;
                            else if (selection.selection === '2') won = awayGoals > homeGoals;
                            break;
                            
                        case 'Total Goals':
                            const totalGoals = homeGoals + awayGoals;
                            if (selection.selection.includes('Over')) won = totalGoals > 2.5;
                            else won = totalGoals < 2.5;
                            break;
                            
                        case 'BTTS':
                            const bothScored = homeGoals > 0 && awayGoals > 0;
                            won = bothScored === (selection.selection === 'Yes');
                            break;
                    }
                    
                    if (!won) return false;
                    
                } catch (error) {
                    console.error('Error checking bet win:', error);
                    return false;
                }
            }
            
            return true;
        }

        // Auto-settle bets every 60 seconds
        function setupBetSettlement() {
            setInterval(() => {
                checkPendingBets();
            }, 60000); // Check every minute
        }

        // Filter Event Listeners
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                displayBets(btn.dataset.filter);
            });
        });

        // Calendar Navigation
        document.getElementById('prev-month').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() - 1);
            generateCalendar(currentDate);
        });

        document.getElementById('next-month').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() + 1);
            generateCalendar(currentDate);
        });

        // Go Back
        window.goBack = function() {
            window.location.href = 'football.html';
        };

        // Toast
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }
    </script>
</body>
