<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>⚽ XLODON BET 2026 | PRO-GRADE TERMINAL</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --primary: #00ff9d;
            --primary-glow: rgba(0, 255, 157, 0.4);
            --secondary: #00d2ff;
            --accent: #7000ff;
            --danger: #ff4757;
            --warning: #ffa502;
            --success: #2ed573;
            --bg: #05070a;
            --surface: #0f172a;
            --surface-light: #1e293b;
            --text: #f8fafc;
            --text-dim: #64748b;
            --border: #334155;
            --font-mono: 'JetBrains Mono', monospace;
            --font-sans: 'Inter', sans-serif;
            --shadow: 0 10px 40px rgba(0,0,0,0.6);
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* --- Global Reset & Core Styling --- */
        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: var(--font-sans);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary); }

        /* --- Typography & UI Components --- */
        h1, h2, h3, .logo-text { font-family: var(--font-sans); font-weight: 800; text-transform: uppercase; letter-spacing: -0.5px; }
        .mono { font-family: var(--font-mono); }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border: 1px solid var(--border); }

        /* --- Layout: Header --- */
        .header {
            height: 70px;
            padding: 0 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--border);
            background: rgba(5, 7, 10, 0.9);
        }
        .logo-box { display: flex; align-items: center; gap: 12px; }
        .logo-circle { width: 12px; height: 12px; border-radius: 50%; background: var(--primary); box-shadow: 0 0 15px var(--primary); }
        .logo-text { font-size: 1.4rem; color: var(--text); }
        .logo-text span { color: var(--primary); }

        .header-actions { display: flex; align-items: center; gap: 20px; }
        .balance-card {
            background: var(--surface-light);
            padding: 8px 16px;
            border-radius: 12px;
            border-left: 4px solid var(--primary);
            display: flex;
            flex-direction: column;
            min-width: 140px;
        }
        .bal-label { font-size: 10px; color: var(--text-dim); font-weight: 700; text-transform: uppercase; }
        .bal-value { font-family: var(--font-mono); font-weight: 700; color: var(--primary); font-size: 1.1rem; }

        /* --- Layout: Grid Container --- */
        .app-shell {
            display: grid;
            grid-template-columns: 260px 1fr 380px;
            gap: 24px;
            padding: 24px;
            max-width: 1800px;
            margin: 0 auto;
        }

        /* --- Sidebar Navigation --- */
        .nav-sidebar { display: flex; flex-direction: column; gap: 20px; }
        .menu-group { background: var(--surface); border-radius: 20px; padding: 12px; border: 1px solid var(--border); }
        .menu-title { font-size: 11px; font-weight: 800; color: var(--text-dim); padding: 10px 15px; text-transform: uppercase; letter-spacing: 1px; }
        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 15px;
            color: var(--text-dim);
            text-decoration: none;
            border-radius: 12px;
            transition: var(--transition);
            margin-bottom: 2px;
            font-size: 14px;
            font-weight: 600;
        }
        .menu-item i { width: 20px; font-size: 18px; text-align: center; }
        .menu-item:hover, .menu-item.active { background: var(--surface-light); color: var(--primary); }
        .menu-item.active { border-right: 3px solid var(--primary); }

        /* --- Main Feed --- */
        .feed-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            background: var(--surface);
            padding: 20px;
            border-radius: 20px;
            border: 1px solid var(--border);
        }
        .control-group { display: flex; align-items: center; gap: 15px; }
        .date-input {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 15px;
            border-radius: 10px;
            font-family: var(--font-mono);
            font-size: 14px;
        }

        .matches-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }

        /* --- Match Card Architecture --- */
        .m-card {
            background: var(--surface);
            border-radius: 24px;
            border: 1px solid var(--border);
            overflow: hidden;
            transition: var(--transition);
            position: relative;
        }
        .m-card:hover { transform: translateY(-4px); border-color: var(--primary); box-shadow: var(--shadow); }
        .m-status-bar {
            padding: 10px 20px;
            background: rgba(255,255,255,0.03);
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-dim);
            border-bottom: 1px solid var(--border);
        }
        .live-tag { color: var(--danger); display: flex; align-items: center; gap: 5px; }
        .live-tag::before { content: ''; width: 6px; height: 6px; background: var(--danger); border-radius: 50%; animation: pulse 1.5s infinite; }

        .m-main { padding: 30px 20px; display: grid; grid-template-columns: 1fr 120px 1fr; align-items: center; text-align: center; }
        .m-team { display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .m-logo { width: 64px; height: 64px; object-fit: contain; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.3)); transition: 0.3s; }
        .m-card:hover .m-logo { transform: scale(1.1); }
        .m-name { font-size: 18px; font-weight: 800; color: var(--text); }

        .m-score-box { display: flex; flex-direction: column; gap: 5px; }
        .m-score { font-size: 42px; font-weight: 900; font-family: var(--font-mono); color: var(--primary); letter-spacing: -2px; }
        .m-time { font-size: 12px; color: var(--text-dim); text-transform: uppercase; }

        /* --- Odds Engine --- */
        .m-odds {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            padding: 0 20px 25px 20px;
        }
        .odd-btn {
            background: var(--surface-light);
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 16px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .odd-btn:hover { border-color: var(--primary); background: rgba(0,255,157,0.05); }
        .odd-btn.active { background: var(--primary); border-color: var(--primary); }
        .odd-btn.active span { color: #000 !important; }
        .o-label { font-size: 10px; font-weight: 800; color: var(--text-dim); margin-bottom: 2px; }
        .o-val { font-size: 20px; font-weight: 900; font-family: var(--font-mono); color: var(--text); }

        .m-footer {
            padding: 15px 20px;
            background: rgba(0,0,0,0.2);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
        }
        .action-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-dim);
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }
        .action-btn:hover { color: var(--text); border-color: var(--primary); background: var(--surface-light); }

        /* --- Bet Slip (Right Rail) --- */
        .slip-rail { position: sticky; top: 94px; height: calc(100vh - 120px); }
        .slip-box {
            background: var(--surface);
            border-radius: 28px;
            border: 2px solid var(--border);
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
            box-shadow: var(--shadow);
        }
        .slip-box.has-items { border-color: var(--primary); }
        
        .slip-header {
            padding: 24px;
            background: var(--surface-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }
        .slip-badge { background: var(--primary); color: #000; font-weight: 900; padding: 2px 10px; border-radius: 6px; font-size: 12px; }

        .slip-list { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .sel-card {
            background: var(--surface-light);
            border-radius: 18px;
            padding: 16px;
            position: relative;
            border: 1px solid var(--border);
            animation: slideIn 0.3s ease;
        }
        .sel-remove { position: absolute; top: 12px; right: 12px; color: var(--text-dim); cursor: pointer; transition: 0.2s; }
        .sel-remove:hover { color: var(--danger); }
        .sel-match { font-size: 11px; color: var(--primary); font-weight: 800; margin-bottom: 4px; display: block; text-transform: uppercase; }
        .sel-pick { font-size: 15px; font-weight: 800; display: block; }
        .sel-odds { font-family: var(--font-mono); color: var(--primary); font-weight: 800; font-size: 16px; }

        .slip-footer { padding: 24px; background: var(--surface-light); border-top: 1px solid var(--border); }
        .slip-row { display: flex; justify-content: space-between; margin-bottom: 12px; }
        .slip-row label { color: var(--text-dim); font-size: 13px; font-weight: 600; }
        .slip-row span { font-weight: 800; font-family: var(--font-mono); }

        .stake-input-box {
            background: var(--bg);
            border: 2px solid var(--border);
            border-radius: 16px;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 15px 0;
            transition: 0.2s;
        }
        .stake-input-box:focus-within { border-color: var(--primary); }
        .stake-input-box input {
            background: transparent;
            border: none;
            color: var(--primary);
            font-family: var(--font-mono);
            font-size: 24px;
            font-weight: 800;
            width: 120px;
        }

        .place-bet-btn {
            width: 100%;
            padding: 20px;
            border-radius: 20px;
            border: none;
            background: var(--primary);
            color: #000;
            font-weight: 900;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 20px var(--primary-glow);
        }
        .place-bet-btn:hover:not(:disabled) { transform: scale(1.02); filter: brightness(1.1); }
        .place-bet-btn:disabled { opacity: 0.3; cursor: not-allowed; filter: grayscale(1); }

        /* --- Modals & Overlays --- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5,7,10,0.9);
            backdrop-filter: blur(8px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-content {
            background: var(--surface);
            width: 100%;
            max-width: 800px;
            border-radius: 32px;
            border: 1px solid var(--border);
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow);
            overflow: hidden;
        }
        .modal-head { padding: 25px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .modal-body { padding: 25px; overflow-y: auto; flex: 1; }

        /* --- Utility Classes --- */
        .pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .loader-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 300px; color: var(--text-dim); }
        .spinner { width: 40px; height: 40px; border: 4px solid var(--surface-light); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 15px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* --- Standings Styles --- */
        .std-table { width: 100%; border-collapse: collapse; }
        .std-table th { text-align: left; padding: 12px; color: var(--text-dim); font-size: 11px; text-transform: uppercase; border-bottom: 1px solid var(--border); }
        .std-table td { padding: 15px 12px; border-bottom: 1px solid var(--border); font-size: 14px; }
        .rank-circle { width: 24px; height: 24px; border-radius: 6px; background: var(--surface-light); display: flex; align-items: center; justify-content: center; font-weight: 800; color: var(--primary); }

        /* Mobile Optimization */
        @media (max-width: 1200px) {
            .app-shell { grid-template-columns: 1fr; }
            .nav-sidebar, .slip-rail { display: none; }
        }
    </style>
</head>

                        <input type="number" id="stakeInput" value="10" step="5" oninput="calculateReturns()">
                        <span style="font-weight: 900; color: var(--primary)">USD</span>

    <script>
        /**
         * XLODON BET 2026 - CORE ENGINE
         * Version: 4.2.0 (Production)
         */

        // --- CONFIGURATION ---
        const API_TOKEN = "DkFdWG9jFZvH8XSEgLrRfGwczABWVg5rlV25GvIRyN06zdPsOI48Nsv9Wooy";
        const CORS_PROXY = "https://corsproxy.io/?"; 
        
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };

        // --- STATE MANAGEMENT ---
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        let userSession = null;
        let vaultBalance = 0;
        let activeFixtures = [];
        let currentSlipSelections = [];

        // --- INITIALIZATION ---
        auth.onAuthStateChanged(user => {
            if (user) {
                userSession = user;
                initializeVault();
                refreshFixtures();
            } else {
                window.location.href = "https://xcrazybet.github.io/millioner/login.html";
            }
        });

        // --- VAULT ENGINE (FIXES NaN ISSUE) ---
        function initializeVault() {
            const vRef = db.collection("wallets").doc(userSession.uid);
            vRef.onSnapshot(doc => {
                if (doc.exists) {
                    const data = doc.data();
                    vaultBalance = parseFloat(data.balance) || 0.00; // Force numeric conversion
                    document.getElementById('displayBalance').innerText = vaultBalance.toFixed(2);
                } else {
                    vRef.set({ balance: 1000.00, currency: "USD", lastUpdated: Date.now() });
                }
            }, err => {
                console.error("Vault Access Denied:", err);
                document.getElementById('displayBalance').innerText = "0.00";
            });
        }

        // --- API DATA ENGINE (FIXES CORS ERROR) ---
        async function refreshFixtures() {
            const targetDate = document.getElementById('matchDate').value;
            const container = document.getElementById('mainFixtureContainer');
            
            container.innerHTML = `
                <div class="loader-wrap">
                    <div class="spinner"></div>
                    <p class="mono">SYNCING WITH FIFA GLOBAL API...</p>
                </div>
            `;

            try {
                const apiEndpoint = `https://api.sportmonks.com/v3/football/fixtures/date/${targetDate}?api_token=${API_TOKEN}&include=participants;scores;league;state`;
                const proxiedUrl = CORS_PROXY + encodeURIComponent(apiEndpoint);

                const response = await fetch(proxiedUrl);
                if (!response.ok) throw new Error("API_REJECTED");
                
                const json = await response.json();
                activeFixtures = json.data || [];
                
                renderFixtureUI();
            } catch (error) {
                console.error("Engine Failure:", error);
                container.innerHTML = `
                    <div class="loader-wrap">
                        <i class="fas fa-broadcast-tower fa-3x" style="color:var(--danger); margin-bottom:20px;"></i>
                        <p style="color:var(--danger); font-weight:800;">ENCRYPTION LINK FAILED</p>
                        <button class="action-btn" style="margin-top:20px;" onclick="refreshFixtures()">RE-ESTABLISH CONNECTION</button>
                    </div>
                `;
            }
        }

        function renderFixtureUI() {
            const container = document.getElementById('mainFixtureContainer');
            if (activeFixtures.length === 0) {
                container.innerHTML = `<div class="loader-wrap"><p>No matches scheduled for this interval.</p></div>`;
                return;
            }

            container.innerHTML = activeFixtures.map(m => {
                const homeTeam = m.participants.find(p => p.meta.location === 'home') || { name: 'TBD' };
                const awayTeam = m.participants.find(p => p.meta.location === 'away') || { name: 'TBD' };
                const scores = m.scores || [];
                const hGoal = scores.find(s => s.description === 'CURRENT' && s.score.participant === 'home')?.score.goals ?? 0;
                const aGoal = scores.find(s => s.description === 'CURRENT' && s.score.participant === 'away')?.score.goals ?? 0;

                // Simulate Realistic Odds for 2026 World Cup
                const oH = (1.4 + Math.random() * 2).toFixed(2);
                const oD = (3.1 + Math.random() * 1.2).toFixed(2);
                const oA = (2.1 + Math.random() * 3).toFixed(2);

                return `
                    <div class="m-card">
                        <div class="m-status-bar">
                            <span><i class="fas fa-trophy"></i> ${m.league?.name || 'International'}</span>
                            <span class="${m.state?.name === 'LIVE' ? 'live-tag' : ''}">
                                ${m.state?.name === 'LIVE' ? 'IN-PLAY' : new Date(m.starting_at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}
                            </span>
                        </div>
                        <div class="m-main">
                            <div class="m-team">
                                <img src="${homeTeam.image_path}" class="m-logo" onerror="this.src='https://cdn.sportmonks.com/images/countries/png/short/be.png'">
                                <span class="m-name">${homeTeam.name}</span>
                            </div>
                            <div class="m-score-box">
                                <div class="m-score">${hGoal}:${aGoal}</div>
                                <div class="m-time">FT</div>
                            </div>
                            <div class="m-team">
                                <img src="${awayTeam.image_path}" class="m-logo" onerror="this.src='https://cdn.sportmonks.com/images/countries/png/short/br.png'">
                                <span class="m-name">${awayTeam.name}</span>
                            </div>
                        </div>
                        <div class="m-odds">
                            <div class="odd-btn" onclick="updateSlip('${m.id}', '1', ${oH}, '${homeTeam.name}')">
                                <span class="o-label">HOME</span>
                                <span class="o-val">${oH}</span>
                            </div>
                            <div class="odd-btn" onclick="updateSlip('${m.id}', 'X', ${oD}, 'DRAW')">
                                <span class="o-label">DRAW</span>
                                <span class="o-val">${oD}</span>
                            </div>
                            <div class="odd-btn" onclick="updateSlip('${m.id}', '2', ${oA}, '${awayTeam.name}')">
                                <span class="o-label">AWAY</span>
                                <span class="o-val">${oA}</span>
                            </div>
                        </div>
                        <div class="m-footer">
                            <button class="action-btn" onclick="fetchLineups('${m.id}')"><i class="fas fa-users-cog"></i> LINEUP</button>
                            <button class="action-btn" onclick="fetchLeagues('${m.league_id}')"><i class="fas fa-list-ol"></i> TABLE</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // --- SMART SLIP LOGIC ---
        function updateSlip(fId, pick, val, label) {
            const match = activeFixtures.find(m => m.id.toString() === fId.toString());
            const selection = {
                fId,
                matchTitle: `${match.participants[0].name} v ${match.participants[1].name}`,
                pick,
                odds: val,
                label
            };

            const existingIdx = currentSlipSelections.findIndex(s => s.fId === fId);
            if (existingIdx > -1) {
                currentSlipSelections[existingIdx] = selection;
            } else {
                currentSlipSelections.push(selection);
            }

            refreshSlipUI();
        }

        function removeSelection(fId) {
            currentSlipSelections = currentSlipSelections.filter(s => s.fId !== fId);
            refreshSlipUI();
        }

        function refreshSlipUI() {
            const list = document.getElementById('slipSelectionList');
            const count = document.getElementById('slipCount');
            const totalOddsDisplay = document.getElementById('totalOdds');
            const slipBox = document.getElementById('slipContainer');

            count.innerText = currentSlipSelections.length;
            
            if (currentSlipSelections.length === 0) {
                slipBox.classList.remove('has-items');
                list.innerHTML = `<div class="loader-wrap"><p>Selections will appear here.</p></div>`;
                totalOddsDisplay.innerText = "1.00";
                document.getElementById('placeBetBtn').disabled = true;
                return;
            }

            slipBox.classList.add('has-items');
            let comboOdds = currentSlipSelections.reduce((acc, s) => acc * s.odds, 1);
            totalOddsDisplay.innerText = comboOdds.toFixed(2);

            list.innerHTML = currentSlipSelections.map(s => `
                <div class="sel-card">
                    <i class="fas fa-times sel-remove" onclick="removeSelection('${s.fId}')"></i>
                    <span class="sel-match">${s.matchTitle}</span>
                    <div style="display:flex; justify-content:space-between; align-items:center">
                        <span class="sel-pick">Pick: ${s.label}</span>
                        <span class="sel-odds">@${s.odds}</span>
                    </div>
                </div>
            `).join('');

            document.getElementById('placeBetBtn').disabled = false;
            calculateReturns();
        }

        function calculateReturns() {
            const stake = parseFloat(document.getElementById('stakeInput').value) || 0;
            const odds = parseFloat(document.getElementById('totalOdds').innerText) || 1;
            document.getElementById('potentialReturn').innerText = `$${(stake * odds).toFixed(2)}`;
        }

        // --- TRANSACTION ENGINE ---
        async function processWager() {
            const stakeValue = parseFloat(document.getElementById('stakeInput').value);
            if (stakeValue > vaultBalance) {
                alert("ACCESS DENIED: Insufficient Vault Funds.");
                return;
            }

            const btn = document.getElementById('placeBetBtn');
            btn.disabled = true;
            btn.innerHTML = `<i class="fas fa-circle-notch fa-spin"></i> ENCRYPTING...`;

            try {
                const batch = db.batch();
                const walletRef = db.collection("wallets").doc(userSession.uid);
                const betRef = db.collection("bets").doc();

                batch.update(walletRef, {
                    balance: firebase.firestore.FieldValue.increment(-stakeValue),
                    lastTransaction: Date.now()
                });

                batch.set(betRef, {
                    uId: userSession.uid,
                    picks: currentSlipSelections,
                    odds: parseFloat(document.getElementById('totalOdds').innerText),
                    stake: stakeValue,
                    payout: parseFloat(document.getElementById('potentialReturn').innerText.replace('$','')),
                    status: "PENDING",
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                await batch.commit();
                
                alert("WAGER CONFIRMED. Your ticket has been logged in the blockchain.");
                currentSlipSelections = [];
                refreshSlipUI();
            } catch (err) {
                alert("TRANSACTION REJECTED: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "CONFIRM WAGER";
            }
        }

        // --- MODAL DATA FETCHERS ---
        async function fetchLineups(fId) {
            toggleModal('lineupModal', true);
            const body = document.getElementById('lineupModalBody');
            body.innerHTML = `<div class="loader-wrap"><div class="spinner"></div></div>`;

            try {
                const url = `https://api.sportmonks.com/v3/football/fixtures/${fId}?api_token=${API_TOKEN}&include=lineups.player;formations`;
                const res = await fetch(CORS_PROXY + encodeURIComponent(url));
                const d = (await res.json()).data;

                if (!d.lineups || d.lineups.length === 0) {
                    body.innerHTML = `<p class="mono">Lineup data pending release from stadium officials.</p>`;
                    return;
                }

                body.innerHTML = `
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:30px;">
                        ${d.participants.map(team => `
                            <div>
                                <h4 style="color:var(--primary); margin-bottom:15px; border-bottom:1px solid var(--border)">${team.name}</h4>
                                ${d.lineups.filter(l => l.team_id === team.id).map(p => `
                                    <div style="font-size:13px; margin-bottom:8px; display:flex; justify-content:space-between">
                                        <span><b style="color:var(--primary)">${p.number || ''}</b> ${p.player?.display_name || 'N/A'}</span>
                                        <span style="color:var(--text-dim)">${p.formation_position || ''}</span>
                                    </div>
                                `).join('')}
                            </div>
                        `).join('')}
                    </div>
                `;
            } catch (e) { body.innerHTML = "Lineup Feed Offline."; }
        }

        async function fetchLeagues(lId) {
            toggleModal('standingsModal', true);
            const body = document.getElementById('standingsModalBody');
            body.innerHTML = `<div class="loader-wrap"><div class="spinner"></div></div>`;

            try {
                const url = `https://api.sportmonks.com/v3/football/standings?api_token=${API_TOKEN}&league_id=${lId}`;
                const res = await fetch(CORS_PROXY + encodeURIComponent(url));
                const json = await res.json();
                const table = json.data[0]?.entries || [];

                body.innerHTML = `
                    <table class="std-table">
                        <thead>
                            <tr><th>POS</th><th>TEAM</th><th>PL</th><th>W</th><th>D</th><th>L</th><th>PTS</th></tr>
                        </thead>
                        <tbody>
                            ${table.map(t => `
                                <tr>
                                    <td><div class="rank-circle">${t.rank}</div></td>
                                    <td style="font-weight:800">${t.participant?.name}</td>
                                    <td>${t.details?.find(x => x.type_id === 129)?.value || 0}</td>
                                    <td>${t.details?.find(x => x.type_id === 130)?.value || 0}</td>
                                    <td>${t.details?.find(x => x.type_id === 131)?.value || 0}</td>
                                    <td>${t.details?.find(x => x.type_id === 132)?.value || 0}</td>
                                    <td style="color:var(--primary); font-weight:900">${t.points}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            } catch (e) { body.innerHTML = "Standings Engine Unavailable."; }
        }

        function toggleModal(id, show) {
            document.getElementById(id).style.display = show ? 'flex' : 'none';
        }

        function closeActiveModal(e, id) {
            if (e.target.id === id) toggleModal(id, false);
        }

        function logout() {
            auth.signOut().then(() => window.location.reload());
        }
    </script>
</body>
</html>
