<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>XLODON - LIVE Sports Betting | Real-Time Odds</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #0f172a 50%, #1e293b 100%);
            min-height: 100vh;
            color: #fff;
        }

        .header {
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(12px);
            padding: 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255,215,0,0.2);
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            background: linear-gradient(135deg, #ffd700, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .balance-card {
            background: linear-gradient(135deg, rgba(255,215,0,0.2), rgba(255,107,107,0.2));
            padding: 0.6rem 1.5rem;
            border-radius: 50px;
            display: flex;
            gap: 1rem;
            align-items: center;
            border: 1px solid rgba(255,215,0,0.3);
        }

        .balance-amount {
            font-size: 1.6rem;
            font-weight: bold;
            color: #ffd700;
        }

        .add-funds-btn {
            background: #ffd700;
            border: none;
            padding: 0.5rem 1.2rem;
            border-radius: 50px;
            color: #0a0a1a;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .add-funds-btn:hover {
            transform: scale(1.05);
        }

        .stats-bar {
            max-width: 1400px;
            margin: 1rem auto;
            padding: 0 1rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
        }

        .stat-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(8px);
            padding: 0.8rem;
            border-radius: 16px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .stat-label {
            font-size: 0.8rem;
            opacity: 0.8;
            margin-bottom: 0.3rem;
        }

        .stat-value {
            font-size: 1.2rem;
            font-weight: bold;
            color: #ffd700;
        }

        .filters {
            max-width: 1400px;
            margin: 1rem auto;
            padding: 0 1rem;
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 0.6rem 1.3rem;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 40px;
            color: #fff;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.85rem;
        }

        .filter-btn:hover {
            background: rgba(255,215,0,0.2);
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #ffd700, #ff6b6b);
            color: #0a0a1a;
            border-color: transparent;
        }

        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1rem;
        }

        .fixtures-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 1.5rem;
            margin-top: 1rem;
        }

        .fixture-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 1.2rem;
            transition: 0.2s;
            border: 1px solid rgba(255,255,255,0.12);
            cursor: pointer;
        }

        .fixture-card:hover {
            transform: translateY(-3px);
            background: rgba(255,255,255,0.09);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .fixture-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.8rem;
            font-size: 0.8rem;
        }

        .league-name {
            background: rgba(255,215,0,0.2);
            padding: 0.2rem 0.8rem;
            border-radius: 20px;
        }

        .fixture-status {
            padding: 0.2rem 0.7rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: bold;
        }

        .status-inplay { 
            background: #ff4757; 
            animation: pulse 1s infinite;
        }
        
        .status-scheduled { 
            background: #ffa502; 
        }
        
        .status-finished { 
            background: #2ed573; 
        }

        @keyframes pulse { 
            0% { opacity: 1; } 
            50% { opacity: 0.7; } 
        }

        .fixture-teams {
            text-align: center;
            margin: 1rem 0;
        }

        .team {
            font-size: 1.1rem;
            font-weight: 600;
            margin: 0.4rem 0;
        }

        .vs {
            font-size: 0.8rem;
            opacity: 0.6;
            margin: 0.3rem 0;
        }

        .score {
            font-size: 1.8rem;
            font-weight: bold;
            color: #ffd700;
        }

        .odds-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.7rem;
            margin-top: 1rem;
        }

        .odd-btn {
            background: rgba(255,255,255,0.1);
            border-radius: 14px;
            padding: 0.7rem;
            cursor: pointer;
            text-align: center;
            transition: 0.2s;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .odd-btn:hover {
            background: #ffd700;
            color: #0a0a1a;
            transform: scale(1.02);
        }

        .odd-label {
            font-size: 0.7rem;
            opacity: 0.8;
            margin-bottom: 0.2rem;
        }

        .odd-value {
            font-size: 1.2rem;
            font-weight: bold;
        }

        .bet-slip-toggle {
            position: fixed;
            right: 20px;
            bottom: 20px;
            background: linear-gradient(135deg, #ffd700, #ff6b6b);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 200;
            box-shadow: 0 5px 20px rgba(0,0,0,0.4);
            transition: transform 0.2s;
        }

        .bet-slip-toggle:hover {
            transform: scale(1.1);
        }

        .bet-count {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #ff4757;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .bet-slip {
            position: fixed;
            right: 0;
            top: 0;
            width: 400px;
            height: 100vh;
            background: rgba(10,10,26,0.98);
            backdrop-filter: blur(20px);
            transform: translateX(100%);
            transition: transform 0.3s;
            z-index: 1000;
            padding: 1rem;
            overflow-y: auto;
            border-left: 1px solid rgba(255,215,0,0.3);
        }

        .bet-slip.open {
            transform: translateX(0);
        }

        .bet-slip-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }

        .close-slip {
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .close-slip:hover {
            transform: rotate(90deg);
        }

        .bet-item {
            background: rgba(255,255,255,0.08);
            padding: 1rem;
            border-radius: 16px;
            margin-bottom: 1rem;
        }

        .bet-fixture {
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .bet-details {
            font-size: 0.85rem;
            opacity: 0.8;
            margin: 0.5rem 0;
        }

        .stake-input {
            width: 100%;
            padding: 0.6rem;
            margin: 0.5rem 0;
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,215,0,0.4);
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
        }

        .stake-input:focus {
            outline: none;
            border-color: #ffd700;
        }

        .potential-win {
            color: #ffd700;
            font-weight: bold;
            margin-top: 0.5rem;
        }

        .remove-bet {
            background: rgba(255,71,87,0.3);
            border: none;
            padding: 0.3rem 0.8rem;
            border-radius: 8px;
            color: #ff4757;
            cursor: pointer;
            margin-top: 0.5rem;
            transition: 0.2s;
        }

        .remove-bet:hover {
            background: rgba(255,71,87,0.5);
        }

        .bet-summary {
            background: rgba(255,215,0,0.1);
            padding: 1rem;
            border-radius: 16px;
            margin-top: 1rem;
            border: 1px solid rgba(255,215,0,0.2);
        }

        .place-bet-btn {
            width: 100%;
            padding: 0.9rem;
            background: linear-gradient(135deg, #ffd700, #ff6b6b);
            border: none;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 1rem;
            transition: transform 0.2s;
            font-size: 1rem;
        }

        .place-bet-btn:hover:not(:disabled) {
            transform: translateY(-2px);
        }

        .place-bet-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: #0f172a;
            border-left: 4px solid #ffd700;
            padding: 0.8rem 1.5rem;
            border-radius: 12px;
            z-index: 2000;
            animation: slideInLeft 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        @keyframes slideInLeft {
            from { transform: translateX(-100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .loader {
            border: 3px solid rgba(255,255,255,0.2);
            border-top: 3px solid #ffd700;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 2rem auto;
        }

        @keyframes spin { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }

        .empty-state {
            text-align: center;
            padding: 2rem;
            color: rgba(255,255,255,0.6);
        }

        .error-message {
            text-align: center;
            padding: 2rem;
            color: #ff6b6b;
            background: rgba(255,107,107,0.1);
            border-radius: 16px;
            margin: 1rem;
        }

        @media (max-width: 768px) {
            .fixtures-grid { grid-template-columns: 1fr; }
            .bet-slip { width: 100%; }
            .balance-amount { font-size: 1.2rem; }
            .stats-bar { grid-template-columns: repeat(2, 1fr); }
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.1);
        }

        ::-webkit-scrollbar-thumb {
            background: #ffd700;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="header">
    <div class="header-content">
        <div class="logo">
            ⚽ XLODON
            <span style="font-size:0.7rem; background:rgba(255,215,0,0.2); padding:0.2rem 0.5rem; border-radius:20px;">LIVE BETTING</span>
        </div>
        <div class="balance-card">
            <span>💰 Wallet Balance</span>
            <span class="balance-amount" id="balanceAmount">£1,000</span>
            <button class="add-funds-btn" onclick="showAddFundsModal()">+ Add Funds</button>
        </div>
    </div>
</div>

<div class="stats-bar">
    <div class="stat-card">
        <div class="stat-label">Today's Bets</div>
        <div class="stat-value" id="todayBetsCount">0</div>
    </div>
    <div class="stat-card">
        <div class="stat-label">Today's Stake</div>
        <div class="stat-value" id="todayStake">£0</div>
    </div>
    <div class="stat-card">
        <div class="stat-label">Active Bets</div>
        <div class="stat-value" id="activeBetsCount">0</div>
    </div>
    <div class="stat-card">
        <div class="stat-label">Profit/Loss</div>
        <div class="stat-value" id="profitLoss">£0</div>
    </div>
</div>

<div class="filters">
    <button class="filter-btn active" onclick="filterFixtures('all', this)">🏆 All Matches</button>
    <button class="filter-btn" onclick="filterFixtures('inplay', this)">🔴 Live Now</button>
    <button class="filter-btn" onclick="filterFixtures('today', this)">📅 Today</button>
    <button class="filter-btn" onclick="filterFixtures('premier', this)">🏴󠁧󠁢󠁥󠁮󠁧󠁿 Premier League</button>
    <button class="filter-btn" onclick="filterFixtures('laliga', this)">🇪🇸 La Liga</button>
    <button class="filter-btn" onclick="filterFixtures('seriea', this)">🇮🇹 Serie A</button>
</div>

<div class="main-container">
    <div id="fixturesGrid">
        <div class="loader"></div>
    </div>
</div>

<div class="bet-slip-toggle" onclick="toggleBetSlip()">
    🎫
    <div class="bet-count" id="betCount">0</div>
</div>

<div id="betSlip" class="bet-slip">
    <div class="bet-slip-header">
        <h3>📋 Bet Slip</h3>
        <button class="close-slip" onclick="toggleBetSlip()">✕</button>
    </div>
    <div id="betSlipContent">
        <div class="empty-state">No selections added<br>Click on odds to add bets</div>
    </div>
</div>

<script>
    // ------------------- FIREBASE INIT -------------------
    const firebaseConfig = {
        apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
        authDomain: "x-bet-prod-jd.firebaseapp.com",
        projectId: "x-bet-prod-jd",
        storageBucket: "x-bet-prod-jd.firebasestorage.app",
        messagingSenderId: "499334334535",
        appId: "1:499334334535:web:bebc1bf817e24d9e3c4962",
        measurementId: "G-PTV4XMYQ6P"
    };
    
    let db;
    try {
        firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
        console.log("Firebase initialized");
    } catch(e) {
        console.warn("Firebase init error:", e);
    }

    // ------------------- GLOBALS -------------------
    const PROXY_URL = "http://localhost:3000"; // Your proxy server
    let userBalance = 1000;
    let betSlipItems = [];
    let currentFilter = 'all';
    let fixturesMap = new Map();
    let liveUpdateInterval = null;
    let userId = "user_" + Math.random().toString(36).substr(2, 9);
    let betHistory = [];
    let todayStats = { 
        betsCount: 0, 
        totalStake: 0, 
        date: new Date().toISOString().split('T')[0] 
    };

    // Helper: Show toast notification
    function showToast(message, type = 'info') {
        const toast = document.createElement('div');
        toast.className = 'toast';
        const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
        toast.innerHTML = `${icons[type] || 'ℹ️'} ${message}`;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    // Update UI elements
    function updateBalanceUI() {
        document.getElementById('balanceAmount').innerHTML = `£${userBalance.toFixed(2)}`;
    }

    function updateStatsUI() {
        document.getElementById('todayBetsCount').innerText = todayStats.betsCount;
        document.getElementById('todayStake').innerHTML = `£${todayStats.totalStake.toFixed(2)}`;
        const activeCount = betHistory.filter(b => b.status === 'active').length;
        document.getElementById('activeBetsCount').innerText = activeCount;
        const totalPL = betHistory.reduce((sum, b) => {
            if (b.status === 'won') return sum + (b.potentialWin - b.stake);
            if (b.status === 'lost') return sum - b.stake;
            return sum;
        }, 0);
        document.getElementById('profitLoss').innerHTML = `${totalPL >= 0 ? '+' : ''}£${totalPL.toFixed(2)}`;
        document.getElementById('profitLoss').style.color = totalPL >= 0 ? '#2ed573' : '#ff4757';
    }

    // Save to Firebase
    async function saveToFirestore() {
        if (db) {
            try {
                await db.collection('users').doc(userId).set({
                    balance: userBalance,
                    betHistory: betHistory,
                    todayStats: todayStats,
                    lastUpdated: new Date().toISOString()
                }, { merge: true });
            } catch(e) { 
                console.warn("Firestore save error:", e); 
            }
        }
        // Also save to localStorage as backup
        localStorage.setItem('xlodon_data', JSON.stringify({
            userId, userBalance, betHistory, todayStats
        }));
    }

    // Load from Firebase
    async function loadFromFirestore() {
        // Try localStorage first
        const saved = localStorage.getItem('xlodon_data');
        if (saved) {
            try {
                const data = JSON.parse(saved);
                userBalance = data.userBalance || 1000;
                betHistory = data.betHistory || [];
                todayStats = data.todayStats || { betsCount: 0, totalStake: 0, date: new Date().toISOString().split('T')[0] };
                userId = data.userId || userId;
            } catch(e) {}
        }
        
        if (db) {
            try {
                const docRef = db.collection('users').doc(userId);
                const doc = await docRef.get();
                if (doc.exists) {
                    const data = doc.data();
                    userBalance = data.balance || userBalance;
                    betHistory = data.betHistory || betHistory;
                    const storedStats = data.todayStats || {};
                    const todayDate = new Date().toISOString().split('T')[0];
                    if (storedStats.date === todayDate) todayStats = storedStats;
                    else todayStats = { betsCount: 0, totalStake: 0, date: todayDate };
                }
            } catch(e) { 
                console.warn("Firestore load error:", e);
            }
        }
        
        updateBalanceUI();
        updateStatsUI();
    }

    // ---------- FETCH FROM PROXY (SPORTMONKS API) ----------
    async function fetchLiveFixtures() {
        try {
            document.getElementById('fixturesGrid').innerHTML = '<div class="loader"></div>';
            
            // Fetch latest fixtures from your proxy
            const response = await fetch(`${PROXY_URL}/api/fixtures`);
            const data = await response.json();
            
            if (data && data.data && data.data.length > 0) {
                processFixturesData(data.data);
                showToast(`Updated: ${data.data.length} matches loaded`, 'success');
            } else {
                // Fallback to inplay if no latest
                const inplayResponse = await fetch(`${PROXY_URL}/api/inplay`);
                const inplayData = await inplayResponse.json();
                if (inplayData && inplayData.data) {
                    processFixturesData(inplayData.data);
                } else {
                    useDemoData();
                }
            }
        } catch (err) {
            console.error("Proxy fetch error:", err);
            showToast("Could not connect to proxy server. Make sure it's running on port 3000", 'error');
            useDemoData();
        }
    }
    
    function processFixturesData(fixturesData) {
        const formatted = fixturesData.map(f => {
            const participants = f.participants || [];
            const home = participants.find(p => p.meta?.location === 'home') || participants[0] || { name: "Home Team" };
            const away = participants.find(p => p.meta?.location === 'away') || participants[1] || { name: "Away Team" };
            
            let homeScore = 0, awayScore = 0;
            if (f.scores && f.scores.length) {
                const homeScoreObj = f.scores.find(s => s.type === 'home' || s.type === 'home_team');
                const awayScoreObj = f.scores.find(s => s.type === 'away' || s.type === 'away_team');
                if (homeScoreObj) homeScore = homeScoreObj.score;
                if (awayScoreObj) awayScore = awayScoreObj.score;
            }
            
            let state = 'scheduled';
            if (f.time?.status === 'inplay' || f.state === 'inplay' || f.state_id === 3) state = 'inplay';
            if (f.time?.status === 'finished' || f.state === 'finished' || f.state_id === 5) state = 'finished';
            
            // Generate odds if not available
            let oddsList = f.odds && f.odds.length ? 
                f.odds.map(o => ({ label: o.label || o.name, value: parseFloat(o.value) || 2.0 })) :
                [
                    { label: "Home", value: (Math.random() * 2 + 1.5).toFixed(2) * 1 },
                    { label: "Draw", value: (Math.random() * 1.5 + 2.8).toFixed(2) * 1 },
                    { label: "Away", value: (Math.random() * 2 + 1.8).toFixed(2) * 1 }
                ];
            
            return {
                id: f.id,
                league: { name: f.league?.name || "Football League" },
                participants: [{ name: home.name }, { name: away.name }],
                starting_at: f.starting_at || new Date().toISOString(),
                state: state,
                scores: [{ type: "home", score: homeScore }, { type: "away", score: awayScore }],
                odds: oddsList.slice(0, 3),
                time: { starting_at: { time: new Date(f.starting_at).toLocaleTimeString([], { hour: '2-digit', minute:'2-digit' }) } }
            };
        });
        
        for (const f of formatted) fixturesMap.set(f.id, f);
        renderFixtures();
    }
    
    function useDemoData() {
        const demoFixtures = [
            { id: 1001, league: { name: "Premier League" }, participants: [{ name: "Manchester United" }, { name: "Liverpool" }], state: "inplay", scores: [{type:"home",score:2},{type:"away",score:1}], odds: [{label:"Home",value:2.50},{label:"Draw",value:3.40},{label:"Away",value:2.80}], time: { starting_at: { time: "15:00" } } },
            { id: 1002, league: { name: "Premier League" }, participants: [{ name: "Arsenal" }, { name: "Chelsea" }], state: "scheduled", scores: [], odds: [{label:"Home",value:1.95},{label:"Draw",value:3.50},{label:"Away",value:4.20}], time: { starting_at: { time: "17:30" } } },
            { id: 1003, league: { name: "La Liga" }, participants: [{ name: "Barcelona" }, { name: "Real Madrid" }], state: "scheduled", scores: [], odds: [{label:"Home",value:2.60},{label:"Draw",value:3.40},{label:"Away",value:2.50}], time: { starting_at: { time: "20:00" } } },
            { id: 1004, league: { name: "Serie A" }, participants: [{ name: "Juventus" }, { name: "Inter Milan" }], state: "scheduled", scores: [], odds: [{label:"Home",value:2.30},{label:"Draw",value:3.20},{label:"Away",value:3.10}], time: { starting_at: { time: "19:45" } } },
            { id: 1005, league: { name: "Bundesliga" }, participants: [{ name: "Bayern Munich" }, { name: "Borussia Dortmund" }], state: "scheduled", scores: [], odds: [{label:"Home",value:1.55},{label:"Draw",value:4.20},{label:"Away",value:5.50}], time: { starting_at: { time: "20:30" } } }
        ];
        
        for (const f of demoFixtures) fixturesMap.set(f.id, f);
        renderFixtures();
        showToast("Using demo data - Connect to proxy for live odds", "info");
    }
    
    function renderFixtures() {
        let filtered = Array.from(fixturesMap.values());
        const today = new Date().toISOString().split('T')[0];
        
        switch(currentFilter) {
            case 'inplay':
                filtered = filtered.filter(f => f.state === 'inplay');
                break;
            case 'today':
                filtered = filtered.filter(f => f.starting_at?.split('T')[0] === today);
                break;
            case 'premier':
                filtered = filtered.filter(f => f.league.name === 'Premier League');
                break;
            case 'laliga':
                filtered = filtered.filter(f => f.league.name === 'La Liga');
                break;
            case 'seriea':
                filtered = filtered.filter(f => f.league.name === 'Serie A');
                break;
            default:
                filtered = filtered;
        }
        
        if (filtered.length === 0) {
            document.getElementById('fixturesGrid').innerHTML = '<div class="empty-state">No matches available for this filter</div>';
            return;
        }
        
        const html = `<div class="fixtures-grid">${filtered.map(f => {
            const homeScore = f.scores?.find(s=>s.type==='home')?.score || 0;
            const awayScore = f.scores?.find(s=>s.type==='away')?.score || 0;
            const hasScore = f.state === 'inplay' || f.state === 'finished';
            const statusClass = f.state === 'inplay' ? 'status-inplay' : (f.state === 'finished' ? 'status-finished' : 'status-scheduled');
            const statusText = f.state === 'inplay' ? '🔴 LIVE' : (f.state === 'finished' ? '✅ FINISHED' : (f.time?.starting_at?.time || 'Scheduled'));
            return `
                <div class="fixture-card">
                    <div class="fixture-header">
                        <span class="league-name">${f.league.name}</span>
                        <span class="fixture-status ${statusClass}">${statusText}</span>
                    </div>
                    <div class="fixture-teams">
                        <div class="team">${f.participants[0].name}</div>
                        ${hasScore ? `<div class="score">${homeScore} - ${awayScore}</div>` : '<div class="vs">VS</div>'}
                        <div class="team">${f.participants[1].name}</div>
                    </div>
                    ${f.state !== 'finished' ? `
                        <div class="odds-container">
                            ${f.odds.map(odd => `
                                <div class="odd-btn" onclick="addToBetSlip(${f.id}, '${odd.label}', ${odd.value}, '${f.participants[0].name} vs ${f.participants[1].name}')">
                                    <div class="odd-label">${odd.label}</div>
                                    <div class="odd-value">${odd.value.toFixed(2)}</div>
                                </div>
                            `).join('')}
                        </div>
                    ` : '<div style="text-align:center; margin-top:1rem; opacity:0.6;">Match Finished</div>'}
                </div>
            `;
        }).join('')}</div>`;
        
        document.getElementById('fixturesGrid').innerHTML = html;
    }
    
    // ---------- BET SLIP FUNCTIONS ----------
    function addToBetSlip(fixtureId, selection, odds, fixtureName) {
        if (betSlipItems.some(item => item.fixtureId === fixtureId && item.selection === selection)) {
            showToast("Already in bet slip", "warning");
            return;
        }
        
        betSlipItems.push({ fixtureId, fixtureName, selection, odds, stake: null });
        updateBetSlipUI();
        updateBetCount();
        showToast(`Added: ${fixtureName} - ${selection} @ ${odds.toFixed(2)}`, "success");
    }
    
    function updateBetSlipUI() {
        const container = document.getElementById('betSlipContent');
        
        if (betSlipItems.length === 0) {
            container.innerHTML = '<div class="empty-state">No selections added<br>Click on odds to add bets</div>';
            return;
        }
        
        let totalStake = 0, totalPotential = 0;
        
        const itemsHtml = betSlipItems.map((item, idx) => {
            const potential = item.stake ? (item.stake * item.odds).toFixed(2) : 0;
            if(item.stake) { 
                totalStake += item.stake; 
                totalPotential += parseFloat(potential); 
            }
            return `
                <div class="bet-item">
                    <div class="bet-fixture">${item.fixtureName}</div>
                    <div class="bet-details">Selection: ${item.selection} | Odds: ${item.odds.toFixed(2)}</div>
                    <input type="number" class="stake-input" placeholder="Enter stake (£)" min="0.5" step="0.5" value="${item.stake || ''}" onchange="updateStake(${idx}, this.value)">
                    ${item.stake ? `<div class="potential-win">💰 Potential Win: £${potential}</div>` : ''}
                    <button class="remove-bet" onclick="removeFromSlip(${idx})">Remove</button>
                </div>
            `;
        }).join('');
        
        container.innerHTML = `
            ${itemsHtml}
            <div class="bet-summary">
                <div>Total Stake: £${totalStake.toFixed(2)}</div>
                <div>Total Potential Win: £${totalPotential.toFixed(2)}</div>
            </div>
            <button class="place-bet-btn" onclick="placeBetsAction()" ${totalStake === 0 ? 'disabled' : ''}>
                Place Bets (£${totalStake.toFixed(2)})
            </button>
        `;
    }
    
    window.updateStake = (idx, val) => {
        const stake = parseFloat(val);
        if (isNaN(stake) || stake < 0.5) {
            betSlipItems[idx].stake = null;
            showToast("Minimum stake is £0.50", "warning");
        } else if (stake > userBalance) {
            betSlipItems[idx].stake = null;
            showToast("Insufficient balance", "error");
        } else {
            betSlipItems[idx].stake = stake;
        }
        updateBetSlipUI();
    };
    
    window.removeFromSlip = (idx) => {
        betSlipItems.splice(idx, 1);
        updateBetSlipUI();
        updateBetCount();
        showToast("Removed from bet slip", "info");
    };
    
    function updateBetCount() {
        document.getElementById('betCount').innerText = betSlipItems.length;
    }
    
    async function placeBetsAction() {
        const valid = betSlipItems.filter(i => i.stake && i.stake > 0);
        if (valid.length === 0) {
            showToast("Please enter stakes for your selections", "warning");
            return;
        }
        
        const total = valid.reduce((s,b)=> s + b.stake, 0);
        if (total > userBalance) {
            showToast("Insufficient balance. Please add funds.", "error");
            return;
        }
        
        userBalance -= total;
        todayStats.betsCount += valid.length;
        todayStats.totalStake += total;
        
        for (const bet of valid) {
            const potential = bet.stake * bet.odds;
            const newBet = { 
                id: Date.now() + Math.random(), 
                fixtureName: bet.fixtureName, 
                selection: bet.selection, 
                odds: bet.odds, 
                stake: bet.stake, 
                potentialWin: potential, 
                status: 'active', 
                createdAt: new Date().toISOString() 
            };
            betHistory.push(newBet);
            showToast(`Bet placed: ${bet.fixtureName} - ${bet.selection} (${bet.stake} @ ${bet.odds})`, "success");
        }
        
        betSlipItems = [];
        updateBetSlipUI();
        updateBetCount();
        updateBalanceUI();
        updateStatsUI();
        saveToFirestore();
        toggleBetSlip(false);
        
        // Auto-settle after 30 seconds
        setTimeout(() => simulateSettlement(), 30000);
    }
    
    function simulateSettlement() {
        const activeBets = betHistory.filter(b => b.status === 'active');
        if (activeBets.length === 0) return;
        
        activeBets.forEach(bet => {
            const isWin = Math.random() > 0.45;
            if (isWin) {
                bet.status = 'won';
                userBalance += bet.potentialWin;
                showToast(`🎉 BET WON! You won £${bet.potentialWin.toFixed(2)} on ${bet.fixtureName}`, "success");
            } else {
                bet.status = 'lost';
                showToast(`😢 BET LOST: ${bet.fixtureName} - ${bet.selection}`, "error");
            }
        });
        
        updateBalanceUI();
        updateStatsUI();
        saveToFirestore();
    }
    
    function filterFixtures(filter, buttonElement) {
        currentFilter = filter;
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        buttonElement.classList.add('active');
        renderFixtures();
    }
    
    function toggleBetSlip(open = null) {
        const slip = document.getElementById('betSlip');
        if (open === true) slip.classList.add('open');
        else if (open === false) slip.classList.remove('open');
        else slip.classList.toggle('open');
    }
    
    function showAddFundsModal() {
        const amt = prompt("Enter amount to add (£5 - £1000):", "50");
        if (amt) {
            const val = parseFloat(amt);
            if (val >= 5 && val <= 1000) { 
                userBalance += val; 
                updateBalanceUI(); 
                saveToFirestore(); 
                showToast(`Added £${val} to your balance`, "success");
            } else {
                showToast("Amount must be between £5 and £1000", "warning");
            }
        }
    }
    
    // Auto-refresh live scores every 8 seconds
    function startAutoRefresh() {
        if (liveUpdateInterval) clearInterval(liveUpdateInterval);
        liveUpdateInterval = setInterval(() => {
            fetchLiveFixtures();
        }, 8000);
    }
    
    // Initialize app
    async function init() {
        await loadFromFirestore();
        await fetchLiveFixtures();
        startAutoRefresh();
        
        // Close modal when clicking outside
        document.addEventListener('click', (e) => {
            if (e.target.classList && e.target.classList.contains('modal')) {
                const modal = document.querySelector('.modal');
                if (modal) modal.remove();
            }
        });
    }
    
    // Start the app
    init();
</script>
</body>
</html>
