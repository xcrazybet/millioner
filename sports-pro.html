<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>X-Bet Pro | Live Betting Platform</title>
    
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, where, onSnapshot, doc, getDoc, setDoc, updateDoc, arrayUnion, Timestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged, signInWithPopup, GoogleAuthProvider, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962",
            measurementId: "G-PTV4XMYQ6P"
        };
        
        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const googleProvider = new GoogleAuthProvider();
        
        // Make globally available
        window.db = db;
        window.auth = auth;
        window.googleProvider = googleProvider;
    </script>
    
    <style>
        /* ========== CSS STYLES ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            overflow-x: hidden;
        }
        
        /* Layout - 3 Column Grid */
        .app-container {
            display: grid;
            grid-template-columns: 320px 1fr 380px;
            gap: 1px;
            background: #1a1a1a;
            min-height: 100vh;
        }
        
        /* Panels */
        .live-matches-panel, .match-center-panel, .bet-slip-panel {
            background: #0f0f0f;
            overflow-y: auto;
            height: 100vh;
        }
        
        .live-matches-panel, .bet-slip-panel {
            position: sticky;
            top: 0;
        }
        
        .live-matches-panel { border-right: 1px solid #2a2a2a; }
        .bet-slip-panel { border-left: 1px solid #2a2a2a; }
        
        /* Header Styles */
        .panel-header {
            padding: 20px;
            background: #141414;
            border-bottom: 2px solid #00ff41;
            font-weight: bold;
            font-size: 18px;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        
        /* Auth Section */
        .auth-section {
            padding: 15px 20px;
            background: #141414;
            border-bottom: 1px solid #2a2a2a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .user-email {
            font-size: 12px;
            color: #00ff41;
        }
        
        .auth-btn {
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            color: white;
            padding: 5px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
        }
        
        .auth-btn:hover {
            background: #00ff41;
            color: #0a0a0a;
        }
        
        /* Match Card */
        .match-card {
            padding: 15px;
            border-bottom: 1px solid #2a2a2a;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .match-card:hover {
            background: #1a1a1a;
        }
        
        .match-card.active {
            background: #1a3a1a;
            border-left: 3px solid #00ff41;
        }
        
        .match-teams {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 8px;
        }
        
        .match-score {
            font-size: 20px;
            font-weight: bold;
            color: #00ff41;
            margin: 8px 0;
        }
        
        .match-league {
            font-size: 11px;
            color: #888;
            margin-top: 5px;
        }
        
        .live-badge {
            background: #ff0000;
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 3px;
            display: inline-block;
            margin-left: 8px;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        /* Odds Button */
        .odds-button {
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            color: #00ff41;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }
        
        .odds-button:hover {
            background: #00ff41;
            color: #0a0a0a;
            border-color: #00ff41;
            transform: scale(1.02);
        }
        
        /* Bet Slip Styles */
        .bet-item {
            padding: 15px;
            border-bottom: 1px solid #2a2a2a;
        }
        
        .remove-bet {
            background: #ff0000;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
            margin-top: 8px;
        }
        
        .remove-bet:hover {
            background: #cc0000;
        }
        
        .total-stake {
            padding: 20px;
            background: #141414;
            border-top: 2px solid #2a2a2a;
            position: sticky;
            bottom: 0;
        }
        
        .place-bet-btn {
            background: #00ff41;
            color: #0a0a0a;
            padding: 15px;
            width: 100%;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        
        .place-bet-btn:hover {
            background: #00cc34;
        }
        
        /* Loading States */
        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }
        
        /* Match Details */
        .match-detail-section {
            padding: 20px;
        }
        
        .scoreboard {
            font-size: 48px;
            text-align: center;
            margin: 20px 0;
            color: #00ff41;
            font-weight: bold;
        }
        
        .odds-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 15px 0;
        }
        
        .event-item {
            padding: 8px;
            border-bottom: 1px solid #2a2a2a;
            font-size: 13px;
        }
        
        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 8px;
            border-bottom: 1px solid #2a2a2a;
        }
        
        /* Admin Panel Styles */
        .admin-panel {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            overflow-y: auto;
        }
        
        .admin-panel.active {
            display: block;
        }
        
        .admin-header {
            background: #141414;
            padding: 20px;
            border-bottom: 2px solid #00ff41;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .admin-content {
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .match-form {
            background: #1a1a1a;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        .match-form input, .match-form select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            color: white;
            border-radius: 5px;
        }
        
        .matches-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .matches-table th, .matches-table td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #2a2a2a;
        }
        
        .edit-btn, .delete-btn {
            padding: 5px 10px;
            margin: 0 5px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        
        .edit-btn {
            background: #ffa500;
            color: white;
        }
        
        .delete-btn {
            background: #ff0000;
            color: white;
        }
        
        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #1a1a1a;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #3a3a3a;
            border-radius: 4px;
        }
        
        /* Mobile Responsive */
        @media (max-width: 1024px) {
            .app-container {
                grid-template-columns: 1fr;
            }
            
            .live-matches-panel, .match-center-panel, .bet-slip-panel {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100vh;
                z-index: 100;
            }
            
            .live-matches-panel.active-mobile,
            .match-center-panel.active-mobile,
            .bet-slip-panel.active-mobile {
                display: block;
            }
            
            .mobile-nav {
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                background: #141414;
                display: flex;
                justify-content: space-around;
                padding: 10px;
                z-index: 1000;
                border-top: 1px solid #2a2a2a;
            }
            
            .mobile-nav button {
                background: #2a2a2a;
                border: none;
                color: white;
                padding: 10px 20px;
                border-radius: 5px;
                cursor: pointer;
            }
            
            body {
                padding-bottom: 60px;
            }
        }
        
        /* Admin Button */
        .admin-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #ff4444;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            z-index: 99;
            font-weight: bold;
        }
        
        .admin-toggle:hover {
            background: #cc0000;
        }
    </style>
</head>
<body>
    <!-- Main App Container -->
    <div class="app-container">
        <!-- LEFT PANEL: Live Matches -->
        <div class="live-matches-panel" id="liveMatchesPanel">
            <div class="panel-header">
                🏆 LIVE MATCHES
                <span id="matchCount" style="float: right; font-size: 12px; color: #00ff41;">0</span>
            </div>
            <div class="auth-section">
                <div id="authStatus" class="user-email">Not logged in</div>
                <button class="auth-btn" id="authButton" onclick="window.handleAuth()">Login</button>
            </div>
            <div id="matchesList">
                <div class="loading">Loading matches...</div>
            </div>
        </div>
        
        <!-- CENTER PANEL: Match Details -->
        <div class="match-center-panel" id="matchCenterPanel">
            <div class="panel-header">
                📊 MATCH CENTER
            </div>
            <div id="matchDetails">
                <div class="loading">Select a match to view details</div>
            </div>
        </div>
        
        <!-- RIGHT PANEL: Bet Slip -->
        <div class="bet-slip-panel" id="betSlipPanel">
            <div class="panel-header">
                🧾 BET SLIP
                <span id="betCount" style="float: right; font-size: 12px; color: #00ff41;">0</span>
            </div>
            <div id="betSlipContent">
                <div class="loading">No bets added yet</div>
            </div>
        </div>
    </div>
    
    <!-- Admin Panel -->
    <div class="admin-panel" id="adminPanel">
        <div class="admin-header">
            <h2>⚙️ Admin Panel - Match Management</h2>
            <button class="auth-btn" onclick="window.closeAdminPanel()">Close</button>
        </div>
        <div class="admin-content">
            <div class="match-form">
                <h3>Add / Edit Match</h3>
                <input type="hidden" id="editMatchId">
                <input type="text" id="homeTeam" placeholder="Home Team">
                <input type="text" id="awayTeam" placeholder="Away Team">
                <input type="text" id="league" placeholder="League">
                <input type="datetime-local" id="matchDate">
                <input type="number" id="homeOdds" placeholder="Home Odds" step="0.01">
                <input type="number" id="drawOdds" placeholder="Draw Odds" step="0.01">
                <input type="number" id="awayOdds" placeholder="Away Odds" step="0.01">
                <select id="matchStatus">
                    <option value="scheduled">Scheduled</option>
                    <option value="live">Live</option>
                    <option value="finished">Finished</option>
                </select>
                <button class="odds-button" onclick="window.saveMatch()">Save Match</button>
                <button class="odds-button" onclick="window.clearMatchForm()" style="background:#ff4444;">Clear</button>
            </div>
            
            <h3>All Matches</h3>
            <div id="adminMatchesList">
                <div class="loading">Loading matches...</div>
            </div>
        </div>
    </div>
    
    <!-- Admin Toggle Button -->
    <button class="admin-toggle" id="adminToggle" onclick="window.toggleAdminPanel()" style="display:none;">👑 Admin</button>
    
    <script type="module">
        // ============ APP STATE ============
        let currentUser = null;
        let currentMatches = [];
        let selectedMatchId = null;
        let betSlip = [];
        let isAdmin = false;
        
        // ============ AUTH STATE ============
        window.handleAuth = async function() {
            if (currentUser) {
                await signOut(auth);
            } else {
                try {
                    const result = await signInWithPopup(auth, googleProvider);
                    console.log('User logged in:', result.user.email);
                } catch (error) {
                    console.error('Auth error:', error);
                    alert('Login failed: ' + error.message);
                }
            }
        };
        
        onAuthStateChanged(auth, async (user) => {
            currentUser = user;
            const authStatus = document.getElementById('authStatus');
            const authButton = document.getElementById('authButton');
            const adminToggle = document.getElementById('adminToggle');
            
            if (user) {
                authStatus.textContent = `👤 ${user.email}`;
                authButton.textContent = 'Logout';
                await loadUserBets();
                
                // Check if user is admin (you can set this in Firestore)
                const userDoc = await getDoc(doc(db, 'users', user.uid));
                isAdmin = userDoc.data()?.isAdmin || false;
                if (isAdmin) {
                    adminToggle.style.display = 'block';
                    loadAdminMatches();
                }
            } else {
                authStatus.textContent = 'Not logged in';
                authButton.textContent = 'Login';
                betSlip = [];
                renderBetSlip();
                isAdmin = false;
                adminToggle.style.display = 'none';
            }
        });
        
        // ============ LOAD LIVE MATCHES FROM FIRESTORE ============
        function loadLiveMatches() {
            const gamesRef = collection(db, 'games');
            const q = query(gamesRef);
            
            onSnapshot(q, (snapshot) => {
                currentMatches = [];
                snapshot.forEach((doc) => {
                    const match = { id: doc.id, ...doc.data() };
                    currentMatches.push(match);
                });
                
                currentMatches.sort((a, b) => new Date(a.starting_at) - new Date(b.starting_at));
                renderMatchesList();
                document.getElementById('matchCount').textContent = currentMatches.length;
                
                if (currentMatches.length > 0 && !selectedMatchId) {
                    selectedMatchId = currentMatches[0].id;
                    renderMatchDetails(selectedMatchId);
                }
            }, (error) => {
                console.error('Error loading matches:', error);
                document.getElementById('matchesList').innerHTML = '<div class="loading">Error loading matches</div>';
            });
        }
        
        // ============ RENDER MATCHES LIST ============
        function renderMatchesList() {
            const container = document.getElementById('matchesList');
            
            if (currentMatches.length === 0) {
                container.innerHTML = '<div class="loading">No matches at the moment</div>';
                return;
            }
            
            container.innerHTML = currentMatches.map(match => `
                <div class="match-card ${selectedMatchId === match.id ? 'active' : ''}" onclick="window.selectMatch('${match.id}')">
                    <div class="match-teams">
                        ${match.home_team?.name || match.homeTeam || 'Home'} vs ${match.away_team?.name || match.awayTeam || 'Away'}
                        ${match.status === 'live' ? '<span class="live-badge">LIVE</span>' : ''}
                    </div>
                    <div class="match-score">
                        ${match.scores?.home_score || match.homeScore || 0} - ${match.scores?.away_score || match.awayScore || 0}
                    </div>
                    <div class="match-league">
                        ${match.league?.name || match.league || 'League'} | ${match.status || 'Scheduled'}
                    </div>
                </div>
            `).join('');
        }
        
        // ============ RENDER MATCH DETAILS ============
        async function renderMatchDetails(matchId) {
            const container = document.getElementById('matchDetails');
            const match = currentMatches.find(m => m.id === matchId);
            
            if (!match) {
                container.innerHTML = '<div class="loading">Match not found</div>';
                return;
            }
            
            const homeTeam = match.home_team?.name || match.homeTeam || 'Home';
            const awayTeam = match.away_team?.name || match.awayTeam || 'Away';
            const homeScore = match.scores?.home_score || match.homeScore || 0;
            const awayScore = match.scores?.away_score || match.awayScore || 0;
            const homeOdds = match.odds?.home_win || match.homeOdds || 2.0;
            const drawOdds = match.odds?.draw || match.drawOdds || 3.2;
            const awayOdds = match.odds?.away_win || match.awayOdds || 2.5;
            
            container.innerHTML = `
                <div class="match-detail-section">
                    <h2>${homeTeam} vs ${awayTeam}</h2>
                    <div class="scoreboard">
                        ${homeScore} - ${awayScore}
                    </div>
                    <div>
                        <h3>Match Odds</h3>
                        <div class="odds-grid">
                            <button class="odds-button" onclick="window.addToBetSlip('${match.id}', 'Home Win', ${homeOdds})">
                                Home: ${homeOdds}
                            </button>
                            <button class="odds-button" onclick="window.addToBetSlip('${match.id}', 'Draw', ${drawOdds})">
                                Draw: ${drawOdds}
                            </button>
                            <button class="odds-button" onclick="window.addToBetSlip('${match.id}', 'Away Win', ${awayOdds})">
                                Away: ${awayOdds}
                            </button>
                        </div>
                    </div>
                    <div style="margin-top: 20px;">
                        <h3>Match Events</h3>
                        <div id="matchEvents">
                            ${renderMatchEvents(match.events || [])}
                        </div>
                    </div>
                    <div style="margin-top: 20px;">
                        <h3>Statistics</h3>
                        <div id="matchStats">
                            ${renderMatchStats(match.stats || {})}
                        </div>
                    </div>
                </div>
            `;
        }
        
        function renderMatchEvents(events) {
            if (!events.length) return '<p>No events yet</p>';
            return events.map(event => `
                <div class="event-item">
                    ${event.minute}' - ${event.player_name} (${event.type})
                </div>
            `).join('');
        }
        
        function renderMatchStats(stats) {
            if (!Object.keys(stats).length) return '<p>Statistics coming soon</p>';
            return `
                <div class="stat-item"><span>Possession:</span> <span>${stats.possession || '0%'}</span></div>
                <div class="stat-item"><span>Shots on target:</span> <span>${stats.shots_on_target || '0'}</span></div>
                <div class="stat-item"><span>Corners:</span> <span>${stats.corners || '0'}</span></div>
            `;
        }
        
        // ============ BET SLIP FUNCTIONS ============
        window.addToBetSlip = function(matchId, betType, odds) {
            if (!currentUser) {
                alert('Please login to add bets');
                return;
            }
            
            const match = currentMatches.find(m => m.id === matchId);
            if (!match) return;
            
            const homeTeam = match.home_team?.name || match.homeTeam || 'Home';
            const awayTeam = match.away_team?.name || match.awayTeam || 'Away';
            
            const bet = {
                id: Date.now(),
                matchId: matchId,
                matchName: `${homeTeam} vs ${awayTeam}`,
                betType: betType,
                odds: odds,
                stake: 0,
                timestamp: new Date().toISOString()
            };
            
            betSlip.push(bet);
            renderBetSlip();
            saveBetSlipToFirestore();
        };
        
        window.removeFromBetSlip = function(betId) {
            betSlip = betSlip.filter(b => b.id !== betId);
            renderBetSlip();
            saveBetSlipToFirestore();
        };
        
        window.updateStake = function(betId, stake) {
            const bet = betSlip.find(b => b.id === betId);
            if (bet) {
                bet.stake = parseFloat(stake) || 0;
                renderBetSlip();
                saveBetSlipToFirestore();
            }
        };
        
        function renderBetSlip() {
            const container = document.getElementById('betSlipContent');
            document.getElementById('betCount').textContent = betSlip.length;
            
            if (betSlip.length === 0) {
                container.innerHTML = '<div class="loading">No bets added yet</div>';
                return;
            }
            
            let totalStake = 0;
            let totalPotentialWin = 0;
            
            container.innerHTML = betSlip.map(bet => {
                const potentialWin = bet.stake * bet.odds;
                totalStake += bet.stake;
                totalPotentialWin += potentialWin;
                return `
                    <div class="bet-item">
                        <div><strong>${bet.matchName}</strong></div>
                        <div>Bet: ${bet.betType} @ ${bet.odds}</div>
                        <div style="margin: 8px 0;">
                            Stake: $<input type="number" value="${bet.stake}" onchange="window.updateStake(${bet.id}, this.value)" style="width: 100px; padding: 5px; background: #2a2a2a; color: white; border: 1px solid #3a3a3a; border-radius: 3px;">
                        </div>
                        <div>Potential Win: $${potentialWin.toFixed(2)}</div>
                        <button class="remove-bet" onclick="window.removeFromBetSlip(${bet.id})">Remove</button>
                    </div>
                `;
            }).join('');
            
            const totalDiv = document.createElement('div');
            totalDiv.className = 'total-stake';
            totalDiv.innerHTML = `
                <div style="margin-bottom: 10px;">
                    <strong>Total Stake:</strong> $${totalStake.toFixed(2)}
                </div>
                <div style="margin-bottom: 20px;">
                    <strong>Total Potential Win:</strong> <span style="color: #00ff41;">$${totalPotentialWin.toFixed(2)}</span>
                </div>
                <button class="place-bet-btn" onclick="window.placeBet()">PLACE BET</button>
            `;
            container.appendChild(totalDiv);
        }
        
        async function saveBetSlipToFirestore() {
            if (!currentUser) return;
            
            const userBetsRef = doc(db, 'users', currentUser.uid);
            await setDoc(userBetsRef, { 
                currentBetSlip: betSlip,
                updatedAt: Timestamp.now()
            }, { merge: true });
        }
        
        async function loadUserBets() {
            if (!currentUser) return;
            
            const userDoc = await getDoc(doc(db, 'users', currentUser.uid));
            if (userDoc.exists() && userDoc.data().currentBetSlip) {
                betSlip = userDoc.data().currentBetSlip;
                renderBetSlip();
            }
        }
        
        window.placeBet = async function() {
            if (!currentUser) {
                alert('Please login to place bets');
                return;
            }
            
            if (betSlip.length === 0) {
                alert('Please add some bets first');
                return;
            }
            
            const invalidBets = betSlip.filter(b => b.stake <= 0);
            if (invalidBets.length > 0) {
                alert('Please set stakes for all bets');
                return;
            }
            
            // Save bet history
            const betHistoryRef = collection(db, 'users', currentUser.uid, 'betHistory');
            await setDoc(doc(betHistoryRef), {
                bets: betSlip,
                totalStake: betSlip.reduce((sum, b) => sum + b.stake, 0),
                timestamp: Timestamp.now(),
                status: 'pending'
            });
            
            alert(`Bet placed successfully! Total stake: $${betSlip.reduce((sum, b) => sum + b.stake, 0).toFixed(2)}`);
            betSlip = [];
            renderBetSlip();
            await saveBetSlipToFirestore();
        };
        
        window.selectMatch = function(matchId) {
            selectedMatchId = matchId;
            renderMatchesList();
            renderMatchDetails(matchId);
            
            if (window.innerWidth <= 1024) {
                document.querySelector('.live-matches-panel').classList.remove('active-mobile');
                document.querySelector('.match-center-panel').classList.add('active-mobile');
            }
        };
        
        // ============ ADMIN FUNCTIONS ============
        window.toggleAdminPanel = function() {
            const panel = document.getElementById('adminPanel');
            panel.classList.toggle('active');
            if (panel.classList.contains('active')) {
                loadAdminMatches();
            }
        };
        
        window.closeAdminPanel = function() {
            document.getElementById('adminPanel').classList.remove('active');
        };
        
        async function loadAdminMatches() {
            const gamesRef = collection(db, 'games');
            const snapshot = await getDocs(gamesRef);
            const matches = [];
            snapshot.forEach(doc => matches.push({ id: doc.id, ...doc.data() }));
            
            const container = document.getElementById('adminMatchesList');
            container.innerHTML = `
                <table class="matches-table">
                    <thead>
                        <tr><th>Home</th><th>Away</th><th>League</th><th>Status</th><th>Actions</th></tr>
                    </thead>
                    <tbody>
                        ${matches.map(match => `
                            <tr>
                                <td>${match.homeTeam || match.home_team?.name || 'Home'}</td>
                                <td>${match.awayTeam || match.away_team?.name || 'Away'}</td>
                                <td>${match.league || 'League'}</td>
                                <td>${match.status || 'scheduled'}</td>
                                <td>
                                    <button class="edit-btn" onclick="window.editMatch('${match.id}')">Edit</button>
                                    <button class="delete-btn" onclick="window.deleteMatch('${match.id}')">Delete</button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }
        
        window.saveMatch = async function() {
            const matchId = document.getElementById('editMatchId').value;
            const matchData = {
                homeTeam: document.getElementById('homeTeam').value,
                awayTeam: document.getElementById('awayTeam').value,
                league: document.getElementById('league').value,
                starting_at: document.getElementById('matchDate').value,
                homeOdds: parseFloat(document.getElementById('homeOdds').value),
                drawOdds: parseFloat(document.getElementById('drawOdds').value),
                awayOdds: parseFloat(document.getElementById('awayOdds').value),
                status: document.getElementById('matchStatus').value,
                homeScore: 0,
                awayScore: 0,
                updatedAt: Timestamp.now()
            };
            
            if (matchId) {
                await updateDoc(doc(db, 'games', matchId), matchData);
                alert('Match updated successfully!');
            } else {
                await setDoc(doc(collection(db, 'games')), matchData);
                alert('Match added successfully!');
            }
            
            window.clearMatchForm();
            loadAdminMatches();
        };
        
        window.editMatch = async function(matchId) {
            const matchDoc = await getDoc(doc(db, 'games', matchId));
            const match = matchDoc.data();
            
            document.getElementById('editMatchId').value = matchId;
            document.getElementById('homeTeam').value = match.homeTeam || '';
            document.getElementById('awayTeam').value = match.awayTeam || '';
            document.getElementById('league').value = match.league || '';
            document.getElementById('matchDate').value = match.starting_at || '';
            document.getElementById('homeOdds').value = match.homeOdds || '';
            document.getElementById('drawOdds').value = match.drawOdds || '';
            document.getElementById('awayOdds').value = match.awayOdds || '';
            document.getElementById('matchStatus').value = match.status || 'scheduled';
        };
        
        window.deleteMatch = async function(matchId) {
            if (confirm('Are you sure you want to delete this match?')) {
                await deleteDoc(doc(db, 'games', matchId));
                alert('Match deleted successfully!');
                loadAdminMatches();
            }
        };
        
        window.clearMatchForm = function() {
            document.getElementById('editMatchId').value = '';
            document.getElementById('homeTeam').value = '';
            document.getElementById('awayTeam').value = '';
            document.getElementById('league').value = '';
            document.getElementById('matchDate').value = '';
            document.getElementById('homeOdds').value = '';
            document.getElementById('drawOdds').value = '';
            document.getElementById('awayOdds').value = '';
            document.getElementById('matchStatus').value = 'scheduled';
        };
        
        // ============ INITIALIZE APP ============
        function init() {
            loadLiveMatches();
            
            if (window.innerWidth <= 1024) {
                const navBar = document.createElement('div');
                navBar.className = 'mobile-nav';
                navBar.innerHTML = `
                    <button onclick="document.querySelector('.live-matches-panel').classList.add('active-mobile'); document.querySelector('.match-center-panel').classList.remove('active-mobile'); document.querySelector('.bet-slip-panel').classList.remove('active-mobile')">🏆 Live</button>
                    <button onclick="document.querySelector('.match-center-panel').classList.add('active-mobile'); document.querySelector('.live-matches-panel').classList.remove('active-mobile'); document.querySelector('.bet-slip-panel').classList.remove('active-mobile')">📊 Match</button>
                    <button onclick="document.querySelector('.bet-slip-panel').classList.add('active-mobile'); document.querySelector('.live-matches-panel').classList.remove('active-mobile'); document.querySelector('.match-center-panel').classList.remove('active-mobile')">🧾 Bets</button>
                `;
                document.body.appendChild(navBar);
                document.querySelector('.live-matches-panel').classList.add('active-mobile');
            }
        }
        
        // Make functions globally available
        window.getDocs = getDocs;
        window.updateDoc = updateDoc;
        window.setDoc = setDoc;
        window.deleteDoc = deleteDoc;
        window.collection = collection;
        window.doc = doc;
        window.Timestamp = Timestamp;
        
        // Start the app
        init();
    </script>
</body>
</html>
