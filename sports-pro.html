<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MILLIONER PRO - Standalone Betting</title>
    
    <!-- Icons & Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #00ff9d;
            --primary-dark: #00cc7e;
            --secondary: #7209b7;
            --accent: #4cc9f0;
            --danger: #ff4757;
            --success: #2ecc71;
            --warning: #f1c40f;
            --bg: #0f172a;
            --surface: #1e293b;
            --surface-light: #334155;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --border: #334155;
            --glow: 0 0 15px rgba(0, 255, 157, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg); color: var(--text); overflow-x: hidden; }

        /* Layout */
        .app-container { display: grid; grid-template-columns: 240px 1fr 320px; min-height: 100vh; }

        /* Sidebar Left */
        .sidebar { background: var(--surface); border-right: 1px solid var(--border); padding: 20px; position: sticky; top: 0; height: 100vh; }
        .logo { font-size: 20px; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 10px; margin-bottom: 30px; }
        .nav-group { margin-bottom: 25px; }
        .nav-label { font-size: 11px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 10px; color: var(--text-dim); text-decoration: none; transition: 0.2s; cursor: pointer; }
        .nav-item:hover, .nav-item.active { background: var(--surface-light); color: var(--text); }
        .nav-item.active i { color: var(--primary); }

        /* Main Content */
        .main-content { padding: 20px; background: var(--bg); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .user-wallet { background: var(--surface); padding: 10px 20px; border-radius: 30px; border: 1px solid var(--primary); display: flex; align-items: center; gap: 10px; box-shadow: var(--glow); }
        .balance-label { font-size: 12px; color: var(--text-dim); }
        .balance-amount { font-weight: 800; color: var(--primary); font-size: 18px; }

        /* Match Sections */
        .section-header { display: flex; align-items: center; gap: 10px; margin: 30px 0 20px; }
        .section-header h2 { font-size: 20px; font-weight: 700; }
        .live-dot { width: 8px; height: 8px; background: var(--danger); border-radius: 50%; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        /* Match Cards */
        .matches-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
        .match-card { background: var(--surface); border-radius: 16px; padding: 20px; border: 1px solid var(--border); transition: 0.2s; }
        .match-card:hover { border-color: var(--primary); transform: translateY(-2px); }
        .match-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-dim); margin-bottom: 15px; }
        .match-teams { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 20px; margin-bottom: 20px; }
        .team { display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .team-img { width: 48px; height: 48px; object-fit: contain; background: #fff; border-radius: 50%; padding: 2px; }
        .team-name { font-weight: 600; font-size: 14px; text-align: center; }
        .match-score { font-size: 28px; font-weight: 800; color: var(--primary); letter-spacing: 5px; }
        .match-time { font-size: 12px; font-weight: 700; color: var(--danger); }

        /* Odds Grid */
        .odds-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .odd-box { background: var(--surface-light); padding: 12px; border-radius: 8px; text-align: center; cursor: pointer; border: 1px solid transparent; transition: 0.2s; }
        .odd-box:hover { border-color: var(--primary); background: rgba(0, 255, 157, 0.05); }
        .odd-box.selected { background: var(--primary); color: #000; border-color: var(--primary); }
        .odd-label { font-size: 11px; color: var(--text-dim); margin-bottom: 4px; display: block; }
        .odd-box.selected .odd-label { color: rgba(0,0,0,0.6); }
        .odd-value { font-weight: 700; font-size: 15px; }

        /* Bet Slip (Right Sidebar) */
        .betslip { background: var(--surface); border-left: 1px solid var(--border); padding: 20px; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; }
        .betslip-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .betslip-count { background: var(--primary); color: #000; font-size: 12px; font-weight: 800; padding: 2px 8px; border-radius: 10px; }
        .betslip-items { flex: 1; overflow-y: auto; margin-bottom: 20px; }
        .bet-item { background: var(--surface-light); border-radius: 12px; padding: 15px; margin-bottom: 12px; position: relative; border-left: 4px solid var(--primary); }
        .remove-bet { position: absolute; top: 10px; right: 10px; cursor: pointer; color: var(--text-dim); }
        .bet-match { font-size: 12px; font-weight: 600; margin-bottom: 5px; }
        .bet-selection { display: flex; justify-content: space-between; align-items: center; }
        .selection-name { font-weight: 700; color: var(--primary); }
        .selection-odds { font-weight: 800; }

        /* Bet Summary */
        .bet-summary { border-top: 1px solid var(--border); padding-top: 20px; }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; }
        .summary-total { font-size: 18px; font-weight: 800; color: var(--text); margin: 15px 0; }
        .stake-input-group { position: relative; margin-bottom: 15px; }
        .stake-input { width: 100%; background: var(--surface-light); border: 1px solid var(--border); padding: 12px 15px; border-radius: 10px; color: var(--text); font-weight: 700; outline: none; }
        .stake-input:focus { border-color: var(--primary); }
        .place-bet-btn { width: 100%; background: var(--primary); color: #000; border: none; padding: 15px; border-radius: 10px; font-weight: 800; font-size: 16px; cursor: pointer; transition: 0.2s; }
        .place-bet-btn:hover { background: var(--primary-dark); transform: scale(1.02); }
        .place-bet-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Empty States */
        .empty-slip { text-align: center; padding: 40px 20px; color: var(--text-dim); }
        .empty-slip i { font-size: 48px; margin-bottom: 15px; opacity: 0.2; }

        /* Mobile */
        @media (max-width: 1024px) {
            .app-container { grid-template-columns: 1fr; }
            .sidebar, .betslip { display: none; }
            .mobile-nav { display: flex; position: fixed; bottom: 0; width: 100%; background: var(--surface); padding: 10px; border-top: 1px solid var(--border); justify-content: space-around; z-index: 1000; }
        }

        /* Notifications */
        .toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 9999; }
        .toast { background: var(--surface); border-left: 4px solid var(--primary); padding: 15px 25px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); margin-bottom: 10px; animation: slideIn 0.3s ease; }
        .toast.success { border-left-color: var(--success); }
        .toast.error { border-left-color: var(--danger); }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
    </style>
</head>
<body>

<div class="app-container">
    <!-- LEFT SIDEBAR -->
    <aside class="sidebar">
        <div class="logo">
            <i class="fas fa-trophy"></i>
            <span>MILLIONER PRO</span>
        </div>
        
        <nav class="nav-group">
            <div class="nav-label">Menu</div>
            <a href="index.html" class="nav-item"><i class="fas fa-home"></i> Home</a>
            <a href="dashboard.html" class="nav-item"><i class="fas fa-chart-pie"></i> Dashboard</a>
            <a href="sports-pro.html" class="nav-item active"><i class="fas fa-futbol"></i> Sports</a>
            <a href="wallets.html" class="nav-item"><i class="fas fa-wallet"></i> Wallet</a>
        </nav>

        <nav class="nav-group">
            <div class="nav-label">Status</div>
            <div id="apiStatus" class="nav-item"><i class="fas fa-circle" style="color: var(--warning);"></i> Connecting...</div>
        </nav>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        <header class="header">
            <h1 style="font-size: 24px; font-weight: 800;">Sports Betting</h1>
            <div class="user-wallet">
                <div class="balance-info">
                    <div class="balance-label">Balance</div>
                    <div class="balance-amount" id="balanceDisplay">$0.00</div>
                </div>
                <i class="fas fa-plus-circle" style="color: var(--primary); cursor: pointer;" onclick="window.location='wallets.html'"></i>
            </div>
        </header>

        <!-- LIVE MATCHES -->
        <div class="section-header">
            <div class="live-dot"></div>
            <h2>Live Now</h2>
        </div>
        <div id="liveMatches" class="matches-grid">
            <div class="empty-slip">Initializing real-time engine...</div>
        </div>

        <!-- UPCOMING MATCHES -->
        <div class="section-header">
            <i class="fas fa-calendar-alt" style="color: var(--primary);"></i>
            <h2>Upcoming Matches</h2>
        </div>
        <div id="upcomingMatches" class="matches-grid">
            <div class="empty-slip">Loading fixtures...</div>
        </div>
    </main>

    <!-- RIGHT SIDEBAR (BET SLIP) -->
    <aside class="betslip">
        <div class="betslip-header">
            <h2 style="font-size: 18px; font-weight: 800;">Bet Slip</h2>
            <span class="betslip-count" id="slipCount">0</span>
        </div>

        <div class="betslip-items" id="slipItems">
            <div class="empty-slip">
                <i class="fas fa-ticket-alt"></i>
                <p>Click on odds to add a bet.</p>
            </div>
        </div>

        <div class="bet-summary">
            <div class="summary-row">
                <span>Total Odds</span>
                <span id="totalOdds" style="font-weight: 800; color: var(--primary);">1.00</span>
            </div>
            <div class="stake-input-group">
                <input type="number" id="betStake" class="stake-input" placeholder="Stake Amount ($)" min="1">
            </div>
            <div class="summary-row summary-total">
                <span>Payout</span>
                <span id="potentialPayout" style="color: var(--primary);">$0.00</span>
            </div>
            <button class="place-bet-btn" id="placeBetBtn" disabled>Place Bet</button>
        </div>
    </aside>
</div>

<div class="toast-container" id="toastContainer"></div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

<script>
// ==================== CONFIGURATION ====================
const SPORTMONKS_TOKEN = "DkFdWG9jFZvH8XSEgLrRfGwczABWVg5rlV25GvIRyN06zdPsOI48Nsv9Wooy";
const API_BASE = "https://api.sportmonks.com/v3/football";

const firebaseConfig = {
    apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
    authDomain: "x-bet-prod-jd.firebaseapp.com",
    projectId: "x-bet-prod-jd",
    storageBucket: "x-bet-prod-jd.firebasestorage.app",
    messagingSenderId: "499334334535",
    appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
};

// Initialize Firebase
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();
const firebaseFunctions = firebase.functions();

// App State
let currentUser = null;
let userBalance = 0;
let betSlip = [];
let matchesData = {};
let walletUnsubscribe = null;
let refreshInterval = null;

// ==================== CORE LOGIC ====================

document.addEventListener('DOMContentLoaded', () => {
    auth.onAuthStateChanged(user => {
        currentUser = user;
        if (user) {
            initWallet();
        } else {
            if (walletUnsubscribe) walletUnsubscribe();
            userBalance = 0;
            document.getElementById('balanceDisplay').textContent = `$0.00`;
            showToast("Please login to bet", "error");
        }
        loadAppData();
    });

    document.getElementById('betStake').addEventListener('input', updateSlipDisplay);
    document.getElementById('placeBetBtn').addEventListener('click', executeBet);
});

async function loadAppData() {
    renderLiveMatches();
    renderUpcomingMatches();
    // Prevent multiple intervals
    if (!refreshInterval) {
        refreshInterval = setInterval(renderLiveMatches, 60000);
    }
}

function initWallet() {
    // Prevent multiple snapshot listeners
    if (walletUnsubscribe) walletUnsubscribe();
    walletUnsubscribe = db.collection("wallets").doc(currentUser.uid).onSnapshot(doc => {
        if (doc.exists) {
            userBalance = doc.data().balance || 0;
            document.getElementById('balanceDisplay').textContent = `$${userBalance.toFixed(2)}`;
        }
    });
}

// SECURE PROXY API CALLS (Mandatory to solve CORS and protect Token)
async function fetchFromSportmonks(endpoint, params = {}) {
    try {
        const getSportmonksData = firebaseFunctions.httpsCallable('getSportmonksData');
        const result = await getSportmonksData({ endpoint, params });
        
        if (result.data && result.data.success) {
            return result.data.data;
        } else {
            throw new Error(result.data?.error || "Secure Proxy Error");
        }
    } catch (e) {
        console.error("Secure Proxy Error:", e);
        return { error: e.message };
    }
}

async function renderLiveMatches() {
    const container = document.getElementById('liveMatches');
    const statusEl = document.getElementById('apiStatus');
    
    container.innerHTML = '<div class="empty-slip"><i class="fas fa-spinner fa-spin"></i> Loading REAL Live Scores...</div>';
    
    let data = await fetchFromSportmonks("/livescores/inplay", { 
        include: "participants;scores;league;state;lineups;events;statistics;periods" 
    });
    
    if (data && data.data) {
        statusEl.innerHTML = '<i class="fas fa-circle" style="color: var(--success);"></i> REAL API: Live';
        const matches = data.data;
        if (matches.length === 0) {
            container.innerHTML = '<div class="empty-slip">No matches live right now.</div>';
            return;
        }

        container.innerHTML = matches.map(m => {
            matchesData[m.id] = m;
            const home = m.participants?.find(p => p.meta?.location === 'home');
            const away = m.participants?.find(p => p.meta?.location === 'away');
            const score = m.scores?.find(s => s.description === 'CURRENT');
            const state = m.state?.name || 'LIVE';
            
            return `
                <div class="match-card">
                    <div class="match-meta">
                        <span>${m.league?.name || 'Football'}</span>
                        <span class="match-time">${state} ${m.time?.minute || 0}'</span>
                    </div>
                    <div class="match-teams">
                        <div class="team">
                            <img src="${home?.image_path || 'assets/images/placeholder.png'}" class="team-img" onerror="this.src='assets/images/placeholder.png'">
                            <div class="team-name">${home?.name || 'Home'}</div>
                        </div>
                        <div class="match-score">${score?.home_score || 0} - ${score?.away_score || 0}</div>
                        <div class="team">
                            <img src="${away?.image_path || 'assets/images/placeholder.png'}" class="team-img" onerror="this.src='assets/images/placeholder.png'">
                            <div class="team-name">${away?.name || 'Away'}</div>
                        </div>
                    </div>
                    <div class="odds-container">
                        <div class="odd-box" onclick="addToSlip(${m.id}, '1', 1.85)">
                            <span class="odd-label">1</span><span class="odd-value">1.85</span>
                        </div>
                        <div class="odd-box" onclick="addToSlip(${m.id}, 'X', 3.40)">
                            <span class="odd-label">X</span><span class="odd-value">3.40</span>
                        </div>
                        <div class="odd-box" onclick="addToSlip(${m.id}, '2', 2.10)">
                            <span class="odd-label">2</span><span class="odd-value">2.10</span>
                        </div>
                    </div>
                </div>
            `;
        }).join('');
    } else {
        statusEl.innerHTML = `<i class="fas fa-circle" style="color: var(--danger);"></i> REAL API: Offline`;
        container.innerHTML = `<div class="empty-slip" style="color: var(--danger);">
            <i class="fas fa-exclamation-triangle"></i><br>
            Failed to load REAL data.<br>
            <small>${data?.error || 'Check Firebase Blaze Plan'}</small>
        </div>`;
    }
}

async function renderUpcomingMatches() {
    const container = document.getElementById('upcomingMatches');
    const data = await fetchFromSportmonks("/fixtures", { include: "participants;league" });
    
    if (data && data.data) {
        const matches = data.data.slice(0, 10);
        container.innerHTML = matches.map(m => {
            matchesData[m.id] = m;
            const home = m.participants?.find(p => p.meta?.location === 'home');
            const away = m.participants?.find(p => p.meta?.location === 'away');
            const startTime = new Date(m.starting_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            return `
                <div class="match-card">
                    <div class="match-meta">
                        <span>${m.league?.name || 'Football'}</span>
                        <span>Today, ${startTime}</span>
                    </div>
                    <div class="match-teams">
                        <div class="team">
                            <img src="${home?.image_path || 'assets/images/placeholder.png'}" class="team-img" onerror="this.src='assets/images/placeholder.png'">
                            <div class="team-name">${home?.name || 'Home'}</div>
                        </div>
                        <div class="match-score">VS</div>
                        <div class="team">
                            <img src="${away?.image_path || 'assets/images/placeholder.png'}" class="team-img" onerror="this.src='assets/images/placeholder.png'">
                            <div class="team-name">${away?.name || 'Away'}</div>
                        </div>
                    </div>
                    <div class="odds-container">
                        <div class="odd-box" onclick="addToSlip(${m.id}, '1', 1.90)">
                            <span class="odd-label">Home</span><span class="odd-value">1.90</span>
                        </div>
                        <div class="odd-box" onclick="addToSlip(${m.id}, 'X', 3.20)">
                            <span class="odd-label">Draw</span><span class="odd-value">3.20</span>
                        </div>
                        <div class="odd-box" onclick="addToSlip(${m.id}, '2', 2.50)">
                            <span class="odd-label">Away</span><span class="odd-value">2.50</span>
                        </div>
                    </div>
                </div>
            `;
        }).join('');
    } else {
        container.innerHTML = '<div class="empty-slip">Upcoming matches will appear here once the API connects.</div>';
    }
}

window.addToSlip = (matchId, selection, price) => {
    const match = matchesData[matchId];
    if (!match) return;

    const existingIndex = betSlip.findIndex(b => b.matchId === matchId);
    const home = match.participants?.find(p => p.meta?.location === 'home')?.name;
    const away = match.participants?.find(p => p.meta?.location === 'away')?.name;

    const bet = { matchId, matchName: `${home} vs ${away}`, selection, price: parseFloat(price) };

    if (existingIndex > -1) betSlip[existingIndex] = bet;
    else betSlip.push(bet);

    updateSlipDisplay();
    showToast(`Added: ${selection} @ ${price}`, "success");
};

function updateSlipDisplay() {
    const container = document.getElementById('slipItems');
    const countEl = document.getElementById('slipCount');
    const totalOddsEl = document.getElementById('totalOdds');
    const payoutEl = document.getElementById('potentialPayout');
    const stake = parseFloat(document.getElementById('betStake').value) || 0;

    countEl.textContent = betSlip.length;

    if (betSlip.length === 0) {
        container.innerHTML = '<div class="empty-slip"><p>Slip is empty.</p></div>';
        totalOddsEl.textContent = "1.00";
        payoutEl.textContent = "$0.00";
        document.getElementById('placeBetBtn').disabled = true;
        return;
    }

    container.innerHTML = betSlip.map((b, i) => `
        <div class="bet-item">
            <i class="fas fa-times remove-bet" onclick="removeFromSlip(${i})"></i>
            <div class="bet-match">${b.matchName}</div>
            <div class="bet-selection">
                <span class="selection-name">${b.selection}</span>
                <span class="selection-odds">${b.price.toFixed(2)}</span>
            </div>
        </div>
    `).join('');

    const totalOdds = betSlip.reduce((acc, b) => acc * b.price, 1);
    totalOddsEl.textContent = totalOdds.toFixed(2);
    payoutEl.textContent = `$${(totalOdds * stake).toFixed(2)}`;
    document.getElementById('placeBetBtn').disabled = stake <= 0;
}

window.removeFromSlip = (i) => { betSlip.splice(i, 1); updateSlipDisplay(); };

async function executeBet() {
    if (!currentUser) { showToast("Login required", "error"); return; }
    const stake = parseFloat(document.getElementById('betStake').value);
    if (stake > userBalance) { showToast("Insufficient balance", "error"); return; }

    const btn = document.getElementById('placeBetBtn');
    btn.disabled = true; btn.textContent = "Processing...";

    try {
        const ticketId = `BET-${Date.now()}`;
        const walletRef = db.collection("wallets").doc(currentUser.uid);
        
        await db.runTransaction(async (transaction) => {
            const snap = await transaction.get(walletRef);
            const currentBal = snap.data().balance || 0;
            if (currentBal < stake) throw new Error("Insufficient balance");

            transaction.update(walletRef, { balance: currentBal - stake });
            const betRef = db.collection("football_bets").doc(ticketId);
            transaction.set(betRef, {
                userId: currentUser.uid,
                selections: betSlip,
                stake,
                status: 'pending',
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                ticketId
            });
        });

        showToast("Bet Placed!", "success");
        betSlip = []; document.getElementById('betStake').value = '';
        updateSlipDisplay();
    } catch (e) {
        showToast(e.message, "error");
    } finally {
        btn.disabled = false; btn.textContent = "Place Bet";
    }
}

function showToast(msg, type = "info") {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-triangle'}"></i> ${msg}`;
    container.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
}
</script>
</body>
</html>
