services:
  # API Server (handles frontend requests)
  - type: web
    name: millioner-api
    env: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: API_FOOTBALL_KEY
        sync: false
    healthCheckPath: /health
  
  # Sync Worker (runs continuously in background)
  - type: worker
    name: millioner-worker
    env: node
    buildCommand: npm install
    startCommand: node worker.js
    envVars:
      - key: API_FOOTBALL_KEY
        sync: false
