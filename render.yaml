services:
  - type: web
    name: millioner-betting
    runtime: node
    repo: https://github.com/xcrazybet/millioner
    plan: free
    branch: main
    envVars:
      - key: SPORTMONKS_API_TOKEN
        sync: false
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    autoDeploy: true
