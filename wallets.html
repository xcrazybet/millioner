<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>💳 Wallet - XCrazyBet</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0f1a;
            color: #ffffff;
            min-height: 100vh;
            padding-bottom: 80px;
        }
        
        /* ===== HEADER ===== */
        .header {
            background: linear-gradient(135deg, #111827, #0a0f1a);
            padding: 15px 20px;
            border-bottom: 2px solid #00ff9d;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .back-btn {
            color: #00ff9d;
            text-decoration: none;
            font-size: 20px;
            transition: all 0.3s;
        }
        
        .back-btn:hover {
            transform: translateX(-3px);
        }
        
        .header-title {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .header-title i {
            color: #00ff9d;
        }
        
        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .balance-badge {
            background: rgba(0, 255, 157, 0.15);
            padding: 8px 18px;
            border-radius: 25px;
            border: 1px solid #00ff9d;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .balance-badge i {
            color: #00ff9d;
            font-size: 18px;
        }
        
        .balance-amount {
            color: #00ff9d;
            font-weight: 700;
            font-size: 18px;
        }
        
        .refresh-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #a0a8c9;
            padding: 8px 12px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 16px;
        }
        
        .refresh-btn:hover {
            background: rgba(0, 255, 157, 0.2);
            color: #00ff9d;
            transform: rotate(180deg);
        }
        
        /* ===== MAIN CONTAINER ===== */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* ===== BALANCE CARDS ===== */
        .balance-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        
        .balance-card {
            background: #111827;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s;
        }
        
        .balance-card:hover {
            border-color: #00ff9d33;
            transform: translateY(-2px);
        }
        
        .balance-card .label {
            font-size: 12px;
            color: #a0a8c9;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .balance-card .value {
            font-size: 24px;
            font-weight: 700;
        }
        
        .balance-card .value.positive {
            color: #00ff9d;
        }
        
        .balance-card .value.negative {
            color: #ff5252;
        }
        
        .balance-card .value.neutral {
            color: #ff9800;
        }
        
        /* ===== FILTERS ===== */
        .filter-bar {
            background: #111827;
            border-radius: 12px;
            padding: 15px 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }
        
        .filter-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            flex: 1;
        }
        
        .filter-btn {
            padding: 6px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid transparent;
            border-radius: 20px;
            color: #a0a8c9;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
        }
        
        .filter-btn:hover {
            background: rgba(0, 255, 157, 0.1);
            color: #ffffff;
        }
        
        .filter-btn.active {
            background: rgba(0, 255, 157, 0.15);
            border-color: #00ff9d;
            color: #00ff9d;
        }
        
        .filter-search {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            color: #ffffff;
            font-size: 13px;
            min-width: 180px;
            transition: all 0.3s;
        }
        
        .filter-search:focus {
            outline: none;
            border-color: #00ff9d;
            background: rgba(0, 255, 157, 0.05);
        }
        
        .filter-search::placeholder {
            color: #6b7280;
        }
        
        .data-source-badge {
            font-size: 11px;
            padding: 4px 12px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            color: #a0a8c9;
        }
        
        .data-source-badge .firebase {
            color: #ffa000;
        }
        
        /* ===== TRANSACTIONS LIST ===== */
        .transactions-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .transactions-header h2 {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .transactions-header h2 i {

        }
        
        .transaction-count {

            color: #a0a8c9;
        }
        
        .transactions-list {

        .transaction-icon.withdraw {

        .transaction-icon.win {

            color: #00ff9d;
        }
        
        .transaction-icon.loss {
            background: rgba(255, 82, 82, 0.2);
            color: #ff5252;
        }
        
        .transaction-icon.bonus {
            background: rgba(255, 215, 0, 0.15);
            color: #ffd700;
        }
        
        .transaction-icon.transfer {
            background: rgba(33, 150, 243, 0.15);
            color: #2196f3;
        }
        
        .transaction-icon.send {
            background: rgba(255, 152, 0, 0.15);
            color: #ff9800;
        }
        
        .transaction-icon.receive {
            background: rgba(0, 255, 157, 0.15);
            color: #00ff9d;
        }
        
        .transaction-icon.finished {
            background: rgba(156, 39, 176, 0.15);
            color: #9c27b0;
        }
        
        .transaction-icon.cancelled {
            background: rgba(158, 158, 158, 0.15);
            color: #9e9e9e;
        }
        
        .transaction-icon.balance_adjustment {
            background: rgba(33, 150, 243, 0.15);
            color: #2196f3;
        }
        
        .transaction-info {
            flex: 1;
            min-width: 0;
        }
        
        .transaction-title {
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 4px;
        }
        
        .transaction-description {
            font-size: 12px;
            color: #a0a8c9;
        }
        
        .transaction-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 4px;
            flex-wrap: wrap;
        }
        
        .transaction-tag {
            font-size: 10px;
            padding: 2px 10px;
            border-radius: 12px;
            font-weight: 600;
        }
        
        .transaction-tag.completed {
            background: rgba(0, 255, 157, 0.15);
            color: #00ff9d;
        }
        
        .transaction-tag.pending {
            background: rgba(255, 152, 0, 0.15);
            color: #ff9800;
        }
        
        .transaction-tag.failed {

            color: #ff5252;
        }
        
        .transaction-tag.active {

            color: #2196f3;
        }
        
        .transaction-tag.cancelled {
            background: rgba(158, 158, 158, 0.15);
            color: #9e9e9e;
        }
        
        .transaction-tag.finished {
            background: rgba(156, 39, 176, 0.15);
            color: #9c27b0;
        }
        
        .transaction-amount {
            font-size: 16px;
            font-weight: 700;
            text-align: right;
            flex-shrink: 0;
        }
        
        .transaction-amount.positive {
            color: #00ff9d;
        }
        
        .transaction-amount.negative {
            color: #ff5252;
        }
        
        .transaction-time {
            font-size: 11px;
            color: #6b7280;
            text-align: right;
            flex-shrink: 0;
            min-width: 60px;
        }
        
        /* ===== EMPTY STATE ===== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: #111827;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .empty-state i {
            font-size: 56px;
            color: #2a3442;
            margin-bottom: 20px;
        }
        
        .empty-state h3 {
            color: #a0a8c9;
            margin-bottom: 8px;
        }
        
        .empty-state p {
            color: #6b7280;
            font-size: 14px;
        }
        
        /* ===== LOADING ===== */
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(0, 255, 157, 0.1);
            border-top-color: #00ff9d;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loading-container {
            text-align: center;
            padding: 40px;
        }
        
        .loading-container p {
            color: #a0a8c9;
            margin-top: 12px;
            font-size: 14px;
        }
        
        /* ===== BOTTOM NAV ===== */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            background: #111827;
            padding: 12px;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            border-top: 1px solid rgba(0, 255, 157, 0.2);
            z-index: 99;
        }
        
        .nav-item {
            color: #a0a8c9;
            text-decoration: none;
            text-align: center;
            font-size: 10px;
            transition: all 0.3s;
            padding: 4px 8px;
        }
        
        .nav-item.active {
            color: #00ff9d;
        }
        
        .nav-item i {
            font-size: 20px;
            display: block;
            margin-bottom: 2px;
        }
        
        .nav-item:hover {
            color: #00ff9d;
            transform: translateY(-2px);
        }
        
        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .header {
                padding: 12px 15px;
            }
            
            .header-title {
                font-size: 16px;
            }
            
            .balance-cards {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            
            .balance-card .value {
                font-size: 18px;
            }
            
            .filter-bar {
                flex-direction: column;
                align-items: stretch;
                padding: 12px 15px;
            }
            
            .filter-group {
                justify-content: center;
            }
            
            .filter-search {
                width: 100%;
                min-width: unset;
            }
            
            .transaction-item {
                padding: 12px 14px;
                flex-wrap: wrap;
            }
            
            .transaction-amount {
                font-size: 14px;
                margin-left: auto;
            }
            
            .transaction-time {
                font-size: 10px;
                min-width: 50px;
            }
            
            .transaction-meta {
                gap: 8px;
            }
        }
        
        @media (max-width: 480px) {
            .balance-cards {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }
            
            .balance-card {
                padding: 14px;
            }
            
            .balance-card .value {
                font-size: 16px;
            }
            
            .header-title {
                font-size: 14px;
            }
            
            .balance-badge {
                padding: 6px 12px;
            }
            
            .balance-amount {
                font-size: 14px;
            }
            
            .transaction-icon {
                width: 36px;
                height: 36px;
                font-size: 14px;
            }
            
            .transaction-title {
                font-size: 13px;
            }
        }
    </style>
</head>

        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ===== STATE =====
        let allTransactions = [];
        let filteredTransactions = [];
        let currentFilter = 'all';
        let searchQuery = '';
        let currentUser = null;
        let isLoading = false;

        // ===== DOM ELEMENTS =====
        const container = document.getElementById('transactions-container');
        const headerBalance = document.getElementById('header-balance');
        const totalBalance = document.getElementById('total-balance');
        const totalDeposits = document.getElementById('total-deposits');
        const totalWithdrawals = document.getElementById('total-withdrawals');
        const netProfit = document.getElementById('net-profit');
        const transactionCount = document.getElementById('transaction-count');
        const refreshBtn = document.getElementById('refreshBtn');
        const searchInput = document.getElementById('searchInput');

        // ===== HELPERS =====
        function formatCurrency(amount) {
            return '$' + Math.abs(amount).toFixed(2);
        }

        function formatDate(timestamp) {
            if (!timestamp) return 'N/A';
            
            let date;
            if (timestamp.toDate) {
                date = timestamp.toDate();
            } else if (timestamp.seconds) {
                date = new Date(timestamp.seconds * 1000);
            } else if (typeof timestamp === 'string') {
                date = new Date(timestamp);
            } else if (timestamp instanceof Date) {
                date = timestamp;
            } else {
                date = new Date(timestamp);
            }
            
            if (isNaN(date.getTime())) return 'N/A';
            
            const now = new Date();
            const diffMs = now - date;
            const diffMins = Math.floor(diffMs / 60000);
            const diffHours = Math.floor(diffMs / 3600000);
            const diffDays = Math.floor(diffMs / 86400000);
            
            if (diffMins < 1) return 'Just now';
            if (diffMins < 60) return diffMins + 'm ago';
            if (diffHours < 24) return diffHours + 'h ago';
            if (diffDays < 7) return diffDays + 'd ago';
            
            return date.toLocaleDateString('en-US', {
                month: 'short',
                day: 'numeric',
                year: 'numeric'
            });
        }

        function getTransactionIcon(type) {
            const icons = {
                deposit: 'fa-arrow-down',
                withdraw: 'fa-arrow-up',
                win: 'fa-trophy',
                loss: 'fa-times-circle',
                bet: 'fa-dice',
                bonus: 'fa-gift',
                transfer: 'fa-exchange-alt',
                send: 'fa-paper-plane',
                receive: 'fa-inbox',
                welcome_bonus: 'fa-gift',
                profit: 'fa-chart-line',
                finished: 'fa-check-circle',
                cancelled: 'fa-ban',
                active: 'fa-circle',
                balance_adjustment: 'fa-adjust'
            };
            return icons[type] || 'fa-circle';
        }

        function getTransactionIconClass(type) {
            const classes = {
                deposit: 'deposit',
                withdraw: 'withdraw',
                win: 'win',
                loss: 'loss',
                bet: 'bet',
                bonus: 'bonus',
                transfer: 'transfer',
                send: 'send',
                receive: 'receive',
                welcome_bonus: 'bonus',
                profit: 'win',
                finished: 'finished',
                cancelled: 'cancelled',
                active: 'bet',
                balance_adjustment: 'balance_adjustment'
            };
            return classes[type] || 'deposit';
        }

        function getTransactionTitle(transaction) {
            const type = transaction.type || 'unknown';
            const titles = {
                deposit: 'Deposit',
                withdraw: 'Withdrawal',
                win: 'Win',
                loss: 'Loss',
                bet: 'Bet',
                bonus: 'Bonus',
                transfer: 'Transfer',
                send: 'Send Money',
                receive: 'Receive Money',
                welcome_bonus: 'Welcome Bonus',
                profit: 'Profit',
                finished: 'Finished',
                cancelled: 'Cancelled',
                active: 'Active Bet',
                balance_adjustment: 'Balance Adjustment'
            };
            return titles[type] || type.charAt(0).toUpperCase() + type.slice(1);
        }

        function getStatusClass(status) {
            const classes = {
                completed: 'completed',
                pending: 'pending',
                failed: 'failed',
                success: 'completed',
                active: 'active',
                cancelled: 'cancelled',
                finished: 'finished',
                win: 'completed',
                loss: 'failed'
            };
            return classes[status] || 'completed';
        }

        // ===== AUTH =====
        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            
            currentUser = user;
            await loadAllTransactions();
            setupEventListeners();
        });

        // ===== LOAD ALL TRANSACTIONS FROM FIREBASE =====
        async function loadAllTransactions() {
            if (!currentUser) return;
            
            isLoading = true;
            showLoading();
            
            allTransactions = [];
            
            try {
                // 1. LOAD FROM WALLET SUBCOLLECTION (Primary source)
                await loadWalletTransactions();
                
                // 2. LOAD FROM MAIN TRANSACTIONS COLLECTION
                await loadMainTransactions();
                
                // 3. LOAD BETS FROM BETS COLLECTION
                await loadBets();
                
                // 4. LOAD FROM USER ACTIVITIES (if any)
                await loadUserActivities();
                
                // Sort all transactions by date (newest first)
                allTransactions.sort((a, b) => {
                    const timeA = getTimestamp(a);
                    const timeB = getTimestamp(b);
                    return timeB - timeA;
                });
                
                // Update UI
                renderTransactions();
                updateStats();
                updateBalance();
                
                console.log(`✅ Loaded ${allTransactions.length} total transactions from Firebase`);
                
            } catch (error) {
                console.error('Error loading transactions:', error);
                showError('Failed to load transactions. Please refresh.');
            } finally {
                isLoading = false;
            }
        }

        function getTimestamp(tx) {
            if (tx.createdAt) {
                if (tx.createdAt.toDate) return tx.createdAt.toDate().getTime();
                if (tx.createdAt.seconds) return tx.createdAt.seconds * 1000;
                if (typeof tx.createdAt === 'string') return new Date(tx.createdAt).getTime();
                if (tx.createdAt instanceof Date) return tx.createdAt.getTime();
                return new Date(tx.createdAt).getTime();
            }
            if (tx.timestamp) {
                if (tx.timestamp.toDate) return tx.timestamp.toDate().getTime();
                if (tx.timestamp.seconds) return tx.timestamp.seconds * 1000;
                return new Date(tx.timestamp).getTime();
            }
            if (tx.time) {
                return new Date(tx.time).getTime();
            }
            if (tx.placed_at) {
                return new Date(tx.placed_at).getTime();
            }
            return Date.now();
        }

        // ----- 1. WALLET SUBCOLLECTION TRANSACTIONS -----
        async function loadWalletTransactions() {
            try {
                const walletRef = db.collection('wallets').doc(currentUser.uid);
                const snapshot = await walletRef.collection('transactions')
                    .orderBy('createdAt', 'desc')
                    .limit(1000)
                    .get();
                
                snapshot.forEach(doc => {
                    const data = doc.data();
                    allTransactions.push({
                        id: doc.id,
                        type: data.type || 'transaction',
                        amount: data.amount || 0,
                        description: data.description || data.notes || '',
                        status: data.status || 'completed',
                        createdAt: data.createdAt || data.timestamp || new Date(),
                        source: 'firebase',
                        sourceType: 'wallet_transaction',
                        previousBalance: data.previousBalance || 0,
                        newBalance: data.newBalance || 0,
                        category: data.category || '',
                        transactionId: data.transactionId || doc.id
                    });
                });
                
                console.log(`📊 Wallet transactions: ${snapshot.size}`);
                
            } catch (error) {
                console.error('Error loading wallet transactions:', error);
            }
        }

        // ----- 2. MAIN TRANSACTIONS COLLECTION -----
        async function loadMainTransactions() {
            try {
                const snapshot = await db.collection('transactions')
                    .where('userId', '==', currentUser.uid)
                    .orderBy('createdAt', 'desc')
                    .limit(1000)
                    .get();
                
                snapshot.forEach(doc => {
                    const data = doc.data();
                    // Avoid duplicates
                    if (!allTransactions.some(t => t.id === doc.id && t.sourceType === 'wallet_transaction')) {
                        allTransactions.push({
                            id: doc.id,
                            type: data.type || 'transaction',
                            amount: data.amount || 0,
                            description: data.description || data.notes || '',
                            status: data.status || 'completed',
                            createdAt: data.createdAt || data.timestamp || new Date(),
                            source: 'firebase',
                            sourceType: 'main_transaction',
                            previousBalance: data.previousBalance || 0,
                            newBalance: data.newBalance || 0,
                            category: data.category || '',
                            transactionId: data.transactionId || doc.id
                        });
                    }
                });
                
                console.log(`📊 Main transactions: ${snapshot.size}`);
                
            } catch (error) {
                console.error('Error loading main transactions:', error);
            }
        }

        // ----- 3. BETS COLLECTION -----
        async function loadBets() {
            try {
                // Try with user_id field
                let snapshot = await db.collection('bets')
                    .where('user_id', '==', currentUser.uid)
                    .orderBy('placed_at', 'desc')
                    .limit(1000)
                    .get();
                
                // If no results, try with userId field
                if (snapshot.empty) {
                    snapshot = await db.collection('bets')
                        .where('userId', '==', currentUser.uid)
                        .orderBy('placed_at', 'desc')
                        .limit(1000)
                        .get();
                }
                
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const amount = data.amount || 0;
                    const status = data.status || 'pending';
                    const isWin = status === 'win' || status === 'won' || status === 'completed';
                    const isLoss = status === 'loss' || status === 'lost' || status === 'failed';
                    
                    // Determine transaction type based on bet outcome
                    let type = 'bet';
                    let displayAmount = -amount; // Bets are negative (money going out)
                    
                    if (isWin && data.potential_win) {
                        type = 'win';
                        displayAmount = data.potential_win || amount * 2;
                    } else if (isWin) {
                        type = 'win';
                        displayAmount = amount * 1.5;
                    } else if (isLoss) {
                        type = 'loss';
                        displayAmount = -amount;
                    }
                    
                    // Check for duplicate
                    if (!allTransactions.some(t => t.id === doc.id && t.sourceType === 'bet')) {
                        allTransactions.push({
                            id: doc.id,
                            type: type,
                            amount: displayAmount,
                            description: data.bet_name || `${data.bet_type || 'Bet'} on match`,
                            status: status,
                            createdAt: data.placed_at || data.createdAt || new Date(),
                            source: 'firebase',
                            sourceType: 'bet',
                            betDetails: data,
                            fixture_id: data.fixture_id || '',
                            bet_type: data.bet_type || '',
                            odds: data.odds || 0,
                            potential_win: data.potential_win || 0
                        });
                    }
                });
                
                console.log(`📊 Bets: ${snapshot.size}`);
                
            } catch (error) {
                console.error('Error loading bets:', error);
            }
        }

        // ----- 4. USER ACTIVITIES -----
        async function loadUserActivities() {
            try {
                const snapshot = await db.collection('user_activities')
                    .where('userId', '==', currentUser.uid)
                    .orderBy('timestamp', 'desc')
                    .limit(500)
                    .get();
                
                snapshot.forEach(doc => {
                    const data = doc.data();
                    // Only include activities that involve money
                    if (data.action === 'deposit' || data.action === 'withdraw' || 
                        data.action === 'bet_placed' || data.action === 'bet_won' ||
                        data.action === 'bet_lost' || data.action === 'bonus_claimed') {
                        
                        let type = data.action;
                        let amount = data.amount || 0;
                        
                        if (data.action === 'bet_placed') {
                            type = 'bet';
                            amount = -Math.abs(amount);
                        } else if (data.action === 'bet_won') {
                            type = 'win';
                            amount = Math.abs(amount);
                        } else if (data.action === 'bet_lost') {
                            type = 'loss';
                            amount = -Math.abs(amount);
                        } else if (data.action === 'deposit' || data.action === 'bonus_claimed') {
                            type = data.action === 'bonus_claimed' ? 'bonus' : 'deposit';
                            amount = Math.abs(amount);
                        } else if (data.action === 'withdraw') {
                            amount = -Math.abs(amount);
                        }
                        
                        // Check for duplicate
                        if (!allTransactions.some(t => t.id === doc.id && t.sourceType === 'activity')) {
                            allTransactions.push({
                                id: doc.id,
                                type: type,
                                amount: amount,
                                description: data.description || data.action || 'Activity',
                                status: data.status || 'completed',
                                createdAt: data.timestamp || new Date(),
                                source: 'firebase',
                                sourceType: 'activity',
                                activityData: data
                            });
                        }
                    }
                });
                
                console.log(`📊 User activities: ${snapshot.size}`);
                
            } catch (error) {
                console.error('Error loading user activities:', error);
            }
        }

        // ===== UPDATE BALANCE =====
        async function updateBalance() {
            try {
                const walletDoc = await db.collection('wallets').doc(currentUser.uid).get();
                const balance = walletDoc.exists ? (walletDoc.data().balance || 0) : 0;
                const formatted = formatCurrency(balance);
                headerBalance.textContent = formatted;
                totalBalance.textContent = formatted;
            } catch (error) {
                console.error('Error updating balance:', error);
            }
        }

        // ===== RENDER =====
        function renderTransactions() {
            applyFilters();
            
            if (filteredTransactions.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-receipt"></i>
                        <h3>No Transactions Found</h3>
                        <p>${allTransactions.length === 0 ? 'Start playing games or make transactions to see your history here.' : 'Try adjusting your filters.'}</p>
                    </div>
                `;
                transactionCount.textContent = '0 transactions';
                return;
            }
            
            let html = '<div class="transactions-list">';
            
            filteredTransactions.forEach((tx, index) => {
                const amount = tx.amount || 0;
                const isPositive = amount >= 0;
                const iconClass = getTransactionIconClass(tx.type);
                const icon = getTransactionIcon(tx.type);
                const title = getTransactionTitle(tx);
                const description = tx.description || tx.notes || '';
                const status = tx.status || 'completed';
                const time = formatDate(tx.createdAt);
                const txId = tx.transactionId || tx.id || `tx_${index}`;
                
                html += `
                    <div class="transaction-item" onclick="showTransactionDetails('${txId}')">
                        <div class="transaction-icon ${iconClass}">
                            <i class="fas ${icon}"></i>
                        </div>
                        <div class="transaction-info">
                            <div class="transaction-title">${title}</div>
                            <div class="transaction-description">${description || tx.type || 'Transaction'}</div>
                            <div class="transaction-meta">
                                <span class="transaction-tag ${getStatusClass(status)}">${(status || 'completed').toUpperCase()}</span>
                                ${tx.bet_type ? `<span style="font-size:10px;color:#6b7280;">${tx.bet_type}</span>` : ''}
                                ${tx.category ? `<span style="font-size:10px;color:#6b7280;">${tx.category}</span>` : ''}
                                ${tx.sourceType ? `<span style="font-size:10px;color:#6b7280;">${tx.sourceType.replace('_', ' ')}</span>` : ''}
                            </div>
                        </div>
                        <div class="transaction-amount ${isPositive ? 'positive' : 'negative'}">
                            ${isPositive ? '+' : '-'}${formatCurrency(amount)}
                        </div>
                        <div class="transaction-time">${time}</div>
                    </div>
                `;
            });
            
            html += '</div>';
            container.innerHTML = html;
            transactionCount.textContent = `${filteredTransactions.length} transactions`;
        }

        function updateStats() {
            let total = 0;
            let deposits = 0;
            let withdrawals = 0;
            let wins = 0;
            let losses = 0;
            let bonuses = 0;
            
            allTransactions.forEach(tx => {
                const amount = tx.amount || 0;
                const type = tx.type || '';
                
                total += amount;
                
                if (type === 'deposit' || type === 'receive') {
                    deposits += amount > 0 ? amount : 0;
                } else if (type === 'withdraw' || type === 'send') {
                    withdrawals += amount < 0 ? Math.abs(amount) : 0;
                } else if (type === 'win' || type === 'profit') {
                    wins += amount > 0 ? amount : 0;
                } else if (type === 'loss' || (type === 'bet' && amount < 0)) {
                    losses += amount < 0 ? Math.abs(amount) : 0;
                } else if (type === 'bonus' || type === 'welcome_bonus') {
                    bonuses += amount > 0 ? amount : 0;
                }
            });
            
            totalDeposits.textContent = formatCurrency(deposits);
            totalWithdrawals.textContent = formatCurrency(withdrawals);
            
            const net = (wins + bonuses) - losses;
            netProfit.textContent = formatCurrency(net);
            netProfit.style.color = net >= 0 ? '#00ff9d' : '#ff5252';
        }

        function applyFilters() {
            let result = [...allTransactions];
            
            // Apply type filter
            if (currentFilter !== 'all') {
                result = result.filter(tx => {
                    const type = tx.type || '';
                    return type === currentFilter || 
                           (currentFilter === 'win' && (type === 'win' || type === 'profit')) ||
                           (currentFilter === 'loss' && (type === 'loss' || type === 'bet' && tx.amount < 0)) ||
                           (currentFilter === 'send' && (type === 'send' || type === 'withdraw')) ||
                           (currentFilter === 'receive' && (type === 'receive' || type === 'deposit'));
                });
            }
            
            // Apply search
            if (searchQuery.trim()) {
                const query = searchQuery.toLowerCase().trim();
                result = result.filter(tx => {
                    const description = (tx.description || '').toLowerCase();
                    const type = (tx.type || '').toLowerCase();
                    const notes = (tx.notes || '').toLowerCase();
                    const id = (tx.id || '').toLowerCase();
                    const betName = (tx.bet_name || '').toLowerCase();
                    const category = (tx.category || '').toLowerCase();
                    return description.includes(query) || 
                           type.includes(query) || 
                           notes.includes(query) || 
                           id.includes(query) ||
                           betName.includes(query) ||
                           category.includes(query);
                });
            }
            
            filteredTransactions = result;
        }

        // ===== UI STATES =====
        function showLoading() {
            container.innerHTML = `
                <div class="loading-container">
                    <div class="loading-spinner"></div>
                    <p>Loading your transaction history...</p>
                </div>
            `;
        }

        function showError(message) {
            container.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-exclamation-circle" style="color: #ff5252;"></i>
                    <h3>Error</h3>
                    <p>${message}</p>
                </div>
            `;
        }

        // ===== EVENT LISTENERS =====
        function setupEventListeners() {
            // Filter buttons
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentFilter = this.dataset.filter;
                    renderTransactions();
                });
            });
            
            // Search
            searchInput.addEventListener('input', function() {
                searchQuery = this.value;
                renderTransactions();
            });
            
            // Refresh
            refreshBtn.addEventListener('click', function() {
                const icon = this.querySelector('i');
                icon.style.transform = 'rotate(360deg)';
                icon.style.transition = 'transform 0.5s';
                loadAllTransactions();
                setTimeout(() => {
                    icon.style.transform = '';
                }, 500);
            });
        }

        // ===== TRANSACTION DETAILS =====
        window.showTransactionDetails = function(txId) {
            const tx = allTransactions.find(t => (t.transactionId || t.id) === txId);
            if (!tx) return;
            
            const amount = tx.amount || 0;
            const isPositive = amount >= 0;
            const type = getTransactionTitle(tx);
            const status = tx.status || 'completed';
            const time = tx.createdAt?.toDate?.() || new Date(tx.createdAt || tx.placed_at || Date.now());
            
            let details = [
                `📊 Transaction Details`,
                ``,
                `Type: ${type}`,
                `Amount: ${isPositive ? '+' : '-'}$${Math.abs(amount).toFixed(2)}`,
                `Status: ${status.toUpperCase()}`,
                `Date: ${time instanceof Date && !isNaN(time) ? time.toLocaleString() : 'N/A'}`,
                `Description: ${tx.description || tx.notes || 'N/A'}`,
                `ID: ${tx.transactionId || tx.id || 'N/A'}`
            ];
            
            // Add balance info if available
            if (tx.previousBalance !== undefined || tx.newBalance !== undefined) {
                details.push(``);
                details.push(`--- Balance Info ---`);
                if (tx.previousBalance !== undefined) details.push(`Previous: $${tx.previousBalance.toFixed(2)}`);
                if (tx.newBalance !== undefined) details.push(`New: $${tx.newBalance.toFixed(2)}`);
            }
            
            // Add bet details if available
            if (tx.betDetails) {
                details.push(``);
                details.push(`--- Bet Details ---`);
                if (tx.betDetails.bet_type) details.push(`Bet Type: ${tx.betDetails.bet_type}`);
                if (tx.betDetails.fixture_id) details.push(`Match ID: ${tx.betDetails.fixture_id}`);
                if (tx.betDetails.odds) details.push(`Odds: ${tx.betDetails.odds}`);
                if (tx.betDetails.potential_win) details.push(`Potential Win: $${tx.betDetails.potential_win.toFixed(2)}`);
            }
            
            alert(details.join('\n'));
        };

        // Auto-refresh every 60 seconds
        setInterval(() => {
            if (currentUser && !isLoading) {
                loadAllTransactions();
            }
        }, 60000);

        console.log('💳 Wallet page loaded successfully!');
        console.log('   📊 Loading ALL transactions from Firebase');
        console.log('   🔍 Search and filter your history');
        console.log('   📈 Tracking: deposits, withdrawals, wins, losses, bets, bonuses');
    </script>
</body>
</html>
