<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>💳 Wallet - XCrazyBet</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0f1a;
            color: #ffffff;
            min-height: 100vh;
            padding-bottom: 80px;
        }
        
        /* ===== HEADER ===== */
        .header {
            background: linear-gradient(135deg, #111827, #0a0f1a);
            padding: 15px 20px;
            border-bottom: 2px solid #00ff9d;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .back-btn {
            color: #00ff9d;
            text-decoration: none;
            font-size: 20px;
            transition: all 0.3s;
        }
        
        .back-btn:hover {
            transform: translateX(-3px);
        }
        
        .header-title {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .header-title i {
            color: #00ff9d;
        }
        
        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .balance-badge {
            background: rgba(0, 255, 157, 0.15);
            padding: 8px 18px;
            border-radius: 25px;
            border: 1px solid #00ff9d;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .balance-badge i {
            color: #00ff9d;
            font-size: 18px;
        }
        
        .balance-amount {
            color: #00ff9d;
            font-weight: 700;
            font-size: 18px;
        }
        
        .refresh-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #a0a8c9;
            padding: 8px 12px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 16px;
        }
        
        .refresh-btn:hover {
            background: rgba(0, 255, 157, 0.2);
            color: #00ff9d;
            transform: rotate(180deg);
        }
        
        /* ===== MAIN CONTAINER ===== */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* ===== BALANCE CARDS ===== */
        .balance-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        
        .balance-card {
            background: #111827;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s;
        }
        
        .balance-card:hover {
            border-color: #00ff9d33;
            transform: translateY(-2px);
        }
        
        .balance-card .label {
            font-size: 12px;
            color: #a0a8c9;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .balance-card .value {
            font-size: 24px;
            font-weight: 700;
        }
        
        .balance-card .value.positive {
            color: #00ff9d;
        }
        
        .balance-card .value.negative {
            color: #ff5252;
        }
        
        .balance-card .value.neutral {
            color: #ff9800;
        }
        
        /* ===== FILTERS ===== */
        .filter-bar {
            background: #111827;
            border-radius: 12px;
            padding: 15px 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }
        
        .filter-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            flex: 1;
        }
        
        .filter-btn {
            padding: 6px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid transparent;
            border-radius: 20px;
            color: #a0a8c9;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
        }
        
        .filter-btn:hover {
            background: rgba(0, 255, 157, 0.1);
            color: #ffffff;
        }
        
        .filter-btn.active {
            background: rgba(0, 255, 157, 0.15);
            border-color: #00ff9d;
            color: #00ff9d;
        }
        
        .filter-search {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            color: #ffffff;
            font-size: 13px;
            min-width: 180px;
            transition: all 0.3s;
        }
        
        .filter-search:focus {
            outline: none;
            border-color: #00ff9d;
            background: rgba(0, 255, 157, 0.05);
        }
        
        .filter-search::placeholder {
            color: #6b7280;
        }
        
        /* ===== TRANSACTIONS LIST ===== */
        .transactions-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .transactions-header h2 {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .transactions-header h2 i {
            color: #00ff9d;
        }
        
        .transaction-count {
            font-size: 13px;
            color: #a0a8c9;
        }
        
        .transactions-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .transaction-item {
            background: #111827;
            border-radius: 12px;
            padding: 15px 18px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            gap: 15px;
            transition: all 0.3s;
            cursor: pointer;
        }
        
        .transaction-item:hover {
            border-color: #00ff9d33;
            transform: translateX(5px);
        }
        
        .transaction-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }
        
        .transaction-icon.deposit {
            background: rgba(0, 255, 157, 0.15);
            color: #00ff9d;
        }
        
        .transaction-icon.withdraw {
            background: rgba(255, 82, 82, 0.15);
            color: #ff5252;
        }
        
        .transaction-icon.bet {
            background: rgba(255, 152, 0, 0.15);
            color: #ff9800;
        }
        
        .transaction-icon.win {
            background: rgba(0, 255, 157, 0.2);
            color: #00ff9d;
        }
        
        .transaction-icon.loss {
            background: rgba(255, 82, 82, 0.2);
            color: #ff5252;
        }
        
        .transaction-icon.bonus {
            background: rgba(255, 215, 0, 0.15);
            color: #ffd700;
        }
        
        .transaction-icon.transfer {
            background: rgba(33, 150, 243, 0.15);
            color: #2196f3;
        }
        
        .transaction-icon.send {
            background: rgba(255, 152, 0, 0.15);
            color: #ff9800;
        }
        
        .transaction-icon.receive {
            background: rgba(0, 255, 157, 0.15);
            color: #00ff9d;
        }
        
        .transaction-info {
            flex: 1;
            min-width: 0;
        }
        
        .transaction-title {
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 4px;
        }
        
        .transaction-description {
            font-size: 12px;
            color: #a0a8c9;
        }
        
        .transaction-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 4px;
            flex-wrap: wrap;
        }
        
        .transaction-tag {
            font-size: 10px;
            padding: 2px 10px;
            border-radius: 12px;
            font-weight: 600;
        }
        
        .transaction-tag.completed {
            background: rgba(0, 255, 157, 0.15);
            color: #00ff9d;
        }
        
        .transaction-tag.pending {
            background: rgba(255, 152, 0, 0.15);
            color: #ff9800;
        }
        
        .transaction-tag.failed {
            background: rgba(255, 82, 82, 0.15);
            color: #ff5252;
        }
        
        .transaction-amount {
            font-size: 16px;
            font-weight: 700;
            text-align: right;
            flex-shrink: 0;
        }
        
        .transaction-amount.positive {
            color: #00ff9d;
        }
        
        .transaction-amount.negative {
            color: #ff5252;
        }
        
        .transaction-time {
            font-size: 11px;
            color: #6b7280;
            text-align: right;
            flex-shrink: 0;
            min-width: 60px;
        }
        
        /* ===== EMPTY STATE ===== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: #111827;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .empty-state i {
            font-size: 56px;
            color: #2a3442;
            margin-bottom: 20px;
        }
        
        .empty-state h3 {
            color: #a0a8c9;
            margin-bottom: 8px;
        }
        
        .empty-state p {
            color: #6b7280;
            font-size: 14px;
        }
        
        /* ===== LOADING ===== */
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(0, 255, 157, 0.1);
            border-top-color: #00ff9d;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loading-container {
            text-align: center;
            padding: 40px;
        }
        
        .loading-container p {
            color: #a0a8c9;
            margin-top: 12px;
            font-size: 14px;
        }
        
        /* ===== BOTTOM NAV ===== */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            background: #111827;
            padding: 12px;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            border-top: 1px solid rgba(0, 255, 157, 0.2);
            z-index: 99;
        }
        
        .nav-item {
            color: #a0a8c9;
            text-decoration: none;
            text-align: center;
            font-size: 10px;
            transition: all 0.3s;
            padding: 4px 8px;
        }
        
        .nav-item.active {
            color: #00ff9d;
        }
        
        .nav-item i {
            font-size: 20px;
            display: block;
            margin-bottom: 2px;
        }
        
        .nav-item:hover {
            color: #00ff9d;
            transform: translateY(-2px);
        }
        
        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .header {
                padding: 12px 15px;
            }
            
            .header-title {
                font-size: 16px;
            }
            
            .balance-cards {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            
            .balance-card .value {
                font-size: 18px;
            }
            
            .filter-bar {
                flex-direction: column;
                align-items: stretch;
                padding: 12px 15px;
            }
            
            .filter-group {
                justify-content: center;
            }
            
            .filter-search {
                width: 100%;
                min-width: unset;
            }
            
            .transaction-item {
                padding: 12px 14px;
                flex-wrap: wrap;
            }
            
            .transaction-amount {
                font-size: 14px;
                margin-left: auto;
            }
            
            .transaction-time {
                font-size: 10px;
                min-width: 50px;
            }
            
            .transaction-meta {
                gap: 8px;
            }
        }
        
        @media (max-width: 480px) {
            .balance-cards {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }
            
            .balance-card {
                padding: 14px;
            }
            
            .balance-card .value {
                font-size: 16px;
            }
            
            .header-title {
                font-size: 14px;
            }
            
            .balance-badge {
                padding: 6px 12px;
            }
            
            .balance-amount {
                font-size: 14px;
            }
            
            .transaction-icon {
                width: 36px;
                height: 36px;
                font-size: 14px;
            }
            
            .transaction-title {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== BOTTOM NAV ===== -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">

        <a href="games.html" class="nav-item">

    <script>
        // ============================================
        // WALLET PAGE - FULL TRANSACTION HISTORY
        // ============================================
        
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ===== STATE =====
        let allTransactions = [];
        let filteredTransactions = [];
        let currentFilter = 'all';
        let searchQuery = '';
        let currentUser = null;
        let isLoading = false;

        // ===== DOM ELEMENTS =====
        const container = document.getElementById('transactions-container');
        const headerBalance = document.getElementById('header-balance');
        const totalBalance = document.getElementById('total-balance');
        const totalDeposits = document.getElementById('total-deposits');
        const totalWithdrawals = document.getElementById('total-withdrawals');
        const netProfit = document.getElementById('net-profit');
        const transactionCount = document.getElementById('transaction-count');
        const refreshBtn = document.getElementById('refreshBtn');
        const searchInput = document.getElementById('searchInput');

        // ===== HELPERS =====
        function formatCurrency(amount) {
            return '$' + Math.abs(amount).toFixed(2);
        }

        function formatDate(timestamp) {
            if (!timestamp) return 'N/A';
            
            let date;
            if (timestamp.toDate) {
                date = timestamp.toDate();
            } else if (timestamp.seconds) {
                date = new Date(timestamp.seconds * 1000);
            } else {
                date = new Date(timestamp);
            }
            
            if (isNaN(date.getTime())) return 'N/A';
            
            const now = new Date();
            const diffMs = now - date;
            const diffMins = Math.floor(diffMs / 60000);
            const diffHours = Math.floor(diffMs / 3600000);
            const diffDays = Math.floor(diffMs / 86400000);
            
            if (diffMins < 1) return 'Just now';
            if (diffMins < 60) return diffMins + 'm ago';
            if (diffHours < 24) return diffHours + 'h ago';
            if (diffDays < 7) return diffDays + 'd ago';
            
            return date.toLocaleDateString('en-US', {
                month: 'short',
                day: 'numeric',
                year: 'numeric'
            });
        }

        function getTransactionIcon(type) {
            const icons = {
                deposit: 'fa-arrow-down',
                withdraw: 'fa-arrow-up',
                win: 'fa-trophy',
                loss: 'fa-times-circle',
                bet: 'fa-dice',
                bonus: 'fa-gift',
                transfer: 'fa-exchange-alt',
                send: 'fa-paper-plane',
                receive: 'fa-inbox',
                welcome_bonus: 'fa-gift',
                profit: 'fa-chart-line'
            };
            return icons[type] || 'fa-circle';
        }

        function getTransactionIconClass(type) {
            const classes = {
                deposit: 'deposit',
                withdraw: 'withdraw',
                win: 'win',
                loss: 'loss',
                bet: 'bet',
                bonus: 'bonus',
                transfer: 'transfer',
                send: 'send',
                receive: 'receive',
                welcome_bonus: 'bonus',
                profit: 'win'
            };
            return classes[type] || 'deposit';
        }

        function getTransactionTitle(transaction) {
            const type = transaction.type || 'unknown';
            const titles = {
                deposit: 'Deposit',
                withdraw: 'Withdrawal',
                win: 'Win',
                loss: 'Loss',
                bet: 'Bet',
                bonus: 'Bonus',
                transfer: 'Transfer',
                send: 'Send Money',
                receive: 'Receive Money',
                welcome_bonus: 'Welcome Bonus',
                profit: 'Profit'
            };
            return titles[type] || type.charAt(0).toUpperCase() + type.slice(1);
        }

        function getStatusClass(status) {
            const classes = {
                completed: 'completed',
                pending: 'pending',
                failed: 'failed',
                success: 'completed',
                active: 'completed'
            };
            return classes[status] || 'completed';
        }

        // ===== AUTH =====
        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            
            currentUser = user;
            await loadWalletData();
            setupEventListeners();
        });

        // ===== LOAD DATA =====
        async function loadWalletData() {
            if (!currentUser) return;
            
            isLoading = true;
            showLoading();
            
            try {
                // Load wallet balance
                const walletDoc = await db.collection('wallets').doc(currentUser.uid).get();
                const balance = walletDoc.exists ? (walletDoc.data().balance || 0) : 0;
                
                updateBalanceDisplay(balance);
                
                // Load transactions from wallet subcollection
                const transactionsRef = db.collection('wallets')
                    .doc(currentUser.uid)
                    .collection('transactions')
                    .orderBy('createdAt', 'desc');
                
                const snapshot = await transactionsRef.get();
                
                if (snapshot.empty) {
                    // Try loading from main transactions collection
                    await loadMainTransactions();
                } else {
                    allTransactions = [];
                    snapshot.forEach(doc => {
                        allTransactions.push({
                            id: doc.id,
                            ...doc.data()
                        });
                    });
                    
                    // Sort by timestamp
                    allTransactions.sort((a, b) => {
                        const timeA = a.createdAt?.toDate?.() || new Date(0);
                        const timeB = b.createdAt?.toDate?.() || new Date(0);
                        return timeB - timeA;
                    });
                    
                    renderTransactions();
                    updateStats();
                }
                
            } catch (error) {
                console.error('Error loading wallet data:', error);
                showError('Failed to load transactions. Please refresh.');
            } finally {
                isLoading = false;
            }
        }

        async function loadMainTransactions() {
            try {
                // Try main transactions collection
                const snapshot = await db.collection('transactions')
                    .where('userId', '==', currentUser.uid)
                    .orderBy('createdAt', 'desc')
                    .get();
                
                if (snapshot.empty) {
                    allTransactions = [];
                    renderTransactions();
                    updateStats();
                    return;
                }
                
                allTransactions = [];
                snapshot.forEach(doc => {
                    allTransactions.push({
                        id: doc.id,
                        ...doc.data()
                    });
                });
                
                renderTransactions();
                updateStats();
                
            } catch (error) {
                console.error('Error loading main transactions:', error);
                allTransactions = [];
                renderTransactions();
                updateStats();
            }
        }

        // ===== RENDER =====
        function renderTransactions() {
            applyFilters();
            
            if (filteredTransactions.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-receipt"></i>
                        <h3>No Transactions Found</h3>
                        <p>${allTransactions.length === 0 ? 'Start playing games to see your transaction history here.' : 'Try adjusting your filters.'}</p>
                    </div>
                `;
                transactionCount.textContent = '0 transactions';
                return;
            }
            
            let html = '<div class="transactions-list">';
            
            filteredTransactions.forEach((tx, index) => {
                const amount = tx.amount || 0;
                const isPositive = amount >= 0;
                const iconClass = getTransactionIconClass(tx.type);
                const icon = getTransactionIcon(tx.type);
                const title = getTransactionTitle(tx);
                const description = tx.description || tx.notes || '';
                const status = tx.status || 'completed';
                const time = formatDate(tx.createdAt);
                const txId = tx.transactionId || tx.id || `tx_${index}`;
                
                html += `
                    <div class="transaction-item" onclick="showTransactionDetails('${txId}')">
                        <div class="transaction-icon ${iconClass}">
                            <i class="fas ${icon}"></i>
                        </div>
                        <div class="transaction-info">
                            <div class="transaction-title">${title}</div>
                            <div class="transaction-description">${description || tx.type || 'Transaction'}</div>
                            <div class="transaction-meta">
                                <span class="transaction-tag ${getStatusClass(status)}">${status.toUpperCase()}</span>
                                ${tx.category ? `<span style="font-size:10px;color:#6b7280;">${tx.category}</span>` : ''}
                            </div>
                        </div>
                        <div class="transaction-amount ${isPositive ? 'positive' : 'negative'}">
                            ${isPositive ? '+' : '-'}${formatCurrency(amount)}
                        </div>
                        <div class="transaction-time">${time}</div>
                    </div>
                `;
            });
            
            html += '</div>';
            container.innerHTML = html;
            transactionCount.textContent = `${filteredTransactions.length} transactions`;
        }

        function updateStats() {
            let total = 0;
            let deposits = 0;
            let withdrawals = 0;
            let wins = 0;
            let losses = 0;
            
            allTransactions.forEach(tx => {
                const amount = tx.amount || 0;
                const type = tx.type || '';
                
                total += amount;
                
                if (type === 'deposit' || type === 'receive') {
                    deposits += amount > 0 ? amount : 0;
                } else if (type === 'withdraw' || type === 'send') {
                    withdrawals += amount < 0 ? Math.abs(amount) : 0;
                } else if (type === 'win' || type === 'profit' || type === 'welcome_bonus') {
                    wins += amount > 0 ? amount : 0;
                } else if (type === 'loss' || type === 'bet') {
                    losses += amount < 0 ? Math.abs(amount) : 0;
                }
            });
            
            totalBalance.textContent = formatCurrency(total);
            totalDeposits.textContent = formatCurrency(deposits);
            totalWithdrawals.textContent = formatCurrency(withdrawals);
            
            const net = wins - losses;
            netProfit.textContent = formatCurrency(net);
            netProfit.style.color = net >= 0 ? '#00ff9d' : '#ff5252';
        }

        function updateBalanceDisplay(balance) {
            const formatted = formatCurrency(balance);
            headerBalance.textContent = formatted;
            totalBalance.textContent = formatted;
        }

        function applyFilters() {
            let result = [...allTransactions];
            
            // Apply type filter
            if (currentFilter !== 'all') {
                result = result.filter(tx => {
                    const type = tx.type || '';
                    return type === currentFilter || 
                           (currentFilter === 'win' && (type === 'win' || type === 'profit')) ||
                           (currentFilter === 'loss' && (type === 'loss' || type === 'bet' && tx.amount < 0));
                });
            }
            
            // Apply search
            if (searchQuery.trim()) {
                const query = searchQuery.toLowerCase().trim();
                result = result.filter(tx => {
                    const description = (tx.description || '').toLowerCase();
                    const type = (tx.type || '').toLowerCase();
                    const notes = (tx.notes || '').toLowerCase();
                    const id = (tx.id || '').toLowerCase();
                    return description.includes(query) || 
                           type.includes(query) || 
                           notes.includes(query) || 
                           id.includes(query);
                });
            }
            
            filteredTransactions = result;
        }

        // ===== UI STATES =====
        function showLoading() {
            container.innerHTML = `
                <div class="loading-container">
                    <div class="loading-spinner"></div>
                    <p>Loading your transactions...</p>
                </div>
            `;
        }

        function showError(message) {
            container.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-exclamation-circle" style="color: #ff5252;"></i>
                    <h3>Error</h3>
                    <p>${message}</p>
                </div>
            `;
        }

        // ===== EVENT LISTENERS =====
        function setupEventListeners() {
            // Filter buttons
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentFilter = this.dataset.filter;
                    renderTransactions();
                });
            });
            
            // Search
            searchInput.addEventListener('input', function() {
                searchQuery = this.value;
                renderTransactions();
            });
            
            // Refresh
            refreshBtn.addEventListener('click', function() {
                const icon = this.querySelector('i');
                icon.style.transform = 'rotate(360deg)';
                icon.style.transition = 'transform 0.5s';
                loadWalletData();
                setTimeout(() => {
                    icon.style.transform = '';
                }, 500);
            });
        }

        // ===== TRANSACTION DETAILS =====
        window.showTransactionDetails = function(txId) {
            const tx = allTransactions.find(t => (t.transactionId || t.id) === txId);
            if (!tx) return;
            
            const amount = tx.amount || 0;
            const isPositive = amount >= 0;
            const type = getTransactionTitle(tx);
            const status = tx.status || 'completed';
            const time = tx.createdAt?.toDate?.() || new Date();
            
            alert(
                `📊 Transaction Details\n\n` +
                `Type: ${type}\n` +
                `Amount: ${isPositive ? '+' : '-'}$${Math.abs(amount).toFixed(2)}\n` +
                `Status: ${status.toUpperCase()}\n` +
                `Date: ${time.toLocaleString()}\n` +
                `Description: ${tx.description || 'N/A'}\n` +
                `ID: ${tx.transactionId || tx.id || 'N/A'}`
            );
        };

        // Auto-refresh every 60 seconds
        setInterval(() => {
            if (currentUser && !isLoading) {
                loadWalletData();
            }
        }, 60000);

        console.log('💳 Wallet page loaded successfully!');
        console.log('   📊 Transactions loaded from Firebase');
        console.log('   🔍 Search and filter your history');
    </script>
</body>
</html>
