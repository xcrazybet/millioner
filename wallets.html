</head>

    <script>
        // ============================================
        // WALLET PAGE - NO INDEXES REQUIRED
        // Fetches data without ordering queries
        // ============================================
        
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ===== STATE =====
        let allTransactions = [];
        let filteredTransactions = [];
        let currentFilter = 'all';
        let searchQuery = '';
        let currentUser = null;
        let isLoading = false;

        // ===== DOM ELEMENTS =====
        const container = document.getElementById('transactions-container');
        const headerBalance = document.getElementById('header-balance');
        const totalBalance = document.getElementById('total-balance');
        const totalDeposits = document.getElementById('total-deposits');
        const totalWithdrawals = document.getElementById('total-withdrawals');
        const netProfit = document.getElementById('net-profit');
        const transactionCount = document.getElementById('transaction-count');
        const refreshBtn = document.getElementById('refreshBtn');
        const searchInput = document.getElementById('searchInput');

        // ===== HELPERS =====
        function formatCurrency(amount) {
            return '$' + Math.abs(amount).toFixed(2);
        }

        function formatDate(timestamp) {
            if (!timestamp) return 'N/A';
            
            let date;
            if (timestamp && timestamp.toDate) {
                date = timestamp.toDate();
            } else if (timestamp && timestamp.seconds) {
                date = new Date(timestamp.seconds * 1000);
            } else if (typeof timestamp === 'string') {
                date = new Date(timestamp);
            } else if (timestamp instanceof Date) {
                date = timestamp;
            } else {
                date = new Date(timestamp);
            }
            
            if (isNaN(date.getTime())) return 'N/A';
            
            const now = new Date();
            const diffMs = now - date;
            const diffMins = Math.floor(diffMs / 60000);
            const diffHours = Math.floor(diffMs / 3600000);
            const diffDays = Math.floor(diffMs / 86400000);
            
            if (diffMins < 1) return 'Just now';
            if (diffMins < 60) return diffMins + 'm ago';
            if (diffHours < 24) return diffHours + 'h ago';
            if (diffDays < 7) return diffDays + 'd ago';
            
            return date.toLocaleDateString('en-US', {
                month: 'short',
                day: 'numeric',
                year: 'numeric'
            });
        }

        function getTransactionIcon(type) {
            const icons = {
                deposit: 'fa-arrow-down',
                withdraw: 'fa-arrow-up',
                bet_place: 'fa-dice',
                bet_win: 'fa-trophy',
                bet_lost: 'fa-times-circle',
                bonus: 'fa-gift',
                transfer: 'fa-exchange-alt',
                send: 'fa-paper-plane',
                receive: 'fa-inbox',
                slot: 'fa-gamepad',
                trade: 'fa-chart-line',
                shadow: 'fa-ghost',
                balance_adjustment: 'fa-adjust',
                bet: 'fa-dice',
                win: 'fa-trophy',
                loss: 'fa-times-circle'
            };
            return icons[type] || 'fa-circle';
        }

        function getTransactionIconClass(type) {
            const classes = {
                deposit: 'deposit',
                withdraw: 'withdraw',
                bet_place: 'bet_place',
                bet_win: 'bet_win',
                bet_lost: 'bet_lost',
                bonus: 'bonus',
                transfer: 'transfer',
                send: 'send',
                receive: 'receive',
                slot: 'slot',
                trade: 'trade',
                shadow: 'shadow',
                balance_adjustment: 'balance_adjustment',
                bet: 'bet_place',
                win: 'bet_win',
                loss: 'bet_lost'
            };
            return classes[type] || 'deposit';
        }

        function getTransactionTitle(transaction) {
            const type = transaction.type || 'unknown';
            const titles = {
                deposit: 'Deposit',
                withdraw: 'Withdrawal',
                bet_place: 'Bet Placed',
                bet_win: 'Bet Won',
                bet_lost: 'Bet Lost',
                bonus: 'Bonus Received',
                transfer: 'Transfer',
                send: 'Money Sent',
                receive: 'Money Received',
                slot: 'Slot Game',
                trade: 'Trade',
                shadow: 'Shadow Bet',
                balance_adjustment: 'Balance Adjustment',
                bet: 'Bet',
                win: 'Win',
                loss: 'Loss'
            };
            return titles[type] || type.replace('_', ' ').toUpperCase();
        }

        function getStatusClass(status) {
            const classes = {
                completed: 'completed',
                pending: 'pending',
                failed: 'failed',
                success: 'completed',
                active: 'active',
                cancelled: 'cancelled',
                win: 'completed',
                loss: 'failed',
                won: 'completed',
                lost: 'failed'
            };
            return classes[status] || 'completed';
        }

        // ===== AUTH =====
        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            
            currentUser = user;
            await loadAllTransactions();
            setupEventListeners();
        });

        // ===== LOAD ALL TRANSACTIONS - NO INDEXES REQUIRED =====
        async function loadAllTransactions() {
            if (!currentUser) return;
            
            isLoading = true;
            showLoading();
            
            allTransactions = [];
            
            try {
                // 1. TRANSACTIONS COLLECTION - Simple query without ordering
                await loadCollectionSimple('transactions', 'user_id');
                await loadCollectionSimple('transactions', 'userId');
                
                // 2. WALLET_TRANSACTIONS
                await loadCollectionSimple('wallet_transactions', 'user_id');
                await loadCollectionSimple('wallet_transactions', 'userId');
                
                // 3. USER_ACTIVITIES
                await loadCollectionSimple('user_activities', 'user_id');
                await loadCollectionSimple('user_activities', 'userId');
                
                // 4. BETS
                await loadCollectionSimple('bets', 'user_id');
                await loadCollectionSimple('bets', 'userId');
                
                // 5. SLOT_HISTORY
                await loadCollectionSimple('slot_history', 'user_id');
                await loadCollectionSimple('slot_history', 'userId');
                
                // 6. TRADES
                await loadCollectionSimple('trades', 'user_id');
                await loadCollectionSimple('trades', 'userId');
                
                // 7. SHADOW_HISTORY
                await loadCollectionSimple('shadow_history', 'user_id');
                await loadCollectionSimple('shadow_history', 'userId');
                
                // 8. WALLETS (for balance)
                await loadWalletBalance();
                
                // 9. Also try to get transactions from wallet subcollection
                await loadWalletSubcollection();
                
                // Sort all transactions by date (newest first) - in JavaScript
                allTransactions.sort((a, b) => {
                    const timeA = getTimestamp(a);
                    const timeB = getTimestamp(b);
                    return timeB - timeA;
                });
                
                // Update UI
                renderTransactions();
                updateStats();
                
                console.log(`✅ Loaded ${allTransactions.length} total transactions`);
                
                if (allTransactions.length === 0) {
                    console.log('⚠️ No transactions found. Check if user has data in any collection.');
                }
                
            } catch (error) {
                console.error('Error loading transactions:', error);
                showError('Failed to load transactions. Please refresh.');
            } finally {
                isLoading = false;
            }
        }

        // ----- Simple Collection Loader (NO INDEX REQUIRED) -----
        async function loadCollectionSimple(collectionName, userIdField) {
            try {
                const snapshot = await db.collection(collectionName)
                    .where(userIdField, '==', currentUser.uid)
                    .limit(2000)
                    .get();
                
                if (snapshot.empty) return;
                
                let count = 0;
                snapshot.forEach(doc => {
                    const data = doc.data();
                    
                    // Skip if already loaded (prevent duplicates)
                    if (allTransactions.some(t => t.id === doc.id && t.collection === collectionName)) {
                        return;
                    }
                    
                    // Determine type
                    let type = data.type || data.action || collectionName;
                    
                    // Map common types
                    if (type === 'bet_placed') type = 'bet_place';
                    else if (type === 'bet_won' || type === 'win') type = 'bet_win';
                    else if (type === 'bet_lost' || type === 'loss') type = 'bet_lost';
                    
                    // Determine amount
                    let amount = data.amount || data.balance_change || data.value || 0;
                    
                    // For bet_place, amount is negative (money going out)
                    if (type === 'bet_place' || type === 'bet' || type === 'bet_placed') {
                        amount = -Math.abs(amount);
                    }
                    
                    // For withdraw, amount is negative
                    if (type === 'withdraw' || type === 'withdrawal') {
                        amount = -Math.abs(amount);
                    }
                    
                    // For win, amount is positive
                    if (type === 'bet_win' || type === 'win') {
                        amount = Math.abs(amount);
                    }
                    
                    // For loss, amount is negative
                    if (type === 'bet_lost' || type === 'loss') {
                        amount = -Math.abs(amount);
                    }
                    
                    // Get timestamp
                    let timestamp = data.timestamp || data.createdAt || data.placed_at || data.time || data.date || new Date();
                    
                    allTransactions.push({
                        id: doc.id,
                        type: type,
                        amount: amount,
                        description: data.description || data.notes || data.action || data.type || collectionName,
                        status: data.status || data.result || 'completed',
                        createdAt: timestamp,
                        source: 'firebase',
                        collection: collectionName,
                        balance_before: data.balance_before || data.balanceBefore || data.previous_balance || 0,
                        balance_after: data.balance_after || data.balanceAfter || data.new_balance || 0,
                        rawData: data
                    });
                    count++;
                });
                
                console.log(`📊 ${collectionName} (${userIdField}): ${count} transactions`);
                
            } catch (error) {
                // Silently fail - some collections might not exist or have different field names
                console.log(`⚠️ Could not load from ${collectionName} with ${userIdField}:`, error.message);
            }
        }

        // ----- Wallet Subcollection -----
        async function loadWalletSubcollection() {
            try {
                const walletRef = db.collection('wallets').doc(currentUser.uid);
                const snapshot = await walletRef.collection('transactions')
                    .limit(2000)
                    .get();
                
                snapshot.forEach(doc => {
                    const data = doc.data();
                    
                    if (allTransactions.some(t => t.id === doc.id && t.collection === 'wallet_sub')) {
                        return;
                    }
                    
                    let type = data.type || 'transaction';
                    let amount = data.amount || 0;
                    
                    if (type === 'withdraw' || type === 'bet' || type === 'bet_place') {
                        amount = -Math.abs(amount);
                    }
                    
                    allTransactions.push({
                        id: doc.id,
                        type: type,
                        amount: amount,
                        description: data.description || data.notes || 'Wallet transaction',
                        status: data.status || 'completed',
                        createdAt: data.createdAt || data.timestamp || new Date(),
                        source: 'firebase',
                        collection: 'wallet_sub',
                        balance_before: data.balance_before || data.previousBalance || 0,
                        balance_after: data.balance_after || data.newBalance || 0,
                        rawData: data
                    });
                });
                
                console.log(`📊 wallet_sub: ${snapshot.size} transactions`);
                
            } catch (error) {
                console.log('⚠️ Could not load from wallet subcollection:', error.message);
            }
        }

        // ----- Wallet Balance -----
        async function loadWalletBalance() {
            try {
                const doc = await db.collection('wallets').doc(currentUser.uid).get();
                if (doc.exists) {
                    const balance = doc.data().balance || 0;
                    const formatted = formatCurrency(balance);
                    headerBalance.textContent = formatted;
                    totalBalance.textContent = formatted;
                }
            } catch (error) {
                console.log('⚠️ Could not load wallet balance:', error.message);
            }
        }

        function getTimestamp(tx) {
            if (!tx) return 0;
            
            // Try various timestamp fields
            const fields = ['createdAt', 'timestamp', 'placed_at', 'time', 'date', 'updatedAt'];
            
            for (const field of fields) {
                const val = tx[field];
                if (val) {
                    if (val.toDate) return val.toDate().getTime();
                    if (val.seconds) return val.seconds * 1000;
                    if (typeof val === 'string') return new Date(val).getTime();
                    if (val instanceof Date) return val.getTime();
                    if (typeof val === 'number') return val;
                }
            }
            
            // If no timestamp found, use current time
            return Date.now();
        }

        // ===== RENDER =====
        function renderTransactions() {
            applyFilters();
            
            if (filteredTransactions.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-receipt"></i>
                        <h3>No Transactions Found</h3>
                        <p>${allTransactions.length === 0 ? 'No transactions found. Start playing or make a deposit!' : 'Try adjusting your filters or search.'}</p>
                    </div>
                `;
                transactionCount.textContent = '0 transactions';
                return;
            }
            
            let html = '<div class="transactions-list">';
            
            // Show first 200 transactions for performance
            const displayTransactions = filteredTransactions.slice(0, 200);
            
            displayTransactions.forEach((tx, index) => {
                const amount = tx.amount || 0;
                const isPositive = amount >= 0;
                const iconClass = getTransactionIconClass(tx.type);
                const icon = getTransactionIcon(tx.type);
                const title = getTransactionTitle(tx);
                const description = tx.description || tx.notes || '';
                const status = tx.status || 'completed';
                const time = formatDate(tx.createdAt);
                const txId = tx.id || `tx_${index}`;
                const sourceLabel = tx.collection || 'unknown';
                
                // Show balance before/after if available
                let balanceInfo = '';
                if (tx.balance_before !== undefined && tx.balance_before !== 0 && tx.balance_after !== undefined && tx.balance_after !== 0) {
                    const before = tx.balance_before || 0;
                    const after = tx.balance_after || 0;
                    balanceInfo = `<span class="transaction-balance">${formatCurrency(before)} → ${formatCurrency(after)}</span>`;
                }
                
                html += `
                    <div class="transaction-item" onclick="showTransactionDetails('${txId}')">
                        <div class="transaction-icon ${iconClass}">
                            <i class="fas ${icon}"></i>
                        </div>
                        <div class="transaction-info">
                            <div class="transaction-title">${title}</div>
                            <div class="transaction-description">${description || tx.type || 'Transaction'}</div>
                            <div class="transaction-meta">
                                <span class="transaction-tag ${getStatusClass(status)}">${(status || 'completed').toUpperCase()}</span>
                                <span style="font-size:9px;color:#6b7280;">${sourceLabel}</span>
                            </div>
                        </div>
                        ${balanceInfo}
                        <div class="transaction-amount ${isPositive ? 'positive' : 'negative'}">
                            ${isPositive ? '+' : '-'}${formatCurrency(amount)}
                        </div>
                        <div class="transaction-time">${time}</div>
                    </div>
                `;
            });
            
            // Show "load more" if there are more transactions
            if (filteredTransactions.length > 200) {
                html += `
                    <div style="text-align:center;padding:15px;color:#6b7280;font-size:12px;">
                        Showing 200 of ${filteredTransactions.length} transactions. Refine your search to see more.
                    </div>
                `;
            }
            
            html += '</div>';
            container.innerHTML = html;
            transactionCount.textContent = `${filteredTransactions.length} transactions`;
        }

        function updateStats() {
            let total = 0;
            let deposits = 0;
            let withdrawals = 0;
            let wins = 0;
            let losses = 0;
            let bonuses = 0;
            
            allTransactions.forEach(tx => {
                const amount = tx.amount || 0;
                const type = tx.type || '';
                
                total += amount;
                
                if (type === 'deposit' || type === 'receive' || type === 'deposit_money') {
                    deposits += amount > 0 ? amount : 0;
                } else if (type === 'withdraw' || type === 'send' || type === 'withdraw_money') {
                    withdrawals += amount < 0 ? Math.abs(amount) : 0;
                } else if (type === 'bet_win' || type === 'win' || type === 'profit') {
                    wins += amount > 0 ? amount : 0;
                } else if (type === 'bet_lost' || type === 'loss' || (type === 'bet_place' && amount < 0)) {
                    losses += amount < 0 ? Math.abs(amount) : 0;
                } else if (type === 'bonus' || type === 'welcome_bonus') {
                    bonuses += amount > 0 ? amount : 0;
                }
            });
            
            totalDeposits.textContent = formatCurrency(deposits);
            totalWithdrawals.textContent = formatCurrency(withdrawals);
            
            const net = (wins + bonuses) - losses;
            netProfit.textContent = formatCurrency(net);
            netProfit.style.color = net >= 0 ? '#00ff9d' : '#ff5252';
        }

        function applyFilters() {
            let result = [...allTransactions];
            
            // Apply type filter
            if (currentFilter !== 'all') {
                result = result.filter(tx => {
                    const type = tx.type || '';
                    return type === currentFilter || 
                           (currentFilter === 'bet_place' && (type === 'bet_place' || type === 'bet')) ||
                           (currentFilter === 'bet_win' && (type === 'bet_win' || type === 'win')) ||
                           (currentFilter === 'bet_lost' && (type === 'bet_lost' || type === 'loss'));
                });
            }
            
            // Apply search
            if (searchQuery.trim()) {
                const query = searchQuery.toLowerCase().trim();
                result = result.filter(tx => {
                    const description = (tx.description || '').toLowerCase();
                    const type = (tx.type || '').toLowerCase();
                    const notes = (tx.notes || '').toLowerCase();
                    const id = (tx.id || '').toLowerCase();
                    const collection = (tx.collection || '').toLowerCase();
                    return description.includes(query) || 
                           type.includes(query) || 
                           notes.includes(query) || 
                           id.includes(query) ||
                           collection.includes(query);
                });
            }
            
            filteredTransactions = result;
        }

        // ===== UI STATES =====
        function showLoading() {
            container.innerHTML = `
                <div class="loading-container">
                    <div class="loading-spinner"></div>
                    <p>Loading your transaction history from all collections...</p>
                </div>
            `;
        }

        function showError(message) {
            container.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-exclamation-circle" style="color: #ff5252;"></i>
                    <h3>Error</h3>
                    <p>${message}</p>
                </div>
            `;
        }

        // ===== EVENT LISTENERS =====
        function setupEventListeners() {
            // Filter buttons
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentFilter = this.dataset.filter;
                    renderTransactions();
                });
            });
            
            // Search
            searchInput.addEventListener('input', function() {
                searchQuery = this.value;
                renderTransactions();
            });
            
            // Refresh
            refreshBtn.addEventListener('click', function() {
                const icon = this.querySelector('i');
                icon.style.transform = 'rotate(360deg)';
                icon.style.transition = 'transform 0.5s';
                loadAllTransactions();
                setTimeout(() => {
                    icon.style.transform = '';
                }, 500);
            });
        }

        // ===== TRANSACTION DETAILS =====
        window.showTransactionDetails = function(txId) {
            const tx = allTransactions.find(t => t.id === txId);
            if (!tx) return;
            
            const amount = tx.amount || 0;
            const isPositive = amount >= 0;
            const type = getTransactionTitle(tx);
            const status = tx.status || 'completed';
            const time = new Date(getTimestamp(tx));
            
            let details = [
                `📊 Transaction Details`,
                ``,
                `Type: ${type}`,
                `Amount: ${isPositive ? '+' : '-'}$${Math.abs(amount).toFixed(2)}`,
                `Status: ${status.toUpperCase()}`,
                `Source: ${tx.collection || 'Unknown'}`,
                `Date: ${time instanceof Date && !isNaN(time) ? time.toLocaleString() : 'N/A'}`,
                `Description: ${tx.description || tx.notes || 'N/A'}`,
                `ID: ${tx.id || 'N/A'}`
            ];
            
            // Add balance info
            if (tx.balance_before !== undefined && tx.balance_before !== 0) {
                details.push(``);
                details.push(`--- Balance Info ---`);
                if (tx.balance_before !== undefined) details.push(`Before: $${tx.balance_before.toFixed(2)}`);
                if (tx.balance_after !== undefined) details.push(`After: $${tx.balance_after.toFixed(2)}`);
            }
            
            alert(details.join('\n'));
        };

        // Auto-refresh every 60 seconds
        setInterval(() => {
            if (currentUser && !isLoading) {
                loadAllTransactions();
            }
        }, 60000);

        console.log('💳 Wallet page loaded successfully!');
        console.log('   📊 Reading from all collections without indexes');
        console.log('   🔍 Search and filter your history');
        console.log('   📈 Tracking: deposits, withdrawals, bets, wins, losses, bonuses, slots, trades');
    </script>
</body>
</html>
