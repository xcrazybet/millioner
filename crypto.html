    // ===== ENHANCED REAL-TIME PRICE UPDATER (FROM FIRST CODE) =====
    class RealTimePriceUpdater {
        constructor() {
            // Multiple API endpoints for redundancy
            this.APIs = {
                primary: 'https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=50&sparkline=true',
                backup1: 'https://api.coinpaprika.com/v1/tickers',
                backup2: 'https://api.binance.com/api/v3/ticker/24hr'
            };
            
            this.updateInterval = null;
            this.isConnected = true;
            this.lastUpdateTime = null;
            this.retryCount = 0;
            this.maxRetries = 3;
            
            // Price cache with timestamps
            this.priceCache = {};
            this.cacheDuration = 30000; // 30 seconds
            
            this.init();
        }
        
        init() {
            this.startRealTimeUpdates();
            this.setupConnectionMonitoring();
        }
        
        startRealTimeUpdates() {
            // Initial load
            this.fetchPrices();
            
            // Update every 60 seconds
            this.updateInterval = setInterval(() => {
                this.fetchPrices();
            }, 60000);
            
            // Also update Bitcoin price every 10 seconds for better UX
            setInterval(() => {
                this.updateBitcoinPrice();
            }, 10000);
        }
        
        async fetchPrices() {
            try {
                console.log('Fetching real-time crypto prices...');
                
                // Use cache if available and not expired
                if (this.priceCache.data && 
                    Date.now() - this.priceCache.timestamp < this.cacheDuration) {
                    console.log('Using cached prices');
                    this.processPriceData(this.priceCache.data);
                    return;
                }
                
                const response = await fetch(`${this.APIs.primary}&t=${Date.now()}`, {
                    headers: {
                        'Accept': 'application/json',
                        'Cache-Control': 'no-cache'
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    
                    // Cache the data
                    this.priceCache = {
                        data: data,
                        timestamp: Date.now()
                    };
                    
                    this.processPriceData(data);
                    this.retryCount = 0;
                    this.isConnected = true;
                    this.lastUpdateTime = new Date();
                    this.updateConnectionStatus();
                    
                    console.log('Prices updated successfully');
                    
                } else {
                    throw new Error(`API responded with ${response.status}`);
                }
                
            } catch (error) {
                console.log('API fetch failed, trying backup...', error);
                this.retryCount++;
                
                if (this.retryCount <= this.maxRetries) {
                    await this.fetchBackupPrices();
                } else {
                    this.useSimulatedUpdates();
                }
            }
        }
        
        async fetchBackupPrices() {
            try {
                const response = await fetch(this.APIs.backup2 + '?t=' + Date.now());
                const data = await response.json();
                
                // Process Binance data
                const processedData = this.processBinanceData(data);
                this.processPriceData(processedData);
                this.isConnected = true;
                
            } catch (error) {
                console.log('Backup API failed, using simulated data');
                this.useSimulatedUpdates();
            }
        }
        
        processBinanceData(binanceData) {
            // Map Binance symbols to our crypto IDs
            const symbolMap = {
                'BTCUSDT': 'bitcoin',
                'ETHUSDT': 'ethereum',
                'BNBUSDT': 'binancecoin',
                'SOLUSDT': 'solana',
                'XRPUSDT': 'ripple',
                'ADAUSDT': 'cardano',
                'AVAXUSDT': 'avalanche-2',
                'DOGEUSDT': 'dogecoin',
                'DOTUSDT': 'polkadot',
                'LINKUSDT': 'chainlink',
                'LTCUSDT': 'litecoin',
                'MATICUSDT': 'polygon',
                'SHIBUSDT': 'shiba-inu',
                'UNIUSDT': 'uniswap'
            };
            
            const processedData = [];
            
            binanceData.forEach(ticker => {
                const cryptoId = symbolMap[ticker.symbol];
                if (cryptoId) {
                    processedData.push({
                        id: cryptoId,
                        symbol: ticker.symbol.replace('USDT', '').toLowerCase(),
                        current_price: parseFloat(ticker.lastPrice),
                        price_change_percentage_24h: parseFloat(ticker.priceChangePercent),
                        market_cap: parseFloat(ticker.quoteVolume) || 0,
                        total_volume: parseFloat(ticker.volume) || 0,
                        sparkline_in_7d: { price: [] }
                    });
                }
            });
            
            return processedData;
        }
        
        async updateBitcoinPrice() {
            try {
                const response = await fetch(
                    `https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd&include_24h_change=true&t=${Date.now()}`
                );
                
                if (response.ok) {
                    const data = await response.json();
                    if (data.bitcoin) {
                        this.updateSinglePrice('bitcoin', data.bitcoin.usd, data.bitcoin.usd_24h_change);
                    }
                }
            } catch (error) {
                // Silently fail for Bitcoin updates
            }
        }
        
        processPriceData(data) {
            if (!Array.isArray(data)) return;
            
            const priceUpdates = {};
            
            data.forEach(item => {
                const cryptoId = item.id;
                const price = item.current_price;
                const change = item.price_change_percentage_24h;
                
                if (cryptoId && price !== undefined) {
                    priceUpdates[cryptoId] = {
                        usd: price,
                        usd_24h_change: change,
                        last_updated: new Date().toISOString(),
                        market_cap: item.market_cap,
                        total_volume: item.total_volume
                    };
                }
            });
            
            // Update app state
            if (window.appState && window.appState.currentPrices) {
                const oldPrices = { ...window.appState.currentPrices };
                window.appState.currentPrices = { ...oldPrices, ...priceUpdates };
                
                // Trigger UI updates
                this.triggerUIUpdates(oldPrices, priceUpdates);
            }
        }
        
        updateSinglePrice(cryptoId, price, change) {
            if (!window.appState || !window.appState.currentPrices) return;
            
            const oldPrice = window.appState.currentPrices[cryptoId]?.usd;
            
            // Only update if price changed significantly (more than 0.01%)
            if (oldPrice && Math.abs((price - oldPrice) / oldPrice * 100) < 0.01) {
                return;
            }
            
            window.appState.currentPrices[cryptoId] = {
                ...window.appState.currentPrices[cryptoId],
                usd: price,
                usd_24h_change: change,
                last_updated: new Date().toISOString()
            };
            
            // Update UI for this specific crypto
            this.updateCryptoCard(cryptoId, price, change);
            
            // Update charts if this is the selected crypto
            if (window.appState && cryptoId === window.appState.selectedCrypto) {
                if (typeof updateChart === 'function') {
                    updateChart(cryptoId);
                }
            }
        }
        
        triggerUIUpdates(oldPrices, newPrices) {
            // Update crypto grid with animations
            if (typeof displayCryptoGrid === 'function') {
                window.appState.previousPrices = oldPrices;
                displayCryptoGrid();
            }
            
            // Update all forms
            if (typeof updateAllPriceDisplays === 'function') {
                updateAllPriceDisplays();
            }
            
            // Update portfolio
            if (typeof updateClientAssetsDisplay === 'function') {
                updateClientAssetsDisplay();
            }
            
            // Update assets summary
            if (typeof updateAssetsSummary === 'function') {
                const assets = window.appState.clientAssets || [];
                updateAssetsSummary(assets);
            }
            
            // Show update toast (but not too frequently)
            const now = new Date();
            if (!this.lastUpdateTime || (now - this.lastUpdateTime) > 30000) {
                if (typeof showToast === 'function') {
                    showToast('Market prices updated', 'info', 2000);
                }
                this.lastUpdateTime = now;
            }
        }
        
        updateCryptoCard(cryptoId, newPrice, change) {
            const card = document.querySelector(`.crypto-card[data-id="${cryptoId}"]`);
            if (!card) return;
            
            const priceElement = card.querySelector('.price-value');
            const changeElement = card.querySelector('.price-change');
            
            if (priceElement) {
                const oldPriceText = priceElement.textContent.replace('$', '').replace(/,/g, '');
                const oldPrice = parseFloat(oldPriceText);
                
                if (!isNaN(oldPrice) && oldPrice !== newPrice) {
                    // Add animation class
                    priceElement.classList.add(newPrice > oldPrice ? 'price-up' : 'price-down');
                    
                    // Update price
                    priceElement.textContent = `$${formatPrice(newPrice)}`;
                    
                    // Remove animation class after animation completes
                    setTimeout(() => {
                        priceElement.classList.remove('price-up', 'price-down');
                    }, 1000);
                }
            }
            
            if (changeElement && change !== undefined) {
                changeElement.textContent = `${change >= 0 ? '↗' : '↘'} ${Math.abs(change).toFixed(2)}%`;
                changeElement.className = `price-change ${change >= 0 ? 'up' : 'down'}`;
            }
        }
        
        useSimulatedUpdates() {
            console.log('Using simulated price updates');
            
            const simulatedUpdates = {};
            const cryptos = window.cryptocurrencies || [];
            
            cryptos.forEach(crypto => {
                if (!crypto.mockPrice) return;
                
                // Add small random variation (±2%)
                const variation = (Math.random() - 0.5) * 0.04;
                const newPrice = crypto.mockPrice * (1 + variation);
                const change = crypto.mockChange + (Math.random() - 0.5) * 2;
                
                simulatedUpdates[crypto.id] = {
                    usd: newPrice,
                    usd_24h_change: change,
                    last_updated: new Date().toISOString()
                };
            });
            
            this.processPriceData(Object.values(simulatedUpdates));
            this.isConnected = false;
            this.updateConnectionStatus();
        }
        
        setupConnectionMonitoring() {
            // Monitor online/offline status
            window.addEventListener('online', () => {
                this.isConnected = true;
                this.updateConnectionStatus();
                this.fetchPrices(); // Immediate refresh when back online
            });
            
            window.addEventListener('offline', () => {
                this.isConnected = false;
                this.updateConnectionStatus();
            });
            
            // Heartbeat every 30 seconds to check connection
            setInterval(() => {
                if (navigator.onLine && !this.isConnected) {
                    this.isConnected = true;
                    this.updateConnectionStatus();
                }
            }, 30000);
        }
        
        updateConnectionStatus() {
            const statusElement = document.getElementById('connectionStatus');
            if (!statusElement) return;
            
            if (this.isConnected) {
                statusElement.innerHTML = `<span style="color: var(--success);">✓ LIVE</span>`;
                statusElement.title = 'Connected to real-time data';
            } else {
                statusElement.innerHTML = `<span style="color: var(--warning);">⚠ SIMULATED</span>`;
                statusElement.title = 'Using simulated data - Check connection';
            }
            
            // Update last update time
            const lastUpdateElement = document.getElementById('lastUpdateTime');
            if (lastUpdateElement) {
                const now = new Date();
                lastUpdateElement.textContent = now.toLocaleTimeString();
            }
        }
        
        // Optimized for mobile devices
        optimizeForMobile() {
            // Reduce update frequency on mobile to save battery
            if (/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
                console.log('Mobile device detected, optimizing updates...');
                
                // Clear existing intervals
                if (this.updateInterval) {
                    clearInterval(this.updateInterval);
                }
                
                // Update every 90 seconds on mobile instead of 60
                this.updateInterval = setInterval(() => {
                    this.fetchPrices();
                }, 90000);
                
                // Update Bitcoin every 30 seconds instead of 10
                if (this.btcUpdateInterval) {
                    clearInterval(this.btcUpdateInterval);
                }
                this.btcUpdateInterval = setInterval(() => {
                    this.updateBitcoinPrice();
                }, 30000);
                
                // Use smaller cache for mobile
                this.cacheDuration = 60000; // 1 minute
            }
        }
    }

    // ===== MODIFIED UTILITY FUNCTION =====
    function formatPrice(price) {
        if (price === undefined || price === null) return '0.00';
        if (price < 0.01) return price.toFixed(8);
        if (price < 1) return price.toFixed(6);
        if (price < 10) return price.toFixed(4);
        if (price < 1000) return price.toFixed(2);
        if (price < 1000000) return price.toLocaleString('en-US', { 
            minimumFractionDigits: 0, 
            maximumFractionDigits: 0 
        });
        
        // For very large numbers, use abbreviations
        if (price >= 1e12) return `$${(price / 1e12).toFixed(2)}T`;
        if (price >= 1e9) return `$${(price / 1e9).toFixed(2)}B`;
        if (price >= 1e6) return `$${(price / 1e6).toFixed(2)}M`;
        return `$${(price / 1e3).toFixed(1)}K`;
    }

    // ===== MODIFIED LOADING FUNCTION =====
    async function loadCryptoPrices() {
        try {
            // Show loading state
            const loadingElement = document.getElementById('loadingPrices');
            if (loadingElement) {
                loadingElement.style.display = 'flex';
            }
            
            // Use real-time updater if available
            if (window.priceUpdater) {
                await window.priceUpdater.fetchPrices();
            } else {
                // Fallback to original method
                await new Promise(resolve => setTimeout(resolve, 1000));
                
                const mockPrices = {};
                cryptocurrencies.forEach(crypto => {
                    mockPrices[crypto.id] = { 
                        usd: crypto.mockPrice, 
                        usd_24h_change: crypto.mockChange,
                        last_updated: new Date().toISOString()
                    };
                });
                
                appState.currentPrices = mockPrices;
                displayCryptoGrid();
                updateAllPriceDisplays();
                updateChart(appState.selectedCrypto);
                updateClientAssetsDisplay();
            }
            
            // Hide loading state
            if (loadingElement) {
                loadingElement.style.display = 'none';
            }
            
            showToast('Prices updated successfully', 'success');
            
        } catch (error) {
            console.error('Error loading crypto prices:', error);
            
            // Hide loading state
            const loadingElement = document.getElementById('loadingPrices');
            if (loadingElement) {
                loadingElement.style.display = 'none';
            }
            
            // Use simulated data as fallback
            const mockPrices = {};
            cryptocurrencies.forEach(crypto => {
                mockPrices[crypto.id] = { 
                    usd: crypto.mockPrice, 
                    usd_24h_change: crypto.mockChange,
                    last_updated: new Date().toISOString()
                };
            });
            
            appState.currentPrices = mockPrices;
            displayCryptoGrid();
            updateAllPriceDisplays();
            updateChart(appState.selectedCrypto);
            updateClientAssetsDisplay();
            
            showToast('Using simulated market data', 'warning');
        }
    }

    // ===== MODIFIED DISPLAY CRYPTO GRID =====
    function displayCryptoGrid() {
        const container = document.getElementById('cryptoGrid');
        if (!container) return;
        
        container.innerHTML = '';
        
        let filteredCryptos = cryptocurrencies;
        
        // Apply filters
        if (appState.filters.active !== 'all') {
            filteredCryptos = cryptocurrencies.filter(crypto => {
                if (appState.filters.active === 'top') {
                    return ['bitcoin', 'ethereum', 'binancecoin', 'solana', 'ripple'].includes(crypto.id);
                } else if (appState.filters.active === 'gainers') {
                    const change = appState.currentPrices[crypto.id]?.usd_24h_change || crypto.mockChange;
                    return change > 0;
                } else if (appState.filters.active === 'losers') {
                    const change = appState.currentPrices[crypto.id]?.usd_24h_change || crypto.mockChange;
                    return change < 0;
                } else if (appState.filters.active === 'defi') {
                    return crypto.category === 'defi';
                } else if (appState.filters.active === 'ai') {
                    return crypto.category === 'ai';
                } else if (appState.filters.active === 'meme') {
                    return crypto.category === 'meme';
                }
                return true;
            });
        }
        
        // Apply search
        if (appState.filters.search) {
            const searchLower = appState.filters.search.toLowerCase();
            filteredCryptos = filteredCryptos.filter(crypto => 
                crypto.name.toLowerCase().includes(searchLower) || 
                crypto.symbol.toLowerCase().includes(searchLower)
            );
        }
        
        filteredCryptos.forEach(crypto => {
            const priceData = appState.currentPrices[crypto.id];
            const price = priceData?.usd || crypto.mockPrice || 0;
            const change = priceData?.usd_24h_change || crypto.mockChange || 0;
            const isSelected = crypto.id === appState.selectedCrypto;
            
            // Check for price change animation
            const previousPrice = appState.previousPrices[crypto.id];
            let priceAnimation = '';
            
            if (previousPrice !== undefined) {
                const priceDiff = ((price - previousPrice) / previousPrice) * 100;
                if (Math.abs(priceDiff) > 0.1) { // Only animate significant changes
                    priceAnimation = price > previousPrice ? 'price-up' : 'price-down';
                }
            }
            
            const card = document.createElement('div');
            card.className = `crypto-card ${isSelected ? 'active' : ''}`;
            card.dataset.id = crypto.id;
            
            card.innerHTML = `
                <div class="crypto-header">
                    <div class="crypto-icon" style="color: ${crypto.color};">
                        <i class="${crypto.icon}"></i>
                    </div>
                    <div class="crypto-info">
                        <div class="crypto-symbol">${crypto.symbol}</div>
                        <div class="crypto-name">${crypto.name}</div>
                    </div>
                </div>
                <div class="crypto-price">
                    <div class="price-value ${priceAnimation}">$${formatPrice(price)}</div>
                    <div class="price-change ${change >= 0 ? 'up' : 'down'}">
                        ${change >= 0 ? '↗' : '↘'} ${Math.abs(change).toFixed(2)}%
                    </div>
                </div>
            `;
            
            card.addEventListener('click', () => selectCrypto(crypto.id));
            container.appendChild(card);
            
            // Update previous price
            appState.previousPrices[crypto.id] = price;
            
            // Remove animation class after animation completes
            if (priceAnimation) {
                setTimeout(() => {
                    const priceElement = card.querySelector('.price-value');
                    if (priceElement) {
                        priceElement.classList.remove('price-up', 'price-down');
                    }
                }, 1000);
            }
        });
        
        // If no cryptos match filter, show message
        if (filteredCryptos.length === 0) {
            container.innerHTML = `
                <div style="grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--text-dim);">
                    <i class="fas fa-search" style="font-size: 32px; margin-bottom: 16px; opacity: 0.5;"></i>
                    <div style="font-size: 16px; font-weight: 600;">No cryptocurrencies found</div>
                    <div style="font-size: 14px; margin-top: 8px;">Try changing your search or filter</div>
                </div>
            `;
        }
    }

    function addConnectionStatusIndicator() {
        // Add to header if not exists
        if (!document.getElementById('connectionStatus')) {
            const headerActions = document.querySelector('.header-actions');
            if (headerActions) {
                const statusDiv = document.createElement('div');
                statusDiv.id = 'connectionStatus';
                statusDiv.style.cssText = `
                    display: flex;
                    align-items: center;
                    gap: 6px;
                    padding: 6px 12px;
                    background: var(--surface);
                    border-radius: var(--radius-round);
                    border: 1px solid var(--border);
                    font-size: 12px;
                    font-weight: 600;
                    cursor: help;

                statusDiv.innerHTML = `<i class="fas fa-circle" style="color: var(--success); font-size: 8px;"></i> LIVE`;

            const updateDiv = document.createElement('div');

                color: var(--text-dim);
                margin-left: auto;
                margin-right: 16px;
            `;
            updateDiv.textContent = new Date().toLocaleTimeString();
            panelHeader.appendChild(updateDiv);
        }
    }
