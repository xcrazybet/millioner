<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>📋 My Bets - Xlondon Bet</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        :root {
            --primary: #00ff9d;
            --secondary: #ff9800;
            --danger: #ff4757;
            --success: #4caf50;
            --warning: #ffc107;
            --bg: #0a0f1a;
            --surface: #111827;
            --surface-light: #1a2332;
            --text: #ffffff;
            --text-dim: #94a3b8;
            --border: #1e293b;
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 70px;
        }

        .header {
            background: var(--surface);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
        }

        .logo a {
            color: var(--primary);
            text-decoration: none;
        }

        .balance-display {
            background: var(--surface-light);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid var(--primary);
            color: var(--primary);
            font-weight: 600;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            padding: 16px;
            background: var(--surface);
            margin: 12px;
            border-radius: 16px;
        }

        .stat-card {
            text-align: center;
            background: linear-gradient(145deg, var(--surface-light) 0%, var(--surface) 100%);
            border-radius: 12px;
            padding: 12px;
            transition: transform 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-2px);
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
        }

        .stat-label {
            font-size: 11px;
            color: var(--text-dim);
            margin-top: 4px;
        }

        .filter-tabs {
            display: flex;
            gap: 8px;
            padding: 0 12px 12px;
            overflow-x: auto;
        }

        .filter-btn {
            padding: 8px 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 30px;
            color: var(--text-dim);
            font-size: 13px;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-btn.active {
            background: var(--primary);
            color: #000;
            border-color: var(--primary);
        }

        .bets-container {
            padding: 12px;
        }

        .date-group {
            margin-bottom: 20px;
        }

        .date-header {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dim);
            margin-bottom: 10px;
            padding-left: 4px;
        }

        .bet-card {
            background: var(--surface);
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 10px;
            border-left: 4px solid;
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
        }

        .bet-card:hover {
            transform: translateX(5px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .bet-card.pending { border-left-color: var(--secondary); }
        .bet-card.won { border-left-color: var(--success); }
        .bet-card.lost { border-left-color: var(--danger); }
        .bet-card.cashed_out { border-left-color: var(--warning); }

        .bet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .bet-ticket {
            font-size: 12px;
            font-weight: 600;
            color: var(--primary);
            background: var(--surface-light);
            padding: 4px 10px;
            border-radius: 20px;
        }

        .bet-status {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }

        .bet-status.pending { background: var(--secondary); color: #000; }
        .bet-status.won { background: var(--success); color: #000; }
        .bet-status.lost { background: var(--danger); color: #000; }
        .bet-status.cashed_out { background: var(--warning); color: #000; }

        .bet-time {
            font-size: 11px;
            color: var(--text-dim);
            margin-bottom: 10px;
        }

        .selections {
            background: var(--surface-light);
            border-radius: 12px;
            padding: 10px;
            margin: 10px 0;
        }

        .selection-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
            font-size: 12px;
        }

        .selection-item:last-child {
            border-bottom: none;
        }

        .selection-outcome {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 600;
            margin-left: 4px;
        }

        .selection-outcome.won { background: var(--success); color: #000; }
        .selection-outcome.lost { background: var(--danger); color: #000; }
        .selection-outcome.pending { background: var(--secondary); color: #000; }

        .bet-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 10px;
            border-top: 1px solid var(--border);
            margin-top: 8px;
        }

        .stake-value {
            font-size: 16px;
            font-weight: 600;
        }

        .return-value {
            font-size: 18px;
            font-weight: 700;
        }

        .return-value.won { color: var(--success); }
        .return-value.lost { color: var(--danger); }
        .return-value.pending { color: var(--secondary); }
        .return-value.cashed_out { color: var(--warning); }

        .cash-out-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: var(--warning);
            color: #000;
            border: none;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .cash-out-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 2px 8px rgba(255, 193, 7, 0.3);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-dim);
        }

        .empty-state i {
            font-size: 60px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .browse-btn {
            display: inline-block;
            padding: 12px 24px;
            background: var(--primary);
            border-radius: 30px;
            color: #000;
            text-decoration: none;
            font-weight: 600;
            margin-top: 16px;
            transition: transform 0.2s;
        }

        .browse-btn:hover {
            transform: scale(1.05);
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .loading-spinner {
            border: 3px solid var(--surface-light);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--surface);
            display: flex;
            justify-content: space-around;
            padding: 8px 16px 12px;
            border-top: 2px solid var(--primary);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--text-dim);
            font-size: 11px;
            gap: 4px;
            padding: 4px 12px;
            border-radius: 30px;
            transition: color 0.2s;
        }

        .nav-item i { font-size: 20px; }
        .nav-item.active { color: var(--primary); }
        .nav-item:hover { color: var(--primary); }

        .toast-container {
            position: fixed;
            bottom: 80px;
            left: 16px;
            right: 16px;
            z-index: 1000;
        }

        .toast {
            padding: 12px 16px;
            background: var(--surface);
            border-radius: 30px;
            border-left: 4px solid var(--primary);
            margin-bottom: 8px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Statistics Dashboard */
        .statistics-dashboard {
            background: var(--surface);
            border-radius: 16px;
            padding: 20px;
            margin: 12px;
        }

        .statistics-dashboard h3 {
            color: var(--text);
            font-size: 16px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chart-container {
            position: relative;
            height: 200px;
            margin-bottom: 16px;
        }

        /* Bet Details Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 10000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--surface);
            border-radius: 16px;
            padding: 20px;
            max-width: 400px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .modal-header h2 {
            color: var(--text);
            font-size: 18px;
        }

        .close-btn {
            background: var(--danger);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 6px;
                padding: 12px;
            }
            
            .stat-value {
                font-size: 20px;
            }
            
            .filter-tabs {
                padding: 0 8px 8px;
            }
            
            .filter-btn {
                padding: 6px 12px;
                font-size: 12px;
            }
            
            .bet-card {
                padding: 12px;
                margin-bottom: 8px;
            }
            
            .bet-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
            
            .bet-footer {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }

            .statistics-dashboard {
                margin: 8px;
                padding: 16px;
            }

            .chart-container {
                height: 150px;
            }
        }

        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr;
                gap: 4px;
                padding: 8px;
            }
            
            .stat-value {
                font-size: 18px;
            }
            
            .header {
                padding: 8px 12px;
            }
            
            .logo {
                font-size: 16px;
            }
            
            .balance-display {
                padding: 4px 8px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <a href="betting.html">⚽ Xlondon Bet</a>
        </div>
        <div class="balance-display">
            <i class="fas fa-wallet"></i> $<span id="balance">0.00</span>
        </div>
        <button onclick="testBetsDisplay()" style="background: var(--primary); color: white; border: none; padding: 8px 12px; border-radius: 8px; margin-left: 8px; cursor: pointer;">
            <i class="fas fa-flask"></i> Test
        </button>
    </header>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-value" id="totalBets">0</div>
            <div class="stat-label">Total</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="wonBets">0</div>
            <div class="stat-label">Won</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="lostBets">0</div>
            <div class="stat-label">Lost</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="pendingBets">0</div>
            <div class="stat-label">Pending</div>
        </div>
    </div>

    <!-- Statistics Dashboard -->
    <div class="statistics-dashboard">
        <h3>
            <i class="fas fa-chart-line" style="color: var(--primary);"></i>
            Betting Analytics
        </h3>
        <div class="chart-container">
            <canvas id="performanceChart"></canvas>
        </div>
        <div class="chart-container">
            <canvas id="profitLossChart"></canvas>
        </div>
    </div>

    <!-- Statistics Dashboard -->
    <div class="statistics-dashboard mt-8 bg-white rounded-2xl shadow-xl p-6" style="margin: 16px;">
        <h3 class="text-xl font-bold mb-4 text-gray-800">
            <i class="fas fa-chart-line mr-2 text-purple-500"></i>Your Statistics
        </h3>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="stat-card bg-gray-50 p-4 rounded-lg text-center">
                <canvas id="winLossChart" width="80" height="80"></canvas>
                <div class="text-sm font-semibold mt-2">Win/Loss</div>
            </div>
            <div class="stat-card bg-gray-50 p-4 rounded-lg text-center">
                <canvas id="bettingPatternChart" width="80" height="80"></canvas>
                <div class="text-sm font-semibold mt-2">Patterns</div>
            </div>
            <div class="stat-card bg-gray-50 p-4 rounded-lg text-center">
                <canvas id="sportsPerformanceChart" width="80" height="80"></canvas>
                <div class="text-sm font-semibold mt-2">Performance</div>
            </div>
            <div class="stat-card bg-gray-50 p-4 rounded-lg text-center">
                <canvas id="monthlyChart" width="80" height="80"></canvas>
                <div class="text-sm font-semibold mt-2">Monthly</div>
            </div>
        </div>
    </div>

    <div class="filter-tabs">
        <button class="filter-btn active" data-filter="all">ALL BETS</button>
        <button class="filter-btn" data-filter="pending">PENDING</button>
        <button class="filter-btn" data-filter="won">WON</button>
        <button class="filter-btn" data-filter="lost">LOST</button>
        <button class="filter-btn" data-filter="cashed_out">CASHED OUT</button>
    </div>

    <!-- Recent Finished Matches -->
    <div class="finished-matches-section" style="padding: 12px;">
        <h3 style="color: var(--text); font-size: 16px; margin-bottom: 12px; display: flex; align-items: center;">
            <i class="fas fa-check-circle" style="color: var(--success); margin-right: 8px;"></i>
            Recent Finished Matches (Last 24 Hours)
        </h3>
        <div id="finishedMatchesContainer" class="space-y-3">
            <div class="text-center py-6" style="color: var(--text-dim);">
                <i class="fas fa-hourglass-half text-3xl mb-2"></i>
                <p>Loading recent finished matches...</p>
            </div>
        </div>
    </div>

    <div id="betsContainer" class="bets-container">
        <div class="loading">
            <div class="loading-spinner"></div>
            <p>Loading your bets...</p>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="betting.html" class="nav-item"><i class="fas fa-futbol"></i><span>Football</span></a>
        <a href="bets.html" class="nav-item active"><i class="fas fa-ticket-alt"></i><span>My Bets</span></a>
        <a href="https://xcrazybet.github.io/millioner/" class="nav-item"><i class="fas fa-home"></i><span>Home</span></a>
        <a href="#" class="nav-item"><i class="fas fa-chart-line"></i><span>Stats</span></a>
        <a href="dashboard.html" class="nav-item"><i class="fas fa-wallet"></i><span>Wallet</span></a>
    </nav>

    <div id="toastContainer" class="toast-container"></div>

    <!-- Bet Details Modal -->
    <div id="betModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Bet Details</h2>
                <button class="close-btn" onclick="closeBetModal()">×</button>
            </div>
            <div id="modalBody">
                <!-- Bet details will be inserted here -->
            </div>
        </div>
    </div>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let allBets = [];
        let currentFilter = 'all';
        let performanceChart = null;
        let profitLossChart = null;

        // Check Auth
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                console.log('User logged in:', user.uid);
                await loadBalance();
                await loadAllBets();
                setupRealtimeListener();
                // Charts are initialized in loadAllBets
            } else {
                console.log('No user, redirecting...');
                window.location.href = 'https://xcrazybet.github.io/millioner/login.html';
            }
        });

        // Page load initialization
        window.addEventListener('load', async () => {
            console.log('📱 Page loaded, checking auth state...');
            // Wait a moment for Firebase to initialize
            setTimeout(async () => {
                if (auth.currentUser) {
                    console.log('🔄 Reloading bets on page load...');
                    await loadAllBets();
                    await loadFinishedMatchesForBets();
                }
            }, 1000);
        });

        // Test Bets Function
        async function testBetsDisplay() {
            console.log('🧪 Testing bets display...');
            
            if (!auth.currentUser) {
                console.log('❌ No user logged in');
                return;
            }
            
            try {
                const snapshot = await db.collection("bets")
                    .where("userId", "==", auth.currentUser.uid)
                    .limit(5)
                    .get();

                console.log('📊 Found bets:', snapshot.docs.length);
                
                snapshot.forEach(doc => {
                    console.log('📝 Bet data:', doc.id, doc.data());
                });
                
                if (snapshot.docs.length > 0) {
                    showStatus('success', 'Bets Found', `Found ${snapshot.docs.length} bets`);
                } else {
                    showStatus('info', 'No Bets', 'No bets found for this user');
                }
                
            } catch (error) {
                console.error('❌ Error testing bets:', error);
                showStatus('error', 'Test Failed', error.message);
            }
        }

        // Load Balance
        async function loadBalance() {
            try {
                const doc = await db.collection("wallets").doc(auth.currentUser.uid).get();
                if (doc.exists) {
                    document.getElementById('balance').textContent = doc.data().balance.toFixed(2);
                } else {
                    await db.collection("wallets").doc(auth.currentUser.uid).set({ balance: 100 });
                    document.getElementById('balance').textContent = '100.00';
                }
            } catch (error) {
                console.error('Balance error:', error);
            }
        }

        // Load All Bets - Enhanced for detailed view
        async function loadAllBets() {
            const container = document.getElementById('betsContainer');
            container.innerHTML = '<div class="loading"><div class="loading-spinner"></div><p>Loading your bets...</p></div>';

            try {
                // Get bets from main betting collection
                console.log('🔍 Loading bets for user:', auth.currentUser.uid);
                const snapshot = await db.collection("bets")
                    .where("userId", "==", auth.currentUser.uid)
                    .orderBy("createdAt", "desc")
                    .limit(100)
                    .get();

                console.log('📊 Firestore query returned', snapshot.docs.length, 'documents');
                allBets = [];
                
                snapshot.forEach(doc => {
                    const data = doc.data();
                    console.log('📝 Loading bet:', doc.id, data);
                    // Parse date properly
                    let createdAtDate;
                    if (data.createdAt && typeof data.createdAt.toDate === 'function') {
                        createdAtDate = data.createdAt.toDate();
                    } else if (data.createdAtDate) {
                        createdAtDate = new Date(data.createdAtDate);
                    } else {
                        createdAtDate = new Date();
                    }
                    
                    allBets.push({
                        id: doc.id,
                        ...data,
                        createdAtDate: createdAtDate
                    });
                });
                
                console.log('✅ Loaded bets:', allBets.length);
                updateStats();
                initCharts();
                updateCharts();
                filterBets(currentFilter);
                
                // Load finished matches
                await loadFinishedMatchesForBets();
                
            } catch (error) {
                console.error('Load bets error:', error);
                let errorMessage = error.message;
                if (errorMessage.includes('index')) {
                    errorMessage = 'Database index is being created. Please wait a moment and refresh page.';
                }
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-circle"></i>
                        <h3>Error Loading Bets</h3>
                        <p>${errorMessage}</p>
                        <button onclick="location.reload()" class="browse-btn">RETRY</button>
                    </div>
                `;
            }
        }

        // Setup Real-time Listener
        function setupRealtimeListener() {
            db.collection("bets")
                .where("userId", "==", auth.currentUser.uid)
                .onSnapshot((snapshot) => {
                    console.log('Real-time update received');
                    loadAllBets();
                    loadBalance();
                }, (error) => {
                    console.error('Snapshot error:', error);
                });
        }

        // Load Finished Matches for Bets Page
        async function loadFinishedMatchesForBets() {
            const container = document.getElementById('finishedMatchesContainer');
            
            try {
                const twentyFourHoursAgo = new Date(Date.now() - 24 * 60 * 60 * 1000);
                
                // Get finished matches from Firebase
                const snapshot = await db.collection('finishedMatches')
                    .where('storedAt', '>=', twentyFourHoursAgo)
                    .orderBy('storedAt', 'desc')
                    .limit(10)
                    .get();
                
                const finishedMatches = snapshot.docs.map(doc => doc.data());
                
                if (finishedMatches.length === 0) {
                    container.innerHTML = `
                        <div class="text-center py-6" style="color: var(--text-dim);">
                            <i class="fas fa-info-circle text-3xl mb-2"></i>
                            <p>No finished matches in the last 24 hours</p>
                        </div>
                    `;
                    return;

                finishedMatches.forEach(match => {
                    const participants = match.participants || [];
                    const homeTeam = participants.find(p => p.meta?.location === 'home') || participants[0];
                    const awayTeam = participants.find(p => p.meta?.location === 'away') || participants[1];
                    const scores = match.scores || [];
                    
                    let homeScore = 0;
                    let awayScore = 0;
                    
                    // Enhanced score parsing for finished matches
                    if (match.scores && Array.isArray(match.scores) && match.scores.length > 0) {
                        console.log('📊 Processing finished match scores:', match.id, match.scores);
                        
                        // Method 1: participant field
                        const homeScoreObj = match.scores.find(s => s.participant === 'home');
                        const awayScoreObj = match.scores.find(s => s.participant === 'away');
                        
                        if (homeScoreObj && awayScoreObj) {
                            homeScore = parseInt(homeScoreObj.score) || parseInt(homeScoreObj.goals) || 0;
                            awayScore = parseInt(awayScoreObj.score) || parseInt(awayScoreObj.goals) || 0;
                        } else {
                            // Method 2: Check by index
                            homeScore = parseInt(match.scores[0]?.score) || parseInt(match.scores[0]?.goals) || 0;
                            awayScore = parseInt(match.scores[1]?.score) || parseInt(match.scores[1]?.goals) || 0;
                        }
                    } else if (match.score && typeof match.score === 'object') {
                        // Method 3: Direct score object
                        homeScore = parseInt(match.score.home) || parseInt(match.score.ht) || parseInt(match.score.localteam_score) || 0;
                        awayScore = parseInt(match.score.away) || parseInt(match.score.at) || parseInt(match.score.visitorteam_score) || 0;
                    } else if (match.goals && Array.isArray(match.goals)) {
                        // Method 4: Goals array
                        const homeGoals = match.goals.filter(g => g.team === 'home' || g.team_id === match.participants?.[0]?.id).length;
                        const awayGoals = match.goals.filter(g => g.team === 'away' || g.team_id === match.participants?.[1]?.id).length;
                        homeScore = homeGoals;
                        awayScore = awayGoals;
                    } else if (match.result) {
                        // Method 5: Result string like "2-1"
                        const resultMatch = match.result.match(/(\d+)\s*[-:]\s*(\d+)/);
                        if (resultMatch) {
                            homeScore = parseInt(resultMatch[1]) || 0;
                            awayScore = parseInt(resultMatch[2]) || 0;
                        }
                    }
                    
                    console.log('🎯 Final scores for finished match:', match.id, { homeScore, awayScore });
                    
                    const finishedTime = new Date(match.finishedAt || match.starting_at);
                    
                    html += `
                        <div class="bet-card" style="background: var(--surface); border-left-color: var(--success);">
                            <div class="bet-header">
                                <div>
                                    <div class="font-semibold" style="color: var(--text);">${homeTeam?.name || 'Home Team'} vs ${awayTeam?.name || 'Away Team'}</div>
                                    <div class="bet-time" style="font-size: 11px; color: var(--text-dim);">
                                        <i class="fas fa-clock"></i> ${finishedTime.toLocaleString()}
                                    </div>

                            </div>
                            <div style="text-align: center; padding: 10px;">
                                <div style="font-size: 18px; font-weight: bold; color: var(--primary);">
                                    ${homeScore} - ${awayScore}
                                </div>
                            </div>
                        </div>
                    `;
                });
                
                container.innerHTML = html;
                console.log('✅ Loaded finished matches for bets page:', finishedMatches.length);
                
            } catch (error) {
                console.error('Error loading finished matches for bets:', error);
                container.innerHTML = `

                    </div>
                `;
            }
        }

        // Update Charts

            if (!performanceChart || !profitLossChart) return;

            // Update Performance Chart
            const won = allBets.filter(b => b.status === 'won').length;
            const lost = allBets.filter(b => b.status === 'lost').length;
            const pending = allBets.filter(b => b.status === 'pending').length;
            const cashedOut = allBets.filter(b => b.status === 'cashed_out').length;

            performanceChart.data.datasets[0].data = [won, lost, pending, cashedOut];
            performanceChart.update();

            // Update Profit/Loss Chart
            const sortedBets = [...allBets].sort((a, b) => a.createdAtDate - b.createdAtDate);
            const labels = [];
            const data = [];
            let runningTotal = 0;

            sortedBets.forEach(bet => {
                if (bet.status === 'won') {
                    runningTotal += (bet.potentialWin - bet.stake);
                } else if (bet.status === 'lost') {
                    runningTotal -= bet.stake;
                } else if (bet.status === 'cashed_out') {
                    runningTotal += (bet.cashOutValue - bet.stake);
                }

                if (bet.status !== 'pending') {
                    labels.push(bet.createdAtDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }));
                    data.push(runningTotal);
                }
            });

            // Keep only last 10 data points for readability
            if (labels.length > 10) {
                profitLossChart.data.labels = labels.slice(-10);
                profitLossChart.data.datasets[0].data = data.slice(-10);
            } else {
                profitLossChart.data.labels = labels;
                profitLossChart.data.datasets[0].data = data;
            }

            profitLossChart.update();
        }

            Object.keys(groups).sort((a, b) => new Date(b) - new Date(a)).forEach(date => {
                html += `<div class="date-group">`;
                html += `<div class="date-header">${date}</div>`;

                    // Enhanced selections display with outcomes

                    const returnAmount = bet.potentialWin || (bet.status === 'won' ? (bet.stake || 0) * (bet.totalOdds || 1) : 0);
                    const returnClass = bet.status === 'won' ? 'won' : bet.status === 'lost' ? 'lost' : bet.status === 'cashed_out' ? 'cashed_out' : 'pending';
                    
                    html += `

                                Bet Type: ${(bet.betType || 'single').toUpperCase()}

        // Cash Out Bet
        async function cashOutBet(betId) {
            const bet = allBets.find(b => b.id === betId);
            if (!bet) return;

            // Simple cash out calculation (in real app, this would be more complex)
            const cashOutValue = bet.stake * 0.8; // Return 80% of stake

            if (confirm(`Cash out for $${cashOutValue.toFixed(2)}?`)) {
                try {
                    // Update bet status
                    await db.collection('bets').doc(betId).update({
                        status: 'cashed_out',
                        cashOutValue: cashOutValue,
                        settledAt: firebase.firestore.FieldValue.serverTimestamp()
                    });

                    // Update user balance
                    await db.collection('wallets').doc(auth.currentUser.uid).update({
                        balance: firebase.firestore.FieldValue.increment(cashOutValue)
                    });

                    showToast('Cash out successful!', 'success');
                    loadBalance();
                } catch (error) {
                    console.error('Cash out error:', error);
                    showToast('Cash out failed', 'error');
                }
            }
        }
