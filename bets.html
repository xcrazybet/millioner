<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>📋 My Bets - Xlodon Bet</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        :root {
            --primary: #00ff9d;
            --secondary: #ff9800;
            --danger: #ff4757;
            --success: #4caf50;
            --warning: #ffc107;
            --bg: #0a0f1a;
            --surface: #111827;
            --surface-light: #1a2332;
            --text: #ffffff;
            --text-dim: #94a3b8;
            --border: #1e293b;
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 70px;
        }

        .header {
            background: var(--surface);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
        }

        .logo a {
            color: var(--primary);
            text-decoration: none;
        }

        .balance-display {
            background: var(--surface-light);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid var(--primary);
            color: var(--primary);
            font-weight: 600;
            font-size: 14px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            padding: 16px;
            background: var(--surface);
            margin: 12px;
            border-radius: 16px;
        }

        .stat-card {
            text-align: center;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
        }

        .stat-label {
            font-size: 11px;
            color: var(--text-dim);
            margin-top: 4px;
        }

        .filter-tabs {
            display: flex;
            gap: 8px;
            padding: 0 12px 12px;
            overflow-x: auto;
        }

        .filter-btn {
            padding: 8px 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 30px;
            color: var(--text-dim);
            font-size: 13px;
            white-space: nowrap;
            cursor: pointer;
        }

        .filter-btn.active {
            background: var(--primary);
            color: #000;
        }

        .bets-container {
            padding: 12px;
        }

        .date-group {
            margin-bottom: 20px;
        }

        .date-header {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dim);
            margin-bottom: 10px;
        }

        .bet-card {
            background: var(--surface);
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 10px;
            border-left: 4px solid;
        }

        .bet-card.pending { border-left-color: var(--secondary); }
        .bet-card.won { border-left-color: var(--success); }
        .bet-card.lost { border-left-color: var(--danger); }
        .bet-card.cashed_out { border-left-color: var(--warning); }

        .bet-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .bet-ticket {
            font-size: 12px;
            font-weight: 600;
            color: var(--primary);
            background: var(--surface-light);
            padding: 4px 10px;
            border-radius: 20px;
        }

        .bet-status {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }

        .bet-status.pending { background: var(--secondary); color: #000; }
        .bet-status.won { background: var(--success); color: #000; }
        .bet-status.lost { background: var(--danger); color: #000; }
        .bet-status.cashed_out { background: var(--warning); color: #000; }

        .bet-time {
            font-size: 11px;
            color: var(--text-dim);
            margin-bottom: 10px;
        }

        .selections {
            background: var(--surface-light);
            border-radius: 12px;
            padding: 10px;
            margin: 10px 0;
        }

        .selection-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid var(--border);
            font-size: 12px;
        }

        .selection-item:last-child {
            border-bottom: none;
        }

        .bet-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 10px;
            border-top: 1px solid var(--border);
            margin-top: 8px;
        }

        .stake-value {
            font-size: 16px;
            font-weight: 600;
        }

        .return-value {
            font-size: 18px;
            font-weight: 700;
        }

        .return-value.won { color: var(--success); }
        .return-value.lost { color: var(--danger); }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-dim);
        }

        .empty-state i {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .browse-btn {
            display: inline-block;
            padding: 14px 30px;
            background: var(--primary);
            border-radius: 30px;
            color: #000;
            text-decoration: none;
            font-weight: 600;
            margin-top: 20px;
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .loading-spinner {
            border: 3px solid var(--surface-light);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--surface);
            display: flex;
            justify-content: space-around;
            padding: 8px 16px 12px;
            border-top: 2px solid var(--primary);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--text-dim);
            font-size: 11px;
            gap: 4px;
            padding: 4px 12px;
            border-radius: 30px;
        }

        .nav-item i { font-size: 18px; }
        .nav-item.active { color: var(--primary); }

        .home-icon {
            background: var(--primary);
            color: #000 !important;
            padding: 8px 16px;
        }

        .toast-container {
            position: fixed;
            bottom: 80px;
            left: 16px;
            right: 16px;
            z-index: 1000;
        }

        .toast {
            padding: 14px 16px;
            background: var(--surface);
            border-radius: 30px;
            border-left: 4px solid var(--primary);
            margin-top: 8px;
            font-size: 13px;
            transform: translateY(100%);
            opacity: 0;
            transition: all 0.3s;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <a href="https://xcrazybet.github.io/millioner/index.html">⚽ Xlodon Bet</a>
        </div>
        <div class="balance-display">
            <i class="fas fa-wallet"></i> $<span id="balance-val">0.00</span>
        </div>
    </header>

    <div class="stats-grid">
        <div class="stat-card"><div class="stat-value" id="total-bets">0</div><div class="stat-label">Total</div></div>
        <div class="stat-card"><div class="stat-value" id="won-bets">0</div><div class="stat-label">Won</div></div>
        <div class="stat-card"><div class="stat-value" id="lost-bets">0</div><div class="stat-label">Lost</div></div>
        <div class="stat-card"><div class="stat-value" id="pending-bets">0</div><div class="stat-label">Pending</div></div>
    </div>

    <div class="filter-tabs">
        <button class="filter-btn active" data-filter="all">ALL BETS</button>
        <button class="filter-btn" data-filter="pending">PENDING</button>
        <button class="filter-btn" data-filter="won">WON</button>
        <button class="filter-btn" data-filter="lost">LOST</button>
        <button class="filter-btn" data-filter="cashed_out">CASHED OUT</button>
    </div>

    <div id="bets-container" class="bets-container"></div>

    <nav class="bottom-nav">
        <a href="football.html" class="nav-item"><i class="fas fa-futbol"></i><span>Football</span></a>
        <a href="bets.html" class="nav-item active"><i class="fas fa-ticket-alt"></i><span>My Bets</span></a>
        <a href="https://xcrazybet.github.io/millioner/" class="nav-item home-icon"><i class="fas fa-home"></i><span>HOME</span></a>
        <a href="#" class="nav-item"><i class="fas fa-chart-line"></i><span>Stats</span></a>
        <a href="#" class="nav-item"><i class="fas fa-wallet"></i><span>Wallet</span></a>
    </nav>

    <div class="toast-container" id="toast-container"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let allBets = [];
        let currentFilter = 'all';

        auth.onAuthStateChanged(async (user) => {
            if (user) {
                await loadBalance();
                await loadAllBets();
                setupRealtimeListener();
            } else {
                window.location.href = 'https://xcrazybet.github.io/millioner/login.html';
            }
        });

        async function loadBalance() {
            const doc = await db.collection("wallets").doc(auth.currentUser.uid).get();
            if (doc.exists) {
                document.getElementById('balance-val').textContent = doc.data().balance.toFixed(2);
            }
        }

        async function loadAllBets() {
            const container = document.getElementById('bets-container');
            container.innerHTML = '<div class="loading"><div class="loading-spinner"></div><p>Loading your bets...</p></div>';

            try {
                const snapshot = await db.collection("football_bets")
                    .where("userId", "==", auth.currentUser.uid)
                    .orderBy("createdAt", "desc")
                    .limit(100)
                    .get();

                allBets = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    allBets.push({
                        ...data,
                        ticketNumber: doc.id,
                        createdAt: data.createdAtStr ? new Date(data.createdAtStr) : new Date(),
                        return: data.return || (data.status === 'won' ? data.stake * data.totalOdds : 0)
                    });
                });

                updateStats();
                filterBets(currentFilter);
            } catch (error) {
                console.error('Load error:', error);
                container.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-circle"></i><h3>Error Loading Bets</h3></div>';
            }
        }

        function setupRealtimeListener() {
            db.collection("football_bets")
                .where("userId", "==", auth.currentUser.uid)
                .onSnapshot(() => loadAllBets());
        }

        function updateStats() {
            document.getElementById('total-bets').textContent = allBets.length;
            document.getElementById('won-bets').textContent = allBets.filter(b => b.status === 'won').length;
            document.getElementById('lost-bets').textContent = allBets.filter(b => b.status === 'lost').length;
            document.getElementById('pending-bets').textContent = allBets.filter(b => b.status === 'pending').length;
        }

        function filterBets(filter) {
            currentFilter = filter;
            let filtered = filter === 'all' ? allBets : allBets.filter(b => b.status === filter);
            displayBets(filtered);
            
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.filter === filter);
            });
        }

        function displayBets(bets) {
            const container = document.getElementById('bets-container');
            
            if (!bets.length) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-ticket-alt"></i>
                        <h3>No bets found</h3>
                        <p>Start betting on football matches</p>
                        <a href="football.html" class="browse-btn">BROWSE MATCHES</a>
                    </div>
                `;
                return;
            }

            const groups = {};
            bets.forEach(bet => {
                const date = bet.createdAt.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
                if (!groups[date]) groups[date] = [];
                groups[date].push(bet);
            });

            let html = '';
            Object.keys(groups).forEach(date => {
                html += `<div class="date-group"><div class="date-header">${date}</div>`;
                groups[date].forEach(bet => {
                    const selections = bet.selections.map(s => `
                        <div class="selection-item">
                            <div><strong>${s.matchName}</strong><br><span style="font-size: 11px; color: var(--text-dim);">${s.market} - ${s.display}</span></div>
                            <div style="color: var(--primary);">${s.odds.toFixed(2)}</div>
                        </div>
                    `).join('');
                    
                    const returnValue = bet.status === 'won' ? bet.stake * bet.totalOdds : bet.return || 0;
                    
                    html += `
                        <div class="bet-card ${bet.status}">
                            <div class="bet-header">
                                <span class="bet-ticket">#${bet.ticketNumber}</span>
                                <span class="bet-status ${bet.status}">${bet.status.toUpperCase()}</span>
                            </div>
                            <div class="bet-time"><i class="far fa-clock"></i> ${bet.createdAt.toLocaleTimeString()}</div>
                            <div class="selections">${selections}</div>
                            <div style="text-align: right; font-size: 12px; margin: 8px 0;">Total Odds: ${bet.totalOdds.toFixed(2)}</div>
                            <div class="bet-footer">
                                <div><span class="stake-value">$${bet.stake.toFixed(2)}</span></div>
                                <div><span class="return-value ${bet.status}">${bet.status === 'won' ? '+' : ''}$${returnValue.toFixed(2)}</span></div>
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
            });
            
            container.innerHTML = html;
        }

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => filterBets(btn.dataset.filter));
        });
    </script>
</body>
</html>
