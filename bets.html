<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>📋 My Bets - Xlondon Bet</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        :root {
            --primary: #00ff9d;
            --secondary: #ff9800;
            --danger: #ff4757;
            --success: #4caf50;
            --warning: #ffc107;
            --bg: #0a0f1a;
            --surface: #111827;
            --surface-light: #1a2332;
            --text: #ffffff;
            --text-dim: #94a3b8;
            --border: #1e293b;
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 70px;
        }

        .header {
            background: var(--surface);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
        }

        .logo a {
            color: var(--primary);
            text-decoration: none;
        }

        .balance-display {
            background: var(--surface-light);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid var(--primary);
            color: var(--primary);
            font-weight: 600;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            padding: 16px;
            background: var(--surface);
            margin: 12px;
            border-radius: 16px;
        }

        .stat-card {
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
        }

        .stat-label {
            font-size: 11px;
            color: var(--text-dim);
            margin-top: 4px;
        }

        .filter-tabs {
            display: flex;
            gap: 8px;
            padding: 0 12px 12px;
            overflow-x: auto;
        }

        .filter-btn {
            padding: 8px 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 30px;
            color: var(--text-dim);
            font-size: 13px;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-btn.active {
            background: var(--primary);
            color: #000;
            border-color: var(--primary);
        }

        .bets-container {
            padding: 12px;
        }

        .date-group {
            margin-bottom: 20px;
        }

        .date-header {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dim);
            margin-bottom: 10px;
            padding-left: 4px;
        }

        .bet-card {
            background: var(--surface);
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 10px;
            border-left: 4px solid;
            transition: transform 0.2s;
            cursor: pointer;
        }

        .bet-card:hover {
            transform: translateX(5px);
        }

        .bet-card.pending { border-left-color: var(--secondary); }
        .bet-card.won { border-left-color: var(--success); }
        .bet-card.lost { border-left-color: var(--danger); }
        .bet-card.cashed_out { border-left-color: var(--warning); }

        .bet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .bet-ticket {
            font-size: 12px;
            font-weight: 600;
            color: var(--primary);
            background: var(--surface-light);
            padding: 4px 10px;
            border-radius: 20px;
        }

        .bet-status {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }

        .bet-status.pending { background: var(--secondary); color: #000; }
        .bet-status.won { background: var(--success); color: #000; }
        .bet-status.lost { background: var(--danger); color: #000; }
        .bet-status.cashed_out { background: var(--warning); color: #000; }

        .bet-time {
            font-size: 11px;
            color: var(--text-dim);
            margin-bottom: 10px;
        }

        .selections {
            background: var(--surface-light);
            border-radius: 12px;
            padding: 10px;
            margin: 10px 0;
        }

        .selection-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
            font-size: 12px;
        }

        .selection-item:last-child {
            border-bottom: none;
        }

        .bet-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 10px;
            border-top: 1px solid var(--border);
            margin-top: 8px;
        }

        .stake-value {
            font-size: 16px;
            font-weight: 600;
        }

        .return-value {
            font-size: 18px;
            font-weight: 700;
        }

        .return-value.won { color: var(--success); }
        .return-value.lost { color: var(--danger); }
        .return-value.pending { color: var(--secondary); }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-dim);
        }

        .empty-state i {
            font-size: 60px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .browse-btn {
            display: inline-block;
            padding: 12px 24px;
            background: var(--primary);
            border-radius: 30px;
            color: #000;
            text-decoration: none;
            font-weight: 600;
            margin-top: 16px;
            transition: transform 0.2s;
        }

        .browse-btn:hover {
            transform: scale(1.05);
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .loading-spinner {
            border: 3px solid var(--surface-light);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--surface);
            display: flex;
            justify-content: space-around;
            padding: 8px 16px 12px;
            border-top: 2px solid var(--primary);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--text-dim);
            font-size: 11px;
            gap: 4px;
            padding: 4px 12px;
            border-radius: 30px;
            transition: color 0.2s;
        }

        .nav-item i { font-size: 20px; }
        .nav-item.active { color: var(--primary); }
        .nav-item:hover { color: var(--primary); }

        .toast-container {
            position: fixed;
            bottom: 80px;
            left: 16px;
            right: 16px;
            z-index: 1000;
        }

        .toast {
            padding: 12px 16px;
            background: var(--surface);
            border-radius: 30px;
            border-left: 4px solid var(--primary);
            margin-bottom: 8px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 6px;
                padding: 12px;
            }
            
            .stat-value {
                font-size: 20px;
            }
            
            .filter-tabs {
                padding: 0 8px 8px;
            }
            
            .filter-btn {
                padding: 6px 12px;
                font-size: 12px;
            }
            
            .bet-card {
                padding: 12px;
                margin-bottom: 8px;
            }
            
            .bet-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
            
            .bet-footer {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
        }

        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr;
                gap: 4px;
                padding: 8px;
            }
            
            .stat-value {
                font-size: 18px;
            }
            
            .header {
                padding: 8px 12px;
            }
            
            .logo {
                font-size: 16px;
            }
            
            .balance-display {
                padding: 4px 8px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <a href="betting.html">⚽ Xlondon Bet</a>
        </div>
        <div class="balance-display">
            <i class="fas fa-wallet"></i> $<span id="balance">0.00</span>
        </div>
    </header>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-value" id="totalBets">0</div>
            <div class="stat-label">Total</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="wonBets">0</div>
            <div class="stat-label">Won</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="lostBets">0</div>
            <div class="stat-label">Lost</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="pendingBets">0</div>
            <div class="stat-label">Pending</div>
        </div>
    </div>

    <div class="filter-tabs">
        <button class="filter-btn active" data-filter="all">ALL BETS</button>
        <button class="filter-btn" data-filter="pending">PENDING</button>
        <button class="filter-btn" data-filter="won">WON</button>
        <button class="filter-btn" data-filter="lost">LOST</button>
        <button class="filter-btn" data-filter="cashed_out">CASHED OUT</button>
    </div>

    <div id="betsContainer" class="bets-container">
        <div class="loading">
            <div class="loading-spinner"></div>
            <p>Loading your bets...</p>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="betting.html" class="nav-item"><i class="fas fa-futbol"></i><span>Football</span></a>
        <a href="bets.html" class="nav-item active"><i class="fas fa-ticket-alt"></i><span>My Bets</span></a>
        <a href="https://xcrazybet.github.io/millioner/" class="nav-item"><i class="fas fa-home"></i><span>Home</span></a>
        <a href="#" class="nav-item"><i class="fas fa-chart-line"></i><span>Stats</span></a>
        <a href="#" class="nav-item"><i class="fas fa-wallet"></i><span>Wallet</span></a>
    </nav>

    <div id="toastContainer" class="toast-container"></div>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let allBets = [];
        let currentFilter = 'all';

        // Check Auth
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                console.log('User logged in:', user.uid);
                await loadBalance();
                await loadAllBets();
                setupRealtimeListener();
            } else {
                console.log('No user, redirecting...');
                window.location.href = 'https://xcrazybet.github.io/millioner/login.html';
            }
        });

        // Load Balance
        async function loadBalance() {
            try {
                const doc = await db.collection("wallets").doc(auth.currentUser.uid).get();
                if (doc.exists) {
                    document.getElementById('balance').textContent = doc.data().balance.toFixed(2);
                } else {
                    // Create wallet if doesn't exist
                    await db.collection("wallets").doc(auth.currentUser.uid).set({ balance: 100 });
                    document.getElementById('balance').textContent = '100.00';
                }
            } catch (error) {
                console.error('Balance error:', error);
            }
        }

        // Load All Bets - Enhanced for detailed view
        async function loadAllBets() {
            const container = document.getElementById('betsContainer');
            container.innerHTML = '<div class="loading"><div class="loading-spinner"></div><p>Loading your bets...</p></div>';

            try {
                // Get bets from main betting collection
                const snapshot = await db.collection("bets")
                    .where("userId", "==", auth.currentUser.uid)
                    .orderBy("createdAt", "desc")
                    .limit(100)
                    .get();

                allBets = [];
                
                snapshot.forEach(doc => {
                    const data = doc.data();
                    // Parse date properly
                    let createdAtDate;
                    if (data.createdAt && typeof data.createdAt.toDate === 'function') {
                        createdAtDate = data.createdAt.toDate();
                    } else if (data.createdAtDate) {
                        createdAtDate = new Date(data.createdAtDate);
                    } else {
                        createdAtDate = new Date();
                    }
                    
                    allBets.push({
                        id: doc.id,
                        ...data,
                        createdAtDate: createdAtDate
                    });
                });
                
                console.log('Loaded bets:', allBets.length);
                updateStats();
                filterBets(currentFilter);
                
            } catch (error) {
                console.error('Load bets error:', error);
                let errorMessage = error.message;
                // Provide helpful message for index error
                if (errorMessage.includes('index')) {
                    errorMessage = 'Database index is being created. Please wait a moment and refresh page.';
                }
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-circle"></i>
                        <h3>Error Loading Bets</h3>
                        <p>${errorMessage}</p>
                        <button onclick="location.reload()" class="browse-btn">RETRY</button>
                    </div>
                `;
            }
        }

        // Setup Real-time Listener
        function setupRealtimeListener() {
            db.collection("bets")
                .where("userId", "==", auth.currentUser.uid)
                .onSnapshot((snapshot) => {
                    console.log('Real-time update received');
                    loadAllBets(); // Reload all bets on any change
                    loadBalance();
                }, (error) => {
                    console.error('Snapshot error:', error);
                });
        }

        // Update Stats
        function updateStats() {
            const total = allBets.length;
            const won = allBets.filter(b => b.status === 'won').length;
            const lost = allBets.filter(b => b.status === 'lost').length;
            const pending = allBets.filter(b => b.status === 'pending').length;
            const cashedOut = allBets.filter(b => b.status === 'cashed_out').length;
            
            document.getElementById('totalBets').textContent = total;
            document.getElementById('wonBets').textContent = won;
            document.getElementById('lostBets').textContent = lost;
            document.getElementById('pendingBets').textContent = pending;
        }

        // Filter Bets
        function filterBets(filter) {
            currentFilter = filter;
            let filtered = filter === 'all' ? allBets : allBets.filter(b => b.status === filter);
            displayBets(filtered);
            
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.filter === filter);
            });
        }

        // Display Bets - Enhanced with full details
        function displayBets(bets) {
            const container = document.getElementById('betsContainer');
            
            if (bets.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-ticket-alt"></i>
                        <h3>No bets found</h3>
                        <p>Start betting on football matches</p>
                        <a href="betting.html" class="browse-btn">BROWSE MATCHES</a>
                    </div>
                `;
                return;
            }

            // Group by date
            const groups = {};
            bets.forEach(bet => {
                const date = new Date(bet.createdAtDate);
                const dateStr = date.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
                if (!groups[dateStr]) groups[dateStr] = [];
                groups[dateStr].push(bet);
            });

            let html = '';
            Object.keys(groups).sort((a, b) => new Date(b) - new Date(a)).forEach(date => {
                html += `<div class="date-group">`;
                html += `<div class="date-header">${date}</div>`;
                
                groups[date].forEach(bet => {
                    // Enhanced selections display
                    const selections = bet.bets || bet.selections || [];
                    const selectionsHtml = selections.length > 0 ? selections.map(s => `
                        <div class="selection-item">
                            <div>
                                <strong>${s.matchName || 'Unknown Match'}</strong><br>
                                <span style="font-size: 11px; color: var(--text-dim);">${s.market || 'Market'} - ${s.selection || 'Selection'}</span>
                            </div>
                            <div style="color: var(--primary); font-weight: 600;">${(s.odds || 0).toFixed(2)}</div>
                        </div>
                    `).join('') : '<div class="selection-item">No selections data</div>';
                    
                    const returnAmount = bet.potentialWin || (bet.status === 'won' ? (bet.stake || 0) * (bet.totalOdds || 1) : 0);
                    const returnClass = bet.status === 'won' ? 'won' : bet.status === 'lost' ? 'lost' : 'pending';
                    
                    html += `
                        <div class="bet-card ${bet.status || 'pending'}" onclick="showBetDetails('${bet.id}')">
                            <div class="bet-header">
                                <span class="bet-ticket">#${bet.id.substring(0, 15)}</span>
                                <span class="bet-status ${bet.status || 'pending'}">${(bet.status || 'PENDING').toUpperCase()}</span>
                            </div>
                            <div class="bet-time">
                                <i class="far fa-clock"></i> ${new Date(bet.createdAtDate).toLocaleString()}
                            </div>
                            <div class="selections">
                                ${selectionsHtml}
                            </div>
                            <div style="text-align: right; font-size: 12px; margin: 8px 0;">
                                Total Odds: ${(bet.totalOdds || 1).toFixed(2)}
                            </div>
                            <div class="bet-footer">
                                <div>
                                    <div style="font-size: 11px; color: var(--text-dim);">Stake</div>
                                    <div class="stake-value">$${(bet.stake || 0).toFixed(2)}</div>
                                </div>
                                <div style="text-align: right;">
                                    <div style="font-size: 11px; color: var(--text-dim);">Return</div>
                                    <div class="return-value ${returnClass}">
                                        ${bet.status === 'won' ? '+' : ''}$${returnAmount.toFixed(2)}
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });
                
                html += `</div>`;
            });
            
            container.innerHTML = html;
        }

        // Show Bet Details Modal
        function showBetDetails(betId) {
            const bet = allBets.find(b => b.id === betId);
            if (!bet) return;
            
            const modal = document.createElement('div');
            modal.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: rgba(0,0,0,0.8);
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 10000;
            `;
            
            const selections = bet.bets || bet.selections || [];
            const selectionsList = selections.map(s => `
                <div style="padding: 8px; border-bottom: 1px solid var(--border); margin-bottom: 4px;">
                    <strong>${s.matchName || 'Unknown Match'}</strong><br>
                    <small style="color: var(--text-dim);">${s.market || 'Market'}: ${s.selection || 'Selection'}</small><br>
                    <span style="color: var(--primary);">Odds: ${(s.odds || 0).toFixed(2)}</span>
                </div>
            `).join('');
            
            modal.innerHTML = `
                <div style="background: var(--surface); border-radius: 16px; padding: 20px; max-width: 400px; width: 90%; max-height: 80vh; overflow-y: auto;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                        <h2 style="color: var(--text); font-size: 18px;">Bet Details</h2>
                        <button onclick="this.closest('div').parentElement.remove()" style="background: var(--danger); color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer;">×</button>
                    </div>
                    
                    <div style="margin-bottom: 16px;">
                        <div style="font-size: 12px; color: var(--text-dim); margin-bottom: 4px;">Bet ID: ${bet.id}</div>
                        <div style="font-size: 12px; color: var(--text-dim); margin-bottom: 4px;">Placed: ${new Date(bet.createdAtDate).toLocaleString()}</div>
                        <div style="font-size: 12px; color: var(--text-dim); margin-bottom: 4px;">Status: <span style="color: var(--primary); font-weight: bold;">${(bet.status || 'PENDING').toUpperCase()}</span></div>
                    </div>
                    
                    <div style="margin-bottom: 16px;">
                        <h3 style="color: var(--text); font-size: 14px; margin-bottom: 8px;">Selections (${selections.length}):</h3>
                        ${selectionsList}
                    </div>
                    
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px;">
                        <div>
                            <div style="font-size: 12px; color: var(--text-dim); margin-bottom: 4px;">Stake</div>
                            <div style="font-size: 18px; font-weight: bold; color: var(--primary);">$${(bet.stake || 0).toFixed(2)}</div>
                        </div>
                        <div>
                            <div style="font-size: 12px; color: var(--text-dim); margin-bottom: 4px;">Total Odds</div>
                            <div style="font-size: 18px; font-weight: bold; color: var(--primary);">${(bet.totalOdds || 1).toFixed(2)}</div>
                        </div>
                    </div>
                    
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <div>
                            <div style="font-size: 12px; color: var(--text-dim); margin-bottom: 4px;">Potential Return</div>
                            <div style="font-size: 20px; font-weight: bold; color: ${bet.status === 'won' ? 'var(--success)' : bet.status === 'lost' ? 'var(--danger)' : 'var(--secondary)'};">
                                ${bet.status === 'won' ? '+' : ''}$${(bet.potentialWin || 0).toFixed(2)}
                            </div>
                        </div>
                        <button onclick="this.closest('div').parentElement.remove()" style="background: var(--primary); color: #000; border: none; padding: 12px 24px; border-radius: 30px; cursor: pointer; font-weight: bold;">Close</button>
                    </div>
                </div>
            `;
            
            document.body.appendChild(modal);
        }

        // Toast
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.style.borderLeftColor = type === 'success' ? 'var(--success)' : type === 'error' ? 'var(--danger)' : 'var(--primary)';
            toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-triangle' : 'fa-info-circle'}"></i> ${message}`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // Filter Event Listeners
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                filterBets(btn.dataset.filter);
            });
        });
    </script>
</body>
</html>
