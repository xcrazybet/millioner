<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎡 Mega Wheel - XCrazyBet</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --primary: #ff6b35;
            --primary-dark: #e55a2b;
            --secondary: #00b4d8;
            --secondary-dark: #0077b6;
            --success: #06d6a0;
            --danger: #ef476f;
            --warning: #ffd166;
            --gold: #ffd700;
            --silver: #c0c0c0;
            --bronze: #cd7f32;
            --bg: #1a1a2e;
            --surface: #16213e;
            --surface-light: #0f3460;
            --text: #ffffff;
            --text-dim: #b8c2cc;
            --dark-bg: #000814;
            --segment-1: #ff4d4d;
            --segment-2: #ff6b35;
            --segment-3: #ff9e00;
            --segment-4: #ffd166;
            --segment-5: #06d6a0;
            --segment-6: #00b4d8;
            --segment-7: #4d79ff;
            --segment-8: #9d4edd;
            --segment-9: #ef476f;
            --segment-10: #ff4d6d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Segoe UI', 'Roboto', system-ui, -apple-system, sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Background Effects */
        .bg-effects {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255, 107, 53, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0, 180, 216, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(157, 78, 221, 0.05) 0%, transparent 60%),
                linear-gradient(180deg, #000814 0%, #1a1a2e 100%);
        }

        /* Header */
        .header {
            background: rgba(22, 33, 62, 0.95);
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--gold);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .home-btn {
            width: 36px;
            height: 36px;
            background: var(--gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #000;
            font-size: 18px;
            transition: all 0.3s;
        }

        .home-btn:hover {
            background: var(--warning);
            transform: scale(1.1);
        }

        .logo {
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--gold);
        }

        .logo i {
            color: var(--gold);
        }

        .balance-display {
            background: linear-gradient(45deg, #16213e, #0f1528);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--gold);
            color: var(--gold);
            font-weight: 700;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 140px;
            justify-content: center;
        }

        /* Main Container */
        .game-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 15px;
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 20px;
            min-height: calc(100vh - 140px);
        }

        @media (max-width: 1024px) {
            .game-container {
                grid-template-columns: 1fr;
            }
        }

        /* Left Column - Wheel */
        .wheel-column {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Jackpot Display */
        .jackpot-display {
            background: linear-gradient(135deg, var(--gold), var(--warning));
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            border: 3px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.3);
            margin-bottom: 10px;
        }

        .jackpot-label {
            font-size: 16px;
            color: #000;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .jackpot-value {
            font-size: 48px;
            font-weight: 900;
            color: #000;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        /* Wheel Container */
        .wheel-container {
            background: rgba(22, 33, 62, 0.8);
            border-radius: 20px;
            padding: 30px;
            border: 3px solid var(--gold);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            min-height: 600px;
        }

        .wheel-wrapper {
            position: relative;
            width: 500px;
            height: 500px;
            margin: 0 auto;
        }

        @media (max-width: 768px) {
            .wheel-wrapper {
                width: 350px;
                height: 350px;
            }
        }

        @media (max-width: 480px) {
            .wheel-wrapper {
                width: 280px;
                height: 280px;
            }
        }

        .wheel {
            width: 100%;
            height: 100%;
            position: relative;
            transform-origin: center;
            transition: transform 5s cubic-bezier(0.17, 0.67, 0.23, 0.99);
        }

        .wheel-segment {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform-origin: center;
            clip-path: polygon(50% 50%, 50% 0%, 100% 0%);
        }

        .wheel-segment-inner {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 60px;
            transform-origin: center;
        }

        .segment-value {
            font-size: 24px;
            font-weight: 900;
            color: #000;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
            margin-bottom: 5px;
        }

        .segment-label {
            font-size: 12px;
            font-weight: 600;
            color: #000;
        }

        .wheel-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            background: var(--gold);
            border-radius: 50%;
            border: 5px solid #000;
            z-index: 10;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
        }

        .wheel-pointer {
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 60px;
            z-index: 20;
        }

        .pointer-triangle {
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 30px solid var(--danger);
            filter: drop-shadow(0 0 10px rgba(239, 71, 111, 0.8));
        }

        .pointer-base {
            width: 40px;
            height: 30px;
            background: var(--danger);
            border-radius: 5px;
            margin-top: -1px;
        }

        /* Spin Button */
        .spin-button {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, var(--primary), var(--danger));
            border-radius: 50%;
            border: none;
            color: white;
            font-size: 20px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            z-index: 30;
            box-shadow: 
                0 0 30px rgba(255, 107, 53, 0.8),
                inset 0 0 20px rgba(255, 255, 255, 0.2);
            transition: all 0.3s;
        }

        .spin-button:hover:not(:disabled) {
            transform: translateX(-50%) scale(1.05);
            box-shadow: 
                0 0 40px rgba(255, 107, 53, 1),
                inset 0 0 20px rgba(255, 255, 255, 0.3);
        }

        .spin-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: translateX(-50%) scale(1);
        }

        .spin-button i {
            font-size: 32px;
            animation: spinIcon 2s linear infinite;
        }

        /* Right Column - Controls */
        .controls-column {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Bet Controls */
        .bet-controls {
            background: rgba(22, 33, 62, 0.95);
            border-radius: 15px;
            padding: 20px;
            border: 2px solid rgba(255, 215, 0, 0.2);
            backdrop-filter: blur(10px);
        }

        .bet-title {
            font-size: 18px;
            color: var(--gold);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .bet-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            align-items: center;
        }

        .bet-input {
            flex: 1;
            padding: 15px;
            background: rgba(10, 15, 26, 0.8);
            border: 2px solid var(--gold);
            border-radius: 10px;
            color: var(--text);
            font-size: 18px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .bet-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.1);
        }

        .currency {
            color: var(--gold);
            font-weight: 700;
            font-size: 18px;
        }

        /* Quick Bets */
        .quick-bets {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .quick-bet {
            padding: 12px;
            background: rgba(10, 15, 26, 0.8);
            border: 1px solid var(--gold);
            border-radius: 8px;
            color: var(--gold);
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }

        .quick-bet:hover, .quick-bet.active {
            background: var(--gold);
            color: #000;
            transform: translateY(-2px);
        }

        /* Potential Win */
        .potential-win {
            background: rgba(6, 214, 160, 0.1);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            border: 1px solid var(--success);
            margin-bottom: 15px;
        }

        .potential-win-label {
            font-size: 14px;
            color: var(--text-dim);
            margin-bottom: 5px;
        }

        .potential-win-value {
            font-size: 28px;
            font-weight: 900;
            color: var(--success);
            text-shadow: 0 0 10px rgba(6, 214, 160, 0.5);
        }

        /* Segment Info */
        .segment-info {
            background: rgba(22, 33, 62, 0.95);
            border-radius: 15px;
            padding: 20px;
            border: 2px solid rgba(0, 180, 216, 0.2);
            backdrop-filter: blur(10px);
        }

        .segment-title {
            font-size: 18px;
            color: var(--secondary);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .segment-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 300px;
            overflow-y: auto;
        }

        .segment-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: rgba(10, 15, 26, 0.5);
            border-radius: 8px;
            border-left: 4px solid var(--segment-1);
            font-size: 12px;
        }

        .segment-color {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            margin-right: 10px;
        }

        .segment-name {
            flex: 1;
            color: var(--text);
        }

        .segment-payout {
            color: var(--gold);
            font-weight: 700;
            font-size: 14px;
        }

        /* Game Stats */
        .game-stats {
            background: rgba(22, 33, 62, 0.95);
            border-radius: 15px;
            padding: 20px;
            border: 2px solid rgba(239, 71, 111, 0.2);
            backdrop-filter: blur(10px);
        }

        .stats-title {
            font-size: 18px;
            color: var(--danger);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .stat-item {
            text-align: center;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
        }

        .stat-label {
            color: var(--text-dim);
            font-size: 12px;
            margin-bottom: 5px;
        }

        .stat-value {
            color: var(--text);
            font-size: 16px;
            font-weight: 700;
        }

        /* History Panel */
        .history-panel {
            background: rgba(22, 33, 62, 0.95);
            border-radius: 15px;
            padding: 20px;
            border: 2px solid rgba(157, 78, 221, 0.2);
            backdrop-filter: blur(10px);
            max-height: 300px;
            overflow-y: auto;
        }

        .history-title {
            font-size: 18px;
            color: #9d4edd;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: rgba(10, 15, 26, 0.5);
            border-radius: 8px;
            font-size: 12px;
        }

        .history-win {
            color: var(--success);
            font-weight: 700;
        }

        .history-loss {
            color: var(--danger);
            font-weight: 700;
        }

        /* Result Overlay */
        .result-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .result-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .result-content {
            background: rgba(22, 33, 62, 0.95);
            padding: 30px;
            border-radius: 20px;
            border: 3px solid var(--gold);
            text-align: center;
            max-width: 400px;
            width: 90%;
            backdrop-filter: blur(20px);
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.3);
        }

        .result-title {
            font-size: 32px;
            font-weight: 900;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .result-win {
            color: var(--gold);
        }

        .result-segment {
            font-size: 24px;
            color: var(--text);
            margin: 10px 0;
            padding: 10px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .result-multiplier {
            font-size: 20px;
            color: var(--text-dim);
            margin: 10px 0;
        }

        .result-amount {
            font-size: 48px;
            font-weight: 900;
            margin: 20px 0;
            color: var(--success);
            text-shadow: 0 0 20px rgba(6, 214, 160, 0.5);
        }

        /* Toast Notifications */
        .toast-container {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 300px;
            width: 90%;
        }

        .toast {
            padding: 15px;
            background: rgba(22, 33, 62, 0.95);
            border-radius: 10px;
            border-left: 4px solid var(--gold);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
            transform: translateY(100%);
            opacity: 0;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
            font-size: 14px;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.success {
            border-color: var(--success);
        }

        .toast.error {
            border-color: var(--danger);
        }

        .toast.warning {
            border-color: var(--warning);
        }

        /* Animations */
        @keyframes spinIcon {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes wheelSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(calc(360deg * 5 + var(--stop-angle))); }
        }

        @keyframes confetti {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(1000px) rotate(720deg); opacity: 0; }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @keyframes jackpotPulse {
            0%, 100% { box-shadow: 0 0 20px rgba(255, 215, 0, 0.5); }
            50% { box-shadow: 0 0 40px rgba(255, 215, 0, 1); }
        }

        /* Loading */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 107, 53, 0.3);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Confetti */
        .confetti-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1001;
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background: var(--gold);
            opacity: 0;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 10px;
                padding: 10px;
            }

            .header-left {
                width: 100%;
                justify-content: space-between;
            }

            .balance-display {
                width: 100%;
                min-width: auto;
            }

            .game-container {
                padding: 10px;
                gap: 10px;
            }

            .jackpot-value {
                font-size: 36px;
            }

            .quick-bets {
                grid-template-columns: repeat(4, 1fr);
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            .jackpot-value {
                font-size: 28px;
            }

            .spin-button {
                width: 100px;
                height: 100px;
                font-size: 16px;
            }

            .quick-bets {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <!-- Background Effects -->
    <div class="bg-effects"></div>

    <!-- Confetti Container -->
    <div class="confetti-container" id="confetti-container"></div>

    <!-- Header -->
    <header class="header">
        <div class="header-left">
            <a href="https://xcrazybet.github.io/millioner" class="home-btn" title="Return to Home">
                <i class="fas fa-home"></i>
            </a>
            <div class="logo">
                <i class="fas fa-gem"></i>
                Mega Wheel
            </div>
        </div>
        <div class="balance-display">
            <i class="fas fa-wallet"></i>
            $<span id="balance-val">0.00</span>
        </div>
    </header>

    <!-- Main Game Container -->
    <div class="game-container">
        <!-- Left Column - Wheel -->
        <div class="wheel-column">
            <!-- Jackpot Display -->
            <div class="jackpot-display" id="jackpot-display">
                <div class="jackpot-label">🎯 Progressive Jackpot</div>
                <div class="jackpot-value" id="jackpot-value">$10,000</div>
            </div>

            <!-- Wheel Container -->
            <div class="wheel-container">
                <div class="wheel-wrapper">
                    <div class="wheel-pointer">
                        <div class="pointer-triangle"></div>
                        <div class="pointer-base"></div>
                    </div>
                    <div class="wheel" id="wheel">
                        <!-- Wheel segments will be generated by JavaScript -->
                    </div>
                    <div class="wheel-center"></div>
                </div>

                <!-- Spin Button -->
                <button id="spin-button" class="spin-button">
                    <i class="fas fa-play"></i>
                    SPIN
                </button>
            </div>
        </div>

        <!-- Right Column - Controls -->
        <div class="controls-column">
            <!-- Bet Controls -->
            <div class="bet-controls">
                <div class="bet-title">
                    <i class="fas fa-coins"></i> BET AMOUNT
                </div>
                <div class="bet-input-group">
                    <input type="number" class="bet-input" id="bet-amount" value="5" min="1" max="1000" step="1">
                    <div class="currency">$</div>
                </div>

                <!-- Quick Bets -->
                <div class="quick-bets">
                    <div class="quick-bet" data-amount="1">$1</div>
                    <div class="quick-bet" data-amount="5">$5</div>
                    <div class="quick-bet" data-amount="10">$10</div>
                    <div class="quick-bet" data-amount="25">$25</div>
                    <div class="quick-bet" data-amount="50">$50</div>
                    <div class="quick-bet" data-amount="100">$100</div>
                </div>

                <!-- Potential Win -->
                <div class="potential-win">
                    <div class="potential-win-label">Potential Win</div>
                    <div class="potential-win-value" id="potential-win">$0.00</div>
                </div>
            </div>

            <!-- Segment Info -->
            <div class="segment-info">
                <div class="segment-title">
                    <i class="fas fa-info-circle"></i> WHEEL SEGMENTS
                </div>
                <div class="segment-list" id="segment-list">
                    <!-- Segment info will be generated by JavaScript -->
                </div>
            </div>

            <!-- Game Stats -->
            <div class="game-stats">
                <div class="stats-title">
                    <i class="fas fa-chart-line"></i> GAME STATS
                </div>
                <div class="stats-grid">
                    <div class="stat-item">
                        <div class="stat-label">Spins Today</div>
                        <div class="stat-value" id="spins-today">0</div>

    <!-- Result Overlay -->

            <div class="result-amount" id="result-amount">+$0.00</div>

                <i class="fas fa-redo"></i> SPIN AGAIN
            </button>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>

    <script>
        // ===== FIREBASE CONFIG =====
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };

        // ===== GAME STATE =====
        const gameState = {
            currentUser: null,
            balance: 0,
            
            // Wheel settings
            betAmount: 5,
            wheelSpinning: false,
            wheelSegments: 20, // 20 segments for better odds manipulation
            
            // 90% lose rate system
            // Segment distribution: 90% lose/low win, 10% decent win
            segmentDistribution: {
                // 72% chance: 0.1x - 1x (basically lose)
                'lose': 0.72,
                // 18% chance: 1x - 2x (small win)
                'small': 0.18,
                // 8% chance: 2x - 5x (medium win)
                'medium': 0.08,
                // 2% chance: 5x - 20x (big win)
                'big': 0.02
            },
            
            // Progressive jackpot
            jackpot: 10000,
            jackpotContribution: 0.01, // 1% of each bet goes to jackpot
            jackpotWon: false,
            
            // Game stats
            stats: {
                spinsToday: 0,
                totalSpins: 0,
                totalWon: 0,
                totalLost: 0,
                biggestWin: 0,
                consecutiveLosses: 0,
                lastWinTime: null
            },
            
            // Segment configuration
            segments: [],
            currentSpin: null,
            
            // Sound effects
            sounds: {
                spin: 'https://assets.mixkit.co/sfx/preview/mixkit-slot-machine-spin-1082.mp3',
                win: 'https://assets.mixkit.co/sfx/preview/mixkit-winning-chimes-2015.mp3',
                jackpot: 'https://assets.mixkit.co/sfx/preview/mixkit-winning-trumpet-2018.mp3',
                lose: 'https://assets.mixkit.co/sfx/preview/mixkit-arcade-retro-game-over-213.mp3'
            }
        };

        // ===== WHEEL SEGMENT CONFIGURATION =====
        function initializeSegments() {
            const segments = [];
            const segmentColors = [
                'var(--segment-1)', 'var(--segment-2)', 'var(--segment-3)', 'var(--segment-4)',
                'var(--segment-5)', 'var(--segment-6)', 'var(--segment-7)', 'var(--segment-8)',
                'var(--segment-9)', 'var(--segment-10)', 'var(--segment-1)', 'var(--segment-2)',
                'var(--segment-3)', 'var(--segment-4)', 'var(--segment-5)', 'var(--segment-6)',
                'var(--segment-7)', 'var(--segment-8)', 'var(--segment-9)', 'var(--segment-10)'
            ];
            
            // Create segments with weighted distribution
            let segmentCount = 0;
            
            // 72% lose segments (14 segments)
            for (let i = 0; i < 14; i++) {
                segments.push({
                    id: segmentCount++,
                    name: 'Try Again',
                    multiplier: 0.1 + (Math.random() * 0.9), // 0.1x to 1x
                    color: segmentColors[segmentCount % segmentColors.length],
                    type: 'lose',
                    probability: 0.72 / 14
                });
            }
            
            // 18% small win segments (4 segments)
            for (let i = 0; i < 4; i++) {
                segments.push({
                    id: segmentCount++,
                    name: 'Small Win',
                    multiplier: 1 + (Math.random() * 1), // 1x to 2x
                    color: segmentColors[segmentCount % segmentColors.length],
                    type: 'small',
                    probability: 0.18 / 4
                });
            }
            
            // 8% medium win segments (1-2 segments, we'll use 2 for better distribution)
            for (let i = 0; i < 2; i++) {
                segments.push({
                    id: segmentCount++,
                    name: 'Medium Win',
                    multiplier: 2 + (Math.random() * 3), // 2x to 5x
                    color: segmentColors[segmentCount % segmentColors.length],
                    type: 'medium',
                    probability: 0.08 / 2
                });
            }
            
            // 2% big win segments (0-1 segment, we'll use 0 and make it rare via algorithm)
            // Instead of fixed segment, we'll randomly upgrade a segment during spin
            
            gameState.segments = segments;
            return segments;
        }

        // ===== INITIALIZATION =====
        document.addEventListener('DOMContentLoaded', () => {
            console.log("🎡 Mega Wheel Game Initializing...");
            
            // Initialize Firebase
            try {
                firebase.initializeApp(firebaseConfig);
                console.log("✅ Firebase initialized");
                
                // Check authentication
                checkAuth();
            } catch (error) {
                console.log("Firebase already initialized or error:", error);
                checkAuth();
            }
            
            // Initialize game components
            initializeSegments();
            createWheel();
            updateSegmentList();
            updatePotentialWin();
            setupEventListeners();
            
            // Update jackpot display
            updateJackpotDisplay();
        });

        // ===== AUTHENTICATION =====
        function checkAuth() {
            const auth = firebase.auth();
            
            auth.onAuthStateChanged(user => {
                if (!user) {
                    showToast('Please login to play', 'error');
                    setTimeout(() => {
                        window.location.href = 'https://xcrazybet.github.io/millioner/login.html';
                    }, 2000);
                    return;
                }
                
                gameState.currentUser = user;
                console.log("✅ User authenticated:", user.uid);
                loadBalance();
            });
        }

        // ===== BALANCE MANAGEMENT =====
        async function loadBalance() {
            try {
                const db = firebase.firestore();
                const doc = await db.collection("wallets").doc(gameState.currentUser.uid).get();
                
                if (doc.exists) {
                    gameState.balance = doc.data().balance || 0;
                    updateBalanceDisplay();
                    showToast('🎡 Welcome to Mega Wheel!', 'success');
                    console.log("💰 Balance loaded:", gameState.balance);
                } else {
                    // Create wallet if doesn't exist
                    await db.collection("wallets").doc(gameState.currentUser.uid).set({
                        balance: 100,
                        createdAt: new Date(),
                        updatedAt: new Date()
                    });
                    gameState.balance = 100;
                    updateBalanceDisplay();
                    showToast('New wallet created with $100', 'success');
                }
                
                // Setup real-time balance listener
                setupBalanceListener();
                
                // Load game stats
                loadGameStats();
                
            } catch (error) {
                console.error('Error loading balance:', error);
                showToast('Error loading balance', 'error');
            }
        }

        function updateBalanceDisplay() {
            document.getElementById('balance-val').textContent = gameState.balance.toFixed(2);
        }

        // ===== REAL-TIME BALANCE LISTENER =====
        function setupBalanceListener() {
            const db = firebase.firestore();
            const walletRef = db.collection("wallets").doc(gameState.currentUser.uid);
            
            walletRef.onSnapshot((doc) => {
                if (doc.exists) {
                    const newBalance = doc.data().balance || 0;
                    if (newBalance !== gameState.balance) {
                        gameState.balance = newBalance;
                        updateBalanceDisplay();
                        updateBetLimits();
                    }
                }
            }, (error) => {
                console.error('Balance listener error:', error);
            });
        }

        // ===== ATOMIC TRANSACTIONS =====
        async function processTransaction(amount, type, description) {
            try {
                const db = firebase.firestore();
                const auth = firebase.auth();
                const walletRef = db.collection("wallets").doc(gameState.currentUser.uid);
                
                return await db.runTransaction(async (transaction) => {
                    const walletDoc = await transaction.get(walletRef);
                    
                    if (!walletDoc.exists) {
                        throw new Error("Wallet not found");
                    }
                    
                    const currentBalance = walletDoc.data().balance || 0;
                    const newBalance = currentBalance + amount;
                    
                    if (newBalance < 0) {
                        throw new Error("Insufficient funds");
                    }
                    
                    // Update main balance
                    transaction.update(walletRef, {
                        balance: newBalance,
                        updatedAt: new Date()
                    });
                    
                    // Record transaction
                    const transactionRef = walletRef.collection("transactions").doc();
                    transaction.set(transactionRef, {
                        type: type,
                        amount: amount,
                        description: description,
                        createdAt: new Date(),
                        gameId: 'mega_wheel',
                        beforeBalance: currentBalance,
                        afterBalance: newBalance
                    });
                    
                    // Update local balance
                    gameState.balance = newBalance;
                    updateBalanceDisplay();
                    
                    return { success: true, newBalance };
                    
                });
            } catch (error) {
                console.error('Transaction failed:', error);
                showToast('Transaction failed: ' + error.message, 'error');
                return { success: false, error: error.message };
            }
        }

        // ===== WHEEL CREATION =====
        function createWheel() {
            const wheel = document.getElementById('wheel');
            wheel.innerHTML = '';
            
            const segmentAngle = 360 / gameState.segments.length;
            
            gameState.segments.forEach((segment, index) => {
                const segmentElement = document.createElement('div');
                segmentElement.className = 'wheel-segment';
                segmentElement.dataset.segmentId = segment.id;
                
                // Calculate rotation for this segment
                const rotation = segmentAngle * index;
                segmentElement.style.transform = `rotate(${rotation}deg)`;
                segmentElement.style.backgroundColor = segment.color;
                
                const innerElement = document.createElement('div');
                innerElement.className = 'wheel-segment-inner';
                innerElement.style.transform = `rotate(${segmentAngle / 2}deg)`;
                innerElement.innerHTML = `
                    <div class="segment-value">${segment.multiplier.toFixed(1)}x</div>
                    <div class="segment-label">${segment.name}</div>
                `;
                
                segmentElement.appendChild(innerElement);
                wheel.appendChild(segmentElement);
            });
        }

        function updateSegmentList() {
            const segmentList = document.getElementById('segment-list');
            segmentList.innerHTML = '';
            
            gameState.segments.forEach(segment => {
                const item = document.createElement('div');
                item.className = 'segment-item';
                item.style.borderLeftColor = segment.color;
                
                item.innerHTML = `
                    <div class="segment-color" style="background: ${segment.color}"></div>
                    <div class="segment-name">${segment.name}</div>
                    <div class="segment-payout">${segment.multiplier.toFixed(1)}x</div>
                `;
                
                segmentList.appendChild(item);
            });
        }

        // ===== GAME FUNCTIONS =====
        async function spinWheel() {
            const betAmount = parseFloat(document.getElementById('bet-amount').value);
            
            // Validation
            if (betAmount < 1 || betAmount > Math.min(gameState.balance, 1000)) {
                showToast('Invalid bet amount', 'error');
                return;
            }
            
            if (gameState.wheelSpinning) {
                showToast('Wheel already spinning', 'warning');
                return;
            }
            
            // Process bet transaction (bet + jackpot contribution)
            const jackpotContribution = betAmount * gameState.jackpotContribution;
            const totalDeduction = betAmount + jackpotContribution;
            
            const betResult = await processTransaction(
                -totalDeduction,
                "megawheel_bet",
                `Mega Wheel bet of $${betAmount} (Jackpot: $${jackpotContribution.toFixed(2)})`
            );
            
            if (!betResult.success) {
                showToast('Failed to place bet', 'error');
                return;
            }
            
            // Add to jackpot
            gameState.jackpot += jackpotContribution;
            updateJackpotDisplay();
            
            // Update game state
            gameState.wheelSpinning = true;
            gameState.betAmount = betAmount;
            gameState.currentSpin = {
                bet: betAmount,
                segment: null,
                winAmount: 0,
                spinId: 'wheel_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9),
                timestamp: new Date()
            };
            
            // Update UI
            document.getElementById('spin-button').disabled = true;
            document.getElementById('bet-amount').disabled = true;
            
            // Determine winning segment (with 90% lose bias)
            const winningSegment = determineWinningSegment();
            gameState.currentSpin.segment = winningSegment;
            
            // Calculate win amount
            const winAmount = parseFloat((betAmount * winningSegment.multiplier).toFixed(2));
            gameState.currentSpin.winAmount = winAmount;
            
            // Start wheel animation
            animateWheel(winningSegment);
            
            // Update stats
            updateStats('spin');
            
            console.log("🎡 Spinning wheel... Bet: $" + betAmount, "Target segment: " + winningSegment.name);
        }

        function determineWinningSegment() {
            const random = Math.random();
            let selectedSegment;
            
            // Apply 90% lose bias
            if (random < 0.90) { // 90% chance for lose/small win
                // Within the 90%, make 80% chance of actual loss (0.1x-1x)
                if (random < 0.72) { // 72% of total = lose
                    const loseSegments = gameState.segments.filter(s => s.type === 'lose');
                    selectedSegment = loseSegments[Math.floor(Math.random() * loseSegments.length)];
                } else { // 18% of total = small win
                    const smallSegments = gameState.segments.filter(s => s.type === 'small');
                    selectedSegment = smallSegments[Math.floor(Math.random() * smallSegments.length)];
                }
            } else { // 10% chance for decent win
                if (random < 0.98) { // 8% of total = medium win
                    const mediumSegments = gameState.segments.filter(s => s.type === 'medium');
                    selectedSegment = mediumSegments[Math.floor(Math.random() * mediumSegments.length)];
                } else { // 2% of total = big win (jackpot chance)
                    // Create a special big win segment
                    selectedSegment = {
                        ...gameState.segments[Math.floor(Math.random() * gameState.segments.length)],
                        name: 'JACKPOT',
                        multiplier: 10 + (Math.random() * 10), // 10x to 20x
                        type: 'big'
                    };
                }
            }
            
            return selectedSegment;
        }

        function animateWheel(winningSegment) {
            const wheel = document.getElementById('wheel');
            const segments = gameState.segments;
            const segmentIndex = winningSegment.id;
            
            // Calculate stop angle (segment should land at pointer)
            const segmentAngle = 360 / segments.length;
            const stopAngle = 3600 - (segmentIndex * segmentAngle) - (segmentAngle / 2);
            
            // Apply animation
            wheel.style.transition = 'transform 5s cubic-bezier(0.17, 0.67, 0.23, 0.99)';
            wheel.style.transform = `rotate(${stopAngle}deg)`;
            
            // Play spin sound
            playSound('spin');
            
            // After animation completes
            setTimeout(() => {
                finishSpin(winningSegment);
            }, 5000);
        }

        async function finishSpin(winningSegment) {
            gameState.wheelSpinning = false;
            
            // Update UI
            document.getElementById('spin-button').disabled = false;
            document.getElementById('bet-amount').disabled = false;
            
            const winAmount = gameState.currentSpin.winAmount;
            
            if (winningSegment.multiplier > 1) {
                // Win
                gameState.stats.consecutiveLosses = 0;
                
                // Process win transaction
                await processTransaction(
                    winAmount,
                    "megawheel_win",
                    `Mega Wheel win ${winningSegment.multiplier.toFixed(1)}x - $${winAmount.toFixed(2)}`
                );
                
                // Check for jackpot win (rare chance)
                if (winningSegment.type === 'big' && Math.random() < 0.01) {
                    winJackpot();
                } else {
                    showWinResult(winningSegment, winAmount);
                }
                
                // Update stats
                updateStats('win', winAmount);
                
                // Play win sound
                playSound('win');
                
            } else {
                // Loss
                gameState.stats.consecutiveLosses++;
                
                // Show lose result
                showLoseResult(winningSegment);
                
                // Update stats
                updateStats('lose');
                
                // Play lose sound
                playSound('lose');
            }
            
            // Add to history
            addSpinHistory(winningSegment, winAmount);
            
            // Check for jackpot trigger (after many losses)
            if (gameState.stats.consecutiveLosses >= 50 && Math.random() < 0.1) {
                triggerLossJackpot();
            }
        }

        function winJackpot() {
            gameState.jackpotWon = true;
            const jackpotAmount = gameState.jackpot;
            
            // Process jackpot win
            processTransaction(
                jackpotAmount,
                "megawheel_jackpot",
                `🎉 MEGA JACKPOT WIN! $${jackpotAmount.toFixed(2)}`
            );
            
            // Show jackpot result
            document.getElementById('result-title').textContent = '🎉 MEGA JACKPOT!';
            document.getElementById('result-segment').innerHTML = `
                <div style="width: 30px; height: 30px; background: var(--gold); border-radius: 5px; margin-right: 10px;"></div>
                <div>JACKPOT SEGMENT</div>
            `;
            document.getElementById('result-multiplier').textContent = 'JACKPOT!';
            document.getElementById('result-amount').textContent = `+$${jackpotAmount.toFixed(2)}`;
            
            document.getElementById('result-overlay').classList.add('show');
            
            // Reset jackpot
            gameState.jackpot = 10000;
            updateJackpotDisplay();
            
            // Show confetti
            createConfetti();
            
            // Play jackpot sound
            playSound('jackpot');
            
            showToast('🎉 MEGA JACKPOT WON!', 'success');
        }

        function triggerLossJackpot() {
            // Small consolation jackpot for many losses
            const consolation = gameState.jackpot * 0.01; // 1% of jackpot
            
            processTransaction(
                consolation,
                "megawheel_consolation",
                `Consolation jackpot after many losses: $${consolation.toFixed(2)}`
            );
            
            showToast(`🎁 Consolation jackpot: $${consolation.toFixed(2)} after many losses!`, 'warning');
            
            // Reduce jackpot
            gameState.jackpot -= consolation;
            updateJackpotDisplay();
        }

        function showWinResult(segment, winAmount) {
            document.getElementById('result-title').textContent = 'YOU WON!';
            document.getElementById('result-title').className = 'result-title result-win';
            document.getElementById('result-segment').innerHTML = `
                <div style="width: 30px; height: 30px; background: ${segment.color}; border-radius: 5px; margin-right: 10px;"></div>
                <div>${segment.name}</div>
            `;
            document.getElementById('result-multiplier').textContent = `Multiplier: ${segment.multiplier.toFixed(1)}x`;
            document.getElementById('result-amount').textContent = `+$${winAmount.toFixed(2)}`;
            
            document.getElementById('result-overlay').classList.add('show');
            
            // Show confetti for big wins
            if (segment.multiplier >= 5) {
                createConfetti();
            }
        }

        function showLoseResult(segment) {
            document.getElementById('result-title').textContent = 'TRY AGAIN';
            document.getElementById('result-title').className = 'result-title';
            document.getElementById('result-title').style.color = 'var(--text-dim)';
            document.getElementById('result-segment').innerHTML = `
                <div style="width: 30px; height: 30px; background: ${segment.color}; border-radius: 5px; margin-right: 10px;"></div>
                <div>${segment.name}</div>
            `;
            document.getElementById('result-multiplier').textContent = `Multiplier: ${segment.multiplier.toFixed(1)}x`;
            document.getElementById('result-amount').textContent = `-$${gameState.betAmount.toFixed(2)}`;
            document.getElementById('result-amount').style.color = 'var(--danger)';
            
            document.getElementById('result-overlay').classList.add('show');
        }

        function resetGame() {
            // Hide result overlay
            document.getElementById('result-overlay').classList.remove('show');
            
            // Reset wheel position with smooth transition
            const wheel = document.getElementById('wheel');
            wheel.style.transition = 'transform 1s ease-out';
            wheel.style.transform = 'rotate(0deg)';
            
            // Update potential win
            updatePotentialWin();
        }

        // ===== UI FUNCTIONS =====
        function updatePotentialWin() {
            const betAmount = parseFloat(document.getElementById('bet-amount').value) || 0;
            
            // Calculate average expected win (weighted by segment probabilities)
            let totalProbability = 0;
            let expectedWin = 0;
            
            gameState.segments.forEach(segment => {
                const segmentProb = segment.probability || (1 / gameState.segments.length);
                totalProbability += segmentProb;
                expectedWin += segmentProb * segment.multiplier * betAmount;
            });
            
            // Normalize by total probability
            expectedWin /= totalProbability;
            
            document.getElementById('potential-win').textContent = `$${expectedWin.toFixed(2)}`;
        }

        function updateBetLimits() {
            const betInput = document.getElementById('bet-amount');
            const maxBet = Math.min(gameState.balance, 1000);
            betInput.max = maxBet;
            
            if (parseFloat(betInput.value) > maxBet) {
                betInput.value = maxBet;
                gameState.betAmount = maxBet;
            }
            
            updatePotentialWin();
        }

        function updateJackpotDisplay() {
            document.getElementById('jackpot-value').textContent = `$${gameState.jackpot.toFixed(2)}`;
            
            // Add pulse animation if jackpot is high
            const jackpotDisplay = document.getElementById('jackpot-display');
            if (gameState.jackpot > 50000) {
                jackpotDisplay.style.animation = 'jackpotPulse 2s infinite';
            } else {
                jackpotDisplay.style.animation = 'none';
            }
        }

        function updateStats(type, amount = 0) {
            if (type === 'spin') {
                gameState.stats.spinsToday++;
                gameState.stats.totalSpins++;
                document.getElementById('spins-today').textContent = gameState.stats.spinsToday;
            }
            
            if (type === 'win') {
                gameState.stats.totalWon += amount;
                if (amount > gameState.stats.biggestWin) {
                    gameState.stats.biggestWin = amount;
                }
                gameState.stats.lastWinTime = new Date();
            }
            
            if (type === 'lose') {
                gameState.stats.totalLost += gameState.betAmount;
            }
            
            // Calculate win rate
            const winRate = gameState.stats.totalSpins > 0 
                ? Math.round((gameState.stats.totalWon / (gameState.stats.totalWon + gameState.stats.totalLost)) * 100)
                : 0;
            
            // Update UI
            document.getElementById('total-won').textContent = `$${gameState.stats.totalWon.toFixed(2)}`;
            document.getElementById('biggest-win').textContent = `$${gameState.stats.biggestWin.toFixed(2)}`;
            document.getElementById('win-rate').textContent = `${winRate}%`;
            
            // Save stats to localStorage
            saveGameStats();
        }

        function loadGameStats() {
            try {
                const savedStats = localStorage.getItem('megaWheelStats');
                if (savedStats) {
                    const stats = JSON.parse(savedStats);
                    
                    // Check if stats are from today
                    const today = new Date().toDateString();
                    if (stats.date === today) {
                        gameState.stats.spinsToday = stats.spinsToday || 0;
                        document.getElementById('spins-today').textContent = gameState.stats.spinsToday;
                    }
                }
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        function saveGameStats() {
            try {
                const statsToSave = {
                    date: new Date().toDateString(),
                    spinsToday: gameState.stats.spinsToday,
                    totalSpins: gameState.stats.totalSpins,
                    totalWon: gameState.stats.totalWon,
                    totalLost: gameState.stats.totalLost,
                    biggestWin: gameState.stats.biggestWin,
                    lastWinTime: gameState.stats.lastWinTime
                };
                
                localStorage.setItem('megaWheelStats', JSON.stringify(statsToSave));
            } catch (error) {
                console.error('Error saving stats:', error);
            }
        }

        function addSpinHistory(segment, winAmount) {
            const historyList = document.getElementById('history-list');
            
            const historyItem = document.createElement('div');
            historyItem.className = 'history-item';
            
            const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            const isWin = winAmount > 0;
            
            historyItem.innerHTML = `
                <div>
                    ${time} - ${segment.name}
                </div>
                <div class="${isWin ? 'history-win' : 'history-loss'}">
                    ${isWin ? '+' : '-'}$${isWin ? winAmount.toFixed(2) : gameState.betAmount.toFixed(2)}
                </div>
            `;
            
            historyList.insertBefore(historyItem, historyList.firstChild);
            
            // Keep only last 10 items
            if (historyList.children.length > 10) {
                historyList.removeChild(historyList.lastChild);
            }
        }

        // ===== SOUND EFFECTS =====
        function playSound(type) {
            try {
                const audio = new Audio(gameState.sounds[type] || gameState.sounds.spin);
                audio.volume = 0.3;
                audio.play().catch(e => console.log("Sound play failed"));
            } catch (e) {
                console.log("Sound error:", e);
            }
        }

        // ===== CONFETTI EFFECT =====
        function createConfetti() {
            const container = document.getElementById('confetti-container');
            container.innerHTML = '';
            
            const colors = ['#ff6b35', '#ffd166', '#06d6a0', '#00b4d8', '#9d4edd', '#ff4d6d'];
            
            for (let i = 0; i < 150; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.opacity = '1';
                confetti.style.animation = `confetti ${2 + Math.random() * 3}s ease-out forwards`;
                confetti.style.animationDelay = Math.random() * 0.5 + 's';
                confetti.style.width = Math.random() * 10 + 5 + 'px';
                confetti.style.height = Math.random() * 10 + 5 + 'px';
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                
                container.appendChild(confetti);
                
                // Remove after animation
                setTimeout(() => {
                    if (container.contains(confetti)) {
                        container.removeChild(confetti);
                    }
                }, 5000);
            }
        }

        // ===== EVENT LISTENERS =====
        function setupEventListeners() {
            console.log("Setting up event listeners...");
            
            // Spin button
            document.getElementById('spin-button').addEventListener('click', spinWheel);
            
            // Play again button
            document.getElementById('play-again-btn').addEventListener('click', resetGame);
            
            // Quick bet buttons
            document.querySelectorAll('.quick-bet').forEach(btn => {
                btn.addEventListener('click', () => {
                    const amount = parseFloat(btn.dataset.amount);
                    document.getElementById('bet-amount').value = amount;
                    gameState.betAmount = amount;
                    updatePotentialWin();
                    
                    // Visual feedback
                    document.querySelectorAll('.quick-bet').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                });
            });
            
            // Bet input
            document.getElementById('bet-amount').addEventListener('input', (e) => {
                let value = parseFloat(e.target.value) || 1;
                value = Math.max(1, Math.min(value, Math.min(gameState.balance, 1000)));
                e.target.value = value;
                gameState.betAmount = value;
                updatePotentialWin();
                
                // Update quick bet selection
                document.querySelectorAll('.quick-bet').forEach(btn => {
                    btn.classList.toggle('active', parseFloat(btn.dataset.amount) === value);
                });
            });
            
            // Enter key to spin
            document.getElementById('bet-amount').addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && !gameState.wheelSpinning) {
                    spinWheel();
                }
            });
            
            console.log("✅ Event listeners setup complete!");
        }

        // ===== TOAST NOTIFICATIONS =====
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.add('show');
            }, 10);
            
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => {
                    if (container.contains(toast)) {
                        container.removeChild(toast);
                    }
                }, 300);
            }, 3000);
        }

        // ===== INITIAL SETUP =====
        // Update UI when balance is loaded
        setTimeout(() => {
            if (gameState.balance > 0) {
                updateBetLimits();
                showToast('🎡 Welcome to Mega Wheel! Spin to win big!', 'success');
            }
        }, 2000);

        console.log("🎡 Mega Wheel Game Ready!");
        console.log("💰 Real Money Integration: ACTIVE");
        console.log("🎯 90% Lose Rate System: ACTIVE");
        console.log("🎁 Progressive Jackpot: $" + gameState.jackpot);
        console.log("🎰 20 Segments with weighted distribution");
        console.log("🚀 Ready to spin!");
    </script>
</body>
</html>
