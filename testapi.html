// Fetch live price from Yahoo Finance
async function fetchPrice(symbol) {
    try {
        const response = await fetch(`https://query1.finance.yahoo.com/v7/finance/quote?symbols=${symbol}`);
        const data = await response.json();
        const quote = data.quoteResponse.result[0];
        return {
            price: quote.regularMarketPrice ?? 'N/A',
            change: quote.regularMarketChangePercent?.toFixed(2) ?? 0
        };
    } catch (err) {
        console.error(err);
        return { price: 'N/A', change: 0 };
    }
}

const marketContainer = document.getElementById('marketContainer');

async function renderMarket() {
    marketContainer.innerHTML = '';
    for (const market of marketData) {
        const priceData = await fetchPrice(market.symbol);
        const changeClass = priceData.change >= 0 ? 'up' : 'down';
        const card = document.createElement('div');
        card.className = 'market-card';
        card.innerHTML = `
            <img src="${market.icon}" alt="${market.name}">
            <div class="market-name">${market.name}</div>
            <div class="market-price">$${priceData.price}</div>
            <div class="market-change ${changeClass}">${priceData.change}%</div>
        `;
        marketContainer.appendChild(card);
    }
}

// Initial render
renderMarket();

// Refresh every 30 seconds
