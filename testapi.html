<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>XCrazyBet - API Test</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    body {
        background: linear-gradient(135deg, #0A0E17, #121826);
        color: white;
        min-height: 100vh;
        padding: 20px;
    }
    
    .container {
        max-width: 1200px;
        margin: 0 auto;
    }
    
    .header {
        text-align: center;
        margin-bottom: 30px;
        padding: 20px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 15px;
        border: 2px solid #FFD166;
    }
    
    .header h1 {
        color: #FFD166;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
    }
    
    .api-controls {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 10px;
        padding: 20px;
        margin-bottom: 20px;
        display: flex;
        gap: 15px;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
    }
    
    .endpoint-btn {
        padding: 10px 20px;
        background: #4361EE;
        border: none;
        border-radius: 8px;
        color: white;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
    }
    
    .endpoint-btn:hover {
        background: #3A56D4;
        transform: translateY(-2px);
    }
    
    .endpoint-btn.active {
        background: #FF6B6B;
    }
    
    .format-select {
        padding: 10px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid #4361EE;
        border-radius: 8px;
        color: white;
    }
    
    .format-select option {
        background: #121826;
    }
    
    .api-url-display {
        background: rgba(0, 0, 0, 0.3);
        padding: 15px;
        border-radius: 8px;
        margin: 15px 0;
        font-family: monospace;
        font-size: 14px;
        word-break: break-all;
        border-left: 4px solid #06D6A0;
    }
    
    .response-container {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 10px;
        padding: 20px;
        margin-top: 20px;
        display: none;
    }
    
    .response-container.active {
        display: block;
    }
    
    .response-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
        padding-bottom: 10px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .response-header h3 {
        color: #FFD166;
    }
    
    .status-badge {
        padding: 5px 10px;
        background: #06D6A0;
        border-radius: 4px;
        font-size: 12px;
        font-weight: 600;
    }
    
    .response-content {
        max-height: 500px;
        overflow-y: auto;
        background: rgba(0, 0, 0, 0.3);
        border-radius: 8px;
        padding: 15px;
        font-family: monospace;
        font-size: 12px;
        white-space: pre-wrap;
    }
    
    .matches-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
        gap: 15px;
        margin-top: 20px;
    }
    
    .match-card {
        background: rgba(26, 34, 56, 0.9);
        border-radius: 10px;
        padding: 15px;
        border: 2px solid #4361EE;
        transition: all 0.3s;
    }
    
    .match-card:hover {
        transform: translateY(-5px);
        border-color: #FFD166;
    }
    
    .match-card.live {
        border-color: #FF6B6B;
        animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
        0% { box-shadow: 0 0 0 0 rgba(255, 107, 107, 0.7); }
        70% { box-shadow: 0 0 0 10px rgba(255, 107, 107, 0); }
        100% { box-shadow: 0 0 0 0 rgba(255, 107, 107, 0); }
    }
    
    .match-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
        padding-bottom: 10px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .league {
        font-size: 12px;
        color: #B0B7C3;
        font-weight: 500;
    }
    
    .match-time {
        font-size: 11px;
        color: #FFD166;
        font-weight: 600;
        padding: 4px 8px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 6px;
    }
    
    .match-time.live {
        background: #FF6B6B;
        color: white;
        animation: pulse 2s infinite;
    }
    
    .teams {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
    }
    
    .team {
        flex: 1;
        text-align: center;
        font-size: 14px;
        font-weight: 600;
    }
    
    .vs {
        padding: 0 15px;
        color: #B0B7C3;
        font-weight: 700;
    }
    
    .odds {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-top: 15px;
    }
    
    .odd {
        padding: 10px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 8px;
        text-align: center;
        border: 1px solid transparent;
    }
    
    .odd:hover {
        background: rgba(255, 255, 255, 0.1);
    }
    
    .odd-type {
        font-size: 10px;
        color: #B0B7C3;
        margin-bottom: 4px;
    }
    
    .odd-value {
        font-size: 14px;
        font-weight: 700;
        color: #FFD166;
    }
    
    .prediction-card {
        background: rgba(26, 34, 56, 0.9);
        border-radius: 10px;
        padding: 15px;
        border: 2px solid #06D6A0;
        margin-bottom: 15px;
    }
    
    .prediction-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
    }
    
    .prediction-match {
        font-weight: 600;
        font-size: 14px;
    }
    
    .prediction-confidence {
        padding: 4px 8px;
        background: rgba(6, 214, 160, 0.2);
        border-radius: 4px;
        font-size: 11px;
        font-weight: 600;
        color: #06D6A0;
    }
    
    .prediction-result {
        font-size: 13px;
        color: #B0B7C3;
        margin-bottom: 10px;
    }
    
    .prediction-reason {
        font-size: 12px;
        color: #B0B7C3;
        font-style: italic;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        padding-top: 10px;
    }
    
    .loading {
        text-align: center;
        padding: 40px;
        color: #B0B7C3;
    }
    
    .loading i {
        font-size: 30px;
        color: #FFD166;
        margin-bottom: 10px;
        display: block;
        animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
    
    .error {
        background: rgba(239, 71, 111, 0.1);
        border: 1px solid #EF476F;
        border-radius: 8px;
        padding: 20px;
        text-align: center;
        color: #FF6B6B;
        margin: 20px 0;
    }
</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-api"></i> XCrazyBet API Test</h1>
            <p>Testing the new API endpoints for sports betting</p>
        </div>
        
        <div class="api-controls">
            <button class="endpoint-btn active" data-endpoint="live">
                <i class="fas fa-broadcast-tower"></i> LIVE Matches
            </button>
            <button class="endpoint-btn" data-endpoint="fixtures">
                <i class="fas fa-calendar-alt"></i> UPCOMING Matches
            </button>
            <button class="endpoint-btn" data-endpoint="predictions">
                <i class="fas fa-brain"></i> AI PREDICTIONS
            </button>
            <button class="endpoint-btn" data-endpoint="odds">
                <i class="fas fa-chart-line"></i> VALUE BETS
            </button>
            
            <select class="format-select" id="formatSelect">
                <option value="json">JSON Format</option>
                <option value="xml">XML Format</option>
                <option value="txt">TXT Format</option>
            </select>
            
            <button id="fetchBtn" class="endpoint-btn" style="background: #06D6A0;">
                <i class="fas fa-download"></i> FETCH DATA
            </button>
        </div>
        
        <div class="api-url-display" id="apiUrlDisplay">
            https://xcrazybet.github.io/millioner/api.html?endpoint=live&format=json
        </div>
        
        <div class="response-container" id="responseContainer">
            <div class="response-header">
                <h3>API Response</h3>
                <div class="status-badge" id="statusBadge">Ready</div>
            </div>
            <div class="response-content" id="responseContent">
                // Response will appear here
            </div>
        </div>
        
        <div id="matchesContainer"></div>
        <div id="predictionsContainer"></div>
    </div>

<script>
    const API_BASE = 'https://xcrazybet.github.io/millioner/api.html';
    let currentEndpoint = 'live';
    let currentFormat = 'json';
    
    // DOM Elements
    const apiUrlDisplay = document.getElementById('apiUrlDisplay');
    const responseContainer = document.getElementById('responseContainer');
    const responseContent = document.getElementById('responseContent');
    const statusBadge = document.getElementById('statusBadge');
    const formatSelect = document.getElementById('formatSelect');
    const fetchBtn = document.getElementById('fetchBtn');
    const matchesContainer = document.getElementById('matchesContainer');
    const predictionsContainer = document.getElementById('predictionsContainer');
    
    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
        updateApiUrl();
        setupEventListeners();
    });
    
    function setupEventListeners() {
        // Endpoint buttons
        document.querySelectorAll('.endpoint-btn[data-endpoint]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.endpoint-btn[data-endpoint]').forEach(b => {
                    b.classList.remove('active');
                });
                btn.classList.add('active');
                currentEndpoint = btn.dataset.endpoint;
                updateApiUrl();
            });
        });
        
        // Format select
        formatSelect.addEventListener('change', () => {
            currentFormat = formatSelect.value;
            updateApiUrl();
        });
        
        // Fetch button
        fetchBtn.addEventListener('click', fetchApiData);
    }
    
    function updateApiUrl() {
        const url = `${API_BASE}?endpoint=${currentEndpoint}&format=${currentFormat}`;
        apiUrlDisplay.textContent = url;
    }
    
    async function fetchApiData() {
        const url = `${API_BASE}?endpoint=${currentEndpoint}&format=${currentFormat}`;
        
        // Show loading
        statusBadge.textContent = 'Loading...';
        statusBadge.style.background = '#FFD166';
        responseContainer.classList.add('active');
        responseContent.textContent = 'Loading data...';
        
        matchesContainer.innerHTML = '';
        predictionsContainer.innerHTML = '';
        
        try {
            const response = await fetch(url);
            const data = await response.text();
            
            // Update status
            statusBadge.textContent = `Status: ${response.status}`;
            statusBadge.style.background = response.ok ? '#06D6A0' : '#FF6B6B';
            
            // Display raw response
            responseContent.textContent = data;
            
            // Try to parse and display formatted data
            if (currentFormat === 'json' && response.ok) {
                try {
                    const jsonData = JSON.parse(data);
                    displayFormattedData(jsonData);
                } catch (e) {
                    console.log('Not valid JSON or different format');
                }
            }
            
        } catch (error) {
            statusBadge.textContent = 'Error';
            statusBadge.style.background = '#FF6B6B';
            responseContent.textContent = `Error fetching data: ${error.message}`;
            console.error('API Error:', error);
        }
    }
    
    function displayFormattedData(data) {
        // Clear previous displays
        matchesContainer.innerHTML = '';
        predictionsContainer.innerHTML = '';
        
        if (currentEndpoint === 'live' || currentEndpoint === 'fixtures') {
            displayMatches(data);
        } else if (currentEndpoint === 'predictions') {
            displayPredictions(data);
        } else if (currentEndpoint === 'odds') {
            displayValueBets(data);
        }
    }
    
    function displayMatches(data) {
        // Check if data is in expected format
        if (!data || (!Array.isArray(data) && !data.matches)) {
            matchesContainer.innerHTML = `
                <div class="error">
                    <i class="fas fa-exclamation-triangle"></i>
                    <p>No match data found in response</p>
                    <p style="font-size: 11px; margin-top: 5px;">Check API response format</p>
                </div>
            `;
            return;
        }
        
        const matches = Array.isArray(data) ? data : data.matches || [];
        
        if (matches.length === 0) {
            matchesContainer.innerHTML = `
                <div class="error">
                    <i class="fas fa-futbol"></i>
                    <p>No matches available</p>
                </div>
            `;
            return;
        }
        
        matchesContainer.innerHTML = `<h2 style="color: #FFD166; margin: 20px 0;">${matches.length} Matches Found</h2>`;
        const matchesGrid = document.createElement('div');
        matchesGrid.className = 'matches-grid';
        
        matches.forEach(match => {
            const matchCard = document.createElement('div');
            matchCard.className = `match-card ${currentEndpoint === 'live' ? 'live' : ''}`;
            
            // Extract match data with fallbacks
            const league = match.league || match.competition || 'Unknown League';
            const homeTeam = match.home_team || match.homeTeam || 'Home Team';
            const awayTeam = match.away_team || match.awayTeam || 'Away Team';
            const time = match.time || match.date || 'TBD';
            const status = match.status || (currentEndpoint === 'live' ? 'live' : 'upcoming');
            
            // Extract odds with fallbacks
            let homeOdds = 1.85;
            let drawOdds = 3.40;
            let awayOdds = 2.10;
            
            if (match.odds) {
                if (Array.isArray(match.odds) && match.odds.length >= 3) {
                    homeOdds = match.odds[0] || 1.85;
                    drawOdds = match.odds[1] || 3.40;
                    awayOdds = match.odds[2] || 2.10;
                } else if (match.odds.home !== undefined) {
                    homeOdds = match.odds.home;
                    drawOdds = match.odds.draw || 3.40;
                    awayOdds = match.odds.away;
                }
            }
            
            matchCard.innerHTML = `
                <div class="match-header">
                    <div class="league">${league}</div>
                    <div class="match-time ${status === 'live' ? 'live' : ''}">
                        ${status === 'live' ? 'LIVE' : time}
                    </div>
                </div>
                
                <div class="teams">
                    <div class="team">${homeTeam}</div>
                    <div class="vs">VS</div>
                    <div class="team">${awayTeam}</div>
                </div>
                
                <div class="odds">
                    <div class="odd">
                        <div class="odd-type">${homeTeam.substring(0, 10)}</div>
                        <div class="odd-value">${homeOdds.toFixed(2)}</div>
                    </div>
                    <div class="odd">
                        <div class="odd-type">Draw</div>
                        <div class="odd-value">${drawOdds.toFixed(2)}</div>
                    </div>
                    <div class="odd">
                        <div class="odd-type">${awayTeam.substring(0, 10)}</div>
                        <div class="odd-value">${awayOdds.toFixed(2)}</div>
                    </div>
                </div>
            `;
            
            matchesGrid.appendChild(matchCard);
        });
        
        matchesContainer.appendChild(matchesGrid);
    }
    
    function displayPredictions(data) {
        if (!data || (!Array.isArray(data) && !data.predictions)) {
            predictionsContainer.innerHTML = `
                <div class="error">
                    <i class="fas fa-brain"></i>
                    <p>No prediction data found</p>
                </div>
            `;
            return;
        }
        
        const predictions = Array.isArray(data) ? data : data.predictions || [];
        
        if (predictions.length === 0) {
            predictionsContainer.innerHTML = `
                <div class="error">
                    <i class="fas fa-brain"></i>
                    <p>No AI predictions available</p>
                </div>
            `;
            return;
        }
        
        predictionsContainer.innerHTML = `<h2 style="color: #06D6A0; margin: 20px 0;">AI Predictions (${predictions.length})</h2>`;
        
        predictions.forEach(prediction => {
            const card = document.createElement('div');
            card.className = 'prediction-card';
            
            const match = prediction.match || `${prediction.home_team || 'Team A'} vs ${prediction.away_team || 'Team B'}`;
            const predictedResult = prediction.prediction || prediction.result || 'No prediction';
            const confidence = prediction.confidence || prediction.probability || 'N/A';
            const reason = prediction.reason || prediction.analysis || 'No analysis provided';
            
            card.innerHTML = `
                <div class="prediction-header">
                    <div class="prediction-match">${match}</div>
                    <div class="prediction-confidence">${confidence}% confidence</div>
                </div>
                <div class="prediction-result">
                    <strong>Prediction:</strong> ${predictedResult}
                </div>
                <div class="prediction-reason">
                    ${reason}
                </div>
            `;
            
            predictionsContainer.appendChild(card);
        });
    }
    
    function displayValueBets(data) {
        if (!data || (!Array.isArray(data) && !data.value_bets)) {
            matchesContainer.innerHTML = `
                <div class="error">
                    <i class="fas fa-chart-line"></i>
                    <p>No value bet data found</p>
                </div>
            `;
            return;
        }
        
        const valueBets = Array.isArray(data) ? data : data.value_bets || [];
        
        if (valueBets.length === 0) {
            matchesContainer.innerHTML = `
                <div class="error">
                    <i class="fas fa-chart-line"></i>
                    <p>No value bets identified</p>
                </div>
            `;
            return;
        }
        
        matchesContainer.innerHTML = `<h2 style="color: #4361EE; margin: 20px 0;">Value Bets (${valueBets.length})</h2>`;
        const matchesGrid = document.createElement('div');
        matchesGrid.className = 'matches-grid';
        
        valueBets.forEach(bet => {
            const matchCard = document.createElement('div');
            matchCard.className = 'match-card';
            matchCard.style.borderColor = '#7209B7';
            
            const match = bet.match || `${bet.home_team || 'Team A'} vs ${bet.away_team || 'Team B'}`;
            const league = bet.league || 'Various';
            const value = bet.value || bet.value_percentage || 'N/A';
            const recommendedBet = bet.recommended_bet || bet.selection || 'No specific bet';
            const odds = bet.odds || 2.00;
            
            matchCard.innerHTML = `
                <div class="match-header">
                    <div class="league">${league}</div>
                    <div class="match-time" style="background: #7209B7;">
                        Value: ${value}%
                    </div>
                </div>
                
                <div class="teams" style="margin-bottom: 15px;">
                    <div style="text-align: center; width: 100%; font-weight: 600;">
                        ${match}
                    </div>
                </div>
                
                <div style="background: rgba(114, 9, 183, 0.1); padding: 10px; border-radius: 8px; margin-bottom: 10px;">
                    <div style="font-size: 12px; color: #B0B7C3;">Recommended Bet:</div>
                    <div style="font-size: 14px; font-weight: 600; color: #FFD166;">${recommendedBet}</div>
                </div>
                
                <div class="odds">
                    <div class="odd" style="grid-column: 1 / -1; background: rgba(114, 9, 183, 0.2);">
                        <div class="odd-type">Value Odds</div>
                        <div class="odd-value">${odds.toFixed(2)}</div>
                    </div>
                </div>
            `;
            
            matchesGrid.appendChild(matchCard);
        });
        
        matchesContainer.appendChild(matchesGrid);
    }
    
    // Auto-fetch on page load
    setTimeout(fetchApiData, 1000);
</script>
</body>
</html>
