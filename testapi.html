<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚽ XCrazyBet - Football Betting</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: #0a0f1a;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            background: #111827;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #00ff9d;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 18px;
            font-weight: 700;
            color: #00ff9d;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .balance-display {
            background: #1a2332;
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid #00ff9d;
            color: #00ff9d;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        /* Main Layout - 2 Columns */
        .main-layout {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 20px;
            max-width: 1400px;
            margin: 20px auto;
            padding: 0 20px;
            flex: 1;
        }

        /* Left Column - Matches */
        .matches-section {
            background: #111827;
            border-radius: 15px;
            padding: 20px;
            border: 1px solid #ff9800;
        }

        .section-title {
            color: #ff9800;
            font-size: 16px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* League Filter */
        .league-filter {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .league-btn {
            padding: 6px 12px;
            background: #1a2332;
            border: 1px solid #00ff9d;
            border-radius: 20px;
            color: white;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .league-btn:hover, .league-btn.active {
            background: #00ff9d;
            color: #000;
        }

        /* Status Indicators */
        .status-indicators {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            font-size: 12px;
        }

        .indicator {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .indicator.live { color: #ff4757; }
        .indicator.upcoming { color: #ff9800; }
        .indicator.finished { color: #00ff9d; }

        /* Matches Grid */
        .matches-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: calc(100vh - 250px);
            overflow-y: auto;
            padding-right: 5px;
        }

        .matches-grid::-webkit-scrollbar {
            width: 5px;
        }

        .matches-grid::-webkit-scrollbar-thumb {
            background: #00ff9d;
            border-radius: 5px;
        }

        .match-card {
            background: #1a2332;
            border-radius: 10px;
            padding: 12px;
            border: 1px solid #333;
            transition: all 0.2s;
        }

        .match-card:hover {
            border-color: #00ff9d;
        }

        .match-card.live {
            border-left: 3px solid #ff4757;
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 11px;
        }

        .league-info {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .league-logo {
            width: 16px;
            height: 16px;
            object-fit: contain;
        }

        .league-name {
            color: #a0a8c9;
        }

        .match-time {
            padding: 2px 6px;
            background: #111827;
            border-radius: 3px;
            color: #ff9800;
            font-weight: 600;
        }

        .match-time.live {
            background: #ff4757;
            color: white;
        }

        .teams {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .team {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
        }

        .team.away {
            justify-content: flex-end;
        }

        .team-logo {
            width: 24px;
            height: 24px;
            object-fit: contain;
        }

        .team-name {
            font-size: 13px;
            font-weight: 600;
        }

        .score {
            font-size: 16px;
            font-weight: 700;
            color: #00ff9d;
            margin: 0 15px;
        }

        /* Betting Options - 1X2 */
        .betting-options {
            display: flex;
            gap: 5px;
        }

        .bet-option {
            flex: 1;
            padding: 8px 5px;
            background: #111827;
            border: 1px solid #333;
            border-radius: 5px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
        }

        .bet-option:hover {
            border-color: #00ff9d;
            background: #1a2332;
        }

        .bet-option.selected {
            border-color: #00ff9d;
            background: rgba(0,255,157,0.1);
        }

        .bet-type {
            font-size: 11px;
            color: #a0a8c9;
            margin-bottom: 2px;
        }

        .bet-odds {
            font-size: 14px;
            font-weight: 700;
            color: #00ff9d;
        }

        /* Right Column - Bet Slip (Smaller) */
        .betslip-section {
            background: #111827;
            border-radius: 15px;
            padding: 15px;
            border: 2px solid #00ff9d;
            position: sticky;
            top: 80px;
            height: fit-content;
        }

        .betslip-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #333;
        }

        .betslip-title {
            color: #00ff9d;
            font-weight: 700;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .betslip-clear {
            color: #ff4757;
            cursor: pointer;
            font-size: 12px;
        }

        .betslip-items {
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 12px;
        }

        .betslip-items::-webkit-scrollbar {
            width: 3px;
        }

        .betslip-items::-webkit-scrollbar-thumb {
            background: #00ff9d;
            border-radius: 3px;
        }

        .betslip-item {
            background: #1a2332;
            border-radius: 6px;
            padding: 8px;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
        }

        .betslip-match {
            font-weight: 600;
            margin-bottom: 2px;
        }

        .betslip-details {
            color: #a0a8c9;
            font-size: 10px;
        }

        .betslip-odds {
            color: #00ff9d;
            font-weight: 700;
            font-size: 12px;
        }

        .betslip-remove {
            color: #ff4757;
            cursor: pointer;
            margin-left: 8px;
        }

        .betslip-total {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-top: 1px solid #333;
            font-size: 13px;
            font-weight: 600;
        }

        .total-odds {
            color: #00ff9d;
            font-size: 16px;
        }

        /* Quick Bets - Smaller */
        .quick-bets {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            margin: 10px 0;
        }

        .quick-bet {
            padding: 6px;
            background: #1a2332;
            border: 1px solid #00ff9d;
            border-radius: 4px;
            color: #00ff9d;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            font-size: 11px;
        }

        .quick-bet:hover {
            background: #00ff9d;
            color: #000;
        }

        .bet-input-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 10px 0;
            background: #1a2332;
            border: 1px solid #00ff9d;
            border-radius: 5px;
            padding: 0 10px;
        }

        .bet-input {
            flex: 1;
            padding: 8px 0;
            background: transparent;
            border: none;
            color: white;
            font-size: 14px;
            font-weight: 600;
        }

        .bet-input:focus {
            outline: none;
        }

        .currency {
            color: #00ff9d;
            font-weight: 700;
        }

        .potential-win {
            font-size: 12px;
            color: #a0a8c9;
            margin: 8px 0;
            display: flex;
            justify-content: space-between;
        }

        .potential-win span {
            color: #00ff9d;
            font-size: 14px;
            font-weight: 700;
        }

        .place-bet-btn {
            width: 100%;
            padding: 10px;
            background: #00ff9d;
            border: none;
            border-radius: 5px;
            color: #000;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .place-bet-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 10px rgba(0,255,157,0.2);
        }

        .place-bet-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* History Panel - Smaller */
        .history-section {
            grid-column: span 2;
            background: #111827;
            border-radius: 15px;
            padding: 15px;
            border: 1px solid #ff9800;
            margin-top: 20px;
        }

        .history-list {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .history-item {
            background: #1a2332;
            border-radius: 8px;
            padding: 10px;
            min-width: 200px;
            border-left: 3px solid;
            font-size: 12px;
        }

        .history-item.win {
            border-color: #00ff9d;
        }

        .history-item.lose {
            border-color: #ff4757;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        .history-time {
            color: #a0a8c9;
            font-size: 10px;
        }

        .history-amount.win {
            color: #00ff9d;
            font-weight: 700;
        }

        .history-amount.lose {
            color: #ff4757;
            font-weight: 700;
        }

        /* Bottom Nav */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            background: #111827;
            padding: 10px 15px;
            border-top: 2px solid #00ff9d;
            margin-top: 20px;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #a0a8c9;
            font-size: 11px;
            gap: 3px;
        }

        .nav-item i {
            font-size: 16px;
        }

        .nav-item.active {
            color: #00ff9d;
        }

        /* Result Overlay */
        .result-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .result-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .result-content {
            background: #111827;
            padding: 20px;
            border-radius: 15px;
            border: 3px solid #00ff9d;
            text-align: center;
            max-width: 300px;
            width: 90%;
        }

        .result-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .result-title.win { color: #00ff9d; }
        .result-title.lose { color: #ff4757; }

        .result-amount {
            font-size: 28px;
            font-weight: 700;
            margin: 15px 0;
        }

        .result-amount.win { color: #00ff9d; }
        .result-amount.lose { color: #ff4757; }

        .ok-btn {
            padding: 10px 25px;
            background: #00ff9d;
            border: none;
            border-radius: 5px;
            color: #000;
            font-weight: 700;
            cursor: pointer;
        }

        /* Toast */
        .toast-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10000;
            width: 90%;
            max-width: 300px;
        }

        .toast {
            padding: 10px 15px;
            background: #111827;
            border-radius: 5px;
            border-left: 3px solid #00ff9d;
            color: white;
            margin-top: 5px;
            font-size: 12px;
            transform: translateY(100%);
            opacity: 0;
            transition: all 0.3s;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.error { border-color: #ff4757; }

        /* Loading */
        .loading {
            text-align: center;
            padding: 30px;
            color: #a0a8c9;
        }

        .loading-spinner {
            border: 3px solid #1a2332;
            border-top: 3px solid #00ff9d;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 10px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 900px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
            
            .betslip-section {
                position: static;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="logo">
            <i class="fas fa-futbol"></i>

        </div>

    <!-- Main Layout -->
    <div class="main-layout">

            <!-- League Filter -->

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">

        </a>
        <a href="#" class="nav-item active">

        </a>
        <a href="#" class="nav-item">
            <i class="fas fa-history"></i>

        </a>
        <a href="#" class="nav-item">

            Wallet
        </a>

    <!-- Result Overlay -->
    <div class="result-overlay" id="result-overlay">
        <div class="result-content">
            <div class="result-title" id="result-title">BET PLACED</div>

                <i class="fas fa-check"></i> OK
            </button>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>

    <script>
        // ===== FIREBASE CONFIG =====
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };

        firebase.initializeApp(firebaseConfig);
        firebase.firestore().enablePersistence().catch(() => {});
        
        const auth = firebase.auth();
        const db = firebase.firestore();

        auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

        // ===== API CONFIG =====
        const API_KEY = '2396236d9d5cd07468ce280da8390ad5';
        const BASE_URL = 'https://v3.football.api-sports.io';

        // ===== BETTING RULES =====
        const BETTING_RULES = {
            minBet: 1,
            maxBet: 1000,
            maxSelections: 5,
            minSelections: 1,
            houseEdge: 0.07, // 7% house edge
            dailyMax: 500
        };

        // ===== GAME STATE =====
        const gameState = {
            currentUser: null,
            balance: 0,
            betAmount: 5,
            selectedBets: [],
            isPlacingBet: false,
            gameId: null,
            matches: [],
            filteredMatches: [],
            currentLeague: 'all',
            betHistory: [],
            stats: {
                totalBets: 0,
                wonBets: 0,
                lostBets: 0,
                totalWon: 0,
                totalLost: 0,
                totalStaked: 0
            },
            userLimits: {
                dailyMax: 500,
                perBetMin: 1,
                perBetMax: 1000,
                todayWagered: 0
            },
            currentBet: {
                stake: 0,
                totalOdds: 0,
                potentialWin: 0,
                selections: []
            }
        };

        // ===== INITIALIZATION =====
        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            setupEventListeners();
        });

        // ===== AUTHENTICATION =====
        function checkAuth() {
            auth.onAuthStateChanged((user) => {
                if (user) {
                    gameState.currentUser = user;
                    loadBalance();
                    loadMatches();
                    loadBetHistory();
                    loadUserLimits();
                    setupRealTimeListeners();
                } else {
                    showToast('Please login to continue', 'error');
                    setTimeout(() => {
                        window.location.href = 'https://xcrazybet.github.io/millioner/login.html';
                    }, 2000);
                }
            });
        }

        // ===== BALANCE MANAGEMENT =====
        async function loadBalance() {
            try {
                const doc = await db.collection("wallets").doc(gameState.currentUser.uid).get();
                if (doc.exists) {
                    gameState.balance = doc.data().balance || 0;
                } else {
                    await db.collection("wallets").doc(gameState.currentUser.uid).set({
                        balance: 100,
                        createdAt: new Date(),
                        updatedAt: new Date()
                    });
                    gameState.balance = 100;
                }
                updateBalanceDisplay();
            } catch (error) {
                console.error('Error loading balance:', error);
            }
        }

        function updateBalanceDisplay() {
            document.getElementById('balance-val').textContent = gameState.balance.toFixed(2);
        }

        function setupRealTimeListeners() {
            if (!gameState.currentUser) return;
            
            db.collection("wallets").doc(gameState.currentUser.uid).onSnapshot((doc) => {
                if (doc.exists) {
                    gameState.balance = doc.data().balance || 0;
                    updateBalanceDisplay();
                }
            });
        }

        // ===== LOAD USER LIMITS =====
        async function loadUserLimits() {
            try {
                const today = new Date().toDateString();
                const doc = await db.collection("user_limits").doc(gameState.currentUser.uid).get();
                
                if (doc.exists && doc.data().date === today) {
                    gameState.userLimits.todayWagered = doc.data().wagered || 0;
                } else {
                    gameState.userLimits.todayWagered = 0;
                }
            } catch (error) {
                console.error('Error loading limits:', error);
            }
        }

        // ===== TRANSACTIONS =====
        async function processTransaction(amount, type, description) {
            try {
                const walletRef = db.collection("wallets").doc(gameState.currentUser.uid);
                
                return await db.runTransaction(async (transaction) => {
                    const walletDoc = await transaction.get(walletRef);
                    
                    if (!walletDoc.exists) {
                        throw new Error("Wallet not found");
                    }
                    
                    const currentBalance = walletDoc.data().balance || 0;
                    const newBalance = currentBalance + amount;
                    
                    if (newBalance < 0) {
                        throw new Error("Insufficient funds");
                    }
                    
                    transaction.update(walletRef, {
                        balance: newBalance,
                        updatedAt: new Date()
                    });
                    
                    const transactionRef = walletRef.collection("transactions").doc();
                    transaction.set(transactionRef, {
                        type: type,
                        amount: amount,
                        description: description,
                        createdAt: new Date(),
                        gameId: gameState.gameId || 'football_bet',
                        beforeBalance: currentBalance,
                        afterBalance: newBalance
                    });
                    
                    gameState.balance = newBalance;
                    updateBalanceDisplay();
                    
                    return { success: true, newBalance };
                    
                });
            } catch (error) {
                console.error('Transaction failed:', error);
                showToast('Transaction failed: ' + error.message, 'error');
                return { success: false, error: error.message };
            }
        }

        // ===== LOAD MATCHES =====
        async function loadMatches() {
            const grid = document.getElementById('matches-grid');
            grid.innerHTML = '<div class="loading"><div class="loading-spinner"></div><p>Loading matches...</p></div>';
            
            try {
                const today = new Date().toISOString().split('T')[0];
                
                const response = await fetch(`${BASE_URL}/fixtures?date=${today}&season=2026`, {
                    method: 'GET',
                    headers: {
                        'x-apisports-key': API_KEY
                    }
                });
                
                if (!response.ok) throw new Error('API error');
                
                const data = await response.json();
                
                if (data.response && data.response.length > 0) {
                    gameState.matches = transformFixtures(data.response);
                } else {
                    loadSampleMatches();
                }
                
                filterMatches('all');
                
            } catch (error) {
                console.error('Error loading matches:', error);
                loadSampleMatches();
            }
        }

        function transformFixtures(fixtures) {
            return fixtures.map(f => ({
                fixture: {
                    id: f.fixture.id,
                    date: f.fixture.date,
                    status: f.fixture.status
                },
                league: {
                    id: f.league.id,
                    name: f.league.name,
                    logo: f.league.logo
                },
                teams: {
                    home: { id: f.teams.home.id, name: f.teams.home.name, logo: f.teams.home.logo },
                    away: { id: f.teams.away.id, name: f.teams.away.name, logo: f.teams.away.logo }
                },
                goals: f.goals,
                odds: extractOdds(f)
            }));
        }

        function extractOdds(fixture) {
            // Default odds if not available
            return {
                home: 1.90,
                draw: 3.40,
                away: 3.10
            };
        }

        // ===== FILTER MATCHES =====
        function filterMatches(leagueId) {
            gameState.currentLeague = leagueId;
            
            if (leagueId === 'all') {
                gameState.filteredMatches = gameState.matches;
            } else {
                gameState.filteredMatches = gameState.matches.filter(m => m.league.id.toString() === leagueId);
            }
            
            displayMatches();
            
            document.querySelectorAll('.league-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.league === leagueId) {
                    btn.classList.add('active');
                }
            });
        }

        // ===== DISPLAY MATCHES =====
        function displayMatches() {
            const grid = document.getElementById('matches-grid');
            grid.innerHTML = '';
            
            if (gameState.filteredMatches.length === 0) {
                grid.innerHTML = '<div style="text-align: center; padding: 30px; color: #a0a8c9;">No matches found</div>';
                return;
            }
            
            gameState.filteredMatches.forEach(match => {
                const isLive = ['LIVE', '1H', '2H', 'HT', 'ET'].includes(match.fixture.status.short);
                const isFinished = ['FT', 'AET', 'PEN'].includes(match.fixture.status.short);
                const isUpcoming = ['NS', 'TBD'].includes(match.fixture.status.short);
                
                // Don't show betting options for live/finished matches
                const canBet = isUpcoming;
                
                const matchTime = isLive ? 'LIVE' : 
                                 isFinished ? 'FT' : 
                                 new Date(match.fixture.date).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                
                const homeScore = match.goals.home !== null ? match.goals.home : '-';
                const awayScore = match.goals.away !== null ? match.goals.away : '-';
                
                const card = document.createElement('div');
                card.className = `match-card ${isLive ? 'live' : ''}`;
                
                let bettingHTML = '';
                if (canBet) {
                    bettingHTML = `
                        <div class="betting-options">
                            <div class="bet-option" onclick="selectBet(${match.fixture.id}, 'home', ${match.odds.home}, '${match.teams.home.name} vs ${match.teams.away.name}', '1')">
                                <span class="bet-type">1</span>
                                <span class="bet-odds">${match.odds.home.toFixed(2)}</span>
                            </div>
                            <div class="bet-option" onclick="selectBet(${match.fixture.id}, 'draw', ${match.odds.draw}, '${match.teams.home.name} vs ${match.teams.away.name}', 'X')">
                                <span class="bet-type">X</span>
                                <span class="bet-odds">${match.odds.draw.toFixed(2)}</span>
                            </div>
                            <div class="bet-option" onclick="selectBet(${match.fixture.id}, 'away', ${match.odds.away}, '${match.teams.home.name} vs ${match.teams.away.name}', '2')">
                                <span class="bet-type">2</span>
                                <span class="bet-odds">${match.odds.away.toFixed(2)}</span>
                            </div>
                        </div>
                    `;
                } else {
                    bettingHTML = '<div style="text-align: center; color: #a0a8c9; font-size: 11px; padding: 5px;">Betting closed</div>';
                }
                
                card.innerHTML = `
                    <div class="match-header">
                        <div class="league-info">
                            <img class="league-logo" src="${match.league.logo}" alt="" onerror="this.src='https://via.placeholder.com/16'">
                            <span class="league-name">${match.league.name}</span>
                        </div>
                        <div class="match-time ${isLive ? 'live' : ''}">${matchTime}</div>
                    </div>
                    
                    <div class="teams">
                        <div class="team">
                            <img class="team-logo" src="${match.teams.home.logo}" alt="" onerror="this.src='https://via.placeholder.com/24'">
                            <span class="team-name">${match.teams.home.name}</span>
                        </div>
                        <div class="score">${homeScore} - ${awayScore}</div>
                        <div class="team away">
                            <span class="team-name">${match.teams.away.name}</span>
                            <img class="team-logo" src="${match.teams.away.logo}" alt="" onerror="this.src='https://via.placeholder.com/24'">
                        </div>
                    </div>
                    
                    ${bettingHTML}
                `;
                
                grid.appendChild(card);
            });
        }

        // ===== BET SELECTION =====
        window.selectBet = function(matchId, betType, odds, matchName, displayType) {
            if (gameState.isPlacingBet) {
                showToast('Please wait...', 'warning');
                return;
            }
            
            if (gameState.selectedBets.length >= BETTING_RULES.maxSelections) {
                showToast(`Maximum ${BETTING_RULES.maxSelections} selections allowed`, 'error');
                return;
            }
            
            // Check if bet already exists for this match
            const existingBetIndex = gameState.selectedBets.findIndex(b => b.matchId === matchId);
            
            if (existingBetIndex !== -1) {
                // Update existing bet
                gameState.selectedBets[existingBetIndex] = {
                    matchId, betType, odds, matchName, displayType
                };
                showToast('Bet updated', 'success');
            } else {
                // Add new bet
                gameState.selectedBets.push({
                    matchId, betType, odds, matchName, displayType
                });
                showToast('Bet added', 'success');
            }
            
            updateBetSlip();
        };

        // ===== UPDATE BET SLIP =====
        function updateBetSlip() {
            const container = document.getElementById('betslip-items');
            const totalOddsEl = document.getElementById('total-odds');
            const potentialWinEl = document.getElementById('potential-win');
            const placeBetBtn = document.getElementById('place-bet-btn');
            
            if (gameState.selectedBets.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: #a0a8c9; padding: 15px; font-size: 12px;"><i class="fas fa-arrow-up"></i> Click odds to add</div>';
                totalOddsEl.textContent = '0.00';
                potentialWinEl.textContent = '$0.00';
                placeBetBtn.disabled = true;
                return;
            }
            
            // Calculate total odds
            let totalOdds = gameState.selectedBets.reduce((acc, bet) => acc * bet.odds, 1);
            totalOdds = parseFloat(totalOdds.toFixed(2));
            
            const betAmount = parseFloat(document.getElementById('bet-amount').value) || BETTING_RULES.minBet;
            const potentialWin = betAmount * totalOdds;
            
            totalOddsEl.textContent = totalOdds.toFixed(2);
            potentialWinEl.textContent = `$${potentialWin.toFixed(2)}`;
            placeBetBtn.disabled = false;
            
            let html = '';
            gameState.selectedBets.forEach((bet, index) => {
                html += `
                    <div class="betslip-item">
                        <div>
                            <div class="betslip-match">${bet.matchName}</div>
                            <div class="betslip-details">${bet.displayType}</div>
                        </div>
                        <div style="display: flex; align-items: center;">
                            <span class="betslip-odds">${bet.odds.toFixed(2)}</span>
                            <span class="betslip-remove" onclick="removeBet(${index})">
                                <i class="fas fa-times"></i>
                            </span>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }

        window.removeBet = function(index) {
            gameState.selectedBets.splice(index, 1);
            updateBetSlip();
            showToast('Bet removed', 'info');
        };

        function clearBetSlip() {
            gameState.selectedBets = [];
            updateBetSlip();
            showToast('Bet slip cleared', 'info');
        }

        // ===== GENERATE TICKET NUMBER =====
        function generateTicketNumber() {
            const prefix = gameState.selectedBets.length > 1 ? 'ACC' : 'TKT';
            const date = new Date();
            const yy = date.getFullYear().toString().slice(-2);
            const mm = ('0' + (date.getMonth() + 1)).slice(-2);
            const dd = ('0' + date.getDate()).slice(-2);
            const hh = ('0' + date.getHours()).slice(-2);
            const min = ('0' + date.getMinutes()).slice(-2);
            const sec = ('0' + date.getSeconds()).slice(-2);
            const random = Math.random().toString(36).substring(2, 6).toUpperCase();
            
            return `${prefix}-${yy}${mm}${dd}-${hh}${min}${sec}-${random}`;
        }

        // ===== PLACE BET =====
        async function placeBet() {
            const betAmount = parseFloat(document.getElementById('bet-amount').value);
            
            // Validation
            if (gameState.selectedBets.length === 0) {
                showToast('Select at least one bet', 'error');
                return;
            }
            
            if (betAmount < BETTING_RULES.minBet || betAmount > BETTING_RULES.maxBet) {
                showToast(`Bet must be between $${BETTING_RULES.minBet} and $${BETTING_RULES.maxBet}`, 'error');
                return;
            }
            
            if (betAmount > gameState.balance) {
                showToast('Insufficient funds', 'error');
                return;
            }
            
            if (gameState.userLimits.todayWagered + betAmount > gameState.userLimits.dailyMax) {
                showToast('Daily limit exceeded', 'error');
                return;
            }
            
            if (gameState.isPlacingBet) return;
            
            gameState.isPlacingBet = true;
            document.getElementById('place-bet-btn').disabled = true;
            
            const totalOdds = gameState.selectedBets.reduce((acc, bet) => acc * bet.odds, 1);
            const potentialWin = betAmount * totalOdds;
            const ticketNumber = generateTicketNumber();
            
            gameState.currentBet = {
                stake: betAmount,
                totalOdds: totalOdds,
                potentialWin: potentialWin,
                selections: [...gameState.selectedBets],
                ticketNumber: ticketNumber
            };
            
            gameState.gameId = ticketNumber;
            
            // Process bet transaction
            const result = await processTransaction(
                -betAmount,
                "football_bet",
                `Bet #${ticketNumber} - ${gameState.selectedBets.length} selections @ ${totalOdds.toFixed(2)}`
            );
            
            if (!result.success) {
                gameState.isPlacingBet = false;
                document.getElementById('place-bet-btn').disabled = false;
                return;
            }
            
            // Update daily wagered
            gameState.userLimits.todayWagered += betAmount;
            
            showToast(`Bet placed! Ticket #${ticketNumber}`, 'success');
            
            // Calculate result with house edge
            setTimeout(() => {
                const fairProb = 1 / totalOdds;
                const winProb = fairProb * (1 - BETTING_RULES.houseEdge);
                const win = Math.random() < winProb;
                const winAmount = win ? betAmount * totalOdds : 0;
                
                if (win) {
                    processTransaction(winAmount, "football_win", `Win #${ticketNumber}`);
                }
                
                // Update stats
                gameState.stats.totalBets++;
                if (win) {
                    gameState.stats.wonBets++;
                    gameState.stats.totalWon += winAmount;
                } else {
                    gameState.stats.lostBets++;
                    gameState.stats.totalLost += betAmount;
                }
                gameState.stats.totalStaked += betAmount;
                
                // Add to history
                addBetHistory(win, winAmount, betAmount, totalOdds, ticketNumber);
                
                // Show result
                showBetResult(win, winAmount, betAmount, ticketNumber);
                
                // Clear bet slip
                gameState.selectedBets = [];
                updateBetSlip();
                
                gameState.isPlacingBet = false;
                document.getElementById('place-bet-btn').disabled = false;
                
            }, 2000);
        }

        function showBetResult(win, winAmount, stake, ticketNumber) {
            const title = document.getElementById('result-title');
            const amount = document.getElementById('result-amount');
            
            title.textContent = win ? '🎉 YOU WIN!' : '😞 BET LOST';
            title.className = `result-title ${win ? 'win' : 'lose'}`;
            
            document.getElementById('result-details').innerHTML = `
                Ticket: ${ticketNumber}<br>
                Stake: $${stake.toFixed(2)}<br>
                Odds: ${gameState.currentBet.totalOdds.toFixed(2)}
            `;
            
            amount.textContent = win ? `+$${winAmount.toFixed(2)}` : `-$${stake.toFixed(2)}`;
            amount.className = `result-amount ${win ? 'win' : 'lose'}`;
            
            document.getElementById('result-overlay').classList.add('show');
        }

        function closeResultOverlay() {
            document.getElementById('result-overlay').classList.remove('show');
        }

        // ===== BET HISTORY =====
        function addBetHistory(win, winAmount, stake, odds, ticketNumber) {
            const historyItem = {
                win: win,
                amount: win ? winAmount : -stake,
                odds: odds,
                selections: gameState.selectedBets.length,
                ticketNumber: ticketNumber,
                timestamp: new Date()
            };
            
            gameState.betHistory.unshift(historyItem);
            if (gameState.betHistory.length > 10) {
                gameState.betHistory.pop();
            }
            
            updateHistoryDisplay();
            
            // Save to Firebase
            db.collection("football_history").doc(gameState.currentUser.uid).collection("bets").add({
                ...historyItem,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).catch(console.error);
        }

        function updateHistoryDisplay() {
            const historyList = document.getElementById('history-list');
            historyList.innerHTML = '';
            
            gameState.betHistory.forEach(item => {
                const time = new Date(item.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                
                const div = document.createElement('div');
                div.className = `history-item ${item.win ? 'win' : 'lose'}`;
                div.innerHTML = `
                    <div class="history-header">
                        <span>${item.ticketNumber}</span>
                        <span class="history-time">${time}</span>
                    </div>
                    <div style="display: flex; justify-content: space-between;">
                        <span>${item.selections} @ ${item.odds.toFixed(2)}</span>
                        <span class="history-amount ${item.win ? 'win' : 'lose'}">
                            ${item.amount > 0 ? '+' : ''}$${Math.abs(item.amount).toFixed(2)}
                        </span>
                    </div>
                `;
                
                historyList.appendChild(div);
            });
        }

        async function loadBetHistory() {
            try {
                const snapshot = await db.collection("football_history")
                    .doc(gameState.currentUser?.uid)
                    .collection("bets")
                    .orderBy('timestamp', 'desc')
                    .limit(10)
                    .get();
                
                snapshot.forEach(doc => {
                    const data = doc.data();
                    gameState.betHistory.push({
                        win: data.win,
                        amount: data.amount,
                        odds: data.odds,
                        selections: data.selections,
                        ticketNumber: data.ticketNumber,
                        timestamp: data.timestamp.toDate()
                    });
                });
                
                updateHistoryDisplay();
            } catch (error) {
                console.error('Error loading bet history:', error);
            }
        }

        // ===== TOAST NOTIFICATIONS =====
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            
            container.appendChild(toast);
            
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => container.removeChild(toast), 300);
            }, 3000);
        }

        // ===== EVENT LISTENERS =====
        function setupEventListeners() {
            document.querySelectorAll('.league-btn').forEach(btn => {
                btn.addEventListener('click', () => filterMatches(btn.dataset.league));
            });
            
            document.getElementById('clear-betslip').addEventListener('click', clearBetSlip);
            document.getElementById('place-bet-btn').addEventListener('click', placeBet);
            
            document.querySelectorAll('.quick-bet').forEach(btn => {
                btn.addEventListener('click', () => {
                    const amount = parseFloat(btn.dataset.amount);
                    document.getElementById('bet-amount').value = amount;
                    updateBetSlip();
                });
            });
            
            document.getElementById('bet-amount').addEventListener('input', (e) => {
                let value = parseFloat(e.target.value) || BETTING_RULES.minBet;
                value = Math.max(BETTING_RULES.minBet, Math.min(value, BETTING_RULES.maxBet));
                e.target.value = value;
                updateBetSlip();
            });
            
            document.getElementById('result-overlay').addEventListener('click', (e) => {
                if (e.target === document.getElementById('result-overlay')) {
                    closeResultOverlay();
                }
            });
        }

        window.closeResultOverlay = closeResultOverlay;
    </script>
