<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Multi-Asset Trading Platform</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>

<style>
body {
  margin:0;
  background:#0e1117;
  color:#fff;
  font-family:Arial, sans-serif;
}
header {
  background:#161b22;
  padding:10px;
  display:flex;
  gap:10px;
  align-items:center;
}
select {
  background:#0e1117;
  color:#fff;
  border:1px solid #333;
  padding:6px;
}
#price { margin-left:auto; font-weight:bold; }
#chart { height:420px; }
.panel {
  padding:12px;
  display:flex;
  justify-content:center;
  gap:10px;
}
button {
  padding:10px 20px;
  border:none;
  font-size:16px;
  cursor:pointer;
}
.buy { background:#00c853; }
.sell { background:#d50000; }
</style>
</head>

<body>

<header>
  <select id="market" onchange="loadMarket()">
    <option value="forex">Forex</option>
    <option value="stocks">Stocks</option>
    <option value="commodities">Commodities</option>
    <option value="bonds">Bonds</option>
  </select>

  <select id="symbol" onchange="changeSymbol()"></select>

  <div id="price">Loading…</div>
</header>

<div id="chart"></div>

<div class="panel">
  <button class="buy" onclick="trade('BUY')">BUY</button>
  <button class="sell" onclick="trade('SELL')">SELL</button>
</div>

<script>
// ================= MARKET DATA =================
const markets = {
  forex: [
    "EUR/USD","GBP/USD","USD/JPY","USD/CHF","AUD/USD","NZD/USD","USD/CAD",
    "EUR/JPY","GBP/JPY","AUD/JPY","USD/TRY","USD/ZAR","USD/MXN"
  ],
  stocks: [
    "AAPL","MSFT","GOOGL","AMZN","META","TSLA","NVDA","JPM","V",
    "XOM","KO","PEP","BABA","TSM","SONY"
  ],
  commodities: [
    "XAU/USD","XAG/USD","WTI","BRENT","NATGAS","COPPER","CORN","WHEAT"
  ],
  bonds: [
    "US10Y","US2Y","US30Y","DE10Y","UK10Y","JP10Y"
  ]
};

// ================= CHART =================
const chart = LightweightCharts.createChart(
  document.getElementById('chart'),
  {
    layout:{ background:{color:'#0e1117'}, textColor:'#ccc' },
    grid:{ vertLines:{color:'#222'}, horzLines:{color:'#222'} },
    width:window.innerWidth,
    height:420
  }
);

const series = chart.addCandlestickSeries();
let time = Math.floor(Date.now()/1000);
let lastPrice = null;
let currentMarket = "forex";
let currentSymbol = "";

// ================= LOADERS =================
function loadMarket() {
  currentMarket = document.getElementById("market").value;
  const symbolSelect = document.getElementById("symbol");
  symbolSelect.innerHTML = "";

  markets[currentMarket].forEach(s => {
    const o = document.createElement("option");
    o.value = s;
    o.text = s;
    symbolSelect.add(o);
  });

  currentSymbol = symbolSelect.value;
  resetChart();
}

function changeSymbol() {
  currentSymbol = document.getElementById("symbol").value;
  resetChart();
}

function resetChart() {
  series.setData([]);
  lastPrice = null;
}

// ================= PRICE FEEDS =================
async function fetchPrice() {
  // FOREX & METALS
  if (currentMarket === "forex" || currentSymbol.includes("/")) {
    const [base, quote] = currentSymbol.split("/");
    const res = await fetch(
      `https://api.exchangerate.host/latest?base=${base}&symbols=${quote}`
    );
    const data = await res.json();
    return data.rates[quote];
  }

  // STOCKS / COMMODITIES / BONDS (proxy demo pricing)
  // Replace with paid feeds later (Polygon, TwelveData, Refinitiv)
  return lastPrice
    ? lastPrice + (Math.random() - 0.5) * lastPrice * 0.002
    : Math.random() * 100 + 50;
}

// ================= UPDATE LOOP =================
async function update() {
  const price = await fetchPrice();
  document.getElementById("price").innerText = price.toFixed(4);

  if (!lastPrice) lastPrice = price;

  const open = lastPrice;
  const close = price;
  const high = Math.max(open, close);
  const low = Math.min(open, close);

  time += 60;
  series.update({ time, open, high, low, close });
  lastPrice = price;
}

setInterval(update, 3000);
loadMarket();

// ================= TRADE =================
function trade(type) {
  alert(
    `${type} ${currentSymbol}\n\n` +
    `Prices are real/market-based.\n` +
    `Execution handled by your broker.`
  );

  let tvSymbol = currentSymbol.replace("/","");
  window.open(
    `https://www.tradingview.com/chart/?symbol=${tvSymbol}`,
    "_blank"
  );
}
</script>

</body>
</html>
