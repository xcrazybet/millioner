<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Live Market Prices</title>

<style>
body{
    background:#0f172a;
    color:white;
    font-family:Arial, sans-serif;
    text-align:center;
    padding:40px;
}

h1{
    margin-bottom:40px;
}

.container{
    display:flex;
    justify-content:center;
    gap:40px;
    flex-wrap:wrap;
}

.price-box{
    background:#1e293b;
    padding:30px;
    border-radius:15px;
    width:350px;
    box-shadow:0 0 20px rgba(0,0,0,0.4);
}
</style>

</head>
<body>

<h1>Live Market Prices</h1>

<div class="container">

    <!-- GOLD -->
    <div class="price-box">
        <h2>Gold (XAU/USD)</h2>
        <div class="tradingview-widget-container">
          <div class="tradingview-widget-container__widget"></div>
          <script type="text/javascript"
            src="https://s3.tradingview.com/external-embedding/embed-widget-single-quote.js"
            async>
          {
            "symbol": "FOREXCOM:XAUUSD",
            "width": "100%",
            "colorTheme": "dark",
            "isTransparent": true,
            "locale": "en"
          }
          </script>
        </div>
    </div>

    <!-- EURUSD -->
    <div class="price-box">
        <h2>EUR/USD</h2>
        <div class="tradingview-widget-container">
          <div class="tradingview-widget-container__widget"></div>
          <script type="text/javascript"
            src="https://s3.tradingview.com/external-embedding/embed-widget-single-quote.js"
            async>
          {
            "symbol": "FX_IDC:EURUSD",
            "width": "100%",
            "colorTheme": "dark",
            "isTransparent": true,
            "locale": "en"
          }
          </script>
        </div>
    </div>

</div>

</body>
</html>
