<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Professional Crypto Dashboard</title>

<script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>

<style>
body {
    margin:0;
    font-family: Arial;
    background:#0f0f0f;
    color:white;
}

header {
    padding:15px;
    background:#181818;
    display:flex;
    justify-content:space-between;
}

#coins {
    width:300px;
    height:90vh;
    overflow-y:auto;
    background:#141414;
    padding:10px;
}

.coin {
    padding:8px;
    cursor:pointer;
    border-bottom:1px solid #222;
}

.coin:hover {
    background:#222;
}

#main {
    flex:1;
    padding:20px;
}

.container {
    display:flex;
}

#chart {
    height:500px;
}

.stats {
    margin-top:10px;
    display:flex;
    gap:20px;
}
</style>
</head>
<body>

<header>
<h2 id="selectedSymbol">BTCUSDT</h2>
<div id="livePrice">Loading...</div>
</header>

<div class="container">
<div id="coins"></div>

<div id="main">
<div id="chart"></div>

<div class="stats">
<div>24h High: <span id="high"></span></div>
<div>24h Low: <span id="low"></span></div>
<div>24h Volume: <span id="volume"></span></div>
</div>

</div>
</div>

<script>

// 75+ Symbols
const symbols = [
"btcusdt","ethusdt","bnbusdt","adausdt","solusdt","xrpusdt","dogeusdt","dotusdt","maticusdt","avaxusdt",
"shibusdt","trxusdt","ltcusdt","atomusdt","linkusdt","bchusdt","etcusdt","filusdt","vetusdt",
"uniusdt","nearusdt","cakeusdt","eosusdt","thetausdt","manausdt",
"sandusdt","chzusdt","enjusdt","qntusdt","algousdt",
"xtzusdt","icpusdt","ftmusdt","hbarusdt","egldusdt","roseusdt","galausdt",
"lrcusdt","ankrusdt","zecusdt","dashusdt","wavesusdt","compusdt","snxusdt",
"yfiusdt","crvusdt","1inchusdt","aaveusdt","grtusdt","renusdt","storjusdt",
"omgusdt","zilusdt","kavausdt","ksmusdt","lptusdt",
"btcusdc","ethusdc","bnbbtc","ethbtc","adabtc","solbtc","avaxbtc",
"dotbtc","linkbtc","maticbtc","dogebtc","shibbtc","trxbtc","ltcbtc","xrpbtc",
"bchbtc","etcbtc","filbtc","vetbtc","manabtc","sandbtc",
"qntbtc","algobtc","eosbtc","thetabtc","rosebtc","galabtc"
];

const coinsDiv = document.getElementById("coins");

symbols.forEach(sym => {
    const div = document.createElement("div");
    div.className="coin";
    div.innerText=sym.toUpperCase();
    div.onclick=()=>loadSymbol(sym);
    coinsDiv.appendChild(div);
});

let currentSymbol="btcusdt";
let ws;

// Create Chart
const chart = LightweightCharts.createChart(document.getElementById('chart'), {
    layout: { background: { color: '#0f0f0f' }, textColor: '#DDD' },
    grid: { vertLines: { color: '#222' }, horzLines: { color: '#222' } }
});

const candleSeries = chart.addCandlestickSeries();

async function loadSymbol(symbol){
    currentSymbol = symbol;
    document.getElementById("selectedSymbol").innerText=symbol.toUpperCase();

    if(ws) ws.close();

    // Load candles
    const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol.toUpperCase()}&interval=1m&limit=100`);
    const data = await res.json();

    const candles = data.map(d => ({
        time: d[0]/1000,
        open: parseFloat(d[1]),
        high: parseFloat(d[2]),
        low: parseFloat(d[3]),
        close: parseFloat(d[4])
    }));

    candleSeries.setData(candles);

    // 24h stats
    const statsRes = await fetch(`https://api.binance.com/api/v3/ticker/24hr?symbol=${symbol.toUpperCase()}`);
    const stats = await statsRes.json();

    document.getElementById("high").innerText=stats.highPrice;
    document.getElementById("low").innerText=stats.lowPrice;
    document.getElementById("volume").innerText=stats.volume;

    // Live price stream
    ws = new WebSocket(`wss://stream.binance.com:9443/ws/${symbol}@trade`);

    ws.onmessage = msg => {
        const trade = JSON.parse(msg.data);
        document.getElementById("livePrice").innerText = "Live: " + trade.p;
    };
}

loadSymbol("btcusdt");

</script>

</body>
</html>
