<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Real‑Time Market Prices Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f0f0; padding: 20px; }
        h1, h2 { text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
        .card {
            background: #fff; padding:12px; border-radius:8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1); text-align:center;
        }
        .symbol { font-weight: bold; margin-bottom: 8px; }
        .last, .bid, .ask, .chg { margin: 4px 0; }
        .up { color: green; }
        .down { color: red; }
    </style>
</head>
<body>

<h1>Real‑Time Live Prices</h1>
<h2>(Bid / Ask / Last) Streaming Dashboard</h2>

<div class="grid" id="marketGrid"></div>

<script>
// ============================
// 1) Configuration
// ============================
const API_KEY = "YOUR_REAL_API_KEY"; // 👈 Replace this with your EODHD real-time API key
// WebSocket endpoints for real-time streams
const WS_FOREX = `wss://ws.eodhistoricaldata.com/ws/forex?api_token=${API_KEY}`;
const WS_STOCKS_QUOTE = `wss://ws.eodhistoricaldata.com/ws/us-quote?api_token=${API_KEY}`;

// List of symbols you want (sample; expand to 100+ if your plan supports it)
const forexSymbols = ["EURUSD","GBPUSD","AUDUSD","USDJPY"];
const stockSymbols = ["AAPL","MSFT","TSLA","NVDA","GOOGL"];

// ============================
// 2) UI Setup
// ============================
const grid = document.getElementById("marketGrid");
const cards = {};

function createCard(sym) {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
        <div class="symbol">${sym}</div>
        <div class="last">Last: <span>–</span></div>
        <div class="bid">Bid: <span>–</span></div>
        <div class="ask">Ask: <span>–</span></div>
        <div class="chg">Change: <span>–%</span></div>
    `;
    grid.appendChild(card);
    cards[sym] = card;
}

forexSymbols.concat(stockSymbols).forEach(createCard);

// ============================
// 3) WebSocket Setup
// ============================

// Forex WebSocket
const wsForex = new WebSocket(WS_FOREX);
wsForex.onopen = () => {
    console.log("Forex WS connected");
    wsForex.send(JSON.stringify({ action: "subscribe", symbols: forexSymbols.join(",") }));
};
wsForex.onmessage = evt => {
    const data = JSON.parse(evt.data);
    if (data.s && cards[data.s]) {
        const card = cards[data.s];
        card.querySelector(".last span").innerText = data?.lp ?? "–";
        card.querySelector(".bid span").innerText = data?.b ?? "–";
        card.querySelector(".ask span").innerText = data?.a ?? "–";
        const chg = (data?.dc ?? 0).toFixed(2);
        const elem = card.querySelector(".chg span");
        elem.innerText = `${chg}%`;
        elem.className = data.dc >= 0 ? "up" : "down";
    }
};

// Stocks Quotes WebSocket
const wsStocks = new WebSocket(WS_STOCKS_QUOTE);
wsStocks.onopen = () => {
    console.log("Stocks WS connected");
    wsStocks.send(JSON.stringify({ action: "subscribe", symbols: stockSymbols.join(",") }));
};
wsStocks.onmessage = evt => {
    const data = JSON.parse(evt.data);
    if (data.s && cards[data.s]) {
        const card = cards[data.s];
        card.querySelector(".bid span").innerText = data?.bp ?? "–";
        card.querySelector(".ask span").innerText = data?.ap ?? "–";
    }
};

</script>

</body>
</html>
