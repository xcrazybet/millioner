<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Live Forex Prices</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: #e5e7eb;
}
header {
    background: #020617;
    padding: 15px;
    text-align: center;
    font-size: 20px;
    font-weight: bold;
}
.container {
    padding: 20px;
}
table {
    width: 100%;
    border-collapse: collapse;
    background: #020617;
}
th, td {
    padding: 12px;
    border-bottom: 1px solid #1e293b;
    text-align: center;
}
th {
    background: #020617;
    color: #38bdf8;
}
.price-up {
    color: #22c55e;
}
.price-down {
    color: #ef4444;
}
footer {
    text-align: center;
    padding: 10px;
    font-size: 12px;
    color: #64748b;
}
</style>
</head>

<body>

<header>🌍 Live Forex Market (Real Prices)</header>

<div class="container">
<table id="priceTable">
<thead>
<tr>
<th>Pair</th>
<th>Price</th>
<th>Change</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>

<footer>Auto-updating every 5 seconds</footer>

<script>
const pairs = [
    "EURUSD","GBPUSD","USDJPY","USDCHF","AUDUSD",
    "USDCAD","NZDUSD","EURGBP","EURJPY","GBPJPY",
    "EURCHF","AUDJPY","CADJPY","CHFJPY","AUDCAD"
];

let lastPrices = {};

async function loadPrices() {
    try {
        const res = await fetch(
            "https://api.exchangerate.host/latest?base=USD"
        );
        const data = await res.json();

        const tbody = document.querySelector("#priceTable tbody");
        tbody.innerHTML = "";

        pairs.forEach(pair => {
            const base = pair.substring(0,3);
            const quote = pair.substring(3,6);

            let price;
            if (base === "USD") {
                price = data.rates[quote];
            } else if (quote === "USD") {
                price = 1 / data.rates[base];
            } else {
                price = data.rates[quote] / data.rates[base];
            }

            const prev = lastPrices[pair] || price;
            const diff = price - prev;

            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${pair}</td>
                <td>${price.toFixed(5)}</td>
                <td class="${diff >= 0 ? 'price-up' : 'price-down'}">
                    ${diff >= 0 ? '▲' : '▼'} ${diff.toFixed(5)}
                </td>
            `;

            tbody.appendChild(tr);
            lastPrices[pair] = price;
        });

    } catch (e) {
        console.error("Price load error", e);
    }
}

loadPrices();
setInterval(loadPrices, 5000);
</script>

</body>
</html>
