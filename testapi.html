<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚽ XCrazyBet - Football Betting</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --primary: #00ff9d;
            --primary-dark: #00cc7a;
            --secondary: #ff9800;
            --secondary-dark: #cc7a00;
            --danger: #ff5252;
            --success: #4caf50;
            --warning: #ffc107;
            --bg: #0a0f1a;
            --surface: #111827;
            --surface-light: #1a2332;
            --text: #ffffff;
            --text-dim: #a0a8c9;
            --selected-bg: linear-gradient(135deg, #00ff9d22, #ff980022);
            --dark-bg: #000000;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Segoe UI', 'Roboto', system-ui, -apple-system, sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Background Effects */
        .bg-effects {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: 
                radial-gradient(circle at 20% 30%, rgba(0, 255, 157, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(255, 152, 0, 0.08) 0%, transparent 50%),
                linear-gradient(135deg, var(--dark-bg) 0%, var(--bg) 100%);
        }

        /* Header */
        .header {
            background: rgba(17, 24, 39, 0.95);
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .home-btn {
            width: 36px;
            height: 36px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #000;
            font-size: 18px;
            transition: all 0.3s;
        }

        .home-btn:hover {
            background: var(--primary-dark);
            transform: scale(1.1);
        }

        .logo {
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--primary);
        }

        .logo i {
            color: var(--primary);
        }

        .balance-display {
            background: linear-gradient(45deg, #1a2332, #0f172a);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--primary);
            color: var(--primary);
            font-weight: 700;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 140px;
            justify-content: center;
        }

        /* Main Container */
        .game-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            min-height: calc(100vh - 140px);
        }

        /* League Filter */
        .league-filter {
            background: rgba(17, 24, 39, 0.8);
            border-radius: 15px;
            padding: 15px;
            border: 2px solid rgba(255, 152, 0, 0.2);
        }

        .filter-title {
            color: var(--secondary);
            font-size: 14px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .league-buttons {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
            scrollbar-width: thin;
            scrollbar-color: var(--primary) var(--surface);
        }

        .league-buttons::-webkit-scrollbar {
            height: 4px;
        }

        .league-buttons::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 4px;
        }

        .league-btn {
            padding: 10px 20px;
            background: rgba(10, 15, 26, 0.8);
            border: 1px solid var(--primary);
            border-radius: 20px;
            color: var(--text);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s;
        }

        .league-btn:hover {
            background: var(--primary);
            color: #000;
            transform: translateY(-2px);
        }

        .league-btn.active {
            background: var(--primary);
            color: #000;
        }

        /* Matches Grid */
        .matches-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 15px;
            margin: 15px 0;
        }

        .match-card {
            background: rgba(17, 24, 39, 0.8);
            border-radius: 15px;
            padding: 15px;
            border: 2px solid rgba(255, 152, 0, 0.2);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .match-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
        }

        .match-card.live::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #ff4757, #ff6b81);
            animation: pulse 1.5s infinite;
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 152, 0, 0.2);
        }

        .league-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .league-logo {
            width: 24px;
            height: 24px;
            object-fit: contain;
        }

        .league-name {
            font-size: 13px;
            color: var(--text-dim);
        }

        .match-time {
            font-size: 12px;
            padding: 4px 8px;
            background: rgba(255, 152, 0, 0.2);
            border-radius: 4px;
            color: var(--secondary);
        }

        .match-time.live {
            background: #ff4757;
            color: white;
            animation: pulse 1.5s infinite;
        }

        .teams {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .team {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }

        .team-logo {
            width: 50px;
            height: 50px;
            object-fit: contain;
            margin-bottom: 8px;
        }

        .team-name {
            font-weight: 600;
            text-align: center;
            font-size: 14px;
        }

        .score {
            font-size: 24px;
            font-weight: 700;
            padding: 0 15px;
            color: var(--primary);
        }

        /* Betting Options */
        .betting-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 15px;
        }

        .bet-option {
            padding: 10px;
            background: rgba(10, 15, 26, 0.8);
            border: 2px solid rgba(255, 152, 0, 0.2);
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .bet-option:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .bet-option.selected {
            background: var(--selected-bg);
            border-color: var(--primary);
        }

        .bet-type {
            font-size: 12px;
            color: var(--text-dim);
            margin-bottom: 4px;
        }

        .bet-odds {
            font-size: 16px;
            font-weight: 700;
            color: var(--primary);
        }

        /* Bet Slip */
        .bet-slip {
            background: rgba(17, 24, 39, 0.95);
            border-radius: 15px;
            padding: 20px;
            border: 2px solid var(--primary);
            position: sticky;
            bottom: 80px;
            margin-top: 20px;
            backdrop-filter: blur(10px);
        }

        .bet-slip-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 152, 0, 0.2);
        }

        .bet-slip-title {
            color: var(--primary);
            font-weight: 700;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .bet-slip-clear {
            color: var(--danger);
            cursor: pointer;
            font-size: 14px;
        }

        .bet-slip-item {
            background: rgba(10, 15, 26, 0.8);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .bet-slip-match {
            font-size: 13px;
            font-weight: 600;
        }

        .bet-slip-details {
            font-size: 12px;
            color: var(--text-dim);
        }

        .bet-slip-odds {
            color: var(--primary);
            font-weight: 700;
        }

        .bet-slip-remove {
            color: var(--danger);
            cursor: pointer;
            margin-left: 10px;
        }

        .bet-slip-total {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-top: 1px solid rgba(255, 152, 0, 0.2);
            font-weight: 700;
        }

        .total-odds {
            color: var(--primary);
            font-size: 18px;
        }

        .bet-input-group {
            display: flex;
            gap: 10px;
            margin: 15px 0;
        }

        .bet-input {
            flex: 1;
            padding: 12px;
            background: rgba(10, 15, 26, 0.8);
            border: 2px solid var(--primary);
            border-radius: 8px;
            color: var(--text);
            font-size: 16px;
            font-weight: 600;
        }

        .bet-input:focus {
            outline: none;
            border-color: var(--secondary);
        }

        .place-bet-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: none;
            border-radius: 8px;
            color: #000;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .place-bet-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 255, 157, 0.3);
        }

        .place-bet-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Quick Bets */
        .quick-bets {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin: 15px 0;
        }

        .quick-bet {
            padding: 10px;
            background: rgba(10, 15, 26, 0.8);
            border: 1px solid var(--primary);
            border-radius: 6px;
            color: var(--primary);
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 13px;
        }

        .quick-bet:hover {
            background: var(--primary);
            color: #000;
        }

        /* Bonus Display */
        .bonus-display {
            background: linear-gradient(135deg, rgba(255, 152, 0, 0.1), rgba(0, 255, 157, 0.1));
            border-radius: 10px;
            padding: 12px;
            margin: 15px 0;
            border: 1px solid rgba(255, 152, 0, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            font-size: 14px;
        }

        /* History Panel */
        .history-panel {
            background: rgba(17, 24, 39, 0.8);
            border-radius: 15px;
            padding: 15px;
            margin-top: 15px;
            border: 1px solid rgba(255, 152, 0, 0.2);
        }

        .history-title {
            font-size: 14px;
            color: var(--secondary);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 152, 0, 0.2);
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 200px;
            overflow-y: auto;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: rgba(10, 15, 26, 0.5);
            border-radius: 8px;
            font-size: 12px;
            border-left: 3px solid var(--primary);
        }

        .history-item.win {
            border-left-color: var(--primary);
            background: rgba(0, 255, 157, 0.05);
        }

        .history-item.lose {
            border-left-color: var(--danger);
            background: rgba(255, 82, 82, 0.05);
        }

        /* Result Overlay */
        .result-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .result-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .result-content {
            background: rgba(17, 24, 39, 0.95);
            padding: 30px;
            border-radius: 20px;
            border: 3px solid var(--primary);
            text-align: center;
            max-width: 350px;
            width: 90%;
            backdrop-filter: blur(20px);
        }

        .result-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .result-win {
            color: var(--primary);
        }

        .result-lose {
            color: var(--danger);
        }

        .result-amount {
            font-size: 32px;
            font-weight: 700;
            margin: 20px 0;
        }

        /* Toast Notifications */
        .toast-container {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 300px;
            width: 90%;
        }

        .toast {
            padding: 15px;
            background: rgba(17, 24, 39, 0.95);
            border-radius: 10px;
            border-left: 4px solid var(--primary);
            transform: translateY(100%);
            opacity: 0;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
            font-size: 14px;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.success {
            border-color: var(--primary);
        }

        .toast.error {
            border-color: var(--danger);
        }

        /* Bottom Navigation */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            background: rgba(17, 24, 39, 0.95);
            padding: 12px 15px;
            border-top: 1px solid rgba(0, 255, 157, 0.2);
            backdrop-filter: blur(10px);
            position: sticky;
            bottom: 0;
            z-index: 999;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--text-dim);
            font-size: 11px;
            gap: 4px;
            transition: all 0.3s;
        }

        .nav-item i {
            font-size: 18px;
        }

        .nav-item.active {
            color: var(--primary);
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 152, 0, 0.3);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 1s ease-in-out infinite;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 10px;
            }

            .header-left {
                width: 100%;
                justify-content: space-between;
            }

            .balance-display {
                width: 100%;
            }

            .matches-grid {
                grid-template-columns: 1fr;
            }

            .betting-options {
                grid-template-columns: repeat(3, 1fr);
            }

            .quick-bets {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <!-- Background Effects -->
    <div class="bg-effects"></div>

    <!-- Header -->
    <header class="header">
        <div class="header-left">
            <a href="https://xcrazybet.github.io/millioner" class="home-btn" title="Return to Home">
                <i class="fas fa-home"></i>
            </a>
            <div class="logo">
                <i class="fas fa-futbol"></i>
                XCrazyBet Football
            </div>
        </div>
        <div class="balance-display">
            <i class="fas fa-wallet"></i>
            $<span id="balance-val">0.00</span>
        </div>
    </header>

    <!-- Main Container -->
    <div class="game-container">
        <!-- League Filter -->
        <div class="league-filter">
            <div class="filter-title">
                <i class="fas fa-filter"></i> SELECT LEAGUE
            </div>
            <div class="league-buttons" id="league-buttons">
                <button class="league-btn active" data-league="all">🌍 ALL</button>
                <button class="league-btn" data-league="39">🏴󠁧󠁢󠁥󠁮󠁧󠁿 PREMIER LEAGUE</button>
                <button class="league-btn" data-league="140">🇪🇸 LA LIGA</button>
                <button class="league-btn" data-league="78">🇩🇪 BUNDESLIGA</button>
                <button class="league-btn" data-league="135">🇮🇹 SERIE A</button>
                <button class="league-btn" data-league="61">🇫🇷 LIGUE 1</button>
                <button class="league-btn" data-league="2">🇪🇺 CHAMPIONS LEAGUE</button>
            </div>
        </div>

        <!-- Live Indicator -->
        <div style="display: flex; gap: 10px; align-items: center; margin: 10px 0;">
            <span style="color: var(--text-dim);"><i class="fas fa-circle" style="color: #ff4757; font-size: 10px;"></i> LIVE NOW</span>
            <span style="color: var(--text-dim);"><i class="fas fa-clock" style="color: var(--secondary);"></i> UPCOMING</span>
            <span style="color: var(--text-dim);"><i class="fas fa-check-circle" style="color: var(--primary);"></i> FINISHED</span>
        </div>

        <!-- Matches Grid -->
        <div id="matches-grid" class="matches-grid">
            <!-- Matches will be loaded here -->
        </div>

        <!-- Bonus Display -->
        <div class="bonus-display" id="bonus-display">
            <div>
                <i class="fas fa-gift"></i>
                <span id="bonus-text">Place 25 bets to earn $5 bonus!</span>
            </div>
            <div>
                <span id="bet-counter">Bets: 0/25</span>
            </div>
        </div>

        <!-- Bet Slip -->
        <div class="bet-slip" id="bet-slip">
            <div class="bet-slip-header">
                <div class="bet-slip-title">
                    <i class="fas fa-receipt"></i> BET SLIP
                </div>
                <div class="bet-slip-clear" id="clear-betslip">
                    <i class="fas fa-trash"></i> CLEAR
                </div>
            </div>
            
            <div id="betslip-items">
                <!-- Bet slip items will appear here -->
                <div style="text-align: center; color: var(--text-dim); padding: 20px;">
                    <i class="fas fa-arrow-up"></i> Click on odds to add bets
                </div>
            </div>

            <div class="bet-slip-total">
                <span>Total Odds:</span>
                <span class="total-odds" id="total-odds">0.00</span>
            </div>

            <div class="quick-bets">
                <div class="quick-bet" data-amount="1">$1</div>
                <div class="quick-bet" data-amount="5">$5</div>
                <div class="quick-bet" data-amount="10">$10</div>
                <div class="quick-bet" data-amount="25">$25</div>
            </div>

            <div class="bet-input-group">
                <input type="number" class="bet-input" id="bet-amount" value="5" min="1" max="1000" step="1">
                <span style="color: var(--primary); font-weight: 700;">$</span>
            </div>

            <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                <span style="color: var(--text-dim);">Potential Win:</span>
                <span style="color: var(--primary); font-weight: 700;" id="potential-win">$0.00</span>
            </div>

            <button class="place-bet-btn" id="place-bet-btn" disabled>
                <i class="fas fa-coins"></i> PLACE BET
            </button>
        </div>

        <!-- History Panel -->
        <div class="history-panel">
            <div class="history-title">
                <i class="fas fa-history"></i> RECENT BETS
            </div>
            <div class="history-list" id="history-list">
                <!-- History items will be added here -->
            </div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="https://xcrazybet.github.io/millioner/games.html" class="nav-item">
            <i class="fas fa-gamepad"></i>
            Games
        </a>
        <a href="#" class="nav-item active">
            <i class="fas fa-futbol"></i>
            Football
        </a>
        <a href="https://xcrazybet.github.io/millioner/bets.html" class="nav-item">
            <i class="fas fa-coins"></i>
            My Bets
        </a>
        <a href="https://xcrazybet.github.io/millioner/dashboard.html" class="nav-item">
            <i class="fas fa-wallet"></i>
            Deposit
        </a>
    </nav>

    <!-- Result Overlay -->
    <div class="result-overlay" id="result-overlay">
        <div class="result-content">
            <div class="result-title" id="result-title">BET PLACED!</div>
            <div class="result-details" id="result-details">Bet placed successfully</div>
            <div class="result-amount" id="result-amount">$0.00</div>
            <button class="btn btn-primary" style="margin-top: 20px; padding: 12px 30px; background: var(--primary); border: none; border-radius: 8px; color: #000; font-weight: 700; cursor: pointer;" onclick="document.getElementById('result-overlay').classList.remove('show')">
                <i class="fas fa-check"></i> OK
            </button>
        </div>

        // ===== TRANSACTIONS (SAME AS KENO) =====
        async function processTransaction(amount, type, description) {
            try {
                const walletRef = db.collection("wallets").doc(gameState.currentUser.uid);
                
                return await db.runTransaction(async (transaction) => {
                    const walletDoc = await transaction.get(walletRef);
                    
                    if (!walletDoc.exists) {
                        throw new Error("Wallet not found");
                    }
                    
                    const currentBalance = walletDoc.data().balance || 0;
                    const newBalance = currentBalance + amount;
                    
                    if (newBalance < 0) {
                        throw new Error("Insufficient funds");
                    }
                    
                    transaction.update(walletRef, {
                        balance: newBalance,
                        updatedAt: new Date()
                    });
                    
                    const transactionRef = walletRef.collection("transactions").doc();
                    transaction.set(transactionRef, {
                        type: type,
                        amount: amount,
                        description: description,
                        createdAt: new Date(),
                        gameId: gameState.gameId || 'football_bet',
                        beforeBalance: currentBalance,
                        afterBalance: newBalance
                    });
                    
                    gameState.balance = newBalance;
                    updateBalanceDisplay();
                    
                    return { success: true, newBalance };
                    
                });
            } catch (error) {
                console.error('Transaction failed:', error);
                showToast('Transaction failed: ' + error.message, 'error');
                return { success: false, error: error.message };
            }
        }

        // ===== BET SELECTION =====
        function selectBet(matchId, betType, odds, matchName, displayType) {
            if (gameState.isPlacingBet) {
                showToast('Please wait for current bet to complete', 'warning');
                return;
            }
            
            // Check if bet already exists for this match
            const existingBetIndex = gameState.selectedBets.findIndex(b => b.matchId === matchId);
            
            if (existingBetIndex !== -1) {
                // Update existing bet
                gameState.selectedBets[existingBetIndex] = {
                    matchId,
                    betType,
                    odds,
                    matchName,
                    displayType
                };
            } else {
                // Add new bet
                gameState.selectedBets.push({
                    matchId,
                    betType,
                    odds,
                    matchName,
                    displayType
                });
            }
            
            updateBetSlip();
            
            // Visual feedback
            showToast(`Bet added: ${matchName} - ${displayType} @ ${odds.toFixed(2)}`, 'success');

            // Calculate total odds (multiply all odds)

            // Calculate potential win
            const betAmount = parseFloat(document.getElementById('bet-amount').value) || 5;

            potentialWinEl.textContent = `$${potentialWin.toFixed(2)}`;

        // ===== HIDDEN 90% LOSE SYSTEM (SAME AS KENO) =====
        function calculateBetResult(stake, totalOdds) {
            const randomFactor = Math.random();
            
            // 90% chance to lose
            if (randomFactor > gameState.winProbability) {
                // Sometimes give small win to keep players hooked
                if (randomFactor > 0.85 && randomFactor < 0.9) {
                    const smallWin = stake * 0.5; // Half stake back
                    return { win: true, amount: smallWin, multiplier: 0.5 };
                }
                return { win: false, amount: 0, multiplier: 0 };
            }
            
            // 10% chance to win (but capped)
            let winAmount = stake * totalOdds;
            
            // Cap big wins
            if (winAmount > stake * 100) {
                winAmount = stake * 100;
            }
            
            return { win: true, amount: winAmount, multiplier: totalOdds };
        }

        // ===== PLACE BET =====
        async function placeBet() {
            const betAmount = parseFloat(document.getElementById('bet-amount').value);
            
            // Validation
            if (gameState.selectedBets.length === 0) {
                showToast('Select at least one bet', 'error');
                return;
            }
            
            if (betAmount < 1 || betAmount > Math.min(gameState.balance, 1000)) {
                showToast('Invalid bet amount', 'error');
                return;
            }
            
            if (gameState.isPlacingBet) {
                showToast('Bet already in progress', 'warning');
                return;
            }
            
            gameState.isPlacingBet = true;
            document.getElementById('place-bet-btn').disabled = true;
            
            // Calculate total odds
            const totalOdds = gameState.selectedBets.reduce((acc, bet) => acc * bet.odds, 1);
            const potentialWin = betAmount * totalOdds;
            
            gameState.currentBet = {
                stake: betAmount,
                totalOdds: totalOdds,
                potentialWin: potentialWin,
                selections: [...gameState.selectedBets]
            };
            
            // Generate game ID
            gameState.gameId = 'football_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            
            // Process bet transaction
            const result = await processTransaction(
                -betAmount,
                "football_bet",
                `Football bet of $${betAmount} on ${gameState.selectedBets.length} selections @ ${totalOdds.toFixed(2)}`
            );
            
            if (!result.success) {
                gameState.isPlacingBet = false;
                document.getElementById('place-bet-btn').disabled = false;
                return;
            }
            
            // Show loading
            showToast('Processing bet...', 'info');
            
            // Simulate bet processing
            setTimeout(async () => {
                // Calculate result using hidden system
                const betResult = calculateBetResult(betAmount, totalOdds);
                
                gameState.currentBet.actualWin = betResult.amount;
                gameState.currentBet.win = betResult.win;
                
                // Process win if any
                if (betResult.win && betResult.amount > 0) {
                    await processTransaction(
                        betResult.amount,
                        "football_win",
                        `Football win of $${betResult.amount.toFixed(2)}`
                    );
                    
                    addBetHistory('Win', 'win', betResult.amount, totalOdds);
                } else {
                    addBetHistory('Loss', 'lose', -betAmount, totalOdds);
                }
                
                // Update bonus progress
                await updateBonusProgress();
                
                // Show result
                showBetResult();
                
                // Clear bet slip
                gameState.selectedBets = [];
                updateBetSlip();
                
                gameState.isPlacingBet = false;
                document.getElementById('place-bet-btn').disabled = false;
                
            }, 2000);
        }

        // ===== SHOW BET RESULT =====
        function showBetResult() {
            const bet = gameState.currentBet;
            
            document.getElementById('result-title').textContent = bet.win ? 'YOU WIN!' : 'BET LOST';
            document.getElementById('result-title').className = `result-title ${bet.win ? 'result-win' : 'result-lose'}`;
            
            document.getElementById('result-details').innerHTML = `
                Stake: $${bet.stake.toFixed(2)}<br>
                Odds: ${bet.totalOdds.toFixed(2)}<br>
                Selections: ${bet.selections.length}
            `;
            
            document.getElementById('result-amount').textContent = 
                bet.win ? `+$${bet.actualWin.toFixed(2)}` : `-$${bet.stake.toFixed(2)}`;
            document.getElementById('result-amount').className = `result-amount ${bet.win ? 'result-win' : 'result-lose'}`;
            
            document.getElementById('result-overlay').classList.add('show');
        }

        // ===== BET HISTORY =====
        function addBetHistory(action, result, amount, odds) {
            const historyItem = {
                action: action,
                result: result,
                amount: amount,
                odds: odds,
                timestamp: new Date(),
                selections: gameState.currentBet.selections.length
            };
            
            gameState.betHistory.unshift(historyItem);
            if (gameState.betHistory.length > 10) {
                gameState.betHistory.pop();
            }
            
            updateHistoryDisplay();
            
            // Save to Firebase
            saveBetHistoryToFirebase(historyItem);
        }

        function updateHistoryDisplay() {
            const historyList = document.getElementById('history-list');
            historyList.innerHTML = '';
            
            gameState.betHistory.forEach(item => {
                const historyItem = document.createElement('div');
                historyItem.className = `history-item ${item.result}`;
                
                const time = new Date(item.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                
                historyItem.innerHTML = `
                    <div class="history-action">
                        ${time} - ${item.selections} selections @ ${item.odds.toFixed(2)}
                    </div>
                    <div class="history-result ${item.result}">
                        ${item.amount > 0 ? '+' : ''}$${Math.abs(item.amount).toFixed(2)}
                    </div>
                `;
                
                historyList.appendChild(historyItem);
            });
        }

        async function saveBetHistoryToFirebase(historyItem) {
            try {
                await db.collection("football_history").doc(gameState.currentUser.uid).collection("bets").add({
                    userId: gameState.currentUser.uid,
                    ...historyItem,
                    gameId: gameState.gameId
                });
            } catch (error) {
                console.error('Error saving bet history:', error);
            }
        }

        async function loadBetHistory() {
            try {
                const snapshot = await db.collection("football_history")
                    .doc(gameState.currentUser?.uid)
                    .collection("bets")
                    .orderBy('timestamp', 'desc')
                    .limit(10)
                    .get();
                
                snapshot.forEach(doc => {
                    const data = doc.data();
                    gameState.betHistory.push({
                        action: data.action,
                        result: data.result,
                        amount: data.amount,
                        odds: data.odds,
                        timestamp: data.timestamp.toDate(),
                        selections: data.selections
                    });
                });
                
                updateHistoryDisplay();
            } catch (error) {
                console.error('Error loading bet history:', error);
            }
        }

        // ===== UTILITY FUNCTIONS =====
        function updateBetLimits() {
            const betInput = document.getElementById('bet-amount');
            betInput.max = Math.min(gameState.balance, 1000);
            
            if (parseFloat(betInput.value) > betInput.max) {
                betInput.value = betInput.max;
            }
        }

        // ===== TOAST NOTIFICATIONS (SAME AS KENO) =====
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.add('show');
            }, 10);
            
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => {
                    if (container.contains(toast)) {
                        container.removeChild(toast);
                    }
                }, 300);
            }, 3000);
        }

        // ===== EVENT LISTENERS =====
        function setupEventListeners() {
            // League filter buttons
            document.querySelectorAll('.league-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    filterMatches(btn.dataset.league);
                });
            });
            
            // Clear bet slip
            document.getElementById('clear-betslip').addEventListener('click', clearBetSlip);
            
            // Place bet button
            document.getElementById('place-bet-btn').addEventListener('click', placeBet);
            
            // Quick bet buttons
            document.querySelectorAll('.quick-bet').forEach(btn => {
                btn.addEventListener('click', () => {
                    const amount = parseFloat(btn.dataset.amount);
                    document.getElementById('bet-amount').value = amount;
                    gameState.betAmount = amount;
                    updateBetSlip();
                });
            });
            
            // Bet amount input
            document.getElementById('bet-amount').addEventListener('input', (e) => {
                let value = parseFloat(e.target.value) || 1;
                value = Math.max(1, Math.min(value, Math.min(gameState.balance, 1000)));
                e.target.value = value;
                gameState.betAmount = value;
                updateBetSlip();
            });
            
            // Close result overlay
            document.getElementById('result-overlay').addEventListener('click', (e) => {
                if (e.target === document.getElementById('result-overlay')) {
                    document.getElementById('result-overlay').classList.remove('show');
                }
            });
        }

        // Make functions global for onclick handlers
        window.selectBet = selectBet;
        window.removeBet = removeBet;
    </script>
</body>
</html>
