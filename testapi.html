<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Fixtures Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 2.5em;
        }
        
        h1 span {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .status-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .status-info {
            display: flex;
            gap: 30px;
        }
        
        .status-item {
            text-align: center;
        }
        
        .status-label {
            font-size: 0.9em;
            opacity: 0.9;
        }
        
        .status-value {
            font-size: 1.5em;
            font-weight: bold;
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 10px;
        }
        
        .tab {
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
            font-weight: 500;
            transition: all 0.3s;
        }
        
        .tab:hover {
            background: #f0f0f0;
        }
        
        .tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .fixtures-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }
        
        .fixture-card {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
            overflow: hidden;
        }
        
        .fixture-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        
        .fixture-card.live::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #ff4757, #ff6b81);
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        .league-info {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .league-logo {
            width: 30px;
            height: 30px;
            object-fit: contain;
        }
        
        .league-name {
            font-size: 0.9em;
            color: #666;
        }
        
        .match-teams {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .team {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }
        
        .team-logo {
            width: 50px;
            height: 50px;
            object-fit: contain;
            margin-bottom: 10px;
        }
        
        .team-name {
            font-weight: 600;
            text-align: center;
            font-size: 0.9em;
        }
        
        .score {
            font-size: 2em;
            font-weight: bold;
            padding: 0 20px;
        }
        
        .score.live {
            color: #ff4757;
        }
        
        .match-info {
            text-align: center;
            color: #666;
            font-size: 0.9em;
            margin-top: 10px;
        }
        
        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            font-weight: 500;
            background: #f0f0f0;
            color: #666;
        }
        
        .status-badge.live {
            background: #ff4757;
            color: white;
            animation: pulse 1.5s infinite;
        }
        
        .loading {
            text-align: center;
            padding: 50px;
            color: #666;
        }
        
        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
            text-align: center;
        }
        
        .no-data {
            text-align: center;
            color: #999;
            padding: 40px;
            font-style: italic;
        }
        
        .debug-info {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-bottom: 20px;
            font-family: monospace;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚽ <span>Football Fixtures</span> ⚽</h1>
        
        <!-- Debug Info -->
        <div class="debug-info" id="debugInfo">
            <strong>Debug Info:</strong> Loading...
        </div>
        
        <!-- API Status Section -->
        <div class="status-card" id="statusCard">
            <div>
                <h2>API Status</h2>
                <p id="accountInfo">Loading account info...</p>
            </div>
            <div class="status-info">
                <div class="status-item">
                    <div class="status-label">Requests Today</div>
                    <div class="status-value" id="requestsUsed">-</div>
                </div>
                <div class="status-item">
                    <div class="status-label">Daily Limit</div>
                    <div class="status-value" id="requestsLimit">-</div>
                </div>
            </div>
        </div>
        
        <!-- Tabs -->
        <div class="tabs">
            <div class="tab active" onclick="switchTab('live')">🔴 LIVE</div>
            <div class="tab" onclick="switchTab('upcoming')">📅 Upcoming</div>
            <div class="tab" onclick="switchTab('finished')">✅ Finished</div>
        </div>
        
        <!-- Fixtures Container -->
        <div id="fixturesContainer">
            <div class="loading">
                <div class="loading-spinner"></div>
                <p>Loading fixtures...</p>
            </div>
        </div>
    </div>

    <script>
        // Your API key
        const API_KEY = '2396236d9d5cd07468ce280da8390ad5';
        const BASE_URL = 'https://v3.football.api-sports.io';
        
        let currentTab = 'live';
        const debugInfo = document.getElementById('debugInfo');
        
        // Switch between tabs
        function switchTab(tab) {
            currentTab = tab;
            
            // Update active tab styling
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            
            // Fetch fixtures for selected tab
            fetchFixtures(tab);
        }
        
        // Fetch fixtures based on status
        async function fetchFixtures(status) {
            const container = document.getElementById('fixturesContainer');
            container.innerHTML = '<div class="loading"><div class="loading-spinner"></div><p>Loading fixtures...</p></div>';
            
            // CRITICAL FIX: Use 2023 season (2023/2024) instead of 2024
            let params = {
                league: '39', // Premier League
                season: '2023'  // ← CHANGED FROM 2024 TO 2023
            };
            
            // Set status parameter based on tab
            if (status === 'live') {
                params.live = 'all';
                delete params.season; // For live matches, we don't need season
                delete params.date;
            } else if (status === 'upcoming') {
                // Get tomorrow's date for upcoming matches
                const tomorrow = new Date();
                tomorrow.setDate(tomorrow.getDate() + 1);
                params.date = tomorrow.toISOString().split('T')[0];
                params.status = 'NS'; // Not Started
            } else if (status === 'finished') {
                // Get yesterday's date for finished matches
                const yesterday = new Date();
                yesterday.setDate(yesterday.getDate() - 1);
                params.date = yesterday.toISOString().split('T')[0];
                params.status = 'FT'; // Full Time
            }
            
            // Update debug info
            debugInfo.innerHTML = `<strong>Debug Info:</strong> Fetching with params: ${JSON.stringify(params, null, 2)}`;
            
            try {
                console.log('Fetching with params:', params);
                
                const response = await fetch(`${BASE_URL}/fixtures?${new URLSearchParams(params)}`, {
                    method: 'GET',
                    headers: {
                        'x-apisports-key': API_KEY
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                console.log('API Response:', data);
                
                // Update debug with response info
                debugInfo.innerHTML += `<br><strong>Response:</strong> Found ${data.results || 0} fixtures`;
                
                displayFixtures(data.response);
                
                // Update API status
                const requestsUsed = response.headers.get('x-ratelimit-requests-remaining');
                const requestsLimit = response.headers.get('x-ratelimit-requests-limit');
                updateAPIStatus(requestsUsed, requestsLimit);
                
            } catch (error) {
                console.error('Error:', error);
                container.innerHTML = `<div class="error">Error loading fixtures: ${error.message}</div>`;
                debugInfo.innerHTML += `<br><strong>Error:</strong> ${error.message}`;
            }
        }
        
        // Display fixtures in the grid
        function displayFixtures(fixtures) {
            const container = document.getElementById('fixturesContainer');
            
            if (!fixtures || fixtures.length === 0) {
                container.innerHTML = '<div class="no-data">No fixtures found for this category</div>';
                return;
            }
            
            let html = '<div class="fixtures-grid">';
            
            fixtures.slice(0, 20).forEach(fixture => { // Limit to 20 fixtures
                const isLive = fixture.fixture.status.short === 'LIVE' || 
                              fixture.fixture.status.short === '1H' || 
                              fixture.fixture.status.short === '2H' || 
                              fixture.fixture.status.short === 'HT' ||
                              fixture.fixture.status.short === 'ET' ||
                              fixture.fixture.status.short === 'P';
                
                const isFinished = fixture.fixture.status.short === 'FT' || 
                                  fixture.fixture.status.short === 'AET' || 
                                  fixture.fixture.status.short === 'PEN';
                
                const statusText = fixture.fixture.status.long;
                const homeScore = fixture.goals.home ?? 0;
                const awayScore = fixture.goals.away ?? 0;
                
                html += `
                    <div class="fixture-card ${isLive ? 'live' : ''}">
                        <div class="league-info">
                            <img class="league-logo" src="${fixture.league.logo || 'https://via.placeholder.com/30'}" alt="${fixture.league.name}" onerror="this.src='https://via.placeholder.com/30'">
                            <span class="league-name">${fixture.league.name} (${fixture.league.country || 'International'})</span>
                        </div>
                        
                        <div class="match-teams">
                            <div class="team">
                                <img class="team-logo" src="${fixture.teams.home.logo || 'https://via.placeholder.com/50'}" alt="${fixture.teams.home.name}" onerror="this.src='https://via.placeholder.com/50'">
                                <span class="team-name">${fixture.teams.home.name}</span>
                            </div>
                            
                            <div class="score ${isLive ? 'live' : ''}">
                                ${homeScore} - ${awayScore}
                            </div>
                            
                            <div class="team">
                                <img class="team-logo" src="${fixture.teams.away.logo || 'https://via.placeholder.com/50'}" alt="${fixture.teams.away.name}" onerror="this.src='https://via.placeholder.com/50'">
                                <span class="team-name">${fixture.teams.away.name}</span>
                            </div>
                        </div>
                        
                        <div class="match-info">
                            <span class="status-badge ${isLive ? 'live' : ''}">${statusText}</span>
                            <p>${formatDate(fixture.fixture.date)}</p>
                            <p>${fixture.fixture.venue.name || 'Venue TBD'}</p>
                        </div>
                    </div>
                `;
            });
            
            html += '</div>';
            container.innerHTML = html;
        }
        
        // Update API status display
        function updateAPIStatus(used, limit) {
            document.getElementById('requestsUsed').textContent = used || '0';
            document.getElementById('requestsLimit').textContent = limit || '100';
        }
        
        // Fetch and display API account status
        async function fetchAPIStatus() {
            try {
                const response = await fetch(`${BASE_URL}/status`, {
                    method: 'GET',
                    headers: {
                        'x-apisports-key': API_KEY
                    }
                });
                
                const data = await response.json();
                console.log('Status response:', data);
                
                if (data.response && data.response.account) {
                    const account = data.response.account;
                    const subscription = data.response.subscription;
                    
                    document.getElementById('accountInfo').innerHTML = `
                        ${account.firstname} ${account.lastname} (${account.email}) - 
                        <strong>${subscription.plan} Plan</strong>
                    `;
                }
            } catch (error) {
                console.error('Error fetching status:', error);
            }
        }
        
        // Helper function to format date
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleString('en-US', {
                weekday: 'short',
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }
        
        // Helper function to get current date in YYYY-MM-DD format
        function getFormattedDate() {
            const date = new Date();
            return date.toISOString().split('T')[0];
        }
        
        // Initial load
        async function init() {
            await fetchAPIStatus();
            await fetchFixtures('live');
        }
        
        // Start the app
        init();
    </script>
</body>
</html>
