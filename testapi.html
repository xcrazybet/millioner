<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Live Forex Prices</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b1220;
    color: #e5e7eb;
}
header {
    background: #020617;
    padding: 16px;
    text-align: center;
    font-size: 22px;
    font-weight: bold;
}
.container {
    padding: 15px;
}
table {
    width: 100%;
    border-collapse: collapse;
    background: #020617;
}
th, td {
    padding: 10px;
    border-bottom: 1px solid #1e293b;
    text-align: center;
}
th {
    color: #38bdf8;
    position: sticky;
    top: 0;
    background: #020617;
}
.price-up { color: #22c55e; }
.price-down { color: #ef4444; }
footer {
    text-align: center;
    padding: 10px;
    font-size: 12px;
    color: #64748b;
}
</style>
</head>

<body>

<header>🌍 Live Forex Prices (All Pairs)</header>

<div class="container">
<table>
<thead>
<tr>
<th>Pair</th>
<th>Price</th>
<th>Change</th>
</tr>
</thead>
<tbody id="priceTable"></tbody>
</table>
</div>

<footer>Prices auto-refresh every 5 seconds</footer>

<script>
let lastPrices = {};

// Fetch live forex rates from free API
async function loadPrices() {
    try {
        const res = await fetch("https://api.exchangerate.host/latest?base=USD");
        const data = await res.json();
        const rates = data.rates;

        const tbody = document.getElementById("priceTable");
        tbody.innerHTML = "";

        // USD-based pairs
        Object.keys(rates).forEach(currency => {
            if (currency === "USD") return;

            const pair = "USD/" + currency;
            const price = rates[currency];
            const prev = lastPrices[pair] || price;
            const diff = price - prev;

            const row = document.createElement("tr");
            row.innerHTML = `
                <td>${pair}</td>
                <td>${price.toFixed(5)}</td>
                <td class="${diff >= 0 ? 'price-up' : 'price-down'}">
                    ${diff >= 0 ? '▲' : '▼'} ${diff.toFixed(5)}
                </td>
            `;

            tbody.appendChild(row);
            lastPrices[pair] = price;
        });

    } catch (err) {
        console.error("Error loading prices:", err);
    }
}

// Load initially
loadPrices();

// Refresh every 5 seconds
setInterval(loadPrices, 5000);
</script>

</body>
</html>
