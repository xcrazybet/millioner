<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Real-Time Crypto Prices (75+)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f9f9f9;
            padding: 20px;
        }
        h1 { text-align: center; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }
        th {
            background: #222;
            color: #fff;
        }
        td.price {
            font-weight: bold;
        }
    </style>
</head>
<body>

<h1>Real-Time Crypto Prices (75+)</h1>

<table id="priceTable">
    <thead>
        <tr>
            <th>Symbol</th>
            <th>Price (USDT)</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<script>
    const symbols = [
        "btcusdt","ethusdt","bnbusdt","adausdt","solusdt","xrpusdt","dogeusdt","dotusdt","maticusdt","avaxusdt",
        "shibusdt","tronusdt","ltcusdt","atomusdt","linkusdt","bchusdt","etcusdt","filusdt","vetusdt",
        "axsusdt","uniusdt","nearusdt","cakeusdt","fttusdt","gtousdt","eosusdt","hntusdt","thetausdt","manausdt",
        "sandusdt","chzusdt","axsbusdt","enjusdt","qntusdt","algoUSDT".toLowerCase(),
        "xtzusdt","icpusdt","ftmusdt","hbarusdt","egldusdt","axsbusdt","roseusdt","klayusdt","galausdt","radusdt",
        "lrcusdt","ankrusdt","kimiusdt","dfususdt","klvusdt","zecusdt","bnbbusd","ethbusd","btcbusd",
        "bnbbtc","ethbtc","adaeth","solbtc","avaxeth","doteth","linketh","maticeth","dogeeth","shibeth",
        "trxeth","ltceth","xrpeth","bchbtc","etceth","filbtc","vetbtc","axsbtc","manaeth","sandeth",
        "qnteth","algoeth","eoseth","hnteth","thetaeth","roseeth","galaeth","klayeth","ankreth","dfusdt"
    ];

    const tableBody = document.querySelector("#priceTable tbody");

    // Create table rows
    symbols.forEach(sym => {
        const row = document.createElement("tr");
        row.id = sym;
        row.innerHTML = `
            <td>${sym.toUpperCase()}</td>
            <td class="price">—</td>
        `;
        tableBody.appendChild(row);
    });

    // Build the combined stream URL
    const streams = symbols.map(s => `${s}@trade`).join("/");
    const ws = new WebSocket(`wss://stream.binance.com:9443/stream?streams=${streams}`);

    ws.onmessage = (msg) => {
        const data = JSON.parse(msg.data);
        const stream = data.stream;
        const payload = data.data;

        const symbol = payload.s.toLowerCase();
        const price = parseFloat(payload.p).toFixed(6);

        const row = document.getElementById(symbol);
        if (row) {
            row.querySelector(".price").innerText = price;
        }
    };

    ws.onopen = () => console.log("WebSocket connected 🚀");
    ws.onclose = () => console.log("WebSocket disconnected 😢");
    ws.onerror = (err) => console.error("WebSocket error", err);
</script>

</body>
</html>
