<!DOCTYPE html>
<html>
<head>
    <title>Live EUR/USD Price</title>
    <style>
        body {
            font-family: Arial;
            background: #111;
            color: white;
            text-align: center;
            margin-top: 100px;
        }
        #price {
            font-size: 50px;
            font-weight: bold;
        }
        .up { color: #00ff88; }
        .down { color: #ff4444; }
    </style>
</head>
<body>

<h1>Live EUR/USD Price</h1>
<div id="price">Loading...</div>

<script>
let lastPrice = null;

async function updatePrice() {
    try {
        const res = await fetch("https://api.exchangerate.host/latest?base=EUR&symbols=USD");
        const data = await res.json();
        const price = parseFloat(data.rates.USD);

        const el = document.getElementById("price");
        if (lastPrice !== null) {
            el.className = price > lastPrice ? "up" : price < lastPrice ? "down" : "";
        }

        el.textContent = price.toFixed(5);
        lastPrice = price;

    } catch (e) {
        console.error("Error fetching price:", e);
    }
}

// Update every 1 second
updatePrice();
setInterval(updatePrice, 1000);
</script>

</body>
</html>
