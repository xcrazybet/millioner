<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Forex Platform</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>

<style>
body {
  margin:0;
  background:#0e1117;
  color:#fff;
  font-family:Arial;
}
header {
  padding:12px;
  background:#161b22;
  display:flex;
  justify-content:space-between;
}
#chart { height:420px; }
.panel {
  padding:15px;
  display:flex;
  gap:10px;
  justify-content:center;
}
button {
  padding:12px 20px;
  border:none;
  font-size:16px;
  cursor:pointer;
}
.buy { background:#00c853; }
.sell { background:#d50000; }
</style>
</head>

<body>

<header>
  <div>EUR / USD</div>
  <div id="price">Loading...</div>
</header>

<div id="chart"></div>

<div class="panel">
  <button class="buy" onclick="trade('BUY')">BUY</button>
  <button class="sell" onclick="trade('SELL')">SELL</button>
</div>

<script>
const chart = LightweightCharts.createChart(
  document.getElementById('chart'),
  {
    layout:{ background:{color:'#0e1117'}, textColor:'#ccc' },
    grid:{ vertLines:{color:'#222'}, horzLines:{color:'#222'} },
    width:window.innerWidth,
    height:420
  }
);

const series = chart.addCandlestickSeries();
let time = Math.floor(Date.now()/1000);

// REAL price feed (public forex rate)
async function fetchPrice() {
  const res = await fetch(
    "https://api.exchangerate.host/latest?base=EUR&symbols=USD"
  );
  const data = await res.json();
  return data.rates.USD;
}

let lastPrice = null;

async function updateChart() {
  const price = await fetchPrice();
  document.getElementById("price").innerText = price.toFixed(5);

  if (!lastPrice) lastPrice = price;

  const open = lastPrice;
  const close = price;
  const high = Math.max(open, close);
  const low = Math.min(open, close);

  time += 60;
  series.update({ time, open, high, low, close });

  lastPrice = price;
}

setInterval(updateChart, 3000);

// LEGAL trade handling (redirect to broker)
function trade(type) {
  alert(
    type +
    " order will be sent to your broker.\n" +
    "This platform does not execute trades."
  );

  // Example broker redirect (replace with real broker)
  window.open(
    "https://www.tradingview.com/chart/?symbol=FX:EURUSD",
    "_blank"
  );
}
</script>

</body>
</html>
