<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Price Tracker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); color: #fff; min-height: 100vh; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        header { text-align: center; padding: 20px 0; margin-bottom: 30px; }
        header h1 { font-size: 2.8rem; margin-bottom: 10px; background: linear-gradient(to right, #00b4db, #0083b0); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .stats-bar { display: flex; justify-content: space-between; background: rgba(255,255,255,0.05); padding: 15px; border-radius: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .stat-item { text-align: center; flex: 1; min-width: 150px; }
        .stat-value { font-size: 1.8rem; font-weight: bold; color: #00b4db; }
        .controls { display: flex; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .tabs { display: flex; flex-wrap: wrap; gap: 10px; }
        .tab { padding: 10px 20px; background: rgba(255,255,255,0.1); border: none; color: white; border-radius: 5px; cursor: pointer; }
        .tab.active { background: #00b4db; }
        #search { padding: 10px 15px; border-radius: 5px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.05); color: white; width: 250px; }
        .crypto-table-container { background: rgba(255,255,255,0.05); border-radius: 10px; overflow: hidden; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th { padding: 15px; text-align: left; color: #00b4db; }
        td { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .crypto-info { display: flex; align-items: center; gap: 10px; }
        .crypto-icon { width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; }
        .price { font-weight: bold; }
        .change { padding: 5px 10px; border-radius: 5px; }
        .change.positive { color: #00ff9d; background: rgba(0,255,157,0.1); }
        .change.negative { color: #ff4d4d; background: rgba(255,77,77,0.1); }
        @media (max-width: 768px) { .stats-bar { flex-direction: column; } table { overflow-x: auto; } }
    </style>
</head>
<body>
    <div class="container">
        <header><h1>CryptoTracker</h1><p>Real-time cryptocurrency prices</p></header>
        <div class="stats-bar">
            <div class="stat-item"><div class="stat-value" id="total-market-cap">Loading...</div><div>Market Cap</div></div>
            <div class="stat-item"><div class="stat-value" id="total-volume">Loading...</div><div>24h Volume</div></div>
            <div class="stat-item"><div class="stat-value" id="btc-dominance">Loading...</div><div>BTC Dominance</div></div>
        </div>
        <div class="controls">
            <div class="tabs">
                <button class="tab active" data-filter="all">All</button>
                <button class="tab" data-filter="gainers">Gainers</button>
                <button class="tab" data-filter="losers">Losers</button>
            </div>
            <input type="text" id="search" placeholder="Search...">
        </div>
        <div class="crypto-table-container">
            <table>
                <thead><tr><th>#</th><th>Name</th><th>Price</th><th>24h Change</th><th>Market Cap</th></tr></thead>
                <tbody id="crypto-table-body"><tr><td colspan="5">Loading...</td></tr></tbody>
            </table>
        </div>
    </div>
    <script>
        const API_URL = 'https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=50&page=1&sparkline=false&price_change_percentage=24h';
        let cryptoData = [], currentFilter = 'all';
        
        async function fetchCryptoData() {
            try {
                const res = await fetch(API_URL);
                cryptoData = await res.json();
                calculateGlobalStats();
                renderCryptoTable();
                updateLastUpdated();
            } catch(err) {
                console.error('API Error:', err);
                cryptoData = []; // Fallback would go here
                renderCryptoTable();
            }
        }
        
        function calculateGlobalStats() {
            if(cryptoData.length === 0) return;
            const totalMarketCap = cryptoData.reduce((s,c) => s + c.market_cap, 0);
            const totalVolume = cryptoData.reduce((s,c) => s + c.total_volume, 0);
            const bitcoin = cryptoData.find(c => c.id === 'bitcoin');
            const btcDominance = bitcoin ? (bitcoin.market_cap / totalMarketCap * 100).toFixed(1) : 'N/A';
            document.getElementById('total-market-cap').textContent = formatCurrency(totalMarketCap);
            document.getElementById('total-volume').textContent = formatCurrency(totalVolume);
            document.getElementById('btc-dominance').textContent = `${btcDominance}%`;
        }
        
        function renderCryptoTable() {
            const tbody = document.getElementById('crypto-table-body');
            if(cryptoData.length === 0) { tbody.innerHTML = '<tr><td colspan="5">No data</td></tr>'; return; }
            let filtered = [...cryptoData];
            if(currentFilter === 'gainers') filtered = filtered.filter(c => c.price_change_percentage_24h > 0).slice(0,15);
            if(currentFilter === 'losers') filtered = filtered.filter(c => c.price_change_percentage_24h < 0).slice(0,15);
            const search = document.getElementById('search').value.toLowerCase();
            if(search) filtered = filtered.filter(c => c.name.toLowerCase().includes(search) || c.symbol.toLowerCase().includes(search));
            
            tbody.innerHTML = filtered.map(c => `
                <tr>
                    <td>${c.market_cap_rank || ''}</td>
                    <td><div class="crypto-info"><div class="crypto-icon">${c.symbol.charAt(0).toUpperCase()}</div><div>${c.name}<br><small>${c.symbol.toUpperCase()}</small></div></div></td>
                    <td class="price">${formatCurrency(c.current_price)}</td>
                    <td><div class="change ${c.price_change_percentage_24h >=0?'positive':'negative'}">${c.price_change_percentage_24h.toFixed(2)}%</div></td>
                    <td>${formatCurrency(c.market_cap)}</td>
                </tr>
            `).join('') || '<tr><td colspan="5">No matches</td></tr>';
        }
        
        function formatCurrency(v) {
            if(v >= 1e12) return '$'+(v/1e12).toFixed(2)+'T';
            if(v >= 1e9) return '$'+(v/1e9).toFixed(2)+'B';
            if(v >= 1e6) return '$'+(v/1e6).toFixed(2)+'M';
            if(v >= 1e3) return '$'+(v/1e3).toFixed(2)+'K';
            return '$'+v.toFixed(2);
        }
        
        function updateLastUpdated() {
            document.getElementById('last-updated')?.textContent = new Date().toLocaleTimeString();
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            fetchCryptoData();
            setInterval(fetchCryptoData, 30000);
            document.querySelectorAll('.tab').forEach(tab => tab.addEventListener('click', function() {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                currentFilter = this.dataset.filter;
                renderCryptoTable();
            }));
            document.getElementById('search').addEventListener('input', renderCryptoTable);
        });
    </script>
</body>
</html>
