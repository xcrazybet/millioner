<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Football Betting Test</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0A0E17; color: white; min-height: 100vh; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        
        .header { 
            background: rgba(10, 14, 23, 0.95); 
            padding: 15px; 
            border-radius: 10px;
            margin-bottom: 20px;
            border-bottom: 3px solid #FF6B6B;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .balance { 
            background: linear-gradient(45deg, #FF6B6B, #FF9E6D);
            padding: 8px 15px;
            border-radius: 8px;
            font-weight: 600;
        }
        
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab { 
            padding: 10px 20px; 
            background: #121826; 
            border: none; 
            border-radius: 6px; 
            color: white;
            cursor: pointer;
        }
        .tab.active { background: #4361EE; }
        
        .match-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; }
        .match-card {
            background: #1A2238;
            border-radius: 10px;
            padding: 15px;
            border: 2px solid #4361EE;
            transition: transform 0.3s;
        }
        .match-card:hover { transform: translateY(-3px); }
        
        .match-header { 
            display: flex; 
            justify-content: space-between; 
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .teams { display: flex; justify-content: space-between; align-items: center; margin: 15px 0; }
        .team { text-align: center; flex: 1; font-weight: 600; }
        .vs { color: #B0B7C3; padding: 0 10px; }
        
        .odds { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 15px; }
        .odd-btn {
            padding: 10px;
            background: rgba(255,255,255,0.05);
            border: 2px solid transparent;
            border-radius: 8px;
            color: white;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .odd-btn:hover { background: rgba(255,255,255,0.1); transform: scale(1.05); }
        .odd-btn.home { border-color: #3498db; }
        .odd-btn.draw { border-color: #9B59B6; }
        .odd-btn.away { border-color: #E74C3C; }
        
        .bet-panel {
            background: #121826;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            border: 2px solid #06D6A0;
            display: none;
        }
        .bet-panel.active { display: block; }
        
        .bet-info {
            background: #1A2238;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
        }
        
        .action-button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, #FF6B6B, #FF4757);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .action-button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255,107,107,0.3); }
        .action-button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 20px;
            background: #121826;
            border-left: 4px solid #FF6B6B;
            border-radius: 6px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transform: translateX(100%);
            opacity: 0;
            transition: all 0.3s;
        }
        .toast.show { transform: translateX(0); opacity: 1; }
        .toast.success { border-color: #06D6A0; }
        .toast.error { border-color: #FF6B6B; }
        
        .loading { text-align: center; padding: 40px; color: #B0B7C3; }
        .loading i { font-size: 30px; color: #FFD166; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1><i class="fas fa-futbol"></i> Football Betting Test</h1>
            <div class="balance" id="balanceDisplay">
                <i class="fas fa-wallet"></i> Balance: $1000.00
            </div>
        </div>
        
        <!-- Tabs -->
        <div class="tabs">
            <button class="tab active" data-tab="matches">Live Matches</button>
            <button class="tab" data-tab="mybets">My Bets</button>
        </div>
        
        <!-- Matches Tab -->
        <div id="matchesTab">
            <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                <button class="tab" onclick="fetchData('live')"><i class="fas fa-broadcast-tower"></i> Live</button>
                <button class="tab" onclick="fetchData('fixtures')"><i class="fas fa-calendar"></i> Upcoming</button>
                <button class="tab" onclick="fetchData('predictions')"><i class="fas fa-brain"></i> Predictions</button>
                <button class="tab" onclick="fetchData('odds')"><i class="fas fa-chart-line"></i> Value Bets</button>
            </div>
            
            <div id="matchList" class="match-list">
                <div class="loading">
                    <i class="fas fa-spinner"></i>
                    <p>Loading matches from API...</p>
                </div>
            </div>
            
            <!-- Betting Panel -->
            <div class="bet-panel" id="betPanel">
                <h3><i class="fas fa-money-bill-wave"></i> Place Bet</h3>
                
                <div style="margin: 15px 0; padding: 15px; background: #1A2238; border-radius: 8px;">
                    <div id="selectedMatch">No match selected</div>
                    <div style="font-size: 12px; color: #B0B7C3;" id="selectedLeague"></div>
                </div>
                
                <div class="bet-info">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                        <span>Selected:</span>
                        <span id="selectedBet">None</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                        <span>Odds:</span>
                        <span id="selectedOddsValue">0.00</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                        <span>Amount:</span>
                        <input type="number" id="betAmount" value="50" min="10" max="1000" style="width: 100px; padding: 5px; background: rgba(255,255,255,0.1); border: 1px solid #FFD166; border-radius: 4px; color: white; text-align: center;">
                    </div>
                    <div style="display: flex; justify-content: space-between; font-weight: 600; color: #06D6A0;">
                        <span>Potential Win:</span>
                        <span id="potentialWin">$0.00</span>
                    </div>
                </div>
                
                <button class="action-button" id="placeBetBtn" disabled onclick="placeBet()">
                    <i class="fas fa-check-circle"></i> PLACE BET
                </button>
            </div>
        </div>
        
        <!-- My Bets Tab -->
        <div id="mybetsTab" style="display: none;">
            <h3><i class="fas fa-history"></i> Bet History</h3>
            <div id="betsList">
                <div class="loading">
                    <i class="fas fa-history"></i>
                    <p>No bets placed yet</p>
                </div>
            </div>
        </div>
        
        <div style="margin-top: 30px; padding: 15px; background: rgba(239, 71, 111, 0.1); border-radius: 8px; font-size: 12px; text-align: center; color: #B0B7C3;">
            <i class="fas fa-exclamation-triangle"></i> Test version only. Bet responsibly.
        </div>
    </div>
    
    <!-- Toast Container -->
    <div id="toastContainer"></div>

    <script>
        // ===== STATE MANAGEMENT =====
        const state = {
            balance: 1000,
            currentTab: 'matches',
            selectedMatch: null,
            selectedBet: null,
            selectedOdds: 0,
            betAmount: 50,
            userBets: []
        };
        
        // ===== API FUNCTIONS =====
        async function fetchData(endpoint) {
            showLoading();
            
            try {
                const response = await fetch(`https://xcrazybet.github.io/millioner/api.html?endpoint=${endpoint}`);
                const data = await response.json();
                
                if (endpoint === 'live' || endpoint === 'fixtures') {
                    displayMatches(data.data || data);
                } else if (endpoint === 'predictions') {
                    displayPredictions(data.data || data);
                } else if (endpoint === 'odds') {
                    displayValueBets(data.data || data);
                }
                
                showToast(`Loaded ${endpoint} data`, 'success');
            } catch (error) {
                console.error('API Error:', error);
                showToast('API error. Using demo data.', 'error');
                displayDemoMatches();
            }
        }
        
        // ===== DISPLAY FUNCTIONS =====
        function displayMatches(matches) {
            const container = document.getElementById('matchList');
            
            if (!matches || matches.length === 0) {
                container.innerHTML = '<div class="match-card" style="text-align: center; padding: 40px;">No matches found</div>';
                return;
            }
            
            let html = '';
            matches.slice(0, 6).forEach((match, index) => {
                const homeTeam = match.home_team || match.homeTeam || `Team ${index + 1}`;
                const awayTeam = match.away_team || match.awayTeam || `Team ${index + 2}`;
                const league = match.league || match.competition || 'Football League';
                const time = match.time || match.date || 'TBD';
                const status = match.status || 'upcoming';
                
                // Generate realistic odds
                const homeOdds = (Math.random() * 0.5 + 1.8).toFixed(2);
                const drawOdds = (Math.random() * 0.8 + 3.0).toFixed(2);
                const awayOdds = (Math.random() * 0.6 + 2.1).toFixed(2);
                
                html += `
                    <div class="match-card" data-match='${JSON.stringify({homeTeam, awayTeam, league, time, status, homeOdds, drawOdds, awayOdds})}'>
                        <div class="match-header">
                            <div style="font-size: 12px; color: #B0B7C3;">${league}</div>
                            <div style="font-size: 11px; background: ${status === 'LIVE' ? '#FF6B6B' : '#4361EE'}; padding: 3px 8px; border-radius: 4px;">
                                ${status === 'LIVE' ? 'LIVE' : time}
                            </div>
                        </div>
                        
                        <div class="teams">
                            <div class="team">${homeTeam}</div>
                            <div class="vs">VS</div>
                            <div class="team">${awayTeam}</div>
                        </div>
                        
                        <div class="odds">
                            <button class="odd-btn home" onclick="selectBet(this, 'home', ${homeOdds}, '${homeTeam} Win')">
                                <div style="font-size: 10px; margin-bottom: 4px;">${homeTeam.substring(0, 8)}</div>
                                <div style="font-weight: 700; color: #FFD166;">${homeOdds}</div>
                            </button>
                            <button class="odd-btn draw" onclick="selectBet(this, 'draw', ${drawOdds}, 'Draw')">
                                <div style="font-size: 10px; margin-bottom: 4px;">Draw</div>
                                <div style="font-weight: 700; color: #FFD166;">${drawOdds}</div>
                            </button>
                            <button class="odd-btn away" onclick="selectBet(this, 'away', ${awayOdds}, '${awayTeam} Win')">
                                <div style="font-size: 10px; margin-bottom: 4px;">${awayTeam.substring(0, 8)}</div>
                                <div style="font-weight: 700; color: #FFD166;">${awayOdds}</div>
                            </button>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }
        
        function displayPredictions(predictions) {
            const container = document.getElementById('matchList');
            container.innerHTML = '<h3 style="margin-bottom: 15px;">AI Predictions</h3>';
            
            predictions.slice(0, 4).forEach(prediction => {
                const match = prediction.match || `${prediction.home_team} vs ${prediction.away_team}`;
                const predicted = prediction.prediction || 'No prediction';
                const confidence = prediction.confidence || 'N/A';
                
                container.innerHTML += `
                    <div class="match-card">
                        <div style="font-weight: 600; margin-bottom: 8px;">${match}</div>
                        <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                            <span style="color: #B0B7C3;">Prediction:</span>
                            <span style="color: #06D6A0; font-weight: 600;">${predicted}</span>
                        </div>
                        <div style="display: flex; justify-content: space-between;">
                            <span style="color: #B0B7C3;">Confidence:</span>
                            <span>${confidence}%</span>
                        </div>
                    </div>
                `;
            });
        }
        
        function displayValueBets(bets) {
            const container = document.getElementById('matchList');
            container.innerHTML = '<h3 style="margin-bottom: 15px;">Value Bets</h3>';
            
            bets.slice(0, 4).forEach(bet => {
                const match = bet.match || 'Football Match';
                const value = bet.value || 'N/A';
                const odds = bet.odds || 'N/A';
                
                container.innerHTML += `
                    <div class="match-card">
                        <div style="font-weight: 600; margin-bottom: 8px;">${match}</div>
                        <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                            <span style="color: #B0B7C3;">Value:</span>
                            <span style="color: #06D6A0; font-weight: 600;">${value}%</span>
                        </div>
                        <div style="display: flex; justify-content: space-between;">
                            <span style="color: #B0B7C3;">Recommended Odds:</span>
                            <span>${odds}</span>
                        </div>
                    </div>
                `;
            });
        }
        
        function displayDemoMatches() {
            const demoMatches = [
                {
                    homeTeam: 'Manchester United',
                    awayTeam: 'Liverpool',
                    league: 'Premier League',
                    time: '20:00',
                    status: 'upcoming',
                    homeOdds: '2.10',
                    drawOdds: '3.40',
                    awayOdds: '2.80'
                },
                {
                    homeTeam: 'Real Madrid',
                    awayTeam: 'Barcelona',
                    league: 'La Liga',
                    time: '21:30',
                    status: 'upcoming',
                    homeOdds: '1.90',
                    drawOdds: '3.60',
                    awayOdds: '3.10'
                },
                {
                    homeTeam: 'Bayern Munich',
                    awayTeam: 'Borussia Dortmund',
                    league: 'Bundesliga',
                    time: 'LIVE',
                    status: 'LIVE',
                    homeOdds: '1.75',
                    drawOdds: '4.00',
                    awayOdds: '3.50'
                }
            ];
            
            displayMatches(demoMatches);
        }
        
        // ===== BETTING FUNCTIONS =====
        function selectBet(button, betType, odds, betName) {
            // Remove active class from all buttons
            document.querySelectorAll('.odd-btn').forEach(btn => {
                btn.style.background = 'rgba(255,255,255,0.05)';
            });
            
            // Highlight selected button
            button.style.background = 'rgba(255, 209, 102, 0.15)';
            button.style.borderColor = '#FFD166';
            
            // Get match data
            const matchCard = button.closest('.match-card');
            const matchData = JSON.parse(matchCard.dataset.match);
            
            // Update state
            state.selectedMatch = matchData;
            state.selectedBet = betName;
            state.selectedOdds = parseFloat(odds);
            
            // Update display
            document.getElementById('selectedMatch').textContent = `${matchData.homeTeam} vs ${matchData.awayTeam}`;
            document.getElementById('selectedLeague').textContent = `${matchData.league} • ${matchData.time}`;
            document.getElementById('selectedBet').textContent = betName;
            document.getElementById('selectedOddsValue').textContent = odds;
            
            // Show bet panel
            document.getElementById('betPanel').classList.add('active');
            
            // Update potential win
            updatePotentialWin();
            
            // Enable bet button
            document.getElementById('placeBetBtn').disabled = false;
            
            showToast('Bet selection added', 'success');
        }
        
        function updatePotentialWin() {
            const amount = parseFloat(document.getElementById('betAmount').value) || 50;
            state.betAmount = amount;
            
            const potentialWin = amount * state.selectedOdds;
            document.getElementById('potentialWin').textContent = `$${potentialWin.toFixed(2)}`;
            
            // Validate amount
            if (amount < 10) {
                document.getElementById('betAmount').value = 10;
                document.getElementById('placeBetBtn').disabled = true;
            } else if (amount > 1000) {
                document.getElementById('betAmount').value = 1000;
                document.getElementById('placeBetBtn').disabled = true;
                showToast('Maximum bet is $1000', 'error');
            } else if (amount > state.balance) {
                document.getElementById('placeBetBtn').disabled = true;
                showToast('Insufficient balance', 'error');
            } else {
                document.getElementById('placeBetBtn').disabled = false;
            }
        }
        
        function placeBet() {
            if (!state.selectedMatch || !state.selectedOdds) {
                showToast('Please select a bet first', 'error');
                return;
            }
            
            const amount = parseFloat(document.getElementById('betAmount').value);
            if (amount > state.balance) {
                showToast('Insufficient balance', 'error');
                return;
            }
            
            // Create bet record
            const bet = {
                id: Date.now(),
                match: `${state.selectedMatch.homeTeam} vs ${state.selectedMatch.awayTeam}`,
                selection: state.selectedBet,
                odds: state.selectedOdds,
                amount: amount,
                potentialWin: amount * state.selectedOdds,
                placedAt: new Date().toLocaleTimeString(),
                status: 'pending'
            };
            
            // Update balance
            state.balance -= amount;
            document.getElementById('balanceDisplay').innerHTML = `<i class="fas fa-wallet"></i> Balance: $${state.balance.toFixed(2)}`;
            
            // Add to history
            state.userBets.unshift(bet);
            updateBetHistory();
            
            // Reset selection
            document.getElementById('betPanel').classList.remove('active');
            document.querySelectorAll('.odd-btn').forEach(btn => {
                btn.style.background = 'rgba(255,255,255,0.05)';
                btn.style.borderColor = '';
            });
            
            showToast(`Bet placed! $${amount.toFixed(2)} deducted`, 'success');
            
            // Simulate result after delay
            setTimeout(() => {
                simulateBetResult(bet);
            }, 3000);
        }
        
        function simulateBetResult(bet) {
            const winProbability = 0.4; // 40% chance to win
            const isWin = Math.random() < winProbability;
            
            const betIndex = state.userBets.findIndex(b => b.id === bet.id);
            if (betIndex !== -1) {
                state.userBets[betIndex].status = isWin ? 'won' : 'lost';
                
                if (isWin) {
                    const winAmount = bet.potentialWin;
                    state.balance += winAmount;
                    document.getElementById('balanceDisplay').innerHTML = `<i class="fas fa-wallet"></i> Balance: $${state.balance.toFixed(2)}`;
                    showToast(`🎉 BET WON! You won $${winAmount.toFixed(2)}!`, 'success');
                } else {
                    showToast(`Bet lost: $${bet.amount.toFixed(2)}`, 'error');
                }
                
                updateBetHistory();
            }
        }
        
        function updateBetHistory() {
            const container = document.getElementById('betsList');
            
            if (state.userBets.length === 0) {
                container.innerHTML = '<div class="loading"><i class="fas fa-history"></i><p>No bets placed yet</p></div>';
                return;
            }
            
            let html = '';
            state.userBets.forEach(bet => {
                const statusColor = bet.status === 'won' ? '#06D6A0' : 
                                   bet.status === 'lost' ? '#FF6B6B' : '#4361EE';
                
                html += `
                    <div class="match-card" style="margin-bottom: 10px; border-left: 4px solid ${statusColor}">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                            <span style="font-weight: 600;">${bet.match}</span>
                            <span style="font-size: 12px; color: #B0B7C3;">${bet.placedAt}</span>
                        </div>
                        <div style="display: flex; justify-content: space-between; margin-bottom: 5px;">
                            <span>${bet.selection} @ ${bet.odds}</span>
                            <span style="font-weight: 600;">$${bet.amount.toFixed(2)}</span>
                        </div>
                        <div style="display: flex; justify-content: space-between;">
                            <span style="color: #B0B7C3;">Status:</span>
                            <span style="color: ${statusColor}; font-weight: 600; text-transform: uppercase;">
                                ${bet.status} ${bet.status === 'won' ? `(+$${bet.potentialWin.toFixed(2)})` : ''}
                            </span>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }
        
        // ===== UI FUNCTIONS =====
        function showLoading() {
            document.getElementById('matchList').innerHTML = `
                <div class="loading">
                    <i class="fas fa-spinner"></i>
                    <p>Loading from API...</p>
                </div>
            `;
        }
        
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.add('show');
            }, 10);
            
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => {
                    if (container.contains(toast)) {
                        container.removeChild(toast);
                    }
                }, 300);
            }, 3000);
        }
        
        // ===== INITIALIZATION =====
        document.addEventListener('DOMContentLoaded', () => {
            // Setup tab switching
            document.querySelectorAll('.tab[data-tab]').forEach(tab => {
                tab.addEventListener('click', () => {
                    const tabId = tab.dataset.tab;
                    state.currentTab = tabId;
                    
                    // Update active tab
                    document.querySelectorAll('.tab[data-tab]').forEach(t => {
                        t.classList.toggle('active', t === tab);
                    });
                    
                    // Show correct content
                    document.getElementById('matchesTab').style.display = tabId === 'matches' ? 'block' : 'none';
                    document.getElementById('mybetsTab').style.display = tabId === 'mybets' ? 'block' : 'none';
                    
                    if (tabId === 'mybets') {
                        updateBetHistory();
                    }
                });
            });
            
            // Setup bet amount input
            document.getElementById('betAmount').addEventListener('input', updatePotentialWin);
            
            // Quick amount buttons
            [20, 50, 100, 200, 500].forEach(amount => {
                document.getElementById('betAmount').insertAdjacentHTML('afterend', 
                    `<button onclick="document.getElementById('betAmount').value=${amount}; updatePotentialWin()" 
                     style="margin-left:5px; padding:4px 8px; background:#4361EE; border:none; border-radius:4px; color:white; font-size:12px;">
                     $${amount}
                    </button>`);
            });
            
            // Initial data load
            fetchData('live');
        });
    </script>
</body>
</html>
