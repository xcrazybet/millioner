<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Market Prices</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
        margin: 0;
        padding: 20px;
    }
    h1 {
        text-align: center;
        color: #333;
    }
    .market-container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
        margin-top: 20px;
    }
    .market-card {
        background-color: #fff;
        padding: 15px;
        border-radius: 10px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        text-align: center;
        transition: transform 0.2s;
    }
    .market-card:hover {
        transform: translateY(-5px);
    }
    .market-card img {
        width: 50px;
        height: 50px;
        margin-bottom: 10px;
    }
    .market-name {
        font-weight: bold;
        font-size: 18px;
        margin-bottom: 5px;
    }
    .market-price {
        font-size: 20px;
        color: green;
    }
    .market-change {
        font-size: 16px;
        margin-top: 5px;
    }
    .up { color: green; }
    .down { color: red; }
</style>
</head>
<body>

<h1>Live Market Prices</h1>

<div class="market-container" id="marketContainer">
    <!-- Cards will be injected here -->
</div>

<script>
const marketData = [
    { type: 'Stock', symbol: 'AAPL', name: 'Apple', icon: 'https://cdn-icons-png.flaticon.com/512/732/732200.png' },
    { type: 'Stock', symbol: 'GOOGL', name: 'Alphabet', icon: 'https://cdn-icons-png.flaticon.com/512/732/732221.png' },
    { type: 'Forex', symbol: 'EURUSD=X', name: 'EUR/USD', icon: 'https://cdn-icons-png.flaticon.com/512/555/555417.png' },
    { type: 'Commodity', symbol: 'GC=F', name: 'Gold', icon: 'https://cdn-icons-png.flaticon.com/512/616/616408.png' },
    { type: 'Commodity', symbol: 'CL=F', name: 'Crude Oil', icon: 'https://cdn-icons-png.flaticon.com/512/942/942748.png' },
    { type: 'Bond', symbol: 'US10Y', name: 'US 10Y Treasury', icon: 'https://cdn-icons-png.flaticon.com/512/188/188987.png' }
];

const marketContainer = document.getElementById('marketContainer');

async function fetchPrice(symbol) {
    try {
        const response = await fetch(`https://query1.finance.yahoo.com/v7/finance/quote?symbols=${symbol}`);
        const data = await response.json();
        const quote = data.quoteResponse.result[0];
        return {
            price: quote.regularMarketPrice,
            change: quote.regularMarketChangePercent.toFixed(2)
        };
    } catch (err) {
        console.error(err);
        return { price: 'N/A', change: 0 };
    }
}

async function renderMarket() {
    marketContainer.innerHTML = '';
    for (const market of marketData) {
        const priceData = await fetchPrice(market.symbol);
        const changeClass = priceData.change >= 0 ? 'up' : 'down';
        const card = document.createElement('div');
        card.className = 'market-card';
        card.innerHTML = `
            <img src="${market.icon}" alt="${market.name}">
            <div class="market-name">${market.name}</div>
            <div class="market-price">$${priceData.price}</div>
            <div class="market-change ${changeClass}">${priceData.change}%</div>
        `;
        marketContainer.appendChild(card);
    }
}

// Initial render
renderMarket();

// Update every 30 seconds
setInterval(renderMarket, 30000);
</script>

</body>
</html>
