// Function to fetch price from Yahoo Finance
async function fetchPrice(symbol) {
    try {
        const response = await fetch(`https://query1.finance.yahoo.com/v7/finance/quote?symbols=${symbol}`);
        const data = await response.json();
        const quote = data.quoteResponse.result[0];
        return {
            price: quote?.regularMarketPrice ?? 'N/A',
            change: quote?.regularMarketChangePercent?.toFixed(2) ?? 0
        };
    } catch {
        return { price: 'N/A', change: 0 };
    }
}

// Function to render assets
async function renderCategory(categoryData, containerId) {
    const container = document.getElementById(containerId);
    container.innerHTML = '';
    for (const item of categoryData) {
        const priceData = await fetchPrice(item.symbol);
        const changeClass = priceData.change >= 0 ? 'up' : 'down';
        const card = document.createElement('div');
        card.className = 'market-card';
        card.innerHTML = `
            <img src="${item.icon}" alt="${item.name}">
            <div class="market-name">${item.name}</div>
            <div class="market-price">$${priceData.price}</div>
            <div class="market-change ${changeClass}">${priceData.change}%</div>
        `;
        container.appendChild(card);
    }
}

// Render all categories

    await renderCategory(marketData.stocks, 'stocksContainer');
    await renderCategory(marketData.forex, 'forexContainer');
    await renderCategory(marketData.commodities, 'commoditiesContainer');
    await renderCategory(marketData.bonds, 'bondsContainer');
}
