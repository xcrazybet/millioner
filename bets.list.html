<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>📋 My Bets - X London Betting</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0a0f1a 0%, #0f172a 100%);
            color: #ffffff;
            min-height: 100vh;
            padding-bottom: 70px;
        }

        /* Header */
        .header {
            background: rgba(17, 24, 39, 0.95);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #00ff9d;
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo i {
            color: #00ff9d;
            font-size: 24px;
        }

        .logo span {
            background: linear-gradient(45deg, #00ff9d, #ff9800);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .balance-display {
            background: linear-gradient(45deg, #1a2332, #0f172a);
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid #00ff9d;
            color: #00ff9d;
            font-weight: 700;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Stats Cards */
        .stats-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            padding: 16px;
            background: rgba(0, 0, 0, 0.2);
            margin-bottom: 16px;
        }

        .stat-card {
            background: rgba(17, 24, 39, 0.9);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            border: 1px solid rgba(0, 255, 157, 0.15);
        }

        .stat-label {
            font-size: 11px;
            color: #a0a8c9;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 700;
        }

        .stat-value.win {
            color: #00ff9d;
        }

        .stat-value.loss {
            color: #ff4444;
        }

        /* Filter Bar */
        .filter-bar {
            display: flex;
            gap: 10px;
            padding: 12px 16px;
            background: rgba(17, 24, 39, 0.8);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: none;
            border-radius: 20px;
            color: #a0a8c9;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .filter-btn.active {
            background: #00ff9d;
            color: #000;
        }

        .filter-btn:hover {
            background: rgba(0, 255, 157, 0.3);
        }

        /* Bets List */
        .bets-container {
            padding: 16px;
        }

        .bet-card {
            background: rgba(17, 24, 39, 0.9);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            border-left: 4px solid;
            transition: all 0.3s;
        }

        .bet-card.active {
            border-left-color: #ff9800;
        }

        .bet-card.won {
            border-left-color: #00ff9d;
            background: rgba(0, 255, 157, 0.05);
        }

        .bet-card.lost {
            border-left-color: #ff4444;
            background: rgba(255, 68, 68, 0.05);
        }

        .bet-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .bet-match {
            font-weight: 700;
            font-size: 14px;
        }

        .bet-status {
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 600;
        }

        .bet-status.active {
            background: #ff9800;
            color: #000;
        }

        .bet-status.won {
            background: #00ff9d;
            color: #000;
        }

        .bet-status.lost {
            background: #ff4444;
            color: #fff;
        }

        .bet-status.pending {
            background: #666;
            color: #fff;
        }

        .bet-details {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin: 12px 0;
            padding: 12px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .bet-detail-item {
            flex: 1;
            text-align: center;
        }

        .bet-detail-label {
            font-size: 10px;
            color: #a0a8c9;
            margin-bottom: 4px;
        }

        .bet-detail-value {
            font-size: 14px;
            font-weight: 600;
        }

        .bet-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            font-size: 11px;
            color: #a0a8c9;
        }

        .bet-profit {
            font-weight: 700;
            font-size: 14px;
        }

        .bet-profit.positive {
            color: #00ff9d;
        }

        .bet-profit.negative {
            color: #ff4444;
        }

        /* No Bets */
        .no-bets {
            text-align: center;
            padding: 60px 20px;
            color: #a0a8c9;
        }

        .no-bets i {
            font-size: 50px;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        /* Loading */
        .loading-spinner {
            text-align: center;
            padding: 40px;
        }

        .loading-spinner i {
            font-size: 40px;
            color: #00ff9d;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Bottom Navigation */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            background: rgba(17, 24, 39, 0.98);
            padding: 10px 16px;
            border-top: 1px solid rgba(0, 255, 157, 0.2);
            position: fixed;
            bottom: 0;
            width: 100%;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #a0a8c9;
            font-size: 11px;
            gap: 4px;
            transition: all 0.3s;
        }

        .nav-item i {
            font-size: 20px;
        }

        .nav-item.active, .nav-item:hover {
            color: #00ff9d;
        }

        /* Toast */
        .toast-container {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10000;
            width: 90%;
            max-width: 300px;
        }

        .toast {
            padding: 12px 16px;
            background: #1a2332;
            border-radius: 10px;
            margin-bottom: 8px;
            border-left: 4px solid #00ff9d;
            animation: slideIn 0.3s ease;
            font-size: 13px;
        }

        @keyframes slideIn {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .stats-container {
                gap: 8px;
            }
            
            .stat-value {
                font-size: 16px;
            }
            
            .bet-details {
                flex-direction: column;
                gap: 8px;
            }
            
            .bet-detail-item {
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            
            .bet-detail-label {
                margin-bottom: 0;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="logo">
            <i class="fas fa-history"></i>
            <span>MY BETS</span>
        </div>
        <div class="balance-display">
            <i class="fas fa-wallet"></i>
            $<span id="balanceVal">0.00</span>
        </div>
    </header>

    <!-- Stats Cards -->
    <div class="stats-container">
        <div class="stat-card">
            <div class="stat-label">Total Bets</div>
            <div class="stat-value" id="totalBets">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Total Won</div>
            <div class="stat-value win" id="totalWon">$0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Total Lost</div>
            <div class="stat-value loss" id="totalLost">$0</div>
        </div>
    </div>

    <!-- Filter Bar -->
    <div class="filter-bar">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="won">Won</button>
        <button class="filter-btn" data-filter="lost">Lost</button>
        <button class="filter-btn" data-filter="pending">Pending</button>
    </div>

    <!-- Bets Container -->
    <div class="bets-container" id="betsContainer">
        <div class="loading-spinner">
            <i class="fas fa-spinner"></i>
            <p>Loading your bets...</p>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="football.html" class="nav-item">
            <i class="fas fa-futbol"></i>
            Football
        </a>
        <a href="bets.list.html" class="nav-item active">
            <i class="fas fa-history"></i>
            My Bets
        </a>
        <a href="#" class="nav-item" id="walletBtn">
            <i class="fas fa-wallet"></i>
            Wallet
        </a>
    </nav>

    <!-- Wallet Modal -->
    <div id="walletModal" class="modal" style="display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:2000; align-items:center; justify-content:center;">
        <div style="background: linear-gradient(135deg, #1a2332, #0f172a); border-radius: 20px; padding: 24px; max-width: 400px; width: 90%; border: 2px solid #00ff9d;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3 style="color: #00ff9d;"><i class="fas fa-wallet"></i> My Wallet</h3>
                <span id="closeWalletModal" style="font-size: 28px; cursor: pointer; color: #ff4444;">&times;</span>
            </div>
            <div style="text-align: center; padding: 20px;">
                <div style="font-size: 48px; color: #00ff9d;"><i class="fas fa-coins"></i></div>
                <div style="font-size: 36px; font-weight: 800; margin: 15px 0;">$<span id="walletBalance">0.00</span></div>
                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button id="addFundsBtn" style="flex:1; padding:12px; background:#00ff9d; border:none; border-radius:10px; font-weight:600; cursor:pointer;"><i class="fas fa-plus"></i> Add Funds</button>
                    <button id="withdrawBtn" style="flex:1; padding:12px; background:#ff9800; border:none; border-radius:10px; font-weight:600; cursor:pointer;"><i class="fas fa-download"></i> Withdraw</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Funds Modal -->
    <div id="addFundsModal" style="display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:2001; align-items:center; justify-content:center;">
        <div style="background: linear-gradient(135deg, #1a2332, #0f172a); border-radius: 20px; padding: 24px; max-width: 400px; width: 90%; border: 2px solid #00ff9d;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3 style="color: #00ff9d;"><i class="fas fa-plus-circle"></i> Add Funds</h3>
                <span id="closeAddFundsModal" style="font-size: 28px; cursor: pointer; color: #ff4444;">&times;</span>
            </div>
            <div style="padding: 20px;">
                <div style="display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px;">
                    <button data-add="10" style="flex:1; padding:10px; background:#ff9800; border:none; border-radius:8px; cursor:pointer; font-weight:600;">$10</button>
                    <button data-add="25" style="flex:1; padding:10px; background:#ff9800; border:none; border-radius:8px; cursor:pointer; font-weight:600;">$25</button>
                    <button data-add="50" style="flex:1; padding:10px; background:#ff9800; border:none; border-radius:8px; cursor:pointer; font-weight:600;">$50</button>
                    <button data-add="100" style="flex:1; padding:10px; background:#ff9800; border:none; border-radius:8px; cursor:pointer; font-weight:600;">$100</button>
                </div>
                <input type="number" id="addAmount" placeholder="Custom amount" style="width:100%; padding:14px; background:rgba(0,0,0,0.5); border:1px solid #00ff9d; border-radius:10px; color:#fff; font-size:16px; margin-bottom:15px;">
                <button id="processAddFunds" style="width:100%; padding:14px; background:linear-gradient(135deg, #00ff9d, #00cc7a); border:none; border-radius:10px; font-weight:700; cursor:pointer;"><i class="fas fa-check"></i> Add Funds</button>
            </div>
        </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <script>
        // ===== FIREBASE CONFIGURATION =====
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ===== GLOBAL STATE =====
        let currentUser = null;
        let balance = 0;
        let allBets = [];
        let currentFilter = 'all';

        // ===== AUTHENTICATION =====
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                currentUser = user;
                await loadBalance();
                await loadBets();
            } else {
                showToast('Please login to continue', 'error');
                setTimeout(() => {
                    window.location.href = 'https://xcrazybet.github.io/millioner/login.html';
                }, 2000);
            }
        });

        // ===== LOAD BALANCE =====
        async function loadBalance() {
            try {
                const doc = await db.collection("wallets").doc(currentUser.uid).get();
                if (doc.exists) {
                    balance = doc.data().balance || 0;
                    updateBalanceDisplay();
                }
            } catch (error) {
                console.error('Error loading balance:', error);
            }
        }

        function updateBalanceDisplay() {
            const elements = document.querySelectorAll('#balanceVal, #walletBalance');
            elements.forEach(el => {
                if (el) el.textContent = balance.toFixed(2);
            });
        }

        // ===== PROCESS TRANSACTION =====
        async function processTransaction(amount, type, description) {
            try {
                const walletRef = db.collection("wallets").doc(currentUser.uid);
                
                return await db.runTransaction(async (transaction) => {
                    const walletDoc = await transaction.get(walletRef);
                    
                    if (!walletDoc.exists) {
                        throw new Error("Wallet not found");
                    }
                    
                    const currentBalance = walletDoc.data().balance || 0;
                    const newBalance = currentBalance + amount;
                    
                    if (newBalance < 0) {
                        throw new Error("Insufficient funds");
                    }
                    
                    transaction.update(walletRef, {
                        balance: newBalance,
                        updatedAt: new Date()
                    });
                    
                    const transactionRef = walletRef.collection("transactions").doc();
                    transaction.set(transactionRef, {
                        type: type,
                        amount: amount,
                        description: description,
                        createdAt: new Date(),
                        beforeBalance: currentBalance,
                        afterBalance: newBalance
                    });
                    
                    balance = newBalance;
                    updateBalanceDisplay();
                    
                    return { success: true, newBalance };
                });
            } catch (error) {
                console.error('Transaction failed:', error);
                showToast(error.message, 'error');
                return { success: false, error: error.message };
            }
        }

        // ===== ADD FUNDS =====
        async function addFunds(amount) {
            if (amount < 1) {
                showToast('Invalid amount', 'error');
                return;
            }
            
            const result = await processTransaction(amount, "deposit", `Added $${amount} to wallet`);
            if (result.success) {
                showToast(`$${amount} added successfully!`, 'success');
                document.getElementById('addFundsModal').style.display = 'none';
            }
        }

        // ===== LOAD BETS (LAST 30 DAYS) =====
        async function loadBets() {
            const container = document.getElementById('betsContainer');
            container.innerHTML = '<div class="loading-spinner"><i class="fas fa-spinner"></i><p>Loading your bets...</p></div>';
            
            try {
                const thirtyDaysAgo = new Date();
                thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);
                
                const snapshot = await db.collection("sports_bets")
                    .where("userId", "==", currentUser.uid)
                    .where("placedAt", ">=", thirtyDaysAgo)
                    .orderBy("placedAt", "desc")
                    .get();
                
                allBets = [];
                snapshot.forEach(doc => {
                    allBets.push({ id: doc.id, ...doc.data() });
                });
                
                updateStats();
                displayBets();
                
            } catch (error) {
                console.error('Error loading bets:', error);
                container.innerHTML = `
                    <div class="no-bets">
                        <i class="fas fa-exclamation-triangle"></i>
                        <p>Error loading bets. Please refresh.</p>
                    </div>
                `;
            }
        }

        // ===== UPDATE STATS =====
        function updateStats() {
            const totalBets = allBets.length;
            let totalWon = 0;
            let totalLost = 0;
            
            allBets.forEach(bet => {
                if (bet.status === 'won') {
                    totalWon += bet.potentialWin || 0;
                } else if (bet.status === 'lost') {
                    totalLost += bet.amount || 0;
                }
            });
            
            document.getElementById('totalBets').textContent = totalBets;
            document.getElementById('totalWon').textContent = `$${totalWon.toFixed(2)}`;
            document.getElementById('totalLost').textContent = `$${totalLost.toFixed(2)}`;
        }

        // ===== DISPLAY BETS =====
        function displayBets() {
            const container = document.getElementById('betsContainer');
            
            let filteredBets = allBets;
            if (currentFilter !== 'all') {
                filteredBets = allBets.filter(bet => bet.status === currentFilter);
            }
            
            if (filteredBets.length === 0) {
                container.innerHTML = `
                    <div class="no-bets">
                        <i class="fas fa-receipt"></i>
                        <p>No ${currentFilter !== 'all' ? currentFilter : ''} bets found</p>
                        <p style="font-size: 12px; margin-top: 8px;">Place your first bet on the Football page!</p>
                    </div>
                `;
                return;
            }
            
            let html = '';
            
            filteredBets.forEach(bet => {
                const placedDate = bet.placedAt?.toDate ? bet.placedAt.toDate() : new Date(bet.placedAt);
                const formattedDate = placedDate.toLocaleDateString() + ' ' + placedDate.toLocaleTimeString();
                
                const statusClass = bet.status;
                const profitClass = bet.profit >= 0 ? 'positive' : 'negative';
                const profitSign = bet.profit >= 0 ? '+' : '';
                
                html += `
                    <div class="bet-card ${statusClass}">
                        <div class="bet-header">
                            <div class="bet-match">
                                <i class="fas fa-futbol"></i> ${bet.matchName || 'Unknown Match'}
                            </div>
                            <div class="bet-status ${statusClass}">
                                ${bet.status.toUpperCase()}
                            </div>
                        </div>
                        
                        <div class="bet-details">
                            <div class="bet-detail-item">
                                <div class="bet-detail-label">Bet Type</div>
                                <div class="bet-detail-value">${bet.betType?.toUpperCase() || '-'}</div>
                            </div>
                            <div class="bet-detail-item">
                                <div class="bet-detail-label">Odds</div>
                                <div class="bet-detail-value">${bet.odds || 0}x</div>
                            </div>
                            <div class="bet-detail-item">
                                <div class="bet-detail-label">Stake</div>
                                <div class="bet-detail-value">$${bet.amount?.toFixed(2) || 0}</div>
                            </div>
                            <div class="bet-detail-item">
                                <div class="bet-detail-label">Potential Win</div>
                                <div class="bet-detail-value">$${bet.potentialWin?.toFixed(2) || 0}</div>
                            </div>
                        </div>
                        
                        <div class="bet-footer">
                            <span><i class="far fa-clock"></i> ${formattedDate}</span>
                            <span class="bet-profit ${profitClass}">
                                ${profitSign}$${Math.abs(bet.profit || 0).toFixed(2)}
                            </span>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }

        // ===== SHOW TOAST =====
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.style.borderLeftColor = type === 'error' ? '#ff4444' : '#00ff9d';
            toast.innerHTML = `<i class="fas ${type === 'error' ? 'fa-exclamation-circle' : 'fa-check-circle'}"></i> ${message}`;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        // ===== EVENT LISTENERS =====
        function setupEventListeners() {
            // Filter buttons
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentFilter = btn.dataset.filter;
                    displayBets();
                });
            });
            
            // Wallet modal
            document.getElementById('walletBtn').addEventListener('click', () => {
                document.getElementById('walletBalance').textContent = balance.toFixed(2);
                document.getElementById('walletModal').style.display = 'flex';
            });
            
            document.getElementById('closeWalletModal').addEventListener('click', () => {
                document.getElementById('walletModal').style.display = 'none';
            });
            
            // Add funds
            document.getElementById('addFundsBtn').addEventListener('click', () => {
                document.getElementById('walletModal').style.display = 'none';
                document.getElementById('addFundsModal').style.display = 'flex';
            });
            
            document.getElementById('closeAddFundsModal').addEventListener('click', () => {
                document.getElementById('addFundsModal').style.display = 'none';
            });
            
            document.querySelectorAll('[data-add]').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.getElementById('addAmount').value = btn.dataset.add;
                });
            });
            
            document.getElementById('processAddFunds').addEventListener('click', () => {
                const amount = parseFloat(document.getElementById('addAmount').value);
                if (amount && amount > 0) {
                    addFunds(amount);
                } else {
                    showToast('Enter valid amount', 'error');
                }
            });
            
            document.getElementById('withdrawBtn').addEventListener('click', () => {
                showToast('Withdrawal requests: Contact support', 'info');
            });
            
            // Close modals on background click
            window.addEventListener('click', (e) => {
                if (e.target.id === 'walletModal') {
                    document.getElementById('walletModal').style.display = 'none';
                }
                if (e.target.id === 'addFundsModal') {
                    document.getElementById('addFundsModal').style.display = 'none';
                }
            });
        }

        // ===== REAL-TIME BET UPDATES =====
        function setupRealtimeUpdates() {
            if (!currentUser) return;
            
            db.collection("sports_bets")
                .where("userId", "==", currentUser.uid)
                .onSnapshot((snapshot) => {
                    snapshot.docChanges().forEach((change) => {
                        if (change.type === 'modified') {
                            loadBets(); // Reload all bets when any bet changes
                        }
                    });
                });
        }

        // ===== INITIALIZE =====
        setupEventListeners();
        
        // Start real-time listener after auth
        auth.onAuthStateChanged((user) => {
            if (user) {
                setupRealtimeUpdates();
            }
        });
    </script>
</body>
</html>
