<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Betting - Millioner</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            color: white;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .header {
            background: rgba(0,0,0,0.3);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .balance { background: rgba(255,215,0,0.2); padding: 10px 20px; border-radius: 25px; font-weight: bold; }
        .tabs { display: flex; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; }
        .tab {
            padding: 12px 24px;
            background: rgba(0,0,0,0.3);
            cursor: pointer;
            border-radius: 10px;
            transition: 0.3s;
        }
        .tab:hover { background: rgba(255,255,255,0.2); }
        .tab.active { background: #ffd700; color: #333; }
        .matches-grid { display: grid; gap: 20px; }
        .match-card {
            background: rgba(0,0,0,0.3);
            border-radius: 15px;
            padding: 20px;
            transition: 0.3s;
        }
        .match-card:hover { transform: translateY(-3px); background: rgba(0,0,0,0.4); }
        .match-league { font-size: 12px; color: #ffd700; margin-bottom: 10px; }
        .match-teams {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .team { flex: 1; text-align: center; }
        .vs { margin: 0 20px; color: #ffd700; }
        .match-score { text-align: center; font-size: 32px; font-weight: bold; margin: 15px 0; color: #ffd700; }
        .match-time { text-align: center; color: rgba(255,255,255,0.7); margin: 10px 0; }
        .odds-container { display: flex; justify-content: center; gap: 15px; margin: 15px 0; flex-wrap: wrap; }
        .odd-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,215,0,0.3);
            padding: 12px 24px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
            color: white;
        }
        .odd-btn:hover { background: rgba(255,215,0,0.2); transform: scale(1.05); }
        .odd-btn.selected { background: #ffd700; color: #333; border-color: #ffd700; }
        .bet-btn {
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            color: #333;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            font-size: 16px;
            transition: 0.3s;
        }
        .bet-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(255,215,0,0.4); }
        .loading { text-align: center; padding: 50px; }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            padding: 30px;
            border-radius: 20px;
            max-width: 400px;
            width: 90%;
            text-align: center;
        }
        .modal-content input {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            background: rgba(255,255,255,0.1);
            border: 1px solid #ffd700;
            color: white;
            border-radius: 8px;
            font-size: 16px;
        }
        .modal-buttons { display: flex; gap: 10px; margin-top: 20px; }
        .modal-buttons button { flex: 1; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .confirm-btn { background: #ffd700; color: #333; }
        .cancel-btn { background: rgba(255,68,68,0.8); color: white; }
        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            color: #ffd700;
            text-decoration: none;
        }
        @media (max-width: 768px) { .match-teams { flex-direction: column; gap: 10px; } }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-btn">← Back to Home</a>
        
        <div class="header">
            <h2>⚽ SPORTS BETTING</h2>
            <div class="balance" id="balance">💰 Loading...</div>
        </div>
        
        <div class="tabs">
            <div class="tab active" data-tab="live">🔴 LIVE NOW</div>
            <div class="tab" data-tab="upcoming">📅 UPCOMING</div>
            <div class="tab" data-tab="finished">✅ FINISHED</div>
            <div class="tab" data-tab="my-bets">💰 MY BETS</div>
        </div>
        
        <div id="matches-container" class="matches-grid">
            <div class="loading">🎲 Loading matches...</div>
        </div>
    </div>
    
    <div id="betModal" class="modal">
        <div class="modal-content">
            <h3 id="modalMatchName">Place Your Bet</h3>
            <p>Odds: <strong id="modalOdds" style="color:#ffd700; font-size:24px;">0</strong>x</p>
            <p>Potential Win: <strong id="potentialWin" style="color:#ffd700;">$0</strong></p>
            <input type="number" id="betAmount" placeholder="Enter amount (min $1)" min="1">
            <div class="modal-buttons">
                <button class="confirm-btn" onclick="confirmBet()">✅ Confirm</button>
                <button class="cancel-btn" onclick="closeModal()">❌ Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        
        let currentTab = 'live';
        let currentBalance = 0;
        let currentUserId = null;
        let selectedBet = null;
        
        async function getUserId() {
            const user = auth.currentUser;
            if (!user) {
                window.location.href = '/login';
                return null;
            }
            return user.uid;
        }
        
        async function fetchBalance() {
            const userId = await getUserId();
            if (!userId) return;
            currentUserId = userId;
            
            try {
                const response = await fetch(`/api/user/balance`, { headers: { 'userid': userId } });
                const data = await response.json();
                currentBalance = data.balance;
                document.getElementById('balance').innerHTML = `💰 $${data.balance.toFixed(2)}`;
            } catch(e) {
                document.getElementById('balance').innerHTML = `💰 $1,000`;
            }
        }
        
        async function fetchMatches(type) {
            const userId = await getUserId();
            if (!userId) return;
            
            const container = document.getElementById('matches-container');
            container.innerHTML = '<div class="loading">🎲 Loading matches...</div>';
            
            try {
                let endpoint = '';
                if (type === 'live') endpoint = '/api/matches/live';
                else if (type === 'upcoming') endpoint = '/api/matches/upcoming';
                else if (type === 'finished') endpoint = '/api/matches/finished';
                else if (type === 'my-bets') {
                    await fetchMyBets();
                    return;
                }
                
                const response = await fetch(endpoint);
                const data = await response.json();
                
                if (data.success && data.matches) {
                    displayMatches(data.matches, type);
                } else {
                    container.innerHTML = '<div class="loading">No matches available</div>';
                }
            } catch(error) {
                console.error('Error:', error);
                container.innerHTML = '<div class="loading">❌ Failed to load matches. Make sure server is running.</div>';
            }
        }
        
        function displayMatches(matches, type) {
            const container = document.getElementById('matches-container');
            
            if (!matches || matches.length === 0) {
                container.innerHTML = '<div class="loading">📭 No matches found</div>';
                return;
            }
            
            container.innerHTML = matches.map(match => `
                <div class="match-card">
                    <div class="match-league">🏆 ${match.league?.name || 'International'}</div>
                    <div class="match-teams">
                        <div class="team">${match.localTeam?.name || 'Home'}</div>
                        <div class="vs">VS</div>
                        <div class="team">${match.visitorTeam?.name || 'Away'}</div>
                    </div>
                    ${type === 'live' ? `
                        <div class="match-score">${match.scores?.localteam_score || 0} - ${match.scores?.visitorteam_score || 0}</div>
                        <div class="match-time">⏱️ LIVE - ${match.time?.minute || 0}'</div>
                    ` : type === 'upcoming' ? `
                        <div class="match-time">📅 ${new Date(match.starting_at).toLocaleString()}</div>
                        <div class="odds-container">
                            <button class="odd-btn" onclick="selectBet('${match.id}', '${match.localTeam?.name} vs ${match.visitorTeam?.name}', 'Home Win', 2.10)">🏠 Home Win<br>2.10x</button>
                            <button class="odd-btn" onclick="selectBet('${match.id}', '${match.localTeam?.name} vs ${match.visitorTeam?.name}', 'Draw', 3.20)">🤝 Draw<br>3.20x</button>
                            <button class="odd-btn" onclick="selectBet('${match.id}', '${match.localTeam?.name} vs ${match.visitorTeam?.name}', 'Away Win', 2.80)">✈️ Away Win<br>2.80x</button>
                        </div>
                        <button class="bet-btn" onclick="openBetModal()">💰 Place Bet</button>
                    ` : `
                        <div class="match-score">FINAL: ${match.scores?.localteam_score || 0} - ${match.scores?.visitorteam_score || 0}</div>
                        <div class="match-time">✅ Match Finished</div>
                    `}
                </div>
            `).join('');
        }
        
        async function fetchMyBets() {
            const userId = await getUserId();
            if (!userId) return;
            
            const container = document.getElementById('matches-container');
            container.innerHTML = '<div class="loading">📊 Loading your bets...</div>';
            
            try {
                const response = await fetch(`/api/user/bets`, { headers: { 'userid': userId } });
                const data = await response.json();
                
                if (!data.bets || data.bets.length === 0) {
                    container.innerHTML = '<div class="loading">📭 No bets placed yet. Start betting!</div>';
                    return;
                }
                
                container.innerHTML = data.bets.map(bet => `
                    <div class="match-card">
                        <div class="match-league">🎲 ${bet.matchName}</div>
                        <div class="match-teams">
                            <div class="team">💰 $${bet.amount}</div>
                            <div class="vs">@</div>
                            <div class="team">${bet.odds}x</div>
                        </div>
                        <div class="match-score">Outcome: ${bet.outcome}</div>
                        <div class="match-time">Potential Win: $${bet.potentialWinnings}</div>
                        <div class="match-time">Status: ${bet.status.toUpperCase()}</div>
                        <div class="match-time">📅 ${new Date(bet.createdAt).toLocaleString()}</div>
                    </div>
                `).join('');
            } catch(error) {
                container.innerHTML = '<div class="loading">❌ Failed to load bets</div>';
            }
        }
        
        let currentMatchId, currentMatchName, currentOutcome, currentOdds;
        
        function selectBet(matchId, matchName, outcome, odds) {
            document.querySelectorAll('.odd-btn').forEach(btn => btn.classList.remove('selected'));
            event.target.classList.add('selected');
            currentMatchId = matchId;
            currentMatchName = matchName;
            currentOutcome = outcome;
            currentOdds = odds;
        }
        
        function openBetModal() {
            if (!currentMatchId) {
                alert('Please select an outcome first');
                return;
            }
            document.getElementById('modalMatchName').innerHTML = currentMatchName;
            document.getElementById('modalOdds').innerHTML = currentOdds;
            document.getElementById('betModal').style.display = 'flex';
            document.getElementById('betAmount').value = '';
            updatePotentialWin();
        }
        
        function updatePotentialWin() {
            const amount = parseFloat(document.getElementById('betAmount').value) || 0;
            const potential = amount * currentOdds;
            document.getElementById('potentialWin').innerHTML = `$${potential.toFixed(2)}`;
        }
        
        document.getElementById('betAmount').addEventListener('input', updatePotentialWin);
        
        function closeModal() {
            document.getElementById('betModal').style.display = 'none';
        }
        
        async function confirmBet() {
            const amount = parseFloat(document.getElementById('betAmount').value);
            
            if (!amount || amount < 1) {
                alert('Minimum bet is $1');
                return;
            }
            
            if (amount > currentBalance) {
                alert(`Insufficient balance! You have $${currentBalance}`);
                return;
            }
            
            const userId = await getUserId();
            if (!userId) return;
            
            try {
                const response = await fetch('/api/place-bet', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId, currentMatchId, currentMatchName,
                        amount, outcome: currentOutcome, odds: currentOdds
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    alert(`✅ Bet placed! $${amount} on ${currentMatchName}\nPotential Win: $${(amount * currentOdds).toFixed(2)}`);
                    closeModal();
                    fetchBalance();
                    fetchMatches(currentTab);
                    currentMatchId = null;
                } else {
                    alert('❌ Error: ' + result.error);
                }
            } catch(error) {
                alert('❌ Error placing bet');
            }
        }
        
        // Tab switching
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentTab = tab.dataset.tab;
                fetchMatches(currentTab);
            });
        });
        
        // Auto-refresh live matches
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                await fetchBalance();
                fetchMatches(currentTab);
                setInterval(() => {
                    if (currentTab === 'live') fetchMatches('live');
                    if (currentTab !== 'my-bets') fetchBalance();
                }, 30000);
            }
        });
    </script>
</body>
</html>
