<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Millioner - Sports Betting Platform</title>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* Header */
        .header {
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .logo h1 {
            font-size: 28px;
            background: linear-gradient(135deg, #fff, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .logo p {
            font-size: 12px;
            opacity: 0.8;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .balance {
            background: rgba(255,215,0,0.2);
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: bold;
            border: 1px solid #ffd700;
        }
        
        .logout-btn {
            background: rgba(255,68,68,0.8);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .logout-btn:hover {
            background: #ff4444;
            transform: translateY(-2px);
        }
        
        /* Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .tab {
            padding: 12px 24px;
            background: rgba(0,0,0,0.3);
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.3s;
            font-weight: 500;
        }
        
        .tab:hover {
            background: rgba(255,255,255,0.2);
            transform: translateY(-2px);
        }
        
        .tab.active {
            background: #ffd700;
            color: #333;
            box-shadow: 0 4px 15px rgba(255,215,0,0.3);
        }
        
        /* Match Cards */
        .matches-grid {
            display: grid;
            gap: 20px;
        }
        
        .match-card {
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            transition: all 0.3s;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .match-card:hover {
            transform: translateY(-3px);
            background: rgba(0,0,0,0.4);
            border-color: #ffd700;
        }
        
        .match-league {
            font-size: 12px;
            color: #ffd700;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .match-teams {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        
        .team {
            flex: 1;
            text-align: center;
        }
        
        .vs {
            margin: 0 20px;
            color: #ffd700;
            font-size: 14px;
        }
        
        .match-score {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            margin: 15px 0;
            color: #ffd700;
        }
        
        .match-time {
            text-align: center;
            color: rgba(255,255,255,0.7);
            margin: 10px 0;
            font-size: 14px;
        }
        
        .odds-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 15px 0;
            flex-wrap: wrap;
        }
        
        .odd-button {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,215,0,0.3);
            color: white;
            padding: 12px 24px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            font-size: 14px;
        }
        
        .odd-button:hover {
            background: rgba(255,215,0,0.2);
            transform: scale(1.05);
            border-color: #ffd700;
        }
        
        .bet-button {
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            color: #333;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
            font-weight: bold;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        .bet-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255,215,0,0.4);
        }
        
        .loading {
            text-align: center;
            padding: 50px;
            font-size: 18px;
        }
        
        .error {
            text-align: center;
            padding: 20px;
            background: rgba(255,68,68,0.2);
            border-radius: 10px;
            color: #ff8888;
        }
        
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal-content {
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 30px;
            border-radius: 20px;
            max-width: 400px;
            width: 90%;
            text-align: center;
        }
        
        .modal-content input {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            background: rgba(255,255,255,0.1);
            border: 1px solid #ffd700;
            color: white;
            border-radius: 8px;
            font-size: 16px;
        }
        
        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        .modal-buttons button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .confirm-btn {
            background: #ffd700;
            color: #333;
        }
        
        .cancel-btn {
            background: rgba(255,68,68,0.8);
            color: white;
        }
        
        @media (max-width: 768px) {
            .match-teams {
                flex-direction: column;
                gap: 10px;
            }
            .vs {
                margin: 5px 0;
            }
            .tab {
                padding: 8px 16px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <h1>⚽ Millioner Sports Betting</h1>
                <p>Live Scores & Real-time Odds</p>
            </div>
            <div class="user-info" id="userInfo">
                <div class="balance" id="balance">Loading...</div>
                <button class="logout-btn" onclick="logout()">🚪 Logout</button>
            </div>
        </div>
        
        <div class="tabs">
            <div class="tab active" data-tab="live">🔴 LIVE NOW</div>
            <div class="tab" data-tab="upcoming">📅 UPCOMING</div>
            <div class="tab" data-tab="finished">✅ FINISHED</div>
            <div class="tab" data-tab="my-bets">💰 MY BETS</div>
        </div>
        
        <div id="matches-container" class="matches-grid">
            <div class="loading">🎲 Loading matches...</div>
        </div>
    </div>
    
    <!-- Bet Modal -->
    <div id="betModal" class="modal">
        <div class="modal-content">
            <h3 id="modalMatchName">Place Your Bet</h3>
            <p style="margin: 10px 0;">Odds: <strong id="modalOdds" style="color: #ffd700; font-size: 24px;">0</strong>x</p>
            <p style="margin: 10px 0;">Potential Win: <strong id="potentialWin" style="color: #ffd700;">$0</strong></p>
            <input type="number" id="betAmount" placeholder="Enter amount (min $1)" min="1" step="1">
            <div class="modal-buttons">
                <button class="confirm-btn" onclick="confirmBet()">✅ Confirm Bet</button>
                <button class="cancel-btn" onclick="closeModal()">❌ Cancel</button>
            </div>
        </div>
    </div>

    <script>
        // Your Firebase Configuration (UPDATE WITH YOUR ACTUAL VALUES)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY_HERE",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        
        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        
        let currentTab = 'live';
        let currentBalance = 0;
        let selectedBet = null;
        
        // Get auth token
        async function getAuthToken() {
            const user = auth.currentUser;
            if (!user) {
                window.location.href = '/login.html';
                return null;
            }
            return user.getIdToken();
        }
        
        // Fetch balance
        async function fetchBalance() {
            const token = await getAuthToken();
            if (!token) return;
            
            try {
                const response = await fetch('/api/user/balance', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                if (data.success) {
                    currentBalance = data.balance;
                    document.getElementById('balance').innerHTML = `💰 $${data.balance.toFixed(2)}`;
                }
            } catch (error) {
                console.error('Balance error:', error);
            }
        }
        
        // Fetch matches
        async function fetchMatches(type) {
            const token = await getAuthToken();
            if (!token) return;
            
            const container = document.getElementById('matches-container');
            container.innerHTML = '<div class="loading">🎲 Loading matches...</div>';
            
            try {
                let endpoint = '';
                if (type === 'live') endpoint = '/api/matches/live';
                else if (type === 'upcoming') endpoint = '/api/matches/upcoming';
                else if (type === 'finished') endpoint = '/api/matches/finished';
                else if (type === 'my-bets') {
                    await fetchMyBets();
                    return;
                }
                
                const response = await fetch(endpoint, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (!response.ok) throw new Error('Failed to fetch');
                
                const data = await response.json();
                displayMatches(data.matches, type);
            } catch (error) {
                console.error('Error:', error);
                container.innerHTML = '<div class="error">❌ Failed to load matches. Please refresh the page.</div>';
            }
        }
        
        // Display matches
        function displayMatches(matches, type) {
            const container = document.getElementById('matches-container');
            
            if (!matches || matches.length === 0) {
                container.innerHTML = '<div class="error">📭 No matches found</div>';
                return;
            }
            
            container.innerHTML = matches.map(match => `
                <div class="match-card">
                    <div class="match-league">🏆 ${match.league?.name || 'International Match'}</div>
                    <div class="match-teams">
                        <div class="team">${match.localTeam?.name || 'Home Team'}</div>
                        <div class="vs">VS</div>
                        <div class="team">${match.visitorTeam?.name || 'Away Team'}</div>
                    </div>
                    ${type === 'live' ? `
                        <div class="match-score">
                            ${match.scores?.localteam_score || 0} - ${match.scores?.visitorteam_score || 0}
                        </div>
                        <div class="match-time">⏱️ LIVE - ${match.time?.minute || 0}' minute</div>
                    ` : type === 'upcoming' ? `
                        <div class="match-time">📅 ${new Date(match.starting_at).toLocaleString()}</div>
                        <div class="odds-container">
                            <button class="odd-button" onclick="selectBet('${match.id}', '${match.localTeam?.name} vs ${match.visitorTeam?.name}', 'Home Win', 2.10)">
                                🏠 Home Win<br>2.10x
                            </button>
                            <button class="odd-button" onclick="selectBet('${match.id}', '${match.localTeam?.name} vs ${match.visitorTeam?.name}', 'Draw', 3.20)">
                                🤝 Draw<br>3.20x
                            </button>
                            <button class="odd-button" onclick="selectBet('${match.id}', '${match.localTeam?.name} vs ${match.visitorTeam?.name}', 'Away Win', 2.80)">
                                ✈️ Away Win<br>2.80x
                            </button>
                        </div>
                        <button class="bet-button" onclick="openBetModal()">
                            🎯 Place Bet
                        </button>
                    ` : `
                        <div class="match-score">
                            FINAL: ${match.scores?.localteam_score || 0} - ${match.scores?.visitorteam_score || 0}
                        </div>
                        <div class="match-time">✅ Match Finished</div>
                    `}
                </div>
            `).join('');
        }
        
        // Fetch user's bets
        async function fetchMyBets() {
            const token = await getAuthToken();
            if (!token) return;
            
            const container = document.getElementById('matches-container');
            container.innerHTML = '<div class="loading">📊 Loading your bets...</div>';
            
            try {
                const response = await fetch('/api/user/bets', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                
                if (!data.success || data.bets.length === 0) {
                    container.innerHTML = '<div class="error">📭 No bets placed yet. Start betting now!</div>';
                    return;
                }
                
                container.innerHTML = data.bets.map(bet => `
                    <div class="match-card">
                        <div class="match-league">🎲 Bet ID: ${bet.id.slice(0,8)}...</div>
                        <div class="match-teams">
                            <div class="team">${bet.matchName}</div>
                        </div>
                        <div class="match-score">💰 Amount: $${bet.amount}</div>
                        <div class="match-time">🎯 Outcome: ${bet.outcome}</div>
                        <div class="match-time">📈 Odds: ${bet.odds}x</div>
                        <div class="match-time">💎 Potential: $${bet.potentialWinnings}</div>
                        <div class="match-time">📊 Status: ${bet.status.toUpperCase()}</div>
                        <div class="match-time">📅 ${bet.createdAt?.toDate().toLocaleString()}</div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error:', error);
                container.innerHTML = '<div class="error">❌ Failed to load your bets</div>';
            }
        }
        
        // Bet selection
        let currentMatchId, currentMatchName, currentOutcome, currentOdds;
        
        function selectBet(matchId, matchName, outcome, odds) {
            currentMatchId = matchId;
            currentMatchName = matchName;
            currentOutcome = outcome;
            currentOdds = odds;
            openBetModal();
        }
        
        function openBetModal() {
            if (!currentMatchId) {
                alert('Please select an outcome first');
                return;
            }
            document.getElementById('modalMatchName').innerHTML = currentMatchName;
            document.getElementById('modalOdds').innerHTML = currentOdds;
            document.getElementById('betModal').style.display = 'flex';
            document.getElementById('betAmount').value = '';
            updatePotentialWin();
        }
        
        function updatePotentialWin() {
            const amount = parseFloat(document.getElementById('betAmount').value) || 0;
            const potential = amount * currentOdds;
            document.getElementById('potentialWin').innerHTML = `$${potential.toFixed(2)}`;
        }
        
        document.getElementById('betAmount').addEventListener('input', updatePotentialWin);
        
        function closeModal() {
            document.getElementById('betModal').style.display = 'none';
            currentMatchId = null;
        }
        
        async function confirmBet() {
            const amount = parseFloat(document.getElementById('betAmount').value);
            
            if (!amount || amount < 1) {
                alert('Please enter a valid amount (minimum $1)');
                return;
            }
            
            if (amount > currentBalance) {
                alert(`Insufficient balance! Your balance is $${currentBalance.toFixed(2)}`);
                return;
            }
            
            const token = await getAuthToken();
            if (!token) return;
            
            try {
                const response = await fetch('/api/place-bet', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        matchId: currentMatchId,
                        matchName: currentMatchName,
                        amount: amount,
                        outcome: currentOutcome,
                        odds: currentOdds
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    alert(`✅ Bet Placed Successfully!\n\n💰 Amount: $${amount}\n💎 Potential Win: $${(amount * currentOdds).toFixed(2)}\n📊 New Balance: $${result.newBalance.toFixed(2)}`);
                    closeModal();
                    fetchBalance();
                    fetchMatches(currentTab);
                } else {
                    alert('❌ Error: ' + result.error);
                }
            } catch (error) {
                console.error('Bet error:', error);
                alert('❌ Error placing bet. Please try again.');
            }
        }
        
        // Logout
        async function logout() {
            await auth.signOut();
            window.location.href = '/login.html';
        }
        
        // Tab switching
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentTab = tab.dataset.tab;
                fetchMatches(currentTab);
            });
        });
        
        // Initialize
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                await fetchBalance();
                fetchMatches(currentTab);
                
                // Auto-refresh live matches every 30 seconds
                setInterval(() => {
                    if (currentTab === 'live') {
                        fetchMatches('live');
                    }
                }, 30000);
                
                // Refresh balance every minute
                setInterval(() => {
                    if (currentTab !== 'my-bets') {
                        fetchBalance();
                    }
                }, 60000);
            }
        });
    </script>
</body>
</html>
