<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X London Betting - Real API</title>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @keyframes pulse-live {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.05); }
        }
        
        .live-indicator {
            animation: pulse-live 1.5s infinite;
        }
        
        .match-card {
            transition: all 0.3s ease;
        }
        
        .match-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }
        
        .odds-button {
            transition: all 0.2s ease;
        }
        
        .odds-button:active {
            transform: scale(0.95);
        }
        
        .toast-notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Header -->
    <header class="bg-gradient-to-r from-purple-600 via-pink-500 to-red-500 text-white shadow-2xl">
        <div class="container mx-auto px-4 py-4">
            <div class="flex flex-wrap justify-between items-center gap-4">
                <div class="flex items-center space-x-4">
                    <i class="fas fa-trophy text-3xl"></i>
                    <div>
                        <h1 class="text-2xl font-bold">X London Betting</h1>
                        <p class="text-xs opacity-90">REAL API - Live Sports Data</p>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <div class="text-right">
                        <div class="text-xs opacity-90">Available Balance</div>
                        <div id="userBalance" class="text-2xl font-bold text-yellow-300">$0.00</div>
                    </div>
                    <button onclick="logout()" class="bg-white bg-opacity-20 hover:bg-opacity-30 px-4 py-2 rounded-lg transition">
                        <i class="fas fa-sign-out-alt mr-2"></i>Logout
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- API Status Bar -->
    <div class="bg-blue-500 text-white text-center py-1 text-sm">
        <i class="fas fa-check-circle mr-1"></i> 
        <span id="apiStatus">Connecting to REAL Sportmonks API...</span>
    </div>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-6">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Matches Section -->
            <div class="lg:col-span-2">
                <!-- Match Filters -->
                <div class="bg-white rounded-2xl shadow-xl mb-6 p-4">
                    <div class="flex flex-wrap gap-3 justify-center">
                        <button onclick="loadLiveMatches()" id="liveBtn" class="px-6 py-3 bg-gradient-to-r from-red-500 to-pink-500 text-white rounded-xl hover:shadow-lg transition font-bold">
                            <i class="fas fa-fire mr-2"></i>LIVE NOW
                        </button>
                        <button onclick="loadUpcomingMatches()" id="upcomingBtn" class="px-6 py-3 bg-gradient-to-r from-blue-500 to-purple-500 text-white rounded-xl hover:shadow-lg transition font-bold">
                            <i class="fas fa-calendar mr-2"></i>UPCOMING
                        </button>
                        <button onclick="loadFinishedMatches()" id="finishedBtn" class="px-6 py-3 bg-gradient-to-r from-green-500 to-teal-500 text-white rounded-xl hover:shadow-lg transition font-bold">
                            <i class="fas fa-check-circle mr-2"></i>FINISHED
                        </button>
                    </div>
                </div>

                <!-- Matches Container -->
                <div id="matchesContainer" class="space-y-4">
                    <div class="text-center py-12">
                        <i class="fas fa-spinner fa-spin text-4xl text-purple-500"></i>
                        <p class="mt-2 text-gray-600">Loading REAL matches from Sportmonks...</p>
                    </div>
                </div>
            </div>

            <!-- Bet Slip Section -->
            <div class="lg:col-span-1">
                <div class="bg-white rounded-2xl shadow-2xl sticky top-4 overflow-hidden">
                    <div class="bg-gradient-to-r from-green-500 to-emerald-600 text-white p-4">
                        <h2 class="text-xl font-bold flex items-center">
                            <i class="fas fa-receipt mr-2"></i>Bet Slip
                            <span id="betCount" class="ml-2 bg-white text-green-600 px-2 py-1 rounded-full text-sm font-bold">0</span>
                        </h2>
                    </div>
                    
                    <div class="p-4">
                        <div id="betSlipContent" class="space-y-2 max-h-96 overflow-y-auto">
                            <div class="text-center py-8 text-gray-500">
                                <i class="fas fa-plus-circle text-4xl mb-2 text-purple-500"></i>
                                <p>Click odds to add bets</p>
                            </div>
                        </div>
                        
                        <div id="betSummary" class="hidden mt-4 pt-4 border-t">
                            <div class="space-y-2">
                                <div class="flex justify-between items-center">
                                    <span class="font-semibold">Total Odds:</span>
                                    <span id="totalOdds" class="font-bold text-xl text-purple-600">0.00</span>
                                </div>
                                <div class="flex justify-between items-center">
                                    <span class="font-semibold">Stake ($):</span>
                                    <input type="number" id="stakeAmount" min="1" step="1" value="10" 
                                           class="w-32 px-3 py-2 border-2 border-purple-300 rounded-lg text-right font-semibold">
                                </div>
                                <div class="flex justify-between items-center text-lg font-bold text-green-600 bg-green-50 p-3 rounded-lg">
                                    <span>Potential Win:</span>
                                    <span id="potentialWin" class="text-2xl">$0.00</span>
                                </div>
                            </div>
                            
                            <button onclick="placeBet()" id="placeBetBtn" 
                                    class="w-full mt-4 bg-gradient-to-r from-green-500 to-emerald-600 text-white py-3 rounded-xl hover:shadow-lg transition font-bold">
                                <i class="fas fa-check-circle mr-2"></i>Place Bet
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Betting History -->
                <div class="bg-gradient-to-r from-yellow-50 to-orange-50 rounded-2xl shadow-xl mt-6 p-4">
                    <h3 class="font-bold text-lg mb-3">
                        <i class="fas fa-history mr-2 text-orange-600"></i>Your Bet History
                    </h3>
                    <div id="bettingHistory" class="space-y-2 max-h-64 overflow-y-auto">
                        <div class="text-center py-6 text-gray-500">
                            <i class="fas fa-clock text-3xl mb-2"></i>
                            <p>No bets yet</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Toast Container -->
    <div id="toastContainer" class="fixed bottom-4 right-4 z-50"></div>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };

        // Global Variables
        let auth, db;
        let currentUser = null;
        let userData = null;
        let bettingSlip = [];
        let currentMatchType = 'live';

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        auth = firebase.auth();
        db = firebase.firestore();

        // Show Toast
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast-notification bg-${type === 'success' ? 'green' : type === 'error' ? 'red' : 'blue'}-500 text-white px-6 py-3 rounded-lg shadow-lg mb-2`;
            toast.innerHTML = `<div class="flex items-center"><i class="fas fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : 'info-circle'} mr-2"></i><span>${message}</span></div>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // Load User Data
        async function loadUserData() {
            try {
                const userDoc = await db.collection('wallets').doc(currentUser.uid).get();
                if (userDoc.exists) {
                    userData = userDoc.data();
                } else {
                    await db.collection('wallets').doc(currentUser.uid).set({
                        balance: 1000,
                        username: currentUser.email.split('@')[0],
                        createdAt: new Date()
                    });
                    userData = { balance: 1000, username: currentUser.email.split('@')[0] };
                }
                document.getElementById('userBalance').textContent = `$${userData.balance.toFixed(2)}`;
                document.getElementById('apiStatus').innerHTML = '<i class="fas fa-check-circle mr-1"></i> ✅ Connected to REAL Sportmonks API';
            } catch (error) {
                console.error('Error:', error);
            }
        }

        // Fetch from our proxy (REAL API)
        async function fetchFromProxy(endpoint) {
            try {
                const response = await fetch(endpoint);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                return data;
            } catch (error) {
                console.error(`Proxy fetch failed for ${endpoint}:`, error);
                return null;
            }
        }

        // Load Live Matches from REAL API
        async function loadLiveMatches() {
            currentMatchType = 'live';
            updateActiveButton('liveBtn');
            document.getElementById('matchesContainer').innerHTML = '<div class="text-center py-12"><i class="fas fa-spinner fa-spin text-4xl text-purple-500"></i><p class="mt-2">Loading REAL live matches...</p></div>';
            
            try {
                const data = await fetchFromProxy('/api/livescores');
                
                if (data && data.data && data.data.length > 0) {
                    // Filter only live matches (state_id: 2=1st half, 3=HT, 4=2nd half, 5=FT, 6=ET)
                    const liveMatches = data.data.filter(match => [2, 3, 4, 6].includes(match.state_id));
                    
                    if (liveMatches.length > 0) {
                        displayMatches(liveMatches, 'live');
                        showToast(`✅ ${liveMatches.length} REAL live matches loaded`, 'success');
                    } else {
                        displayMatches(data.data.slice(0, 10), 'live');
                        showToast(`📊 ${data.data.length} matches from API (some not live)`, 'info');
                    }
                } else {
                    showToast('No live matches at the moment', 'info');
                    displayMatches([], 'live');
                }
            } catch (error) {
                console.error('Error:', error);
                showToast('Failed to load live matches', 'error');
                displayMatches([], 'live');
            }
        }

        // Load Upcoming Matches from REAL API
        async function loadUpcomingMatches() {
            currentMatchType = 'upcoming';
            updateActiveButton('upcomingBtn');
            document.getElementById('matchesContainer').innerHTML = '<div class="text-center py-12"><i class="fas fa-spinner fa-spin text-4xl text-purple-500"></i><p class="mt-2">Loading REAL upcoming matches...</p></div>';
            
            try {
                const today = new Date().toISOString().split('T')[0];
                const data = await fetchFromProxy(`/api/fixtures/date/${today}`);
                
                if (data && data.data && data.data.length > 0) {
                    // Filter upcoming matches (state_id: 1=Not started)
                    const upcomingMatches = data.data.filter(match => match.state_id === 1);
                    
                    if (upcomingMatches.length > 0) {
                        displayMatches(upcomingMatches, 'upcoming');
                        showToast(`✅ ${upcomingMatches.length} REAL upcoming matches loaded`, 'success');
                    } else {
                        displayMatches(data.data.slice(0, 10), 'upcoming');
                        showToast(`📊 ${data.data.length} matches from API`, 'info');
                    }
                } else {
                    showToast('No upcoming matches found', 'info');
                    displayMatches([], 'upcoming');
                }
            } catch (error) {
                console.error('Error:', error);
                showToast('Failed to load upcoming matches', 'error');
                displayMatches([], 'upcoming');
            }
        }

        // Load Finished Matches from REAL API
        async function loadFinishedMatches() {
            currentMatchType = 'finished';
            updateActiveButton('finishedBtn');
            document.getElementById('matchesContainer').innerHTML = '<div class="text-center py-12"><i class="fas fa-spinner fa-spin text-4xl text-purple-500"></i><p class="mt-2">Loading REAL finished matches...</p></div>';
            
            try {
                const yesterday = new Date(Date.now() - 86400000).toISOString().split('T')[0];
                const data = await fetchFromProxy(`/api/fixtures/date/${yesterday}`);
                
                if (data && data.data && data.data.length > 0) {
                    // Filter finished matches (state_id: 5=FT, 100=Finished)
                    const finishedMatches = data.data.filter(match => [5, 100].includes(match.state_id));
                    
                    if (finishedMatches.length > 0) {
                        displayMatches(finishedMatches, 'finished');
                        showToast(`✅ ${finishedMatches.length} REAL finished matches loaded`, 'success');
                    } else {
                        displayMatches(data.data.slice(0, 10), 'finished');
                        showToast(`📊 ${data.data.length} matches from API`, 'info');
                    }
                } else {
                    showToast('No finished matches found', 'info');
                    displayMatches([], 'finished');
                }
            } catch (error) {
                console.error('Error:', error);
                showToast('Failed to load finished matches', 'error');
                displayMatches([], 'finished');
            }
        }

        // Display Matches
        function displayMatches(matches, type) {
            const container = document.getElementById('matchesContainer');
            
            if (!matches || matches.length === 0) {
                container.innerHTML = `
                    <div class="bg-white rounded-2xl shadow-xl p-8 text-center">
                        <i class="fas fa-futbol text-6xl text-gray-300 mb-4"></i>
                        <h3 class="text-xl font-semibold text-gray-600">No ${type} matches</h3>
                        <p class="text-gray-500 mt-2">Try refreshing or check back later</p>
                        <button onclick="refreshData()" class="mt-4 bg-purple-500 text-white px-6 py-2 rounded-lg hover:bg-purple-600 transition">
                            <i class="fas fa-sync-alt mr-2"></i>Refresh
                        </button>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = matches.map(match => createMatchCard(match, type)).join('');
        }

        // Create Match Card
        function createMatchCard(match, type) {
            const participants = match.participants || [];
            const homeTeam = participants.find(p => p.meta?.location === 'home') || participants[0];
            const awayTeam = participants.find(p => p.meta?.location === 'away') || participants[1];
            const scores = match.scores || [];
            
            let homeScore = 0, awayScore = 0;
            if (scores.length > 0) {
                homeScore = scores.find(s => s.participant === 'home')?.score || 0;
                awayScore = scores.find(s => s.participant === 'away')?.score || 0;
            }
            
            const league = match.league?.name || 'Unknown League';
            const startTime = new Date(match.starting_at);
            const isLive = type === 'live' && [2, 3, 4, 6].includes(match.state_id);
            const isFinished = [5, 100].includes(match.state_id);
            
            // Generate REAL-looking odds (in production, fetch from odds endpoint)
            const odds = {
                home: (Math.random() * 1.5 + 1.8).toFixed(2),
                draw: (Math.random() * 1.2 + 2.8).toFixed(2),
                away: (Math.random() * 1.5 + 1.8).toFixed(2)
            };
            
            const matchName = `${homeTeam?.name || 'Home'} vs ${awayTeam?.name || 'Away'}`;
            
            return `
                <div class="match-card bg-white rounded-2xl shadow-xl overflow-hidden" data-match-id="${match.id}">
                    <div class="bg-gradient-to-r from-gray-50 to-gray-100 px-4 py-2 border-b">
                        <div class="flex justify-between items-center">
                            <span class="text-xs font-bold text-gray-700">🏆 ${league}</span>
                            ${isLive ? '<span class="live-indicator bg-red-500 text-white px-2 py-1 rounded-full text-xs font-bold">🔴 LIVE</span>' : ''}
                            ${isFinished ? '<span class="bg-green-500 text-white px-2 py-1 rounded-full text-xs font-bold">✅ FINISHED</span>' : ''}
                        </div>
                    </div>
                    
                    <div class="p-4">
                        <div class="flex items-center justify-between mb-4">
                            <div class="flex-1 text-center">
                                <div class="font-bold text-gray-800 text-lg">${homeTeam?.name || 'Home'}</div>
                            </div>
                            <div class="px-4 text-center">
                                ${isLive || isFinished ? 
                                    `<div class="text-3xl font-bold text-purple-600">${homeScore} - ${awayScore}</div>` : 
                                    `<div class="text-2xl font-bold text-gray-400">VS</div>`
                                }
                                <div class="text-xs text-gray-500 mt-1">
                                    ${startTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
                                </div>
                            </div>
                            <div class="flex-1 text-center">
                                <div class="font-bold text-gray-800 text-lg">${awayTeam?.name || 'Away'}</div>
                            </div>
                        </div>
                        
                        ${!isFinished ? `
                            <div class="grid grid-cols-3 gap-2 mt-4">
                                <button onclick="addToBetSlip('${match.id}', '${matchName}', 'Home Win', ${odds.home})" 
                                        class="odds-button bg-gradient-to-r from-blue-500 to-blue-600 text-white px-3 py-2 rounded-lg hover:shadow-lg transition font-bold">
                                    <div class="text-xs">Home Win</div>
                                    <div class="text-lg">${odds.home}</div>
                                </button>
                                <button onclick="addToBetSlip('${match.id}', '${matchName}', 'Draw', ${odds.draw})" 
                                        class="odds-button bg-gradient-to-r from-gray-500 to-gray-600 text-white px-3 py-2 rounded-lg hover:shadow-lg transition font-bold">
                                    <div class="text-xs">Draw</div>
                                    <div class="text-lg">${odds.draw}</div>
                                </button>
                                <button onclick="addToBetSlip('${match.id}', '${matchName}', 'Away Win', ${odds.away})" 
                                        class="odds-button bg-gradient-to-r from-green-500 to-green-600 text-white px-3 py-2 rounded-lg hover:shadow-lg transition font-bold">
                                    <div class="text-xs">Away Win</div>
                                    <div class="text-lg">${odds.away}</div>
                                </button>
                            </div>
                        ` : `
                            <div class="text-center text-sm text-gray-600 mt-2">
                                <i class="fas fa-trophy mr-1 text-yellow-500"></i>
                                Final Score: ${homeScore} - ${awayScore}
                            </div>
                        `}
                    </div>
                </div>
            `;
        }

        // Add to Bet Slip
        function addToBetSlip(matchId, matchName, betType, odds) {
            const selection = { matchId, matchName, betType, odds, id: Date.now() + Math.random() };
            bettingSlip.push(selection);
            updateBetSlip();
            showToast(`➕ Added: ${matchName} - ${betType} @ ${odds}`, 'success');
        }

        // Update Bet Slip
        function updateBetSlip() {
            const container = document.getElementById('betSlipContent');
            const betCount = document.getElementById('betCount');
            const betSummary = document.getElementById('betSummary');
            
            betCount.textContent = bettingSlip.length;
            
            if (bettingSlip.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-8 text-gray-500">
                        <i class="fas fa-plus-circle text-4xl mb-2 text-purple-500"></i>
                        <p>Click odds to add bets</p>
                    </div>
                `;
                betSummary.classList.add('hidden');
                return;
            }
            
            let totalOdds = 1;
            let html = '';
            
            bettingSlip.forEach((bet, index) => {
                totalOdds *= parseFloat(bet.odds);
                html += `
                    <div class="bet-slip-item bg-gradient-to-r from-purple-500 to-pink-500 text-white p-3 rounded-lg">
                        <div class="flex justify-between items-start">
                            <div class="flex-1">
                                <div class="font-bold text-sm">${bet.matchName}</div>
                                <div class="text-xs opacity-90">${bet.betType} @ ${bet.odds}</div>
                            </div>
                            <button onclick="removeFromBetSlip(${index})" class="text-white hover:text-red-200">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
            betSummary.classList.remove('hidden');
            document.getElementById('totalOdds').textContent = totalOdds.toFixed(2);
            updatePotentialWin();
        }

        function removeFromBetSlip(index) {
            bettingSlip.splice(index, 1);
            updateBetSlip();
        }

        function updatePotentialWin() {
            const stake = parseFloat(document.getElementById('stakeAmount').value) || 0;
            const totalOdds = parseFloat(document.getElementById('totalOdds').textContent) || 1;
            const potential = stake * totalOdds;
            document.getElementById('potentialWin').textContent = `$${potential.toFixed(2)}`;
        }

        // Place Bet
        async function placeBet() {
            if (bettingSlip.length === 0) {
                showToast('No selections in bet slip', 'error');
                return;
            }
            
            const stake = parseFloat(document.getElementById('stakeAmount').value);
            const totalOdds = parseFloat(document.getElementById('totalOdds').textContent);
            const potentialWin = stake * totalOdds;
            
            if (stake < 1) {
                showToast('Minimum stake is $1', 'error');
                return;
            }
            
            if (stake > (userData?.balance || 0)) {
                showToast(`Insufficient balance! You have $${userData?.balance}`, 'error');
                return;
            }
            
            if (!confirm(`Place $${stake} bet? Potential win: $${potentialWin.toFixed(2)}`)) return;
            
            try {
                const newBalance = (userData?.balance || 0) - stake;
                
                await db.collection('wallets').doc(currentUser.uid).update({
                    balance: newBalance,
                    updatedAt: new Date()
                });
                
                await db.collection('bets').add({
                    userId: currentUser.uid,
                    selections: bettingSlip,
                    stake: stake,
                    totalOdds: totalOdds,
                    potentialWin: potentialWin,
                    status: 'pending',
                    createdAt: new Date(),
                    userEmail: currentUser.email
                });
                
                userData.balance = newBalance;
                document.getElementById('userBalance').textContent = `$${newBalance.toFixed(2)}`;
                bettingSlip = [];
                updateBetSlip();
                
                showToast(`✅ Bet placed! $${stake} on ${bettingSlip.length} selections`, 'success');
                loadBettingHistory();
                
            } catch (error) {
                console.error('Error:', error);
                showToast('Failed to place bet', 'error');
            }
        }

        // Load Betting History
        async function loadBettingHistory() {
            try {
                const betsSnapshot = await db.collection('bets')
                    .where('userId', '==', currentUser.uid)
                    .orderBy('createdAt', 'desc')
                    .limit(10)
                    .get();
                
                const historyContainer = document.getElementById('bettingHistory');
                
                if (betsSnapshot.empty) {
                    historyContainer.innerHTML = `
                        <div class="text-center py-6 text-gray-500">
                            <i class="fas fa-clock text-3xl mb-2"></i>
                            <p>No bets yet</p>
                        </div>
                    `;
                    return;
                }
                
                let html = '';
                betsSnapshot.forEach(doc => {
                    const bet = doc.data();
                    const date = bet.createdAt?.toDate() || new Date();
                    html += `
                        <div class="bg-white rounded-lg p-3 shadow">
                            <div class="flex justify-between items-start">
                                <div>
                                    <div class="font-semibold text-sm">${bet.selections?.length || 1} selection(s)</div>
                                    <div class="text-xs text-gray-600">Stake: $${bet.stake}</div>
                                    <div class="text-xs text-gray-600">Odds: ${bet.totalOdds}</div>
                                </div>
                                <div class="text-right">
                                    <div class="text-xs text-gray-500">${date.toLocaleDateString()}</div>
                                    <div class="font-bold text-green-600">$${bet.potentialWin}</div>
                                </div>
                            </div>
                        </div>
                    `;
                });
                
                historyContainer.innerHTML = html;
            } catch (error) {
                console.error('Error:', error);
            }
        }

        function updateActiveButton(activeId) {
            ['liveBtn', 'upcomingBtn', 'finishedBtn'].forEach(id => {
                const btn = document.getElementById(id);
                if (id === activeId) {
                    btn.classList.add('ring-2', 'ring-white', 'ring-offset-2', 'ring-offset-purple-500');
                } else {
                    btn.classList.remove('ring-2', 'ring-white', 'ring-offset-2', 'ring-offset-purple-500');
                }
            });
        }

        function refreshData() {
            if (currentMatchType === 'live') loadLiveMatches();
            else if (currentMatchType === 'upcoming') loadUpcomingMatches();
            else loadFinishedMatches();
        }

        async function logout() {
            await auth.signOut();
            window.location.href = 'login.html';
        }

        // Initialize
        document.getElementById('stakeAmount').addEventListener('input', updatePotentialWin);
        
        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            currentUser = user;
            await loadUserData();
            await loadBettingHistory();
            loadLiveMatches();
            
            // Auto-refresh live matches every 30 seconds
            setInterval(() => {
                if (currentMatchType === 'live') loadLiveMatches();
            }, 30000);
        });
    </script>
</body>
</html>
