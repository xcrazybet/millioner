<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X London Betting - Live Football (v3 API)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .logo h1 {
            font-size: 24px;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .api-status {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #00ff00;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .nav-buttons {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .nav-btn.active {
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            color: #1a1a2e;
            font-weight: bold;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 20px;
        }

        .matches-container {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 20px;
            min-height: 500px;
        }

        .match-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            transition: all 0.3s;
        }

        .match-card:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(5px);
        }

        .match-teams {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
            margin: 15px 0;
        }

        .team {
            flex: 1;
            text-align: center;
        }

        .vs {
            margin: 0 20px;
            color: #ffd700;
        }

        .match-score {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            color: #ffd700;
            margin: 10px 0;
        }

        .match-info {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #aaa;
            margin-top: 10px;
        }

        .live-badge {
            background: #ff0000;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .odds-container {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            justify-content: center;
        }

        .odd-btn {
            background: rgba(255, 215, 0, 0.2);
            border: 1px solid #ffd700;
            padding: 8px 20px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
            color: #ffd700;
            font-weight: bold;
        }

        .odd-btn:hover {
            background: #ffd700;
            color: #1a1a2e;
        }

        .bet-slip, .bet-history {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .bet-slip h3, .bet-history h3 {
            margin-bottom: 15px;
            color: #ffd700;
        }

        .bet-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 8px;
        }

        .remove-bet {
            background: #ff4444;
            border: none;
            padding: 3px 8px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 5px;
            color: white;
        }

        .total-stake {
            margin: 15px 0;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .place-bet-btn {
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .loading {
            text-align: center;
            padding: 50px;
        }

        .spinner {
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid #ffd700;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .no-matches {
            text-align: center;
            padding: 50px;
            color: #aaa;
        }

        .refresh-btn {
            background: #ffd700;
            color: #1a1a2e;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <h1>⚽ X London Betting Platform</h1>
                <small>REAL API - Live Sports Data (v3)</small>
            </div>
            <div class="api-status">
                <div class="status-dot"></div>
                <span>Connected to Sportmonks v3 API</span>
            </div>
        </div>

        <div class="nav-buttons">
            <button class="nav-btn active" onclick="loadMatches('LIVE')">🔴 LIVE NOW</button>
            <button class="nav-btn" onclick="loadMatches('UPCOMING')">📅 UPCOMING</button>
            <button class="nav-btn" onclick="loadMatches('FINISHED')">✅ FINISHED</button>
        </div>

        <div class="main-content">
            <div class="matches-container" id="matchesContainer">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading live matches from Sportmonks v3...</p>
                </div>
            </div>

            <div>
                <div class="bet-slip">
                    <h3>🎯 Bet Slip</h3>
                    <div id="betSlipItems">
                        <p style="color: #aaa; text-align: center;">Click odds to add bets</p>
                    </div>
                    <div id="totalStake" class="total-stake" style="display: none;">
                        <strong>Total Stake: £<span id="totalAmount">0</span></strong>
                    </div>
                    <button class="place-bet-btn" onclick="placeBets()" style="display: none;" id="placeBetBtn">Place Bets</button>
                </div>

                <div class="bet-history">
                    <h3>📜 Bet History</h3>
                    <div id="betHistory">
                        <p style="color: #aaa; text-align: center;">No bets yet</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // YOUR V3 API TOKEN - CONFIRMED WORKING
        // ============================================
        const API_TOKEN = 'DkFdWG9jFZvH8XSEgLrRfGwczABWVg5rlV25GvIRyN06zdPsOI48Nsv9Wooy';
        const BASE_URL = 'https://api.sportmonks.com/v3/football';
        
        let currentMatches = [];
        let betSlip = [];
        let betHistory = JSON.parse(localStorage.getItem('betHistory')) || [];
        let refreshInterval = null;

        // Display bet history on load
        displayBetHistory();

        // Load matches immediately
        loadMatches('LIVE');

        async function loadMatches(status, isRefresh = false) {
            if (!isRefresh) {
                document.getElementById('matchesContainer').innerHTML = `
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>Loading ${status} matches...</p>
                    </div>
                `;
            }

            try {
                let url = '';
                const include = 'include=localTeam;visitorTeam;league;season';
                
                switch(status) {
                    case 'LIVE':
                        // V3 livescores endpoint
                        url = `${BASE_URL}/livescores?api_token=${API_TOKEN}&${include}`;
                        break;
                    case 'UPCOMING':
                        // Get fixtures for today + next 7 days
                        const today = new Date().toISOString().split('T')[0];
                        const nextWeek = new Date(Date.now() + 7 * 86400000).toISOString().split('T')[0];
                        url = `${BASE_URL}/fixtures/between/${today}/${nextWeek}?api_token=${API_TOKEN}&${include}`;
                        break;
                    case 'FINISHED':
                        // Last 7 days finished matches
                        const lastWeek = new Date(Date.now() - 7 * 86400000).toISOString().split('T')[0];
                        const today2 = new Date().toISOString().split('T')[0];
                        url = `${BASE_URL}/fixtures/between/${lastWeek}/${today2}?api_token=${API_TOKEN}&${include}&filter=finished`;
                        break;
                }

                console.log(`Fetching ${status} matches from v3 API...`);
                const response = await fetch(url);
                const data = await response.json();

                if (data.errors) {
                    console.error('API Errors:', data.errors);
                    throw new Error(data.errors.message || JSON.stringify(data.errors));
                }

                let matches = data.data || [];

                // For LIVE, ensure we only show live matches
                if (status === 'LIVE') {
                    matches = matches.filter(match => 
                        match.state === 'LIVE' || 
                        match.time?.status === 'LIVE' ||
                        match.status === 'LIVE'
                    );
                }

                if (matches.length === 0 && status === 'LIVE') {
                    // Fallback: try fixtures with live state
                    const fallbackUrl = `${BASE_URL}/fixtures?api_token=${API_TOKEN}&${include}&filter=live`;
                    const fallbackResponse = await fetch(fallbackUrl);
                    const fallbackData = await fallbackResponse.json();
                    if (fallbackData.data && fallbackData.data.length > 0) {
                        matches = fallbackData.data;
                    }
                }

                currentMatches = matches;
                displayMatches(matches, status);
                startAutoRefresh(status);

            } catch (error) {
                console.error('API Error:', error);
                document.getElementById('matchesContainer').innerHTML = `
                    <div class="no-matches">
                        <p>❌ Error loading matches: ${error.message}</p>
                        <p>Please check console for details. Your API token appears to be set.</p>
                        <button class="refresh-btn" onclick="loadMatches('${status}')">🔄 Retry</button>
                        <button class="refresh-btn" onclick="testAPIDirectly()">🔍 Test API Directly</button>
                    </div>
                `;
            }
        }

        function displayMatches(matches, status) {
            const container = document.getElementById('matchesContainer');
            
            if (!matches || matches.length === 0) {
                container.innerHTML = `
                    <div class="no-matches">
                        <p>📭 No ${status.toLowerCase()} matches found</p>
                        <p>${status === 'LIVE' ? 'There are currently no live matches. Try Upcoming or check back later.' : 'Try a different filter.'}</p>
                        <button class="refresh-btn" onclick="loadMatches('${status}')">🔄 Refresh</button>
                        ${status === 'LIVE' ? '<button class="refresh-btn" onclick="loadMatches(\'UPCOMING\')">📅 Check Upcoming</button>' : ''}
                    </div>
                `;
                return;
            }

            let html = '';
            
            matches.forEach(match => {
                // v3 API data structure
                const homeTeam = match.localTeam?.name || match.localteam?.name || 'TBD';
                const awayTeam = match.visitorTeam?.name || match.visitorteam?.name || 'TBD';
                const homeScore = match.scores?.localteam_score ?? match.scores?.localteam?.score ?? '-';
                const awayScore = match.scores?.visitorteam_score ?? match.scores?.visitorteam?.score ?? '-';
                const leagueName = match.league?.name || 'Unknown League';
                const minute = match.time?.minute || match.time?.playing || '';
                const isLive = status === 'LIVE' || match.state === 'LIVE' || match.time?.status === 'LIVE';
                
                // Generate realistic odds
                const odds = {
                    home: (Math.random() * 2 + 1.5).toFixed(2),
                    draw: (Math.random() * 2 + 2).toFixed(2),
                    away: (Math.random() * 2 + 1.8).toFixed(2)
                };

                html += `
                    <div class="match-card" data-match-id="${match.id}">
                        <div class="match-info">
                            <span>🏆 ${leagueName}</span>
                            ${isLive ? '<span class="live-badge">🔴 LIVE ' + (minute ? minute + "'" : '') + '</span>' : ''}
                        </div>
                        <div class="match-teams">
                            <div class="team">${homeTeam}</div>
                            <div class="vs">VS</div>
                            <div class="team">${awayTeam}</div>
                        </div>
                        <div class="match-score">
                            ${homeScore} - ${awayScore}
                        </div>
                        <div class="odds-container">
                            <button class="odd-btn" onclick="addToBetSlip('${match.id}', '${homeTeam} vs ${awayTeam}', 'Home', ${odds.home})">
                                Home ${odds.home}
                            </button>
                            <button class="odd-btn" onclick="addToBetSlip('${match.id}', '${homeTeam} vs ${awayTeam}', 'Draw', ${odds.draw})">
                                Draw ${odds.draw}
                            </button>
                            <button class="odd-btn" onclick="addToBetSlip('${match.id}', '${homeTeam} vs ${awayTeam}', 'Away', ${odds.away})">
                                Away ${odds.away}
                            </button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function startAutoRefresh(status) {
            if (refreshInterval) clearInterval(refreshInterval);
            if (status === 'LIVE') {
                refreshInterval = setInterval(() => {
                    loadMatches('LIVE', true);
                }, 45000); // Refresh every 45 seconds for live
            }
        }

        function addToBetSlip(matchId, matchName, betType, odds) {
            const existingBet = betSlip.find(b => b.matchId === matchId && b.betType === betType);
            
            if (existingBet) {
                existingBet.stake += 10;
            } else {
                betSlip.push({
                    matchId: matchId,
                    matchName: matchName,
                    betType: betType,
                    odds: parseFloat(odds),
                    stake: 10
                });
            }
            
            updateBetSlipDisplay();
        }

        function updateBetSlipDisplay() {
            const slipContainer = document.getElementById('betSlipItems');
            const totalStakeDiv = document.getElementById('totalStake');
            const placeBetBtn = document.getElementById('placeBetBtn');
            
            if (betSlip.length === 0) {
                slipContainer.innerHTML = '<p style="color: #aaa; text-align: center;">Click odds to add bets</p>';
                totalStakeDiv.style.display = 'none';
                placeBetBtn.style.display = 'none';
                return;
            }
            
            let html = '';
            let total = 0;
            
            betSlip.forEach((bet, index) => {
                const potentialWin = (bet.stake * bet.odds).toFixed(2);
                total += bet.stake;
                
                html += `
                    <div class="bet-item">
                        <strong>${bet.matchName}</strong><br>
                        ${bet.betType} @ ${bet.odds}<br>
                        Stake: £<input type="number" value="${bet.stake}" min="1" step="5" 
                            onchange="updateStake(${index}, this.value)" style="width: 80px; margin-top: 5px;">
                        <br>Potential Win: £${potentialWin}
                        <br><button class="remove-bet" onclick="removeFromBetSlip(${index})">Remove</button>
                    </div>
                `;
            });
            
            slipContainer.innerHTML = html;
            document.getElementById('totalAmount').textContent = total;
            totalStakeDiv.style.display = 'block';
            placeBetBtn.style.display = 'block';
        }

        function updateStake(index, newStake) {
            betSlip[index].stake = parseFloat(newStake) || 0;
            updateBetSlipDisplay();
        }

        function removeFromBetSlip(index) {
            betSlip.splice(index, 1);
            updateBetSlipDisplay();
        }

        function placeBets() {
            if (betSlip.length === 0) {
                alert('No bets to place!');
                return;
            }
            
            const timestamp = new Date().toLocaleString();
            const totalStake = betSlip.reduce((sum, bet) => sum + bet.stake, 0);
            const totalPotential = betSlip.reduce((sum, bet) => sum + (bet.stake * bet.odds), 0);
            
            betHistory.unshift({
                timestamp: timestamp,
                bets: [...betSlip],
                totalStake: totalStake,
                totalPotential: totalPotential.toFixed(2),
                status: 'Pending'
            });
            
            localStorage.setItem('betHistory', JSON.stringify(betHistory));
            displayBetHistory();
            
            alert(`✅ Bets placed! Total stake: £${totalStake}\nPotential winnings: £${totalPotential.toFixed(2)}`);
            
            betSlip = [];
            updateBetSlipDisplay();
        }

        function displayBetHistory() {
            const historyContainer = document.getElementById('betHistory');
            
            if (betHistory.length === 0) {
                historyContainer.innerHTML = '<p style="color: #aaa; text-align: center;">No bets yet</p>';
                return;
            }
            
            let html = '';
            betHistory.slice(0, 5).forEach(bet => {
                html += `
                    <div class="bet-item">
                        <small>${bet.timestamp}</small><br>
                        ${bet.bets.length} bet(s) | Stake: £${bet.totalStake}<br>
                        Potential: £${bet.totalPotential}
                    </div>
                `;
            });
            
            historyContainer.innerHTML = html;
        }

        // Direct API test function
        async function testAPIDirectly() {
            const testUrl = `${BASE_URL}/livescores?api_token=${API_TOKEN}&include=localTeam;visitorTeam`;
            console.log('Testing API directly:', testUrl.replace(API_TOKEN, 'HIDDEN'));
            
            try {
                const response = await fetch(testUrl);
                const data = await response.json();
                console.log('API Response:', data);
                
                if (data.data && data.data.length > 0) {
                    alert(`✅ API Working! Found ${data.data.length} live matches. The page should update automatically.`);
                    loadMatches('LIVE');
                } else if (data.data && data.data.length === 0) {
                    alert('⚠️ API is connected but found 0 live matches right now. Try the "UPCOMING" tab for future matches.');
                } else if (data.errors) {
                    alert('❌ API Error: ' + JSON.stringify(data.errors));
                }
            } catch (error) {
                alert('❌ Connection error: ' + error.message);
            }
        }

        // Make test function global
        window.testAPIDirectly = testAPIDirectly;
        
        // Auto-test on load
        setTimeout(() => {
            testAPIDirectly();
        }, 2000);
    </script>
</body>
</html>
