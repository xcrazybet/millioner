<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚽ X London Betting - Football</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0a0f1a 0%, #0f172a 100%);
            color: #ffffff;
            min-height: 100vh;
            padding-bottom: 70px;
        }

        /* Header */
        .header {
            background: rgba(17, 24, 39, 0.95);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #00ff9d;
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
            flex-wrap: wrap;
            gap: 10px;
        }

        .logo {
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo i {
            color: #00ff9d;
            font-size: 24px;
        }

        .logo span {
            background: linear-gradient(45deg, #00ff9d, #ff9800);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .balance-display {
            background: linear-gradient(45deg, #1a2332, #0f172a);
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid #00ff9d;
            color: #00ff9d;
            font-weight: 700;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .balance-display i {
            font-size: 14px;
        }

        /* Navigation Tabs */
        .nav-tabs {
            display: flex;
            background: rgba(17, 24, 39, 0.95);
            padding: 8px 16px;
            gap: 5px;
            position: sticky;
            top: 70px;
            z-index: 999;
            backdrop-filter: blur(10px);
            flex-wrap: wrap;
        }

        .nav-tab {
            flex: 1;
            padding: 10px 8px;
            text-align: center;
            background: transparent;
            border: none;
            color: #a0a8c9;
            font-weight: 600;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.3s;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .nav-tab i {
            font-size: 14px;
        }

        .nav-tab.active {
            background: linear-gradient(135deg, #00ff9d, #00cc7a);
            color: #000;
        }

        .nav-tab:hover:not(.active) {
            background: rgba(0, 255, 157, 0.1);
            color: #00ff9d;
        }

        /* Main Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 16px;
        }

        /* Auto Refresh Bar */
        .refresh-bar {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 10px 16px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .refresh-info {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 13px;
            color: #a0a8c9;
        }

        .refresh-btn {
            background: #ff9800;
            border: none;
            padding: 6px 14px;
            border-radius: 8px;
            color: #000;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s;
        }

        .refresh-btn:hover {
            background: #ffb74d;
            transform: scale(1.02);
        }

        /* Matches Grid */
        .matches-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .match-card {
            background: rgba(17, 24, 39, 0.9);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid rgba(0, 255, 157, 0.15);
            transition: all 0.3s;
            position: relative;
        }

        .match-card:hover {
            transform: translateY(-2px);
            border-color: #00ff9d;
            box-shadow: 0 8px 25px rgba(0, 255, 157, 0.1);
        }

        .match-card.live {
            border: 2px solid #ff4444;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 8px rgba(255, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 68, 68, 0); }
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .league-name {
            font-size: 11px;
            color: #ff9800;
            background: rgba(255, 152, 0, 0.15);
            padding: 4px 10px;
            border-radius: 20px;
        }

        .match-status {
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 600;
        }

        .match-status.live {
            background: #ff4444;
            color: #fff;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .match-status.upcoming {
            background: #ff9800;
            color: #000;
        }

        .match-status.finished {
            background: #666;
            color: #fff;
        }

        .teams {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0;
            text-align: center;
            gap: 10px;
        }

        .team {
            flex: 1;
            font-weight: 700;
            font-size: 14px;
            line-height: 1.3;
        }

        .team i {
            display: block;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .score {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #00ff9d, #ff9800);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            min-width: 70px;
            text-align: center;
        }

        .match-time {
            text-align: center;
            font-size: 11px;
            color: #a0a8c9;
            margin: 10px 0;
        }

        .betting-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .bet-btn {
            flex: 1;
            background: rgba(0, 255, 157, 0.1);
            border: 1px solid #00ff9d;
            padding: 10px 8px;
            border-radius: 10px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            font-size: 13px;
        }

        .bet-btn:hover {
            background: #00ff9d;
            color: #000;
            transform: scale(1.02);
        }

        .bet-odds {
            font-size: 16px;
            font-weight: 800;
            display: block;
            margin-top: 4px;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, #1a2332, #0f172a);
            border-radius: 20px;
            padding: 24px;
            max-width: 400px;
            width: 90%;
            border: 2px solid #00ff9d;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .modal-header h3 {
            color: #00ff9d;
        }

        .close-modal {
            font-size: 28px;
            cursor: pointer;
            color: #ff4444;
            transition: all 0.3s;
        }

        .close-modal:hover {
            transform: scale(1.1);
        }

        .match-info-modal {
            text-align: center;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .bet-options-modal {
            display: flex;
            gap: 10px;
            margin: 20px 0;
        }

        .bet-option-modal {
            flex: 1;
            padding: 12px;
            background: rgba(0, 255, 157, 0.1);
            border: 1px solid #00ff9d;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
        }

        .bet-option-modal.selected {
            background: #00ff9d;
            color: #000;
        }

        .bet-option-modal:hover {
            transform: scale(1.02);
        }

        .bet-amount-input {
            width: 100%;
            padding: 14px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #00ff9d;
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            margin: 15px 0;
        }

        .preset-amounts {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .preset-amounts button {
            flex: 1;
            padding: 8px;
            background: rgba(255, 152, 0, 0.2);
            border: 1px solid #ff9800;
            border-radius: 8px;
            cursor: pointer;
            color: #ff9800;
            font-weight: 600;
            transition: all 0.3s;
        }

        .preset-amounts button:hover {
            background: #ff9800;
            color: #000;
        }

        .odds-summary {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 12px;
            margin: 15px 0;
            text-align: center;
        }

        .confirm-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00ff9d, #00cc7a);
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .confirm-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 20px rgba(0, 255, 157, 0.3);
        }

        /* Loading */
        .loading-spinner {
            text-align: center;
            padding: 40px;
        }

        .loading-spinner i {
            font-size: 40px;
            color: #00ff9d;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .no-matches {
            text-align: center;
            padding: 60px 20px;
            color: #a0a8c9;
        }

        .no-matches i {
            font-size: 50px;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        /* Bottom Navigation */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            background: rgba(17, 24, 39, 0.98);
            padding: 10px 16px;
            border-top: 1px solid rgba(0, 255, 157, 0.2);
            position: fixed;
            bottom: 0;
            width: 100%;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #a0a8c9;
            font-size: 11px;
            gap: 4px;
            transition: all 0.3s;
        }

        .nav-item i {
            font-size: 20px;
        }

        .nav-item.active, .nav-item:hover {
            color: #00ff9d;
        }

        /* Toast */
        .toast-container {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10000;
            width: 90%;
            max-width: 300px;
        }

        .toast {
            padding: 12px 16px;
            background: #1a2332;
            border-radius: 10px;
            margin-bottom: 8px;
            border-left: 4px solid #00ff9d;
            animation: slideIn 0.3s ease;
            font-size: 13px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .toast.error {
            border-left-color: #ff4444;
        }

        .toast.success {
            border-left-color: #00ff9d;
        }

        @keyframes slideIn {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                text-align: center;
            }

            .nav-tabs {
                top: 85px;
            }

            .container {
                padding: 12px;
            }

            .team {
                font-size: 12px;
            }

            .team i {
                font-size: 22px;
            }

            .score {
                font-size: 22px;
                min-width: 55px;
            }

            .bet-btn {
                font-size: 11px;
                padding: 8px 6px;
            }

            .bet-odds {
                font-size: 14px;
            }
        }
    </style>
</head>

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container"></div>

    <script>
        // ===== FIREBASE CONFIGURATION =====
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ===== SPORTMONKS API =====
        const SPORTMONKS_TOKEN = "DkFdWG9jFZvH8XSEgLrRfGwczABWVg5rlV25GvIRyN06zdPsOI48Nsv9Wooy";
        const SPORTMONKS_URL = "https://api.sportmonks.com/v3/football";

        // ===== GLOBAL STATE =====
        let currentUser = null;
        let balance = 0;
        let currentTab = 'live';
        let currentMatch = null;
        let selectedBetType = null;
        let selectedOdds = null;
        let autoRefreshInterval = null;
        let countdown = 30;

        // ===== AUTHENTICATION =====
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                currentUser = user;
                await loadBalance();
                await loadMatches(currentTab);
                startAutoRefresh();
            } else {
                showToast('Please login to continue', 'error');
                setTimeout(() => {
                    window.location.href = 'https://xcrazybet.github.io/millioner/login.html';
                }, 2000);
            }
        });

        // ===== BALANCE MANAGEMENT =====
        async function loadBalance() {
            try {
                const doc = await db.collection("wallets").doc(currentUser.uid).get();
                if (doc.exists) {
                    balance = doc.data().balance || 0;
                    updateBalanceDisplay();
                } else {
                    await db.collection("wallets").doc(currentUser.uid).set({
                        balance: 100,
                        createdAt: new Date(),
                        updatedAt: new Date()
                    });
                    balance = 100;
                    updateBalanceDisplay();
                }
            } catch (error) {
                console.error('Error loading balance:', error);
                showToast('Error loading balance', 'error');
            }
        }

        function updateBalanceDisplay() {
            const balanceElements = document.querySelectorAll('#balanceVal, #walletBalance');
            balanceElements.forEach(el => {
                if (el) el.textContent = balance.toFixed(2);
            });
        }

        // ===== ATOMIC TRANSACTION (SAME PATTERN AS KENO) =====
        async function processTransaction(amount, type, description, betId = null) {
            try {
                const walletRef = db.collection("wallets").doc(currentUser.uid);
                
                return await db.runTransaction(async (transaction) => {
                    const walletDoc = await transaction.get(walletRef);
                    
                    if (!walletDoc.exists) {
                        throw new Error("Wallet not found");
                    }
                    
                    const currentBalance = walletDoc.data().balance || 0;
                    const newBalance = currentBalance + amount;
                    
                    if (newBalance < 0) {
                        throw new Error("Insufficient funds");
                    }
                    
                    transaction.update(walletRef, {
                        balance: newBalance,
                        updatedAt: new Date()
                    });
                    
                    const transactionRef = walletRef.collection("transactions").doc();
                    transaction.set(transactionRef, {
                        type: type,
                        amount: amount,
                        description: description,
                        createdAt: new Date(),
                        betId: betId,
                        beforeBalance: currentBalance,
                        afterBalance: newBalance
                    });
                    
                    balance = newBalance;
                    updateBalanceDisplay();
                    
                    return { success: true, newBalance };
                });
            } catch (error) {
                console.error('Transaction failed:', error);
                showToast(error.message, 'error');
                return { success: false, error: error.message };
            }
        }

        // ===== ADD FUNDS =====
        async function addFunds(amount) {
            if (amount < 1) {
                showToast('Invalid amount', 'error');
                return;
            }
            
            const result = await processTransaction(amount, "deposit", `Added $${amount} to wallet`);
            if (result.success) {
                showToast(`$${amount} added successfully!`, 'success');
                document.getElementById('addFundsModal').classList.remove('show');
            }
        }

        // ===== LOAD MATCHES FROM SPORTMONKS =====
        async function loadMatches(tab) {
            const container = document.getElementById('matchesContainer');
            container.innerHTML = '<div class="loading-spinner"><i class="fas fa-spinner"></i><p>Loading matches...</p></div>';
            
            try {
                let url = '';
                let type = '';
                
                if (tab === 'live') {
                    url = `${SPORTMONKS_URL}/livescores?api_token=${SPORTMONKS_TOKEN}&include=scores;participants`;
                    type = 'live';
                } else if (tab === 'upcoming') {
                    url = `${SPORTMONKS_URL}/fixtures?api_token=${SPORTMONKS_TOKEN}&include=participants&filter=upcoming&per_page=30`;
                    type = 'upcoming';
                } else {
                    url = `${SPORTMONKS_URL}/fixtures?api_token=${SPORTMONKS_TOKEN}&include=participants;scores&filter=finished&per_page=20`;
                    type = 'finished';
                }
                
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.data && data.data.length > 0) {
                    displayMatches(data.data, type);
                } else {
                    container.innerHTML = `
                        <div class="no-matches">
                            <i class="fas fa-futbol"></i>
                            <p>No ${tab} matches at the moment</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error loading matches:', error);
                container.innerHTML = `
                    <div class="no-matches">
                        <i class="fas fa-exclamation-triangle"></i>
                        <p>Error loading matches. Please refresh.</p>
                    </div>
                `;
            }
        }

        // ===== DISPLAY MATCHES =====
        function displayMatches(matches, type) {
            const container = document.getElementById('matchesContainer');
            
            let html = '';
            
            matches.forEach(match => {
                const homeTeam = match.participants?.[0]?.name || 'Home Team';
                const awayTeam = match.participants?.[1]?.name || 'Away Team';
                const homeScore = match.scores?.find(s => s.score_type === 'full_time')?.home_score || 
                                 match.scores?.find(s => s.score_type === 'half_time')?.home_score || 0;
                const awayScore = match.scores?.find(s => s.score_type === 'full_time')?.away_score ||
                                 match.scores?.find(s => s.score_type === 'half_time')?.away_score || 0;
                
                // Generate odds (in production, these come from API)
                const homeOdds = (Math.random() * 2 + 1.8).toFixed(2);
                const drawOdds = (Math.random() * 1.5 + 2.5).toFixed(2);
                const awayOdds = (Math.random() * 2 + 1.8).toFixed(2);
                
                const matchTime = match.time?.starting_at?.date_time ? 
                    new Date(match.time.starting_at.date_time).toLocaleString() : 'Time TBD';
                
                let statusHtml = '';
                if (type === 'live') {
                    statusHtml = '<div class="match-status live"><i class="fas fa-circle"></i> LIVE</div>';
                } else if (type === 'upcoming') {
                    statusHtml = '<div class="match-status upcoming"><i class="fas fa-clock"></i> UPCOMING</div>';
                } else {
                    statusHtml = '<div class="match-status finished"><i class="fas fa-check"></i> FINISHED</div>';
                }
                
                html += `
                    <div class="match-card ${type === 'live' ? 'live' : ''}" 
                         data-match='${JSON.stringify(match)}'
                         data-home-odds="${homeOdds}"
                         data-draw-odds="${drawOdds}"
                         data-away-odds="${awayOdds}">
                        <div class="match-header">
                            <span class="league-name"><i class="fas fa-trophy"></i> ${match.league?.name || 'Football'}</span>
                            ${statusHtml}
                        </div>
                        <div class="teams">
                            <div class="team">
                                <i class="fas fa-shield-alt"></i>
                                ${homeTeam.substring(0, 20)}
                            </div>
                            <div class="score">${type === 'live' || type === 'finished' ? `${homeScore} - ${awayScore}` : 'VS'}</div>
                            <div class="team">
                                <i class="fas fa-shield-alt"></i>
                                ${awayTeam.substring(0, 20)}
                            </div>
                        </div>
                        <div class="match-time">
                            <i class="far fa-calendar-alt"></i> ${matchTime}
                        </div>
                        ${type !== 'finished' ? `
                            <div class="betting-buttons">
                                <button class="bet-btn" data-bet="home" data-odds="${homeOdds}">
                                    🏠 HOME
                                    <span class="bet-odds">${homeOdds}x</span>
                                </button>
                                <button class="bet-btn" data-bet="draw" data-odds="${drawOdds}">
                                    🤝 DRAW
                                    <span class="bet-odds">${drawOdds}x</span>
                                </button>
                                <button class="bet-btn" data-bet="away" data-odds="${awayOdds}">
                                    ✈️ AWAY
                                    <span class="bet-odds">${awayOdds}x</span>
                                </button>
                            </div>
                        ` : ''}
                    </div>
                `;
            });
            
            container.innerHTML = html;
            
            if (type !== 'finished') {
                attachBetEventListeners();
            }
        }

        // ===== ATTACH BET EVENT LISTENERS =====
        function attachBetEventListeners() {
            document.querySelectorAll('.bet-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const matchCard = btn.closest('.match-card');
                    currentMatch = JSON.parse(matchCard.dataset.match);
                    selectedBetType = btn.dataset.bet;
                    selectedOdds = parseFloat(btn.dataset.odds);
                    
                    const homeOdds = matchCard.dataset.homeOdds;
                    const drawOdds = matchCard.dataset.drawOdds;
                    const awayOdds = matchCard.dataset.awayOdds;
                    
                    document.getElementById('modalMatchInfo').innerHTML = `
                        <strong>${currentMatch.participants[0].name}</strong> vs <strong>${currentMatch.participants[1].name}</strong>
                    `;
                    
                    document.getElementById('homeOdds').innerHTML = homeOdds;
                    document.getElementById('drawOdds').innerHTML = drawOdds;
                    document.getElementById('awayOdds').innerHTML = awayOdds;
                    
                    document.getElementById('selectedBetTypeDisplay').innerHTML = selectedBetType.toUpperCase();
                    document.getElementById('selectedOddsDisplay').innerHTML = selectedOdds.toFixed(2);
                    
                    document.querySelectorAll('.bet-option-modal').forEach(opt => {
                        opt.classList.remove('selected');
                        if ((opt.dataset.betType === 'home' && selectedBetType === 'home') ||
                            (opt.dataset.betType === 'draw' && selectedBetType === 'draw') ||
                            (opt.dataset.betType === 'away' && selectedBetType === 'away')) {
                            opt.classList.add('selected');
                        }
                    });
                    
                    document.getElementById('betModal').classList.add('show');
                    updatePotentialWin();
                });
            });
        }

        // ===== UPDATE POTENTIAL WIN =====
        function updatePotentialWin() {
            const amount = parseFloat(document.getElementById('betAmount').value) || 0;
            const potentialWin = amount * selectedOdds;
            document.getElementById('potentialWin').innerHTML = potentialWin.toFixed(2);
        }

        // ===== PLACE BET =====
        async function placeBet() {
            if (!currentUser) {
                showToast('Please login first', 'error');
                return;
            }
            
            const amount = parseFloat(document.getElementById('betAmount').value);
            
            if (!amount || amount < 1) {
                showToast('Minimum bet is $1', 'error');
                return;
            }
            
            if (amount > balance) {
                showToast('Insufficient balance', 'error');
                return;
            }
            
            // Check if match already started
            const matchStartTime = currentMatch.time?.starting_at?.date_time ? 
                new Date(currentMatch.time.starting_at.date_time) : null;
            const now = new Date();
            
            if (matchStartTime && now >= matchStartTime && currentTab !== 'live') {
                showToast('Betting closed - Match already started', 'error');
                return;
            }
            
            const betId = 'bet_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            const potentialWin = amount * selectedOdds;
            
            // Process transaction (deduct amount)
            const transaction = await processTransaction(
                -amount,
                "sports_bet",
                `Bet on ${currentMatch.participants[0].name} vs ${currentMatch.participants[1].name} - ${selectedBetType.toUpperCase()} @ ${selectedOdds}x`,
                betId
            );
            
            if (!transaction.success) {
                return;
            }
            
            // Save bet to Firestore
            const betData = {
                betId: betId,
                userId: currentUser.uid,
                matchId: currentMatch.id,
                matchName: `${currentMatch.participants[0].name} vs ${currentMatch.participants[1].name}`,
                homeTeam: currentMatch.participants[0].name,
                awayTeam: currentMatch.participants[1].name,
                betType: selectedBetType,
                amount: amount,
                odds: selectedOdds,
                potentialWin: potentialWin,
                status: 'active',
                result: null,
                profit: 0,
                placedAt: new Date(),
                matchStartTime: matchStartTime || new Date(),
                settledAt: null
            };
            
            try {
                await db.collection("sports_bets").doc(betId).set(betData);
                showToast(`Bet placed! $${amount} on ${selectedBetType.toUpperCase()} @ ${selectedOdds}x`, 'success');
                
                // Close modal and reset
                document.getElementById('betModal').classList.remove('show');
                document.getElementById('betAmount').value = '10';
                
            } catch (error) {
                console.error('Error saving bet:', error);
                showToast('Error saving bet', 'error');
            }
        }

        // ===== AUTO REFRESH =====
        function startAutoRefresh() {
            if (autoRefreshInterval) clearInterval(autoRefreshInterval);
            
            autoRefreshInterval = setInterval(() => {
                countdown--;
                document.getElementById('countdown').innerHTML = countdown;
                
                if (countdown <= 0) {
                    loadMatches(currentTab);
                    countdown = 30;
                }
            }, 1000);
        }

        // ===== SHOW TOAST =====
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<i class="fas ${type === 'error' ? 'fa-exclamation-circle' : 'fa-check-circle'}"></i> ${message}`;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        // ===== EVENT LISTENERS =====
        function setupEventListeners() {
            // Tab switching
            document.querySelectorAll('.nav-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    currentTab = tab.dataset.tab;
                    loadMatches(currentTab);
                    countdown = 30;
                });
            });
            
            // Refresh button
            document.getElementById('refreshBtn').addEventListener('click', () => {
                loadMatches(currentTab);
                countdown = 30;
            });
            
            // Modal close
            document.querySelector('.close-modal').addEventListener('click', () => {
                document.getElementById('betModal').classList.remove('show');
            });
            
            // Bet amount input
            document.getElementById('betAmount').addEventListener('input', updatePotentialWin);
            
            // Preset amounts
            document.querySelectorAll('[data-amount]').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.getElementById('betAmount').value = btn.dataset.amount;
                    updatePotentialWin();
                });
            });
            
            // Bet option selection in modal
            document.querySelectorAll('.bet-option-modal').forEach(opt => {
                opt.addEventListener('click', () => {
                    selectedBetType = opt.dataset.betType;
                    if (selectedBetType === 'home') selectedOdds = parseFloat(document.getElementById('homeOdds').innerHTML);
                    else if (selectedBetType === 'draw') selectedOdds = parseFloat(document.getElementById('drawOdds').innerHTML);
                    else selectedOdds = parseFloat(document.getElementById('awayOdds').innerHTML);
                    
                    document.getElementById('selectedBetTypeDisplay').innerHTML = selectedBetType.toUpperCase();
                    document.getElementById('selectedOddsDisplay').innerHTML = selectedOdds.toFixed(2);
                    
                    document.querySelectorAll('.bet-option-modal').forEach(o => o.classList.remove('selected'));
                    opt.classList.add('selected');
                    
                    updatePotentialWin();
                });
            });
            
            // Confirm bet
            document.getElementById('confirmBetBtn').addEventListener('click', placeBet);
            
            // Wallet modal
            document.getElementById('walletBtn').addEventListener('click', () => {
                document.getElementById('walletBalance').textContent = balance.toFixed(2);
                document.getElementById('walletModal').classList.add('show');
            });
            
            document.getElementById('closeWalletModal').addEventListener('click', () => {
                document.getElementById('walletModal').classList.remove('show');
            });
            
            // Add funds
            document.getElementById('addFundsBtn').addEventListener('click', () => {
                document.getElementById('walletModal').classList.remove('show');
                document.getElementById('addFundsModal').classList.add('show');
            });
            
            document.getElementById('closeAddFundsModal').addEventListener('click', () => {
                document.getElementById('addFundsModal').classList.remove('show');
            });
            
            document.querySelectorAll('[data-add]').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.getElementById('addAmount').value = btn.dataset.add;
                });
            });
            
            document.getElementById('processAddFunds').addEventListener('click', () => {
                const amount = parseFloat(document.getElementById('addAmount').value);
                if (amount && amount > 0) {
                    addFunds(amount);
                } else {
                    showToast('Enter valid amount', 'error');
                }
            });
            
            // Withdraw button
            document.getElementById('withdrawBtn').addEventListener('click', () => {
                showToast('Withdrawal requests: Contact support', 'info');
            });
            
            // Close modals on background click
            window.addEventListener('click', (e) => {
                if (e.target.classList.contains('modal')) {
                    e.target.classList.remove('show');
                }
            });
        }

        // ===== INITIALIZE =====
        setupEventListeners();
    </script>
</body>
</html>
