<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Millioner - Bet Storage with Live Football Data</title>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { 
            getFirestore, 
            doc, 
            getDoc 
        } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962",
            measurementId: "G-PTV4XMYQ6P"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        class EnhancedBetStorage {
            constructor() {
                this.currentUser = null;
                this.currentTab = 'create';
                this.footballData = null;
                this.liveMatches = [];
                this.upcomingMatches = [];
                this.lastDataUpdate = null;
                this.dataFreshness = 'unknown';
                this.init();
            }

            async init() {
                // Load user
                this.loadUser();
                
                // Initialize UI
                this.updateFootballBanner();
                this.setupEventListeners();
                
                // Load initial football data
                await this.loadFootballData();
                
                // Load bet lists
                this.loadBetLists();
                
                // Auto-refresh football data every 60 seconds
                setInterval(() => this.refreshFootballData(), 60000);
                
                // Auto-update UI every 10 seconds
                setInterval(() => this.updateUI(), 10000);
                
                // Check data freshness every 30 seconds
                setInterval(() => this.checkDataFreshness(), 30000);
            }

            async loadFootballData() {
                try {
                    // Try Firebase first
                    const firebaseData = await this.fetchFromFirebase();
                    if (firebaseData.success) {
                        this.footballData = firebaseData.data;
                        this.processFootballData();
                        return;
                    }
                } catch (error) {
                    console.log('Firebase fetch failed:', error.message);
                }

                // Try static JSON backup
                try {
                    const staticData = await this.fetchFromStatic();
                    if (staticData.success) {
                        this.footballData = staticData.data;
                        this.processFootballData();
                        return;
                    }
                } catch (error) {
                    console.log('Static fetch failed:', error.message);
                }

                // Use sample data as last resort
                this.footballData = this.getSampleData();
                this.processFootballData();
            }

            async fetchFromFirebase() {
                try {
                    const docRef = doc(db, 'games', 'current');
                    const docSnap = await getDoc(docRef);
                    
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        const age = Date.now() - new Date(data.last_updated).getTime();
                        
                        return {
                            success: true,
                            data: data,
                            source: 'firebase',
                            age_minutes: Math.floor(age / 60000)
                        };
                    } else {
                        throw new Error('No data in Firebase');
                    }
                } catch (error) {
                    throw error;
                }
            }

            async fetchFromStatic() {
                try {
                    const response = await fetch('matches.json');
                    if (!response.ok) throw new Error('Static file not found');
                    
                    const data = await response.json();
                    const age = Date.now() - new Date(data.saved_at).getTime();
                    
                    return {
                        success: true,
                        data: data.data,
                        source: 'static_json',
                        age_minutes: Math.floor(age / 60000)
                    };
                } catch (error) {
                    throw error;
                }
            }

            processFootballData() {
                if (!this.footballData) return;
                
                this.liveMatches = this.footballData.live_matches || [];
                this.upcomingMatches = this.footballData.fixtures || [];
                this.lastDataUpdate = this.footballData.last_updated;
                
                // Calculate freshness
                if (this.lastDataUpdate) {
                    const age = Date.now() - new Date(this.lastDataUpdate).getTime();
                    const ageMinutes = Math.floor(age / 60000);
                    
                    if (ageMinutes < 5) this.dataFreshness = 'very_fresh';
                    else if (ageMinutes < 15) this.dataFreshness = 'fresh';
                    else if (ageMinutes < 60) this.dataFreshness = 'acceptable';
                    else this.dataFreshness = 'stale';
                }
                
                this.updateFootballBanner();
                this.updateMatchSelectors();
            }

            // ... [Rest of the BetStorage class remains similar to before, 
            // but enhanced with football data integration]
            // Note: Due to length, I'm showing key integrations only

            async showFootballMatches() {
                // Use actual football data instead of sample
                this.renderFootballMatches(this.liveMatches.concat(this.upcomingMatches));
                this.showFootballModal();
            }

            renderFootballMatches(matches) {
                const container = document.getElementById('matchesList');
                if (!container) return;
                
                if (!matches || matches.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state" style="padding: 2rem;">
                            <div class="empty-state-icon">⚽</div>
                            <h3>No matches found</h3>
                            <p>Football data is not available or being updated.</p>
                            <div style="margin-top: 1rem;">
                                <button onclick="refreshFootballData()" class="btn btn-football">
                                    🔄 Refresh Data
                                </button>
                                <button onclick="window.open('collector.html', '_blank')" class="btn btn-primary">
                                    🚀 Run Collector
                                </button>
                            </div>
                        </div>
                    `;
                    return;
                }
                
                // Sort by: LIVE first, then UPCOMING, then FINISHED
                const sortedMatches = [...matches].sort((a, b) => {
                    const statusOrder = { 'LIVE': 0, 'UPCOMING': 1, 'FINISHED': 2 };
                    return (statusOrder[a.status] || 3) - (statusOrder[b.status] || 3);
                });
                
                container.innerHTML = sortedMatches.slice(0, 50).map(match => `
                    <div class="match-option" data-match-id="${match.id}" onclick="toggleMatchSelection('${match.id}')">
                        <div class="match-info">
                            <div class="match-teams">
                                ${match.home_team} vs ${match.away_team}
                                ${match.status === 'LIVE' ? ' ⚡' : ''}
                            </div>
                            <div class="match-meta">
                                <span>${match.league}</span>
                                <span>${match.country}</span>
                                <span class="status-badge ${match.status.toLowerCase()}">${match.status}</span>
                            </div>
                        </div>
                        <div class="match-score">${match.score || '0-0'}</div>
                        <div class="match-time">
                            ${this.formatMatchTime(match.start_time, match.status)}
                        </div>
                    </div>
                `).join('');
            }

            addFootballBetItems(matchIds) {
                const allMatches = this.liveMatches.concat(this.upcomingMatches);
                
                matchIds.forEach(matchId => {
                    const match = allMatches.find(m => m.id === matchId);
                    if (match) {
                        this.addBetItem({
                            description: `${match.home_team} vs ${match.away_team}`,
                            subdescription: `${match.league} • ${match.country}`,
                            amount: '10.00',
                            status: match.status === 'LIVE' ? 'live' : 
                                   match.status === 'FINISHED' ? 'won' : 'pending',
                            matchData: {
                                id: match.id,
                                home_team: match.home_team,
                                away_team: match.away_team,
                                league: match.league,
                                country: match.country,
                                status: match.status,
                                score: match.score,
                                minute: match.minute,
                                timestamp: match.timestamp,
                                source: match.source
                            }
                        });
                    }
                });
                
                this.selectedMatches.clear();
                this.hideFootballModal();
            }

            formatMatchTime(timestamp, status) {
                if (!timestamp) return '';
                
                if (status === 'LIVE') return 'LIVE';
                if (status === 'FINISHED') return 'FT';
                
                try {
                    const date = new Date(timestamp);
                    return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                } catch (e) {
                    return '';
                }
            }

            updateFootballBanner() {
                if (!this.footballData) return;
                
                const liveCount = this.liveMatches.length;
                const totalCount = this.liveMatches.length + this.upcomingMatches.length;
                const lastUpdate = this.lastDataUpdate;
                
                // Update banner elements
                const bannerLive = document.getElementById('bannerLiveMatches');
                const bannerTotal = document.getElementById('bannerTotalMatches');
                const bannerUpdate = document.getElementById('bannerLastUpdate');
                const apiStatus = document.getElementById('apiStatus');
                const apiStatusText = document.getElementById('apiStatusText');
                
                if (bannerLive) bannerLive.textContent = liveCount;
                if (bannerTotal) bannerTotal.textContent = totalCount;
                if (bannerUpdate && lastUpdate) {
                    const date = new Date(lastUpdate);
                    bannerUpdate.textContent = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                }
                
                if (apiStatus) {
                    const isFresh = this.dataFreshness === 'very_fresh' || this.dataFreshness === 'fresh';
                    apiStatus.className = `status-indicator ${isFresh ? 'status-online' : 'status-offline'}`;
                }
                
                if (apiStatusText) {
                    apiStatusText.textContent = this.dataFreshness === 'very_fresh' ? 'Live' :
                                               this.dataFreshness === 'fresh' ? 'Recent' :
                                               this.dataFreshness === 'acceptable' ? 'Updated' : 'Stale';
                }
            }

            async refreshFootballData() {
                try {
                    await this.loadFootballData();
                    
                    // Update match selectors if modal is open
                    const modal = document.getElementById('footballModal');
                    if (modal && modal.classList.contains('active')) {
                        this.renderFootballMatches(this.liveMatches.concat(this.upcomingMatches));
                    }
                    
                    // Show notification
                    this.showNotification(`Football data refreshed: ${this.liveMatches.length} live matches`);
                    
                } catch (error) {
                    console.error('Refresh failed:', error);
                }
            }

            checkDataFreshness() {
                if (!this.lastDataUpdate) return;
                
                const age = Date.now() - new Date(this.lastDataUpdate).getTime();
                const ageMinutes = Math.floor(age / 60000);
                
                if (ageMinutes > 30) {
                    // Data is stale, show warning
                    this.showWarning('Football data is getting stale. Consider refreshing.');
                }
                
                if (ageMinutes > 120) {
                    // Data is very stale
                    this.showWarning('Football data is very old. The collector may not be running.');
                }
            }

            showNotification(message, type = 'info') {
                // Create notification element
                const notification = document.createElement('div');
                notification.className = `notification notification-${type}`;
                notification.innerHTML = `
                    <div>${message}</div>
                    <button onclick="this.parentElement.remove()">×</button>
                `;
                
                // Add styles if not already present
                if (!document.querySelector('#notification-styles')) {
                    const styles = document.createElement('style');
                    styles.id = 'notification-styles';
                    styles.textContent = `
                        .notification {
                            position: fixed;
                            bottom: 20px;
                            left: 50%;
                            transform: translateX(-50%);
                            background: #1e293b;
                            color: white;
                            padding: 12px 20px;
                            border-radius: 8px;
                            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
                            display: flex;
                            align-items: center;
                            gap: 15px;
                            z-index: 10000;
                            border: 1px solid;
                            min-width: 300px;
                            max-width: 500px;
                        }
                        
                        .notification-info {
                            border-color: #3b82f6;
                            background: rgba(59, 130, 246, 0.1);
                        }
                        
                        .notification-success {
                            border-color: #10b981;
                            background: rgba(16, 185, 129, 0.1);
                        }
                        
                        .notification-warning {
                            border-color: #f59e0b;
                            background: rgba(245, 158, 11, 0.1);
                        }
                        
                        .notification button {
                            background: none;
                            border: none;
                            color: white;
                            font-size: 20px;
                            cursor: pointer;
                            padding: 0;
                            margin-left: auto;
                        }
                        
                        .notification button:hover {
                            color: #ef4444;
                        }
                    `;
                    document.head.appendChild(styles);
                }
                
                document.body.appendChild(notification);
                
                // Auto-remove after 5 seconds
                setTimeout(() => {
                    if (notification.parentElement) {
                        notification.remove();
                    }
                }, 5000);
            }

            showWarning(message) {
                this.showNotification(`⚠️ ${message}`, 'warning');
            }

            getSampleData() {
                const now = new Date();
                return {
                    live_matches: [
                        {
                            id: 'sample_1',
                            home_team: 'Manchester United',
                            away_team: 'Liverpool',
                            home_score: '2',
                            away_score: '1',
                            score: '2-1',
                            minute: '67\'',
                            league: 'Premier League',
                            country: 'England',
                            status: 'LIVE',
                            source: 'sample',
                            timestamp: now.toISOString()
                        }
                    ],
                    fixtures: [
                        {
                            id: 'sample_2',
                            home_team: 'Barcelona',
                            away_team: 'Real Madrid',
                            home_score: '0',
                            away_score: '0',
                            score: '0-0',
                            minute: 'NS',
                            league: 'La Liga',
                            country: 'Spain',
                            status: 'UPCOMING',
                            source: 'sample',
                            timestamp: new Date(now.getTime() + 3600000).toISOString()
                        }
                    ],
                    last_updated: now.toISOString()
                };
            }

            // Setup event listeners
            setupEventListeners() {
                // Add data freshness indicator to football banner
                const footballBanner = document.querySelector('.football-banner');
                if (footballBanner) {
                    const freshnessIndicator = document.createElement('div');
                    freshnessIndicator.id = 'freshness-indicator';
                    freshnessIndicator.style.cssText = `
                        font-size: 11px;
                        margin-top: 5px;
                        display: flex;
                        align-items: center;
                        gap: 5px;
                    `;
                    footballBanner.appendChild(freshnessIndicator);
                }
                
                // Update freshness indicator periodically
                setInterval(() => this.updateFreshnessIndicator(), 10000);
            }

            updateFreshnessIndicator() {
                const indicator = document.getElementById('freshness-indicator');
                if (!indicator || !this.lastDataUpdate) return;
                
                const age = Date.now() - new Date(this.lastDataUpdate).getTime();
                const ageSeconds = Math.floor(age / 1000);
                const ageMinutes = Math.floor(ageSeconds / 60);
                
                let text = '';
                let color = '#94a3b8';
                
                if (ageSeconds < 60) {
                    text = `Updated ${ageSeconds}s ago`;
                    color = '#4ade80';
                } else if (ageMinutes < 5) {
                    text = `Updated ${ageMinutes}m ago`;
                    color = '#60a5fa';
                } else if (ageMinutes < 15) {
                    text = `Updated ${ageMinutes}m ago`;
                    color = '#fbbf24';
                } else {
                    text = `Updated ${ageMinutes}m ago`;
                    color = '#ef4444';
                }
                
                indicator.innerHTML = `
                    <span style="width: 8px; height: 8px; border-radius: 50%; background: ${color};"></span>
                    <span>${text}</span>
                `;
            }

            // Make methods available globally
            makeGlobal() {
                window.betStorage = this;
                window.refreshFootballData = () => this.refreshFootballData();
                window.showFootballMatches = () => this.showFootballMatches();
                window.toggleMatchSelection = (matchId) => this.toggleMatchSelection(matchId);
                window.addSelectedMatches = () => this.addSelectedMatches();
                window.filterMatches = (query) => this.filterMatches(query);
                window.filterMatchesByStatus = () => this.filterMatchesByStatus();
            }
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            const betStorage = new EnhancedBetStorage();
            betStorage.makeGlobal();
        });
    </script>
