            updateDataBanner() {
                const liveCount = this.liveMatches.length;

                if (banner) {
                    banner.textContent = `${liveCount} live matches • ${predictionCount} predictions • Updated ${this.formatTimeAgo(this.lastDataUpdate)}`;
                }
            }

            formatTimeAgo(timestamp) {
                if (!timestamp) return 'just now';
                
                const now = new Date();
                const past = new Date(timestamp);
                const diff = Math.floor((now - past) / 1000);
                
                if (diff < 60) return `${diff}s ago`;
                if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
                if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
                return `${Math.floor(diff / 86400)}d ago`;
            }

                try {

            updateLiveData() {
                // Update live match data
                this.liveMatches.forEach(match => {
                    if (match.status === 'LIVE') {
                        // Simulate live updates
                        const minutes = parseInt(match.minute) || 0;
                        if (minutes < 90 && Math.random() > 0.7) {
                            match.minute = (minutes + 1) + "'";
                            
                            // Random events
                            if (Math.random() > 0.9) {
                                const team = Math.random() > 0.5 ? 'home' : 'away';
                                if (team === 'home') {
                                    match.home_score = (parseInt(match.home_score) + 1).toString();
                                } else {
                                    match.away_score = (parseInt(match.away_score) + 1).toString();
                                }
                                match.score = `${match.home_score}-${match.away_score}`;
                                
                                this.showNotification(`⚽ GOAL! ${match[team + '_team']} scores!`, 'info');
                            }
                        } else if (minutes >= 90) {
                            match.status = 'FINISHED';
                            match.minute = 'FT';
                        }
                    }
                });
                
                // Update bet statuses
                this.updateBetStatuses();
            }

            updateBetStatuses() {
                this.userBets.forEach(bet => {
                    if (bet.matchData && bet.matchData.status === 'LIVE' && bet.status === 'pending') {
                        bet.status = 'live';
                    } else if (bet.matchData && bet.matchData.status === 'FINISHED' && bet.status === 'live') {
                        // Determine win/loss based on prediction
                        bet.status = this.determineBetResult(bet);
                    }
                });
                
                this.calculateStatistics();
                this.renderBetList();
            }

            determineBetResult(bet) {
                if (!bet.matchData || !bet.prediction) return 'lost';
                
                const match = this.liveMatches.find(m => m.id === bet.matchData.id) || 
                             this.upcomingMatches.find(m => m.id === bet.matchData.id);
                
                if (!match || match.status !== 'FINISHED') return 'pending';
                
                // Simple result determination
                const [homeScore, awayScore] = match.score.split('-').map(Number);
                let result = 'draw';
                
                if (homeScore > awayScore) result = 'home';
                else if (awayScore > homeScore) result = 'away';
                
                // Check if prediction was correct
                const predicted = bet.prediction.recommendation.toLowerCase();
                if (predicted.includes(result) || (result === 'draw' && predicted.includes('draw'))) {
                    bet.predictionResult = 'correct';
                    return 'won';
                } else {
                    bet.predictionResult = 'incorrect';
                    return 'lost';
                }
            }

            identifyBestValueBets() {
                const valueBets = [];
                
                this.oddsData.forEach(odds => {
                    if (odds.value_bets && odds.value_bets.length > 0) {
                        const match = this.liveMatches.find(m => m.id === odds.match_id) ||
                                     this.upcomingMatches.find(m => m.id === odds.match_id);
                        
                        if (match) {
                            odds.value_bets.forEach(valueBet => {
                                valueBets.push({
                                    match_id: odds.match_id,
                                    home_team: odds.home_team,
                                    away_team: odds.away_team,
                                    market: valueBet.market,
                                    value: valueBet.value,
                                    odds: valueBet.odds,
                                    confidence: match.prediction?.confidence || '70',
                                    league: match.league
                                });
                            });
                        }
                    }
                });
                
                // Sort by value (positive first)
                return valueBets.sort((a, b) => {
                    const aVal = parseFloat(a.value);
                    const bVal = parseFloat(b.value);
                    return bVal - aVal;
                }).slice(0, 10);
            }

            addBetFromValue(matchId, market) {
                const match = this.liveMatches.find(m => m.id === matchId) ||
                             this.upcomingMatches.find(m => m.id === matchId);
                
                if (!match) return;
                
                const odds = this.oddsData.find(o => o.match_id === matchId);
                const prediction = this.predictions.find(p => p.match_id === matchId);
                
                const bet = {
                    id: 'bet_' + Date.now(),
                    description: `${match.home_team} vs ${match.away_team}`,
                    subdescription: `${match.league} • ${market.replace('_', ' ').toUpperCase()}`,
                    amount: '10.00',
                    status: match.status === 'LIVE' ? 'live' : 'pending',
                    timestamp: new Date().toISOString(),
                    matchData: {
                        id: match.id,
                        home_team: match.home_team,
                        away_team: match.away_team,
                        league: match.league,
                        country: match.country,
                        status: match.status,
                        score: match.score,
                        minute: match.minute
                    },
                    odds: odds?.odds || { home: '2.00', draw: '3.50', away: '3.00' },
                    prediction: prediction?.suggested_bet || {
                        recommendation: 'No prediction',
                        confidence: '50',
                        stake: 'Low'
                    },
                    market: market,
                    potential_win: (10.00 * parseFloat(odds?.odds?.home || 2.00)).toFixed(2)
                };
                
                this.userBets.push(bet);
                this.saveUserBets();
                this.calculateStatistics();
                this.renderBetList();
                
                this.showNotification(`✅ Bet added: ${match.home_team} vs ${match.away_team}`, 'success');
            }

            calculateStatistics() {
                this.betStatistics = {
                    totalBets: this.userBets.length,
                    wonBets: this.userBets.filter(b => b.status === 'won').length,
                    lostBets: this.userBets.filter(b => b.status === 'lost').length,
                    pendingBets: this.userBets.filter(b => b.status === 'pending' || b.status === 'live').length,
                    totalStake: this.userBets.reduce((sum, bet) => sum + parseFloat(bet.amount || 0), 0),
                    totalWinnings: this.userBets
                        .filter(b => b.status === 'won')
                        .reduce((sum, bet) => sum + (parseFloat(bet.amount || 0) * 2), 0),
                    profitLoss: 0
                };
                
                this.betStatistics.profitLoss = 
                    this.betStatistics.totalWinnings - this.betStatistics.totalStake;
                
                this.updateStatisticsUI();
            }

            showNotification(message, type = 'info') {
                // Create notification element
                const notification = document.createElement('div');
                notification.className = `notification notification-${type}`;
                notification.innerHTML = `
                    <div>${message}</div>
                    <button onclick="this.parentElement.remove()">×</button>
                `;
                
                document.body.appendChild(notification);
                
                // Auto-remove after 5 seconds
                setTimeout(() => {
                    if (notification.parentElement) {
                        notification.remove();
                    }
                }, 5000);
            }

            loadUser() {
                const userId = localStorage.getItem('bet_user_id');
                if (!userId) {
                    this.currentUser = {
                        id: 'user_' + Date.now(),
                        name: 'Better',
                        join_date: new Date().toISOString()
                    };
                    localStorage.setItem('bet_user_id', this.currentUser.id);
                } else {
                    this.currentUser = {
                        id: userId,
                        name: 'Better',
                        join_date: localStorage.getItem('bet_join_date') || new Date().toISOString()
                    };
                }
            }

            loadUserBets() {
                try {
                    const savedBets = localStorage.getItem('user_bets_' + this.currentUser.id);
                    if (savedBets) {
                        this.userBets = JSON.parse(savedBets);
                        this.renderBetList();
                    }
                } catch (error) {
                    console.error('Failed to load bets:', error);
                    this.userBets = [];
                }
            }

            saveUserBets() {
                try {
                    localStorage.setItem('user_bets_' + this.currentUser.id, JSON.stringify(this.userBets));
                } catch (error) {
                    console.error('Failed to save bets:', error);
                }
            }

            renderBetList() {
                const container = document.getElementById('betList');
                if (!container) return;
                
                if (this.userBets.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">🎯</div>
                            <h3>No bets placed yet</h3>

                            </button>
                        </div>
                    `;
                    return;
                }
                
                container.innerHTML = this.userBets.map(bet => `
                    <div class="bet-item ${bet.prediction ? 'bet-with-prediction' : ''}">
                        <div class="bet-header">
                            <div class="bet-description">
                                <strong>${bet.description}</strong>
                                ${bet.predictionResult ? `
                                    <span class="prediction-result prediction-${bet.predictionResult}">
                                        ${bet.predictionResult.toUpperCase()}

                                ` : ''}
                            </div>
                            <div class="bet-status status-${bet.status}">${bet.status.toUpperCase()}</div>
                        </div>
                        
                        <div class="bet-details">
                            <div class="bet-info">
                                <div>${bet.subdescription}</div>
                                <div>Amount: €${bet.amount}</div>
                                ${bet.potential_win ? `<div>Potential Win: €${bet.potential_win}</div>` : ''}
                            </div>
                            
                            ${bet.prediction ? `
                                <div class="bet-prediction">
                                    <div class="prediction-info">
                                        <strong>AI Prediction:</strong> ${bet.prediction.recommendation}
                                    </div>
                                    <div class="prediction-confidence">
                                        Confidence: ${bet.prediction.confidence}%
                                    </div>
                                </div>
                            ` : ''}
                            
                            ${bet.matchData?.status === 'LIVE' ? `
                                <div class="live-match-info">
                                    <div class="live-score">${bet.matchData.score}</div>
                                    <div class="live-minute">${bet.matchData.minute}</div>
                                </div>
                            ` : ''}
                        </div>
                        
                        <div class="bet-timestamp">
                            ${new Date(bet.timestamp).toLocaleString()}
                            ${bet.matchData?.status === 'FINISHED' ? '• Match Finished' : ''}
                        </div>
                    </div>
                `).join('');
            }

            // ... (Rest of the original bet storage methods with enhancements)
