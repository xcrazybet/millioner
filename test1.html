<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚽ XCrazyBet - Football Betting</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: #0a0f1a;
            color: white;
            min-height: 100vh;
        }

        /* Header */
        .header {
            background: #111827;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #00ff9d;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            color: #00ff9d;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .balance-display {
            background: #1a2332;
            padding: 10px 20px;
            border-radius: 30px;
            border: 1px solid #00ff9d;
            color: #00ff9d;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Main Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* League Filter */
        .league-filter {
            background: #111827;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #ff9800;
        }

        .filter-title {
            color: #ff9800;
            margin-bottom: 15px;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .league-buttons {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
        }

        .league-btn {
            padding: 10px 20px;
            background: #1a2332;
            border: 1px solid #00ff9d;
            border-radius: 25px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s;
        }

        .league-btn:hover {
            background: #00ff9d;
            color: #000;
        }

        .league-btn.active {
            background: #00ff9d;
            color: #000;
        }

        /* Matches Grid */
        .matches-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }

        .match-card {
            background: #111827;
            border-radius: 15px;
            padding: 20px;
            border: 1px solid #ff9800;
            transition: all 0.3s;
        }

        .match-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,255,157,0.1);
        }

        .match-card.live {
            border-left: 4px solid #ff4757;
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }

        .league-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .league-logo {
            width: 24px;
            height: 24px;
            object-fit: contain;
        }

        .league-name {
            font-size: 13px;
            color: #a0a8c9;
        }

        .match-time {
            font-size: 12px;
            padding: 4px 8px;
            background: #1a2332;
            border-radius: 4px;
            color: #ff9800;
        }

        .match-time.live {
            background: #ff4757;
            color: white;
        }

        .teams {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .team {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }

        .team-logo {
            width: 60px;
            height: 60px;
            object-fit: contain;
            margin-bottom: 10px;
        }

        .team-name {
            font-weight: 600;
            text-align: center;
            font-size: 14px;
        }

        .score {
            font-size: 24px;
            font-weight: 700;
            padding: 0 20px;
            color: #00ff9d;
        }

        /* Betting Options */
        .betting-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .bet-option {
            padding: 12px;
            background: #1a2332;
            border: 2px solid #333;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .bet-option:hover {
            border-color: #00ff9d;
            background: #1a2332;
        }

        .bet-option.selected {
            border-color: #00ff9d;
            background: rgba(0,255,157,0.1);
        }

        .bet-type {
            font-size: 12px;
            color: #a0a8c9;
            margin-bottom: 5px;
        }

        .bet-odds {
            font-size: 18px;
            font-weight: 700;
            color: #00ff9d;
        }

        /* Bet Slip */
        .bet-slip {
            background: #111827;
            border-radius: 15px;
            padding: 20px;
            border: 2px solid #00ff9d;
            margin: 20px 0;
            position: sticky;
            bottom: 20px;
        }

        .bet-slip-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }

        .bet-slip-title {
            color: #00ff9d;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .bet-slip-clear {
            color: #ff4757;
            cursor: pointer;
            font-size: 14px;
        }

        .bet-slip-item {
            background: #1a2332;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .bet-slip-match {
            font-size: 14px;
            font-weight: 600;
        }

        .bet-slip-details {
            font-size: 12px;
            color: #a0a8c9;
            margin-top: 5px;
        }

        .bet-slip-odds {
            color: #00ff9d;
            font-weight: 700;
            font-size: 16px;
        }

        .bet-slip-remove {
            color: #ff4757;
            cursor: pointer;
            margin-left: 15px;
        }

        .bet-slip-total {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-top: 1px solid #333;
            font-weight: 700;
        }

        .total-odds {
            color: #00ff9d;
            font-size: 20px;
        }

        .bet-input-group {
            display: flex;
            gap: 10px;
            margin: 15px 0;
        }

        .bet-input {
            flex: 1;
            padding: 15px;
            background: #1a2332;
            border: 2px solid #00ff9d;
            border-radius: 8px;
            color: white;
            font-size: 18px;
            font-weight: 600;
        }

        .bet-input:focus {
            outline: none;
            border-color: #ff9800;
        }

        .place-bet-btn {
            width: 100%;
            padding: 15px;
            background: #00ff9d;
            border: none;
            border-radius: 8px;
            color: #000;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .place-bet-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,255,157,0.3);
        }

        .place-bet-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .potential-win {
            text-align: right;
            margin: 10px 0;
            color: #a0a8c9;
        }

        .potential-win span {
            color: #00ff9d;
            font-size: 18px;
            font-weight: 700;
            margin-left: 10px;
        }

        /* Quick Bets */
        .quick-bets {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin: 15px 0;
        }

        .quick-bet {
            padding: 10px;
            background: #1a2332;
            border: 1px solid #00ff9d;
            border-radius: 6px;
            color: #00ff9d;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .quick-bet:hover {
            background: #00ff9d;
            color: #000;
        }

        /* History Panel */
        .history-panel {
            background: #111827;
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            border: 1px solid #ff9800;
        }

        .history-title {
            color: #ff9800;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: #1a2332;
            border-radius: 8px;
            font-size: 13px;
        }

        .history-item.win {
            border-left: 3px solid #00ff9d;
        }

        .history-item.lose {
            border-left: 3px solid #ff4757;
        }

        .history-amount.win {
            color: #00ff9d;
            font-weight: 700;
        }

        .history-amount.lose {
            color: #ff4757;
            font-weight: 700;
        }

        /* Result Overlay */
        .result-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .result-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .result-content {
            background: #111827;
            padding: 30px;
            border-radius: 20px;
            border: 3px solid #00ff9d;
            text-align: center;
            max-width: 350px;
            width: 90%;
        }

        .result-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .result-title.win {
            color: #00ff9d;
        }

        .result-title.lose {
            color: #ff4757;
        }

        .result-amount {
            font-size: 32px;
            font-weight: 700;
            margin: 20px 0;
        }

        .result-amount.win {
            color: #00ff9d;
        }

        .result-amount.lose {
            color: #ff4757;
        }

        .ok-btn {
            padding: 12px 30px;
            background: #00ff9d;
            border: none;
            border-radius: 8px;
            color: #000;
            font-weight: 700;
            cursor: pointer;
        }

        /* Toast */
        .toast-container {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10000;
            width: 90%;
            max-width: 300px;
        }

        .toast {
            padding: 15px;
            background: #111827;
            border-radius: 8px;
            border-left: 4px solid #00ff9d;
            color: white;
            margin-top: 10px;
            transform: translateY(100%);
            opacity: 0;
            transition: all 0.3s;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.error {
            border-color: #ff4757;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 40px;
            color: #a0a8c9;
        }

        .loading-spinner {
            border: 4px solid #1a2332;
            border-top: 4px solid #00ff9d;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Bottom Nav */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            background: #111827;
            padding: 15px;
            border-top: 2px solid #00ff9d;
            position: sticky;
            bottom: 0;
            z-index: 99;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #a0a8c9;
            font-size: 12px;
            gap: 5px;
        }

        .nav-item i {
            font-size: 20px;
        }

        .nav-item.active {
            color: #00ff9d;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 10px;
            }
            
            .balance-display {
                width: 100%;
                justify-content: center;
            }
            
            .matches-grid {
                grid-template-columns: 1fr;
            }
            
            .quick-bets {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="logo">
            <i class="fas fa-futbol"></i>
            XCrazyBet Football
        </div>

            $<span id="balance-val">0.00</span>

    <!-- Main Container -->
    <div class="container">
        <!-- League Filter -->
        <div class="league-filter">
            <div class="filter-title">

            </div>
            <div class="league-buttons" id="league-buttons">
                <button class="league-btn active" data-league="all">🌍 ALL LEAGUES</button>
                <button class="league-btn" data-league="39">🏴󠁧󠁢󠁥󠁮󠁧󠁿 PREMIER LEAGUE</button>
                <button class="league-btn" data-league="140">🇪🇸 LA LIGA</button>
                <button class="league-btn" data-league="78">🇩🇪 BUNDESLIGA</button>
                <button class="league-btn" data-league="135">🇮🇹 SERIE A</button>
                <button class="league-btn" data-league="61">🇫🇷 LIGUE 1</button>

        <!-- Status Indicators -->
        <div style="display: flex; gap: 20px; margin: 10px 0;">

        <div class="bet-slip" id="bet-slip">

            </div>

                <span>Total Odds:</span>
                <span class="total-odds" id="total-odds">0.00</span>
            </div>

            <div class="quick-bets">
                <div class="quick-bet" data-amount="1">$1</div>
                <div class="quick-bet" data-amount="5">$5</div>
                <div class="quick-bet" data-amount="10">$10</div>
                <div class="quick-bet" data-amount="25">$25</div>
            </div>

            <div class="bet-input-group">
                <input type="number" class="bet-input" id="bet-amount" value="5" min="1" step="1">
                <span style="color: #00ff9d; font-size: 18px; font-weight: 700;">$</span>
            </div>

            <div class="potential-win">
                Potential Win: <span id="potential-win">$0.00</span>
            </div>

            <button class="place-bet-btn" id="place-bet-btn" disabled>
                <i class="fas fa-coins"></i> PLACE BET
            </button>
        </div>

        <!-- History Panel -->
        <div class="history-panel">
            <div class="history-title">
                <i class="fas fa-history"></i> RECENT BETS
            </div>
            <div class="history-list" id="history-list">
                <!-- History items will appear here -->
            </div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="#" class="nav-item">
            <i class="fas fa-home"></i>
            Home
        </a>
        <a href="#" class="nav-item active">
            <i class="fas fa-futbol"></i>
            Football
        </a>
        <a href="#" class="nav-item">
            <i class="fas fa-history"></i>
            My Bets
        </a>
        <a href="#" class="nav-item">
            <i class="fas fa-wallet"></i>
            Wallet
        </a>
    </nav>

    <!-- Result Overlay -->
    <div class="result-overlay" id="result-overlay">
        <div class="result-content">
            <div class="result-title" id="result-title">BET PLACED!</div>
            <div class="result-details" id="result-details">Bet placed successfully</div>
            <div class="result-amount" id="result-amount">$0.00</div>
            <button class="ok-btn" onclick="closeResultOverlay()">
                <i class="fas fa-check"></i> OK
            </button>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>

    <script>
        // ===== FIREBASE CONFIG =====
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };

        // Initialize Firebase with persistence
        firebase.initializeApp(firebaseConfig);
        
        // Enable persistence to keep user logged in
        firebase.firestore().enablePersistence()
            .catch((err) => {
                if (err.code === 'failed-precondition') {
                    console.log('Multiple tabs open, persistence disabled');
                } else if (err.code === 'unimplemented') {
                    console.log('Browser doesn\'t support persistence');
                }
            });

        const auth = firebase.auth();
        const db = firebase.firestore();

        // Set persistence to LOCAL to keep user logged in
        auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL)
            .then(() => {
                console.log('Auth persistence set to LOCAL');
            })
            .catch((error) => {
                console.error('Auth persistence error:', error);
            });

        // ===== API CONFIG =====
        const API_KEY = '2396236d9d5cd07468ce280da8390ad5';
        const BASE_URL = 'https://v3.football.api-sports.io';

        // ===== GAME STATE =====
        const gameState = {
            currentUser: null,
            balance: 0,
            betAmount: 5,
            selectedBets: [],
            isPlacingBet: false,
            gameId: null,
            matches: [],
            filteredMatches: [],
            currentLeague: 'all',
            betHistory: [],
            currentBet: {
                stake: 0,
                totalOdds: 0,
                potentialWin: 0,
                actualWin: 0,
                win: false
            }
        };

        // ===== INITIALIZATION =====
        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            setupEventListeners();
        });

        // ===== AUTHENTICATION WITH PERSISTENCE =====
        function checkAuth() {
            auth.onAuthStateChanged((user) => {
                if (user) {
                    console.log('User authenticated:', user.email);
                    gameState.currentUser = user;
                    loadBalance();
                    loadMatches();
                    loadBetHistory();
                    setupRealTimeListeners();
                } else {
                    console.log('No user, redirecting to login...');
                    // Don't redirect immediately, show message and then redirect
                    showToast('Please login to continue', 'error');
                    setTimeout(() => {
                        window.location.href = 'https://xcrazybet.github.io/millioner/login.html';
                    }, 2000);
                }
            }, (error) => {
                console.error('Auth error:', error);
                showToast('Authentication error', 'error');
            });
        }

        // ===== BALANCE MANAGEMENT =====
        async function loadBalance() {
            try {
                const doc = await db.collection("wallets").doc(gameState.currentUser.uid).get();
                if (doc.exists) {
                    gameState.balance = doc.data().balance || 0;
                } else {
                    // Create wallet for new user
                    await db.collection("wallets").doc(gameState.currentUser.uid).set({
                        balance: 100,
                        createdAt: new Date(),
                        updatedAt: new Date()
                    });
                    gameState.balance = 100;
                }
                updateBalanceDisplay();
            } catch (error) {
                console.error('Error loading balance:', error);
                showToast('Error loading balance', 'error');
            }
        }

        function updateBalanceDisplay() {
            document.getElementById('balance-val').textContent = gameState.balance.toFixed(2);
        }

        function setupRealTimeListeners() {
            if (!gameState.currentUser) return;
            
            const walletRef = db.collection("wallets").doc(gameState.currentUser.uid);
            
            walletRef.onSnapshot((doc) => {
                if (doc.exists) {
                    const newBalance = doc.data().balance || 0;
                    if (newBalance !== gameState.balance) {
                        gameState.balance = newBalance;
                        updateBalanceDisplay();
                    }
                }
            }, (error) => {
                console.error('Balance listener error:', error);
            });
        }

        // ===== TRANSACTIONS =====
        async function processTransaction(amount, type, description) {
            try {
                const walletRef = db.collection("wallets").doc(gameState.currentUser.uid);
                
                return await db.runTransaction(async (transaction) => {
                    const walletDoc = await transaction.get(walletRef);
                    
                    if (!walletDoc.exists) {
                        throw new Error("Wallet not found");
                    }
                    
                    const currentBalance = walletDoc.data().balance || 0;
                    const newBalance = currentBalance + amount;
                    
                    if (newBalance < 0) {
                        throw new Error("Insufficient funds");
                    }
                    
                    transaction.update(walletRef, {
                        balance: newBalance,
                        updatedAt: new Date()
                    });
                    
                    const transactionRef = walletRef.collection("transactions").doc();
                    transaction.set(transactionRef, {
                        type: type,
                        amount: amount,
                        description: description,
                        createdAt: new Date(),
                        gameId: gameState.gameId || 'football_bet',
                        beforeBalance: currentBalance,
                        afterBalance: newBalance
                    });
                    
                    gameState.balance = newBalance;
                    updateBalanceDisplay();
                    
                    return { success: true, newBalance };
                    
                });
            } catch (error) {
                console.error('Transaction failed:', error);
                showToast('Transaction failed: ' + error.message, 'error');
                return { success: false, error: error.message };
            }
        }

        // ===== LOAD MATCHES FROM API =====
        async function loadMatches() {
            const grid = document.getElementById('matches-grid');
            
            try {
                // Get today's date
                const today = new Date().toISOString().split('T')[0];
                
                const response = await fetch(`${BASE_URL}/fixtures?date=${today}&season=2026`, {
                    method: 'GET',
                    headers: {
                        'x-apisports-key': API_KEY
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                console.log('Matches loaded:', data);
                
                if (data.response && data.response.length > 0) {
                    gameState.matches = data.response;
                } else {
                    // If no matches today, load sample data
                    loadSampleMatches();
                }
                
                filterMatches('all');
                
            } catch (error) {
                console.error('Error loading matches:', error);
                loadSampleMatches();
            }
        }

        // ===== SAMPLE MATCHES =====
        function loadSampleMatches() {
            gameState.matches = [
                {
                    fixture: { id: 1, date: new Date().toISOString(), status: { short: 'LIVE', long: 'Live' } },
                    league: { id: 39, name: 'Premier League', country: 'England', logo: 'https://media.api-sports.io/football/leagues/39.png' },
                    teams: { 
                        home: { id: 33, name: 'Manchester United', logo: 'https://media.api-sports.io/football/teams/33.png' },
                        away: { id: 34, name: 'Newcastle', logo: 'https://media.api-sports.io/football/teams/34.png' }
                    },
                    goals: { home: 2, away: 1 },
                    odds: { home: 1.95, draw: 3.40, away: 4.20 }
                },
                {
                    fixture: { id: 2, date: new Date(Date.now() + 3600000).toISOString(), status: { short: 'NS', long: 'Not Started' } },
                    league: { id: 140, name: 'La Liga', country: 'Spain', logo: 'https://media.api-sports.io/football/leagues/140.png' },
                    teams: { 
                        home: { id: 529, name: 'Barcelona', logo: 'https://media.api-sports.io/football/teams/529.png' },
                        away: { id: 530, name: 'Atletico Madrid', logo: 'https://media.api-sports.io/football/teams/530.png' }
                    },
                    goals: { home: null, away: null },
                    odds: { home: 1.85, draw: 3.50, away: 4.10 }
                },
                {
                    fixture: { id: 3, date: new Date(Date.now() - 7200000).toISOString(), status: { short: 'FT', long: 'Finished' } },
                    league: { id: 78, name: 'Bundesliga', country: 'Germany', logo: 'https://media.api-sports.io/football/leagues/78.png' },
                    teams: { 
                        home: { id: 157, name: 'Bayern Munich', logo: 'https://media.api-sports.io/football/teams/157.png' },
                        away: { id: 169, name: 'RB Leipzig', logo: 'https://media.api-sports.io/football/teams/169.png' }
                    },
                    goals: { home: 3, away: 1 },
                    odds: { home: 1.65, draw: 4.00, away: 5.20 }
                }
            ];
            
            filterMatches('all');
        }

        // ===== FILTER MATCHES =====
        function filterMatches(leagueId) {
            gameState.currentLeague = leagueId;
            
            if (leagueId === 'all') {
                gameState.filteredMatches = gameState.matches;
            } else {
                gameState.filteredMatches = gameState.matches.filter(m => m.league.id.toString() === leagueId);
            }
            
            displayMatches();
            
            // Update active league button
            document.querySelectorAll('.league-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.league === leagueId) {
                    btn.classList.add('active');
                }
            });
        }

        // ===== DISPLAY MATCHES =====
        function displayMatches() {
            const grid = document.getElementById('matches-grid');
            grid.innerHTML = '';
            
            if (gameState.filteredMatches.length === 0) {
                grid.innerHTML = '<div style="text-align: center; padding: 40px; color: #a0a8c9;"><i class="fas fa-futbol" style="font-size: 40px; margin-bottom: 10px;"></i><p>No matches found</p></div>';
                return;
            }
            
            gameState.filteredMatches.forEach(match => {
                const isLive = match.fixture.status.short === 'LIVE' || 
                              match.fixture.status.short === '1H' || 
                              match.fixture.status.short === '2H' || 
                              match.fixture.status.short === 'HT';
                
                const isFinished = match.fixture.status.short === 'FT' || 
                                  match.fixture.status.short === 'AET' || 
                                  match.fixture.status.short === 'PEN';
                
                const matchTime = isLive ? 'LIVE' : 
                                 isFinished ? 'FT' : 
                                 new Date(match.fixture.date).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                
                const homeScore = match.goals.home !== null ? match.goals.home : '-';
                const awayScore = match.goals.away !== null ? match.goals.away : '-';
                
                const card = document.createElement('div');
                card.className = `match-card ${isLive ? 'live' : ''}`;
                
                card.innerHTML = `
                    <div class="match-header">
                        <div class="league-info">
                            <img class="league-logo" src="${match.league.logo || 'https://via.placeholder.com/24'}" alt="${match.league.name}" onerror="this.src='https://via.placeholder.com/24'">
                            <span class="league-name">${match.league.name}</span>
                        </div>
                        <div class="match-time ${isLive ? 'live' : ''}">${matchTime}</div>
                    </div>
                    
                    <div class="teams">
                        <div class="team">
                            <img class="team-logo" src="${match.teams.home.logo || 'https://via.placeholder.com/60'}" alt="${match.teams.home.name}" onerror="this.src='https://via.placeholder.com/60'">
                            <span class="team-name">${match.teams.home.name}</span>
                        </div>
                        <div class="score">${homeScore} - ${awayScore}</div>
                        <div class="team">
                            <img class="team-logo" src="${match.teams.away.logo || 'https://via.placeholder.com/60'}" alt="${match.teams.away.name}" onerror="this.src='https://via.placeholder.com/60'">
                            <span class="team-name">${match.teams.away.name}</span>
                        </div>
                    </div>
                    
                    <div class="betting-options">
                        <div class="bet-option" onclick="selectBet(${match.fixture.id}, 'home', ${match.odds.home}, '${match.teams.home.name} vs ${match.teams.away.name}', '1')">
                            <div class="bet-type">1</div>
                            <div class="bet-odds">${match.odds.home.toFixed(2)}</div>
                        </div>
                        <div class="bet-option" onclick="selectBet(${match.fixture.id}, 'draw', ${match.odds.draw}, '${match.teams.home.name} vs ${match.teams.away.name}', 'X')">
                            <div class="bet-type">X</div>
                            <div class="bet-odds">${match.odds.draw.toFixed(2)}</div>
                        </div>
                        <div class="bet-option" onclick="selectBet(${match.fixture.id}, 'away', ${match.odds.away}, '${match.teams.home.name} vs ${match.teams.away.name}', '2')">
                            <div class="bet-type">2</div>
                            <div class="bet-odds">${match.odds.away.toFixed(2)}</div>
                        </div>
                    </div>
                `;
                
                grid.appendChild(card);
            });
        }

        // ===== BET SELECTION =====
        window.selectBet = function(matchId, betType, odds, matchName, displayType) {
            if (gameState.isPlacingBet) {
                showToast('Please wait for current bet to complete', 'warning');
                return;
            }
            
            // Check if bet already exists for this match
            const existingBetIndex = gameState.selectedBets.findIndex(b => b.matchId === matchId);
            
            if (existingBetIndex !== -1) {
                // Update existing bet
                gameState.selectedBets[existingBetIndex] = {
                    matchId,
                    betType,
                    odds,
                    matchName,
                    displayType
                };
                showToast(`Bet updated: ${matchName} - ${displayType} @ ${odds.toFixed(2)}`, 'success');
            } else {
                // Add new bet
                gameState.selectedBets.push({
                    matchId,
                    betType,
                    odds,
                    matchName,
                    displayType
                });
                showToast(`Bet added: ${matchName} - ${displayType} @ ${odds.toFixed(2)}`, 'success');
            }
            
            updateBetSlip();
        };

        // ===== UPDATE BET SLIP =====
        function updateBetSlip() {
            const container = document.getElementById('betslip-items');
            const totalOddsEl = document.getElementById('total-odds');
            const potentialWinEl = document.getElementById('potential-win');
            const placeBetBtn = document.getElementById('place-bet-btn');
            
            if (gameState.selectedBets.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: #a0a8c9; padding: 20px;"><i class="fas fa-arrow-up"></i> Click on odds to add bets</div>';
                totalOddsEl.textContent = '0.00';
                potentialWinEl.textContent = '$0.00';
                placeBetBtn.disabled = true;
                return;
            }
            
            // Calculate total odds (multiply all odds)
            let totalOdds = gameState.selectedBets.reduce((acc, bet) => acc * bet.odds, 1);
            totalOdds = parseFloat(totalOdds.toFixed(2));
            
            // Calculate potential win
            const betAmount = parseFloat(document.getElementById('bet-amount').value) || 5;
            const potentialWin = betAmount * totalOdds;
            
            totalOddsEl.textContent = totalOdds.toFixed(2);
            potentialWinEl.textContent = `$${potentialWin.toFixed(2)}`;
            placeBetBtn.disabled = false;
            
            // Build bet slip items
            let html = '';
            gameState.selectedBets.forEach((bet, index) => {
                html += `
                    <div class="bet-slip-item">
                        <div>
                            <div class="bet-slip-match">${bet.matchName}</div>
                            <div class="bet-slip-details">${bet.displayType}</div>
                        </div>
                        <div style="display: flex; align-items: center;">
                            <span class="bet-slip-odds">${bet.odds.toFixed(2)}</span>
                            <span class="bet-slip-remove" onclick="removeBet(${index})">
                                <i class="fas fa-times"></i>
                            </span>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }

        // ===== REMOVE BET =====
        window.removeBet = function(index) {
            gameState.selectedBets.splice(index, 1);
            updateBetSlip();
            showToast('Bet removed', 'info');
        };

        // ===== CLEAR BET SLIP =====
        function clearBetSlip() {
            gameState.selectedBets = [];
            updateBetSlip();
            showToast('Bet slip cleared', 'info');
        }

        // ===== PLACE BET =====
        async function placeBet() {
            const betAmount = parseFloat(document.getElementById('bet-amount').value);
            
            // Validation
            if (gameState.selectedBets.length === 0) {
                showToast('Select at least one bet', 'error');
                return;
            }
            
            if (betAmount < 1) {
                showToast('Minimum bet is $1', 'error');
                return;
            }
            
            if (betAmount > gameState.balance) {
                showToast('Insufficient funds', 'error');
                return;
            }
            
            if (gameState.isPlacingBet) {
                showToast('Bet already in progress', 'warning');
                return;
            }
            
            gameState.isPlacingBet = true;
            document.getElementById('place-bet-btn').disabled = true;
            
            // Calculate total odds
            const totalOdds = gameState.selectedBets.reduce((acc, bet) => acc * bet.odds, 1);
            const potentialWin = betAmount * totalOdds;
            
            gameState.currentBet = {
                stake: betAmount,
                totalOdds: totalOdds,
                potentialWin: potentialWin,
                selections: [...gameState.selectedBets]
            };
            
            // Generate game ID
            gameState.gameId = 'football_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            
            // Process bet transaction
            const result = await processTransaction(
                -betAmount,
                "football_bet",
                `Football bet of $${betAmount} on ${gameState.selectedBets.length} selections @ ${totalOdds.toFixed(2)}`
            );
            
            if (!result.success) {
                gameState.isPlacingBet = false;
                document.getElementById('place-bet-btn').disabled = false;
                return;
            }
            
            // Show loading
            showToast('Bet placed successfully! Waiting for result...', 'success');
            
            // Simulate bet result (in real app, this would come from API)
            setTimeout(() => {
                // For demo, random win/loss
                const win = Math.random() > 0.5;
                const winAmount = win ? betAmount * totalOdds : 0;
                
                gameState.currentBet.actualWin = winAmount;
                gameState.currentBet.win = win;
                
                if (win) {
                    processTransaction(
                        winAmount,
                        "football_win",
                        `Football win of $${winAmount.toFixed(2)}`
                    );
                }
                
                // Add to history
                addBetHistory(win, winAmount, betAmount, totalOdds);
                
                // Show result
                showBetResult(win, winAmount, betAmount);
                
                // Clear bet slip
                gameState.selectedBets = [];
                updateBetSlip();
                
                gameState.isPlacingBet = false;
                document.getElementById('place-bet-btn').disabled = false;
                
            }, 3000);
        }

        // ===== SHOW BET RESULT =====
        function showBetResult(win, winAmount, stake) {
            const title = document.getElementById('result-title');
            const details = document.getElementById('result-details');
            const amount = document.getElementById('result-amount');
            
            if (win) {
                title.textContent = '🎉 YOU WIN!';
                title.className = 'result-title win';
                amount.textContent = `+$${winAmount.toFixed(2)}`;
                amount.className = 'result-amount win';
            } else {
                title.textContent = '😞 BET LOST';
                title.className = 'result-title lose';
                amount.textContent = `-$${stake.toFixed(2)}`;
                amount.className = 'result-amount lose';
            }
            
            details.innerHTML = `
                Stake: $${stake.toFixed(2)}<br>
                Odds: ${gameState.currentBet.totalOdds.toFixed(2)}<br>
                Selections: ${gameState.currentBet.selections.length}
            `;
            
            document.getElementById('result-overlay').classList.add('show');
        }

        // ===== CLOSE RESULT OVERLAY =====
        window.closeResultOverlay = function() {
            document.getElementById('result-overlay').classList.remove('show');
        };

        // ===== ADD BET HISTORY =====
        function addBetHistory(win, winAmount, stake, odds) {
            const historyItem = {
                win: win,
                amount: win ? winAmount : -stake,
                odds: odds,
                selections: gameState.currentBet.selections.length,
                timestamp: new Date()
            };
            
            gameState.betHistory.unshift(historyItem);
            if (gameState.betHistory.length > 10) {
                gameState.betHistory.pop();
            }
            
            updateHistoryDisplay();
            
            // Save to Firebase
            saveBetHistory(historyItem);
        }

        function updateHistoryDisplay() {
            const historyList = document.getElementById('history-list');
            historyList.innerHTML = '';
            
            gameState.betHistory.forEach(item => {
                const div = document.createElement('div');
                div.className = `history-item ${item.win ? 'win' : 'lose'}`;
                
                const time = new Date(item.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                
                div.innerHTML = `
                    <div>
                        <div>${time} - ${item.selections} selections</div>
                        <div style="font-size: 11px; color: #a0a8c9;">@ ${item.odds.toFixed(2)}</div>
                    </div>
                    <div class="history-amount ${item.win ? 'win' : 'lose'}">
                        ${item.amount > 0 ? '+' : ''}$${Math.abs(item.amount).toFixed(2)}
                    </div>
                `;
                
                historyList.appendChild(div);
            });
        }

        async function saveBetHistory(historyItem) {
            try {
                await db.collection("football_history").doc(gameState.currentUser.uid).collection("bets").add({
                    userId: gameState.currentUser.uid,
                    ...historyItem,
                    gameId: gameState.gameId,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
            } catch (error) {
                console.error('Error saving bet history:', error);
            }
        }

        async function loadBetHistory() {
            try {
                const snapshot = await db.collection("football_history")
                    .doc(gameState.currentUser?.uid)
                    .collection("bets")
                    .orderBy('timestamp', 'desc')
                    .limit(10)
                    .get();
                
                snapshot.forEach(doc => {
                    const data = doc.data();
                    gameState.betHistory.push({
                        win: data.win,
                        amount: data.amount,
                        odds: data.odds,
                        selections: data.selections,
                        timestamp: data.timestamp.toDate()
                    });
                });
                
                updateHistoryDisplay();
            } catch (error) {
                console.error('Error loading bet history:', error);
            }
        }

        // ===== TOAST NOTIFICATIONS =====
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.add('show');
            }, 10);
            
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => {
                    if (container.contains(toast)) {
                        container.removeChild(toast);
                    }
                }, 300);
            }, 3000);
        }

        // ===== EVENT LISTENERS =====
        function setupEventListeners() {
            // League filter buttons
            document.querySelectorAll('.league-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    filterMatches(btn.dataset.league);
                });
            });
            
            // Clear bet slip
            document.getElementById('clear-betslip').addEventListener('click', clearBetSlip);
            
            // Place bet button
            document.getElementById('place-bet-btn').addEventListener('click', placeBet);
            
            // Quick bet buttons
            document.querySelectorAll('.quick-bet').forEach(btn => {
                btn.addEventListener('click', () => {
                    const amount = parseFloat(btn.dataset.amount);
                    document.getElementById('bet-amount').value = amount;
                    gameState.betAmount = amount;
                    updateBetSlip();
                });
            });
            
            // Bet amount input
            document.getElementById('bet-amount').addEventListener('input', (e) => {
                let value = parseFloat(e.target.value) || 1;
                value = Math.max(1, value);
                e.target.value = value;
                gameState.betAmount = value;
                updateBetSlip();
            });
            
            // Close overlay on outside click
            document.getElementById('result-overlay').addEventListener('click', (e) => {
                if (e.target === document.getElementById('result-overlay')) {
                    closeResultOverlay();
                }
            });
        }

        // Check auth state on page load
        auth.onAuthStateChanged((user) => {
            if (user) {
                console.log('User is logged in:', user.email);
            } else {
                console.log('No user logged in');
            }
        });
    </script>
</body>
</html>
