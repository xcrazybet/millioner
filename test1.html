<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Live Market Prices – Complete View</title>
    <style>
        /* unified dark theme from both designs */
        body {
            background: #0f172a;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px 20px;
            margin: 0;
        }

        h1 {
            margin-bottom: 40px;
            font-size: 2.2rem;
            letter-spacing: 1px;
            border-bottom: 1px solid #334155;
            padding-bottom: 20px;
        }

        /* gold card style (from code 1) – also used for all individual widgets */
        .price-box {
            background: #1e293b;
            padding: 30px 20px;
            border-radius: 15px;
            display: inline-block;
            box-shadow: 0 0 20px rgba(0,0,0,0.4);
            margin: 30px auto 50px auto;
            width: fit-content;
            max-width: 90%;
        }

        .price-box h1 {
            margin-bottom: 20px;
            font-size: 1.8rem;
            border-bottom: none;
            padding-bottom: 0;
        }

        /* container for all single-quote widgets (replaces .widget-container) */
        .single-quote-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px 20px;
            margin: 50px auto;
        }

        .single-quote-item {
            background: #1e293b;
            border-radius: 15px;
            padding: 25px 15px 20px 15px;
            box-shadow: 0 0 15px rgba(0,0,0,0.4);
            width: fit-content;
            max-width: 100%;
            transition: transform 0.2s;
        }

        .single-quote-item h2 {
            margin-top: 0;
            margin-bottom: 15px;
            color: #facc15; /* gold accent */
            font-size: 1.5rem;
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
        }

        /* ensure tradingview containers behave */
        .tradingview-widget-container {
            margin: 0 auto;
        }

        .market-overview-section {
            margin-top: 20px;
        }

        iframe, [class*="tradingview"] {
            max-width: 100%;
        }

        /* keep the footer note subtle */
        .footer-note {
            color: #94a3b8;
            margin-top: 60px;
            font-size: 0.9rem;
        }

        /* optional section title for individual widgets */
        .section-title {
            font-size: 2rem;
            margin: 60px 0 30px 0;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
        }
    </style>
</head>
<body>

    <!-- ============================================
         FIRST PART – full Market Overview (from code 1)
         ============================================ -->
    <h1>Live Market Overview</h1>

    <div class="tradingview-widget-container market-overview-section">
        <div class="tradingview-widget-container__widget"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-market-overview.js" async>
        {
            "colorTheme": "dark",
            "dateRange": "1D",
            "showChart": false,
            "locale": "en",
            "largeChartUrl": "",
            "isTransparent": true,
            "width": "100%",
            "height": "700",
            "symbolsGroups": [
                {
                    "name": "Forex",
                    "symbols": [
                        { "name": "FOREXCOM:EURUSD", "displayName": "EUR/USD" },
                        { "name": "FOREXCOM:USDJPY", "displayName": "USD/JPY" },
                        { "name": "FOREXCOM:GBPUSD", "displayName": "GBP/USD" },
                        { "name": "FOREXCOM:AUDUSD", "displayName": "AUD/USD" },
                        { "name": "FOREXCOM:USDCAD", "displayName": "USD/CAD" }
                    ]
                },
                {
                    "name": "Commodities",
                    "symbols": [
                        { "name": "COMEX:GC1!", "displayName": "Gold" },
                        { "name": "COMEX:SI1!", "displayName": "Silver" },
                        { "name": "NYMEX:CL1!", "displayName": "Crude Oil" },
                        { "name": "ICE:BRN1!", "displayName": "Brent Oil" },
                        { "name": "NYMEX:NG1!", "displayName": "Natural Gas" }
                    ]
                },
                {
                    "name": "Indices",
                    "symbols": [
                        { "name": "INDEX:SPX", "displayName": "S&P500" },
                        { "name": "INDEX:DJI", "displayName": "Dow Jones" },
                        { "name": "INDEX:NAS100", "displayName": "NASDAQ100" },
                        { "name": "INDEX:DAX", "displayName": "DAX" },
                        { "name": "INDEX:FTSE", "displayName": "FTSE100" }
                    ]
                },
                {
                    "name": "Stocks",
                    "symbols": [
                        { "name": "NASDAQ:AAPL", "displayName": "Apple" },
                        { "name": "NASDAQ:MSFT", "displayName": "Microsoft" },
                        { "name": "NASDAQ:GOOGL", "displayName": "Google" },
                        { "name": "NASDAQ:AMZN", "displayName": "Amazon" },
                        { "name": "NASDAQ:TSLA", "displayName": "Tesla" }
                    ]
                },
                {
                    "name": "Bonds",
                    "symbols": [
                        { "name": "TVC:US10Y", "displayName": "US 10Y" },
                        { "name": "TVC:US30Y", "displayName": "US 30Y" },
                        { "name": "TVC:DE10Y", "displayName": "Germany 10Y" },
                        { "name": "TVC:GB10Y", "displayName": "UK 10Y" },
                        { "name": "TVC:JP10Y", "displayName": "Japan 10Y" }
                    ]
                }
            ]
        }
        </script>
    </div>

    <!-- ============================================
         GOLD CARD – exactly as code 1 (standalone)
         ============================================ -->
    <div class="price-box">
        <h1>Live Gold Price (XAU/USD)</h1>
        <div class="tradingview-widget-container">
            <div class="tradingview-widget-container__widget"></div>
            <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-single-quote.js" async>
            {
                "symbol": "FOREXCOM:XAUUSD",
                "width": "350",
                "colorTheme": "dark",
                "isTransparent": true,
                "locale": "en"
            }
            </script>
        </div>
    </div>

    <!-- ============================================
         SECOND PART – individual widgets from code 2
         (Crude Oil, Brent, DAX, Dow Jones, S&P 500)
         with consistent dark cards + transparent = false
         ============================================ -->
    <h2 class="section-title">Key Instruments (Detailed Quotes)</h2>

    <div class="single-quote-group">

        <!-- Crude Oil WTI (TVC:USOIL) -->
        <div class="single-quote-item">
            <h2>Crude Oil (WTI)</h2>
            <div class="tradingview-widget-container">
                <div class="tradingview-widget-container__widget"></div>
                <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-single-quote.js" async>
                {
                    "symbol": "TVC:USOIL",
                    "width": "350",
                    "colorTheme": "dark",
                    "isTransparent": false,
                    "locale": "en"
                }
                </script>
            </div>
        </div>

        <!-- Brent Oil (TVC:UKOIL) -->
        <div class="single-quote-item">

                {

        <!-- DAX (INDEX:DAX) -->
        <div class="single-quote-item">

                {
                    "symbol": "INDEX:DAX",
                    "width": "350",
                    "colorTheme": "dark",
                    "isTransparent": false,
                    "locale": "en"
                }
                </script>
            </div>
        </div>

        <!-- Dow Jones (INDEX:DJI) -->
        <div class="single-quote-item">
            <h2>Dow Jones</h2>
            <div class="tradingview-widget-container">
                <div class="tradingview-widget-container__widget"></div>
                <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-single-quote.js" async>
                {
                    "symbol": "INDEX:DJI",
                    "width": "350",
                    "colorTheme": "dark",
                    "isTransparent": false,
                    "locale": "en"
                }
                </script>
            </div>
        </div>

        <!-- S&P 500 (INDEX:SPX) -->
        <div class="single-quote-item">
            <h2>S&P 500</h2>
            <div class="tradingview-widget-container">
                <div class="tradingview-widget-container__widget"></div>
                <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-single-quote.js" async>
                {
                    "symbol": "INDEX:SPX",
                    "width": "350",
                    "colorTheme": "dark",
                    "isTransparent": false,
                    "locale": "en"
                }
                </script>
            </div>
        </div>

    </div> <!-- end single-quote-group -->

    <!-- subtle footer note (from code 1) -->
    <p class="footer-note">Live data provided by TradingView</p>

</body>
</html>
