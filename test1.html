<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bets - X-Bet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .bet-card {
            transition: all 0.3s ease;
            border-left: 4px solid transparent;
        }
        .bet-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }
        .bet-pending { border-left-color: #f59e0b; }
        .bet-won { border-left-color: #10b981; }
        .bet-lost { border-left-color: #ef4444; }
        .bet-void { border-left-color: #6b7280; }
        
        .status-badge {
            font-size: 0.75rem;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.025em;
        }
        .status-pending { background: #fef3c7; color: #92400e; }
        .status-won { background: #d1fae5; color: #065f46; }
        .status-lost { background: #fee2e2; color: #991b1b; }
        .status-void { background: #f3f4f6; color: #374151; }
        
        .profit-positive { color: #10b981; }
        .profit-negative { color: #ef4444; }
        
        .match-score {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-weight: bold;
        }
        
        .selection-item {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 0.375rem;
            padding: 0.5rem;
            margin-bottom: 0.25rem;
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .bet-card { animation: slideIn 0.5s ease-out; }
        
        .loading-skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }
        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Header -->
    <header class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center">
                    <h1 class="text-2xl font-bold text-indigo-600">X-Bet</h1>
                    <span class="ml-4 text-gray-600">My Bets</span>
                </div>
                <div class="flex items-center space-x-4">
                    <div class="text-right">
                        <div class="text-sm text-gray-600">Balance</div>
                        <div id="userBalance" class="text-lg font-bold text-green-600">$0.00</div>
                    </div>
                    <button onclick="logout()" class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600">
                        <i class="fas fa-sign-out-alt mr-2"></i>Logout
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Status Display -->
    <div id="statusDisplay" class="hidden fixed top-20 right-4 bg-white rounded-lg shadow-lg p-4 z-50 max-w-sm">
        <div class="flex items-center">
            <div id="statusIcon" class="mr-3"></div>
            <div>
                <div id="statusTitle" class="font-semibold"></div>
                <div id="statusMessage" class="text-sm text-gray-600"></div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Stats Overview -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="bg-white rounded-xl shadow-md p-6">
                <div class="flex items-center">
                    <div class="p-3 bg-blue-100 rounded-lg">
                        <i class="fas fa-ticket-alt text-blue-600 text-xl"></i>
                    </div>
                    <div class="ml-4">
                        <div class="text-sm text-gray-600">Total Bets</div>
                        <div id="totalBets" class="text-2xl font-bold text-gray-900">0</div>
                    </div>
                </div>
            </div>
            
            <div class="bg-white rounded-xl shadow-md p-6">
                <div class="flex items-center">
                    <div class="p-3 bg-green-100 rounded-lg">
                        <i class="fas fa-trophy text-green-600 text-xl"></i>
                    </div>
                    <div class="ml-4">
                        <div class="text-sm text-gray-600">Won</div>
                        <div id="wonBets" class="text-2xl font-bold text-green-600">0</div>
                    </div>
                </div>
            </div>
            
            <div class="bg-white rounded-xl shadow-md p-6">
                <div class="flex items-center">
                    <div class="p-3 bg-red-100 rounded-lg">
                        <i class="fas fa-times-circle text-red-600 text-xl"></i>
                    </div>
                    <div class="ml-4">
                        <div class="text-sm text-gray-600">Lost</div>
                        <div id="lostBets" class="text-2xl font-bold text-red-600">0</div>
                    </div>
                </div>
            </div>
            
            <div class="bg-white rounded-xl shadow-md p-6">
                <div class="flex items-center">
                    <div class="p-3 bg-purple-100 rounded-lg">
                        <i class="fas fa-chart-line text-purple-600 text-xl"></i>
                    </div>
                    <div class="ml-4">
                        <div class="text-sm text-gray-600">Profit/Loss</div>
                        <div id="profitLoss" class="text-2xl font-bold">$0.00</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Filters -->
        <div class="bg-white rounded-xl shadow-md p-6 mb-8">
            <div class="flex flex-wrap items-center justify-between gap-4">
                <div class="flex items-center space-x-4">
                    <label class="text-sm font-medium text-gray-700">Filter:</label>
                    <select id="statusFilter" onchange="filterBets()" class="border border-gray-300 rounded-lg px-3 py-2">
                        <option value="all">All Bets</option>
                        <option value="pending">Pending</option>
                        <option value="won">Won</option>
                        <option value="lost">Lost</option>
                        <option value="void">Void</option>
                    </select>
                    <select id="timeFilter" onchange="filterBets()" class="border border-gray-300 rounded-lg px-3 py-2">
                        <option value="all">All Time</option>
                        <option value="today">Today</option>
                        <option value="week">This Week</option>
                        <option value="month">This Month</option>
                    </select>
                </div>
                <div class="flex items-center space-x-2">
                    <button onclick="refreshBets()" class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600">
                        <i class="fas fa-sync-alt mr-2"></i>Refresh
                    </button>
                    <button onclick="exportBets()" class="bg-green-500 text-white px-4 py-2 rounded-lg hover:bg-green-600">
                        <i class="fas fa-download mr-2"></i>Export
                    </button>
                </div>
            </div>
        </div>

        <!-- Bets Container -->
        <div id="betsContainer" class="space-y-6">
            <!-- Loading State -->
            <div id="loadingState" class="text-center py-12">
                <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
                <p class="mt-4 text-gray-600">Loading your bets...</p>
            </div>
            
            <!-- Empty State -->
            <div id="emptyState" class="hidden text-center py-12">
                <i class="fas fa-inbox text-6xl text-gray-400 mb-4"></i>
                <h3 class="text-xl font-semibold text-gray-600 mb-2">No bets found</h3>
                <p class="text-gray-500">You haven't placed any bets yet. Start betting to see them here!</p>
                <a href="betting-enhanced-fixed.html" class="inline-block mt-4 bg-blue-500 text-white px-6 py-3 rounded-lg hover:bg-blue-600">
                    <i class="fas fa-plus mr-2"></i>Place Your First Bet
                </a>
            </div>
        </div>
    </main>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyC7Kl_9f7K2N3M4P5Q6R8S9T1V2W3X4Y7Z0",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.appspot.com",
            messagingSenderId: "123456789012",
            appId: "1:123456789012:web:abcdef123456789012345678"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // SportMonks API Configuration
        const SPORTMONKS_API_TOKEN = 'DkFdWG9jFZvH8XSEgLrRfGwczABWVg5rlV25GvIRyN06zdPsOI48Nsv9Wooy';

        // Global Variables
        let currentUser = null;
        let userData = null;
        let allBets = [];
        let filteredBets = [];

        // Initialize App
        document.addEventListener('DOMContentLoaded', async () => {
            await initializeApp();
        });

        async function initializeApp() {
            showStatus('loading', 'Loading...', 'Fetching your betting data');
            
            auth.onAuthStateChanged(async (user) => {
                if (!user) {
                    window.location.href = 'login.html';
                    return;
                }
                
                currentUser = user;
                await loadUserData();
                await loadBets();
                updateStats();
                hideStatus();
            });
        }

        async function loadUserData() {
            try {
                const userDoc = await db.collection('wallets').doc(currentUser.uid).get();
                if (userDoc.exists) {
                    userData = userDoc.data();
                    document.getElementById('userBalance').textContent = `$${userData.balance?.toFixed(2) || '0.00'}`;
                }
            } catch (error) {
                console.error('Error loading user data:', error);
            }
        }

        async function loadBets() {
            try {
                showStatus('loading', 'Loading Bets', 'Fetching your betting history...');
                
                const betsSnapshot = await db.collection('bets')
                    .where('userId', '==', currentUser.uid)
                    .orderBy('createdAt', 'desc')
                    .limit(100)
                    .get();

                allBets = betsSnapshot.docs.map(doc => ({
                    id: doc.id,
                    ...doc.data()
                }));

                // Update match results for pending bets
                await updateMatchResults();
                
                // Apply initial filter
                filterBets();
                
                hideStatus();
                
            } catch (error) {
                console.error('Error loading bets:', error);
                showStatus('error', 'Load Failed', 'Failed to load your bets');
            }
        }

        async function updateMatchResults() {
            try {
                // Get current match data from SportMonks API
                const response = await fetch(`https://api.sportmonks.com/v3/football/fixtures?include=scores;events&api_token=${SPORTMONKS_API_TOKEN}`);
                const data = await response.json();
                
                if (data && data.data) {
                    const matches = data.data;
                    
                    // Update each bet with match results
                    for (let bet of allBets) {
                        if (bet.status === 'pending') {
                            await evaluateBet(bet, matches);
                        }
                    }
                }
            } catch (error) {
                console.error('Error updating match results:', error);
            }
        }

        async function evaluateBet(bet, matches) {
            try {
                const selections = bet.selections || [];
                let allWon = true;
                let anyLost = false;
                let allFinished = true;

                // Check each selection
                for (const selection of selections) {
                    const match = matches.find(m => m.id == selection.matchId);
                    
                    if (!match) {
                        allFinished = false;
                        continue;
                    }

                    const isFinished = [100, 90, 5].includes(match.state_id);
                    if (!isFinished) {
                        allFinished = false;
                        continue;
                    }

                    // Get match scores
                    const scores = match.scores || [];
                    let homeScore = 0, awayScore = 0;
                    if (scores.length > 0) {
                        const homeScoreObj = scores.find(s => s.participant === 'home');
                        const awayScoreObj = scores.find(s => s.participant === 'away');
                        homeScore = homeScoreObj?.score || 0;
                        awayScore = awayScoreObj?.score || 0;
                    }

                    // Determine actual result
                    const actualResult = homeScore > awayScore ? 'Home Win' : 
                                       awayScore > homeScore ? 'Away Win' : 'Draw';

                    // Evaluate selection
                    const won = evaluateSelection(selection, actualResult, homeScore, awayScore);
                    if (!won) {
                        anyLost = true;
                        allWon = false;
                    }
                }

                // Update bet status if all matches are finished
                if (allFinished) {
                    const newStatus = allWon && !anyLost ? 'won' : 'lost';
                    const winnings = newStatus === 'won' ? bet.potentialWin : 0;
                    
                    // Update in Firestore
                    await db.collection('bets').doc(bet.id).update({
                        status: newStatus,
                        settledAt: firebase.firestore.FieldValue.serverTimestamp(),
                        winnings: winnings
                    });
                    
                    // Update local data
                    bet.status = newStatus;
                    bet.winnings = winnings;
                    bet.settledAt = new Date();
                    
                    // Update user balance if won
                    if (winnings > 0) {
                        await db.collection('wallets').doc(currentUser.uid).update({
                            balance: firebase.firestore.FieldValue.increment(winnings)
                        });
                        userData.balance += winnings;
                        document.getElementById('userBalance').textContent = `$${userData.balance.toFixed(2)}`;
                    }
                }
            } catch (error) {
                console.error('Error evaluating bet:', error);
            }
        }

        function evaluateSelection(selection, actualResult, homeScore, awayScore) {
            switch (selection.market) {
                case 'Home Win':
                    return actualResult === 'Home Win';
                case 'Away Win':
                    return actualResult === 'Away Win';
                case 'Draw':
                    return actualResult === 'Draw';
                case 'Over 2.5':
                    return (homeScore + awayScore) > 2.5;
                case 'Under 2.5':
                    return (homeScore + awayScore) <= 2.5;
                default:
                    return selection.market === actualResult;
            }
        }

        function filterBets() {
            const statusFilter = document.getElementById('statusFilter').value;
            const timeFilter = document.getElementById('timeFilter').value;
            
            filteredBets = allBets.filter(bet => {
                // Status filter
                if (statusFilter !== 'all' && bet.status !== statusFilter) {
                    return false;
                }
                
                // Time filter
                if (timeFilter !== 'all') {
                    const betDate = bet.createdAt?.toDate() || new Date();
                    const now = new Date();
                    
                    switch (timeFilter) {
                        case 'today':
                            return betDate.toDateString() === now.toDateString();
                        case 'week':
                            const weekAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
                            return betDate >= weekAgo;
                        case 'month':
                            const monthAgo = new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000);
                            return betDate >= monthAgo;
                    }
                }
                
                return true;
            });
            
            displayBets();
        }

        function displayBets() {
            const container = document.getElementById('betsContainer');
            const loadingState = document.getElementById('loadingState');
            const emptyState = document.getElementById('emptyState');
            
            // Hide loading state
            loadingState.classList.add('hidden');
            
            if (filteredBets.length === 0) {
                container.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }
            
            emptyState.classList.add('hidden');
            
            let html = '';
            filteredBets.forEach(bet => {
                html += createBetCard(bet);
            });
            
            container.innerHTML = html;
        }

        function createBetCard(bet) {
            const date = bet.createdAt?.toDate() || new Date();
            const settledDate = bet.settledAt?.toDate() || null;
            const selections = bet.selections || [];
            const statusClass = `bet-${bet.status}`;
            const statusBadgeClass = `status-${bet.status}`;
            
            const profitLoss = bet.winnings ? bet.winnings - bet.stake : -bet.stake;
            const profitClass = profitLoss >= 0 ? 'profit-positive' : 'profit-negative';
            
            return `
                <div class="bet-card ${statusClass} bg-white rounded-xl shadow-md p-6">
                    <div class="flex justify-between items-start mb-4">
                        <div class="flex-1">
                            <div class="flex items-center mb-2">
                                <span class="status-badge ${statusBadgeClass} mr-3">
                                    ${bet.status}
                                </span>
                                <span class="text-sm text-gray-600">
                                    ${selections.length} Selection${selections.length > 1 ? 's' : ''} • ${bet.betType?.toUpperCase() || 'SINGLE'}
                                </span>
                            </div>
                            <div class="text-xs text-gray-500">
                                <i class="far fa-clock mr-1"></i>
                                Placed: ${date.toLocaleDateString()} ${date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
                            </div>
                            ${settledDate ? `
                                <div class="text-xs text-gray-500 mt-1">
                                    <i class="fas fa-check-circle mr-1"></i>
                                    Settled: ${settledDate.toLocaleDateString()} ${settledDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
                                </div>
                            ` : ''}
                        </div>
                        <div class="text-right">
                            <div class="text-sm text-gray-600 mb-1">Stake</div>
                            <div class="text-lg font-bold">$${bet.stake?.toFixed(2) || '0.00'}</div>
                        </div>
                    </div>
                    
                    <!-- Selections -->
                    <div class="mb-4">
                        <div class="text-sm font-semibold text-gray-700 mb-2">Selections:</div>
                        ${selections.map(selection => `
                            <div class="selection-item">
                                <div class="flex justify-between items-center">
                                    <div>
                                        <span class="font-medium">${selection.team}</span>
                                        <span class="text-gray-600 ml-2">${selection.market}</span>
                                    </div>
                                    <span class="font-bold text-blue-600">${selection.odds}</span>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    
                    <!-- Match Results (for finished matches) -->
                    ${bet.status !== 'pending' ? `
                        <div class="mb-4">
                            <div class="text-sm font-semibold text-gray-700 mb-2">Results:</div>
                            <div class="match-score">
                                <i class="fas fa-futbol mr-2"></i>
                                Final results processed
                            </div>
                        </div>
                    ` : ''}
                    
                    <!-- Footer -->
                    <div class="flex justify-between items-center pt-4 border-t">
                        <div class="text-sm text-gray-600">
                            <div>Total Odds: ${bet.totalOdds?.toFixed(2) || '1.00'}</div>
                            <div>Potential Win: $${bet.potentialWin?.toFixed(2) || '0.00'}</div>
                        </div>
                        <div class="text-right">
                            ${bet.winnings ? `
                                <div class="text-sm text-gray-600">Winnings</div>
                                <div class="text-xl font-bold ${profitClass}">
                                    $${bet.winnings.toFixed(2)}
                                </div>
                            ` : bet.status === 'lost' ? `
                                <div class="text-sm text-gray-600">Lost</div>
                                <div class="text-xl font-bold profit-negative">
                                    -$${bet.stake.toFixed(2)}
                                </div>
                            ` : `
                                <div class="text-sm text-gray-600">Potential</div>
                                <div class="text-xl font-bold">
                                    $${bet.potentialWin?.toFixed(2) || '0.00'}
                                </div>
                            `}
                        </div>
                    </div>
                </div>
            `;
        }

        function updateStats() {
            const total = allBets.length;
            const won = allBets.filter(bet => bet.status === 'won').length;
            const lost = allBets.filter(bet => bet.status === 'lost').length;
            
            let profitLoss = 0;
            allBets.forEach(bet => {
                if (bet.status === 'won') {
                    profitLoss += (bet.winnings || bet.potentialWin) - bet.stake;
                } else if (bet.status === 'lost') {
                    profitLoss -= bet.stake;
                }
            });
            
            document.getElementById('totalBets').textContent = total;
            document.getElementById('wonBets').textContent = won;
            document.getElementById('lostBets').textContent = lost;
            
            const profitElement = document.getElementById('profitLoss');
            profitElement.textContent = `$${profitLoss.toFixed(2)}`;
            profitElement.className = profitLoss >= 0 ? 'text-2xl font-bold profit-positive' : 'text-2xl font-bold profit-negative';
        }

        async function refreshBets() {
            await loadBets();
            updateStats();
            showStatus('success', 'Refreshed', 'Your bets have been updated');
            setTimeout(hideStatus, 3000);
        }

        function exportBets() {
            const csvContent = [
                ['Date', 'Status', 'Type', 'Stake', 'Odds', 'Potential Win', 'Winnings', 'Profit/Loss'],
                ...allBets.map(bet => {
                    const date = bet.createdAt?.toDate() || new Date();
                    const profitLoss = bet.winnings ? bet.winnings - bet.stake : -bet.stake;
                    return [
                        date.toLocaleDateString(),
                        bet.status,
                        bet.betType || 'single',
                        bet.stake || 0,
                        bet.totalOdds || 1,
                        bet.potentialWin || 0,
                        bet.winnings || 0,
                        profitLoss
                    ].join(',');
                })
            ].join('\n');
            
            const blob = new Blob([csvContent], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `bets-${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
            window.URL.revokeObjectURL(url);
            
            showStatus('success', 'Exported', 'Your bets have been exported');
            setTimeout(hideStatus, 3000);
        }

        function showStatus(type, title, message) {
            const statusDisplay = document.getElementById('statusDisplay');
            const statusIcon = document.getElementById('statusIcon');
            const statusTitle = document.getElementById('statusTitle');
            const statusMessage = document.getElementById('statusMessage');
            
            const icons = {
                'loading': '<i class="fas fa-spinner fa-spin text-blue-500"></i>',
                'success': '<i class="fas fa-check-circle text-green-500"></i>',
                'error': '<i class="fas fa-exclamation-circle text-red-500"></i>',
                'warning': '<i class="fas fa-exclamation-triangle text-yellow-500"></i>'
            };
            
            statusIcon.innerHTML = icons[type] || icons['loading'];
            statusTitle.textContent = title;
            statusMessage.textContent = message;
            statusDisplay.classList.remove('hidden');
        }

        function hideStatus() {
            document.getElementById('statusDisplay').classList.add('hidden');
        }

        async function logout() {
            try {
                await auth.signOut();
                window.location.href = 'login.html';
            } catch (error) {
                console.error('Logout error:', error);
            }
        }
    </script>
</body>
</html>
