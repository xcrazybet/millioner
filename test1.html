<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Live Gold & Forex Prices</title>

<style>
body{
    background:#0f172a;
    color:white;
    font-family:Arial, sans-serif;
    text-align:center;
    padding:40px;
}

h1{
    margin-bottom:40px;
}

.container{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:30px;
}
.price-box{
    background:#1e293b;
    padding:20px 30px;
    border-radius:12px;
    width:300px;
    box-shadow:0 0 15px rgba(0,0,0,0.4);
}
h2{
    margin-bottom:15px;
}
</style>
</head>
<body>

<h1>Live Gold & Forex Prices</h1>

<div class="container">

  <!-- GOLD -->
  <div class="price-box">
    <h2>Gold (XAU/USD)</h2>
    <div class="tradingview-widget-container">
      <div class="tradingview-widget-container__widget"></div>
      <script type="text/javascript"
        src="https://s3.tradingview.com/external-embedding/embed-widget-single-quote.js"
        async>
      {
        "symbol": "COMEX:GC1!",
        "width": "100%",
        "colorTheme": "dark",
        "isTransparent": true,
        "locale": "en"
      }
      </script>
    </div>
  </div>

  <!-- FOREX -->
  <div class="price-box">
    <h2>Forex Pairs</h2>
    <div class="tradingview-widget-container">
      <div class="tradingview-widget-container__widget"></div>
      <script type="text/javascript"
        src="https://s3.tradingview.com/external-embedding/embed-widget-market-overview.js"
        async>
      {
        "colorTheme": "dark",
        "dateRange": "1D",
        "showChart": false,
        "locale": "en",
        "isTransparent": true,
        "showSymbolLogo": true,
        "width": "100%",
        "height": "400",
        "symbolsGroups": [
          {
            "name": "Forex",
            "symbols": [
              { "name": "FOREXCOM:EURUSD", "displayName": "EUR/USD" },
              { "name": "FOREXCOM:USDJPY", "displayName": "USD/JPY" },
              { "name": "FOREXCOM:GBPUSD", "displayName": "GBP/USD" },
              { "name": "FOREXCOM:AUDUSD", "displayName": "AUD/USD" },
              { "name": "FOREXCOM:USDCAD", "displayName": "USD/CAD" },
              { "name": "FOREXCOM:USDCHF", "displayName": "USD/CHF" },
              { "name": "FOREXCOM:NZDUSD", "displayName": "NZD/USD" }
            ]
          }
        ]
      }
      </script>
    </div>
  </div>

</div>

</body>
</html>
