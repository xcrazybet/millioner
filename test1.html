<script>
    // ===== THE ODDS API CONFIGURATION =====
    const ODDS_API_KEY = 'pLWGYER9fgPuI00m';
    const ODDS_API_BASE = 'https://api.the-odds-api.com/v4';
    
    // Available sports for football/soccer
    const FOOTBALL_SPORTS = [
        'soccer_epl',           // English Premier League
        'soccer_la_liga',       // Spanish La Liga
        'soccer_serie_a',       // Italian Serie A
        'soccer_bundesliga',    // German Bundesliga
        'soccer_ligue_one',     // French Ligue 1
        'soccer_uefa_champs_league', // Champions League
        'soccer_uefa_europa_league', // Europa League
        'soccer_world_cup',      // World Cup
        'soccer_usa_mls'         // MLS
    ];

    // ===== FETCH MATCHES FROM THE ODDS API =====
    async function fetchMatchesFromOddsAPI() {
        try {
            showToast('Fetching live matches from The Odds API...', 'info');
            
            const matches = [];
            
            // Fetch data for each football league
            for (const sport of FOOTBALL_SPORTS) {
                try {
                    // Get upcoming/active events
                    const response = await fetch(
                        `${ODDS_API_BASE}/sports/${sport}/odds/` +
                        `?apiKey=${ODDS_API_KEY}` +
                        `&regions=uk,us,eu` +
                        `&markets=h2h,totals,btts` +
                        `&oddsFormat=decimal` +
                        `&dateFormat=iso`
                    );
                    
                    if (!response.ok) {
                        console.log(`No data for ${sport}:`, response.status);
                        continue;
                    }
                    
                    const data = await response.json();
                    
                    // Process the matches
                    data.forEach((match, index) => {
                        const processedMatch = processOddsAPIMatch(match, sport);
                        if (processedMatch) {
                            matches.push(processedMatch);
                        }
                    });
                    
                } catch (error) {
                    console.log(`Error fetching ${sport}:`, error);
                }
                
                // Small delay to avoid rate limiting
                await new Promise(resolve => setTimeout(resolve, 100));
            }
            
            // Also fetch live/in-play matches
            try {
                const liveResponse = await fetch(
                    `${ODDS_API_BASE}/sports/upcoming/odds/` +
                    `?apiKey=${ODDS_API_KEY}` +
                    `&regions=uk` +
                    `&markets=h2h,totals` +
                    `&oddsFormat=decimal`
                );
                
                if (liveResponse.ok) {
                    const liveData = await liveResponse.json();
                    liveData.forEach(match => {
                        if (FOOTBALL_SPORTS.includes(match.sport_key)) {
                            const processed = processOddsAPIMatch(match, match.sport_key);
                            if (processed) {
                                processed.isLive = true;
                                processed.status = 'LIVE';
                                processed.minute = `${Math.floor(Math.random() * 90)}'`; // Simulate minute
                                matches.push(processed);
                            }
                        }
                    });
                }
            } catch (error) {
                console.log('Error fetching live matches:', error);
            }
            
            // If no matches from API, use sample data
            if (matches.length === 0) {
                console.log('No matches from API, using sample data');
                gameState.matches = getSampleMatches();
                showToast('Using sample matches (API limited)', 'warning');
            } else {
                gameState.matches = matches;
                showToast(`Loaded ${matches.length} matches from The Odds API`, 'success');
            }
            
            updateMatchesDisplay();
            
        } catch (error) {
            console.error('Error fetching from Odds API:', error);
            showToast('Using sample matches', 'warning');
            gameState.matches = getSampleMatches();
            updateMatchesDisplay();
        }
    }

    // ===== PROCESS ODDS API MATCH DATA =====
    function processOddsAPIMatch(match, sportKey) {
        try {
            // Extract league name from sport key
            const leagueName = formatLeagueName(sportKey);
            
            // Parse commence time
            const commenceTime = new Date(match.commence_time);
            const now = new Date();
            
            // Determine if match is live (in this simulation, we'll mark some as live)
            const isLive = Math.random() < 0.2; // 20% chance for demo
            const isUpcoming = commenceTime > now;
            const isFinished = commenceTime < now && !isLive;
            
            // Extract odds for different markets
            const h2hMarket = match.bookmakers?.[0]?.markets?.find(m => m.key === 'h2h');
            const totalsMarket = match.bookmakers?.[0]?.markets?.find(m => m.key === 'totals');
            const bttsMarket = match.bookmakers?.[0]?.markets?.find(m => m.key === 'btts');
            
            // Process H2H odds
            let homeOdds = 1.90, drawOdds = 3.50, awayOdds = 2.10;
            if (h2hMarket?.outcomes) {
                const homeOutcome = h2hMarket.outcomes.find(o => o.name === match.home_team);
                const awayOutcome = h2hMarket.outcomes.find(o => o.name === match.away_team);
                const drawOutcome = h2hMarket.outcomes.find(o => o.name === 'Draw');
                
                homeOdds = homeOutcome?.price || homeOdds;
                awayOdds = awayOutcome?.price || awayOdds;
                drawOdds = drawOutcome?.price || drawOdds;
            }
            
            // Process Totals odds
            let overOdds = 1.85, underOdds = 1.95, totalLine = '2.5';
            if (totalsMarket?.outcomes) {
                const overOutcome = totalsMarket.outcomes.find(o => o.name === 'Over');
                const underOutcome = totalsMarket.outcomes.find(o => o.name === 'Under');
                
                overOdds = overOutcome?.price || overOdds;
                underOdds = underOutcome?.price || underOdds;
                totalLine = totalsMarket.outcomes[0]?.point?.toString() || '2.5';
            }
            
            // Process BTTS odds
            let yesOdds = 1.80, noOdds = 2.00;
            if (bttsMarket?.outcomes) {
                const yesOutcome = bttsMarket.outcomes.find(o => o.name === 'Yes');
                const noOutcome = bttsMarket.outcomes.find(o => o.name === 'No');
                
                yesOdds = yesOutcome?.price || yesOdds;
                noOdds = noOutcome?.price || noOdds;
            }
            
            // Generate score for live matches
            let score = '0-0';
            if (isLive) {
                const homeGoals = Math.floor(Math.random() * 3);
                const awayGoals = Math.floor(Math.random() * 3);
                score = `${homeGoals}-${awayGoals}`;
            }
            
            return {
                id: `oddsapi_${match.id || Date.now()}_${Math.random()}`,
                homeTeam: match.home_team || 'Home Team',
                awayTeam: match.away_team || 'Away Team',
                league: leagueName,
                country: getCountryFromSport(sportKey),
                status: isLive ? 'LIVE' : (isUpcoming ? 'UPCOMING' : 'FINISHED'),
                score: score,
                minute: isLive ? `${Math.floor(Math.random() * 90)}'` : 'TBD',
                date: commenceTime.toLocaleDateString(),
                time: commenceTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                isLive: isLive,
                isUpcoming: isUpcoming,
                isFinished: isFinished,
                commenceTime: commenceTime,
                source: 'the_odds_api',
                markets: {
                    h2h: {
                        home: homeOdds,
                        draw: drawOdds,
                        away: awayOdds
                    },
                    totals: {
                        over: overOdds,
                        under: underOdds,
                        line: totalLine
                    },
                    btts: {
                        yes: yesOdds,
                        no: noOdds
                    },
                    handicap: {
                        home: homeOdds * 0.95,
                        away: awayOdds * 0.95,
                        line: '+0.5'
                    },
                    double_chance: {
                        '1X': Math.min(homeOdds, drawOdds) * 0.7,
                        '12': Math.min(homeOdds, awayOdds) * 0.8,
                        'X2': Math.min(drawOdds, awayOdds) * 0.7
                    },
                    draw_no_bet: {
                        home: homeOdds * 0.95,
                        away: awayOdds * 0.95
                    }
                }
            };
            
        } catch (error) {
            console.error('Error processing match:', error);
            return null;
        }
    }

    // ===== HELPER FUNCTIONS FOR ODDS API =====
    function formatLeagueName(sportKey) {
        const leagueMap = {
            'soccer_epl': 'Premier League',
            'soccer_la_liga': 'La Liga',
            'soccer_serie_a': 'Serie A',
            'soccer_bundesliga': 'Bundesliga',
            'soccer_ligue_one': 'Ligue 1',
            'soccer_uefa_champs_league': 'Champions League',
            'soccer_uefa_europa_league': 'Europa League',
            'soccer_world_cup': 'World Cup',
            'soccer_usa_mls': 'MLS'
        };
        
        return leagueMap[sportKey] || sportKey.replace('soccer_', '').replace(/_/g, ' ').toUpperCase();
    }

    function getCountryFromSport(sportKey) {
        const countryMap = {
            'soccer_epl': 'England',
            'soccer_la_liga': 'Spain',
            'soccer_serie_a': 'Italy',
            'soccer_bundesliga': 'Germany',
            'soccer_ligue_one': 'France',
            'soccer_uefa_champs_league': 'Europe',
            'soccer_uefa_europa_league': 'Europe',
            'soccer_world_cup': 'International',
            'soccer_usa_mls': 'USA'
        };
        
        return countryMap[sportKey] || 'International';
    }

    // ===== UPDATE INITIALIZATION =====
    // Replace the footballData initialization with Odds API
    async function initializeApp() {
        try {
            // Load sound preference
            const savedSound = localStorage.getItem('xcrazybet_sound');
            gameState.soundsEnabled = savedSound !== 'false';
            updateSoundToggle();
            
            // Check authentication
            auth.onAuthStateChanged(user => {
                if (!user) {
                    showToast('Please login first', 'error');
                    setTimeout(() => {
                        window.location.href = 'https://xcrazybet.github.io/millioner/login.html';
                    }, 2000);
                    return;
                }
                gameState.currentUser = user;
                loadBalance();
                setupBalanceListener();
                loadUserBets();
                loadGameStats();
                loadUserLimits();
                createLeagueSelector();
                setupMarketTabs();
                setupEventListeners();
                setupUniversalRules();
                
                // Fetch matches from The Odds API
                setTimeout(() => {
                    fetchMatchesFromOddsAPI();
                }, 1000);
                
                // Add debug button
                addDebugButton();
            });
        } catch (error) {
            console.error('Initialization error:', error);
            showToast('Initialization failed', 'error');
        }
    }

    // ===== CHECK API KEY VALIDITY =====
    async function checkOddsAPIKey() {
        try {
            const response = await fetch(
                `${ODDS_API_BASE}/sports/?apiKey=${ODDS_API_KEY}`
            );
            
            if (response.ok) {
                const sports = await response.json();
                console.log('✅ API Key is valid! Available sports:', sports.length);
                showToast('Odds API connected successfully', 'success');
                return true;
            } else {
                console.error('❌ API Key may be invalid:', response.status);
                showToast('Odds API connection failed', 'error');
                return false;
            }
        } catch (error) {
            console.error('Error checking API key:', error);
            return false;
        }
    }

    // Call this to verify the API key
    checkOddsAPIKey();
</script>
