<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<title>Live Market Prices</title>

<style>
body{
    background:#0f172a;
    font-family:Arial, sans-serif;
    color:white;
    text-align:center;
    padding:40px;
}
h1{
    margin-bottom:40px;
}
.widget-container{
    margin-bottom:50px;
}
</style>
</head>

<body>

<h1>Live Market Prices</h1>

<!-- Crude Oil WTI -->
<div class="widget-container">
<h2>Crude Oil (WTI)</h2>
<div class="tradingview-widget-container">
  <div class="tradingview-widget-container__widget"></div>
  <script type="text/javascript"
  src="https://s3.tradingview.com/external-embedding/embed-widget-single-quote.js"
  async>
  {
    "symbol": "TVC:USOIL",
    "width": "350",
    "colorTheme": "dark",
    "isTransparent": false,
    "locale": "en"
  }
  </script>
</div>
</div>
