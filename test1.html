<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>X London | Professional Betting Platform</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0A0C12; color: #E8EDF5; overflow-x: hidden; }
        :root {
            --bg-primary: #0A0C12; --bg-card: #141824; --bg-sidebar: #0F1117;
            --border: #252A36; --primary: #2D7AFF; --success: #00D26A;
            --danger: #FF4757; --warning: #FFB800; --text-muted: #8E94A3;
        }
        .header { background: #0F1117; border-bottom: 1px solid var(--border); padding: 12px 0; position: sticky; top: 0; z-index: 100; }
        .header-content { max-width: 1400px; margin: 0 auto; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        .logo { display: flex; align-items: center; gap: 10px; }
        .logo-icon { width: 40px; height: 40px; background: linear-gradient(135deg, var(--primary), #FF3B6F); border-radius: 12px; display: flex; align-items: center; justify-content: center; }
        .logo-text { font-size: 1.3rem; font-weight: 800; background: linear-gradient(135deg, #FFF, var(--primary)); background-clip: text; -webkit-background-clip: text; color: transparent; }
        .balance-card { background: var(--bg-card); border-radius: 16px; padding: 6px 20px; text-align: right; border: 1px solid var(--border); }
        .balance-amount { font-size: 1.3rem; font-weight: 800; color: var(--primary); }
        .user-btn { background: var(--bg-card); border: 1px solid var(--border); border-radius: 40px; padding: 8px 20px; display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .app-layout { max-width: 1400px; margin: 0 auto; padding: 20px; display: grid; grid-template-columns: 1fr 360px; gap: 24px; }
        .filter-tabs { display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; }
        .filter-btn { background: var(--bg-card); border: 1px solid var(--border); padding: 10px 24px; border-radius: 40px; font-weight: 600; cursor: pointer; color: var(--text-muted); }
        .filter-btn.active { background: var(--primary); border-color: var(--primary); color: white; }
        .matches-grid { display: flex; flex-direction: column; gap: 16px; }
        .match-card { background: var(--bg-card); border-radius: 20px; border: 1px solid var(--border); overflow: hidden; transition: all 0.2s; }
        .match-card:hover { border-color: var(--primary); transform: translateY(-2px); }
        .match-header { padding: 12px 16px; background: rgba(0,0,0,0.2); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
        .league-name { font-size: 0.7rem; font-weight: 700; color: var(--primary); }
        .live-badge { background: var(--danger); padding: 4px 12px; border-radius: 30px; font-size: 0.65rem; font-weight: 700; animation: pulse 1.5s infinite; }
        .countdown-badge { background: rgba(45,122,255,0.2); padding: 4px 12px; border-radius: 30px; font-size: 0.7rem; font-weight: 600; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }
        .match-body { padding: 16px; }
        .teams-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .team { flex: 1; display: flex; align-items: center; gap: 10px; }
        .team-away { justify-content: flex-end; }
        .team-logo { width: 44px; height: 44px; background: #1E2432; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; border: 2px solid var(--border); }
        .team-name { font-weight: 700; font-size: 0.85rem; }
        .score-box { text-align: center; min-width: 80px; }
        .score { font-size: 1.5rem; font-weight: 800; }
        .match-time { font-size: 0.65rem; color: var(--text-muted); margin-top: 4px; }
        .odds-section { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
        .odds-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 10px; }
        .odds-btn { background: #1E2432; border: 1px solid var(--border); border-radius: 12px; padding: 10px; text-align: center; cursor: pointer; font-weight: 700; transition: all 0.15s; }
        .odds-btn:hover { background: var(--primary); transform: scale(1.02); }
        .double-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .right-sidebar { position: sticky; top: 80px; height: fit-content; }
        .sidebar-card { background: var(--bg-sidebar); border-radius: 20px; border: 1px solid var(--border); margin-bottom: 20px; overflow: hidden; }
        .card-header { background: linear-gradient(135deg, #1A5CD8, var(--primary)); padding: 14px 18px; font-weight: 800; }
        .bet-items { padding: 16px; max-height: 300px; overflow-y: auto; }
        .bet-item { background: var(--bg-card); border-radius: 12px; padding: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border); }
        .remove-bet { color: var(--danger); cursor: pointer; }
        .bet-summary { padding: 16px; border-top: 1px solid var(--border); }
        .stake-input { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; width: 110px; text-align: right; color: white; }
        .place-bet-btn { width: 100%; background: linear-gradient(135deg, var(--success), #00A856); border: none; padding: 12px; border-radius: 40px; font-weight: 800; cursor: pointer; margin-top: 12px; }
        .view-bets-btn { display: block; text-align: center; background: var(--bg-card); border: 1px solid var(--primary); padding: 10px; border-radius: 40px; margin-top: 12px; text-decoration: none; color: var(--primary); font-weight: 600; }
        .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); }
        .toast-container { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 200; }
        .toast { background: var(--bg-card); border-left: 4px solid var(--primary); border-radius: 12px; padding: 10px 20px; margin-bottom: 8px; }
        @media (max-width: 968px) { .app-layout { grid-template-columns: 1fr; } .right-sidebar { position: static; margin-top: 20px; } .team-logo { width: 36px; height: 36px; } .team-name { font-size: 0.75rem; } .score { font-size: 1.2rem; } }
    </style>
</head>
<body>

<div id="ageModal" style="position:fixed; inset:0; background:rgba(0,0,0,0.95); z-index:1000; display:flex; align-items:center; justify-content:center;">
    <div style="background:#141824; border-radius:24px; padding:32px; max-width:380px; text-align:center;">
        <i class="fas fa-shield-alt" style="font-size:48px; color:var(--primary); margin-bottom:16px;"></i>
        <h2>Age Verification</h2>
        <p style="margin:16px 0; color:var(--text-muted);">You must be 18+ to continue.</p>
        <button onclick="confirmAge()" style="background:var(--primary); border:none; padding:12px 28px; border-radius:40px; font-weight:700; cursor:pointer;">I am 18+</button>
    </div>
</div>

<header class="header">
    <div class="header-content">
        <div class="logo"><div class="logo-icon"><i class="fas fa-crown"></i></div><span class="logo-text">X LONDON</span></div>
        <div style="display:flex; align-items:center; gap:12px;">
            <div class="balance-card"><div style="font-size:0.65rem; color:var(--text-muted);">BALANCE</div><div class="balance-amount" id="userBalance">$0.00</div></div>
            <div class="user-btn" onclick="toggleUserMenu()"><i class="fas fa-user-circle"></i> <span id="userDisplayName">User</span></div>
        </div>
    </div>
</header>

<div class="app-layout">
    <div>
        <div class="filter-tabs">
            <button class="filter-btn active" id="liveBtn" onclick="loadLiveMatches()"><i class="fas fa-fire"></i> LIVE</button>
            <button class="filter-btn" id="upcomingBtn" onclick="loadUpcomingMatches()"><i class="fas fa-calendar"></i> UPCOMING</button>
            <button class="filter-btn" id="finishedBtn" onclick="loadFinishedMatches()"><i class="fas fa-check-circle"></i> FINISHED</button>
            <button class="filter-btn" onclick="refreshData()"><i class="fas fa-sync-alt"></i> Refresh</button>
        </div>
        <div id="matchesContainer" class="matches-grid"><div class="empty-state"><i class="fas fa-spinner fa-spin"></i> Loading matches...</div></div>
    </div>

    <div class="right-sidebar">
        <div class="sidebar-card">
            <div class="card-header"><i class="fas fa-receipt"></i> BET SLIP <span id="betCount" style="background:rgba(255,255,255,0.2); padding:2px 10px; border-radius:30px; margin-left:8px;">0</span></div>
            <div class="bet-items" id="betSlipItems"><div class="empty-state"><i class="fas fa-plus-circle" style="font-size:32px;"></i><p>Tap odds to add</p></div></div>
            <div id="betSummaryPanel" style="display:none;">
                <div class="bet-summary">
                    <div style="display:flex; justify-content:space-between; margin-bottom:12px;"><span style="color:var(--text-muted);">Total Odds</span><span id="totalOdds" style="font-weight:800;">-</span></div>
                    <div style="display:flex; justify-content:space-between; margin-bottom:12px;"><span style="color:var(--text-muted);">Stake ($)</span><input type="number" id="stakeAmount" min="1" step="0.01" value="10.00" class="stake-input"></div>
                    <div style="background:rgba(0,210,106,0.1); border-radius:12px; padding:12px; display:flex; justify-content:space-between;"><span>Potential Win</span><span id="potentialWin" style="color:var(--success); font-weight:800;">$0.00</span></div>
                    <button class="place-bet-btn" onclick="placeBet()">PLACE BET</button>
                </div>
            </div>
            <a href="bets-list.html" class="view-bets-btn"><i class="fas fa-list"></i> VIEW ALL MY BETS</a>
        </div>

        <div class="sidebar-card">
            <div class="card-header" style="background: linear-gradient(135deg, #FF3B6F, #FF6B8A);"><i class="fas fa-chart-line"></i> QUICK STATS</div>
            <div style="display: grid; grid-template-columns: repeat(2,1fr); gap:10px; padding:16px;">
                <div class="stat-card" style="background:var(--bg-card); border-radius:12px; padding:12px; text-align:center;"><div class="stat-value" id="statTotalBets" style="font-size:1.2rem; font-weight:800;">0</div><div style="font-size:0.65rem;">Total Bets</div></div>
                <div class="stat-card" style="background:var(--bg-card); border-radius:12px; padding:12px; text-align:center;"><div class="stat-value" id="statOpenBets" style="font-size:1.2rem; font-weight:800;">0</div><div style="font-size:0.65rem;">Open Bets</div></div>
                <div class="stat-card" style="background:var(--bg-card); border-radius:12px; padding:12px; text-align:center;"><div class="stat-value" id="statProfitLoss" style="font-size:1.2rem; font-weight:800;">$0</div><div style="font-size:0.65rem;">Profit/Loss</div></div>
                <div class="stat-card" style="background:var(--bg-card); border-radius:12px; padding:12px; text-align:center;"><div class="stat-value" id="statWinRate" style="font-size:1.2rem; font-weight:800;">0%</div><div style="font-size:0.65rem;">Win Rate</div></div>
            </div>
        </div>
    </div>
</div>
<div class="toast-container" id="toastContainer"></div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
        authDomain: "x-bet-prod-jd.firebaseapp.com",
        projectId: "x-bet-prod-jd",
        storageBucket: "x-bet-prod-jd.firebasestorage.app",
        messagingSenderId: "499334334535",
        appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
    };
    const API_TOKEN = 'DkFdWG9jFZvH8XSEgLrRfGwczABWVg5rlV25GvIRyN06zdPsOI48Nsv9Wooy';
    let auth, db, currentUser = null, userData = null, bettingSlip = [], currentMatchType = 'live';

    firebase.initializeApp(firebaseConfig);
    auth = firebase.auth();
    db = firebase.firestore();

    function confirmAge() { localStorage.setItem('ageVerified', 'true'); document.getElementById('ageModal').style.display = 'none'; initializeApp(); }
    if (!localStorage.getItem('ageVerified')) document.getElementById('ageModal').style.display = 'flex';
    else { document.getElementById('ageModal').style.display = 'none'; initializeApp(); }

    async function initializeApp() {
        auth.onAuthStateChanged(async (user) => {
            if (!user) { window.location.href = 'login.html'; return; }
            currentUser = user;
            await loadUserData();
            updateUI();
            loadLiveMatches();
            setInterval(() => { if(currentUser) { updateStats(); checkAndSettleFinishedMatches(); } }, 10000);
            setInterval(() => { if(currentMatchType === 'upcoming') updateAllCountdowns(); }, 1000);
        });
    }

    async function loadUserData() {
        try {
            const doc = await db.collection('wallets').doc(currentUser.uid).get();
            if (doc.exists) userData = doc.data();
            else userData = { balance: 1000, username: currentUser.email.split('@')[0] };
            updateBalance();
            updateStats();
        } catch(e) { console.error(e); }
    }
    function updateUI() { document.getElementById('userDisplayName').innerText = userData?.username || currentUser.email.split('@')[0]; }
    function updateBalance() { document.getElementById('userBalance').innerText = `$${(userData?.balance || 0).toFixed(2)}`; }
    function showToast(msg) { let c = document.getElementById('toastContainer'); let t = document.createElement('div'); t.className = 'toast'; t.innerHTML = `<i class="fas fa-check-circle" style="margin-right:8px; color:var(--primary);"></i> ${msg}`; c.appendChild(t); setTimeout(()=>t.remove(),3000); }

    async function fetchAPI(url) { try { const res = await fetch(url, { mode: 'cors' }); if(res.ok) return await res.json(); } catch(e){} return null; }

    async function loadLiveMatches() {
        currentMatchType = 'live'; setActiveFilter('liveBtn');
        let url = `https://api.sportmonks.com/v3/football/livescores?api_token=${API_TOKEN}&include=state;participants;league;scores&per_page=20`;
        let data = await fetchAPI(url);
        if(!data) { let proxy = `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`; data = await fetchAPI(proxy); }
        if(data && data.data) { let live = data.data.filter(m => [2,3,4,5,6].includes(m.state_id)); displayMatches(live, 'live'); }
        else displayMatches([], 'live');
    }

    async function loadUpcomingMatches() {
        currentMatchType = 'upcoming'; setActiveFilter('upcomingBtn');
        let url = `https://api.sportmonks.com/v3/football/fixtures/date/${new Date().toISOString().split('T')[0]}?api_token=${API_TOKEN}&include=participants;state;league;scores&per_page=30`;
        let data = await fetchAPI(url);
        if(!data) { let proxy = `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`; data = await fetchAPI(proxy); }
        if(data && data.data) { let upcoming = data.data.filter(m => [1,45,46].includes(m.state_id)); displayMatches(upcoming, 'upcoming'); }
        else displayMatches([], 'upcoming');
    }

    async function loadFinishedMatches() {
        currentMatchType = 'finished'; setActiveFilter('finishedBtn');
        let url = `https://api.sportmonks.com/v3/football/fixtures/date/${new Date(Date.now()-86400000).toISOString().split('T')[0]}?api_token=${API_TOKEN}&include=participants;state;league;scores&per_page=30`;
        let data = await fetchAPI(url);
        if(!data) { let proxy = `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`; data = await fetchAPI(proxy); }
        if(data && data.data) { let finished = data.data.filter(m => [100,90].includes(m.state_id)); displayMatches(finished, 'finished'); }
        else displayMatches([], 'finished');
    }

    function displayMatches(matches, type) {
        const container = document.getElementById('matchesContainer');
        if(!matches || matches.length === 0) { container.innerHTML = `<div class="empty-state"><i class="fas fa-futbol"></i><p>No ${type} matches</p></div>`; return; }
        container.innerHTML = matches.map(m => createMatchCard(m, type)).join('');
        if(type === 'upcoming') updateAllCountdowns();
    }

    function getCountdown(startTime) {
        let diff = new Date(startTime) - new Date();
        if(diff <= 0) return 'Started';
        let days = Math.floor(diff / 86400000);
        let hours = Math.floor((diff % 86400000) / 3600000);
        let minutes = Math.floor((diff % 3600000) / 60000);
        if(days > 0) return `${days}d ${hours}h`;
        if(hours > 0) return `${hours}h ${minutes}m`;
        return `${minutes}m`;
    }

    function updateAllCountdowns() {
        document.querySelectorAll('.countdown-timer').forEach(el => {
            let start = el.getAttribute('data-start');
            if(start) el.innerText = getCountdown(start);
        });
    }

    function createMatchCard(match, type) {
        let participants = match.participants || [];
        let home = participants.find(p => p.meta?.location === 'home') || participants[0];
        let away = participants.find(p => p.meta?.location === 'away') || participants[1];
        let scores = match.scores || [];
        let homeScore = scores.find(s => s.participant === 'home')?.score || 0;
        let awayScore = scores.find(s => s.participant === 'away')?.score || 0;
        let league = match.league?.name || 'Football';
        let isLive = type === 'live';
        let isFinished = type === 'finished';
        let startTime = match.starting_at;
        let odds = { home: (Math.random()*1.5+1.8).toFixed(2), draw: (Math.random()*1.2+2.8).toFixed(2), away: (Math.random()*1.5+1.8).toFixed(2), over: (Math.random()*0.8+1.6).toFixed(2), under: (Math.random()*0.8+2.0).toFixed(2) };
        
        return `
            <div class="match-card" data-match-id="${match.id}" data-home-team="${home?.name || 'Home'}" data-away-team="${away?.name || 'Away'}" data-home-score="${homeScore}" data-away-score="${awayScore}">
                <div class="match-header">
                    <span class="league-name">${league}</span>
                    ${isLive ? '<span class="live-badge"><i class="fas fa-circle" style="font-size:8px;"></i> LIVE</span>' : ''}
                    ${!isLive && !isFinished && startTime ? `<span class="countdown-badge countdown-timer" data-start="${startTime}">${getCountdown(startTime)}</span>` : ''}
                    ${isFinished ? `<span style="font-size:0.7rem;">FT</span>` : ''}
                </div>
                <div class="match-body">
                    <div class="teams-row">
                        <div class="team"><div class="team-logo">${home?.name?.charAt(0) || 'H'}</div><span class="team-name">${home?.name || 'Home'}</span></div>
                        <div class="score-box"><div class="score">${isLive || isFinished ? `${homeScore} - ${awayScore}` : 'VS'}</div></div>
                        <div class="team team-away"><span class="team-name">${away?.name || 'Away'}</span><div class="team-logo">${away?.name?.charAt(0) || 'A'}</div></div>
                    </div>
                    ${!isFinished ? `
                        <div class="odds-section">
                            <div class="odds-row">
                                <div class="odds-btn" onclick='addToBetSlip(${match.id}, "${home?.name || 'Home'}", "Home Win", ${odds.home}, "${home?.name || 'Home'}", "${away?.name || 'Away'}")'>1 <strong>${odds.home}</strong></div>
                                <div class="odds-btn" onclick='addToBetSlip(${match.id}, "Draw", "Draw", ${odds.draw}, "${home?.name || 'Home'}", "${away?.name || 'Away'}")'>X <strong>${odds.draw}</strong></div>
                                <div class="odds-btn" onclick='addToBetSlip(${match.id}, "${away?.name || 'Away'}", "Away Win", ${odds.away}, "${home?.name || 'Home'}", "${away?.name || 'Away'}")'>2 <strong>${odds.away}</strong></div>
                            </div>
                            <div class="double-row">
                                <div class="odds-btn" onclick='addToBetSlip(${match.id}, "Over 2.5", "Over 2.5", ${odds.over}, "${home?.name || 'Home'}", "${away?.name || 'Away'}")'>Over 2.5 <strong>${odds.over}</strong></div>
                                <div class="odds-btn" onclick='addToBetSlip(${match.id}, "Under 2.5", "Under 2.5", ${odds.under}, "${home?.name || 'Home'}", "${away?.name || 'Away'}")'>Under 2.5 <strong>${odds.under}</strong></div>
                            </div>
                        </div>
                    ` : `<div style="text-align:center; margin-top:16px; color:var(--text-muted);"><i class="fas fa-flag-checkered"></i> Full Time</div>`}
                </div>
            </div>
        `;
    }

    function setActiveFilter(btnId) { document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active')); document.getElementById(btnId)?.classList.add('active'); }
    function refreshData() { if(currentMatchType === 'live') loadLiveMatches(); else if(currentMatchType === 'upcoming') loadUpcomingMatches(); else loadFinishedMatches(); }

    function addToBetSlip(matchId, selection, betType, odds, homeTeam, awayTeam) {
        bettingSlip.push({ matchId, selection, betType, odds: parseFloat(odds), homeTeam, awayTeam, id: Date.now() });
        updateBetSlip();
        showToast(`Added: ${selection} @ ${odds}`);
    }

    function updateBetSlip() {
        let container = document.getElementById('betSlipItems');
        let countSpan = document.getElementById('betCount');
        let summaryPanel = document.getElementById('betSummaryPanel');
        countSpan.innerText = bettingSlip.length;
        if(bettingSlip.length === 0) { container.innerHTML = `<div class="empty-state"><i class="fas fa-plus-circle" style="font-size:32px;"></i><p>Tap odds to add</p></div>`; summaryPanel.style.display = 'none'; return; }
        let html = '', totalOdds = 1;
        bettingSlip.forEach((bet, idx) => { totalOdds *= bet.odds; html += `<div class="bet-item"><div><div style="font-weight:700;">${bet.selection}</div><div style="font-size:0.7rem;">${bet.betType} @ ${bet.odds}</div></div><span class="remove-bet" onclick="removeFromBetSlip(${idx})"><i class="fas fa-trash-alt"></i></span></div>`; });
        container.innerHTML = html;
        summaryPanel.style.display = 'block';
        document.getElementById('totalOdds').innerText = totalOdds.toFixed(2);
        updatePotentialWin();
    }

    function removeFromBetSlip(index) { bettingSlip.splice(index,1); updateBetSlip(); }
    function updatePotentialWin() { let stake = parseFloat(document.getElementById('stakeAmount').value)||0; let total = parseFloat(document.getElementById('totalOdds').innerText)||1; document.getElementById('potentialWin').innerText = `$${(stake*total).toFixed(2)}`; }

    async function placeBet() {
        if(bettingSlip.length === 0) { showToast('No selections'); return; }
        let stake = parseFloat(document.getElementById('stakeAmount').value);
        if(stake < 1) { showToast('Minimum $1'); return; }
        if(stake > (userData?.balance || 0)) { showToast('Insufficient balance'); return; }
        let totalOdds = parseFloat(document.getElementById('totalOdds').innerText);
        let win = stake * totalOdds;
        if(!confirm(`Place $${stake} to win $${win.toFixed(2)}?`)) return;
        try {
            let betId = `bet_${Date.now()}_${Math.random().toString(36).substr(2,6)}`;
            await db.collection('bets').doc(betId).set({
                betId, userId: currentUser.uid, selections: [...bettingSlip], stake, totalOdds, potentialWin: win,
                status: 'pending', createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                matchIds: [...new Set(bettingSlip.map(b => b.matchId))]
            });
            let newBalance = (userData?.balance || 0) - stake;
            await db.collection('wallets').doc(currentUser.uid).update({ balance: newBalance });
            userData.balance = newBalance;
            updateBalance();
            bettingSlip = [];
            updateBetSlip();
            showToast(`Bet placed! $${stake} to win $${win.toFixed(2)}`);
            updateStats();
        } catch(e) { showToast('Failed to place bet'); }
    }

    async function updateStats() {
        try {
            let betsSnap = await db.collection('bets').where('userId','==',currentUser.uid).get();
            let bets = betsSnap.docs.map(d=>d.data());
            let open = bets.filter(b=>b.status==='pending').length;
            document.getElementById('statTotalBets').innerText = bets.length;
            document.getElementById('statOpenBets').innerText = open;
            let profit = bets.reduce((acc,b)=>{ if(b.status==='won') return acc+(b.potentialWin-b.stake); if(b.status==='lost') return acc-b.stake; return acc; },0);
            document.getElementById('statProfitLoss').innerHTML = `$${profit.toFixed(2)}`;
            let won = bets.filter(b=>b.status==='won').length;
            let winRate = bets.length ? ((won/bets.length)*100).toFixed(1) : 0;
            document.getElementById('statWinRate').innerText = `${winRate}%`;
        } catch(e) {}
    }

    async function checkAndSettleFinishedMatches() {
        try {
            let url = `https://api.sportmonks.com/v3/football/fixtures/date/${new Date(Date.now()-86400000).toISOString().split('T')[0]}?api_token=${API_TOKEN}&include=participants;scores&per_page=50`;
            let data = await fetchAPI(url);
            if(!data) { let proxy = `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`; data = await fetchAPI(proxy); }
            if(!data || !data.data) return;
            
            let finishedMatches = data.data.filter(m => [100,90].includes(m.state_id));
            let pendingBetsSnap = await db.collection('bets').where('userId','==',currentUser.uid).where('status','==','pending').get();
            
            for(let betDoc of pendingBetsSnap.docs) {
                let bet = betDoc.data();
                let allSettled = true;
                let betWon = true;
                let totalPayout = 0;
                
                for(let selection of bet.selections) {
                    let match = finishedMatches.find(m => m.id == selection.matchId);
                    if(!match) { allSettled = false; break; }
                    
                    let participants = match.participants || [];
                    let home = participants.find(p => p.meta?.location === 'home') || participants[0];
                    let away = participants.find(p => p.meta?.location === 'away') || participants[1];
                    let scores = match.scores || [];
                    let homeScore = scores.find(s => s.participant === 'home')?.score || 0;
                    let awayScore = scores.find(s => s.participant === 'away')?.score || 0;
                    let totalGoals = homeScore + awayScore;
                    let selectionWon = false;
                    
                    if(selection.betType === 'Home Win') selectionWon = (homeScore > awayScore);
                    else if(selection.betType === 'Away Win') selectionWon = (awayScore > homeScore);
                    else if(selection.betType === 'Draw') selectionWon = (homeScore === awayScore);
                    else if(selection.betType === 'Over 2.5') selectionWon = (totalGoals > 2.5);
                    else if(selection.betType === 'Under 2.5') selectionWon = (totalGoals < 2.5);
                    
                    if(!selectionWon) betWon = false;
                }
                
                if(allSettled) {
                    let newStatus = betWon ? 'won' : 'lost';
                    await db.collection('bets').doc(betDoc.id).update({ status: newStatus, settledAt: firebase.firestore.FieldValue.serverTimestamp() });
                    
                    if(betWon) {
                        let newBalance = (userData?.balance || 0) + bet.potentialWin;
                        await db.collection('wallets').doc(currentUser.uid).update({ balance: newBalance });
                        userData.balance = newBalance;
                        updateBalance();
                        showToast(`🎉 Bet won! +$${bet.potentialWin.toFixed(2)} added to your balance`);
                    } else {
                        showToast(`❌ Bet lost: ${bet.selections[0]?.selection || 'Selection'} did not win`);
                    }
                }
            }
            updateStats();
        } catch(e) { console.error('Settlement error:', e); }
    }

    function toggleUserMenu() { showToast(`Logged in as ${currentUser?.email}`); }
    async function logout() { await auth.signOut(); window.location.href = 'login.html'; }
    document.getElementById('stakeAmount')?.addEventListener('input', updatePotentialWin);
</script>
