<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>X London Betting Platform - Live Sports Betting</title>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary: #00ff9d;
            --primary-dark: #00cc7d;
            --secondary: #ff9800;
            --danger: #ff4757;
            --success: #4caf50;
            --warning: #ffc107;
            --bg-dark: #0a0f1a;
            --bg-surface: #111827;
            --bg-surface-light: #1a2332;
            --text: #ffffff;
            --text-dim: #94a3b8;
            --border: #1e293b;
        }
        
        body {
            background: var(--bg-dark);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding-bottom: 70px;
        }
        
        /* Header */
        .header {
            background: var(--bg-surface);
            padding: 12px 16px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 2px solid var(--primary);
        }
        
        /* Match Cards */
        .match-card {
            background: var(--bg-surface);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            transition: all 0.3s;
            border-left: 4px solid var(--primary);
        }
        
        .match-card:hover {
            transform: translateX(5px);
            background: var(--bg-surface-light);
        }
        
        .match-card.disabled {
            opacity: 0.6;
            border-left-color: var(--text-dim);
        }
        
        /* Odds Buttons */
        .odds-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 10px 16px;
            border-radius: 30px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
        }
        
        .odds-btn:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        
        .odds-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        /* Live Indicator */
        .live-indicator {
            background: var(--danger);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        /* Countdown Timer */
        .countdown {
            background: var(--secondary);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
        }
        
        .countdown.closed {
            background: var(--danger);
        }
        
        /* Score Display */
        .score-display {
            font-size: 28px;
            font-weight: bold;
            background: rgba(0,0,0,0.5);
            padding: 8px 20px;
            border-radius: 12px;
            display: inline-block;
        }
        
        .score-updated {
            animation: scoreFlash 0.5s ease;
        }
        
        @keyframes scoreFlash {
            0%, 100% { transform: scale(1); color: white; }
            50% { transform: scale(1.2); color: var(--primary); }
        }
        
        /* Bet Slip */
        .bet-slip {
            background: var(--bg-surface);
            border-radius: 16px;
            position: sticky;
            top: 80px;
        }
        
        .bet-slip-item {
            background: var(--bg-surface-light);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 8px;
        }
        
        /* Bet Type Buttons */
        .bet-type-btn {
            padding: 8px 16px;
            background: var(--bg-surface-light);
            border: 1px solid var(--border);
            border-radius: 30px;
            color: var(--text-dim);
            cursor: pointer;
            transition: all 0.2s;
            font-size: 12px;
        }
        
        .bet-type-btn.active {
            background: var(--primary);
            color: #000;
            border-color: var(--primary);
        }
        
        /* Toast */
        .toast {
            position: fixed;
            bottom: 80px;
            left: 16px;
            right: 16px;
            background: var(--bg-surface);
            padding: 14px;
            border-radius: 12px;
            border-left: 4px solid var(--primary);
            z-index: 1000;
            animation: slideUp 0.3s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        
        @keyframes slideUp {
            from {
                transform: translateY(100%);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        /* Mobile Navigation */
        .mobile-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-surface);
            display: flex;
            justify-content: space-around;
            padding: 8px 16px 12px;
            border-top: 2px solid var(--primary);
            z-index: 100;
        }
        
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--text-dim);
            font-size: 10px;
            gap: 4px;
        }
        
        .nav-item.active {
            color: var(--primary);
        }
        
        .nav-item i {
            font-size: 20px;
        }
        
        /* Loading Spinner */
        .loading-spinner {
            border: 3px solid var(--bg-surface-light);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        
        ::-webkit-scrollbar-track {
            background: var(--bg-surface);
        }
        
        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }
        
        /* Goal Notification */
        .goal-notification {
            position: fixed;
            top: 80px;
            right: 16px;
            background: linear-gradient(135deg, var(--success), var(--primary-dark));
            color: white;
            padding: 12px 20px;
            border-radius: 12px;
            z-index: 1000;
            animation: slideInRight 0.3s ease;
            font-weight: bold;
        }
        
        @keyframes slideInRight {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .score-display {
                font-size: 20px;
                padding: 4px 12px;
            }
            
            .odds-btn {
                padding: 8px 12px;
                font-size: 12px;
            }
            
            .bet-type-btn {
                padding: 6px 12px;
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-4">
                <h1 class="text-xl font-bold" style="color: var(--primary);">

            <!-- Left Column - Matches -->
            <div class="lg:col-span-2">

                <div class="flex gap-2 mb-4 overflow-x-auto pb-2">

                    <button onclick="loadMatches('upcoming')" id="filterUpcoming" class="filter-btn px-4 py-2 rounded-full text-sm font-semibold" style="background: var(--bg-surface); color: var(--text-dim);">
                        <i class="fas fa-calendar mr-1"></i> UPCOMING
                    </button>
                    <button onclick="loadMatches('finished')" id="filterFinished" class="filter-btn px-4 py-2 rounded-full text-sm font-semibold" style="background: var(--bg-surface); color: var(--text-dim);">

                    </button>
                    <button onclick="refreshData()" class="px-4 py-2 rounded-full text-sm font-semibold" style="background: var(--bg-surface); color: var(--text-dim);">

                </div>
                
                <!-- Matches Container -->
                <div id="matchesContainer">
                    <div class="loading-spinner"></div>

            </div>
            
            <!-- Right Column - Bet Slip -->
            <div class="lg:col-span-1">
                <div class="bet-slip p-4">
                    <h2 class="text-lg font-bold mb-4" style="color: var(--primary);">
                        <i class="fas fa-receipt mr-2"></i>Bet Slip
                        <span id="betCount" class="ml-2 px-2 py-1 rounded-full text-xs" style="background: var(--primary); color: #000;">0</span>
                    </h2>
                    
                    <!-- Bet Type Selector -->
                    <div class="flex flex-wrap gap-2 mb-4">
                        <button onclick="selectBetType('single')" class="bet-type-btn active" data-type="single">Single</button>
                        <button onclick="selectBetType('double')" class="bet-type-btn" data-type="double">Double</button>
                        <button onclick="selectBetType('treble')" class="bet-type-btn" data-type="treble">Treble</button>
                        <button onclick="selectBetType('accumulator')" class="bet-type-btn" data-type="accumulator">Accumulator</button>
                        <button onclick="selectBetType('system')" class="bet-type-btn" data-type="system">System 2/3</button>
                    </div>
                    
                    <!-- Bet Slip Content -->
                    <div id="betSlipContent" class="max-h-96 overflow-y-auto mb-4">
                        <div class="text-center py-8 text-gray-400">
                            <i class="fas fa-plus-circle text-4xl mb-2"></i>
                            <p class="text-sm">Click odds to add selections</p>
                        </div>
                    </div>
                    
                    <!-- Bet Summary -->
                    <div id="betSummary" style="display: none;">
                        <div class="border-t border-gray-700 pt-4 space-y-3">
                            <div class="flex justify-between">
                                <span class="text-gray-400">Total Odds:</span>
                                <span id="totalOdds" class="font-bold" style="color: var(--primary);">0.00</span>
                            </div>
                            <div class="flex justify-between items-center">
                                <span class="text-gray-400">Stake ($):</span>
                                <input type="number" id="stakeAmount" value="10" min="1" step="1" 
                                       class="w-32 px-3 py-2 rounded-lg text-right font-bold" 
                                       style="background: var(--bg-surface-light); border: 1px solid var(--border); color: white;">
                            </div>
                            <div class="flex justify-between items-center pt-2">
                                <span class="text-gray-400">Potential Win:</span>
                                <span id="potentialWin" class="text-xl font-bold" style="color: var(--success);">$0.00</span>
                            </div>
                            <button onclick="placeBet()" id="placeBetBtn" 
                                    class="w-full py-3 rounded-xl font-bold transition"
                                    style="background: var(--primary); color: #000;">
                                <i class="fas fa-check-circle mr-2"></i>PLACE BET
                            </button>
                        </div>
                    </div>
                </div>
                
                <!-- Finished Matches Preview -->
                <div class="mt-6 p-4 rounded-lg" style="background: var(--bg-surface);">
                    <h3 class="font-bold mb-3 text-sm">
                        <i class="fas fa-history mr-2" style="color: var(--primary);"></i>Recent Finished (24h)
                    </h3>
                    <div id="finishedPreview" class="space-y-2 max-h-64 overflow-y-auto">
                        <div class="text-center text-gray-400 text-sm">Loading...</div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    
    <!-- Mobile Navigation -->
    <nav class="mobile-nav">
        <a href="betting.html" class="nav-item active">
            <i class="fas fa-futbol"></i>
            <span>Football</span>
        </a>
        <a href="bets.html" class="nav-item">
            <i class="fas fa-ticket-alt"></i>
            <span>My Bets</span>
        </a>
        <a href="index.html" class="nav-item">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>
        <a href="#" class="nav-item">
            <i class="fas fa-chart-line"></i>
            <span>Stats</span>
        </a>
        <a href="dashboard.html" class="nav-item">
            <i class="fas fa-wallet"></i>
            <span>Wallet</span>
        </a>
    </nav>
    
    <!-- Toast Container -->
    <div id="toastContainer"></div>
    
    <script>
        // ============================================
        // FIREBASE CONFIGURATION
        // ============================================
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        
        // ============================================
        // GLOBAL VARIABLES
        // ============================================
        let currentUser = null;
        let userBalance = 0;
        let bettingSlip = [];
        let currentBetType = 'single';
        let currentFilter = 'live';
        let liveMatches = [];
        let scoreUpdateInterval = null;
        let allMatches = [];
        
        // API Configuration
        const API_TOKEN = 'DkFdWG9jFZvH8XSEgLrRfGwczABWVg5rlV25GvIRyN06zdPsOI48Nsv9Wooy';
        
        // ============================================
        // AUTHENTICATION
        // ============================================
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                currentUser = user;
                await loadUserBalance();
                await loadMatches('live');
                startScoreUpdates();
                await loadFinishedMatchesPreview();
                console.log('✅ User authenticated:', user.email);
            } else {
                window.location.href = 'login.html';
            }
        });
        
        // ============================================
        // LOAD USER BALANCE
        // ============================================
        async function loadUserBalance() {
            try {
                const doc = await db.collection('wallets').doc(currentUser.uid).get();
                if (doc.exists) {
                    userBalance = doc.data().balance || 0;
                    document.getElementById('balance').textContent = `$${userBalance.toFixed(2)}`;
                } else {
                    await db.collection('wallets').doc(currentUser.uid).set({ balance: 100 });
                    userBalance = 100;
                    document.getElementById('balance').textContent = '$100.00';
                }
            } catch (error) {
                console.error('Balance error:', error);
                showToast('Failed to load balance', 'error');
            }
        }
        
        // ============================================
        // UPDATE BALANCE DISPLAY
        // ============================================
        async function updateBalance(amount) {
            userBalance = amount;
            document.getElementById('balance').textContent = `$${userBalance.toFixed(2)}`;
        }
        
        // ============================================
        // LOAD MATCHES BASED ON FILTER
        // ============================================
        async function loadMatches(filter) {
            currentFilter = filter;
            
            // Update active button
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.style.background = 'var(--bg-surface)';
                btn.style.color = 'var(--text-dim)';
            });
            const activeBtn = document.getElementById(`filter${filter.charAt(0).toUpperCase() + filter.slice(1)}`);
            if (activeBtn) {
                activeBtn.style.background = 'var(--primary)';
                activeBtn.style.color = '#000';
            }
            
            const container = document.getElementById('matchesContainer');
            container.innerHTML = '<div class="loading-spinner"></div><div class="text-center text-gray-400">Loading matches...</div>';
            
            try {
                let matches = [];
                
                if (filter === 'live') {
                    matches = await fetchLiveMatches();
                } else if (filter === 'upcoming') {
                    matches = await fetchUpcomingMatches();
                } else if (filter === 'finished') {
                    matches = await fetchFinishedMatches();
                }
                
                allMatches = matches;
                displayMatches(matches, filter);
                
            } catch (error) {
                console.error('Load matches error:', error);
                container.innerHTML = `
                    <div class="text-center py-8 text-gray-400">
                        <i class="fas fa-exclamation-circle text-4xl mb-2"></i>
                        <p>Failed to load matches</p>
                        <button onclick="loadMatches('${filter}')" class="mt-4 px-4 py-2 rounded-lg" style="background: var(--primary); color: #000;">RETRY</button>
                    </div>
                `;
            }
        }
        
        // ============================================
        // FETCH LIVE MATCHES FROM API
        // ============================================
        async function fetchLiveMatches() {
            try {
                const response = await fetch(`https://api.sportmonks.com/v3/football/livescores?api_token=${API_TOKEN}&include=participants;state;scores&per_page=20`);
                if (response.ok) {
                    const data = await response.json();
                    return data.data || [];
                }
            } catch (error) {
                console.log('API fetch failed, using sample data');
            }
            return generateSampleMatches('live');
        }
        
        // ============================================
        // FETCH UPCOMING MATCHES
        // ============================================
        async function fetchUpcomingMatches() {
            try {
                const today = new Date().toISOString().split('T')[0];
                const response = await fetch(`https://api.sportmonks.com/v3/football/fixtures/date/${today}?api_token=${API_TOKEN}&include=participants;state&per_page=20`);
                if (response.ok) {
                    const data = await response.json();
                    return data.data || [];
                }
            } catch (error) {
                console.log('API fetch failed, using sample data');
            }
            return generateSampleMatches('upcoming');
        }
        
        // ============================================
        // FETCH FINISHED MATCHES (LAST 24 HOURS)
        // ============================================
        async function fetchFinishedMatches() {
            try {
                // Try to get from Firestore cache first
                const twentyFourHoursAgo = new Date(Date.now() - 24 * 60 * 60 * 1000);
                const cachedSnapshot = await db.collection('finishedMatches')
                    .where('finishedAt', '>=', twentyFourHoursAgo)
                    .orderBy('finishedAt', 'desc')
                    .limit(20)
                    .get();
                
                if (!cachedSnapshot.empty) {
                    return cachedSnapshot.docs.map(doc => doc.data());
                }
                
                // If no cache, try API
                const yesterday = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString().split('T')[0];
                const response = await fetch(`https://api.sportmonks.com/v3/football/fixtures/date/${yesterday}?api_token=${API_TOKEN}&include=participants;scores&per_page=20`);
                if (response.ok) {
                    const data = await response.json();
                    const finished = (data.data || []).filter(m => m.state_id === 100);
                    
                    // Cache to Firestore
                    for (const match of finished) {
                        await db.collection('finishedMatches').doc(`match_${match.id}`).set({
                            ...match,
                            finishedAt: new Date(match.starting_at),
                            cachedAt: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    }
                    
                    return finished;
                }
            } catch (error) {
                console.log('Error fetching finished matches:', error);
            }
            return generateSampleMatches('finished');
        }
        
        // ============================================
        // GENERATE SAMPLE MATCHES (FALLBACK)
        // ============================================
        function generateSampleMatches(type) {
            const teams = [
                ['Chelsea', 'Arsenal'],
                ['Manchester United', 'Liverpool'],
                ['Real Madrid', 'Barcelona'],
                ['Bayern Munich', 'Borussia Dortmund'],
                ['PSG', 'Marseille'],
                ['Juventus', 'AC Milan'],
                ['Manchester City', 'Tottenham']
            ];
            
            const matches = [];
            const now = new Date();
            
            for (let i = 0; i < 7; i++) {
                const homeTeam = teams[i % teams.length][0];
                const awayTeam = teams[i % teams.length][1];
                
                let state_id = 1; // Not started
                let homeScore = 0;
                let awayScore = 0;
                let minute = null;
                
                if (type === 'live') {
                    state_id = 2; // 1st half
                    homeScore = Math.floor(Math.random() * 3);
                    awayScore = Math.floor(Math.random() * 3);
                    minute = Math.floor(Math.random() * 45) + 1;
                } else if (type === 'finished') {
                    state_id = 100;
                    homeScore = Math.floor(Math.random() * 5);
                    awayScore = Math.floor(Math.random() * 5);
                }
                
                const startTime = new Date(now.getTime() + (i - 3) * 60 * 60 * 1000);
                
                matches.push({
                    id: i + 1000,
                    state_id: state_id,
                    starting_at: startTime.toISOString(),
                    minute: minute,
                    participants: [
                        { id: i * 2 + 1, name: homeTeam, meta: { location: 'home' } },
                        { id: i * 2 + 2, name: awayTeam, meta: { location: 'away' } }
                    ],
                    scores: type !== 'upcoming' ? [
                        { participant: 'home', score: homeScore },
                        { participant: 'away', score: awayScore }
                    ] : [],
                    league: { name: ['Premier League', 'La Liga', 'Bundesliga', 'Serie A'][i % 4] }
                });
            }
            
            return matches;
        }
        
        // ============================================
        // DISPLAY MATCHES
        // ============================================
        function displayMatches(matches, type) {
            const container = document.getElementById('matchesContainer');
            
            if (!matches || matches.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-8 text-gray-400">
                        <i class="fas fa-info-circle text-4xl mb-2"></i>
                        <p>No ${type} matches available</p>
                    </div>
                `;
                return;
            }
            
            let html = '';
            
            matches.forEach(match => {
                const participants = match.participants || [];
                const homeTeam = participants.find(p => p.meta?.location === 'home') || participants[0];
                const awayTeam = participants.find(p => p.meta?.location === 'away') || participants[1];
                
                // Get scores
                let homeScore = 0;
                let awayScore = 0;
                const scores = match.scores || [];
                
                if (scores.length > 0) {
                    const homeScoreObj = scores.find(s => s.participant === 'home');
                    const awayScoreObj = scores.find(s => s.participant === 'away');
                    homeScore = homeScoreObj?.score || 0;
                    awayScore = awayScoreObj?.score || 0;
                }
                
                const startTime = new Date(match.starting_at);
                const now = new Date();
                const isLive = type === 'live';
                const isFinished = type === 'finished';
                const isUpcoming = type === 'upcoming';
                
                // Check if betting is allowed (only for upcoming matches not started)
                const canBet = isUpcoming && match.state_id === 1 && startTime > now;
                const timeRemaining = canBet ? getTimeRemaining(startTime) : null;
                const bettingClosed = isUpcoming && !canBet;
                
                // Random odds
                const homeOdds = (1.8 + Math.random() * 1.5).toFixed(2);
                const drawOdds = (3.0 + Math.random() * 1).toFixed(2);
                const awayOdds = (2.0 + Math.random() * 2).toFixed(2);
                
                html += `
                    <div class="match-card ${!canBet && isUpcoming ? 'disabled' : ''}" data-match-id="${match.id}" data-home="${homeTeam?.name}" data-away="${awayTeam?.name}">
                        <div class="flex justify-between items-center mb-3">
                            <div class="flex items-center gap-2">
                                <span class="text-xs px-2 py-1 rounded" style="background: var(--bg-surface-light);">${match.league?.name || 'Football'}</span>
                                ${isLive ? `<span class="live-indicator"><i class="fas fa-circle mr-1"></i> LIVE ${match.minute ? match.minute + "'" : ''}</span>` : ''}
                                ${isUpcoming && canBet ? `<span class="countdown"><i class="far fa-clock mr-1"></i> ${timeRemaining}</span>` : ''}
                                ${isUpcoming && bettingClosed ? `<span class="countdown closed"><i class="fas fa-lock mr-1"></i> BETTING CLOSED</span>` : ''}
                                ${isFinished ? `<span class="text-xs" style="color: var(--success);"><i class="fas fa-check-circle mr-1"></i> FINISHED</span>` : ''}
                            </div>
                            <div class="text-xs text-gray-400">
                                ${startTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
                            </div>
                        </div>
                        
                        <div class="flex items-center justify-between">
                            <div class="flex-1 text-center">
                                <div class="font-bold text-sm">${homeTeam?.name || 'Home'}</div>
                            </div>
                            <div class="mx-4">
                                ${isLive || isFinished ? 
                                    `<div class="score-display" data-match="${match.id}">${homeScore} - ${awayScore}</div>` : 
                                    `<div class="text-xl font-bold text-gray-500">VS</div>`
                                }
                            </div>
                            <div class="flex-1 text-center">
                                <div class="font-bold text-sm">${awayTeam?.name || 'Away'}</div>
                            </div>
                        </div>
                        
                        ${!isFinished && canBet ? `
                            <div class="grid grid-cols-3 gap-2 mt-4">
                                <button onclick="addToBetSlip('${match.id}', '${homeTeam?.name}', 'Home Win', ${homeOdds})" class="odds-btn">
                                    Home<br><span class="text-lg">${homeOdds}</span>
                                </button>
                                <button onclick="addToBetSlip('${match.id}', 'Draw', 'Draw', ${drawOdds})" class="odds-btn">
                                    Draw<br><span class="text-lg">${drawOdds}</span>
                                </button>
                                <button onclick="addToBetSlip('${match.id}', '${awayTeam?.name}', 'Away Win', ${awayOdds})" class="odds-btn">
                                    Away<br><span class="text-lg">${awayOdds}</span>
                                </button>
                            </div>
                        ` : isFinished ? `
                            <div class="text-center mt-4 text-gray-400 text-sm">
                                <i class="fas fa-flag-checkered mr-1"></i> Final Score: ${homeScore} - ${awayScore}
                            </div>
                        ` : !canBet && isUpcoming ? `
                            <div class="text-center mt-4 text-gray-500 text-sm">
                                <i class="fas fa-hourglass-end mr-1"></i> Betting closed
                            </div>
                        ` : ''}
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }
        
        // ============================================
        // GET TIME REMAINING FOR BETTING
        // ============================================
        function getTimeRemaining(startTime) {
            const diff = startTime - new Date();
            if (diff <= 0) return 'Closed';
            
            const hours = Math.floor(diff / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            
            if (hours > 0) return `${hours}h ${minutes}m`;
            return `${minutes}m`;
        }
        
        // ============================================
        // START LIVE SCORE UPDATES (EVERY 4 SECONDS)
        // ============================================
        function startScoreUpdates() {
            if (scoreUpdateInterval) clearInterval(scoreUpdateInterval);
            
            scoreUpdateInterval = setInterval(async () => {
                if (currentFilter === 'live') {
                    await updateLiveScores();
                }
            }, 4000);
        }
        
        // ============================================
        // UPDATE LIVE SCORES
        // ============================================
        async function updateLiveScores() {
            try {
                const response = await fetch(`https://api.sportmonks.com/v3/football/livescores?api_token=${API_TOKEN}&include=scores`);
                if (response.ok) {
                    const data = await response.json();
                    const liveMatches = data.data || [];
                    
                    for (const match of liveMatches) {
                        const scores = match.scores || [];
                        let homeScore = 0;
                        let awayScore = 0;
                        
                        if (scores.length > 0) {
                            const homeScoreObj = scores.find(s => s.participant === 'home');
                            const awayScoreObj = scores.find(s => s.participant === 'away');
                            homeScore = homeScoreObj?.score || 0;
                            awayScore = awayScoreObj?.score || 0;
                        }
                        
                        // Update score display
                        const scoreElement = document.querySelector(`.score-display[data-match="${match.id}"]`);
                        if (scoreElement) {
                            const oldScore = scoreElement.textContent;
                            const newScore = `${homeScore} - ${awayScore}`;
                            
                            if (oldScore !== newScore) {
                                scoreElement.textContent = newScore;
                                scoreElement.classList.add('score-updated');
                                setTimeout(() => scoreElement.classList.remove('score-updated'), 500);
                                
                                // Show goal notification
                                showGoalNotification(match, newScore);
                                
                                // Check if match finished
                                if (match.state_id === 100) {
                                    await settleMatchBets(match);
                                }
                            }
                        }
                    }
                }
            } catch (error) {
                console.log('Score update error:', error);
            }
        }
        
        // ============================================
        // SHOW GOAL NOTIFICATION
        // ============================================
        function showGoalNotification(match, score) {
            const participants = match.participants || [];
            const homeTeam = participants[0]?.name || 'Home';
            const awayTeam = participants[1]?.name || 'Away';
            
            const notification = document.createElement('div');
            notification.className = 'goal-notification';
            notification.innerHTML = `
                <i class="fas fa-futbol mr-2"></i>
                <strong>GOAL!</strong> ${homeTeam} ${score} ${awayTeam}
            `;
            document.body.appendChild(notification);
            
            setTimeout(() => notification.remove(), 3000);
        }
        
        // ============================================
        // SETTLE MATCH BETS (AUTO WIN/LOSS)
        // ============================================
        async function settleMatchBets(match) {
            const scores = match.scores || [];
            let homeScore = 0, awayScore = 0;
            
            const homeScoreObj = scores.find(s => s.participant === 'home');
            const awayScoreObj = scores.find(s => s.participant === 'away');
            homeScore = homeScoreObj?.score || 0;
            awayScore = awayScoreObj?.score || 0;
            
            let result = '';
            if (homeScore > awayScore) result = 'Home Win';
            else if (awayScore > homeScore) result = 'Away Win';
            else result = 'Draw';
            
            // Find all pending bets on this match
            const betsSnapshot = await db.collection('bets')
                .where('status', '==', 'pending')
                .get();
            
            for (const betDoc of betsSnapshot.docs) {
                const bet = betDoc.data();
                const selections = bet.selections || [];
                
                let allSettled = true;
                let betWon = false;
                
                for (const selection of selections) {
                    if (selection.matchId == match.id) {
                        // This bet is on this match
                        if (selection.selection === result) {
                            betWon = true;
                        } else {
                            betWon = false;
                        }
                        break;
                    }
                }
                
                // Update bet status
                const newStatus = betWon ? 'won' : 'lost';
                await db.collection('bets').doc(betDoc.id).update({
                    status: newStatus,
                    settledAt: firebase.firestore.FieldValue.serverTimestamp(),
                    finalScore: `${homeScore}-${awayScore}`
                });
                
                // Add winnings to user balance if won
                if (betWon) {
                    const userRef = db.collection('wallets').doc(bet.userId);
                    const userDoc = await userRef.get();
                    const currentBalance = userDoc.data()?.balance || 0;
                    await userRef.update({
                        balance: currentBalance + (bet.potentialWin || 0)
                    });
                    
                    showToast(`🎉 You won $${(bet.potentialWin || 0).toFixed(2)} on ${match.participants?.[0]?.name} vs ${match.participants?.[1]?.name}!`, 'success');
                }
            }
            
            // Store finished match
            await db.collection('finishedMatches').doc(`match_${match.id}`).set({
                ...match,
                finishedAt: firebase.firestore.FieldValue.serverTimestamp(),
                finalScore: `${homeScore}-${awayScore}`,
                result: result
            });
        }
        
        // ============================================
        // ADD TO BET SLIP
        // ============================================
        function addToBetSlip(matchId, teamName, selection, odds) {
            // Check if already in slip
            if (bettingSlip.some(b => b.matchId === matchId && b.selection === selection)) {
                showToast('Already in bet slip', 'warning');
                return;
            }
            
            bettingSlip.push({
                id: Date.now() + Math.random(),
                matchId: matchId,
                teamName: teamName,
                selection: selection,
                odds: parseFloat(odds)
            });
            
            updateBetSlip();
            showToast(`Added ${teamName} - ${selection} @ ${odds}`, 'success');
        }
        
        // ============================================
        // REMOVE FROM BET SLIP
        // ============================================
        function removeFromBetSlip(id) {
            bettingSlip = bettingSlip.filter(b => b.id !== id);
            updateBetSlip();
        }
        
        // ============================================
        // UPDATE BET SLIP DISPLAY
        // ============================================
        function updateBetSlip() {
            const container = document.getElementById('betSlipContent');
            const betCount = document.getElementById('betCount');
            const betSummary = document.getElementById('betSummary');
            
            betCount.textContent = bettingSlip.length;
            
            if (bettingSlip.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-8 text-gray-400">
                        <i class="fas fa-plus-circle text-4xl mb-2"></i>
                        <p class="text-sm">Click odds to add selections</p>
                    </div>
                `;
                betSummary.style.display = 'none';
                return;
            }
            
            let html = '';
            bettingSlip.forEach(bet => {
                html += `
                    <div class="bet-slip-item">
                        <div class="flex justify-between items-start">
                            <div class="flex-1">
                                <div class="font-semibold text-sm">${bet.teamName}</div>
                                <div class="text-xs text-gray-400">${bet.selection}</div>
                                <div class="text-xs" style="color: var(--primary);">Odds: ${bet.odds.toFixed(2)}</div>
                            </div>
                            <button onclick="removeFromBetSlip(${bet.id})" class="text-gray-400 hover:text-red-500">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
            betSummary.style.display = 'block';
            
            // Calculate and display totals
            updateBetTotals();
        }
        
        // ============================================
        // SELECT BET TYPE
        // ============================================
        function selectBetType(type) {
            currentBetType = type;
            
            document.querySelectorAll('.bet-type-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.type === type) {
                    btn.classList.add('active');
                }
            });
            
            updateBetTotals();
        }
        
        // ============================================
        // UPDATE BET TOTALS BASED ON BET TYPE
        // ============================================
        function updateBetTotals() {
            const stake = parseFloat(document.getElementById('stakeAmount').value) || 0;
            let totalOdds = 0;
            let potentialWin = 0;
            
            if (bettingSlip.length === 0) {
                document.getElementById('totalOdds').textContent = '0.00';
                document.getElementById('potentialWin').textContent = '$0.00';
                return;
            }
            
            switch (currentBetType) {
                case 'single':
                    totalOdds = bettingSlip[0]?.odds || 0;
                    potentialWin = stake * totalOdds;
                    break;
                    
                case 'double':
                    if (bettingSlip.length >= 2) {
                        totalOdds = bettingSlip[0].odds * bettingSlip[1].odds;
                        potentialWin = stake * totalOdds;
                    } else {
                        totalOdds = 0;
                        potentialWin = 0;
                        showToast('Need 2 selections for Double', 'warning');
                    }
                    break;
                    
                case 'treble':
                    if (bettingSlip.length >= 3) {
                        totalOdds = bettingSlip[0].odds * bettingSlip[1].odds * bettingSlip[2].odds;
                        potentialWin = stake * totalOdds;
                    } else {
                        totalOdds = 0;
                        potentialWin = 0;
                        showToast('Need 3 selections for Treble', 'warning');
                    }
                    break;
                    
                case 'accumulator':
                    if (bettingSlip.length >= 4) {
                        totalOdds = bettingSlip.reduce((acc, bet) => acc * bet.odds, 1);
                        potentialWin = stake * totalOdds;
                    } else {
                        totalOdds = 0;
                        potentialWin = 0;
                        showToast('Need 4+ selections for Accumulator', 'warning');
                    }
                    break;
                    
                case 'system':
                    // System 2/3 - all possible doubles from 3 selections
                    if (bettingSlip.length === 3) {
                        const combinations = [
                            [bettingSlip[0], bettingSlip[1]],
                            [bettingSlip[0], bettingSlip[2]],
                            [bettingSlip[1], bettingSlip[2]]
                        ];
                        
                        let totalReturn = 0;
                        combinations.forEach(combo => {
                            const comboOdds = combo[0].odds * combo[1].odds;
                            totalReturn += stake * comboOdds;
                        });
                        
                        potentialWin = totalReturn;
                        totalOdds = potentialWin / stake;
                    } else {
                        totalOdds = 0;
                        potentialWin = 0;
                        showToast('System 2/3 requires exactly 3 selections', 'warning');
                    }
                    break;
            }
            
            document.getElementById('totalOdds').textContent = totalOdds.toFixed(2);
            document.getElementById('potentialWin').textContent = `$${potentialWin.toFixed(2)}`;
        }
        
        // ============================================
        // PLACE BET
        // ============================================
        async function placeBet() {
            if (!currentUser) {
                showToast('Please login first', 'error');
                return;
            }
            
            if (bettingSlip.length === 0) {
                showToast('Add selections to bet slip', 'warning');
                return;
            }
            
            const stake = parseFloat(document.getElementById('stakeAmount').value);
            if (isNaN(stake) || stake <= 0) {
                showToast('Enter valid stake amount', 'warning');
                return;
            }
            
            if (stake > userBalance) {
                showToast('Insufficient balance', 'error');
                return;
            }
            
            // Validate bet type requirements
            let isValid = true;
            switch (currentBetType) {
                case 'double':
                    if (bettingSlip.length < 2) isValid = false;
                    break;
                case 'treble':
                    if (bettingSlip.length < 3) isValid = false;
                    break;
                case 'accumulator':
                    if (bettingSlip.length < 4) isValid = false;
                    break;
                case 'system':
                    if (bettingSlip.length !== 3) isValid = false;
                    break;
            }
            
            if (!isValid) {
                showToast(`Invalid number of selections for ${currentBetType}`, 'error');
                return;
            }
            
            const totalOdds = parseFloat(document.getElementById('totalOdds').textContent);
            const potentialWin = parseFloat(document.getElementById('potentialWin').textContent.replace('$', ''));
            
            try {
                // Deduct balance
                const newBalance = userBalance - stake;
                await db.collection('wallets').doc(currentUser.uid).update({
                    balance: newBalance
                });
                await updateBalance(newBalance);
                
                // Save bet to Firestore
                const betData = {
                    userId: currentUser.uid,
                    selections: bettingSlip.map(b => ({
                        matchId: b.matchId,
                        teamName: b.teamName,
                        selection: b.selection,
                        odds: b.odds
                    })),
                    stake: stake,
                    totalOdds: totalOdds,
                    potentialWin: potentialWin,
                    betType: currentBetType,
                    status: 'pending',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                };
                
                await db.collection('bets').add(betData);
                
                // Clear bet slip
                bettingSlip = [];
                updateBetSlip();
                
                showToast(`Bet placed! Potential win: $${potentialWin.toFixed(2)}`, 'success');
                
            } catch (error) {
                console.error('Place bet error:', error);
                showToast('Failed to place bet', 'error');
            }
        }
        
        // ============================================
        // LOAD FINISHED MATCHES PREVIEW
        // ============================================
        async function loadFinishedMatchesPreview() {
            const container = document.getElementById('finishedPreview');
            
            try {
                const twentyFourHoursAgo = new Date(Date.now() - 24 * 60 * 60 * 1000);
                const snapshot = await db.collection('finishedMatches')
                    .where('finishedAt', '>=', twentyFourHoursAgo)
                    .orderBy('finishedAt', 'desc')
                    .limit(5)
                    .get();
                
                if (snapshot.empty) {
                    container.innerHTML = '<div class="text-center text-gray-400 text-sm">No finished matches in last 24h</div>';
                    return;
                }
                
                let html = '';
                snapshot.forEach(doc => {
                    const match = doc.data();
                    const participants = match.participants || [];
                    const homeTeam = participants[0]?.name || 'Home';
                    const awayTeam = participants[1]?.name || 'Away';
                    const finalScore = match.finalScore || '0-0';
                    
                    html += `
                        <div class="p-2 rounded-lg" style="background: var(--bg-surface-light);">
                            <div class="flex justify-between text-sm">
                                <span>${homeTeam}</span>
                                <span class="font-bold" style="color: var(--primary);">${finalScore}</span>
                                <span>${awayTeam}</span>
                            </div>
                        </div>
                    `;
                });
                
                container.innerHTML = html;
                
            } catch (error) {
                console.error('Finished preview error:', error);
                container.innerHTML = '<div class="text-center text-gray-400 text-sm">Unable to load</div>';
            }
        }
        
        // ============================================
        // REFRESH DATA
        // ============================================
        function refreshData() {
            loadMatches(currentFilter);
            loadFinishedMatchesPreview();
            showToast('Refreshing data...', 'info');
        }
        
        // ============================================
        // SHOW TOAST NOTIFICATION
        // ============================================
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast';
            
            const colors = {
                success: '#4caf50',
                error: '#ff4757',
                warning: '#ff9800',
                info: '#00ff9d'
            };
            
            toast.style.borderLeftColor = colors[type] || colors.info;
            toast.innerHTML = `
                <div class="flex items-center gap-2">
                    <i class="fas ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle'}"></i>
                    <span>${message}</span>
                </div>
            `;
            
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
        
        // ============================================
        // STAKE INPUT EVENT
        // ============================================
        document.addEventListener('DOMContentLoaded', () => {
            const stakeInput = document.getElementById('stakeAmount');
            if (stakeInput) {
                stakeInput.addEventListener('input', () => updateBetTotals());
            }
        });
    </script>
</body>
</html>
