<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSONP Enhanced Betting Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes pulse-live {
            0%, 100% { background-color: rgb(239, 68, 68); }
            50% { background-color: rgb(220, 38, 38); }
        }
        .live-indicator {
            animation: pulse-live 2s infinite;
        }
        .match-card {
            transition: all 0.3s ease;
        }
        .match-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .time-display {
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>
<body class="bg-gray-100 p-4">
    <div class="max-w-6xl mx-auto">
        <h1 class="text-3xl font-bold text-center mb-8 text-blue-600">🏆 JSONP Enhanced Betting Platform</h1>
        
        <!-- Status Display -->
        <div id="status" class="bg-white p-4 rounded-lg shadow mb-6">
            <h2 class="text-xl font-semibold mb-2">API Status</h2>
            <div id="statusContent" class="text-gray-600">Initializing...</div>
        </div>
        
        <!-- Tab Navigation -->
        <div class="bg-white rounded-lg shadow mb-6">
            <div class="flex border-b">
                <button onclick="switchTab('live')" class="tab-btn flex-1 py-3 px-4 font-semibold text-center hover:bg-gray-50 transition border-b-2 border-red-500 text-red-600" data-tab="live">
                    <i class="fas fa-broadcast-tower mr-2"></i>🔥 Live <span id="liveCount" class="bg-red-500 text-white px-2 py-1 rounded-full text-xs">0</span>
                </button>
                <button onclick="switchTab('upcoming')" class="tab-btn flex-1 py-3 px-4 font-semibold text-center hover:bg-gray-50 transition border-b-2 border-transparent" data-tab="upcoming">
                    <i class="fas fa-calendar-alt mr-2"></i>📅 Upcoming <span id="upcomingCount" class="bg-blue-500 text-white px-2 py-1 rounded-full text-xs">0</span>
                </button>
                <button onclick="switchTab('finished')" class="tab-btn flex-1 py-3 px-4 font-semibold text-center hover:bg-gray-50 transition border-b-2 border-transparent" data-tab="finished">
                    <i class="fas fa-flag-checkered mr-2"></i>🏁 Finished <span id="finishedCount" class="bg-green-500 text-white px-2 py-1 rounded-full text-xs">0</span>
                </button>
            </div>
        </div>
        
        <!-- Match Display -->
        <div id="matches" class="bg-white p-4 rounded-lg shadow">
            <h2 class="text-xl font-semibold mb-4" id="matchesTitle">Matches</h2>
            <div id="matchesContent" class="space-y-4">
                <div class="text-center py-8 text-gray-500">Ready to load matches...</div>
            </div>
        </div>
        
        <!-- Controls -->
        <div class="mt-6 bg-white p-4 rounded-lg shadow">
            <div class="flex flex-wrap gap-2">
                <button onclick="testAPI()" class="bg-purple-500 text-white px-4 py-2 rounded hover:bg-purple-600">
                    <i class="fas fa-vial mr-2"></i>🧪 Test API
                </button>
                <button onclick="loadLiveMatches()" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600">
                    <i class="fas fa-fire mr-2"></i>🔥 Live Matches
                </button>
                <button onclick="loadUpcomingMatches()" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
                    <i class="fas fa-calendar mr-2"></i>📅 Upcoming
                </button>
                <button onclick="loadFinishedMatches()" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">
                    <i class="fas fa-flag mr-2"></i>🏁 Finished
                </button>
                <button onclick="loadAllMatches()" class="bg-indigo-500 text-white px-4 py-2 rounded hover:bg-indigo-600">
                    <i class="fas fa-sync mr-2"></i>🔄 Load All
                </button>
            </div>
        </div>
        
        <!-- Alternative Methods -->
        <div class="mt-6 bg-yellow-50 p-4 rounded-lg border border-yellow-200">
            <h3 class="font-semibold text-yellow-800 mb-2">🔄 Alternative Methods</h3>
            <div class="flex flex-wrap gap-2">
                <button onclick="tryServerMethod()" class="bg-indigo-500 text-white px-3 py-1 rounded text-sm hover:bg-indigo-600">
                    🖥️ Local Server
                </button>
                <button onclick="trySampleData()" class="bg-orange-500 text-white px-3 py-1 rounded text-sm hover:bg-orange-600">
                    📊 Sample Data
                </button>
                <button onclick="toggleAutoUpdate()" id="autoUpdateBtn" class="bg-green-500 text-white px-3 py-1 rounded text-sm hover:bg-green-600">
                    ⏱️ Auto Update: OFF
                </button>
            </div>
        </div>
    </div>

    <script>
        const API_TOKEN = 'DkFdWG9jFZvH8XSEgLrRfGwczABWVg5rlV25GvIRyN06zdPsOI48Nsv9Wooy';
        
        // Global state
        let currentTab = 'live';
        let autoUpdateEnabled = false;
        let updateIntervalId = null;
        let matchData = {
            live: [],
            upcoming: [],
            finished: []
        };
        
        // Update status
        function updateStatus(message, type = 'info') {
            const statusContent = document.getElementById('statusContent');
            const colors = {
                'success': 'text-green-600',
                'error': 'text-red-600',
                'warning': 'text-yellow-600',
                'info': 'text-blue-600'
            };
            
            statusContent.className = colors[type] || 'text-gray-600';
            statusContent.innerHTML = message;
        }
        
        // Tab switching
        function switchTab(tab) {
            currentTab = tab;
            
            // Update tab buttons
            document.querySelectorAll('.tab-btn').forEach(btn => {
                if (btn.dataset.tab === tab) {
                    btn.classList.add('border-red-500', 'text-red-600');
                    btn.classList.remove('border-transparent');
                } else {
                    btn.classList.remove('border-red-500', 'text-red-600');
                    btn.classList.add('border-transparent');
                }
            });
            
            // Update title
            const titles = {
                'live': '🔥 Live Matches',
                'upcoming': '📅 Upcoming Matches',
                'finished': '🏁 Finished Matches'
            };
            document.getElementById('matchesTitle').textContent = titles[tab] || 'Matches';
            
            // Display cached data
            displayMatches(matchData[tab], tab.charAt(0).toUpperCase() + tab.slice(1));
        }
        
        // Auto update toggle
        function toggleAutoUpdate() {
            autoUpdateEnabled = !autoUpdateEnabled;
            const btn = document.getElementById('autoUpdateBtn');
            
            if (autoUpdateEnabled) {
                startAutoUpdate();
                btn.innerHTML = '⏱️ Auto Update: ON';
                btn.className = 'bg-red-500 text-white px-3 py-1 rounded text-sm hover:bg-red-600';
                updateStatus('✅ Auto updates enabled (every 30 seconds)', 'success');
            } else {
                stopAutoUpdate();
                btn.innerHTML = '⏱️ Auto Update: OFF';
                btn.className = 'bg-green-500 text-white px-3 py-1 rounded text-sm hover:bg-green-600';
                updateStatus('⏸️ Auto updates disabled', 'warning');
            }
        }
        
        function startAutoUpdate() {
            if (updateIntervalId) clearInterval(updateIntervalId);
            updateIntervalId = setInterval(() => {
                if (autoUpdateEnabled) {
                    loadAllMatches(true);
                }
            }, 30000); // 30 seconds
        }
        
        function stopAutoUpdate() {
            if (updateIntervalId) {
                clearInterval(updateIntervalId);
                updateIntervalId = null;
            }
        }
        
        // Update counts
        function updateCounts() {
            document.getElementById('liveCount').textContent = matchData.live.length;
            document.getElementById('upcomingCount').textContent = matchData.upcoming.length;
            document.getElementById('finishedCount').textContent = matchData.finished.length;
        }
        
        // Display matches with enhanced display
        function displayMatches(matches, title) {
            const matchesContent = document.getElementById('matchesContent');
            
            if (!matches || matches.length === 0) {
                matchesContent.innerHTML = `
                    <div class="text-center py-8 text-gray-500">
                        <div class="text-2xl mb-2">📋</div>
                        <div>No ${title} matches found</div>
                        <div class="text-sm mt-2">Try sample data or check connection</div>
                    </div>
                `;
                return;
            }
            
            let html = `<div class="text-lg font-semibold mb-4">${matches.length} ${title} matches found</div>`;
            
            matches.slice(0, 10).forEach(match => {
                const participants = match.participants || [];
                const homeTeam = participants.find(p => p.meta?.location === 'home') || participants[0];
                const awayTeam = participants.find(p => p.meta?.location === 'away') || participants[1];
                const scores = match.scores || {};
                const homeScore = scores.home_score || 0;
                const awayScore = scores.away_score || 0;
                const league = match.league || {};
                const state = match.state || {};
                
                const timeDisplay = getTimeDisplay(match, title.toLowerCase());
                const isLive = title.toLowerCase() === 'live';
                
                html += `
                    <div class="match-card border rounded-lg p-4 hover:bg-gray-50">
                        <div class="flex justify-between items-center mb-2">
                            <div class="flex items-center space-x-3">
                                ${isLive ? '<span class="live-indicator text-white px-3 py-1 rounded-full text-xs font-bold">LIVE</span>' : ''}
                                <span class="text-sm text-gray-600">${league.name || 'League'}</span>
                            </div>
                            <div class="text-right">
                                <div class="text-sm font-semibold text-gray-700">${timeDisplay.text}</div>
                                <div class="text-xs text-gray-500">${timeDisplay.subtext}</div>
                            </div>
                        </div>
                        
                        <div class="flex justify-between items-center mb-3">
                            <div class="flex-1 text-center">
                                <div class="font-bold text-lg mb-2">${homeTeam?.name || 'Home Team'}</div>
                                ${isLive ? `<div class="text-3xl font-bold text-blue-600 time-display">${homeScore}</div>` : ''}
                                ${!isLive && title.toLowerCase() === 'upcoming' ? '<div class="text-gray-400">-</div>' : ''}
                                ${!isLive && title.toLowerCase() === 'finished' ? `<div class="text-2xl font-bold text-gray-600">${homeScore}</div>` : ''}
                            </div>
                            <div class="px-6">
                                <div class="text-gray-400 font-semibold">VS</div>
                                ${isLive && timeDisplay.minute ? `<div class="text-xs text-center mt-1 text-red-600 font-bold">${timeDisplay.minute}</div>` : ''}
                            </div>
                            <div class="flex-1 text-center">
                                <div class="font-bold text-lg mb-2">${awayTeam?.name || 'Away Team'}</div>
                                ${isLive ? `<div class="text-3xl font-bold text-blue-600 time-display">${awayScore}</div>` : ''}
                                ${!isLive && title.toLowerCase() === 'upcoming' ? '<div class="text-gray-400">-</div>' : ''}
                                ${!isLive && title.toLowerCase() === 'finished' ? `<div class="text-2xl font-bold text-gray-600">${awayScore}</div>` : ''}
                            </div>
                        </div>
                        
                        ${isLive ? `
                            <div class="border-t pt-2">
                                <div class="flex justify-between items-center text-sm text-gray-600">
                                    <span><i class="fas fa-clock mr-1"></i>Started: ${formatTime(match.starting_at)}</span>
                                    <span>State: ${state.name || 'Live'}</span>
                                </div>
                            </div>
                        ` : ''}
                        
                        ${title.toLowerCase() === 'upcoming' ? `
                            <div class="border-t pt-2">
                                <div class="flex justify-between items-center text-sm text-gray-600">
                                    <span><i class="fas fa-calendar mr-1"></i>${formatDate(match.starting_at)}</span>
                                    <span><i class="fas fa-clock mr-1"></i>${formatTime(match.starting_at)}</span>
                                </div>
                            </div>
                        ` : ''}
                        
                        ${title.toLowerCase() === 'finished' ? `
                            <div class="border-t pt-2">
                                <div class="flex justify-between items-center text-sm text-gray-600">
                                    <span><i class="fas fa-flag-checkered mr-1"></i>Finished</span>
                                    <span>${formatDate(match.starting_at)}</span>
                                </div>
                            </div>
                        ` : `}
                        
                        <div class="mt-3 grid grid-cols-3 gap-2">
                            <button class="bg-blue-50 hover:bg-blue-100 text-blue-700 py-2 px-3 rounded-lg font-semibold text-sm transition">
                                1<br>2.45
                            </button>
                            <button class="bg-gray-50 hover:bg-gray-100 text-gray-700 py-2 px-3 rounded-lg font-semibold text-sm transition">
                                X<br>3.20
                            </button>
                            <button class="bg-blue-50 hover:bg-blue-100 text-blue-700 py-2 px-3 rounded-lg font-semibold text-sm transition">
                                2<br>2.80
                            </button>
                        </div>
                    </div>
                `;
            });
            
            matchesContent.innerHTML = html;
        }
        
        // Get time display based on match type
        function getTimeDisplay(match, type) {
            if (type === 'live') {
                const state = match.state || {};
                const minute = state.minute;
                
                if (minute) {
                    if (minute <= 45) {
                        return { text: `${minute}'`, subtext: 'First Half', minute: minute + "'" };
                    } else if (minute <= 50) {
                        return { text: 'HT', subtext: 'Half Time' };
                    } else if (minute <= 90) {
                        return { text: `${minute}'`, subtext: 'Second Half', minute: minute + "'" };
                    } else {
                        return { text: `${minute}'`, subtext: 'Added Time', minute: minute + "'" };
                    }
                }
                
                return { text: 'LIVE', subtext: 'In Progress' };
            }
            
            if (type === 'upcoming') {
                const date = new Date(match.starting_at);
                const now = new Date();
                const diffMs = date - now;
                const diffHours = Math.floor(diffMs / (1000 * 60 * 60));
                const diffDays = Math.floor(diffHours / 24);
                
                if (diffDays > 0) {
                    return { text: `In ${diffDays} day${diffDays > 1 ? 's' : ''}`, subtext: date.toLocaleDateString() };
                } else if (diffHours > 0) {
                    return { text: `In ${diffHours} hour${diffHours > 1 ? 's' : ''}`, subtext: date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) };
                } else {
                    return { text: 'Starting Soon', subtext: date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) };
                }
            }
            
            if (type === 'finished') {
                return { text: 'FT', subtext: formatDate(match.starting_at) };
            }
            
            return { text: 'N/A', subtext: '' };
        }
        
        // Format time
        function formatTime(timeString) {
            if (!timeString) return 'Time TBD';
            return new Date(timeString).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }
        
        // Format date
        function formatDate(timeString) {
            if (!timeString) return 'Date TBD';
            return new Date(timeString).toLocaleDateString();
        }
        
        // Method 1: Try direct fetch with different headers
        async function tryDirectFetch(url) {
            try {
                updateStatus('Trying direct fetch...', 'info');
                
                const response = await fetch(url, {
                    method: 'GET',
                    mode: 'cors',
                    headers: {
                        'Access-Control-Allow-Origin': '*',
                        'Content-Type': 'application/json'
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    updateStatus('✅ Direct fetch worked!', 'success');
                    return data;
                }
            } catch (error) {
                updateStatus('❌ Direct fetch failed: ' + error.message, 'error');
            }
            return null;
        }
        
        // Method 2: Try using a public CORS proxy that might work
        async function tryPublicProxy(url) {
            try {
                updateStatus('Trying public CORS proxy...', 'info');
                
                const proxyUrl = 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(url);
                
                const response = await fetch(proxyUrl);
                if (response.ok) {
                    const data = await response.json();
                    updateStatus('✅ Public proxy worked!', 'success');
                    return data;
                }
            } catch (error) {
                updateStatus('❌ Public proxy failed: ' + error.message, 'error');
            }
            return null;
        }
        
        // Enhanced API call function
        async function callAPI(url) {
            // Try direct fetch first
            let data = await tryDirectFetch(url);
            if (data) return data;
            
            // Try public proxy
            data = await tryPublicProxy(url);
            if (data) return data;
            
            return null;
        }
        
        // Load all matches
        async function loadAllMatches(isAutoUpdate = false) {
            if (!isAutoUpdate) updateStatus('Loading all match types...', 'info');
            
            await Promise.all([
                loadLiveMatches(true),
                loadUpcomingMatches(true),
                loadFinishedMatches(true)
            ]);
            
            updateCounts();
            if (!isAutoUpdate) {
                updateStatus('✅ All matches loaded!', 'success');
            }
        }
        
        // Load live matches
        async function loadLiveMatches(silent = false) {
            if (!silent) updateStatus('Loading live matches...', 'info');
            
            // Try inplay first
            let url = `https://api.sportmonks.com/v3/football/livescores/inplay?api_token=${API_TOKEN}&include=state;participants;league;scores&per_page=15`;
            let data = await callAPI(url);
            
            if (!data || !data.data || data.data.length === 0) {
                // Fallback to general livescores
                url = `https://api.sportmonks.com/v3/football/livescores?api_token=${API_TOKEN}&include=state;participants;league;scores&per_page=15`;
                data = await callAPI(url);
                
                if (data && data.data) {
                    data.data = data.data.filter(match => [2, 3, 4, 5, 6].includes(match.state_id));
                }
            }
            
            matchData.live = data?.data || [];
            if (!silent) {
                displayMatches(matchData.live, 'Live');
            }
        }
        
        // Load upcoming matches - ENHANCED
        async function loadUpcomingMatches(silent = false) {
            if (!silent) updateStatus('Loading upcoming matches...', 'info');
            
            const today = new Date().toISOString().split('T')[0];
            const tomorrow = new Date(Date.now() + 24 * 60 * 60 * 1000).toISOString().split('T')[0];
            const nextWeek = new Date(Date.now() + 7 * 24 * 60 * 60 * 1000).toISOString().split('T')[0];
            
            // Try today first
            let url = `https://api.sportmonks.com/v3/football/fixtures/date/${today}?api_token=${API_TOKEN}&include=participants;state;league;scores&per_page=20`;
            let data = await callAPI(url);
            
            if (!data || !data.data || data.data.length === 0) {
                // Try tomorrow
                url = `https://api.sportmonks.com/v3/football/fixtures/date/${tomorrow}?api_token=${API_TOKEN}&include=participants;state;league;scores&per_page=20`;
                data = await callAPI(url);
            }
            
            if (!data || !data.data || data.data.length === 0) {
                // Try next week range
                url = `https://api.sportmonks.com/v3/football/fixtures/between/${today}/${nextWeek}?api_token=${API_TOKEN}&include=participants;state;league;scores&per_page=30`;
                data = await callAPI(url);
            }
            
            if (data && data.data) {
                const upcoming = data.data.filter(match => [1, 45, 46].includes(match.state_id))
                    .sort((a, b) => new Date(a.starting_at) - new Date(b.starting_at));
                matchData.upcoming = upcoming;
            } else {
                matchData.upcoming = [];
            }
            
            if (!silent) {
                displayMatches(matchData.upcoming, 'Upcoming');
            }
        }
        
        // Load finished matches - ENHANCED
        async function loadFinishedMatches(silent = false) {
            if (!silent) updateStatus('Loading finished matches...', 'info');
            
            const yesterday = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString().split('T')[0];
            const lastWeek = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000).toISOString().split('T')[0];
            
            // Try yesterday first
            let url = `https://api.sportmonks.com/v3/football/fixtures/date/${yesterday}?api_token=${API_TOKEN}&include=participants;state;league;scores&per_page=20`;
            let data = await callAPI(url);
            
            if (!data || !data.data || data.data.length === 0) {
                // Try general fixtures
                url = `https://api.sportmonks.com/v3/football/fixtures?api_token=${API_TOKEN}&include=participants;state;league;scores&per_page=30`;
                data = await callAPI(url);
            }
            
            if (!data || !data.data || data.data.length === 0) {
                // Try last week range
                url = `https://api.sportmonks.com/v3/football/fixtures/between/${lastWeek}/${yesterday}?api_token=${API_TOKEN}&include=participants;state;league;scores&per_page=40`;
                data = await callAPI(url);
            }
            
            if (data && data.data) {
                const finished = data.data.filter(match => [100, 90, 5].includes(match.state_id))
                    .sort((a, b) => new Date(b.starting_at) - new Date(a.starting_at))
                    .slice(0, 20);
                matchData.finished = finished;
            } else {
                matchData.finished = [];
            }
            
            if (!silent) {
                displayMatches(matchData.finished, 'Finished');
            }
        }
        
        // Test API
        async function testAPI() {
            updateStatus('Testing all methods...', 'info');
            
            const url = `https://api.sportmonks.com/v3/football/livescores?api_token=${API_TOKEN}&include=state;participants;league;scores&per_page=5`;
            let data = await callAPI(url);
            
            if (data) {
                displayMatches(data.data, 'Test');
                updateStatus('✅ API working!', 'success');
            } else {
                updateStatus('❌ All API methods failed. Try local server or sample data.', 'error');
            }
        }
        
        // Try server method
        function tryServerMethod() {
            updateStatus('📋 Instructions for Local Server:', 'info');
            document.getElementById('matchesContent').innerHTML = `
                <div class="bg-blue-50 p-6 rounded-lg">
                    <h3 class="font-bold text-blue-800 mb-4">🖥️ Local Server Instructions</h3>
                    <div class="space-y-3 text-blue-700">
                        <p><strong>Step 1:</strong> Open PowerShell/CMD as Administrator</p>
                        <p><strong>Step 2:</strong> Run: <code class="bg-blue-100 px-2 py-1 rounded">Set-ExecutionPolicy RemoteSigned</code></p>
                        <p><strong>Step 3:</strong> Navigate to your project folder</p>
                        <p><strong>Step 4:</strong> Run: <code class="bg-blue-100 px-2 py-1 rounded">npm install</code></p>
                        <p><strong>Step 5:</strong> Run: <code class="bg-blue-100 px-2 py-1 rounded">node server.js</code></p>
                        <p><strong>Step 6:</strong> Open: <code class="bg-blue-100 px-2 py-1 rounded">http://localhost:3000</code></p>
                    </div>
                    <div class="mt-4 p-3 bg-yellow-100 rounded">
                        <p class="text-yellow-800 text-sm">💡 The local server method (betting-server.html) is guaranteed to work as it bypasses all browser restrictions.</p>
                    </div>
                </div>
            `;
        }
        
        // Try sample data
        function trySampleData() {
            updateStatus('📊 Loading sample data for demo...', 'success');
            
            const sampleLive = [
                {
                    id: 1,
                    state_id: 2,
                    state: { name: 'Live', minute: 23 },
                    starting_at: new Date().toISOString(),
                    league: { name: 'Premier League' },
                    participants: [
                        { name: 'Manchester United', meta: { location: 'home' } },
                        { name: 'Liverpool', meta: { location: 'away' } }
                    ],
                    scores: { home_score: 2, away_score: 1 }
                },
                {
                    id: 2,
                    state_id: 2,
                    state: { name: 'Live', minute: 67 },
                    starting_at: new Date().toISOString(),
                    league: { name: 'La Liga' },
                    participants: [
                        { name: 'Real Madrid', meta: { location: 'home' } },
                        { name: 'Barcelona', meta: { location: 'away' } }
                    ],
                    scores: { home_score: 1, away_score: 1 }
                }
            ];
