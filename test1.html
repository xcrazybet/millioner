<!DOCTYPE html>
<html>
<head>
    <title>Live Gold Price</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 100px;
            background: #111;
            color: white;
        }
        #price {
            font-size: 40px;
            font-weight: bold;
        }
        .up { color: #00ff88; }
        .down { color: #ff4444; }
    </style>
</head>
<body>

    <h1>Live Gold Price (XAU/USD)</h1>
    <div id="price">Loading...</div>

<script>
let lastPrice = null;

async function getGoldPrice() {
    try {
        // Free public gold price API
        const response = await fetch("https://api.gold-api.com/price/XAU");
        const data = await response.json();

        const priceElement = document.getElementById("price");
        const currentPrice = data.price;

        if (lastPrice !== null) {
            if (currentPrice > lastPrice) {
                priceElement.className = "up";
            } else if (currentPrice < lastPrice) {
                priceElement.className = "down";
            }
        }

        priceElement.innerHTML = "$ " + currentPrice.toFixed(2);
        lastPrice = currentPrice;

    } catch (error) {
        console.log("Error fetching gold price:", error);
    }
}

// Update every 5 seconds
getGoldPrice();
setInterval(getGoldPrice, 5000);
</script>

</body>
</html>
