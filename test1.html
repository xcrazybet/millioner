<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XCrazyFX · Professional Forex Trading</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- TradingView Widgets -->
    <script src="https://s3.tradingview.com/tv.js"></script>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        /* ----- ROOT VARIABLES (BRITISH ENGLISH THEME) ----- */
        :root {
            --primary: #00ff9d;
            --primary-dark: #00cc7a;
            --secondary: #ff9800;
            --secondary-dark: #cc7a00;
            --danger: #ff5252;
            --success: #4caf50;
            --warning: #ffc107;
            --bg: #0a0f1a;
            --surface: #111827;
            --surface-light: #1a2332;
            --text: #ffffff;
            --text-dim: #a0a8c9;
            --grid-bg: linear-gradient(135deg, #0f2b1a 0%, #1a1a2e 100%);
            --up: #00ff9d;
            --down: #ff5252;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Roboto', system-ui, -apple-system, sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ----- HEADER (INTEGRATED NAVIGATION) ----- */
        .header {
            background: rgba(17, 24, 39, 0.98);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid var(--primary);
            padding: 0.75rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            position: sticky;
            top: 0;
            z-index: 1000;
            gap: 1rem;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .nav-item {
            color: var(--text-dim);
            text-decoration: none;
            font-size: 1rem;
            font-weight: 500;
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-item i {
            font-size: 1.1rem;
        }

        .nav-item:hover, .nav-item.active {
            background: var(--primary);
            color: #000;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            background: rgba(0, 255, 157, 0.1);
            padding: 0.5rem 1.5rem;
            border-radius: 2rem;
            border: 1px solid var(--primary);
        }

        .balance {
            color: var(--primary);
            font-weight: 700;
            font-size: 1.2rem;
        }

        .username {
            color: var(--text);
            font-weight: 500;
            max-width: 150px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .avatar {
            width: 2rem;
            height: 2rem;
            background: var(--secondary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-weight: 700;
        }

        /* ----- MAIN LAYOUT ----- */
        .fx-container {
            max-width: 1800px;
            margin: 0 auto;
            padding: 1.5rem;
            display: grid;
            grid-template-columns: 320px 1fr 350px;
            gap: 1.5rem;
        }

        /* ----- LEFT SIDEBAR (MARKET WATCH) ----- */
        .market-watch {
            background: var(--surface);
            border-radius: 1rem;
            padding: 1.25rem;
            border: 1px solid rgba(255, 152, 0, 0.2);
            height: fit-content;
        }

        .section-title {
            color: var(--secondary);
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border-bottom: 1px solid rgba(255,152,0,0.2);
            padding-bottom: 0.75rem;
        }

        .symbol-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            max-height: 600px;
            overflow-y: auto;
        }

        .symbol-row {
            display: grid;
            grid-template-columns: 1fr auto auto;
            align-items: center;
            padding: 0.75rem;
            background: rgba(0,0,0,0.2);
            border-radius: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .symbol-row:hover {
            border-color: var(--primary);
            background: rgba(0,255,157,0.1);
        }

        .symbol-name {
            font-weight: 600;
            color: var(--text);
        }

        .bid-price {
            font-family: 'Courier New', monospace;
            font-weight: 600;
            margin-right: 1rem;
        }

        .change {
            font-size: 0.85rem;
            padding: 0.2rem 0.5rem;
            border-radius: 1rem;
            font-weight: 600;
        }

        .positive {
            background: rgba(0,255,157,0.2);
            color: var(--primary);
        }

        .negative {
            background: rgba(255,82,82,0.2);
            color: var(--danger);
        }

        /* ----- CENTER (CHART + ORDER PANEL) ----- */
        .trading-area {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .chart-container {
            background: var(--surface);
            border-radius: 1rem;
            padding: 1rem;
            border: 1px solid rgba(255,152,0,0.2);
            height: 500px;
        }

        #tradingview_chart {
            width: 100%;
            height: 100%;
            border-radius: 0.5rem;
        }

        .order-panel {
            background: var(--surface);
            border-radius: 1rem;
            padding: 1.5rem;
            border: 1px solid rgba(255,152,0,0.2);
        }

        .price-ticker {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.3);
            padding: 1rem;
            border-radius: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .current-symbol {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
        }

        .current-bid {
            font-size: 2rem;
            font-weight: 700;
            font-family: 'Courier New', monospace;
        }

        .order-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .order-tab {
            flex: 1;
            padding: 0.75rem;
            background: rgba(0,0,0,0.3);
            border: none;
            color: var(--text-dim);
            font-weight: 600;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .order-tab.active {
            background: var(--secondary);
            color: #000;
        }

        .direction-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .btn-buy, .btn-sell {
            padding: 1rem;
            border: none;
            border-radius: 0.75rem;
            font-weight: 700;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-buy {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #000;
        }

        .btn-sell {
            background: linear-gradient(135deg, var(--danger), #ff1e1e);
            color: #fff;
        }

        .btn-buy:hover, .btn-sell:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .order-params {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin: 1.5rem 0;
        }

        .param-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .param-group label {
            color: var(--text-dim);
            font-size: 0.9rem;
        }

        .param-group input {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 0.75rem;
            border-radius: 0.5rem;
            color: var(--text);
            font-weight: 600;
        }

        .param-group input:focus {
            outline: 2px solid var(--primary);
            border-color: transparent;
        }

        .margin-info {
            background: rgba(0,0,0,0.3);
            padding: 1rem;
            border-radius: 0.75rem;
            margin: 1.5rem 0;
            display: flex;
            justify-content: space-between;
            font-size: 0.95rem;
        }

        .btn-place-order {
            width: 100%;
            padding: 1.25rem;
            background: linear-gradient(135deg, var(--secondary), var(--secondary-dark));
            border: none;
            border-radius: 0.75rem;
            color: #000;
            font-weight: 700;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-place-order:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255,152,0,0.3);
        }

        /* ----- RIGHT SIDEBAR (POSITIONS & ACCOUNT) ----- */
        .right-sidebar {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .account-card {
            background: linear-gradient(135deg, #1a2332, #0f172a);
            border-radius: 1rem;
            padding: 1.5rem;
            border: 1px solid var(--primary);
        }

        .account-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.75rem;
            font-size: 0.95rem;
        }

        .account-label {
            color: var(--text-dim);
        }

        .account-value {
            font-weight: 600;
            color: var(--primary);
        }

        .positions-list {
            background: var(--surface);
            border-radius: 1rem;
            padding: 1.25rem;
            border: 1px solid rgba(255,152,0,0.2);
            max-height: 400px;
            overflow-y: auto;
        }

        .position-item {
            background: rgba(0,0,0,0.2);
            border-radius: 0.75rem;
            padding: 1rem;
            margin-bottom: 0.75rem;
            border-left: 4px solid;
        }

        .position-item.buy { border-left-color: var(--primary); }
        .position-item.sell { border-left-color: var(--danger); }

        .position-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
        }

        .position-symbol {
            font-weight: 700;
            font-size: 1.1rem;
        }

        .position-direction {
            font-size: 0.85rem;
            padding: 0.2rem 0.75rem;
            border-radius: 1rem;
            background: rgba(255,255,255,0.1);
        }

        .position-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
            font-size: 0.9rem;
            margin: 0.5rem 0;
        }

        .position-profit {
            font-weight: 700;
            text-align: right;
        }

        .profit-positive { color: var(--primary); }
        .profit-negative { color: var(--danger); }

        .position-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
            margin-top: 0.75rem;
        }

        .btn-modify, .btn-close {
            padding: 0.5rem;
            border: none;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .btn-modify {
            background: var(--secondary);
            color: #000;
        }

        .btn-close {
            background: var(--danger);
            color: #fff;
        }

        /* ----- TOAST & OVERLAY ----- */
        .toast-container {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            z-index: 9999;
        }

        .toast {
            background: var(--surface);
            border-left: 4px solid var(--primary);
            padding: 1rem 1.5rem;
            border-radius: 0.5rem;
            margin-top: 0.5rem;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* responsive */
        @media (max-width: 1200px) {
            .fx-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<!-- ===== HEADER WITH INTEGRATED NAVIGATION ===== -->
<header class="header">
    <div class="logo-area">
        <div class="logo">XCrazyFX</div>
        <nav class="nav-links">
            <a href="https://xcrazybet.github.io/millioner/index.html" class="nav-item"><i class="fas fa-home"></i> Home</a>
            <a href="https://xcrazybet.github.io/millioner/crypto.html" class="nav-item"><i class="fas fa-bitcoin"></i> Crypto</a>
            <a href="https://xcrazybet.github.io/millioner/games.html" class="nav-item"><i class="fas fa-dice"></i> Games</a>
            <a href="https://xcrazybet.github.io/millioner/football.html" class="nav-item"><i class="fas fa-futbol"></i> Sport</a>
            <a href="#" class="nav-item active"><i class="fas fa-chart-line"></i> Forex</a>
            <a href="#" class="nav-item"><i class="fas fa-user"></i> Account</a>
        </nav>
    </div>
    <div class="user-info" id="userInfo">
        <i class="fas fa-wallet"></i>
        <span class="balance" id="balanceDisplay">$0.00</span>
        <span class="username" id="usernameDisplay">Loading...</span>
        <div class="avatar" id="avatar">FX</div>
    </div>
</header>

<!-- ===== MAIN TRADING INTERFACE ===== -->
<div class="fx-container">
    <!-- LEFT: MARKET WATCH (LIVE PRICES) -->
    <div class="market-watch">
        <div class="section-title">
            <i class="fas fa-chart-simple"></i> Market Watch
        </div>
        <div class="symbol-list" id="marketWatchList">
            <!-- populated by JS -->
        </div>
    </div>

    <!-- CENTER: CHART + ORDER PANEL -->
    <div class="trading-area">
        <!-- TradingView Chart -->
        <div class="chart-container">
            <div id="tradingview_chart"></div>
        </div>

        <!-- Order Panel -->
        <div class="order-panel">
            <div class="price-ticker">
                <span class="current-symbol" id="currentSymbol">EUR/USD</span>
                <span class="current-bid" id="currentBid">1.09234</span>
            </div>

            <!-- Order Tabs -->
            <div class="order-tabs">
                <button class="order-tab active" data-tab="market">MARKET</button>
                <button class="order-tab" data-tab="limit">LIMIT</button>
                <button class="order-tab" data-tab="stop">STOP</button>
            </div>

            <!-- Buy/Sell Buttons -->
            <div class="direction-buttons">
                <button class="btn-buy" id="buyBtn"><i class="fas fa-arrow-up"></i> BUY</button>
                <button class="btn-sell" id="sellBtn"><i class="fas fa-arrow-down"></i> SELL</button>
            </div>

            <!-- Order Parameters -->
            <div class="order-params">
                <div class="param-group">
                    <label><i class="fas fa-weight-scale"></i> Volume (Lots)</label>
                    <input type="number" id="lotSize" value="0.01" step="0.01" min="0.01" max="100">
                </div>
                <div class="param-group">
                    <label><i class="fas fa-ban"></i> Stop Loss</label>
                    <input type="number" id="stopLoss" placeholder="Optional" step="0.00001">
                </div>
                <div class="param-group">
                    <label><i class="fas fa-flag-checkered"></i> Take Profit</label>
                    <input type="number" id="takeProfit" placeholder="Optional" step="0.00001">
                </div>
                <div class="param-group" id="pendingPriceGroup" style="display: none;">
                    <label><i class="fas fa-bullseye"></i> Trigger Price</label>
                    <input type="number" id="triggerPrice" step="0.00001">
                </div>
            </div>

            <!-- Margin Info -->
            <div class="margin-info">
                <span>Required Margin:</span>
                <span id="requiredMargin">$0.00</span>
                <span>Free Margin:</span>
                <span id="freeMargin">$0.00</span>
            </div>

            <!-- Place Order -->
            <button class="btn-place-order" id="placeOrderBtn">
                <i class="fas fa-check-circle"></i> PLACE ORDER
            </button>
        </div>
    </div>

    <!-- RIGHT: ACCOUNT + POSITIONS -->
    <div class="right-sidebar">
        <div class="account-card">
            <div class="section-title" style="margin-top:0;"><i class="fas fa-id-card"></i> Account Summary</div>
            <div class="account-row">
                <span class="account-label">Balance:</span>
                <span class="account-value" id="accBalance">$0.00</span>
            </div>
            <div class="account-row">
                <span class="account-label">Equity:</span>
                <span class="account-value" id="accEquity">$0.00</span>
            </div>
            <div class="account-row">
                <span class="account-label">Margin:</span>
                <span class="account-value" id="accMargin">$0.00</span>
            </div>
            <div class="account-row">
                <span class="account-label">Free Margin:</span>
                <span class="account-value" id="accFreeMargin">$0.00</span>
            </div>
            <div class="account-row">
                <span class="account-label">Margin Level:</span>
                <span class="account-value" id="accMarginLevel">0%</span>
            </div>
        </div>

        <div class="positions-list">
            <div class="section-title"><i class="fas fa-briefcase"></i> Open Positions</div>
            <div id="positionsContainer">
                <!-- dynamic from JS -->
                <div style="color:var(--text-dim); text-align:center; padding:2rem;">No open positions</div>
            </div>
        </div>
    </div>
</div>

<!-- Toast Notifications -->
<div class="toast-container" id="toastContainer"></div>

<script>
    // ==================== FIREBASE CONFIG (same as keno but extended) ====================
    const firebaseConfig = {
        apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
        authDomain: "x-bet-prod-jd.firebaseapp.com",
        projectId: "x-bet-prod-jd",
        storageBucket: "x-bet-prod-jd.firebasestorage.app",
        messagingSenderId: "499334334535",
        appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // ==================== GLOBAL STATE ====================
    const fxState = {
        currentUser: null,
        balance: 10000.00,
        equity: 10000.00,
        margin: 0,
        freeMargin: 10000.00,
        marginLevel: 0,
        positions: [],
        selectedSymbol: 'EURUSD',
        currentBid: 1.09234,
        currentAsk: 1.09244,
        orderType: 'market',      // market, limit, stop
        orderDirection: 'buy',
        lotSize: 0.01,
        stopLoss: null,
        takeProfit: null,
        triggerPrice: null,
        marketPrices: {},
        leverage: 100,
        symbols: [
            { name: 'EURUSD', bid: 1.09234, ask: 1.09244, change: 0.05, category: 'forex' },
            { name: 'GBPUSD', bid: 1.26456, ask: 1.26466, change: -0.12, category: 'forex' },
            { name: 'USDJPY', bid: 148.235, ask: 148.245, change: 0.23, category: 'forex' },
            { name: 'AUDUSD', bid: 0.65789, ask: 0.65799, change: 0.08, category: 'forex' },
            { name: 'USDCAD', bid: 1.34567, ask: 1.34577, change: -0.03, category: 'forex' },
            { name: 'XAUUSD', bid: 2150.45, ask: 2151.05, change: 0.75, category: 'commodity' },
            { name: 'UKOIL', bid: 82.34, ask: 82.44, change: -0.45, category: 'commodity' },
            { name: 'USOIL', bid: 78.23, ask: 78.33, change: 0.67, category: 'commodity' },
            { name: 'SPX500', bid: 5120.5, ask: 5121.5, change: 0.34, category: 'index' },
            { name: 'NAS100', bid: 18456.2, ask: 18457.2, change: 0.89, category: 'index' },
            { name: 'DAX', bid: 17890.3, ask: 17891.3, change: 0.12, category: 'index' },
            { name: 'DJI', bid: 38900.4, ask: 38901.4, change: -0.05, category: 'index' }
        ]
    };

    // ==================== AUTH & USER ====================
    auth.onAuthStateChanged(async user => {
        if (!user) {
            // demo mode for presentation – create simulated user
            simulateDemoUser();
            return;
        }
        fxState.currentUser = user;
        await loadUserData(user.uid);
        startPriceSimulator();
    });

    function simulateDemoUser() {
        fxState.currentUser = { uid: 'demo123', email: 'demo@xcrazyfx.com' };
        fxState.balance = 50000;
        fxState.equity = 50000;
        fxState.freeMargin = 50000;
        updateUIDisplay();
        startPriceSimulator();
        document.getElementById('usernameDisplay').textContent = 'DEMO TRADER';
        document.getElementById('avatar').textContent = 'DT';
    }

    async function loadUserData(uid) {
        try {
            const walletRef = db.collection("wallets").doc(uid);
            const doc = await walletRef.get();
            if (doc.exists) {
                fxState.balance = doc.data().balance || 0;
                fxState.equity = fxState.balance;
                fxState.freeMargin = fxState.balance;
            } else {
                await walletRef.set({ balance: 50000, createdAt: new Date() });
                fxState.balance = 50000;
            }
            // load user profile
            const userDoc = await db.collection("users").doc(uid).get();
            if (userDoc.exists) {
                document.getElementById('usernameDisplay').textContent = userDoc.data().displayName || 'Trader';
                document.getElementById('avatar').textContent = (userDoc.data().displayName || 'T')[0];
            }
            updateUIDisplay();
        } catch (e) {
            console.warn('using demo mode', e);
        }
    }

    // ==================== PRICE SIMULATOR (LIVE FEEL) ====================
    function startPriceSimulator() {
        setInterval(() => {
            fxState.symbols.forEach(s => {
                const move = (Math.random() - 0.5) * 0.001 * s.bid;
                s.bid += move;
                s.ask = s.bid + (s.bid * 0.0001); // spread approx
                s.change = (move / s.bid) * 100;
            });
            // update selected symbol price
            const sel = fxState.symbols.find(s => s.name === fxState.selectedSymbol);
            if (sel) {
                fxState.currentBid = sel.bid;
                fxState.currentAsk = sel.ask;
            }
            updateMarketWatch();
            updatePricesOnUI();
            recalculateMarginAndEquity();
        }, 2000);
    }

    function updateMarketWatch() {
        const container = document.getElementById('marketWatchList');
        container.innerHTML = '';
        fxState.symbols.forEach(sym => {
            const row = document.createElement('div');
            row.className = 'symbol-row';
            row.onclick = () => selectSymbol(sym.name);
            row.innerHTML = `
                <span class="symbol-name">${sym.name}</span>
                <span class="bid-price">${sym.bid.toFixed(sym.name.includes('JPY') ? 3 : 5)}</span>
                <span class="change ${sym.change >= 0 ? 'positive' : 'negative'}">
                    ${sym.change >= 0 ? '+' : ''}${sym.change.toFixed(2)}%
                </span>
            `;
            container.appendChild(row);
        });
    }

    function selectSymbol(symbolName) {
        fxState.selectedSymbol = symbolName;
        const sym = fxState.symbols.find(s => s.name === symbolName);
        if (sym) {
            fxState.currentBid = sym.bid;
            fxState.currentAsk = sym.ask;
            document.getElementById('currentSymbol').textContent = symbolName;
            document.getElementById('currentBid').textContent = sym.bid.toFixed(5);
        }
        // update chart
        if (window.tvWidget) {
            window.tvWidget.setSymbol(symbolName, '15');
        }
    }

    function updatePricesOnUI() {
        const sym = fxState.symbols.find(s => s.name === fxState.selectedSymbol);
        if (sym) {
            document.getElementById('currentBid').textContent = sym.bid.toFixed(5);
        }
        // update positions floating PL
        fxState.positions.forEach(p => {
            const current = fxState.symbols.find(s => s.name === p.symbol);
            if (current) {
                if (p.direction === 'buy') p.floatingPL = (current.bid - p.openPrice) * p.lotSize * 100000;
                else p.floatingPL = (p.openPrice - current.ask) * p.lotSize * 100000;
            }
        });
        renderPositions();
        updateAccountSummary();
    }

    // ==================== TRADING ENGINE ====================
    async function placeOrder() {
        if (!fxState.currentUser) { showToast('Please log in', 'error'); return; }

        const symbol = fxState.selectedSymbol;
        const direction = fxState.orderDirection;
        const lotSize = parseFloat(document.getElementById('lotSize').value);
        const stopLoss = document.getElementById('stopLoss').value ? parseFloat(document.getElementById('stopLoss').value) : null;
        const takeProfit = document.getElementById('takeProfit').value ? parseFloat(document.getElementById('takeProfit').value) : null;
        const orderType = fxState.orderType;
        const triggerPrice = orderType !== 'market' ? parseFloat(document.getElementById('triggerPrice').value) : null;

        // margin calculation (simplified for demo)
        const currentPrice = direction === 'buy' ? fxState.currentAsk : fxState.currentBid;
        const contractSize = 100000; // standard lot
        const requiredMargin = (lotSize * contractSize * currentPrice) / fxState.leverage;
        
        if (requiredMargin > fxState.freeMargin) {
            showToast('Insufficient margin', 'error');
            return;
        }

        // Deduct margin (in real system, block margin)
        const order = {
            id: 'ord_' + Date.now() + Math.random().toString(36).substr(2,6),
            userId: fxState.currentUser.uid,
            symbol,
            direction,
            lotSize,
            openPrice: currentPrice,
            stopLoss,
            takeProfit,
            triggerPrice,
            type: orderType,
            status: orderType === 'market' ? 'open' : 'pending',
            openTime: new Date(),
            floatingPL: 0,
            marginUsed: requiredMargin
        };

        if (orderType === 'market') {
            fxState.positions.push(order);
            fxState.margin += requiredMargin;
            fxState.freeMargin -= requiredMargin;
        } else {
            showToast(`${orderType} order pending`, 'info');
            // store in pending (simplified)
        }

        // record transaction via firebase atomic
        try {
            await db.runTransaction(async transaction => {
                const walletRef = db.collection("wallets").doc(fxState.currentUser.uid);
                const walletDoc = await transaction.get(walletRef);
                if (!walletDoc.exists) throw new Error('no wallet');
                const newBalance = walletDoc.data().balance;
                // we don't deduct yet, margin is blocked – but for demo we keep local
            });
        } catch (e) { console.warn('tx error', e); }

        recalculateMarginAndEquity();
        renderPositions();
        updateAccountSummary();
        showToast(`Order placed: ${direction} ${lotSize} ${symbol}`, 'success');
    }

    function closePosition(positionId) {
        const idx = fxState.positions.findIndex(p => p.id === positionId);
        if (idx !== -1) {
            const pos = fxState.positions[idx];
            // release margin
            fxState.margin -= pos.marginUsed;
            fxState.freeMargin += pos.marginUsed;
            fxState.positions.splice(idx, 1);
            showToast('Position closed', 'success');
            recalculateMarginAndEquity();
            renderPositions();
        }
    }

    function recalculateMarginAndEquity() {
        let totalPL = 0;
        fxState.positions.forEach(p => totalPL += p.floatingPL || 0);
        fxState.equity = fxState.balance + totalPL;
        fxState.freeMargin = fxState.equity - fxState.margin;
        fxState.marginLevel = fxState.margin > 0 ? (fxState.equity / fxState.margin) * 100 : 0;
        updateAccountSummary();
    }

    function updateAccountSummary() {
        document.getElementById('accBalance').textContent = `$${fxState.balance.toFixed(2)}`;
        document.getElementById('accEquity').textContent = `$${fxState.equity.toFixed(2)}`;
        document.getElementById('accMargin').textContent = `$${fxState.margin.toFixed(2)}`;
        document.getElementById('accFreeMargin').textContent = `$${fxState.freeMargin.toFixed(2)}`;
        document.getElementById('accMarginLevel').textContent = `${fxState.marginLevel.toFixed(2)}%`;
        document.getElementById('balanceDisplay').textContent = `$${fxState.balance.toFixed(2)}`;
    }

    function renderPositions() {
        const container = document.getElementById('positionsContainer');
        if (fxState.positions.length === 0) {
            container.innerHTML = '<div style="color:var(--text-dim); text-align:center; padding:2rem;">No open positions</div>';
            return;
        }
        container.innerHTML = '';
        fxState.positions.forEach(pos => {
            const div = document.createElement('div');
            div.className = `position-item ${pos.direction}`;
            div.innerHTML = `
                <div class="position-header">
                    <span class="position-symbol">${pos.symbol}</span>
                    <span class="position-direction">${pos.direction.toUpperCase()}</span>
                </div>
                <div class="position-details">
                    <div>Lots: ${pos.lotSize}</div>
                    <div>Open: ${pos.openPrice.toFixed(5)}</div>
                    <div>SL: ${pos.stopLoss || '--'}</div>
                    <div>TP: ${pos.takeProfit || '--'}</div>
                </div>
                <div class="position-profit ${pos.floatingPL >= 0 ? 'profit-positive' : 'profit-negative'}">
                    P/L: $${pos.floatingPL?.toFixed(2) || '0.00'}
                </div>
                <div class="position-actions">
                    <button class="btn-modify" onclick="modifyPositionPrompt('${pos.id}')">Modify</button>
                    <button class="btn-close" onclick="closePosition('${pos.id}')">Close</button>
                </div>
            `;
            container.appendChild(div);
        });
    }

    window.closePosition = closePosition;
    window.modifyPositionPrompt = (id) => {
        const newSL = prompt('Enter new Stop Loss:');
        if (newSL) {
            const pos = fxState.positions.find(p => p.id === id);
            if (pos) pos.stopLoss = parseFloat(newSL);
            renderPositions();
        }
    };

    // ==================== UI BINDINGS ====================
    document.addEventListener('DOMContentLoaded', () => {
        updateMarketWatch();
        selectSymbol('EURUSD');

        // TradingView widget
        new TradingView.widget({
            "container_id": "tradingview_chart",
            "autosize": true,
            "symbol": "FX:EURUSD",
            "interval": "15",
            "timezone": "Europe/London",
            "theme": "dark",
            "style": "1",
            "locale": "en_GB",
            "toolbar_bg": "#111827",
            "enable_publishing": false,
            "hide_side_toolbar": false,
            "allow_symbol_change": true,
            "studies": ["RSI@tv-basicstudies"],
            "show_popup_button": true,
            "popup_width": "1000",
            "popup_height": "650"
        });

        // order tabs
        document.querySelectorAll('.order-tab').forEach(tab => {
            tab.addEventListener('click', (e) => {
                document.querySelectorAll('.order-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                fxState.orderType = tab.dataset.tab;
                document.getElementById('pendingPriceGroup').style.display = 
                    (fxState.orderType === 'market') ? 'none' : 'block';
            });
        });

        // buy/sell
        document.getElementById('buyBtn').addEventListener('click', () => {
            fxState.orderDirection = 'buy';
            showToast('Buy mode selected', 'info');
        });
        document.getElementById('sellBtn').addEventListener('click', () => {
            fxState.orderDirection = 'sell';
            showToast('Sell mode selected', 'info');
        });

        // place order
        document.getElementById('placeOrderBtn').addEventListener('click', placeOrder);

        // margin calculator
        document.getElementById('lotSize').addEventListener('input', () => {
            const lot = parseFloat(document.getElementById('lotSize').value) || 0.01;
            const price = fxState.orderDirection === 'buy' ? fxState.currentAsk : fxState.currentBid;
            const required = (lot * 100000 * price) / fxState.leverage;
            document.getElementById('requiredMargin').textContent = `$${required.toFixed(2)}`;
        });
    });

    function showToast(msg, type = 'info') {
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        toast.innerHTML = `<i class="fas fa-${type === 'success' ? 'check-circle' : 'info-circle'}"></i> ${msg}`;
        document.getElementById('toastContainer').appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    function updateUIDisplay() {
        document.getElementById('balanceDisplay').textContent = `$${fxState.balance.toFixed(2)}`;
        document.getElementById('accBalance').textContent = `$${fxState.balance.toFixed(2)}`;
        document.getElementById('accEquity').textContent = `$${fxState.equity.toFixed(2)}`;
        document.getElementById('accFreeMargin').textContent = `$${fxState.freeMargin.toFixed(2)}`;
    }

    // ==================== REAL-TIME FIREBASE LISTENER (wallet) ====================
    if (auth.currentUser) {
        db.collection("wallets").doc(auth.currentUser.uid).onSnapshot(doc => {
            if (doc.exists) {
                fxState.balance = doc.data().balance;
                recalculateMarginAndEquity();
            }
        });
    }

    // expose for demo
    window.fxState = fxState;
</script>
</body>
</html>
