<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>💰 CryptoPro Hub - Professional Trading Platform</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <!-- TradingView Charting Library -->
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>

    <style>
        :root {
            --primary: #00ff9d;
            --primary-dark: #00cc7a;
            --secondary: #ff9800;
            --secondary-dark: #cc7a00;
            --buy: #00c853;
            --sell: #ff1744;
            --danger: #ff5252;
            --success: #4caf50;
            --warning: #ffc107;
            --bg: #0a0f1a;
            --surface: #111827;
            --surface-light: #1a2332;
            --surface-dark: #0a0f17;
            --text: #ffffff;
            --text-dim: #a0a8c9;
            --border: rgba(255, 255, 255, 0.1);
            --gradient-main: linear-gradient(135deg, #0f2b1a 0%, #1a1a2e 100%);
            --gradient-card: linear-gradient(145deg, #1a2332, #0f172a);
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Segoe UI', 'Roboto', system-ui, -apple-system, sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            padding-bottom: 70px;
        }

        /* Background Effects */
        .bg-effects {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: 
                radial-gradient(circle at 10% 20%, rgba(0, 255, 157, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 90% 80%, rgba(255, 152, 0, 0.05) 0%, transparent 50%),
                linear-gradient(135deg, #000000 0%, var(--bg) 100%);
        }

        /* Header */
        .header {
            background: rgba(17, 24, 39, 0.95);
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--primary);
        }

        .balance-display {
            background: var(--gradient-card);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--border);
            color: var(--primary);
            font-weight: 700;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 160px;
            justify-content: center;
        }

        @media (max-width: 768px) {
            .balance-display {
                min-width: 120px;
                font-size: 14px;
            }
        }

        /* Bottom Navigation (Mobile First) */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            background: rgba(17, 24, 39, 0.98);
            padding: 12px 10px;
            border-top: 1px solid var(--border);
            backdrop-filter: blur(20px);
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--text-dim);
            font-size: 11px;
            gap: 4px;
            transition: all 0.3s;
            padding: 5px 10px;
            border-radius: 10px;
            min-width: 60px;
        }

        .nav-item i {
            font-size: 18px;
        }

        .nav-item.active {
            color: var(--primary);
            background: rgba(0, 255, 157, 0.1);
        }

        .nav-item:hover {
            color: var(--secondary);
        }

        /* Main Container */
        .main-container {
            padding: 15px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Dashboard Summary */
        .dashboard-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .summary-card {
            background: var(--gradient-card);
            padding: 15px;
            border-radius: 15px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }

        .summary-label {
            font-size: 12px;
            color: var(--text-dim);
            margin-bottom: 5px;
        }

        .summary-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--text);
        }

        .summary-value.positive { color: var(--buy); }
        .summary-value.negative { color: var(--sell); }

        /* Search Bar */
        .search-container {
            position: relative;
            margin-bottom: 15px;
        }

        .search-input {
            width: 100%;
            padding: 14px 45px 14px 45px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-size: 14px;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--primary);
        }

        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-dim);
        }

        .filter-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-dim);
            cursor: pointer;
        }

        /* Market Grid - Mobile Optimized */
        .market-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .market-grid {
                grid-template-columns: 1fr;
                gap: 10px;
            }
        }

        .market-card {
            background: var(--gradient-card);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 15px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .market-card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .market-card.expanded {
            grid-column: 1 / -1;
            margin: 10px 0;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .coin-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .coin-symbol {
            font-weight: 700;
            font-size: 16px;
        }

        .coin-name {
            color: var(--text-dim);
            font-size: 12px;
        }

        .favorite-btn {
            background: none;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 16px;
            padding: 5px;
        }

        .favorite-btn.active {
            color: var(--secondary);
        }

        .price-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .current-price {
            font-size: 22px;
            font-weight: 700;
        }

        .price-change {
            font-size: 14px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(0, 200, 83, 0.1);
            color: var(--buy);
        }

        .price-change.negative {
            background: rgba(255, 23, 68, 0.1);
            color: var(--sell);
        }

        .market-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            font-size: 11px;
            color: var(--text-dim);
            margin-top: 10px;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
        }

        .stat-value {
            color: var(--text);
            font-weight: 600;
        }

        /* Action Buttons */
        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .action-btn {
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .buy-btn {
            background: rgba(0, 200, 83, 0.2);
            color: var(--buy);
            border: 1px solid var(--buy);
        }

        .buy-btn:hover {
            background: var(--buy);
            color: #000;
        }

        .sell-btn {
            background: rgba(255, 23, 68, 0.2);
            color: var(--sell);
            border: 1px solid var(--sell);
        }

        .sell-btn:hover {
            background: var(--sell);
            color: #fff;
        }

        /* Expanded View */
        .expanded-view {
            display: none;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid var(--border);
        }

        .market-card.expanded .expanded-view {
            display: block;
        }

        .chart-container {
            height: 200px;
            margin-bottom: 15px;
            background: var(--surface-dark);
            border-radius: 8px;
            overflow: hidden;
        }

        /* Trade Modal */
        .trade-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
            padding: 20px;
        }

        .trade-modal.show {
            opacity: 1;
            visibility: visible;
        }

        .trade-content {
            background: var(--surface);
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            max-height: 90vh;
            overflow-y: auto;
            border: 2px solid var(--primary);
        }

        .trade-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .trade-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 20px;
            cursor: pointer;
            padding: 5px;
        }

        .trade-body {
            padding: 20px;
        }

        .trade-info {
            background: var(--surface-dark);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .trade-price {
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 10px;
        }

        .trade-balance {
            font-size: 14px;
            color: var(--text-dim);
            text-align: center;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-dim);
            font-size: 14px;
        }

        .amount-input {
            width: 100%;
            padding: 12px;
            background: var(--surface-dark);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 16px;
            outline: none;
        }

        .amount-input:focus {
            border-color: var(--primary);
        }

        .quick-amounts {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }

        .quick-amount {
            padding: 8px;
            background: var(--surface-dark);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-dim);
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 12px;
        }

        .quick-amount:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .trade-summary {
            background: var(--surface-dark);
            padding: 15px;
            border-radius: 12px;
            margin-top: 20px;
            font-size: 12px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .total-row {
            border-top: 1px solid var(--border);
            padding-top: 10px;
            margin-top: 10px;
            font-weight: 700;
            font-size: 16px;
        }

        /* Toast Notifications */
        .toast-container {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 300px;
            width: 90%;
        }

        .toast {
            padding: 15px;
            background: rgba(17, 24, 39, 0.95);
            border-radius: 10px;
            border-left: 4px solid var(--primary);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
            transform: translateY(100%);
            opacity: 0;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
            font-size: 14px;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.success { border-color: var(--success); }
        .toast.error { border-color: var(--danger); }
        .toast.warning { border-color: var(--warning); }
        .toast.info { border-color: var(--primary); }

        /* Loading States */
        .skeleton {
            background: linear-gradient(90deg, var(--surface) 25%, var(--surface-light) 50%, var(--surface) 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
            border-radius: 4px;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Flash Animations */
        @keyframes flashGreen {
            0%, 100% { background: var(--gradient-card); }
            50% { background: rgba(0, 200, 83, 0.1); }
        }

        @keyframes flashRed {
            0%, 100% { background: var(--gradient-card); }
            50% { background: rgba(255, 23, 68, 0.1); }
        }

        .flash-green {
            animation: flashGreen 0.5s ease-out;
        }

        .flash-red {
            animation: flashRed 0.5s ease-out;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--surface);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 4px;
        }

        /* Utility Classes */
        .hidden { display: none !important; }
        .text-success { color: var(--buy); }
        .text-danger { color: var(--sell); }
        .text-warning { color: var(--warning); }
        .text-primary { color: var(--primary); }

        /* Mobile Optimizations */
        @media (max-width: 480px) {
            .header {
                padding: 10px;
                flex-direction: column;
                gap: 10px;
            }

            .main-container {
                padding: 10px;
            }

            .summary-card {
                padding: 12px;
            }

            .summary-value {
                font-size: 16px;
            }

            .market-card {
                padding: 12px;
            }

            .current-price {
                font-size: 18px;
            }

            .action-btn {
                padding: 8px;
                font-size: 13px;
            }

            .bottom-nav {
                padding: 10px 5px;
            }

            .nav-item {
                font-size: 10px;
                min-width: 50px;
                padding: 5px;
            }

            .nav-item i {
                font-size: 16px;
            }
        }

        /* Landscape Mode */
        @media (max-height: 600px) and (orientation: landscape) {
            .header {
                padding: 8px 15px;
            }

            .market-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            .bottom-nav {
                padding: 8px 5px;
            }
        }
    </style>
</head>

        // ===== ATOMIC TRANSACTION PROCESSOR =====
        async function processCryptoTransaction(type, symbol, amount, price, totalCost) {
            try {
                if (!appState.currentUser) {
                    throw new Error('User not authenticated');
                }

                const transactionId = 'crypto_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                
                // Prepare transaction data
                const transactionData = {
                    type: type, // 'buy' or 'sell'
                    symbol: symbol,
                    cryptoAmount: amount,
                    price: price,
                    totalCost: totalCost,
                    status: 'completed',
                    timestamp: new Date(),
                    userId: appState.currentUser.uid,
                    transactionId: transactionId
                };

                // Update local state
                if (type === 'buy') {
                    appState.balance -= totalCost;
                    
                    if (!appState.portfolio[symbol]) {
                        appState.portfolio[symbol] = { amount: 0, avgPrice: 0 };
                    }
                    
                    const current = appState.portfolio[symbol];
                    const newAmount = current.amount + amount;
                    const newAvgPrice = ((current.amount * current.avgPrice) + (amount * price)) / newAmount;
                    
                    appState.portfolio[symbol] = {
                        amount: newAmount,
                        avgPrice: newAvgPrice
                    };
                    
                } else if (type === 'sell') {
                    appState.balance += totalCost;
                    
                    if (appState.portfolio[symbol]) {
                        const current = appState.portfolio[symbol];
                        const newAmount = current.amount - amount;
                        
                        if (newAmount <= 0.00000001) {
                            delete appState.portfolio[symbol];
                        } else {
                            appState.portfolio[symbol] = {
                                amount: newAmount,
                                avgPrice: current.avgPrice // Keep avg price for remaining
                            };
                        }
                    }
                }

                // Save to Firebase
                await db.runTransaction(async (transaction) => {
                    // Save transaction record
                    const txRef = db.collection('crypto_transactions').doc(transactionId);
                    transaction.set(txRef, transactionData);
                    
                    // Update portfolio
                    const portfolioRef = db.collection('crypto_portfolios').doc(appState.currentUser.uid);
                    transaction.set(portfolioRef, {
                        holdings: appState.portfolio,
                        balance: appState.balance,
                        updatedAt: new Date(),
                        userId: appState.currentUser.uid
                    }, { merge: true });
                });

                // Update UI
                updateUI();
                showToast(`${type.toUpperCase()} order executed successfully!`, 'success');
                
                return { success: true, transactionId };
                
            } catch (error) {
                console.error('Transaction failed:', error);
                showToast(`Transaction failed: ${error.message}`, 'error');
                return { success: false, error: error.message };
            }
        }

        // ===== MARKET DATA SYSTEM =====
        async function initializeMarketData() {
            elements.loadingIndicator.classList.remove('hidden');
            
            try {
                // Load initial data from Binance API
                const response = await fetch('https://api.binance.com/api/v3/ticker/24hr');
                const data = await response.json();
                
                data.forEach(item => {
                    const symbol = item.symbol.toLowerCase();
                    if (symbols.includes(symbol)) {
                        appState.marketData[symbol] = {
                            price: parseFloat(item.lastPrice),
                            change: parseFloat(item.priceChangePercent),
                            volume: parseFloat(item.volume),
                            high: parseFloat(item.highPrice),
                            low: parseFloat(item.lowPrice)
                        };
                    }
                });
                
                renderMarketGrid();
                elements.loadingIndicator.classList.add('hidden');
                
            } catch (error) {
                console.error('Error loading market data:', error);
                showToast('Error loading market data', 'error');
                elements.loadingIndicator.classList.add('hidden');
            }
        }

        function initializeWebSocket() {
            // For mobile optimization, only subscribe to visible symbols initially
            const visibleStreams = appState.visibleSymbols.map(s => `${s}@ticker`).join('/');
            
            try {
                appState.webSocket = new WebSocket(`wss://stream.binance.com:9443/stream?streams=${visibleStreams}`);
                
                appState.webSocket.onopen = () => {
                    appState.isConnected = true;
                    console.log('WebSocket connected');
                };
                
                appState.webSocket.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    const symbol = data.data.s.toLowerCase();
                    const newPrice = parseFloat(data.data.c);
                    
                    if (appState.marketData[symbol]) {
                        const oldPrice = appState.marketData[symbol].price;
                        appState.marketData[symbol].price = newPrice;
                        updateCardPrice(symbol, newPrice, oldPrice);
                        updateDashboard();
                    }
                };
                
                appState.webSocket.onerror = (error) => {
                    console.error('WebSocket error:', error);
                    showToast('Connection lost. Reconnecting...', 'warning');
                };
                
                appState.webSocket.onclose = () => {
                    appState.isConnected = false;
                    // Try to reconnect after 5 seconds
                    setTimeout(initializeWebSocket, 5000);
                };
                
            } catch (error) {
                console.error('WebSocket initialization failed:', error);
            }
        }

        function updateCardPrice(symbol, newPrice, oldPrice) {
            const priceElement = document.getElementById(`price-${symbol}`);
            if (!priceElement) return;
            
            const card = priceElement.closest('.market-card');
            if (!card) return;
            
            // Update price
            priceElement.textContent = `$${newPrice.toLocaleString('en-US', { 
                minimumFractionDigits: 2, 
                maximumFractionDigits: newPrice < 1 ? 8 : 2 
            })}`;
            
            // Flash effect
            card.classList.remove('flash-green', 'flash-red');
            if (newPrice > oldPrice) {
                card.classList.add('flash-green');
            } else if (newPrice < oldPrice) {
                card.classList.add('flash-red');
            }
            
            // Remove flash after animation
            setTimeout(() => {
                card.classList.remove('flash-green', 'flash-red');
            }, 500);

        function updateDashboard() {
            // Update balance
            elements.balanceDisplay.textContent = appState.balance.toFixed(2);
            elements.totalBalance.textContent = `$${appState.balance.toFixed(2)}`;
            
            // Calculate portfolio value and daily change
            let portfolioValue = 0;
            let totalCost = 0;
            let activeTrades = 0;
            
            Object.keys(appState.portfolio).forEach(symbol => {
                const holding = appState.portfolio[symbol];
                const currentPrice = appState.marketData[symbol]?.price || 0;
                
                if (currentPrice > 0) {
                    portfolioValue += holding.amount * currentPrice;
                    totalCost += holding.amount * holding.avgPrice;
                    activeTrades++;
                }
            });
            
            const totalValue = appState.balance + portfolioValue;
            const dailyChange = portfolioValue - totalCost;
            const dailyChangePercent = totalCost > 0 ? ((dailyChange / totalCost) * 100) : 0;
            
            elements.portfolioValue.textContent = `$${portfolioValue.toFixed(2)}`;
            elements.dailyChange.textContent = `${dailyChange >= 0 ? '+' : ''}${dailyChangePercent.toFixed(2)}%`;
            elements.dailyChange.className = `summary-value ${dailyChange >= 0 ? 'positive' : 'negative'}`;
            elements.activeTrades.textContent = activeTrades;
        }

        // ===== TRADE MODAL =====
        function openTradeModal(action, symbol) {
            if (!appState.marketData[symbol]) {
                showToast('Market data not available', 'error');
                return;
            }
            
            const currentPrice = appState.marketData[symbol].price;
            const symbolUpper = symbol.toUpperCase().replace('USDT', '');
            
            appState.activeTrade = {
                action: action,
                symbol: symbol,
                symbolDisplay: symbolUpper,
                price: currentPrice,
                maxAmount: action === 'buy' ? appState.balance : (appState.portfolio[symbol]?.amount || 0)
            };
            
            // Update modal content
            elements.tradeTitle.textContent = `${action.toUpperCase()} ${symbolUpper}`;
            elements.tradePrice.textContent = `$${currentPrice.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 8 })}`;
            elements.tradeBalance.textContent = `Balance: $${appState.balance.toFixed(2)}`;
            
            // Reset inputs
            elements.tradeAmount.value = '100';
            elements.tradeSlider.value = '50';
            
            updateTradeSummary();
            
            // Show modal
            elements.tradeModal.classList.add('show');

        function updateTradeSummary() {
            if (!appState.activeTrade) return;
            
            const amount = parseFloat(elements.tradeAmount.value) || 0;
            const price = appState.activeTrade.price;
            const cryptoAmount = amount / price;
            const fee = amount * 0.001; // 0.1% fee
            const totalCost = amount + fee;
            
            // Validate amount
            if (appState.activeTrade.action === 'buy' && totalCost > appState.balance) {
                elements.tradeAmount.value = (appState.balance * 0.99).toFixed(2); // Leave room for fee
                return updateTradeSummary();
            }
            
            if (appState.activeTrade.action === 'sell' && cryptoAmount > appState.activeTrade.maxAmount) {
                const maxAmount = appState.activeTrade.maxAmount * price * 0.99;
                elements.tradeAmount.value = maxAmount.toFixed(2);
                return updateTradeSummary();
            }
            
            // Update display
            elements.cryptoAmountLabel.textContent = `≈ ${cryptoAmount.toFixed(8)} ${appState.activeTrade.symbolDisplay}`;
            elements.summaryPrice.textContent = `$${price.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 8 })}`;
            elements.summaryFee.textContent = `$${fee.toFixed(2)}`;
            elements.summaryCrypto.textContent = `${cryptoAmount.toFixed(8)} ${appState.activeTrade.symbolDisplay}`;
            elements.summaryTotal.textContent = `$${totalCost.toFixed(2)}`;
            
            // Update button text
            elements.confirmTradeBtn.innerHTML = `
                <i class="fas fa-check-circle"></i> 
                ${appState.activeTrade.action === 'buy' ? 'BUY' : 'SELL'} ${cryptoAmount.toFixed(6)} ${appState.activeTrade.symbolDisplay}
            `;
        }

        async function executeTrade() {
            if (!appState.activeTrade) return;
            
            const amount = parseFloat(elements.tradeAmount.value) || 0;
            const price = appState.activeTrade.price;
            const cryptoAmount = amount / price;
            const totalCost = amount;
            
            if (amount < 10) {
                showToast('Minimum trade amount is $10', 'warning');
                return;
            }
            
            if (appState.activeTrade.action === 'buy' && totalCost > appState.balance) {
                showToast('Insufficient balance', 'error');
                return;
            }
            
            if (appState.activeTrade.action === 'sell' && cryptoAmount > appState.activeTrade.maxAmount) {
                showToast('Insufficient crypto balance', 'error');
                return;
            }
            
            // Process transaction
            const result = await processCryptoTransaction(
                appState.activeTrade.action,
                appState.activeTrade.symbol,
                cryptoAmount,
                price,
                totalCost
            );
            
            if (result.success) {
                closeTradeModal();
            }
        }

        function closeTradeModal() {
            elements.tradeModal.classList.remove('show');
            appState.activeTrade = null;
        }

        // ===== EVENT HANDLERS =====
        function setupEventListeners() {
            // Search
            elements.searchInput.addEventListener('input', (e) => {
                const searchTerm = e.target.value.toLowerCase();
                const cards = document.querySelectorAll('.market-card');
                
                cards.forEach(card => {
                    const symbol = card.dataset.symbol;
                    const displaySymbol = symbol.toUpperCase().replace('USDT', '');
                    const name = cryptoFullNames[symbol] || '';
                    
                    const matches = symbol.includes(searchTerm) || 
                                   displaySymbol.includes(searchTerm) || 
                                   name.toLowerCase().includes(searchTerm);
                    
                    card.style.display = matches ? 'block' : 'none';
                });
            });
            
            // Filter button
            document.getElementById('filter-btn').addEventListener('click', () => {
                showToast('Filter feature coming soon!', 'info');
            });
            
            // Trade modal
            elements.tradeAmount.addEventListener('input', updateTradeSummary);
            elements.tradeSlider.addEventListener('input', (e) => {
                const percent = e.target.value;
                const maxAmount = appState.activeTrade.action === 'buy' ? 
                    appState.balance * 0.99 : // Leave room for fee
                    appState.activeTrade.maxAmount * appState.activeTrade.price * 0.99;
                
                elements.tradeAmount.value = (maxAmount * (percent / 100)).toFixed(2);
                updateTradeSummary();
            });
            
            // Quick amounts
            document.querySelectorAll('.quick-amount').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    elements.tradeAmount.value = e.target.dataset.amount;
                    updateTradeSummary();
                });
            });
            
            elements.confirmTradeBtn.addEventListener('click', executeTrade);
            elements.closeTradeBtn.addEventListener('click', closeTradeModal);
            
            // Bottom navigation
            document.querySelectorAll('.nav-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    e.preventDefault();
                    const page = e.currentTarget.dataset.page;
                    
                    // Remove active class from all
                    document.querySelectorAll('.nav-item').forEach(nav => {
                        nav.classList.remove('active');
                    });
                    
                    // Add active to clicked
                    e.currentTarget.classList.add('active');
                    
                    showToast(`Navigating to ${page} page...`, 'info');
                    // In full implementation, this would load different page content
                });
            });
            
            // Close modal on outside click
            elements.tradeModal.addEventListener('click', (e) => {
                if (e.target === elements.tradeModal) {
                    closeTradeModal();
                }
            });
            
            // Card click events (delegated)
            elements.marketGrid.addEventListener('click', (e) => {
                const target = e.target;
                
                // Favorite button
                if (target.closest('.favorite-btn')) {
                    const btn = target.closest('.favorite-btn');
                    const symbol = btn.dataset.symbol;
                    
                    if (appState.favorites.has(symbol)) {
                        appState.favorites.delete(symbol);
                        btn.classList.remove('active');
                    } else {
                        appState.favorites.add(symbol);
                        btn.classList.add('active');
                    }
                    savePortfolio();
                    return;
                }
                
                // Buy/Sell buttons
                if (target.closest('[data-action]')) {
                    const btn = target.closest('[data-action]');
                    const action = btn.dataset.action;
                    const symbol = btn.dataset.symbol;
                    
                    openTradeModal(action, symbol);
                    return;
                }
                
                // Card expansion (tap on empty area)
                if (target.closest('.market-card') && !target.closest('button')) {
                    const card = target.closest('.market-card');
                    card.classList.toggle('expanded');
                    
                    // Load chart if expanded
                    if (card.classList.contains('expanded')) {
                        const symbol = card.dataset.symbol;
                        loadChart(symbol);
                    }
                }
            });
            
            // Keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeTradeModal();
                }
            });
        }

        // ===== TOAST NOTIFICATIONS =====
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            
            container.appendChild(toast);
            
            setTimeout(() => toast.classList.add('show'), 10);
            
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // ===== MOBILE OPTIMIZATION FEATURES =====
        
        // Handle touch gestures
        let touchStartX = 0;
        let touchStartY = 0;
        
        document.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        });
        
        document.addEventListener('touchend', (e) => {
            const touchEndX = e.changedTouches[0].clientX;
            const touchEndY = e.changedTouches[0].clientY;
            const diffX = touchStartX - touchEndX;
            const diffY = touchStartY - touchEndY;
            
            // Swipe left/right (for navigation)
            if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 50) {
                if (diffX > 0) {
                    // Swipe left - next page
                    showToast('Swipe left detected', 'info');
                } else {
                    // Swipe right - previous page
                    showToast('Swipe right detected', 'info');
                }
            }
            
            // Pull to refresh detection
            if (diffY > 100 && touchStartY < 100) {
                initializeMarketData();
                showToast('Refreshing market data...', 'info');
            }
        });
        
        // Handle network changes
        window.addEventListener('online', () => {
            showToast('Back online!', 'success');
            if (!appState.isConnected) {
                initializeWebSocket();
            }
        });
        
        window.addEventListener('offline', () => {
            showToast('You are offline. Showing cached data.', 'warning');
        });
        
        // Handle visibility change (tab switching)
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && appState.webSocket) {
                // Throttle updates when app is hidden
                console.log('App hidden, reducing update frequency');
            } else if (!document.hidden && !appState.isConnected) {
                // Reconnect when app becomes visible
                initializeWebSocket();
            }
        });
        
        // Handle device orientation
        window.addEventListener('orientationchange', () => {
            setTimeout(() => {
                // Re-render on orientation change for better layout
                renderMarketGrid();
            }, 300);
        });
        
        // Initialize
        updateUI();
    </script>
</body>
</html>
