<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --primary: #ffd700;
            --primary-dark: #b39700;
            --secondary: #1a0b2e;
            --secondary-light: #2d1b47;
            --accent: #10b981;
            --accent-dark: #059669;
            --danger: #ef4444;
            --danger-dark: #dc2626;
            --success: #10b981;
            --success-dark: #059669;
            --warning: #f59e0b;
            --info: #3b82f6;
            
            --bg-primary: #0a0419;
            --bg-secondary: #1a0b2e;
            --bg-surface: #2d1b47;
            --bg-surface-light: #3d2b57;
            
            --text-primary: #ffffff;
            --text-secondary: #d1d5db;
            --text-dim: #9ca3af;
            
            --border-gold: linear-gradient(45deg, var(--primary), #ffed4e, var(--primary));
            --shadow-gold: 0 0 30px rgba(255, 215, 0, 0.3);
            --shadow-gold-strong: 0 0 50px rgba(255, 215, 0, 0.5);
            
            --dice-red: #ef4444;
            --dice-blue: #3b82f6;
            --dice-green: #10b981;
            --dice-purple: #8b5cf6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            touch-action: pan-y;
        }

        /* Loading Screen */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s;
            backdrop-filter: blur(10px);
        }

        .loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, 
                rgba(26, 11, 46, 0.95),
                rgba(45, 27, 71, 0.95));
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--primary);
            backdrop-filter: blur(15px);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 5px 30px rgba(0, 0, 0, 0.5);
        }

        .balance-container {
            display: flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(135deg, 
                rgba(26, 11, 46, 0.8),
                rgba(45, 27, 71, 0.8));
            padding: 12px 24px;
            border-radius: 25px;
            border: 2px solid var(--primary);
            box-shadow: var(--shadow-gold);
        }

        .balance-amount {
            font-family: 'Orbitron', monospace;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        /* Live Winners Feed */
        .winners-feed {
            background: linear-gradient(135deg, 
                rgba(26, 11, 46, 0.9),
                rgba(45, 27, 71, 0.9));
            padding: 12px 20px;
            border-bottom: 2px solid rgba(255, 215, 0, 0.2);
            backdrop-filter: blur(10px);
            overflow: hidden;
            position: relative;
        }

        .winners-marquee {
            display: flex;
            gap: 40px;
            animation: marquee 40s linear infinite;
            white-space: nowrap;
            padding: 5px 0;
        }

        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        /* Main Game Container */
        .game-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            min-height: calc(100vh - 180px);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Battle Arena */
        .battle-arena {
            flex: 1;
            background: linear-gradient(135deg, 
                rgba(26, 11, 46, 0.8),
                rgba(45, 27, 71, 0.8));
            border-radius: 25px;
            border: 3px solid var(--primary);
            box-shadow: 
                var(--shadow-gold),
                inset 0 0 100px rgba(0, 0, 0, 0.5);
            padding: 30px;
            position: relative;
            overflow: hidden;
        }

        .battle-table {
            position: relative;
            width: 100%;
            height: 500px;
            background: 
                linear-gradient(135deg, 
                    rgba(10, 4, 25, 0.9),
                    rgba(26, 11, 46, 0.9)),
                url('data:image/svg+xml,<svg width="20" height="20" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><rect width="20" height="20" fill="%230a0419"/><path d="M0,0 L20,20 M20,0 L0,20" stroke="%23ffd700" stroke-width="0.5" opacity="0.1"/></svg>');
            border-radius: 20px;
            border: 2px solid rgba(255, 215, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 50px;
        }

        .player-side, .dealer-side {
            width: 45%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            z-index: 2;
        }

        /* Dice Container */
        .dice-container {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .dice {
            width: 100px;
            height: 100px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s;
            cursor: pointer;
        }

        .dice.rolling {
            animation: diceRoll 1s infinite linear;
        }

        @keyframes diceRoll {
            0% { transform: rotateX(0) rotateY(0) rotateZ(0); }
            25% { transform: rotateX(90deg) rotateY(90deg) rotateZ(90deg); }
            50% { transform: rotateX(180deg) rotateY(180deg) rotateZ(180deg); }
            75% { transform: rotateX(270deg) rotateY(270deg) rotateZ(270deg); }
            100% { transform: rotateX(360deg) rotateY(360deg) rotateZ(360deg); }
        }

        .dice-face-real {
            position: absolute;
            width: 100px;
            height: 100px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            border: 3px solid var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            backface-visibility: hidden;
            box-shadow: 
                inset 0 0 20px rgba(0, 0, 0, 0.2),
                0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .dice-pip {
            width: 18px;
            height: 18px;
            background: #000;
            border-radius: 50%;
            position: absolute;
        }

        /* Control Panel */
        .control-panel {
            background: linear-gradient(135deg, 
                rgba(26, 11, 46, 0.95),
                rgba(45, 27, 71, 0.95));
            border-radius: 25px;
            padding: 30px;
            border: 3px solid var(--primary);
            backdrop-filter: blur(20px);
            box-shadow: var(--shadow-gold);
        }

        /* Bet Controls */
        .bet-section {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 30px;
            margin-bottom: 30px;
            align-items: center;
        }

        .bet-input {
            width: 100%;
            padding: 25px;
            background: rgba(10, 4, 25, 0.8);
            border: 3px solid var(--primary);
            border-radius: 20px;
            color: var(--text-primary);
            font-family: 'Orbitron', monospace;
            font-size: 2rem;
            font-weight: 700;
            text-align: center;
            transition: all 0.3s;
        }

        /* Quick Bets */
        .quick-bets {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .quick-bet {
            padding: 20px;
            background: rgba(10, 4, 25, 0.8);
            border: 2px solid var(--primary);
            border-radius: 15px;
            color: var(--primary);
            font-weight: 700;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1.3rem;
        }

        /* Action Buttons */
        .action-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .action-btn {
            padding: 25px;
            border: none;
            border-radius: 20px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .roll-btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #000;
            font-size: 1.8rem;
            font-weight: 900;
        }

        .roll-btn.pulsing {
            animation: pulseGlow 1.5s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { 
                transform: scale(1);
                box-shadow: 0 10px 30px rgba(255, 215, 0, 0.4);
            }
            100% { 
                transform: scale(1.05);
                box-shadow: 0 20px 50px rgba(255, 215, 0, 0.8);
            }
        }

        /* History Panel */
        .history-panel {
            background: linear-gradient(135deg, 
                rgba(26, 11, 46, 0.95),
                rgba(45, 27, 71, 0.95));
            border-radius: 25px;
            padding: 30px;
            border: 3px solid var(--primary);
            backdrop-filter: blur(20px);
            box-shadow: var(--shadow-gold);
            max-height: 400px;
            overflow-y: auto;
        }

        /* Result Overlay */
        .result-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.5s;
            backdrop-filter: blur(20px);
        }

        .result-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        /* Toast Notifications */
        .toast-container {
            position: fixed;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 400px;
            width: 90%;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 15px;
                padding: 10px;
            }
            
            .balance-container {
                width: 100%;
                justify-content: center;
            }
            
            .battle-table {
                height: 300px;
                padding: 0 20px;
                flex-direction: column;
                justify-content: space-around;
            }
            
            .bet-section {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .quick-bets {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .action-buttons {
                grid-template-columns: 1fr;
            }
        }

        /* Fullscreen Specific Styles */
        :fullscreen .game-container {
            max-width: none;
            padding: 10px;
        }
    </style>
</head>

    <script>
        // ===== FIXED TRANSACTION SYSTEM =====
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };

        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ===== GAME STATE =====
        const gameState = {
            currentUser: null,
            balance: 0,
            isAuthenticated: false,
            betAmount: 5,
            minBet: 1,
            maxBet: 1000,
            gameActive: false,
            isRolling: false,
            totalGames: 0,
            winStreak: 0,
            biggestWin: 0,
            
            // 10-15% WIN RATE SYSTEM
            winRate: 0.12, // 12% average
            houseEdge: 0.88, // 88% lose rate
            
            // Bonus system
            bonusSystem: {
                roundsPlayed: 0,
                roundsForBonus: 50,
                bonusAmount: 10,
                bonusEarned: false
            },
            
            // Current game
            currentGame: {
                id: null,
                playerRolls: [0, 0],
                dealerRolls: [0, 0],
                result: null,
                winAmount: 0,
                betAmount: 0,
                timestamp: null
            }
        };

        // ===== ATOMIC TRANSACTION FUNCTION =====
        async function processTransaction(amount, transactionType, description, gameData = {}) {
            try {
                if (!gameState.currentUser) {
                    throw new Error("User not authenticated");
                }
                
                const walletRef = db.collection("wallets").doc(gameState.currentUser.uid);
                
                return await db.runTransaction(async (transaction) => {
                    const walletDoc = await transaction.get(walletRef);
                    
                    if (!walletDoc.exists) {
                        throw new Error("Wallet not found");
                    }
                    
                    const walletData = walletDoc.data();
                    let currentBalance = walletData.balance || 0;
                    
                    // Validate bet amount
                    if (transactionType === "dice_bet") {
                        if (currentBalance < Math.abs(amount)) {
                            throw new Error("Insufficient funds");
                        }
                    }
                    
                    // Calculate new balance
                    const newBalance = currentBalance + amount;
                    
                    if (newBalance < 0) {
                        throw new Error("Insufficient funds after transaction");
                    }
                    
                    // Prepare wallet updates
                    const updates = {
                        balance: newBalance,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    };
                    
                    // Update game statistics
                    if (transactionType === "dice_bet") {
                        updates.totalGames = (walletData.totalGames || 0) + 1;
                        updates.totalWagered = (walletData.totalWagered || 0) + Math.abs(amount);
                    } else if (transactionType === "dice_win") {
                        updates.totalWon = (walletData.totalWon || 0) + amount;
                        
                        // Update biggest win
                        if (amount > (walletData.biggestWin || 0)) {
                            updates.biggestWin = amount;
                        }
                        
                        // Update win streak
                        if (gameData.result === "win") {
                            updates.winStreak = (walletData.winStreak || 0) + 1;
                        } else {
                            updates.winStreak = 0;
                        }
                    }
                    
                    // Update wallet
                    transaction.update(walletRef, updates);
                    
                    // Create transaction record
                    const transactionRef = walletRef.collection("transactions").doc();
                    transaction.set(transactionRef, {
                        userId: gameState.currentUser.uid,
                        type: transactionType,
                        amount: amount,
                        description: description,
                        gameId: gameData.gameId || `dice_${Date.now()}`,
                        gameResult: gameData.result,
                        betAmount: gameData.betAmount,
                        winAmount: gameData.winAmount,
                        playerRolls: gameData.playerRolls,
                        dealerRolls: gameData.dealerRolls,
                        playerTotal: gameData.playerTotal,
                        dealerTotal: gameData.dealerTotal,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                        beforeBalance: currentBalance,
                        afterBalance: newBalance
                    });
                    
                    // Update game history collection
                    if (transactionType === "dice_win" || transactionType === "dice_bet") {
                        const historyRef = db.collection("dice_history").doc();
                        transaction.set(historyRef, {
                            userId: gameState.currentUser.uid,
                            gameId: gameData.gameId,
                            result: gameData.result,
                            betAmount: gameData.betAmount,
                            winAmount: gameData.winAmount,
                            playerRolls: gameData.playerRolls,
                            dealerRolls: gameData.dealerRolls,
                            timestamp: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    }
                    
                    // Update local state
                    gameState.balance = newBalance;
                    updateBalanceDisplay();
                    
                    return { success: true, newBalance };
                });
            } catch (error) {
                console.error("Transaction error:", error);
                showToast(`Transaction failed: ${error.message}`, "error");
                return { success: false, error: error.message };
            }
        }

        // ===== BONUS SYSTEM =====
        async function updateBonusProgress() {
            const bonus = gameState.bonusSystem;
            bonus.roundsPlayed++;
            
            if (bonus.roundsPlayed >= bonus.roundsForBonus && !bonus.bonusEarned) {
                bonus.bonusEarned = true;
                bonus.roundsPlayed = 0;
                
                // Award bonus
                await processTransaction(
                    bonus.bonusAmount,
                    "dice_bonus",
                    `Round completion bonus of $${bonus.bonusAmount}`
                );
                
                showToast(`🎁 Bonus earned! +$${bonus.bonusAmount}`, "success");
            }
            
            // Save bonus progress
            try {
                await db.collection("dice_bonus").doc(gameState.currentUser.uid).set({
                    roundsPlayed: bonus.roundsPlayed,
                    roundsForBonus: bonus.roundsForBonus,
                    bonusAmount: bonus.bonusAmount,
                    bonusEarned: bonus.bonusEarned,
                    updatedAt: new Date()
                });
            } catch (error) {
                console.error("Error saving bonus:", error);
            }
        }

        // ===== GAME LOGIC WITH 10-15% WIN RATE =====
        function calculateGameResult(playerTotal, dealerTotal, betAmount) {
            // Apply house edge: 10-15% win rate
            const random = Math.random();
            
            // Special losing conditions for house edge
            if (playerTotal === 2) { // Snake eyes always loses
                return { result: "lose", winAmount: 0 };
            }
            
            if (playerTotal === 12 && dealerTotal !== 12) { // Boxcars win
                return { result: "win", winAmount: betAmount * 2 };
            }
            
            // Apply weighted win probability
            if (playerTotal > dealerTotal) {
                // Player would normally win, but apply house edge
                if (random < gameState.winRate) { // 12% chance to actually win
                    return { result: "win", winAmount: betAmount * 2 };
                } else {
                    // Force a loss even though player had higher score
                    return { result: "lose", winAmount: 0 };
                }
            } else if (playerTotal < dealerTotal) {
                return { result: "lose", winAmount: 0 };
            } else {
                // Push/tie
                return { result: "push", winAmount: betAmount };
            }
        }

        // ===== GAME FLOW =====
        async function startGame() {
            if (!gameState.isAuthenticated) {
                showToast("Please login to play", "warning");
                return;
            }
            
            const betAmount = parseFloat(document.getElementById("betAmount").value);
            
            // Validate bet
            if (betAmount < gameState.minBet || betAmount > Math.min(gameState.balance, gameState.maxBet)) {
                showToast(`Bet must be between $${gameState.minBet} and $${Math.min(gameState.balance, gameState.maxBet)}`, "error");
                return;
            }
            
            if (gameState.isRolling) {
                showToast("Game in progress", "warning");
                return;
            }
            
            // Create game ID
            gameState.currentGame.id = `dice_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
            gameState.currentGame.betAmount = betAmount;
            
            // Process bet transaction
            const betResult = await processTransaction(
                -betAmount,
                "dice_bet",
                `Dice Battle bet: $${betAmount}`,
                {
                    gameId: gameState.currentGame.id,
                    betAmount: betAmount
                }
            );
            
            if (!betResult.success) {
                return;
            }
            
            // Start game
            gameState.isRolling = true;
            disableControls();
            
            await playGame();
        }

        async function playGame() {
            // Roll dice
            const playerRolls = await rollDice("player");
            const dealerRolls = await rollDice("dealer");
            
            const playerTotal = playerRolls.reduce((a, b) => a + b, 0);
            const dealerTotal = dealerRolls.reduce((a, b) => a + b, 0);
            
            // Calculate result with house edge
            const result = calculateGameResult(playerTotal, dealerTotal, gameState.currentGame.betAmount);
            
            // Update game state
            gameState.currentGame.playerRolls = playerRolls;
            gameState.currentGame.dealerRolls = dealerRolls;
            gameState.currentGame.result = result.result;
            gameState.currentGame.winAmount = result.winAmount;
            gameState.currentGame.timestamp = new Date();
            
            // Process win/loss transaction
            if (result.result === "win" || result.result === "push") {
                const transactionAmount = result.result === "win" ? result.winAmount : gameState.currentGame.betAmount;
                const transactionType = "dice_win";
                
                const winResult = await processTransaction(
                    transactionAmount,
                    transactionType,
                    `Dice Battle ${result.result}: $${result.winAmount.toFixed(2)}`,
                    gameState.currentGame
                );
            }
            
            // Update bonus progress
            await updateBonusProgress();
            
            // Show result
            showGameResult();
            
            // Update history
            addHistoryItem(gameState.currentGame);
            
            // Re-enable controls
            setTimeout(() => {
                gameState.isRolling = false;
                enableControls();
            }, 2000);
        }

        // ===== UI FUNCTIONS =====
        function updateBalanceDisplay() {
            document.getElementById("balanceVal").textContent = gameState.balance.toFixed(2);
        }

        function showToast(message, type = "info") {
            const container = document.getElementById("toastContainer");
            const toast = document.createElement("div");
            toast.className = `toast ${type}`;
            toast.textContent = message;
            
            container.appendChild(toast);
            setTimeout(() => toast.classList.add("show"), 10);
            
            setTimeout(() => {
                toast.classList.remove("show");
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function disableControls() {
            document.getElementById("rollBtn").disabled = true;
            document.getElementById("doubleBtn").disabled = true;
            document.getElementById("betAmount").disabled = true;
        }

        function enableControls() {
            document.getElementById("rollBtn").disabled = false;
            document.getElementById("doubleBtn").disabled = false;
            document.getElementById("betAmount").disabled = false;
        }

        // ===== INITIALIZATION =====
        document.addEventListener("DOMContentLoaded", async () => {
            // Setup event listeners
            document.getElementById("rollBtn").addEventListener("click", startGame);
            document.getElementById("betAmount").addEventListener("input", updatePotentialWin);
            
            // Check authentication
            auth.onAuthStateChanged(async (user) => {
                if (user) {
                    gameState.currentUser = user;
                    gameState.isAuthenticated = true;
                    
                    // Load balance
                    await loadBalance();
                    setupBalanceListener();
                    
                    // Load game history
                    await loadGameHistory();
                    
                    // Setup game
                    generateDice();
                    generateWinnersFeed();
                    
                    document.getElementById("loadingScreen").classList.add("hidden");
                } else {
                    showToast("Please login to play", "warning");
                    setTimeout(() => {
                        window.location.href = "https://xcrazybet.github.io/millioner/login.html";
                    }, 2000);
                }
            });
        });

        async function loadBalance() {
            try {
                const walletDoc = await db.collection("wallets").doc(gameState.currentUser.uid).get();
                if (walletDoc.exists) {
                    const data = walletDoc.data();
                    gameState.balance = data.balance || 0;
                    gameState.totalGames = data.totalGames || 0;
                    gameState.winStreak = data.winStreak || 0;
                    gameState.biggestWin = data.biggestWin || 0;
                    updateBalanceDisplay();
                } else {
                    // Create wallet
                    await db.collection("wallets").doc(gameState.currentUser.uid).set({
                        balance: 100,
                        totalGames: 0,
                        winStreak: 0,
                        biggestWin: 0,
                        createdAt: new Date(),
                        updatedAt: new Date()
                    });
                    gameState.balance = 100;
                    updateBalanceDisplay();
                }
            } catch (error) {
                console.error("Error loading balance:", error);
                showToast("Error loading balance", "error");
            }
        }

        function setupBalanceListener() {
            db.collection("wallets").doc(gameState.currentUser.uid)
                .onSnapshot((doc) => {
                    if (doc.exists) {
                        const data = doc.data();
                        gameState.balance = data.balance || 0;
                        updateBalanceDisplay();
                    }
                });
        }

        // ===== GAME FUNCTIONS =====
        function generateDice() {
            // Generate dice elements
            const playerContainer = document.getElementById("playerDiceContainer");
            const dealerContainer = document.getElementById("dealerDiceContainer");
            
            // Clear containers
            playerContainer.innerHTML = '';
            dealerContainer.innerHTML = '';
            
            // Create dice
            for (let i = 0; i < 2; i++) {
                const dice = createDiceElement();
                playerContainer.appendChild(dice.cloneNode(true));
                dealerContainer.appendChild(dice.cloneNode(true));
            }
        }

        function createDiceElement() {
            const dice = document.createElement("div");
            dice.className = "dice";
            dice.innerHTML = `
                <div class="dice-face-real face-1"></div>
                <div class="dice-face-real face-2"></div>
                <div class="dice-face-real face-3"></div>
                <div class="dice-face-real face-4"></div>
                <div class="dice-face-real face-5"></div>
                <div class="dice-face-real face-6"></div>
            `;
            return dice;
        }

        async function rollDice(side) {
            const diceElements = document.querySelectorAll(`#${side}DiceContainer .dice`);
            const rolls = [];
            
            for (let i = 0; i < diceElements.length; i++) {
                const dice = diceElements[i];
                dice.classList.add("rolling");
                
                // Generate random roll
                const roll = Math.floor(Math.random() * 6) + 1;
                rolls.push(roll);
                
                // Simulate rolling
                await new Promise(resolve => setTimeout(resolve, 1000));
                dice.classList.remove("rolling");
                
                // Update display
                dice.style.transform = `rotateX(${Math.random() * 360}deg) rotateY(${Math.random() * 360}deg)`;
            }
            
            // Update totals
            const total = rolls.reduce((a, b) => a + b, 0);
            document.getElementById(`${side}Total`).textContent = total;
            
            return rolls;
        }

        function showGameResult() {
            const game = gameState.currentGame;
            const result = game.result;
            
            // Update result overlay
            document.getElementById("resultPlayerRoll").textContent = 
                game.playerRolls.reduce((a, b) => a + b, 0);
            document.getElementById("resultDealerRoll").textContent = 
                game.dealerRolls.reduce((a, b) => a + b, 0);
            
            let title, amountText;
            if (result === "win") {
                title = "🎉 YOU WIN!";
                amountText = `+$${game.winAmount.toFixed(2)}`;
            } else if (result === "lose") {
                title = "💸 YOU LOSE";
                amountText = `-$${game.betAmount.toFixed(2)}`;
            } else {
                title = "⚖️ PUSH";
                amountText = `±$${game.betAmount.toFixed(2)}`;
            }
            
            document.getElementById("resultTitle").textContent = title;
            document.getElementById("resultAmount").textContent = amountText;
            
            // Show overlay
            setTimeout(() => {
                document.getElementById("resultOverlay").classList.add("show");
            }, 1000);
        }

        function addHistoryItem(game) {
            const historyList = document.getElementById("historyList");
            const item = document.createElement("div");
            item.className = `history-item ${game.result}`;
            
            const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            const playerTotal = game.playerRolls.reduce((a, b) => a + b, 0);
            const dealerTotal = game.dealerRolls.reduce((a, b) => a + b, 0);
            const amount = game.result === "win" ? `+$${game.winAmount.toFixed(2)}` : 
                         game.result === "lose" ? `-$${game.betAmount.toFixed(2)}` : 
                         `±$${game.betAmount.toFixed(2)}`;
            
            item.innerHTML = `
                <div class="history-details">
                    <div class="history-result ${game.result}">${game.result.toUpperCase()}</div>
                    <div class="history-rolls">
                        ${game.playerRolls[0]}⚅ + ${game.playerRolls[1]}⚅ = ${playerTotal}
                        vs
                        ${game.dealerRolls[0]}⚅ + ${game.dealerRolls[1]}⚅ = ${dealerTotal}
                    </div>
                </div>
                <div class="history-amount ${game.result}">${amount}</div>
                <div class="history-time">${time}</div>
            `;
            
            historyList.insertBefore(item, historyList.firstChild);
            
            // Keep only 10 items
            while (historyList.children.length > 10) {
                historyList.removeChild(historyList.lastChild);
            }
        }

        async function loadGameHistory() {
            try {
                const snapshot = await db.collection("dice_history")
                    .where("userId", "==", gameState.currentUser.uid)
                    .orderBy("timestamp", "desc")
                    .limit(10)
                    .get();
                
                snapshot.forEach(doc => {
                    const data = doc.data();
                    addHistoryItem(data);
                });
            } catch (error) {
                console.error("Error loading history:", error);
            }
        }

        function generateWinnersFeed() {
            const marquee = document.getElementById("winnersMarquee");
            const nicknames = ["LuckyRoller", "DiceKing", "GoldenHand", "JackpotJill", "HighRollerX"];
            
            for (let i = 0; i < 5; i++) {
                const name = nicknames[Math.floor(Math.random() * nicknames.length)];
                const amount = Math.floor(Math.random() * 5000) + 100;
                
                const winner = document.createElement("div");
                winner.className = "winner-item";
                winner.innerHTML = `
                    <div class="winner-avatar">${name.charAt(0)}</div>
                    <div class="winner-name">${name}</div>
                    <div class="winner-amount">$${amount}</div>
                `;
                marquee.appendChild(winner);
            }
        }

        function updatePotentialWin() {
            const betAmount = parseFloat(document.getElementById("betAmount").value) || 0;
            document.getElementById("potentialWin").textContent = `$${(betAmount * 2).toFixed(2)}`;
        }

        // Setup play again button
        document.getElementById("playAgainBtn").addEventListener("click", () => {
            document.getElementById("resultOverlay").classList.remove("show");
            // Reset dice
            document.querySelectorAll(".dice").forEach(dice => {
                dice.style.transform = "rotateX(0) rotateY(0)";
            });
            document.getElementById("playerTotal").textContent = "0";
            document.getElementById("dealerTotal").textContent = "0";
        });
    </script>
</body>
</html>
