<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Login - DeepLookers | AI Social Media Platform</title>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --dl-primary: #6c5ce7;
            --dl-secondary: #00cec9;
            --dl-accent: #fd79a8;
            --dl-gold: #fdcb6e;
            --dl-dark: #0a0a1a;
            --dl-dark-light: #1a1a2e;
            --dl-text: #ffffff;
            --dl-text-secondary: rgba(255,255,255,0.7);
            --dl-gradient: linear-gradient(135deg, #6c5ce7 0%, #00cec9 100%);
            --dl-success: #00b894;
            --dl-danger: #ff7675;
            --dl-warning: #fdcb6e;
        }
        
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a2e 50%, #0a0a1a 100%);
            color: var(--dl-text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        
        /* Animated background particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--dl-secondary);
            border-radius: 50%;
            animation: float 15s infinite;
            opacity: 0.3;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-100px) rotate(180deg); }
        }
        
        .container {
            max-width: 450px;
            width: 100%;
            background: rgba(26, 26, 46, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            position: relative;
            z-index: 1;
            border: 1px solid rgba(108, 92, 231, 0.3);
            backdrop-filter: blur(10px);
        }
        
        .header {
            background: var(--dl-gradient);
            padding: 30px 25px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: rotate 10s linear infinite;
        }
        @keyframes rotate { 100% { transform: rotate(360deg); } }
        
        .header-logo {
            position: relative;
            z-index: 1;
            font-size: 40px;
            margin-bottom: 10px;
        }
        .header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            position: relative;
            z-index: 1;
        }
        .header p {
            font-size: 14px;
            opacity: 0.95;
            position: relative;
            z-index: 1;
        }
        
        .content {
            padding: 30px 25px;
        }
        
        .google-btn {
            width: 100%;
            padding: 14px;
            background: white;
            color: #333;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .google-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }
        
        .divider {
            text-align: center;
            position: relative;
            margin: 25px 0;
            color: var(--dl-text-secondary);
            font-size: 14px;
        }
        .divider::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: rgba(255,255,255,0.1);
        }
        .divider span {
            background: var(--dl-dark-light);
            padding: 0 15px;
            position: relative;
            z-index: 1;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: var(--dl-text);
        }
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            color: var(--dl-text);
            font-size: 15px;
            transition: all 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--dl-primary);
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.2);
            background: rgba(255,255,255,0.08);
        }
        .form-group input::placeholder {
            color: rgba(255,255,255,0.3);
        }
        
        .forgot-password {
            text-align: right;
            margin-top: 8px;
        }
        .forgot-password a {
            color: var(--dl-text-secondary);
            text-decoration: none;
            font-size: 13px;
            transition: all 0.3s;
        }
        .forgot-password a:hover {
            color: var(--dl-secondary);
            text-decoration: underline;
        }
        
        .keep-logged-in {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 15px 0;
            cursor: pointer;
        }
        .keep-logged-in input {
            width: 18px;
            height: 18px;
            accent-color: var(--dl-primary);
            cursor: pointer;
        }
        .keep-logged-in label {
            font-size: 14px;
            color: var(--dl-text-secondary);
            cursor: pointer;
        }
        
        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            background: var(--dl-gradient);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
            position: relative;
            overflow: hidden;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(108, 92, 231, 0.4);
        }
        .btn:active {
            transform: translateY(0);
        }
        .btn:disabled {
            background: #475569;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .btn .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .status-message {
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 14px;
            display: none;
        }
        .success {
            background: rgba(0, 184, 148, 0.1);
            color: var(--dl-success);
            border: 1px solid rgba(0, 184, 148, 0.3);
        }
        .error {
            background: rgba(255, 118, 117, 0.1);
            color: var(--dl-danger);
            border: 1px solid rgba(255, 118, 117, 0.3);
        }
        
        .register-link {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: var(--dl-text-secondary);
        }
        .register-link a {
            color: var(--dl-secondary);
            text-decoration: none;
            font-weight: 600;
        }
        .register-link a:hover {
            text-decoration: underline;
        }
        
        .back-home {
            text-align: center;
            margin-top: 15px;
        }
        .back-home a {
            color: var(--dl-text-secondary);
            text-decoration: none;
            font-size: 13px;
        }
        .back-home a:hover {
            color: var(--dl-primary);
        }
        
        @media (max-width: 480px) {
            .container {
                border-radius: 15px;
            }
            .content {
                padding: 20px 15px;
            }
            .header {
                padding: 25px 15px;
            }
            .header h1 {
                font-size: 24px;
            }
            .btn {
                padding: 14px;
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
    <!-- Animated Particles -->
    <div class="particles" id="particles"></div>

    <div class="container">
        <div class="header">
            <div class="header-logo">👁️</div>
            <h1>Welcome Back</h1>
            <p>Sign in to DeepLookers</p>
        </div>
        
        <div class="content">
            <div id="status-message" class="status-message"></div>
            
            <!-- Google Sign In -->
            <button class="google-btn" onclick="signInWithGoogle()">
                <svg width="20" height="20" viewBox="0 0 48 48">
                    <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/>
                    <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/>
                    <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/>
                    <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/>
                </svg>
                Sign in with Google
            </button>
            
            <div class="divider"><span>or sign in with email</span></div>
            
            <form id="login-form">
                <div class="form-group">
                    <label for="email"><i class="fas fa-envelope"></i> Email Address</label>
                    <input type="email" id="email" name="email" placeholder="yourname@gmail.com" required autocomplete="email">
                </div>
                
                <div class="form-group">
                    <label for="password"><i class="fas fa-lock"></i> Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
                    <div class="forgot-password">
                        <a href="#" id="forgot-password-link">Forgot password?</a>
                    </div>
                </div>
                
                <div class="keep-logged-in">
                    <input type="checkbox" id="keep-logged-in" checked>
                    <label for="keep-logged-in">Keep me logged in</label>
                </div>
                
                <button type="submit" class="btn" id="submit-btn">
                    <span id="btn-text">Sign In</span>
                    <span id="btn-loader" class="loading" style="display: none;"></span>
                </button>
            </form>
            
            <div class="register-link">
                Don't have an account? <a href="register.html">Register now - it's free!</a>
            </div>
            
            <div class="back-home">
                <a href="index.html"><i class="fas fa-arrow-left"></i> Back to Home</a>
            </div>
        </div>
    </div>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962",
            measurementId: "G-PTV4XMYQ6P"
        };
        
        // Supabase Configuration
        const SUPABASE_URL = 'https://jnazybaeajyynpyoszmy.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpuYXp5YmFlYWp5eW5weW9zem15Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyNzgwMDMsImV4cCI6MjA5Mjg1NDAwM30.P_8V-_s6DQDiYekZX1yaNup48WBRaLhb3ILAkvzTDTY';
        
        let auth, db, supabaseClient;
        
        document.addEventListener('DOMContentLoaded', function() {
            // Create particles
            createParticles();
            
            // Initialize Firebase
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            auth = firebase.auth();
            db = firebase.firestore();
            
            // Initialize Supabase
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            
            const form = document.getElementById('login-form');
            const statusMessage = document.getElementById('status-message');
            const submitBtn = document.getElementById('submit-btn');
            const btnText = document.getElementById('btn-text');
            const btnLoader = document.getElementById('btn-loader');
            const forgotPasswordLink = document.getElementById('forgot-password-link');
            const keepLoggedIn = document.getElementById('keep-logged-in');
            
            // Forgot Password handler
            forgotPasswordLink.addEventListener('click', async function(e) {
                e.preventDefault();
                const email = document.getElementById('email').value.trim();
                
                if (!email || !isValidEmail(email)) {
                    showStatus("Please enter your email address to reset password.", "error");
                    return;
                }
                
                try {
                    setLoading(true, "Sending reset email...");
                    await auth.sendPasswordResetEmail(email);
                    showStatus(`Password reset email sent to ${email}. Please check your inbox.`, "success");
                } catch (error) {
                    handleAuthError(error, "reset password");
                } finally {
                    setLoading(false, "Sign In");
                }
            });
            
            // Login form submission
            form.addEventListener('submit', async function(event) {
                event.preventDefault();
                
                // Clear previous status
                statusMessage.style.display = 'none';
                statusMessage.className = 'status-message';
                
                // Get form values
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;
                const rememberMe = keepLoggedIn.checked;
                
                // Basic validation
                if (!email || !password) {
                    showStatus("Please fill in all required fields.", "error");
                    return;
                }
                
                if (!isValidEmail(email)) {
                    showStatus("Please enter a valid email address.", "error");
                    return;
                }
                
                // Set persistence based on remember me
                try {
                    if (rememberMe) {
                        await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
                    } else {
                        await auth.setPersistence(firebase.auth.Auth.Persistence.SESSION);
                    }
                } catch (persistError) {
                    console.warn("Could not set persistence:", persistError);
                }
                
                // Show loading state
                setLoading(true, "Signing in...");
                
                try {
                    // Authenticate with Firebase
                    const userCredential = await auth.signInWithEmailAndPassword(email, password);
                    const user = userCredential.user;
                    
                    // Fetch user data from Firestore
                    let userData = null;
                    try {
                        const doc = await db.collection("wallets").doc(user.uid).get();
                        if (doc.exists) {
                            userData = doc.data();
                            
                            // Store user data in localStorage
                            localStorage.setItem('user_uid', user.uid);
                            localStorage.setItem('user_email', user.email);
                            localStorage.setItem('user_username', userData.username || user.displayName || 'User');
                            localStorage.setItem('user_balance', userData.balance || 0);
                            localStorage.setItem('user_wallet_id', userData.walletId || '');
                            localStorage.setItem('user_avatar', userData.avatarUrl || '');
                        }
                    } catch (dbError) {
                        console.warn("Could not fetch user data:", dbError);
                    }
                    
                    // Update last login in Firestore
                    try {
                        await db.collection("wallets").doc(user.uid).update({
                            lastLogin: firebase.firestore.FieldValue.serverTimestamp(),
                            lastActivity: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    } catch (updateError) {
                        console.warn("Could not update last login:", updateError);
                    }
                    
                    // Sync with Supabase
                    try {
                        await supabaseClient.from('users').upsert({
                            firebase_uid: user.uid,
                            email: user.email.toLowerCase(),
                            username: userData?.username || user.displayName || user.email.split('@')[0],
                            updated_at: new Date().toISOString()
                        }, { onConflict: 'firebase_uid' });
                    } catch (supabaseError) {
                        console.warn("Supabase sync delayed:", supabaseError);
                    }
                    
                    // Success
                    showStatus(`Welcome back! Redirecting...`, "success");
                    
                    // Redirect to index.html
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1000);
                    
                } catch (error) {
                    handleAuthError(error, "sign in");
                } finally {
                    setLoading(false, "Sign In");
                }
            });
            
            function handleAuthError(error, action) {
                let errorMessage = `Failed to ${action}. Please try again.`;
                
                switch(error.code) {
                    case 'auth/user-not-found':
                        errorMessage = "No account found with this email address.";
                        break;
                    case 'auth/wrong-password':
                        errorMessage = "Incorrect password. Please try again.";
                        break;
                    case 'auth/invalid-email':
                        errorMessage = "The email address is not valid.";
                        break;
                    case 'auth/user-disabled':
                        errorMessage = "This account has been disabled. Please contact support.";
                        break;
                    case 'auth/too-many-requests':
                        errorMessage = "Too many failed attempts. Please try again later.";
                        break;
                    case 'auth/network-request-failed':
                        errorMessage = "Network error. Please check your internet connection.";
                        break;
                    case 'auth/invalid-credential':
                        errorMessage = "Invalid email or password. Please try again.";
                        break;
                    default:
                        errorMessage = error.message || `An error occurred during ${action}.`;
                }
                
                showStatus(errorMessage, "error");
                console.error("Login error:", error.code, error.message);
            }
            
            function showStatus(message, type) {
                statusMessage.textContent = message;
                statusMessage.className = `status-message ${type}`;
                statusMessage.style.display = 'block';
                
                if (type === 'error') {
                    setTimeout(() => {
                        statusMessage.style.display = 'none';
                    }, 5000);
                }
            }
            
            function setLoading(isLoading, text = "Sign In") {
                submitBtn.disabled = isLoading;
                btnText.textContent = text;
                btnLoader.style.display = isLoading ? 'inline-block' : 'none';
            }
            
            function isValidEmail(email) {
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                return emailRegex.test(email);
            }
            
            function createParticles() {
                const container = document.getElementById('particles');
                for (let i = 0; i < 30; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'particle';
                    particle.style.left = Math.random() * 100 + '%';
                    particle.style.top = Math.random() * 100 + '%';
                    particle.style.animationDelay = Math.random() * 15 + 's';
                    particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
                    container.appendChild(particle);
                }
            }
            
            // Auto-focus on email field
            document.getElementById('email').focus();
            
            console.log("DeepLookers Login page ready");
        });
        
        // Google Sign In
        async function signInWithGoogle() {
            try {
                const provider = new firebase.auth.GoogleAuthProvider();
                const result = await auth.signInWithPopup(provider);
                const user = result.user;
                
                // Check if wallet exists
                const walletRef = db.collection('wallets').doc(user.uid);
                const walletDoc = await walletRef.get();
                
                if (!walletDoc.exists) {
                    // Create wallet for Google user
                    const walletId = `DL-${Date.now().toString(36)}-${Math.random().toString(36).substring(2, 8)}`.toUpperCase();
                    
                    await walletRef.set({
                        balance: 0.00,
                        currentBalance: 0.00,
                        userId: user.uid,
                        email: user.email.toLowerCase(),
                        username: user.displayName || user.email.split('@')[0],
                        walletId: walletId,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                        status: 'active',
                        isAdmin: false,
                        verified: true,
                        currency: "USD",
                        platform: 'deeplookers',
                        googleAuth: true
                    });
                }
                
                // Store user data
                localStorage.setItem('user_uid', user.uid);
                localStorage.setItem('user_email', user.email);
                localStorage.setItem('user_username', user.displayName || user.email.split('@')[0]);
                
                showStatus('Google sign in successful! Redirecting...', 'success');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);
                
            } catch (error) {
                console.error("Google sign in error:", error);
                showStatus('Google sign in failed: ' + error.message, 'error');
            }
        }
    </script>
</body>
</html>
