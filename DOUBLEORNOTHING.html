<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎯 DOUBLE OR NOTHING - XCrazyBet</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --primary: #00ff9d;
            --primary-dark: #00cc7a;
            --secondary: #ff9800;
            --secondary-dark: #cc7a00;
            --danger: #ff5252;
            --success: #4caf50;
            --warning: #ffc107;
            --bg: #0a0f1a;
            --surface: #111827;
            --surface-light: #1a2332;
            --text: #ffffff;
            --text-dim: #a0a8c9;
            --selected-bg: linear-gradient(135deg, #00ff9d22, #ff980022);
            --game-grid: linear-gradient(135deg, #0f2b1a 0%, #1a1a2e 100%);
            --drawn-color: linear-gradient(135deg, #ff9800, #ff5252);
            --selected-color: linear-gradient(135deg, #00ff9d, #00cc7a);
            --dark-bg: #000000;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Segoe UI', 'Roboto', system-ui, -apple-system, sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Background Effects */
        .bg-effects {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: 
                radial-gradient(circle at 20% 30%, rgba(0, 255, 157, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(255, 152, 0, 0.08) 0%, transparent 50%),
                linear-gradient(135deg, var(--dark-bg) 0%, var(--bg) 100%);
        }

        /* Header */
        .header {
            background: rgba(17, 24, 39, 0.95);
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .home-btn {
            width: 36px;
            height: 36px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #000;
            font-size: 18px;
            transition: all 0.3s;
        }

        .home-btn:hover {
            background: var(--primary-dark);
            transform: scale(1.1);
        }

        .logo {
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--primary);
        }

        .logo i {
            color: var(--primary);
        }

        .balance-display {
            background: linear-gradient(45deg, #1a2332, #0f172a);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--primary);
            color: var(--primary);
            font-weight: 700;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 140px;
            justify-content: center;
        }

        /* Main Container */
        .game-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            min-height: calc(100vh - 140px);
        }

        /* Game Area */
        .game-area {
            background: var(--game-grid);
            border-radius: 20px;
            border: 8px solid #006400;
            padding: 20px;
            position: relative;
            box-shadow: 
                0 10px 40px rgba(0, 0, 0, 0.5),
                inset 0 0 100px rgba(0, 0, 0, 0.3);
            min-height: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Game Title */
        .game-title {
            text-align: center;
            color: var(--secondary);
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 30px;
            text-shadow: 0 0 10px rgba(255, 152, 0, 0.5);
        }

        .game-title i {
            color: var(--primary);
            margin-right: 10px;
        }

        /* Round Indicator */
        .round-indicator {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 15px;
            padding: 15px 30px;
            margin-bottom: 30px;
            border: 2px solid rgba(255, 152, 0, 0.3);
            text-align: center;
            min-width: 300px;
        }

        .round-title {
            font-size: 14px;
            color: var(--text-dim);
            margin-bottom: 5px;
        }

        .round-display {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
        }

        .multiplier-display {
            font-size: 32px;
            font-weight: 900;
            color: var(--secondary);
            text-shadow: 0 0 10px rgba(255, 152, 0, 0.5);
            margin-top: 5px;
        }

        /* Main Game Circle */
        .game-circle {
            width: 250px;
            height: 250px;
            background: radial-gradient(circle at 30% 30%, #00ff9d, #00cc7a);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            box-shadow: 
                0 0 60px rgba(0, 255, 157, 0.6),
                0 0 100px rgba(0, 255, 157, 0.3),
                inset 0 0 60px rgba(255, 255, 255, 0.2);
            transition: all 0.3s;
            margin: 30px 0;
        }

        .game-circle:active {
            transform: scale(0.95);
        }

        .game-circle.win {
            background: radial-gradient(circle at 30% 30%, #4caf50, #2e7d32);
            animation: winPulse 2s infinite;
        }

        .game-circle.lose {
            background: radial-gradient(circle at 30% 30%, #ff5252, #ff1744);
            animation: loseShake 0.5s;
        }

        .circle-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(0, 255, 157, 0.2), transparent 70%);
            border-radius: 50%;
            filter: blur(20px);
            z-index: -1;
        }

        .circle-text {
            font-size: 36px;
            font-weight: 900;
            color: #000;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        /* Countdown Display */
        .countdown-display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 100px;
            font-weight: 900;
            color: var(--secondary);
            text-shadow: 0 0 30px rgba(255, 152, 0, 0.8);
            z-index: 10;
            display: none;
        }

        .countdown-display.show {
            display: block;
            animation: countdownPop 0.5s ease-out;
        }

        /* Result Banner */
        .result-banner {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            padding: 15px;
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            z-index: 90;
            transform: translateY(-100%);
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            backdrop-filter: blur(20px);
            border-bottom: 3px solid;
        }

        .result-banner.show {
            transform: translateY(0);
            opacity: 1;
        }

        .result-banner.win {
            background: linear-gradient(90deg, rgba(0, 255, 157, 0.1), rgba(0, 255, 157, 0.2));
            color: var(--primary);
            border-color: var(--primary);
            animation: winGlow 2s infinite;
        }

        .result-banner.lose {
            background: linear-gradient(90deg, rgba(255, 82, 82, 0.1), rgba(255, 82, 82, 0.2));
            color: var(--danger);
            border-color: var(--danger);
            animation: losePulse 1s infinite;
        }

        /* Control Panel */
        .control-panel {
            background: rgba(17, 24, 39, 0.95);
            border-radius: 15px;
            padding: 20px;
            border: 2px solid rgba(255, 152, 0, 0.2);
            backdrop-filter: blur(10px);
            margin-top: 20px;
        }

        /* Bet Controls */
        .bet-controls {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 15px;
            margin-bottom: 20px;
            align-items: center;
        }

        @media (max-width: 768px) {
            .bet-controls {
                grid-template-columns: 1fr;
            }
        }

        .bet-input-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .bet-input {
            flex: 1;
            padding: 15px;
            background: rgba(10, 15, 26, 0.8);
            border: 2px solid var(--primary);
            border-radius: 10px;
            color: var(--text);
            font-size: 18px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .bet-input:focus {
            outline: none;
            border-color: var(--secondary);
            box-shadow: 0 0 0 3px rgba(255, 152, 0, 0.1);
        }

        .currency {
            color: var(--primary);
            font-weight: 700;
            font-size: 18px;
            min-width: 20px;
        }

        /* Quick Bets */
        .quick-bets {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .quick-bet {
            padding: 12px;
            background: rgba(10, 15, 26, 0.8);
            border: 1px solid var(--primary);
            border-radius: 8px;
            color: var(--primary);
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }

        .quick-bet:hover {
            background: var(--primary);
            color: #000;
            transform: translateY(-2px);
        }

        .quick-bet.active {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 15px rgba(0, 255, 157, 0.5);
        }

        /* Action Buttons */
        .action-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 16px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #000;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 255, 157, 0.3);
        }

        .btn-secondary {
            background: linear-gradient(135deg, var(--secondary), var(--secondary-dark));
            color: #000;
        }

        .btn-secondary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 152, 0, 0.3);
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--danger), #ff1e1e);
            color: #fff;
        }

        .btn-danger:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 82, 82, 0.3);
        }

        /* Game Status */
        .game-status {
            text-align: center;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            margin-top: 15px;
            font-weight: 600;
            color: var(--primary);
            border: 1px solid rgba(0, 255, 157, 0.2);
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 5px;
        }

        /* Results Panel */
        .results-panel {
            background: rgba(17, 24, 39, 0.8);
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            border: 2px solid rgba(255, 152, 0, 0.2);
            display: none;
        }

        .results-panel.show {
            display: block;
            animation: slideUp 0.5s ease-out;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 152, 0, 0.2);
        }

        .results-title {
            color: var(--secondary);
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .result-item {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .result-label {
            color: var(--text-dim);
            font-size: 12px;
            margin-bottom: 5px;
        }

        .result-value {
            color: var(--text);
            font-size: 18px;
            font-weight: 700;
        }

        .result-value.win {
            color: var(--primary);
        }

        .result-value.lose {
            color: var(--danger);
        }

        /* Recent Winners */
        .winners-panel {
            background: rgba(17, 24, 39, 0.8);
            border-radius: 15px;
            padding: 15px;
            margin-top: 15px;
            border: 1px solid rgba(255, 152, 0, 0.2);
            max-height: 200px;
            overflow-y: auto;
        }

        .winners-title {
            font-size: 14px;
            color: var(--secondary);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 152, 0, 0.2);
        }

        .winners-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .winner-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            background: rgba(10, 15, 26, 0.5);
            border-radius: 8px;
            font-size: 12px;
        }

        .winner-icon {
            color: var(--primary);
            font-size: 10px;
        }

        .winner-name {
            font-weight: 600;
            color: var(--text);
        }

        .winner-amount {
            margin-left: auto;
            color: var(--primary);
            font-weight: 700;
        }

        /* Game History */
        .history-panel {
            background: rgba(17, 24, 39, 0.8);
            border-radius: 15px;
            padding: 15px;
            margin-top: 15px;
            border: 1px solid rgba(255, 152, 0, 0.2);
            max-height: 200px;
            overflow-y: auto;
        }

        .history-title {
            font-size: 14px;
            color: var(--secondary);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 152, 0, 0.2);
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: rgba(10, 15, 26, 0.5);
            border-radius: 8px;
            font-size: 12px;
            border-left: 3px solid var(--primary);
        }

        .history-item.win {
            border-left-color: var(--primary);
            background: rgba(0, 255, 157, 0.05);
        }

        .history-item.lose {
            border-left-color: var(--danger);
            background: rgba(255, 82, 82, 0.05);
        }

        .history-action {
            color: var(--text-dim);
        }

        .history-result {
            font-weight: 600;
        }

        .history-result.win {
            color: var(--primary);
        }

        .history-result.lose {
            color: var(--danger);
        }

        /* Return to Games Button */
        .return-games-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(17, 24, 39, 0.95);
            border: 2px solid var(--primary);
            border-radius: 10px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .return-games-btn:hover {
            background: var(--primary);
            color: #000;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }

        /* Toast Notifications */
        .toast-container {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 300px;
            width: 90%;
        }

        .toast {
            padding: 15px;
            background: rgba(17, 24, 39, 0.95);
            border-radius: 10px;
            border-left: 4px solid var(--primary);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
            transform: translateY(100%);
            opacity: 0;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
            font-size: 14px;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.success {
            border-color: var(--primary);
        }

        .toast.error {
            border-color: var(--danger);
        }

        .toast.warning {
            border-color: var(--secondary);
        }

        /* Bottom Navigation */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            background: rgba(17, 24, 39, 0.95);
            padding: 12px 15px;
            border-top: 1px solid rgba(0, 255, 157, 0.2);
            backdrop-filter: blur(10px);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--text-dim);
            font-size: 11px;
            gap: 4px;
            transition: all 0.3s;
        }

        .nav-item i {
            font-size: 18px;
        }

        .nav-item.active {
            color: var(--primary);
        }

        .nav-item:hover {
            color: var(--secondary);
        }

        /* Loading Overlay */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .loading-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 5px solid rgba(255, 152, 0, 0.3);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 1s ease-in-out infinite;
        }

        /* Animations */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        @keyframes winPulse {
            0%, 100% { 
                transform: scale(1); 
                box-shadow: 0 0 60px rgba(0, 255, 157, 0.6);
            }
            50% { 
                transform: scale(1.05); 
                box-shadow: 0 0 100px rgba(0, 255, 157, 0.8);
            }
        }

        @keyframes loseShake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }

        @keyframes countdownPop {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            70% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        @keyframes winGlow {
            0%, 100% { box-shadow: 0 0 30px rgba(0, 255, 157, 0.5); }
            50% { box-shadow: 0 0 60px rgba(0, 255, 157, 0.5); }
        }

        @keyframes losePulse {
            0%, 100% { box-shadow: 0 0 20px rgba(255, 82, 82, 0.5); }
            50% { box-shadow: 0 0 40px rgba(255, 82, 82, 0.5); }
        }

        @keyframes slideUp {
            0% { transform: translateY(20px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 10px;
                padding: 10px;
            }

            .header-left {
                width: 100%;
                justify-content: space-between;
            }

            .balance-display {
                width: 100%;
                min-width: auto;
            }

            .game-container {
                padding: 10px;
                gap: 10px;
            }

            .game-area {
                padding: 15px;
                min-height: 400px;
            }

            .game-title {
                font-size: 22px;
                margin-bottom: 20px;
            }

            .game-circle {
                width: 200px;
                height: 200px;
                margin: 20px 0;
            }

            .circle-text {
                font-size: 28px;
            }

            .round-indicator {
                min-width: 250px;
                padding: 12px 20px;
            }

            .round-display {
                font-size: 20px;
            }

            .multiplier-display {
                font-size: 28px;
            }

            .countdown-display {
                font-size: 80px;
            }

            .result-banner {
                font-size: 20px;
                top: 10px;
                padding: 12px;
            }

            .bet-controls {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .quick-bets {
                grid-template-columns: repeat(2, 1fr);
            }

            .action-buttons {
                grid-template-columns: 1fr;
            }

            .results-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .return-games-btn {
                bottom: 15px;
                right: 15px;
                padding: 10px 15px;
                font-size: 14px;
            }

    <script>
        // ===== FIREBASE CONFIG =====
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ===== GAME STATE =====
        const gameState = {
            currentUser: null,
            balance: 0,
            betAmount: 5,
            currentRound: 1,
            maxRounds: 7,
            totalMultiplier: 2,
            gameActive: false,
            countdownActive: false,
            canDouble: false,
            canCollect: false,
            sessionId: null,
            
            // Hidden win probability (10-15% win, 85-90% lose)
            hiddenWinChance: {
                min: 0.10,
                max: 0.15
            },
            
            // Game history
            gameHistory: [],
            
            // Current game results
            currentGame: {
                round: 0,
                multiplier: 0,
                win: false,
                payout: 0
            },
            
            // Winners list
            recentWinners: []
        };

        // ===== NICKNAME POOL (100+ names) =====
        const nicknamePool = [
            "Michel", "John", "Loze", "Laza", "Roza", "Kako", "Abduo", "Aban", "Khan", "Shekh",
            "Jack", "Trump", "Bino", "Baker", "Baby", "Love", "Exist", "Bebo", "Naren", "Jihan",
            "Orhan", "Osman", "Dodo", "Namiq", "Sarden", "Soraya", "Ssoo", "Xo120", "Parto", "Panda",
            "Bear", "Ghost", "Beast", "Bets", "Bubble", "Bombo", "Fat", "Slima", "Lovelygirl", "Kurd",
            "Egypt", "TurkOrhan", "Narmen", "Lord", "King", "Prince", "Princes", "Kingdom", "Kobra", "Copra",
            "Plantin", "Silver", "Gold", "Gama", "Bitcon", "Xprt", "Zoology", "Biology", "Alpha", "Beta",
            "Gamma", "Delta", "Epsilon", "Zeta", "Eta", "Theta", "Iota", "Kappa", "Lambda", "Mu",
            "Nu", "Xi", "Omicron", "Pi", "Rho", "Sigma", "Tau", "Upsilon", "Phi", "Chi",
            "Psi", "Omega", "Nova", "Stellar", "Cosmo", "Galaxy", "Quantum", "Proton", "Neutron", "Electron",
            "Photon", "Quark", "Atom", "Molecule", "Cell", "Gene", "DNA", "RNA", "Virus", "Bacteria"
        ];

        // ===== INITIALIZATION =====
        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            setupEventListeners();
            updateGameStatus('Place your bet and tap START to begin');
            generateWinnersList();
            loadGameHistory();
        });

        // ===== AUTHENTICATION =====
        function checkAuth() {
            auth.onAuthStateChanged(user => {
                if (!user) {
                    showToast('Please login to play', 'error');
                    setTimeout(() => {
                        window.location.href = 'https://xcrazybet.github.io/millioner/login.html';
                    }, 2000);
                    return;
                }
                gameState.currentUser = user;
                loadBalance();
                setupRealTimeListeners();
            });
        }

        // ===== BALANCE MANAGEMENT =====
        async function loadBalance() {
            try {
                const doc = await db.collection("wallets").doc(gameState.currentUser.uid).get();
                if (doc.exists) {
                    gameState.balance = doc.data().balance || 0;
                    updateBalanceDisplay();
                } else {
                    await db.collection("wallets").doc(gameState.currentUser.uid).set({
                        balance: 100,
                        createdAt: new Date(),
                        updatedAt: new Date()
                    });
                    gameState.balance = 100;
                    updateBalanceDisplay();
                }
            } catch (error) {
                console.error('Error loading balance:', error);
                showToast('Error loading balance', 'error');
            }
        }

        function updateBalanceDisplay() {
            document.getElementById('balance-val').textContent = gameState.balance.toFixed(2);
            updateBetLimits();
        }

        // ===== REAL-TIME LISTENERS =====
        function setupRealTimeListeners() {
            const walletRef = db.collection("wallets").doc(gameState.currentUser?.uid);
            
            walletRef.onSnapshot((doc) => {
                if (doc.exists) {
                    const newBalance = doc.data().balance || 0;
                    if (newBalance !== gameState.balance) {
                        gameState.balance = newBalance;
                        updateBalanceDisplay();
                    }
                }
            }, (error) => {
                console.error('Balance listener error:', error);
            });
        }

        // ===== ATOMIC TRANSACTIONS =====
        async function processTransaction(amount, type, description) {
            try {
                const walletRef = db.collection("wallets").doc(gameState.currentUser.uid);
                
                return await db.runTransaction(async (transaction) => {
                    const walletDoc = await transaction.get(walletRef);
                    
                    if (!walletDoc.exists) {
                        throw new Error("Wallet not found");
                    }
                    
                    const currentBalance = walletDoc.data().balance || 0;
                    const newBalance = currentBalance + amount;
                    
                    if (newBalance < 0) {
                        throw new Error("Insufficient funds");
                    }
                    
                    // Update main balance
                    transaction.update(walletRef, {
                        balance: newBalance,
                        updatedAt: new Date()
                    });
                    
                    // Record transaction
                    const transactionRef = walletRef.collection("transactions").doc();
                    transaction.set(transactionRef, {
                        type: type,
                        amount: amount,
                        description: description,
                        createdAt: new Date(),
                        gameId: gameState.sessionId || 'double_or_nothing',
                        beforeBalance: currentBalance,
                        afterBalance: newBalance
                    });
                    
                    // Update local balance
                    gameState.balance = newBalance;
                    updateBalanceDisplay();
                    
                    return { success: true, newBalance };
                    
                });
            } catch (error) {
                console.error('Transaction failed:', error);
                showToast('Transaction failed: ' + error.message, 'error');
                return { success: false, error: error.message };
            }
        }

        // ===== GAME FUNCTIONS =====
        function updateGameStatus(message) {
            document.getElementById('game-status').textContent = message;
        }

        function updateBetLimits() {
            const betInput = document.getElementById('bet-amount');
            betInput.max = Math.min(gameState.balance, 1000);
            
            if (parseFloat(betInput.value) > betInput.max) {
                betInput.value = betInput.max;
                gameState.betAmount = betInput.max;
            }
        }

        function updateRoundIndicator() {
            document.getElementById('current-round').textContent = gameState.currentRound;
            document.getElementById('current-multiplier').textContent = `${gameState.totalMultiplier}x`;
        }

        // ===== HIDDEN WIN/LOSE SYSTEM =====
        function calculateWinResult() {
            // Generate random win chance between 10-15%
            const winChance = gameState.hiddenWinChance.min + 
                Math.random() * (gameState.hiddenWinChance.max - gameState.hiddenWinChance.min);
            
            // Random roll
            const roll = Math.random();
            
            // Apply win chance (10-15% win rate)
            if (roll <= winChance) {
                return { win: true };
            } else {
                return { win: false };
            }
        }

        // ===== GAME ACTIONS =====
        async function startGame() {
            const betAmount = parseFloat(document.getElementById('bet-amount').value);
            
            // Validation
            if (betAmount < 1 || betAmount > Math.min(gameState.balance, 1000)) {
                showToast('Invalid bet amount', 'error');
                return;
            }
            
            if (gameState.gameActive) {
                showToast('Game already in progress', 'warning');
                return;
            }
            
            // Process bet transaction
            const result = await processTransaction(
                -betAmount,
                "double_or_nothing_bet",
                `Double or Nothing bet of $${betAmount}`
            );
            
            if (!result.success) {
                showToast('Failed to place bet', 'error');
                return;
            }
            
            // Reset game state
            gameState.betAmount = betAmount;
            gameState.currentRound = 1;
            gameState.totalMultiplier = 2;
            gameState.gameActive = true;
            gameState.sessionId = 'double_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            gameState.currentGame = { round: 0, multiplier: 0, win: false, payout: 0 };
            
            // Update UI
            document.getElementById('start-btn').disabled = true;
            document.getElementById('double-btn').disabled = true;
            document.getElementById('collect-btn').disabled = true;
            updateRoundIndicator();
            updateGameStatus('Starting countdown...');
            
            // Start the countdown
            startCountdown();
        }

        function startCountdown() {
            gameState.countdownActive = true;
            const countdownDisplay = document.getElementById('countdown-display');
            const gameCircle = document.getElementById('game-circle');
            
            countdownDisplay.classList.add('show');
            gameCircle.style.cursor = 'not-allowed';
            
            let count = 5;
            countdownDisplay.textContent = count;
            
            const countdownInterval = setInterval(() => {
                count--;
                countdownDisplay.textContent = count;
                
                if (count <= 0) {
                    clearInterval(countdownInterval);
                    countdownDisplay.classList.remove('show');
                    gameState.countdownActive = false;
                    
                    // Enable circle tapping
                    gameCircle.style.cursor = 'pointer';
                    document.getElementById('circle-text').textContent = 'TAP NOW';
                    
                    updateGameStatus('Tap the circle to reveal result!');
                }
            }, 1000);
        }

        async function tapCircle() {
            if (!gameState.gameActive || gameState.countdownActive) return;
            
            // Show loading
            showLoading(true);
            
            // Hide tap text
            document.getElementById('circle-text').textContent = '';
            
            // Apply hidden win/lose system
            const result = calculateWinResult();
            
            // Simulate server delay
            await new Promise(resolve => setTimeout(resolve, 1500));
            
            // Handle result
            if (result.win) {
                await handleWin();
            } else {
                await handleLoss();
            }
            
            showLoading(false);
        }

        async function handleWin() {
            // Update game state
            gameState.currentRound++;
            gameState.totalMultiplier *= 2;
            gameState.canDouble = true;
            gameState.canCollect = true;
            
            // Update UI
            const gameCircle = document.getElementById('game-circle');
            const circleText = document.getElementById('circle-text');
            
            gameCircle.classList.remove('lose');
            gameCircle.classList.add('win');
            circleText.textContent = 'WIN!';
            circleText.style.color = '#000';
            
            updateRoundIndicator();
            updateActionButtons('win');
            
            // Show win banner
            const winAmount = gameState.betAmount * (gameState.totalMultiplier / 2);
            showResultBanner('win', winAmount);
            
            // Update game status
            updateGameStatus(`You won! Current multiplier: ${gameState.totalMultiplier}x`);
            
            // Add to history
            addGameHistory('WIN', winAmount);
            
            // Check if max rounds reached
            if (gameState.currentRound > gameState.maxRounds) {
                await autoCollect();
            }
        }

        async function handleLoss() {
            // Update game state
            gameState.gameActive = false;
            gameState.canDouble = false;
            gameState.canCollect = false;
            
            // Update UI
            const gameCircle = document.getElementById('game-circle');
            const circleText = document.getElementById('circle-text');
            
            gameCircle.classList.remove('win');
            gameCircle.classList.add('lose');
            circleText.textContent = 'LOSE';
            circleText.style.color = '#fff';
            
            updateActionButtons('lose');
            
            // Show lose banner
            showResultBanner('lose', gameState.betAmount);
            
            // Update game status
            updateGameStatus('Better luck next time!');
            
            // Add to history
            addGameHistory('LOSE', -gameState.betAmount);
            
            // Show results panel
            showResultsPanel();
            
            // Reset game after delay
            setTimeout(() => {
                resetGame();
            }, 3000);
        }

        async function double() {
            if (!gameState.canDouble) return;
            
            // Reset for next round
            gameState.canDouble = false;
            gameState.canCollect = false;
            
            // Reset circle
            const gameCircle = document.getElementById('game-circle');
            const circleText = document.getElementById('circle-text');
            
            gameCircle.classList.remove('win', 'lose');
            circleText.textContent = 'TAP';
            circleText.style.color = '#000';
            
            // Start next round countdown
            startCountdown();
            
            updateGameStatus(`Round ${gameState.currentRound} - Get ready!`);
        }

        async function collect() {
            if (!gameState.canCollect) return;
            
            // Calculate winnings
            const winnings = gameState.betAmount * gameState.totalMultiplier;
            
            // Process win transaction
            const result = await processTransaction(
                winnings,
                "double_or_nothing_win",
                `Double or Nothing win of $${winnings.toFixed(2)}`
            );
            
            if (result.success) {
                // Update game state
                gameState.gameActive = false;
                gameState.canDouble = false;
                gameState.canCollect = false;
                
                // Update UI
                updateActionButtons('collect');
                
                // Show win banner
                showResultBanner('win', winnings);
                
                // Add to history
                addGameHistory('COLLECT', winnings);
                
                // Add to winners list
                addToWinnersList(gameState.currentUser.displayName || 'Player', winnings);
                
                // Show results panel
                showResultsPanel();
                
                showToast(`Successfully collected $${winnings.toFixed(2)}!`, 'success');
                
                // Reset game after delay
                setTimeout(() => {
                    resetGame();
                }, 3000);
            } else {
                showToast('Failed to collect winnings', 'error');
            }
        }

        async function autoCollect() {
            // Automatic collect at max rounds
            gameState.canDouble = false;
            gameState.canCollect = true;
            
            // Force collect
            await collect();
            
            showToast('Maximum rounds reached! Auto-collecting...', 'warning');
        }

        function resetGame() {
            // Reset game state
            gameState.currentRound = 1;
            gameState.totalMultiplier = 2;
            gameState.gameActive = false;
            gameState.countdownActive = false;
            gameState.canDouble = false;
            gameState.canCollect = false;
            gameState.sessionId = null;
            
            // Reset UI
            const gameCircle = document.getElementById('game-circle');
            const circleText = document.getElementById('circle-text');
            
            gameCircle.classList.remove('win', 'lose');
            circleText.textContent = 'TAP';
            circleText.style.color = '#000';
            
            updateRoundIndicator();
            updateActionButtons('start');
            updateGameStatus('Place your bet and tap START to begin');
            hideResultBanner();
            
            // Hide results panel
            document.getElementById('results-panel').classList.remove('show');
            
            // Enable start button
            document.getElementById('start-btn').disabled = false;
        }

        function updateActionButtons(state) {
            const startBtn = document.getElementById('start-btn');
            const doubleBtn = document.getElementById('double-btn');
            const collectBtn = document.getElementById('collect-btn');
            const playAgainBtn = document.getElementById('play-again-btn');
            
            switch(state) {
                case 'start':
                    startBtn.style.display = 'flex';
                    doubleBtn.style.display = 'none';
                    collectBtn.style.display = 'none';
                    playAgainBtn.style.display = 'none';
                    doubleBtn.disabled = true;
                    collectBtn.disabled = true;
                    break;
                case 'win':
                    startBtn.style.display = 'none';
                    doubleBtn.style.display = 'flex';
                    collectBtn.style.display = 'flex';
                    playAgainBtn.style.display = 'none';
                    doubleBtn.disabled = false;
                    collectBtn.disabled = false;
                    break;
                case 'lose':
                    startBtn.style.display = 'none';
                    doubleBtn.style.display = 'none';
                    collectBtn.style.display = 'none';
                    playAgainBtn.style.display = 'flex';
                    break;
                case 'collect':
                    startBtn.style.display = 'none';
                    doubleBtn.style.display = 'none';
                    collectBtn.style.display = 'none';
                    playAgainBtn.style.display = 'flex';
                    break;
            }
        }

        function showResultBanner(type, amount) {
            const banner = document.getElementById('result-banner');
            const resultText = document.getElementById('result-text');
            
            banner.className = `result-banner ${type} show`;
            
            if (type === 'win') {
                resultText.textContent = `🎉 YOU WIN +$${amount.toFixed(2)}`;
            } else {
                resultText.textContent = `❌ YOU LOSE -$${Math.abs(amount).toFixed(2)}`;
            }
            
            // Auto-hide after 5 seconds
            setTimeout(() => {
                banner.classList.remove('show');
            }, 5000);
        }

        function hideResultBanner() {
            const banner = document.getElementById('result-banner');
            banner.classList.remove('show');
        }

        function showResultsPanel() {
            const panel = document.getElementById('results-panel');
            
            document.getElementById('result-round').textContent = gameState.currentRound - 1;
            document.getElementById('result-multiplier').textContent = `${gameState.totalMultiplier}x`;
            
            const winAmount = gameState.currentGame.win ? 
                gameState.betAmount * gameState.totalMultiplier : 
                -gameState.betAmount;
            
            document.getElementById('result-win').textContent = 
                winAmount > 0 ? `+$${winAmount.toFixed(2)}` : `-$${Math.abs(winAmount).toFixed(2)}`;
            document.getElementById('result-win').className = 
                winAmount > 0 ? 'result-value win' : 'result-value lose';
            
            document.getElementById('result-total').textContent = 
                winAmount > 0 ? `+$${winAmount.toFixed(2)}` : `-$${Math.abs(winAmount).toFixed(2)}`;
            document.getElementById('result-total').className = 
                winAmount > 0 ? 'result-value win' : 'result-value lose';
            
            panel.classList.add('show');
        }

        // ===== WINNERS LIST =====
        function generateWinnersList() {
            const winnersList = document.getElementById('winners-list');
            winnersList.innerHTML = '';
            
            // Generate 10 random winners
            for (let i = 0; i < 10; i++) {
                const randomName = nicknamePool[Math.floor(Math.random() * nicknamePool.length)];
                const randomAmount = Math.floor(Math.random() * 500) + 50;
                
                const winnerItem = document.createElement('div');
                winnerItem.className = 'winner-item';
                winnerItem.innerHTML = `
                    <span class="winner-icon">🎉</span>
                    <span class="winner-name">${randomName}</span>
                    <span class="winner-amount">$${randomAmount}</span>
                `;
                
                winnersList.appendChild(winnerItem);
                gameState.recentWinners.push({ name: randomName, amount: randomAmount });
            }
            
            // Start auto-update
            setInterval(updateWinnersList, 5000);
        }

        function updateWinnersList() {
            const winnersList = document.getElementById('winners-list');
            
            // Remove oldest winner
            if (winnersList.children.length > 10) {
                winnersList.removeChild(winnersList.lastChild);
            }
            
            // Add new random winner
            const randomName = nicknamePool[Math.floor(Math.random() * nicknamePool.length)];
            const randomAmount = Math.floor(Math.random() * 500) + 50;
            
            const winnerItem = document.createElement('div');
            winnerItem.className = 'winner-item';
            winnerItem.innerHTML = `
                <span class="winner-icon">🎉</span>
                <span class="winner-name">${randomName}</span>
                <span class="winner-amount">$${randomAmount}</span>
            `;
            
            winnersList.insertBefore(winnerItem, winnersList.firstChild);
            gameState.recentWinners.unshift({ name: randomName, amount: randomAmount });
            
            if (gameState.recentWinners.length > 20) {
                gameState.recentWinners.pop();
            }
        }

        function addToWinnersList(name, amount) {
            const winnersList = document.getElementById('winners-list');
            
            const winnerItem = document.createElement('div');
            winnerItem.className = 'winner-item';
            winnerItem.innerHTML = `
                <span class="winner-icon">🎉</span>
                <span class="winner-name">${name}</span>
                <span class="winner-amount">$${amount.toFixed(2)}</span>
            `;
            
            winnersList.insertBefore(winnerItem, winnersList.firstChild);
            gameState.recentWinners.unshift({ name, amount });
            
            // Keep only 10 items visible
            while (winnersList.children.length > 10) {
                winnersList.removeChild(winnersList.lastChild);
            }
            
            // Keep only 20 items in memory
            if (gameState.recentWinners.length > 20) {
                gameState.recentWinners.pop();
            }
        }

        // ===== GAME HISTORY =====
        function addGameHistory(action, amount) {
            const historyItem = {
                action: action,
                amount: amount,
                timestamp: new Date(),
                betAmount: gameState.betAmount,
                round: gameState.currentRound - 1,
                multiplier: gameState.totalMultiplier
            };
            
            gameState.gameHistory.unshift(historyItem);
            if (gameState.gameHistory.length > 10) {
                gameState.gameHistory.pop();
            }
            
            updateHistoryDisplay();
            saveGameHistoryToFirebase(historyItem);
        }

        function updateHistoryDisplay() {
            const historyList = document.getElementById('history-list');
            historyList.innerHTML = '';
            
            gameState.gameHistory.forEach(item => {
                const historyItem = document.createElement('div');
                historyItem.className = `history-item ${item.action.toLowerCase()}`;
                
                const time = new Date(item.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                const amountText = item.amount > 0 ? `+$${item.amount.toFixed(2)}` : `-$${Math.abs(item.amount).toFixed(2)}`;
                
                historyItem.innerHTML = `
                    <div class="history-action">
                        ${time} - Round ${item.round}
                    </div>
                    <div class="history-result ${item.action.toLowerCase()}">
                        ${amountText}
                    </div>
                `;
                
                historyList.appendChild(historyItem);
            });
        }

        async function saveGameHistoryToFirebase(historyItem) {
            try {
                await db.collection("double_or_nothing_history")
                    .doc(gameState.currentUser.uid)
                    .collection("games")
                    .add({
                        userId: gameState.currentUser.uid,
                        ...historyItem,
                        gameId: gameState.sessionId
                    });
            } catch (error) {
                console.error('Error saving game history:', error);
            }
        }

        async function loadGameHistory() {
            try {
                const snapshot = await db.collection("double_or_nothing_history")
                    .doc(gameState.currentUser?.uid)
                    .collection("games")
                    .orderBy('timestamp', 'desc')
                    .limit(10)
                    .get();
                
                snapshot.forEach(doc => {
                    const data = doc.data();
                    gameState.gameHistory.push({
                        action: data.action,
                        amount: data.amount,
                        timestamp: data.timestamp.toDate(),
                        betAmount: data.betAmount,
                        round: data.round,
                        multiplier: data.multiplier
                    });
                });
                
                updateHistoryDisplay();
            } catch (error) {
                console.error('Error loading game history:', error);
            }
        }

        // ===== EVENT LISTENERS =====
        function setupEventListeners() {
            // Start button
            document.getElementById('start-btn').addEventListener('click', startGame);
            
            // Double button
            document.getElementById('double-btn').addEventListener('click', double);
            
            // Collect button
            document.getElementById('collect-btn').addEventListener('click', collect);
            
            // Play again button
            document.getElementById('play-again-btn').addEventListener('click', resetGame);
            
            // Game circle tap
            document.getElementById('game-circle').addEventListener('click', tapCircle);
            
            // Quick bet buttons
            document.querySelectorAll('.quick-bet').forEach(btn => {
                btn.addEventListener('click', () => {
                    const amount = parseFloat(btn.dataset.amount);
                    document.getElementById('bet-amount').value = amount;
                    gameState.betAmount = amount;
                    
                    // Update active state
                    document.querySelectorAll('.quick-bet').forEach(b => {
                        b.classList.remove('active');
                    });
                    btn.classList.add('active');
                });
            });
            
            // Bet input
            document.getElementById('bet-amount').addEventListener('input', (e) => {
                let value = parseFloat(e.target.value) || 1;
                value = Math.max(1, Math.min(value, Math.min(gameState.balance, 1000)));
                e.target.value = value;
                gameState.betAmount = value;
                
                // Update quick bet active state
                document.querySelectorAll('.quick-bet').forEach(btn => {
                    if (parseFloat(btn.dataset.amount) === value) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                });
            });
            
            // Return to games button - prevent during active game
            document.getElementById('return-games-btn').addEventListener('click', (e) => {
                if (gameState.gameActive) {
                    e.preventDefault();
                    showToast('Cannot exit during active game!', 'warning');
                }
            });
        }

        // ===== TOAST NOTIFICATIONS =====
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.add('show');
            }, 10);
            
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => {
                    if (container.contains(toast)) {
                        container.removeChild(toast);
                    }
                }, 300);
            }, 3000);
        }

        function showLoading(show) {
            const overlay = document.getElementById('loading-overlay');
            if (show) {
                overlay.classList.add('show');
            } else {
                overlay.classList.remove('show');
            }
        }

        // ===== SECURITY MEASURES =====
        // Prevent context menu
        document.addEventListener('contextmenu', (e) => e.preventDefault());
        
        // Prevent text selection
        document.addEventListener('selectstart', (e) => e.preventDefault());
        
        // Prevent zoom on mobile
        document.addEventListener('touchstart', (e) => {
            if (e.touches.length > 1) e.preventDefault();
        }, { passive: false });
        
        // Prevent refresh during game
        window.addEventListener('beforeunload', (e) => {
            if (gameState.gameActive) {
                e.preventDefault();
                e.returnValue = 'Game in progress. Are you sure you want to leave?';
            }
        });
    </script>
</body>
</html>
