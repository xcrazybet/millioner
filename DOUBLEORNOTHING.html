<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎲 XCrazyBet - Double or Nothing</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Howler.js for Audio -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --primary: #00ff9d;
            --primary-dark: #00cc7a;
            --secondary: #ff9800;
            --secondary-dark: #cc7a00;
            --danger: #ff5252;
            --success: #4caf50;
            --warning: #ffc107;
            --bg: #0a0f1a;
            --surface: #111827;
            --surface-light: #1a2332;
            --text: #ffffff;
            --text-dim: #a0a8c9;
            --dark-bg: #000000;
            --neon-glow: 0 0 20px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Segoe UI', 'Roboto', system-ui, -apple-system, sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            touch-action: manipulation;
        }

        /* Background Effects */
        .bg-effects {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: 
                radial-gradient(circle at 20% 30%, rgba(0, 255, 157, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(255, 152, 0, 0.08) 0%, transparent 50%),
                linear-gradient(135deg, var(--dark-bg) 0%, var(--bg) 100%);
        }

        /* Header */
        .header {
            background: rgba(17, 24, 39, 0.95);
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .home-btn {
            width: 36px;
            height: 36px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #000;
            font-size: 18px;
            transition: all 0.3s;
        }

        .home-btn:hover {
            background: var(--primary-dark);
            transform: scale(1.1);
        }

        .logo {
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--primary);
        }

        .logo i {
            color: var(--primary);
        }

        .balance-display {
            background: linear-gradient(45deg, #1a2332, #0f172a);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--primary);
            color: var(--primary);
            font-weight: 700;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 140px;
            justify-content: center;
        }

        /* Main Game Container */
        .game-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            min-height: calc(100vh - 140px);
        }

        /* Result Banner */
        .result-banner {
            background: linear-gradient(135deg, rgba(255, 152, 0, 0.2), rgba(0, 255, 157, 0.2));
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            font-size: 20px;
            font-weight: 700;
            border: 2px solid rgba(255, 152, 0, 0.3);
            display: none;
            animation: slideDown 0.5s ease-out;
        }

        .result-banner.show {
            display: block;
        }

        .result-banner.win {
            background: linear-gradient(135deg, rgba(0, 255, 157, 0.2), rgba(0, 255, 157, 0.4));
            border-color: var(--primary);
            color: var(--primary);
            animation: winPulse 2s infinite;
        }

        .result-banner.lose {
            background: linear-gradient(135deg, rgba(255, 82, 82, 0.2), rgba(255, 82, 82, 0.4));
            border-color: var(--danger);
            color: var(--danger);
            animation: shake 0.5s;
        }

        /* Game Canvas */
        .game-canvas-container {
            position: relative;
            min-height: 300px;
            background: linear-gradient(135deg, #111827, #0a0f1a);
            border-radius: 20px;
            border: 3px solid rgba(255, 152, 0, 0.3);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #game-canvas {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        .game-content {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 20px;
            width: 100%;
        }

        .multiplier-display {
            font-size: 60px;
            font-weight: 900;
            margin: 20px 0;
            color: var(--primary);
            text-shadow: 0 0 30px rgba(0, 255, 157, 0.5);
            transition: all 0.3s;
        }

        .current-bet {
            font-size: 24px;
            color: var(--text-dim);
            margin-bottom: 10px;
        }

        .potential-win {
            font-size: 28px;
            font-weight: 700;
            color: var(--secondary);
            margin-bottom: 20px;
        }

        /* Countdown Timer */
        .countdown-timer {
            font-size: 40px;
            font-weight: 900;
            color: var(--warning);
            margin: 20px 0;
            text-shadow: 0 0 20px rgba(255, 193, 7, 0.5);
            animation: pulse 1s infinite;
        }

        /* Action Buttons */
        .action-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 20px;
        }

        .btn {
            padding: 20px;
            border: none;
            border-radius: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: 0.5s;
        }

        .btn:hover:not(:disabled)::before {
            left: 100%;
        }

        .btn-collect {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #000;
            box-shadow: 0 5px 20px rgba(0, 255, 157, 0.3);
        }

        .btn-collect:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 255, 157, 0.4);
        }

        .btn-double {
            background: linear-gradient(135deg, var(--secondary), var(--secondary-dark));
            color: #000;
            box-shadow: 0 5px 20px rgba(255, 152, 0, 0.3);
        }

        .btn-double:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 152, 0, 0.4);
        }

        .btn-bet {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 16px;
            padding: 16px;
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--danger), #ff1e1e);
            color: white;
        }

        /* Bet Controls */
        .bet-controls {
            background: rgba(17, 24, 39, 0.8);
            border-radius: 15px;
            padding: 20px;
            border: 2px solid rgba(255, 152, 0, 0.2);
            backdrop-filter: blur(10px);
        }

        .bet-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            align-items: center;
        }

        .bet-input {
            flex: 1;
            padding: 15px;
            background: rgba(10, 15, 26, 0.8);
            border: 2px solid var(--primary);
            border-radius: 10px;
            color: var(--text);
            font-size: 18px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .bet-input:focus {
            outline: none;
            border-color: var(--secondary);
            box-shadow: 0 0 0 3px rgba(255, 152, 0, 0.1);
        }

        .quick-bets {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .quick-bet {
            padding: 12px;
            background: rgba(10, 15, 26, 0.8);
            border: 1px solid var(--primary);
            border-radius: 8px;
            color: var(--primary);
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }

        .quick-bet:hover {
            background: var(--primary);
            color: #000;
            transform: translateY(-2px);
        }

        .quick-bet.active {
            background: var(--primary);
            color: #000;
            transform: scale(1.05);
        }

        /* History Panel */
        .history-panel {
            background: rgba(17, 24, 39, 0.8);
            border-radius: 15px;
            padding: 15px;
            border: 1px solid rgba(255, 152, 0, 0.2);
            max-height: 200px;
            overflow-y: auto;
            backdrop-filter: blur(10px);
        }

        .history-title {
            font-size: 14px;
            color: var(--secondary);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 152, 0, 0.2);
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: rgba(10, 15, 26, 0.5);
            border-radius: 8px;
            font-size: 12px;
            border-left: 3px solid var(--primary);
        }

        .history-item.win {
            border-left-color: var(--primary);
            background: rgba(0, 255, 157, 0.05);
        }

        .history-item.lose {
            border-left-color: var(--danger);
            background: rgba(255, 82, 82, 0.05);
        }

        .history-action {
            color: var(--text-dim);
        }

        .history-result {
            font-weight: 600;
        }

        .history-result.win {
            color: var(--primary);
        }

        .history-result.lose {
            color: var(--danger);
        }

        /* Live Winners Feed */
        .winners-feed {
            background: rgba(17, 24, 39, 0.8);
            border-radius: 15px;
            padding: 15px;
            border: 1px solid rgba(0, 255, 157, 0.2);
            margin-top: 15px;
            backdrop-filter: blur(10px);
            max-height: 150px;
            overflow: hidden;
            position: relative;
        }

        .winners-title {
            font-size: 14px;
            color: var(--primary);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(0, 255, 157, 0.2);
        }

        .winners-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .winner-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 10px;
            background: rgba(0, 255, 157, 0.05);
            border-radius: 8px;
            font-size: 12px;
            animation: slideIn 0.5s ease-out;
        }

        .winner-avatar {
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #000;
        }

        .winner-name {
            flex: 1;
            color: var(--text);
        }

        .winner-amount {
            color: var(--primary);
            font-weight: 600;
        }

        .winner-time {
            color: var(--text-dim);
            font-size: 10px;
            margin-left: 5px;
        }

        /* Fullscreen Controls */
        .fullscreen-controls {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .fullscreen-btn {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-size: 20px;
            cursor: pointer;
            border: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.3s;
        }

        .fullscreen-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }

        .return-btn {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--secondary), var(--secondary-dark));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-size: 20px;
            cursor: pointer;
            border: none;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.3s;
        }

        .return-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }

        /* Toast Notifications */
        .toast-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 300px;
            width: 90%;
        }

        .toast {
            padding: 15px;
            background: rgba(17, 24, 39, 0.95);
            border-radius: 10px;
            border-left: 4px solid var(--primary);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
            transform: translateY(100%);
            opacity: 0;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
            font-size: 14px;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.success {
            border-color: var(--primary);
        }

        .toast.error {
            border-color: var(--danger);
        }

        .toast.warning {
            border-color: var(--secondary);
        }

        /* Animations */
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes winPulse {
            0%, 100% { box-shadow: 0 0 20px rgba(0, 255, 157, 0.3); }
            50% { box-shadow: 0 0 40px rgba(0, 255, 157, 0.6); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }

        @keyframes slideDown {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes slideIn {
            from { transform: translateX(-100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes particle {
            0% { transform: translate(0, 0) scale(0); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(1); opacity: 0; }
        }

        @keyframes glow {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.5); }
        }

        /* Loading */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 152, 0, 0.3);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 1s ease-in-out infinite;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 10px;
                padding: 10px;
            }

            .header-left {
                width: 100%;
                justify-content: space-between;
            }

            .balance-display {
                width: 100%;
                min-width: auto;
            }

            .game-container {
                padding: 10px;
                gap: 10px;
            }

            .multiplier-display {
                font-size: 48px;
            }

            .action-panel {
                grid-template-columns: 1fr;
                padding: 15px;
            }

            .quick-bets {
                grid-template-columns: repeat(2, 1fr);
            }

            .fullscreen-controls {
                bottom: 10px;
                right: 10px;
            }

            .fullscreen-btn,
            .return-btn {
                width: 44px;
                height: 44px;
                font-size: 18px;
            }
        }

        @media (max-width: 480px) {
            .multiplier-display {
                font-size: 36px;
            }

            .countdown-timer {
                font-size: 32px;
            }

            .btn {
                padding: 16px;
                font-size: 16px;
            }

            .bet-input {
                padding: 12px;
                font-size: 16px;
            }

            .quick-bets {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* Fullscreen Styles */
        :fullscreen .fullscreen-btn .fa-expand {
            display: none;
        }

        :fullscreen .fullscreen-btn .fa-compress {
            display: block;
        }

        .fullscreen-btn .fa-compress {
            display: none;
        }

        :fullscreen .game-container {
            max-width: 100%;
            padding: 20px;
        }

        :fullscreen .game-canvas-container {
            min-height: 50vh;
        }
    </style>
</head>

        // ===== CANVAS PARTICLE SYSTEM =====
        class ParticleSystem {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.particles = [];
                this.resize();
                
                // Handle resize
                window.addEventListener('resize', () => this.resize());
            }
            
            resize() {
                this.canvas.width = this.canvas.offsetWidth;
                this.canvas.height = this.canvas.offsetHeight;
            }
            
            createParticles(x, y, color, count = 50) {
                for (let i = 0; i < count; i++) {
                    this.particles.push({
                        x, y,
                        vx: (Math.random() - 0.5) * 10,
                        vy: (Math.random() - 0.5) * 10,
                        radius: Math.random() * 3 + 1,
                        color: color,
                        alpha: 1,
                        life: 60
                    });
                }
            }
            
            createConfetti(x, y) {
                const colors = ['#00ff9d', '#ff9800', '#ffffff', '#ff5252', '#667eea'];
                for (let i = 0; i < 100; i++) {
                    this.particles.push({
                        x, y,
                        vx: (Math.random() - 0.5) * 8,
                        vy: Math.random() * -15 - 5,
                        radius: Math.random() * 4 + 2,
                        color: colors[Math.floor(Math.random() * colors.length)],
                        alpha: 1,
                        life: 90,
                        gravity: 0.2
                    });
                }
            }
            
            update() {
                // Clear canvas with fade effect
                this.ctx.fillStyle = 'rgba(17, 24, 39, 0.1)';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                
                // Update and draw particles
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const p = this.particles[i];
                    
                    // Apply physics
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += (p.gravity || 0);
                    p.alpha -= 1 / p.life;
                    
                    // Draw particle
                    this.ctx.beginPath();
                    this.ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    this.ctx.fillStyle = p.color;
                    this.ctx.globalAlpha = p.alpha;
                    this.ctx.fill();
                    
                    // Remove dead particles
                    if (p.alpha <= 0 || p.y > this.canvas.height) {
                        this.particles.splice(i, 1);
                    }
                }
                
                this.ctx.globalAlpha = 1;
            }
        }

            setupEventListeners();

            updateUI();

                particleSystem.update();
                requestAnimationFrame(animate);
            }
            animate();

            startWinnersFeed();

            loadGameHistory();

        // ===== BALANCE MANAGEMENT =====
        async function loadBalance() {
            try {
                const doc = await db.collection("wallets").doc(gameState.currentUser.uid).get();
                if (doc.exists) {
                    gameState.balance = doc.data().balance || 0;
                    updateBalanceDisplay();
                } else {
                    await db.collection("wallets").doc(gameState.currentUser.uid).set({
                        balance: 100,
                        createdAt: new Date(),
                        updatedAt: new Date()
                    });
                    gameState.balance = 100;
                    updateBalanceDisplay();
                }
            } catch (error) {
                console.error('Error loading balance:', error);
                showToast('Error loading balance', 'error');
            }

        function updateBalanceDisplay() {
            document.getElementById('balance-val').textContent = gameState.balance.toFixed(2);
        }

        // ===== REAL-TIME LISTENERS =====
        function setupRealTimeListeners() {
            if (!gameState.currentUser) return;
            
            const walletRef = db.collection("wallets").doc(gameState.currentUser.uid);
            
            walletRef.onSnapshot((doc) => {
                if (doc.exists) {
                    const newBalance = doc.data().balance || 0;
                    if (newBalance !== gameState.balance) {
                        gameState.balance = newBalance;
                        updateBalanceDisplay();
                        updateBetLimits();
                    }
                }
            }, (error) => {
                console.error('Balance listener error:', error);
            });
        }

        // ===== ATOMIC TRANSACTIONS =====
        async function processTransaction(amount, type, description) {
            try {
                const walletRef = db.collection("wallets").doc(gameState.currentUser.uid);
                
                return await db.runTransaction(async (transaction) => {
                    const walletDoc = await transaction.get(walletRef);
                    
                    if (!walletDoc.exists) {
                        throw new Error("Wallet not found");
                    }
                    
                    const currentBalance = walletDoc.data().balance || 0;
                    const newBalance = currentBalance + amount;
                    
                    if (newBalance < 0) {
                        throw new Error("Insufficient funds");
                    }
                    
                    // Update main balance
                    transaction.update(walletRef, {
                        balance: newBalance,
                        updatedAt: new Date()
                    });
                    
                    // Record transaction
                    const transactionRef = walletRef.collection("transactions").doc();
                    transaction.set(transactionRef, {
                        type: type,
                        amount: amount,
                        description: description,
                        createdAt: new Date(),
                        gameId: gameState.roundId || 'double_or_nothing',
                        beforeBalance: currentBalance,
                        afterBalance: newBalance
                    });
                    
                    // Update game history
                    const gameHistoryRef = db.collection("double_history").doc(gameState.currentUser.uid).collection("games").doc();
                    transaction.set(gameHistoryRef, {
                        userId: gameState.currentUser.uid,
                        gameId: gameState.roundId,
                        bet: gameState.betAmount,
                        stage: gameState.stage,
                        result: amount > 0 ? 'win' : 'lose',
                        amount: amount,
                        multiplier: gameState.multiplier,
                        timestamp: new Date()
                    });
                    
                    // Update local balance
                    gameState.balance = newBalance;
                    updateBalanceDisplay();
                    
                    return { success: true, newBalance };
                    
                });
            } catch (error) {
                console.error('Transaction failed:', error);
                showToast('Transaction failed: ' + error.message, 'error');
                return { success: false, error: error.message };
            }
        }

        // ===== GAME LOGIC =====
        async function startRound() {
            const betAmount = parseFloat(document.getElementById('bet-amount').value);
            
            // Validation
            if (betAmount < 1 || betAmount > Math.min(gameState.balance, 1000)) {
                showToast('Invalid bet amount', 'error');
                return;
            }
            
            if (gameState.roundActive) {
                showToast('Round already in progress', 'warning');
                return;
            }
            
            // Process bet transaction
            const result = await processTransaction(
                -betAmount,
                "double_bet",
                `Double or Nothing bet of $${betAmount}`
            );
            
            if (!result.success) {
                return;
            }
            
            // Update game state
            gameState.betAmount = betAmount;
            gameState.multiplier = 1;
            gameState.currentWin = betAmount;
            gameState.roundActive = true;
            gameState.gamePhase = 'countdown';
            gameState.roundId = 'double_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            gameState.stage = 1;
            
            // Update UI
            updateUI();
            
            // Start countdown
            startCountdown();
        }

        function startCountdown() {
            playSound('start');
            let countdown = 5;
            const timerElement = document.getElementById('countdown-timer');
            const betInput = document.getElementById('bet-amount');
            const startBtn = document.getElementById('start-btn');
            
            // Show timer
            timerElement.style.display = 'block';
            timerElement.textContent = countdown;
            
            // Disable controls
            betInput.disabled = true;
            startBtn.disabled = true;
            document.querySelectorAll('.quick-bet').forEach(btn => {
                btn.style.pointerEvents = 'none';
                btn.style.opacity = '0.5';
            });
            
            // Countdown interval
            const countdownInterval = setInterval(() => {
                countdown--;
                timerElement.textContent = countdown;
                playSound('countdown');
                
                if (countdown === 0) {
                    clearInterval(countdownInterval);
                    timerElement.style.display = 'none';
                    processRound();
                }
            }, 1000);
            
            // Store interval for cancellation
            gameState.countdownInterval = countdownInterval;
        }

        function processRound() {
            gameState.gamePhase = 'playing';
            updateUI();
            
            // Apply hidden win rate (10-15% chance to win)
            const winRate = gameState.winRate();
            const roll = Math.random();
            const win = roll <= winRate;
            
            // Small delay for suspense
            setTimeout(() => {
                if (win) {
                    handleWin();
                } else {
                    handleLoss();
                }
            }, 1000);
        }

        function handleWin() {
            playSound('win');
            
            // Calculate win
            const winAmount = gameState.betAmount * gameState.multiplier;
            gameState.currentWin = winAmount;
            
            // Show win result
            showResult(`WIN! Multiplier: ${gameState.multiplier}x`, 'win');
            
            // Update UI for next choice
            gameState.gamePhase = 'result';
            updateUI();
            
            // Enable collect/double buttons
            document.getElementById('collect-btn').disabled = false;
            document.getElementById('double-btn').disabled = false;
            
            // Create particle effects
            const canvas = document.getElementById('game-canvas');
            particleSystem.createConfetti(canvas.width / 2, canvas.height / 2);
            
            // Store win state
            gameState.lastWin = true;
        }

        function handleLoss() {
            playSound('lose');
            
            // Show loss result
            showResult(`LOSS! Better luck next time`, 'lose');
            
            // Add to history
            addGameHistory('Lose', 'lose', -gameState.betAmount);
            
            // Reset game state
            setTimeout(() => {
                gameState.roundActive = false;
                gameState.gamePhase = 'idle';
                gameState.multiplier = 1;
                gameState.currentWin = 0;
                gameState.stage = 1;
                updateUI();
                
                // Re-enable bet controls
                document.getElementById('bet-amount').disabled = false;
                document.getElementById('start-btn').disabled = false;
                document.querySelectorAll('.quick-bet').forEach(btn => {
                    btn.style.pointerEvents = 'auto';
                    btn.style.opacity = '1';
                });
            }, 2000);
            
            // Create particle effects
            const canvas = document.getElementById('game-canvas');
            particleSystem.createParticles(canvas.width / 2, canvas.height / 2, '#ff5252', 30);
            
            // Store loss state
            gameState.lastWin = false;
        }

        async function collectWin() {
            if (!gameState.roundActive || !gameState.lastWin) return;
            
            playSound('click');
            
            // Process win transaction
            const result = await processTransaction(
                gameState.currentWin,
                "double_win",
                `Double or Nothing win of $${gameState.currentWin.toFixed(2)} (${gameState.multiplier}x)`
            );
            
            if (result.success) {
                showToast(`Collected $${gameState.currentWin.toFixed(2)}!`, 'success');
                addGameHistory('Collect', 'win', gameState.currentWin);
                
                // Add to winners feed
                addToWinnersFeed(gameState.currentWin);
            }
            
            // Reset game state
            gameState.roundActive = false;
            gameState.gamePhase = 'idle';
            gameState.multiplier = 1;
            gameState.currentWin = 0;
            gameState.stage = 1;
            updateUI();
            
            // Re-enable bet controls
            document.getElementById('bet-amount').disabled = false;
            document.getElementById('start-btn').disabled = false;
            document.querySelectorAll('.quick-bet').forEach(btn => {
                btn.style.pointerEvents = 'auto';
                btn.style.opacity = '1';
            });
        }

        function doubleBet() {
            if (!gameState.roundActive || !gameState.lastWin) return;
            
            playSound('click');
            
            // Double the multiplier
            gameState.multiplier *= 2;
            gameState.stage++;
            
            // Update current win
            gameState.currentWin = gameState.betAmount * gameState.multiplier;
            
            // Reset for next round
            gameState.gamePhase = 'playing';
            gameState.lastWin = null;
            updateUI();
            
            // Start next round
            setTimeout(() => {
                processRound();
            }, 500);
        }

        function showResult(message, type) {
            const banner = document.getElementById('result-banner');
            const text = document.getElementById('result-text');
            
            text.textContent = message;
            banner.className = `result-banner show ${type}`;
            
            // Auto hide after 3 seconds
            setTimeout(() => {
                banner.classList.remove('show');
            }, 3000);
        }

        // ===== WINNERS FEED =====
        function startWinnersFeed() {
            // Add initial winners
            for (let i = 0; i < 5; i++) {
                addRandomWinner();
            }
            
            // Add new winners periodically
            setInterval(() => {
                if (Math.random() > 0.3) { // 70% chance to add new winner
                    addRandomWinner();
                }
            }, 5000 + Math.random() * 10000); // Random interval 5-15 seconds
        }

        function addRandomWinner() {
            const winner = {
                name: gameState.winnersPool[Math.floor(Math.random() * gameState.winnersPool.length)],
                amount: Math.floor(Math.random() * 500) + 10,
                time: Math.floor(Math.random() * 60) + 1
            };
            
            addToWinnersFeed(winner.amount, winner.name, winner.time);
        }

        function addToWinnersFeed(amount, name = null, time = null) {
            const winnerName = name || gameState.winnersPool[Math.floor(Math.random() * gameState.winnersPool.length)];
            const winTime = time || 1;
            
            const winnersList = document.getElementById('winners-list');
            const winnerItem = document.createElement('div');
            winnerItem.className = 'winner-item';
            
            winnerItem.innerHTML = `
                <div class="winner-avatar">
                    <i class="fas fa-user"></i>
                </div>
                <div class="winner-name">${winnerName}</div>
                <div class="winner-amount">$${amount.toFixed(2)}</div>
                <div class="winner-time">${winTime} min ago</div>
            `;
            
            winnersList.insertBefore(winnerItem, winnersList.firstChild);
            
            // Limit to 10 items
            if (winnersList.children.length > 10) {
                winnersList.removeChild(winnersList.lastChild);
            }
        }

        // ===== GAME HISTORY =====
        function addGameHistory(action, result, amount) {
            const historyItem = {
                action: action,
                result: result,
                amount: amount,
                timestamp: new Date(),
                multiplier: gameState.multiplier,
                stage: gameState.stage
            };
            
            gameState.gameHistory.unshift(historyItem);
            if (gameState.gameHistory.length > 10) {
                gameState.gameHistory.pop();
            }
            
            updateHistoryDisplay();
            
            // Save to Firebase
            saveGameHistoryToFirebase(historyItem);
        }

        function updateHistoryDisplay() {
            const historyList = document.getElementById('history-list');
            historyList.innerHTML = '';
            
            gameState.gameHistory.forEach(item => {
                const historyItem = document.createElement('div');
                historyItem.className = `history-item ${item.result}`;
                
                const time = new Date(item.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                const actionText = item.action === 'Collect' ? `Stage ${item.stage}` : item.action;
                
                historyItem.innerHTML = `
                    <div class="history-action">
                        ${time} - ${actionText}
                    </div>
                    <div class="history-result ${item.result}">
                        ${item.amount > 0 ? '+' : ''}$${Math.abs(item.amount).toFixed(2)}
                    </div>
                `;
                
                historyList.appendChild(historyItem);
            });
        }

        async function saveGameHistoryToFirebase(historyItem) {
            try {
                await db.collection("double_history")
                    .doc(gameState.currentUser?.uid)
                    .collection("games")
                    .add({
                        userId: gameState.currentUser.uid,
                        ...historyItem,
                        gameId: gameState.roundId
                    });
            } catch (error) {
                console.error('Error saving game history:', error);
            }
        }

        async function loadGameHistory() {
            try {
                if (!gameState.currentUser) return;
                
                const snapshot = await db.collection("double_history")
                    .doc(gameState.currentUser.uid)
                    .collection("games")
                    .orderBy('timestamp', 'desc')
                    .limit(10)
                    .get();
                
                snapshot.forEach(doc => {
                    const data = doc.data();
                    gameState.gameHistory.push({
                        action: data.action || (data.amount > 0 ? 'Win' : 'Lose'),
                        result: data.result,
                        amount: data.amount,
                        timestamp: data.timestamp?.toDate() || new Date(),
                        multiplier: data.multiplier || 1,
                        stage: data.stage || 1
                    });
                });
                
                updateHistoryDisplay();
            } catch (error) {
                console.error('Error loading game history:', error);
            }
        }

        // ===== UI UPDATES =====
        function updateUI() {
            // Update multiplier display
            document.getElementById('multiplier-display').textContent = `${gameState.multiplier}x`;
            
            // Update current bet
            document.getElementById('current-bet-amount').textContent = gameState.betAmount.toFixed(2);
            
            // Update potential win
            const potentialWin = gameState.betAmount * gameState.multiplier;
            document.getElementById('potential-win-amount').textContent = potentialWin.toFixed(2);
            
            // Update button states based on game phase
            const startBtn = document.getElementById('start-btn');
            const collectBtn = document.getElementById('collect-btn');
            const doubleBtn = document.getElementById('double-btn');
            const betInput = document.getElementById('bet-amount');
            
            switch (gameState.gamePhase) {
                case 'idle':
                    startBtn.disabled = false;
                    collectBtn.disabled = true;
                    doubleBtn.disabled = true;
                    betInput.disabled = false;
                    break;
                    
                case 'countdown':
                case 'playing':
                    startBtn.disabled = true;
                    collectBtn.disabled = true;
                    doubleBtn.disabled = true;
                    betInput.disabled = true;
                    break;
                    
                case 'result':
                    startBtn.disabled = true;
                    collectBtn.disabled = false;
                    doubleBtn.disabled = false;
                    betInput.disabled = true;
                    break;
            }
            
            // Update bet limits
            updateBetLimits();
        }

        function updateBetLimits() {
            const betInput = document.getElementById('bet-amount');
            betInput.max = Math.min(gameState.balance, 1000);
            
            if (parseFloat(betInput.value) > betInput.max) {
                betInput.value = betInput.max;
            }
        }

        // ===== EVENT LISTENERS =====
        function setupEventListeners() {
            // Start button
            document.getElementById('start-btn').addEventListener('click', startRound);
            
            // Collect button
            document.getElementById('collect-btn').addEventListener('click', collectWin);
            
            // Double button
            document.getElementById('double-btn').addEventListener('click', doubleBet);
            
            // Quick bet buttons
            document.querySelectorAll('.quick-bet').forEach(btn => {
                btn.addEventListener('click', () => {
                    if (gameState.roundActive) return;
                    
                    const amount = parseFloat(btn.dataset.amount);
                    document.getElementById('bet-amount').value = amount;
                    gameState.betAmount = amount;
                    
                    // Update active state
                    document.querySelectorAll('.quick-bet').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    
                    playSound('click');
                });
            });
            
            // Bet input
            document.getElementById('bet-amount').addEventListener('input', (e) => {
                if (gameState.roundActive) return;
                
                let value = parseFloat(e.target.value) || 1;
                value = Math.max(1, Math.min(value, Math.min(gameState.balance, 1000)));
                e.target.value = value;
                gameState.betAmount = value;
                
                // Update active quick bet
                document.querySelectorAll('.quick-bet').forEach(btn => {
                    btn.classList.toggle('active', parseFloat(btn.dataset.amount) === value);
                });
            });
            
            // Fullscreen button
            document.getElementById('fullscreen-btn').addEventListener('click', toggleFullscreen);
            
            // Prevent form submission
            document.getElementById('bet-amount').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    startRound();
                }
            });
        }

        // ===== FULLSCREEN =====
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.error(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // Update fullscreen button icon
        document.addEventListener('fullscreenchange', () => {
            const btn = document.getElementById('fullscreen-btn');
            if (document.fullscreenElement) {
                btn.querySelector('.fa-expand').style.display = 'none';
                btn.querySelector('.fa-compress').style.display = 'block';
            } else {
                btn.querySelector('.fa-expand').style.display = 'block';
                btn.querySelector('.fa-compress').style.display = 'none';
            }
        });

        // ===== TOAST NOTIFICATIONS =====
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.add('show');
            }, 10);
            
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => {
                    if (container.contains(toast)) {
                        container.removeChild(toast);
                    }
                }, 300);
            }, 3000);
        }

        // ===== INITIAL SETUP =====
        // Set initial active quick bet
        document.querySelector(`.quick-bet[data-amount="10"]`).classList.add('active');
        
        // Setup real-time listeners after auth
        auth.onAuthStateChanged(user => {
            if (user) {
                setupRealTimeListeners();
            }
        });
    </script>
</body>
</html>
