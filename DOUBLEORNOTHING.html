<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚡ DOUBLE OR NOTHING - XCrazyBet</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs (CORRECTED VERSION) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js"></script>
    
    <!-- Remove conflicting libraries temporarily -->
    <!--
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/gsap.min.js"></script>
    -->

    <style>
        /* SIMPLIFIED CSS TO DEBUG DISPLAY ISSUES */
        :root {
            --cyber-blue: #00f3ff;
            --neon-pink: #ff00ff;
            --vault-gold: #ffd700;
            --dark-matter: #0a0a12;
            --danger-red: #ff4757;
            --success-green: #2ed573;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: var(--dark-matter);
            color: white;
            /* REMOVED: overflow: hidden; */
        }

        /* DEBUG BORDERS */
        .debug {
            border: 1px solid red !important;
        }

        /* Game Container */
        .game-container {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 10px;
        }

        /* Header */
        .header {
            background: rgba(10, 10, 30, 0.9);
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--cyber-blue);
            margin-bottom: 20px;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            color: var(--cyber-blue);
        }

        .balance {
            background: rgba(0, 243, 255, 0.1);
            padding: 10px 20px;
            border-radius: 10px;
            border: 1px solid var(--cyber-blue);
            color: var(--cyber-blue);
            font-weight: bold;
            font-size: 18px;
        }

        /* Game Area */
        .game-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 20px;
        }

        /* Ladder */
        .ladder-container {
            width: 100%;
            max-width: 400px;
            height: 300px;
            background: rgba(20, 20, 40, 0.8);
            border: 2px solid var(--neon-pink);
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            position: relative;
        }

        /* Control Panel */
        .control-panel {
            width: 100%;
            max-width: 500px;
            background: rgba(10, 10, 30, 0.9);
            padding: 20px;
            border-radius: 15px;
            border: 2px solid var(--cyber-blue);
            margin-top: 20px;
        }

        .bet-controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }

        .bet-input {
            padding: 15px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid var(--cyber-blue);
            border-radius: 10px;
            color: var(--cyber-blue);
            font-size: 24px;
            font-weight: bold;
            text-align: center;
        }

        .quick-bets {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .quick-bet {
            padding: 12px 5px;
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid var(--cyber-blue);
            border-radius: 8px;
            color: var(--cyber-blue);
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .quick-bet:hover {
            background: var(--cyber-blue);
            color: #000;
        }

        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .btn {
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary {
            background: var(--cyber-blue);
            color: #000;
        }

        .btn-secondary {
            background: var(--vault-gold);
            color: #000;
        }

        /* Multiplier Display */
        .multiplier-display {
            background: rgba(0, 0, 0, 0.9);
            padding: 20px;
            border-radius: 15px;
            border: 3px solid var(--vault-gold);
            text-align: center;
            min-width: 150px;
        }

        .multiplier-value {
            font-size: 36px;
            font-weight: bold;
            color: var(--vault-gold);
        }

        /* Risk Meter */
        .risk-meter-container {
            width: 100%;
            max-width: 400px;
            background: rgba(20, 20, 40, 0.8);
            border-radius: 15px;
            padding: 15px;
            border: 2px solid var(--neon-pink);
        }

        .risk-meter {
            width: 100%;
            height: 20px;
            background: linear-gradient(90deg, 
                var(--success-green) 0%,
                var(--vault-gold) 50%,
                var(--danger-red) 100%);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            margin-top: 10px;
        }

        .risk-level {
            position: absolute;
            top: 0;
            right: 0;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            width: 100%;
            border-radius: 10px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .quick-bets {
                grid-template-columns: repeat(3, 1fr);
            }
            
            .action-buttons {
                grid-template-columns: 1fr;
            }
            
            .ladder-container {
                height: 250px;
            }
        }

        @media (max-width: 480px) {
            .quick-bets {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .multiplier-display {
                min-width: 120px;
                padding: 15px;
            }
            
            .multiplier-value {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <!-- Game Container -->
    <div class="game-container">
        
        <!-- Header -->
        <div class="header">
            <div class="logo">
                <i class="fas fa-bolt"></i>
                DOUBLE OR NOTHING
            </div>
            
            <div class="balance">
                <i class="fas fa-coins"></i>
                $<span id="balance-val">100.00</span>
            </div>
        </div>

        <!-- Game Area -->
        <div class="game-area">
            
            <!-- Current Multiplier -->
            <div class="multiplier-display">
                <div style="font-size: 14px; color: #aaa; margin-bottom: 5px;">CURRENT</div>
                <div class="multiplier-value" id="current-multiplier">1.0x</div>
            </div>

            <!-- Ladder -->
            <div class="ladder-container" id="ladder-container">
                <div style="text-align: center; color: #aaa; margin-top: 50px;">
                    <i class="fas fa-gamepad" style="font-size: 48px; margin-bottom: 20px;"></i>
                    <div>Place your bet and start the game!</div>
                </div>
            </div>

            <!-- Risk Meter -->
            <div class="risk-meter-container">
                <div style="color: var(--neon-pink); font-weight: bold; display: flex; justify-content: space-between;">
                    <span>RISK LEVEL</span>
                    <span id="risk-percentage">0%</span>
                </div>
                <div class="risk-meter">
                    <div class="risk-level" id="risk-level" style="width: 0%;"></div>
                </div>
                <div style="display: flex; justify-content: space-between; margin-top: 5px; font-size: 12px; color: #aaa;">
                    <span>SAFE</span>
                    <span>RISKY</span>
                    <span>EXTREME</span>
                </div>
            </div>

            <!-- Cash Out Button -->
            <button class="btn btn-primary" id="cash-out-btn" style="display: none; padding: 20px 40px; font-size: 20px;">
                <i class="fas fa-money-check-alt"></i>
                CASH OUT: $<span id="cash-out-amount">0.00</span>
            </button>

        </div>

        <!-- Control Panel -->
        <div class="control-panel">
            <!-- Bet Controls -->
            <div class="bet-controls">
                <input type="number" class="bet-input" id="bet-amount" value="5" min="1" max="1000" step="1">
                
                <!-- Quick Bets -->
                <div class="quick-bets">
                    <div class="quick-bet" data-amount="1">$1</div>
                    <div class="quick-bet" data-amount="5">$5</div>
                    <div class="quick-bet" data-amount="10">$10</div>
                    <div class="quick-bet" data-amount="25">$25</div>
                    <div class="quick-bet" data-amount="50">$50</div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="action-buttons">
                <button id="play-btn" class="btn btn-primary">
                    <i class="fas fa-lock"></i> START GAME
                </button>
                <button id="reset-btn" class="btn btn-secondary">
                    <i class="fas fa-redo"></i> RESET
                </button>
            </div>
        </div>
    </div>

    <script>
        // =============================================
        // SIMPLIFIED DOUBLE OR NOTHING GAME
        // =============================================

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962",
            measurementId: "G-PTV4XMYQ6P"
        };

        // Game State
        const gameState = {
            balance: 100.00,
            betAmount: 5,
            isPlaying: false,
            currentRound: 0,
            maxRounds: 7,
            currentMultiplier: 1.0,
            
            // Ladder configuration
            ladderConfig: [
                { round: 0, multiplier: 1.0, risk: 0 },
                { round: 1, multiplier: 2.0, risk: 25 },
                { round: 2, multiplier: 3.0, risk: 35 },
                { round: 3, multiplier: 4.0, risk: 45 },
                { round: 4, multiplier: 6.0, risk: 55 },
                { round: 5, multiplier: 8.0, risk: 65 },
                { round: 6, multiplier: 10.0, risk: 75 },
                { round: 7, multiplier: 15.0, risk: 85 }
            ]
        };

        // Initialize Game
        function initializeGame() {
            console.log("Game Initializing...");
            
            // Update UI
            updateBalanceDisplay();
            updateBetLimits();
            
            // Setup event listeners
            setupEventListeners();
            
            // Initialize ladder display
            createLadder();
            
            console.log("Game Ready!");
            
            // Show welcome message
            setTimeout(() => {
                showMessage('Welcome to Double or Nothing!', 'info');
            }, 1000);
        }

        // Create Ladder Display
        function createLadder() {
            const container = document.getElementById('ladder-container');
            container.innerHTML = '<div class="ladder-track"></div>';
            
            gameState.ladderConfig.forEach((config, index) => {
                if (index === 0) return; // Skip start position
                
                const step = document.createElement('div');
                step.className = 'ladder-step';
                step.style.cssText = `
                    position: absolute;
                    left: 50%;
                    transform: translateX(-50%);
                    width: 80px;
                    height: 50px;
                    background: rgba(20, 20, 40, 0.9);
                    border: 2px solid var(--cyber-blue);
                    border-radius: 8px;
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                    justify-content: center;
                    top: ${(index / gameState.ladderConfig.length) * 90}%;
                    z-index: 2;
                `;
                
                step.innerHTML = `
                    <div style="font-size: 20px; font-weight: bold; color: var(--vault-gold);">
                        ${config.multiplier.toFixed(1)}x
                    </div>
                    <div style="font-size: 11px; color: #aaa;">ROUND ${config.round}</div>
                `;
                
                container.appendChild(step);
            });
        }

        // Start Game
        function startGame() {
            const betAmount = parseFloat(document.getElementById('bet-amount').value);
            
            // Validation
            if (betAmount < 1 || betAmount > gameState.balance) {
                showMessage('Invalid bet amount', 'error');
                return;
            }
            
            if (gameState.isPlaying) {
                showMessage('Game already in progress', 'warning');
                return;
            }
            
            // Start game
            gameState.betAmount = betAmount;
            gameState.isPlaying = true;
            gameState.currentRound = 0;
            gameState.currentMultiplier = 1.0;
            
            // Update UI
            document.getElementById('play-btn').disabled = true;
            document.getElementById('play-btn').innerHTML = '<i class="fas fa-spinner fa-spin"></i> PLAYING...';
            
            // Start first round
            startNextRound();
        }

        // Start Next Round
        function startNextRound() {
            if (!gameState.isPlaying) return;
            
            gameState.currentRound++;
            
            // Check if game over
            if (gameState.currentRound > gameState.maxRounds) {
                winGame();
                return;
            }
            
            // Update current multiplier
            const currentConfig = gameState.ladderConfig[gameState.currentRound];
            gameState.currentMultiplier = currentConfig.multiplier;
            
            // Update UI
            updateMultiplierDisplay();
            updateRiskMeter();
            updateLadderDisplay();
            
            // Calculate cash out amount
            const cashOutAmount = gameState.betAmount * currentConfig.multiplier;
            document.getElementById('cash-out-amount').textContent = cashOutAmount.toFixed(2);
            
            // Show cash out button after first round
            if (gameState.currentRound > 1) {
                document.getElementById('cash-out-btn').style.display = 'flex';
            }
            
            // Determine round result (simplified - 50/50 chance)
            setTimeout(() => {
                const roundResult = Math.random() > currentConfig.risk / 100;
                
                if (roundResult) {
                    // Round success
                    showMessage(`Round ${gameState.currentRound} PASSED!`, 'success');
                    
                    // Continue to next round
                    setTimeout(startNextRound, 1000);
                } else {
                    // Round failed
                    loseGame();
                }
            }, 1500);
        }

        // Win Game
        function winGame() {
            const finalConfig = gameState.ladderConfig[gameState.maxRounds];
            const winAmount = gameState.betAmount * finalConfig.multiplier;
            
            // Update balance
            gameState.balance += winAmount;
            updateBalanceDisplay();
            
            // Show win message
            showMessage(`WINNER! +$${winAmount.toFixed(2)}`, 'success');
            
            // Update ladder
            updateLadderDisplay(true);
            
            // Reset game
            resetGame();
        }

        // Lose Game
        function loseGame() {
            // Update balance
            gameState.balance -= gameState.betAmount;
            updateBalanceDisplay();
            
            // Show lose message
            showMessage(`Round ${gameState.currentRound} FAILED!`, 'error');
            
            // Update ladder
            updateLadderDisplay(false);
            
            // Reset game
            resetGame();
        }

        // Cash Out
        function cashOut() {
            if (!gameState.isPlaying) return;
            
            const currentConfig = gameState.ladderConfig[gameState.currentRound];
            const cashOutAmount = gameState.betAmount * currentConfig.multiplier;
            
            // Update balance
            gameState.balance += cashOutAmount;
            updateBalanceDisplay();
            
            // Show cash out message
            showMessage(`Cashed out! +$${cashOutAmount.toFixed(2)}`, 'success');
            
            // Update ladder
            updateLadderDisplay(true);
            
            // Reset game
            resetGame();
        }

        // Reset Game
        function resetGame() {
            gameState.isPlaying = false;
            gameState.currentRound = 0;
            gameState.currentMultiplier = 1.0;
            
            // Update UI
            document.getElementById('play-btn').disabled = false;
            document.getElementById('play-btn').innerHTML = '<i class="fas fa-lock"></i> START GAME';
            document.getElementById('cash-out-btn').style.display = 'none';
            
            // Reset displays
            updateMultiplierDisplay();
            updateRiskMeter();
            updateLadderDisplay();
        }

        // Update UI Functions
        function updateBalanceDisplay() {
            document.getElementById('balance-val').textContent = gameState.balance.toFixed(2);
            updateBetLimits();
        }

        function updateBetLimits() {
            const betInput = document.getElementById('bet-amount');
            const maxBet = Math.min(gameState.balance, 1000);
            betInput.max = maxBet;
            
            if (parseFloat(betInput.value) > maxBet) {
                betInput.value = maxBet;
                gameState.betAmount = maxBet;
            }
        }

        function updateMultiplierDisplay() {
            document.getElementById('current-multiplier').textContent = 
                `${gameState.currentMultiplier.toFixed(1)}x`;
        }

        function updateRiskMeter() {
            const currentConfig = gameState.ladderConfig[gameState.currentRound];
            const riskPercentage = currentConfig.risk || 0;
            
            document.getElementById('risk-level').style.width = `${100 - riskPercentage}%`;
            document.getElementById('risk-percentage').textContent = `${riskPercentage}%`;
        }

        function updateLadderDisplay(win = null) {
            const steps = document.querySelectorAll('.ladder-step');
            
            steps.forEach((step, index) => {
                const stepRound = index + 1;
                
                // Reset all steps
                step.style.borderColor = 'var(--cyber-blue)';
                step.style.background = 'rgba(20, 20, 40, 0.9)';
                step.style.boxShadow = 'none';
                
                // Mark completed steps
                if (stepRound <= gameState.currentRound) {
                    if (win === null) {
                        // Game in progress
                        if (stepRound === gameState.currentRound) {
                            // Current step
                            step.style.borderColor = 'var(--vault-gold)';
                            step.style.boxShadow = '0 0 15px var(--vault-gold)';
                        } else {
                            // Completed steps
                            step.style.background = 'rgba(0, 243, 255, 0.2)';
                        }
                    } else {
                        // Game finished
                        if (win) {
                            // All steps completed
                            step.style.background = 'rgba(255, 215, 0, 0.2)';
                            step.style.borderColor = 'var(--vault-gold)';
                        } else {
                            // Failed at current step
                            if (stepRound === gameState.currentRound) {
                                step.style.background = 'rgba(255, 71, 87, 0.2)';
                                step.style.borderColor = 'var(--danger-red)';
                                step.style.boxShadow = '0 0 15px var(--danger-red)';
                            } else if (stepRound < gameState.currentRound) {
                                step.style.background = 'rgba(0, 243, 255, 0.2)';
                            }
                        }
                    }
                }
            });
        }

        // Show Message
        function showMessage(message, type = 'info') {
            const colors = {
                success: '#2ed573',
                error: '#ff4757',
                warning: '#ffa502',
                info: '#00f3ff'
            };
            
            // Remove existing messages
            const existingMessage = document.querySelector('.message-toast');
            if (existingMessage) existingMessage.remove();
            
            const messageEl = document.createElement('div');
            messageEl.className = 'message-toast';
            messageEl.textContent = message;
            messageEl.style.cssText = `
                position: fixed;
                top: 100px;
                left: 50%;
                transform: translateX(-50%);
                background: rgba(10, 10, 30, 0.95);
                color: white;
                padding: 15px 30px;
                border-radius: 10px;
                border: 2px solid ${colors[type]};
                z-index: 10000;
                font-weight: bold;
                text-align: center;
                max-width: 90%;
                animation: messageSlide 0.3s ease-out;
            `;
            
            document.body.appendChild(messageEl);
            
            setTimeout(() => {
                messageEl.style.animation = 'messageFade 0.3s ease-out';
                setTimeout(() => messageEl.remove(), 300);
            }, 3000);
        }

        // Setup Event Listeners
        function setupEventListeners() {
            // Play button
            document.getElementById('play-btn').addEventListener('click', startGame);
            
            // Cash out button
            document.getElementById('cash-out-btn').addEventListener('click', cashOut);
            
            // Reset button
            document.getElementById('reset-btn').addEventListener('click', resetGame);
            
            // Quick bet buttons
            document.querySelectorAll('.quick-bet').forEach(btn => {
                btn.addEventListener('click', () => {
                    const amount = parseFloat(btn.dataset.amount);
                    document.getElementById('bet-amount').value = amount;
                    gameState.betAmount = amount;
                    
                    // Animate button
                    btn.style.transform = 'scale(1.1)';
                    setTimeout(() => btn.style.transform = 'scale(1)', 200);
                });
            });
            
            // Bet input
            document.getElementById('bet-amount').addEventListener('input', (e) => {
                let value = parseFloat(e.target.value) || 1;
                const maxBet = Math.min(gameState.balance, 1000);
                value = Math.max(1, Math.min(value, maxBet));
                e.target.value = value;
                gameState.betAmount = value;
            });
        }

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', initializeGame);

        // Add CSS animations
        const style = document.createElement('style');
        style.textContent = `
            @keyframes messageSlide {
                from { transform: translateX(-50%) translateY(-50px); opacity: 0; }
                to { transform: translateX(-50%) translateY(0); opacity: 1; }
            }
            
            @keyframes messageFade {
                from { transform: translateX(-50%) translateY(0); opacity: 1; }
                to { transform: translateX(-50%) translateY(-50px); opacity: 0; }
            }
            
            .ladder-track {
                position: absolute;
                top: 0;
                left: 50%;
                transform: translateX(-50%);
                width: 4px;
                height: 100%;
                background: linear-gradient(180deg, var(--cyber-blue), var(--neon-pink));
                border-radius: 2px;
                z-index: 1;
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
