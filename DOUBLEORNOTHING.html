<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚡ DOUBLE OR NOTHING - XCrazyBet</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- Howler.js for Audio -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>
    
    <!-- GSAP for animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/gsap.min.js"></script>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-functions-compat.js"></script>

    <style>
        :root {
            --cyber-blue: #00f3ff;
            --neon-pink: #ff00ff;
            --vault-gold: #ffd700;
            --dark-matter: #0a0a12;
            --hologram-teal: #00ffaa;
            --danger-red: #ff4757;
            --success-green: #2ed573;
            --warning-orange: #ffa502;
            --surface-dark: rgba(20, 20, 40, 0.95);
            --surface-light: rgba(30, 30, 60, 0.8);
            --text: #ffffff;
            --text-dim: #a0b2ff;
            --glow-blue: 0 0 20px rgba(0, 243, 255, 0.7);
            --glow-pink: 0 0 20px rgba(255, 0, 255, 0.7);
            --glow-gold: 0 0 20px rgba(255, 215, 0, 0.7);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Segoe UI', 'Roboto', 'Orbitron', system-ui, -apple-system, sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--dark-matter);
            color: var(--text);
        }

        /* Cyber Background */
        .cyber-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: 
                linear-gradient(135deg, #000010 0%, #0a0a1a 50%, #000020 100%),
                radial-gradient(circle at 20% 30%, rgba(0, 243, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(255, 0, 255, 0.1) 0%, transparent 50%);
        }

        /* Grid Pattern */
        .grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
            opacity: 0.3;
        }

        /* Game Container - Full Screen */
        .game-container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* Header */
        .cyber-header {
            background: rgba(10, 10, 30, 0.9);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--cyber-blue);
            z-index: 1000;
            backdrop-filter: blur(10px);
            box-shadow: 0 5px 30px rgba(0, 0, 0, 0.5);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .cyber-logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(90deg, var(--cyber-blue), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .balance-display {
            background: linear-gradient(90deg, rgba(0, 243, 255, 0.1), rgba(255, 0, 255, 0.1));
            padding: 12px 24px;
            border-radius: 15px;
            border: 2px solid var(--cyber-blue);
            color: var(--cyber-blue);
            font-weight: 700;
            font-size: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Orbitron', sans-serif;
            box-shadow: var(--glow-blue);
        }

        /* Result Banner */
        .result-banner {
            position: absolute;
            top: 90px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1001;
            background: rgba(0, 0, 0, 0.95);
            padding: 20px 50px;
            border-radius: 20px;
            border: 3px solid;
            font-size: 28px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.5s;
            backdrop-filter: blur(20px);
            font-family: 'Orbitron', sans-serif;
        }

        .result-banner.show {
            opacity: 1;
            visibility: visible;
            animation: bannerAppear 0.6s ease-out;
        }

        .result-banner.win {
            border-color: var(--vault-gold);
            color: var(--vault-gold);
            box-shadow: var(--glow-gold);
            text-shadow: 0 0 20px var(--vault-gold);
        }

        .result-banner.lose {
            border-color: var(--danger-red);
            color: var(--danger-red);
            box-shadow: 0 0 40px rgba(255, 71, 87, 0.5);
            text-shadow: 0 0 20px var(--danger-red);
        }

        /* Main Game Area */
        .game-area {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            gap: 30px;
        }

        /* Ladder Display */
        .ladder-container {
            position: relative;
            width: 90%;
            max-width: 600px;
            height: 400px;
            margin-bottom: 30px;
        }

        .ladder-track {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 8px;
            height: 100%;
            background: linear-gradient(180deg, 
                var(--cyber-blue) 0%,
                var(--neon-pink) 100%);
            border-radius: 4px;
            box-shadow: 
                0 0 20px var(--cyber-blue),
                0 0 40px var(--neon-pink);
        }

        .ladder-step {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 60px;
            background: rgba(20, 20, 40, 0.9);
            border: 3px solid var(--cyber-blue);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.5s;
            z-index: 2;
            cursor: pointer;
        }

        .ladder-step.completed {
            background: rgba(0, 243, 255, 0.2);
            border-color: var(--hologram-teal);
            box-shadow: 0 0 30px var(--hologram-teal);
        }

        .ladder-step.active {
            background: rgba(255, 215, 0, 0.3);
            border-color: var(--vault-gold);
            box-shadow: 0 0 40px var(--vault-gold);
            animation: stepPulse 2s infinite;
            transform: translateX(-50%) scale(1.1);
        }

        .ladder-step.lost {
            background: rgba(255, 71, 87, 0.2);
            border-color: var(--danger-red);
            box-shadow: 0 0 30px var(--danger-red);
        }

        .step-multiplier {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            font-weight: 900;
            color: var(--vault-gold);
            text-shadow: 0 0 10px var(--vault-gold);
        }

        .step-round {
            font-size: 12px;
            color: var(--text-dim);
            margin-top: 4px;
        }

        /* Risk Meter */
        .risk-meter-container {
            width: 90%;
            max-width: 500px;
            background: rgba(20, 20, 40, 0.8);
            border-radius: 25px;
            padding: 20px;
            border: 2px solid var(--neon-pink);
            margin-bottom: 20px;
        }

        .risk-meter-title {
            color: var(--neon-pink);
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Orbitron', sans-serif;
        }

        .risk-meter {
            width: 100%;
            height: 30px;
            background: linear-gradient(90deg, 
                var(--success-green) 0%,
                var(--warning-orange) 50%,
                var(--danger-red) 100%);
            border-radius: 15px;
            overflow: hidden;
            position: relative;
        }

        .risk-level {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            transition: width 1s ease-in-out;
            border-radius: 15px;
        }

        .risk-markers {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 10px;
        }

        .risk-marker {
            color: white;
            font-size: 12px;
            font-weight: 700;
            margin-top: 35px;
        }

        /* Current Multiplier Display */
        .current-multiplier {
            position: absolute;
            top: 30px;
            right: 30px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.9);
            padding: 20px 30px;
            border-radius: 20px;
            border: 3px solid var(--vault-gold);
            text-align: center;
            min-width: 180px;
            box-shadow: var(--glow-gold);
            backdrop-filter: blur(10px);
        }

        .multiplier-label {
            font-size: 14px;
            color: var(--text-dim);
            margin-bottom: 8px;
            font-family: 'Orbitron', sans-serif;
        }

        .multiplier-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 42px;
            font-weight: 900;
            color: var(--vault-gold);
            text-shadow: 0 0 20px var(--vault-gold);
        }

        /* Control Panel */
        .control-panel {
            background: linear-gradient(180deg, 
                rgba(10, 10, 30, 0.95) 0%,
                rgba(5, 5, 15, 0.98) 100%);
            padding: 25px 30px;
            border-top: 3px solid var(--cyber-blue);
            z-index: 1000;
            backdrop-filter: blur(20px);
            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.5);
        }

        /* Bet Controls */
        .bet-controls {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 25px;
            margin-bottom: 25px;
            align-items: center;
        }

        .bet-input-group {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .bet-input {
            flex: 1;
            padding: 20px 25px;
            background: rgba(0, 0, 0, 0.7);
            border: 3px solid var(--cyber-blue);
            border-radius: 15px;
            color: var(--cyber-blue);
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            transition: all 0.3s;
            box-shadow: inset 0 0 20px rgba(0, 243, 255, 0.2);
        }

        .bet-input:focus {
            outline: none;
            border-color: var(--vault-gold);
            box-shadow: 
                inset 0 0 20px rgba(255, 215, 0, 0.3),
                0 0 30px rgba(255, 215, 0, 0.2);
        }

        .bet-currency {
            color: var(--cyber-blue);
            font-size: 28px;
            font-weight: 700;
            min-width: 50px;
            font-family: 'Orbitron', sans-serif;
        }

        /* Quick Bets */
        .quick-bets {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-bottom: 25px;
        }

        .quick-bet {
            padding: 15px 10px;
            background: rgba(0, 243, 255, 0.1);
            border: 2px solid var(--cyber-blue);
            border-radius: 12px;
            color: var(--cyber-blue);
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 16px;
            font-family: 'Orbitron', sans-serif;
        }

        .quick-bet:hover {
            background: var(--cyber-blue);
            color: #000;
            transform: translateY(-3px);
            box-shadow: var(--glow-blue);
        }

        /* Action Buttons */
        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        .btn {
            padding: 22px;
            border: none;
            border-radius: 15px;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: 'Orbitron', sans-serif;
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--cyber-blue), #0099cc);
            color: #000;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-4px);
            box-shadow: var(--glow-blue);
        }

        .btn-secondary {
            background: linear-gradient(135deg, var(--vault-gold), #cc9900);
            color: #000;
        }

        .btn-secondary:hover:not(:disabled) {
            transform: translateY(-4px);
            box-shadow: var(--glow-gold);
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--danger-red), #cc0000);
            color: white;
        }

        .btn-danger:hover:not(:disabled) {
            transform: translateY(-4px);
            box-shadow: 0 0 30px rgba(255, 71, 87, 0.6);
        }

        /* Cash Out Button */
        .cash-out-btn {
            position: fixed;
            bottom: 200px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1001;
            background: linear-gradient(135deg, #2ed573, #1e9050);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 25px 60px;
            font-size: 28px;
            font-weight: 900;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 20px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
            font-family: 'Orbitron', sans-serif;
            box-shadow: 0 10px 40px rgba(46, 213, 115, 0.4);
        }

        .cash-out-btn.show {
            opacity: 1;
            visibility: visible;
            animation: cashOutGlow 2s infinite;
        }

        .cash-out-btn:hover {
            transform: translateX(-50%) scale(1.05);
            box-shadow: 0 15px 50px rgba(46, 213, 115, 0.6);
        }

        /* Countdown Timer */
        .countdown-timer {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1002;
            font-size: 160px;
            font-weight: 900;
            color: var(--cyber-blue);
            text-shadow: 
                0 0 40px var(--cyber-blue),
                0 0 80px var(--cyber-blue);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
            font-family: 'Orbitron', sans-serif;
        }

        .countdown-timer.show {
            opacity: 1;
            visibility: visible;
            animation: countdownPulse 0.5s ease-out;
        }

        /* Bonus Round Display */
        .bonus-display {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1003;
            background: rgba(0, 0, 0, 0.95);
            padding: 40px 60px;
            border-radius: 30px;
            border: 4px solid var(--hologram-teal);
            text-align: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.5s;
            backdrop-filter: blur(30px);
            box-shadow: 
                0 0 60px var(--hologram-teal),
                0 0 120px var(--hologram-teal);
        }

        .bonus-display.show {
            opacity: 1;
            visibility: visible;
            animation: bonusAppear 0.8s ease-out;
        }

        .bonus-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 36px;
            font-weight: 900;
            color: var(--hologram-teal);
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 20px var(--hologram-teal);
        }

        .bonus-message {
            font-size: 22px;
            color: var(--text);
            margin-bottom: 30px;
        }

        /* Recent Winners */
        .recent-winners {
            background: rgba(10, 10, 30, 0.9);
            border-top: 2px solid var(--neon-pink);
            padding: 20px;
            max-height: 130px;
            overflow-y: auto;
            backdrop-filter: blur(10px);
        }

        .winners-title {
            color: var(--neon-pink);
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: 'Orbitron', sans-serif;
        }

        .winners-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .winner-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background: linear-gradient(90deg, 
                rgba(0, 243, 255, 0.1), 
                rgba(255, 0, 255, 0.1));
            border-radius: 10px;
            font-size: 14px;
            animation: slideInRight 0.4s ease-out;
            border-left: 4px solid var(--hologram-teal);
        }

        .winner-name {
            color: var(--hologram-teal);
            font-weight: 700;
            font-family: 'Orbitron', sans-serif;
        }

        .winner-amount {
            color: var(--vault-gold);
            font-weight: 900;
            font-family: 'Orbitron', sans-serif;
        }

        /* Game History */
        .game-history {
            position: fixed;
            bottom: 130px;
            left: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.97);
            border-radius: 20px;
            padding: 25px;
            border: 3px solid var(--cyber-blue);
            z-index: 1001;
            max-height: 350px;
            overflow-y: auto;
            display: none;
            backdrop-filter: blur(20px);
            box-shadow: 0 0 50px rgba(0, 243, 255, 0.3);
        }

        .game-history.show {
            display: block;
            animation: slideUp 0.4s ease-out;
        }

        .history-title {
            color: var(--cyber-blue);
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            font-family: 'Orbitron', sans-serif;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(0, 243, 255, 0.3);
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .history-item {
            display: grid;
            grid-template-columns: 60px 1fr 1fr 100px;
            gap: 15px;
            padding: 15px;
            background: rgba(0, 243, 255, 0.05);
            border-radius: 12px;
            font-size: 13px;
            align-items: center;
            border: 1px solid rgba(0, 243, 255, 0.1);
        }

        .history-time {
            color: var(--text-dim);
            font-family: 'Orbitron', sans-serif;
        }

        .history-bet {
            color: var(--cyber-blue);
            font-weight: 700;
            font-family: 'Orbitron', sans-serif;
        }

        .history-round {
            color: var(--neon-pink);
            font-weight: 700;
            font-family: 'Orbitron', sans-serif;
        }

        .history-result {
            font-weight: 900;
            text-align: right;
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
        }

        .history-result.win {
            color: var(--vault-gold);
            text-shadow: 0 0 10px var(--vault-gold);
        }

        .history-result.lose {
            color: var(--danger-red);
            text-shadow: 0 0 10px var(--danger-red);
        }

        /* Return to Games Button */
        .return-button {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1003;
            background: linear-gradient(135deg, var(--cyber-blue), var(--neon-pink));
            color: white;
            border: none;
            border-radius: 50px;
            padding: 25px 50px;
            font-size: 24px;
            font-weight: 900;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 20px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
            text-decoration: none;
            font-family: 'Orbitron', sans-serif;
            box-shadow: 0 10px 40px rgba(0, 243, 255, 0.4);
        }

        .return-button.show {
            opacity: 1;
            visibility: visible;
            animation: buttonGlow 2s infinite;
        }

        /* Cyber Particles */
        .cyber-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Animations */
        @keyframes bannerAppear {
            0% { transform: translateX(-50%) translateY(-100px) scale(0.8); opacity: 0; }
            70% { transform: translateX(-50%) translateY(10px) scale(1.05); }
            100% { transform: translateX(-50%) translateY(0) scale(1); opacity: 1; }
        }

        @keyframes countdownPulse {
            0% { transform: translate(-50%, -50%) scale(0.5) rotate(-180deg); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.2) rotate(0); }
            100% { transform: translate(-50%, -50%) scale(1) rotate(0); opacity: 1; }
        }

        @keyframes cashOutGlow {
            0%, 100% { box-shadow: 0 10px 40px rgba(46, 213, 115, 0.4); }
            50% { box-shadow: 0 10px 60px rgba(46, 213, 115, 0.8); }
        }

        @keyframes buttonGlow {
            0%, 100% { box-shadow: 0 10px 40px rgba(0, 243, 255, 0.4); }
            50% { box-shadow: 0 10px 60px rgba(0, 243, 255, 0.8); }
        }

        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes stepPulse {
            0%, 100% { box-shadow: 0 0 40px var(--vault-gold); }
            50% { box-shadow: 0 0 80px var(--vault-gold); }
        }

        @keyframes bonusAppear {

        function calculateRoundResult(round) {
            const roundConfig = gameState.ladderConfig[round];
            const loseChance = roundConfig.loseChance;
            
            // Combine seeds for provably fair randomness
            const combinedSeed = gameState.sessionData.serverSeed + 
                               gameState.sessionData.clientSeed + 
                               round + 
                               Date.now();
            
            // Generate deterministic random value
            const randomValue = seededRandom(combinedSeed);
            
            return randomValue > loseChance;
        }

        function seededRandom(seed) {
            let hash = 0;
            for (let i = 0; i < seed.length; i++) {
                hash = ((hash << 5) - hash) + seed.charCodeAt(i);
                hash |= 0;
            }
            return (Math.abs(hash) % 10000) / 10000;
        }

        // ===== BONUS ROUND SYSTEM =====
        async function triggerBonusRound() {
            gameState.inBonusRound = true;
            gameState.currentGame.bonusTriggered = true;
            
            // Select random bonus effect
            const randomEffect = gameState.bonusConfig.effects[
                Math.floor(Math.random() * gameState.bonusConfig.effects.length)
            ];
            
            gameState.currentGame.bonusEffect = randomEffect;
            
            // Play bonus sound
            gameState.audio.bonus.play();
            
            // Show bonus display
            const bonusDisplay = document.getElementById('bonus-display');
            document.getElementById('bonus-title').textContent = '⚡ FATE INTERVENES';
            document.getElementById('bonus-message').textContent = randomEffect.message;
            bonusDisplay.classList.add('show');
            
            // Create bonus particles
            createBonusParticles();
            
            // Apply bonus effect
            applyBonusEffect(randomEffect);
        }

        function applyBonusEffect(effect) {
            switch (effect.type) {
                case 'free_round':
                    // Add free round (doesn't count toward max rounds)
                    gameState.maxRounds++;
                    break;
                case 'multiplier_boost':
                    // Boost current multiplier
                    gameState.ladderConfig[gameState.currentRound].multiplier += effect.multiplier;
                    break;
                case 'risk_reduction':
                    // Reduce lose chance for current round
                    gameState.ladderConfig[gameState.currentRound].loseChance *= effect.multiplier;
                    break;
            }
        }

        // ===== JACKPOT SYSTEM =====
        async function triggerJackpot() {
            const jackpotAmount = gameState.jackpotPool > 0 ? 
                gameState.jackpotPool : 
                gameState.betAmount * 50; // Fallback jackpot
            
            // Play jackpot sound
            gameState.audio.jackpot.play();
            
            // Show jackpot message
            showToast(`🎰 VAULT OVERFLOW! +$${jackpotAmount.toFixed(2)}`, 'success');
            
            // Add to payout
            gameState.currentGame.payout += jackpotAmount;
            
            // Reset jackpot pool
            gameState.jackpotPool = 0;
            await updateJackpotPool();
            
            // Continue to complete game
            await completeGame(true);
        }

        async function updateJackpotPool() {
            try {
                await db.collection('doubleNothingJackpot').doc('current').set({
                    amount: gameState.jackpotPool,
                    updatedAt: new Date()
                }, { merge: true });
            } catch (error) {
                console.error('Error updating jackpot pool:', error);
            }
        }

        // ===== CASH OUT FUNCTION =====
        async function cashOut() {
            if (!gameState.isPlaying || !gameState.cashOutAvailable || gameState.inBonusRound) return;
            
            // Play cash out sound
            gameState.audio.cashOut.play();
            
            // Calculate payout
            const currentConfig = gameState.ladderConfig[gameState.currentRound];
            const payout = gameState.betAmount * currentConfig.multiplier;
            
            gameState.currentGame.cashedOut = true;
            gameState.currentGame.win = true;
            gameState.currentGame.payout = payout;
            gameState.currentGame.roundsReached = gameState.currentRound;
            
            await completeGame(true, true);
        }

        // ===== GAME COMPLETION =====
        async function completeGame(win, cashedOut = false) {
            gameState.isPlaying = false;
            gameState.inBonusRound = false;
            gameState.cashOutAvailable = false;
            
            // Hide bonus display if shown
            document.getElementById('bonus-display').classList.remove('show');
            
            // Hide cash out button
            document.getElementById('cash-out-btn').classList.remove('show');
            
            // Update game result
            if (win) {
                if (!cashedOut) {
                    // Full win - reached final round
                    const finalConfig = gameState.ladderConfig[gameState.maxRounds];
                    gameState.currentGame.payout = gameState.betAmount * finalConfig.multiplier;
                }
                
                // Add jackpot pool for round 7 win
                if (!cashedOut && gameState.currentRound === gameState.maxRounds && gameState.jackpotPool > 0) {
                    gameState.currentGame.payout += gameState.jackpotPool;
                    gameState.jackpotPool = 0;
                    await updateJackpotPool();
                }
                
                // Process win transaction
                if (gameState.currentGame.payout > 0) {
                    await processTransaction(
                        gameState.currentGame.payout,
                        'double_or_nothing_win',
                        `Double or Nothing win of $${gameState.currentGame.payout.toFixed(2)}`
                    );
                }
            } else {
                gameState.currentGame.payout = 0;
            }
            
            // Show result banner
            const resultBanner = document.getElementById('result-banner');
            const resultText = document.getElementById('result-text');
            
            if (win) {
                resultBanner.className = 'result-banner show win';
                if (cashedOut) {
                    resultText.textContent = 'CASH OUT SUCCESS!';
                } else if (gameState.currentGame.bonusTriggered) {
                    resultText.textContent = 'BONUS VICTORY!';
                } else {
                    resultText.textContent = 'DOUBLE UP!';
                }
                
                // Create victory particles
                createVictoryParticles();
            } else {
                resultBanner.className = 'result-banner show lose';
                resultText.textContent = 'BUSTED!';
                
                // Create failure effect
                createFailureEffect();
            }
            
            // Update ladder with final result
            updateLadderDisplay(win);
            
            // Add to game history
            addGameHistory();
            
            // Show return button after delay
            setTimeout(() => {
                document.getElementById('return-button').classList.add('show');
            }, 3000);
            
            // Reset UI
            document.getElementById('play-btn').disabled = false;
            document.getElementById('play-btn').innerHTML = '<i class="fas fa-lock"></i> LOCK BET';
            
            // Update session record
            await updateGameSession();
        }

        // ===== UI UPDATES =====
        function updateLadderDisplay(win = null) {
            const steps = document.querySelectorAll('.ladder-step');
            
            steps.forEach((step, index) => {
                const stepRound = parseInt(step.dataset.round) || 0;
                
                step.classList.remove('active', 'completed', 'lost');
                
                if (stepRound === 0) {
                    step.classList.add('completed'); // Start position
                    return;
                }
                
                if (stepRound <= gameState.currentRound) {
                    if (win === null) {
                        // Game in progress
                        if (stepRound === gameState.currentRound) {
                            step.classList.add('active');
                        } else {
                            step.classList.add('completed');
                        }
                    } else {
                        // Game finished
                        if (win) {
                            step.classList.add('completed');
                        } else {
                            if (stepRound === gameState.currentRound) {
                                step.classList.add('lost');
                            } else if (stepRound < gameState.currentRound) {
                                step.classList.add('completed');
                            }
                        }
                    }
                }
            });
            
            // Animate active step
            const activeStep = document.querySelector('.ladder-step.active');
            if (activeStep) {
                gsap.to(activeStep, {
                    scale: 1.2,
                    duration: 0.5,
                    yoyo: true,
                    repeat: 1
                });
            }
        }

        function updateRiskMeter() {
            const currentConfig = gameState.ladderConfig[gameState.currentRound];
            const riskPercentage = currentConfig.riskPercentage;
            
            const riskLevel = document.getElementById('risk-level');
            const riskPercentageText = document.getElementById('risk-percentage');
            
            riskLevel.style.width = `${riskPercentage}%`;
            riskPercentageText.textContent = `${riskPercentage}%`;
            
            // Color transition
            if (riskPercentage < 33) {
                riskLevel.style.background = 'rgba(46, 213, 115, 0.7)';
            } else if (riskPercentage < 66) {
                riskLevel.style.background = 'rgba(255, 165, 2, 0.7)';
            } else {
                riskLevel.style.background = 'rgba(255, 71, 87, 0.7)';
            }
        }

        function updateCurrentMultiplier() {
            const currentConfig = gameState.ladderConfig[gameState.currentRound];
            const multiplierElement = document.getElementById('current-multiplier');
            
            gsap.to(multiplierElement, {
                scale: 1.3,
                duration: 0.3,
                yoyo: true,
                repeat: 1,
                onUpdate: () => {
                    multiplierElement.textContent = `${currentConfig.multiplier.toFixed(1)}x`;
                    gameState.currentGame.multiplier = currentConfig.multiplier;
                }
            });
        }

        // ===== PARTICLE SYSTEMS =====
        function createCyberParticles() {
            const container = document.getElementById('cyber-particles');
            
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.style.cssText = `
                    position: absolute;
                    width: 2px;
                    height: 2px;
                    background: var(--cyber-blue);
                    border-radius: 50%;
                    pointer-events: none;
                    z-index: 1;
                    left: ${Math.random() * 100}%;
                    top: ${Math.random() * 100}%;
                    opacity: ${0.1 + Math.random() * 0.3};
                `;
                
                container.appendChild(particle);
                
                // Animate particle
                gsap.to(particle, {
                    x: (Math.random() - 0.5) * 100,
                    y: (Math.random() - 0.5) * 100,
                    duration: 2 + Math.random() * 3,
                    repeat: -1,
                    yoyo: true,
                    ease: "sine.inOut"
                });
            }
        }

        function createBonusParticles() {
            const container = document.getElementById('cyber-particles');
            const particleCount = 50;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.style.cssText = `
                    position: absolute;
                    width: 4px;
                    height: 4px;
                    background: var(--hologram-teal);
                    border-radius: 50%;
                    pointer-events: none;
                    z-index: 1000;
                    left: ${Math.random() * 100}%;
                    top: ${Math.random() * 100}%;
                    filter: blur(1px);
                `;
                
                container.appendChild(particle);
                
                // Animate particle explosion
                const angle = Math.random() * Math.PI * 2;
                const distance = 50 + Math.random() * 100;
                const duration = 1 + Math.random() * 1;
                
                gsap.to(particle, {
                    x: Math.cos(angle) * distance,
                    y: Math.sin(angle) * distance,
                    opacity: 0,
                    scale: 0,
                    duration: duration,
                    ease: "power2.out",
                    onComplete: () => particle.remove()
                });
            }
        }

        function createVictoryParticles() {
            const container = document.getElementById('cyber-particles');
            const particleCount = 100;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.style.cssText = `
                    position: absolute;
                    width: 6px;
                    height: 6px;
                    background: linear-gradient(45deg, var(--vault-gold), var(--neon-pink));
                    border-radius: 50%;
                    pointer-events: none;
                    z-index: 1000;
                    left: 50%;
                    top: 50%;
                    filter: blur(1px);
                `;
                
                container.appendChild(particle);
                
                // Animate particle burst
                const angle = Math.random() * Math.PI * 2;
                const distance = 100 + Math.random() * 200;
                const duration = 1.5 + Math.random() * 1;
                
                gsap.to(particle, {
                    x: Math.cos(angle) * distance,
                    y: Math.sin(angle) * distance,
                    opacity: 0,
                    scale: 0,
                    duration: duration,
                    ease: "power3.out",
                    onComplete: () => particle.remove()
                });
            }
        }

        function createFailureEffect() {
            // Add screen shake
            gsap.to('.game-container', {
                x: (Math.random() - 0.5) * 20,
                y: (Math.random() - 0.5) * 20,
                duration: 0.1,
                repeat: 5,
                yoyo: true,
                ease: "power1.inOut"
            });
            
            // Add red flash
            const flash = document.createElement('div');
            flash.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: var(--danger-red);
                opacity: 0;
                z-index: 999;
                pointer-events: none;
            `;
            
            document.body.appendChild(flash);
            
            gsap.to(flash, {
                opacity: 0.3,
                duration: 0.1,
                yoyo: true,
                repeat: 2,
                ease: "power1.inOut",
                onComplete: () => flash.remove()
            });
        }

        // ===== SESSION MANAGEMENT =====
        async function createGameSession(betAmount) {
            try {
                // Generate seeds for provably fair system
                const clientSeed = generateClientSeed();
                const serverSeed = await generateServerSeed();
                
                gameState.sessionData = {
                    serverSeed: serverSeed,
                    clientSeed: clientSeed,
                    startTime: new Date(),
                    betLocked: true,
                    roundResults: []
                };
                
                gameState.gameId = `double_${Date.now()}_${Math.random().toString(36).substr(2, 12)}`;
                
                // Create session record
                await db.collection("doubleNothingSessions").doc(gameState.gameId).set({
                    userId: gameState.currentUser.uid,
                    betAmount: betAmount,
                    clientSeed: clientSeed,
                    serverSeedHash: hashSeed(serverSeed),
                    status: 'active',
                    createdAt: new Date(),
                    roundsReached: 0,
                    result: null,
                    jackpotContribution: gameState.jackpotContribution
                });
                
                return true;
            } catch (error) {
                console.error('Error creating game session:', error);
                return false;
            }
        }

        function generateClientSeed() {
            return `client_${Date.now()}_${Math.random().toString(36).substr(2, 16)}`;
        }

        async function generateServerSeed() {
            // In production, this should be a Cloud Function
            return `server_${Date.now()}_${Math.random().toString(36).substr(2, 24)}`;
        }

        function hashSeed(seed) {
            let hash = 0;
            for (let i = 0; i < seed.length; i++) {
                hash = ((hash << 5) - hash) + seed.charCodeAt(i);
                hash = hash & hash;
            }
            return hash.toString(16);
        }

        async function updateGameSession() {
            try {
                await db.collection("doubleNothingSessions").doc(gameState.gameId).update({
                    status: 'completed',
                    roundsReached: gameState.currentGame.roundsReached,
                    result: gameState.currentGame.win ? 'win' : 'lose',
                    payout: gameState.currentGame.payout,
                    multiplier: gameState.currentGame.multiplier,
                    cashedOut: gameState.currentGame.cashedOut,
                    bonusTriggered: gameState.currentGame.bonusTriggered,
                    roundResults: gameState.sessionData.roundResults,
                    completedAt: new Date()
                });
            } catch (error) {
                console.error('Error updating game session:', error);
            }
        }

        // ===== TRANSACTION SYSTEM =====
        async function processTransaction(amount, type, description) {
            try {
                const walletRef = db.collection("wallets").doc(gameState.currentUser.uid);
                
                // Use transaction for atomic update
                await db.runTransaction(async (transaction) => {
                    const walletDoc = await transaction.get(walletRef);
                    
                    if (!walletDoc.exists) {
                        throw new Error("Wallet not found");
                    }
                    
                    const currentBalance = walletDoc.data().balance || 0;
                    const newBalance = currentBalance + amount;
                    
                    if (newBalance < 0) {
                        throw new Error("Insufficient funds");
                    }
                    
                    // Update wallet
                    transaction.update(walletRef, {
                        balance: newBalance,
                        updatedAt: new Date()
                    });
                    
                    // Create transaction record
                    const transactionRef = db.collection("transactions").doc();
                    transaction.set(transactionRef, {
                        userId: gameState.currentUser.uid,
                        type: type,
                        amount: amount,
                        description: description,
                        gameId: gameState.gameId,
                        beforeBalance: currentBalance,
                        afterBalance: newBalance,
                        createdAt: new Date(),
                        status: 'completed'
                    });
                    
                    // Update local balance
                    gameState.balance = newBalance;
                    updateBalanceDisplay();
                    
                    return { success: true, newBalance };
                });
            } catch (error) {
                console.error('Transaction failed:', error);
                showToast('Transaction failed: ' + error.message, 'error');
                return { success: false, error: error.message };
            }
        }

        // ===== GAME HISTORY =====
        function addGameHistory() {
            const historyItem = {
                time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                bet: gameState.currentGame.bet,
                round: gameState.currentGame.roundsReached,
                result: gameState.currentGame.win ? 'WIN' : 'LOSE',
                amount: gameState.currentGame.win ? gameState.currentGame.payout : -gameState.currentGame.bet,
                multiplier: gameState.currentGame.multiplier.toFixed(1),
                cashedOut: gameState.currentGame.cashedOut,
                bonus: gameState.currentGame.bonusTriggered
            };
            
            gameState.gameHistory.unshift(historyItem);
            if (gameState.gameHistory.length > 25) {
                gameState.gameHistory.pop();
            }
            
            updateHistoryDisplay();
            saveGameHistory();
        }

        function updateHistoryDisplay() {
            const historyList = document.getElementById('history-list');
            historyList.innerHTML = '';
            
            gameState.gameHistory.forEach(item => {
                const historyItem = document.createElement('div');
                historyItem.className = 'history-item';
                
                const bonusIcon = item.bonus ? ' ⚡' : '';
                const cashOutIcon = item.cashedOut ? ' 💰' : '';
                
                historyItem.innerHTML = `
                    <div class="history-time">${item.time}</div>
                    <div class="history-bet">$${item.bet.toFixed(2)}</div>
                    <div class="history-round">R${item.round}${bonusIcon}${cashOutIcon}</div>
                    <div class="history-result ${item.result.toLowerCase()}">
                        ${item.amount > 0 ? '+' : ''}$${Math.abs(item.amount).toFixed(2)}
                    </div>
                `;
                
                historyList.appendChild(historyItem);
            });
        }

        async function saveGameHistory() {
            try {
                await db.collection("doubleNothingHistory").doc(gameState.currentUser.uid).collection("games").add({
                    userId: gameState.currentUser.uid,
                    ...gameState.currentGame,
                    timestamp: new Date(),
                    gameId: gameState.gameId,
                    roundResults: gameState.sessionData.roundResults
                });
            } catch (error) {
                console.error('Error saving game history:', error);
            }
        }

        // ===== LIVE WINNERS SYSTEM =====
        async function loadRecentWinners() {
            try {
                // Get real winners from database
                const snapshot = await db.collection("doubleNothingHistory")
                    .where("result.win", "==", true)
                    .orderBy("timestamp", "desc")
                    .limit(8)
                    .get();
                
                const winnersList = document.getElementById('winners-list');
                winnersList.innerHTML = '';
                
                if (snapshot.empty) {
                    // Generate simulated winners
                    generateSimulatedWinners();
                    return;
                }
                
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const winnerItem = document.createElement('div');
                    winnerItem.className = 'winner-item';
                    
                    const randomNickname = cyberNicknames[
                        Math.floor(Math.random() * cyberNicknames.length)
                    ];
                    
                    winnerItem.innerHTML = `
                        <div class="winner-name">${randomNickname}</div>
                        <div class="winner-amount">+$${data.payout.toFixed(2)}</div>
                    `;
                    
                    winnersList.appendChild(winnerItem);
                });
                
                // Auto-refresh winners
                setTimeout(loadRecentWinners, 15000);
                
            } catch (error) {
                console.error('Error loading winners:', error);
                generateSimulatedWinners();
            }
        }

        function generateSimulatedWinners() {
            const winnersList = document.getElementById('winners-list');
            winnersList.innerHTML = '';
            
            // Generate 4-6 simulated winners
            const winnerCount = 4 + Math.floor(Math.random() * 3);
            
            for (let i = 0; i < winnerCount; i++) {
                const winnerItem = document.createElement('div');
                winnerItem.className = 'winner-item';
                
                const randomNickname = cyberNicknames[
                    Math.floor(Math.random() * cyberNicknames.length)
                ];
                const randomAmount = (10 + Math.random() * 190).toFixed(2); // $10-$200
                const randomMultiplier = (2 + Math.random() * 13).toFixed(1); // 2x-15x
                
                winnerItem.innerHTML = `
                    <div class="winner-name">${randomNickname}</div>
                    <div class="winner-amount">+$${randomAmount} (${randomMultiplier}x)</div>
                `;
                
                winnersList.appendChild(winnerItem);
            }
            
            // Auto-refresh
            setTimeout(generateSimulatedWinners, 15000);
        }

        // ===== UI FUNCTIONS =====
        function showToast(message, type = 'info') {
            const colors = {
                success: '#2ed573',
                error: '#ff4757',
                warning: '#ffa502',
                info: '#00f3ff'
            };
            
            const toast = document.createElement('div');
            toast.textContent = message;
            toast.style.cssText = `
                position: fixed;
                top: 120px;
                left: 50%;
                transform: translateX(-50%);
                background: rgba(10, 10, 30, 0.95);
                color: white;
                padding: 15px 30px;
                border-radius: 15px;
                border: 2px solid ${colors[type]};
                border-left-width: 6px;
                z-index: 10000;
                animation: toastSlide 0.4s ease-out;
                backdrop-filter: blur(20px);
                font-weight: 700;
                font-family: 'Orbitron', sans-serif;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
                max-width: 90%;
                text-align: center;
            `;
            
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.animation = 'toastFade 0.4s ease-out';
                setTimeout(() => toast.remove(), 400);
            }, 3000);
        }

        // ===== EVENT LISTENERS =====
        function setupEventListeners() {
            // Play button
            document.getElementById('play-btn').addEventListener('click', startGame);
            
            // Cash out button
            document.getElementById('cash-out-btn').addEventListener('click', cashOut);
            
            // Continue bonus button
            document.getElementById('continue-bonus-btn').addEventListener('click', () => {
                document.getElementById('bonus-display').classList.remove('show');
                gameState.inBonusRound = false;
                startNextRound();
            });
            
            // History button
            document.getElementById('history-btn').addEventListener('click', () => {
                document.getElementById('game-history').classList.add('show');
            });
            
            // Close history
            document.getElementById('close-history').addEventListener('click', () => {
                document.getElementById('game-history').classList.remove('show');
            });
            
            // Quick bet buttons
            document.querySelectorAll('.quick-bet').forEach(btn => {
                btn.addEventListener('click', () => {
                    const amount = parseFloat(btn.dataset.amount);
                    document.getElementById('bet-amount').value = amount;
                    gameState.betAmount = amount;
                    
                    // Animate button
                    gsap.to(btn, {
                        scale: 1.1,
                        duration: 0.2,
                        yoyo: true,
                        repeat: 1
                    });
                });
            });
            
            // Bet input
            document.getElementById('bet-amount').addEventListener('input', (e) => {
                let value = parseFloat(e.target.value) || 1;
                const maxBet = Math.min(gameState.balance, 1000);
                value = Math.max(1, Math.min(value, maxBet));
                e.target.value = value;
                gameState.betAmount = value;
            });
            
            // Touch gestures
            document.addEventListener('touchstart', handleTouchStart);
            document.addEventListener('touchend', handleTouchEnd);
        }

        let touchStartY = 0;
        
        function handleTouchStart(e) {
            touchStartY = e.touches[0].clientY;
        }
        
        function handleTouchEnd(e) {
            if (!gameState.isPlaying || !gameState.cashOutAvailable) return;
            
            const touchEndY = e.changedTouches[0].clientY;
            const deltaY = touchStartY - touchEndY;
            
            // Swipe up to cash out
            if (deltaY > 100) {
                cashOut();
            }
        }

        // ===== START THE GAME =====
        document.addEventListener('DOMContentLoaded', initializeGame);

        // Add CSS animations
        const style = document.createElement('style');
        style.textContent = `
            @keyframes toastSlide {
                from { transform: translateX(-50%) translateY(-50px); opacity: 0; }
                to { transform: translateX(-50%) translateY(0); opacity: 1; }
            }
            
            @keyframes toastFade {
                from { transform: translateX(-50%) translateY(0); opacity: 1; }
                to { transform: translateX(-50%) translateY(-50px); opacity: 0; }
            }
        `;
        document.head.appendChild(style);
    </script>
