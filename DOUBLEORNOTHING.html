<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎮 DOUBLE OR NOTHING - XCrazyBet</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-functions-compat.js"></script>
    
    <!-- Howler.js for Audio -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>

    <style>
        :root {
            --primary: #00ff9d;
            --primary-dark: #00cc7a;
            --secondary: #ff9800;
            --secondary-dark: #ff6d00;
            --danger: #ff5252;
            --danger-dark: #ff1744;
            --success: #4caf50;
            --warning: #ffc107;
            --bg: #0a0f1a;
            --surface: #111827;
            --surface-light: #1a2332;
            --text: #ffffff;
            --text-dim: #a0a8c9;
            --win-glow: rgba(0, 255, 157, 0.5);
            --lose-glow: rgba(255, 82, 82, 0.5);
            --pulse-glow: rgba(255, 152, 0, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Segoe UI', 'Roboto', system-ui, -apple-system, sans-serif;
            user-select: none;
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow: hidden;
            position: relative;
            touch-action: manipulation;
        }

        /* Full Screen Container */
        .fullscreen-container {
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            background: var(--bg);
            display: none;
            flex-direction: column;
            overflow: hidden;
        }

        .fullscreen-container.active {
            display: flex;
        }

        /* Background Effects */
        .bg-effects {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: 
                radial-gradient(circle at 20% 30%, rgba(0, 255, 157, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(255, 152, 0, 0.08) 0%, transparent 50%),
                linear-gradient(135deg, #000000 0%, var(--bg) 100%);
        }

        /* Header */
        .game-header {
            background: rgba(17, 24, 39, 0.95);
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
            backdrop-filter: blur(10px);
            z-index: 100;
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .home-btn {
            width: 36px;
            height: 36px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #000;
            font-size: 18px;
            transition: all 0.3s;
        }

        .home-btn:hover {
            background: var(--primary-dark);
            transform: scale(1.1);
        }

        .game-logo {
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--primary);
        }

        .balance-display {
            background: linear-gradient(45deg, #1a2332, #0f172a);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--primary);
            color: var(--primary);
            font-weight: 700;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 140px;
            justify-content: center;
        }

        /* Result Banner */
        .result-banner {
            position: absolute;
            top: 70px;
            left: 0;
            width: 100%;
            padding: 15px;
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            z-index: 90;
            transform: translateY(-100%);
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            backdrop-filter: blur(20px);
            border-bottom: 3px solid;
        }

        .result-banner.show {
            transform: translateY(0);
            opacity: 1;
        }

        .result-banner.win {
            background: linear-gradient(90deg, rgba(0, 255, 157, 0.1), rgba(0, 255, 157, 0.2));
            color: var(--primary);
            border-color: var(--primary);
            animation: winGlow 2s infinite;
        }

        .result-banner.lose {
            background: linear-gradient(90deg, rgba(255, 82, 82, 0.1), rgba(255, 82, 82, 0.2));
            color: var(--danger);
            border-color: var(--danger);
            animation: losePulse 1s infinite;
        }

        /* Game Container */
        .game-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 15px;
            gap: 15px;
            overflow: hidden;
        }

        /* Phase Indicator */
        .phase-indicator {
            text-align: center;
            padding: 12px;
            background: rgba(17, 24, 39, 0.8);
            border-radius: 15px;
            border: 2px solid rgba(255, 152, 0, 0.3);
            backdrop-filter: blur(10px);
            flex-shrink: 0;
        }

        .phase-title {
            font-size: 14px;
            color: var(--text-dim);
            margin-bottom: 5px;
        }

        .phase-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .round-display {
            font-size: 18px;
            font-weight: 700;
            color: var(--secondary);
        }

        .multiplier-display {
            font-size: 24px;
            font-weight: 900;
            color: var(--primary);
            text-shadow: 0 0 10px rgba(0, 255, 157, 0.5);
            animation: pulse 2s infinite;
        }

        /* Main Game Area */
        .game-visual-area {
            flex: 1;
            position: relative;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            border: 4px solid rgba(255, 152, 0, 0.2);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 300px;
        }

        /* Canvas for WebGL/Three.js Effects */
        #game-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Energy Orb Container */
        .orb-container {
            position: relative;
            z-index: 2;
            text-align: center;
        }

        .energy-orb {
            width: 200px;
            height: 200px;
            background: radial-gradient(circle at 30% 30%, #00ff9d, #00cc7a);
            border-radius: 50%;
            position: relative;
            cursor: pointer;
            box-shadow: 
                0 0 60px rgba(0, 255, 157, 0.6),
                0 0 100px rgba(0, 255, 157, 0.3),
                inset 0 0 60px rgba(255, 255, 255, 0.2);
            transition: all 0.3s;
            animation: orbFloat 3s infinite ease-in-out;
        }

        @media (max-width: 768px) {
            .energy-orb {
                width: 180px;
                height: 180px;
            }
        }

        @media (max-width: 480px) {
            .energy-orb {
                width: 160px;
                height: 160px;
            }
        }

        .energy-orb:active {
            transform: scale(0.95);
        }

        .orb-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(0, 255, 157, 0.2), transparent 70%);
            border-radius: 50%;
            filter: blur(20px);
            z-index: -1;
            animation: glowPulse 2s infinite alternate;
        }

        .orb-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 32px;
            font-weight: 900;
            color: #000;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
            z-index: 3;
        }

        /* Action Button Area */
        .action-area {
            padding: 15px;
            background: rgba(17, 24, 39, 0.9);
            border-radius: 15px;
            border: 2px solid rgba(255, 152, 0, 0.2);
            backdrop-filter: blur(10px);
            flex-shrink: 0;
        }

        /* Main Action Button */
        .action-button {
            width: 100%;
            padding: 25px;
            font-size: 24px;
            font-weight: 900;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            min-height: 70px;
            touch-action: manipulation;
        }

        .action-button:active {
            transform: scale(0.98);
        }

        .action-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .action-button.start {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #000;
            animation: buttonPulse 2s infinite;
        }

        .action-button.tap {
            background: linear-gradient(135deg, var(--secondary), var(--secondary-dark));
            color: #000;
            font-size: 28px;
        }

        .action-button.double {
            background: linear-gradient(135deg, #00ff9d, #00cc7a);
            color: #000;
        }

        .action-button.collect {
            background: linear-gradient(135deg, #4caf50, #2e7d32);
            color: #000;
        }

        .action-button.play-again {
            background: linear-gradient(135deg, var(--danger), var(--danger-dark));
            color: #fff;
        }

        /* Bet Controls */
        .bet-controls {
            padding: 15px;
            background: rgba(10, 15, 26, 0.8);
            border-radius: 15px;
            border: 2px solid rgba(255, 152, 0, 0.2);
            flex-shrink: 0;
        }

        .bet-display {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 18px;
            font-weight: 600;
        }

        .wallet-display, .bet-display-amount {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .bet-slider-container {
            margin: 15px 0;
        }

        .bet-slider {
            width: 100%;
            height: 40px;
            -webkit-appearance: none;
            appearance: none;
            background: linear-gradient(90deg, var(--primary-dark), var(--primary));
            border-radius: 20px;
            outline: none;
            padding: 0 5px;
        }

        .bet-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 50px;
            height: 50px;
            background: var(--secondary);
            border-radius: 50%;
            cursor: pointer;
            border: 4px solid #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            transition: all 0.2s;
        }

        .bet-slider::-webkit-slider-thumb:hover {
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(255, 152, 0, 0.8);
        }

        .quick-bets {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .quick-bet {
            padding: 12px;
            background: rgba(17, 24, 39, 0.8);
            border: 2px solid var(--primary);
            border-radius: 10px;
            color: var(--primary);
            font-weight: 700;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .quick-bet:hover {
            background: var(--primary);
            color: #000;
            transform: translateY(-2px);
        }

        .quick-bet.active {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 15px rgba(0, 255, 157, 0.5);
        }

        /* Records Panel */
        .records-panel {
            background: rgba(17, 24, 39, 0.9);
            border-radius: 15px;
            padding: 15px;
            border: 2px solid rgba(255, 152, 0, 0.2);
            max-height: 150px;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .records-title {
            font-size: 14px;
            color: var(--secondary);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 152, 0, 0.2);
        }

        .records-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .record-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 10px;
            background: rgba(10, 15, 26, 0.5);
            border-radius: 8px;
            font-size: 12px;
            border-left: 3px solid var(--primary);
        }

        .record-item.win {
            border-left-color: var(--primary);
            background: rgba(0, 255, 157, 0.05);
        }

        .record-item.lose {
            border-left-color: var(--danger);
            background: rgba(255, 82, 82, 0.05);
        }

        .record-action {
            color: var(--text-dim);
        }

        .record-result {
            font-weight: 700;
        }

        .record-result.win {
            color: var(--primary);
        }

        .record-result.lose {
            color: var(--danger);
        }

        /* Recent Winners Feed */
        .winners-feed {
            background: rgba(0, 0, 0, 0.7);
            border-radius: 10px;
            padding: 10px;
            margin-top: 10px;
            border: 1px solid rgba(255, 152, 0, 0.2);
            max-height: 80px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .winners-title {
            font-size: 12px;
            color: var(--secondary);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .winners-ticker {
            display: flex;
            flex-direction: column;
            gap: 5px;
            animation: tickerScroll 30s linear infinite;
        }

        .winner-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--text);
            padding: 4px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .winner-item:last-child {
            border-bottom: none;
        }

        .winner-icon {
            color: var(--primary);
            font-size: 10px;
        }

        /* Countdown Display */
        .countdown-display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 120px;
            font-weight: 900;
            color: var(--secondary);
            text-shadow: 0 0 30px rgba(255, 152, 0, 0.8);
            z-index: 10;
            display: none;
            animation: countdownPop 0.5s ease-out;
        }

        .countdown-display.show {
            display: block;
        }

        /* Full Screen Toggle */
        .fullscreen-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: var(--secondary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-size: 20px;
            cursor: pointer;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.3s;
        }

        .fullscreen-toggle:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }

        /* Return to Games Button */
        .return-button {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 100;
            background: rgba(17, 24, 39, 0.9);
            border: 2px solid var(--primary);
            border-radius: 10px;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
        }

        .return-button:hover {
            background: var(--primary);
            color: #000;
            transform: translateY(-2px);
        }

        /* Toast Notifications */
        .toast-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 300px;
            width: 90%;
        }

        .toast {
            padding: 15px;
            background: rgba(17, 24, 39, 0.95);
            border-radius: 10px;
            border-left: 4px solid var(--primary);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
            transform: translateY(100%);
            opacity: 0;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
            font-size: 14px;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.success {
            border-color: var(--primary);
        }

        .toast.error {
            border-color: var(--danger);
        }

        .toast.warning {
            border-color: var(--secondary);
        }

        /* Mute Toggle */
        .mute-toggle {
            position: fixed;
            bottom: 80px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: rgba(17, 24, 39, 0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            font-size: 20px;
            cursor: pointer;
            z-index: 1000;
            border: 2px solid var(--primary);
            backdrop-filter: blur(10px);
            transition: all 0.3s;
        }

        .mute-toggle:hover {
            background: var(--primary);
            color: #000;
            transform: scale(1.1);
        }

        /* Loading Overlay */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .loading-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 5px solid rgba(255, 152, 0, 0.3);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 1s ease-in-out infinite;
        }

        /* Animations */
        @keyframes orbFloat {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-20px) scale(1.02); }
        }

        @keyframes glowPulse {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            100% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.8; }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes buttonPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(0, 255, 157, 0.7); }
            50% { box-shadow: 0 0 0 15px rgba(0, 255, 157, 0); }
        }

        @keyframes winGlow {
            0%, 100% { box-shadow: 0 0 30px var(--win-glow); }
            50% { box-shadow: 0 0 60px var(--win-glow); }
        }

        @keyframes losePulse {
            0%, 100% { box-shadow: 0 0 20px var(--lose-glow); }
            50% { box-shadow: 0 0 40px var(--lose-glow); }
        }

        @keyframes countdownPop {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            70% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        @keyframes tickerScroll {
            0% { transform: translateY(0); }
            100% { transform: translateY(-100%); }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .game-header {
                flex-direction: column;
                gap: 10px;
                padding: 10px;
            }

            .header-left {
                width: 100%;
                justify-content: space-between;
            }

            .balance-display {
                width: 100%;
                min-width: auto;
            }

            .game-container {
                padding: 10px;
                gap: 10px;
            }

            .action-button {
                padding: 20px;
                font-size: 20px;
                min-height: 60px;
            }

            .multiplier-display {
                font-size: 20px;
            }

            .quick-bets {
                grid-template-columns: repeat(2, 1fr);
            }

            .return-button {
                padding: 8px 12px;
                font-size: 14px;
                top: 10px;
                right: 10px;
            }
        }

        @media (max-width: 480px) {
            .energy-orb {
                width: 140px;
                height: 140px;
            }

            .orb-text {
                font-size: 24px;
            }

            .action-button {
                padding: 18px;
                font-size: 18px;
                min-height: 56px;
            }

            .countdown-display {
                font-size: 80px;
            }

            .result-banner {
                font-size: 20px;
                top: 60px;
            }
        }

        /* Landscape Mode */
        @media (max-height: 600px) and (orientation: landscape) {
            .game-header {
                padding: 8px;
            }

            .game-container {
                padding: 8px;
                gap: 8px;
            }

            .energy-orb {
                width: 120px;
                height: 120px;
            }

            .records-panel {
                max-height: 80px;
            }
        }
    </style>
</head>
<body>
    <!-- Background Effects -->
    <div class="bg-effects"></div>

    <!-- Main Game Container -->
    <div class="fullscreen-container" id="game-screen">
        <!-- Header -->
        <header class="game-header">
            <div class="header-left">
                <div class="game-logo">
                    <i class="fas fa-bolt"></i>
                    DOUBLE OR NOTHING
                </div>
            </div>
            <div class="balance-display">
                <i class="fas fa-wallet"></i>
                $<span id="balance-val">0.00</span>
            </div>
        </header>

        <!-- Result Banner -->
        <div class="result-banner" id="result-banner">
            <div id="result-text">YOU WIN +$0.00</div>
        </div>

        // ===== CANVAS EFFECTS =====
        const canvasEffects = {
            canvas: null,
            ctx: null,
            particles: [],
            isActive: false,
            
            init: function() {
                this.canvas = document.getElementById('game-canvas');
                this.ctx = this.canvas.getContext('2d');
                
                // Set canvas size
                this.resize();
                window.addEventListener('resize', () => this.resize());
            },
            
            resize: function() {
                const container = this.canvas.parentElement;
                this.canvas.width = container.clientWidth;
                this.canvas.height = container.clientHeight;
            },
            
            createParticles: function(type, x, y) {
                const colors = type === 'win' 
                    ? ['#00ff9d', '#00cc7a', '#4caf50'] 
                    : ['#ff5252', '#ff1744', '#ff9800'];
                
                for (let i = 0; i < 50; i++) {
                    this.particles.push({
                        x: x,
                        y: y,
                        size: Math.random() * 5 + 2,
                        speedX: Math.random() * 6 - 3,
                        speedY: Math.random() * 6 - 3,
                        color: colors[Math.floor(Math.random() * colors.length)],
                        life: 100
                    });
                }
            },
            
            updateParticles: function() {
                this.particles = this.particles.filter(particle => {
                    particle.x += particle.speedX;
                    particle.y += particle.speedY;
                    particle.life -= 2;
                    particle.size *= 0.95;
                    return particle.life > 0;
                });
            },
            
            drawParticles: function() {
                this.particles.forEach(particle => {
                    this.ctx.globalAlpha = particle.life / 100;
                    this.ctx.fillStyle = particle.color;
                    this.ctx.beginPath();
                    this.ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
                    this.ctx.fill();
                });
                this.ctx.globalAlpha = 1;
            },
            
            render: function() {
                if (!this.isActive) return;
                
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                this.updateParticles();
                this.drawParticles();
                
                requestAnimationFrame(() => this.render());
            },
            
            start: function() {
                this.isActive = true;
                this.render();
            },
            
            stop: function() {
                this.isActive = false;
                this.particles = [];
            }
        };

        // ===== GAME FUNCTIONS =====
        function initGame() {
            // Initialize systems
            audio.init();
            canvasEffects.init();
            
            // Check authentication
            checkAuth();
            
            // Setup event listeners
            setupEventListeners();
            
            // Start canvas effects
            canvasEffects.start();
            
            // Generate initial winners feed
            generateWinnersFeed();
            
            // Show full screen container
            document.getElementById('game-screen').classList.add('active');
            
            showToast('Welcome to Double or Nothing!', 'success');
        }

        function checkAuth() {
            auth.onAuthStateChanged(user => {
                if (!user) {
                    showToast('Please login to play', 'error');
                    setTimeout(() => {
                        window.location.href = 'https://xcrazybet.github.io/millioner/login.html';
                    }, 2000);
                    return;
                }
                gameState.currentUser = user;
                loadBalance();
                setupRealtimeListeners();
                loadGameRecords();
            });
        }

        async function loadBalance() {
            try {
                const doc = await db.collection("wallets").doc(gameState.currentUser.uid).get();
                if (doc.exists) {
                    gameState.balance = doc.data().balance || 0;
                    updateBalanceDisplay();
                } else {
                    await db.collection("wallets").doc(gameState.currentUser.uid).set({
                        balance: 100,
                        createdAt: new Date(),
                        updatedAt: new Date()
                    });
                    gameState.balance = 100;
                    updateBalanceDisplay();
                }
            } catch (error) {
                console.error('Error loading balance:', error);
                showToast('Error loading balance', 'error');
            }
        }

        function updateBalanceDisplay() {
            document.getElementById('balance-val').textContent = gameState.balance.toFixed(2);
            document.getElementById('wallet-amount').textContent = gameState.balance.toFixed(2);
        }

        function setupRealtimeListeners() {
            const walletRef = db.collection("wallets").doc(gameState.currentUser?.uid);
            
            walletRef.onSnapshot((doc) => {
                if (doc.exists) {
                    const newBalance = doc.data().balance || 0;
                    if (newBalance !== gameState.balance) {
                        gameState.balance = newBalance;
                        updateBalanceDisplay();
                        updateBetSlider();
                    }
                }
            }, (error) => {
                console.error('Balance listener error:', error);
            });
        }

        function setupEventListeners() {
            // Action button
            const actionButton = document.getElementById('action-button');
            actionButton.addEventListener('click', handleActionButton);
            
            // Energy orb tap
            const energyOrb = document.getElementById('energy-orb');
            energyOrb.addEventListener('click', handleOrbTap);
            
            // Bet slider
            const betSlider = document.getElementById('bet-slider');
            betSlider.addEventListener('input', updateBetFromSlider);
            
            // Quick bet buttons
            document.querySelectorAll('.quick-bet').forEach(btn => {
                btn.addEventListener('click', () => {
                    const amount = parseFloat(btn.dataset.amount);
                    setBetAmount(amount);
                });
            });
            
            // Full screen toggle
            const fullscreenToggle = document.getElementById('fullscreen-toggle');
            fullscreenToggle.addEventListener('click', toggleFullscreen);
            
            // Mute toggle
            const muteToggle = document.getElementById('mute-toggle');
            muteToggle.addEventListener('click', toggleAudioMute);
            
            // Return button
            const returnButton = document.getElementById('return-button');
            returnButton.addEventListener('click', (e) => {
                if (gameState.gameActive) {
                    e.preventDefault();
                    showToast('Cannot exit during active game!', 'warning');
                }
            });
        }

        function setBetAmount(amount) {
            if (gameState.gameActive) {
                showToast('Cannot change bet during game', 'warning');
                return;
            }
            
            gameState.betAmount = amount;
            document.getElementById('bet-amount-display').textContent = amount;
            document.getElementById('bet-slider').value = amount;
            
            // Update quick bet buttons
            document.querySelectorAll('.quick-bet').forEach(btn => {
                if (parseFloat(btn.dataset.amount) === amount) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
            
            showToast(`Bet set to $${amount}`, 'info');
        }

        function updateBetFromSlider() {
            const slider = document.getElementById('bet-slider');
            const amount = parseInt(slider.value);
            setBetAmount(amount);
        }

        function updateBetSlider() {
            const slider = document.getElementById('bet-slider');
            const maxBet = Math.min(gameState.balance, 100);
            slider.max = maxBet;
            
            if (gameState.betAmount > maxBet) {
                setBetAmount(maxBet);
            }
        }

        async function handleActionButton() {
            const actionButton = document.getElementById('action-button');
            
            if (actionButton.classList.contains('start')) {
                await startGame();
            } else if (actionButton.classList.contains('double')) {
                await continueGame();
            } else if (actionButton.classList.contains('collect')) {
                await cashOut();
            } else if (actionButton.classList.contains('play-again')) {
                resetGame();
            }
        }

        async function startGame() {
            // Validate bet
            if (gameState.betAmount < 1) {
                showToast('Bet amount must be at least $1', 'error');
                return;
            }
            
            if (gameState.betAmount > gameState.balance) {
                showToast('Insufficient balance', 'error');
                return;
            }
            
            if (gameState.gameActive) {
                showToast('Game already in progress', 'warning');
                return;
            }
            
            // Show loading
            showLoading(true);
            
            try {
                // Create game session on server
                const startGameFunction = functions.httpsCallable('startDoubleOrNothingGame');
                const result = await startGameFunction({
                    betAmount: gameState.betAmount
                });
                
                if (result.data.success) {
                    gameState.sessionId = result.data.sessionId;
                    gameState.gameActive = true;
                    gameState.currentRound = 1;
                    gameState.totalMultiplier = 2;
                    
                    // Update UI
                    updatePhaseIndicator();
                    updateActionButton('countdown');
                    
                    // Start countdown
                    startCountdown();
                    
                    audio.play('start');
                    
                    showToast('Game started! Get ready...', 'success');
                } else {
                    showToast('Failed to start game: ' + result.data.error, 'error');
                }
            } catch (error) {
                console.error('Start game error:', error);
                showToast('Network error. Please try again.', 'error');
            } finally {
                showLoading(false);
            }
        }

        function startCountdown() {
            gameState.countdownActive = true;
            const countdownDisplay = document.getElementById('countdown-display');
            countdownDisplay.classList.add('show');
            
            let count = 5;
            countdownDisplay.textContent = count;
            
            audio.play('countdown');
            
            const countdownInterval = setInterval(() => {
                count--;
                countdownDisplay.textContent = count;
                audio.play('countdown');
                
                if (count <= 0) {
                    clearInterval(countdownInterval);
                    countdownDisplay.classList.remove('show');
                    gameState.countdownActive = false;
                    
                    // Enable orb tapping
                    updateOrbState('active');
                    updateActionButton('tap');
                    
                    showToast('Tap the orb!', 'success');
                }
            }, 1000);
        }

        async function handleOrbTap() {
            if (!gameState.gameActive || gameState.countdownActive) return;
            
            // Show loading
            showLoading(true);
            
            // Play tap sound
            audio.play('tap');
            
            // Create visual effect
            const orb = document.getElementById('energy-orb');
            const rect = orb.getBoundingClientRect();
            const x = rect.left + rect.width / 2;
            const y = rect.top + rect.height / 2;
            canvasEffects.createParticles('tap', x, y);
            
            // Resolve round on server
            try {
                const resolveRoundFunction = functions.httpsCallable('resolveRound');
                const result = await resolveRoundFunction({
                    sessionId: gameState.sessionId
                });
                
                if (result.data.success) {
                    const roundResult = result.data.result;
                    
                    if (roundResult === 'win') {
                        await handleWin();
                    } else {
                        await handleLoss();
                    }
                } else {
                    showToast('Game error: ' + result.data.error, 'error');
                    resetGame();
                }
            } catch (error) {
                console.error('Resolve round error:', error);
                showToast('Network error. Please try again.', 'error');
                resetGame();
            } finally {
                showLoading(false);
            }
        }

        async function handleWin() {
            gameState.currentRound++;
            gameState.totalMultiplier *= 2;
            gameState.canDouble = true;
            gameState.canCollect = true;
            
            // Update UI
            updatePhaseIndicator();
            updateOrbState('win');
            updateActionButton('win');
            
            // Show win banner
            showResultBanner('win', gameState.betAmount * (gameState.totalMultiplier / 2));
            
            // Play win sound
            audio.play('win');
            
            // Create win particles
            const orb = document.getElementById('energy-orb');
            const rect = orb.getBoundingClientRect();
            const x = rect.left + rect.width / 2;
            const y = rect.top + rect.height / 2;
            canvasEffects.createParticles('win', x, y);
            
            // Add to records
            addGameRecord('WIN', gameState.betAmount * (gameState.totalMultiplier / 2));
            
            showToast(`You won! Current multiplier: ${gameState.totalMultiplier}x`, 'success');
            
            // Check if max rounds reached
            if (gameState.currentRound > gameState.maxRounds) {
                await autoCashOut();
            }
        }

        async function handleLoss() {
            // Update game state
            gameState.gameActive = false;
            gameState.canDouble = false;
            gameState.canCollect = false;
            
            // Update UI
            updateOrbState('lose');
            updateActionButton('lose');
            
            // Show lose banner
            showResultBanner('lose', gameState.betAmount);
            
            // Play lose sound
            audio.play('lose');
            
            // Create lose particles
            const orb = document.getElementById('energy-orb');
            const rect = orb.getBoundingClientRect();
            const x = rect.left + rect.width / 2;
            const y = rect.top + rect.height / 2;
            canvasEffects.createParticles('lose', x, y);
            
            // Add to records
            addGameRecord('LOSE', -gameState.betAmount);
            
            // Force lose on server
            try {
                const forceLoseFunction = functions.httpsCallable('forceLose');
                await forceLoseFunction({
                    sessionId: gameState.sessionId
                });
                
                // Reload balance
                await loadBalance();
            } catch (error) {
                console.error('Force lose error:', error);
            }
            
            showToast('Better luck next time!', 'error');
        }

        async function continueGame() {
            if (!gameState.canDouble) return;
            
            // Reset for next round
            gameState.canDouble = false;
            gameState.canCollect = false;
            
            // Update UI for next round
            updateOrbState('active');
            updateActionButton('tap');
            
            showToast(`Round ${gameState.currentRound} - Tap to continue!`, 'info');
        }

        async function cashOut() {
            if (!gameState.canCollect) return;
            
            // Show loading
            showLoading(true);
            
            try {
                const cashOutFunction = functions.httpsCallable('cashOut');
                const result = await cashOutFunction({
                    sessionId: gameState.sessionId
                });
                
                if (result.data.success) {
                    const winnings = gameState.betAmount * gameState.totalMultiplier;
                    
                    // Update game state
                    gameState.gameActive = false;
                    gameState.canDouble = false;
                    gameState.canCollect = false;
                    
                    // Update UI
                    updateOrbState('collect');
                    updateActionButton('play-again');
                    
                    // Show win banner
                    showResultBanner('win', winnings);
                    
                    // Play win sound
                    audio.play('win');
                    
                    // Add to records
                    addGameRecord('CASHOUT', winnings);
                    
                    // Add to winners feed
                    addToWinnersFeed(gameState.currentUser.displayName || 'Player', winnings);
                    
                    showToast(`Successfully cashed out $${winnings.toFixed(2)}!`, 'success');
                    
                    // Reload balance
                    await loadBalance();
                } else {
                    showToast('Cash out failed: ' + result.data.error, 'error');
                }
            } catch (error) {
                console.error('Cash out error:', error);
                showToast('Network error during cash out', 'error');
            } finally {
                showLoading(false);
            }
        }

        async function autoCashOut() {
            // Automatic cash out at max rounds
            gameState.canDouble = false;
            gameState.canCollect = true;
            
            // Force cash out
            await cashOut();
            
            showToast('Maximum rounds reached! Auto-cashing out...', 'warning');
        }

        function resetGame() {
            // Reset game state
            gameState.currentRound = 1;
            gameState.totalMultiplier = 2;
            gameState.gameActive = false;
            gameState.countdownActive = false;
            gameState.canDouble = false;
            gameState.canCollect = false;
            gameState.sessionId = null;
            
            // Reset UI
            updatePhaseIndicator();
            updateOrbState('idle');
            updateActionButton('start');
            hideResultBanner();
            
            // Reset orb text
            document.getElementById('orb-text').textContent = 'TAP';
            
            showToast('Game reset. Place your bet!', 'info');
        }

        // ===== UI UPDATE FUNCTIONS =====
        function updatePhaseIndicator() {
            document.getElementById('current-round').textContent = gameState.currentRound;
            document.getElementById('current-multiplier').textContent = `${gameState.totalMultiplier}x`;
        }

        function updateOrbState(state) {
            const orb = document.getElementById('energy-orb');
            const orbText = document.getElementById('orb-text');
            
            orb.classList.remove('win', 'lose', 'collect');
            orbText.classList.remove('win', 'lose', 'collect');
            
            switch(state) {
                case 'idle':
                    orb.style.background = 'radial-gradient(circle at 30% 30%, #00ff9d, #00cc7a)';
                    orbText.textContent = 'TAP';
                    break;
                case 'active':
                    orb.style.background = 'radial-gradient(circle at 30% 30%, #ff9800, #ff6d00)';
                    orbText.textContent = 'TAP NOW';
                    break;
                case 'win':
                    orb.classList.add('win');
                    orbText.classList.add('win');
                    orb.style.background = 'radial-gradient(circle at 30% 30%, #00ff9d, #4caf50)';
                    orbText.textContent = 'WIN!';
                    break;
                case 'lose':
                    orb.classList.add('lose');
                    orbText.classList.add('lose');
                    orb.style.background = 'radial-gradient(circle at 30% 30%, #ff5252, #ff1744)';
                    orbText.textContent = 'LOSE';
                    break;
                case 'collect':
                    orb.classList.add('collect');
                    orbText.classList.add('collect');
                    orb.style.background = 'radial-gradient(circle at 30% 30%, #4caf50, #2e7d32)';
                    orbText.textContent = 'COLLECT';
                    break;
            }
        }

        function updateActionButton(state) {
            const button = document.getElementById('action-button');
            const icon = button.querySelector('i');
            
            // Remove all classes
            button.className = 'action-button';
            button.disabled = false;
            
            switch(state) {
                case 'start':
                    button.classList.add('start');
                    icon.className = 'fas fa-play';
                    button.innerHTML = '<i class="fas fa-play"></i> START GAME';
                    break;
                case 'countdown':
                    button.classList.add('start');
                    button.disabled = true;
                    icon.className = 'fas fa-clock';
                    button.innerHTML = '<i class="fas fa-clock"></i> COUNTDOWN...';
                    break;
                case 'tap':
                    button.classList.add('tap');
                    icon.className = 'fas fa-hand-pointer';
                    button.innerHTML = '<i class="fas fa-hand-pointer"></i> TAP THE ORB';
                    break;
                case 'win':
                    button.classList.add('double');
                    icon.className = 'fas fa-redo';
                    button.innerHTML = '<i class="fas fa-redo"></i> DOUBLE';
                    break;
                case 'lose':
                    button.classList.add('play-again');
                    icon.className = 'fas fa-redo';
                    button.innerHTML = '<i class="fas fa-redo"></i> PLAY AGAIN';
                    break;
            }
        }

        function showResultBanner(type, amount) {
            const banner = document.getElementById('result-banner');
            const resultText = document.getElementById('result-text');
            
            banner.className = `result-banner ${type} show`;
            
            if (type === 'win') {
                resultText.textContent = `🎉 YOU WIN +$${amount.toFixed(2)}`;
            } else {
                resultText.textContent = `❌ YOU LOSE -$${Math.abs(amount).toFixed(2)}`;
            }
            
            // Auto-hide after 5 seconds
            setTimeout(() => {
                banner.classList.remove('show');
            }, 5000);
        }

        function hideResultBanner() {
            const banner = document.getElementById('result-banner');
            banner.classList.remove('show');
        }

        // ===== RECORDS SYSTEM =====
        function addGameRecord(action, amount) {
            const record = {
                action: action,
                amount: amount,
                timestamp: new Date(),
                round: gameState.currentRound,
                multiplier: gameState.totalMultiplier
            };
            
            gameState.gameRecords.unshift(record);
            if (gameState.gameRecords.length > 10) {
                gameState.gameRecords.pop();
            }
            
            updateRecordsDisplay();
            saveRecordToFirebase(record);
        }

        function updateRecordsDisplay() {
            const recordsList = document.getElementById('records-list');
            recordsList.innerHTML = '';
            
            gameState.gameRecords.forEach(record => {
                const recordItem = document.createElement('div');
                recordItem.className = `record-item ${record.action.toLowerCase()}`;
                
                const time = record.timestamp.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                const amountText = record.amount > 0 ? `+$${record.amount.toFixed(2)}` : `-$${Math.abs(record.amount).toFixed(2)}`;
                
                recordItem.innerHTML = `
                    <div class="record-action">
                        ${time} - Round ${record.round}
                    </div>
                    <div class="record-result ${record.action.toLowerCase()}">
                        ${amountText}
                    </div>
                `;
                
                recordsList.appendChild(recordItem);
            });
        }

        async function saveRecordToFirebase(record) {
            try {
                await db.collection("double_or_nothing_records")
                    .doc(gameState.currentUser.uid)
                    .collection("games")
                    .add({
                        userId: gameState.currentUser.uid,
                        action: record.action,
                        amount: record.amount,
                        round: record.round,
                        multiplier: record.multiplier,
                        betAmount: gameState.betAmount,
                        timestamp: new Date()
                    });
            } catch (error) {
                console.error('Error saving record:', error);
            }
        }

        async function loadGameRecords() {
            try {
                const snapshot = await db.collection("double_or_nothing_records")
                    .doc(gameState.currentUser?.uid)
                    .collection("games")
                    .orderBy('timestamp', 'desc')
                    .limit(10)
                    .get();
                
                snapshot.forEach(doc => {
                    const data = doc.data();
                    gameState.gameRecords.push({
                        action: data.action,
                        amount: data.amount,
                        timestamp: data.timestamp.toDate(),
                        round: data.round,
                        multiplier: data.multiplier
                    });
                });
                
                updateRecordsDisplay();
            } catch (error) {
                console.error('Error loading records:', error);
            }
        }

        // ===== WINNERS FEED =====
        function generateWinnersFeed() {
            const winnersTicker = document.getElementById('winners-ticker');
            winnersTicker.innerHTML = '';
            
            // Generate 20 random winners
            for (let i = 0; i < 20; i++) {
                const randomName = nicknamePool[Math.floor(Math.random() * nicknamePool.length)];
                const randomAmount = Math.floor(Math.random() * 500) + 50;
                
                const winnerItem = document.createElement('div');
                winnerItem.className = 'winner-item';
                winnerItem.innerHTML = `
                    <span class="winner-icon">🎉</span>
                    <span class="winner-name">${randomName}</span>
                    won $${randomAmount}
                `;
                
                winnersTicker.appendChild(winnerItem);
            }
            
            // Duplicate for seamless scrolling
            const clone = winnersTicker.cloneNode(true);
            winnersTicker.parentNode.appendChild(clone);
        }

        function addToWinnersFeed(name, amount) {
            const winnersTicker = document.getElementById('winners-ticker');
            
            const winnerItem = document.createElement('div');
            winnerItem.className = 'winner-item';
            winnerItem.innerHTML = `
                <span class="winner-icon">🎉</span>
                <span class="winner-name">${name}</span>
                won $${amount.toFixed(2)}
            `;
            
            winnersTicker.insertBefore(winnerItem, winnersTicker.firstChild);
            
            // Keep only 20 items
            while (winnersTicker.children.length > 20) {
                winnersTicker.removeChild(winnersTicker.lastChild);
            }
        }

        // ===== FULLSCREEN FUNCTIONS =====
        function toggleFullscreen() {
            const container = document.getElementById('game-screen');
            
            if (!document.fullscreenElement) {
                if (container.requestFullscreen) {
                    container.requestFullscreen();
                } else if (container.webkitRequestFullscreen) {
                    container.webkitRequestFullscreen();
                } else if (container.msRequestFullscreen) {
                    container.msRequestFullscreen();
                }
                
                document.getElementById('fullscreen-toggle').innerHTML = '<i class="fas fa-compress"></i>';
                showToast('Entered full screen mode', 'info');
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
                
                document.getElementById('fullscreen-toggle').innerHTML = '<i class="fas fa-expand"></i>';
                showToast('Exited full screen mode', 'info');
            }
        }

        // Handle fullscreen change
        document.addEventListener('fullscreenchange', handleFullscreenChange);
        document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
        document.addEventListener('msfullscreenchange', handleFullscreenChange);

        function handleFullscreenChange() {
            const toggle = document.getElementById('fullscreen-toggle');
            if (!document.fullscreenElement) {
                toggle.innerHTML = '<i class="fas fa-expand"></i>';
            }
        }

        // ===== AUDIO FUNCTIONS =====
        function toggleAudioMute() {
            const isMuted = audio.toggleMute();
            const muteToggle = document.getElementById('mute-toggle');
            
            if (isMuted) {
                muteToggle.innerHTML = '<i class="fas fa-volume-mute"></i>';
                showToast('Sound muted', 'info');
            } else {
                muteToggle.innerHTML = '<i class="fas fa-volume-up"></i>';
                showToast('Sound enabled', 'success');
            }
        }

        // ===== UTILITY FUNCTIONS =====
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.add('show');
            }, 10);
            
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => {
                    if (container.contains(toast)) {
                        container.removeChild(toast);
                    }
                }, 300);
            }, 3000);
        }

        function showLoading(show) {
            const overlay = document.getElementById('loading-overlay');
            if (show) {
                overlay.classList.add('show');
            } else {
                overlay.classList.remove('show');
            }
        }

        // ===== INITIALIZATION =====
        document.addEventListener('DOMContentLoaded', () => {
            // Set initial bet
            setBetAmount(5);
            
            // Initialize game
            setTimeout(initGame, 500);
        });

        // ===== SECURITY MEASURES =====
        // Prevent context menu
        document.addEventListener('contextmenu', (e) => e.preventDefault());
        
        // Prevent text selection
        document.addEventListener('selectstart', (e) => e.preventDefault());
        
        // Prevent zoom on mobile
        document.addEventListener('touchstart', (e) => {
            if (e.touches.length > 1) e.preventDefault();
        }, { passive: false });
        
        // Prevent refresh during game
        window.addEventListener('beforeunload', (e) => {
            if (gameState.gameActive) {
                e.preventDefault();
                e.returnValue = 'Game in progress. Are you sure you want to leave?';
            }
        });
    </script>
</body>
</html>
