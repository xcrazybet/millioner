<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Test - Sportmonks</title>
    <style>
        body {
            font-family: monospace;
            background: #0a0f1a;
            color: #00ff9d;
            padding: 20px;
        }
        .test-result {
            background: #1a2332;
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
            overflow-x: auto;
        }
        .success { color: #00ff9d; }
        .error { color: #ff4444; }
        button {
            background: #00ff9d;
            color: #000;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
        }
    </style>
</head>
<body>
    <h1>🔧 Sportmonks API Connection Test</h1>
    <p>Testing your API token: <strong>DkFdWG9jFZvH8XSEgLrRfGwczABWVg5rlV25GvIRyN06zdPsOI48Nsv9Wooy</strong></p>
    
    <div>
        <button onclick="testLiveScores()">Test Live Scores</button>
        <button onclick="testUpcoming()">Test Upcoming Matches</button>
        <button onclick="testFinished()">Test Finished Matches</button>
        <button onclick="testLeagues()">Test Leagues</button>
    </div>
    
    <div id="results">
        <div class="test-result">Click a button to test API...</div>
    </div>

    <script>
        const API_TOKEN = "DkFdWG9jFZvH8XSEgLrRfGwczABWVg5rlV25GvIRyN06zdPsOI48Nsv9Wooy";
        const BASE_URL = "https://api.sportmonks.com/v3/football";
        
        async function testLiveScores() {
            showResult("Testing Live Scores API...", "loading");
            try {
                const url = `${BASE_URL}/livescores?api_token=${API_TOKEN}&include=scores;participants`;
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.data && data.data.length > 0) {
                    showResult(`✅ SUCCESS! Found ${data.data.length} live matches\n\n${JSON.stringify(data.data, null, 2)}`, "success");
                } else {
                    showResult(`⚠️ API responded but no live matches currently\n\n${JSON.stringify(data, null, 2)}`, "error");
                }
            } catch (error) {
                showResult(`❌ ERROR: ${error.message}`, "error");
            }
        }
        
        async function testUpcoming() {
            showResult("Testing Upcoming Matches API...", "loading");
            try {
                const url = `${BASE_URL}/fixtures?api_token=${API_TOKEN}&include=participants&filter=upcoming&per_page=10`;
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.data && data.data.length > 0) {
                    showResult(`✅ SUCCESS! Found ${data.data.length} upcoming matches\n\nFirst match: ${data.data[0].participants?.[0]?.name} vs ${data.data[0].participants?.[1]?.name}\n\nFull response:\n${JSON.stringify(data.data, null, 2)}`, "success");
                } else {
                    showResult(`⚠️ API responded but no upcoming matches\n\n${JSON.stringify(data, null, 2)}`, "error");
                }
            } catch (error) {
                showResult(`❌ ERROR: ${error.message}`, "error");
            }
        }
        
        async function testFinished() {
            showResult("Testing Finished Matches API...", "loading");
            try {
                const url = `${BASE_URL}/fixtures?api_token=${API_TOKEN}&include=participants;scores&filter=finished&per_page=5`;
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.data && data.data.length > 0) {
                    showResult(`✅ SUCCESS! Found ${data.data.length} finished matches\n\nLast match: ${data.data[0].participants?.[0]?.name} vs ${data.data[0].participants?.[1]?.name}\nScore: ${data.data[0].scores?.[0]?.score || 'N/A'}\n\nFull response:\n${JSON.stringify(data.data, null, 2)}`, "success");
                } else {
                    showResult(`⚠️ API responded but no finished matches\n\n${JSON.stringify(data, null, 2)}`, "error");
                }
            } catch (error) {
                showResult(`❌ ERROR: ${error.message}`, "error");
            }
        }
        
        async function testLeagues() {
            showResult("Testing Leagues API...", "loading");
            try {
                const url = `${BASE_URL}/leagues?api_token=${API_TOKEN}&per_page=10`;
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.data && data.data.length > 0) {
                    let leagues = data.data.map(l => l.name).join(", ");
                    showResult(`✅ SUCCESS! Found leagues: ${leagues}\n\nFull response:\n${JSON.stringify(data.data, null, 2)}`, "success");
                } else {
                    showResult(`⚠️ API responded but no leagues\n\n${JSON.stringify(data, null, 2)}`, "error");
                }
            } catch (error) {
                showResult(`❌ ERROR: ${error.message}`, "error");
            }
        }
        
        function showResult(message, type) {
            const resultsDiv = document.getElementById('results');
            const color = type === 'success' ? '#00ff9d' : (type === 'error' ? '#ff4444' : '#ff9800');
            resultsDiv.innerHTML = `<div class="test-result" style="border-left: 4px solid ${color}"><pre>${message}</pre></div>`;
        }
    </script>
</body>
</html>
