<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Forex & Gold Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: white; }
        .price-up { color: #22c55e; animation: flash-green 0.5s; }
        .price-down { color: #ef4444; animation: flash-red 0.5s; }
        @keyframes flash-green { from { background: rgba(34, 197, 94, 0.2); } to { background: transparent; } }
        @keyframes flash-red { from { background: rgba(239, 68, 68, 0.2); } to { background: transparent; } }
    </style>
</head>
<body class="p-8">

    <div class="max-w-4xl mx-auto">
        <header class="mb-10 text-center">
            <h1 class="text-4xl font-bold mb-2">Real-Time Market Data</h1>
            <p class="text-slate-400">Live Bid/Ask prices for EURUSD and Gold</p>
            <div id="status" class="mt-4 text-sm font-mono text-yellow-500 underline">Connecting to stream...</div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-slate-800 rounded-xl p-6 border border-slate-700 shadow-xl">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-2xl font-bold">EUR / USD</h2>
                    <span class="text-xs bg-blue-500 px-2 py-1 rounded">FOREX</span>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div class="text-center">
                        <p class="text-slate-400 text-sm uppercase">Sell (Bid)</p>
                        <div id="eur-bid" class="text-3xl font-mono font-bold">0.00000</div>
                    </div>
                    <div class="text-center">
                        <p class="text-slate-400 text-sm uppercase">Buy (Ask)</p>
                        <div id="eur-ask" class="text-3xl font-mono font-bold">0.00000</div>
                    </div>
                </div>
            </div>

            <div class="bg-slate-800 rounded-xl p-6 border border-slate-700 shadow-xl">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-2xl font-bold text-yellow-500">XAU / USD</h2>
                    <span class="text-xs bg-yellow-600 px-2 py-1 rounded text-white">METAL</span>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div class="text-center">
                        <p class="text-slate-400 text-sm uppercase">Sell (Bid)</p>
                        <div id="xau-bid" class="text-3xl font-mono font-bold">0.00</div>
                    </div>
                    <div class="text-center">
                        <p class="text-slate-400 text-sm uppercase">Buy (Ask)</p>
                        <div id="xau-ask" class="text-3xl font-mono font-bold">0.00</div>
                    </div>
                </div>
            </div>
        </div>

        <footer class="mt-10 text-center text-slate-500 text-xs">
            <p>Data provided via WebSocket • Updates are real-time</p>
        </footer>
    </div>

    <script>
        // Replace 'sandbox_c8...' with your actual Finnhub API Key
        const socket = new WebSocket('wss://ws.finnhub.io?token=sandbox_c8m2fdaad3i96mt0584g');

        const eurBid = document.getElementById('eur-bid');
        const eurAsk = document.getElementById('eur-ask');
        const xauBid = document.getElementById('xau-bid');
        const xauAsk = document.getElementById('xau-ask');
        const status = document.getElementById('status');

        let lastPrices = { 'IC MARKETS:1': 0, 'OANDA:XAU_USD': 0 };

        socket.addEventListener('open', function (event) {
            status.innerText = "● Live Connection Active";
            status.classList.remove('text-yellow-500');
            status.classList.add('text-green-500');
            
            // Subscribe to EUR/USD and Gold
            socket.send(JSON.stringify({'type':'subscribe', 'symbol':'IC MARKETS:1'})); // Example EURUSD feed
            socket.send(JSON.stringify({'type':'subscribe', 'symbol':'OANDA:XAU_USD'}));
        });

        socket.addEventListener('message', function (event) {
            const data = JSON.parse(event.data);
            if (data.type === 'update') {
                data.data.forEach(tick => {
                    updateUI(tick.s, tick.p);
                });
            }
        });

        function updateUI(symbol, price) {
            let bidEl, askEl, decimals;
            
            if (symbol === 'IC MARKETS:1') {
                bidEl = eurBid; askEl = eurAsk; decimals = 5;
            } else if (symbol === 'OANDA:XAU_USD') {
                bidEl = xauBid; askEl = xauAsk; decimals = 2;
            }

            if (bidEl) {
                const oldPrice = lastPrices[symbol];
                const formattedPrice = price.toFixed(decimals);
                
                // Simulating a spread (Bid/Ask) for demo purposes
                // Real APIs provide both; here we subtract/add 0.01%
                const spread = price * 0.0001;
                bidEl.innerText = (price - spread).toFixed(decimals);
                askEl.innerText = (price + spread).toFixed(decimals);

                // Add color feedback
                if (price > oldPrice) {
                    bidEl.className = "text-3xl font-mono font-bold price-up";
                    askEl.className = "text-3xl font-mono font-bold price-up";
                } else if (price < oldPrice) {
                    bidEl.className = "text-3xl font-mono font-bold price-down";
                    askEl.className = "text-3xl font-mono font-bold price-down";
                }
                
                lastPrices[symbol] = price;
            }
        }

        socket.addEventListener('close', () => {
            status.innerText = "○ Connection Lost. Refreshing...";
            status.classList.add('text-red-500');
        });
    </script>
</body>
</html>
