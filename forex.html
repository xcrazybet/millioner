<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Multi-Asset Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Inter:wght@400;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #05070a; color: #94a3b8; overflow: hidden; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .price-up { color: #22c55e; background: rgba(34, 197, 94, 0.15); transition: all 0.3s; }
        .price-down { color: #ef4444; background: rgba(239, 68, 68, 0.15); transition: all 0.3s; }
        .table-wrap { height: calc(100vh - 160px); overflow-y: auto; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
        tr { border-bottom: 1px solid #0f172a; }
        tr:hover { background: #0f172a; }
        .tag { font-size: 9px; padding: 2px 5px; border-radius: 3px; font-weight: 900; }
    </style>
</head>
<body class="p-4">

    <div class="max-w-[1400px] mx-auto">
        <div class="flex flex-col md:flex-row justify-between items-center mb-6 border-b border-slate-800 pb-4">
            <div>
                <h1 class="text-2xl font-black text-white tracking-tighter uppercase">Omni<span class="text-blue-500">Terminal</span>.v2</h1>
                <p class="text-[10px] font-bold text-slate-500 tracking-[0.2em] uppercase">100+ Asset Global Liquidity Stream</p>
            </div>
            <div class="flex items-center gap-6 mt-4 md:mt-0">
                <div class="text-right">
                    <p class="text-[10px] uppercase text-slate-500 font-bold">Network Status</p>
                    <div class="flex items-center gap-2 justify-end">
                        <span id="status-text" class="text-xs text-green-500 font-bold uppercase">Streaming Live</span>
                        <div class="w-2 h-2 rounded-full bg-green-500 shadow-[0_0_8px_#22c55e]"></div>
                    </div>
                </div>
                <div class="text-right border-l border-slate-800 pl-6">
                    <p class="text-[10px] uppercase text-slate-500 font-bold">Data Rate</p>
                    <p class="text-xs text-blue-400 font-bold mono"><span id="tps">0</span> TPS</p>
                </div>
            </div>
        </div>

        <div class="flex gap-2 mb-4 overflow-x-auto pb-2">
            <button onclick="filter('ALL')" class="bg-slate-800 text-white text-[10px] px-4 py-1 rounded font-bold uppercase hover:bg-blue-600 transition">All Assets</button>
            <button onclick="filter('FOREX')" class="bg-slate-900 text-slate-400 text-[10px] px-4 py-1 rounded font-bold uppercase hover:bg-slate-700">Forex</button>
            <button onclick="filter('STOCKS')" class="bg-slate-900 text-slate-400 text-[10px] px-4 py-1 rounded font-bold uppercase hover:bg-slate-700">Stocks</button>
            <button onclick="filter('COMMODITY')" class="bg-slate-900 text-slate-400 text-[10px] px-4 py-1 rounded font-bold uppercase hover:bg-slate-700">Commodities</button>
            <button onclick="filter('BONDS')" class="bg-slate-900 text-slate-400 text-[10px] px-4 py-1 rounded font-bold uppercase hover:bg-slate-700">Bonds</button>
        </div>

        <div class="bg-[#080a0f] border border-slate-800 rounded-xl overflow-hidden shadow-2xl">
            <table class="w-full text-left">
                <thead class="bg-[#0f172a] text-slate-400 text-[9px] uppercase tracking-widest border-b border-slate-800">
                    <tr>
                        <th class="p-4">Symbol</th>
                        <th class="p-4">Asset Class</th>
                        <th class="p-4">Sell (Bid)</th>
                        <th class="p-4">Buy (Ask)</th>
                        <th class="p-4">24H Change</th>
                        <th class="p-4 text-right">Last Sync</th>
                    </tr>
                </thead>
            </table>
            <div class="table-wrap">
                <table class="w-full text-left border-collapse">
                    <tbody id="terminal-body" class="mono text-slate-200">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const symbols = [];
        const classes = {
            'FOREX': 'bg-blue-900/40 text-blue-400 border border-blue-800',
            'COMMODITY': 'bg-yellow-900/40 text-yellow-500 border border-yellow-800',
            'STOCKS': 'bg-purple-900/40 text-purple-400 border border-purple-800',
            'BONDS': 'bg-teal-900/40 text-teal-400 border border-teal-800'
        };

        // 1. Logic to populate 100 real-world assets
        function initData() {
            const fx = ['EUR/USD', 'GBP/USD', 'USD/JPY', 'AUD/USD', 'USD/CAD', 'USD/CHF', 'EUR/GBP', 'EUR/JPY', 'GBP/JPY', 'NZD/USD'];
            const cmd = ['XAU/USD (Gold)', 'XAG/USD (Silver)', 'WTI Crude', 'Brent Oil', 'Nat Gas', 'Copper', 'Platinum', 'Palladium'];
            const stk = ['AAPL', 'TSLA', 'NVDA', 'MSFT', 'AMZN', 'GOOGL', 'META', 'AMD', 'NFLX', 'BABA', 'V', 'JPM', 'GS', 'DIS'];
            const bnd = ['US 10Y Yield', 'US 2Y Yield', 'UK 10Y Gilt', 'Bund 10Y', 'JGB 10Y'];

            for(let i=1; i<=110; i++) {
                let name, type, price, dec;
                if(i <= 30) { name = fx[i%10] || `FX_${i}`; type = 'FOREX'; price = 1 + Math.random(); dec = 5; }
                else if(i <= 55) { name = cmd[i%8] || `CMD_${i}`; type = 'COMMODITY'; price = 20 + Math.random()*2300; dec = 2; }
                else if(i <= 95) { name = stk[i%14] || `EQTY_${i}`; type = 'STOCKS'; price = 100 + Math.random()*600; dec = 2; }
                else { name = bnd[i%5] || `BOND_${i}`; type = 'BONDS'; price = 3 + Math.random()*4; dec = 3; }

                symbols.push({ id: i, name, type, price, dec, last: price, chg: (Math.random() * 4 - 2).toFixed(2) });
            }
        }

        // 2. Build the UI rows
        function renderTerminal() {
            const body = document.getElementById('terminal-body');
            body.innerHTML = symbols.map(s => `
                <tr id="row-${s.id}" data-type="${s.type}">
                    <td class="p-4 font-black text-white text-xs w-[20%]">${s.name}</td>
                    <td class="p-4 w-[15%]"><span class="tag ${classes[s.type]}">${s.type}</span></td>
                    <td id="bid-${s.id}" class="p-4 w-[15%] text-xs">0.0000</td>
                    <td id="ask-${s.id}" class="p-4 w-[15%] text-xs">0.0000</td>
                    <td id="chg-${s.id}" class="p-4 w-[15%] text-xs font-bold ${s.chg >= 0 ? 'text-green-500' : 'text-red-500'}">${s.chg}%</td>
                    <td id="time-${s.id}" class="p-4 text-right text-[9px] text-slate-600">--:--:--</td>
                </tr>
            `).join('');
        }

        // 3. High-Frequency Engine (250ms Ticks)
        let totalUpdates = 0;
        function streamData() {
            symbols.forEach(s => {
                // Volatility Logic
                const volatility = s.type === 'FOREX' ? 0.0001 : 0.0015;
                const change = s.price * (Math.random() - 0.5) * volatility;
                const newPrice = s.price + change;
                const spread = s.price * 0.0002;

                const bidEl = document.getElementById(`bid-${s.id}`);
                const askEl = document.getElementById(`ask-${s.id}`);
                
                // Visual Flash
                if (newPrice > s.last) {
                    bidEl.className = "p-4 text-xs price-up";
                    askEl.className = "p-4 text-xs price-up";
                } else if (newPrice < s.last) {
                    bidEl.className = "p-4 text-xs price-down";
                    askEl.className = "p-4 text-xs price-down";
                }

                bidEl.innerText = (newPrice - (spread/2)).toFixed(s.dec);
                askEl.innerText = (newPrice + (spread/2)).toFixed(s.dec);
                document.getElementById(`time-${s.id}`).innerText = new Date().toLocaleTimeString('en-GB');

                s.last = newPrice;
                s.price = newPrice;
                totalUpdates++;
            });
        }

        // Filtering Logic
        function filter(type) {
            const rows = document.querySelectorAll('tr[data-type]');
            rows.forEach(row => {
                if(type === 'ALL' || row.getAttribute('data-type') === type) {
                    row.style.display = 'table-row';
                } else {
                    row.style.display = 'none';
                }
            });
        }

        // Execution
        initData();
        renderTerminal();
        setInterval(streamData, 250); // 4 Updates per second per asset
        
        // Stats Counter
        setInterval(() => {
            document.getElementById('tps').innerText = totalUpdates.toLocaleString();
            totalUpdates = 0;
        }, 1000);

    </script>
</body>
</html>
