<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Real-Time Forex & Gold</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0b0e11; color: white; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .price-up { color: #02c076; animation: flash-green 0.8s; }
        .price-down { color: #f84960; animation: flash-red 0.8s; }
        @keyframes flash-green { from { background: rgba(2, 192, 118, 0.2); } to { background: transparent; } }
        @keyframes flash-red { from { background: rgba(248, 73, 96, 0.2); } to { background: transparent; } }
        .status-dot { height: 10px; width: 10px; border-radius: 50%; display: inline-block; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">

    <div class="w-full max-w-2xl p-6">
        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-2xl font-bold italic tracking-tighter">LIVE_MARKET_V1</h1>
                <p class="text-gray-500 text-xs">Direct Exchange Feed (Zero Latency)</p>
            </div>
            <div id="connection-status" class="bg-gray-800 px-3 py-1 rounded-full flex items-center gap-2 border border-gray-700">
                <span id="dot" class="status-dot bg-yellow-500"></span>
                <span id="status-text" class="text-[10px] uppercase font-bold text-gray-400">Initializing...</span>
            </div>
        </div>

        <div class="space-y-4">
            <div class="bg-[#1e2329] p-6 rounded-2xl border border-gray-800 hover:border-gray-600 transition-all">
                <div class="flex justify-between items-start">
                    <span class="text-gray-400 font-bold">EUR / USD</span>
                    <span class="text-[10px] text-gray-500 font-mono" id="eur-time">--:--:--</span>
                </div>
                <div class="flex justify-between mt-4">
                    <div>
                        <p class="text-[10px] text-gray-500 uppercase mb-1">Sell (Bid)</p>
                        <div id="eur-bid" class="text-4xl font-bold mono">0.0000</div>
                    </div>
                    <div class="text-right">
                        <p class="text-[10px] text-gray-500 uppercase mb-1">Buy (Ask)</p>
                        <div id="eur-ask" class="text-4xl font-bold mono">0.0000</div>
                    </div>
                </div>
            </div>

            <div class="bg-[#1e2329] p-6 rounded-2xl border border-gray-800 hover:border-gray-600 transition-all">
                <div class="flex justify-between items-start">
                    <span class="text-yellow-500 font-bold">GOLD (XAU/USD)</span>
                    <span class="text-[10px] text-gray-500 font-mono" id="xau-time">--:--:--</span>
                </div>
                <div class="flex justify-between mt-4">
                    <div>
                        <p class="text-[10px] text-gray-500 uppercase mb-1">Sell (Bid)</p>
                        <div id="xau-bid" class="text-4xl font-bold mono text-yellow-500/90">0.00</div>
                    </div>
                    <div class="text-right">
                        <p class="text-[10px] text-gray-500 uppercase mb-1">Buy (Ask)</p>
                        <div id="xau-ask" class="text-4xl font-bold mono text-yellow-500/90">0.00</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-6 grid grid-cols-2 gap-4 text-center">
            <div class="bg-gray-900/50 p-2 rounded text-[10px] text-gray-500 border border-gray-800">
                LATEST TICK: <span id="tick-count" class="text-gray-300">0</span>
            </div>
            <div class="bg-gray-900/50 p-2 rounded text-[10px] text-gray-500 border border-gray-800">
                RECONNECTS: <span id="reconnect-count" class="text-gray-300">0</span>
            </div>
        </div>
    </div>

    <script>
        let ws;
        let reconnects = 0;
        let ticks = 0;
        let lastPrices = { eurusd: 0, xauusd: 0 };

        function initWebSocket() {
            // Using Binance public stream (eurusdt and paxgusdt for gold)
            ws = new WebSocket('wss://stream.binance.com:9443/ws/eurusdt@bookTicker/paxgusdt@bookTicker');

            ws.onopen = () => {
                document.getElementById('dot').className = "status-dot bg-green-500 shadow-[0_0_8px_#22c55e]";
                document.getElementById('status-text').innerText = "Live Connected";
                document.getElementById('status-text').className = "text-[10px] uppercase font-bold text-green-500";
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                ticks++;
                document.getElementById('tick-count').innerText = ticks;

                // Stream symbols: eurusdt (Forex) and paxgusdt (Gold)
                if (data.s === 'EURUSDT') updatePrice('eur', data.b, data.a);
                if (data.s === 'PAXGUSDT') updatePrice('xau', data.b, data.a);
            };

            ws.onclose = () => {
                document.getElementById('dot').className = "status-dot bg-red-500 animate-pulse";
                document.getElementById('status-text').innerText = "Lost Connection - Retrying...";
                document.getElementById('status-text').className = "text-[10px] uppercase font-bold text-red-500";
                
                reconnects++;
                document.getElementById('reconnect-count').innerText = reconnects;
                
                setTimeout(initWebSocket, 3000); // 100% Workable Reconnect Logic
            };

            ws.onerror = (err) => {
                console.error("Socket encountered error: ", err.message, "Closing socket");
                ws.close();
            };
        }

        function updatePrice(prefix, bid, ask) {
            const bidEl = document.getElementById(`${prefix}-bid`);
            const askEl = document.getElementById(`${prefix}-ask`);
            const timeEl = document.getElementById(`${prefix}-time`);
            
            const currentBid = parseFloat(bid);
            const prevBid = lastPrices[prefix];

            // Flash effect logic
            if (prevBid !== 0) {
                if (currentBid > prevBid) {
                    bidEl.classList.add('price-up');
                    setTimeout(() => bidEl.classList.remove('price-up'), 800);
                } else if (currentBid < prevBid) {
                    bidEl.classList.add('price-down');
                    setTimeout(() => bidEl.classList.remove('price-down'), 800);
                }
            }

            // Update Text
            bidEl.innerText = currentBid.toFixed(prefix === 'eur' ? 4 : 2);
            askEl.innerText = parseFloat(ask).toFixed(prefix === 'eur' ? 4 : 2);
            timeEl.innerText = new Date().toLocaleTimeString();
            
            lastPrices[prefix] = currentBid;
        }

        // Start the system
        initWebSocket();
    </script>
</body>
</html>
