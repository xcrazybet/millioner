<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>📈 XCrazyBet - Live Stock Trading</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --primary: #00ff9d;
            --primary-dark: #00cc7a;
            --secondary: #ff9800;
            --secondary-dark: #cc7a00;
            --danger: #ff5252;
            --success: #4caf50;
            --warning: #ffc107;
            --bg: #0a0f1a;
            --surface: #111827;
            --surface-light: #1a2332;
            --text: #ffffff;
            --text-dim: #a0a8c9;
            --dark-bg: #000000;
            --stock-up: #00ff9d;
            --stock-down: #ff5252;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Segoe UI', 'Roboto', system-ui, -apple-system, sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Background Effects */
        .bg-effects {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: 
                radial-gradient(circle at 20% 30%, rgba(0, 255, 157, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(255, 152, 0, 0.08) 0%, transparent 50%),
                linear-gradient(135deg, var(--dark-bg) 0%, var(--bg) 100%);
        }

        /* Header */
        .header {
            background: rgba(17, 24, 39, 0.95);
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .home-btn {
            width: 36px;
            height: 36px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #000;
            font-size: 18px;
            transition: all 0.3s;
        }

        .home-btn:hover {
            background: var(--primary-dark);
            transform: scale(1.1);
        }

        .logo {
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--primary);
        }

        .balance-display {
            background: linear-gradient(45deg, #1a2332, #0f172a);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--primary);
            color: var(--primary);
            font-weight: 700;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 140px;
            justify-content: center;
        }

        /* Tabs Navigation */
        .tabs-nav {
            display: flex;
            background: rgba(17, 24, 39, 0.95);
            border-bottom: 1px solid rgba(0, 255, 157, 0.2);
            padding: 0 15px;
            overflow-x: auto;
            white-space: nowrap;
        }

        .tab {
            padding: 15px 20px;
            background: transparent;
            border: none;
            color: var(--text-dim);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            border-bottom: 3px solid transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tab:hover {
            color: var(--text);
        }

        .tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        /* Main Container */
        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 15px;
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 15px;
            min-height: calc(100vh - 180px);
        }

        @media (max-width: 1024px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }

        /* Left Panel - Market Data */
        .market-panel {
            background: rgba(17, 24, 39, 0.95);
            border-radius: 20px;
            border: 2px solid rgba(0, 255, 157, 0.2);
            padding: 20px;
            backdrop-filter: blur(10px);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .panel-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .search-box {
            display: flex;
            background: rgba(10, 15, 26, 0.8);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(0, 255, 157, 0.3);
        }

        .search-input {
            background: transparent;
            border: none;
            padding: 10px 15px;
            color: var(--text);
            width: 200px;
        }

        .search-input:focus {
            outline: none;
        }

        /* Asset List */
        .asset-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 500px;
            overflow-y: auto;
        }

        .asset-item {
            display: flex;
            align-items: center;
            padding: 15px;
            background: rgba(10, 15, 26, 0.5);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid transparent;
        }

        .asset-item:hover {
            background: rgba(0, 255, 157, 0.1);
            border-color: var(--primary);
        }

        .asset-item.active {
            background: rgba(0, 255, 157, 0.15);
            border-color: var(--primary);
        }

        .asset-icon {
            width: 40px;
            height: 40px;
            background: rgba(0, 255, 157, 0.1);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            font-size: 18px;
        }

        .asset-info {
            flex: 1;
        }

        .asset-symbol {
            font-weight: 700;
            font-size: 16px;
        }

        .asset-name {
            font-size: 12px;
            color: var(--text-dim);
        }

        .asset-price {
            text-align: right;
        }

        .current-price {
            font-weight: 700;
            font-size: 16px;
        }

        .price-change {
            font-size: 12px;
        }

        .price-change.positive {
            color: var(--stock-up);
        }

        .price-change.negative {
            color: var(--stock-down);
        }

        /* Chart Container */
        .chart-container {
            background: rgba(17, 24, 39, 0.95);
            border-radius: 20px;
            border: 2px solid rgba(255, 152, 0, 0.2);
            padding: 20px;
            margin-top: 20px;
            backdrop-filter: blur(10px);
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .chart-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--secondary);
        }

        .chart-timeframe {
            display: flex;
            gap: 5px;
            background: rgba(10, 15, 26, 0.8);
            padding: 5px;
            border-radius: 8px;
        }

        .timeframe-btn {
            padding: 8px 12px;
            background: transparent;
            border: none;
            color: var(--text-dim);
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }

        .timeframe-btn.active {
            background: rgba(255, 152, 0, 0.2);
            color: var(--secondary);
        }

        .chart-wrapper {
            height: 300px;
            position: relative;
        }

        /* Right Panel - Trading Interface */
        .trading-panel {
            background: rgba(17, 24, 39, 0.95);
            border-radius: 20px;
            border: 2px solid rgba(0, 255, 157, 0.2);
            padding: 20px;
            backdrop-filter: blur(10px);
        }

        .current-asset {
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 20px;
        }

        .current-symbol {
            font-size: 32px;
            font-weight: 700;
            color: var(--primary);
        }

        .current-name {
            color: var(--text-dim);
            font-size: 14px;
            margin-top: 5px;
        }

        .current-price-large {
            font-size: 48px;
            font-weight: 700;
            margin: 10px 0;
        }

        .price-change-large {
            font-size: 20px;
            font-weight: 600;
        }

        /* Trade Form */
        .trade-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-label {
            color: var(--text-dim);
            font-size: 14px;
            font-weight: 600;
        }

        .form-input {
            background: rgba(10, 15, 26, 0.8);
            border: 2px solid rgba(0, 255, 157, 0.3);
            border-radius: 10px;
            padding: 15px;
            color: var(--text);
            font-size: 16px;
            font-weight: 600;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--secondary);
        }

        .trade-type-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 10px 0;
        }

        .trade-type-btn {
            padding: 15px;
            border: 2px solid transparent;
            border-radius: 10px;
            background: rgba(10, 15, 26, 0.8);
            color: var(--text);
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .trade-type-btn:hover {
            transform: translateY(-2px);
        }

        .trade-type-btn.buy {
            border-color: var(--success);
        }

        .trade-type-btn.buy.active {
            background: rgba(76, 175, 80, 0.2);
            color: var(--success);
        }

        .trade-type-btn.sell {
            border-color: var(--danger);
        }

        .trade-type-btn.sell.active {
            background: rgba(255, 82, 82, 0.2);
            color: var(--danger);
        }

        .amount-selector {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin: 10px 0;
        }

        .amount-btn {
            padding: 10px;
            background: rgba(10, 15, 26, 0.8);
            border: 1px solid rgba(0, 255, 157, 0.3);
            border-radius: 8px;
            color: var(--primary);
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
        }

        .amount-btn:hover {
            background: rgba(0, 255, 157, 0.1);
        }

        /* Order Summary */
        .order-summary {
            background: rgba(10, 15, 26, 0.5);
            border-radius: 12px;
            padding: 15px;
            margin: 20px 0;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .summary-row:last-child {
            border-bottom: none;
            font-weight: 700;
            color: var(--primary);
            font-size: 18px;
        }

        .summary-label {
            color: var(--text-dim);
        }

        .summary-value {
            color: var(--text);
            font-weight: 600;
        }

        /* Action Buttons */
        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            padding: 16px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #000;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 255, 157, 0.3);
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--danger), #ff1e1e);
            color: #fff;
        }

        .btn-danger:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 82, 82, 0.3);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Portfolio Section */
        .portfolio-panel {
            background: rgba(17, 24, 39, 0.95);
            border-radius: 20px;
            border: 2px solid rgba(255, 152, 0, 0.2);
            padding: 20px;
            margin-top: 20px;
            backdrop-filter: blur(10px);
        }

        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .portfolio-item {
            background: rgba(10, 15, 26, 0.5);
            border-radius: 12px;
            padding: 15px;
            border: 1px solid rgba(0, 255, 157, 0.2);
        }

        .portfolio-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .portfolio-symbol {
            font-weight: 700;
            color: var(--primary);
        }

        .portfolio-price {
            font-weight: 600;
        }

        .portfolio-details {
            font-size: 12px;
            color: var(--text-dim);
        }

        .portfolio-profit {
            font-weight: 700;
            margin-top: 10px;
        }

        .profit-positive {
            color: var(--stock-up);
        }

        .profit-negative {
            color: var(--stock-down);
        }

        /* Toast Notifications */
        .toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 300px;
        }

        .toast {
            padding: 15px 20px;
            background: rgba(17, 24, 39, 0.95);
            border-radius: 10px;
            border-left: 4px solid var(--primary);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
            transform: translateX(100%);
            opacity: 0;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
        }

        .toast.show {
            transform: translateX(0);
            opacity: 1;
        }

        .toast.success {
            border-color: var(--primary);
        }

        .toast.error {
            border-color: var(--danger);
        }

        .toast.warning {
            border-color: var(--warning);
        }

        /* Bottom Navigation */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            background: rgba(17, 24, 39, 0.95);
            padding: 12px 15px;
            border-top: 1px solid rgba(0, 255, 157, 0.2);
            backdrop-filter: blur(10px);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--text-dim);
            font-size: 11px;
            gap: 4px;
            transition: all 0.3s;
        }

        .nav-item i {
            font-size: 18px;
        }

        .nav-item.active {
            color: var(--primary);
        }

        .nav-item:hover {
            color: var(--secondary);
        }

        /* Animations */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* Loading Spinner */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .main-container {
                padding: 10px;
            }
            
            .panel-header {
                flex-direction: column;
                gap: 10px;
            }
            
            .search-box {
                width: 100%;
            }
            
            .search-input {
                width: 100%;
            }
            
            .action-buttons {
                grid-template-columns: 1fr;
            }
            
            .portfolio-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Background Effects -->
    <div class="bg-effects"></div>

    <!-- Header -->
    <header class="header">
        <div class="header-left">
            <a href="https://xcrazybet.github.io/millioner" class="home-btn" title="Return to Home">
                <i class="fas fa-home"></i>
            </a>
            <div class="logo">
                <i class="fas fa-chart-line"></i>
                XCrazyBet Trading
            </div>
        </div>
        <div class="balance-display">
            <i class="fas fa-wallet"></i>
            $<span id="balance-val">0.00</span>
        </div>
    </header>

    <!-- Tabs Navigation -->
    <div class="tabs-nav">
        <button class="tab active" data-tab="stocks">
            <i class="fas fa-chart-bar"></i>
            Stocks
        </button>
        <button class="tab" data-tab="commodities">
            <i class="fas fa-oil-can"></i>
            Commodities
        </button>
        <button class="tab" data-tab="bonds">
            <i class="fas fa-hand-holding-usd"></i>
            Bonds
        </button>
        <button class="tab" data-tab="crypto">
            <i class="fab fa-bitcoin"></i>
            Crypto
        </button>
        <button class="tab" data-tab="portfolio">
            <i class="fas fa-briefcase"></i>
            Portfolio
        </button>
    </div>

    <!-- Main Container -->
    <div class="main-container">
        <!-- Left Panel: Market Data & Charts -->
        <div class="left-panel">
            <!-- Market Panel -->
            <div class="market-panel">
                <div class="panel-header">
                    <div class="panel-title" id="market-title">
                        <i class="fas fa-chart-line"></i>
                        Live Market Data
                    </div>
                    <div class="search-box">
                        <input type="text" class="search-input" id="search-asset" placeholder="Search asset...">
                        <button class="search-btn" id="search-btn">
                            <i class="fas fa-search"></i>
                        </button>
                    </div>
                </div>
                <div class="asset-list" id="asset-list">
                    <!-- Asset items will be loaded here -->
                </div>
            </div>

            <!-- Chart Container -->
            <div class="chart-container">
                <div class="chart-header">
                    <div class="chart-title" id="chart-title">AAPL - Apple Inc.</div>
                    <div class="chart-timeframe">
                        <button class="timeframe-btn active" data-timeframe="1D">1D</button>
                        <button class="timeframe-btn" data-timeframe="1W">1W</button>
                        <button class="timeframe-btn" data-timeframe="1M">1M</button>
                        <button class="timeframe-btn" data-timeframe="3M">3M</button>
                        <button class="timeframe-btn" data-timeframe="1Y">1Y</button>
                    </div>
                </div>
                <div class="chart-wrapper">
                    <canvas id="price-chart"></canvas>
                </div>
            </div>

            <!-- Portfolio Panel -->
            <div class="portfolio-panel" id="portfolio-section" style="display: none;">
                <div class="panel-header">
                    <div class="panel-title">
                        <i class="fas fa-briefcase"></i>
                        Your Portfolio
                    </div>
                </div>
                <div class="portfolio-grid" id="portfolio-grid">
                    <!-- Portfolio items will be loaded here -->
                </div>
            </div>
        </div>

        <!-- Right Panel: Trading Interface -->
        <div class="right-panel">
            <div class="trading-panel">
                <div class="current-asset">
                    <div class="current-symbol" id="current-symbol">AAPL</div>
                    <div class="current-name" id="current-name">Apple Inc.</div>
                    <div class="current-price-large" id="current-price-large">$175.00</div>
                    <div class="price-change-large positive" id="price-change-large">+2.15 (+1.24%)</div>
                </div>

                <!-- Trade Form -->
                <form class="trade-form" id="trade-form">
                    <div class="form-group">
                        <label class="form-label">Trade Type</label>
                        <div class="trade-type-selector">
                            <button type="button" class="trade-type-btn buy active" id="buy-btn">
                                <i class="fas fa-arrow-up"></i> BUY
                            </button>
                            <button type="button" class="trade-type-btn sell" id="sell-btn">
                                <i class="fas fa-arrow-down"></i> SELL
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Amount (USD)</label>
                        <input type="number" class="form-input" id="trade-amount" value="100" min="10" step="10">
                        <div class="amount-selector">
                            <button type="button" class="amount-btn" data-amount="100">$100</button>
                            <button type="button" class="amount-btn" data-amount="500">$500</button>
                            <button type="button" class="amount-btn" data-amount="1000">$1,000</button>
                            <button type="button" class="amount-btn" data-amount="5000">$5,000</button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Quantity</label>
                        <input type="number" class="form-input" id="trade-quantity" value="1" min="0.01" step="0.01">
                    </div>

                    <!-- Order Summary -->
                    <div class="order-summary">
                        <div class="summary-row">
                            <span class="summary-label">Asset Price:</span>
                            <span class="summary-value" id="summary-price">$175.00</span>
                        </div>
                        <div class="summary-row">
                            <span class="summary-label">Quantity:</span>
                            <span class="summary-value" id="summary-quantity">0.5714</span>
                        </div>
                        <div class="summary-row">
                            <span class="summary-label">Commission:</span>
                            <span class="summary-value" id="summary-commission">$1.00</span>
                        </div>
                        <div class="summary-row">
                            <span class="summary-label">Total Cost:</span>
                            <span class="summary-value" id="summary-total">$101.00</span>
                        </div>
                    </div>

                    const volatility = asset.price * tradingState.volatilityFactor * (Math.random() - 0.5);
                    const hiddenEdge = asset.price * tradingState.hiddenEdge * (Math.random() - 0.5);
                    
                    const newPrice = asset.price + volatility + hiddenEdge;
                    const oldPrice = asset.price;
                    
                    asset.price = Math.max(newPrice, 0.01); // Prevent negative prices
                    asset.change = asset.price - oldPrice;
                    asset.changePercent = (asset.change / oldPrice) * 100;
                });
            });

            if (tradingState.selectedAsset) {
                updateAssetDisplay(tradingState.selectedAsset);

        async function placeOrder() {
            const amount = parseFloat(document.getElementById('trade-amount').value) || 0;
            const asset = tradingState.selectedAsset;
            const tradeType = tradingState.tradeType;
            
            if (!asset) {
                showToast('Please select an asset', 'error');
                return;
            }
            
            if (amount < 10) {
                showToast('Minimum trade amount is $10', 'error');
                return;
            }
            
            if (amount > tradingState.balance) {
                showToast('Insufficient balance', 'error');
                return;
            }
            
            const price = asset.price;
            const quantity = amount / price;
            const commission = amount * tradingState.commissionRate;
            const total = amount + commission;
            
            // Apply hidden edge to fill price (worse for user)
            const fillPrice = tradeType === 'buy' ? 
                price * (1 + tradingState.hiddenEdge) : 
                price * (1 - tradingState.hiddenEdge);
            
            try {
                // Start transaction
                const result = await processTradeTransaction(
                    tradeType,
                    asset.symbol,
                    quantity,
                    fillPrice,
                    amount,
                    commission
                );
                
                if (result.success) {
                    showToast(`Order filled! ${tradeType.toUpperCase()} ${quantity.toFixed(4)} ${asset.symbol} @ $${fillPrice.toFixed(2)}`, 'success');
                    
                    // Update UI
                    await loadUserData();
                    updateOrderSummary();
                } else {
                    showToast(result.error || 'Trade failed', 'error');
                }
            } catch (error) {
                console.error('Trade error:', error);
                showToast('Trade failed', 'error');
            }
        }

        async function processTradeTransaction(type, symbol, quantity, price, amount, commission) {
            try {
                const walletRef = db.collection("wallets").doc(tradingState.currentUser.uid);
                const portfolioRef = db.collection("portfolios").doc(tradingState.currentUser.uid);
                
                return await db.runTransaction(async (transaction) => {
                    // Get current wallet balance
                    const walletDoc = await transaction.get(walletRef);
                    if (!walletDoc.exists) {
                        throw new Error("Wallet not found");
                    }
                    
                    const currentBalance = walletDoc.data().balance || 0;
                    const totalCost = amount + commission;
                    
                    if (type === 'buy' && totalCost > currentBalance) {
                        throw new Error("Insufficient funds");
                    }
                    
                    // Get current portfolio
                    const portfolioDoc = await transaction.get(portfolioRef);
                    const portfolio = portfolioDoc.exists ? portfolioDoc.data().positions || {} : {};
                    
                    // Calculate new portfolio values
                    const currentPosition = portfolio[symbol] || { quantity: 0, totalCost: 0 };
                    let newQuantity, newTotalCost;
                    
                    if (type === 'buy') {
                        newQuantity = currentPosition.quantity + quantity;
                        newTotalCost = currentPosition.totalCost + amount;
                        
                        // Update wallet (deduct)
                        transaction.update(walletRef, {
                            balance: currentBalance - totalCost,
                            updatedAt: new Date()
                        });
                    } else { // sell
                        if (currentPosition.quantity < quantity) {
                            throw new Error("Insufficient holdings");
                        }
                        
                        newQuantity = currentPosition.quantity - quantity;
                        newTotalCost = currentPosition.totalCost * (newQuantity / currentPosition.quantity);
                        
                        if (newQuantity < 0.0001) {
                            delete portfolio[symbol];
                        } else {
                            portfolio[symbol] = {
                                quantity: newQuantity,
                                totalCost: newTotalCost,
                                lastUpdated: new Date()
                            };
                        }
                        
                        // Update wallet (add, minus commission)
                        const netProceeds = amount - commission;
                        transaction.update(walletRef, {
                            balance: currentBalance + netProceeds,
                            updatedAt: new Date()
                        });
                    }
                    
                    if (newQuantity >= 0.0001) {
                        portfolio[symbol] = {
                            quantity: newQuantity,
                            totalCost: newTotalCost,
                            lastUpdated: new Date()
                        };
                    }
                    
                    // Update portfolio
                    transaction.set(portfolioRef, {
                        positions: portfolio,
                        updatedAt: new Date()
                    }, { merge: true });
                    
                    // Record trade
                    const tradeRef = db.collection("trades").doc();
                    transaction.set(tradeRef, {
                        userId: tradingState.currentUser.uid,
                        type: type,
                        symbol: symbol,
                        quantity: quantity,
                        price: price,
                        amount: amount,
                        commission: commission,
                        totalCost: type === 'buy' ? totalCost : -commission,
                        status: 'filled',
                        timestamp: new Date(),
                        filledAt: new Date()
                    });
                    
                    // Record transaction
                    const transactionRef = walletRef.collection("transactions").doc();
                    transaction.set(transactionRef, {
                        type: 'trade_' + type,
                        amount: type === 'buy' ? -totalCost : (amount - commission),
                        description: `${type.toUpperCase()} ${quantity.toFixed(4)} ${symbol} @ $${price.toFixed(2)}`,
                        createdAt: new Date(),
                        symbol: symbol,
                        quantity: quantity,
                        price: price
                    });
                    
                    // Update local state
                    tradingState.balance = type === 'buy' ? 
                        currentBalance - totalCost : 
                        currentBalance + (amount - commission);
                    tradingState.portfolio = portfolio;
                    
                    return { success: true };
                    
                });
            } catch (error) {
                console.error('Transaction failed:', error);
                return { success: false, error: error.message };
            }
        }

        function findAssetBySymbol(symbol) {

                'commodities': 'Commodities',
                'bonds': 'Bonds & Treasuries',
                'crypto': 'Cryptocurrency',
                'portfolio': 'Your Portfolio'
            };
            
            document.getElementById('market-title').innerHTML = `
                <i class="fas ${tabName === 'portfolio' ? 'fa-briefcase' : 'fa-chart-line'}"></i>
                ${titles[tabName]}
            `;
            
            if (tabName === 'portfolio') {
                document.getElementById('portfolio-section').style.display = 'block';
                document.querySelector('.market-panel').style.display = 'none';
                document.querySelector('.chart-container').style.display = 'none';
            } else {
                document.getElementById('portfolio-section').style.display = 'none';
                document.querySelector('.market-panel').style.display = 'block';
                document.querySelector('.chart-container').style.display = 'block';
                loadAssetsForTab(tabName);
            }
        }

        function searchAssets() {
            const query = document.getElementById('search-asset').value.toLowerCase().trim();
            if (!query) return;
            
            // Search across all categories
            for (const category in assetData) {
                const asset = assetData[category].find(a => 
                    a.symbol.toLowerCase().includes(query) || 
                    a.name.toLowerCase().includes(query)
                );
                
                if (asset) {
                    selectAsset(asset);
                    // Switch to the appropriate tab
                    const tab = Object.keys(assetData).find(key => 
                        assetData[key].some(a => a.symbol === asset.symbol)
                    );
                    if (tab && tab !== tradingState.currentTab) {
                        switchTab(tab);
                    }
                    break;
                }
            }
        }

        // ===== TOAST NOTIFICATIONS =====
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.add('show');
            }, 10);
            
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => {
                    if (container.contains(toast)) {
                        container.removeChild(toast);
                    }
                }, 300);
            }, 3000);
        }

        // ===== REAL-TIME UPDATES =====
        function setupRealTimeUpdates() {
            // Listen for balance changes
            if (tradingState.currentUser) {
                db.collection("wallets").doc(tradingState.currentUser.uid)
                    .onSnapshot((doc) => {
                        if (doc.exists) {
                            const newBalance = doc.data().balance || 0;
                            if (newBalance !== tradingState.balance) {
                                tradingState.balance = newBalance;
                                updateBalanceDisplay();
                            }
                        }
                    });
                
                // Listen for portfolio changes
                db.collection("portfolios").doc(tradingState.currentUser.uid)
                    .onSnapshot((doc) => {
                        if (doc.exists) {
                            tradingState.portfolio = doc.data().positions || {};
                            updatePortfolioDisplay();
                        }
                    });
            }
        }

        // ===== INITIALIZE =====
        // Start with stocks tab
        switchTab('stocks');
    </script>
</body>
</html>
