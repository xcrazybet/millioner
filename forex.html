<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Multi-Asset Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Inter:wght@400;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #050505; color: #d1d5db; }
        .mono { font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; }
        .price-up { color: #00ff88; font-weight: bold; }
        .price-down { color: #ff3344; font-weight: bold; }
        .table-container { height: 80vh; overflow-y: auto; scrollbar-width: thin; }
        tr { border-bottom: 1px solid #1a1a1a; transition: background 0.2s; }
        tr:hover { background-color: #111; }
        .category-tag { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 800; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <div class="flex flex-col md:flex-row justify-between items-end mb-6 gap-4">
            <div>
                <h1 class="text-2xl font-black text-white uppercase tracking-tighter">Multi-Asset <span class="text-blue-500">Live Feed</span></h1>
                <p class="text-gray-500 text-xs">Monitoring 100+ Global Instruments (Forex, Metals, Stocks, Bonds)</p>
            </div>
            <div class="flex gap-4 text-[10px] font-bold uppercase">
                <div class="text-gray-500">Status: <span id="status" class="text-green-500">● Streaming</span></div>
                <div class="text-gray-500">Updates/Sec: <span id="tps" class="text-blue-500">0</span></div>
            </div>
        </div>

        <div class="bg-[#0a0a0a] border border-gray-800 rounded-lg overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead class="bg-[#111] text-gray-500 text-[10px] uppercase tracking-widest border-bottom border-gray-800">
                    <tr>
                        <th class="p-4">Instrument</th>
                        <th class="p-4">Category</th>
                        <th class="p-4">Sell (Bid)</th>
                        <th class="p-4">Buy (Ask)</th>
                        <th class="p-4">24h Chg</th>
                        <th class="p-4 text-right">Spread</th>
                    </tr>
                </thead>
            </table>
            
            <div class="table-container">
                <table class="w-full text-left border-collapse">
                    <tbody id="market-body" class="mono text-gray-300">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const assets = [];
        const categories = {
            'FOREX': 'bg-blue-900/40 text-blue-400',
            'COMMODITY': 'bg-yellow-900/40 text-yellow-500',
            'STOCKS': 'bg-purple-900/40 text-purple-400',
            'BONDS': 'bg-green-900/40 text-green-400'
        };

        // 1. Asset Generator (Creating 100 Assets)
        function generateAssets() {
            const forexPairs = ['EUR/USD', 'GBP/USD', 'USD/JPY', 'USD/CHF', 'AUD/USD', 'USD/CAD', 'NZD/USD', 'EUR/GBP', 'EUR/JPY', 'GBP/JPY'];
            const commodities = ['XAU/USD (Gold)', 'XAG/USD (Silver)', 'WTI Oil', 'Brent Oil', 'Natural Gas', 'Copper', 'Platinum', 'Wheat', 'Corn', 'Coffee'];
            const stocks = ['AAPL', 'TSLA', 'NVDA', 'MSFT', 'GOOGL', 'AMZN', 'META', 'NFLX', 'AMD', 'BABA', 'DIS', 'PYPL', 'V', 'JPM', 'GS'];
            const bonds = ['US 10Y', 'US 2Y', 'UK 10Y', 'GER 10Y', 'JPN 10Y'];

            // Fill up to 100
            for(let i=1; i<=100; i++) {
                let name, cat, price, dec;
                if(i <= 20) { name = forexPairs[i%10] || `FX_PAIR_${i}`; cat = 'FOREX'; price = 1.0 + Math.random(); dec = 5; }
                else if(i <= 40) { name = commodities[i%10] || `COMM_${i}`; cat = 'COMMODITY'; price = 20 + Math.random() * 2000; dec = 2; }
                else if(i <= 80) { name = stocks[i%15] || `STOCK_${i}`; cat = 'STOCKS'; price = 50 + Math.random() * 500; dec = 2; }
                else { name = bonds[i%5] || `BOND_${i}`; cat = 'BONDS'; price = 2 + Math.random() * 5; dec = 3; }

                assets.push({ id: i, name, cat, price, dec, last: price, chg: (Math.random() * 2 - 1).toFixed(2) });
            }
        }

        // 2. Build the Table UI
        function buildTable() {
            const body = document.getElementById('market-body');
            body.innerHTML = assets.map(a => `
                <tr id="row-${a.id}">
                    <td class="p-4 font-bold text-white w-1/4">${a.name}</td>
                    <td class="p-4 w-1/6"><span class="category-tag ${categories[a.cat]}">${a.cat}</span></td>
                    <td id="bid-${a.id}" class="p-4 w-1/6">0.00</td>
                    <td id="ask-${a.id}" class="p-4 w-1/6">0.00</td>
                    <td id="chg-${a.id}" class="p-4 w-1/6 ${a.chg >= 0 ? 'text-green-500' : 'text-red-500'}">${a.chg}%</td>
                    <td id="spr-${a.id}" class="p-4 text-right text-gray-600 text-[10px]">0.0</td>
                </tr>
            `).join('');
        }

        // 3. Real-Time Update Engine
        let ticks = 0;
        function updatePrices() {
            assets.forEach(a => {
                // Simulate market movement (Volatility)
                const movement = (Math.random() - 0.5) * (a.price * 0.001);
                const newPrice = a.price + movement;
                const spread = a.price * 0.0002;

                const bidEl = document.getElementById(`bid-${a.id}`);
                const askEl = document.getElementById(`ask-${a.id}`);
                
                // Color Flashing
                if (newPrice > a.last) {
                    bidEl.className = "p-4 price-up";
                } else if (newPrice < a.last) {
                    bidEl.className = "p-4 price-down";
                }

                // Update Values
                bidEl.innerText = (newPrice - (spread/2)).toFixed(a.dec);
                askEl.innerText = (newPrice + (spread/2)).toFixed(a.dec);
                document.getElementById(`spr-${a.id}`).innerText = (spread * 1000).toFixed(1);

                a.last = newPrice;
                ticks++;
            });
            document.getElementById('session-ticks')?.innerText; // placeholder
        }

        // Initialize
        generateAssets();
        buildTable();
        
        // High-frequency update loop (Every 200ms)
        setInterval(updatePrices, 200);

        // TPS Counter
        setInterval(() => {
            document.getElementById('tps').innerText = (ticks * 5).toLocaleString();
            ticks = 0;
        }, 1000);

    </script>
</body>
</html>
