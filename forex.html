<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Market Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Inter:wght@400;600;800&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #080a0c; 
            color: #e2e8f0; 
        }
        
        .mono { font-family: 'JetBrains Mono', monospace; }
        
        /* Price Animation States */
        .price-up { color: #22c55e; animation: pulse-green 1s; }
        .price-down { color: #ef4444; animation: pulse-red 1s; }
        
        @keyframes pulse-green {
            0% { background-color: rgba(34, 197, 94, 0.2); }
            100% { background-color: transparent; }
        }
        
        @keyframes pulse-red {
            0% { background-color: rgba(239, 68, 68, 0.2); }
            100% { background-color: transparent; }
        }

        .status-glow { box-shadow: 0 0 10px rgba(34, 197, 94, 0.5); }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-3xl">
        <div class="flex flex-col md:flex-row justify-between items-center mb-10 gap-4">
            <div>
                <h1 class="text-3xl font-extrabold tracking-tight text-white uppercase">Market <span class="text-blue-500">Live</span></h1>
                <p class="text-gray-500 text-sm font-medium">Real-time Institutional Data Feed</p>
            </div>
            
            <div id="connection-container" class="flex items-center gap-3 bg-gray-900 border border-gray-800 px-4 py-2 rounded-lg">
                <div id="status-dot" class="w-3 h-3 rounded-full bg-yellow-500"></div>
                <span id="status-text" class="text-xs font-bold uppercase tracking-widest text-gray-400">System Connecting</span>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 transition-all hover:border-gray-600">
                <div class="flex justify-between items-center mb-6">
                    <span class="bg-blue-900/30 text-blue-400 text-[10px] font-black px-2 py-1 rounded">FOREX</span>
                    <span id="eur-clock" class="text-xs text-gray-600 font-mono">00:00:00</span>
                </div>
                <h2 class="text-xl font-bold text-white mb-6">EUR / USD</h2>
                
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label class="text-[10px] text-gray-500 font-bold uppercase tracking-tighter">Sell (Bid)</label>
                        <div id="eur-bid" class="text-3xl font-bold mono tracking-tighter">0.00000</div>
                    </div>
                    <div class="space-y-1 text-right">
                        <label class="text-[10px] text-gray-500 font-bold uppercase tracking-tighter">Buy (Ask)</label>
                        <div id="eur-ask" class="text-3xl font-bold mono tracking-tighter">0.00000</div>
                    </div>
                </div>
            </div>

            <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 transition-all hover:border-gray-600">
                <div class="flex justify-between items-center mb-6">
                    <span class="bg-yellow-900/30 text-yellow-500 text-[10px] font-black px-2 py-1 rounded">COMMODITY</span>
                    <span id="xau-clock" class="text-xs text-gray-600 font-mono">00:00:00</span>
                </div>
                <h2 class="text-xl font-bold text-white mb-6">GOLD (XAU/USD)</h2>
                
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label class="text-[10px] text-gray-500 font-bold uppercase tracking-tighter">Sell (Bid)</label>
                        <div id="xau-bid" class="text-3xl font-bold mono tracking-tighter text-yellow-500/80">0.00</div>
                    </div>
                    <div class="space-y-1 text-right">
                        <label class="text-[10px] text-gray-500 font-bold uppercase tracking-tighter">Buy (Ask)</label>
                        <div id="xau-ask" class="text-3xl font-bold mono tracking-tighter text-yellow-500/80">0.00</div>
                    </div>
                </div>
            </div>

        </div>

        <div class="mt-10 flex justify-between items-center border-t border-gray-900 pt-6 text-[10px] font-bold text-gray-600 tracking-widest uppercase">
            <div>Data Stream: <span id="data-source" class="text-gray-400">Binance Global</span></div>
            <div>Update Latency: <span id="latency" class="text-green-500">Fast</span></div>
            <div>Session Ticks: <span id="session-ticks" class="text-gray-400">0</span></div>
        </div>
    </div>

    <script>
        let socket;
        let tickCount = 0;
        let lastEurPrice = 0;
        let lastXauPrice = 0;

        function startTerminal() {
            // Using Binance public stream for reliable English-language data
            // EURUSDT (Euro) and PAXGUSDT (Gold)
            socket = new WebSocket('wss://stream.binance.com:9443/ws/eurusdt@bookTicker/paxgusdt@bookTicker');

            socket.onopen = () => {
                updateStatus("Connected", "bg-green-500");
                console.log("Terminal Online");
            };

            socket.onmessage = (event) => {
                const rawData = JSON.parse(event.data);
                tickCount++;
                document.getElementById('session-ticks').innerText = tickCount.toLocaleString();

                if (rawData.s === 'EURUSDT') {
                    handleUpdate('eur', rawData.b, rawData.a, 5);
                } else if (rawData.s === 'PAXGUSDT') {
                    handleUpdate('xau', rawData.b, rawData.a, 2);
                }
            };

            socket.onclose = () => {
                updateStatus("Disconnected - Retrying", "bg-red-500 animate-ping");
                setTimeout(startTerminal, 3000);
            };

            socket.onerror = (err) => {
                updateStatus("Stream Error", "bg-red-500");
                socket.close();
            };
        }

        function updateStatus(text, colorClass) {
            const dot = document.getElementById('status-dot');
            const statusText = document.getElementById('status-text');
            
            dot.className = `w-3 h-3 rounded-full ${colorClass}`;
            if(colorClass.includes('green')) dot.classList.add('status-glow');
            
            statusText.innerText = text;
        }

        function handleUpdate(pair, bid, ask, decimals) {
            const bidVal = parseFloat(bid);
            const askVal = parseFloat(ask);
            const bidEl = document.getElementById(`${pair}-bid`);
            const askEl = document.getElementById(`${pair}-ask`);
            const clockEl = document.getElementById(`${pair}-clock`);

            // Check Price Direction for Visual Feedback
            let prevPrice = pair === 'eur' ? lastEurPrice : lastXauPrice;
            
            if (prevPrice !== 0) {
                if (bidVal > prevPrice) {
                    bidEl.className = `text-3xl font-bold mono tracking-tighter price-up`;
                } else if (bidVal < prevPrice) {
                    bidEl.className = `text-3xl font-bold mono tracking-tighter price-down`;
                }
            }

            // Update DOM
            bidEl.innerText = bidVal.toFixed(decimals);
            askEl.innerText = askVal.toFixed(decimals);
            clockEl.innerText = new Date().toLocaleTimeString('en-GB', { hour12: false });

            // Store last price
            if (pair === 'eur') lastEurPrice = bidVal;
            else lastXauPrice = bidVal;
        }

        // Initialize Terminal
        startTerminal();
    </script>
</body>
</html>
