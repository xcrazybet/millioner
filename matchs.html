<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Sports Dashboard | Live Scores & Widgets Hub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #0a1428 0%, #060c1a 100%);
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            padding: 1.5rem;
            min-height: 100vh;
        }

        /* Main container */
        .dashboard {
            max-width: 1800px;
            margin: 0 auto;
        }

        /* Header */
        .dashboard-header {
            text-align: center;
            margin-bottom: 2rem;
            padding: 1rem 0;
        }
        .dashboard-header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.02em;
        }
        .dashboard-header p {
            color: #94a3b8;
            margin-top: 0.5rem;
            font-size: 0.9rem;
        }

        /* Responsive grid - auto fit cards */
        .widgets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(450px, 1fr));
            gap: 1.75rem;
        }

        /* Widget card styling */
        .widget-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(2px);
            border-radius: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        .widget-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 25px 35px -12px rgba(0, 0, 0, 0.4);
            border-color: rgba(255, 255, 255, 0.15);
        }

        /* Card header with league/team info */
        .card-header {
            background: rgba(255, 255, 255, 0.05);
            padding: 0.9rem 1.2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .card-title {
            font-weight: 600;
            font-size: 1rem;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            flex-wrap: wrap;
        }
        .card-badge {
            background: #2563eb;
            padding: 0.2rem 0.7rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 500;
            color: white;
            letter-spacing: 0.3px;
        }
        .card-badge.league {
            background: #3b82f6;
        }
        .card-badge.team {
            background: #8b5cf6;
        }
        .entity-id {
            font-size: 0.7rem;
            color: #64748b;
            font-family: monospace;
            margin-left: auto;
        }

        /* Widget content area */
        .widget-content {
            background: #ffffff;
            min-height: 380px;
            width: 100%;
            overflow-x: auto;
            overflow-y: auto;
        }

        /* Loading placeholder */
        .loading-placeholder {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 380px;
            background: #f8fafc;
            gap: 0.8rem;
            flex-direction: column;
            color: #475569;
            font-weight: 500;
            font-size: 0.85rem;
        }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid #e2e8f0;
            border-top: 3px solid #2563eb;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Responsive adjustments */
        @media (max-width: 1000px) {
            .widgets-grid {
                grid-template-columns: 1fr;
                gap: 1.25rem;
            }
            body {
                padding: 1rem;
            }
        }

        /* Hide all branding/powered-by elements completely */
        #powered-by, .powered-by, [id="powered-by"], 
        a[href*="365scores.com"], a[href*="365scores"],
        [class*="powered"], [class*="attribution"], [class*="credit-footer"],
        .widget-footer, .branding, [class*="watermark"], [class*="credit"] {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            height: 0 !important;
            width: 0 !important;
            overflow: hidden !important;
            position: absolute !important;
            pointer-events: none !important;
        }

        /* Neutralize any remaining links */
        a, a:hover, a:active {
            cursor: default;
            text-decoration: none;
        }

        /* Ensure iframes or injected elements don't cause issues */
        iframe[src*="365scores"] {
            display: none !important;
        }

        /* Scrollbar styling for widget content */
        .widget-content::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .widget-content::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        .widget-content::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
    </style>
</head>
<body>
<div class="dashboard">
    <div class="dashboard-header">
        <h1>🏆 Global Sports Hub</h1>
        <p>Live scores · Leagues · Teams — Clean dashboard, zero redirects</p>
    </div>

    <div class="widgets-grid" id="widgetsGrid">
        <!-- All widgets will be injected dynamically via JS to ensure clean structure -->
    </div>
</div>

<script>
    // ================================================================
    // COMPLETE WIDGET CONFIGURATION (All widgets from request)
    // ================================================================
    const widgetsConfig = [
        { type: "entityScores", entityType: "league", entityId: "8", widgetId: "a3d2c16d-8f0a-46ad-b12d-cecb9d50358f", name: "Premier League", badge: "League" },
        { type: "entityScores", entityType: "league", entityId: "8", widgetId: "5d11ba3d-e71d-4908-be46-4c3aefc18821", name: "Premier League (Alt)", badge: "League" },
        { type: "entityScores", entityType: "league", entityId: "104", widgetId: "0bbd041c-4a35-4b64-87f0-9e9303667ee4", name: "La Liga", badge: "League" },
        { type: "entityScores", entityType: "team", entityId: "5071", widgetId: "a2c6279c-0aeb-404a-b9de-2ecaa7edda63", name: "Real Madrid", badge: "Team" },
        { type: "entityScores", entityType: "team", entityId: "1255", widgetId: "b29497f6-a37e-4491-a3d1-af52f5207e65", name: "FC Barcelona", badge: "Team" },
        { type: "entityScores", entityType: "league", entityId: "17", widgetId: "127787b7-6b6b-4f0e-b2a0-4f78c33fe7ef", name: "Serie A", badge: "League" },
        { type: "entityScores", entityType: "league", entityId: "11", widgetId: "23df0483-bf9f-4c53-be56-6d56fbc195c0", name: "Bundesliga", badge: "League" },
        { type: "entityScores", entityType: "league", entityId: "12", widgetId: "26a3c9ea-d613-4e67-b29f-e3cf50f1cfaa", name: "Ligue 1", badge: "League" },
        { type: "entityScores", entityType: "league", entityId: "8971", widgetId: "adb270dd-9c39-447b-824d-cc6127c3bf18", name: "Primeira Liga", badge: "League" },
        { type: "entityScores", entityType: "league", entityId: "557", widgetId: "a02dd229-6583-436b-bd16-48a055bcf885", name: "Eredivisie", badge: "League" },
        { type: "entityScores", entityType: "team", entityId: "236", widgetId: "890cedde-d72d-4698-851e-57c43128be5b", name: "Paris Saint-Germain", badge: "Team" },
        { type: "entityScores", entityType: "league", entityId: "15", widgetId: "382f4e6a-51e1-4924-8b8a-a175f4725643", name: "UEFA Champions League", badge: "League" },
        { type: "entityScores", entityType: "team", entityId: "5050", widgetId: "d4c8a450-1657-4242-823d-9f6c4df56ddb", name: "Manchester City", badge: "Team" }
    ];

    // Container
    const gridContainer = document.getElementById('widgetsGrid');

    // Build all widget cards dynamically
    widgetsConfig.forEach((cfg, index) => {
        const card = document.createElement('div');
        card.className = 'widget-card';
        card.setAttribute('data-widget-index', index);
        
        // Card header
        const header = document.createElement('div');
        header.className = 'card-header';
        
        const titleDiv = document.createElement('div');
        titleDiv.className = 'card-title';
        
        const badgeSpan = document.createElement('span');
        badgeSpan.className = `card-badge ${cfg.badge === 'League' ? 'league' : 'team'}`;
        badgeSpan.textContent = cfg.badge;
        
        const nameSpan = document.createElement('span');
        nameSpan.textContent = cfg.name;
        nameSpan.style.fontWeight = '500';
        
        const idSpan = document.createElement('span');
        idSpan.className = 'entity-id';
        idSpan.textContent = `${cfg.entityType === 'league' ? 'League' : 'Team'} ID: ${cfg.entityId}`;
        
        titleDiv.appendChild(badgeSpan);
        titleDiv.appendChild(nameSpan);
        titleDiv.appendChild(idSpan);
        header.appendChild(titleDiv);
        
        // Content area (where widget will live)
        const contentDiv = document.createElement('div');
        contentDiv.className = 'widget-content';
        
        // Loading indicator
        const loadingDiv = document.createElement('div');
        loadingDiv.className = 'loading-placeholder';
        loadingDiv.id = `loading-${index}`;
        const spinner = document.createElement('div');
        spinner.className = 'spinner';
        const loadingText = document.createElement('div');
        loadingText.textContent = `Loading ${cfg.name} scores...`;
        loadingDiv.appendChild(spinner);
        loadingDiv.appendChild(loadingText);
        
        // Actual widget root container
        const widgetRoot = document.createElement('div');
        widgetRoot.id = `widget-root-${index}`;
        widgetRoot.style.minHeight = '380px';
        
        // Create the widget div element
        const widgetDiv = document.createElement('div');
        widgetDiv.setAttribute('data-widget-type', cfg.type);
        widgetDiv.setAttribute('data-entity-type', cfg.entityType);
        widgetDiv.setAttribute('data-entity-id', cfg.entityId);
        widgetDiv.setAttribute('data-lang', 'en');
        widgetDiv.setAttribute('data-widget-id', cfg.widgetId);
        
        widgetRoot.appendChild(widgetDiv);
        
        // Add hidden powered-by div (to satisfy widget script but will be removed by CSS/JS)
        const hiddenPowered = document.createElement('div');
        hiddenPowered.id = 'powered-by';
        hiddenPowered.style.display = 'none';
        const poweredLink = document.createElement('a');
        poweredLink.id = 'powered-by-link';
        poweredLink.href = 'https://www.365scores.com';
        poweredLink.target = '_blank';
        poweredLink.textContent = '365Scores.com';
        hiddenPowered.appendChild(poweredLink);
        widgetRoot.appendChild(hiddenPowered);
        
        contentDiv.appendChild(loadingDiv);
        contentDiv.appendChild(widgetRoot);
        
        card.appendChild(header);
        card.appendChild(contentDiv);
        
        gridContainer.appendChild(card);
        
        // Store loading element reference for later removal
        window._loadingElements = window._loadingElements || [];
        window._loadingElements.push({ id: `loading-${index}`, rootId: `widget-root-${index}`, index });
    });

    // Load the main widget script
    const script = document.createElement('script');
    script.src = 'https://widgets.365scores.com/main.js';
    script.async = true;
    document.head.appendChild(script);

    // ================================================================
    // SECURITY & BRANDING REMOVAL + REDIRECT BLOCKING
    // ================================================================
    (function() {
        // ---------- 1. Block all anchor navigation (capture phase) ----------
        const blockAllRedirects = (e) => {
            let target = e.target;
            let link = null;
            if (target.closest) {
                link = target.closest('a');
            } else {
                let el = target;
                while (el && el !== document.body) {
                    if (el.tagName === 'A') {
                        link = el;
                        break;
                    }
                    el = el.parentElement;
                }
            }
            
            if (link) {
                const href = link.getAttribute('href');
                if (href && href !== '#' && !href.startsWith('javascript:')) {
                    e.preventDefault();
                    e.stopPropagation();
                    e.stopImmediatePropagation();
                    return false;
                }
                e.preventDefault();
                return false;
            }
            
            // Also check for custom data-href or onclick with location
            if (target.hasAttribute && (target.hasAttribute('data-href') || 
                (target.getAttribute('onclick') && target.getAttribute('onclick').includes('location')))) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            }
        };
        
        document.addEventListener('click', blockAllRedirects, true);
        
        // Block middle-click (opens new tab)
        document.addEventListener('auxclick', (e) => {
            let link = e.target.closest ? e.target.closest('a') : null;
            if (link && link.href) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            }
        }, true);
        
        // Block context menu on links
        document.addEventListener('contextmenu', (e) => {
            let link = e.target.closest ? e.target.closest('a') : null;
            if (link && link.href) {
                e.preventDefault();
                return false;
            }
        }, true);
        
        // ---------- 2. Override window.open and location methods ----------
        const originalOpen = window.open;
        window.open = function(...args) {
            console.warn('[Security] Blocked window.open');
            return null;
        };
        
        const originalAssign = location.assign;
        const originalReplace = location.replace;
        Object.defineProperty(location, 'assign', {
            configurable: true,
            value: function(url) {
                if (url && (url.includes('365scores') || url.includes('widgets.365scores'))) {
                    console.warn('[Security] Blocked location.assign to 365scores');
                    return;
                }
                return originalAssign.call(location, url);
            }
        });
        Object.defineProperty(location, 'replace', {
            configurable: true,
            value: function(url) {
                if (url && (url.includes('365scores') || url.includes('widgets.365scores'))) {
                    console.warn('[Security] Blocked location.replace to 365scores');
                    return;
                }
                return originalReplace.call(location, url);
            }
        });
        
        // ---------- 3. Aggressive removal of branding and powered-by elements ----------
        const removeAllBranding = () => {
            // Remove by ID
            const poweredDivs = document.querySelectorAll('#powered-by, [id="powered-by"], .powered-by');
            poweredDivs.forEach(el => el.remove());
            
            // Remove all links to 365scores
            const allLinks = document.querySelectorAll('a');
            allLinks.forEach(link => {
                const href = (link.getAttribute('href') || '').toLowerCase();
                const linkText = (link.innerText || '').toLowerCase();
                if (href.includes('365scores.com') || href.includes('365scores') || 
                    linkText.includes('365scores') || linkText.includes('powered by')) {
                    link.remove();
                    return;
                }
                // Remove href attribute from any link inside widget areas
                if (link.closest('.widget-content')) {
                    if (link.getAttribute('href') && link.getAttribute('href') !== 'javascript:void(0)') {
                        link.removeAttribute('href');
                        link.style.cursor = 'default';
                    }
                    link.removeAttribute('target');
                }
            });
            
            // Remove any element containing "Powered by" text
            const allElements = document.querySelectorAll('div, span, footer, small, p');
            allElements.forEach(el => {
                if (el.innerText && (el.innerText.toLowerCase().includes('powered by') || 
                    el.innerText.toLowerCase().includes('365scores.com'))) {
                    if (!el.querySelector('table') && !el.querySelector('.match-row')) {
                        el.remove();
                    }
                }
                if (el.className && typeof el.className === 'string') {
                    if (el.className.toLowerCase().includes('credit') || 
                        el.className.toLowerCase().includes('branding') ||
                        el.className.toLowerCase().includes('watermark')) {
                        el.remove();
                    }
                }
            });
            
            // Remove any iframe with 365scores
            const iframes = document.querySelectorAll('iframe');
            iframes.forEach(iframe => {
                if (iframe.src && iframe.src.includes('365scores')) {
                    iframe.remove();
                }
            });
        };
        
        // ---------- 4. Disable all anchor hrefs inside widget containers ----------
        const neutralizeAllAnchors = () => {
            const anchors = document.querySelectorAll('.widget-content a');
            anchors.forEach(anchor => {
                if (anchor.getAttribute('href') && anchor.getAttribute('href') !== 'javascript:void(0)') {
                    anchor.removeAttribute('href');
                    anchor.style.cursor = 'default';
                    anchor.setAttribute('aria-disabled', 'true');
                }
                anchor.removeAttribute('target');
                // Also prevent any pointer-events but keep text visible
                anchor.style.pointerEvents = 'none';
            });
        };
        
        // ---------- 5. MutationObserver to dynamically clean injected content ----------
        const observer = new MutationObserver((mutations) => {
            let needsClean = false;
            for (const mutation of mutations) {
                if (mutation.addedNodes.length > 0 || mutation.type === 'attributes') {
                    needsClean = true;
                    break;
                }
            }
            if (needsClean) {
                removeAllBranding();
                neutralizeAllAnchors();
                hideLoadersWhenReady();
            }
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true,
            attributes: true,
            attributeFilter: ['href', 'class', 'style']
        });
        
        // ---------- 6. Hide loading indicators once widgets have content ----------
        const hideLoadersWhenReady = () => {
            // For each widget root, check if content exists
            for (let i = 0; i < widgetsConfig.length; i++) {
                const rootDiv = document.getElementById(`widget-root-${i}`);
                const loadingElem = document.getElementById(`loading-${i}`);
                if (rootDiv && loadingElem) {
                    // Check if widget has rendered any meaningful content
                    const hasContent = rootDiv.children.length > 1 || 
                                      (rootDiv.innerText && rootDiv.innerText.length > 50) ||
                                      rootDiv.querySelector('table, .match, .score, .fixture');
                    if (hasContent) {
                        loadingElem.style.display = 'none';
                    }
                }
            }
        };
        
        // Periodic check for loaders (widgets might load asynchronously)
        const loaderInterval = setInterval(() => {
            hideLoadersWhenReady();
            removeAllBranding();
            neutralizeAllAnchors();
            
            // Check if all loaders are hidden
            let allHidden = true;
            for (let i = 0; i < widgetsConfig.length; i++) {
                const loadingElem = document.getElementById(`loading-${i}`);
                if (loadingElem && loadingElem.style.display !== 'none') {
                    allHidden = false;
                    break;
                }
            }
            if (allHidden) {
                // Keep cleaning but reduce frequency after 8 seconds
                setTimeout(() => {
                    // nothing special
                }, 1000);
            }
        }, 800);
        
        // Final fallback: after 6 seconds force hide all loaders and clean
        setTimeout(() => {
            for (let i = 0; i < widgetsConfig.length; i++) {
                const loadingElem = document.getElementById(`loading-${i}`);
                if (loadingElem) loadingElem.style.display = 'none';
            }
            removeAllBranding();
            neutralizeAllAnchors();
        }, 6000);
        
        // ---------- 7. Extra CSS injection for maximum protection ----------
        const styleTag = document.createElement('style');
        styleTag.textContent = `
            #powered-by, .powered-by, [id*="powered"], [class*="powered"], [class*="attribution"], 
            a[href*="365scores"], a[href*="365scores.com"], .footer-credit, .branding-footer,
            div:has(> a[href*="365scores"]), span:has(> a[href*="365scores"]) {
                display: none !important;
                visibility: hidden !important;
                height: 0 !important;
                width: 0 !important;
                overflow: hidden !important;
                position: absolute !important;
                pointer-events: none !important;
                opacity: 0 !important;
            }
            .widget-content a {
                pointer-events: none !important;
                cursor: default !important;
                text-decoration: none !important;
                color: inherit !important;
            }
            /* Ensure tables and interactive elements remain usable (sorting, etc.) but no navigation */
            .widget-content td, .widget-content th, .widget-content .match-row {
                pointer-events: auto;
            }
            button, .button-like, .tab, .filter {
                pointer-events: auto;
            }
        `;
        document.head.appendChild(styleTag);
        
        // ---------- 8. Remove any floating badges that appear later ----------
        setInterval(() => {
            const badges = document.querySelectorAll('[class*="badge"], [class*="credit"], [class*="watermark"], [class*="attribution"]');
            badges.forEach(badge => {
                if (badge.innerText && (badge.innerText.toLowerCase().includes('365') || 
                    badge.innerText.toLowerCase().includes('powered') ||
                    badge.innerText.toLowerCase().includes('scores'))) {
                    badge.remove();
                }
            });
            removeAllBranding();
        }, 2000);
        
        // Initial cleanup
        window.addEventListener('DOMContentLoaded', () => {
            removeAllBranding();
            neutralizeAllAnchors();
        });
        
        console.log(`✅ Sports Dashboard active: ${widgetsConfig.length} widgets loaded | Redirects blocked | Branding hidden`);
    })();
</script>

<!-- Additional inline style to ensure no residual powered-by visibility -->
<style>
    /* Ultimate fallback: kill any element with id containing 'powered' */
    [id*="powered"] {
        display: none !important;
        height: 0 !important;
        width: 0 !important;
        visibility: hidden !important;
        position: absolute !important;
        overflow: hidden !important;
    }
    /* Ensure widget containers don't show any external links */
    .widget-content a[href*="365"] {
        display: none !important;
    }
    body {
        -webkit-tap-highlight-color: transparent;
    }
</style>
</body>
</html>
