<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>League Hub - Standings & Live Scores</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a1a2f 0%, #0c1122 100%);
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            min-height: 100vh;
            padding: 2rem;
        }

        /* Main dashboard layout */
        .dashboard {
            max-width: 1600px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        /* Header styling */
        .dashboard-header {
            text-align: center;
            margin-bottom: 0.5rem;
        }
        .dashboard-header h1 {
            font-size: 2rem;
            font-weight: 600;
            background: linear-gradient(135deg, #FFFFFF 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.01em;
        }
        .dashboard-header p {
            color: #94a3b8;
            margin-top: 0.5rem;
            font-size: 0.9rem;
        }

        /* Card container style */
        .widget-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(2px);
            border-radius: 1.75rem;
            box-shadow: 0 25px 40px -12px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .widget-card:hover {
            box-shadow: 0 30px 50px -15px rgba(0, 0, 0, 0.5);
        }

        .widget-inner {
            background: #ffffff;
            border-radius: 1.5rem;
            overflow-x: auto;
            overflow-y: auto;
            width: 100%;
        }

        /* Two-column layout for larger screens */
        .two-columns {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 2rem;
        }

        /* Section titles */
        .section-title {
            padding: 1rem 1.5rem 0 1.5rem;
            background: white;
            font-weight: 600;
            font-size: 1.1rem;
            color: #1e293b;
            border-bottom: 2px solid #eef2ff;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .section-title span:first-child {
            background: #1e40af;
            color: white;
            width: 28px;
            height: 28px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        /* Loading placeholder */
        .loading-placeholder {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 400px;
            background: #f9fafb;
            border-radius: 1.5rem;
            gap: 1rem;
            flex-direction: column;
            color: #334155;
            font-weight: 500;
        }
        .spinner {
            width: 44px;
            height: 44px;
            border: 3px solid #e2e8f0;
            border-top: 3px solid #2563eb;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 1000px) {
            .two-columns {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }
            body {
                padding: 1rem;
            }
        }

        /* Hide all branding / powered-by elements completely */
        #powered-by, .powered-by, [id="powered-by"], 
        a[href*="365scores.com"], a[href*="365scores"],
        [class*="powered"], [class*="attribution"], [class*="credit-footer"],
        .widget-footer, .branding {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            height: 0 !important;
            width: 0 !important;
            overflow: hidden !important;
            position: absolute !important;
            pointer-events: none !important;
        }

        /* Cursor default for any leftover links, no redirection */
        a, a:hover, a:active {
            cursor: default;
            text-decoration: none;
        }

        /* ensure widget containers have proper background */
        .widget-mount {
            min-height: 450px;
        }
    </style>
</head>
<body>
<div class="dashboard">
    <div class="dashboard-header">
        <h1>⚽ League Hub</h1>
        <p>Standings & Live Scores — Clean dashboard, no distractions</p>
    </div>

    <div class="two-columns">
        <!-- LEFT COLUMN: STANDINGS WIDGET (League ID 104) -->
        <div class="widget-card">
            <div class="section-title">
                <span>📊</span> 
                <span>League Standings</span>
            </div>
            <div class="widget-inner">
                <div id="standingsWidgetArea" style="min-height: 480px;">
                    <div id="loadingStandings" class="loading-placeholder">
                        <div class="spinner"></div>
                        <div>Loading standings table...</div>
                    </div>
                    <div id="standingsRoot">
                        <div data-widget-type="entityStandings" 
                             data-entity-type="league" 
                             data-entity-id="104" 
                             data-lang="en" 
                             data-widget-id="6b484acb-eab2-4a35-a6ce-0ceaed6bfed7">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- RIGHT COLUMN: LIVE SCORES WIDGET (League ID 8) -->
        <div class="widget-card">
            <div class="section-title">
                <span>⚡</span> 
                <span>Live Scores & Fixtures</span>
            </div>
            <div class="widget-inner">
                <div id="scoresWidgetArea" style="min-height: 480px;">
                    <div id="loadingScores" class="loading-placeholder">
                        <div class="spinner"></div>
                        <div>Loading live scores...</div>
                    </div>
                    <div id="scoresRoot">
                        <div data-widget-type="entityScores" 
                             data-entity-type="league" 
                             data-entity-id="8" 
                             data-lang="en" 
                             data-widget-id="a3d2c16d-8f0a-46ad-b12d-cecb9d50358f">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Load 365Scores widget script once (handles both widgets) -->
<script src="https://widgets.365scores.com/main.js"></script>

<script>
    (function() {
        // --------------------------------------------------------------
        // COMPLETE PROTECTION: 
        // - Hide any "powered by" / branding elements
        // - Block all clicks that would redirect to 365scores or any external link
        // - Prevent any form of navigation (target="_blank", window.open, location changes)
        // - Preserve widget internal interactivity (scrolling, hover effects) but NO redirects
        // --------------------------------------------------------------

        // 1. Global click interceptor (capture phase) to kill any anchor navigation
        const blockAllRedirects = (e) => {
            let target = e.target;
            let link = null;
            if (target.closest) {
                link = target.closest('a');
            } else {
                let el = target;
                while (el && el !== document.body) {
                    if (el.tagName === 'A') {
                        link = el;
                        break;
                    }
                    el = el.parentElement;
                }
            }
            
            if (link) {
                const href = link.getAttribute('href');
                // Block any non-javascript, non-anchor link that could navigate
                if (href && href !== '#' && !href.startsWith('javascript:')) {
                    e.preventDefault();
                    e.stopPropagation();
                    e.stopImmediatePropagation();
                    return false;
                }
                // Also block if link has any navigation intent
                if (link.getAttribute('target') === '_blank' || link.getAttribute('rel') === 'noreferrer') {
                    e.preventDefault();
                    e.stopPropagation();
                    return false;
                }
                e.preventDefault();
                return false;
            }
            
            // Additional: block any synthetic redirect like elements with data-href or custom attributes
            if (target.hasAttribute && (target.hasAttribute('data-href') || target.getAttribute('onclick')?.includes('location'))) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            }
        };
        
        document.addEventListener('click', blockAllRedirects, true);
        
        // Also block middle-click / auxclick (opens new tab)
        document.addEventListener('auxclick', (e) => {
            let link = e.target.closest ? e.target.closest('a') : null;
            if (link && link.href) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            }
        }, true);
        
        // Block context menu on links to avoid "Open in new tab"
        document.addEventListener('contextmenu', (e) => {
            let link = e.target.closest ? e.target.closest('a') : null;
            if (link && link.href) {
                e.preventDefault();
                return false;
            }
        }, true);
        
        // 2. Override window.open to block any popup from widget
        const originalOpen = window.open;
        window.open = function(...args) {
            console.warn('Blocked window.open attempt');
            return null;
        };
        
        // 3. Block location.assign / replace from any script
        const originalAssign = location.assign;
        const originalReplace = location.replace;
        Object.defineProperty(location, 'assign', {
            configurable: true,
            value: function(url) {
                if (url && (url.includes('365scores') || url.includes('widgets.365scores'))) {
                    console.warn('Blocked location.assign to 365scores');
                    return;
                }
                return originalAssign.call(location, url);
            }
        });
        Object.defineProperty(location, 'replace', {
            configurable: true,
            value: function(url) {
                if (url && (url.includes('365scores') || url.includes('widgets.365scores'))) {
                    console.warn('Blocked location.replace to 365scores');
                    return;
                }
                return originalReplace.call(location, url);
            }
        });
        
        // 4. Function to remove any branding / powered-by elements and neutralise all links
        const eliminateBrandingAndNeutralizeLinks = () => {
            // Remove powered-by divs
            const poweredDivs = document.querySelectorAll('#powered-by, .powered-by, [id="powered-by"], div[id*="powered"], span[class*="powered"]');
            poweredDivs.forEach(el => {
                if (el) el.remove();
            });
            
            // Remove all anchor tags that point to 365scores
            const allLinks = document.querySelectorAll('a');
            allLinks.forEach(link => {
                const href = (link.getAttribute('href') || '').toLowerCase();
                const linkText = (link.innerText || '').toLowerCase();
                if (href.includes('365scores.com') || href.includes('365scores') || linkText.includes('365scores') || linkText.includes('powered by')) {
                    link.remove();
                    return;
                }
                // Remove href attribute from any link inside widget areas to prevent navigation but keep text
                if (link.closest('#standingsWidgetArea') || link.closest('#scoresWidgetArea') || link.closest('.widget-inner')) {
                    if (link.getAttribute('href') && link.getAttribute('href') !== 'javascript:void(0)') {
                        link.removeAttribute('href');
                        link.style.cursor = 'default';
                        link.setAttribute('aria-disabled', 'true');
                    }
                    // Also remove target
                    link.removeAttribute('target');
                    // Ensure no click navigation even if href is removed (just safety)
                    link.style.pointerEvents = 'auto'; // keep visual but no navigation because href removed
                }
            });
            
            // Remove any element that contains "Powered by" text (including fallbacks)
            const allElements = document.querySelectorAll('div, span, footer, small, p');
            allElements.forEach(el => {
                if (el.innerText && (el.innerText.toLowerCase().includes('powered by') || el.innerText.toLowerCase().includes('365scores.com'))) {
                    if (!el.querySelector('table') && !el.querySelector('.team-row')) {
                        el.remove();
                    }
                }
                if (el.className && typeof el.className === 'string' && 
                    (el.className.toLowerCase().includes('credit') || el.className.toLowerCase().includes('branding'))) {
                    el.remove();
                }
            });
        };
        
        // 5. MutationObserver to dynamically clean any injected branding / links after widget render
        const observer = new MutationObserver((mutations) => {
            let needsClean = false;
            for (const mutation of mutations) {
                if (mutation.addedNodes.length > 0 || mutation.type === 'attributes') {
                    needsClean = true;
                    break;
                }
            }
            if (needsClean) {
                eliminateBrandingAndNeutralizeLinks();
                // Also re-apply neutralization to any newly added anchor tags
                disableNewAnchors();
            }
        });
        
        const disableNewAnchors = () => {
            const newAnchors = document.querySelectorAll('#standingsWidgetArea a, #scoresWidgetArea a, .widget-inner a');
            newAnchors.forEach(anchor => {
                if (anchor.getAttribute('href') && !anchor.getAttribute('data-processed')) {
                    anchor.removeAttribute('href');
                    anchor.setAttribute('data-processed', 'true');
                    anchor.style.cursor = 'default';
                    anchor.removeAttribute('target');
                }
            });
        };
        
        // Start observing after DOM ready
        window.addEventListener('DOMContentLoaded', () => {
            observer.observe(document.body, {
                childList: true,
                subtree: true,
                attributes: true,
                attributeFilter: ['href', 'class', 'style']
            });
            eliminateBrandingAndNeutralizeLinks();
            disableNewAnchors();
        });
        
        // 6. Hide loading indicators when widgets content appears
        const checkStandingsReady = setInterval(() => {
            const standingsContainer = document.querySelector('[data-widget-type="entityStandings"]');
            const scoresContainer = document.querySelector('[data-widget-type="entityScores"]');
            
            let standingsHasContent = false;
            let scoresHasContent = false;
            
            if (standingsContainer && standingsContainer.children.length > 0) {
                standingsHasContent = true;
                const loadingStandings = document.getElementById('loadingStandings');
                if (loadingStandings) loadingStandings.style.display = 'none';
            }
            if (scoresContainer && (scoresContainer.children.length > 0 || scoresContainer.innerText.trim().length > 50)) {
                scoresHasContent = true;
                const loadingScores = document.getElementById('loadingScores');
                if (loadingScores) loadingScores.style.display = 'none';
            }
            
            // Also check for any table or standings rows inside widget areas
            if (!standingsHasContent && document.querySelector('#standingsWidgetArea table, #standingsWidgetArea .standings-table')) {
                const loadingStandings = document.getElementById('loadingStandings');
                if (loadingStandings) loadingStandings.style.display = 'none';
            }
            if (!scoresHasContent && document.querySelector('#scoresWidgetArea .score, #scoresWidgetArea .match-row')) {
                const loadingScores = document.getElementById('loadingScores');
                if (loadingScores) loadingScores.style.display = 'none';
            }
            
            // If both widgets loaded, we can clear interval eventually, but keep cleaning
            if (standingsHasContent && scoresHasContent) {
                clearInterval(checkStandingsReady);
            }
        }, 300);
        
        // Final timeout fallback: hide loaders after 5 seconds anyway
        setTimeout(() => {
            const loadStand = document.getElementById('loadingStandings');
            const loadScore = document.getElementById('loadingScores');
            if (loadStand) loadStand.style.display = 'none';
            if (loadScore) loadScore.style.display = 'none';
            eliminateBrandingAndNeutralizeLinks();
            disableNewAnchors();
        }, 5000);
        
        // 7. Additional aggressive CSS injection to hide any leftover branding and disable pointer events on external links
        const styleTag = document.createElement('style');
        styleTag.textContent = `
            #powered-by, .powered-by, [id*="powered"], [class*="powered"], [class*="attribution"], 
            a[href*="365scores"], a[href*="365scores.com"], .footer-credit, .branding-footer,
            div:has(> a[href*="365scores"]), span:has(> a[href*="365scores"]) {
                display: none !important;
                visibility: hidden !important;
                height: 0 !important;
                width: 0 !important;
                overflow: hidden !important;
                position: absolute !important;
                pointer-events: none !important;
                opacity: 0 !important;
            }
            /* Make sure any clickable link inside widget area does not navigate */
            .widget-inner a, #standingsWidgetArea a, #scoresWidgetArea a {
                pointer-events: none !important;
                cursor: default !important;
                text-decoration: none !important;
                color: inherit !important;
            }
            /* However we want scroll and internal interactions like hover on table rows but no actual link following */
            /* preserve table readability */
            .widget-inner td, .widget-inner th {
                pointer-events: auto;
            }
            /* any interactive element that is not a link remains usable */
            button, .button-like, .tab, .filter {
                pointer-events: auto;
            }
            /* Additional cleanup for iframe hidden (if any) */
            iframe[src*="365scores"] {
                display: none !important;
            }
        `;
        document.head.appendChild(styleTag);
        
        // 8. For any dynamically added widget scripts that might re-insert powered-by, run interval cleaner
        setInterval(() => {
            eliminateBrandingAndNeutralizeLinks();
            const allWidgetLinks = document.querySelectorAll('[data-widget-type] a');
            allWidgetLinks.forEach(link => {
                if (link.href && (link.href.includes('365scores') || link.getAttribute('href'))) {
                    link.removeAttribute('href');
                    link.style.pointerEvents = 'none';
                }
            });
        }, 1500);
        
        // 9. Also ensure that the original widget container does not produce any unexpected redirection via data-binding
        const blockDragAndDropRedirect = () => {
            document.querySelectorAll('[data-widget-type="entityStandings"], [data-widget-type="entityScores"]').forEach(el => {
                el.addEventListener('dragstart', (e) => { e.preventDefault(); return false; });
                el.addEventListener('drop', (e) => { e.preventDefault(); return false; });
            });
        };
        setTimeout(blockDragAndDropRedirect, 1000);
        
        // 10. Hide any possible floating credit badge that might appear after scroll
        const hideCreditBadge = () => {
            const possibleBadges = document.querySelectorAll('[class*="badge"], [class*="credit"], [class*="watermark"]');
            possibleBadges.forEach(badge => {
                if (badge.innerText && (badge.innerText.toLowerCase().includes('365') || badge.innerText.toLowerCase().includes('powered'))) {
                    badge.remove();
                }
            });
        };
        setInterval(hideCreditBadge, 2000);
        
        console.log('✅ Dual widget protection active: Standings (ID 104) + Scores (ID 8) — No redirects, no branding.');
    })();
</script>

<!-- Additional safety: ensure that any redundant powered-by divs (if created by script after our removal) are nuked -->
<noscript>
    <style>#powered-by{display:none;}</style>
</noscript>
</body>
</html>
