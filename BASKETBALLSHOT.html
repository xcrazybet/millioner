<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🏀 Basketball Shot - XCrazyBet</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            /* Primary Colors */
            --primary: #FF6B35;
            --primary-dark: #E55A2B;
            --secondary: #00A8E8;
            --secondary-dark: #0077B6;
            --success: #2ECC71;
            --danger: #FF5252;
            --warning: #FF9F1C;
            --info: #17A2B8;
            
            /* Background Colors */
            --bg-dark: #0A0F1E;
            --bg-medium: #1A1F2E;
            --bg-light: #2A2F3E;
            --bg-surface: rgba(30, 35, 50, 0.95);
            
            /* Text Colors */
            --text-primary: #FFFFFF;
            --text-secondary: #B0B7D6;
            --text-dim: #8A90B0;
            
            /* Court Colors */
            --court-wood: #D4A76A;
            --court-line: #FFFFFF;
            --court-rim: #FF9800;
            --court-net: #F5F5F5;
            
            /* Effects */
            --glow-gold: rgba(255, 215, 0, 0.7);
            --glow-blue: rgba(0, 168, 232, 0.7);
            --glow-red: rgba(255, 107, 53, 0.7);
            
            /* Shadows */
            --shadow-lg: 0 10px 30px rgba(0, 0, 0, 0.5);
            --shadow-md: 0 5px 15px rgba(0, 0, 0, 0.3);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Montserrat', 'Roboto', system-ui, -apple-system, sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--bg-dark) 0%, #151A2B 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            touch-action: manipulation;
        }

        /* Background Effects */
        .bg-effects {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: 
                radial-gradient(circle at 10% 20%, rgba(255, 107, 53, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 168, 232, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(255, 159, 28, 0.05) 0%, transparent 60%),
                linear-gradient(135deg, #0A0F1E 0%, #151A2B 100%);
        }

        /* Floating Particles */
        .particles {
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--primary);
            border-radius: 50%;
            animation: float 20s infinite linear;
        }

        @keyframes float {
            0% { transform: translateY(100vh) translateX(0) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100px) translateX(100px) rotate(360deg); opacity: 0; }
        }

        /* Game Container */
        .game-container {
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        .game-header {
            background: rgba(26, 31, 46, 0.95);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
            backdrop-filter: blur(10px);
            z-index: 1000;
            flex-shrink: 0;
            box-shadow: var(--shadow-lg);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .games-btn {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: white;
            font-size: 18px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: var(--shadow-md);
        }

        .games-btn:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 8px 25px rgba(255, 107, 53, 0.4);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: var(--shadow-md);
        }

        .logo-text {
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 0.5px;
        }

        .balance-display {
            background: linear-gradient(135deg, var(--bg-medium), var(--bg-light));
            padding: 10px 20px;
            border-radius: 15px;
            border: 2px solid var(--primary);
            color: var(--primary);
            font-weight: 700;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: var(--shadow-md);
            min-width: 160px;
            justify-content: center;
        }

        .balance-display i {
            font-size: 18px;
        }

        /* Recent Winners Feed */
        .winners-feed {
            background: rgba(26, 31, 46, 0.9);
            border-radius: 15px;
            padding: 15px;
            margin: 15px 20px;
            border: 1px solid rgba(255, 107, 53, 0.3);
            backdrop-filter: blur(10px);
            box-shadow: var(--shadow-md);
            flex-shrink: 0;
        }

        .winners-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 107, 53, 0.2);
        }

        .winners-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .winners-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 180px;
            overflow-y: auto;
        }

        .winner-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: rgba(42, 47, 62, 0.6);
            border-radius: 10px;
            border-left: 3px solid var(--primary);
            transition: all 0.3s;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .winner-item:hover {
            background: rgba(255, 107, 53, 0.1);
            transform: translateX(5px);
        }

        .winner-name {
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .winner-avatar {
            width: 30px;
            height: 30px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
        }

        .winner-amount {
            color: var(--success);
            font-weight: 700;
            font-size: 14px;
            background: rgba(46, 204, 113, 0.1);
            padding: 4px 10px;
            border-radius: 6px;
        }

        .winner-time {
            color: var(--text-dim);
            font-size: 12px;
            margin-top: 2px;
        }

        /* Main Game Area */
        .game-area {
            flex: 1;
            display: flex;
            padding: 0 20px 20px;
            gap: 20px;
            overflow: hidden;
            position: relative;
        }

        /* Court Container */
        .court-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            min-height: 500px;
        }

        /* Court Design */
        .court {
            width: 100%;
            height: 400px;
            background: linear-gradient(135deg, var(--court-wood) 0%, #C99A5C 100%);
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.6),
                inset 0 0 100px rgba(0, 0, 0, 0.3);
            border: 5px solid #8B6B3D;
        }

        /* Court Lines */
        .court::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            height: 90%;
            border: 3px solid var(--court-line);
            border-radius: 15px;
            opacity: 0.8;
        }

        .center-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            border: 3px solid var(--court-line);
            border-radius: 50%;
        }

        .free-throw-line {
            position: absolute;
            top: 50%;
            width: 60%;
            height: 3px;
            background: var(--court-line);
            opacity: 0.8;
        }

        .free-throw-line.left {
            left: 10%;
            transform: translateY(-50%);
        }

        .free-throw-line.right {
            right: 10%;
            transform: translateY(-50%);
        }

        /* Basketball Hoop */
        .hoop-container {
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }

        .hoop-backboard {
            width: 120px;
            height: 90px;
            background: rgba(255, 255, 255, 0.95);
            border: 5px solid #666;
            border-radius: 8px;
            position: relative;
            box-shadow: var(--shadow-lg);
        }

        .hoop-rim {
            width: 60px;
            height: 60px;
            border: 8px solid var(--court-rim);
            border-radius: 50%;
            position: absolute;
            bottom: -40px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 
                0 0 30px rgba(255, 152, 0, 0.8),
                inset 0 0 20px rgba(0, 0, 0, 0.3);
            animation: rimGlow 2s infinite alternate;
        }

        @keyframes rimGlow {
            0% { box-shadow: 0 0 20px rgba(255, 152, 0, 0.6); }
            100% { box-shadow: 0 0 40px rgba(255, 152, 0, 0.9); }
        }

        .hoop-net {
            width: 60px;
            height: 80px;
            position: absolute;
            bottom: -100px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(to bottom, transparent 0%, var(--court-net) 100%);
            clip-path: polygon(0% 0%, 100% 0%, 90% 100%, 10% 100%);
            opacity: 0.8;
        }

        /* Basketball */
        .basketball {
            width: 60px;
            height: 60px;
            background: radial-gradient(circle at 30% 30%, #FF6B35, #D45A2B);
            border-radius: 50%;
            position: absolute;
            top: 70%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            box-shadow: 
                0 10px 30px rgba(0, 0, 0, 0.5),
                inset -10px -10px 20px rgba(0, 0, 0, 0.3),
                inset 10px 10px 20px rgba(255, 255, 255, 0.1);
            transition: all 0.1s linear;
            cursor: pointer;
        }

        .basketball::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            height: 90%;
            border: 3px solid rgba(0, 0, 0, 0.2);
            border-radius: 50%;
        }

        /* Ball Path Line */
        .ball-path {
            position: absolute;
            top: 70%;
            left: 50%;
            width: 2px;
            height: 0;
            background: linear-gradient(to top, rgba(255, 107, 53, 0.3), transparent);
            transform-origin: bottom center;
            z-index: 5;
        }

        /* Shot Results Display */
        .shot-results {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(26, 31, 46, 0.95);
            padding: 15px 30px;
            border-radius: 15px;
            border: 2px solid var(--primary);
            backdrop-filter: blur(10px);
            box-shadow: var(--shadow-lg);
            z-index: 100;
            display: none;
            animation: popIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes popIn {
            0% { transform: translateX(-50%) scale(0); opacity: 0; }
            100% { transform: translateX(-50%) scale(1); opacity: 1; }
        }

        .shot-results.show {
            display: block;
        }

        .result-text {
            font-size: 24px;
            font-weight: 900;
            text-align: center;
            margin-bottom: 5px;
        }

        .result-swish {
            color: var(--success);
            text-shadow: 0 0 20px rgba(46, 204, 113, 0.7);
        }

        .result-miss {
            color: var(--danger);
            text-shadow: 0 0 20px rgba(255, 82, 82, 0.7);
        }

        .result-details {
            font-size: 14px;
            color: var(--text-secondary);
            text-align: center;
        }

        /* Multiplier Display */
        .multiplier-display {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(26, 31, 46, 0.95);
            padding: 20px;
            border-radius: 15px;
            border: 2px solid var(--secondary);
            backdrop-filter: blur(10px);
            box-shadow: var(--shadow-lg);
            text-align: center;
            min-width: 200px;
        }

        .multiplier-label {
            font-size: 14px;
            color: var(--text-dim);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .multiplier-value {
            font-size: 36px;
            font-weight: 900;
            color: var(--secondary);
            text-shadow: 0 0 20px rgba(0, 168, 232, 0.7);
            line-height: 1;
        }

        .multiplier-value.x10 { color: var(--warning); }
        .multiplier-value.x25 { color: var(--primary); }
        .multiplier-value.x50 { color: var(--glow-gold); }

        /* Shot Counter */
        .shot-counter {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(26, 31, 46, 0.95);
            padding: 15px;
            border-radius: 15px;
            border: 2px solid var(--warning);
            backdrop-filter: blur(10px);
            box-shadow: var(--shadow-lg);
            text-align: center;
        }

        .shot-label {
            font-size: 14px;
            color: var(--text-dim);
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .shot-number {
            font-size: 32px;
            font-weight: 900;
            color: var(--warning);
            line-height: 1;
        }

        .shot-total {
            font-size: 14px;
            color: var(--text-dim);
            margin-top: 2px;
        }

        /* Control Panel */
        .control-panel {
            width: 350px;
            background: rgba(26, 31, 46, 0.95);
            border-radius: 20px;
            padding: 25px;
            border: 2px solid rgba(255, 107, 53, 0.3);
            backdrop-filter: blur(10px);
            box-shadow: var(--shadow-lg);
            display: flex;
            flex-direction: column;
            gap: 20px;
            flex-shrink: 0;
        }

        /* Bet Controls */
        .bet-controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .bet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .bet-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .bet-amount-display {
            font-size: 24px;
            font-weight: 900;
            color: var(--text-primary);
            background: rgba(42, 47, 62, 0.6);
            padding: 10px 20px;
            border-radius: 10px;
            border: 2px solid var(--primary);
            text-align: center;
            transition: all 0.3s;
        }

        /* Quick Bets */
        .quick-bets {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 10px;
        }

        .quick-bet {
            padding: 12px;
            background: rgba(42, 47, 62, 0.6);
            border: 2px solid var(--primary);
            border-radius: 10px;
            color: var(--primary);
            font-weight: 700;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            user-select: none;
        }

        .quick-bet:hover, .quick-bet.active {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 107, 53, 0.4);
        }

        /* Bet Slider */
        .bet-slider-container {
            margin: 15px 0;
        }

        .bet-slider {
            width: 100%;
            height: 8px;
            -webkit-appearance: none;
            appearance: none;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            border-radius: 4px;
            outline: none;
        }

        .bet-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            background: white;
            border-radius: 50%;
            border: 3px solid var(--primary);
            cursor: pointer;
            box-shadow: var(--shadow-md);
        }

        .bet-limits {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-dim);
            margin-top: 5px;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            padding: 18px;
            border: none;
            border-radius: 15px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            user-select: none;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .btn-shoot {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            font-size: 20px;
            box-shadow: 0 10px 30px rgba(255, 107, 53, 0.3);
        }

        .btn-shoot:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(255, 107, 53, 0.5);
        }

        .btn-shoot:active:not(:disabled) {
            transform: translateY(-1px);
        }

        .btn-cashout {
            background: linear-gradient(135deg, var(--success), #27AE60);
            color: white;
            box-shadow: 0 10px 30px rgba(46, 204, 113, 0.3);
        }

        .btn-cashout:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(46, 204, 113, 0.5);
        }

        .btn-reset {
            background: linear-gradient(135deg, var(--bg-light), var(--bg-medium));
            color: var(--text-primary);
            border: 2px solid var(--text-dim);
        }

        .btn-reset:hover:not(:disabled) {
            transform: translateY(-3px);
            border-color: var(--primary);
        }

        /* Game Stats */
        .game-stats {
            background: rgba(42, 47, 62, 0.6);
            border-radius: 15px;
            padding: 20px;
            margin-top: 10px;
            border: 1px solid rgba(255, 107, 53, 0.2);
        }

        .stats-title {
            font-size: 14px;
            color: var(--text-dim);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-dim);
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
        }

        /* Fullscreen Toggle */
        .fullscreen-toggle {
            position: fixed;
            top: 90px;
            right: 20px;
            width: 44px;
            height: 44px;
            background: rgba(26, 31, 46, 0.9);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
            font-size: 18px;
            cursor: pointer;
            z-index: 1001;
            border: 2px solid var(--primary);
            backdrop-filter: blur(10px);
            box-shadow: var(--shadow-md);
            transition: all 0.3s;
        }

        .fullscreen-toggle:hover {
            background: var(--primary);
            transform: scale(1.1);
        }

        /* Result Overlay */
        .result-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .result-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .result-content {
            background: linear-gradient(135deg, var(--bg-medium), var(--bg-dark));
            padding: 40px;
            border-radius: 25px;
            border: 4px solid var(--primary);
            text-align: center;
            max-width: 400px;
            width: 90%;
            backdrop-filter: blur(20px);
            box-shadow: 
                0 0 60px rgba(255, 107, 53, 0.4),
                inset 0 0 40px rgba(0, 0, 0, 0.3);
            animation: overlayPopIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes overlayPopIn {

            return random < successProbability;

                    // Successful shot
                    gameState.shotsMade++;
                    gameState.currentMultiplier = getNextMultiplier();
                    gameState.canCashout = true;
                    gameState.cashoutAmount = winAmount;
                    
                    // Play swish sound
                    SoundManager.playSwish();
                    
                    // Show success result
                    showShotResult(true, winAmount);
                    
                    // Update UI
                    document.getElementById('shot-results').classList.add('show');
                    document.getElementById('result-text').textContent = 'SWISH!';
                    document.getElementById('result-text').className = 'result-text result-swish';
                    document.getElementById('result-details').textContent = `+$${winAmount.toFixed(2)}`;
                    
                    // Update multiplier display
                    document.getElementById('multiplier-value').textContent = gameState.currentMultiplier.toFixed(2) + 'x';
                    if (gameState.currentMultiplier >= 10) {
                        document.getElementById('multiplier-value').className = 'multiplier-value x10';
                    }
                    if (gameState.currentMultiplier >= 25) {
                        document.getElementById('multiplier-value').className = 'multiplier-value x25';
                    }
                    if (gameState.currentMultiplier >= 50) {
                        document.getElementById('multiplier-value').className = 'multiplier-value x50';
                    }
                    
                    // Enable cashout button
                    document.getElementById('cashout-btn').disabled = false;
                    
                    // Add to streak
                    gameState.currentStreak++;
                    if (gameState.currentStreak > gameState.bestStreak) {
                        gameState.bestStreak = gameState.currentStreak;
                    }
                    document.getElementById('current-streak').textContent = gameState.currentStreak;
                    
                    // Check if max shots reached
                    if (gameState.currentShot >= gameState.totalShots) {
                        setTimeout(() => {
                            cashout();
                        }, 1000);
                        return;
                    }
                    
                    // Prepare for next shot
                    gameState.currentShot++;
                    document.getElementById('shot-number').textContent = gameState.currentShot;
                    
                    // Re-enable shoot button after delay
                    setTimeout(() => {
                        document.getElementById('shoot-btn').disabled = false;
                        document.getElementById('shot-results').classList.remove('show');
                    }, 1500);
                    
                } else {
                    // Missed shot
                    SoundManager.playMiss();
                    
                    // Show miss result
                    showShotResult(false, 0);
                    
                    // Update UI
                    document.getElementById('shot-results').classList.add('show');
                    document.getElementById('result-text').textContent = 'MISS!';
                    document.getElementById('result-text').className = 'result-text result-miss';
                    document.getElementById('result-details').textContent = 'Better luck next time!';
                    
                    // End game
                    gameState.gameActive = false;
                    gameState.currentStreak = 0;
                    document.getElementById('current-streak').textContent = '0';
                    
                    // Update games played
                    gameState.gamesPlayed++;
                    document.getElementById('games-played').textContent = gameState.gamesPlayed;
                    
                    // Show final result
                    setTimeout(() => {
                        showFinalResult(false, 0);
                    }, 1500);
                }
                
            }, 1000); // Animation duration
        }

        async function cashout() {
            if (!gameState.gameActive || !gameState.canCashout) return;
            
            const winAmount = gameState.cashoutAmount;
            
            // Process win transaction
            const result = await processTransaction(
                winAmount,
                "basketball_win",
                `Basketball Shot win of $${winAmount.toFixed(2)} at ${gameState.currentMultiplier.toFixed(2)}x`
            );
            
            if (result.success) {
                SoundManager.playCashout();
                
                // Update current game
                gameState.currentGame.win = true;
                gameState.currentGame.winAmount = winAmount;
                gameState.currentGame.shotsMade = gameState.shotsMade;
                gameState.currentGame.multiplier = gameState.currentMultiplier;
                
                // Add to winners list
                addToWinners(gameState.currentUser.email?.split('@')[0] || 'Player', winAmount);
                
                // Show final result
                showFinalResult(true, winAmount);
                
                // Update games played
                gameState.gamesPlayed++;
                document.getElementById('games-played').textContent = gameState.gamesPlayed;
                
                // Save game history
                saveGameHistory();
                
            } else {
                showToast('Failed to process win', 'error');
            }
            
            // Reset game state
            gameState.gameActive = false;
            document.getElementById('shoot-btn').disabled = false;
            document.getElementById('cashout-btn').disabled = true;
        }

        function resetGame() {
            gameState.gameActive = false;
            gameState.currentShot = 1;
            gameState.shotsMade = 0;
            gameState.currentMultiplier = 1.00;
            gameState.currentMultiplierIndex = 0;
            gameState.canCashout = false;
            gameState.cashoutAmount = 0;
            
            // Update UI
            document.getElementById('shoot-btn').disabled = false;
            document.getElementById('cashout-btn').disabled = true;
            document.getElementById('shot-number').textContent = '1';
            document.getElementById('multiplier-value').textContent = '1.00x';
            document.getElementById('multiplier-value').className = 'multiplier-value';
            document.getElementById('shot-results').classList.remove('show');
            
            // Reset ball position
            const ball = document.getElementById('basketball');
            ball.style.top = '70%';
            ball.style.left = '50%';
            ball.style.transform = 'translate(-50%, -50%)';
            
            showToast('New game ready!', 'info');
        }

        // ===== ANIMATIONS =====
        function animateBallShot() {
            const ball = document.getElementById('basketball');
            const path = document.getElementById('ball-path');
            const hoopTop = 30; // Percentage from top
            
            // Calculate shot trajectory (random slight variation)
            const isSwish = Math.random() > 0.5;
            const targetX = 50 + (Math.random() * 10 - 5); // Random X position
            const targetY = hoopTop + 10; // Aim for just above hoop
            
            // Animate ball
            ball.style.transition = 'all 1s cubic-bezier(0.4, 0, 0.2, 1)';
            ball.style.top = targetY + '%';
            ball.style.left = targetX + '%';
            ball.style.transform = `translate(-50%, -50%) scale(0.9)`;
            
            // Animate path line
            path.style.height = Math.abs(70 - targetY) + '%';
            path.style.transform = `translateX(-50%) rotate(${Math.random() * 10 - 5}deg)`;
            
            // Reset after animation
            setTimeout(() => {
                ball.style.transition = 'all 0.5s ease-out';
                ball.style.top = '70%';
                ball.style.left = '50%';
                ball.style.transform = 'translate(-50%, -50%) scale(1)';
                path.style.height = '0';
            }, 1000);
        }

        function showShotResult(isSuccess, amount) {
            const results = document.getElementById('shot-results');
            const text = document.getElementById('result-text');
            const details = document.getElementById('result-details');
            
            if (isSuccess) {
                text.textContent = 'SWISH!';
                text.className = 'result-text result-swish';
                details.textContent = `+$${amount.toFixed(2)}`;
                
                // Add swish effect
                const effect = document.createElement('div');
                effect.className = 'swish-effect';
                effect.style.left = 'calc(50% - 50px)';
                effect.style.top = '30%';
                document.querySelector('.court-container').appendChild(effect);
                
                setTimeout(() => {
                    effect.remove();
                }, 1000);
            } else {
                text.textContent = 'MISS!';
                text.className = 'result-text result-miss';
                details.textContent = 'Better luck next time!';
                
                // Add bounce effect to ball
                const ball = document.getElementById('basketball');
                ball.classList.add('bounce-effect');
                setTimeout(() => {
                    ball.classList.remove('bounce-effect');
                }, 800);
            }
            
            results.classList.add('show');
        }

        function showFinalResult(isWin, amount) {
            const overlay = document.getElementById('result-overlay');
            const title = document.getElementById('result-title');
            const details = document.getElementById('result-details-overlay');
            const resultAmount = document.getElementById('result-amount');
            const shotsMade = document.getElementById('result-shots-made');
            
            if (isWin) {
                title.textContent = 'VICTORY!';
                SoundManager.playWin();
                resultAmount.textContent = `+$${amount.toFixed(2)}`;
                resultAmount.className = 'result-amount';
            } else {
                title.textContent = 'GAME OVER';
                SoundManager.playLose();
                resultAmount.textContent = `-$${gameState.currentGame.bet.toFixed(2)}`;
                resultAmount.className = 'result-amount lose';
            }
            
            shotsMade.textContent = gameState.shotsMade;
            details.innerHTML = `Made <span id="result-shots-made">${gameState.shotsMade}</span> shots`;
            
            overlay.classList.add('show');
        }

        // ===== WINNERS FEED =====
        function generateWinnersList() {
            const winnersList = document.getElementById('winners-list');
            winnersList.innerHTML = '';
            
            // Generate random winners
            for (let i = 0; i < 8; i++) {
                const randomName = gameState.winnerNames[Math.floor(Math.random() * gameState.winnerNames.length)];
                const randomAmount = Math.floor(Math.random() * 5000) + 100;
                const minutesAgo = Math.floor(Math.random() * 60) + 1;
                
                const winnerItem = document.createElement('div');
                winnerItem.className = 'winner-item';
                winnerItem.style.animationDelay = `${i * 0.1}s`;
                winnerItem.innerHTML = `
                    <div class="winner-name">
                        <div class="winner-avatar">${randomName.charAt(0)}</div>
                        ${randomName}
                    </div>
                    <div>
                        <div class="winner-amount">$${randomAmount.toLocaleString()}</div>
                        <div class="winner-time">${minutesAgo} min ago</div>
                    </div>
                `;
                
                winnersList.appendChild(winnerItem);
            }
            
            gameState.recentWinners = Array.from(winnersList.children);
        }

        function addToWinners(playerName, amount) {
            const winnersList = document.getElementById('winners-list');
            
            // Create new winner item
            const winnerItem = document.createElement('div');
            winnerItem.className = 'winner-item';
            winnerItem.innerHTML = `
                <div class="winner-name">
                    <div class="winner-avatar">${playerName.charAt(0)}</div>
                    ${playerName}
                </div>
                <div>
                    <div class="winner-amount">$${amount.toLocaleString()}</div>
                    <div class="winner-time">Just now</div>
                </div>
            `;
            
            // Add to top of list
            winnersList.insertBefore(winnerItem, winnersList.firstChild);
            
            // Remove oldest if more than 8
            if (winnersList.children.length > 8) {
                winnersList.removeChild(winnersList.lastChild);
            }
            
            // Update recent winners array
            gameState.recentWinners = Array.from(winnersList.children);
        }

        function startWinnersFeed() {
            // Update random winner every 30 seconds
            setInterval(() => {
                if (gameState.recentWinners.length > 0) {
                    const randomIndex = Math.floor(Math.random() * Math.min(3, gameState.recentWinners.length));
                    const winnerItem = gameState.recentWinners[randomIndex];
                    
                    if (winnerItem) {
                        const amountElement = winnerItem.querySelector('.winner-amount');
                        const timeElement = winnerItem.querySelector('.winner-time');
                        
                        if (amountElement && timeElement) {
                            // Update amount slightly
                            const currentAmount = parseInt(amountElement.textContent.replace(/[$,]/g, ''));
                            const newAmount = Math.max(100, currentAmount + Math.floor(Math.random() * 200 - 100));
                            amountElement.textContent = `$${newAmount.toLocaleString()}`;
                            
                            // Update time
                            const minutes = parseInt(timeElement.textContent) || 1;
                            timeElement.textContent = `${Math.min(60, minutes + 1)} min ago`;
                        }
                    }
                }
            }, 30000);
        }

        // ===== PARTICLE SYSTEM =====
        function setupParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 50;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                
                // Random position
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                
                // Random size
                const size = Math.random() * 3 + 1;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                
                // Random color
                const colors = ['#FF6B35', '#00A8E8', '#FF9F1C', '#2ECC71'];
                particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                particle.style.opacity = Math.random() * 0.3 + 0.1;
                
                // Random animation
                particle.style.animationDelay = Math.random() * 20 + 's';
                particle.style.animationDuration = Math.random() * 10 + 15 + 's';
                
                particlesContainer.appendChild(particle);
            }
        }

        // ===== UI FUNCTIONS =====
        function updateBetDisplay() {
            document.getElementById('bet-amount-display').textContent = `$${gameState.betAmount.toFixed(2)}`;
            document.getElementById('bet-slider').value = gameState.betAmount;
            
            // Update quick bet selection
            document.querySelectorAll('.quick-bet').forEach(btn => {
                btn.classList.toggle('active', parseFloat(btn.dataset.amount) === gameState.betAmount);
            });
        }

        function updateBetLimits() {
            const slider = document.getElementById('bet-slider');
            const maxBet = Math.min(gameState.balance, 1000);
            slider.max = maxBet;
            
            if (gameState.betAmount > maxBet) {
                gameState.betAmount = maxBet;
                updateBetDisplay();
            }
        }

        // ===== SAVE GAME HISTORY =====
        async function saveGameHistory() {
            try {
                const db = firebase.firestore();
                const gameRef = db.collection("basketball_games").doc();
                
                await gameRef.set({
                    userId: gameState.currentUser.uid,
                    betAmount: gameState.currentGame.bet,
                    shotsMade: gameState.currentGame.shotsMade,
                    win: gameState.currentGame.win,
                    winAmount: gameState.currentGame.winAmount,
                    multiplier: gameState.currentGame.multiplier,
                    gameId: gameState.currentGame.gameId,
                    timestamp: new Date(),
                    balanceBefore: gameState.balance - (gameState.currentGame.win ? -gameState.currentGame.winAmount : gameState.currentGame.bet),
                    balanceAfter: gameState.balance
                });
                
            } catch (error) {
                console.error('Error saving game history:', error);
            }
        }

        // ===== FULLSCREEN FUNCTIONS =====
        function setupFullscreen() {
            const toggleBtn = document.getElementById('fullscreen-toggle');
            const container = document.getElementById('game-container');
            
            toggleBtn.addEventListener('click', () => {
                if (!document.fullscreenElement) {
                    if (container.requestFullscreen) {
                        container.requestFullscreen();
                    } else if (container.webkitRequestFullscreen) {
                        container.webkitRequestFullscreen();
                    }
                    toggleBtn.innerHTML = '<i class="fas fa-compress"></i>';
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    } else if (document.webkitExitFullscreen) {
                        document.webkitExitFullscreen();
                    }
                    toggleBtn.innerHTML = '<i class="fas fa-expand"></i>';
                }
            });
            
            // Update button on fullscreen change
            document.addEventListener('fullscreenchange', updateFullscreenButton);
            document.addEventListener('webkitfullscreenchange', updateFullscreenButton);
        }
        
        function updateFullscreenButton() {
            const toggleBtn = document.getElementById('fullscreen-toggle');
            toggleBtn.innerHTML = document.fullscreenElement 
                ? '<i class="fas fa-compress"></i>' 
                : '<i class="fas fa-expand"></i>';
        }

        // ===== EVENT LISTENERS =====
        function setupEventListeners() {
            console.log("Setting up event listeners...");
            
            // Shoot button
            document.getElementById('shoot-btn').addEventListener('click', shootBall);
            
            // Cashout button
            document.getElementById('cashout-btn').addEventListener('click', cashout);
            
            // Reset button
            document.getElementById('reset-btn').addEventListener('click', resetGame);
            
            // Play again button
            document.getElementById('play-again-btn').addEventListener('click', () => {
                document.getElementById('result-overlay').classList.remove('show');
                resetGame();
            });
            
            // Quick bet buttons
            document.querySelectorAll('.quick-bet').forEach(btn => {
                btn.addEventListener('click', () => {
                    const amount = parseFloat(btn.dataset.amount);
                    gameState.betAmount = amount;
                    updateBetDisplay();
                });
            });
            
            // Bet slider
            document.getElementById('bet-slider').addEventListener('input', (e) => {
                gameState.betAmount = parseFloat(e.target.value);
                updateBetDisplay();
            });
            
            // Court selection
            document.querySelectorAll('.court-option').forEach(option => {
                option.addEventListener('click', () => {
                    document.querySelectorAll('.court-option').forEach(opt => {
                        opt.classList.remove('active');
                    });
                    option.classList.add('active');
                    
                    // Change court theme (visual only)
                    const court = document.querySelector('.court');
                    const theme = option.dataset.court;
                    
                    if (theme === 'street') {
                        court.style.background = 'linear-gradient(135deg, #2C3E50 0%, #34495E 100%)';
                        court.style.borderColor = '#7F8C8D';
                    } else if (theme === 'fantasy') {
                        court.style.background = 'linear-gradient(135deg, #6C5CE7 0%, #A29BFE 100%)';
                        court.style.borderColor = '#FD79A8';
                    } else {
                        court.style.background = 'linear-gradient(135deg, var(--court-wood) 0%, #C99A5C 100%)';
                        court.style.borderColor = '#8B6B3D';
                    }
                });
            });
            
            // Refresh winners
            document.getElementById('refresh-winners').addEventListener('click', generateWinnersList);
            
            // Setup fullscreen
            setupFullscreen();
            
            // Keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                if (e.code === 'Space' && !e.target.matches('input, textarea')) {
                    e.preventDefault();
                    shootBall();
                }
                if (e.code === 'Enter' && gameState.canCashout) {
                    e.preventDefault();
                    cashout();
                }
                if (e.code === 'Escape') {
                    resetGame();
                }
            });
            
            // Touch optimizations
            document.addEventListener('touchstart', handleTouch, { passive: true });
            
            console.log("✅ Event listeners setup complete!");
        }
        
        function handleTouch(e) {
            // Visual feedback for touch
            if (e.target.tagName === 'BUTTON' || e.target.classList.contains('quick-bet')) {
                e.target.style.transform = 'scale(0.95)';
                setTimeout(() => {
                    e.target.style.transform = '';
                }, 100);
            }
        }

        // ===== TOAST NOTIFICATIONS =====
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.add('show');
            }, 10);
            
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => {
                    if (container.contains(toast)) {
                        container.removeChild(toast);
                    }
                }, 300);
            }, 3000);
        }

        // ===== INITIAL SETUP =====
        setTimeout(() => {
            if (gameState.balance > 0) {
                updateBetLimits();
                showToast('🏀 Welcome to Basketball Shot! Place your bet and take the shot!', 'success');
            }
        }, 2000);

        console.log("🎮 Basketball Shot Game Ready!");
        console.log("💰 Real Money Integration: ACTIVE");
        console.log("🎯 House Edge: 90% lose rate");
        console.log("🏆 Live Winners Feed: ENABLED");
        console.log("🚀 Ready to play!");
    </script>
</body>
</html>
