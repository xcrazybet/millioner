name: Football Data Updater
on:
  schedule:
    - cron: '*/3 * * * *'  # Every 3 minutes
  push:
    branches: [ main ]

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      
      - name: Update Football Data
        run: |
          # Ping collector to run
          curl -s "https://xcrazybet.github.io/millioner/fot.html" > /dev/null
          echo "✅ Data updated at $(date)"
          
      - name: Commit updates
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add .
          git commit -m "Auto-update football data" || echo "No changes"
          git push
