            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        :root {
            --primary: #ffd700;
            --primary-glow: rgba(255, 215, 0, 0.8);
            --secondary: #ff3366;
            --gold-gradient: linear-gradient(135deg, #ffd700, #ffb347, #ff8c00);
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            background: #0a0508;
            font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif;
        }

        @keyframes bgMove {
            0% { background-position: 0% 0%; }
            100% { background-position: 100% 100%; }
        }

        @keyframes shake {
            0% { transform: translate(2px, 2px); }
            25% { transform: translate(-2px, -2px); }
            50% { transform: translate(2px, -2px); }
            75% { transform: translate(-2px, 2px); }
            100% { transform: translate(0, 0); }
        }

        @keyframes glowPulse {
            0% { box-shadow: 0 0 5px gold; }
            100% { box-shadow: 0 0 30px gold, 0 0 20px orange; }
        }

        /* Canvas Container */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* UI Overlay */
        .ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            pointer-events: none;
        }

        .ui-overlay > * {
            pointer-events: auto;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, rgba(0,0,0,0.9), rgba(20,10,30,0.95));
            backdrop-filter: blur(15px);

            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
            box-shadow: 0 5px 30px rgba(0,0,0,0.5);

        .logo {
            display: flex;
            align-items: center;

        }

        .logo i {
            font-size: 32px;
            color: var(--primary);
            filter: drop-shadow(0 0 10px rgba(255,215,0,0.5));
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { filter: drop-shadow(0 0 5px rgba(255,215,0,0.5)); }
            50% { filter: drop-shadow(0 0 20px rgba(255,215,0,0.8)); }
        }

        .logo h1 {
            font-size: 24px;
            font-weight: 800;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 2px;
        }

        .balance-card {
            background: linear-gradient(135deg, rgba(0,0,0,0.8), rgba(30,20,40,0.9));

            border-radius: 50px;
            border: 1px solid var(--primary);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .balance-card i {
            font-size: 20px;
            color: var(--primary);
        }

        .balance-card span {
            font-size: 22px;
            font-weight: 800;
            color: var(--primary);
            font-family: 'Orbitron', monospace;
        }

        .free-spins-badge {
            background: linear-gradient(135deg, #ff3366, #ff6680);
            padding: 5px 15px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: bold;
            color: white;
            margin-left: 10px;
        }

        /* Slot Machine */
        .slot-center {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .reels-wrapper {
            background: radial-gradient(circle, rgba(30,20,15,0.95), rgba(10,5,8,0.98));
            border-radius: 80px;
            padding: 25px 40px;
            box-shadow: 
                0 0 0 8px #3a2a18,
                0 0 0 12px #ffd700,
                0 20px 50px rgba(0,0,0,0.8),
                inset 0 0 50px rgba(255,215,0,0.2);
            position: relative;
        }

        .reels-container {
            display: flex;
            gap: 18px;
            position: relative;
        }

        .reel {
            width: min(130px, 30vw);
            height: min(390px, 85vw);
            background: linear-gradient(145deg, #2a1a10, #0f0a05);
            border-radius: 25px;

            transition: all 0.3s;

        .reel.spinning .symbol {
            filter: blur(3px);
            transition: filter 0.1s;
        }

        .reel-symbols {
            position: absolute;
            width: 100%;
            transition: transform 0.8s cubic-bezier(0.1, 0.9, 0.2, 1.05);

        .action-buttons {

        .spin-btn {

        .spin-btn:active {

        .spin-btn:disabled {

        }

        .game-status {
            text-align: center;
            padding: 12px;
            background: rgba(0,0,0,0.7);
            border-radius: 60px;
            font-weight: 600;
            font-size: 15px;
            color: var(--primary);
            border: 1px solid rgba(255,215,0,0.3);
        }

        /* Win Overlay */
        .win-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255,215,0,0.6), rgba(0,0,0,0.98));
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s;
            backdrop-filter: blur(12px);
        }

        .win-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .win-card {
            background: linear-gradient(145deg, #2a2a2a, #1a1a1a);
            padding: 45px 35px;
            border-radius: 80px;
            text-align: center;
            border: 4px solid var(--primary);

            max-width: 360px;

        @keyframes winExpand {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .win-amount {
            font-size: 56px;
            font-weight: 900;
            color: var(--primary);
            font-family: 'Orbitron', monospace;
            margin: 15px 0;
        }

        .toast-container {
            position: fixed;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3000;
            width: 90%;
            max-width: 320px;
            pointer-events: none;
        }

        .toast {
            padding: 12px 20px;
            background: rgba(0,0,0,0.95);
            border-radius: 60px;
            border-left: 5px solid #ffd700;
            color: white;
            backdrop-filter: blur(10px);
            text-align: center;
            animation: slideUp 0.3s ease;
            margin-bottom: 8px;
        }

        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .music-control {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 50px;
            height: 50px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 100;
            border: 2px solid #ffd700;
        }

        @media (max-width: 768px) {
            .reels-wrapper { padding: 15px 25px; }
            .reel { width: min(100px, 28vw); height: min(300px, 84vw); }
            .symbol { height: min(100px, 28vw); }
            .symbol img { width: 65%; height: 65%; }
            .spin-btn { padding: 12px 30px; font-size: 18px; }
            .bet-btn { padding: 6px 14px; font-size: 13px; min-width: 60px; }
            .logo h1 { font-size: 18px; }
        }
    </style>
</head>

            { name: 'wild', img: 'https://cdn-icons-png.flaticon.com/512/1068/1068649.png', multiplier: 0, isWild: true },
            { name: 'scatter', img: 'https://cdn-icons-png.flaticon.com/512/3135/3135715.png', multiplier: 0, isScatter: true }
        ];

            stop: new Audio('https://www.soundjay.com/misc/sounds/cash-register-01.mp3'),

            gameId: null,

        // ===== 3D SCENE =====
        function setup3DScene() {
            const container = document.getElementById('canvas-container');
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020208);
            scene.fog = new THREE.FogExp2(0x020208, 0.008);

            const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2.2, 9);
            camera.lookAt(0, 1, 0);

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            // Lights
            const ambientLight = new THREE.AmbientLight(0x332233);
            scene.add(ambientLight);
            const mainLight = new THREE.DirectionalLight(0xffccaa, 1.2);
            mainLight.position.set(5, 8, 5);
            mainLight.castShadow = true;
            scene.add(mainLight);
            const backLight = new THREE.PointLight(0xff66aa, 0.6);
            backLight.position.set(0, 2, -4);
            scene.add(backLight);
            
            // Floor
            const floorGeometry = new THREE.CircleGeometry(6, 32);
            const floorMaterial = new THREE.MeshStandardMaterial({ color: 0x1a0a1a, metalness: 0.7, roughness: 0.3 });
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.rotation.x = -Math.PI / 2;
            floor.position.y = -1.2;
            scene.add(floor);
            
            // Characters - Man (Right)
            const manGroup = new THREE.Group();
            const bodyGeo = new THREE.BoxGeometry(0.8, 1.2, 0.6);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x4a2a1a });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.6;
            manGroup.add(body);
            const headGeo = new THREE.SphereGeometry(0.45, 32, 32);
            const headMat = new THREE.MeshStandardMaterial({ color: 0xddaa77 });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 1.25;
            manGroup.add(head);
            manGroup.position.set(3.2, -0.2, 1.5);
            scene.add(manGroup);
            
            // Woman (Left)
            const womanGroup = new THREE.Group();
            const womanBodyGeo = new THREE.BoxGeometry(0.7, 1.1, 0.55);
            const womanBodyMat = new THREE.MeshStandardMaterial({ color: 0xc97e5a });
            const womanBody = new THREE.Mesh(womanBodyGeo, womanBodyMat);
            womanBody.position.y = 0.55;
            womanGroup.add(womanBody);
            const womanHeadGeo = new THREE.SphereGeometry(0.4, 32, 32);
            const womanHeadMat = new THREE.MeshStandardMaterial({ color: 0xeebb88 });
            const womanHead = new THREE.Mesh(womanHeadGeo, womanHeadMat);
            womanHead.position.y = 1.15;
            womanGroup.add(womanHead);
            womanGroup.position.set(-3.4, -0.2, 1.3);
            scene.add(womanGroup);
            
            // Particles
            const particleCount = 800;
            const particlesGeometry = new THREE.BufferGeometry();
            const particlesPositions = new Float32Array(particleCount * 3);
            for (let i = 0; i < particleCount; i++) {
                particlesPositions[i*3] = (Math.random() - 0.5) * 20;
                particlesPositions[i*3+1] = (Math.random() - 0.5) * 12;
                particlesPositions[i*3+2] = (Math.random() - 0.5) * 15 - 3;
            }
            particlesGeometry.setAttribute('position', new THREE.BufferAttribute(particlesPositions, 3));
            const particlesMaterial = new THREE.PointsMaterial({ color: 0xffaa44, size: 0.045, transparent: true, opacity: 0.4 });
            const particles = new THREE.Points(particlesGeometry, particlesMaterial);
            scene.add(particles);
            
            // Animation
            let time = 0;
            function animate() {
                requestAnimationFrame(animate);
                time += 0.012;
                manGroup.position.y = -0.2 + Math.sin(time * 1.5) * 0.02;
                womanGroup.position.y = -0.2 + Math.sin(time * 1.8) * 0.02;
                particles.rotation.y = time * 0.02;
                camera.position.x = Math.sin(time * 0.1) * 0.05;
                camera.lookAt(0, 0.8, 0);
                renderer.render(scene, camera);
            }
            animate();
            
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }
        setup3DScene();

        // ===== SLOT MANAGEMENT =====
        function initReels() {
            for (let i = 0; i < 3; i++) {
                const container = document.getElementById(`reel-symbols-${i}`);
                if (!container) continue;
                container.innerHTML = '';
                const symbols = [...SYMBOLS, ...SYMBOLS, ...SYMBOLS, ...SYMBOLS];
                for (let j = 0; j < 20; j++) {
                    const symbolDiv = document.createElement('div');
                    symbolDiv.className = 'symbol';
                    const symbol = symbols[j % symbols.length];
                    symbolDiv.innerHTML = `<img src="${symbol.img}" alt="${symbol.name}">`;
                    symbolDiv.dataset.name = symbol.name;
                    container.appendChild(symbolDiv);
                }
            }
        }
        
        function spinReelsWithDuration(duration) {
            const results = [];
            for (let reelIndex = 0; reelIndex < 3; reelIndex++) {
                const container = document.getElementById(`reel-symbols-${reelIndex}`);
                if (!container) continue;
                const symbols = container.children;
                const randomOffset = Math.floor(Math.random() * symbols.length);
                const finalSymbolName = symbols[randomOffset % symbols.length].dataset.name;
                results.push(finalSymbolName);
                const symbolHeight = window.innerWidth <= 768 ? (window.innerWidth <= 480 ? 90 : 100) : 130;
                const targetPosition = -(randomOffset * symbolHeight);
                container.style.transition = `transform ${duration/1000}s cubic-bezier(0.1, 0.9, 0.2, 1.05)`;
                container.style.transform = `translateY(${targetPosition}px)`;
            }
            return { results, promise: new Promise(resolve => setTimeout(resolve, duration)) };
        }
        
        function resetReels() {
            for (let i = 0; i < 3; i++) {
                const container = document.getElementById(`reel-symbols-${i}`);
                if (container) {
                    container.style.transition = 'none';
                    container.style.transform = 'translateY(0px)';
                    setTimeout(() => { container.style.transition = ''; }, 50);
                }
            }
        }
        
        function screenShake() {
            document.body.style.animation = 'shake 0.3s';
            setTimeout(() => document.body.style.animation = '', 300);
        }
        
        function highlightWinningSymbols(symbols) {
            document.querySelectorAll('.symbol').forEach(el => el.classList.remove('win'));
            setTimeout(() => {
                document.querySelectorAll('.symbol').forEach(el => {
                    if (symbols.includes(el.dataset.name)) {
                        el.classList.add('win');
                    }
                });
            }, 100);
        }
        
        // ===== ADVANCED WIN CALCULATION WITH WILD + SCATTER =====
        function calculateWin(betAmount, symbols) {
            const counts = {};
            symbols.forEach(s => counts[s] = (counts[s] || 0) + 1);
            const hasWild = symbols.includes('wild');
            const scatterCount = symbols.filter(s => s === 'scatter').length;
            
            // SCATTER BONUS
            if (scatterCount >= 3) {
                return { win: true, payout: betAmount * 5, multiplier: 5, message: '🎁 BONUS TRIGGERED! +10 FREE SPINS 🎁', bonus: true };
            }
            
            // JACKPOT (3 same OR wild combo)
            if (symbols[0] === symbols[1] && symbols[1] === symbols[2] || (hasWild && Object.keys(counts).length <= 2)) {
                const baseSymbol = symbols.find(s => s !== 'wild') || 'star';
                const symbolData = SYMBOLS.find(s => s.name === baseSymbol);
                const multiplier = symbolData ? symbolData.multiplier : 10;
                const finalMultiplier = Math.min(multiplier, 100);
                return { win: true, payout: betAmount * finalMultiplier, multiplier: finalMultiplier, message: `🔥 JACKPOT ${baseSymbol.toUpperCase()}! 🔥` };
            }
            
            // 2 MATCH
            if (Object.values(counts).some(v => v >= 2) || hasWild) {
                return { win: true, payout: betAmount * 2, multiplier: 2, message: '✨ Nice Match!' };
            }
            
            return { win: false, payout: 0, multiplier: 0, message: 'Try Again' };
        }
        
        // ===== FIREBASE =====
        async function processTransaction(amount, type, description) {
            try {
                const walletRef = db.collection("wallets").doc(gameState.currentUser.uid);
                return await db.runTransaction(async (transaction) => {
                    const walletDoc = await transaction.get(walletRef);
                    if (!walletDoc.exists) throw new Error("Wallet not found");
                    const currentBalance = walletDoc.data().balance || 0;
                    const newBalance = currentBalance + amount;
                    if (newBalance < 0) throw new Error("Insufficient funds");
                    transaction.update(walletRef, { balance: newBalance, updatedAt: new Date() });
                    gameState.balance = newBalance;
                    document.getElementById('balance').textContent = newBalance.toFixed(2);
                    return { success: true };
                });
            } catch (error) {
                showToast(error.message, 'error');
                return { success: false };
            }
        }
        
        async function loadBalance() {
            try {
                const doc = await db.collection("wallets").doc(gameState.currentUser.uid).get();
                if (doc.exists) {
                    gameState.balance = doc.data().balance || 0;
                } else {
                    await db.collection("wallets").doc(gameState.currentUser.uid).set({ balance: 5000, createdAt: new Date() });
                    gameState.balance = 5000;
                }
                document.getElementById('balance').textContent = gameState.balance.toFixed(2);
            } catch(e) { console.error(e); }
        }
        
        // ===== MAIN SPIN =====
        async function spin() {
            if (gameState.isSpinning) { showToast('Spin in progress...', 'warning'); return; }
            
            const betAmount = parseFloat(document.getElementById('bet-amount').value);
            if (isNaN(betAmount) || betAmount < 1) { showToast('Invalid bet amount!', 'error'); return; }
            
            // Free spins or real bet
            let isFreeSpin = false;
            if (gameState.freeSpins > 0) {
                isFreeSpin = true;
                gameState.freeSpins--;
                showToast(`🎰 FREE SPIN! ${gameState.freeSpins} remaining`, 'success');
            } else {
                if (betAmount > gameState.balance) { showToast('Insufficient balance!', 'error'); return; }
                const result = await processTransaction(-betAmount, "spin", `Spin: $${betAmount}`);
                if (!result.success) return;
            }
            
            gameState.isSpinning = true;
            const spinBtn = document.getElementById('spin-btn');
            spinBtn.disabled = true;
            spinBtn.innerHTML = '<i class="fas fa-sync-alt fa-spin"></i> SPINNING...';
            document.getElementById('game-status').innerHTML = '<i class="fas fa-sync-alt fa-spin"></i> SPINNING THE REELS...';
            
            // Add spinning class for blur effect
            document.querySelectorAll('.reel').forEach(r => r.classList.add('spinning'));
            
            // Play spin sound
            sounds.spin.currentTime = 0;
            sounds.spin.play().catch(e => console.log('Audio error'));
            
            resetReels();
            await new Promise(resolve => setTimeout(resolve, 100));
            
            const duration = 2800;
            const { results, promise } = spinReelsWithDuration(duration);
            await promise;
            
            // Stop sound
            sounds.stop.play().catch(e => console.log('Audio error'));
            
            // Remove spinning class
            document.querySelectorAll('.reel').forEach(r => r.classList.remove('spinning'));
            
            const winResult = calculateWin(betAmount, results);
            gameState.gameId = `fruit_${Date.now()}`;
            
            highlightWinningSymbols(results);
            
            if (winResult.win && winResult.payout > 0) {
                if (!isFreeSpin) {
                    await processTransaction(winResult.payout, "win", `Win: $${winResult.payout.toFixed(2)}`);
                }
                gameState.lastWin = winResult.payout;
                document.querySelector('.free-spins-info:last-child').innerHTML = `🏆 LAST WIN: $${winResult.payout.toFixed(2)}`;
                
                // Play win sound based on multiplier
                if (winResult.multiplier >= 50) {
                    sounds.jackpot.play().catch(e => console.log('Audio error'));
                    screenShake();
                } else {
                    sounds.win.play().catch(e => console.log('Audio error'));
                }
                
                showWinOverlay(winResult.payout, winResult.message);
                document.getElementById('game-status').innerHTML = `🎉 ${winResult.message} +$${winResult.payout.toFixed(2)} 🎉`;
                
                // Handle bonus free spins
                if (winResult.bonus) {
                    gameState.freeSpins += 10;
                    showToast(`🎁 10 FREE SPINS AWARDED! 🎁`, 'success');
                }
                
                if (window.navigator.vibrate) window.navigator.vibrate(300);
            } else {
                document.getElementById('game-status').innerHTML = `😢 ${winResult.message} ${isFreeSpin ? '(Free Spin)' : '-$' + betAmount.toFixed(2)}`;
                if (window.navigator.vibrate) window.navigator.vibrate(80);
            }
            
            // Update free spins display
            document.getElementById('free-spins-badge').innerHTML = `🎁 ${gameState.freeSpins} FREE SPINS`;
            document.getElementById('free-spins-info').innerHTML = `🎰 FREE SPINS: ${gameState.freeSpins}`;
            
            gameState.isSpinning = false;
            spinBtn.disabled = false;
            spinBtn.innerHTML = '<i class="fas fa-play"></i> SPIN';
            
            // Remove win highlights after delay
            setTimeout(() => {
                document.querySelectorAll('.symbol').forEach(el => el.classList.remove('win'));
            }, 1500);
        }
        
        function showWinOverlay(amount, message) {
            document.getElementById('win-title').textContent = message || 'WINNER!';
            document.getElementById('win-amount').textContent = `+$${amount.toFixed(2)}`;
            document.getElementById('win-overlay').classList.add('show');
            
            // Confetti
            for (let i = 0; i < 100; i++) {
                const confetti = document.createElement('div');
                confetti.style.position = 'fixed';
                confetti.style.width = '10px';
                confetti.style.height = '10px';
                confetti.style.backgroundColor = `hsl(${Math.random() * 360}, 100%, 60%)`;
                confetti.style.left = Math.random() * window.innerWidth + 'px';
                confetti.style.top = '-20px';
                confetti.style.pointerEvents = 'none';
                confetti.style.zIndex = '2000';
                confetti.style.animation = `fall ${Math.random() * 2 + 1}s linear forwards`;
                document.body.appendChild(confetti);
                setTimeout(() => confetti.remove(), 2000);
            }
        }
        
        const style = document.createElement('style');
        style.textContent = `@keyframes fall { to { transform: translateY(100vh) rotate(360deg); opacity: 0; } }`;
        document.head.appendChild(style);
        
        function showToast(message, type) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i> ${message}`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }
        
        // ===== AUTH =====
        auth.onAuthStateChanged(user => {
            if (!user) {
                showToast('Please login to play', 'error');
                setTimeout(() => window.location.href = 'https://xcrazybet.github.io/millioner/login.html', 2000);
                return;
            }
            gameState.currentUser = user;
            loadBalance();
            db.collection("wallets").doc(user.uid).onSnapshot(doc => {
                if (doc.exists) {
                    gameState.balance = doc.data().balance || 0;
                    document.getElementById('balance').textContent = gameState.balance.toFixed(2);
                }
            });
        });
        
        // ===== EVENT LISTENERS =====
        document.getElementById('spin-btn').addEventListener('click', spin);
        document.getElementById('close-win').addEventListener('click', () => {
            document.getElementById('win-overlay').classList.remove('show');
        });
        
        document.querySelectorAll('.bet-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const bet = parseFloat(btn.dataset.bet);
                document.getElementById('bet-amount').value = bet;
                gameState.betAmount = bet;
            });
        });
        
        document.getElementById('bet-amount').addEventListener('input', (e) => {
            let val = parseFloat(e.target.value) || 1;
            val = Math.max(1, Math.min(val, gameState.balance || 1000000));
            e.target.value = val;
            gameState.betAmount = val;
        });
        
        // Music control
        let musicEnabled = false;
        document.getElementById('music-control').addEventListener('click', () => {
            if (!musicEnabled) {
                musicEnabled = true;
                document.getElementById('music-control').innerHTML = '<i class="fas fa-volume-up"></i>';
                showToast('🎵 Sound Effects ON', 'success');
            } else {
                musicEnabled = false;
                document.getElementById('music-control').innerHTML = '<i class="fas fa-music"></i>';
                showToast('🔇 Sound Effects OFF', 'info');
            }
        });
        
        initReels();
    </script>
</body>
