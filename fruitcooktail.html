<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🍒 Fruit Cocktail - 3D Slot Machine | 1XBET</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Three.js for 3D Effects -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
            }
        }
    </script>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-touch-callout: none;
        }

        :root {
            --primary: #ffd700;
            --primary-dark: #ffb700;
            --secondary: #ff6b6b;
            --bg-dark: #0a0a0f;
            --gold-gradient: linear-gradient(135deg, #ffd700, #ffb347, #ff8c00);
            --silver-gradient: linear-gradient(135deg, #e8e8e8, #c0c0c0, #a8a8a8);
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            background: #000;
            font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif;
        }

        /* 3D Canvas Fullscreen */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* UI Overlay - Full Screen Touch Friendly */
        .ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.6) 100%);
            pointer-events: none;
        }

        .ui-overlay > * {
            pointer-events: auto;
        }

        /* Header - Touch Optimized */
        .header {
            background: rgba(10, 15, 26, 0.85);
            backdrop-filter: blur(20px);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            flex-wrap: wrap;
            gap: 10px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo i {
            font-size: 28px;
            color: var(--primary);
            text-shadow: 0 0 10px rgba(255,215,0,0.5);
        }

        .logo h1 {
            font-size: 20px;
            font-weight: 800;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 1px;
        }

        .balance-card {
            background: linear-gradient(135deg, rgba(0,0,0,0.8), rgba(30,30,50,0.9));
            padding: 8px 20px;
            border-radius: 40px;
            border: 1px solid var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(10px);
        }

        .balance-card i {
            font-size: 18px;
            color: var(--primary);
        }

        .balance-card span {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
            font-family: 'Orbitron', monospace;
        }

        /* Slot Machine - Touch Friendly */
        .slot-machine {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            min-height: 0;
        }

        .reels-container {
            display: flex;
            gap: 12px;
            background: linear-gradient(145deg, #2a1f0e, #1a1208);
            padding: 25px 30px;
            border-radius: 50px;
            box-shadow: 
                0 20px 40px rgba(0,0,0,0.5),
                inset 0 1px 0 rgba(255,255,255,0.1),
                0 0 0 8px #3a2a18,
                0 0 0 10px #ffd700;
            position: relative;
        }

        .reel {
            width: min(110px, 28vw);
            height: min(330px, 84vw);
            background: linear-gradient(145deg, #1e1a10, #0f0c08);
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            box-shadow: 
                inset 0 0 30px rgba(0,0,0,0.8),
                0 10px 20px rgba(0,0,0,0.3),
                0 0 0 3px #ffd700,
                0 0 0 5px #8b6b2d;
        }

        .reel-symbols {
            position: absolute;
            width: 100%;
            transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        .symbol {
            height: min(110px, 28vw);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: min(56px, 14vw);
            background: radial-gradient(circle at 30% 30%, #fff5e6, #ffe4c4);
            margin: 2px;
            border-radius: 12px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.1), 0 2px 5px rgba(255,255,255,0.2);
            text-shadow: 0 2px 5px rgba(0,0,0,0.2);
            cursor: pointer;
            transition: transform 0.2s;
        }

        .symbol:active {
            transform: scale(0.98);
        }

        /* Bet Panel - Touch Optimized */
        .bet-panel {
            background: rgba(10, 15, 26, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 30px 30px 0 0;
            padding: 20px;
            margin-top: auto;
            border-top: 2px solid var(--primary);
            box-shadow: 0 -10px 40px rgba(0,0,0,0.3);
        }

        .jackpot-display {
            background: linear-gradient(135deg, #2a1a0a, #1a0e04);
            border-radius: 20px;
            padding: 12px;
            margin-bottom: 15px;
            text-align: center;
            border: 1px solid var(--primary);
        }

        .jackpot-title {
            font-size: 12px;
            color: #a0a8c9;
            letter-spacing: 2px;
        }

        .jackpot-multipliers {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .jackpot-multiplier {
            background: linear-gradient(135deg, #ffd700, #ff9500);
            padding: 5px 12px;
            border-radius: 30px;
            font-weight: 800;
            font-size: 14px;
            color: #000;
            box-shadow: 0 0 10px rgba(255,215,0,0.5);
            animation: pulse-gold 2s infinite;
        }

        @keyframes pulse-gold {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.9; }
        }

        .bet-options {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .bet-btn {
            background: linear-gradient(135deg, #2a2a3a, #1a1a2a);
            border: 2px solid var(--primary);
            padding: 10px 18px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--primary);
            min-width: 70px;
            text-align: center;
            -webkit-tap-highlight-color: transparent;
        }

        .bet-btn:active {
            transform: scale(0.95);
            background: var(--gold-gradient);
            color: #000;
        }

        .bet-input-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .bet-input {
            background: rgba(0,0,0,0.6);
            border: 2px solid var(--primary);
            padding: 12px 20px;
            border-radius: 50px;
            color: var(--primary);
            font-size: 18px;
            font-weight: 700;
            text-align: center;
            width: 160px;
            font-family: 'Orbitron', monospace;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 15px;
        }

        .spin-btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: none;
            padding: 14px 35px;
            border-radius: 60px;
            font-size: 20px;
            font-weight: 800;
            color: #000;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            -webkit-tap-highlight-color: transparent;
        }

        .spin-btn:active {
            transform: scale(0.97);
        }

        .spin-btn:disabled {
            opacity: 0.5;
            transform: none;
        }

        .clear-btn {
            background: linear-gradient(135deg, #ff6b6b, #ff4757);
            border: none;
            padding: 14px 30px;
            border-radius: 60px;
            font-size: 18px;
            font-weight: 700;
            color: white;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .clear-btn:active {
            transform: scale(0.97);
        }

        .game-status {
            text-align: center;
            padding: 12px;
            background: rgba(0,0,0,0.6);
            border-radius: 50px;
            font-weight: 600;
            font-size: 14px;
            color: var(--primary);
        }

        /* Win Overlay - Touch Friendly */
        .win-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255,215,0,0.4), rgba(0,0,0,0.95));
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
        }

        .win-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .win-card {
            background: linear-gradient(145deg, #2a2a2a, #1a1a1a);
            padding: 40px 30px;
            border-radius: 60px;
            text-align: center;
            border: 3px solid var(--primary);
            animation: winPulse 0.4s ease-out;
            width: 85%;
            max-width: 320px;
        }

        @keyframes winPulse {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .win-card i {
            font-size: 50px;
            color: #ffd700;
        }

        .win-card h2 {
            font-size: 28px;
            margin: 15px 0;
            color: #ffd700;
        }

        .win-amount {
            font-size: 48px;
            font-weight: 800;
            color: var(--primary);
            font-family: 'Orbitron', monospace;
            margin: 15px 0;
        }

        .win-card .spin-btn {
            margin-top: 20px;
            padding: 12px 30px;
            font-size: 18px;
        }

        /* Toast Notifications */
        .toast-container {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3000;
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 90%;
            max-width: 300px;
            pointer-events: none;
        }

        .toast {
            padding: 12px 18px;
            background: rgba(0,0,0,0.9);
            border-radius: 50px;
            border-left: 4px solid var(--primary);
            color: white;
            backdrop-filter: blur(10px);
            font-size: 14px;
            text-align: center;
            animation: slideUp 0.3s ease-out;
            pointer-events: auto;
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* Touch Gesture Indicator */
        .touch-hint {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
            padding: 8px 12px;
            border-radius: 30px;
            font-size: 11px;
            color: var(--primary);
            z-index: 15;
            display: flex;
            align-items: center;
            gap: 6px;
            pointer-events: none;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .header {
                padding: 10px 15px;
            }
            
            .logo h1 {
                font-size: 16px;
            }
            
            .logo i {
                font-size: 22px;
            }
            
            .balance-card {
                padding: 6px 15px;
            }
            
            .balance-card span {
                font-size: 16px;
            }
            
            .reels-container {
                padding: 15px 20px;
                gap: 8px;
            }
            
            .bet-options {
                gap: 8px;
            }
            
            .bet-btn {
                padding: 8px 14px;
                font-size: 14px;
                min-width: 60px;
            }
            
            .bet-input {
                padding: 10px 15px;
                font-size: 16px;
                width: 130px;
            }
            
            .spin-btn {
                padding: 12px 25px;
                font-size: 18px;
            }
            
            .clear-btn {
                padding: 12px 20px;
                font-size: 16px;
            }
            
            .jackpot-multiplier {
                font-size: 11px;
                padding: 4px 10px;
            }
        }

        @media (max-width: 480px) {
            .reel {
                width: min(90px, 26vw);
                height: min(270px, 78vw);
            }
            
            .symbol {
                font-size: min(45px, 12vw);
                height: min(90px, 26vw);
            }
            
            .reels-container {
                padding: 12px 15px;
                gap: 6px;
            }
            
            .bet-btn {
                padding: 6px 10px;
                font-size: 12px;
                min-width: 55px;
            }
            
            .spin-btn {
                padding: 10px 20px;
                font-size: 16px;
            }
            
            .clear-btn {
                padding: 10px 18px;
                font-size: 14px;
            }
            
            .game-status {
                font-size: 12px;
                padding: 10px;
            }
            
            .win-card {
                padding: 30px 20px;
            }
            
            .win-amount {
                font-size: 36px;
            }
        }

        @media (max-width: 380px) {
            .bet-options {
                gap: 6px;
            }
            
            .bet-btn {
                padding: 5px 8px;
                font-size: 11px;
                min-width: 48px;
            }
            
            .jackpot-multipliers {
                gap: 5px;
            }
            
            .jackpot-multiplier {
                font-size: 10px;
                padding: 3px 8px;
            }
        }

        /* Prevent body scroll */
        body {
            overflow: hidden;
            position: fixed;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div class="ui-overlay">
        <header class="header">
            <div class="logo">
                <i class="fas fa-cocktail"></i>
                <h1>FRUIT COCKTAIL</h1>
            </div>
            <div class="balance-card" id="balance-card">
                <i class="fas fa-wallet"></i>

        <div class="slot-machine">
            <div class="reels-container" id="reels-container">
                <div class="reel" id="reel-0">
                    <div class="reel-symbols" id="reel-symbols-0"></div>
                </div>
                <div class="reel" id="reel-1">
                    <div class="reel-symbols" id="reel-symbols-1"></div>
                </div>
                <div class="reel" id="reel-2">
                    <div class="reel-symbols" id="reel-symbols-2"></div>
                </div>
            </div>
        </div>

        <div class="bet-panel">
            <div class="jackpot-display">
                <div class="jackpot-title">🏆 JACKPOT MULTIPLIERS 🏆</div>
                <div class="jackpot-multipliers">
                    <div class="jackpot-multiplier">x100</div>
                    <div class="jackpot-multiplier">x70</div>
                    <div class="jackpot-multiplier">x50</div>
                    <div class="jackpot-multiplier">x20</div>
                    <div class="jackpot-multiplier">x10</div>
                    <div class="jackpot-multiplier">x5</div>
                    <div class="jackpot-multiplier">x2</div>
                </div>
            </div>

            <div class="bet-options" id="bet-options">
                <div class="bet-btn" data-bet="600">600</div>
                <div class="bet-btn" data-bet="300">300</div>
                <div class="bet-btn" data-bet="2000">2000</div>
                <div class="bet-btn" data-bet="4000">4000</div>
                <div class="bet-btn" data-bet="10000">10000</div>
                <div class="bet-btn" data-bet="40000">40000</div>
                <div class="bet-btn" data-bet="200000">200000</div>
            </div>

            <div class="bet-input-group">
                <input type="number" id="bet-amount" class="bet-input" value="600" min="1" step="1" inputmode="numeric">
            </div>

            <div class="action-buttons">
                <button id="spin-btn" class="spin-btn">
                    <i class="fas fa-play"></i> SPIN
                </button>
                <button id="clear-btn" class="clear-btn">
                    <i class="fas fa-trash"></i> CLEAR
                </button>
            </div>

            <div class="game-status" id="game-status">
                🍒 Tap SPIN to play! 🍊
            </div>
        </div>
    </div>

    <div class="touch-hint">
        <i class="fas fa-hand-pointer"></i>
        <span>Tap to spin</span>
    </div>

    <div class="win-overlay" id="win-overlay">
        <div class="win-card">
            <i class="fas fa-trophy"></i>
            <h2 id="win-title">WINNER!</h2>
            <div class="win-amount" id="win-amount">+$0</div>
            <button id="close-win" class="spin-btn">CONTINUE</button>
        </div>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.128.0/build/three.module.js';

        // ===== FIREBASE CONFIG =====
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ===== FRUIT SYMBOLS =====
        const SYMBOLS = ['🍒', '🍋', '🍊', '🍇', '🍉', '⭐', '🍓', '🍑'];
        const SYMBOL_MULTIPLIERS = {
            '🍒': 2, '🍋': 3, '🍊': 5, '🍇': 10, '🍉': 20, '⭐': 100, '🍓': 8, '🍑': 12
        };

        // ===== GAME STATE =====
        const gameState = {
            currentUser: null,
            balance: 0,
            betAmount: 600,
            isSpinning: false,
            gameId: null,
            winProbability: 0.10,
            houseEdge: 0.90,
            bonusSystem: { roundsPlayed: 0, roundsForBonus: 25, bonusAmount: 5, bonusEarned: false },
            gameHistory: []
        };

        // ===== 3D SCENE SETUP =====
        function setup3DScene() {
            const container = document.getElementById('canvas-container');
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050510);
            scene.fog = new THREE.FogExp2(0x050510, 0.01);

            const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.5, 8);
            camera.lookAt(0, 0.5, 0);

            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            // Lights
            const ambientLight = new THREE.AmbientLight(0x404060);
            scene.add(ambientLight);
            
            const mainLight = new THREE.DirectionalLight(0xffeedd, 1);
            mainLight.position.set(5, 10, 7);
            mainLight.castShadow = true;
            scene.add(mainLight);
            
            const backLight = new THREE.PointLight(0xffaa66, 0.5);
            backLight.position.set(0, 2, -3);
            scene.add(backLight);
            
            const fillLight = new THREE.PointLight(0x66aaff, 0.3);
            fillLight.position.set(-2, 1, 4);
            scene.add(fillLight);
            
            const colorLight = new THREE.PointLight(0xff66aa, 0.2);
            colorLight.position.set(3, 1, 2);
            scene.add(colorLight);

            // Floating particles
            const particleCount = 800;
            const particlesGeometry = new THREE.BufferGeometry();
            const particlesPositions = new Float32Array(particleCount * 3);
            for (let i = 0; i < particleCount; i++) {
                particlesPositions[i*3] = (Math.random() - 0.5) * 35;
                particlesPositions[i*3+1] = (Math.random() - 0.5) * 20;
                particlesPositions[i*3+2] = (Math.random() - 0.5) * 20 - 5;
            }
            particlesGeometry.setAttribute('position', new THREE.BufferAttribute(particlesPositions, 3));
            const particlesMaterial = new THREE.PointsMaterial({ color: 0xffaa44, size: 0.04, transparent: true, opacity: 0.4 });
            const particles = new THREE.Points(particlesGeometry, particlesMaterial);
            scene.add(particles);

            // Rotating rings
            const ringGeometry = new THREE.TorusGeometry(1.8, 0.04, 64, 200);
            const ringMaterial = new THREE.MeshStandardMaterial({ color: 0xffaa44, emissive: 0x442200, metalness: 0.8, roughness: 0.2 });
            const ring = new THREE.Mesh(ringGeometry, ringMaterial);
            ring.position.y = -0.2;
            scene.add(ring);
            
            const ring2Geometry = new THREE.TorusGeometry(2.2, 0.03, 64, 200);
            const ring2Material = new THREE.MeshStandardMaterial({ color: 0xff66aa, emissive: 0x331133, metalness: 0.7 });
            const ring2 = new THREE.Mesh(ring2Geometry, ring2Material);
            ring2.position.y = -0.2;
            scene.add(ring2);

            // Animation
            let time = 0;
            function animate() {
                requestAnimationFrame(animate);
                time += 0.012;
                
                particles.rotation.y = time * 0.03;
                particles.rotation.x = Math.sin(time * 0.08) * 0.1;
                ring.rotation.x = Math.sin(time * 0.6) * 0.3;
                ring.rotation.z = time * 0.2;
                ring.rotation.y = time * 0.15;
                ring2.rotation.x = Math.sin(time * 0.5) * 0.4;
                ring2.rotation.z = time * -0.18;
                
                camera.position.x = Math.sin(time * 0.1) * 0.08;
                camera.lookAt(0, 0.6, 0);
                
                renderer.render(scene, camera);
            }
            animate();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        setup3DScene();

        // ===== SLOT REEL MANAGEMENT =====
        function initReels() {
            for (let i = 0; i < 3; i++) {
                const container = document.getElementById(`reel-symbols-${i}`);
                if (!container) continue;
                container.innerHTML = '';
                const symbols = [...SYMBOLS, ...SYMBOLS, ...SYMBOLS, ...SYMBOLS];
                for (let j = 0; j < 16; j++) {
                    const symbolDiv = document.createElement('div');
                    symbolDiv.className = 'symbol';
                    symbolDiv.textContent = symbols[j % symbols.length];
                    container.appendChild(symbolDiv);
                }
            }
        }

        function spinReels() {
            const reels = [0, 1, 2];
            const results = [];
            
            reels.forEach(reelIndex => {
                const container = document.getElementById(`reel-symbols-${reelIndex}`);
                if (!container) return;
                const symbols = container.children;
                const randomOffset = Math.floor(Math.random() * symbols.length);
                const finalSymbol = symbols[randomOffset % symbols.length].textContent;
                results.push(finalSymbol);
                
                const symbolHeight = window.innerWidth <= 480 ? 90 : 110;
                const targetPosition = -(randomOffset * (window.innerWidth <= 480 ? 90 : 110));
                container.style.transform = `translateY(${targetPosition}px)`;
            });
            
            return results;
        }

        function resetReels() {
            for (let i = 0; i < 3; i++) {
                const container = document.getElementById(`reel-symbols-${i}`);
                if (container) {
                    container.style.transform = 'translateY(0px)';
                }
            }
        }

        // ===== WIN CALCULATION (90% Lose Rate) =====
        function calculateWin(betAmount, symbols) {
            const randomFactor = Math.random();
            
            // 90% lose rate - only 10% chance to win
            if (randomFactor > 0.10) {
                // 5% chance for small hook win to keep engagement
                if (randomFactor > 0.85 && randomFactor <= 0.90) {
                    const smallWin = betAmount * 0.5;
                    return { win: true, payout: smallWin, multiplier: 0.5, message: '✨ Close Call! ✨' };
                }
                return { win: false, payout: 0, multiplier: 0, message: '😢 Try Again!' };
            }
            
            // 10% actual win chance
            const allSame = symbols[0] === symbols[1] && symbols[1] === symbols[2];
            if (allSame) {
                let multiplier = SYMBOL_MULTIPLIERS[symbols[0]] || 5;
                if (multiplier > 100) multiplier = 100;
                const payout = betAmount * multiplier;
                return { win: true, payout: payout, multiplier: multiplier, message: `🎰 JACKPOT! ${symbols[0]} x3 🎰` };
            }
            
            // Two of a kind
            if (symbols[0] === symbols[1] || symbols[1] === symbols[2] || symbols[0] === symbols[2]) {
                const matchedSymbol = symbols[0] === symbols[1] ? symbols[0] : symbols[1] === symbols[2] ? symbols[1] : symbols[0];
                let multiplier = SYMBOL_MULTIPLIERS[matchedSymbol] / 2 || 2;
                if (multiplier < 1) multiplier = 1;
                const payout = betAmount * multiplier;
                return { win: true, payout: payout, multiplier: multiplier, message: `🎉 ${matchedSymbol} ${matchedSymbol}! 🎉` };
            }
            
            return { win: false, payout: 0, multiplier: 0, message: '😭 No Match!' };
        }

        // ===== FIREBASE FUNCTIONS =====
        async function processTransaction(amount, type, description) {
            try {
                const walletRef = db.collection("wallets").doc(gameState.currentUser.uid);
                return await db.runTransaction(async (transaction) => {
                    const walletDoc = await transaction.get(walletRef);
                    if (!walletDoc.exists) throw new Error("Wallet not found");
                    
                    const currentBalance = walletDoc.data().balance || 0;
                    const newBalance = currentBalance + amount;
                    if (newBalance < 0) throw new Error("Insufficient funds");
                    
                    transaction.update(walletRef, { balance: newBalance, updatedAt: new Date() });
                    
                    const transactionRef = walletRef.collection("transactions").doc();
                    transaction.set(transactionRef, {
                        type, amount, description, createdAt: new Date(),
                        gameId: gameState.gameId, beforeBalance: currentBalance, afterBalance: newBalance
                    });
                    
                    gameState.balance = newBalance;
                    document.getElementById('balance').textContent = newBalance.toFixed(2);
                    return { success: true, newBalance };
                });
            } catch (error) {
                showToast(error.message, 'error');
                return { success: false };
            }
        }

        async function updateBonusProgress() {
            gameState.bonusSystem.roundsPlayed++;
            if (gameState.bonusSystem.roundsPlayed >= gameState.bonusSystem.roundsForBonus && !gameState.bonusSystem.bonusEarned) {
                gameState.bonusSystem.bonusEarned = true;
                gameState.bonusSystem.roundsPlayed = 0;
                await processTransaction(gameState.bonusSystem.bonusAmount, "bonus", "Round completion bonus");
                showToast(`🎁 BONUS! +$${gameState.bonusSystem.bonusAmount}`, 'success');
            }
            try {
                await db.collection("fruit_bonus").doc(gameState.currentUser.uid).set(gameState.bonusSystem);
            } catch(e) {}
        }

        // ===== MAIN GAME ACTION =====
        async function spin() {
            if (gameState.isSpinning) {
                showToast('Spin in progress...', 'warning');
                return;
            }
            
            const betAmount = parseFloat(document.getElementById('bet-amount').value);
            if (isNaN(betAmount) || betAmount < 1) {
                showToast('Invalid bet amount!', 'error');
                return;
            }
            
            if (betAmount > gameState.balance) {
                showToast('Insufficient balance!', 'error');
                return;
            }
            
            gameState.betAmount = betAmount;
            
            const result = await processTransaction(-betAmount, "spin", `Fruit Cocktail spin: $${betAmount}`);
            if (!result.success) return;
            
            gameState.isSpinning = true;
            const spinBtn = document.getElementById('spin-btn');
            spinBtn.disabled = true;
            spinBtn.innerHTML = '<i class="fas fa-sync-alt fa-spin"></i> SPINNING...';
            document.getElementById('game-status').innerHTML = '<i class="fas fa-sync-alt fa-spin"></i> Spinning the fruits...';
            
            resetReels();
            await new Promise(resolve => setTimeout(resolve, 80));
            
            const symbols = spinReels();
            await new Promise(resolve => setTimeout(resolve, 700));
            
            const winResult = calculateWin(betAmount, symbols);
            gameState.gameId = `fruit_${Date.now()}_${Math.random().toString(36).substr(2, 6)}`;
            
            if (winResult.win && winResult.payout > 0) {
                await processTransaction(winResult.payout, "win", `Fruit Cocktail win: $${winResult.payout.toFixed(2)} (${winResult.multiplier}x)`);
                showWinOverlay(winResult.payout, winResult.message);
                document.getElementById('game-status').innerHTML = `🎉 ${winResult.message} +$${winResult.payout.toFixed(2)} 🎉`;
                vibrateDevice(200);
            } else {
                document.getElementById('game-status').innerHTML = `😢 ${winResult.message} Lost $${betAmount.toFixed(2)}`;
                vibrateDevice(50);
            }
            
            await updateBonusProgress();
            
            gameState.isSpinning = false;
            spinBtn.disabled = false;
            spinBtn.innerHTML = '<i class="fas fa-play"></i> SPIN';
        }

        function showWinOverlay(amount, message) {
            document.getElementById('win-title').textContent = message || 'WINNER!';
            document.getElementById('win-amount').textContent = `+$${amount.toFixed(2)}`;
            document.getElementById('win-overlay').classList.add('show');
            
            // Confetti effect
            for (let i = 0; i < 60; i++) {
                const confetti = document.createElement('div');
                confetti.style.position = 'fixed';
                confetti.style.width = '8px';
                confetti.style.height = '8px';
                confetti.style.backgroundColor = `hsl(${Math.random() * 360}, 100%, 60%)`;
                confetti.style.left = Math.random() * window.innerWidth + 'px';
                confetti.style.top = '-20px';
                confetti.style.pointerEvents = 'none';
                confetti.style.zIndex = '2000';
                confetti.style.animation = `fall ${Math.random() * 2 + 1}s linear forwards`;
                document.body.appendChild(confetti);
                setTimeout(() => confetti.remove(), 2000);
            }
        }
        
        function vibrateDevice(duration) {
            if (window.navigator && window.navigator.vibrate) {
                window.navigator.vibrate(duration);
            }
        }
        
        const style = document.createElement('style');
        style.textContent = `@keyframes fall { to { transform: translateY(100vh) rotate(360deg); opacity: 0; } }`;
        document.head.appendChild(style);

        function showToast(message, type) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast`;
            const icon = type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle';
            toast.innerHTML = `<i class="fas ${icon}" style="margin-right: 8px;"></i> ${message}`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }

        // ===== AUTH & BALANCE =====
        async function loadBalance() {
            try {
                const doc = await db.collection("wallets").doc(gameState.currentUser.uid).get();
                if (doc.exists) {
                    gameState.balance = doc.data().balance || 0;
                    document.getElementById('balance').textContent = gameState.balance.toFixed(2);
                } else {
                    await db.collection("wallets").doc(gameState.currentUser.uid).set({ balance: 1000, createdAt: new Date() });
                    gameState.balance = 1000;
                    document.getElementById('balance').textContent = '1000.00';
                }
            } catch(e) { console.error(e); }
        }

        auth.onAuthStateChanged(user => {
            if (!user) {
                showToast('Please login to play', 'error');
                setTimeout(() => window.location.href = 'https://xcrazybet.github.io/millioner/login.html', 2000);
                return;
            }
            gameState.currentUser = user;
            loadBalance();
            
            db.collection("wallets").doc(user.uid).onSnapshot(doc => {
                if (doc.exists) {
                    gameState.balance = doc.data().balance || 0;
                    document.getElementById('balance').textContent = gameState.balance.toFixed(2);
                }
            });
        });

        // ===== EVENT LISTENERS - TOUCH OPTIMIZED =====
        document.getElementById('spin-btn').addEventListener('click', (e) => {
            e.preventDefault();
            spin();
        });
        
        document.getElementById('clear-btn').addEventListener('click', (e) => {
            e.preventDefault();
            resetReels();
            showToast('Reels reset', 'info');
        });
        
        document.getElementById('close-win').addEventListener('click', () => {
            document.getElementById('win-overlay').classList.remove('show');
        });
        
        // Touch friendly bet buttons
        document.querySelectorAll('.bet-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                const bet = parseFloat(btn.dataset.bet);
                document.getElementById('bet-amount').value = bet;
                gameState.betAmount = bet;
                btn.style.transform = 'scale(0.95)';
                setTimeout(() => { btn.style.transform = ''; }, 150);
            });
            
            btn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const bet = parseFloat(btn.dataset.bet);
                document.getElementById('bet-amount').value = bet;
                gameState.betAmount = bet;
                btn.style.transform = 'scale(0.95)';
                setTimeout(() => { btn.style.transform = ''; }, 150);
            });
        });
        
        document.getElementById('bet-amount').addEventListener('input', (e) => {
            let val = parseFloat(e.target.value) || 1;
            val = Math.max(1, Math.min(val, gameState.balance || 1000000));
            e.target.value = val;
            gameState.betAmount = val;
        });
        
        // Touch gesture for reels (tap to spin)
        const reelsContainer = document.getElementById('reels-container');
        if (reelsContainer) {
            reelsContainer.addEventListener('touchstart', (e) => {
                if (!gameState.isSpinning) {
                    spin();
                }
            });
            reelsContainer.addEventListener('click', (e) => {
                if (!gameState.isSpinning && e.target === reelsContainer || e.target.classList.contains('reel')) {
                    spin();
                }
            });
        }
        
        initReels();
        
        // Prevent zoom on double tap
        document.addEventListener('touchstart', (e) => {
            if (e.touches.length > 1) {
                e.preventDefault();
            }
        }, { passive: false });
        
        // Update viewport height for mobile
        function updateVH() {
            let vh = window.innerHeight * 0.01;
            document.documentElement.style.setProperty('--vh', `${vh}px`);
        }
        updateVH();
        window.addEventListener('resize', updateVH);
    </script>
</body>
</html>
