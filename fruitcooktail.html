<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🍒 Fruit Cocktail - 3D Slot Machine | 1XBET</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Three.js for 3D Effects -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
            }
        }
    </script>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800&display=swap');
        
        :root {
            --primary: #ffd700;
            --primary-dark: #ffb700;
            --secondary: #ff6b6b;
            --secondary-dark: #ff4757;
            --danger: #ff5252;
            --success: #4caf50;
            --warning: #ffc107;
            --bg: #0a0f1a;
            --surface: rgba(20, 28, 40, 0.95);
            --surface-light: rgba(30, 40, 55, 0.95);
            --text: #ffffff;
            --text-dim: #a0a8c9;
            --gold: linear-gradient(135deg, #ffd700, #ffb700, #ff9500);
            --silver: linear-gradient(135deg, #e0e0e0, #c0c0c0, #a0a0a0);
            --bronze: linear-gradient(135deg, #cd7f32, #b87333, #a55d2a);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            font-family: 'Poppins', 'Orbitron', sans-serif;
        }

        body {
            background: #000000;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* 3D Canvas Container */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* UI Overlay */
        .ui-overlay {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.7) 100%);
        }

        /* Header */
        .header {
            background: rgba(10, 15, 26, 0.9);
            backdrop-filter: blur(20px);
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo h1 {
            font-size: 28px;
            font-weight: 800;
            background: var(--gold);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 2px;
        }

        .logo i {
            font-size: 32px;
            color: var(--primary);
            text-shadow: 0 0 10px rgba(255,215,0,0.5);
        }

        .balance-card {
            background: linear-gradient(135deg, rgba(0,0,0,0.8), rgba(30,30,50,0.9));
            padding: 10px 25px;
            border-radius: 50px;
            border: 1px solid var(--primary);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .balance-card i {
            font-size: 24px;
            color: var(--primary);
        }

        .balance-card span {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
            font-family: 'Orbitron', monospace;
        }

        /* Slot Machine Container */
        .slot-machine {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 60vh;
            padding: 40px 20px;
            perspective: 1200px;
        }

        .reels-container {
            display: flex;
            gap: 20px;
            background: linear-gradient(145deg, #2a1f0e, #1a1208);
            padding: 40px 50px;
            border-radius: 60px;
            box-shadow: 
                0 30px 50px rgba(0,0,0,0.5),
                inset 0 1px 0 rgba(255,255,255,0.1),
                0 0 0 10px #3a2a18,
                0 0 0 12px #ffd700;
            position: relative;
        }

        .reels-container::before {
            content: '';
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            border-radius: 50px;
            background: radial-gradient(circle at center, rgba(255,215,0,0.1), transparent);
            pointer-events: none;
        }

        .reel {
            width: 140px;
            height: 420px;
            background: linear-gradient(145deg, #1e1a10, #0f0c08);
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            box-shadow: 
                inset 0 0 30px rgba(0,0,0,0.8),
                0 10px 20px rgba(0,0,0,0.3),
                0 0 0 3px #ffd700,
                0 0 0 5px #8b6b2d;
        }

        .reel-symbols {
            position: absolute;
            width: 100%;
            transition: transform 0.5s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        .symbol {
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 64px;
            background: radial-gradient(circle at 30% 30%, #fff, #f0f0f0);
            margin: 2px;
            border-radius: 12px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.1), 0 2px 5px rgba(255,255,255,0.2);
            text-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        /* Bet Panel */
        .bet-panel {
            background: rgba(10, 15, 26, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 25px;
            margin: 20px auto;
            max-width: 1200px;
            border: 1px solid rgba(255,215,0,0.3);
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .jackpot-display {
            background: linear-gradient(135deg, #2a1a0a, #1a0e04);
            border-radius: 20px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
            border: 1px solid var(--primary);
        }

        .jackpot-title {
            font-size: 14px;
            color: var(--text-dim);
            letter-spacing: 2px;
        }

        .jackpot-multipliers {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .jackpot-multiplier {
            background: linear-gradient(135deg, #ffd700, #ff9500);
            padding: 8px 16px;
            border-radius: 30px;
            font-weight: 800;
            font-size: 18px;
            color: #000;
            box-shadow: 0 0 15px rgba(255,215,0,0.5);
            animation: pulse-gold 2s infinite;
        }

        @keyframes pulse-gold {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.9; }
        }

        .bet-options {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .bet-btn {
            background: linear-gradient(135deg, #2a2a3a, #1a1a2a);
            border: 2px solid var(--primary);
            padding: 12px 25px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
            color: var(--primary);
        }

        .bet-btn:hover, .bet-btn.active {
            background: var(--gold);
            color: #000;
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(255,215,0,0.4);
        }

        .bet-input-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .bet-input {
            background: rgba(0,0,0,0.6);
            border: 2px solid var(--primary);
            padding: 15px 25px;
            border-radius: 50px;
            color: var(--primary);
            font-size: 20px;
            font-weight: 700;
            text-align: center;
            width: 200px;
            font-family: 'Orbitron', monospace;
        }

        .action-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 20px;
        }

        .spin-btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: none;
            padding: 18px 50px;
            border-radius: 60px;
            font-size: 24px;
            font-weight: 800;
            color: #000;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

        .spin-btn:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 8px 30px rgba(255,215,0,0.5);
        }

        .spin-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .clear-btn {
            background: linear-gradient(135deg, #ff6b6b, #ff4757);
            border: none;
            padding: 18px 40px;
            border-radius: 60px;
            font-size: 20px;
            font-weight: 700;
            color: white;
            cursor: pointer;
        }

        /* Game Status */
        .game-status {
            text-align: center;
            padding: 15px;
            background: rgba(0,0,0,0.6);
            border-radius: 50px;
            margin-top: 20px;
            font-weight: 600;
            font-size: 18px;
            color: var(--primary);
        }

        /* Win Overlay */
        .win-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255,215,0,0.3), rgba(0,0,0,0.9));
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.5s;
        }

        .win-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .win-card {
            background: linear-gradient(145deg, #2a2a2a, #1a1a1a);
            padding: 50px;
            border-radius: 50px;
            text-align: center;
            border: 3px solid var(--primary);
            animation: winPulse 0.5s ease-out;
        }

        @keyframes winPulse {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .win-amount {
            font-size: 64px;
            font-weight: 800;
            color: var(--primary);
            font-family: 'Orbitron', monospace;
            margin: 20px 0;
        }

        /* Toast */
        .toast-container {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            padding: 12px 24px;
            background: rgba(0,0,0,0.9);
            border-radius: 50px;
            border-left: 4px solid var(--primary);
            color: white;
            backdrop-filter: blur(10px);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .reel { width: 80px; height: 240px; }
            .symbol { height: 80px; font-size: 40px; }
            .reels-container { padding: 20px 25px; gap: 10px; }
            .spin-btn { padding: 12px 30px; font-size: 18px; }
            .bet-btn { padding: 8px 16px; font-size: 14px; }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div class="ui-overlay">
        <header class="header">
            <div class="logo">
                <i class="fas fa-cocktail"></i>
                <h1>FRUIT COCKTAIL</h1>
            </div>
            <div class="balance-card">
                <i class="fas fa-wallet"></i>
                <span id="balance">0.00</span>
                <i class="fas fa-dollar-sign"></i>
            </div>
        </header>

        <div class="slot-machine">
            <div class="reels-container">
                <div class="reel" id="reel-0">
                    <div class="reel-symbols" id="reel-symbols-0"></div>
                </div>
                <div class="reel" id="reel-1">
                    <div class="reel-symbols" id="reel-symbols-1"></div>
                </div>
                <div class="reel" id="reel-2">
                    <div class="reel-symbols" id="reel-symbols-2"></div>
                </div>
            </div>
        </div>

        <div class="bet-panel">
            <div class="jackpot-display">
                <div class="jackpot-title">🏆 JACKPOT MULTIPLIERS 🏆</div>
                <div class="jackpot-multipliers">
                    <div class="jackpot-multiplier">x100</div>
                    <div class="jackpot-multiplier">x70</div>
                    <div class="jackpot-multiplier">x50</div>
                    <div class="jackpot-multiplier">x20</div>
                    <div class="jackpot-multiplier">x10</div>
                    <div class="jackpot-multiplier">x5</div>
                    <div class="jackpot-multiplier">x2</div>
                </div>
            </div>

            <div class="bet-options">
                <div class="bet-btn" data-bet="600">600</div>
                <div class="bet-btn" data-bet="300">300</div>
                <div class="bet-btn" data-bet="2000">2000</div>
                <div class="bet-btn" data-bet="4000">4000</div>
                <div class="bet-btn" data-bet="10000">10000</div>
                <div class="bet-btn" data-bet="40000">40000</div>
                <div class="bet-btn" data-bet="200000">200000</div>
            </div>

            <div class="bet-input-group">
                <input type="number" id="bet-amount" class="bet-input" value="600" min="1" step="1">
            </div>

            <div class="action-buttons">
                <button id="spin-btn" class="spin-btn">
                    <i class="fas fa-play"></i> SPIN
                </button>
                <button id="clear-btn" class="clear-btn">
                    <i class="fas fa-trash"></i> CLEAR
                </button>
            </div>

            <div class="game-status" id="game-status">
                🍒 Place your bet and spin the reels! 🍊
            </div>
        </div>
    </div>

    <div class="win-overlay" id="win-overlay">
        <div class="win-card">
            <i class="fas fa-trophy" style="font-size: 64px; color: #ffd700;"></i>
            <h2 id="win-title">JACKPOT!</h2>
            <div class="win-amount" id="win-amount">+$0</div>
            <button id="close-win" class="spin-btn" style="margin-top: 20px;">CONTINUE</button>
        </div>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.128.0/build/three.module.js';

        // ===== FIREBASE CONFIG =====
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ===== FRUIT SYMBOLS =====
        const SYMBOLS = ['🍒', '🍋', '🍊', '🍇', '🍉', '⭐', '🍓', '🍑'];
        const SYMBOL_MULTIPLIERS = {
            '🍒': 2, '🍋': 3, '🍊': 5, '🍇': 10, '🍉': 20, '⭐': 100, '🍓': 8, '🍑': 12
        };

        // ===== GAME STATE =====
        const gameState = {
            currentUser: null,
            balance: 0,
            betAmount: 600,
            isSpinning: false,
            gameId: null,
            winProbability: 0.10,
            houseEdge: 0.90,
            bonusSystem: { roundsPlayed: 0, roundsForBonus: 25, bonusAmount: 5, bonusEarned: false },
            gameHistory: []
        };

        // ===== 3D SCENE SETUP =====
        function setup3DScene() {
            const container = document.getElementById('canvas-container');
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050510);
            scene.fog = new THREE.FogExp2(0x050510, 0.008);

            const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, 8);
            camera.lookAt(0, 0, 0);

            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // Lights
            const ambientLight = new THREE.AmbientLight(0x404060);
            scene.add(ambientLight);
            
            const mainLight = new THREE.DirectionalLight(0xffeedd, 1);
            mainLight.position.set(5, 10, 7);
            mainLight.castShadow = true;
            scene.add(mainLight);
            
            const backLight = new THREE.PointLight(0xffaa66, 0.5);
            backLight.position.set(0, 2, -3);
            scene.add(backLight);
            
            const fillLight = new THREE.PointLight(0x66aaff, 0.3);
            fillLight.position.set(-2, 1, 4);
            scene.add(fillLight);
            
            const colorLight = new THREE.PointLight(0xff66aa, 0.2);
            colorLight.position.set(3, 1, 2);
            scene.add(colorLight);

            // Floating particles
            const particleCount = 500;
            const particlesGeometry = new THREE.BufferGeometry();
            const particlesPositions = new Float32Array(particleCount * 3);
            for (let i = 0; i < particleCount; i++) {
                particlesPositions[i*3] = (Math.random() - 0.5) * 30;
                particlesPositions[i*3+1] = (Math.random() - 0.5) * 15;
                particlesPositions[i*3+2] = (Math.random() - 0.5) * 15 - 5;
            }
            particlesGeometry.setAttribute('position', new THREE.BufferAttribute(particlesPositions, 3));
            const particlesMaterial = new THREE.PointsMaterial({ color: 0xffaa44, size: 0.05, transparent: true, opacity: 0.5 });
            const particles = new THREE.Points(particlesGeometry, particlesMaterial);
            scene.add(particles);

            // Rotating ring
            const ringGeometry = new THREE.TorusGeometry(1.5, 0.05, 64, 200);
            const ringMaterial = new THREE.MeshStandardMaterial({ color: 0xffaa44, emissive: 0x442200, metalness: 0.8, roughness: 0.2 });
            const ring = new THREE.Mesh(ringGeometry, ringMaterial);
            ring.position.y = -0.5;
            scene.add(ring);

            // Animation
            let time = 0;
            function animate() {
                requestAnimationFrame(animate);
                time += 0.01;
                
                particles.rotation.y = time * 0.05;
                particles.rotation.x = Math.sin(time * 0.1) * 0.1;
                ring.rotation.x = Math.sin(time * 0.5) * 0.5;
                ring.rotation.z = time * 0.3;
                ring.rotation.y = time * 0.2;
                
                camera.position.x = Math.sin(time * 0.1) * 0.1;
                camera.lookAt(0, 0.5, 0);
                
                renderer.render(scene, camera);
            }
            animate();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        setup3DScene();

        // ===== SLOT REEL MANAGEMENT =====
        function initReels() {
            for (let i = 0; i < 3; i++) {
                const container = document.getElementById(`reel-symbols-${i}`);
                container.innerHTML = '';
                const symbols = [...SYMBOLS, ...SYMBOLS, ...SYMBOLS];
                for (let j = 0; j < 12; j++) {
                    const symbolDiv = document.createElement('div');
                    symbolDiv.className = 'symbol';
                    symbolDiv.textContent = symbols[j % symbols.length];
                    container.appendChild(symbolDiv);
                }
            }
        }

        function spinReels() {
            const reels = [0, 1, 2];
            const results = [];
            
            reels.forEach(reelIndex => {
                const container = document.getElementById(`reel-symbols-${reelIndex}`);
                const symbols = container.children;
                const randomOffset = Math.floor(Math.random() * symbols.length);
                const finalSymbol = symbols[randomOffset % symbols.length].textContent;
                results.push(finalSymbol);
                
                const targetPosition = -(randomOffset * 140);
                container.style.transform = `translateY(${targetPosition}px)`;
            });
            
            return results;
        }

        function resetReels() {
            for (let i = 0; i < 3; i++) {
                const container = document.getElementById(`reel-symbols-${i}`);
                container.style.transform = 'translateY(0px)';
            }
        }

        // ===== WIN CALCULATION (90% Lose Rate) =====
        function calculateWin(betAmount, symbols) {
            const randomFactor = Math.random();
            
            // 90% lose rate
            if (randomFactor > 0.10) {
                // Small hook wins 5% of the time to keep players engaged
                if (randomFactor > 0.85 && randomFactor <= 0.90) {
                    const smallWin = betAmount * 0.5;
                    return { win: true, payout: smallWin, multiplier: 0.5, message: 'Small win!' };
                }
                return { win: false, payout: 0, multiplier: 0, message: 'Better luck next time!' };
            }
            
            // 10% actual win
            const allSame = symbols[0] === symbols[1] && symbols[1] === symbols[2];
            if (allSame) {
                let multiplier = SYMBOL_MULTIPLIERS[symbols[0]] || 5;
                // Cap jackpot
                if (multiplier > 100) multiplier = 100;
                const payout = betAmount * multiplier;
                return { win: true, payout: payout, multiplier: multiplier, message: `${symbols[0]} ${symbols[0]} ${symbols[0]}!` };
            }
            
            // Two of a kind
            if (symbols[0] === symbols[1] || symbols[1] === symbols[2] || symbols[0] === symbols[2]) {
                const matchedSymbol = symbols[0] === symbols[1] ? symbols[0] : symbols[1] === symbols[2] ? symbols[1] : symbols[0];
                let multiplier = SYMBOL_MULTIPLIERS[matchedSymbol] / 2 || 2;
                const payout = betAmount * multiplier;
                return { win: true, payout: payout, multiplier: multiplier, message: `Two ${matchedSymbol}!` };
            }
            
            return { win: false, payout: 0, multiplier: 0, message: 'No match!' };
        }

        // ===== FIREBASE FUNCTIONS =====
        async function processTransaction(amount, type, description) {
            try {
                const walletRef = db.collection("wallets").doc(gameState.currentUser.uid);
                return await db.runTransaction(async (transaction) => {
                    const walletDoc = await transaction.get(walletRef);
                    if (!walletDoc.exists) throw new Error("Wallet not found");
                    
                    const currentBalance = walletDoc.data().balance || 0;
                    const newBalance = currentBalance + amount;
                    if (newBalance < 0) throw new Error("Insufficient funds");
                    
                    transaction.update(walletRef, { balance: newBalance, updatedAt: new Date() });
                    
                    const transactionRef = walletRef.collection("transactions").doc();
                    transaction.set(transactionRef, {
                        type, amount, description, createdAt: new Date(),
                        gameId: gameState.gameId, beforeBalance: currentBalance, afterBalance: newBalance
                    });
                    
                    gameState.balance = newBalance;
                    document.getElementById('balance').textContent = newBalance.toFixed(2);
                    return { success: true, newBalance };
                });
            } catch (error) {
                showToast(error.message, 'error');
                return { success: false };
            }
        }

        async function updateBonusProgress() {
            gameState.bonusSystem.roundsPlayed++;
            if (gameState.bonusSystem.roundsPlayed >= gameState.bonusSystem.roundsForBonus && !gameState.bonusSystem.bonusEarned) {
                gameState.bonusSystem.bonusEarned = true;
                gameState.bonusSystem.roundsPlayed = 0;
                await processTransaction(gameState.bonusSystem.bonusAmount, "bonus", "Round completion bonus");
                showToast(`🎁 Bonus! +$${gameState.bonusSystem.bonusAmount}`, 'success');
            }
            try {
                await db.collection("fruit_bonus").doc(gameState.currentUser.uid).set(gameState.bonusSystem);
            } catch(e) {}
        }

        // ===== MAIN GAME ACTION =====
        async function spin() {
            if (gameState.isSpinning) {
                showToast('Spin in progress...', 'warning');
                return;
            }
            
            const betAmount = parseFloat(document.getElementById('bet-amount').value);
            if (isNaN(betAmount) || betAmount < 1 || betAmount > gameState.balance) {
                showToast('Invalid bet amount!', 'error');
                return;
            }
            
            gameState.betAmount = betAmount;
            
            const result = await processTransaction(-betAmount, "spin", `Fruit Cocktail spin: $${betAmount}`);
            if (!result.success) return;
            
            gameState.isSpinning = true;
            document.getElementById('spin-btn').disabled = true;
            document.getElementById('game-status').innerHTML = '<i class="fas fa-sync-alt fa-spin"></i> Spinning...';
            
            resetReels();
            await new Promise(resolve => setTimeout(resolve, 100));
            
            const symbols = spinReels();
            await new Promise(resolve => setTimeout(resolve, 800));
            
            const winResult = calculateWin(betAmount, symbols);
            gameState.gameId = `fruit_${Date.now()}_${Math.random().toString(36).substr(2, 6)}`;
            
            if (winResult.win && winResult.payout > 0) {
                await processTransaction(winResult.payout, "win", `Fruit Cocktail win: $${winResult.payout.toFixed(2)} (${winResult.multiplier}x)`);
                showWinOverlay(winResult.payout, winResult.message);
                document.getElementById('game-status').innerHTML = `🎉 WIN! ${winResult.message} +$${winResult.payout.toFixed(2)} 🎉`;
            } else {
                document.getElementById('game-status').innerHTML = `😢 ${winResult.message} Lost $${betAmount.toFixed(2)}`;
            }
            
            await updateBonusProgress();
            
            gameState.isSpinning = false;
            document.getElementById('spin-btn').disabled = false;
        }

        function showWinOverlay(amount, message) {
            document.getElementById('win-title').textContent = message || 'WINNER!';
            document.getElementById('win-amount').textContent = `+$${amount.toFixed(2)}`;
            document.getElementById('win-overlay').classList.add('show');
            
            // Confetti effect
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.style.position = 'fixed';
                confetti.style.width = '10px';
                confetti.style.height = '10px';
                confetti.style.backgroundColor = `hsl(${Math.random() * 360}, 100%, 50%)`;
                confetti.style.left = Math.random() * window.innerWidth + 'px';
                confetti.style.top = '-20px';
                confetti.style.pointerEvents = 'none';
                confetti.style.zIndex = '2000';
                confetti.style.animation = `fall ${Math.random() * 2 + 1}s linear forwards`;
                document.body.appendChild(confetti);
                setTimeout(() => confetti.remove(), 2000);
            }
        }
        
        // Add confetti animation style
        const style = document.createElement('style');
        style.textContent = `@keyframes fall { to { transform: translateY(100vh) rotate(360deg); opacity: 0; } }`;
        document.head.appendChild(style);

        function showToast(message, type) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle'}"></i> ${message}`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // ===== AUTH & BALANCE =====
        async function loadBalance() {
            try {
                const doc = await db.collection("wallets").doc(gameState.currentUser.uid).get();
                if (doc.exists) {
                    gameState.balance = doc.data().balance || 0;
                    document.getElementById('balance').textContent = gameState.balance.toFixed(2);
                } else {
                    await db.collection("wallets").doc(gameState.currentUser.uid).set({ balance: 500, createdAt: new Date() });
                    gameState.balance = 500;
                    document.getElementById('balance').textContent = '500.00';
                }
            } catch(e) { console.error(e); }
        }

        auth.onAuthStateChanged(user => {
            if (!user) {
                showToast('Please login to play', 'error');
                setTimeout(() => window.location.href = 'https://xcrazybet.github.io/millioner/login.html', 2000);
                return;
            }
            gameState.currentUser = user;
            loadBalance();
            
            db.collection("wallets").doc(user.uid).onSnapshot(doc => {
                if (doc.exists) {
                    gameState.balance = doc.data().balance || 0;
                    document.getElementById('balance').textContent = gameState.balance.toFixed(2);
                }
            });
        });

        // ===== EVENT LISTENERS =====
        document.getElementById('spin-btn').addEventListener('click', spin);
        document.getElementById('clear-btn').addEventListener('click', () => resetReels());
        document.getElementById('close-win').addEventListener('click', () => {
            document.getElementById('win-overlay').classList.remove('show');
        });
        
        document.querySelectorAll('.bet-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const bet = parseFloat(btn.dataset.bet);
                document.getElementById('bet-amount').value = bet;
                gameState.betAmount = bet;
            });
        });
        
        document.getElementById('bet-amount').addEventListener('input', (e) => {
            let val = parseFloat(e.target.value) || 1;
            val = Math.max(1, Math.min(val, gameState.balance));
            e.target.value = val;
            gameState.betAmount = val;
        });
        
        initReels();
    </script>
</body>
</html>
