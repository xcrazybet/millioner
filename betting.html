<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>XLODON - Live Sports Betting Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
        }

        /* Header */
        .header {
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(10px);
            padding: 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            background: linear-gradient(135deg, #ffd700, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .balance-card {
            background: linear-gradient(135deg, rgba(255,215,0,0.2), rgba(255,107,107,0.2));
            padding: 0.8rem 1.5rem;
            border-radius: 50px;
            display: flex;
            gap: 1rem;
            align-items: center;
            border: 1px solid rgba(255,215,0,0.3);
        }

        .balance-label {
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .balance-amount {
            font-size: 1.8rem;
            font-weight: bold;
            color: #ffd700;
        }

        .add-funds-btn {
            background: #ffd700;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 50px;
            color: #1a1a2e;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .add-funds-btn:hover {
            transform: scale(1.05);
        }

        /* Stats Bar */
        .stats-bar {
            max-width: 1400px;
            margin: 1rem auto;
            padding: 0 1rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }

        .stat-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            padding: 1rem;
            border-radius: 15px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .stat-label {
            font-size: 0.85rem;
            opacity: 0.7;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 1.3rem;
            font-weight: bold;
        }

        /* Filters */
        .filters {
            max-width: 1400px;
            margin: 1rem auto;
            padding: 0 1rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 0.7rem 1.5rem;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #ffd700, #ff6b6b);
            color: #1a1a2e;
            border-color: transparent;
        }

        /* Main Content */
        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1rem;
        }

        /* Fixtures Grid */
        .fixtures-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 1.5rem;
            margin-top: 1rem;
        }

        .fixture-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 1.2rem;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .fixture-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            background: rgba(255,255,255,0.08);
        }

        .fixture-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            font-size: 0.85rem;
            opacity: 0.8;
        }

        .league-name {
            background: rgba(255,255,255,0.1);
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
        }

        .fixture-status {
            display: inline-block;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .status-inplay {
            background: #ff4757;
            animation: pulse 1s infinite;
        }

        .status-scheduled {
            background: #ffa502;
        }

        .status-finished {
            background: #2ed573;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }

        .fixture-teams {
            text-align: center;
            margin: 1rem 0;
        }

        .team {
            font-size: 1.1rem;
            font-weight: 600;
            margin: 0.5rem 0;
        }

        .vs {
            font-size: 0.8rem;
            opacity: 0.6;
            margin: 0.3rem 0;
        }

        .score {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ffd700;
            margin-top: 0.5rem;
        }

        .odds-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.8rem;
            margin-top: 1rem;
        }

        .odd-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 12px;
            padding: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .odd-btn:hover {
            background: #ffd700;
            transform: scale(1.05);
            color: #1a1a2e;
        }

        .odd-label {
            font-size: 0.75rem;
            opacity: 0.8;
            margin-bottom: 0.3rem;
        }

        .odd-value {
            font-size: 1.2rem;
            font-weight: bold;
        }

        /* Bet Slip */
        .bet-slip-toggle {
            position: fixed;
            right: 20px;
            bottom: 20px;
            background: linear-gradient(135deg, #ffd700, #ff6b6b);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            z-index: 200;
            transition: transform 0.2s;
        }

        .bet-slip-toggle:hover {
            transform: scale(1.1);
        }

        .bet-count {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #ff4757;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .bet-slip {
            position: fixed;
            right: 0;
            top: 0;
            width: 400px;
            height: 100vh;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(20px);
            transform: translateX(100%);
            transition: transform 0.3s ease-in-out;
            z-index: 1000;
            padding: 1rem;
            overflow-y: auto;
            box-shadow: -5px 0 20px rgba(0,0,0,0.5);
        }

        .bet-slip.open {
            transform: translateX(0);
        }

        .bet-slip-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }

        .close-slip {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.8rem;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .close-slip:hover {
            transform: rotate(90deg);
        }

        .bet-item {
            background: rgba(255,255,255,0.1);
            padding: 1rem;
            border-radius: 15px;
            margin-bottom: 1rem;
        }

        .bet-fixture {
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .bet-details {
            font-size: 0.9rem;
            opacity: 0.8;
            margin: 0.5rem 0;
        }

        .stake-input {
            width: 100%;
            padding: 0.7rem;
            margin: 0.5rem 0;
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
        }

        .stake-input:focus {
            outline: none;
            border-color: #ffd700;
        }

        .potential-win {
            color: #ffd700;
            font-weight: bold;
            margin-top: 0.5rem;
        }

        .remove-bet {
            background: rgba(255,71,87,0.3);
            border: none;
            padding: 0.3rem 0.8rem;
            border-radius: 8px;
            color: #ff4757;
            cursor: pointer;
            margin-top: 0.5rem;
            font-size: 0.85rem;
        }

        .bet-summary {
            margin-top: 1rem;
            padding: 1rem;
            background: rgba(255,215,0,0.1);
            border-radius: 15px;
            border: 1px solid rgba(255,215,0,0.3);
        }

        .place-bet-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #ffd700, #ff6b6b);
            border: none;
            border-radius: 12px;
            color: #1a1a2e;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 1rem;
            transition: transform 0.2s;
        }

        .place-bet-btn:hover:not(:disabled) {
            transform: translateY(-2px);
        }

        .place-bet-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Add Funds Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            animation: fadeIn 0.3s;
        }

        .modal-content {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            padding: 2rem;
            border-radius: 20px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            border: 1px solid rgba(255,215,0,0.3);
        }

        .amount-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin: 1.5rem 0;
        }

        .amount-option {
            padding: 0.8rem;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .amount-option:hover {
            background: #ffd700;
            color: #1a1a2e;
        }

        .custom-amount {
            width: 100%;
            padding: 0.8rem;
            margin: 1rem 0;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
        }

        .modal-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }

        .modal-btn {
            flex: 1;
            padding: 0.8rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }

        .modal-btn.confirm {
            background: #ffd700;
            color: #1a1a2e;
        }

        .modal-btn.cancel {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }

        /* Toast Notifications */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.9);
            color: #fff;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            z-index: 2000;
            animation: slideInLeft 0.3s;
            border-left: 4px solid #ffd700;
        }

        @keyframes slideInLeft {
            from {
                transform: translateX(-100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Loading Spinner */
        .loader {
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 3px solid #ffd700;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 3rem auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: rgba(255,255,255,0.6);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .fixtures-grid {
                grid-template-columns: 1fr;
            }
            
            .bet-slip {
                width: 100%;
            }
            
            .stats-bar {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .logo {
                font-size: 1.2rem;
            }
            
            .balance-amount {
                font-size: 1.2rem;
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.1);
        }

        ::-webkit-scrollbar-thumb {
            background: #ffd700;
            border-radius: 4px;
        }
    </style>
</head>

                scores: [],
                odds: [
                    { label: "Home", value: 2.20, type: "home" },
                    { label: "Draw", value: 3.40, type: "draw" },
                    { label: "Away", value: 3.10, type: "away" }
                ]
            }
        ];
        
        // Load saved data from localStorage
        function loadSavedData() {
            const savedBalance = localStorage.getItem('xlodon_balance');
            if (savedBalance) userBalance = parseFloat(savedBalance);
            
            const savedBetHistory = localStorage.getItem('xlodon_bet_history');
            if (savedBetHistory) betHistory = JSON.parse(savedBetHistory);
            
            const savedTodayStats = localStorage.getItem('xlodon_today_stats');
            if (savedTodayStats) {
                const stats = JSON.parse(savedTodayStats);
                const today = new Date().toISOString().split('T')[0];
                if (stats.date === today) {
                    todayStats = stats;
                } else {
                    todayStats = { date: today, betsCount: 0, totalStake: 0 };
                }
            } else {
                todayStats = { date: new Date().toISOString().split('T')[0], betsCount: 0, totalStake: 0 };
            }
            
            updateBalanceDisplay();
            updateStatsDisplay();
        }
        
        // Save data to localStorage
        function saveData() {
            localStorage.setItem('xlodon_balance', userBalance);
            localStorage.setItem('xlodon_bet_history', JSON.stringify(betHistory));
            localStorage.setItem('xlodon_today_stats', JSON.stringify(todayStats));
        }
        
        // Update balance display
        function updateBalanceDisplay() {
            document.getElementById('balanceAmount').innerHTML = `£${userBalance.toFixed(2)}`;
        }
        
        // Update stats display
        function updateStatsDisplay() {
            document.getElementById('todayBetsCount').innerText = todayStats.betsCount;
            document.getElementById('todayStake').innerHTML = `£${todayStats.totalStake.toFixed(2)}`;
            document.getElementById('activeBetsCount').innerText = betHistory.filter(bet => bet.status === 'active').length;
            
            const totalProfitLoss = betHistory.reduce((sum, bet) => {
                if (bet.status === 'won') return sum + (bet.potentialWin - bet.stake);
                if (bet.status === 'lost') return sum - bet.stake;
                return sum;
            }, 0);
            document.getElementById('profitLoss').innerHTML = `${totalProfitLoss >= 0 ? '+' : ''}£${totalProfitLoss.toFixed(2)}`;
            document.getElementById('profitLoss').style.color = totalProfitLoss >= 0 ? '#2ed573' : '#ff4757';
        }
        
        // Load fixtures (using demo data - replace with API call)
        async function loadFixtures() {
    try {
        const response = await fetch('https://api.sportmonks.com/v3/football/fixtures?api_token=YOUR_TOKEN&include=participants;league;odds;scores');
        const data = await response.json();
        fixtures = data.data;
        renderFixtures();
    } catch (error) {
        console.error('Error loading fixtures:', error);
        fixtures = demoFixtures;
        renderFixtures();
    }
}
        
        // Render fixtures based on current filter
        function renderFixtures() {
            let filteredFixtures = [...fixtures];
            
            switch(currentFilter) {
                case 'inplay':
                    filteredFixtures = fixtures.filter(f => f.state === 'inplay');
                    break;
                case 'today':
                    const today = new Date().toISOString().split('T')[0];
                    filteredFixtures = fixtures.filter(f => f.starting_at?.split('T')[0] === today);
                    break;
                case 'premier':
                    filteredFixtures = fixtures.filter(f => f.league.name === 'Premier League');
                    break;
                case 'laliga':
                    filteredFixtures = fixtures.filter(f => f.league.name === 'La Liga');
                    break;
                case 'seriea':
                    filteredFixtures = fixtures.filter(f => f.league.name === 'Serie A');
                    break;
                default:
                    filteredFixtures = fixtures;
            }
            
            if (filteredFixtures.length === 0) {
                document.getElementById('fixturesGrid').innerHTML = '<div class="empty-state">No matches available for this filter</div>';
                return;
            }
            
            const html = `
                <div class="fixtures-grid">
                    ${filteredFixtures.map(fixture => `
                        <div class="fixture-card">
                            <div class="fixture-header">
                                <span class="league-name">${fixture.league.name}</span>
                                <span class="fixture-status status-${fixture.state}">
                                    ${fixture.state === 'inplay' ? '🔴 LIVE' : fixture.state === 'finished' ? '✅ FINISHED' : '📅 ' + (fixture.time?.starting_at?.time || 'Scheduled')}
                                </span>
                            </div>
                            <div class="fixture-teams">
                                <div class="team">${fixture.participants[0]?.name}</div>
                                ${fixture.scores && fixture.scores.length > 0 ? 
                                    `<div class="score">${fixture.scores.find(s => s.type === 'home')?.score || 0} - ${fixture.scores.find(s => s.type === 'away')?.score || 0}</div>` : 
                                    '<div class="vs">VS</div>'}
                                <div class="team">${fixture.participants[1]?.name}</div>
                            </div>
                            ${fixture.state !== 'finished' ? `
                                <div class="odds-container">
                                    ${fixture.odds.map(odd => `
                                        <div class="odd-btn" onclick="addToBetSlip(${fixture.id}, '${odd.label}', ${odd.value}, '${fixture.participants[0]?.name} vs ${fixture.participants[1]?.name}')">
                                            <div class="odd-label">${odd.label}</div>
                                            <div class="odd-value">${odd.value.toFixed(2)}</div>
                                        </div>
                                    `).join('')}
                                </div>
                            ` : `
                                <div style="text-align: center; margin-top: 1rem; opacity: 0.6;">
                                    Match Finished
                                </div>
                            `}
                        </div>
                    `).join('')}
                </div>
            `;
            
            document.getElementById('fixturesGrid').innerHTML = html;
        }
        
        // Add to bet slip
        function addToBetSlip(fixtureId, selection, odds, fixtureName) {
            const existingIndex = betSlipItems.findIndex(item => item.fixtureId === fixtureId && item.selection === selection);
            
            if (existingIndex !== -1) {
                showToast('Already in bet slip', 'info');
                return;
            }
            
            betSlipItems.push({
                fixtureId,
                fixtureName,
                selection,
                odds,
                stake: null
            });
            
            updateBetSlip();
            updateBetCount();
            showToast(`Added: ${fixtureName} - ${selection} @ ${odds.toFixed(2)}`, 'success');
        }
        
        // Update bet slip UI
        function updateBetSlip() {
            const content = document.getElementById('betSlipContent');
            
            if (betSlipItems.length === 0) {
                content.innerHTML = '<div class="empty-state">No selections added<br>Click on odds to add bets</div>';
                return;
            }
            
            let totalStake = 0;
            let totalPotentialWin = 0;
            
            const html = `
                ${betSlipItems.map((item, index) => {
                    const potentialWin = item.stake ? (item.stake * item.odds).toFixed(2) : 0;
                    if (item.stake) {
                        totalStake += item.stake;
                        totalPotentialWin += parseFloat(potentialWin);
                    }
                    return `
                        <div class="bet-item">
                            <div class="bet-fixture">${item.fixtureName}</div>
                            <div class="bet-details">Selection: ${item.selection} | Odds: ${item.odds.toFixed(2)}</div>
                            <input type="number" class="stake-input" placeholder="Enter stake (£)" 
                                   min="0.5" step="0.5" value="${item.stake || ''}"
                                   onchange="updateStake(${index}, this.value)">
                            ${item.stake ? `<div class="potential-win">💰 Potential Win: £${potentialWin}</div>` : ''}
                            <button class="remove-bet" onclick="removeFromBetSlip(${index})">Remove</button>
                        </div>
                    `;
                }).join('')}
                <div class="bet-summary">
                    <div>Total Stake: £${totalStake.toFixed(2)}</div>
                    <div>Total Potential Win: £${totalPotentialWin.toFixed(2)}</div>
                </div>
                <button class="place-bet-btn" onclick="placeBets()" ${totalStake === 0 ? 'disabled' : ''}>
                    Place Bets (£${totalStake.toFixed(2)})
                </button>
            `;
            
            content.innerHTML = html;
        }
        
        // Update stake for a bet
        function updateStake(index, value) {
            const stake = parseFloat(value);
            if (isNaN(stake) || stake < 0.5) {
                betSlipItems[index].stake = null;
                showToast('Minimum stake is £0.50', 'warning');
            } else if (stake > userBalance) {
                betSlipItems[index].stake = null;
                showToast('Insufficient balance', 'error');
            } else {
                betSlipItems[index].stake = stake;
            }
            updateBetSlip();
        }
        
        // Remove from bet slip
        function removeFromBetSlip(index) {
            betSlipItems.splice(index, 1);
            updateBetSlip();
            updateBetCount();
            showToast('Removed from bet slip', 'info');
        }
        
        // Update bet count badge
        function updateBetCount() {
            document.getElementById('betCount').innerText = betSlipItems.length;
        }
        
        // Place bets
        async function placeBets() {
            const validBets = betSlipItems.filter(item => item.stake && item.stake > 0);
            
            if (validBets.length === 0) {
                showToast('Please enter stakes for your selections', 'warning');
                return;
            }
            
            const totalStake = validBets.reduce((sum, bet) => sum + bet.stake, 0);
            
            if (totalStake > userBalance) {
                showToast('Insufficient balance. Please add funds.', 'error');
                return;
            }
            
            // Process each bet
            for (const bet of validBets) {
                const potentialWin = bet.stake * bet.odds;
                
                // Deduct from balance
                userBalance -= bet.stake;
                
                // Add to bet history
                const newBet = {
                    id: Date.now() + Math.random(),
                    ...bet,
                    potentialWin,
                    status: 'active',
                    createdAt: new Date().toISOString()
                };
                betHistory.push(newBet);
                
                // Update today's stats
                todayStats.betsCount++;
                todayStats.totalStake += bet.stake;
                
                showToast(`Bet placed: ${bet.fixtureName} - ${bet.selection} (${bet.stake} @ ${bet.odds})`, 'success');
            }
            
            // Clear bet slip
            betSlipItems = [];
            updateBetSlip();
            updateBetCount();
            updateBalanceDisplay();
            updateStatsDisplay();
            saveData();
            
            // Close bet slip
            toggleBetSlip(false);
            
            // Simulate bet settlement after random time (for demo)
            simulateBetSettlement();
        }
        
        // Simulate bet settlement (for demo - in production, this would be handled by backend)
        function simulateBetSettlement() {
            setTimeout(() => {
                const activeBets = betHistory.filter(bet => bet.status === 'active');
                if (activeBets.length === 0) return;
                
                // Randomly settle some bets for demo
                activeBets.forEach(bet => {
                    // 50% chance to win for demo purposes
                    const isWin = Math.random() > 0.5;
                    
                    if (isWin) {
                        bet.status = 'won';
                        userBalance += bet.potentialWin;
                        showToast(`🎉 BET WON! You won £${bet.potentialWin.toFixed(2)} on ${bet.fixtureName}`, 'success');
                    } else {
                        bet.status = 'lost';
                        showToast(`😢 BET LOST: ${bet.fixtureName} - ${bet.selection}`, 'error');
                    }
                });
                
                updateBalanceDisplay();
                updateStatsDisplay();
                saveData();
            }, 30000); // Settle after 30 seconds for demo
        }
        
        // Filter fixtures
        function filterFixtures(filter, buttonElement) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            buttonElement.classList.add('active');
            renderFixtures();
        }
        
        // Toggle bet slip
        function toggleBetSlip(open = null) {
            const slip = document.getElementById('betSlip');
            if (open === true) {
                slip.classList.add('open');
            } else if (open === false) {
                slip.classList.remove('open');
            } else {
                slip.classList.toggle('open');
            }
        }
        
        // Show add funds modal
        function showAddFundsModal() {
            const modal = document.createElement('div');
            modal.className = 'modal';
            modal.innerHTML = `
                <div class="modal-content">
                    <h2>💰 Add Funds</h2>
                    <div class="amount-options">
                        <div class="amount-option" onclick="addFunds(10)">£10</div>
                        <div class="amount-option" onclick="addFunds(25)">£25</div>
                        <div class="amount-option" onclick="addFunds(50)">£50</div>
                        <div class="amount-option" onclick="addFunds(100)">£100</div>
                        <div class="amount-option" onclick="addFunds(250)">£250</div>
                        <div class="amount-option" onclick="addFunds(500)">£500</div>
                    </div>
                    <input type="number" id="customAmount" class="custom-amount" placeholder="Custom amount (£)" min="1">
                    <div class="modal-buttons">
                        <button class="modal-btn confirm" onclick="addCustomFunds()">Add Funds</button>
                        <button class="modal-btn cancel" onclick="closeModal()">Cancel</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
        }
        
        // Add funds
        function addFunds(amount) {
            userBalance += amount;
            updateBalanceDisplay();
            saveData();
            showToast(`Added £${amount} to your balance`, 'success');
            closeModal();
        }
        
        // Add custom funds
        function addCustomFunds() {
            const amount = parseFloat(document.getElementById('customAmount')?.value);
            if (isNaN(amount) || amount <= 0) {
                showToast('Please enter a valid amount', 'warning');
                return;
            }
            addFunds(amount);
        }
        
        // Close modal
        function closeModal() {
            const modal = document.querySelector('.modal');
            if (modal) modal.remove();
        }
        
        // Show toast notification
        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = 'toast';
            
            const icons = {
                success: '✅',
                error: '❌',
                warning: '⚠️',
                info: 'ℹ️'
            };
            
            toast.innerHTML = `${icons[type] || 'ℹ️'} ${message}`;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }
        
        // Auto-refresh live scores every 10 seconds
        function startAutoRefresh() {
            setInterval(() => {
                if (currentFilter === 'inplay') {
                    // Update live scores for demo
                    fixtures.forEach(fixture => {
                        if (fixture.state === 'inplay' && fixture.scores) {
                            // Randomly update scores for demo
                            if (Math.random() > 0.7) {
                                const homeScore = fixture.scores.find(s => s.type === 'home');
                                const awayScore = fixture.scores.find(s => s.type === 'away');
                                if (homeScore && awayScore) {
                                    homeScore.score += Math.random() > 0.8 ? 1 : 0;
                                    awayScore.score += Math.random() > 0.8 ? 1 : 0;
                                }
                            }
                        }
                    });
                    renderFixtures();
                }
            }, 10000);
        }
        
        // Initialize app
        function init() {
            loadSavedData();
            loadFixtures();
            startAutoRefresh();
            
            // Close modal when clicking outside
            document.addEventListener('click', (e) => {
                if (e.target.classList.contains('modal')) {
                    closeModal();
                }
            });
        }
        
        // Start the app
        init();
    </script>
</body>
