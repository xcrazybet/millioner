<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>XLODON - Live Sports Betting</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #fff;
        }

        /* Header */
        .header {
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
            padding: 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            background: linear-gradient(135deg, #fff, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .balance-card {
            background: rgba(255,255,255,0.2);
            padding: 0.5rem 1rem;
            border-radius: 10px;
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .balance-amount {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ffd700;
        }

        /* Auth Container */
        .auth-container {
            max-width: 500px;
            margin: 2rem auto;
            padding: 2rem;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }

        .auth-tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 2px solid rgba(255,255,255,0.2);
        }

        .auth-tab {
            padding: 0.5rem 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .auth-tab.active {
            border-bottom: 2px solid #ffd700;
            color: #ffd700;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .auth-form input {
            padding: 0.8rem;
            border: none;
            border-radius: 10px;
            background: rgba(255,255,255,0.2);
            color: #fff;
            font-size: 1rem;
        }

        .auth-form input::placeholder {
            color: rgba(255,255,255,0.7);
        }

        .auth-form button {
            padding: 0.8rem;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .auth-form button:hover {
            transform: translateY(-2px);
        }

        /* Main Content */
        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
            display: none;
        }

        /* Stats Bar */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            padding: 1rem;
            border-radius: 15px;
            text-align: center;
        }

        .stat-label {
            font-size: 0.9rem;
            opacity: 0.8;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
        }

        /* Filters */
        .filters {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 0.5rem 1rem;
            background: rgba(255,255,255,0.1);
            border: none;
            border-radius: 10px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
        }

        .filter-btn.active {
            background: #ffd700;
            color: #333;
        }

        /* Fixtures Grid */
        .fixtures-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .fixture-card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 1rem;
            transition: transform 0.2s;
            cursor: pointer;
        }

        .fixture-card:hover {
            transform: translateY(-5px);
        }

        .fixture-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .fixture-teams {
            text-align: center;
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 1rem;
            padding: 0.5rem;
        }

        .team {
            margin: 0.5rem 0;
        }

        .vs {
            font-size: 0.9rem;
            opacity: 0.7;
            margin: 0.5rem 0;
        }

        .odds-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
            margin: 1rem 0;
        }

        .odd-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            border-radius: 10px;
            padding: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .odd-btn:hover {
            background: #ffd700;
            transform: scale(1.05);
        }

        .odd-label {
            font-size: 0.8rem;
            opacity: 0.8;
        }

        .odd-value {
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 0.3rem;
        }

        .fixture-status {
            display: inline-block;
            padding: 0.2rem 0.5rem;
            border-radius: 5px;
            font-size: 0.8rem;
            margin-top: 0.5rem;
        }

        .status-inplay {
            background: #4caf50;
            animation: pulse 1s infinite;
        }

        .status-scheduled {
            background: #ff9800;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        /* Bet Slip */
        .bet-slip {
            position: fixed;
            right: 0;
            top: 0;
            width: 350px;
            height: 100vh;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(20px);
            transform: translateX(100%);
            transition: transform 0.3s;
            z-index: 1000;
            padding: 1rem;
            overflow-y: auto;
        }

        .bet-slip.open {
            transform: translateX(0);
        }

        .bet-slip-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }

        .close-slip {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .bet-item {
            background: rgba(255,255,255,0.1);
            padding: 1rem;
            border-radius: 10px;
            margin-bottom: 1rem;
        }

        .stake-input {
            width: 100%;
            padding: 0.5rem;
            margin: 0.5rem 0;
            background: rgba(255,255,255,0.2);
            border: none;
            border-radius: 5px;
            color: #fff;
        }

        .place-bet-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 1rem;
        }

        /* Toast Notifications */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.8);
            color: #fff;
            padding: 1rem;
            border-radius: 10px;
            z-index: 2000;
            animation: slideIn 0.3s;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .fixtures-grid {
                grid-template-columns: 1fr;
            }
            
            .bet-slip {
                width: 100%;
            }
            
            .stats-bar {
                grid-template-columns: 1fr;
            }
        }

        /* Loading Spinner */
        .loader {
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 3px solid #fff;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 2rem auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="header-content">
            <div class="logo">⚽ XLODON BETTING</div>
            <div class="balance-card" id="balanceCard" style="display:none">
                <span>💰 Balance:</span>
                <span class="balance-amount" id="balanceAmount">£0</span>
            </div>
            <button onclick="logout()" id="logoutBtn" style="display:none; background:rgba(255,255,255,0.2); border:none; padding:0.5rem 1rem; border-radius:10px; color:#fff; cursor:pointer">Logout</button>
        </div>
    </div>

    <!-- Auth Container -->
    <div id="authContainer" class="auth-container">
        <div class="auth-tabs">
            <div class="auth-tab active" onclick="switchAuthTab('login')">Login</div>
            <div class="auth-tab" onclick="switchAuthTab('register')">Register</div>
        </div>
        
        <div id="loginForm" class="auth-form">
            <input type="email" id="loginEmail" placeholder="Email" autocomplete="email">
            <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
            <button onclick="login()">Login</button>
        </div>
        
        <div id="registerForm" class="auth-form" style="display:none">
            <input type="text" id="regName" placeholder="Full Name">
            <input type="email" id="regEmail" placeholder="Email">
            <input type="password" id="regPassword" placeholder="Password">
            <input type="password" id="regConfirmPassword" placeholder="Confirm Password">
            <button onclick="register()">Register</button>
        </div>
    </div>

    <!-- Main Content -->
    <div id="mainContent" class="main-container">
        <!-- Stats Bar -->
        <div class="stats-bar">
            <div class="stat-card">
                <div class="stat-label">Today's Bets</div>
                <div class="stat-value" id="todayBets">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Today's Stake</div>
                <div class="stat-value" id="todayStake">£0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Active Bets</div>
                <div class="stat-value" id="activeBetsCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total Won</div>
                <div class="stat-value" id="totalWon">£0</div>
            </div>
        </div>

        <!-- Filters -->
        <div class="filters">
            <button class="filter-btn active" onclick="filterFixtures('all')">All Matches</button>
            <button class="filter-btn" onclick="filterFixtures('inplay')">Live Now</button>
            <button class="filter-btn" onclick="filterFixtures('today')">Today</button>
        </div>

        <!-- Fixtures Grid -->
        <div id="fixturesGrid">
            <div class="loader"></div>
        </div>
    </div>

    <!-- Bet Slip -->
    <div id="betSlip" class="bet-slip">
        <div class="bet-slip-header">
            <h3>Bet Slip</h3>
            <button class="close-slip" onclick="toggleBetSlip()">✕</button>
        </div>
        <div id="betSlipContent"></div>
    </div>

    <script>
        // Configuration
        const API_URL = 'http://localhost:3000'; // Change to your actual server URL
        let authToken = localStorage.getItem('token');
        let currentFilter = 'all';
        let fixtures = [];
        let betSlipItems = [];
        let wsConnection = null;

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            if (authToken) {
                validateToken();
            }
        });

        // WebSocket Connection for Real-time Updates
        function connectWebSocket(userId) {
            const wsUrl = `${API_URL.replace('http', 'ws')}/?userId=${userId}`;
            wsConnection = new WebSocket(wsUrl);
            
            wsConnection.onmessage = (event) => {
                const data = JSON.parse(event.data);
                handleRealTimeUpdate(data);
            };
            
            wsConnection.onerror = (error) => {
                console.error('WebSocket error:', error);
            };
        }

        function handleRealTimeUpdate(data) {
            switch(data.type) {
                case 'bet_placed':
                    showToast(`✅ Bet placed! Potential win: £${data.potentialWin}`);
                    updateBalance(data.newBalance);
                    break;
                case 'bet_won':
                    showToast(`🎉 You won £${data.amount}! New balance: £${data.newBalance}`);
                    updateBalance(data.newBalance);
                    loadActiveBets();
                    break;
                case 'bet_lost':
                    showToast(`😢 Bet lost: £${data.stake}`);
                    loadActiveBets();
                    break;
            }
        }

        // Auth Functions
        function switchAuthTab(tab) {
            if (tab === 'login') {
                document.querySelector('.auth-tab').classList.add('active');
                document.querySelectorAll('.auth-tab')[1].classList.remove('active');
                document.getElementById('loginForm').style.display = 'flex';
                document.getElementById('registerForm').style.display = 'none';
            } else {
                document.querySelector('.auth-tab').classList.remove('active');
                document.querySelectorAll('.auth-tab')[1].classList.add('active');
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('registerForm').style.display = 'flex';
            }
        }

        async function login() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            
            if (!email || !password) {
                showToast('Please fill in all fields');
                return;
            }
            
            try {
                const response = await fetch(`${API_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    authToken = data.token;
                    localStorage.setItem('token', authToken);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    showToast('Login successful!');
                    loadMainApp();
                } else {
                    showToast(data.error || 'Login failed');
                }
            } catch (error) {
                showToast('Network error: ' + error.message);
            }
        }

        async function register() {
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regConfirmPassword').value;
            
            if (!name || !email || !password) {
                showToast('Please fill in all fields');
                return;
            }
            
            if (password !== confirmPassword) {
                showToast('Passwords do not match');
                return;
            }
            
            if (password.length < 6) {
                showToast('Password must be at least 6 characters');
                return;
            }
            
            try {
                const response = await fetch(`${API_URL}/api/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    authToken = data.token;
                    localStorage.setItem('token', authToken);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    showToast('Registration successful!');
                    loadMainApp();
                } else {
                    showToast(data.error || 'Registration failed');
                }
            } catch (error) {
                showToast('Network error: ' + error.message);
            }
        }

        async function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            authToken = null;
            if (wsConnection) wsConnection.close();
            location.reload();
        }

        async function validateToken() {
            try {
                const response = await fetch(`${API_URL}/api/user/balance`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                
                if (response.ok) {
                    loadMainApp();
                } else {
                    localStorage.removeItem('token');
                    authToken = null;
                }
            } catch (error) {
                console.error('Token validation error:', error);
            }
        }

        async function loadMainApp() {
            document.getElementById('authContainer').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
            document.getElementById('balanceCard').style.display = 'flex';
            document.getElementById('logoutBtn').style.display = 'block';
            
            const user = JSON.parse(localStorage.getItem('user'));
            if (user && user.id) {
                connectWebSocket(user.id);
            }
            
            await Promise.all([
                loadBalance(),
                loadLiveFixtures(),
                loadUserStats(),
                loadActiveBets()
            ]);
            
            // Start polling for live updates (every 5 seconds as recommended)
            setInterval(() => {
                if (currentFilter === 'inplay') {
                    loadLiveFixtures();
                }
            }, 5000);
        }

        async function loadBalance() {
            try {
                const response = await fetch(`${API_URL}/api/user/balance`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                const data = await response.json();
                document.getElementById('balanceAmount').innerHTML = `£${data.balance.toFixed(2)}`;
                return data;
            } catch (error) {
                console.error('Error loading balance:', error);
            }
        }

        async function loadLiveFixtures() {
            try {
                const response = await fetch(`${API_URL}/api/fixtures/live`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                const data = await response.json();
                fixtures = data.data || [];
                renderFixtures();
            } catch (error) {
                console.error('Error loading fixtures:', error);
                document.getElementById('fixturesGrid').innerHTML = '<div style="text-align:center;padding:2rem">Error loading fixtures. Please refresh.</div>';
            }
        }

        async function loadUserStats() {
            try {
                const response = await fetch(`${API_URL}/api/user/balance`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                const data = await response.json();
                
                document.getElementById('todayBets').innerText = data.todayStats?.betCount || 0;
                document.getElementById('todayStake').innerHTML = `£${data.todayStats?.totalStake?.toFixed(2) || 0}`;
                document.getElementById('totalWon').innerHTML = `£${(data.totalWon || 0).toFixed(2)}`;
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        async function loadActiveBets() {
            try {
                const response = await fetch(`${API_URL}/api/bets/active`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                const data = await response.json();
                document.getElementById('activeBetsCount').innerText = data.length;
            } catch (error) {
                console.error('Error loading active bets:', error);
            }
        }

        function filterFixtures(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderFixtures();
        }

        function renderFixtures() {
            let filteredFixtures = fixtures;
            
            if (currentFilter === 'inplay') {
                filteredFixtures = fixtures.filter(f => f.state === 'inplay');
            } else if (currentFilter === 'today') {
                const today = new Date().toISOString().split('T')[0];
                filteredFixtures = fixtures.filter(f => f.starting_at?.split('T')[0] === today);
            }
            
            if (filteredFixtures.length === 0) {
                document.getElementById('fixturesGrid').innerHTML = '<div style="text-align:center;padding:2rem">No matches available</div>';
                return;
            }
            
            const html = `
                <div class="fixtures-grid">
                    ${filteredFixtures.map(fixture => `
                        <div class="fixture-card">
                            <div class="fixture-header">
                                <span>${fixture.league?.name || 'Unknown League'}</span>
                                <span class="status-${fixture.state === 'inplay' ? 'inplay' : 'scheduled'} fixture-status">
                                    ${fixture.state === 'inplay' ? '🔴 LIVE' : fixture.time?.starting_at?.time || 'Scheduled'}
                                </span>
                            </div>
                            <div class="fixture-teams">
                                <div class="team">${fixture.participants?.[0]?.name || 'Team A'}</div>
                                <div class="vs">VS</div>
                                <div class="team">${fixture.participants?.[1]?.name || 'Team B'}</div>
                            </div>
                            <div class="odds-container">
                                ${fixture.odds?.map(odd => `
                                    <div class="odd-btn" onclick="addToBetSlip(${fixture.id}, '${odd.label || '1'}' , ${odd.value})">
                                        <div class="odd-label">${odd.label || 'Win'}</div>
                                        <div class="odd-value">${odd.value.toFixed(2)}</div>
                                    </div>
                                `) || '<div>No odds available</div>'}
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
            
            document.getElementById('fixturesGrid').innerHTML = html;
        }

        function addToBetSlip(fixtureId, selection, odds) {
            const fixture = fixtures.find(f => f.id === fixtureId);
            if (!fixture) return;
            
            const existingItem = betSlipItems.find(item => item.fixtureId === fixtureId && item.selection === selection);
            
            if (existingItem) {
                showToast('Already in bet slip');
                return;
            }
            
            betSlipItems.push({
                fixtureId,
                fixtureName: `${fixture.participants?.[0]?.name} vs ${fixture.participants?.[1]?.name}`,
                selection,
                odds,
                stake: null
            });
            
            updateBetSlip();
            toggleBetSlip(true);
            showToast('Added to bet slip');
        }

        function updateBetSlip() {
            const content = document.getElementById('betSlipContent');
            
            if (betSlipItems.length === 0) {
                content.innerHTML = '<div style="text-align:center;padding:2rem">No selections added</div>';
                return;
            }
            
            let totalPotentialWin = 0;
            
            const html = `
                ${betSlipItems.map((item, index) => {
                    const potentialWin = item.stake ? (item.stake * item.odds).toFixed(2) : 0;
                    totalPotentialWin += parseFloat(potentialWin);
                    return `
                        <div class="bet-item">
                            <div><strong>${item.fixtureName}</strong></div>
                            <div>Selection: ${item.selection}</div>
                            <div>Odds: ${item.odds.toFixed(2)}</div>
                            <input type="number" class="stake-input" placeholder="Stake (£)" 
                                   onchange="updateStake(${index}, this.value)">
                            ${item.stake ? `<div>Potential Win: £${potentialWin}</div>` : ''}
                            <button onclick="removeFromBetSlip(${index})" style="background:red; border:none; padding:0.3rem 0.5rem; border-radius:5px; color:#fff; cursor:pointer; margin-top:0.5rem">
                                Remove
                            </button>
                        </div>
                    `;
                }).join('')}
                <div style="margin-top:1rem; padding:1rem; background:rgba(255,255,255,0.1); border-radius:10px">
                    <div>Total Stake: £${betSlipItems.reduce((sum, item) => sum + (item.stake || 0), 0).toFixed(2)}</div>
                    <div>Total Potential Win: £${totalPotentialWin.toFixed(2)}</div>
                </div>
                <button class="place-bet-btn" onclick="placeBets()">Place Bets</button>
            `;
            
            content.innerHTML = html;
        }

        function updateStake(index, value) {
            const stake = parseFloat(value);
            if (isNaN(stake) || stake <= 0) {
                betSlipItems[index].stake = null;
            } else {
                betSlipItems[index].stake = stake;
            }
            updateBetSlip();
        }

        function removeFromBetSlip(index) {
            betSlipItems.splice(index, 1);
            updateBetSlip();
            if (betSlipItems.length === 0) {
                toggleBetSlip(false);
            }
        }

        async function placeBets() {
            const validBets = betSlipItems.filter(item => item.stake && item.stake > 0);
            
            if (validBets.length === 0) {
                showToast('Please enter stakes for your selections');
                return;
            }
            
            // Show loading
            showToast('Placing bets...');
            
            for (const bet of validBets) {
                try {
                    const response = await fetch(`${API_URL}/api/bets/place`, {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${authToken}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            fixtureId: bet.fixtureId,
                            odds: bet.odds,
                            stake: bet.stake,
                            betType: 'match_winner',
                            selection: bet.selection
                        })
                    });
                    
                    const data = await response.json();
                    
                    if (response.ok) {
                        showToast(`✅ Bet placed on ${bet.fixtureName} - £${bet.stake}`);
                        await loadBalance();
                    } else {
                        showToast(`❌ Bet failed: ${data.error}`);
                    }
                } catch (error) {
                    showToast(`Error placing bet: ${error.message}`);
                }
            }
            
            // Clear bet slip
            betSlipItems = [];
            updateBetSlip();
            toggleBetSlip(false);
            await loadActiveBets();
            await loadUserStats();
        }

        function toggleBetSlip(open = null) {
            const slip = document.getElementById('betSlip');
            if (open === true) {
                slip.classList.add('open');
            } else if (open === false) {
                slip.classList.remove('open');
            } else {
                slip.classList.toggle('open');
            }
        }

        function updateBalance(newBalance) {
            document.getElementById('balanceAmount').innerHTML = `£${newBalance.toFixed(2)}`;
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }
    </script>
</body>
</html>
