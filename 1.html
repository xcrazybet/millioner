<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚽ XCrazyBet - Professional Football Betting</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        :root {
            --primary: #00ff9d;
            --primary-dark: #00cc7a;
            --secondary: #ff9800;
            --danger: #ff4757;
            --success: #4caf50;
            --warning: #ffc107;
            --bg: #0a0f1a;
            --surface: #111827;
            --surface-light: #1a2332;
            --text: #ffffff;
            --text-dim: #a0a8c9;
            --border: #333;
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* Header */
        .header {
            background: var(--surface);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .balance-display {
            background: var(--surface-light);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--primary);
            color: var(--primary);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stats-badge {
            background: var(--surface-light);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--secondary);
            color: var(--secondary);
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Main Layout */
        .main-layout {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 20px;
            max-width: 1600px;
            margin: 20px auto;
            padding: 0 20px;
        }

        /* Left Column */
        .left-column {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Market Tabs */
        .market-tabs {
            background: var(--surface);
            border-radius: 12px;
            padding: 15px;
            border: 1px solid var(--secondary);
        }

        .tabs-header {
            display: flex;
            gap: 10px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .tab-btn {
            padding: 8px 16px;
            background: transparent;
            border: none;
            color: var(--text-dim);
            font-weight: 600;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .tab-btn:hover {
            background: var(--surface-light);
            color: var(--primary);
        }

        .tab-btn.active {
            background: var(--primary);
            color: #000;
        }

        /* League Filter */
        .league-filter {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .league-btn {
            padding: 6px 12px;
            background: var(--surface-light);
            border: 1px solid var(--border);
            border-radius: 20px;
            color: var(--text);
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .league-btn:hover, .league-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: #000;
        }

        /* Status Bar */
        .status-bar {
            display: flex;
            gap: 20px;
            padding: 10px;
            background: var(--surface);
            border-radius: 8px;
            font-size: 12px;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-item.live i { color: var(--danger); }
        .status-item.upcoming i { color: var(--secondary); }
        .status-item.finished i { color: var(--success); }

        /* Matches Grid */
        .matches-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: calc(100vh - 300px);
            overflow-y: auto;
            padding-right: 5px;
        }

        .match-card {
            background: var(--surface);
            border-radius: 12px;
            padding: 15px;
            border: 1px solid var(--border);
            transition: all 0.2s;
        }

        .match-card:hover {
            border-color: var(--primary);
        }

        .match-card.live {
            border-left: 4px solid var(--danger);
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 12px;
        }

        .league-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .league-logo {
            width: 20px;
            height: 20px;
            object-fit: contain;
        }

        .league-name {
            color: var(--text-dim);
        }

        .match-time {
            padding: 4px 8px;
            background: var(--surface-light);
            border-radius: 4px;
            color: var(--secondary);
            font-weight: 600;
        }

        .match-time.live {
            background: var(--danger);
            color: white;
        }

        .teams {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .team {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }

        .team.away {
            justify-content: flex-end;
        }

        .team-logo {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .team-name {
            font-weight: 600;
            font-size: 14px;
        }

        .score {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
            margin: 0 20px;
        }

        /* Market Grid */
        .market-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 10px;
        }

        .market-btn {
            padding: 8px;
            background: var(--surface-light);
            border: 1px solid var(--border);
            border-radius: 6px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 12px;
        }

        .market-btn:hover {
            border-color: var(--primary);
        }

        .market-btn.selected {
            background: rgba(0,255,157,0.1);
            border-color: var(--primary);
        }

        .market-name {
            color: var(--text-dim);
            margin-bottom: 2px;
        }

        .market-odds {
            color: var(--primary);
            font-weight: 700;
            font-size: 14px;
        }

        /* Bet Slip */
        .betslip-section {
            background: var(--surface);
            border-radius: 12px;
            padding: 15px;
            border: 2px solid var(--primary);
            position: sticky;
            top: 80px;
            height: fit-content;
        }

        .betslip-tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
        }

        .betslip-tab {
            flex: 1;
            padding: 8px;
            background: var(--surface-light);
            border: none;
            color: var(--text);
            cursor: pointer;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
        }

        .betslip-tab.active {
            background: var(--primary);
            color: #000;
        }

        .betslip-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .betslip-title {
            color: var(--primary);
            font-weight: 700;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .betslip-clear {
            color: var(--danger);
            cursor: pointer;
            font-size: 12px;
        }

        .betslip-items {
            max-height: 250px;
            overflow-y: auto;
            margin-bottom: 12px;
        }

        .betslip-item {
            background: var(--surface-light);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 8px;
        }

        .betslip-item-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        .betslip-match {
            font-weight: 600;
            font-size: 12px;
        }

        .betslip-market {
            color: var(--secondary);
            font-size: 11px;
        }

        .betslip-details {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .betslip-odds {
            color: var(--primary);
            font-weight: 700;
            font-size: 14px;
        }

        .betslip-remove {
            color: var(--danger);
            cursor: pointer;
            font-size: 12px;
        }

        .each-way-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 10px 0;
            padding: 8px;
            background: var(--surface-light);
            border-radius: 6px;
            font-size: 12px;
        }

        .each-way-toggle input {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .betslip-total {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-top: 1px solid var(--border);
            font-weight: 600;
        }

        .total-odds {
            color: var(--primary);
            font-size: 18px;
        }

        .bet-input-group {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--surface-light);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0 10px;
            margin: 10px 0;
        }

        .bet-input {
            flex: 1;
            padding: 10px 0;
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 14px;
            font-weight: 600;
        }

        .bet-input:focus {
            outline: none;
        }

        .potential-returns {
            background: var(--surface-light);
            padding: 10px;
            border-radius: 6px;
            margin: 10px 0;
        }

        .return-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin: 5px 0;
        }

        .return-row.total {
            font-weight: 700;
            color: var(--primary);
            border-top: 1px solid var(--border);
            padding-top: 5px;
            margin-top: 5px;
        }

        .place-bet-btn {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            border: none;
            border-radius: 6px;
            color: #000;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .place-bet-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,255,157,0.3);
        }

        .place-bet-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Open Bets Section */
        .open-bets-section {
            background: var(--surface);
            border-radius: 12px;
            padding: 15px;
            border: 1px solid var(--secondary);
            margin-top: 20px;
        }

        .section-title {
            color: var(--secondary);
            font-size: 14px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .bets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 10px;
        }

        .bet-card {
            background: var(--surface-light);
            border-radius: 8px;
            padding: 12px;
            border-left: 3px solid;
        }

        .bet-card.pending { border-color: var(--secondary); }
        .bet-card.won { border-color: var(--success); }
        .bet-card.lost { border-color: var(--danger); }

        .bet-card-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 11px;
        }

        .bet-ticket {
            color: var(--text-dim);
        }

        .bet-status {
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: 600;
        }

        .bet-status.pending { background: var(--secondary); color: #000; }
        .bet-status.won { background: var(--success); color: #000; }
        .bet-status.lost { background: var(--danger); color: #000; }

        .bet-details {
            font-size: 12px;
            margin: 8px 0;
        }

        .bet-market {
            color: var(--text-dim);
        }

        .bet-selection {
            font-weight: 600;
        }

        .bet-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            border-top: 1px solid var(--border);
            padding-top: 8px;
            margin-top: 8px;
        }

        .bet-stake {
            color: var(--text-dim);
        }

        .bet-return {
            font-weight: 700;
        }

        .bet-return.won { color: var(--success); }
        .bet-return.lost { color: var(--danger); }

        .cashout-btn {
            padding: 4px 8px;
            background: var(--warning);
            border: none;
            border-radius: 4px;
            color: #000;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
        }

        /* History Section */
        .history-section {
            background: var(--surface);
            border-radius: 12px;
            padding: 15px;
            border: 1px solid var(--border);
        }

        .history-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .history-tab {
            padding: 6px 12px;
            background: var(--surface-light);
            border: none;
            color: var(--text);
            cursor: pointer;
            border-radius: 4px;
            font-size: 12px;
        }

        .history-tab.active {
            background: var(--primary);
            color: #000;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 300px;
            overflow-y: auto;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 30px;
        }

        .loading-spinner {
            border: 3px solid var(--surface-light);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 10px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Toast */
        .toast-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10000;
            width: 90%;
            max-width: 300px;
        }

        .toast {
            padding: 12px;
            background: var(--surface);
            border-radius: 6px;
            border-left: 3px solid var(--primary);
            color: white;
            margin-top: 5px;
            font-size: 13px;
            transform: translateY(100%);
            opacity: 0;
            transition: all 0.3s;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.success { border-color: var(--success); }
        .toast.error { border-color: var(--danger); }
        .toast.warning { border-color: var(--warning); }

        /* Bottom Nav */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            background: var(--surface);
            padding: 10px 15px;
            border-top: 2px solid var(--primary);
            margin-top: 20px;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--text-dim);
            font-size: 11px;
            gap: 3px;
        }

        .nav-item i { font-size: 16px; }
        .nav-item.active { color: var(--primary); }

        /* Result Overlay */
        .result-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .result-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .result-content {
            background: var(--surface);
            padding: 25px;
            border-radius: 15px;
            border: 3px solid var(--primary);
            text-align: center;
            max-width: 350px;
            width: 90%;
        }

        .result-icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .result-icon.win { color: var(--success); }
        .result-icon.lose { color: var(--danger); }

        .result-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .result-title.win { color: var(--success); }
        .result-title.lose { color: var(--danger); }

        .result-amount {
            font-size: 32px;
            font-weight: 700;
            margin: 15px 0;
        }

        .result-amount.win { color: var(--success); }
        .result-amount.lose { color: var(--danger); }

        .ok-btn {
            padding: 10px 25px;
            background: var(--primary);
            border: none;
            border-radius: 5px;
            color: #000;
            font-weight: 700;
            cursor: pointer;
        }

        @media (max-width: 1000px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
            
            .betslip-section {
                position: static;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="logo">
            <i class="fas fa-futbol"></i>
            XCrazyBet Pro
        </div>
        <div class="user-info">
            <div class="stats-badge">
                <i class="fas fa-chart-line"></i>
                <span id="win-rate">0%</span>
            </div>
            <div class="balance-display">
                <i class="fas fa-wallet"></i>
                $<span id="balance-val">0.00</span>
            </div>
        </div>
    </header>

    <!-- Main Layout -->
    <div class="main-layout">
        <!-- Left Column -->
        <div class="left-column">
            <!-- Market Tabs -->
            <div class="market-tabs">
                <div class="tabs-header">
                    <button class="tab-btn active" data-market="all">⚽ All Markets</button>
                    <button class="tab-btn" data-market="popular">🔥 Popular</button>
                    <button class="tab-btn" data-market="specials">✨ Specials</button>
                    <button class="tab-btn" data-market="live">🔴 Live</button>
                </div>

                <div class="league-filter" id="league-buttons">
                    <button class="league-btn active" data-league="all">ALL</button>
                    <button class="league-btn" data-league="39">PREMIER</button>
                    <button class="league-btn" data-league="140">LA LIGA</button>
                    <button class="league-btn" data-league="78">BUNDES</button>
                    <button class="league-btn" data-league="135">SERIE A</button>
                    <button class="league-btn" data-league="61">LIGUE 1</button>
                    <button class="league-btn" data-league="2">CHAMPIONS</button>
                </div>

                <div class="status-bar">
                    <span class="status-item live"><i class="fas fa-circle"></i> LIVE (3)</span>
                    <span class="status-item upcoming"><i class="fas fa-clock"></i> UPCOMING (8)</span>
                    <span class="status-item finished"><i class="fas fa-check-circle"></i> FINISHED (5)</span>
                </div>

                <div id="matches-grid" class="matches-grid">
                    <!-- Matches loaded here -->
                </div>
            </div>

            <!-- Open Bets -->
            <div class="open-bets-section">
                <div class="section-title">
                    <i class="fas fa-ticket-alt"></i>
                    MY OPEN BETS
                </div>
                <div id="open-bets-grid" class="bets-grid">
                    <!-- Open bets loaded here -->
                </div>
            </div>
        </div>

        <!-- Right Column - Bet Slip -->
        <div class="betslip-section">
            <div class="betslip-tabs">
                <button class="betslip-tab active" data-betslip="single">SINGLE</button>
                <button class="betslip-tab" data-betslip="accumulator">ACCUMULATOR</button>
                <button class="betslip-tab" data-betslip="system">SYSTEM</button>
            </div>

            <div class="betslip-header">
                <div class="betslip-title">
                    <i class="fas fa-receipt"></i> BET SLIP
                </div>
                <div class="betslip-clear" id="clear-betslip">
                    <i class="fas fa-trash"></i> CLEAR
                </div>
            </div>
            
            <div class="betslip-items" id="betslip-items">
                <div style="text-align: center; color: var(--text-dim); padding: 20px; font-size: 13px;">
                    <i class="fas fa-arrow-up"></i> Click odds to add bets
                </div>
            </div>

            <div id="system-options" style="display: none;">
                <select id="system-type" class="bet-input" style="margin: 10px 0;">
                    <option value="2/3">2/3 (3 bets)</option>
                    <option value="2/4">2/4 (6 bets)</option>
                    <option value="3/4">3/4 (4 bets)</option>
                    <option value="2/5">2/5 (10 bets)</option>
                    <option value="3/5">3/5 (10 bets)</option>
                    <option value="4/5">4/5 (5 bets)</option>
                </select>
            </div>

            <div class="each-way-toggle">
                <input type="checkbox" id="each-way">
                <label for="each-way">Each Way (1/4 odds for places 1-3)</label>
            </div>

            <div class="betslip-total">
                <span>Total Odds:</span>
                <span class="total-odds" id="total-odds">0.00</span>
            </div>

            <div class="bet-input-group">
                <input type="number" class="bet-input" id="bet-amount" value="10" min="1" step="1">
                <span class="currency">$</span>
            </div>

            <div class="potential-returns" id="potential-returns">
                <div class="return-row">
                    <span>Potential Returns:</span>
                    <span id="potential-win">$0.00</span>
                </div>
                <div class="return-row">
                    <span>Each Way Place:</span>
                    <span id="place-return">$0.00</span>
                </div>
                <div class="return-row total">
                    <span>Total:</span>
                    <span id="total-return">$0.00</span>
                </div>
            </div>

        // ===== SELECT MARKET =====
        window.selectMarket = function(matchId, selection, odds, display, market) {
            if (gameState.isPlacingBet) {
                showToast('Please wait...', 'warning');
                return;
            }
            
            const match = gameState.matches.find(m => m.fixture.id === matchId);
            if (!match) return;
            
            // Check if match is still available for betting
            if (!['NS', 'TBD'].includes(match.fixture.status.short)) {
                showToast('Match already started or finished', 'error');
                return;
            }
            
            const matchName = `${match.teams.home.name} vs ${match.teams.away.name}`;
            
            if (gameState.betType === 'single') {
                // Single bet - replace selection
                gameState.selectedBets = [{
                    matchId,
                    matchName,
                    market,
                    selection,
                    display,
                    odds,
                    match
                }];
                showToast('Bet added', 'success');
            } else {
                // Accumulator/System - add to existing
                if (gameState.selectedBets.length >= BETTING_RULES.maxSelections) {
                    showToast(`Maximum ${BETTING_RULES.maxSelections} selections`, 'error');
                    return;
                }
                
                // Check for duplicate match
                if (gameState.selectedBets.some(b => b.matchId === matchId)) {
                    showToast('Only one bet per match allowed', 'error');
                    return;
                }
                
                gameState.selectedBets.push({
                    matchId,
                    matchName,
                    market,
                    selection,
                    display,
                    odds,
                    match
                });
                showToast('Bet added to accumulator', 'success');
            }
            
            updateBetSlip();
        };

        // ===== UPDATE BET SLIP =====
        function updateBetSlip() {
            const container = document.getElementById('betslip-items');
            const totalOddsEl = document.getElementById('total-odds');
            const potentialWinEl = document.getElementById('potential-win');
            const placeReturnEl = document.getElementById('place-return');
            const totalReturnEl = document.getElementById('total-return');
            const placeBetBtn = document.getElementById('place-bet-btn');
            
            if (gameState.selectedBets.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: var(--text-dim); padding: 20px;"><i class="fas fa-arrow-up"></i> Click odds to add bets</div>';
                totalOddsEl.textContent = '0.00';
                potentialWinEl.textContent = '$0.00';
                placeReturnEl.textContent = '$0.00';
                totalReturnEl.textContent = '$0.00';
                placeBetBtn.disabled = true;
                return;
            }
            
            // Calculate total odds
            let totalOdds = gameState.selectedBets.reduce((acc, bet) => acc * bet.odds, 1);
            totalOdds = parseFloat(totalOdds.toFixed(2));
            
            const betAmount = parseFloat(document.getElementById('bet-amount').value) || BETTING_RULES.minBet;
            
            // Calculate returns
            let winReturn = betAmount * totalOdds;
            let placeReturn = 0;
            let totalReturn = winReturn;
            
            if (gameState.eachWay) {
                const placeOdds = (totalOdds - 1) / BETTING_RULES.eachWayPlaceTerms + 1;
                placeReturn = betAmount * placeOdds;
                totalReturn = winReturn + placeReturn;
            }
            
            // System bets calculation
            if (gameState.betType === 'system' && gameState.selectedBets.length >= 2) {
                const [k, n] = gameState.systemType.split('/').map(Number);
                const combinations = calculateCombinations(gameState.selectedBets, k);
                totalOdds = combinations.reduce((sum, combo) => {
                    const comboOdds = combo.reduce((acc, bet) => acc * bet.odds, 1);
                    return sum + comboOdds;
                }, 0) / combinations.length;
                totalReturn = betAmount * totalOdds;
            }
            
            totalOddsEl.textContent = totalOdds.toFixed(2);
            potentialWinEl.textContent = `$${winReturn.toFixed(2)}`;
            placeReturnEl.textContent = `$${placeReturn.toFixed(2)}`;
            totalReturnEl.textContent = `$${totalReturn.toFixed(2)}`;
            placeBetBtn.disabled = false;
            
            let html = '';
            gameState.selectedBets.forEach((bet, index) => {
                html += `
                    <div class="betslip-item">
                        <div class="betslip-item-header">
                            <span class="betslip-match">${bet.matchName}</span>
                            <span class="betslip-remove" onclick="removeBet(${index})">
                                <i class="fas fa-times"></i>
                            </span>
                        </div>
                        <div class="betslip-market">${bet.market} - ${bet.display}</div>
                        <div class="betslip-details">
                            <span class="betslip-odds">${bet.odds.toFixed(2)}</span>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }

        // ===== CALCULATE COMBINATIONS =====
        function calculateCombinations(selections, k) {
            const combinations = [];
            
            function combine(arr, k, start, current) {
                if (current.length === k) {
                    combinations.push([...current]);
                    return;
                }
                
                for (let i = start; i < arr.length; i++) {
                    current.push(arr[i]);
                    combine(arr, k, i + 1, current);
                    current.pop();
                }
            }
            
            combine(selections, k, 0, []);
            return combinations;
        }

        // ===== REMOVE BET =====
        window.removeBet = function(index) {
            gameState.selectedBets.splice(index, 1);
            updateBetSlip();
            showToast('Bet removed', 'info');
        };

        // ===== CLEAR BET SLIP =====
        function clearBetSlip() {
            gameState.selectedBets = [];

        }

        // ===== GENERATE TICKET NUMBER =====
        function generateTicketNumber() {
            const prefix = gameState.betType === 'system' ? 'SYS' : 
                          gameState.selectedBets.length > 1 ? 'ACC' : 'TKT';
            const date = new Date();
            const yy = date.getFullYear().toString().slice(-2);
            const mm = ('0' + (date.getMonth() + 1)).slice(-2);
            const dd = ('0' + date.getDate()).slice(-2);
            const hh = ('0' + date.getHours()).slice(-2);
            const min = ('0' + date.getMinutes()).slice(-2);
            const sec = ('0' + date.getSeconds()).slice(-2);
            const random = Math.random().toString(36).substring(2, 6).toUpperCase();
            
            return `${prefix}-${yy}${mm}${dd}-${hh}${min}${sec}-${random}`;
        }

        // ===== CHECK IF BET WINS =====
        function checkBetWin(bet, matchResult) {
            if (!matchResult) return false;
            
            const homeGoals = matchResult.goals.home;
            const awayGoals = matchResult.goals.away;
            const totalGoals = homeGoals + awayGoals;
            
            switch(bet.market) {
                case 'Match Winner':
                    if (bet.selection === '1') return homeGoals > awayGoals;
                    if (bet.selection === 'X') return homeGoals === awayGoals;
                    if (bet.selection === '2') return awayGoals > homeGoals;
                    break;
                    
                case 'Total Goals':
                    const threshold = parseFloat(bet.display.split(' ')[1]);
                    if (bet.selection.includes('Over')) return totalGoals > threshold;
                    if (bet.selection.includes('Under')) return totalGoals < threshold;
                    break;
                    
                case 'BTTS':
                    const bothScored = homeGoals > 0 && awayGoals > 0;
                    return bothScored === (bet.selection === 'Yes');
                    
                case 'Double Chance':
                    if (bet.selection === '1X') return homeGoals >= awayGoals;
                    if (bet.selection === '12') return homeGoals !== awayGoals;
                    if (bet.selection === 'X2') return awayGoals >= homeGoals;
                    break;
            }
            
            return false;
        }

        // ===== CHECK MATCH RESULTS =====
        async function checkMatchResults() {
            const finishedMatches = gameState.matches.filter(m => 
                ['FT', 'AET', 'PEN'].includes(m.fixture.status.short)
            );
            
            // Store results
            finishedMatches.forEach(match => {
                gameState.matchResults[match.fixture.id] = match.goals;
            });
            
            // Check open bets against results
            await settleBets();
        }

        // ===== SETTLE BETS =====
        async function settleBets() {
            const unsettledBets = gameState.openBets.filter(b => b.status === 'pending');
            
            for (const bet of unsettledBets) {
                const allMatchesFinished = bet.selections.every(s => 
                    gameState.matchResults[s.matchId] !== undefined
                );
                
                if (allMatchesFinished) {
                    // Check if bet wins
                    const won = bet.selections.every(s => 
                        checkBetWin(s, { goals: gameState.matchResults[s.matchId] })
                    );
                    
                    let winAmount = 0;
                    let status = 'lost';
                    
                    if (won) {
                        winAmount = bet.stake * bet.totalOdds;
                        status = 'won';
                        
                        // Process win transaction
                        await processTransaction(
                            winAmount,
                            "football_win",
                            `Win #${bet.ticketNumber}`
                        );
                    }
                    
                    // Update bet status
                    bet.status = status;
                    bet.return = won ? winAmount : 0;
                    
                    // Save to Firebase
                    await db.collection("football_bets").doc(bet.ticketNumber).update({
                        status: status,
                        return: won ? winAmount : 0,
                        settledAt: new Date()
                    });
                    
                    // Add to history
                    gameState.betHistory.unshift({
                        ...bet,
                        timestamp: new Date()
                    });
                    
                    // Show notification
                    showToast(
                        won ? `🎉 Bet won! +$${winAmount.toFixed(2)}` : '😞 Bet lost',
                        won ? 'success' : 'error'
                    );
                    
                    // Show result overlay for current user
                    if (bet.userId === gameState.currentUser.uid) {
                        showBetResult(won, winAmount, bet.stake, bet.ticketNumber);
                    }
                }
            }
            
            // Update stats
            updateStats();
            displayOpenBets();
            displayHistory();
        }

        // ===== PLACE BET =====
        async function placeBet() {
            const betAmount = parseFloat(document.getElementById('bet-amount').value);
            
            // Validation
            if (gameState.selectedBets.length === 0) {
                showToast('Select at least one bet', 'error');
                return;
            }
            
            if (betAmount < BETTING_RULES.minBet || betAmount > BETTING_RULES.maxBet) {
                showToast(`Bet must be between $${BETTING_RULES.minBet} and $${BETTING_RULES.maxBet}`, 'error');
                return;
            }
            
            if (betAmount > gameState.balance) {
                showToast('Insufficient funds', 'error');
                return;
            }
            
            if (gameState.userLimits.todayWagered + betAmount > gameState.userLimits.dailyMax) {
                showToast('Daily limit exceeded', 'error');
                return;
            }
            
            if (gameState.isPlacingBet) return;
            
            gameState.isPlacingBet = true;
            document.getElementById('place-bet-btn').disabled = true;
            
            const totalOdds = gameState.selectedBets.reduce((acc, bet) => acc * bet.odds, 1);
            const potentialWin = betAmount * totalOdds;
            const ticketNumber = generateTicketNumber();
            
            // Process bet transaction
            const result = await processTransaction(
                -betAmount,
                "football_bet",
                `Bet #${ticketNumber} - ${gameState.selectedBets.length} selections @ ${totalOdds.toFixed(2)}`
            );
            
            if (!result.success) {
                gameState.isPlacingBet = false;
                document.getElementById('place-bet-btn').disabled = false;
                return;
            }
            
            // Create bet object
            const bet = {
                ticketNumber,
                userId: gameState.currentUser.uid,
                selections: gameState.selectedBets.map(s => ({
                    matchId: s.matchId,
                    matchName: s.matchName,
                    market: s.market,
                    selection: s.selection,
                    display: s.display,
                    odds: s.odds
                })),
                stake: betAmount,
                totalOdds,
                potentialWin,
                betType: gameState.betType,
                systemType: gameState.betType === 'system' ? gameState.systemType : null,
                eachWay: gameState.eachWay,
                status: 'pending',
                createdAt: new Date()
            };
            
            // Save to Firebase
            await db.collection("football_bets").doc(ticketNumber).set({
                ...bet,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            
            // Add to open bets
            gameState.openBets.unshift(bet);
            
            // Update daily wagered
            gameState.userLimits.todayWagered += betAmount;
            
            // Update stats
            gameState.stats.totalBets++;
            gameState.stats.totalStaked += betAmount;
            
            showToast(`Bet placed! Ticket #${ticketNumber}`, 'success');
            
            // Clear bet slip
            gameState.selectedBets = [];
            updateBetSlip();
            
            // Update displays
            displayOpenBets();
            updateStats();
            
            gameState.isPlacingBet = false;
            document.getElementById('place-bet-btn').disabled = false;
        }

        // ===== SHOW BET RESULT =====
        function showBetResult(win, winAmount, stake, ticketNumber) {
            const icon = document.getElementById('result-icon');
            const title = document.getElementById('result-title');
            const amount = document.getElementById('result-amount');
            
            icon.innerHTML = win ? '🎉' : '😞';
            icon.className = `result-icon ${win ? 'win' : 'lose'}`;
            
            title.textContent = win ? 'YOU WIN!' : 'BET LOST';
            title.className = `result-title ${win ? 'win' : 'lose'}`;
            
            document.getElementById('result-details').innerHTML = `
                Ticket: ${ticketNumber}<br>
                Stake: $${stake.toFixed(2)}
            `;
            
            amount.textContent = win ? `+$${winAmount.toFixed(2)}` : `-$${stake.toFixed(2)}`;
            amount.className = `result-amount ${win ? 'win' : 'lose'}`;
            
            document.getElementById('result-overlay').classList.add('show');
        }

        function closeResultOverlay() {
            document.getElementById('result-overlay').classList.remove('show');
        }

        // ===== LOAD OPEN BETS =====
        async function loadOpenBets() {
            try {
                const snapshot = await db.collection("football_bets")
                    .where("userId", "==", gameState.currentUser.uid)
                    .where("status", "==", "pending")
                    .orderBy("createdAt", "desc")
                    .limit(20)
                    .get();
                
                gameState.openBets = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    gameState.openBets.push({
                        ...data,
                        createdAt: data.createdAt?.toDate() || new Date()
                    });
                });
                
                displayOpenBets();
            } catch (error) {
                console.error('Error loading open bets:', error);
            }
        }

        function displayOpenBets() {
            const grid = document.getElementById('open-bets-grid');
            
            if (gameState.openBets.length === 0) {
                grid.innerHTML = '<div style="text-align: center; padding: 20px; color: var(--text-dim);">No open bets</div>';
                return;
            }
            
            let html = '';
            gameState.openBets.slice(0, 5).forEach(bet => {
                const selectionsText = bet.selections.map(s => 
                    `${s.matchName} - ${s.display} @ ${s.odds.toFixed(2)}`
                ).join('<br>');
                
                html += `
                    <div class="bet-card pending">
                        <div class="bet-card-header">
                            <span class="bet-ticket">#${bet.ticketNumber}</span>
                            <span class="bet-status pending">PENDING</span>
                        </div>
                        <div class="bet-details">
                            ${selectionsText}
                        </div>
                        <div class="bet-footer">
                            <span class="bet-stake">$${bet.stake.toFixed(2)}</span>
                            <span class="bet-return">$${(bet.stake * bet.totalOdds).toFixed(2)}</span>
                            <button class="cashout-btn" onclick="cashOut('${bet.ticketNumber}')">
                                CASH OUT
                            </button>
                        </div>
                    </div>
                `;
            });
            
            grid.innerHTML = html;
        }

        // ===== CASH OUT =====
        window.cashOut = async function(ticketNumber) {
            const bet = gameState.openBets.find(b => b.ticketNumber === ticketNumber);
            if (!bet) return;
            
            const cashoutValue = bet.stake * 0.7; // 70% of stake as cashout
            
            const confirm = window.confirm(`Cash out for $${cashoutValue.toFixed(2)}?`);
            if (!confirm) return;
            
            // Process cashout
            await processTransaction(
                cashoutValue,
                "football_cashout",
                `Cash out #${ticketNumber}`
            );
            
            // Update bet status
            bet.status = 'cashed_out';
            bet.return = cashoutValue;
            
            await db.collection("football_bets").doc(ticketNumber).update({
                status: 'cashed_out',
                return: cashoutValue,
                cashedOutAt: new Date()
            });
            
            // Remove from open bets
            gameState.openBets = gameState.openBets.filter(b => b.ticketNumber !== ticketNumber);
            
            displayOpenBets();
            showToast(`Cashed out $${cashoutValue.toFixed(2)}`, 'success');
        };

        // ===== LOAD BET HISTORY =====
        async function loadBetHistory() {
            try {
                const snapshot = await db.collection("football_bets")
                    .where("userId", "==", gameState.currentUser.uid)
                    .where("status", "in", ["won", "lost", "cashed_out"])
                    .orderBy("createdAt", "desc")
                    .limit(50)
                    .get();
                
                gameState.betHistory = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    gameState.betHistory.push({
                        ...data,
                        timestamp: data.createdAt?.toDate() || new Date()
                    });
                });
                
                displayHistory();
                updateStats();
            } catch (error) {
                console.error('Error loading history:', error);
            }
        }

        function displayHistory(filter = 'all') {
            const list = document.getElementById('history-list');
            
            let filtered = gameState.betHistory;
            if (filter !== 'all') {
                filtered = gameState.betHistory.filter(b => b.status === filter);
            }
            
            if (filtered.length === 0) {
                list.innerHTML = '<div style="text-align: center; padding: 20px; color: var(--text-dim);">No history</div>';
                return;
            }
            
            let html = '';
            filtered.slice(0, 10).forEach(bet => {
                const date = bet.timestamp.toLocaleDateString();
                const time = bet.timestamp.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                
                html += `
                    <div class="bet-card ${bet.status}">
                        <div class="bet-card-header">
                            <span class="bet-ticket">#${bet.ticketNumber}</span>
                            <span class="bet-status ${bet.status}">${bet.status.toUpperCase()}</span>
                        </div>
                        <div class="bet-details">
                            ${bet.selections.length} selections @ ${bet.totalOdds.toFixed(2)}
                        </div>
                        <div class="bet-footer">
                            <span class="bet-stake">$${bet.stake.toFixed(2)}</span>
                            <span class="bet-return ${bet.status}">
                                ${bet.return ? (bet.return > 0 ? '+' : '') + bet.return.toFixed(2) : '$0.00'}
                            </span>
                            <span class="history-time">${date} ${time}</span>
                        </div>
                    </div>
                `;
            });
            
            list.innerHTML = html;
        }

        // ===== UPDATE STATS =====
        function updateStats() {
            const won = gameState.betHistory.filter(b => b.status === 'won').length;
            const total = gameState.betHistory.length;
            const winRate = total > 0 ? (won / total * 100).toFixed(1) : 0;
            
            document.getElementById('win-rate').textContent = `${winRate}%`;
        }

        // ===== TRANSACTIONS =====
        async function processTransaction(amount, type, description) {
            try {
                const walletRef = db.collection("wallets").doc(gameState.currentUser.uid);
                
                return await db.runTransaction(async (transaction) => {
                    const walletDoc = await transaction.get(walletRef);
                    
                    if (!walletDoc.exists) {
                        throw new Error("Wallet not found");
                    }
                    
                    const currentBalance = walletDoc.data().balance || 0;
                    const newBalance = currentBalance + amount;
                    
                    if (newBalance < 0) {
                        throw new Error("Insufficient funds");
                    }
                    
                    transaction.update(walletRef, {
                        balance: newBalance,
                        updatedAt: new Date()
                    });
                    
                    const transactionRef = walletRef.collection("transactions").doc();
                    transaction.set(transactionRef, {
                        type: type,
                        amount: amount,
                        description: description,
                        createdAt: new Date(),
                        gameId: gameState.gameId || 'football_bet',
                        beforeBalance: currentBalance,
                        afterBalance: newBalance
                    });
                    
                    gameState.balance = newBalance;
                    updateBalanceDisplay();
                    
                    return { success: true, newBalance };
                    
                });
            } catch (error) {
                console.error('Transaction failed:', error);
                showToast('Transaction failed: ' + error.message, 'error');
                return { success: false, error: error.message };
            }
        }

        // ===== TOAST NOTIFICATIONS =====
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            
            container.appendChild(toast);
            
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => container.removeChild(toast), 300);
            }, 3000);
        }

        // ===== EVENT LISTENERS =====
        function setupEventListeners() {
            // League filter
            document.querySelectorAll('.league-btn').forEach(btn => {
                btn.addEventListener('click', () => filterMatches(btn.dataset.league));
            });
            
            // Market tabs
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', () => filterMarket(btn.dataset.market));
            });
            
            // Bet slip tabs
            document.querySelectorAll('.betslip-tab').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.betslip-tab').forEach(t => t.classList.remove('active'));
                    btn.classList.add('active');
                    gameState.betType = btn.dataset.betslip;
                    
                    // Show/hide system options
                    document.getElementById('system-options').style.display = 
                        gameState.betType === 'system' ? 'block' : 'none';
                    
                    // Clear selections when switching modes
                    gameState.selectedBets = [];
                    updateBetSlip();
                });
            });
            
            // System type change
            document.getElementById('system-type').addEventListener('change', (e) => {
                gameState.systemType = e.target.value;
                updateBetSlip();
            });
            
            // Each way toggle
            document.getElementById('each-way').addEventListener('change', (e) => {
                gameState.eachWay = e.target.checked;
                updateBetSlip();
            });
            
            // Clear bet slip
            document.getElementById('clear-betslip').addEventListener('click', clearBetSlip);
            
            // Place bet button
            document.getElementById('place-bet-btn').addEventListener('click', placeBet);
            
            // Quick bet amount
            document.querySelectorAll('.quick-bet').forEach(btn => {
                btn.addEventListener('click', () => {
                    const amount = parseFloat(btn.dataset.amount);
                    document.getElementById('bet-amount').value = amount;
                    updateBetSlip();
                });
            });
            
            // Bet amount input
            document.getElementById('bet-amount').addEventListener('input', (e) => {
                let value = parseFloat(e.target.value) || BETTING_RULES.minBet;
                value = Math.max(BETTING_RULES.minBet, Math.min(value, BETTING_RULES.maxBet));
                e.target.value = value;
                updateBetSlip();
            });
            
            // History tabs
            document.querySelectorAll('.history-tab').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.history-tab').forEach(t => t.classList.remove('active'));
                    btn.classList.add('active');
                    displayHistory(btn.dataset.history);
                });
            });
            
            // Close overlay
            document.getElementById('result-overlay').addEventListener('click', (e) => {
                if (e.target === document.getElementById('result-overlay')) {
                    closeResultOverlay();
                }
            });
        }

        // Make functions global
        window.closeResultOverlay = closeResultOverlay;
        window.cashOut = cashOut;
    </script>
</body>
</html>
