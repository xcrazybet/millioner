<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VORTEX | Real-Time Crypto Exchange</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <!-- moment.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
        }

        :root {
            --bg-dark: #0b0f1c;
            --surface: #121826;
            --surface-elevated: #1a1f2e;
            --primary: #00f5a0;
            --primary-glow: rgba(0, 245, 160, 0.2);
            --buy: #00c48c;
            --sell: #ff5e7c;
            --text: #f0f3fa;
            --text-dim: #8e9aaf;
            --border: rgba(255,255,255,0.08);
            --danger: #ff4d6d;
            --warning: #ffb347;
        }

        body {
            background: var(--bg-dark);
            color: var(--text);
            overflow-x: hidden;
            padding-bottom: 70px;
        }

        /* Header */
        .header {
            background: rgba(18, 24, 38, 0.95);
            backdrop-filter: blur(12px);
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--primary);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }
        .logo {
            font-weight: 800;
            font-size: 1.4rem;
            background: linear-gradient(135deg, var(--primary), #6effb0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .balance-card {
            background: var(--surface-elevated);
            padding: 8px 18px;
            border-radius: 40px;
            border: 1px solid var(--border);
            font-weight: 700;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }
        .balance-card i { color: var(--primary); }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(18, 24, 38, 0.98);
            backdrop-filter: blur(12px);
            display: flex;
            justify-content: space-around;
            padding: 10px 16px 18px;
            border-top: 1px solid var(--border);
            z-index: 200;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-dim);
            font-size: 12px;
            transition: 0.2s;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 30px;
        }
        .nav-item i { font-size: 22px; }
        .nav-item.active { color: var(--primary); background: rgba(0,245,160,0.1); }

        /* pages */
        .page { display: none; padding: 18px 16px; animation: fade 0.25s ease; }
        .page.active { display: block; }
        @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

        /* market grid */
        .market-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 12px;
        }
        .market-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 16px;
            transition: 0.2s;
            cursor: pointer;
        }
        .market-card:hover { border-color: var(--primary); transform: translateY(-2px); background: var(--surface-elevated);}
        .row-space {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .symbol { font-weight: 700; font-size: 1.2rem; }
        .price { font-size: 1.3rem; font-weight: 800; }
        .change { font-size: 0.8rem; font-weight: 600; padding: 4px 10px; border-radius: 30px; background: rgba(0,0,0,0.3);}
        .positive { color: var(--buy); }
        .negative { color: var(--sell); }
        .btn-sm {
            padding: 8px 12px;
            border-radius: 40px;
            font-weight: 600;
            border: none;
            background: rgba(255,255,255,0.05);
            color: white;
            cursor: pointer;
        }
        .btn-buy { background: var(--buy); color: #000; }
        .btn-sell { background: var(--sell); color: white; }

        /* asset page */
        .asset-header {
            background: var(--surface-elevated);
            border-radius: 32px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .chart-container {
            background: var(--surface);
            border-radius: 24px;
            padding: 12px;
            margin-bottom: 20px;
            height: 280px;
        }
        .trade-panel {
            background: var(--surface);
            border-radius: 28px;
            padding: 20px;
        }
        .input-group {
            margin-bottom: 16px;
        }
        .input-group label {
            display: block;
            font-size: 12px;
            color: var(--text-dim);
            margin-bottom: 6px;
        }
        .input-field {
            width: 100%;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            padding: 14px;
            border-radius: 24px;
            color: white;
            font-size: 1rem;
        }
        .perc-btns {
            display: flex;
            gap: 12px;
            margin: 10px 0;
        }
        .perc-btn {
            background: var(--surface-elevated);
            border: none;
            padding: 6px 12px;
            border-radius: 40px;
            color: white;
            cursor: pointer;
        }
        .order-summary {
            background: var(--bg-dark);
            border-radius: 20px;
            padding: 14px;
            margin: 16px 0;
        }
        .action-btn-lg {
            width: 100%;
            padding: 14px;
            border-radius: 44px;
            font-weight: 800;
            font-size: 1rem;
            border: none;
            margin-top: 10px;
        }
        .holdings-list {
            margin-top: 20px;
        }
        .holding-row {
            background: var(--surface);
            border-radius: 20px;
            padding: 14px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* toast */
        .toast-stack {
            position: fixed;
            bottom: 85px;
            left: 16px;
            right: 16px;
            z-index: 300;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }
        .toast {
            background: #1e2a3a;
            backdrop-filter: blur(12px);
            border-left: 4px solid var(--primary);
            padding: 12px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            animation: slideUp 0.2s ease;
            pointer-events: auto;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .flex-between { display: flex; justify-content: space-between; align-items: center;}
        .text-primary { color: var(--primary); }
        .mt-2 { margin-top: 8px; }
    </style>
</head>
<body>

<div class="header">
    <div class="logo"><i class="fas fa-charging-station"></i> VORTEX<span style="color:white;">.EX</span></div>
    <div class="balance-card" id="balanceHeaderBtn">
        <i class="fas fa-coins"></i> $<span id="headerBalance">10000.00</span>
    </div>
</div>

<div class="toast-stack" id="toastStack"></div>

<!-- Market Page -->
<div id="page-market" class="page active">
    <div style="margin-bottom: 16px;">
        <div class="flex-between">
            <h3><i class="fas fa-chart-line"></i> Live Market</h3>
            <span style="background: var(--primary-glow); padding: 4px 12px; border-radius: 30px; font-size: 12px;">⚡ REAL PRICE</span>
        </div>
        <input type="text" id="searchCoin" placeholder="Search BTC, ETH, SOL..." style="width:100%; margin-top:12px; background:var(--surface); border:1px solid var(--border); padding:12px; border-radius:40px; color:white;">
    </div>
    <div id="marketGrid" class="market-grid"></div>
</div>

<!-- Asset / Trade Page -->
<div id="page-asset" class="page">
    <div id="assetDynamicHeader"></div>
    <div class="chart-container">
        <canvas id="priceChartCanvas" style="height:240px; width:100%;"></canvas>
    </div>
    <div class="trade-panel">
        <div style="display: flex; gap: 16px; margin-bottom: 20px;">
            <button id="tabBuyBtn" class="btn-sm" style="background:var(--buy); color:black; flex:1;">BUY</button>
            <button id="tabSellBtn" class="btn-sm" style="background:var(--surface-elevated); flex:1;">SELL</button>
        </div>
        <div id="tradeFormContainer"></div>
    </div>
    <div style="margin-top: 20px;">
        <h4>Your Holdings</h4>
        <div id="assetHoldingsList"></div>
    </div>
</div>

<!-- Portfolio Page -->
<div id="page-portfolio" class="page">
    <div class="flex-between" style="background:var(--surface); padding:18px; border-radius:28px; margin-bottom:16px;">
        <div><span style="color:var(--text-dim);">Net Worth</span><br><span id="netWorth" style="font-size:28px; font-weight:800;">$10000</span></div>
        <div><span style="color:var(--text-dim);">24h P&L</span><br><span id="totalPnL" class="positive">+$0.00</span></div>
    </div>
    <div class="holdings-list" id="portfolioHoldingsList"></div>
    <div style="margin-top:20px;">
        <h4>📜 Trade History</h4>
        <div id="tradeHistoryList" style="max-height:350px; overflow-y:auto;"></div>
    </div>
</div>

<!-- Account Page -->
<div id="page-account" class="page">
    <div style="background:var(--surface); border-radius:32px; padding:20px;">
        <h3><i class="fas fa-id-card"></i> Account</h3>
        <div class="flex-between mt-2"><span>User ID</span><span id="userIdDisplay">trader_001</span></div>
        <div class="flex-between mt-2"><span>Total Trades</span><span id="totalTradesCount">0</span></div>
        <div class="flex-between mt-2"><span>Win Rate</span><span id="winRate">0%</span></div>
        <button id="resetAccountBtn" style="margin-top:24px; width:100%; background:var(--danger); border:none; padding:14px; border-radius:40px; font-weight:bold;">RESET DEMO ACCOUNT</button>
    </div>
</div>

<nav class="bottom-nav">
    <div class="nav-item active" data-page="market"><i class="fas fa-chart-simple"></i><span>Market</span></div>
    <div class="nav-item" data-page="portfolio"><i class="fas fa-briefcase"></i><span>Portfolio</span></div>
    <div class="nav-item" data-page="asset"><i class="fas fa-chart-line"></i><span>Trade</span></div>
    <div class="nav-item" data-page="account"><i class="fas fa-user"></i><span>Account</span></div>
</nav>

<script>
    // ---------- REAL EXCHANGE CORE ----------
    // State: user wallet, orderbook simulation (limit/market), real price feed via Binance WS
    let currentUser = {
        uid: "vortex_user_1",
        balance: 10000.0,
        holdings: {}   // e.g. { btcusdt: { amount, avgPrice } }
    };
    let marketPrices = {};     // live from binance
    let tradeHistory = [];     // store executed trades
    let currentAsset = "btcusdt";
    let priceChart = null;
    let priceHistory = [];
    let ws = null;
    let activeTab = "buy";   // buy/sell

    // asset list (top 8 coins)
    const SYMBOLS = ["btcusdt", "ethusdt", "solusdt", "bnbusdt", "xrpusdt", "adausdt", "dogeusdt", "avaxusdt"];
    const ASSET_META = {
        btcusdt: { name: "Bitcoin", icon: "₿", color: "#F7931A" },
        ethusdt: { name: "Ethereum", icon: "Ξ", color: "#627EEA" },
        solusdt: { name: "Solana", icon: "◎", color: "#00FFA3" },
        bnbusdt: { name: "BNB", icon: "B", color: "#F3BA2F" },
        xrpusdt: { name: "Ripple", icon: "X", color: "#1E2A5E" },
        adausdt: { name: "Cardano", icon: "A", color: "#0033AD" },
        dogeusdt: { name: "Dogecoin", icon: "Ð", color: "#C2A633" },
        avaxusdt: { name: "Avalanche", icon: "A", color: "#E84142" }
    };

    // ---------- INDEXEDDB (PERSISTENT WALLET + HISTORY) ----------
    const DB_NAME = "VortexExchangeDB";
    const DB_VERSION = 1;
    let db = null;

    function openDB() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open(DB_NAME, DB_VERSION);
            request.onerror = () => reject(request.error);
            request.onsuccess = () => { db = request.result; resolve(db); };
            request.onupgradeneeded = (ev) => {
                const dbEv = ev.target.result;
                if (!dbEv.objectStoreNames.contains("userState")) {
                    dbEv.createObjectStore("userState", { keyPath: "id" });
                }
                if (!dbEv.objectStoreNames.contains("tradeHistory")) {
                    dbEv.createObjectStore("tradeHistory", { keyPath: "txId", autoIncrement: true });
                }
            };
        });
    }

    async function saveUserState() {
        if (!db) return;
        const tx = db.transaction(["userState"], "readwrite");
        const store = tx.objectStore("userState");
        store.put({ id: currentUser.uid, balance: currentUser.balance, holdings: currentUser.holdings });
        await tx.done;
    }

    async function saveTrade(trade) {
        if (!db) return;
        const tx = db.transaction(["tradeHistory"], "readwrite");
        const store = tx.objectStore("tradeHistory");
        store.add({ ...trade, timestamp: Date.now() });
        await tx.done;
        await loadTradeHistory();
    }

    async function loadUserStateFromDB() {
        if (!db) return;
        const tx = db.transaction(["userState"], "readonly");
        const store = tx.objectStore("userState");
        const userRecord = await new Promise((res) => {
            const req = store.get(currentUser.uid);
            req.onsuccess = () => res(req.result);
        });
        if (userRecord) {
            currentUser.balance = userRecord.balance;
            currentUser.holdings = userRecord.holdings || {};
        } else {
            // default initial holdings
            currentUser.balance = 10000;
            currentUser.holdings = {};
            await saveUserState();
        }
        updateUIAll();
    }

    async function loadTradeHistory() {
        if (!db) return;
        const tx = db.transaction(["tradeHistory"], "readonly");
        const store = tx.objectStore("tradeHistory");
        const all = await new Promise((res) => {
            const req = store.getAll();
            req.onsuccess = () => res(req.result || []);
        });
        tradeHistory = all.sort((a,b)=>b.timestamp - a.timestamp);
        renderTradeHistory();
        updateAccountStats();
    }

    // ---------- REAL PRICE ENGINE (Binance WebSocket multi-stream) ----------
    function initPriceFeed() {
        const streams = SYMBOLS.map(s => `${s}@ticker`).join('/');
        const wsUrl = `wss://stream.binance.com:9443/stream?streams=${streams}`;
        ws = new WebSocket(wsUrl);
        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            const streamName = data.stream;
            const ticker = data.data;
            const symbol = streamName.split('@')[0];
            const price = parseFloat(ticker.c);
            const change = parseFloat(ticker.P);
            if (price && symbol) {
                marketPrices[symbol] = { price, change, high: parseFloat(ticker.h), low: parseFloat(ticker.l), vol: parseFloat(ticker.v) };
                updateMarketUI();
                if (currentAsset === symbol) {
                    updateAssetPagePrice(price, change);
                    pushPriceToChart(price);
                }
                updatePortfolioValues();
            }
        };
        ws.onerror = () => console.warn("WS error, fallback to REST");
    }

    // fallback REST once
    async function fetchInitialPrices() {
        try {
            const res = await fetch("https://api.binance.com/api/v3/ticker/24hr?symbols=" + JSON.stringify(SYMBOLS.map(s=>s.toUpperCase())));
            const data = await res.json();
            data.forEach(item => {
                const sym = item.symbol.toLowerCase();
                marketPrices[sym] = { price: parseFloat(item.lastPrice), change: parseFloat(item.priceChangePercent), high: parseFloat(item.highPrice), low: parseFloat(item.lowPrice) };
            });
            renderMarketGrid();
        } catch(e) { console.warn(e); }
    }

    // ---------- TRADE ENGINE (Market + Limit simulation with real price) ----------
    function executeMarketTrade(side, asset, amount, currentPrice) {
        if (!currentPrice || amount <= 0) return { success: false, msg: "Invalid price/amount" };
        const totalCost = amount * currentPrice;
        const fee = totalCost * 0.001;
        const netCost = totalCost + fee;

        if (side === "buy") {
            if (currentUser.balance < netCost) return { success: false, msg: "Insufficient balance" };
            currentUser.balance -= netCost;
            const existing = currentUser.holdings[asset] || { amount: 0, avgPrice: 0 };
            const newAmount = existing.amount + amount;
            const newAvg = ((existing.amount * existing.avgPrice) + (amount * currentPrice)) / newAmount;
            currentUser.holdings[asset] = { amount: newAmount, avgPrice: newAvg };
            // record trade
            const tradeRecord = { side: "buy", asset, amount, price: currentPrice, total: totalCost, fee, pnl: null, timestamp: Date.now() };
            saveTrade(tradeRecord);
            return { success: true, msg: `Bought ${amount.toFixed(6)} ${asset.toUpperCase()} @ $${currentPrice}` };
        } 
        else { // sell
            const holding = currentUser.holdings[asset];
            if (!holding || holding.amount < amount) return { success: false, msg: "Insufficient holdings" };
            const revenue = amount * currentPrice;
            const feeSell = revenue * 0.001;
            const netRevenue = revenue - feeSell;
            currentUser.balance += netRevenue;
            const costBasis = holding.avgPrice * amount;
            const pnl = revenue - costBasis;
            const newAmount = holding.amount - amount;
            if (newAmount < 1e-8) delete currentUser.holdings[asset];
            else currentUser.holdings[asset].amount = newAmount;
            const tradeRecord = { side: "sell", asset, amount, price: currentPrice, total: revenue, fee: feeSell, pnl: pnl, timestamp: Date.now() };
            saveTrade(tradeRecord);
            return { success: true, msg: `Sold ${amount.toFixed(6)} ${asset.toUpperCase()} | P&L: ${pnl >=0 ? '+' : ''}$${pnl.toFixed(2)}` };
        }
    }

    // ---------- UI RENDERING ----------
    function renderMarketGrid() {
        const container = document.getElementById("marketGrid");
        if (!container) return;
        container.innerHTML = "";
        SYMBOLS.forEach(sym => {
            const data = marketPrices[sym] || { price: 0, change: 0 };
            const meta = ASSET_META[sym] || { name: sym.toUpperCase(), icon: sym[0].toUpperCase() };
            const displaySym = sym.replace("usdt", "").toUpperCase();
            const priceVal = data.price;
            const changeVal = data.change;
            const isPos = changeVal >= 0;
            const card = document.createElement("div");
            card.className = "market-card";
            card.onclick = () => { selectAsset(sym); };
            card.innerHTML = `
                <div class="row-space">
                    <div><span class="symbol">${displaySym}</span> <span style="font-size:12px; color:var(--text-dim);">${meta.name}</span></div>
                    <div class="change ${isPos ? 'positive' : 'negative'}">${isPos ? '+' : ''}${changeVal.toFixed(2)}%</div>
                </div>
                <div class="row-space">
                    <span class="price">$${priceVal ? priceVal.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:4}) : '--'}</span>
                    <div><button class="btn-sm btn-buy" data-sym="${sym}" data-side="buy" style="margin-right:8px;">Buy</button>
                    <button class="btn-sm btn-sell" data-sym="${sym}" data-side="sell">Sell</button></div>
                </div>
            `;
            container.appendChild(card);
        });
        document.querySelectorAll("[data-side]").forEach(btn => {
            btn.addEventListener("click", (e) => {
                e.stopPropagation();
                const symbol = btn.getAttribute("data-sym");
                const side = btn.getAttribute("data-side");
                selectAsset(symbol);
                setTimeout(() => {
                    activeTab = side;
                    renderTradeForm();
                }, 50);
            });
        });
    }

    function updateMarketUI() {
        SYMBOLS.forEach(sym => {
            const data = marketPrices[sym];
            if (!data) return;
            const cards = document.querySelectorAll(".market-card");
            for (let card of cards) {
                if (card.innerText.includes(sym.replace("usdt","").toUpperCase())) {
                    const priceSpan = card.querySelector(".price");
                    const changeSpan = card.querySelector(".change");
                    if (priceSpan) priceSpan.innerText = `$${data.price.toLocaleString(undefined, {minimumFractionDigits:2})}`;
                    if (changeSpan) {
                        const isPos = data.change >= 0;
                        changeSpan.innerText = `${isPos ? '+' : ''}${data.change.toFixed(2)}%`;
                        changeSpan.className = `change ${isPos ? 'positive' : 'negative'}`;
                    }
                }
            }
        });
    }

    function selectAsset(asset) {
        currentAsset = asset;
        document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
        document.getElementById("page-asset").classList.add("active");
        updateAssetFullUI();
    }

    function updateAssetFullUI() {
        const meta = ASSET_META[currentAsset] || { name: currentAsset.toUpperCase(), icon: "₿" };
        const data = marketPrices[currentAsset] || { price: 45000, change: 0 };
        const symDisplay = currentAsset.replace("usdt","").toUpperCase();
        document.getElementById("assetDynamicHeader").innerHTML = `
            <div class="asset-header">
                <div class="flex-between"><div><i class="fas fa-coins" style="font-size:28px;"></i> <strong style="font-size:24px;">${meta.name} (${symDisplay})</strong></div>
                <div class="change ${data.change>=0?'positive':'negative'}">${data.change>=0?'+':''}${data.change.toFixed(2)}%</div></div>
                <div style="font-size:32px; font-weight:800;" id="assetCurrentPrice">$${data.price ? data.price.toFixed(4) : '--'}</div>
                <div style="font-size:12px;">24h High: ${data.high || '--'} &nbsp; Low: ${data.low || '--'}</div>
            </div>
        `;
        renderTradeForm();
        renderHoldingsForAsset();
        initPriceChart();
    }

    function updateAssetPagePrice(price, change) {
        const priceEl = document.getElementById("assetCurrentPrice");
        if (priceEl) priceEl.innerText = `$${price.toFixed(4)}`;
        const changeDiv = document.querySelector("#assetDynamicHeader .change");
        if (changeDiv) {
            changeDiv.innerText = `${change>=0?'+':''}${change.toFixed(2)}%`;
            changeDiv.className = `change ${change>=0?'positive':'negative'}`;
        }
    }

    function pushPriceToChart(price) {
        if (!priceChart) return;
        priceHistory.push({ time: Date.now(), price });
        if (priceHistory.length > 50) priceHistory.shift();
        priceChart.data.datasets[0].data = priceHistory.map(p => p.price);
        priceChart.update();
    }

    function initPriceChart() {
        const ctx = document.getElementById("priceChartCanvas").getContext("2d");
        if (priceChart) priceChart.destroy();
        priceHistory = [];
        const currentPrice = marketPrices[currentAsset]?.price || 40000;
        for (let i=0;i<30;i++) priceHistory.push({ time: Date.now() - (30-i)*60000, price: currentPrice * (1 + (Math.random()*0.02-0.01)) });
        priceChart = new Chart(ctx, {
            type: 'line',
            data: { datasets: [{ label: `${currentAsset.toUpperCase()} Price`, data: priceHistory.map(p=>p.price), borderColor: '#00f5a0', tension: 0.2, fill: false, pointRadius: 0 }] },
            options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { display: false } } }
        });
    }

    function renderTradeForm() {
        const container = document.getElementById("tradeFormContainer");
        const data = marketPrices[currentAsset] || { price: 50000 };
        const priceLive = data.price;
        const sideText = activeTab === "buy" ? "BUY" : "SELL";
        container.innerHTML = `
            <div class="input-group"><label>Amount (${currentAsset.replace("usdt","").toUpperCase()})</label>
            <input type="number" id="tradeAmount" class="input-field" placeholder="0.00" step="any"></div>
            <div class="perc-btns">
                <button class="perc-btn" data-perc="25">25%</button>
                <button class="perc-btn" data-perc="50">50%</button>
                <button class="perc-btn" data-perc="75">75%</button>
                <button class="perc-btn" data-perc="100">100%</button>
            </div>
            <div class="order-summary">
                <div>Market Price: <span id="summaryPrice">$${priceLive.toFixed(4)}</span></div>
                <div>Total + Fee (0.1%): <span id="summaryTotal">$0.00</span></div>
            </div>
            <button id="executeTradeBtn" class="action-btn-lg" style="background:${activeTab==='buy' ? 'var(--buy)' : 'var(--sell)'}; color:${activeTab==='buy'?'black':'white'}">
                ${sideText} ${currentAsset.replace("usdt","").toUpperCase()}
            </button>
        `;
        const amountInput = document.getElementById("tradeAmount");
        const summaryTotalSpan = document.getElementById("summaryTotal");
        const summaryPriceSpan = document.getElementById("summaryPrice");
        const updateSummary = () => {
            let amount = parseFloat(amountInput.value) || 0;
            let total = amount * priceLive;
            let fee = total * 0.001;
            summaryTotalSpan.innerText = `$${(total + fee).toFixed(2)}`;
        };
        amountInput.addEventListener("input", updateSummary);
        document.querySelectorAll(".perc-btn").forEach(btn => {
            btn.onclick = () => {
                const perc = parseFloat(btn.dataset.perc)/100;
                let maxAmount = 0;
                if (activeTab === "buy") {
                    maxAmount = currentUser.balance / (priceLive * (1+0.001));
                } else {
                    const holding = currentUser.holdings[currentAsset]?.amount || 0;
                    maxAmount = holding;
                }
                amountInput.value = (maxAmount * perc).toFixed(6);
                updateSummary();
            };
        });
        document.getElementById("executeTradeBtn").onclick = async () => {
            let amount = parseFloat(document.getElementById("tradeAmount").value);
            if (isNaN(amount) || amount <= 0) return showToast("Enter valid amount", "error");
            const livePrice = marketPrices[currentAsset]?.price;
            if (!livePrice) return showToast("Price not ready", "error");
            const result = executeMarketTrade(activeTab, currentAsset, amount, livePrice);
            showToast(result.msg, result.success ? "success" : "error");
            if (result.success) {
                await saveUserState();
                updateUIAll();
                renderHoldingsForAsset();
                renderPortfolioHoldings();
                updatePortfolioValues();
            }
        };
        updateSummary();
    }

    function renderHoldingsForAsset() {
        const container = document.getElementById("assetHoldingsList");
        const holding = currentUser.holdings[currentAsset];
        if (!holding || holding.amount < 1e-8) {
            container.innerHTML = "<div style='background:var(--surface); border-radius:20px; padding:12px;'>No holdings</div>";
            return;
        }
        const price = marketPrices[currentAsset]?.price || 0;
        const value = holding.amount * price;
        const pnl = value - (holding.amount * holding.avgPrice);
        container.innerHTML = `<div class="holding-row"><div><strong>${currentAsset.toUpperCase()}</strong><br>${holding.amount.toFixed(6)}</div><div>Avg $${holding.avgPrice.toFixed(2)}<br>Value $${value.toFixed(2)}</div><div class="${pnl>=0?'positive':'negative'}">${pnl>=0?'+':''}$${pnl.toFixed(2)}</div></div>`;
    }

    function renderPortfolioHoldings() {
        const container = document.getElementById("portfolioHoldingsList");
        if (!container) return;
        container.innerHTML = "";
        let totalValue = currentUser.balance;
        Object.keys(currentUser.holdings).forEach(asset => {
            const holding = currentUser.holdings[asset];
            const price = marketPrices[asset]?.price || 0;
            const value = holding.amount * price;
            totalValue += value;
            const pnl = value - (holding.amount * holding.avgPrice);
            container.innerHTML += `<div class="holding-row"><div><strong>${asset.toUpperCase()}</strong><br>${holding.amount.toFixed(5)}</div><div>$${value.toFixed(2)}</div><div class="${pnl>=0?'positive':'negative'}">${pnl>=0?'+':''}$${pnl.toFixed(2)}</div></div>`;
        });
        document.getElementById("netWorth").innerHTML = `$${totalValue.toFixed(2)}`;
        document.getElementById("headerBalance").innerText = currentUser.balance.toFixed(2);
    }

    function updatePortfolioValues() {
        let total = currentUser.balance;
        Object.keys(currentUser.holdings).forEach(asset => {
            const price = marketPrices[asset]?.price || 0;
            total += currentUser.holdings[asset].amount * price;
        });
        document.getElementById("netWorth").innerHTML = `$${total.toFixed(2)}`;
        document.getElementById("headerBalance").innerText = currentUser.balance.toFixed(2);
        const totalPnlElem = document.getElementById("totalPnL");
        if (totalPnlElem) totalPnlElem.innerText = `+$0.00`; // simplified
        renderPortfolioHoldings();
    }

    function renderTradeHistory() {
        const container = document.getElementById("tradeHistoryList");
        if (!container) return;
        if (tradeHistory.length === 0) { container.innerHTML = "<div class='holding-row'>No trades yet</div>"; return; }
        container.innerHTML = tradeHistory.slice(0,15).map(t => `
            <div class="holding-row" style="font-size:12px;">
                <div>${moment(t.timestamp).format("HH:mm")}</div>
                <div>${t.side.toUpperCase()} ${t.asset.replace("usdt","").toUpperCase()}</div>
                <div>${t.amount.toFixed(4)} @ $${t.price.toFixed(2)}</div>
                <div class="${t.side==='sell' && t.pnl ? (t.pnl>=0?'positive':'negative') : ''}">${t.pnl ? (t.pnl>=0?'+':'-')+'$'+Math.abs(t.pnl).toFixed(2) : '-'}</div>
            </div>
        `).join("");
    }

    function updateAccountStats() {
        const totalTrades = tradeHistory.length;
        const sells = tradeHistory.filter(t => t.side === 'sell' && t.pnl !== null);
        const wins = sells.filter(s => s.pnl > 0).length;
        const winRate = sells.length ? (wins/sells.length*100).toFixed(0) : 0;
        document.getElementById("totalTradesCount").innerText = totalTrades;
        document.getElementById("winRate").innerText = `${winRate}%`;
    }

    async function resetDemoAccount() {
        currentUser.balance = 10000;
        currentUser.holdings = {};
        await saveUserState();
        // clear trade history
        if (db) {
            const tx = db.transaction(["tradeHistory"], "readwrite");
            const store = tx.objectStore("tradeHistory");
            store.clear();
            await tx.done;
        }
        await loadTradeHistory();
        updateUIAll();
        showToast("Account reset to $10,000", "success");
    }

    function updateUIAll() {
        renderMarketGrid();
        renderPortfolioHoldings();
        renderTradeHistory();
        updateAccountStats();
        if (document.getElementById("page-asset").classList.contains("active")) {
            updateAssetFullUI();
        }
    }

    function showToast(msg, type="info") {
        const stack = document.getElementById("toastStack");
        const toast = document.createElement("div");
        toast.className = "toast";
        toast.style.borderLeftColor = type === "success" ? "var(--buy)" : type === "error" ? "var(--danger)" : "var(--primary)";
        toast.innerHTML = `<i class="fas ${type==='success'?'fa-check-circle':type==='error'?'fa-exclamation-triangle':'fa-bell'}"></i> ${msg}`;
        stack.appendChild(toast);
        setTimeout(() => toast.remove(), 2800);
    }

    // navigation and init
    function initNavigation() {
        document.querySelectorAll(".nav-item").forEach(item => {
            item.addEventListener("click", (e) => {
                const page = item.dataset.page;
                document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
                document.getElementById(`page-${page}`).classList.add("active");
                document.querySelectorAll(".nav-item").forEach(nav => nav.classList.remove("active"));
                item.classList.add("active");
                if (page === "portfolio") renderPortfolioHoldings();
                if (page === "asset" && currentAsset) updateAssetFullUI();
                if (page === "market") renderMarketGrid();
            });
        });
        document.getElementById("tabBuyBtn")?.addEventListener("click", () => { activeTab = "buy"; renderTradeForm(); });
        document.getElementById("tabSellBtn")?.addEventListener("click", () => { activeTab = "sell"; renderTradeForm(); });
        document.getElementById("resetAccountBtn")?.addEventListener("click", resetDemoAccount);
        document.getElementById("searchCoin")?.addEventListener("input", (e) => {
            const term = e.target.value.toLowerCase();
            document.querySelectorAll(".market-card").forEach(card => {
                const text = card.innerText.toLowerCase();
                card.style.display = text.includes(term) ? "block" : "none";
            });
        });
    }

    (async () => {
        await openDB();
        await loadUserStateFromDB();
        await loadTradeHistory();
        initPriceFeed();
        fetchInitialPrices();
        initNavigation();
        setInterval(() => { if (db) saveUserState(); }, 5000);
        renderMarketGrid();
        updateUIAll();
    })();
</script>
</body>
</html>
