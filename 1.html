<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>⚽ Xlodon Bet - Live Football Betting</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        :root {
            --primary: #00ff9d;
            --secondary: #ff9800;
            --danger: #ff4757;
            --success: #4caf50;
            --warning: #ffc107;
            --bg: #0a0f1a;
            --surface: #111827;
            --surface-light: #1a2332;
            --text: #ffffff;
            --text-dim: #94a3b8;
            --border: #1e293b;
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 70px;
        }

        .header {
            background: var(--surface);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
        }

        .balance-display {
            background: var(--surface-light);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid var(--primary);
            color: var(--primary);
            font-weight: 600;
        }

        .last-update {
            font-size: 10px;
            color: var(--text-dim);
            text-align: center;
            padding: 5px;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 16px;
            max-width: 1400px;
            margin: 16px auto;
            padding: 0 16px;
        }

        .market-tabs {
            background: var(--surface);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .tabs-header, .league-filter {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 12px;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        .tab-btn, .league-btn {
            padding: 8px 16px;
            background: var(--surface-light);
            border: 1px solid var(--border);
            border-radius: 30px;
            color: var(--text);
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .tab-btn.active, .league-btn.active {
            background: var(--primary);
            color: #000;
            border-color: var(--primary);
        }

        .refresh-btn {
            background: var(--surface-light);
            border: 1px solid var(--primary);
            border-radius: 30px;
            padding: 6px 12px;
            color: var(--primary);
            cursor: pointer;
            font-size: 12px;
            margin-left: 10px;
        }

        .matches-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 550px;
            overflow-y: auto;
        }

        .match-card {
            background: var(--surface);
            border-radius: 16px;
            padding: 12px;
            border: 1px solid var(--border);
            transition: transform 0.2s;
        }

        .match-card:hover {
            transform: translateY(-2px);
            border-color: var(--primary);
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 12px;
            color: var(--text-dim);
        }

        .teams {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .team-name {
            font-weight: 600;
            font-size: 14px;
        }

        .score {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
        }

        .live-badge {
            background: var(--danger);
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 10px;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .market-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 8px;
        }

        .market-btn {
            padding: 8px;
            background: var(--surface-light);
            border: 1px solid var(--border);
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .market-btn:hover {
            background: var(--primary);
            transform: scale(1.05);
        }

        .market-btn:hover .market-odds {
            color: #000;
        }

        .market-name {
            font-size: 10px;
            color: var(--text-dim);
        }

        .market-odds {
            font-weight: 700;
            color: var(--primary);
        }

        .betslip-section {
            background: var(--surface);
            border-radius: 20px;
            padding: 16px;
            border: 2px solid var(--primary);
            position: sticky;
            top: 80px;
        }

        .betslip-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .betslip-tab {
            flex: 1;
            padding: 10px;
            background: var(--surface-light);
            border: none;
            border-radius: 30px;
            color: var(--text);
            cursor: pointer;
            transition: all 0.2s;
        }

        .betslip-tab.active {
            background: var(--primary);
            color: #000;
        }

        .betslip-items {
            max-height: 250px;
            overflow-y: auto;
            margin-bottom: 12px;
        }

        .betslip-item {
            background: var(--surface-light);
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 8px;
        }

        .remove-bet {
            color: var(--danger);
            cursor: pointer;
            font-weight: bold;
        }

        .bet-input-group {
            display: flex;
            background: var(--surface-light);
            border-radius: 30px;
            padding: 0 16px;
            margin: 12px 0;
        }

        .bet-input {
            flex: 1;
            padding: 14px 0;
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 16px;
            outline: none;
        }

        .place-bet-btn {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            border: none;
            border-radius: 30px;
            color: #000;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .place-bet-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .open-bets-section, .history-section {
            background: var(--surface);
            border-radius: 16px;
            padding: 16px;
            margin-top: 16px;
        }

        .bet-card {
            background: var(--surface-light);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 8px;
            border-left: 4px solid var(--secondary);
        }

        .cashout-btn {
            padding: 4px 12px;
            background: var(--warning);
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--surface);
            display: flex;
            justify-content: space-around;
            padding: 8px 16px;
            border-top: 2px solid var(--primary);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--text-dim);
            font-size: 11px;
            gap: 4px;
            transition: color 0.2s;
        }

        .nav-item i { font-size: 20px; }
        .nav-item.active { color: var(--primary); }

        .toast-container {
            position: fixed;
            bottom: 80px;
            left: 16px;
            right: 16px;
            z-index: 1000;
        }

        .toast {
            padding: 12px 16px;
            background: var(--surface);
            border-radius: 30px;
            border-left: 4px solid var(--primary);
            margin-bottom: 8px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .empty-state {
            text-align: center;
            padding: 30px;
            color: var(--text-dim);
        }

        .loading-spinner {
            border: 3px solid var(--surface-light);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 900px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
        }
        
        .api-warning {
            background: rgba(255, 100, 0, 0.2);
            border-left: 3px solid var(--warning);
            padding: 8px 12px;
            font-size: 12px;
            margin-bottom: 12px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">⚽ Xlodon Bet</div>
        <div class="balance-display"><i class="fas fa-wallet"></i> $<span id="balance">0.00</span></div>
    </header>

    <div class="main-layout">
        <div class="left-column">
            <div class="market-tabs">
                <div class="tabs-header">
                    <button class="tab-btn active" data-market="all">📋 All Matches</button>
                    <button class="tab-btn" data-market="live">🔴 Live</button>
                    <button class="tab-btn" data-market="upcoming">📅 Upcoming</button>
                </div>
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <div class="league-filter" id="leagueFilter">
                        <button class="league-btn active" data-league="all">🌍 ALL</button>
                    </div>
                    <button class="refresh-btn" id="manualRefreshBtn"><i class="fas fa-sync-alt"></i> Refresh</button>
                </div>
                <div id="matchesContainer" class="matches-grid"><div class="loading-spinner"></div></div>
                <div class="last-update" id="lastUpdate"></div>
            </div>

            <div class="open-bets-section">
                <h3><i class="fas fa-ticket-alt"></i> MY OPEN BETS</h3>
                <div id="openBetsContainer"><div class="loading-spinner"></div></div>
            </div>
        </div>

        <div class="betslip-section">
            <div class="betslip-tabs">
                <button class="betslip-tab active" data-type="single">🎯 SINGLE</button>
                <button class="betslip-tab" data-type="accumulator">📈 ACCUMULATOR</button>
            </div>
            <div class="betslip-header" style="display: flex; justify-content: space-between;">
                <h4>BET SLIP</h4>
                <button id="clearSlip" style="background: none; border: none; color: var(--danger); cursor: pointer;">🗑️ CLEAR</button>
            </div>
            <div id="betslipItems" class="betslip-items"><div class="empty-state">➕ Click odds to add bets</div></div>
            <div class="bet-input-group">
                <input type="number" id="betAmount" class="bet-input" value="10" min="1" step="1">
                <span>$</span>
            </div>
            <div style="display: flex; justify-content: space-between; margin: 12px 0;">
                <span>⚡ Total Odds:</span>
                <span id="totalOdds" style="color: var(--primary); font-size: 20px; font-weight: bold;">0.00</span>
            </div>
            <div style="margin: 12px 0;">
                <span>💰 Potential Return:</span>
                <span id="potentialReturn" style="float: right; font-weight: bold;">$0.00</span>
            </div>
            <button id="placeBetBtn" class="place-bet-btn" disabled>🚀 PLACE BET</button>
        </div>
    </div>

    <div class="history-section">
        <h3><i class="fas fa-history"></i> BETTING HISTORY</h3>
        <div id="historyContainer"><div class="loading-spinner"></div></div>
    </div>

    <nav class="bottom-nav">
        <a href="#" class="nav-item active" data-page="football"><i class="fas fa-futbol"></i><span>Football</span></a>
        <a href="#" class="nav-item" data-page="bets"><i class="fas fa-ticket-alt"></i><span>My Bets</span></a>
        <a href="#" class="nav-item" data-page="home"><i class="fas fa-home"></i><span>Home</span></a>
    </nav>

    <div id="toastContainer" class="toast-container"></div>

    <script>
        // ==================== FIREBASE CONFIG ====================
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ==================== SPORTMONKS DIRECT API ====================
        const API_TOKEN = "DkFdWG9jFZvH8XSEgLrRfGwczABWVg5rlV25GvIRyN06zdPsOI48Nsv9Wooy";
        const BASE_URL = "https://api.sportmonks.com/v3/football";

        // Helper for direct fetch
        async function fetchSportmonks(endpoint, params = {}) {
            const url = new URL(`${BASE_URL}${endpoint}`);
            url.searchParams.append("api_token", API_TOKEN);
            Object.keys(params).forEach(k => {
                if (params[k] !== undefined) url.searchParams.append(k, params[k]);
            });
            const response = await fetch(url.toString());
            if (!response.ok) throw new Error(`API Error ${response.status}`);
            const data = await response.json();
            return data;
        }

        // ==================== APP STATE ====================
        let currentUser = null;
        let balance = 0;
        let selectedBets = [];
        let betType = 'single';
        let matches = [];
        let currentLeague = 'all';
        let currentMarket = 'all';
        let autoRefreshInterval = null;
        let leaguesMap = new Map(); // id -> name

        // Auth check
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                currentUser = user;
                console.log('User logged in:', user.uid);
                await loadBalance();
                await fetchAndSyncMatches();
                await loadOpenBets();
                await loadHistory();
                setupListeners();
                startAutoRefresh();
                showToast('Welcome to Xlodon Bet - Live API connected!', 'success');
            } else {
                showToast('Please login to continue', 'error');
                setTimeout(() => {
                    window.location.href = 'https://xcrazybet.github.io/millioner/login.html';
                }, 2000);
            }
        });

        // Fetch live scores + upcoming fixtures + odds
        async function fetchAndSyncMatches() {
            const container = document.getElementById('matchesContainer');
            container.innerHTML = '<div class="loading-spinner"></div><p style="text-align:center;">Fetching live & upcoming matches via Sportmonks...</p>';
            
            try {
                // 1. Fetch live in-play matches
                const liveData = await fetchSportmonks("/livescores/inplay", { include: "participants;scores;state" });
                // 2. Fetch upcoming fixtures for today and next days (limit 50)
                const upcomingData = await fetchSportmonks("/fixtures", { include: "participants;state", filters: "next365days", per_page: 40 });
                // 3. Fetch odds for pre-match (to get proper odds for upcoming)
                const oddsData = await fetchSportmonks("/odds/pre-match", { include: "bookmakers;market", per_page: 100 });
                
                let allMatches = [];
                
                // Process live matches
                if (liveData.data && liveData.data.length) {
                    for (const fixture of liveData.data) {
                        const home = fixture.participants?.find(p => p.meta?.location === 'home') || fixture.participants?.[0];
                        const away = fixture.participants?.find(p => p.meta?.location === 'away') || fixture.participants?.[1];
                        const homeScoreObj = fixture.scores?.find(s => s.description === 'CURRENT') || fixture.scores?.[0];
                        const homeScore = homeScoreObj?.score?.goals || homeScoreObj?.goals || 0;
                        const awayScore = homeScoreObj?.score?.opponent_goals || homeScoreObj?.opponent_goals || 0;
                        
                        // Extract odds from pre-match odds data (filter by fixture id)
                        let homeOdds = 2.0, drawOdds = 3.2, awayOdds = 2.5;
                        const fixtureOdds = oddsData.data?.filter(o => o.fixture_id === fixture.id && o.market?.name === "Full Time Result");
                        if (fixtureOdds && fixtureOdds.length > 0 && fixtureOdds[0].bookmakers?.length) {
                            const book = fixtureOdds[0].bookmakers[0];
                            const oddsMap = {};
                            book.odds?.forEach(o => { oddsMap[o.label] = parseFloat(o.value); });
                            homeOdds = oddsMap['1'] || homeOdds;
                            drawOdds = oddsMap['X'] || drawOdds;
                            awayOdds = oddsMap['2'] || awayOdds;
                        }
                        
                        allMatches.push({
                            id: fixture.id.toString(),
                            leagueId: fixture.league_id?.toString() || "0",
                            leagueName: fixture.league?.name || "Football",
                            homeTeam: home?.name || "Home",
                            awayTeam: away?.name || "Away",
                            homeScore: homeScore,
                            awayScore: awayScore,
                            status: fixture.state?.name === "In Progress" ? "LIVE" : (fixture.time?.minute ? `${fixture.time.minute}'` : "LIVE"),
                            time: "LIVE",
                            isLive: true,
                            odds: { home: homeOdds, draw: drawOdds, away: awayOdds, over25: 1.85, under25: 1.95 }
                        });
                    }
                }
                
                // Process upcoming fixtures
                if (upcomingData.data && upcomingData.data.length) {
                    for (const fixture of upcomingData.data) {
                        if (fixture.state?.name === "Finished" || fixture.state?.name === "In Progress") continue;
                        const home = fixture.participants?.find(p => p.meta?.location === 'home') || fixture.participants?.[0];
                        const away = fixture.participants?.find(p => p.meta?.location === 'away') || fixture.participants?.[1];
                        let homeOdds = 2.0, drawOdds = 3.2, awayOdds = 2.5;
                        const fixtureOdds = oddsData.data?.filter(o => o.fixture_id === fixture.id && o.market?.name === "Full Time Result");
                        if (fixtureOdds && fixtureOdds.length > 0 && fixtureOdds[0].bookmakers?.length) {
                            const book = fixtureOdds[0].bookmakers[0];
                            const oddsMap = {};
                            book.odds?.forEach(o => { oddsMap[o.label] = parseFloat(o.value); });
                            homeOdds = oddsMap['1'] || homeOdds;
                            drawOdds = oddsMap['X'] || drawOdds;
                            awayOdds = oddsMap['2'] || awayOdds;
                        }
                        const startTime = fixture.starting_at ? new Date(fixture.starting_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : "TBD";
                        allMatches.push({
                            id: fixture.id.toString(),
                            leagueId: fixture.league_id?.toString() || "0",
                            leagueName: fixture.league?.name || "Football",
                            homeTeam: home?.name || "Home",
                            awayTeam: away?.name || "Away",
                            homeScore: null,
                            awayScore: null,
                            status: "NS",
                            time: startTime,
                            isLive: false,
                            odds: { home: homeOdds, draw: drawOdds, away: awayOdds, over25: 1.85, under25: 1.95 }
                        });
                    }
                }
                
                if (allMatches.length === 0) throw new Error("No matches from API");
                matches = allMatches;
                // Populate league filters dynamically
                const leaguesSet = new Set();
                matches.forEach(m => leaguesSet.add(JSON.stringify({ id: m.leagueId, name: m.leagueName })));
                const leagueFilterDiv = document.getElementById('leagueFilter');
                leagueFilterDiv.innerHTML = `<button class="league-btn active" data-league="all">🌍 ALL</button>`;
                for (let item of leaguesSet) {
                    const { id, name } = JSON.parse(item);
                    if (id !== "0") {
                        leagueFilterDiv.innerHTML += `<button class="league-btn" data-league="${id}">🏆 ${name.substring(0,20)}</button>`;
                    }
                }
                // reattach events
                document.querySelectorAll('.league-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        document.querySelectorAll('.league-btn').forEach(l => l.classList.remove('active'));
                        btn.classList.add('active');
                        currentLeague = btn.dataset.league;
                        displayMatches(currentLeague, currentMarket);
                    });
                });
                
                document.getElementById('lastUpdate').innerHTML = `✅ Live API connected | ${matches.length} matches | Last sync: ${new Date().toLocaleTimeString()}`;
                displayMatches(currentLeague, currentMarket);
                showToast(`Loaded ${matches.length} matches from Sportmonks API`, 'success');
            } catch (error) {
                console.error("Sportmonks fetch error:", error);
                document.getElementById('lastUpdate').innerHTML = `<span style="color: var(--warning);">⚠️ API error: ${error.message}. Using demo data for preview.</span>`;
                // Fallback mock data for demo
                matches = [
                    { id: "1", leagueId: "39", leagueName: "Premier League", homeTeam: "Manchester United", awayTeam: "Arsenal", homeScore: 1, awayScore: 1, status: "2H", isLive: true, odds: { home: 2.10, draw: 3.40, away: 3.20, over25: 1.85, under25: 1.95 } },
                    { id: "2", leagueId: "140", leagueName: "La Liga", homeTeam: "Barcelona", awayTeam: "Real Madrid", homeScore: 0, awayScore: 0, status: "1H", isLive: true, odds: { home: 2.30, draw: 3.30, away: 2.90, over25: 1.80, under25: 2.00 } },
                    { id: "3", leagueId: "78", leagueName: "Bundesliga", homeTeam: "Bayern Munich", awayTeam: "Dortmund", homeScore: null, awayScore: null, status: "NS", isLive: false, odds: { home: 1.65, draw: 4.00, away: 4.50, over25: 1.70, under25: 2.10 } }
                ];
                displayMatches(currentLeague, currentMarket);
            }
        }

        function displayMatches(leagueFilter, marketFilter) {
            const container = document.getElementById('matchesContainer');
            let filtered = leagueFilter === 'all' ? matches : matches.filter(m => m.leagueId === leagueFilter);
            if (marketFilter === 'live') filtered = filtered.filter(m => m.isLive === true);
            else if (marketFilter === 'upcoming') filtered = filtered.filter(m => !m.isLive);
            
            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty-state"><i class="fas fa-futbol"></i><br>No matches found</div>';
                return;
            }
            
            container.innerHTML = filtered.map(match => `
                <div class="match-card">
                    <div class="match-header">
                        <span><i class="fas fa-trophy"></i> ${match.leagueName}</span>
                        <span>${match.isLive ? '<span class="live-badge">🔴 LIVE</span>' : match.time}</span>
                    </div>
                    <div class="teams">
                        <span class="team-name">${match.homeTeam}</span>
                        <span class="score">${(match.homeScore !== null && match.homeScore !== undefined) ? match.homeScore : '-'} : ${(match.awayScore !== null && match.awayScore !== undefined) ? match.awayScore : '-'}</span>
                        <span class="team-name">${match.awayTeam}</span>
                    </div>
                    <div class="market-grid">
                        <div class="market-btn" onclick="addToBetSlip('${match.id}', '1', ${match.odds.home}, '1 (Home)', 'Match Winner')">
                            <div class="market-name">1 (HOME)</div>
                            <div class="market-odds">${match.odds.home.toFixed(2)}</div>
                        </div>
                        <div class="market-btn" onclick="addToBetSlip('${match.id}', 'X', ${match.odds.draw}, 'Draw', 'Match Winner')">
                            <div class="market-name">X (DRAW)</div>
                            <div class="market-odds">${match.odds.draw.toFixed(2)}</div>
                        </div>
                        <div class="market-btn" onclick="addToBetSlip('${match.id}', '2', ${match.odds.away}, '2 (Away)', 'Match Winner')">
                            <div class="market-name">2 (AWAY)</div>
                            <div class="market-odds">${match.odds.away.toFixed(2)}</div>
                        </div>
                        <div class="market-btn" onclick="addToBetSlip('${match.id}', 'Over 2.5', ${match.odds.over25}, 'Over 2.5', 'Total Goals')">
                            <div class="market-name">OVER 2.5</div>
                            <div class="market-odds">${match.odds.over25.toFixed(2)}</div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function startAutoRefresh() {
            if (autoRefreshInterval) clearInterval(autoRefreshInterval);
            autoRefreshInterval = setInterval(() => {
                fetchAndSyncMatches();
            }, 30000); // 30 seconds refresh to respect rate limits but keep data fresh
        }

        async function loadBalance() {
            try {
                const doc = await db.collection("wallets").doc(currentUser.uid).get();
                if (doc.exists) balance = doc.data().balance || 0;
                else { balance = 100; await db.collection("wallets").doc(currentUser.uid).set({ balance: 100 }); }
                document.getElementById('balance').textContent = balance.toFixed(2);
            } catch(e) { balance = 100; document.getElementById('balance').textContent = balance.toFixed(2); }
        }

        window.addToBetSlip = function(matchId, selection, odds, display, market) {
            const match = matches.find(m => m.id === matchId);
            if (!match) return;
            const bet = { matchId, matchName: `${match.homeTeam} vs ${match.awayTeam}`, market, selection, display, odds };
            if (betType === 'single') selectedBets = [bet];
            else { if (selectedBets.some(b => b.matchId === matchId)) { showToast('Only one bet per match allowed in ACCA', 'error'); return; } selectedBets.push(bet); }
            updateBetSlip();
            showToast(`Added: ${bet.matchName} - ${display} @ ${odds.toFixed(2)}`, 'success');
        };

        function updateBetSlip() {
            const container = document.getElementById('betslipItems');
            const totalOddsSpan = document.getElementById('totalOdds');
            const potentialSpan = document.getElementById('potentialReturn');
            const placeBtn = document.getElementById('placeBetBtn');
            if (selectedBets.length === 0) { container.innerHTML = '<div class="empty-state">➕ Click odds to add bets</div>'; totalOddsSpan.textContent = '0.00'; potentialSpan.textContent = '$0.00'; placeBtn.disabled = true; return; }
            const totalOdds = selectedBets.reduce((acc, bet) => acc * bet.odds, 1);
            const betAmount = parseFloat(document.getElementById('betAmount').value) || 10;
            potentialSpan.textContent = `$${(betAmount * totalOdds).toFixed(2)}`;
            totalOddsSpan.textContent = totalOdds.toFixed(2);
            placeBtn.disabled = false;
            container.innerHTML = selectedBets.map((bet, idx) => `<div class="betslip-item"><div class="betslip-item-header"><span><strong>${bet.matchName}</strong></span><span class="remove-bet" onclick="removeBet(${idx})">✖</span></div><div>${bet.market} - ${bet.display}</div><div style="color: var(--primary);">${bet.odds.toFixed(2)}</div></div>`).join('');
        }

        window.removeBet = function(idx) { selectedBets.splice(idx, 1); updateBetSlip(); };

        function generateTicketNumber() { return `TKT-${Date.now()}-${Math.random().toString(36).substring(2,6)}`; }

        async function placeBet() {
            const betAmount = parseFloat(document.getElementById('betAmount').value);
            if (!selectedBets.length) { showToast('No bets selected', 'error'); return; }
            if (betAmount < 1 || betAmount > 5000) { showToast('Amount must be $1-$5000', 'error'); return; }
            if (betAmount > balance) { showToast('Insufficient funds', 'error'); return; }
            const totalOdds = selectedBets.reduce((a,b)=>a*b.odds,1);
            const ticket = generateTicketNumber();
            try {
                const walletRef = db.collection("wallets").doc(currentUser.uid);
                await db.runTransaction(async (tx) => {
                    const doc = await tx.get(walletRef);
                    if (doc.data().balance < betAmount) throw new Error('Insufficient');
                    tx.update(walletRef, { balance: doc.data().balance - betAmount });
                });
                await db.collection("football_bets").doc(ticket).set({
                    userId: currentUser.uid, ticketNumber: ticket, selections: selectedBets, stake: betAmount,
                    totalOdds, potentialReturn: betAmount * totalOdds, betType, status: 'pending', createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                balance -= betAmount; document.getElementById('balance').textContent = balance.toFixed(2);
                selectedBets = []; updateBetSlip();
                showToast(`Bet placed! Ticket: ${ticket}`, 'success');
                await loadOpenBets(); await loadHistory();
            } catch(e) { showToast('Bet failed: '+e.message, 'error'); }
        }

        async function loadOpenBets() {
            const snap = await db.collection("football_bets").where("userId","==",currentUser.uid).where("status","==","pending").get();
            const container = document.getElementById('openBetsContainer');
            if(snap.empty){ container.innerHTML='<div class="empty-state">✨ No open bets</div>'; return; }
            let html='';
            snap.forEach(doc=>{ const b=doc.data(); html+=`<div class="bet-card"><div class="bet-card-header"><span>🎫 ${b.ticketNumber}</span><span>PENDING</span></div><div>${b.selections.map(s=>`${s.display} @${s.odds}`).join(', ')}</div><div>Stake: $${b.stake} | To Win: $${(b.stake*b.totalOdds).toFixed(2)}</div><button class="cashout-btn" onclick="cashOut('${b.ticketNumber}', ${b.stake})">💸 CASH OUT (70%)</button></div>`; });
            container.innerHTML=html;
        }

        window.cashOut = async function(ticket, stake) {
            const val = stake * 0.7;
            if(!confirm(`Cash out $${val.toFixed(2)}?`)) return;
            const walletRef = db.collection("wallets").doc(currentUser.uid);
            await db.runTransaction(async tx=>{ const doc=await tx.get(walletRef); tx.update(walletRef,{balance: doc.data().balance+val}); });
            await db.collection("football_bets").doc(ticket).update({ status:'cashed_out', return:val });
            balance+=val; document.getElementById('balance').textContent=balance.toFixed(2);
            await loadOpenBets(); await loadHistory();
            showToast(`Cashed out $${val.toFixed(2)}`,'success');
        };

        async function loadHistory() {
            const snap = await db.collection("football_bets").where("userId","==",currentUser.uid).where("status","in",["won","lost","cashed_out"]).get();
            const container = document.getElementById('historyContainer');
            if(snap.empty){ container.innerHTML='<div class="empty-state">📜 No history</div>'; return; }
            let html='';
            snap.forEach(doc=>{ const b=doc.data(); html+=`<div class="bet-card"><div>${b.ticketNumber}</div><div>Status: ${b.status.toUpperCase()}</div><div>Return: $${(b.return||0).toFixed(2)}</div></div>`; });
            container.innerHTML=html;
        }

        function setupListeners() {
            if(currentUser){
                db.collection("wallets").doc(currentUser.uid).onSnapshot(doc=>{ if(doc.exists){ balance=doc.data().balance; document.getElementById('balance').textContent=balance.toFixed(2); } });
                db.collection("football_bets").where("userId","==",currentUser.uid).onSnapshot(()=>{ loadOpenBets(); loadHistory(); });
            }
        }

        function showToast(msg, type='info'){ const c=document.getElementById('toastContainer'); const t=document.createElement('div'); t.className='toast'; t.style.borderLeftColor=type==='success'?'var(--success)':type==='error'?'var(--danger)':'var(--warning)'; t.innerHTML=`<i class="fas ${type==='success'?'fa-check-circle':type==='error'?'fa-exclamation-triangle':'fa-info-circle'}"></i> ${msg}`; c.appendChild(t); setTimeout(()=>t.remove(),3000); }

        document.getElementById('placeBetBtn').addEventListener('click', placeBet);
        document.getElementById('clearSlip').addEventListener('click', ()=>{ selectedBets=[]; updateBetSlip(); });
        document.getElementById('betAmount').addEventListener('input', updateBetSlip);
        document.querySelectorAll('.betslip-tab').forEach(btn=>btn.addEventListener('click',()=>{ document.querySelectorAll('.betslip-tab').forEach(t=>t.classList.remove('active')); btn.classList.add('active'); betType=btn.dataset.type; selectedBets=[]; updateBetSlip(); }));
        document.querySelectorAll('.tab-btn').forEach(btn=>btn.addEventListener('click',()=>{ document.querySelectorAll('.tab-btn').forEach(t=>t.classList.remove('active')); btn.classList.add('active'); currentMarket=btn.dataset.market; displayMatches(currentLeague, currentMarket); }));
        document.getElementById('manualRefreshBtn').addEventListener('click', ()=>{ fetchAndSyncMatches(); });
        document.querySelectorAll('.nav-item').forEach(item=>{ item.addEventListener('click',(e)=>{ e.preventDefault(); if(item.dataset.page==='bets') document.getElementById('openBetsContainer').scrollIntoView({behavior:'smooth'}); else if(item.dataset.page==='home') window.scrollTo({top:0,behavior:'smooth'}); document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active')); item.classList.add('active'); }); });
    </script>
</body>
</html>
