<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚽ Xlodon Bet - Live Football Betting</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif}
        :root{--primary:#00ff9d;--secondary:#ff9800;--danger:#ff4757;--success:#4caf50;--bg:#0a0f1a;--surface:#111827;--surface-light:#1a2332;--text:#fff;--text-dim:#94a3b8;--border:#1e293b}
        body{background:var(--bg);color:var(--text);padding-bottom:70px}
        .header{background:var(--surface);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--primary);position:sticky;top:0;z-index:100}
        .logo{font-size:20px;font-weight:700;color:var(--primary)}
        .balance{background:var(--surface-light);padding:6px 12px;border-radius:20px;border:1px solid var(--primary);font-weight:600}
        .main-layout{display:grid;grid-template-columns:1fr 380px;gap:16px;max-width:1400px;margin:16px auto;padding:0 16px}
        .market-tabs{background:var(--surface);border-radius:16px;padding:16px;margin-bottom:16px}
        .tabs-header,.league-filter{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--border)}
        .tab-btn,.league-btn{padding:8px 16px;background:var(--surface-light);border:1px solid var(--border);border-radius:30px;color:var(--text);font-size:13px;cursor:pointer;white-space:nowrap}
        .tab-btn.active,.league-btn.active{background:var(--primary);color:#000;border-color:var(--primary)}
        .refresh-btn{background:var(--surface-light);border:1px solid var(--primary);border-radius:30px;padding:6px 12px;color:var(--primary);cursor:pointer;font-size:12px;margin-left:10px}
        .matches-grid{display:flex;flex-direction:column;gap:12px;max-height:550px;overflow-y:auto}
        .match-card{background:var(--surface);border-radius:16px;padding:12px;border:1px solid var(--border);transition:transform 0.2s}
        .match-card:hover{transform:translateY(-2px);border-color:var(--primary)}
        .match-header{display:flex;justify-content:space-between;margin-bottom:10px;font-size:12px;color:var(--text-dim)}
        .teams{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
        .team-name{font-weight:600;font-size:14px}
        .score{font-size:18px;font-weight:700;color:var(--primary)}
        .live-badge{background:var(--danger);padding:2px 8px;border-radius:20px;font-size:10px;animation:pulse 1s infinite}
        .upcoming-badge{background:var(--secondary);padding:2px 8px;border-radius:20px;font-size:10px}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
        .market-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
        .market-btn{padding:8px;background:var(--surface-light);border:1px solid var(--border);border-radius:8px;text-align:center;cursor:pointer;transition:all 0.2s}
        .market-btn:hover{background:var(--primary);transform:scale(1.05)}
        .market-name{font-size:10px;color:var(--text-dim)}
        .market-odds{font-weight:700;color:var(--primary)}
        .betslip-section{background:var(--surface);border-radius:20px;padding:16px;border:2px solid var(--primary);position:sticky;top:80px}
        .betslip-tabs{display:flex;gap:8px;margin-bottom:16px}
        .betslip-tab{flex:1;padding:10px;background:var(--surface-light);border:none;border-radius:30px;color:var(--text);cursor:pointer}
        .betslip-tab.active{background:var(--primary);color:#000}
        .bet-input-group{display:flex;background:var(--surface-light);border-radius:30px;padding:0 16px;margin:12px 0}
        .bet-input{flex:1;padding:14px 0;background:transparent;border:none;color:var(--text);font-size:16px;outline:none}
        .place-bet-btn{width:100%;padding:16px;background:var(--primary);border:none;border-radius:30px;color:#000;font-weight:700;font-size:16px;cursor:pointer}
        .place-bet-btn:disabled{opacity:0.5;cursor:not-allowed}
        .open-bets-section,.history-section{background:var(--surface);border-radius:16px;padding:16px;margin-top:16px}
        .bet-card{background:var(--surface-light);border-radius:12px;padding:12px;margin-bottom:8px;border-left:4px solid var(--secondary)}
        .cashout-btn{padding:4px 12px;background:var(--warning);border:none;border-radius:20px;cursor:pointer;font-weight:bold}
        .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);display:flex;justify-content:space-around;padding:8px 16px;border-top:2px solid var(--primary)}
        .nav-item{display:flex;flex-direction:column;align-items:center;text-decoration:none;color:var(--text-dim);font-size:11px;gap:4px}
        .nav-item i{font-size:20px}
        .nav-item.active{color:var(--primary)}
        .toast-container{position:fixed;bottom:80px;left:16px;right:16px;z-index:1000}
        .toast{padding:12px 16px;background:var(--surface);border-radius:30px;border-left:4px solid var(--primary);margin-bottom:8px;animation:slideIn 0.3s ease}
        @keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
        .empty-state{text-align:center;padding:30px;color:var(--text-dim)}
        .loading-spinner{border:3px solid var(--surface-light);border-top:3px solid var(--primary);border-radius:50%;width:40px;height:40px;animation:spin 1s linear infinite;margin:20px auto}
        @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
        .api-status{background:rgba(0,255,157,0.1);border-left:3px solid var(--primary);padding:8px 12px;font-size:12px;border-radius:8px;margin-bottom:12px;text-align:center}
        .match-time{font-size:11px;color:var(--primary)}
        @media(max-width:900px){.main-layout{grid-template-columns:1fr}.betslip-section{position:relative;top:0}}
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">⚽ Xlodon Bet</div>
        <div class="balance">💰 $<span id="balance">0.00</span></div>
    </div>

    <div class="main-layout">
        <div class="left-column">
            <div class="market-tabs">
                <div class="tabs-header">
                    <button class="tab-btn active" data-market="all">📋 All Matches</button>
                    <button class="tab-btn" data-market="live">🔴 Live</button>
                    <button class="tab-btn" data-market="upcoming">📅 Upcoming</button>
                </div>
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
                    <div class="league-filter" id="leagueFilter">
                        <button class="league-btn active" data-league="all">🌍 ALL</button>
                    </div>
                    <button class="refresh-btn" id="refreshBtn"><i class="fas fa-sync-alt"></i> Refresh</button>
                </div>
                <div id="apiStatus" class="api-status">🔄 Connecting to Sportmonks API...</div>
                <div id="matchesContainer" class="matches-grid"><div class="loading-spinner"></div></div>
                <div class="last-update" id="lastUpdate" style="font-size:11px;text-align:center;padding:8px;color:var(--text-dim)"></div>
            </div>

            <div class="open-bets-section">
                <h3><i class="fas fa-ticket-alt"></i> MY OPEN BETS</h3>
                <div id="openBetsContainer"><div class="loading-spinner"></div></div>
            </div>
        </div>

        <div class="betslip-section">
            <div class="betslip-tabs">
                <button class="betslip-tab active" data-type="single">🎯 SINGLE</button>
                <button class="betslip-tab" data-type="accumulator">📈 ACCUMULATOR</button>
            </div>
            <div style="display:flex;justify-content:space-between">
                <h4>BET SLIP</h4>
                <button id="clearSlip" style="background:none;border:none;color:var(--danger);cursor:pointer">🗑️ CLEAR</button>
            </div>
            <div id="betslipItems" class="betslip-items"><div class="empty-state">➕ Click odds to add bets</div></div>
            <div class="bet-input-group">
                <input type="number" id="betAmount" class="bet-input" value="10" min="1" step="1">
                <span>$</span>
            </div>
            <div style="display:flex;justify-content:space-between;margin:12px 0">
                <span>⚡ Total Odds:</span>
                <span id="totalOdds" style="color:var(--primary);font-size:20px;font-weight:bold">0.00</span>
            </div>
            <div style="margin:12px 0">
                <span>💰 Potential Return:</span>
                <span id="potentialReturn" style="float:right;font-weight:bold">$0.00</span>
            </div>
            <button id="placeBetBtn" class="place-bet-btn" disabled>🚀 PLACE BET</button>
        </div>
    </div>

    <div class="history-section">
        <h3><i class="fas fa-history"></i> BETTING HISTORY</h3>
        <div id="historyContainer"><div class="loading-spinner"></div></div>
    </div>

    <nav class="bottom-nav">
        <a href="#" class="nav-item active" data-page="football"><i class="fas fa-futbol"></i><span>Football</span></a>
        <a href="#" class="nav-item" data-page="bets"><i class="fas fa-ticket-alt"></i><span>My Bets</span></a>
        <a href="#" class="nav-item" data-page="home"><i class="fas fa-home"></i><span>Home</span></a>
    </nav>

    <div id="toastContainer" class="toast-container"></div>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Sportmonks API
        const API_TOKEN = "DkFdWG9jFZvH8XSEgLrRfGwczABWVg5rlV25GvIRyN06zdPsOI48Nsv9Wooy";
        
        let currentUser = null;
        let balance = 0;
        let selectedBets = [];
        let betType = 'single';
        let matches = [];
        let currentLeague = 'all';
        let currentMarket = 'all';
        let autoRefreshInterval = null;

        // Auth check
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                currentUser = user;
                await loadBalance();
                await fetchMatches();
                await loadOpenBets();
                await loadHistory();
                startAutoRefresh();
                showToast('Welcome to Xlodon Bet!', 'success');
            } else {
                window.location.href = 'https://xcrazybet.github.io/millioner/login.html';
            }
        });

        // Fetch matches from Sportmonks API
        async function fetchMatches() {
            const container = document.getElementById('matchesContainer');
            container.innerHTML = '<div class="loading-spinner"></div><p style="text-align:center;">Fetching real match data...</p>';
            
            try {
                // Try to get live scores first
                const liveUrl = `https://api.sportmonks.com/v3/football/livescores/inplay?api_token=${API_TOKEN}&include=participants;scores;league;state`;
                const liveProxyUrl = `https://corsproxy.io/?${encodeURIComponent(liveUrl)}`;
                const liveResponse = await fetch(liveProxyUrl);
                const liveData = await liveResponse.json();
                
                // Try to get upcoming fixtures
                const upcomingUrl = `https://api.sportmonks.com/v3/football/fixtures/date/2026-04-04?api_token=${API_TOKEN}&include=participants;league;state`;
                const upcomingProxyUrl = `https://corsproxy.io/?${encodeURIComponent(upcomingUrl)}`;
                const upcomingResponse = await fetch(upcomingProxyUrl);
                const upcomingData = await upcomingResponse.json();
                
                let allMatches = [];
                const now = new Date();
                
                // Process live matches
                if (liveData.data && liveData.data.length > 0) {
                    for (const fixture of liveData.data) {
                        const home = fixture.participants?.find(p => p.meta?.location === 'home') || fixture.participants?.[0];
                        const away = fixture.participants?.find(p => p.meta?.location === 'away') || fixture.participants?.[1];
                        const score = fixture.scores?.find(s => s.description === 'CURRENT') || fixture.scores?.[0];
                        
                        allMatches.push({
                            id: fixture.id.toString(),
                            leagueId: fixture.league_id?.toString() || "0",
                            leagueName: fixture.league?.name || "Live Match",
                            homeTeam: home?.name || "Home Team",
                            awayTeam: away?.name || "Away Team",
                            homeScore: score?.score?.goals || 0,
                            awayScore: score?.score?.opponent_goals || 0,
                            matchTime: "LIVE",
                            isLive: true,
                            date: new Date().toLocaleDateString(),
                            odds: { home: 2.10, draw: 3.30, away: 2.80, over25: 1.85, under25: 1.95 }
                        });
                    }
                }
                
                // Process upcoming fixtures
                if (upcomingData.data && upcomingData.data.length > 0) {
                    for (const fixture of upcomingData.data) {
                        if (fixture.state?.name === "Finished") continue;
                        const home = fixture.participants?.find(p => p.meta?.location === 'home') || fixture.participants?.[0];
                        const away = fixture.participants?.find(p => p.meta?.location === 'away') || fixture.participants?.[1];
                        const matchDate = fixture.starting_at ? new Date(fixture.starting_at) : new Date();
                        const timeStr = matchDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                        const dateStr = matchDate.toLocaleDateString();
                        
                        allMatches.push({
                            id: fixture.id.toString(),
                            leagueId: fixture.league_id?.toString() || "0",
                            leagueName: fixture.league?.name || "Football",
                            homeTeam: home?.name || "Home Team",
                            awayTeam: away?.name || "Away Team",
                            homeScore: null,
                            awayScore: null,
                            matchTime: timeStr,
                            matchDate: dateStr,
                            isLive: false,
                            odds: { home: 2.00, draw: 3.20, away: 2.60, over25: 1.85, under25: 1.95 }
                        });
                    }
                }
                
                // If we got real matches, use them
                if (allMatches.length > 0) {
                    matches = allMatches;
                    document.getElementById('apiStatus').innerHTML = `✅ REAL API: ${matches.length} matches loaded from Sportmonks`;
                    document.getElementById('apiStatus').style.borderLeftColor = '#4caf50';
                    document.getElementById('lastUpdate').innerHTML = `📅 Last updated: ${new Date().toLocaleString()} | ${matches.filter(m => m.isLive).length} live, ${matches.filter(m => !m.isLive).length} upcoming`;
                    
                    // Build league filters
                    const leagues = [...new Map(matches.map(m => [m.leagueId, m.leagueName])).entries()];
                    const leagueFilterDiv = document.getElementById('leagueFilter');
                    leagueFilterDiv.innerHTML = `<button class="league-btn active" data-league="all">🌍 ALL (${matches.length})</button>`;
                    leagues.forEach(([id, name]) => {
                        if (id !== "0") {
                            const count = matches.filter(m => m.leagueId === id).length;
                            leagueFilterDiv.innerHTML += `<button class="league-btn" data-league="${id}">🏆 ${name.substring(0, 20)} (${count})</button>`;
                        }
                    });
                    
                    // Reattach events
                    document.querySelectorAll('.league-btn').forEach(btn => {
                        btn.addEventListener('click', () => {
                            document.querySelectorAll('.league-btn').forEach(l => l.classList.remove('active'));
                            btn.classList.add('active');
                            currentLeague = btn.dataset.league;
                            displayMatches();
                        });
                    });
                    
                } else {
                    // Use demo data with realistic dates/times
                    throw new Error("No matches from API");
                }
                
                displayMatches();
                
            } catch (error) {
                console.error("API Error:", error);
                document.getElementById('apiStatus').innerHTML = `⚠️ Using demo data with real dates/times`;
                document.getElementById('apiStatus').style.borderLeftColor = '#ff9800';
                
                // Demo data with REAL dates and times
                const today = new Date();
                const tomorrow = new Date(today);
                tomorrow.setDate(tomorrow.getDate() + 1);
                const dayAfter = new Date(today);
                dayAfter.setDate(dayAfter.getDate() + 2);
                
                matches = [
                    { id: "1", leagueId: "39", leagueName: "Premier League", homeTeam: "Manchester United", awayTeam: "Arsenal", homeScore: 2, awayScore: 1, matchTime: "LIVE", matchDate: today.toLocaleDateString(), isLive: true, odds: { home: 2.10, draw: 3.40, away: 3.20, over25: 1.85, under25: 1.95 } },
                    { id: "2", leagueId: "140", leagueName: "La Liga", homeTeam: "Barcelona", awayTeam: "Real Madrid", homeScore: 0, awayScore: 0, matchTime: "LIVE", matchDate: today.toLocaleDateString(), isLive: true, odds: { home: 2.30, draw: 3.30, away: 2.90, over25: 1.80, under25: 2.00 } },
                    { id: "3", leagueId: "78", leagueName: "Bundesliga", homeTeam: "Bayern Munich", awayTeam: "Borussia Dortmund", homeScore: null, awayScore: null, matchTime: "15:30", matchDate: today.toLocaleDateString(), isLive: false, odds: { home: 1.65, draw: 4.00, away: 4.50, over25: 1.70, under25: 2.10 } },
                    { id: "4", leagueId: "135", leagueName: "Serie A", homeTeam: "AC Milan", awayTeam: "Inter Milan", homeScore: null, awayScore: null, matchTime: "18:00", matchDate: today.toLocaleDateString(), isLive: false, odds: { home: 2.60, draw: 3.20, away: 2.70, over25: 1.90, under25: 1.90 } },
                    { id: "5", leagueId: "61", leagueName: "Ligue 1", homeTeam: "PSG", awayTeam: "Marseille", homeScore: 3, awayScore: 0, matchTime: "LIVE", matchDate: today.toLocaleDateString(), isLive: true, odds: { home: 1.45, draw: 4.50, away: 6.00, over25: 1.60, under25: 2.25 } },
                    { id: "6", leagueId: "39", leagueName: "Premier League", homeTeam: "Liverpool", awayTeam: "Chelsea", homeScore: null, awayScore: null, matchTime: "13:30", matchDate: tomorrow.toLocaleDateString(), isLive: false, odds: { home: 1.85, draw: 3.60, away: 3.90, over25: 1.75, under25: 2.05 } },
                    { id: "7", leagueId: "140", leagueName: "La Liga", homeTeam: "Atletico Madrid", awayTeam: "Sevilla", homeScore: null, awayScore: null, matchTime: "16:15", matchDate: tomorrow.toLocaleDateString(), isLive: false, odds: { home: 1.95, draw: 3.30, away: 3.80, over25: 1.85, under25: 1.95 } },
                    { id: "8", leagueId: "78", leagueName: "Bundesliga", homeTeam: "RB Leipzig", awayTeam: "Leverkusen", homeScore: null, awayScore: null, matchTime: "14:30", matchDate: dayAfter.toLocaleDateString(), isLive: false, odds: { home: 2.20, draw: 3.50, away: 2.90, over25: 1.80, under25: 2.00 } }
                ];
                
                document.getElementById('lastUpdate').innerHTML = `📅 Demo mode - Showing matches with real dates/times | Updated: ${new Date().toLocaleString()}`;
                displayMatches();
            }
        }

        function displayMatches() {
            const container = document.getElementById('matchesContainer');
            let filtered = currentLeague === 'all' ? matches : matches.filter(m => m.leagueId === currentLeague);
            
            if (currentMarket === 'live') {
                filtered = filtered.filter(m => m.isLive === true);
            } else if (currentMarket === 'upcoming') {
                filtered = filtered.filter(m => !m.isLive);
            }
            
            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty-state"><i class="fas fa-futbol"></i><br>No matches found</div>';
                return;
            }
            
            container.innerHTML = filtered.map(match => `
                <div class="match-card">
                    <div class="match-header">
                        <span><i class="fas fa-trophy"></i> ${match.leagueName}</span>
                        <span>${match.isLive ? '<span class="live-badge">🔴 LIVE</span>' : `<span class="upcoming-badge">📅 ${match.matchDate} ${match.matchTime}</span>`}</span>
                    </div>
                    <div class="teams">
                        <span class="team-name">${match.homeTeam}</span>
                        <span class="score">${(match.homeScore !== null && match.homeScore !== undefined) ? match.homeScore : '-'} : ${(match.awayScore !== null && match.awayScore !== undefined) ? match.awayScore : '-'}</span>
                        <span class="team-name">${match.awayTeam}</span>
                    </div>
                    <div class="market-grid">
                        <div class="market-btn" onclick="addToBetSlip('${match.id}', '1', ${match.odds.home}, '1', 'Match Winner')">
                            <div class="market-name">1 (HOME)</div>
                            <div class="market-odds">${match.odds.home.toFixed(2)}</div>
                        </div>
                        <div class="market-btn" onclick="addToBetSlip('${match.id}', 'X', ${match.odds.draw}, 'X', 'Match Winner')">
                            <div class="market-name">X (DRAW)</div>
                            <div class="market-odds">${match.odds.draw.toFixed(2)}</div>
                        </div>
                        <div class="market-btn" onclick="addToBetSlip('${match.id}', '2', ${match.odds.away}, '2', 'Match Winner')">
                            <div class="market-name">2 (AWAY)</div>
                            <div class="market-odds">${match.odds.away.toFixed(2)}</div>
                        </div>
                        <div class="market-btn" onclick="addToBetSlip('${match.id}', 'Over 2.5', ${match.odds.over25}, 'O2.5', 'Total Goals')">
                            <div class="market-name">OVER 2.5</div>
                            <div class="market-odds">${match.odds.over25.toFixed(2)}</div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function startAutoRefresh() {
            if (autoRefreshInterval) clearInterval(autoRefreshInterval);
            autoRefreshInterval = setInterval(() => {
                fetchMatches();
            }, 60000);
        }

        async function loadBalance() {
            try {
                const doc = await db.collection("wallets").doc(currentUser.uid).get();
                if (doc.exists) {
                    balance = doc.data().balance || 0;
                } else {
                    balance = 100;
                    await db.collection("wallets").doc(currentUser.uid).set({ balance: 100 });
                }
                document.getElementById('balance').textContent = balance.toFixed(2);
            } catch (error) {
                balance = 100;
                document.getElementById('balance').textContent = balance.toFixed(2);
            }
        }

        window.addToBetSlip = function(matchId, selection, odds, display, market) {
            const match = matches.find(m => m.id === matchId);
            if (!match) return;
            
            const bet = {
                matchId: match.id,
                matchName: `${match.homeTeam} vs ${match.awayTeam} (${match.matchDate} ${match.matchTime})`,
                market: market,
                selection: selection,
                display: display,
                odds: odds
            };
            
            if (betType === 'single') {
                selectedBets = [bet];
            } else {
                if (selectedBets.some(b => b.matchId === matchId)) {
                    showToast('Only one bet per match allowed in ACCA', 'error');
                    return;
                }
                selectedBets.push(bet);
            }
            updateBetSlip();
            showToast(`Added: ${bet.matchName} - ${display} @ ${odds.toFixed(2)}`, 'success');
        };

        function updateBetSlip() {
            const container = document.getElementById('betslipItems');
            const totalOddsSpan = document.getElementById('totalOdds');
            const potentialSpan = document.getElementById('potentialReturn');
            const placeBtn = document.getElementById('placeBetBtn');
            
            if (selectedBets.length === 0) {
                container.innerHTML = '<div class="empty-state">➕ Click odds to add bets</div>';
                totalOddsSpan.textContent = '0.00';
                potentialSpan.textContent = '$0.00';
                placeBtn.disabled = true;
                return;
            }
            
            const totalOdds = selectedBets.reduce((acc, bet) => acc * bet.odds, 1);
            const betAmount = parseFloat(document.getElementById('betAmount').value) || 10;
            const potentialReturn = betAmount * totalOdds;
            
            totalOddsSpan.textContent = totalOdds.toFixed(2);
            potentialSpan.textContent = `$${potentialReturn.toFixed(2)}`;
            placeBtn.disabled = false;
            
            container.innerHTML = selectedBets.map((bet, index) => `
                <div class="betslip-item">
                    <div class="betslip-item-header" style="display:flex;justify-content:space-between">
                        <span><strong>${bet.matchName.substring(0, 40)}</strong></span>
                        <span class="remove-bet" onclick="removeBet(${index})" style="color:var(--danger);cursor:pointer">✖</span>
                    </div>
                    <div>${bet.market} - ${bet.display}</div>
                    <div style="color: var(--primary); font-weight: bold;">${bet.odds.toFixed(2)}</div>
                </div>
            `).join('');
        }

        window.removeBet = function(index) {
            selectedBets.splice(index, 1);
            updateBetSlip();
        };

        function generateTicketNumber() {
            return `TKT-${Date.now()}-${Math.random().toString(36).substring(2, 8).toUpperCase()}`;
        }

        async function placeBet() {
            const betAmount = parseFloat(document.getElementById('betAmount').value);
            if (selectedBets.length === 0) { showToast('No bets selected', 'error'); return; }
            if (betAmount < 1 || betAmount > 5000) { showToast('Bet amount must be $1-$5000', 'error'); return; }
            if (betAmount > balance) { showToast('Insufficient funds', 'error'); return; }
            
            const totalOdds = selectedBets.reduce((acc, bet) => acc * bet.odds, 1);
            const ticketNumber = generateTicketNumber();
            
            try {
                const walletRef = db.collection("wallets").doc(currentUser.uid);
                await db.runTransaction(async (transaction) => {
                    const doc = await transaction.get(walletRef);
                    const newBalance = doc.data().balance - betAmount;
                    if (newBalance < 0) throw new Error('Insufficient funds');
                    transaction.update(walletRef, { balance: newBalance });
                });
                
                const betData = {
                    userId: currentUser.uid,
                    ticketNumber: ticketNumber,
                    selections: selectedBets,
                    stake: betAmount,
                    totalOdds: totalOdds,
                    potentialReturn: betAmount * totalOdds,
                    betType: betType,
                    status: 'pending',
                    createdAt: new Date().toISOString(),
                    return: 0
                };
                await db.collection("football_bets").doc(ticketNumber).set(betData);
                balance -= betAmount;
                document.getElementById('balance').textContent = balance.toFixed(2);
                selectedBets = [];
                updateBetSlip();
                showToast(`✅ Bet placed! Ticket: ${ticketNumber}`, 'success');
                await loadOpenBets();
                await loadHistory();
            } catch (error) {
                showToast('Failed to place bet: ' + error.message, 'error');
            }
        }

        async function loadOpenBets() {
            try {
                const snapshot = await db.collection("football_bets").where("userId", "==", currentUser.uid).where("status", "==", "pending").get();
                const container = document.getElementById('openBetsContainer');
                if (snapshot.empty) { container.innerHTML = '<div class="empty-state">✨ No open bets</div>'; return; }
                let html = '';
                snapshot.forEach(doc => {
                    const bet = doc.data();
                    const selectionsText = bet.selections.map(s => `${s.matchName.substring(0, 40)} - ${s.display} @ ${s.odds.toFixed(2)}`).join('<br>');
                    html += `<div class="bet-card"><div class="bet-card-header" style="display:flex;justify-content:space-between"><span>🎫 ${bet.ticketNumber.substring(0, 15)}</span><span style="background: var(--secondary); padding:2px 8px; border-radius:20px;">PENDING</span></div>
                    <div style="font-size:12px; margin:8px 0;">${selectionsText}</div>
                    <div style="display:flex; justify-content:space-between;"><span>Stake: $${bet.stake.toFixed(2)}</span><span>To Win: $${(bet.stake * bet.totalOdds).toFixed(2)}</span>
                    <button class="cashout-btn" onclick="cashOut('${bet.ticketNumber}', ${bet.stake})">💸 CASH OUT (70%)</button></div></div>`;
                });
                container.innerHTML = html;
            } catch(e) { console.error(e); }
        }

        window.cashOut = async function(ticketNumber, stake) {
            const cashoutValue = stake * 0.7;
            if (!confirm(`Cash out for $${cashoutValue.toFixed(2)}?`)) return;
            try {
                const walletRef = db.collection("wallets").doc(currentUser.uid);
                await db.runTransaction(async (transaction) => {
                    const doc = await transaction.get(walletRef);
                    transaction.update(walletRef, { balance: doc.data().balance + cashoutValue });
                });
                await db.collection("football_bets").doc(ticketNumber).update({ status: 'cashed_out', return: cashoutValue, cashedOutAt: new Date().toISOString() });
                balance += cashoutValue;
                document.getElementById('balance').textContent = balance.toFixed(2);
                await loadOpenBets();
                await loadHistory();
                showToast(`💰 Cashed out $${cashoutValue.toFixed(2)}`, 'success');
            } catch(e) { showToast('Cashout failed', 'error'); }
        };

        async function loadHistory() {
            try {
                const snapshot = await db.collection("football_bets").where("userId", "==", currentUser.uid).where("status", "in", ["won", "lost", "cashed_out"]).get();
                const container = document.getElementById('historyContainer');
                if (snapshot.empty) { container.innerHTML = '<div class="empty-state">📜 No betting history</div>'; return; }
                let html = '';
                snapshot.forEach(doc => {
                    const bet = doc.data();
                    const returnAmount = bet.return || (bet.status === 'won' ? bet.stake * bet.totalOdds : 0);
                    const borderColor = bet.status === 'won' ? '#4caf50' : bet.status === 'lost' ? '#ff4757' : '#ffc107';
                    html += `<div class="bet-card" style="border-left-color:${borderColor}"><div class="bet-card-header" style="display:flex;justify-content:space-between"><span>🎫 ${bet.ticketNumber.substring(0, 15)}</span><span>${bet.status.toUpperCase()}</span></div>
                    <div>${bet.selections.length} selections @ ${bet.totalOdds.toFixed(2)}</div><div>Stake: $${bet.stake.toFixed(2)} | ${bet.status === 'won' ? '+' : ''}$${returnAmount.toFixed(2)}</div></div>`;
                });
                container.innerHTML = html;
            } catch(e) { console.error(e); }
        }

        function showToast(message, type) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.style.borderLeftColor = type === 'success' ? '#4caf50' : type === 'error' ? '#ff4757' : '#ffc107';
            toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-triangle' : 'fa-info-circle'}"></i> ${message}`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // Event Listeners
        document.getElementById('placeBetBtn').addEventListener('click', placeBet);
        document.getElementById('clearSlip').addEventListener('click', () => { selectedBets = []; updateBetSlip(); });
        document.getElementById('betAmount').addEventListener('input', updateBetSlip);
        document.getElementById('refreshBtn').addEventListener('click', () => { fetchMatches(); });
        
        document.querySelectorAll('.betslip-tab').forEach(btn => btn.addEventListener('click', () => {
            document.querySelectorAll('.betslip-tab').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            betType = btn.dataset.type;
            selectedBets = [];
            updateBetSlip();
        }));
        
        document.querySelectorAll('.tab-btn').forEach(btn => btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            currentMarket = btn.dataset.market;
            displayMatches();
        }));
        
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', (e) => {
                e.preventDefault();
                const page = item.dataset.page;
                if (page === 'bets') {
                    document.getElementById('openBetsContainer').scrollIntoView({ behavior: 'smooth' });
                } else if (page === 'home') {
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
                document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
                item.classList.add('active');
            });
        });
    </script>
</body>
</html>
