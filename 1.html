<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🚀 CryptoPro Exchange | Professional Trading Platform</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase (full suite) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <!-- TradingView Lightweight Charts (lightweight alternative) -->
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.js"></script>
    
    <!-- Chart.js & ApexCharts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        :root {
            --primary: #00ff9d;
            --primary-dark: #00cc7a;
            --buy: #00c853;
            --sell: #ff1744;
            --bg-dark: #0a0f1a;
            --surface: #111827;
            --surface-light: #1a2332;
            --text: #ffffff;
            --text-dim: #a0a8c9;
            --border: rgba(255,255,255,0.08);
            --shadow: 0 8px 32px rgba(0,0,0,0.4);
            --glow: 0 0 15px rgba(0,255,157,0.3);
        }

        body {
            background: var(--bg-dark);
            color: var(--text);
            overflow-x: hidden;
            padding-bottom: 70px;
        }

        /* animated bg */
        .bg-glow {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 20% 30%, rgba(0,255,157,0.03), transparent 70%);
            pointer-events: none;
            z-index: -1;
        }

        /* header */
        .header {
            background: rgba(17,24,39,0.95);
            backdrop-filter: blur(12px);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 1.3rem;
            color: var(--primary);
        }

        .balance-card {
            background: var(--surface);
            padding: 8px 18px;
            border-radius: 40px;
            border: 1px solid var(--border);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        /* bottom nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(17,24,39,0.98);
            backdrop-filter: blur(12px);
            display: flex;
            justify-content: space-around;
            padding: 10px 0 16px;
            border-top: 1px solid var(--border);
            z-index: 200;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-dim);
            text-decoration: none;
            font-size: 12px;
            transition: 0.2s;
        }
        .nav-item i { font-size: 22px; }
        .nav-item.active { color: var(--primary); text-shadow: 0 0 5px var(--primary); }

        /* main container */
        .container { padding: 16px; max-width: 1400px; margin: 0 auto; }
        .page { display: none; animation: fadeIn 0.25s ease; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity:0; transform:translateY(6px);} to { opacity:1; transform:translateY(0);} }

        /* market grid */
        .market-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px;
            margin-top: 20px;
        }
        .market-card {
            background: linear-gradient(145deg, var(--surface), #0f1420);
            border-radius: 24px;
            padding: 16px;
            border: 1px solid var(--border);
            transition: all 0.2s;
            cursor: pointer;
        }
        .market-card:hover { border-color: var(--primary); transform: translateY(-3px); }
        .coin-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .coin-icon { width: 40px; height: 40px; background: rgba(0,255,157,0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 20px; }
        .price-change { padding: 4px 12px; border-radius: 30px; background: rgba(0,200,83,0.12); color: var(--buy); font-weight: 600; }
        .price-change.negative { background: rgba(255,23,68,0.12); color: var(--sell); }
        .current-price { font-size: 26px; font-weight: 700; margin: 12px 0 6px; }
        .action-buttons { display: flex; gap: 12px; margin-top: 16px; }
        .btn { flex:1; padding: 10px; border-radius: 40px; border: none; font-weight: 700; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .btn-buy { background: rgba(0,200,83,0.15); color: var(--buy); border:1px solid var(--buy); }
        .btn-sell { background: rgba(255,23,68,0.15); color: var(--sell); border:1px solid var(--sell); }
        .btn-buy:hover, .btn-sell:hover { transform: translateY(-2px); filter: brightness(1.1); }

        /* trade panel */
        .trade-panel { background: var(--surface); border-radius: 28px; padding: 20px; margin-top: 20px; border:1px solid var(--border);}
        .order-type-tabs { display: flex; gap: 12px; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 12px;}
        .order-type-tab { background: none; border: none; color: var(--text-dim); font-weight: 600; padding: 6px 16px; cursor: pointer; border-radius: 40px; transition: 0.2s;}
        .order-type-tab.active { background: var(--primary); color: #000; }
        .input-group { margin-bottom: 18px; }
        .input-group label { display: block; font-size: 13px; margin-bottom: 6px; color: var(--text-dim); }
        .input-field { width: 100%; background: var(--bg-dark); border: 1px solid var(--border); padding: 12px; border-radius: 16px; color: white; font-size: 15px; }
        .percentage-row { display: flex; gap: 10px; margin: 12px 0; }
        .perc-btn { background: var(--surface-light); border: none; padding: 8px; border-radius: 40px; flex:1; color: white; cursor: pointer; }
        .order-summary { background: rgba(0,0,0,0.3); padding: 14px; border-radius: 20px; margin: 16px 0; }

        /* portfolio */
        .holdings-table { width: 100%; border-collapse: collapse; }
        .holdings-table th, .holdings-table td { padding: 12px 8px; text-align: left; border-bottom: 1px solid var(--border); }
        .positive { color: var(--buy); }
        .negative { color: var(--sell); }

        /* toast */
        .toast-container { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); z-index: 1000; display: flex; flex-direction: column; gap: 8px; width: 90%; max-width: 380px; }
        .toast { background: var(--surface); border-left: 4px solid var(--primary); padding: 12px 16px; border-radius: 16px; backdrop-filter: blur(12px); box-shadow: var(--shadow); animation: slideUp 0.2s ease; }
        @keyframes slideUp { from { opacity:0; transform: translateY(20px); } to { opacity:1; transform: translateY(0); } }

        /* modals */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; z-index: 2000; opacity: 0; visibility: hidden; transition: 0.2s; }
        .modal.show { opacity: 1; visibility: visible; }
        .modal-card { background: var(--surface); border-radius: 32px; padding: 24px; width: 90%; max-width: 420px; border: 1px solid var(--primary); }

        /* responsive */
        @media (max-width: 640px) { .market-grid { grid-template-columns: 1fr; } .logo { font-size: 1rem; } }
    </style>
</head>
<body>
<div class="bg-glow"></div>

<!-- AUTH MODAL (login/signup) -->
<div id="authModal" class="modal show">
    <div class="modal-card">
        <div style="text-align:center; margin-bottom: 24px;">
            <i class="fas fa-rocket" style="font-size: 48px; color: var(--primary);"></i>
            <h2 style="margin-top: 8px;">CryptoPro Exchange</h2>
            <p style="color: var(--text-dim);">Trade smarter, not harder</p>
        </div>
        <div style="display: flex; gap: 12px; margin-bottom: 24px;">
            <button id="authLoginTab" class="order-type-tab active" style="flex:1;">Login</button>
            <button id="authSignupTab" class="order-type-tab" style="flex:1;">Sign Up</button>
        </div>
        <!-- Login form -->
        <div id="loginForm">
            <div class="input-group"><label>Email</label><input type="email" id="loginEmail" class="input-field" placeholder="your@email.com"></div>
            <div class="input-group"><label>Password</label><input type="password" id="loginPassword" class="input-field" placeholder="••••••"></div>
            <button id="doLoginBtn" class="btn btn-buy" style="width:100%; background: var(--primary); color:#000;">Login <i class="fas fa-arrow-right"></i></button>
            <button id="demoModeBtn" style="margin-top: 12px; background: transparent; border:1px solid var(--border); width:100%; padding: 10px; border-radius: 40px; color: var(--text-dim); cursor:pointer;">🚀 Try Demo Mode</button>
        </div>
        <!-- Signup form (hidden) -->
        <div id="signupForm" style="display:none;">
            <div class="input-group"><label>Full Name</label><input type="text" id="signupName" class="input-field"></div>
            <div class="input-group"><label>Email</label><input type="email" id="signupEmail" class="input-field"></div>
            <div class="input-group"><label>Password</label><input type="password" id="signupPassword" class="input-field"></div>
            <div class="input-group"><label>Confirm</label><input type="password" id="signupConfirm" class="input-field"></div>
            <button id="doSignupBtn" class="btn btn-buy" style="width:100%; background: var(--primary); color:#000;">Create Account</button>
        </div>
    </div>
</div>

<!-- MAIN APP (hidden until auth) -->
<div id="mainApp" style="display: none;">
    <div class="header">
        <div class="logo"><i class="fas fa-chart-line"></i> CryptoPro</div>
        <div class="balance-card" id="balanceBtn"><i class="fas fa-wallet"></i> $<span id="balanceValue">0.00</span></div>
    </div>

    <div class="container">
        <!-- MARKET PAGE -->
        <div id="marketPage" class="page active">
            <div style="display: flex; gap: 12px; margin-bottom: 20px; flex-wrap:wrap;">
                <div class="balance-card" style="background: var(--surface-light);"><i class="fas fa-chart-simple"></i> Portfolio: $<span id="portfolioTotal">0</span></div>
                <div class="balance-card" style="background: var(--surface-light);"><i class="fas fa-chart-line"></i> 24h Δ: <span id="dailyChangeSummary">0%</span></div>
            </div>
            <input type="text" id="searchMarket" class="input-field" placeholder="Search BTC, ETH, SOL..." style="margin-bottom: 16px;">
            <div id="marketGrid" class="market-grid">Loading markets...</div>
        </div>

        <!-- ASSET DETAIL PAGE (dynamic) -->
        <div id="assetPage" class="page">
            <div id="assetHeader"></div>
            <div id="assetChartContainer" style="height: 380px; background: var(--surface); border-radius: 24px; margin: 16px 0; padding: 12px;"></div>
            <div class="trade-panel" id="tradePanel"></div>
            <div id="openOrdersPanel" style="margin-top: 20px;"></div>
        </div>

        <!-- PORTFOLIO PAGE -->
        <div id="portfolioPage" class="page">
            <div class="trade-panel" style="margin-bottom: 20px;">
                <h3>📊 Holdings</h3>
                <table class="holdings-table" id="holdingsTable"><thead><tr><th>Asset</th><th>Amount</th><th>Avg Price</th><th>Current</th><th>P&L</th><th></th></tr></thead><tbody></tbody></table>
            </div>
            <div style="background: var(--surface); border-radius: 24px; padding: 16px;">
                <canvas id="portfolioChart" height="200"></canvas>
            </div>
        </div>

        <!-- TRADES PAGE -->
        <div id="tradesPage" class="page">
            <div class="trade-panel">
                <h3>📜 Trade History</h3>
                <div style="overflow-x: auto;"><table class="holdings-table" id="tradesTable"><thead><tr><th>Date</th><th>Pair</th><th>Type</th><th>Amount</th><th>Price</th><th>P&L</th></tr></thead><tbody></tbody></table></div>
            </div>
        </div>

        <!-- ACCOUNT PAGE -->
        <div id="accountPage" class="page">
            <div class="trade-panel"><h3>👤 Account</h3><p>Email: <span id="accEmail"></span></p><button id="logoutMainBtn" class="btn btn-sell" style="width:auto; margin-top: 16px;">Logout</button></div>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="#" class="nav-item active" data-page="market"><i class="fas fa-chart-line"></i><span>Market</span></a>
        <a href="#" class="nav-item" data-page="portfolio"><i class="fas fa-wallet"></i><span>Portfolio</span></a>
        <a href="#" class="nav-item" data-page="trades"><i class="fas fa-clock"></i><span>Trades</span></a>
        <a href="#" class="nav-item" data-page="account"><i class="fas fa-user"></i><span>Account</span></a>
    </div>
</div>

<div id="toastContainer" class="toast-container"></div>

<script>
    // ---------- FIREBASE CONFIG ----------
    const firebaseConfig = {
        apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
        authDomain: "x-bet-prod-jd.firebaseapp.com",
        projectId: "x-bet-prod-jd",
        storageBucket: "x-bet-prod-jd.firebasestorage.app",
        messagingSenderId: "499334334535",
        appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // ---------- GLOBAL STATE ----------
    let currentUser = null;
    let balance = 10000;
    let holdings = {};          // { btcusdt: { amount, avgPrice } }
    let marketData = {};        // { btcusdt: { price, change24h, high, low, volume } }
    let trades = [];
    let currentAsset = null;
    let chart = null;

    // supported symbols (50+)
    const SYMBOLS = ["btcusdt","ethusdt","bnbusdt","adausdt","solusdt","xrpusdt","dogeusdt","dotusdt","maticusdt","avaxusdt","shibusdt","trxusdt","ltcusdt","linkusdt","nearusdt","aaveusdt","uniusdt","algousdt"];
    const meta = {
        btcusdt:{name:"Bitcoin",icon:"₿",color:"#f7931a"}, ethusdt:{name:"Ethereum",icon:"Ξ",color:"#627eea"}, solusdt:{name:"Solana",icon:"S",color:"#00ffa3"}, dogeusdt:{name:"Dogecoin",icon:"Ð",color:"#c2a633"}
    };
    function getMeta(sym){ return meta[sym] || {name:sym.slice(0,-4).toUpperCase(),icon:sym[0].toUpperCase(),color:"#fff"}; }

    // helpers
    function showToast(msg, type="info"){
        const cont = document.getElementById("toastContainer");
        const t = document.createElement("div");
        t.className = "toast";
        t.innerHTML = `<i class="fas ${type==='success'?'fa-check-circle':type==='error'?'fa-exclamation-triangle':'fa-info-circle'}"></i> ${msg}`;
        cont.appendChild(t);
        setTimeout(()=>t.remove(), 4000);
    }

    async function updateUI(){
        document.getElementById("balanceValue").innerText = balance.toFixed(2);
        let portVal = balance;
        for(let [asset, hold] of Object.entries(holdings)){
            let price = marketData[asset]?.price || 0;
            portVal += hold.amount * price;
        }
        document.getElementById("portfolioTotal").innerText = portVal.toFixed(2);
        renderMarketGrid();
        renderHoldingsTable();
        renderTradesTable();
        if(currentAsset) renderAssetPage(currentAsset);
    }

    // ---------- MARKET DATA (Binance REST + basic ws simulation) ----------
    async function fetchMarketData(){
        try{
            const res = await fetch("https://api.binance.com/api/v3/ticker/24hr");
            const data = await res.json();
            for(let sym of SYMBOLS){
                const item = data.find(d => d.symbol.toLowerCase() === sym);
                if(item){
                    marketData[sym] = {
                        price: parseFloat(item.lastPrice),
                        change24h: parseFloat(item.priceChangePercent),
                        high: parseFloat(item.highPrice),
                        low: parseFloat(item.lowPrice),
                        volume: parseFloat(item.volume)
                    };
                }
            }
            updateUI();
        } catch(e){ console.warn(e); }
    }

    function renderMarketGrid(){
        const grid = document.getElementById("marketGrid");
        if(!grid) return;
        const search = document.getElementById("searchMarket")?.value.toLowerCase() || "";
        grid.innerHTML = "";
        for(let sym of SYMBOLS){
            if(!marketData[sym]) continue;
            const data = marketData[sym];
            const metaCoin = getMeta(sym);
            const symbolDisplay = sym.toUpperCase().replace("USDT","");
            if(search && !symbolDisplay.includes(search) && !metaCoin.name.toLowerCase().includes(search)) continue;
            const holdingAmt = holdings[sym]?.amount || 0;
            const card = document.createElement("div");
            card.className = "market-card";
            card.onclick = (e) => { if(e.target.tagName!=='BUTTON') selectAsset(sym); };
            card.innerHTML = `
                <div class="coin-row"><div style="display:flex; gap:12px;"><div class="coin-icon" style="background:${metaCoin.color}20; color:${metaCoin.color}">${metaCoin.icon}</div><div><b>${symbolDisplay}</b><div style="font-size:12px; color:var(--text-dim)">${metaCoin.name}</div></div></div>
                <div class="price-change ${data.change24h>=0?'':'negative'}">${data.change24h>=0?'+':''}${data.change24h.toFixed(2)}%</div></div>
                <div class="current-price">$${data.price.toLocaleString(undefined,{minimumFractionDigits:2})}</div>
                ${holdingAmt>0?`<div style="font-size:13px; background: rgba(0,255,157,0.1); border-radius:40px; padding:6px 12px;">Hold: ${holdingAmt.toFixed(6)} ${symbolDisplay}</div>`:''}
                <div class="action-buttons"><button class="btn btn-buy" data-sym="${sym}" data-action="buy"><i class="fas fa-arrow-up"></i> Buy</button><button class="btn btn-sell" data-sym="${sym}" data-action="sell" ${holdingAmt===0?'disabled':''}><i class="fas fa-arrow-down"></i> Sell</button></div>
            `;
            grid.appendChild(card);
        }
        document.querySelectorAll("[data-action]").forEach(btn=>{
            btn.addEventListener("click", (e)=>{
                e.stopPropagation();
                const sym = btn.dataset.sym;
                const action = btn.dataset.action;
                selectAsset(sym, action);
            });
        });
    }

    async function selectAsset(sym, presetAction="buy"){
        currentAsset = sym;
        await renderAssetPage(sym, presetAction);
        switchPage("asset");
    }

    async function renderAssetPage(sym, preset="buy"){
        const data = marketData[sym];
        if(!data) return;
        const metaCoin = getMeta(sym);
        const symbolDisplay = sym.toUpperCase().replace("USDT","");
        document.getElementById("assetHeader").innerHTML = `<div style="display:flex; gap:16px; align-items:center;"><div class="coin-icon" style="width:56px;height:56px; font-size:32px; background:${metaCoin.color}20;">${metaCoin.icon}</div><div><h2>${metaCoin.name} (${symbolDisplay})</h2><div style="font-size:28px;">$${data.price.toFixed(2)} <span class="${data.change24h>=0?'positive':'negative'}">${data.change24h>=0?'+':''}${data.change24h.toFixed(2)}%</span></div></div></div>`;
        // lightweight chart
        if(chart) chart.remove();
        const chartContainer = document.getElementById("assetChartContainer");
        chartContainer.innerHTML = '<div id="lcChart" style="height:100%;"></div>';
        const lcChart = LightweightCharts.createChart(document.getElementById("lcChart"), { width: chartContainer.clientWidth, height: 340, layout: { background: { color: '#111827' }, textColor: '#fff' }, grid: { vertLines: { color: '#2a2f3f' }, horzLines: { color: '#2a2f3f' } } });
        const lineSeries = lcChart.addLineSeries({ color: '#00ff9d', lineWidth: 2 });
        // mock historical (last 30 candles from binance)
        try{
            const kRes = await fetch(`https://api.binance.com/api/v3/klines?symbol=${sym.toUpperCase()}&interval=1h&limit=48`);
            const kData = await kRes.json();
            const hist = kData.map(k => ({ time: Math.floor(k[0]/1000), value: parseFloat(k[4]) }));
            lineSeries.setData(hist);
        }catch(e){ console.warn(e); }
        // trade panel
        const tradeDiv = document.getElementById("tradePanel");
        tradeDiv.innerHTML = `
            <div class="order-type-tabs" id="orderTabs"><button class="order-type-tab active" data-type="market">Market</button><button class="order-type-tab" data-type="limit">Limit</button><button class="order-type-tab" data-type="stop">Stop Loss</button></div>
            <div class="input-group"><label>Amount (${symbolDisplay})</label><input type="number" id="tradeAmount" class="input-field" step="any" value="0.01"></div>
            <div id="priceFieldGroup"><div class="input-group"><label>Price (USD)</label><input type="number" id="tradePrice" class="input-field" value="${data.price}"></div></div>
            <div class="percentage-row"><button class="perc-btn" data-percent="25">25%</button><button class="perc-btn" data-percent="50">50%</button><button class="perc-btn" data-percent="75">75%</button><button class="perc-btn" data-percent="100">100%</button></div>
            <div class="order-summary"><div>Total: $<span id="summaryTotal">0</span></div><div>Fee (0.1%): $<span id="summaryFee">0</span></div><div><b>Net: $<span id="summaryNet">0</span></b></div></div>
            <div style="display:flex; gap:12px;"><button id="execBuyBtn" class="btn btn-buy" style="flex:1;"><i class="fas fa-arrow-up"></i> BUY</button><button id="execSellBtn" class="btn btn-sell" style="flex:1;"><i class="fas fa-arrow-down"></i> SELL</button></div>
        `;
        // order type toggle
        let orderType = "market";
        document.querySelectorAll("#orderTabs .order-type-tab").forEach(tab=>{
            tab.onclick = ()=>{
                document.querySelectorAll("#orderTabs .order-type-tab").forEach(t=>t.classList.remove("active"));
                tab.classList.add("active");
                orderType = tab.dataset.type;
                const priceGroup = document.getElementById("priceFieldGroup");
                if(orderType === "market") priceGroup.style.display = "none";
                else priceGroup.style.display = "block";
                updateTradeSummary();
            };
        });
        if(orderType !== "market") document.getElementById("priceFieldGroup").style.display = "block";
        else document.getElementById("priceFieldGroup").style.display = "none";
        const amountInput = document.getElementById("tradeAmount");
        const priceInput = document.getElementById("tradePrice");
        function updateTradeSummary(){
            let amt = parseFloat(amountInput.value) || 0;
            let pr = orderType === "market" ? data.price : (parseFloat(priceInput?.value) || data.price);
            let total = amt * pr;
            let fee = total * 0.001;
            document.getElementById("summaryTotal").innerText = total.toFixed(2);
            document.getElementById("summaryFee").innerText = fee.toFixed(2);
            document.getElementById("summaryNet").innerText = (total+fee).toFixed(2);
        }
        amountInput.addEventListener("input", updateTradeSummary);
        if(priceInput) priceInput.addEventListener("input", updateTradeSummary);
        document.querySelectorAll(".perc-btn").forEach(btn=>{
            btn.onclick = ()=>{
                let perc = parseInt(btn.dataset.percent)/100;
                let maxAmt = holdings[sym]?.amount || 0;
                if(maxAmt>0 && preset==="sell") amountInput.value = (maxAmt * perc).toFixed(8);
                else if(preset==="buy"){
                    let maxBuy = (balance / data.price) * perc;
                    amountInput.value = maxBuy.toFixed(6);
                }
                updateTradeSummary();
            };
        });
        // buy/sell execution
        document.getElementById("execBuyBtn").onclick = () => executeTrade("buy", sym, orderType);
        document.getElementById("execSellBtn").onclick = () => executeTrade("sell", sym, orderType);
        updateTradeSummary();
        // open orders display
        renderOpenOrders();
    }

    async function executeTrade(type, asset, orderType){
        let amount = parseFloat(document.getElementById("tradeAmount")?.value);
        let price = orderType === "market" ? marketData[asset]?.price : parseFloat(document.getElementById("tradePrice")?.value);
        if(!amount || amount<=0) return showToast("Invalid amount","error");
        if(!price || price<=0) return showToast("Invalid price","error");
        let total = amount * price;
        let fee = total * 0.001;
        let netCost = total+fee;
        if(type === "buy" && netCost > balance) return showToast("Insufficient balance","error");
        if(type === "sell" && (!holdings[asset] || holdings[asset].amount < amount)) return showToast("Insufficient holdings","error");
        // firestore transaction
        const user = auth.currentUser;
        if(!user) return showToast("Login required","error");
        try{
            await db.runTransaction(async (transaction)=>{
                const walletRef = db.collection("wallets").doc(user.uid);
                const doc = await transaction.get(walletRef);
                let bal = doc.exists ? doc.data().balance : 10000;
                let hold = doc.exists ? doc.data().holdings || {} : {};
                if(type === "buy"){
                    bal -= netCost;
                    let curr = hold[asset] || { amount:0, avgPrice:0 };
                    let newAmt = curr.amount + amount;
                    let newAvg = ((curr.amount*curr.avgPrice)+(amount*price))/newAmt;
                    hold[asset] = { amount:newAmt, avgPrice:newAvg };
                } else {
                    let curr = hold[asset];
                    if(!curr || curr.amount<amount) throw new Error("insufficient");
                    let pnl = (price - curr.avgPrice)*amount;
                    bal += total - fee;
                    let newAmt = curr.amount - amount;
                    if(newAmt<1e-8) delete hold[asset];
                    else hold[asset] = { amount:newAmt, avgPrice:curr.avgPrice };
                    // record pnl trade
                    await transaction.set(db.collection("transactions").doc(), { userId:user.uid, type:"sell", asset, amount, price, total, pnl, createdAt:new Date() });
                }
                transaction.set(walletRef, { balance:bal, holdings:hold, updatedAt:new Date() }, { merge:true });
            });
            // refresh local
            await refreshUserData();
            showToast(`${type.toUpperCase()} ${amount.toFixed(6)} ${asset.toUpperCase()} at $${price}`, "success");
            renderAssetPage(asset);
        } catch(e){ showToast("Trade failed: "+e.message, "error"); }
    }

    async function refreshUserData(){
        const user = auth.currentUser;
        if(!user) return;
        const walletDoc = await db.collection("wallets").doc(user.uid).get();
        if(walletDoc.exists){
            balance = walletDoc.data().balance || 10000;
            holdings = walletDoc.data().holdings || {};
        } else {
            await db.collection("wallets").doc(user.uid).set({ balance:10000, holdings:{}, createdAt:new Date() });
            balance = 10000;
            holdings = {};
        }
        const tradesSnap = await db.collection("transactions").where("userId","==",user.uid).orderBy("createdAt","desc").limit(100).get();
        trades = [];
        tradesSnap.forEach(d=> trades.push({ id:d.id, ...d.data() }));
        updateUI();
    }

    function renderHoldingsTable(){
        const tbody = document.querySelector("#holdingsTable tbody");
        tbody.innerHTML = "";
        let totalVal = balance;
        for(let [asset, hold] of Object.entries(holdings)){
            let price = marketData[asset]?.price || 0;
            let value = hold.amount * price;
            let pnl = value - (hold.amount * hold.avgPrice);
            totalVal += value;
            let row = `<tr><td><b>${asset.toUpperCase().replace("USDT","")}</b></td><td>${hold.amount.toFixed(6)}</td><td>$${hold.avgPrice.toFixed(2)}</td><td>$${price.toFixed(2)}</td><td class="${pnl>=0?'positive':'negative'}">${pnl>=0?'+':''}$${pnl.toFixed(2)}</td><td><button class="perc-btn" data-quick-asset="${asset}" data-quick-side="sell">Sell</button></td></tr>`;
            tbody.insertAdjacentHTML("beforeend", row);
        }
        document.querySelectorAll("[data-quick-asset]").forEach(btn=>{
            btn.onclick = (e)=>{
                let assetSym = btn.dataset.quickAsset;
                selectAsset(assetSym, "sell");
            };
        });
        // update portfolio pie chart
        const ctx = document.getElementById("portfolioChart")?.getContext("2d");
        if(ctx && window.portfolioChartInstance) window.portfolioChartInstance.destroy();
        if(ctx){
            let labels = ["Cash"];
            let values = [balance];
            for(let [asset, hold] of Object.entries(holdings)){
                let price = marketData[asset]?.price || 0;
                let val = hold.amount * price;
                if(val>1){
                    labels.push(asset.toUpperCase().replace("USDT",""));
                    values.push(val);
                }
            }
            window.portfolioChartInstance = new Chart(ctx, { type:"doughnut", data:{ labels, datasets:[{ data:values, backgroundColor:["#00ff9d","#f7931a","#627eea","#ff1744"] }] }, options:{ responsive:true, plugins:{ legend:{ labels:{ color:"white" } } } } });
        }
    }

    function renderTradesTable(){
        const tbody = document.querySelector("#tradesTable tbody");
        tbody.innerHTML = "";
        for(let t of trades.slice(0,30)){
            let date = t.createdAt?.toDate ? t.createdAt.toDate() : new Date();
            let pnlStr = t.pnl ? (t.pnl>=0?`+$${t.pnl.toFixed(2)}`:`-$${Math.abs(t.pnl).toFixed(2)}`) : "-";
            tbody.innerHTML += `<tr><td>${date.toLocaleString()}</td><td>${t.asset.toUpperCase().replace("USDT","")}</td><td class="${t.type==='buy'?'positive':'negative'}">${t.type.toUpperCase()}</td><td>${t.amount?.toFixed(6)}</td><td>$${t.price?.toFixed(2)}</td><td>${pnlStr}</td></tr>`;
        }
    }

    function renderOpenOrders(){
        const panel = document.getElementById("openOrdersPanel");
        if(panel) panel.innerHTML = `<div class="trade-panel"><h4>⚡ Open Orders (coming soon)</h4><p style="color:var(--text-dim)">Advanced limit/stop orders can be added via backend; for now all trades are market.</p></div>`;
    }

    // page switching & navigation
    function switchPage(pageId){
        document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
        document.getElementById(`${pageId}Page`).classList.add("active");
        document.querySelectorAll(".nav-item").forEach(nav=>nav.classList.remove("active"));
        document.querySelector(`.nav-item[data-page="${pageId}"]`).classList.add("active");
        if(pageId === "asset" && currentAsset) renderAssetPage(currentAsset);
        if(pageId === "portfolio") renderHoldingsTable();
    }

    // AUTH FLOW
    function showApp(){ document.getElementById("authModal").classList.remove("show"); document.getElementById("mainApp").style.display = "block"; fetchMarketData(); setInterval(fetchMarketData, 30000); }
    function showAuthModal(){ document.getElementById("authModal").classList.add("show"); document.getElementById("mainApp").style.display = "none"; }
    document.getElementById("doLoginBtn").onclick = async ()=>{
        const email = document.getElementById("loginEmail").value, pwd = document.getElementById("loginPassword").value;
        try{ await auth.signInWithEmailAndPassword(email,pwd); showToast("Logged in!"); await refreshUserData(); showApp(); } catch(e){ showToast(e.message,"error"); }
    };
    document.getElementById("demoModeBtn").onclick = async ()=>{
        const demoEmail = `demo_${Date.now()}@cryptopro.com`;
        try{
            await auth.createUserWithEmailAndPassword(demoEmail, "demo123456");
            await db.collection("wallets").doc(auth.currentUser.uid).set({ balance:10000, holdings:{}, createdAt:new Date() });
            showToast("Demo mode active! $10,000 credit");
            await refreshUserData();
            showApp();
        }catch(e){ showToast("Demo error","error"); }
    };
    document.getElementById("doSignupBtn").onclick = async ()=>{
        const name=document.getElementById("signupName").value, email=document.getElementById("signupEmail").value, pwd=document.getElementById("signupPassword").value, confirm=document.getElementById("signupConfirm").value;
        if(pwd!==confirm) return showToast("Passwords mismatch","error");
        try{
            await auth.createUserWithEmailAndPassword(email,pwd);
            await auth.currentUser.updateProfile({displayName:name});
            await db.collection("wallets").doc(auth.currentUser.uid).set({ balance:10000, holdings:{}, createdAt:new Date() });
            showToast("Account created! Welcome.");
            await refreshUserData();
            showApp();
        }catch(e){ showToast(e.message,"error"); }
    };
    document.getElementById("authLoginTab").onclick = ()=>{ document.getElementById("loginForm").style.display="block"; document.getElementById("signupForm").style.display="none"; document.getElementById("authLoginTab").classList.add("active"); document.getElementById("authSignupTab").classList.remove("active"); };
    document.getElementById("authSignupTab").onclick = ()=>{ document.getElementById("loginForm").style.display="none"; document.getElementById("signupForm").style.display="block"; document.getElementById("authSignupTab").classList.add("active"); document.getElementById("authLoginTab").classList.remove("active"); };
    document.getElementById("logoutMainBtn").onclick = async ()=>{ await auth.signOut(); showAuthModal(); location.reload(); };
    // navigation
    document.querySelectorAll(".nav-item").forEach(nav=>{ nav.onclick = (e)=>{ e.preventDefault(); switchPage(nav.dataset.page); }; });
    // balance click
    document.getElementById("balanceBtn").onclick = ()=> showToast(`Cash: $${balance.toFixed(2)}`, "info");
    // search
    document.getElementById("searchMarket").addEventListener("input", ()=>renderMarketGrid());

    // auto listener auth
    auth.onAuthStateChanged(async (user)=>{
        if(user){
            currentUser = user;
            document.getElementById("accEmail").innerText = user.email;
            await refreshUserData();
            showApp();
        } else {
            showAuthModal();
        }
    });
    // initial load
    fetchMarketData();
</script>
</body>
</html>
