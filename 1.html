<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚽ Xlodon Bet - Real API Football Betting</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #00ff9d;
            --danger: #ff4757;
            --success: #4caf50;
            --bg: #0a0f1a;
            --surface: #111827;
            --surface-light: #1a2332;
            --text: #ffffff;
            --text-dim: #94a3b8;
            --border: #1e293b;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            padding-bottom: 80px;
        }

        .header {
            background: var(--surface);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 20px;
            font-weight: 800;
            color: var(--primary);
        }

        .balance-card {
            background: var(--surface-light);
            padding: 8px 16px;
            border-radius: 30px;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .balance-amount {
            color: var(--primary);
            font-weight: 700;
            font-size: 18px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 20px;
        }

        /* Filters */
        .filters-section {
            background: var(--surface);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .filters {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            flex-wrap: wrap;
        }

        .filter-btn, .league-btn {
            padding: 8px 20px;
            background: var(--surface-light);
            border: 1px solid var(--border);
            border-radius: 30px;
            color: var(--text);
            cursor: pointer;
            transition: all 0.3s;
            font-size: 13px;
            white-space: nowrap;
        }

        .filter-btn.active, .league-btn.active {
            background: var(--primary);
            color: #000;
            border-color: var(--primary);
        }

        /* Matches */
        .matches-container {
            background: var(--surface);
            border-radius: 20px;
            padding: 20px;
        }

        .matches-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: 600px;
            overflow-y: auto;
        }

        .match-card {
            background: var(--surface-light);
            border-radius: 16px;
            padding: 15px;
            border: 1px solid var(--border);
            transition: all 0.3s;
        }

        .match-card:hover {
            transform: translateY(-2px);
            border-color: var(--primary);
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 12px;
            color: var(--text-dim);
        }

        .live-badge {
            background: var(--danger);
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 10px;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .match-teams {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .team {
            font-weight: 600;
            font-size: 15px;
            flex: 1;
        }

        .team.home { text-align: left; }
        .team.away { text-align: right; }

        .score {
            font-size: 20px;
            font-weight: 800;
            color: var(--primary);
            margin: 0 15px;
        }

        .markets {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 12px;
        }

        .market-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .market-btn:hover {
            background: var(--primary);
            transform: scale(1.02);
        }

        .market-btn:hover .market-name,
        .market-btn:hover .market-odds {
            color: #000;
        }

        .market-name {
            font-size: 10px;
            color: var(--text-dim);
        }

        .market-odds {
            font-weight: 700;
            color: var(--primary);
            font-size: 14px;
        }

        /* Bet Slip */
        .betslip {
            background: var(--surface);
            border-radius: 20px;
            padding: 20px;
            position: sticky;
            top: 80px;
            border: 2px solid var(--primary);
        }

        .betslip-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .bet-type {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .bet-type-btn {
            flex: 1;
            padding: 10px;
            background: var(--surface-light);
            border: none;
            border-radius: 30px;
            color: var(--text);
            cursor: pointer;
        }

        .bet-type-btn.active {
            background: var(--primary);
            color: #000;
        }

        .betslip-items {
            max-height: 300px;
            overflow-y: auto;
            margin-bottom: 15px;
        }

        .betslip-item {
            background: var(--surface-light);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            position: relative;
        }

        .remove-bet {
            position: absolute;
            top: 8px;
            right: 8px;
            color: var(--danger);
            cursor: pointer;
            font-size: 12px;
        }

        .stake-input {
            background: var(--surface-light);
            border-radius: 30px;
            padding: 0 16px;
            margin: 15px 0;
            display: flex;
            align-items: center;
        }

        .stake-input input {
            flex: 1;
            padding: 14px 0;
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 16px;
            outline: none;
        }

        .place-bet-btn {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            border: none;
            border-radius: 30px;
            color: #000;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .place-bet-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .bet-card {
            background: var(--surface-light);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            border-left: 4px solid var(--secondary);
        }

        .cashout-btn {
            padding: 4px 12px;
            background: var(--warning);
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }

        .toast-container {
            position: fixed;
            bottom: 80px;
            left: 20px;
            right: 20px;
            z-index: 1000;
        }

        .toast {
            padding: 12px 16px;
            background: var(--surface);
            border-radius: 12px;
            margin-bottom: 8px;
            animation: slideIn 0.3s ease;
            border-left: 4px solid var(--primary);
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid var(--surface-light);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-dim);
        }

        .api-status {
            background: var(--surface-light);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .api-status.success { border-left: 4px solid var(--success); }
        .api-status.error { border-left: 4px solid var(--danger); }

        @media (max-width: 900px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
            .betslip {
                position: static;
            }
        }
    </style>
</head>
<body>

    <div class="container">

                <div class="filters-section">

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Sportmonks API Configuration - REAL API ONLY
        const SPORTMONKS_TOKEN = 'DkFdWG9jFZvH8XSEgLrRfGwczABWVg5rlV25GvIRyN06zdPsOI48Nsv9Wooy';
        const API_BASE = 'https://api.sportmonks.com/v3/football';

        // App State
        let currentUser = null;
        let balance = 0;
        let selectedBets = [];
        let betType = 'single';
        let realMatches = [];
        let leagues = [];
        let currentLeague = 'all';
        let currentFilter = 'all';

        // Auth Listener
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                currentUser = user;
                await loadBalance();
                await fetchRealMatches();
                await fetchLeagues();
                setupRealtimeListeners();
                showToast('Connected to real API - Loading live matches', 'success');
            } else {
                showToast('Please login to continue', 'error');
                setTimeout(() => {
                    window.location.href = 'https://xcrazybet.github.io/millioner/login.html';
                }, 2000);
            }
        });

        // Fetch Real Matches from Sportmonks API
        async function fetchRealMatches() {
            const container = document.getElementById('matchesList');
            const apiStatus = document.getElementById('apiStatus');
            
            container.innerHTML = '<div class="loading"><div class="spinner"></div><p>Fetching real matches from API...</p></div>';
            apiStatus.innerHTML = '<span><i class="fas fa-sync-alt fa-spin"></i> Fetching matches...</span><button onclick="fetchRealMatches()" style="background: none; border: none; color: var(--primary); cursor: pointer;"><i class="fas fa-refresh"></i> Refresh</button>';
            
            try {
                // Try multiple endpoints to get real matches
                let allFixtures = [];
                
                // Endpoint 1: Get fixtures from 2026
                console.log('Fetching 2026 fixtures...');
                const response1 = await fetch(`${API_BASE}/fixtures/between/2026-01-01/2026-12-31?api_token=${SPORTMONKS_TOKEN}&include=league;participants;scores;state`, {
                    headers: { 'Accept': 'application/json' }
                });
                
                if (response1.ok) {
                    const data1 = await response1.json();
                    if (data1.data && data1.data.length > 0) {
                        allFixtures.push(...data1.data);
                        console.log(`Found ${data1.data.length} fixtures for 2026`);
                    }
                }
                
                // Endpoint 2: Get live scores
                console.log('Fetching live scores...');
                const response2 = await fetch(`${API_BASE}/livescores?api_token=${SPORTMONKS_TOKEN}&include=league;participants;scores;state`, {
                    headers: { 'Accept': 'application/json' }
                });
                
                if (response2.ok) {
                    const data2 = await response2.json();
                    if (data2.data && data2.data.length > 0) {
                        allFixtures.push(...data2.data);
                        console.log(`Found ${data2.data.length} live matches`);
                    }
                }
                
                // Endpoint 3: Get today's fixtures
                const today = new Date().toISOString().split('T')[0];
                console.log(`Fetching today's fixtures (${today})...`);
                const response3 = await fetch(`${API_BASE}/fixtures/date/${today}?api_token=${SPORTMONKS_TOKEN}&include=league;participants;scores;state`, {
                    headers: { 'Accept': 'application/json' }
                });
                
                if (response3.ok) {
                    const data3 = await response3.json();
                    if (data3.data && data3.data.length > 0) {
                        allFixtures.push(...data3.data);
                        console.log(`Found ${data3.data.length} fixtures for today`);
                    }
                }
                
                // Remove duplicates by ID
                const uniqueFixtures = [];
                const ids = new Set();
                for (const fixture of allFixtures) {
                    if (!ids.has(fixture.id)) {
                        ids.add(fixture.id);
                        uniqueFixtures.push(fixture);
                    }
                }
                
                if (uniqueFixtures.length > 0) {
                    realMatches = processAPIMatches(uniqueFixtures);
                    apiStatus.className = 'api-status success';
                    apiStatus.innerHTML = `<span><i class="fas fa-check-circle"></i> API Connected: ${realMatches.length} matches loaded</span><button onclick="fetchRealMatches()" style="background: none; border: none; color: var(--primary); cursor: pointer;"><i class="fas fa-refresh"></i> Refresh</button>`;
                    showToast(`✅ Loaded ${realMatches.length} real matches from API`, 'success');
                } else {
                    // If API returns no data, show helpful message
                    apiStatus.className = 'api-status error';
                    apiStatus.innerHTML = `<span><i class="fas fa-exclamation-triangle"></i> API returned no matches. Check your subscription.</span><button onclick="fetchRealMatches()" style="background: none; border: none; color: var(--primary); cursor: pointer;"><i class="fas fa-refresh"></i> Retry</button>`;
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-database"></i>
                            <h3>No matches found from API</h3>
                            <p>Your Sportmonks API subscription may not have access to match data.</p>
                            <p style="font-size: 12px; margin-top: 10px;">Try these endpoints in your browser:</p>
                            <code style="display: block; background: #000; padding: 10px; margin: 10px; border-radius: 5px; font-size: 11px; word-break: break-all;">
                                ${API_BASE}/fixtures?api_token=${SPORTMONKS_TOKEN}
                            </code>
                        </div>
                    `;
                }
                
                displayMatches();
                
            } catch (error) {
                console.error('API Error:', error);
                apiStatus.className = 'api-status error';
                apiStatus.innerHTML = `<span><i class="fas fa-exclamation-triangle"></i> API Error: ${error.message}</span><button onclick="fetchRealMatches()" style="background: none; border: none; color: var(--primary); cursor: pointer;"><i class="fas fa-refresh"></i> Retry</button>`;
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-wifi"></i>
                        <h3>API Connection Error</h3>
                        <p>${error.message}</p>
                        <button onclick="fetchRealMatches()" class="filter-btn" style="margin-top: 15px;">🔄 Retry Connection</button>
                    </div>
                `;
            }
        }

        // Process API matches into our format
        function processAPIMatches(fixtures) {
            return fixtures.map(fixture => {
                const participants = fixture.participants || [];
                const homeTeam = participants.find(p => p.meta?.location === 'home') || participants[0] || { name: 'Unknown' };
                const awayTeam = participants.find(p => p.meta?.location === 'away') || participants[1] || { name: 'Unknown' };
                
                const scores = fixture.scores || [];
                const homeScoreObj = scores.find(s => s.participant_id === homeTeam?.id);
                const awayScoreObj = scores.find(s => s.participant_id === awayTeam?.id);
                
                const homeScore = homeScoreObj?.score?.goals !== undefined ? homeScoreObj.score.goals : null;
                const awayScore = awayScoreObj?.score?.goals !== undefined ? awayScoreObj.score.goals : null;
                
                const state = fixture.state || {};
                const isLive = state.name === 'In Progress' || state.name === 'Live' || state.name === '1st Half' || state.name === '2nd Half';
                const isFinished = state.name === 'Finished' || state.name === 'Awarded';
                
                let status = 'upcoming';
                if (isLive) status = 'live';
                if (isFinished) status = 'finished';
                
                let timeDisplay = fixture.starting_at ? new Date(fixture.starting_at).toLocaleString() : 'Date TBD';
                if (isLive) timeDisplay = `LIVE - ${state.name || 'In Progress'}`;
                if (isFinished) timeDisplay = 'Finished';
                
                // Generate odds (since Sportmonks free tier may not include odds)
                const odds = generateRealisticOdds(homeTeam?.name, awayTeam?.name);
                
                return {
                    id: fixture.id,
                    leagueId: fixture.league?.id || 'unknown',
                    leagueName: fixture.league?.name || 'Football',
                    homeTeam: homeTeam?.name || 'Home Team',
                    awayTeam: awayTeam?.name || 'Away Team',
                    homeScore: homeScore,
                    awayScore: awayScore,
                    status: status,
                    time: timeDisplay,
                    isLive: isLive,
                    isFinished: isFinished,
                    odds: odds
                };
            });
        }

        // Generate realistic odds based on team strength
        function generateRealisticOdds(homeTeam, awayTeam) {
            let homeOdds = 2.50;
            let drawOdds = 3.20;
            let awayOdds = 2.80;
            
            const strongTeams = ['Real Madrid', 'Barcelona', 'Bayern', 'Liverpool', 'Manchester City', 'PSG', 'Inter', 'Milan', 'Arsenal', 'Chelsea'];
            const veryStrong = ['Manchester City', 'Real Madrid', 'Bayern Munich'];
            
            if (veryStrong.some(team => homeTeam?.includes(team))) {
                homeOdds = 1.60;
                drawOdds = 3.80;
                awayOdds = 5.50;
            } else if (strongTeams.some(team => homeTeam?.includes(team))) {
                homeOdds = 1.90;
                drawOdds = 3.50;
                awayOdds = 4.20;
            }
            
            if (veryStrong.some(team => awayTeam?.includes(team))) {
                homeOdds = 5.50;
                drawOdds = 3.80;
                awayOdds = 1.60;
            } else if (strongTeams.some(team => awayTeam?.includes(team))) {
                homeOdds = 4.20;
                drawOdds = 3.50;
                awayOdds = 1.90;
            }
            
            return {
                home: homeOdds.toFixed(2),
                draw: drawOdds.toFixed(2),
                away: awayOdds.toFixed(2),
                over25: (Math.random() * 0.4 + 1.75).toFixed(2),
                under25: (Math.random() * 0.4 + 1.85).toFixed(2),
                btts: (Math.random() * 0.3 + 1.75).toFixed(2)
            };
        }

        // Fetch leagues for filter
        async function fetchLeagues() {
            try {
                const response = await fetch(`${API_BASE}/leagues?api_token=${SPORTMONKS_TOKEN}&per_page=100`, {
                    headers: { 'Accept': 'application/json' }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    if (data.data) {
                        leagues = data.data.slice(0, 20);
                        updateLeagueFilters();
                    }
                }
            } catch (error) {
                console.error('Fetch leagues error:', error);
            }
        }

        // Update league filter buttons
        function updateLeagueFilters() {
            const container = document.getElementById('leagueFilters');
            const uniqueLeagues = [];
            const leagueMap = new Map();
            
            // Get unique leagues from matches
            realMatches.forEach(match => {
                if (!leagueMap.has(match.leagueId)) {
                    leagueMap.set(match.leagueId, match.leagueName);
                    uniqueLeagues.push({ id: match.leagueId, name: match.leagueName });
                }
            });
            
            let html = '<button class="league-btn active" data-league="all">🌍 ALL LEAGUES</button>';
            uniqueLeagues.slice(0, 15).forEach(league => {
                html += `<button class="league-btn" data-league="${league.id}">⚽ ${league.name.substring(0, 20)}</button>`;
            });
            
            container.innerHTML = html;
            
            // Reattach event listeners
            document.querySelectorAll('.league-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.league-btn').forEach(l => l.classList.remove('active'));
                    btn.classList.add('active');
                    currentLeague = btn.dataset.league;
                    displayMatches();
                });
            });
        }

        // Display matches based on filters
        function displayMatches() {
            let filtered = [...realMatches];
            
            // Apply league filter
            if (currentLeague !== 'all') {
                filtered = filtered.filter(m => m.leagueId == currentLeague);
            }
            
            // Apply status filter
            if (currentFilter === 'live') {
                filtered = filtered.filter(m => m.isLive === true);
            } else if (currentFilter === 'upcoming') {
                filtered = filtered.filter(m => m.status === 'upcoming' && !m.isLive && !m.isFinished);
            } else if (currentFilter === 'today') {
                filtered = filtered.filter(m => m.time.includes(new Date().toLocaleDateString()));
            }
            
            const container = document.getElementById('matchesList');
            
            if (filtered.length === 0) {
                container.innerHTML = `<div class="empty-state"><i class="fas fa-futbol"></i><br>No matches found for ${currentFilter} filter</div>`;
                return;
            }
            
            container.innerHTML = filtered.map(match => `
                <div class="match-card">
                    <div class="match-header">
                        <span><i class="fas fa-trophy"></i> ${match.leagueName}</span>
                        <span>${match.isLive ? '<span class="live-badge">🔴 LIVE</span>' : match.time}</span>
                    </div>
                    <div class="match-teams">
                        <div class="team home">${match.homeTeam}</div>
                        <div class="score">${match.homeScore !== null ? match.homeScore : '-'} : ${match.awayScore !== null ? match.awayScore : '-'}</div>
                        <div class="team away">${match.awayTeam}</div>
                    </div>
                    ${!match.isFinished ? `
                    <div class="markets">
                        <div class="market-btn" onclick="addToBetSlip('${match.id}', '1', ${match.odds.home}, 'Home Win')">
                            <div class="market-name">1 (HOME)</div>
                            <div class="market-odds">${match.odds.home}</div>
                        </div>
                        <div class="market-btn" onclick="addToBetSlip('${match.id}', 'X', ${match.odds.draw}, 'Draw')">
                            <div class="market-name">X (DRAW)</div>
                            <div class="market-odds">${match.odds.draw}</div>
                        </div>
                        <div class="market-btn" onclick="addToBetSlip('${match.id}', '2', ${match.odds.away}, 'Away Win')">
                            <div class="market-name">2 (AWAY)</div>
                            <div class="market-odds">${match.odds.away}</div>
                        </div>
                        <div class="market-btn" onclick="addToBetSlip('${match.id}', 'Over 2.5', ${match.odds.over25}, 'Over 2.5')">
                            <div class="market-name">OVER 2.5</div>
                            <div class="market-odds">${match.odds.over25}</div>
                        </div>
                    </div>
                    ` : '<div style="text-align: center; color: var(--text-dim); font-size: 12px;">Match Finished - Betting Closed</div>'}
                </div>
            `).join('');
        }

        // Add to bet slip
        window.addToBetSlip = function(matchId, selection, odds, display) {
            const match = realMatches.find(m => m.id == matchId);
            if (!match) return;
            
            if (match.isFinished) {
                showToast('Cannot bet on finished matches', 'error');
                return;
            }
            
            const bet = {
                id: `${matchId}_${selection}_${Date.now()}`,
                matchId: match.id,
                matchName: `${match.homeTeam} vs ${match.awayTeam}`,
                selection: selection,
                display: display,
                odds: parseFloat(odds),
                league: match.leagueName
            };
            
            if (betType === 'single') {
                selectedBets = [bet];
            } else {
                if (selectedBets.some(b => b.matchId === matchId)) {
                    showToast('Only one bet per match in accumulator', 'error');
                    return;
                }
                selectedBets.push(bet);
            }
            
            updateBetSlip();
            showToast(`Added: ${bet.matchName} - ${display} @ ${odds}`, 'success');
        };

        // Update bet slip UI
        function updateBetSlip() {
            const container = document.getElementById('betslipItems');
            const totalOddsSpan = document.getElementById('totalOdds');
            const potentialSpan = document.getElementById('potentialWin');
            const placeBtn = document.getElementById('placeBetBtn');
            const stake = parseFloat(document.getElementById('stakeAmount').value) || 0;
            
            if (selectedBets.length === 0) {
                container.innerHTML = '<div class="empty-state">➕ Click odds to add bets</div>';
                totalOddsSpan.textContent = '0.00';
                potentialSpan.textContent = '$0.00';
                placeBtn.disabled = true;
                return;
            }
            
            const totalOdds = selectedBets.reduce((acc, bet) => acc * bet.odds, 1);
            const potentialWin = stake * totalOdds;
            
            totalOddsSpan.textContent = totalOdds.toFixed(2);
            potentialSpan.textContent = `$${potentialWin.toFixed(2)}`;
            placeBtn.disabled = stake < 1 || stake > balance;
            
            container.innerHTML = selectedBets.map((bet, index) => `
                <div class="betslip-item">
                    <span class="remove-bet" onclick="removeBet('${bet.id}')">✖</span>
                    <div><strong>${bet.matchName}</strong></div>
                    <div style="font-size: 12px; color: var(--text-dim);">${bet.league}</div>
                    <div>${bet.display}</div>
                    <div style="color: var(--primary); font-weight: bold;">${bet.odds.toFixed(2)}</div>
                </div>
            `).join('');
        }

        window.removeBet = function(betId) {
            selectedBets = selectedBets.filter(b => b.id !== betId);
            updateBetSlip();
        };

        function generateTicketNumber() {
            const date = new Date();
            const random = Math.random().toString(36).substring(2, 8).toUpperCase();
            return `TKT-${date.getFullYear()}${(date.getMonth()+1).toString().padStart(2,'0')}${date.getDate().toString().padStart(2,'0')}-${date.getHours().toString().padStart(2,'0')}${date.getMinutes().toString().padStart(2,'0')}${date.getSeconds().toString().padStart(2,'0')}-${random}`;
        }

        async function placeBet() {
            const stake = parseFloat(document.getElementById('stakeAmount').value);
            
            if (selectedBets.length === 0) {
                showToast('No bets selected', 'error');
                return;
            }
            
            if (stake < 1 || stake > 5000) {
                showToast('Stake must be between $1 and $5000', 'error');
                return;
            }
            
            if (stake > balance) {
                showToast('Insufficient balance', 'error');
                return;
            }
            
            const totalOdds = selectedBets.reduce((acc, bet) => acc * bet.odds, 1);
            const potentialWin = stake * totalOdds;
            const ticketNumber = generateTicketNumber();
            
            try {
                const walletRef = db.collection("wallets").doc(currentUser.uid);
                await db.runTransaction(async (transaction) => {
                    const doc = await transaction.get(walletRef);
                    const newBalance = (doc.data()?.balance || 0) - stake;
                    if (newBalance < 0) throw new Error('Insufficient funds');
                    transaction.set(walletRef, { balance: newBalance, lastUpdated: new Date() }, { merge: true });
                });
                
                const betData = {
                    userId: currentUser.uid,
                    ticketNumber: ticketNumber,
                    selections: selectedBets,
                    stake: stake,
                    totalOdds: totalOdds,
                    potentialWin: potentialWin,
                    betType: betType,
                    status: 'pending',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    createdAtDate: new Date().toISOString()
                };
                
                await db.collection("bets").doc(ticketNumber).set(betData);
                
                balance -= stake;
                document.getElementById('balance').textContent = balance.toFixed(2);
                
                selectedBets = [];
                updateBetSlip();
                
                showToast(`✅ Bet placed! Ticket: ${ticketNumber}`, 'success');
                
                loadOpenBets();
                loadHistory();
                
            } catch (error) {
                console.error('Place bet error:', error);
                showToast('Failed to place bet: ' + error.message, 'error');
            }
        }

        async function loadBalance() {
            try {
                const doc = await db.collection("wallets").doc(currentUser.uid).get();
                if (doc.exists) {
                    balance = doc.data().balance || 0;
                } else {
                    balance = 1000;
                    await db.collection("wallets").doc(currentUser.uid).set({ balance: 1000 });
                }
                document.getElementById('balance').textContent = balance.toFixed(2);
            } catch (error) {
                console.error('Load balance error:', error);
                balance = 1000;
                document.getElementById('balance').textContent = '1000.00';
            }
        }

        async function loadOpenBets() {
            try {
                const snapshot = await db.collection("bets")
                    .where("userId", "==", currentUser.uid)
                    .where("status", "==", "pending")
                    .orderBy("createdAt", "desc")
                    .get();
                
                const container = document.getElementById('openBetsList');
                
                if (snapshot.empty) {
                    container.innerHTML = '<div class="empty-state">No open bets</div>';
                    return;
                }
                
                let html = '';
                snapshot.forEach(doc => {
                    const bet = doc.data();
                    const selectionsText = bet.selections.map(s => `${s.matchName} - ${s.display} @ ${s.odds.toFixed(2)}`).join('<br>');
                    html += `
                        <div class="bet-card">
                            <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                                <span style="font-size: 12px;">🎫 ${bet.ticketNumber.substring(0, 15)}</span>
                                <span style="background: var(--warning); padding: 2px 8px; border-radius: 20px;">PENDING</span>
                            </div>
                            <div style="font-size: 12px; margin: 8px 0;">${selectionsText}</div>
                            <div style="display: flex; justify-content: space-between; margin-top: 8px;">
                                <span>Stake: $${bet.stake.toFixed(2)}</span>
                                <span>To Win: $${bet.potentialWin.toFixed(2)}</span>
                                <button class="cashout-btn" onclick="cashOut('${bet.ticketNumber}', ${bet.stake})">💸 Cash Out (70%)</button>
                            </div>
                        </div>
                    `;
                });
                
                container.innerHTML = html;
            } catch (error) {
                console.error('Load open bets error:', error);
            }
        }

        window.cashOut = async function(ticketNumber, stake) {
            const cashoutValue = stake * 0.7;
            if (!confirm(`Cash out for $${cashoutValue.toFixed(2)}?`)) return;
            
            try {
                const walletRef = db.collection("wallets").doc(currentUser.uid);
                await db.runTransaction(async (transaction) => {
                    const doc = await transaction.get(walletRef);
                    transaction.update(walletRef, { balance: (doc.data().balance || 0) + cashoutValue });
                });
                
                await db.collection("bets").doc(ticketNumber).update({
                    status: 'cashed_out',
                    cashoutValue: cashoutValue,
                    cashedOutAt: new Date().toISOString()
                });
                
                balance += cashoutValue;
                document.getElementById('balance').textContent = balance.toFixed(2);
                
                await loadOpenBets();
                await loadHistory();
                showToast(`💰 Cashed out $${cashoutValue.toFixed(2)}`, 'success');
            } catch (error) {
                showToast('Cashout failed', 'error');
            }
        };

        async function loadHistory() {
            try {
                const snapshot = await db.collection("bets")
                    .where("userId", "==", currentUser.uid)
                    .where("status", "in", ["won", "lost", "cashed_out"])
                    .orderBy("createdAt", "desc")
                    .limit(20)
                    .get();
                
                const container = document.getElementById('historyList');
                
                if (snapshot.empty) {
                    container.innerHTML = '<div class="empty-state">No betting history</div>';
                    return;
                }
                
                let html = '';
                snapshot.forEach(doc => {
                    const bet = doc.data();
                    const statusColor = bet.status === 'won' ? 'var(--success)' : bet.status === 'lost' ? 'var(--danger)' : 'var(--warning)';
                    html += `
                        <div class="bet-card" style="border-left-color: ${statusColor}">
                            <div style="display: flex; justify-content: space-between;">
                                <span style="font-size: 12px;">🎫 ${bet.ticketNumber.substring(0, 15)}</span>
                                <span style="background: ${statusColor}; padding: 2px 8px; border-radius: 20px;">${bet.status.toUpperCase()}</span>
                            </div>
                            <div style="font-size: 12px; margin: 8px 0;">${bet.selections.length} selections @ ${bet.totalOdds.toFixed(2)}</div>
                            <div style="display: flex; justify-content: space-between;">
                                <span>Stake: $${bet.stake.toFixed(2)}</span>
                                <span>${bet.status === 'won' ? '+' : ''}$${(bet.potentialWin || 0).toFixed(2)}</span>
                            </div>
                        </div>
                    `;
                });
                
                container.innerHTML = html;
            } catch (error) {
                console.error('Load history error:', error);
            }
        }

        function setupRealtimeListeners() {
            db.collection("wallets").doc(currentUser.uid).onSnapshot((doc) => {
                if (doc.exists) {
                    balance = doc.data().balance || 0;
                    document.getElementById('balance').textContent = balance.toFixed(2);
                }
            });
            
            db.collection("bets").where("userId", "==", currentUser.uid).onSnapshot(() => {
                loadOpenBets();
                loadHistory();
            });
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.style.borderLeftColor = type === 'success' ? 'var(--success)' : type === 'error' ? 'var(--danger)' : 'var(--primary)';
            toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-triangle' : 'fa-info-circle'}"></i> ${message}`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // Event Listeners
        document.getElementById('placeBetBtn').addEventListener('click', placeBet);
        document.getElementById('clearSlip').addEventListener('click', () => {
            selectedBets = [];
            updateBetSlip();
        });
        document.getElementById('stakeAmount').addEventListener('input', updateBetSlip);
        
        document.querySelectorAll('.bet-type-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.bet-type-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                betType = btn.dataset.type;
                selectedBets = [];
                updateBetSlip();
            });
        });
        
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(f => f.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                displayMatches();
            });
        });

        // Auto refresh every 30 seconds
        setInterval(() => {
            if (currentUser) {
                fetchRealMatches();
            }
        }, 30000);
    </script>
</body>
</html>
