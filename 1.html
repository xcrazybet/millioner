<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>BetMaster Pro - Sports Betting Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            color: #fff;
            min-height: 100vh;
        }

        /* Header */
        .header {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .balance-card {
            background: rgba(0, 0, 0, 0.5);
            padding: 0.5rem 1.5rem;
            border-radius: 50px;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        .balance-label {
            font-size: 0.8rem;
            color: #ffd700;
        }

        .balance-amount {
            font-size: 1.5rem;
            font-weight: bold;
            margin-left: 0.5rem;
        }

        /* Navigation */
        .nav-tabs {
            max-width: 1400px;
            margin: 1rem auto 0;
            padding: 0 2rem;
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .nav-tab {
            padding: 0.75rem 1.5rem;
            background: rgba(255, 255, 255, 0.05);
            border: none;
            color: #fff;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.3s;
            font-size: 1rem;
        }

        .nav-tab.active {
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            color: #1a1f3a;
            font-weight: bold;
        }

        .nav-tab:hover:not(.active) {
            background: rgba(255, 255, 255, 0.1);
        }

        /* Main Content */
        .container {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        /* Live Indicator */
        .live-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .live-dot {
            width: 12px;
            height: 12px;
            background: #ff0000;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }

        /* Matches Grid */
        .matches-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
        }

        .match-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 1.5rem;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .match-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border-color: rgba(255, 215, 0, 0.3);
        }

        .league-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.8rem;
            color: #ffd700;
        }

        .teams {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 1rem 0;
        }

        .team {
            text-align: center;
            flex: 1;
        }

        .team-name {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .team-odds {
            font-size: 1.3rem;
            font-weight: bold;
            color: #ffd700;
            background: rgba(0, 0, 0, 0.3);
            padding: 0.25rem 0.5rem;
            border-radius: 8px;
            display: inline-block;
        }

        .vs {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.5);
            margin: 0 0.5rem;
        }

        .score {
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            margin: 0.5rem 0;
            color: #ffd700;
        }

        .match-time {
            text-align: center;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 0.5rem;
        }

        .bet-buttons {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .bet-btn {
            flex: 1;
            padding: 0.6rem;
            background: rgba(255, 215, 0, 0.15);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 8px;
            color: #ffd700;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
        }

        .bet-btn:hover {
            background: rgba(255, 215, 0, 0.3);
        }

        /* Bet Slip */
        .betslip {
            position: fixed;
            right: 0;
            top: 0;
            width: 350px;
            height: 100vh;
            background: #0f132e;
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            transform: translateX(100%);
            transition: transform 0.3s;
            z-index: 200;
            display: flex;
            flex-direction: column;
        }

        .betslip.open {
            transform: translateX(0);
        }

        .betslip-header {
            padding: 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .betslip-items {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
        }

        .bet-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 0.75rem;
            margin-bottom: 0.75rem;
        }

        .betslip-footer {
            padding: 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .place-bet-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            border: none;
            border-radius: 10px;
            color: #1a1f3a;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .place-bet-btn:hover {
            transform: scale(1.02);
        }

        .toggle-betslip {
            position: fixed;
            right: 20px;
            bottom: 20px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 201;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            font-size: 1.5rem;
            font-weight: bold;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 3rem;
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.6);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                text-align: center;
            }
            .matches-grid {
                grid-template-columns: 1fr;
            }
            .betslip {
                width: 100%;
            }
            .container {
                padding: 0 1rem;
            }
            .nav-tabs {
                padding: 0 1rem;
            }
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            color: #ffd700;
            padding: 0.75rem 1.5rem;
            border-radius: 50px;
            z-index: 300;
            animation: fadeOut 2s forwards;
        }

        @keyframes fadeOut {
            0%, 70% { opacity: 1; }
            100% { opacity: 0; visibility: hidden; }
        }

        .empty-betslip {
            text-align: center;
            padding: 2rem;
            color: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <div class="logo">⚽ BetMaster Pro</div>
            <div class="balance-card">
                <span class="balance-label">BALANCE</span>
                <span class="balance-amount" id="userBalance">$1,000.00</span>
            </div>
        </div>
    </div>

    <div class="nav-tabs">
        <button class="nav-tab active" data-tab="live">🔥 LIVE NOW</button>
        <button class="nav-tab" data-tab="upcoming">📅 UPCOMING</button>
        <button class="nav-tab" data-tab="trending">📈 TRENDING</button>
    </div>

    <div class="container">
        <div class="live-indicator">
            <div class="live-dot"></div>
            <span>Live Updates Every 7 Seconds</span>
        </div>
        <div id="matchesContainer">
            <div class="loading">Loading matches...</div>
        </div>
    </div>

    <div class="toggle-betslip" id="toggleBetslip">🎲</div>

    <div class="betslip" id="betslip">
        <div class="betslip-header">
            <h3>Bet Slip</h3>
            <button class="bet-btn" id="closeBetslip" style="background: none; border: none; font-size: 1.2rem;">✕</button>
        </div>
        <div class="betslip-items" id="betslipItems">
            <div class="empty-betslip">No selections yet.<br>Click on odds to add bets.</div>
        </div>
        <div class="betslip-footer">
            <div style="margin-bottom: 1rem; display: flex; justify-content: space-between;">
                <span>Total Stake:</span>
                <span id="totalStake">$0.00</span>
            </div>
            <div style="margin-bottom: 1rem; display: flex; justify-content: space-between;">
                <span>Potential Win:</span>
                <span id="potentialWin">$0.00</span>
            </div>
            <button class="place-bet-btn" id="placeBetBtn">PLACE BET</button>
        </div>
    </div>

    <script>
        // ============================================
        // DEMO DATA - Replace with your Sportmonks API
        // After regenerating your token, uncomment the
        // fetch calls and remove this mock data
        // ============================================
        
        // Mock data for demonstration
        const MOCK_MATCHES = {
            live: [
                { id: 1, league: "UEFA Champions League", homeTeam: "Real Madrid", awayTeam: "Bayern Munich", homeScore: 2, awayScore: 1, minute: "67'", odds: { home: 2.10, draw: 3.40, away: 3.80 }, status: "live" },
                { id: 2, league: "English Premier League", homeTeam: "Manchester City", awayTeam: "Arsenal", homeScore: 1, awayScore: 1, minute: "52'", odds: { home: 1.95, draw: 3.60, away: 4.20 }, status: "live" },
                { id: 3, league: "Serie A", homeTeam: "Inter Milan", awayTeam: "Juventus", homeScore: 0, awayScore: 0, minute: "23'", odds: { home: 2.30, draw: 3.20, away: 3.40 }, status: "live" },
                { id: 4, league: "La Liga", homeTeam: "Barcelona", awayTeam: "Atletico Madrid", homeScore: 1, awayScore: 0, minute: "41'", odds: { home: 1.85, draw: 3.50, away: 4.50 }, status: "live" },
            ],
            upcoming: [
                { id: 5, league: "UEFA Champions League", homeTeam: "PSG", awayTeam: "Dortmund", startingAt: "2024-03-20 20:00", odds: { home: 1.75, draw: 3.80, away: 4.50 }, status: "upcoming" },
                { id: 6, league: "English Premier League", homeTeam: "Liverpool", awayTeam: "Chelsea", startingAt: "2024-03-21 17:30", odds: { home: 1.90, draw: 3.60, away: 4.00 }, status: "upcoming" },
                { id: 7, league: "Bundesliga", homeTeam: "Bayern Munich", awayTeam: "Leverkusen", startingAt: "2024-03-21 15:30", odds: { home: 1.60, draw: 4.20, away: 5.50 }, status: "upcoming" },
            ],
            trending: [
                { id: 8, league: "World Cup Qualifier", homeTeam: "Brazil", awayTeam: "Argentina", odds: { home: 2.20, draw: 3.10, away: 3.60 }, status: "trending" },
                { id: 9, league: "Euro 2024", homeTeam: "England", awayTeam: "France", odds: { home: 2.60, draw: 3.00, away: 2.90 }, status: "trending" },
            ]
        };

        // Bet slip state
        let betSlip = [];
        let userBalance = 1000.00;
        let currentTab = 'live';

        // Helper function to show toast
        function showToast(message, isError = false) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.style.background = isError ? 'rgba(255, 0, 0, 0.9)' : 'rgba(0, 0, 0, 0.9)';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }

        // Update UI balance display
        function updateBalanceDisplay() {
            document.getElementById('userBalance').textContent = `$${userBalance.toFixed(2)}`;
        }

        // Update bet slip UI
        function updateBetSlip() {
            const container = document.getElementById('betslipItems');
            const totalStakeSpan = document.getElementById('totalStake');
            const potentialWinSpan = document.getElementById('potentialWin');

            if (betSlip.length === 0) {
                container.innerHTML = '<div class="empty-betslip">No selections yet.<br>Click on odds to add bets.</div>';
                totalStakeSpan.textContent = '$0.00';
                potentialWinSpan.textContent = '$0.00';
                return;
            }

            let totalStake = 0;
            let totalPotential = 0;

            container.innerHTML = betSlip.map((bet, index) => {
                const stake = bet.stake || 0;
                const potential = stake * bet.odds;
                totalStake += stake;
                totalPotential += potential;

                return `
                    <div class="bet-item">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                            <strong>${bet.homeTeam} vs ${bet.awayTeam}</strong>
                            <button onclick="removeBet(${index})" style="background: none; border: none; color: #ff4444; cursor: pointer;">✕</button>
                        </div>
                        <div style="font-size: 0.85rem; color: #ffd700;">${bet.betType} @ ${bet.odds}</div>
                        <div style="margin-top: 0.5rem;">
                            <label style="font-size: 0.8rem;">Stake: $</label>
                            <input type="number" id="stake_${index}" value="${stake}" step="5" min="1" max="${userBalance}" style="width: 100px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,215,0,0.3); border-radius: 5px; padding: 0.25rem 0.5rem; color: white;" onchange="updateStake(${index}, this.value)">
                            <span style="float: right;">Potential: $${potential.toFixed(2)}</span>
                        </div>
                    </div>
                `;
            }).join('');

            totalStakeSpan.textContent = `$${totalStake.toFixed(2)}`;
            potentialWinSpan.textContent = `$${totalPotential.toFixed(2)}`;
        }

        // Remove bet from slip
        window.removeBet = function(index) {
            betSlip.splice(index, 1);
            updateBetSlip();
            showToast('Bet removed from slip');
        };

        // Update stake amount
        window.updateStake = function(index, value) {
            const stake = parseFloat(value);
            if (isNaN(stake) || stake < 1) {
                betSlip[index].stake = 0;
            } else if (stake > userBalance) {
                showToast('Insufficient balance!', true);
                betSlip[index].stake = userBalance;
            } else {
                betSlip[index].stake = stake;
            }
            updateBetSlip();
        };

        // Add bet to slip
        function addToSlip(match, betType, odds) {
            const existingIndex = betSlip.findIndex(b => b.matchId === match.id && b.betType === betType);
            if (existingIndex !== -1) {
                showToast('This bet is already in your slip!', true);
                return;
            }

            betSlip.push({
                matchId: match.id,
                homeTeam: match.homeTeam,
                awayTeam: match.awayTeam,
                betType: betType,
                odds: odds,
                stake: 10
            });

            updateBetSlip();
            showToast(`Added ${betType} on ${match.homeTeam} vs ${match.awayTeam} @ ${odds}`);
            
            // Open bet slip automatically when adding first bet
            if (betSlip.length === 1) {
                document.getElementById('betslip').classList.add('open');
            }
        }

        // Place bets
        function placeBets() {
            if (betSlip.length === 0) {
                showToast('Your bet slip is empty!', true);
                return;
            }

            let totalStake = 0;
            for (const bet of betSlip) {
                totalStake += bet.stake || 0;
            }

            if (totalStake > userBalance) {
                showToast('Insufficient balance! Please reduce your stakes.', true);
                return;
            }

            if (totalStake === 0) {
                showToast('Please enter stake amounts for your bets.', true);
                return;
            }

            userBalance -= totalStake;
            updateBalanceDisplay();
            
            let totalPotential = 0;
            for (const bet of betSlip) {
                totalPotential += (bet.stake || 0) * bet.odds;
            }

            showToast(`Bets placed! Total stake: $${totalStake.toFixed(2)} | Potential win: $${totalPotential.toFixed(2)}`);
            
            // Clear bet slip
            betSlip = [];
            updateBetSlip();
            
            // Close bet slip
            document.getElementById('betslip').classList.remove('open');
        }

        // Render matches
        function renderMatches(tab) {
            const container = document.getElementById('matchesContainer');
            let matches = [];
            
            if (tab === 'live') matches = MOCK_MATCHES.live;
            else if (tab === 'upcoming') matches = MOCK_MATCHES.upcoming;
            else matches = MOCK_MATCHES.trending;

            if (matches.length === 0) {
                container.innerHTML = '<div class="loading">No matches available</div>';
                return;
            }

            container.innerHTML = `
                <div class="matches-grid">
                    ${matches.map(match => `
                        <div class="match-card">
                            <div class="league-info">
                                <span>${match.league}</span>
                                ${match.status === 'live' ? '<span style="color: #ff0000;">● LIVE ' + (match.minute || '') + '</span>' : '<span>' + (match.startingAt || 'Upcoming') + '</span>'}
                            </div>
                            <div class="teams">
                                <div class="team">
                                    <div class="team-name">${match.homeTeam}</div>
                                    <div class="team-odds" onclick="addToSlip(${JSON.stringify(match).replace(/"/g, '&quot;')}, '1', ${match.odds.home})">${match.odds.home}</div>
                                </div>
                                <div class="vs">VS</div>
                                <div class="team">
                                    <div class="team-name">${match.awayTeam}</div>
                                    <div class="team-odds" onclick="addToSlip(${JSON.stringify(match).replace(/"/g, '&quot;')}, '2', ${match.odds.away})">${match.odds.away}</div>
                                </div>
                            </div>
                            ${match.homeScore !== undefined ? `
                                <div class="score">${match.homeScore} - ${match.awayScore}</div>
                            ` : ''}
                            <div class="bet-buttons">
                                <button class="bet-btn" onclick="addToSlip(${JSON.stringify(match).replace(/"/g, '&quot;')}, '1X2: Draw', ${match.odds.draw})">Draw @ ${match.odds.draw}</button>
                                <button class="bet-btn" onclick="addToSlip(${JSON.stringify(match).replace(/"/g, '&quot;')}, 'Over 2.5', 1.95)">Over 2.5 @ 1.95</button>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        // Fetch real data from Sportmonks API (commented - replace with your new token)
        async function fetchLiveMatches() {
            // UNCOMMENT AND REPLACE WITH YOUR NEW TOKEN AFTER REGENERATING
            /*
            const API_TOKEN = 'YOUR_NEW_TOKEN_HERE';
            const API_URL = `https://api.sportmonks.com/v3/football/livescores/inplay?api_token=${API_TOKEN}&include=participants;scores`;
            
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                console.log('Live matches:', data);
                // Process and render data here
            } catch (error) {
                console.error('API Error:', error);
            }
            */
            
            // Using mock data for demo
            renderMatches(currentTab);
        }

        // Poll for live updates (every 7 seconds as recommended)
        function startPolling() {
            setInterval(() => {
                if (currentTab === 'live') {
                    fetchLiveMatches();
                    showToast('Live scores updated', false);
                }
            }, 7000);
        }

        // Event listeners
        document.querySelectorAll('.nav-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentTab = tab.dataset.tab;
                renderMatches(currentTab);
            });
        });

        document.getElementById('toggleBetslip').addEventListener('click', () => {
            document.getElementById('betslip').classList.toggle('open');
        });

        document.getElementById('closeBetslip').addEventListener('click', () => {
            document.getElementById('betslip').classList.remove('open');
        });

        document.getElementById('placeBetBtn').addEventListener('click', placeBets);

        // Initialize
        fetchLiveMatches();
        startPolling();
        updateBalanceDisplay();

        // Simulate occasional score updates (for demo)
        setInterval(() => {
            if (currentTab === 'live') {
                MOCK_MATCHES.live[0].homeScore = Math.floor(Math.random() * 4);
                MOCK_MATCHES.live[0].awayScore = Math.floor(Math.random() * 3);
                renderMatches(currentTab);
            }
        }, 15000);

        console.log('Betting platform initialized - DEMO MODE');
        console.log('⚠️ Replace API token and add real endpoints for production');
    </script>
</body>
</html>
