        { id:"scratchcards", name:"Scratch Cards", url:"https://xcrazybet.github.io/millioner/ScratchCards.html", category:"sports", icon:"fa-qrcode", desc:"Digital scratch", players:1950, minBet:1, featured:false, new:false },

        { id:"fateengine", name:"Fate Engine", url:"https://xcrazybet.github.io/millioner/FATEENGINE.html", category:"premium", icon:"fa-cogs", desc:"Destiny game", players:190, minBet:50, featured:true, new:true },
        { id:"lastcrown", name:"Last Crown", url:"https://xcrazybet.github.io/millioner/LASTCROWN.html", category:"premium", icon:"fa-crown", desc:"Royal challenge", players:150, minBet:100, featured:false, new:true },
        { id:"doubleornothing", name:"Double or Nothing", url:"https://xcrazybet.github.io/millioner/DOUBLEORNOTHING.html", category:"premium", icon:"fa-exchange-alt", desc:"All or nothing", players:450, minBet:20, featured:true, new:false },
        { id:"knockoutnight", name:"Knockout Night", url:"https://xcrazybet.github.io/millioner/KnockoutNight.html", category:"premium", icon:"fa-fist-raised", desc:"Fight betting", players:320, minBet:15, featured:false, new:true },
        { id:"luck-skills", name:"Luck & Skills", url:"https://xcrazybet.github.io/millioner/luck.skills.html", category:"premium", icon:"fa-brain", desc:"Test both", players:560, minBet:10, featured:true, new:false },
        { id:"ringtoss", name:"Ring Toss", url:"https://xcrazybet.github.io/millioner/RingToss.html", category:"arcade", icon:"fa-life-ring", desc:"Toss rings", players:320, minBet:2, featured:false, new:false },
        { id:"dealerchoice", name:"Dealer Choice", url:"https://xcrazybet.github.io/millioner/DealerChoice.html", category:"cards", icon:"fa-random", desc:"Dealer picks", players:320, minBet:5, featured:false, new:true },
        { id:"secretpick", name:"Secret Pick", url:"https://xcrazybet.github.io/millioner/SECRETPICK.html", category:"lottery", icon:"fa-user-secret", desc:"Mystery box", players:580, minBet:2, featured:false, new:true },
        { id:"lastmanstanding", name:"Last Man Standing", url:"https://xcrazybet.github.io/millioner/LASTMANSTANDING.html", category:"lottery", icon:"fa-user-shield", desc:"Last wins", players:890, minBet:10, featured:true, new:false },
        { id:"luckyhand", name:"Lucky Hand", url:"https://xcrazybet.github.io/millioner/LUCKYHAND.html", category:"cards", icon:"fa-hand-paper", desc:"Draw hand", players:540, minBet:3, featured:false, new:false },
        // NEW GAME: Gates of Olympus
        { id:"gatesofolympus", name:"Gates of Olympus", url:"https://xcrazybet.github.io/millioner/GatesofOlympus.html", category:"premium", icon:"fa-bolt", desc:"Zeus thunder wins", players:2100, minBet:5, featured:true, new:true }
    ];
    
    state.gamesList = [...gamesData];
    
    function renderGames() {
        let filtered = state.gamesList.filter(g => (state.currentCategory==='all' || g.category===state.currentCategory) && (g.name.toLowerCase().includes(state.searchQuery) || g.desc.toLowerCase().includes(state.searchQuery)));
        document.getElementById('gameCount').innerText = filtered.length;
        const grid = document.getElementById('gamesGrid');
        if(filtered.length===0){ grid.style.display='none'; document.getElementById('noGames').style.display='block'; return; }
        grid.style.display='grid'; document.getElementById('noGames').style.display='none';
        grid.innerHTML = filtered.map(game => `<div class="game-card" style="--game-category:${getCategoryColor(game.category)}" data-game='${JSON.stringify(game)}'>
            <div class="game-image"><i class="fas ${game.icon} game-icon"></i>${game.new ? '<div class="game-badge">NEW</div>' : ''}</div>
            <div class="game-info"><div class="game-title"><span>${game.name}</span><span class="game-category">${game.category.toUpperCase()}</span></div>
            <div class="game-description">${game.desc}</div><div class="game-stats"><span><i class="fas fa-users"></i> ${formatNumber(game.players)}</span><span><i class="fas fa-coins"></i> $${game.minBet}</span></div>
            <button class="play-btn" data-id="${game.id}"><i class="fas fa-play"></i> PLAY</button></div>
            <button class="fav-btn ${state.favoriteGames.has(game.id) ? 'active' : ''}" data-id="${game.id}"><i class="fas ${state.favoriteGames.has(game.id) ? 'fa-heart' : 'fa-heart'}"></i></button>
        </div>`).join('');
        attachGameEvents();
    }
    
    function attachGameEvents() {
        document.querySelectorAll('.play-btn').forEach(btn => btn.addEventListener('click', (e) => { e.stopPropagation(); const id = btn.dataset.id; const game = state.gamesList.find(g=>g.id===id); if(game) playWaterSound(); setTimeout(()=> window.location.href=game.url,100); }));
        document.querySelectorAll('.fav-btn').forEach(btn => btn.addEventListener('click', async (e) => { e.stopPropagation(); const id = btn.dataset.id; toggleFavorite(id); }));
    }
    
    async function toggleFavorite(id) { if(!state.currentUser) return alert('Login to save favorites'); if(state.favoriteGames.has(id)) state.favoriteGames.delete(id); else state.favoriteGames.add(id); updateFavoriteUI(); await db.collection("favorites").doc(state.currentUser.uid).set({ games: Array.from(state.favoriteGames), updatedAt: new Date() }); renderGames(); }
    function updateFavoriteUI(){}
    function getCategoryColor(cat){ return {casino:'#e91e63',lottery:'#9c27b0',arcade:'#2196f3',cards:'#4caf50',mystery:'#ff9800',premium:'#ff5722',sports:'#00bcd4'}[cat]||'#00ff9d';}
    function formatNumber(n){ return n>=1000 ? (n/1000).toFixed(1)+'k' : n; }
    function playWaterSound(){ if(state.soundEnabled) document.getElementById('waterSound').play().catch(e=>{}); }
    
    function renderFeatured(){
        const featured = state.gamesList.filter(g=>g.featured).slice(0,6);
        document.getElementById('carouselContainer').innerHTML = featured.map(g=>`<div class="featured-game"><div class="game-image"><i class="fas ${g.icon} game-icon" style="font-size:56px"></i><div class="game-badge">FEATURED</div></div><div class="game-info"><div class="game-title">${g.name}</div><button class="play-btn" data-id="${g.id}"><i class="fas fa-play"></i> PLAY NOW</button></div></div>`).join('');
        document.querySelectorAll('#carouselContainer .play-btn').forEach(btn=>btn.addEventListener('click',(e)=>{e.stopPropagation(); const g=state.gamesList.find(g=>g.id===btn.dataset.id); if(g){playWaterSound(); window.location.href=g.url;}}));
    }
    
    function initCategories(){
        const cats = ['all','casino','lottery','arcade','cards','mystery','premium','sports'];
        const bar=document.getElementById('categoriesBar');
        bar.innerHTML=cats.map(c=>`<button class="category-btn ${c==='all'?'active':''}" data-cat="${c}"><i class="fas ${c==='all'?'fa-globe':c==='casino'?'fa-dice':'fa-gamepad'}"></i> ${c.toUpperCase()}</button>`).join('');
        document.querySelectorAll('.category-btn').forEach(btn=>btn.addEventListener('click',()=>{state.currentCategory=btn.dataset.cat; document.querySelectorAll('.category-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); renderGames();}));
    }
    
    function initTopPlayers(){
        const players=[{name:"ShadowWolf",wins:1250,rank:1},{name:"LuckyStar",wins:980,rank:2},{name:"GoldenHand",wins:890,rank:3},{name:"CryptoKing",wins:780,rank:4},{name:"BetMaster",wins:650,rank:5}];
        const container=document.getElementById('tickerContainer');
        container.innerHTML = players.concat(players).map(p=>`<div class="ticker-item"><div class="player-rank rank-${p.rank}">${p.rank}</div><div class="player-name">${p.name}</div><div class="player-wins"><i class="fas fa-trophy"></i> ${p.wins} wins</div></div>`).join('');
    }
    
    function initInfoPanel(){
        const tabs=['winners','popular','stats'];
        document.getElementById('infoTabs').innerHTML=tabs.map(t=>`<button class="info-tab ${t==='winners'?'active':''}" data-tab="${t}">${t==='winners'?'🏆 Winners':t==='popular'?'🔥 Popular':'📊 Stats'}</button>`).join('');
        document.getElementById('infoContent').innerHTML=`<div id="winnersTab" class="info-section"><div class="section-title"><i class="fas fa-trophy"></i> Recent Wins</div><div id="winnersList"></div></div><div id="popularTab" style="display:none" class="info-section"><div class="section-title">🔥 Trending</div><div id="popularList"></div></div><div id="statsTab" style="display:none" class="info-section"><div class="section-title">📊 Stats</div><div id="statsList"></div></div>`;
        document.querySelectorAll('.info-tab').forEach(t=>t.addEventListener('click',()=>{document.querySelectorAll('.info-tab').forEach(tt=>tt.classList.remove('active')); t.classList.add('active'); const tab=t.dataset.tab; document.querySelectorAll('.info-section').forEach(s=>s.style.display='none'); document.getElementById(`${tab}Tab`).style.display='block'; if(tab==='popular')updatePopular(); if(tab==='stats')updateStats(); }));
        updateWinners(); updatePopular(); updateStats();
    }
    function updateWinners(){ const wins=[{name:"LuckyStar",amt:12500,game:"Gates of Olympus"},{name:"ShadowWolf",amt:8900,game:"Blackjack"}]; document.getElementById('winnersList').innerHTML=wins.map(w=>`<div class="winner-item"><div><div class="winner-name">${w.name}</div><div>${w.game}</div></div><div class="winner-amount">$${w.amt}</div></div>`).join('');}
    function updatePopular(){ const top=state.gamesList.sort((a,b)=>b.players-a.players).slice(0,4); document.getElementById('popularList').innerHTML=top.map(g=>`<div class="game-stat-item"><span>${g.name}</span><span>${formatNumber(g.players)}</span></div>`).join('');}
    function updateStats(){ document.getElementById('statsList').innerHTML=`<div class="game-stat-item"><span>Total Games</span><span>44</span></div><div class="game-stat-item"><span>Active Players</span><span>12.8k</span></div><div class="game-stat-item"><span>Daily Jackpot</span><span>$312k</span></div>`; }
    
    function setupAuth(){ auth.onAuthStateChanged(async u=>{ if(u){ state.currentUser=u; document.getElementById('userAvatar').innerText=u.displayName?u.displayName[0]:u.email[0]; document.getElementById('userName').innerText=u.displayName||u.email.split('@')[0]; const doc=await db.collection("wallets").doc(u.uid).get(); state.balance=doc.exists?doc.data().balance||0:0; document.getElementById('balance-val').innerText=state.balance.toFixed(2); const favDoc=await db.collection("favorites").doc(u.uid).get(); if(favDoc.exists) state.favoriteGames=new Set(favDoc.data().games||[]); renderGames(); } else { state.currentUser=null; document.getElementById('userAvatar').innerText='G'; document.getElementById('userName').innerText='Guest'; renderGames(); } });}
    
    function setupEventListeners(){
        document.getElementById('searchBox').addEventListener('input',e=>{state.searchQuery=e.target.value.toLowerCase(); renderGames();});
        document.getElementById('searchBtn').addEventListener('click',()=>{state.searchQuery=document.getElementById('searchBox').value.toLowerCase(); renderGames();});
        document.getElementById('mobileMenuBtn').onclick=()=>document.getElementById('mobileMenuOverlay').classList.add('show');
        document.getElementById('mobileMenuClose').onclick=()=>document.getElementById('mobileMenuOverlay').classList.remove('show');
        document.getElementById('soundIndicator').onclick=()=>{state.soundEnabled=!state.soundEnabled; const ic=document.querySelector('#soundIndicator i'); ic.className=state.soundEnabled?'fas fa-volume-up':'fas fa-volume-mute';};
    }
    
    renderGames(); renderFeatured(); initCategories(); initTopPlayers(); initInfoPanel(); setupAuth(); setupEventListeners();
</script>
</body>
</html>
