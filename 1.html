<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>X London | Live Sports Betting</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0A0C12;
            color: #E8EDF5;
            overflow-x: hidden;
        }

        /* Modern Dark Theme */
        :root {
            --bg-primary: #0A0C12;
            --bg-card: #141824;
            --border: #252A36;
            --primary: #2D7AFF;
            --primary-dark: #1A5CD8;
            --accent: #FF3B6F;
            --success: #00D26A;
            --danger: #FF4757;
            --text-muted: #8E94A3;
        }

        /* Layout */
        .app-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Header */
        .header {
            background: #0F1117;
            border-bottom: 1px solid var(--border);
            padding: 14px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-text {
            font-size: 1.4rem;
            font-weight: 800;
            background: linear-gradient(135deg, #FFF, var(--primary));
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .balance-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 6px 20px;
            text-align: right;
            border: 1px solid var(--border);
        }

        .balance-amount {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--primary);
        }

        .user-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 40px;
            padding: 8px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        /* Filters */
        .filter-tabs {
            display: flex;
            gap: 12px;
            margin: 24px 0;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 10px 28px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-muted);
        }

        .filter-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        /* Match Cards */
        .matches-grid {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .match-card {
            background: var(--bg-card);
            border-radius: 24px;
            border: 1px solid var(--border);
            overflow: hidden;
            transition: all 0.2s;
        }

        .match-card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .match-header {
            padding: 14px 20px;
            background: rgba(0,0,0,0.2);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .league-name {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: 0.5px;
        }

        .live-badge {
            background: var(--danger);
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.65rem;
            font-weight: 700;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .match-body {
            padding: 20px;
        }

        .teams-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .team {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .team-away {
            justify-content: flex-end;
        }

        .team-logo {
            width: 52px;
            height: 52px;
            background: #1E2432;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            border: 2px solid var(--border);
        }

        .team-name {
            font-weight: 700;
            font-size: 1rem;
        }

        .score-box {
            text-align: center;
            min-width: 100px;
        }

        .score {
            font-size: 2rem;
            font-weight: 800;
        }

        .match-time {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Odds */
        .odds-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        .odds-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 12px;
        }

        .odds-btn {
            background: #1E2432;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.15s;
        }

        .odds-btn:hover {
            background: var(--primary);
            border-color: var(--primary);
            transform: scale(1.02);
        }

        .double-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        /* Right Sidebar - Bet Slip */
        .right-sidebar {
            position: fixed;
            right: 0;
            top: 0;
            bottom: 0;
            width: 340px;
            background: #0F1117;
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 50;
            overflow-y: auto;
        }

        .bet-slip-header {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            padding: 20px;
        }

        .bet-slip-title {
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .bet-items {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
        }

        .bet-item {
            background: var(--bg-card);
            border-radius: 14px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border);
        }

        .remove-bet {
            color: var(--danger);
            cursor: pointer;
        }

        .bet-summary {
            padding: 16px;
            border-top: 1px solid var(--border);
        }

        .stake-input {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px;
            width: 120px;
            text-align: right;
            color: white;
        }

        .place-bet-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--success), #00A856);
            border: none;
            padding: 14px;
            border-radius: 40px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 16px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            padding: 16px;
            border-top: 1px solid var(--border);
        }

        .stat-card {
            background: var(--bg-card);
            border-radius: 14px;
            padding: 12px;
            text-align: center;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .right-sidebar {
                position: relative;
                width: 100%;
                margin-top: 24px;
                border-left: none;
                border-top: 1px solid var(--border);
            }
            .main-area {
                margin-right: 0;
            }
        }

        @media (max-width: 768px) {
            .team-logo {
                width: 38px;
                height: 38px;
            }
            .team-name {
                font-size: 0.8rem;
            }
            .score {
                font-size: 1.3rem;
            }
        }

        .toast-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 200;
        }
        .toast {
            background: var(--bg-card);
            border-left: 4px solid var(--primary);
            border-radius: 12px;
            padding: 12px 20px;
            margin-bottom: 8px;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <!-- Age Modal (simplified) -->
    <div id="ageModal" style="position:fixed; inset:0; background:rgba(0,0,0,0.95); z-index:1000; display:flex; align-items:center; justify-content:center;">
        <div style="background:#141824; border-radius:24px; padding:32px; max-width:400px; text-align:center;">
            <h2 style="margin-bottom:12px;">Age Verification</h2>
            <p style="margin-bottom:24px;">You must be 18+ to continue.</p>
            <button onclick="confirmAge()" style="background:#2D7AFF; border:none; padding:12px 24px; border-radius:40px; font-weight:600; cursor:pointer;">I am 18+</button>
        </div>
    </div>

    <!-- Header -->
    <header class="header">
        <div class="app-container">
            <div class="header-content">
                <div class="logo">
                    <div class="logo-icon"><i class="fas fa-crown"></i></div>
                    <span class="logo-text">X LONDON</span>
                </div>
                <div style="display:flex; align-items:center; gap:15px;">
                    <div class="balance-card">
                        <div style="font-size:0.7rem; color:var(--text-muted);">BALANCE</div>
                        <div class="balance-amount" id="userBalance">$0.00</div>
                    </div>
                    <div class="user-btn" onclick="toggleUserMenu()">
                        <i class="fas fa-user-circle"></i> <span id="userDisplayName">User</span>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Layout -->
    <div style="display: flex; min-height: calc(100vh - 80px);">
        <!-- Left Content -->
        <div class="main-area" style="flex: 1; padding: 24px 20px 24px 24px; overflow-y: auto;">
            <div class="filter-tabs">
                <button class="filter-btn active" id="liveBtn" onclick="loadLiveMatches()">LIVE</button>
                <button class="filter-btn" id="upcomingBtn" onclick="loadUpcomingMatches()">UPCOMING</button>
                <button class="filter-btn" id="finishedBtn" onclick="loadFinishedMatches()">FINISHED</button>
                <button class="filter-btn" onclick="refreshData()"><i class="fas fa-sync-alt"></i> Refresh</button>
            </div>
            <div id="matchesContainer" class="matches-grid">
                <div class="empty-state"><i class="fas fa-spinner fa-spin"></i> Loading real matches...</div>
            </div>
        </div>

        <!-- Right Bet Slip -->
        <div class="right-sidebar">
            <div class="bet-slip-header">
                <div class="bet-slip-title"><i class="fas fa-receipt"></i> BET SLIP <span id="betCount" style="background:rgba(255,255,255,0.2); padding:2px 10px; border-radius:30px; margin-left:8px;">0</span></div>
            </div>
            <div class="bet-items" id="betSlipItems">
                <div style="text-align:center; padding:40px; color:var(--text-muted);"><i class="fas fa-plus-circle" style="font-size:40px; margin-bottom:12px;"></i><p>Tap odds to add</p></div>
            </div>
            <div id="betSummaryPanel" style="display:none;">
                <div class="bet-summary">
                    <div style="display:flex; justify-content:space-between; margin-bottom:12px;"><span>Total Odds</span><span id="totalOdds" style="font-weight:800;">-</span></div>
                    <div style="display:flex; justify-content:space-between; margin-bottom:12px;"><span>Stake</span><input type="number" id="stakeAmount" min="1" step="0.01" value="10.00" class="stake-input"></div>
                    <div style="background:rgba(0,210,106,0.1); border-radius:12px; padding:12px; display:flex; justify-content:space-between;"><span>Potential Win</span><span id="potentialWin" style="color:var(--success); font-weight:800;">$0.00</span></div>
                    <button class="place-bet-btn" id="placeBetBtn" onclick="placeBet()">PLACE BET</button>
                </div>
            </div>
            <div class="stats-grid">
                <div class="stat-card"><div class="stat-value" id="statTotalBets">0</div><div style="font-size:0.65rem;">Total Bets</div></div>
                <div class="stat-card"><div class="stat-value" id="statWinRate">0%</div><div style="font-size:0.65rem;">Win Rate</div></div>
                <div class="stat-card"><div class="stat-value" id="statProfitLoss">$0</div><div style="font-size:0.65rem;">Profit/Loss</div></div>
                <div class="stat-card"><div class="stat-value" id="statOpenBets">0</div><div style="font-size:0.65rem;">Open Bets</div></div>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        // Firebase Config (your original)
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };
        const API_TOKEN = 'DkFdWG9jFZvH8XSEgLrRfGwczABWVg5rlV25GvIRyN06zdPsOI48Nsv9Wooy';
        let auth, db, currentUser = null, userData = null, bettingSlip = [], currentMatchType = 'live';

        firebase.initializeApp(firebaseConfig);
        auth = firebase.auth();
        db = firebase.firestore();

        // Age verification
        function confirmAge() {
            localStorage.setItem('ageVerified', 'true');
            document.getElementById('ageModal').style.display = 'none';
            initializeApp();
        }
        if (!localStorage.getItem('ageVerified')) {
            document.getElementById('ageModal').style.display = 'flex';
        } else {
            document.getElementById('ageModal').style.display = 'none';
            initializeApp();
        }

        async function initializeApp() {
            auth.onAuthStateChanged(async (user) => {
                if (!user) { window.location.href = 'login.html'; return; }
                currentUser = user;
                await loadUserData();
                updateUI();
                loadLiveMatches();
                setInterval(() => { if(currentUser) loadUserStats(); }, 8000);
                setInterval(() => { if(currentUser) loadOpenBetsCount(); }, 5000);
            });
        }

        async function loadUserData() {
            try {
                const doc = await db.collection('wallets').doc(currentUser.uid).get();
                if (doc.exists) { userData = doc.data(); updateBalance(); loadUserStats(); }
            } catch(e) { console.error(e); }
        }

        function updateUI() {
            document.getElementById('userDisplayName').innerText = userData?.username || currentUser.email.split('@')[0];
            updateBalance();
        }
        function updateBalance() { document.getElementById('userBalance').innerText = `$${(userData?.balance || 0).toFixed(2)}`; }
        function showToast(msg, type='success') {
            let container = document.getElementById('toastContainer');
            let toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<i class="fas ${type==='success'?'fa-check-circle':'fa-exclamation-circle'}" style="margin-right:8px;"></i> ${msg}`;
            container.appendChild(toast);
            setTimeout(()=>toast.remove(), 3000);
        }

        // ================= ORIGINAL API FUNCTIONS (restored) =================
        async function tryDirectFetch() {
            try {
                const res = await fetch(`https://api.sportmonks.com/v3/football/livescores?api_token=${API_TOKEN}&include=state;participants;league;scores&per_page=10`, {mode:'cors'});
                if(res.ok) return await res.json();
            } catch(e) {}
            return null;
        }
        async function tryPublicProxy() {
            try {
                const proxy = `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(`https://api.sportmonks.com/v3/football/livescores?api_token=${API_TOKEN}&include=state;participants;league;scores&per_page=10`)}`;
                const res = await fetch(proxy);
                if(res.ok) return await res.json();
            } catch(e) {}
            return null;
        }
        async function fetchUpcoming() {
            try {
                const date = new Date(Date.now() + 86400000).toISOString().split('T')[0];
                const url = `https://api.sportmonks.com/v3/football/fixtures/date/${date}?api_token=${API_TOKEN}&include=participants;state;league;scores&per_page=10`;
                const res = await fetch(url, {mode:'cors'});
                if(res.ok) return await res.json();
            } catch(e) {}
            return null;
        }
        async function fetchFinished() {
            try {
                const yesterday = new Date(Date.now() - 86400000).toISOString().split('T')[0];
                const url = `https://api.sportmonks.com/v3/football/fixtures/date/${yesterday}?api_token=${API_TOKEN}&include=participants;state;league;scores&per_page=10`;
                const res = await fetch(url, {mode:'cors'});
                if(res.ok) return await res.json();
            } catch(e) {}
            return null;
        }

        async function loadLiveMatches() {
            currentMatchType = 'live';
            setActiveFilter('liveBtn');
            showToast('Loading live matches...', 'success');
            try {
                let data = await tryDirectFetch() || await tryPublicProxy();
                if(data && data.data) {
                    const live = data.data.filter(m => [2,3,4,5,6].includes(m.state_id));
                    displayMatches(live, 'live');
                } else { throw new Error(); }
            } catch(e) { displayMatches([], 'live'); showToast('API limited - demo mode', 'error'); }
        }

        async function loadUpcomingMatches() {
            currentMatchType = 'upcoming';
            setActiveFilter('upcomingBtn');
            try {
                let data = await fetchUpcoming();
                if(data && data.data) {
                    const upcoming = data.data.filter(m => [1,45,46].includes(m.state_id));
                    displayMatches(upcoming, 'upcoming');
                } else { throw new Error(); }
            } catch(e) { displayMatches([], 'upcoming'); }
        }

        async function loadFinishedMatches() {
            currentMatchType = 'finished';
            setActiveFilter('finishedBtn');
            try {
                let data = await fetchFinished();
                if(data && data.data) {
                    const finished = data.data.filter(m => [100,90].includes(m.state_id));
                    displayMatches(finished, 'finished');
                } else { throw new Error(); }
            } catch(e) { displayMatches([], 'finished'); }
        }

        function displayMatches(matches, type) {
            const container = document.getElementById('matchesContainer');
            if(!matches || matches.length===0) {
                container.innerHTML = `<div class="empty-state"><i class="fas fa-futbol"></i><p>No ${type} matches found</p></div>`;
                return;
            }
            let html = '';
            matches.forEach(m => { html += createMatchCard(m, type); });
            container.innerHTML = html;
        }

        function createMatchCard(match, type) {
            const participants = match.participants || [];
            const home = participants.find(p => p.meta?.location === 'home') || participants[0];
            const away = participants.find(p => p.meta?.location === 'away') || participants[1];
            const scores = match.scores || [];
            let homeScore = scores.find(s=>s.participant==='home')?.score || 0;
            let awayScore = scores.find(s=>s.participant==='away')?.score || 0;
            const league = match.league?.name || 'Football';
            const isLive = type === 'live';
            const isFinished = type === 'finished';
            const startTime = match.starting_at ? new Date(match.starting_at) : null;
            const odds = {
                home: (Math.random() * 1.5 + 1.8).toFixed(2),
                draw: (Math.random() * 1.2 + 2.8).toFixed(2),
                away: (Math.random() * 1.5 + 1.8).toFixed(2),
                over: (Math.random() * 0.8 + 1.6).toFixed(2),
                under: (Math.random() * 0.8 + 2.0).toFixed(2)
            };
            const homeShort = home?.name?.split(' ').pop() || 'H';
            const awayShort = away?.name?.split(' ').pop() || 'A';
            return `
                <div class="match-card" data-match-id="${match.id}">
                    <div class="match-header">
                        <span class="league-name">${league}</span>
                        ${isLive ? '<span class="live-badge"><i class="fas fa-circle" style="font-size:8px;"></i> LIVE</span>' : ''}
                        ${!isLive && !isFinished && startTime ? `<span style="font-size:0.7rem;">${startTime.toLocaleTimeString()}</span>` : ''}
                    </div>
                    <div class="match-body">
                        <div class="teams-row">
                            <div class="team"><div class="team-logo">${homeShort.charAt(0)}</div><span class="team-name">${home?.name || 'Home'}</span></div>
                            <div class="score-box"><div class="score">${isLive||isFinished?`${homeScore} - ${awayScore}`:'VS'}</div>${isLive?`<div class="match-time">${match.time || 'LIVE'}</div>`:''}</div>
                            <div class="team team-away"><span class="team-name">${away?.name || 'Away'}</span><div class="team-logo">${awayShort.charAt(0)}</div></div>
                        </div>
                        ${!isFinished ? `
                        <div class="odds-section">
                            <div class="odds-row">
                                <div class="odds-btn" onclick="addToBetSlip(${match.id}, '${home?.name || 'Home'}', '1', ${odds.home})">1 <strong>${odds.home}</strong></div>
                                <div class="odds-btn" onclick="addToBetSlip(${match.id}, 'Draw', 'X', ${odds.draw})">X <strong>${odds.draw}</strong></div>
                                <div class="odds-btn" onclick="addToBetSlip(${match.id}, '${away?.name || 'Away'}', '2', ${odds.away})">2 <strong>${odds.away}</strong></div>
                            </div>
                            <div class="double-row">
                                <div class="odds-btn" onclick="addToBetSlip(${match.id}, 'Over 2.5', 'Over', ${odds.over})">Over 2.5 <strong>${odds.over}</strong></div>
                                <div class="odds-btn" onclick="addToBetSlip(${match.id}, 'Under 2.5', 'Under', ${odds.under})">Under 2.5 <strong>${odds.under}</strong></div>
                            </div>
                        </div>` : `<div style="text-align:center; margin-top:16px; color:var(--text-muted);"><i class="fas fa-flag-checkered"></i> Full Time</div>`}
                    </div>
                </div>
            `;
        }

        function setActiveFilter(btnId) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(btnId)?.classList.add('active');
        }

        function refreshData() {
            if (currentMatchType === 'live') loadLiveMatches();
            else if (currentMatchType === 'upcoming') loadUpcomingMatches();
            else loadFinishedMatches();
        }

        // Bet Slip Functions
        function addToBetSlip(matchId, selection, betType, odds) {
            bettingSlip.push({ matchId, selection, betType, odds: parseFloat(odds), id: Date.now() });
            updateBetSlip();
            showToast(`Added: ${selection} @ ${odds}`, 'success');
        }

        function updateBetSlip() {
            const container = document.getElementById('betSlipItems');
            const countSpan = document.getElementById('betCount');
            const summaryPanel = document.getElementById('betSummaryPanel');
            countSpan.innerText = bettingSlip.length;
            if (bettingSlip.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding:40px; color:var(--text-muted);"><i class="fas fa-plus-circle" style="font-size:40px;"></i><p>Tap odds to add</p></div>`;
                summaryPanel.style.display = 'none';
                return;
            }
            let html = '', totalOdds = 1;
            bettingSlip.forEach((bet, idx) => {
                totalOdds *= bet.odds;
                html += `<div class="bet-item"><div><div style="font-weight:700;">${bet.selection}</div><div style="font-size:0.7rem;">${bet.betType}</div></div><div><span style="font-weight:800; margin-right:12px;">${bet.odds}</span><span class="remove-bet" onclick="removeFromBetSlip(${idx})"><i class="fas fa-trash-alt"></i></span></div></div>`;
            });
            container.innerHTML = html;
            summaryPanel.style.display = 'block';
            document.getElementById('totalOdds').innerText = totalOdds.toFixed(2);
            updatePotentialWin();
        }

        function removeFromBetSlip(index) { bettingSlip.splice(index,1); updateBetSlip(); }
        function updatePotentialWin() {
            let stake = parseFloat(document.getElementById('stakeAmount').value) || 0;
            let total = parseFloat(document.getElementById('totalOdds').innerText) || 1;
            document.getElementById('potentialWin').innerText = `$${(stake * total).toFixed(2)}`;
        }

        async function placeBet() {
            if (bettingSlip.length === 0) { showToast('No selections', 'error'); return; }
            let stake = parseFloat(document.getElementById('stakeAmount').value);
            if (stake < 1) { showToast('Min $1', 'error'); return; }
            if (stake > (userData?.balance || 0)) { showToast('Insufficient balance', 'error'); return; }
            let totalOdds = parseFloat(document.getElementById('totalOdds').innerText);
            let win = stake * totalOdds;
            if (!confirm(`Place $${stake} to win $${win.toFixed(2)}?`)) return;
            try {
                let betId = `bet_${Date.now()}_${Math.random().toString(36).substr(2,6)}`;
                await db.collection('bets').doc(betId).set({
                    betId, userId: currentUser.uid, selections: bettingSlip,
                    stake, totalOdds, potentialWin: win, status: 'pending',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                let newBalance = (userData?.balance || 0) - stake;
                await db.collection('wallets').doc(currentUser.uid).update({ balance: newBalance });
                userData.balance = newBalance;
                updateBalance();
                bettingSlip = [];
                updateBetSlip();
                showToast(`Bet placed! $${stake} to win $${win.toFixed(2)}`, 'success');
                loadUserStats();
            } catch(e) { showToast('Bet failed', 'error'); }
        }

        async function loadUserStats() {
            try {
                const betsSnap = await db.collection('bets').where('userId','==',currentUser.uid).get();
                const bets = betsSnap.docs.map(d=>d.data());
                document.getElementById('statTotalBets').innerText = bets.length;
                let won = bets.filter(b=>b.status==='won').length;
                let rate = bets.length ? ((won/bets.length)*100).toFixed(1) : 0;
                document.getElementById('statWinRate').innerText = `${rate}%`;
                let profit = bets.reduce((acc,b)=>{ if(b.status==='won') return acc+(b.potentialWin-b.stake); if(b.status==='lost') return acc-b.stake; return acc; },0);
                document.getElementById('statProfitLoss').innerHTML = `$${profit.toFixed(2)}`;
                await loadOpenBetsCount();
            } catch(e) {}
        }
        async function loadOpenBetsCount() {
            try {
                const open = await db.collection('bets').where('userId','==',currentUser.uid).where('status','==','pending').get();
                document.getElementById('statOpenBets').innerText = open.size;
            } catch(e) {}
        }
        function toggleUserMenu() { alert(`Logged in as ${currentUser?.email}`); }
        async function logout() { await auth.signOut(); window.location.href='login.html'; }
        document.getElementById('stakeAmount')?.addEventListener('input', updatePotentialWin);
    </script>
</body>
</html>
