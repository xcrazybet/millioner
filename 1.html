// ==================== DIRECT API FETCHING ====================
async function fetchLiveScores() {
    try {
        console.log('Fetching live scores...');
        const response = await fetch(`${BASE_URL}/football/livescores/inplay?api_token=${API_TOKEN}&include=participants;scores;periods;events;league.country;round`);
        
        if (!response.ok) {
            throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }
        
        const data = await response.json();
        console.log('Live scores response:', data);
        
        if (data && data.data && data.data.length > 0) {
            return data.data.map(match => ({
                id: match.id,
                participants: match.participants || [],
                scores: match.scores || {},
                periods: match.periods || {},
                events: match.events || [],
                league: match.league || {},
                round: match.round || {},
                state: { name: 'inplay' },
                starting_at: match.starting_at || new Date().toISOString(),
                time: match.time || {},
                odds: { home_win: 2.10, draw: 3.40, away_win: 3.80 } // Default odds if not provided
            }));
        }
        return [];
    } catch (error) {
        console.error('Error fetching live scores:', error);
        return [];
    }
}

        if (!response.ok) {
            throw new Error(`HTTP ${response.status}: ${response.statusText}`);

        const data = await response.json();
        console.log('Today fixtures response:', data);
        
        if (data && data.data) {
            return data.data.map(fixture => ({
                id: fixture.id,
                participants: fixture.participants || [],

                league: fixture.league || {},

        }

        return [];
    }
}

        if (!response.ok) {

// ==================== LOAD ALL MATCHES ====================
async function loadAllMatches() {
    const container = document.getElementById('contentArea');
    container.innerHTML = '<div class="loading-spinner"><div class="spinner"></div><p class="text-white mt-3">Fetching live matches from API...</p></div>';
    
    try {
        // Try to fetch from API first
        let liveMatches = await fetchLiveScores();
        let todayMatches = await fetchTodaysFixtures();
        let upcomingMatches = await fetchUpcomingFixtures();
        
        // If API returns empty, use demo data
        if (liveMatches.length === 0 && todayMatches.length === 0 && upcomingMatches.length === 0) {
            console.log('No data from API, using demo data');
            allMatches = getDemoMatches();
            showToast('Using demo data - API connection may be limited', 'warning');
        } else {
            // Combine all matches
            allMatches = [...liveMatches, ...todayMatches, ...upcomingMatches];
            
            // Remove duplicates by ID
            const uniqueMatches = new Map();
            allMatches.forEach(match => {
                if (!uniqueMatches.has(match.id)) {
                    uniqueMatches.set(match.id, match);
                }
            });
            allMatches = Array.from(uniqueMatches.values());
        }
        
        // Sort by date
        allMatches.sort((a, b) => new Date(a.starting_at) - new Date(b.starting_at));
        
        // Update league filter
        await updateLeagueFilter();
        
        // Render current tab
        renderCurrentTab();
        
        // Update live count
        updateLiveCount();
        
        console.log(`Loaded ${allMatches.length} matches`);
        
    } catch (error) {
        console.error('Error loading matches:', error);
        // Fallback to demo data
        allMatches = getDemoMatches();
        renderCurrentTab();
        showToast('Using demo data - API error occurred', 'error');
    }
}

async function updateLeagueFilter() {
    const leagues = [...new Set(allMatches.map(m => m.league?.name).filter(l => l && l !== undefined))];
    const select = document.getElementById('leagueFilter');
    select.innerHTML = '<option value="">All Leagues</option>' + leagues.map(league => `<option value="${league}">${league}</option>`).join('');
}

function updateLiveCount() {
    const liveMatches = allMatches.filter(m => m.state?.name === 'inplay');
    document.getElementById('liveCount').innerHTML = liveMatches.length + ' LIVE';
}

function renderCurrentTab() {
    const filterLeague = document.getElementById('leagueFilter').value;
    const filterDate = document.getElementById('dateFilter').value;
    const filterSearch = document.getElementById('searchFilter').value.toLowerCase();
    
    let filteredMatches = [...allMatches];
    
    if (filterLeague) {
        filteredMatches = filteredMatches.filter(m => m.league?.name === filterLeague);
    }
    
    if (filterDate) {
        filteredMatches = filteredMatches.filter(m => m.starting_at?.split('T')[0] === filterDate);
    }
    
    if (filterSearch) {
        filteredMatches = filteredMatches.filter(m => 
            (m.participants?.[0]?.name?.toLowerCase() || '').includes(filterSearch) ||
            (m.participants?.[1]?.name?.toLowerCase() || '').includes(filterSearch)
        );
    }
    
    let displayMatches = [];
    const today = new Date().toISOString().split('T')[0];
    const sevenDaysLater = new Date();
    sevenDaysLater.setDate(sevenDaysLater.getDate() + 7);
    
    switch(currentTab) {
        case 'live':
            displayMatches = filteredMatches.filter(m => m.state?.name === 'inplay');
            break;
        case 'today':
            displayMatches = filteredMatches.filter(m => m.starting_at?.split('T')[0] === today);
            break;
        case 'upcoming':
            displayMatches = filteredMatches.filter(m => 
                new Date(m.starting_at) > new Date() && 
                new Date(m.starting_at) <= sevenDaysLater
            );
            break;
        case 'mybets':
            loadUserBets();
            return;
    }
    
    renderMatches(displayMatches);
}

function renderMatches(matches) {
    const container = document.getElementById('contentArea');
    
    if (!matches || matches.length === 0) {
        container.innerHTML = `
            <div class="text-center text-white p-5">
                <i class="fas fa-futbol fa-3x mb-3"></i>
                <h4>No matches found</h4>
                <p>Check back later for upcoming fixtures</p>
                <button class="btn btn-light mt-3" onclick="loadAllMatches()">
                    <i class="fas fa-sync-alt"></i> Refresh
                </button>
            </div>
        `;
        return;
    }
    
    container.innerHTML = `<div class="row">${matches.map(match => renderMatchCard(match)).join('')}</div>`;
}

function renderMatchCard(match) {
    const isLive = match.state?.name === 'inplay';
    const matchName = `${match.participants?.[0]?.name || 'Team A'} vs ${match.participants?.[1]?.name || 'Team B'}`;
    const matchTime = match.starting_at ? new Date(match.starting_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : 'TBD';
    const matchDate = match.starting_at ? new Date(match.starting_at).toLocaleDateString() : 'Date TBD';
    const homeScore = match.scores?.localteam_score || match.scores?.localteam?.score || 0;
    const awayScore = match.scores?.visitorteam_score || match.scores?.visitorteam?.score || 0;
    
    // Process events
    const recentEvents = match.events?.slice(-3).map(event => {
        const icons = { goal: '⚽', yellowcard: '🟨', redcard: '🟥', substitution: '🔄' };
        return `<span class="event-badge">${icons[event.type] || '📋'} ${event.minute}'</span>`;
    }).join('') || '';
    
    return `
        <div class="col-lg-4 col-md-6">
            <div class="match-card">
                <div class="match-header">
                    <div class="d-flex justify-content-between">
                        <div>
                            <span><i class="fas fa-trophy"></i> ${match.league?.name || 'Football'}</span>
                            ${match.league?.country ? `<span class="ms-2"><i class="fas fa-globe"></i> ${typeof match.league.country === 'object' ? match.league.country.name : match.league.country}</span>` : ''}
                        </div>
                        <span>${isLive ? '<span class="pulse me-1"></span> LIVE' : matchDate + ' ' + matchTime}</span>
                    </div>
                    ${match.round?.name ? `<div class="mt-1 small"><i class="fas fa-calendar-alt"></i> ${match.round.name}</div>` : ''}
                </div>
                <div class="match-body">
                    <div class="text-center">
                        <div class="team-name">${match.participants?.[0]?.name || 'Team A'}</div>
                        <div class="score ${isLive ? 'live-score' : ''}">
                            ${isLive ? `${homeScore} - ${awayScore}` : 'vs'}
                        </div>
                        <div class="team-name">${match.participants?.[1]?.name || 'Team B'}</div>
                        ${isLive && recentEvents ? `<div class="mt-2">${recentEvents}</div>` : ''}
                    </div>
                    <div class="odds-container">
                        <button class="odds-btn odds-home" onclick="addToBettingSlip('${match.id}', '${matchName.replace(/'/g, "\\'")}', 'Home Win', ${match.odds?.home_win || 2.00})">
                            Home<br><strong>${match.odds?.home_win || 2.00}</strong>
                        </button>
                        <button class="odds-btn odds-draw" onclick="addToBettingSlip('${match.id}', '${matchName.replace(/'/g, "\\'")}', 'Draw', ${match.odds?.draw || 3.20})">
                            Draw<br><strong>${match.odds?.draw || 3.20}</strong>
                        </button>
                        <button class="odds-btn odds-away" onclick="addToBettingSlip('${match.id}', '${matchName.replace(/'/g, "\\'")}', 'Away Win', ${match.odds?.away_win || 3.50})">
                            Away<br><strong>${match.odds?.away_win || 3.50}</strong>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    `;
}

// ==================== AUTHENTICATION ====================
async function initAuth() {
    auth.onAuthStateChanged(async (user) => {
        if (user) {
            currentUser = user;
            await loadUserBalance();
            if (currentTab === 'mybets') loadUserBets();
        } else {
            try {
                const result = await auth.signInAnonymously();
                currentUser = result.user;
                await createUserAccount();
                await loadUserBalance();
            } catch (error) {
                console.error('Auth error:', error);
            }
        }
    });
}

async function createUserAccount() {
    const userRef = db.collection('users').doc(currentUser.uid);
    const doc = await userRef.get();
    if (!doc.exists) {
        await userRef.set({
            balance: 1000,
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            totalBets: 0,
            totalWon: 0
        });
    }
}

async function loadUserBalance() {
    const userRef = db.collection('users').doc(currentUser.uid);
    const doc = await userRef.get();
    if (doc.exists) {
        userBalance = doc.data().balance || 1000;
        document.getElementById('userBalance').innerText = userBalance.toFixed(2);
    }
}

async function updateUserBalance(amount) {
    const userRef = db.collection('users').doc(currentUser.uid);
    await userRef.update({
        balance: firebase.firestore.FieldValue.increment(amount)
    });
    userBalance += amount;
    document.getElementById('userBalance').innerText = userBalance.toFixed(2);
}

// ==================== BETTING FUNCTIONS ====================
function addToBettingSlip(matchId, matchName, selection, odds) {
    if (bettingSlip.find(b => b.matchId === matchId && b.selection === selection)) {
        showToast('Already in betting slip', 'warning');
        return;
    }
    
    bettingSlip.push({
        matchId,
        matchName,
        selection,
        odds,
        id: Date.now()
    });
    
    updateSlipUI();
    showToast(`Added: ${matchName} - ${selection} @ ${odds}`, 'success');
    document.getElementById('bettingSlip').classList.add('open');
}

function updateSlipUI() {
    const slipContent = document.getElementById('slipContent');
    const slipCount = document.getElementById('slipCount');
    slipCount.innerText = bettingSlip.length;
    
    if (bettingSlip.length === 0) {
        slipContent.innerHTML = `<div class="text-center p-4 text-muted"><i class="fas fa-plus-circle fa-2x"></i><p class="mt-2">Click on odds to add bets</p></div>`;
        return;
    }
    
    slipContent.innerHTML = bettingSlip.map((bet) => `
        <div class="slip-item">
            <div class="d-flex justify-content-between align-items-start">
                <div>
                    <small class="text-muted">${bet.matchName}</small>
                    <div><strong>${bet.selection}</strong> @ ${bet.odds}</div>
                    <input type="number" id="stake_${bet.id}" class="form-control form-control-sm mt-2" 
                           placeholder="Stake" min="1" max="${userBalance}" step="1" value="10">
                </div>
                <button class="btn btn-sm btn-danger" onclick="removeFromSlip(${bet.id})">&times;</button>
            </div>
        </div>
    `).join('') + `<div class="p-3 border-top"><button class="btn btn-success w-100" onclick="placeAllBets()"><i class="fas fa-check-circle"></i> Place All Bets</button></div>`;
}

function removeFromSlip(id) {
    bettingSlip = bettingSlip.filter(bet => bet.id !== id);
    updateSlipUI();
}

async function placeBet(matchId, matchName, selection, odds) {
    if (!currentUser) {
        showToast('Please login first', 'error');
        return false;
    }
    
    const amount = parseFloat(prompt(`Enter bet amount (Min €1, Max €${userBalance.toFixed(2)}):`));
    
    if (isNaN(amount) || amount < 1) {
        showToast('Invalid amount', 'error');
        return false;
    }
    
    if (amount > userBalance) {
        showToast('Insufficient balance!', 'error');
        return false;
    }
    
    const potentialWin = (amount * odds).toFixed(2);
    
    if (confirm(`Place bet: ${matchName}\nSelection: ${selection}\nStake: €${amount}\nPotential Win: €${potentialWin}`)) {
        try {
            await updateUserBalance(-amount);
            
            await db.collection('bets').add({
                userId: currentUser.uid,
                matchId: matchId,
                matchName: matchName,
                selection: selection,
                odds: odds,
                stake: amount,
                potentialWin: parseFloat(potentialWin),
                status: 'active',
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                settled: false
            });
            
            showToast(`Bet placed! Potential win: €${potentialWin}`, 'success');
            return true;
        } catch (error) {
            console.error('Error placing bet:', error);
            showToast('Error placing bet', 'error');
            return false;
        }
    }
    return false;
}

async function placeAllBets() {
    if (bettingSlip.length === 0) {
        showToast('No bets to place', 'warning');
        return;
    }
    
    let totalStake = 0;
    for (const bet of bettingSlip) {
        const stakeInput = document.getElementById(`stake_${bet.id}`);
        const stake = stakeInput ? parseFloat(stakeInput.value) : 10;
        if (isNaN(stake) || stake < 1) {
            showToast('Invalid stake amount', 'error');
            return;
        }
        if (stake > userBalance) {
            showToast(`Insufficient balance for ${bet.matchName}`, 'error');
            return;
        }
        totalStake += stake;
    }
    
    if (totalStake > userBalance) {
        showToast('Total stake exceeds balance', 'error');
        return;
    }
    
    if (confirm(`Place ${bettingSlip.length} bet(s) for total €${totalStake.toFixed(2)}?`)) {
        for (const bet of bettingSlip) {
            const stakeInput = document.getElementById(`stake_${bet.id}`);
            const stake = stakeInput ? parseFloat(stakeInput.value) : 10;
            await placeBet(bet.matchId, bet.matchName, bet.selection, bet.odds);
        }
        
        bettingSlip = [];
        updateSlipUI();
        document.getElementById('bettingSlip').classList.remove('open');
        showToast('All bets placed successfully!', 'success');
    }
}

// ==================== LOAD USER BETS ====================
async function loadUserBets() {
    if (!currentUser) return;
    
    const container = document.getElementById('contentArea');
    container.innerHTML = '<div class="loading-spinner"><div class="spinner"></div><p class="text-white mt-3">Loading your bets...</p></div>';
    
    try {
        const betsSnapshot = await db.collection('bets')
            .where('userId', '==', currentUser.uid)
            .orderBy('createdAt', 'desc')
            .limit(50)
            .get();
        
        const bets = [];
        betsSnapshot.forEach(doc => {
            bets.push({ id: doc.id, ...doc.data() });
        });
        
        if (bets.length === 0) {
            container.innerHTML = `
                <div class="text-center text-white p-5">
                    <i class="fas fa-receipt fa-3x mb-3"></i>
                    <h4>No bets placed yet</h4>
                    <p>Start betting on live matches!</p>
                </div>
            `;
            return;
        }
        
        container.innerHTML = `
            <div class="row">
                <div class="col-12">
                    <div class="bg-white rounded p-3">
                        <h4 class="mb-3">My Betting History</h4>
                        ${bets.map(bet => `
                            <div class="border-bottom pb-3 mb-3">
                                <div class="d-flex justify-content-between align-items-start">
                                    <div>
                                        <strong>${bet.matchName}</strong><br>
                                        <small>Selection: ${bet.selection} @ ${bet.odds}</small><br>
                                        <small>Stake: €${bet.stake?.toFixed(2)} | Potential: €${bet.potentialWin?.toFixed(2)}</small>
                                    </div>
                                    <span class="badge ${bet.status === 'active' ? 'bg-success' : 'bg-secondary'}">
                                        ${bet.status || 'active'}
                                    </span>
                                </div>
                                <small class="text-muted">${bet.createdAt?.toDate().toLocaleString() || 'Just now'}</small>
                            </div>
                        `).join('')}
                    </div>
                </div>
            </div>
        `;
    } catch (error) {
        console.error('Error loading bets:', error);
        container.innerHTML = '<div class="alert alert-danger">Error loading your bets</div>';
    }
}

// ==================== UTILITIES ====================
function showToast(message, type = 'info') {
    const toast = document.createElement('div');
    toast.className = 'toast-notification';
    toast.style.background = type === 'success' ? '#28a745' : type === 'error' ? '#dc3545' : '#17a2b8';
    toast.style.color = 'white';
    toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle'}"></i> ${message}`;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
}

// ==================== EVENT LISTENERS ====================
document.getElementById('viewSlipBtn').addEventListener('click', () => {
    document.getElementById('bettingSlip').classList.toggle('open');
});

document.getElementById('closeSlipBtn').addEventListener('click', () => {
    document.getElementById('bettingSlip').classList.remove('open');
});

document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentTab = btn.dataset.tab;
        if (currentTab === 'mybets') {
            loadUserBets();
        } else {
            renderCurrentTab();
        }
    });
});

document.getElementById('leagueFilter').addEventListener('change', () => renderCurrentTab());
document.getElementById('dateFilter').addEventListener('change', () => renderCurrentTab());
document.getElementById('searchFilter').addEventListener('input', () => renderCurrentTab());

// Set today's date as default
const today = new Date().toISOString().split('T')[0];
document.getElementById('dateFilter').value = today;

// ==================== INITIALIZATION ====================
async function init() {
    await initAuth();
    await loadAllMatches();
    
    // Auto-refresh every 30 seconds
    setInterval(() => {
        if (currentTab !== 'mybets') {
            loadAllMatches();
        }
    }, 30000);
}

// Make functions global for HTML onclick
window.addToBettingSlip = addToBettingSlip;
window.removeFromSlip = removeFromSlip;
window.placeAllBets = placeAllBets;
window.placeBet = placeBet;
window.loadAllMatches = loadAllMatches;

// Start the app
init();
</script>
