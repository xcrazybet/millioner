<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>XLODON BETTING - Live Sports Betting Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }

        /* Navbar Styles */
        .navbar {
            background: rgba(0, 0, 0, 0.95) !important;
            backdrop-filter: blur(10px);
            box-shadow: 0 2px 20px rgba(0,0,0,0.3);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar-brand {
            font-size: 1.8rem;
            font-weight: bold;
            background: linear-gradient(45deg, #FFD700, #FFA500);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent !important;
        }

        /* Live Indicator */
        .live-indicator {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(220, 53, 69, 0.2);
            padding: 5px 12px;
            border-radius: 20px;
            margin-right: 15px;
        }

        .pulse {
            width: 12px;
            height: 12px;
            background-color: #dc3545;
            border-radius: 50%;
            animation: pulse 1.5s ease-in-out infinite;
            box-shadow: 0 0 0 0 rgba(220, 53, 69, 0.7);
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(220, 53, 69, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(220, 53, 69, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(220, 53, 69, 0); }
        }

        /* Match Cards */
        .match-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .match-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .match-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 10px 15px;
            font-size: 0.85rem;
        }

        .match-body {
            padding: 20px;
        }

        .team-name {
            font-weight: bold;
            font-size: 1rem;
            margin: 5px 0;
        }

        .score {
            font-size: 2rem;
            font-weight: bold;
            text-align: center;
            margin: 10px 0;
        }

        .live-score {
            color: #dc3545;
            animation: scorePulse 1s infinite;
        }

        @keyframes scorePulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        /* Odds Buttons */
        .odds-container {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .odds-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            transition: all 0.3s;
            cursor: pointer;
        }

        .odds-home { background: linear-gradient(135deg, #28a745, #20c997); color: white; }
        .odds-draw { background: linear-gradient(135deg, #ffc107, #ff9800); color: white; }
        .odds-away { background: linear-gradient(135deg, #dc3545, #c82333); color: white; }

        .odds-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .odds-btn:active {
            transform: scale(0.95);
        }

        /* Betting Slip */
        .betting-slip {
            position: fixed;
            right: 0;
            top: 60px;
            width: 320px;
            background: white;
            border-radius: 15px 0 0 15px;
            box-shadow: -5px 5px 20px rgba(0,0,0,0.2);
            z-index: 999;
            max-height: 80vh;
            overflow-y: auto;
            transform: translateX(100%);
            transition: transform 0.3s ease;
        }

        .betting-slip.open {
            transform: translateX(0);
        }

        .slip-header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 15px;
            cursor: pointer;
        }

        .slip-item {
            padding: 10px;
            border-bottom: 1px solid #eee;
        }

        /* Loading Spinner */
        .loading-spinner {
            text-align: center;
            padding: 50px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 10px 20px;
            background: rgba(255,255,255,0.2);
            border: none;
            border-radius: 25px;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
        }

        .tab-btn.active {
            background: white;
            color: #667eea;
        }

        /* Modal */
        .modal-content {
            border-radius: 20px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .betting-slip {
                width: 100%;
                bottom: 0;
                top: auto;
                max-height: 50vh;
                border-radius: 15px 15px 0 0;
            }
            
            .odds-btn {
                padding: 8px;
                font-size: 0.9rem;
            }
            
            .score {
                font-size: 1.5rem;
            }
        }

        /* Toast Notifications */
        .toast-notification {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: white;
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            z-index: 1001;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateX(-100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Balance Display */
        .balance-display {
            background: rgba(255,255,255,0.1);
            padding: 5px 15px;
            border-radius: 20px;
            margin-right: 15px;
        }

        /* Filter Bar */
        .filter-bar {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">
            <i class="fas fa-futbol"></i> XLODON BETTING
        </a>
        <div class="d-flex align-items-center">
            <div class="live-indicator">
                <div class="pulse"></div>
                <span class="text-white" id="liveCount">0 LIVE</span>
            </div>
            <div class="balance-display text-white">
                <i class="fas fa-wallet"></i>
                <span id="userBalance">0.00</span> €
            </div>
            <button class="btn btn-outline-light" id="viewSlipBtn">
                <i class="fas fa-shopping-cart"></i>
                <span id="slipCount" class="badge bg-danger">0</span>
            </button>
        </div>
    </div>
</nav>

<!-- Main Content -->
<div class="container mt-4">
    <!-- Filter Bar -->
    <div class="filter-bar">
        <div class="row">
            <div class="col-md-4 mb-2">
                <select id="leagueFilter" class="form-select">
                    <option value="">All Leagues</option>
                </select>
            </div>
            <div class="col-md-4 mb-2">
                <input type="date" id="dateFilter" class="form-control">
            </div>
            <div class="col-md-4 mb-2">
                <input type="text" id="searchFilter" class="form-control" placeholder="Search teams...">
            </div>
        </div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
        <button class="tab-btn active" data-tab="live">
            <i class="fas fa-play-circle"></i> Live Now
        </button>
        <button class="tab-btn" data-tab="today">
            <i class="fas fa-calendar-day"></i> Today
        </button>
        <button class="tab-btn" data-tab="upcoming">
            <i class="fas fa-calendar-week"></i> Next 7 Days
        </button>
        <button class="tab-btn" data-tab="mybets">
            <i class="fas fa-history"></i> My Bets
        </button>
    </div>

    <!-- Content Area -->
    <div id="contentArea">
        <div class="loading-spinner">
            <div class="spinner"></div>
            <p class="text-white mt-3">Loading matches...</p>
        </div>
    </div>
</div>

<!-- Betting Slip -->
<div id="bettingSlip" class="betting-slip">
    <div class="slip-header">
        <div class="d-flex justify-content-between align-items-center">
            <h6 class="mb-0"><i class="fas fa-shopping-cart"></i> Betting Slip</h6>
            <button class="btn btn-sm btn-light" id="closeSlipBtn">&times;</button>
        </div>
    </div>
    <div id="slipContent" class="slip-body">
        <div class="text-center p-4 text-muted">
            <i class="fas fa-plus-circle fa-2x"></i>
            <p class="mt-2">Click on odds to add bets</p>
        </div>
    </div>
</div>

<!-- Firebase Configuration -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

<script>
// Firebase Config
const firebaseConfig = {
    apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
    authDomain: "x-bet-prod-jd.firebaseapp.com",
    projectId: "x-bet-prod-jd",
    storageBucket: "x-bet-prod-jd.firebasestorage.app",
    messagingSenderId: "499334334535",
    appId: "1:499334334535:web:bebc1bf817e24d9e3c4962",
    measurementId: "G-PTV4XMYQ6P"
};

// Initialize Firebase
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

// Global Variables
let currentUser = null;
let bettingSlip = [];
let currentTab = 'live';
let allMatches = [];
let userBalance = 0;

// ==================== AUTHENTICATION ====================
async function initAuth() {
    auth.onAuthStateChanged(async (user) => {
        if (user) {
            currentUser = user;
            await loadUserBalance();
            loadUserBets();
        } else {
            // Anonymous login for demo
            try {
                const result = await auth.signInAnonymously();
                currentUser = result.user;
                await createUserAccount();
                await loadUserBalance();
            } catch (error) {
                console.error('Auth error:', error);
                showToast('Authentication failed', 'error');
            }
        }
    });
}

async function createUserAccount() {
    const userRef = db.collection('users').doc(currentUser.uid);
    const doc = await userRef.get();
    if (!doc.exists) {
        await userRef.set({
            balance: 1000, // Starting balance €1000
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            totalBets: 0,
            totalWon: 0
        });
    }
}

async function loadUserBalance() {
    const userRef = db.collection('users').doc(currentUser.uid);
    const doc = await userRef.get();
    if (doc.exists) {
        userBalance = doc.data().balance || 0;
        document.getElementById('userBalance').innerText = userBalance.toFixed(2);
    }
}

async function updateUserBalance(amount) {
    const userRef = db.collection('users').doc(currentUser.uid);
    await userRef.update({
        balance: firebase.firestore.FieldValue.increment(amount)
    });
    userBalance += amount;
    document.getElementById('userBalance').innerText = userBalance.toFixed(2);
}

// ==================== PLACE BET ====================
async function placeBet(matchId, matchName, selection, odds) {
    if (!currentUser) {
        showToast('Please login first', 'error');
        return false;
    }
    
    // Show bet amount modal
    const amount = parseFloat(prompt('Enter bet amount (Min €1, Max €' + userBalance.toFixed(2) + '):'));
    
    if (isNaN(amount) || amount < 1) {
        showToast('Invalid amount', 'error');
        return false;
    }
    
    if (amount > userBalance) {
        showToast('Insufficient balance!', 'error');
        return false;
    }
    
    const potentialWin = (amount * odds).toFixed(2);
    
    if (confirm(`Place bet: ${matchName}\nSelection: ${selection}\nStake: €${amount}\nPotential Win: €${potentialWin}`)) {
        try {
            // Deduct from balance
            await updateUserBalance(-amount);
            
            // Create bet document
            const bet = {
                userId: currentUser.uid,
                matchId: matchId,
                matchName: matchName,
                selection: selection,
                odds: odds,
                stake: amount,
                potentialWin: parseFloat(potentialWin),
                status: 'active',
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                settled: false
            };
            
            await db.collection('bets').add(bet);
            
            showToast(`Bet placed! Potential win: €${potentialWin}`, 'success');
            
            // Remove from betting slip if exists
            bettingSlip = bettingSlip.filter(b => !(b.matchId === matchId && b.selection === selection));
            updateSlipUI();
            
            return true;
        } catch (error) {
            console.error('Error placing bet:', error);
            showToast('Error placing bet', 'error');
            return false;
        }
    }
    return false;
}

// ==================== LOAD MATCHES ====================
async function loadMatches() {
    try {
        const today = new Date();
        const todayStr = today.toISOString().split('T')[0];
        const sevenDaysLater = new Date(today);
        sevenDaysLater.setDate(today.getDate() + 7);
        
        // Query matches from Firestore
        const matchesRef = db.collection('games');
        const query = await matchesRef
            .where('starting_at', '>=', todayStr)
            .get();
        
        allMatches = [];
        query.forEach(doc => {
            allMatches.push({ id: doc.id, ...doc.data() });
        });
        
        // Sort by date
        allMatches.sort((a, b) => new Date(a.starting_at) - new Date(b.starting_at));
        
        // Update league filter
        updateLeagueFilter();
        
        // Render current tab
        renderCurrentTab();
        
        // Update live count
        updateLiveCount();
        
    } catch (error) {
        console.error('Error loading matches:', error);
        // Fallback demo data
        loadDemoData();
    }
}

function loadDemoData() {
    allMatches = [
        {
            id: '1',
            participants: [{ name: 'Manchester United' }, { name: 'Liverpool' }],
            starting_at: new Date().toISOString(),
            state: { name: 'inplay' },
            scores: { localteam_score: 2, visitorteam_score: 1 },
            league: { name: 'Premier League' },
            odds: { home_win: 2.10, draw: 3.40, away_win: 3.80 }
        },
        {
            id: '2',
            participants: [{ name: 'Real Madrid' }, { name: 'Barcelona' }],
            starting_at: new Date(Date.now() + 3600000).toISOString(),
            state: { name: 'notstarted' },
            league: { name: 'La Liga' },
            odds: { home_win: 1.95, draw: 3.60, away_win: 4.20 }
        },
        {
            id: '3',
            participants: [{ name: 'Bayern Munich' }, { name: 'Borussia Dortmund' }],
            starting_at: new Date(Date.now() + 7200000).toISOString(),
            state: { name: 'notstarted' },
            league: { name: 'Bundesliga' },
            odds: { home_win: 1.85, draw: 3.75, away_win: 4.50 }
        }
    ];
    renderCurrentTab();
}

function updateLeagueFilter() {
    const leagues = [...new Set(allMatches.map(m => m.league?.name).filter(l => l))];
    const select = document.getElementById('leagueFilter');
    select.innerHTML = '<option value="">All Leagues</option>' + 
        leagues.map(league => `<option value="${league}">${league}</option>`).join('');
}

function updateLiveCount() {
    const liveMatches = allMatches.filter(m => m.state?.name === 'inplay');
    document.getElementById('liveCount').innerText = liveMatches.length;
}

function renderCurrentTab() {
    const filterLeague = document.getElementById('leagueFilter').value;
    const filterDate = document.getElementById('dateFilter').value;
    const filterSearch = document.getElementById('searchFilter').value.toLowerCase();
    
    let filteredMatches = [...allMatches];
    
    if (filterLeague) {
        filteredMatches = filteredMatches.filter(m => m.league?.name === filterLeague);
    }
    
    if (filterDate) {
        filteredMatches = filteredMatches.filter(m => m.starting_at?.split('T')[0] === filterDate);
    }
    
    if (filterSearch) {
        filteredMatches = filteredMatches.filter(m => 
            m.participants?.[0]?.name?.toLowerCase().includes(filterSearch) ||
            m.participants?.[1]?.name?.toLowerCase().includes(filterSearch)
        );
    }
    
    let displayMatches = [];
    
    switch(currentTab) {
        case 'live':
            displayMatches = filteredMatches.filter(m => m.state?.name === 'inplay');
            break;
        case 'today':
            const today = new Date().toISOString().split('T')[0];
            displayMatches = filteredMatches.filter(m => m.starting_at?.split('T')[0] === today);
            break;
        case 'upcoming':
            const sevenDaysLater = new Date();
            sevenDaysLater.setDate(sevenDaysLater.getDate() + 7);
            displayMatches = filteredMatches.filter(m => 
                new Date(m.starting_at) > new Date() && 
                new Date(m.starting_at) <= sevenDaysLater
            );
            break;
        case 'mybets':
            loadUserBets();
            return;
    }
    
    renderMatches(displayMatches);
}

function renderMatches(matches) {
    const container = document.getElementById('contentArea');
    
    if (matches.length === 0) {
        container.innerHTML = `
            <div class="text-center text-white p-5">
                <i class="fas fa-futbol fa-3x mb-3"></i>
                <h4>No matches found</h4>
                <p>Check back later for upcoming fixtures</p>
            </div>
        `;
        return;
    }
    
    container.innerHTML = `
        <div class="row">
            ${matches.map(match => renderMatchCard(match)).join('')}
        </div>
    `;
}

function renderMatchCard(match) {
    const isLive = match.state?.name === 'inplay';
    const matchName = `${match.participants?.[0]?.name || 'Team A'} vs ${match.participants?.[1]?.name || 'Team B'}`;
    const matchTime = new Date(match.starting_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const matchDate = new Date(match.starting_at).toLocaleDateString();
    const homeScore = match.scores?.localteam_score || 0;
    const awayScore = match.scores?.visitorteam_score || 0;
    
    return `
        <div class="col-lg-4 col-md-6">
            <div class="match-card">
                <div class="match-header">
                    <div class="d-flex justify-content-between">
                        <span><i class="fas fa-trophy"></i> ${match.league?.name || 'Football'}</span>
                        <span>${isLive ? '<span class="pulse me-1"></span> LIVE' : matchDate + ' ' + matchTime}</span>
                    </div>
                </div>
                <div class="match-body">
                    <div class="text-center">
                        <div class="team-name">${match.participants?.[0]?.name || 'Team A'}</div>
                        <div class="score ${isLive ? 'live-score' : ''}">
                            ${isLive ? `${homeScore} - ${awayScore}` : 'vs'}
                        </div>
                        <div class="team-name">${match.participants?.[1]?.name || 'Team B'}</div>
                    </div>
                    <div class="odds-container">
                        <button class="odds-btn odds-home" onclick="addToBettingSlip('${match.id}', '${matchName.replace(/'/g, "\\'")}', 'Home Win', ${match.odds?.home_win || 2.00})">
                            Home<br><strong>${match.odds?.home_win || 2.00}</strong>
                        </button>
                        <button class="odds-btn odds-draw" onclick="addToBettingSlip('${match.id}', '${matchName.replace(/'/g, "\\'")}', 'Draw', ${match.odds?.draw || 3.20})">
                            Draw<br><strong>${match.odds?.draw || 3.20}</strong>
                        </button>
                        <button class="odds-btn odds-away" onclick="addToBettingSlip('${match.id}', '${matchName.replace(/'/g, "\\'")}', 'Away Win', ${match.odds?.away_win || 3.50})">
                            Away<br><strong>${match.odds?.away_win || 3.50}</strong>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    `;
}

// ==================== BETTING SLIP ====================
function addToBettingSlip(matchId, matchName, selection, odds) {
    const existing = bettingSlip.find(b => b.matchId === matchId && b.selection === selection);
    if (existing) {
        showToast('Already in betting slip', 'warning');
        return;
    }
    
    bettingSlip.push({
        matchId,
        matchName,
        selection,
        odds,
        id: Date.now()
    });
    
    updateSlipUI();
    showToast(`Added: ${matchName} - ${selection} @ ${odds}`, 'success');
    
    // Open slip
    document.getElementById('bettingSlip').classList.add('open');
}

function updateSlipUI() {
    const slipContent = document.getElementById('slipContent');
    const slipCount = document.getElementById('slipCount');
    
    slipCount.innerText = bettingSlip.length;
    
    if (bettingSlip.length === 0) {
        slipContent.innerHTML = `
            <div class="text-center p-4 text-muted">
                <i class="fas fa-plus-circle fa-2x"></i>
                <p class="mt-2">Click on odds to add bets</p>
            </div>
        `;
        return;
    }
    
    let totalStake = 0;
    let totalPotential = 0;
    
    slipContent.innerHTML = `
        ${bettingSlip.map((bet, index) => {
            totalStake += 10; // Default stake
            totalPotential += 10 * bet.odds;
            return `
                <div class="slip-item">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <small class="text-muted">${bet.matchName}</small>
                            <div><strong>${bet.selection}</strong> @ ${bet.odds}</div>
                            <input type="number" id="stake_${bet.id}" class="form-control form-control-sm mt-2" 
                                   placeholder="Stake" min="1" max="${userBalance}" step="1" value="10">
                        </div>
                        <button class="btn btn-sm btn-danger" onclick="removeFromSlip(${bet.id})">&times;</button>
                    </div>
                </div>
            `;
        }).join('')}
        <div class="p-3 border-top">
            <button class="btn btn-success w-100" onclick="placeAllBets()">
                <i class="fas fa-check-circle"></i> Place All Bets
            </button>
        </div>
    `;
}

function removeFromSlip(id) {
    bettingSlip = bettingSlip.filter(bet => bet.id !== id);
    updateSlipUI();
}

async function placeAllBets() {
    if (bettingSlip.length === 0) {
        showToast('No bets to place', 'warning');
        return;
    }
    
    let totalStake = 0;
    for (const bet of bettingSlip) {
        const stakeInput = document.getElementById(`stake_${bet.id}`);
        const stake = stakeInput ? parseFloat(stakeInput.value) : 10;
        
        if (isNaN(stake) || stake < 1) {
            showToast('Invalid stake amount', 'error');
            return;
        }
        
        if (stake > userBalance) {
            showToast(`Insufficient balance for ${bet.matchName}`, 'error');
            return;
        }
        
        totalStake += stake;
    }
    
    if (totalStake > userBalance) {
        showToast('Total stake exceeds balance', 'error');
        return;
    }
    
    if (confirm(`Place ${bettingSlip.length} bet(s) for total €${totalStake.toFixed(2)}?`)) {
        for (const bet of bettingSlip) {
            const stakeInput = document.getElementById(`stake_${bet.id}`);
            const stake = stakeInput ? parseFloat(stakeInput.value) : 10;
            await placeBet(bet.matchId, bet.matchName, bet.selection, bet.odds, stake);
        }
        
        bettingSlip = [];
        updateSlipUI();
        document.getElementById('bettingSlip').classList.remove('open');
    }
}

// ==================== LOAD USER BETS ====================
async function loadUserBets() {
    if (!currentUser) return;
    
    const container = document.getElementById('contentArea');
    container.innerHTML = '<div class="loading-spinner"><div class="spinner"></div></div>';
    
    try {
        const betsSnapshot = await db.collection('bets')
            .where('userId', '==', currentUser.uid)
            .orderBy('createdAt', 'desc')
            .limit(50)
            .get();
        
        const bets = [];
        betsSnapshot.forEach(doc => {
            bets.push({ id: doc.id, ...doc.data() });
        });
        
        if (bets.length === 0) {
            container.innerHTML = `
                <div class="text-center text-white p-5">
                    <i class="fas fa-receipt fa-3x mb-3"></i>
                    <h4>No bets placed yet</h4>
                    <p>Start betting on live matches!</p>
                </div>
            `;
            return;
        }
        
        container.innerHTML = `
            <div class="row">
                <div class="col-12">
                    <div class="bg-white rounded p-3">
                        <h4 class="mb-3">My Betting History</h4>
                        ${bets.map(bet => `
                            <div class="border-bottom pb-3 mb-3">
                                <div class="d-flex justify-content-between align-items-start">
                                    <div>
                                        <strong>${bet.matchName}</strong><br>
                                        <small>Selection: ${bet.selection} @ ${bet.odds}</small><br>
                                        <small>Stake: €${bet.stake?.toFixed(2)} | Potential: €${bet.potentialWin?.toFixed(2)}</small>
                                    </div>
                                    <span class="badge ${bet.status === 'active' ? 'bg-success' : 'bg-secondary'}">
                                        ${bet.status || 'active'}
                                    </span>
                                </div>
                                <small class="text-muted">${bet.createdAt?.toDate().toLocaleString() || 'Just now'}</small>
                            </div>
                        `).join('')}
                    </div>
                </div>
            </div>
        `;
        
    } catch (error) {
        console.error('Error loading bets:', error);
        container.innerHTML = '<div class="alert alert-danger">Error loading your bets</div>';
    }
}

// ==================== UTILITIES ====================
function showToast(message, type = 'info') {
    const toast = document.createElement('div');
    toast.className = 'toast-notification';
    toast.style.background = type === 'success' ? '#28a745' : type === 'error' ? '#dc3545' : '#17a2b8';
    toast.style.color = 'white';
    toast.innerHTML = `
        <i class="fas ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle'}"></i>
        ${message}
    `;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
}

// ==================== EVENT LISTENERS ====================
document.getElementById('viewSlipBtn').addEventListener('click', () => {
    document.getElementById('bettingSlip').classList.toggle('open');
});

document.getElementById('closeSlipBtn').addEventListener('click', () => {
    document.getElementById('bettingSlip').classList.remove('open');
});

document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentTab = btn.dataset.tab;
        
        if (currentTab === 'mybets') {
            loadUserBets();
        } else {
            renderCurrentTab();
        }
    });
});

document.getElementById('leagueFilter').addEventListener('change', renderCurrentTab);
document.getElementById('dateFilter').addEventListener('change', renderCurrentTab);
document.getElementById('searchFilter').addEventListener('input', renderCurrentTab);

// ==================== INITIALIZATION ====================
async function init() {
    await initAuth();
    await loadMatches();
    
    // Set today's date as default filter
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('dateFilter').value = today;
    
    // Real-time listener for live matches
    db.collection('games')
        .where('state.name', '==', 'inplay')
        .onSnapshot(() => {
            loadMatches();
        });
}

// Start the app
init();

// Make functions global for HTML onclick
window.addToBettingSlip = addToBettingSlip;
window.removeFromSlip = removeFromSlip;
window.placeAllBets = placeAllBets;
window.placeBet = placeBet;

</script>
