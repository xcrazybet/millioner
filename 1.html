<!DOCTYPE html>
<html lang="en">
<head>

    <title>🎮 Xlodon Games Hub - Play & Win</title>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif;
        }

        :root {
            --primary: #ff6b6b;
            --primary-dark: #ff5252;
            --secondary: #4ecdc4;
            --secondary-dark: #45b7aa;
            --accent: #ffe66d;
            --bg-gradient-start: #1a1a2e;
            --bg-gradient-end: #16213e;
            --surface: rgba(30, 30, 50, 0.85);
            --card-bg: rgba(255, 255, 255, 0.08);
            --text: #ffffff;
            --text-dim: #c9c9e0;
            --gold: #ffd93d;
            --purple: #a66bb0;
        }

        body {
            background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 70px;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated background particles */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 40%, rgba(255, 107, 107, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(78, 205, 196, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 80%, rgba(255, 230, 109, 0.08) 0%, transparent 60%);
            pointer-events: none;
            z-index: -1;
        }

        /* Header */
        .header {
            background: rgba(10, 10, 20, 0.9);
            backdrop-filter: blur(20px);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
            position: sticky;
            top: 0;
            z-index: 1000;
            flex-wrap: wrap;
            gap: 12px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .home-btn {
            width: 40px;
            height: 40px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 18px;
            transition: all 0.3s;
            text-decoration: none;
        }

        .home-btn:hover {
            transform: scale(1.1);
            background: var(--primary-dark);
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
        }

        .logo i {
            background: none;
            color: var(--primary);
            margin-right: 5px;
        }

        .header-center {
            display: flex;
            gap: 8px;
            background: rgba(255,255,255,0.05);
            padding: 5px 15px;
            border-radius: 50px;
        }

        .nav-link {
            color: var(--text-dim);
            text-decoration: none;
            font-weight: 500;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .nav-link.active, .nav-link:hover {
            background: var(--primary);
            color: white;
        }

        .balance-display {
            background: linear-gradient(135deg, var(--gold), #ffb347);
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: 800;
            color: #1a1a2e;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(255, 217, 61, 0.3);
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255,255,255,0.1);
            padding: 5px 15px 5px 10px;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s;
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .mobile-menu-btn {
            display: none;
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            font-size: 1.3rem;
            width: 42px;
            height: 42px;
            border-radius: 12px;
            cursor: pointer;
        }

        /* Ticker */
        .players-ticker {
            background: rgba(0,0,0,0.4);
            padding: 10px 0;
            overflow: hidden;
            border-bottom: 1px solid rgba(255,107,107,0.3);
        }

        .ticker-container {
            display: flex;
            gap: 35px;
            animation: tickerMove 80s linear infinite;
            white-space: nowrap;
        }

        .ticker-item {
            background: rgba(255,255,255,0.08);
            padding: 5px 18px;
            border-radius: 40px;
            display: inline-flex;
            gap: 12px;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .player-rank {
            width: 26px;
            height: 26px;
            background: var(--gold);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #1a1a2e;
            font-size: 12px;
        }

        /* Search & Categories */
        .search-filter-bar {
            padding: 16px 20px;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 70px;
            z-index: 99;
        }

        .search-container {
            display: flex;
            gap: 12px;
            max-width: 600px;
            margin: 0 auto;
        }

        .search-box {
            flex: 1;
            padding: 12px 20px;
            background: rgba(255,255,255,0.1);
            border: 2px solid var(--secondary);
            border-radius: 50px;
            color: white;
            font-size: 0.9rem;
            transition: 0.2s;
        }

        .search-box:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(255,255,255,0.15);
        }

        .search-btn {
            background: var(--secondary);
            border: none;
            width: 48px;
            border-radius: 50%;
            color: #1a1a2e;
            cursor: pointer;
            font-size: 1.2rem;
        }

        .categories-bar {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 15px 20px;
            scrollbar-width: thin;
        }

        .category-btn {
            background: rgba(255,255,255,0.08);
            border: none;
            padding: 8px 18px;
            border-radius: 40px;
            color: var(--text-dim);
            font-weight: 600;
            font-size: 0.8rem;
            white-space: nowrap;
            display: flex;
            gap: 8px;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .category-btn.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(255,107,107,0.4);
        }

        .game-count {
            text-align: center;
            padding: 10px;
            font-size: 0.85rem;
            color: var(--text-dim);
        }

        /* Games Grid with Images */
        .games-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
        }

        @media (min-width: 600px) {
            .games-grid {
                grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
            }
        }

        .game-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.15);
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            cursor: pointer;
            position: relative;
        }

        .game-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: var(--primary);
            box-shadow: 0 15px 30px rgba(255,107,107,0.3);
        }

        .game-image {
            width: 100%;
            height: 140px;
            background-size: cover;
            background-position: center;
            position: relative;
            display: flex;
            align-items: flex-end;
            justify-content: flex-start;
        }

        .game-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: var(--accent);
            color: #1a1a2e;
            font-size: 10px;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 20px;
        }

        .game-badge.hot {
            background: var(--primary);
            color: white;
        }

        .game-info {
            padding: 14px;
        }

        .game-title {
            font-size: 1rem;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }

        .game-category {
            font-size: 9px;
            background: rgba(78, 205, 196, 0.3);
            padding: 3px 8px;
            border-radius: 20px;
            color: var(--secondary);
        }

        .game-stats {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            margin: 8px 0;
            color: var(--text-dim);
        }

        .play-btn {
            width: 100%;
            background: linear-gradient(90deg, var(--primary), var(--primary-dark));
            border: none;
            padding: 10px 0;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }

        .play-btn:hover {
            transform: scale(0.98);
            filter: brightness(1.1);
        }

        .fav-btn {
            position: absolute;
            bottom: 12px;
            right: 12px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            color: #ff8888;
            cursor: pointer;
            transition: 0.2s;
        }

        /* Featured Carousel */
        .featured-carousel {
            margin: 20px 20px;
        }

        .carousel-title {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .carousel-container {
            display: flex;
            gap: 20px;
            overflow-x: auto;
            padding-bottom: 15px;
            scrollbar-width: thin;
        }

        .featured-game {
            min-width: 280px;
            background: var(--surface);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            border: 2px solid var(--secondary);
            overflow: hidden;
            transition: 0.2s;
        }

        .featured-game .game-image {
            height: 170px;
        }

        /* Info Panel */
        .info-panel {
            margin-top: 40px;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(12px);
            padding: 24px 20px;
            border-top: 2px solid var(--primary);
        }

        .info-tabs {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            margin-bottom: 20px;
        }

        .info-tab {
            background: rgba(255,255,255,0.08);
            border: none;
            padding: 10px 22px;
            border-radius: 40px;
            color: var(--text-dim);
            font-weight: 600;
            cursor: pointer;
        }

        .info-tab.active {
            background: var(--primary);
            color: white;
        }

        .info-section {
            background: rgba(0,0,0,0.3);
            border-radius: 24px;
            padding: 20px;
        }

        .winner-item, .game-stat-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(10, 10, 20, 0.95);
            display: flex;
            justify-content: space-around;
            padding: 8px 10px;
            border-top: 2px solid var(--primary);
            backdrop-filter: blur(20px);
            z-index: 1000;
        }

        .bottom-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--text-dim);
            font-size: 0.7rem;
            gap: 4px;
            transition: 0.2s;
        }

        .bottom-nav-item.active {
            color: var(--primary);
        }

        .sound-indicator {
            position: fixed;
            bottom: 85px;
            right: 18px;
            background: var(--secondary);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1001;
            color: #1a1a2e;
            box-shadow: 0 4px 15px rgba(78,205,196,0.4);
        }

        @keyframes tickerMove {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        @media (max-width: 860px) {
            .header-center { display: none; }
            .mobile-menu-btn { display: flex; align-items: center; justify-content: center; }
            .logo { font-size: 1.1rem; }
            .balance-display { padding: 5px 12px; font-size: 0.75rem; }
            .user-name { display: none; }
        }

        .mobile-menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.96);
            z-index: 2000;
            display: none;
            flex-direction: column;
            padding: 30px 20px;
            backdrop-filter: blur(20px);
        }

        .mobile-menu-overlay.show { display: flex; }

        .no-games {
            text-align: center;
            padding: 50px;
            grid-column: 1/-1;
        }
    </style>
</head>

        { id: "scratchcards", name: "Scratch Cards", url: "https://xcrazybet.github.io/millioner/ScratchCards.html", category: "sports", image: "https://images.unsplash.com/photo-1606761568499-6d2451b23c66?w=400&h=300&fit=crop", desc: "Instant win", players: 1950, minBet: 1, featured: false, new: false },
        { id: "rocket", name: "Rocket Launch", url: "https://xcrazybet.github.io/millioner/Rocket.html", category: "arcade", image: "https://images.unsplash.com/photo-1516849677043-ef67c9557e16?w=400&h=300&fit=crop", desc: "To the moon", players: 1450, minBet: 1, featured: false, new: false },
        { id: "plinko", name: "Plinko", url: "https://xcrazybet.github.io/millioner/plinko.html", category: "arcade", image: "https://images.unsplash.com/photo-1593711539947-48a5ff0fb2c8?w=400&h=300&fit=crop", desc: "Drop & bounce", players: 980, minBet: 2, featured: false, new: false },
        { id: "dicebattle", name: "Dice Battle", url: "https://xcrazybet.github.io/millioner/DICEBATTLE.html", category: "cards", image: "https://images.unsplash.com/photo-1584118624012-df056829feb0?w=400&h=300&fit=crop", desc: "Roll for victory", players: 780, minBet: 2, featured: true, new: false },
        { id: "treasurechest", name: "Treasure Chest", url: "https://xcrazybet.github.io/millioner/TreasureChest.html", category: "mystery", image: "https://images.unsplash.com/photo-1586473219010-2ffc57b0d282?w=400&h=300&fit=crop", desc: "Open chests", players: 890, minBet: 5, featured: true, new: false },
        { id: "quantumbet", name: "Quantum Bet", url: "https://xcrazybet.github.io/millioner/QuantumBet.html", category: "premium", image: "https://images.unsplash.com/photo-1635070041078-e363dbe005cb?w=400&h=300&fit=crop", desc: "Quantum wins", players: 220, minBet: 75, featured: true, new: true }
    ];

    // Duplicate to reach 44+ games feel by adding variations
    const fullGamesList = [...gamesData];
    for(let i=0; i<26; i++) {
        let base = gamesData[i % gamesData.length];
        fullGamesList.push({ ...base, id: base.id+i, name: base.name+(i>0?" Pro":""), players: base.players - i*10, featured: false, new: i<3 });
    }

    let state = { currentCategory: 'all', searchQuery: '', gamesList: fullGamesList.slice(0,44), favoriteGames: new Set() };
    
    function getImage(game) { return game.image || "https://images.unsplash.com/photo-1593711539947-48a5ff0fb2c8?w=400&h=300&fit=crop"; }
    
    function renderGames() {
        let filtered = state.gamesList.filter(g => (state.currentCategory === 'all' || g.category === state.currentCategory) && g.name.toLowerCase().includes(state.searchQuery));
        document.getElementById('gameCount').innerText = filtered.length;
        const grid = document.getElementById('gamesGrid');
        if(filtered.length === 0){ grid.style.display='none'; document.getElementById('noGames').style.display='block'; return; }
        grid.style.display='grid'; document.getElementById('noGames').style.display='none';
        grid.innerHTML = filtered.map(game => `
            <div class="game-card" data-id="${game.id}">
                <div class="game-image" style="background-image: url('${getImage(game)}'); background-size: cover;">
                    ${game.new ? '<div class="game-badge hot">✨ NEW</div>' : ''}
                </div>
                <div class="game-info">
                    <div class="game-title"><span>${game.name}</span><span class="game-category">${game.category}</span></div>
                    <div class="game-stats"><span><i class="fas fa-users"></i> ${formatNumber(game.players)}</span><span><i class="fas fa-coins"></i> $${game.minBet}</span></div>
                    <button class="play-btn" data-url="${game.url}"><i class="fas fa-play"></i> PLAY NOW</button>
                </div>
                <button class="fav-btn" data-id="${game.id}"><i class="fas ${state.favoriteGames.has(game.id) ? 'fa-heart' : 'fa-heart'}"></i></button>
            </div>
        `).join('');
        document.querySelectorAll('.play-btn').forEach(btn => btn.addEventListener('click', (e) => { e.stopPropagation(); playSound(); window.location.href = btn.dataset.url; }));
    }
    
    function renderFeatured() {
        let featured = state.gamesList.filter(g => g.featured).slice(0,6);
        document.getElementById('carouselContainer').innerHTML = featured.map(g => `
            <div class="featured-game">
                <div class="game-image" style="background-image: url('${getImage(g)}'); background-size: cover; height:170px;"><div class="game-badge">🔥 HOT</div></div>
                <div class="game-info"><div class="game-title">${g.name}</div><button class="play-feat" data-url="${g.url}" style="background:var(--primary); width:100%; padding:10px; border:none; border-radius:40px; font-weight:bold; margin-top:10px;">PLAY NOW</button></div>
            </div>
        `).join('');
        document.querySelectorAll('.play-feat').forEach(btn => btn.addEventListener('click', () => { playSound(); window.location.href = btn.dataset.url; }));
    }
    
    function initCategories() {
        let cats = ['all','casino','lottery','arcade','cards','mystery','premium','sports'];
        const bar = document.getElementById('categoriesBar');
        bar.innerHTML = cats.map(c => `<button class="category-btn ${c==='all'?'active':''}" data-cat="${c}"><i class="fas ${c==='all'?'fa-globe':'fa-dice'}"></i> ${c.toUpperCase()}</button>`).join('');
        document.querySelectorAll('.category-btn').forEach(btn => btn.addEventListener('click', () => {
            state.currentCategory = btn.dataset.cat;
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderGames();
        }));
    }
    
    function initTicker() {
        const players = [{name:"ThunderGod",wins:3250,rank:1},{name:"LuckyQueen",wins:2890,rank:2},{name:"MidasKing",wins:2450,rank:3},{name:"CryptoWiz",wins:1980,rank:4}];
        const container = document.getElementById('tickerContainer');
        let items = [...players, ...players];
        container.innerHTML = items.map(p => `<div class="ticker-item"><div class="player-rank">${p.rank}</div><div>${p.name}</div><div><i class="fas fa-trophy"></i> ${p.wins}</div></div>`).join('');
    }
    
    function initInfoPanel() {
        document.getElementById('infoTabs').innerHTML = `<button class="info-tab active" data-tab="winners">🏆 Winners</button><button class="info-tab" data-tab="popular">🔥 Popular</button><button class="info-tab" data-tab="stats">📊 Stats</button>`;
        document.getElementById('infoContent').innerHTML = `<div id="winnersTab" class="info-section"><div class="section-title"><i class="fas fa-trophy"></i> Recent Big Wins</div><div id="winnersList"></div></div><div id="popularTab" style="display:none" class="info-section"><div class="section-title">🔥 Trending</div><div id="popularList"></div></div><div id="statsTab" style="display:none" class="info-section"><div class="section-title">📊 Stats</div><div id="statsList"></div></div>`;
        document.querySelectorAll('.info-tab').forEach(t => t.addEventListener('click', () => { document.querySelectorAll('.info-tab').forEach(tt=>tt.classList.remove('active')); t.classList.add('active'); document.querySelectorAll('.info-section').forEach(s=>s.style.display='none'); document.getElementById(`${t.dataset.tab}Tab`).style.display='block'; if(t.dataset.tab==='popular') updatePopular(); if(t.dataset.tab==='stats') updateStats(); }));
        updateWinners(); updatePopular(); updateStats();
    }
    function updateWinners() { document.getElementById('winnersList').innerHTML = `<div class="winner-item"><div><b>ZeusSlayer</b><div>Gates of Olympus</div></div><div>$24,500</div></div><div class="winner-item"><div><b>LuckyStar</b><div>Blackjack</div></div><div>$12,800</div></div><div class="winner-item"><div><b>RocketMan</b><div>Crash Game</div></div><div>$9,200</div></div>`; }
    function updatePopular() { let top = [...state.gamesList].sort((a,b)=>b.players-a.players).slice(0,5); document.getElementById('popularList').innerHTML = top.map(g=>`<div class="game-stat-item"><span>${g.name}</span><span>${formatNumber(g.players)} playing</span></div>`).join(''); }
    function updateStats() { document.getElementById('statsList').innerHTML = `<div class="game-stat-item"><span>Total Games</span><span>44+</span></div><div class="game-stat-item"><span>Active Users</span><span>15,230</span></div><div class="game-stat-item"><span>Daily Jackpot</span><span>$528K</span></div>`; }
    
    function formatNumber(n){ return n>=1000 ? (n/1000).toFixed(1)+'k' : n; }
    function playSound() { const audio = new Audio("https://assets.mixkit.co/sfx/preview/mixkit-water-drop-125.mp3"); audio.volume=0.5; audio.play().catch(e=>{}); }
    
    document.getElementById('searchBox').addEventListener('input', e => { state.searchQuery = e.target.value.toLowerCase(); renderGames(); });
    document.getElementById('searchBtn').addEventListener('click', () => { state.searchQuery = document.getElementById('searchBox').value.toLowerCase(); renderGames(); });
    document.getElementById('mobileMenuBtn').onclick = () => document.getElementById('mobileMenuOverlay').classList.add('show');
    document.getElementById('mobileMenuClose').onclick = () => document.getElementById('mobileMenuOverlay').classList.remove('show');
    document.getElementById('soundIndicator').onclick = () => { playSound(); };
    
    renderGames(); renderFeatured(); initCategories(); initTicker(); initInfoPanel();
</script>
</body>
</html>
