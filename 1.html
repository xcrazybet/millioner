<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>⚽ Xlodon Bet - Live Football Betting 2026</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        :root {
            --primary: #00ff9d; --secondary: #ff9800; --danger: #ff4757; --success: #4caf50;
            --bg: #0a0f1a; --surface: #111827; --surface-light: #1a2332; --text: #ffffff;
            --text-dim: #94a3b8; --border: #1e293b;
        }

        body { background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 70px; }
        .header { background: var(--surface); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--primary); position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 18px; font-weight: 700; color: var(--primary); }
        .balance-display { background: var(--surface-light); padding: 6px 12px; border-radius: 20px; border: 1px solid var(--primary); color: var(--primary); font-weight: 600; }

        .main-layout { display: grid; grid-template-columns: 1fr 380px; gap: 16px; max-width: 1400px; margin: 16px auto; padding: 0 16px; }
        .market-tabs { background: var(--surface); border-radius: 16px; padding: 16px; margin-bottom: 16px; }
        
        .date-selector { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 15px; }
        #fixtureDate { background: var(--surface-light); border: 1px solid var(--border); padding: 8px; border-radius: 8px; color: #fff; }

        .matches-grid { display: flex; flex-direction: column; gap: 12px; }
        .match-card { background: var(--surface-light); border-radius: 12px; padding: 15px; border: 1px solid var(--border); }
        .teams { display: flex; justify-content: space-between; align-items: center; margin: 10px 0; }
        .score { font-size: 20px; font-weight: 800; color: var(--primary); }

        .market-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
        .market-btn { background: var(--surface); border: 1px solid var(--border); padding: 8px; border-radius: 8px; text-align: center; cursor: pointer; transition: 0.2s; }
        .market-btn:hover { border-color: var(--primary); background: #1f2937; }
        .market-odds { color: var(--primary); font-weight: bold; display: block; }

        .betslip-section { background: var(--surface); border-radius: 20px; padding: 16px; border: 2px solid var(--primary); position: sticky; top: 80px; height: fit-content; }
        .betslip-item { background: var(--surface-light); padding: 10px; border-radius: 8px; margin-bottom: 10px; border-left: 3px solid var(--primary); }
        
        .place-bet-btn { width: 100%; padding: 15px; background: var(--primary); border: none; border-radius: 30px; font-weight: 800; cursor: pointer; margin-top: 10px; }
        .place-bet-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        .toast { position: fixed; bottom: 80px; right: 20px; background: var(--surface-light); border-left: 4px solid var(--primary); padding: 12px 20px; border-radius: 8px; z-index: 1000; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }

        @media (max-width: 900px) { .main-layout { grid-template-columns: 1fr; } .betslip-section { position: relative; top: 0; } }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">⚽ XLODON BET 2026</div>
        <div class="balance-display"><i class="fas fa-wallet"></i> $<span id="balance">0.00</span></div>
    </header>

    <div class="main-layout">
        <div class="left-column">
            <div class="market-tabs">
                <div class="date-selector">
                    <input type="date" id="fixtureDate" value="2026-06-15">
                    <button class="market-btn" onclick="fetch2026Fixtures()" style="color: var(--primary)">REFRESH LIST</button>
                </div>
                <div id="matchesContainer" class="matches-grid">
                    <p style="text-align: center; padding: 20px;">Loading fixtures...</p>
                </div>
            </div>
        </div>

        <div class="betslip-section">
            <h4>BET SLIP</h4>
            <div id="betslipItems" style="margin: 15px 0;">
                <p style="color: var(--text-dim); font-size: 13px;">Select odds to start betting.</p>
            </div>
            <div style="border-top: 1px solid var(--border); padding-top: 10px;">
                <div style="display: flex; justify-content: space-between; margin-bottom: 5px;">
                    <span>Stake ($)</span>
                    <input type="number" id="stake" value="10" style="width: 60px; background: none; border: 1px solid var(--border); color: #fff; text-align: right;">
                </div>
                <div style="display: flex; justify-content: space-between; font-weight: bold;">
                    <span>Return:</span>
                    <span id="potentialReturn" style="color: var(--primary);">$0.00</span>
                </div>
                <button id="placeBetBtn" class="place-bet-btn" onclick="handlePlaceBet()" disabled>PLACE BET</button>
            </div>
        </div>
    </div>

    <div id="toastContainer"></div>

    <script>
        // FIREBASE INITIALIZATION
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        const API_TOKEN = "DkFdWG9jFZvH8XSEgLrRfGwczABWVg5rlV25GvIRyN06zdPsOI48Nsv9Wooy";
        let currentMatches = [];
        let selectedBet = null;
        let userBalance = 0;

        // AUTH & BALANCE
        auth.onAuthStateChanged(user => {
            if (user) {
                db.collection("wallets").doc(user.uid).onSnapshot(doc => {
                    userBalance = doc.data()?.balance || 0;
                    document.getElementById('balance').textContent = userBalance.toFixed(2);
                });
                fetch2026Fixtures();
            } else {
                window.location.href = "https://xcrazybet.github.io/millioner/login.html";
            }
        });

        // FETCH REAL 2026 DATA
        async function fetch2026Fixtures() {
            const date = document.getElementById('fixtureDate').value;
            const container = document.getElementById('matchesContainer');
            
            try {
                const response = await fetch(`https://api.sportmonks.com/v3/football/fixtures/date/${date}?api_token=${API_TOKEN}&include=participants;scores;league`);
                const result = await response.json();
                
                if (!result.data || result.data.length === 0) {
                    container.innerHTML = "<p style='text-align:center'>No matches scheduled for this date.</p>";
                    return;
                }

                currentMatches = result.data;
                container.innerHTML = result.data.map(m => {
                    const home = m.participants.find(p => p.meta.location === 'home') || {name: "Home"};
                    const away = m.participants.find(p => p.meta.location === 'away') || {name: "Away"};
                    const hScore = m.scores?.find(s => s.description === 'CURRENT' && s.score.participant === 'home')?.score.goals || 0;
                    const aScore = m.scores?.find(s => s.description === 'CURRENT' && s.score.participant === 'away')?.score.goals || 0;

                    // Mock Odds Generation for UI
                    const o1 = (1.5 + Math.random()).toFixed(2);
                    const oX = (3.0 + Math.random()).toFixed(2);
                    const o2 = (2.5 + Math.random()).toFixed(2);

                    return `
                        <div class="match-card">
                            <div style="font-size: 11px; color: var(--primary)">${m.league?.name || 'World Cup'}</div>
                            <div class="teams">
                                <span>${home.name}</span>
                                <span class="score">${hScore} - ${aScore}</span>
                                <span>${away.name}</span>
                            </div>
                            <div class="market-grid">
                                <div class="market-btn" onclick="selectOdd('${m.id}', '1', ${o1}, '${home.name}')">
                                    <small>1</small><span class="market-odds">${o1}</span>
                                </div>
                                <div class="market-btn" onclick="selectOdd('${m.id}', 'X', ${oX}, 'Draw')">
                                    <small>X</small><span class="market-odds">${oX}</span>
                                </div>
                                <div class="market-btn" onclick="selectOdd('${m.id}', '2', ${o2}, '${away.name}')">
                                    <small>2</small><span class="market-odds">${o2}</span>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (e) {
                container.innerHTML = "<p style='color:red'>Failed to connect to Sportmonks API.</p>";
            }
        }

        function selectOdd(matchId, pick, odds, teamName) {
            const match = currentMatches.find(m => m.id.toString() === matchId.toString());
            selectedBet = { matchId, pick, odds, matchName: `${match.name}` };
            
            document.getElementById('betslipItems').innerHTML = `
                <div class="betslip-item">
                    <div style="font-weight:bold">${selectedBet.matchName}</div>
                    <div style="display:flex; justify-content:space-between; color:var(--primary)">
                        <span>Pick: ${pick} (${teamName})</span>
                        <span>@ ${odds}</span>
                    </div>
                </div>
            `;
            document.getElementById('placeBetBtn').disabled = false;
            updateReturn();
        }

        function updateReturn() {
            const stake = document.getElementById('stake').value;
            if(selectedBet) {
                const ret = (stake * selectedBet.odds).toFixed(2);
                document.getElementById('potentialReturn').textContent = `$${ret}`;
            }
        }

        document.getElementById('stake').addEventListener('input', updateReturn);

        async function handlePlaceBet() {
            const stake = parseFloat(document.getElementById('stake').value);
            if (stake > userBalance) {
                showToast("Insufficient Balance!", "danger");
                return;
            }

            const btn = document.getElementById('placeBetBtn');
            btn.disabled = true;
            btn.textContent = "PROCESSING...";

            try {
                const user = auth.currentUser;
                // Update Balance
                await db.collection("wallets").doc(user.uid).update({
                    balance: firebase.firestore.FieldValue.increment(-stake)
                });

                // Save Bet
                await db.collection("bets").add({
                    userId: user.uid,
                    matchName: selectedBet.matchName,
                    pick: selectedBet.pick,
                    odds: selectedBet.odds,
                    stake: stake,
                    status: "OPEN",
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                showToast("Bet Placed Successfully!", "success");
                document.getElementById('betslipItems').innerHTML = "<p>Select odds to start betting.</p>";
                selectedBet = null;
            } catch (err) {
                showToast("Error placing bet", "danger");
            } finally {
                btn.textContent = "PLACE BET";
                btn.disabled = false;
            }
        }

        function showToast(msg, type) {
            const t = document.createElement('div');
            t.className = 'toast';
            t.style.borderColor = type === 'success' ? 'var(--success)' : 'var(--danger)';
            t.textContent = msg;
            document.getElementById('toastContainer').appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }
    </script>
</body>
</html>
