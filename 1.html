<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XLODON BET - Live Sports Betting Platform</title>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: linear-gradient(135deg, #0a0a2a 0%, #1a1a3a 100%); font-family: 'Segoe UI', sans-serif; }
        .bet-card { background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); transition: all 0.3s ease; }
        .bet-card:hover { transform: translateY(-2px); background: rgba(255,255,255,0.08); }
        .odds-button { background: linear-gradient(135deg, #ff6b35, #f7931e); transition: all 0.2s ease; }
        .odds-button:hover { transform: scale(1.05); }
        .live-badge { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .loading-spinner { border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top: 3px solid #ff6b35; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .toast-notification { position: fixed; bottom: 20px; right: 20px; z-index: 1000; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .tab-active { border-bottom: 3px solid #ff6b35; color: #ff6b35 !important; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(255,255,255,0.1); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #ff6b35; border-radius: 10px; }
        .debug-panel { background: #1a1a2e; border-left: 3px solid #ff6b35; }
    </style>
</head>
<body>

<!-- Navigation -->
<nav class="bg-black/50 backdrop-blur-md border-b border-white/10 sticky top-0 z-50">
    <div class="container mx-auto px-4 py-3">
        <div class="flex justify-between items-center flex-wrap gap-3">
            <div class="flex items-center space-x-3">
                <i class="fas fa-trophy text-3xl text-orange-500"></i>
                <span class="text-2xl font-bold bg-gradient-to-r from-orange-500 to-red-500 bg-clip-text text-transparent">XLODON BET</span>
            </div>
            
            <div class="flex flex-wrap gap-3">
                <button onclick="showTab('live')" id="tab-live-btn" class="tab-btn px-4 py-2 rounded-lg transition tab-active text-white">Live</button>
                <button onclick="showTab('upcoming')" id="tab-upcoming-btn" class="tab-btn px-4 py-2 rounded-lg transition text-gray-300">Upcoming</button>
                <button onclick="showTab('leagues')" id="tab-leagues-btn" class="tab-btn px-4 py-2 rounded-lg transition text-gray-300">Leagues</button>
                <button onclick="showTab('mybets')" id="tab-mybets-btn" class="tab-btn px-4 py-2 rounded-lg transition text-gray-300">My Bets</button>
            </div>
            
            <div class="flex items-center space-x-4">
                <div id="userInfo" class="hidden">
                    <div class="flex items-center space-x-3">
                        <div class="text-right">
                            <div id="userName" class="text-white text-sm font-semibold"></div>
                            <div class="text-orange-400 text-xs">Balance: $<span id="userBalance">0</span></div>
                        </div>
                        <i class="fas fa-user-circle text-3xl text-gray-400"></i>
                    </div>
                </div>
                <button onclick="toggleAuth()" id="authBtn" class="bg-gradient-to-r from-orange-500 to-red-500 px-5 py-2 rounded-full text-white font-semibold hover:shadow-lg transition">
                    Login
                </button>
            </div>
        </div>
    </div>
</nav>

<!-- Main Content -->
<div class="container mx-auto px-4 py-8">
    <!-- Loading -->
    <div id="loadingScreen" class="fixed inset-0 bg-black/80 flex items-center justify-center z-50">
        <div class="text-center">
            <div class="loading-spinner mx-auto mb-4"></div>
            <p class="text-white text-lg">Loading matches from Sportmonks API...</p>
            <p class="text-gray-400 text-sm mt-2">Fetching live data...</p>
        </div>
    </div>
    
    <!-- Live Tab -->
    <div id="liveTab" class="tab-content">
        <div class="grid lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2">
                <div class="flex justify-between items-center mb-6 flex-wrap gap-3">
                    <h2 class="text-2xl font-bold text-white">
                        <i class="fas fa-circle text-red-500 live-badge mr-2"></i>
                        Live Matches
                    </h2>
                    <div class="flex gap-3">
                        <button onclick="refreshData()" class="bg-white/10 hover:bg-white/20 text-white px-4 py-2 rounded-lg transition">
                            <i class="fas fa-sync-alt mr-2"></i>Refresh
                        </button>
                        <div class="text-sm text-gray-400 bg-black/30 px-3 py-2 rounded-lg">
                            <i class="fas fa-clock mr-1"></i>
                            Updates every 10 sec
                        </div>
                    </div>
                </div>
                <div id="liveMatches" class="space-y-4">
                    <!-- Live matches will appear here -->
                </div>
            </div>
            
            <div class="lg:col-span-1">
                <div class="bet-card p-6 sticky top-20">
                    <h3 class="text-xl font-bold text-white mb-4">
                        <i class="fas fa-receipt mr-2 text-orange-500"></i>
                        Bet Slip
                    </h3>
                    <div id="betSlip" class="space-y-3 max-h-[500px] overflow-y-auto">
                        <p class="text-gray-400 text-center py-8">No bets selected. Click on odds to add.</p>
                    </div>
                    <div id="betSlipTotal" class="hidden mt-4 pt-4 border-t border-white/10">
                        <div class="flex justify-between text-white mb-3">
                            <span>Total Stake:</span>
                            <span class="font-bold">$<span id="totalStake">0</span></span>
                        </div>
                        <div class="flex justify-between text-white mb-3">
                            <span>Total Odds:</span>
                            <span class="font-bold text-yellow-400"><span id="totalOdds">0</span></span>
                        </div>
                        <div class="flex justify-between text-white mb-3">
                            <span>Potential Win:</span>
                            <span class="font-bold text-green-400">$<span id="potentialWin">0</span></span>
                        </div>
                        <input type="number" id="stakeInput" placeholder="Enter stake amount (min $1)" class="w-full bg-white/10 border border-white/20 rounded-lg px-4 py-2 text-white mb-3 focus:outline-none focus:border-orange-500">
                        <button onclick="placeBet()" class="w-full odds-button text-white font-bold py-3 rounded-lg">
                            Place Bet
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Upcoming Tab -->
    <div id="upcomingTab" class="tab-content hidden">
        <h2 class="text-2xl font-bold text-white mb-6">
            <i class="fas fa-calendar-alt mr-2 text-orange-500"></i>
            Upcoming Matches (Next 7 Days)
        </h2>
        <div id="upcomingMatches" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
        </div>
    </div>
    
    <!-- Leagues Tab -->
    <div id="leaguesTab" class="tab-content hidden">
        <h2 class="text-2xl font-bold text-white mb-6">
            <i class="fas fa-trophy mr-2 text-orange-500"></i>
            Football Leagues
        </h2>
        <div id="leaguesList" class="grid md:grid-cols-2 lg:grid-cols-3 gap-4">
        </div>
    </div>
    
    <!-- My Bets Tab -->
    <div id="mybetsTab" class="tab-content hidden">
        <h2 class="text-2xl font-bold text-white mb-6">
            <i class="fas fa-history mr-2 text-orange-500"></i>
            My Betting History
        </h2>
        <div id="myBetsList" class="space-y-4">
        </div>
    </div>
</div>

<script>
    // ==================== FIREBASE CONFIG ====================
    const firebaseConfig = {
        apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
        authDomain: "x-bet-prod-jd.firebaseapp.com",
        projectId: "x-bet-prod-jd",
        storageBucket: "x-bet-prod-jd.firebasestorage.app",
        messagingSenderId: "499334334535",
        appId: "1:499334334535:web:bebc1bf817e24d9e3c4962",
        measurementId: "G-PTV4XMYQ6P"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
    
    // ==================== SPORTMONKS API ====================
    const API_TOKEN = 'DkFdWG9jFZvH8XSEgLrRfGwczABWVg5rlV25GvIRyN06zdPsOI48Nsv9Wooy';
    const BASE_URL = 'https://api.sportmonks.com/v3';
    
    // ==================== GLOBAL ====================
    let currentUser = null;
    let betSlip = [];
    let updateInterval = null;
    let allFixtures = [];
    
    // ==================== DIRECT API TESTS ====================
    async function testAPIConnection() {
        console.log('Testing API connection...');
        try {
            // Test 1: Get leagues
            const leaguesRes = await axios.get(`${BASE_URL}/football/leagues`, {
                params: { api_token: API_TOKEN, include: 'season' }
            });
            console.log('✅ Leagues API working:', leaguesRes.data.data?.length || 0, 'leagues found');
            
            // Test 2: Get live matches
            const liveRes = await axios.get(`${BASE_URL}/football/livescores/inplay`, {
                params: { api_token: API_TOKEN, include: 'participants;scores;league' }
            });
            console.log('✅ Live API working:', liveRes.data.data?.length || 0, 'live matches found');
            
            // Test 3: Get fixtures
            const fixturesRes = await axios.get(`${BASE_URL}/football/fixtures`, {
                params: { api_token: API_TOKEN, include: 'participants;league', per_page: 20 }
            });
            console.log('✅ Fixtures API working:', fixturesRes.data.data?.length || 0, 'fixtures found');
            
            return true;
        } catch (error) {
            console.error('API Test Failed:', error.response?.data || error.message);
            return false;
        }
    }
    
    // ==================== FETCH FUNCTIONS ====================
    async function fetchLiveMatches() {
        try {
            const response = await axios.get(`${BASE_URL}/football/livescores/inplay`, {
                params: {
                    api_token: API_TOKEN,
                    include: 'participants;scores;league;venue'
                }
            });
            
            if (response.data && response.data.data) {
                console.log(`Found ${response.data.data.length} live matches`);
                return response.data.data;
            }
            return [];
        } catch (error) {
            console.error('Error fetching live matches:', error.response?.data || error.message);
            return [];
        }
    }
    
    async function fetchUpcomingFixtures() {
        try {
            const response = await axios.get(`${BASE_URL}/football/fixtures`, {
                params: {
                    api_token: API_TOKEN,
                    include: 'participants;league',
                    per_page: 30,
                    sort: 'starting_at'
                }
            });
            
            if (response.data && response.data.data) {
                // Filter for upcoming matches (not started)
                const now = new Date();
                const upcoming = response.data.data.filter(fixture => {
                    const startTime = new Date(fixture.starting_at);
                    return startTime > now && fixture.state_id === 1; // State 1 = Not started
                });
                console.log(`Found ${upcoming.length} upcoming fixtures`);
                return upcoming;
            }
            return [];
        } catch (error) {
            console.error('Error fetching fixtures:', error.response?.data || error.message);
            return [];
        }
    }
    
    async function fetchLeagues() {
        try {
            const response = await axios.get(`${BASE_URL}/football/leagues`, {
                params: {
                    api_token: API_TOKEN,
                    include: 'season;currentSeason',
                    per_page: 30
                }
            });
            
            if (response.data && response.data.data) {
                console.log(`Found ${response.data.data.length} leagues`);
                return response.data.data;
            }
            return [];
        } catch (error) {
            console.error('Error fetching leagues:', error.response?.data || error.message);
            return [];
        }
    }
    
    async function fetchOddsForFixture(fixtureId) {
        try {
            const response = await axios.get(`${BASE_URL}/football/odds/fixture/${fixtureId}`, {
                params: {
                    api_token: API_TOKEN,
                    include: 'market;bookmaker'
                }
            });
            return response.data.data || [];
        } catch (error) {
            return [];
        }
    }
    
    // ==================== RENDER FUNCTIONS ====================
    function renderLiveMatches(matches) {
        const container = document.getElementById('liveMatches');
        
        if (!matches || matches.length === 0) {
            container.innerHTML = `
                <div class="bet-card p-12 text-center">
                    <i class="fas fa-futbol text-5xl text-gray-600 mb-4"></i>
                    <p class="text-gray-400 text-lg">No live matches at the moment</p>
                    <p class="text-gray-500 text-sm mt-2">Check back during match hours</p>
                    <button onclick="showTab('upcoming')" class="mt-4 text-orange-400 hover:text-orange-300">View upcoming matches →</button>
                </div>
            `;
            return;
        }
        
        container.innerHTML = matches.map(match => {
            const participants = match.participants || [];
            const homeTeam = participants.find(p => p.meta?.location === 'home') || participants[0];
            const awayTeam = participants.find(p => p.meta?.location === 'away') || participants[1];
            const scores = match.scores || {};
            const homeScore = scores.score?.find(s => s.description === 'CURRENT')?.score?.home || 
                            scores.home_score || 
                            match.score?.home || 0;
            const awayScore = scores.score?.find(s => s.description === 'CURRENT')?.score?.away || 
                            scores.away_score || 
                            match.score?.away || 0;
            
            // Sample odds (in production, fetch from odds endpoint)
            const odds = {
                home: (Math.random() * 2 + 1.5).toFixed(2),
                draw: (Math.random() * 1 + 3).toFixed(2),
                away: (Math.random() * 2 + 1.8).toFixed(2)
            };
            
            return `
                <div class="bet-card p-5" data-fixture-id="${match.id}">
                    <div class="flex justify-between items-center mb-3">
                        <span class="text-xs text-orange-400 bg-orange-500/20 px-2 py-1 rounded">
                            <i class="fas fa-futbol mr-1"></i>${match.league?.name || 'Football'}
                        </span>
                        <span class="text-xs text-red-400 flex items-center">
                            <i class="fas fa-circle text-red-500 live-badge mr-1" style="font-size: 8px;"></i>
                            LIVE ${match.time?.minute ? `- ${match.time.minute}'` : ''}
                        </span>
                    </div>
                    
                    <div class="flex justify-between items-center mb-4">
                        <div class="text-center flex-1">
                            <div class="text-white font-semibold text-base">${homeTeam?.name || 'Home Team'}</div>
                            <div class="text-3xl font-bold text-white mt-1">${homeScore}</div>
                        </div>
                        <div class="text-gray-400 font-bold px-4 text-xl">VS</div>
                        <div class="text-center flex-1">
                            <div class="text-white font-semibold text-base">${awayTeam?.name || 'Away Team'}</div>
                            <div class="text-3xl font-bold text-white mt-1">${awayScore}</div>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-3 gap-2 mt-3">
                        <button onclick="addToBetSlip(${match.id}, '${homeTeam?.name?.replace(/'/g, "\\'") || 'Home'}', '${awayTeam?.name?.replace(/'/g, "\\'") || 'Away'}', 'home', ${odds.home})" 
                                class="odds-button text-white py-2 rounded-lg text-sm font-semibold">
                            ${homeTeam?.name?.substring(0, 12) || 'Home'}<br><span class="text-lg">${odds.home}</span>
                        </button>
                        <button onclick="addToBetSlip(${match.id}, '${homeTeam?.name?.replace(/'/g, "\\'") || 'Home'}', '${awayTeam?.name?.replace(/'/g, "\\'") || 'Away'}', 'draw', ${odds.draw})" 
                                class="odds-button text-white py-2 rounded-lg text-sm font-semibold">
                            Draw<br><span class="text-lg">${odds.draw}</span>
                        </button>
                        <button onclick="addToBetSlip(${match.id}, '${homeTeam?.name?.replace(/'/g, "\\'") || 'Home'}', '${awayTeam?.name?.replace(/'/g, "\\'") || 'Away'}', 'away', ${odds.away})" 
                                class="odds-button text-white py-2 rounded-lg text-sm font-semibold">
                            ${awayTeam?.name?.substring(0, 12) || 'Away'}<br><span class="text-lg">${odds.away}</span>
                        </button>
                    </div>
                    
                    <div class="mt-3 text-xs text-gray-400 text-center">
                        <i class="fas fa-map-marker-alt mr-1"></i>${match.venue?.name || 'Venue TBD'}
                    </div>
                </div>
            `;
        }).join('');
    }
    
    function renderUpcomingMatches(matches) {
        const container = document.getElementById('upcomingMatches');
        
        if (!matches || matches.length === 0) {
            container.innerHTML = '<div class="col-span-full bet-card p-8 text-center"><p class="text-gray-400">No upcoming matches found</p></div>';
            return;
        }
        
        container.innerHTML = matches.map(match => {
            const participants = match.participants || [];
            const homeTeam = participants.find(p => p.meta?.location === 'home') || participants[0];
            const awayTeam = participants.find(p => p.meta?.location === 'away') || participants[1];
            const matchDate = new Date(match.starting_at);
            
            return `
                <div class="bet-card p-5">
                    <div class="text-xs text-gray-400 mb-2 flex justify-between">
                        <span>${match.league?.name || 'Football'}</span>
                        <span>${matchDate.toLocaleDateString()} ${matchDate.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>
                    </div>
                    <div class="flex justify-between items-center mb-3">
                        <div class="text-white font-semibold text-center flex-1">${homeTeam?.name || 'Team A'}</div>
                        <div class="text-gray-400 px-3">VS</div>
                        <div class="text-white font-semibold text-center flex-1">${awayTeam?.name || 'Team B'}</div>
                    </div>
                    <button onclick="showNotification('Upcoming match - betting opens soon!', 'info')" 
                            class="w-full bg-white/10 text-white py-2 rounded-lg text-sm hover:bg-white/20 transition mt-3">
                        <i class="fas fa-bell mr-2"></i>Notify when live
                    </button>
                </div>
            `;
        }).join('');
    }
    
    function renderLeagues(leagues) {
        const container = document.getElementById('leaguesList');
        
        if (!leagues || leagues.length === 0) {
            container.innerHTML = '<div class="col-span-full bet-card p-8 text-center"><p class="text-gray-400">No leagues found</p></div>';
            return;
        }
        
        container.innerHTML = leagues.slice(0, 24).map(league => `
            <div class="bet-card p-4 hover:bg-white/10 cursor-pointer transition" onclick="showNotification('${league.name} details coming soon', 'info')">
                <div class="flex items-center space-x-3">
                    ${league.logo ? `<img src="${league.logo}" class="w-10 h-10 object-contain" onerror="this.style.display='none'">` : '<i class="fas fa-trophy text-2xl text-orange-500"></i>'}
                    <div>
                        <div class="text-white font-semibold">${league.name}</div>
                        <div class="text-xs text-gray-400">${league.country?.name || 'International'}</div>
                    </div>
                </div>
            </div>
        `).join('');
    }
    
    function renderMyBets(bets) {
        const container = document.getElementById('myBetsList');
        if (!bets || bets.length === 0) {
            container.innerHTML = '<div class="bet-card p-8 text-center"><p class="text-gray-400">No bets placed yet</p><p class="text-sm text-gray-500 mt-2">Click on odds to start betting!</p></div>';
            return;
        }
        
        container.innerHTML = bets.map(bet => `
            <div class="bet-card p-5">
                <div class="flex justify-between items-start">
                    <div class="flex-1">
                        <div class="text-white font-semibold">${bet.matchName || 'Match'}</div>
                        <div class="text-sm text-orange-400">${bet.selection} @ ${bet.odds}</div>
                        <div class="text-xs text-gray-400">Stake: $${bet.stake}</div>
                    </div>
                    <div class="text-right">
                        <div class="text-${bet.status === 'WON' ? 'green' : bet.status === 'LOST' ? 'red' : 'yellow'}-400 font-bold">
                            ${bet.status || 'PENDING'}
                        </div>
                        ${bet.potentialWin ? `<div class="text-sm text-gray-400">Potential: $${bet.potentialWin}</div>` : ''}
                    </div>
                </div>
            </div>
        `).join('');
    }
    
    // ==================== BET SLIP ====================
    function addToBetSlip(fixtureId, homeTeam, awayTeam, selection, odds) {
        if (!currentUser) {
            showNotification('Please login to add bets', 'warning');
            toggleAuth();
            return;
        }
        
        const selectionText = selection === 'home' ? homeTeam : selection === 'away' ? awayTeam : 'Draw';
        
        betSlip.push({
            fixtureId,
            matchName: `${homeTeam} vs ${awayTeam}`,
            selection: selectionText,
            odds: parseFloat(odds),
            stake: 0
        });
        
        updateBetSlip();
        showNotification(`${selectionText} added to bet slip`, 'success');
    }
    
    function removeFromBetSlip(index) {
        betSlip.splice(index, 1);
        updateBetSlip();
    }
    
    function updateBetSlip() {
        const container = document.getElementById('betSlip');
        const totalDiv = document.getElementById('betSlipTotal');
        
        if (betSlip.length === 0) {
            container.innerHTML = '<p class="text-gray-400 text-center py-8">No bets selected. Click on odds to add.</p>';
            totalDiv.classList.add('hidden');
            return;
        }
        
        container.innerHTML = betSlip.map((bet, index) => `
            <div class="bg-white/5 rounded-lg p-3 relative">
                <button onclick="removeFromBetSlip(${index})" class="absolute top-2 right-2 text-gray-400 hover:text-red-400">
                    <i class="fas fa-times"></i>
                </button>
                <div class="text-white text-sm font-semibold">${bet.matchName}</div>
                <div class="text-orange-400 text-sm">${bet.selection} @ ${bet.odds}</div>
                <div class="text-xs text-gray-400">Potential: $${(bet.stake * bet.odds).toFixed(2)}</div>
            </div>
        `).join('');
        
        totalDiv.classList.remove('hidden');
        calculateTotals();
    }
    
    function calculateTotals() {
        const stake = parseFloat(document.getElementById('stakeInput')?.value) || 0;
        const totalOdds = betSlip.reduce((acc, bet) => acc * bet.odds, 1);
        const potentialWin = stake * totalOdds;
        
        document.getElementById('totalStake').innerText = stake.toFixed(2);
        document.getElementById('totalOdds').innerText = totalOdds.toFixed(2);
        document.getElementById('potentialWin').innerText = potentialWin.toFixed(2);
        
        betSlip = betSlip.map(bet => ({ ...bet, stake: stake / betSlip.length }));
    }
    
    async function placeBet() {
        if (!currentUser) {
            showNotification('Please login to place bets', 'warning');
            return;
        }
        
        const stake = parseFloat(document.getElementById('stakeInput').value);
        if (!stake || stake < 1) {
            showNotification('Please enter a valid stake amount (minimum $1)', 'error');
            return;
        }
        
        if (betSlip.length === 0) {
            showNotification('Please add bets to your slip', 'warning');
            return;
        }
        
        const totalOdds = betSlip.reduce((acc, bet) => acc * bet.odds, 1);
        const potentialWin = stake * totalOdds;
        
        try {
            const userRef = db.collection('users').doc(currentUser.uid);
            const userDoc = await userRef.get();
            const currentBalance = userDoc.data()?.balance || 0;
            
            if (currentBalance < stake) {
                showNotification('Insufficient balance! Please deposit funds.', 'error');
                return;
            }
            
            const betRecord = {
                userId: currentUser.uid,
                userName: currentUser.email,
                bets: betSlip.map(bet => ({
                    fixtureId: bet.fixtureId,
                    matchName: bet.matchName,
                    selection: bet.selection,
                    odds: bet.odds
                })),
                totalOdds: totalOdds,
                totalStake: stake,
                potentialWin: potentialWin,
                status: 'PENDING',
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            };
            
            await db.collection('bets').add(betRecord);
            await userRef.update({ balance: firebase.firestore.FieldValue.increment(-stake) });
            
            await db.collection('transactions').add({
                userId: currentUser.uid,
                type: 'BET_PLACED',
                amount: stake,
                balanceAfter: currentBalance - stake,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
            
            showNotification(`Bet placed! Potential win: $${potentialWin.toFixed(2)}`, 'success');
            
            betSlip = [];
            updateBetSlip();
            document.getElementById('stakeInput').value = '';
            await loadUserData();
            
        } catch (error) {
            console.error('Error placing bet:', error);
            showNotification('Error placing bet: ' + error.message, 'error');
        }
    }
    
    // ==================== AUTH ====================
    function toggleAuth() {
        if (currentUser) {
            auth.signOut();
        } else {
            const email = prompt('Enter your email:');
            const password = prompt('Enter password (min 6 chars):');
            
            if (email && password) {
                auth.signInWithEmailAndPassword(email, password).catch(() => {
                    auth.createUserWithEmailAndPassword(email, password).then(async (userCredential) => {
                        await db.collection('users').doc(userCredential.user.uid).set({
                            email: email,
                            balance: 100,
                            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                            totalBets: 0,
                            totalWinnings: 0
                        });
                        showNotification('Account created! $100 bonus added!', 'success');
                    });
                });
            }
        }
    }
    
    async function loadUserData() {
        if (currentUser) {
            const userDoc = await db.collection('users').doc(currentUser.uid).get();
            const userData = userDoc.data();
            document.getElementById('userBalance').innerText = (userData?.balance || 0).toFixed(2);
            document.getElementById('userName').innerText = currentUser.email.split('@')[0];
            document.getElementById('userInfo').classList.remove('hidden');
            document.getElementById('authBtn').innerHTML = 'Logout';
            
            const betsSnapshot = await db.collection('bets').where('userId', '==', currentUser.uid).orderBy('createdAt', 'desc').limit(20).get();
            const userBets = betsSnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            renderMyBets(userBets);
        } else {
            document.getElementById('userInfo').classList.add('hidden');
            document.getElementById('authBtn').innerHTML = 'Login';
            renderMyBets([]);
        }
    }
    
    // ==================== REFRESH ====================
    async function refreshData() {
        console.log('Refreshing data...');
        try {
            const [liveMatches, upcomingMatches, leagues] = await Promise.all([
                fetchLiveMatches(),
                fetchUpcomingFixtures(),
                fetchLeagues()
            ]);
            
            renderLiveMatches(liveMatches);
            renderUpcomingMatches(upcomingMatches);
            renderLeagues(leagues);
            
            console.log('Data refresh complete');
        } catch (error) {
            console.error('Refresh error:', error);
        }
    }
    
    async function startAutoRefresh() {
        await refreshData();
        if (updateInterval) clearInterval(updateInterval);
        updateInterval = setInterval(refreshData, 10000);
    }
    
    // ==================== UI HELPERS ====================
    function showTab(tabName) {
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.add('hidden'));
        document.getElementById(`${tabName}Tab`).classList.remove('hidden');
        
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.remove('tab-active');
            btn.classList.add('text-gray-300');
        });
        document.getElementById(`tab-${tabName}-btn`).classList.add('tab-active');
        document.getElementById(`tab-${tabName}-btn`).classList.remove('text-gray-300');
    }
    
    function showNotification(message, type = 'info') {
        const colors = { success: 'bg-green-500', error: 'bg-red-500', warning: 'bg-yellow-500', info: 'bg-blue-500' };
        const icons = { success: 'check-circle', error: 'exclamation-circle', warning: 'exclamation-triangle', info: 'info-circle' };
        
        const notification = document.createElement('div');
        notification.className = `toast-notification ${colors[type]} text-white px-6 py-3 rounded-lg shadow-lg z-50`;
        notification.innerHTML = `<div class="flex items-center space-x-3"><i class="fas fa-${icons[type]}"></i><span>${message}</span></div>`;
        document.body.appendChild(notification);
        setTimeout(() => notification.remove(), 3000);
    }
    
    // ==================== INIT ====================
    document.getElementById('stakeInput')?.addEventListener('input', calculateTotals);
    
    auth.onAuthStateChanged(async (user) => {
        currentUser = user;
        await loadUserData();
    });
    
    // Test API and start
    window.addEventListener('load', async () => {
        document.getElementById('loadingScreen').style.display = 'flex';
        const apiWorking = await testAPIConnection();
        if (apiWorking) {
            await startAutoRefresh();
        } else {
            document.getElementById('liveMatches').innerHTML = `
                <div class="bet-card p-8 text-center">
                    <i class="fas fa-exclamation-triangle text-4xl text-yellow-500 mb-3"></i>
                    <p class="text-white text-lg">API Connection Issue</p>
                    <p class="text-gray-400 text-sm mt-2">Please check your API token and internet connection</p>
                    <button onclick="location.reload()" class="mt-4 bg-orange-500 text-white px-4 py-2 rounded-lg">Retry</button>
                </div>
            `;
        }
        setTimeout(() => {
            document.getElementById('loadingScreen').style.display = 'none';
        }, 2000);
    });
    
    // Expose functions globally
    window.addToBetSlip = addToBetSlip;
    window.removeFromBetSlip = removeFromBetSlip;
    window.placeBet = placeBet;
    window.toggleAuth = toggleAuth;
    window.showTab = showTab;
    window.showNotification = showNotification;
    window.refreshData = refreshData;
</script>
</body>
</html>
