<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>⚽ Xlodon Bet - Professional Football Betting</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        :root {
            --primary: #00ff9d;
            --primary-dark: #00cc7d;
            --secondary: #ff9800;
            --danger: #ff4757;
            --success: #4caf50;
            --warning: #ffc107;
            --bg: #0a0f1a;
            --surface: #111827;
            --surface-light: #1a2332;
            --text: #ffffff;
            --text-dim: #94a3b8;
            --border: #1e293b;
            --gradient: linear-gradient(135deg, #00ff9d 0%, #00cc7d 100%);
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 70px;
        }

        .header {
            background: var(--surface);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 20px;
            font-weight: 800;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .balance-display {
            background: var(--surface-light);
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid var(--primary);
            color: var(--primary);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .deposit-btn {
            background: var(--primary);
            color: #000;
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 16px;
            max-width: 1400px;
            margin: 16px auto;
            padding: 0 16px;
        }

        .market-tabs, .open-bets-section, .history-section, .betslip-section {
            background: var(--surface);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid var(--border);
        }

        .betslip-section {
            border: 2px solid var(--primary);
            position: sticky;
            top: 80px;
        }

        .tabs-header, .league-filter {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 12px;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        .tab-btn, .league-btn {
            padding: 8px 20px;
            background: var(--surface-light);
            border: 1px solid var(--border);
            border-radius: 30px;
            color: var(--text);
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .tab-btn.active, .league-btn.active {
            background: var(--gradient);
            color: #000;
            border-color: var(--primary);
        }

        .refresh-btn {
            background: var(--surface-light);
            border: 1px solid var(--primary);
            border-radius: 30px;
            padding: 6px 12px;
            color: var(--primary);
            cursor: pointer;
            font-size: 12px;
        }

        .matches-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 550px;
            overflow-y: auto;
        }

        .match-card {
            background: var(--surface);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid var(--border);
            transition: all 0.3s;
        }

        .match-card:hover {
            transform: translateY(-2px);
            border-color: var(--primary);
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 12px;
            color: var(--text-dim);
        }

        .teams {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .team-name {
            font-weight: 700;
            font-size: 15px;
            flex: 1;
        }

        .team-name:first-child { text-align: left; }
        .team-name:last-child { text-align: right; }

        .score {
            font-size: 20px;
            font-weight: 800;
            color: var(--primary);
            margin: 0 16px;
        }

        .live-badge {
            background: var(--danger);
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 10px;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .market-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 12px;
        }

        .market-btn {
            padding: 10px;
            background: var(--surface-light);
            border: 1px solid var(--border);
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .market-btn:hover {
            background: var(--primary);
            transform: scale(1.05);
        }

        .market-btn:hover .market-odds {
            color: #000;
        }

        .market-name {
            font-size: 10px;
            color: var(--text-dim);
            margin-bottom: 4px;
        }

        .market-odds {
            font-weight: 800;
            color: var(--primary);
            font-size: 16px;
        }

        .betslip-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .betslip-tab {
            flex: 1;
            padding: 12px;
            background: var(--surface-light);
            border: none;
            border-radius: 30px;
            color: var(--text);
            cursor: pointer;
            font-weight: 600;
        }

        .betslip-tab.active {
            background: var(--gradient);
            color: #000;
        }

        .betslip-items {
            max-height: 280px;
            overflow-y: auto;
            margin-bottom: 16px;
        }

        .betslip-item {
            background: var(--surface-light);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 8px;
            border-left: 3px solid var(--primary);
        }

        .remove-bet {
            color: var(--danger);
            cursor: pointer;
            font-weight: bold;
        }

        .bet-input-group {
            display: flex;
            background: var(--surface-light);
            border-radius: 30px;
            padding: 0 16px;
            margin: 16px 0;
            border: 1px solid var(--border);
        }

        .bet-input {
            flex: 1;
            padding: 14px 0;
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 16px;
            outline: none;
        }

        .quick-bet-buttons {
            display: flex;
            gap: 8px;
            margin: 12px 0;
        }

        .quick-bet {
            flex: 1;
            padding: 8px;
            background: var(--surface-light);
            border: 1px solid var(--border);
            border-radius: 20px;
            color: var(--text);
            cursor: pointer;
            font-size: 12px;
        }

        .quick-bet:hover {
            background: var(--primary);
            color: #000;
        }

        .place-bet-btn {
            width: 100%;
            padding: 16px;
            background: var(--gradient);
            border: none;
            border-radius: 30px;
            color: #000;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            margin-top: 8px;
        }

        .place-bet-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .bet-card {
            background: var(--surface-light);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 8px;
            border-left: 4px solid var(--secondary);
        }

        .cashout-btn {
            padding: 6px 12px;
            background: var(--warning);
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--surface);
            display: flex;
            justify-content: space-around;
            padding: 10px 16px;
            border-top: 2px solid var(--primary);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-dim);
            font-size: 11px;
            gap: 4px;
            cursor: pointer;
        }

        .nav-item i { font-size: 22px; }
        .nav-item.active { color: var(--primary); }

        .toast-container {
            position: fixed;
            bottom: 80px;
            left: 16px;
            right: 16px;
            z-index: 1000;
        }

        .toast {
            padding: 14px 20px;
            background: var(--surface);
            border-radius: 30px;
            border-left: 4px solid var(--primary);
            margin-bottom: 8px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-dim);
        }

        .loading-spinner {
            border: 3px solid var(--surface-light);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--surface);
            border-radius: 20px;
            padding: 24px;
            max-width: 400px;
            width: 90%;
            border: 2px solid var(--primary);
        }

        .deposit-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 20px 0;
        }

        .deposit-option {
            padding: 16px;
            background: var(--surface-light);
            border-radius: 12px;
            cursor: pointer;
            text-align: center;
        }

        .deposit-option:hover {
            background: var(--primary);
            color: #000;
        }

        @media (max-width: 900px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">⚽ XLODON BET</div>
        <div class="balance-display">
            <i class="fas fa-wallet"></i>
            <span id="balance">0.00</span>
            <button class="deposit-btn" onclick="openDepositModal()">
                <i class="fas fa-plus"></i> Deposit
            </button>
        </div>
    </header>

    <div class="main-layout">
        <div class="left-column">
            <div class="market-tabs">
                <div class="tabs-header">
                    <button class="tab-btn active" data-market="all">📋 All Matches</button>
                    <button class="tab-btn" data-market="live">🔴 Live Now</button>
                    <button class="tab-btn" data-market="upcoming">📅 Upcoming</button>
                </div>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                    <div class="league-filter" id="leagueFilter">
                        <button class="league-btn active" data-league="all">🌍 ALL</button>
                        <button class="league-btn" data-league="1">🏆 WORLD CUP</button>
                        <button class="league-btn" data-league="2">🏴 PREMIER</button>
                        <button class="league-btn" data-league="3">🇪🇸 LA LIGA</button>
                        <button class="league-btn" data-league="4">🇩🇪 BUNDES</button>
                        <button class="league-btn" data-league="5">🇮🇹 SERIE A</button>
                    </div>
                    <button class="refresh-btn" onclick="loadMatches()">
                        <i class="fas fa-sync-alt"></i> Refresh
                    </button>
                </div>
                <div id="matchesContainer" class="matches-grid">
                    <div class="loading-spinner"></div>
                </div>
                <div class="last-update" id="lastUpdate" style="text-align: center; font-size: 11px; color: var(--text-dim); margin-top: 12px;"></div>
            </div>

            <div class="open-bets-section">
                <h3><i class="fas fa-ticket-alt"></i> My Open Bets</h3>
                <div id="openBetsContainer"><div class="loading-spinner"></div></div>
            </div>
        </div>

        <div class="betslip-section">
            <div class="betslip-tabs">
                <button class="betslip-tab active" data-type="single">🎯 Single Bet</button>
                <button class="betslip-tab" data-type="accumulator">📈 Accumulator</button>
            </div>
            <div style="display: flex; justify-content: space-between; margin-bottom: 16px;">
                <h4>Your Bet Slip</h4>
                <button id="clearSlip" style="background: none; border: none; color: var(--danger); cursor: pointer;">🗑️ Clear</button>
            </div>
            <div id="betslipItems" class="betslip-items">
                <div class="empty-state">➕ Click odds to add bets</div>
            </div>
            <div class="bet-input-group">
                <input type="number" id="betAmount" class="bet-input" value="10" min="1" step="1">
                <span>USD</span>
            </div>
            <div class="quick-bet-buttons">
                <button class="quick-bet" onclick="setQuickBet(10)">$10</button>
                <button class="quick-bet" onclick="setQuickBet(25)">$25</button>
                <button class="quick-bet" onclick="setQuickBet(50)">$50</button>
                <button class="quick-bet" onclick="setQuickBet(100)">$100</button>
            </div>
            <div style="display: flex; justify-content: space-between; margin: 12px 0;">
                <span>⚡ Total Odds:</span>
                <span id="totalOdds" style="color: var(--primary); font-size: 24px; font-weight: 800;">0.00</span>
            </div>
            <div style="margin: 12px 0; padding: 12px; background: var(--surface-light); border-radius: 12px;">
                <span>💰 Potential Win:</span>
                <span id="potentialReturn" style="float: right; font-weight: 800; color: var(--primary);">$0.00</span>
            </div>
            <button id="placeBetBtn" class="place-bet-btn" disabled>🚀 Place Bet</button>
        </div>
    </div>

    <div class="history-section">
        <h3><i class="fas fa-history"></i> Betting History</h3>
        <div id="historyContainer"><div class="loading-spinner"></div></div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item active" onclick="location.reload()"><i class="fas fa-futbol"></i><span>Football</span></div>
        <div class="nav-item" onclick="document.getElementById('openBetsContainer').scrollIntoView({behavior:'smooth'})"><i class="fas fa-ticket-alt"></i><span>My Bets</span></div>
        <div class="nav-item" onclick="window.location.href='https://xcrazybet.github.io/millioner/'"><i class="fas fa-home"></i><span>Home</span></div>
        <div class="nav-item" onclick="openDepositModal()"><i class="fas fa-wallet"></i><span>Wallet</span></div>
    </nav>

    <div id="toastContainer" class="toast-container"></div>

    <div id="depositModal" class="modal">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; margin-bottom: 20px;">
                <h3>Deposit Funds</h3>
                <span onclick="closeDepositModal()" style="cursor: pointer; font-size: 24px; color: var(--danger);">&times;</span>
            </div>
            <div class="deposit-options">
                <div class="deposit-option" onclick="deposit(20)">$20</div>
                <div class="deposit-option" onclick="deposit(50)">$50</div>
                <div class="deposit-option" onclick="deposit(100)">$100</div>
                <div class="deposit-option" onclick="deposit(500)">$500</div>
            </div>
            <div class="bet-input-group">
                <input type="number" id="customDeposit" class="bet-input" placeholder="Custom amount">
                <button class="deposit-btn" onclick="depositCustom()">Deposit</button>
            </div>
        </div>
    </div>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Demo match data (replace with API call to your backend proxy)
        const DEMO_MATCHES = [
            { id: "1", leagueId: "1", leagueName: "🏆 WORLD CUP", homeTeam: "Brazil", awayTeam: "France", homeScore: "2", awayScore: "1", isLive: true, status: "LIVE", odds: { home: 2.10, draw: 3.20, away: 3.50, over25: 1.85, under25: 1.95 } },
            { id: "2", leagueId: "1", leagueName: "🏆 WORLD CUP", homeTeam: "Argentina", awayTeam: "Germany", homeScore: "0", awayScore: "0", isLive: false, status: "19:45", odds: { home: 2.30, draw: 3.10, away: 3.20, over25: 1.90, under25: 1.90 } },
            { id: "3", leagueId: "2", leagueName: "🏴 PREMIER LEAGUE", homeTeam: "Manchester City", awayTeam: "Liverpool", homeScore: "3", awayScore: "2", isLive: true, status: "LIVE", odds: { home: 1.95, draw: 3.50, away: 3.80, over25: 1.70, under25: 2.10 } },
            { id: "4", leagueId: "2", leagueName: "🏴 PREMIER LEAGUE", homeTeam: "Arsenal", awayTeam: "Chelsea", homeScore: "-", awayScore: "-", isLive: false, status: "16:00", odds: { home: 2.15, draw: 3.30, away: 3.40, over25: 1.88, under25: 1.92 } },
            { id: "5", leagueId: "3", leagueName: "🇪🇸 LA LIGA", homeTeam: "Barcelona", awayTeam: "Real Madrid", homeScore: "1", awayScore: "1", isLive: true, status: "LIVE", odds: { home: 2.40, draw: 3.40, away: 2.80, over25: 1.82, under25: 1.98 } },
            { id: "6", leagueId: "4", leagueName: "🇩🇪 BUNDESLIGA", homeTeam: "Bayern Munich", awayTeam: "Borussia Dortmund", homeScore: "-", awayScore: "-", isLive: false, status: "18:30", odds: { home: 1.75, draw: 3.80, away: 4.20, over25: 1.65, under25: 2.20 } }
        ];

        let currentUser = null;
        let balance = 0;
        let selectedBets = [];
        let betType = 'single';
        let matches = [...DEMO_MATCHES];
        let currentLeague = 'all';
        let currentMarket = 'all';

        // Auth
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                currentUser = user;
                await loadBalance();
                await loadOpenBets();
                await loadHistory();
                setupRealtimeListeners();
                displayMatches();
                showToast('Welcome to Xlodon Bet!', 'success');
            } else {
                showToast('Please login to continue', 'error');
                setTimeout(() => {
                    window.location.href = 'https://xcrazybet.github.io/millioner/login.html';
                }, 2000);
            }
        });

        // Load matches from backend proxy (replace with your actual endpoint)
        async function loadMatches() {
            const container = document.getElementById('matchesContainer');
            container.innerHTML = '<div class="loading-spinner"></div>';
            
            try {
                // 🔒 SECURE: Call your backend proxy instead of direct API
                // const response = await fetch('https://your-backend.com/api/livescores');
                // const data = await response.json();
                // matches = processMatches(data);
                
                // For demo, using local data
                await new Promise(resolve => setTimeout(resolve, 500));
                matches = [...DEMO_MATCHES];
                document.getElementById('lastUpdate').textContent = `Updated: ${new Date().toLocaleTimeString()}`;
                displayMatches();
            } catch (error) {
                console.error('Error:', error);
                container.innerHTML = `<div class="empty-state">⚠️ Error loading matches. Using demo data.</div>`;
                displayMatches();
            }
        }

        function displayMatches() {
            let filtered = currentLeague === 'all' ? matches : matches.filter(m => m.leagueId === currentLeague);
            if (currentMarket === 'live') filtered = filtered.filter(m => m.isLive);
            if (currentMarket === 'upcoming') filtered = filtered.filter(m => !m.isLive);
            
            const container = document.getElementById('matchesContainer');
            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty-state">No matches found</div>';
                return;
            }
            
            container.innerHTML = filtered.map(match => `
                <div class="match-card">
                    <div class="match-header">
                        <span>${match.leagueName}</span>
                        <span>${match.isLive ? '<span class="live-badge">🔴 LIVE</span>' : match.status}</span>
                    </div>
                    <div class="teams">
                        <span class="team-name">${match.homeTeam}</span>
                        <span class="score">${match.homeScore} : ${match.awayScore}</span>
                        <span class="team-name">${match.awayTeam}</span>
                    </div>
                    <div class="market-grid">
                        <div class="market-btn" onclick="addToBetSlip('${match.id}', '1', ${match.odds.home}, 'Home', 'Winner')">
                            <div class="market-name">HOME</div>
                            <div class="market-odds">${match.odds.home.toFixed(2)}</div>
                        </div>
                        <div class="market-btn" onclick="addToBetSlip('${match.id}', 'X', ${match.odds.draw}, 'Draw', 'Winner')">
                            <div class="market-name">DRAW</div>
                            <div class="market-odds">${match.odds.draw.toFixed(2)}</div>
                        </div>
                        <div class="market-btn" onclick="addToBetSlip('${match.id}', '2', ${match.odds.away}, 'Away', 'Winner')">
                            <div class="market-name">AWAY</div>
                            <div class="market-odds">${match.odds.away.toFixed(2)}</div>
                        </div>
                        <div class="market-btn" onclick="addToBetSlip('${match.id}', 'O2.5', ${match.odds.over25}, 'Over 2.5', 'Goals')">
                            <div class="market-name">OVER 2.5</div>
                            <div class="market-odds">${match.odds.over25.toFixed(2)}</div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        window.addToBetSlip = function(matchId, selection, odds, display, market) {
            const match = matches.find(m => m.id === matchId);
            if (!match) return;
            
            const bet = {
                matchId, matchName: `${match.homeTeam} vs ${match.awayTeam}`,
                market, selection, display, odds
            };
            
            if (betType === 'single') {
                selectedBets = [bet];
            } else {
                if (selectedBets.some(b => b.matchId === matchId)) {
                    showToast('Only one bet per match in accumulator', 'error');
                    return;
                }
                selectedBets.push(bet);
            }
            updateBetSlip();
            showToast(`Added: ${display} @ ${odds.toFixed(2)}`, 'success');
        };

        function updateBetSlip() {
            const container = document.getElementById('betslipItems');
            const totalOdds = selectedBets.reduce((acc, b) => acc * b.odds, 1);
            const amount = parseFloat(document.getElementById('betAmount').value) || 10;
            
            document.getElementById('totalOdds').textContent = totalOdds.toFixed(2);
            document.getElementById('potentialReturn').textContent = `$${(amount * totalOdds).toFixed(2)}`;
            document.getElementById('placeBetBtn').disabled = selectedBets.length === 0;
            
            if (selectedBets.length === 0) {
                container.innerHTML = '<div class="empty-state">➕ Click odds to add bets</div>';
                return;
            }
            
            container.innerHTML = selectedBets.map((bet, i) => `
                <div class="betslip-item">
                    <div class="betslip-item-header">
                        <span><strong>${bet.matchName}</strong></span>
                        <span class="remove-bet" onclick="removeBet(${i})">✖</span>
                    </div>
                    <div>${bet.market} - ${bet.display}</div>
                    <div style="color: var(--primary); font-weight: bold;">${bet.odds.toFixed(2)}</div>
                </div>
            `).join('');
        }

        window.removeBet = (i) => { selectedBets.splice(i, 1); updateBetSlip(); };
        window.setQuickBet = (amount) => { document.getElementById('betAmount').value = amount; updateBetSlip(); };

        async function loadBalance() {
            const doc = await db.collection("wallets").doc(currentUser.uid).get();
            balance = doc.exists ? doc.data().balance : 100;
            if (!doc.exists) await db.collection("wallets").doc(currentUser.uid).set({ balance: 100 });
            document.getElementById('balance').textContent = balance.toFixed(2);
        }

        async function placeBet() {
            const amount = parseFloat(document.getElementById('betAmount').value);
            if (selectedBets.length === 0) return showToast('No bets selected', 'error');
            if (amount < 1 || amount > 5000) return showToast('Invalid amount', 'error');
            if (amount > balance) return showToast('Insufficient balance', 'error');
            
            const totalOdds = selectedBets.reduce((a, b) => a * b.odds, 1);
            const ticket = `XL-${Date.now()}-${Math.random().toString(36).substr(2, 6)}`;
            
            await db.runTransaction(async (t) => {
                const wallet = await t.get(db.collection("wallets").doc(currentUser.uid));
                t.update(db.collection("wallets").doc(currentUser.uid), { balance: wallet.data().balance - amount });
            });
            
            await db.collection("football_bets").doc(ticket).set({
                userId: currentUser.uid, ticketNumber: ticket, selections: selectedBets,
                stake: amount, totalOdds, potentialReturn: amount * totalOdds, betType,
                status: 'pending', createdAt: firebase.firestore.FieldValue.serverTimestamp(), createdAtDate: new Date().toISOString()
            });
            
            balance -= amount;
            document.getElementById('balance').textContent = balance.toFixed(2);
            selectedBets = [];
            updateBetSlip();
            showToast(`✅ Bet placed! Ticket: ${ticket}`, 'success');
            loadOpenBets();
            loadHistory();
        }

        async function loadOpenBets() {
            const snapshot = await db.collection("football_bets").where("userId", "==", currentUser.uid).where("status", "==", "pending").get();
            const container = document.getElementById('openBetsContainer');
            if (snapshot.empty) { container.innerHTML = '<div class="empty-state">No open bets</div>'; return; }
            
            let html = '';
            snapshot.forEach(doc => {
                const b = doc.data();
                html += `<div class="bet-card"><div class="bet-card-header"><span>🎫 ${b.ticketNumber}</span><span style="background:var(--warning);padding:2px 8px;border-radius:20px;">PENDING</span></div>
                <div>${b.selections.length} selection(s) @ ${b.totalOdds.toFixed(2)}</div>
                <div>Stake: $${b.stake.toFixed(2)} | To Win: $${(b.stake * b.totalOdds).toFixed(2)}</div>
                <button class="cashout-btn" onclick="cashOut('${doc.id}', ${b.stake})">💸 Cash Out (70%)</button></div>`;
            });
            container.innerHTML = html;
        }

        window.cashOut = async (id, stake) => {
            const value = stake * 0.7;
            if (!confirm(`Cash out $${value.toFixed(2)}?`)) return;
            await db.runTransaction(async (t) => {
                const wallet = await t.get(db.collection("wallets").doc(currentUser.uid));
                t.update(db.collection("wallets").doc(currentUser.uid), { balance: wallet.data().balance + value });
            });
            await db.collection("football_bets").doc(id).update({ status: 'cashed_out', return: value });
            balance += value;
            document.getElementById('balance').textContent = balance.toFixed(2);
            loadOpenBets();
            loadHistory();
            showToast(`💰 Cashed out $${value.toFixed(2)}`, 'success');
        };

        async function loadHistory() {
            const snapshot = await db.collection("football_bets").where("userId", "==", currentUser.uid).where("status", "in", ["won", "lost", "cashed_out"]).get();
            const container = document.getElementById('historyContainer');
            if (snapshot.empty) { container.innerHTML = '<div class="empty-state">No history</div>'; return; }
            
            let html = '';
            snapshot.forEach(doc => {
                const b = doc.data();
                const color = b.status === 'won' ? 'var(--success)' : b.status === 'lost' ? 'var(--danger)' : 'var(--warning)';
                html += `<div class="bet-card" style="border-left-color:${color}"><div class="bet-card-header"><span>${b.ticketNumber}</span><span style="background:${color};padding:2px 8px;border-radius:20px;">${b.status.toUpperCase()}</span></div>
                <div>${b.selections.length} selections @ ${b.totalOdds.toFixed(2)}</div>
                <div>Stake: $${b.stake.toFixed(2)} | Return: $${(b.return || 0).toFixed(2)}</div></div>`;
            });
            container.innerHTML = html;
        }

        function setupRealtimeListeners() {
            db.collection("wallets").doc(currentUser.uid).onSnapshot(doc => {
                if (doc.exists) { balance = doc.data().balance; document.getElementById('balance').textContent = balance.toFixed(2); }
            });
            db.collection("football_bets").where("userId", "==", currentUser.uid).onSnapshot(() => { loadOpenBets(); loadHistory(); });
        }

        function openDepositModal() { document.getElementById('depositModal').style.display = 'flex'; }
        function closeDepositModal() { document.getElementById('depositModal').style.display = 'none'; }
        async function deposit(amount) {
            await db.collection("wallets").doc(currentUser.uid).update({ balance: firebase.firestore.FieldValue.increment(amount) });
            showToast(`Deposited $${amount}`, 'success');
            closeDepositModal();
        }
        async function depositCustom() {
            const amount = parseFloat(document.getElementById('customDeposit').value);
            if (amount > 0) await deposit(amount);
            else showToast('Invalid amount', 'error');
        }

        function showToast(msg, type) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.style.borderLeftColor = type === 'success' ? '#4caf50' : type === 'error' ? '#ff4757' : '#00ff9d';
            toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-triangle' : 'fa-info-circle'}"></i> ${msg}`;
            document.getElementById('toastContainer').appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // Event Listeners
        document.getElementById('placeBetBtn').addEventListener('click', placeBet);
        document.getElementById('clearSlip').addEventListener('click', () => { selectedBets = []; updateBetSlip(); });
        document.getElementById('betAmount').addEventListener('input', updateBetSlip);
        document.querySelectorAll('.betslip-tab').forEach(btn => btn.addEventListener('click', () => {
            document.querySelectorAll('.betslip-tab').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            betType = btn.dataset.type;
            selectedBets = [];
            updateBetSlip();
        }));
        document.querySelectorAll('.tab-btn').forEach(btn => btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            currentMarket = btn.dataset.market;
            displayMatches();
        }));
        document.querySelectorAll('.league-btn').forEach(btn => btn.addEventListener('click', () => {
            document.querySelectorAll('.league-btn').forEach(l => l.classList.remove('active'));
            btn.classList.add('active');
            currentLeague = btn.dataset.league;
            displayMatches();
        }));

        loadMatches();
    </script>
</body>
</html>
