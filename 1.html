<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Sportsbook Live Betting</title>

<style>
body {
    background:#0f172a;
    color:white;
    font-family:Arial;
    display:flex;
}

/* LEFT SIDE - MATCHES */
.main {
    width:70%;
    padding:20px;
}

.container {
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:15px;
}

.card {
    background:#020617;
    padding:15px;
    border-radius:10px;
}

.teams {
    font-size:16px;
    margin:10px 0;
}

.score {
    font-size:22px;
    color:#22c55e;
}

.odds {
    display:flex;
    justify-content:space-between;
    margin-top:10px;
}

.odd {
    background:#1e293b;
    padding:8px;
    border-radius:5px;
    cursor:pointer;
    width:30%;
    text-align:center;
}

.odd:hover {
    background:#22c55e;
}

/* RIGHT SIDE - BET SLIP */
.betslip {
    width:30%;
    background:#020617;
    padding:20px;
    border-left:1px solid #1e293b;
}

.bet {
    background:#1e293b;
    padding:10px;
    margin-bottom:10px;
    border-radius:5px;
}

button {
    width:100%;
    padding:10px;
    background:#22c55e;
    border:none;
    color:white;
    margin-top:10px;
    cursor:pointer;
}
</style>

</head>

<body>

<div class="main">
    <h2>⚽ LIVE MATCHES</h2>
    <div class="container" id="matches"></div>
</div>

<div class="betslip">
    <h2>💰 Bet Slip</h2>
    <div id="bets"></div>

    <input type="number" id="stake" placeholder="Enter stake" style="width:100%;padding:8px;">
    <button onclick="placeBet()">Place Bet</button>
</div>

<script>

const API_TOKEN = "YOUR_TOKEN";
let selectedBets = [];

async function loadMatches() {

    const url = `https://api.sportmonks.com/v3/football/livescores/inplay?api_token=${API_TOKEN}&include=participants;scores;league;state;odds`;

    const res = await fetch(url);
    const json = await res.json();

    const container = document.getElementById("matches");
    container.innerHTML = "";

    json.data.forEach(match => {

        const home = match.participants?.find(t => t.meta.location==="home")?.name || "Home";
        const away = match.participants?.find(t => t.meta.location==="away")?.name || "Away";

        const homeScore = match.scores?.find(s => s.participant==="home")?.score || 0;
        const awayScore = match.scores?.find(s => s.participant==="away")?.score || 0;

        let odds = ["-", "-", "-"];

        if(match.odds && match.odds.length >= 3){
            odds = [
                match.odds[0].value,
                match.odds[1].value,
                match.odds[2].value
            ];
        }

        const card = `
        <div class="card">
            <div>${match.league?.name || ""}</div>

            <div class="teams">${home} vs ${away}</div>

            <div class="score">${homeScore} - ${awayScore}</div>

            <div class="odds">
                <div class="odd" onclick="addBet('${home}','WIN','${odds[0]}')">H ${odds[0]}</div>
                <div class="odd" onclick="addBet('DRAW','DRAW','${odds[1]}')">D ${odds[1]}</div>
                <div class="odd" onclick="addBet('${away}','WIN','${odds[2]}')">A ${odds[2]}</div>
            </div>
        </div>
        `;

        container.innerHTML += card;
    });
}

// ADD BET
function addBet(team, type, odd) {

    const bet = { team, type, odd };

    selectedBets.push(bet);
    renderBets();
}

// RENDER BET SLIP
function renderBets() {

    const div = document.getElementById("bets");
    div.innerHTML = "";

    selectedBets.forEach((b, i) => {
        div.innerHTML += `
            <div class="bet">
                ${b.team} (${b.type}) - ${b.odd}
            </div>
        `;
    });
}

// PLACE BET
function placeBet() {

    const stake = document.getElementById("stake").value;

    if(selectedBets.length === 0){
        alert("No bets selected");
        return;
    }

    if(!stake){
        alert("Enter stake");
        return;
    }

    let totalOdds = selectedBets.reduce((acc,b)=>acc*parseFloat(b.odd),1);
    let win = stake * totalOdds;

    alert("Bet Placed!\nPotential Win: " + win.toFixed(2));

    selectedBets = [];
    renderBets();
}

// AUTO LOAD + REFRESH
loadMatches();
setInterval(loadMatches, 5000);

</script>

</body>
</html>
