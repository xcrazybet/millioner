<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚽ Xlodon Bet - Live Football</title>
    <style>
        /* Your existing styles here - keeping them compact */
        *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
        :root{--primary:#00ff9d;--secondary:#ff9800;--danger:#ff4757;--success:#4caf50;--bg:#0a0f1a;--surface:#111827;--surface-light:#1a2332;--text:#fff;--text-dim:#94a3b8}
        body{background:var(--bg);color:var(--text);padding-bottom:70px}
        .header{background:var(--surface);padding:12px 16px;display:flex;justify-content:space-between;border-bottom:2px solid var(--primary);position:sticky;top:0}
        .logo{font-size:18px;font-weight:700;color:var(--primary)}
        .balance-display{background:var(--surface-light);padding:6px 12px;border-radius:20px;border:1px solid var(--primary);color:var(--primary)}
        .main-layout{display:grid;grid-template-columns:1fr 380px;gap:16px;max-width:1400px;margin:16px auto;padding:0 16px}
        .market-tabs{background:var(--surface);border-radius:16px;padding:16px}
        .tabs-header,.league-filter{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid #1e293b}
        .tab-btn,.league-btn{padding:8px 16px;background:var(--surface-light);border:1px solid #1e293b;border-radius:30px;color:var(--text);cursor:pointer}
        .tab-btn.active,.league-btn.active{background:var(--primary);color:#000}
        .refresh-btn{background:var(--surface-light);border:1px solid var(--primary);border-radius:30px;padding:6px 12px;color:var(--primary);cursor:pointer}
        .matches-grid{display:flex;flex-direction:column;gap:12px;max-height:550px;overflow-y:auto}
        .match-card{background:var(--surface);border-radius:16px;padding:12px;border:1px solid #1e293b}
        .match-header{display:flex;justify-content:space-between;margin-bottom:10px;font-size:12px;color:var(--text-dim)}
        .teams{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
        .team-name{font-weight:600;font-size:14px}
        .score{font-size:18px;font-weight:700;color:var(--primary)}
        .live-badge{background:var(--danger);padding:2px 8px;border-radius:20px;font-size:10px;animation:pulse 1s infinite}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
        .market-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
        .market-btn{padding:8px;background:var(--surface-light);border:1px solid #1e293b;border-radius:8px;text-align:center;cursor:pointer}
        .market-btn:hover{background:var(--primary)}
        .market-name{font-size:10px;color:var(--text-dim)}
        .market-odds{font-weight:700;color:var(--primary)}
        .betslip-section{background:var(--surface);border-radius:20px;padding:16px;border:2px solid var(--primary);position:sticky;top:80px}
        .betslip-tabs{display:flex;gap:8px;margin-bottom:16px}
        .betslip-tab{flex:1;padding:10px;background:var(--surface-light);border:none;border-radius:30px;color:var(--text);cursor:pointer}
        .betslip-tab.active{background:var(--primary);color:#000}
        .bet-input-group{display:flex;background:var(--surface-light);border-radius:30px;padding:0 16px;margin:12px 0}
        .bet-input{flex:1;padding:14px 0;background:transparent;border:none;color:var(--text);outline:none}
        .place-bet-btn{width:100%;padding:16px;background:var(--primary);border:none;border-radius:30px;color:#000;font-weight:700;cursor:pointer}
        .place-bet-btn:disabled{opacity:0.5}
        .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);display:flex;justify-content:space-around;padding:8px 16px;border-top:2px solid var(--primary)}
        .nav-item{display:flex;flex-direction:column;align-items:center;text-decoration:none;color:var(--text-dim);font-size:11px;gap:4px}
        .nav-item.active{color:var(--primary)}
        .toast-container{position:fixed;bottom:80px;left:16px;right:16px;z-index:1000}
        .toast{padding:12px 16px;background:var(--surface);border-radius:30px;margin-bottom:8px}
        .empty-state{text-align:center;padding:30px;color:var(--text-dim)}
        .loading-spinner{border:3px solid var(--surface-light);border-top:3px solid var(--primary);border-radius:50%;width:40px;height:40px;animation:spin 1s linear infinite;margin:20px auto}
        @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
        @media(max-width:900px){.main-layout{grid-template-columns:1fr}}
        .api-status{background:rgba(0,255,157,0.1);border-left:3px solid var(--primary);padding:8px 12px;font-size:12px;border-radius:8px;margin-bottom:12px;text-align:center}
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">⚽ Xlodon Bet</div>
        <div class="balance-display"><i class="fas fa-wallet"></i> $<span id="balance">0.00</span></div>
    </header>

    <div class="main-layout">
        <div class="left-column">
            <div class="market-tabs">
                <div class="tabs-header">
                    <button class="tab-btn active" data-market="all">📋 All Matches</button>
                    <button class="tab-btn" data-market="live">🔴 Live</button>
                    <button class="tab-btn" data-market="upcoming">📅 Upcoming</button>
                </div>
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
                    <div class="league-filter" id="leagueFilter"><button class="league-btn active" data-league="all">🌍 ALL</button></div>
                    <button class="refresh-btn" id="refreshBtn"><i class="fas fa-sync-alt"></i> Refresh</button>
                </div>
                <div id="apiStatus" class="api-status">🔄 Connecting to Sportmonks API...</div>
                <div id="matchesContainer" class="matches-grid"><div class="loading-spinner"></div></div>
                <div class="last-update" id="lastUpdate"></div>
            </div>
        </div>

        <div class="betslip-section">
            <div class="betslip-tabs">
                <button class="betslip-tab active" data-type="single">🎯 SINGLE</button>
                <button class="betslip-tab" data-type="accumulator">📈 ACCUMULATOR</button>
            </div>
            <div style="display:flex;justify-content:space-between"><h4>BET SLIP</h4><button id="clearSlip" style="background:none;border:none;color:var(--danger);cursor:pointer">🗑️ CLEAR</button></div>
            <div id="betslipItems" class="betslip-items"><div class="empty-state">➕ Click odds to add bets</div></div>
            <div class="bet-input-group"><input type="number" id="betAmount" class="bet-input" value="10" min="1"><span>$</span></div>
            <div style="display:flex;justify-content:space-between;margin:12px 0"><span>⚡ Total Odds:</span><span id="totalOdds" style="color:var(--primary);font-size:20px;font-weight:bold">0.00</span></div>
            <div style="margin:12px 0"><span>💰 Potential Return:</span><span id="potentialReturn" style="float:right;font-weight:bold">$0.00</span></div>
            <button id="placeBetBtn" class="place-bet-btn" disabled>🚀 PLACE BET</button>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="#" class="nav-item active" data-page="football"><i class="fas fa-futbol"></i><span>Football</span></a>
        <a href="#" class="nav-item" data-page="bets"><i class="fas fa-ticket-alt"></i><span>My Bets</span></a>
        <a href="#" class="nav-item" data-page="home"><i class="fas fa-home"></i><span>Home</span></a>
    </nav>

    <div id="toastContainer" class="toast-container"></div>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Sportmonks API - Using a free CORS proxy
        const API_TOKEN = "DkFdWG9jFZvH8XSEgLrRfGwczABWVg5rlV25GvIRyN06zdPsOI48Nsv9Wooy";
        
        async function fetchSportmonks(endpoint) {
            const url = `https://api.sportmonks.com/v3/football${endpoint}?api_token=${API_TOKEN}&include=participants;scores;state;league`;
            // Using a public CORS proxy (works for demo)
            const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
            const response = await fetch(proxyUrl);
            return await response.json();
        }

        let currentUser = null;
        let balance = 0;
        let selectedBets = [];
        let betType = 'single';
        let matches = [];
        let currentLeague = 'all';
        let currentMarket = 'all';

        auth.onAuthStateChanged(async (user) => {
            if (user) {
                currentUser = user;
                await loadBalance();
                await fetchRealMatches();
                showToast('Welcome! Real API Active', 'success');
            } else {
                window.location.href = 'https://xcrazybet.github.io/millioner/login.html';
            }
        });

        async function fetchRealMatches() {
            const container = document.getElementById('matchesContainer');
            container.innerHTML = '<div class="loading-spinner"></div><p style="text-align:center;">Fetching REAL live matches...</p>';
            
            try {
                // Fetch live scores
                const liveData = await fetchSportmonks('/livescores/inplay');
                
                if (liveData.data && liveData.data.length > 0) {
                    matches = liveData.data.map(fixture => {
                        const home = fixture.participants?.find(p => p.meta?.location === 'home') || fixture.participants?.[0];
                        const away = fixture.participants?.find(p => p.meta?.location === 'away') || fixture.participants?.[1];
                        const score = fixture.scores?.find(s => s.description === 'CURRENT') || fixture.scores?.[0];
                        
                        return {
                            id: fixture.id,
                            leagueId: fixture.league_id,
                            leagueName: fixture.league?.name || "Live Match",
                            homeTeam: home?.name || "Home",
                            awayTeam: away?.name || "Away",
                            homeScore: score?.score?.goals || score?.goals || 0,
                            awayScore: score?.score?.opponent_goals || score?.opponent_goals || 0,
                            isLive: true,
                            time: "LIVE",
                            odds: { home: 2.0 + Math.random() * 0.5, draw: 3.2 + Math.random() * 0.3, away: 2.5 + Math.random() * 0.5, over25: 1.85, under25: 1.95 }
                        };
                    });
                    
                    document.getElementById('apiStatus').innerHTML = `✅ REAL API ACTIVE! ${matches.length} live matches from Sportmonks`;
                    document.getElementById('lastUpdate').innerHTML = `✅ Real data | ${matches.length} live matches | ${new Date().toLocaleTimeString()}`;
                    displayMatches();
                    showToast(`✅ Loaded ${matches.length} REAL matches from Sportmonks API`, 'success');
                } else {
                    throw new Error('No live matches right now');
                }
            } catch (error) {
                document.getElementById('apiStatus').innerHTML = `⚠️ ${error.message}. Showing match previews.`;
                // Show some preview matches so UI isn't empty
                matches = [
                    { id: "preview1", leagueId: "39", leagueName: "Premier League", homeTeam: "Manchester United", awayTeam: "Arsenal", homeScore: null, awayScore: null, isLive: false, time: "15:00", odds: { home: 2.10, draw: 3.40, away: 3.20, over25: 1.85, under25: 1.95 } },
                    { id: "preview2", leagueId: "140", leagueName: "La Liga", homeTeam: "Barcelona", awayTeam: "Real Madrid", homeScore: null, awayScore: null, isLive: false, time: "17:00", odds: { home: 2.30, draw: 3.30, away: 2.90, over25: 1.80, under25: 2.00 } }
                ];
                displayMatches();
            }
        }

        function displayMatches() {
            const container = document.getElementById('matchesContainer');
            let filtered = currentLeague === 'all' ? matches : matches.filter(m => m.leagueId == currentLeague);
            if (currentMarket === 'live') filtered = filtered.filter(m => m.isLive);
            else if (currentMarket === 'upcoming') filtered = filtered.filter(m => !m.isLive);
            
            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty-state">No matches found</div>';
                return;
            }
            
            container.innerHTML = filtered.map(match => `
                <div class="match-card">
                    <div class="match-header"><span>🏆 ${match.leagueName}</span><span>${match.isLive ? '<span class="live-badge">🔴 LIVE</span>' : match.time}</span></div>
                    <div class="teams"><span class="team-name">${match.homeTeam}</span><span class="score">${match.homeScore !== null ? match.homeScore : '-'} : ${match.awayScore !== null ? match.awayScore : '-'}</span><span class="team-name">${match.awayTeam}</span></div>
                    <div class="market-grid">
                        <div class="market-btn" onclick="addToBetSlip('${match.id}', '1', ${match.odds.home}, '1')"><div class="market-name">HOME</div><div class="market-odds">${match.odds.home.toFixed(2)}</div></div>
                        <div class="market-btn" onclick="addToBetSlip('${match.id}', 'X', ${match.odds.draw}, 'X')"><div class="market-name">DRAW</div><div class="market-odds">${match.odds.draw.toFixed(2)}</div></div>
                        <div class="market-btn" onclick="addToBetSlip('${match.id}', '2', ${match.odds.away}, '2')"><div class="market-name">AWAY</div><div class="market-odds">${match.odds.away.toFixed(2)}</div></div>
                        <div class="market-btn" onclick="addToBetSlip('${match.id}', 'Over 2.5', ${match.odds.over25}, 'O2.5')"><div class="market-name">OVER 2.5</div><div class="market-odds">${match.odds.over25.toFixed(2)}</div></div>
                    </div>
                </div>
            `).join('');
        }

        async function loadBalance() {
            const doc = await db.collection("wallets").doc(currentUser.uid).get();
            balance = doc.exists ? doc.data().balance : 100;
            if (!doc.exists) await db.collection("wallets").doc(currentUser.uid).set({ balance: 100 });
            document.getElementById('balance').textContent = balance.toFixed(2);
        }

        window.addToBetSlip = function(matchId, selection, odds, display) {
            const match = matches.find(m => m.id === matchId);
            if (!match) return;
            const bet = { matchId, matchName: `${match.homeTeam} vs ${match.awayTeam}`, selection, display, odds };
            if (betType === 'single') selectedBets = [bet];
            else if (selectedBets.some(b => b.matchId === matchId)) { showToast('Only one bet per match in ACCA', 'error'); return; }
            else selectedBets.push(bet);
            updateBetSlip();
            showToast(`Added: ${bet.matchName} - ${display} @ ${odds}`, 'success');
        };

        function updateBetSlip() {
            const container = document.getElementById('betslipItems');
            const totalOdds = selectedBets.reduce((a,b)=>a*b.odds, 1);
            const betAmount = parseFloat(document.getElementById('betAmount').value) || 10;
            document.getElementById('totalOdds').textContent = totalOdds.toFixed(2);
            document.getElementById('potentialReturn').textContent = `$${(betAmount * totalOdds).toFixed(2)}`;
            document.getElementById('placeBetBtn').disabled = selectedBets.length === 0;
            
            if (selectedBets.length === 0) container.innerHTML = '<div class="empty-state">➕ Click odds to add bets</div>';
            else container.innerHTML = selectedBets.map((bet, i) => `
                <div class="betslip-item"><div style="display:flex;justify-content:space-between"><span><strong>${bet.matchName}</strong></span><span class="remove-bet" onclick="removeBet(${i})">✖</span></div><div>${bet.display} @ ${bet.odds}</div></div>
            `).join('');
        }

        window.removeBet = (i) => { selectedBets.splice(i,1); updateBetSlip(); };
        
        async function placeBet() {
            const amount = parseFloat(document.getElementById('betAmount').value);
            if (selectedBets.length === 0) return showToast('No bets', 'error');
            if (amount > balance) return showToast('Insufficient funds', 'error');
            
            const totalOdds = selectedBets.reduce((a,b)=>a*b.odds,1);
            const ticket = `TKT-${Date.now()}`;
            
            await db.collection("wallets").doc(currentUser.uid).update({ balance: balance - amount });
            await db.collection("football_bets").doc(ticket).set({
                ticketNumber: ticket, userId: currentUser.uid, selections: selectedBets, stake: amount, totalOdds, status: 'pending', createdAt: new Date()
            });
            
            balance -= amount;
            document.getElementById('balance').textContent = balance.toFixed(2);
            selectedBets = [];
            updateBetSlip();
            showToast(`✅ Bet placed! Ticket: ${ticket}`, 'success');
        }

        function showToast(msg, type) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.style.borderLeftColor = type === 'success' ? '#4caf50' : '#ff4757';
            toast.innerHTML = msg;
            document.getElementById('toastContainer').appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        document.getElementById('placeBetBtn').onclick = placeBet;
        document.getElementById('clearSlip').onclick = () => { selectedBets = []; updateBetSlip(); };
        document.getElementById('refreshBtn').onclick = fetchRealMatches;
        document.getElementById('betAmount').oninput = updateBetSlip;
        
        document.querySelectorAll('.betslip-tab').forEach(btn => btn.onclick = () => {
            document.querySelectorAll('.betslip-tab').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            betType = btn.dataset.type;
            selectedBets = [];
            updateBetSlip();
        });
        
        document.querySelectorAll('.tab-btn').forEach(btn => btn.onclick = () => {
            document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            currentMarket = btn.dataset.market;
            displayMatches();
        });
        
        document.querySelectorAll('.nav-item').forEach(item => item.onclick = (e) => {
            e.preventDefault();
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            item.classList.add('active');
        });
    </script>
</body>
</html>
