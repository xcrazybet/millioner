<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Betting Demo</title>
  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      padding: 20px;
    }
    .match {
      background: #1e293b;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 10px;
    }
    button {
      margin: 5px;
      padding: 8px 12px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .home { background: #22c55e; }
    .away { background: #ef4444; }
    .draw { background: #eab308; }
    pre {
      background: black;
      padding: 10px;
      overflow-x: auto;
      max-height: 300px;
    }
  </style>
</head>
<body>

<h1>⚽ Betting Demo (SportMonks API)</h1>

<h2>Matches</h2>
<div id="matches">Loading...</div>

<h2>Your Bets</h2>
<div id="bets"></div>

<h2>Raw API Data</h2>
<pre id="raw"></pre>

<script>
const API_TOKEN = "YOUR_API_TOKEN";

// Fetch matches
async function loadMatches() {
  const url = `https://api.sportmonks.com/v3/football/fixtures?api_token=${API_TOKEN}`;

  try {
    const res = await fetch(url);
    const data = await res.json();

    document.getElementById("raw").textContent =
      JSON.stringify(data, null, 2);

    const matchesDiv = document.getElementById("matches");
    matchesDiv.innerHTML = "";

    data.data.slice(0, 10).forEach(match => {
      const div = document.createElement("div");
      div.className = "match";

      div.innerHTML = `
        <h3>${match.name || "Match"}</h3>
        <p>ID: ${match.id}</p>

        <button class="home" onclick="placeBet('${match.id}', 'Home')">Home</button>
        <button class="draw" onclick="placeBet('${match.id}', 'Draw')">Draw</button>
        <button class="away" onclick="placeBet('${match.id}', 'Away')">Away</button>
      `;

      matchesDiv.appendChild(div);
    });

  } catch (err) {
    document.getElementById("matches").innerHTML =
      "Error loading API. Check console.";
    console.error(err);
  }
}

// Save bet
function placeBet(matchId, choice) {
  const bet = {
    matchId,
    choice,
    amount: 10,
    odds: (Math.random() * 2 + 1).toFixed(2)
  };

  let bets = JSON.parse(localStorage.getItem("bets")) || [];
  bets.push(bet);

  localStorage.setItem("bets", JSON.stringify(bets));

  renderBets();
}

// Show bets
function renderBets() {
  const bets = JSON.parse(localStorage.getItem("bets")) || [];
  const betsDiv = document.getElementById("bets");

  betsDiv.innerHTML = "";

  bets.forEach(bet => {
    const win = (bet.amount * bet.odds).toFixed(2);

    const div = document.createElement("div");
    div.className = "match";

    div.innerHTML = `
      <p>Match: ${bet.matchId}</p>
      <p>Choice: ${bet.choice}</p>
      <p>Odds: ${bet.odds}</p>
      <p>Bet: $${bet.amount}</p>
      <p>Win: $${win}</p>
    `;

    betsDiv.appendChild(div);
  });
}

// Init
loadMatches();
renderBets();
</script>

</body>
</html>
