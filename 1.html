<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>XLODON - Live Sports Betting Platform</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
        }

        .header {
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(10px);
            padding: 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            background: linear-gradient(135deg, #ffd700, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .balance-card {
            background: linear-gradient(135deg, rgba(255,215,0,0.2), rgba(255,107,107,0.2));
            padding: 0.8rem 1.5rem;
            border-radius: 50px;
            display: flex;
            gap: 1rem;
            align-items: center;
            border: 1px solid rgba(255,215,0,0.3);
        }

        .balance-label {
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .balance-amount {
            font-size: 1.8rem;
            font-weight: bold;
            color: #ffd700;
        }

        .add-funds-btn {
            background: #ffd700;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 50px;
            color: #1a1a2e;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .stats-bar {
            max-width: 1400px;
            margin: 1rem auto;
            padding: 0 1rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }

        .stat-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            padding: 1rem;
            border-radius: 15px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .stat-label {
            font-size: 0.85rem;
            opacity: 0.7;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 1.3rem;
            font-weight: bold;
        }

        .filters {
            max-width: 1400px;
            margin: 1rem auto;
            padding: 0 1rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 0.7rem 1.5rem;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #ffd700, #ff6b6b);
            color: #1a1a2e;
            border-color: transparent;
        }

        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1rem;
        }

        .fixtures-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 1.5rem;
            margin-top: 1rem;
        }

        .fixture-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 1.2rem;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .fixture-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .fixture-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            font-size: 0.85rem;
            opacity: 0.8;
        }

        .league-name {
            background: rgba(255,255,255,0.1);
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
        }

        .fixture-status {
            display: inline-block;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .status-inplay { background: #ff4757; animation: pulse 1s infinite; }
        .status-scheduled { background: #ffa502; }
        .status-finished { background: #2ed573; }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }

        .fixture-teams {
            text-align: center;
            margin: 1rem 0;
        }

        .team {
            font-size: 1.1rem;
            font-weight: 600;
            margin: 0.5rem 0;
        }

        .vs {
            font-size: 0.8rem;
            opacity: 0.6;
            margin: 0.3rem 0;
        }

        .score {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ffd700;
            margin-top: 0.5rem;
        }

        .odds-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.8rem;
            margin-top: 1rem;
        }

        .odd-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 12px;
            padding: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .odd-btn:hover {
            background: #ffd700;
            transform: scale(1.05);
            color: #1a1a2e;
        }

        .odd-label { font-size: 0.75rem; opacity: 0.8; margin-bottom: 0.3rem; }
        .odd-value { font-size: 1.2rem; font-weight: bold; }

        .bet-slip-toggle {
            position: fixed;
            right: 20px;
            bottom: 20px;
            background: linear-gradient(135deg, #ffd700, #ff6b6b);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            z-index: 200;
        }

        .bet-count {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #ff4757;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .bet-slip {
            position: fixed;
            right: 0;
            top: 0;
            width: 400px;
            height: 100vh;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(20px);
            transform: translateX(100%);
            transition: transform 0.3s ease-in-out;
            z-index: 1000;
            padding: 1rem;
            overflow-y: auto;
            box-shadow: -5px 0 20px rgba(0,0,0,0.5);
        }

        .bet-slip.open { transform: translateX(0); }

        .bet-slip-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }

        .close-slip {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.8rem;
            cursor: pointer;
        }

        .bet-item {
            background: rgba(255,255,255,0.1);
            padding: 1rem;
            border-radius: 15px;
            margin-bottom: 1rem;
        }

        .stake-input {
            width: 100%;
            padding: 0.7rem;
            margin: 0.5rem 0;
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 10px;
            color: #fff;
        }

        .potential-win { color: #ffd700; font-weight: bold; margin-top: 0.5rem; }
        .remove-bet {
            background: rgba(255,71,87,0.3);
            border: none;
            padding: 0.3rem 0.8rem;
            border-radius: 8px;
            color: #ff4757;
            cursor: pointer;
        }

        .bet-summary {
            margin-top: 1rem;
            padding: 1rem;
            background: rgba(255,215,0,0.1);
            border-radius: 15px;
        }

        .place-bet-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #ffd700, #ff6b6b);
            border: none;
            border-radius: 12px;
            color: #1a1a2e;
            font-weight: bold;
            cursor: pointer;
            margin-top: 1rem;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .modal-content {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            padding: 2rem;
            border-radius: 20px;
            max-width: 400px;
            width: 90%;
            text-align: center;
        }

        .amount-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin: 1.5rem 0;
        }

        .amount-option {
            padding: 0.8rem;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            cursor: pointer;
        }

        .custom-amount {
            width: 100%;
            padding: 0.8rem;
            margin: 1rem 0;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            color: #fff;
        }

        .modal-btn {
            padding: 0.8rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            margin: 0 0.5rem;
        }

        .modal-btn.confirm { background: #ffd700; color: #1a1a2e; }
        .modal-btn.cancel { background: rgba(255,255,255,0.1); color: #fff; }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.9);
            color: #fff;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            z-index: 2000;
            border-left: 4px solid #ffd700;
            animation: slideInLeft 0.3s;
        }

        @keyframes slideInLeft {
            from { transform: translateX(-100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .loader {
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 3px solid #ffd700;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 3rem auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: rgba(255,255,255,0.6);
        }

        @media (max-width: 768px) {
            .fixtures-grid { grid-template-columns: 1fr; }
            .bet-slip { width: 100%; }
            .balance-amount { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <div class="logo">⚽ XLODON <span style="font-size:0.8rem; background:rgba(255,215,0,0.2); padding:0.2rem 0.5rem; border-radius:20px;">LIVE BETTING</span></div>
            <div class="balance-card">
                <span class="balance-label">💰 Wallet Balance</span>
                <span class="balance-amount" id="balanceAmount">£0</span>
                <button class="add-funds-btn" onclick="showAddFundsModal()">+ Add Funds</button>
            </div>
        </div>
    </div>

    <div class="stats-bar">
        <div class="stat-card"><div class="stat-label">Today's Bets</div><div class="stat-value" id="todayBetsCount">0</div></div>
        <div class="stat-card"><div class="stat-label">Today's Stake</div><div class="stat-value" id="todayStake">£0</div></div>
        <div class="stat-card"><div class="stat-label">Active Bets</div><div class="stat-value" id="activeBetsCount">0</div></div>
        <div class="stat-card"><div class="stat-label">Total Profit/Loss</div><div class="stat-value" id="profitLoss">£0</div></div>
    </div>

    <div class="filters">
        <button class="filter-btn active" onclick="filterFixtures('all', this)">🏆 All Matches</button>
        <button class="filter-btn" onclick="filterFixtures('inplay', this)">🔴 Live Now</button>
        <button class="filter-btn" onclick="filterFixtures('today', this)">📅 Today</button>
    </div>

    <div class="main-container">
        <div id="fixturesGrid"><div class="loader"></div></div>
    </div>

    <div class="bet-slip-toggle" onclick="toggleBetSlip()">🎫<div class="bet-count" id="betCount">0</div></div>
    <div id="betSlip" class="bet-slip"><div class="bet-slip-header"><h3>📋 Bet Slip</h3><button class="close-slip" onclick="toggleBetSlip()">✕</button></div><div id="betSlipContent"><div class="empty-state">No selections added</div></div></div>

    <script>
        // ------------------- FIREBASE INIT -------------------
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962",
            measurementId: "G-PTV4XMYQ6P"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // ------------------- SPORTMONKS CONFIG -------------------
        const API_TOKEN = "DkFdWG9jFZvH8XSEgLrRfGwczABWVg5rlV25GvIRyN06zdPsOI48Nsv9Wooy";
        const BASE_URL = "https://api.sportmonks.com/v3/football";

        // ------------------- GLOBAL STATE -------------------
        let userBalance = 0;
        let userId = null;
        let fixtures = [];
        let betSlipItems = [];     // { fixtureId, fixtureName, selection, odds, stake }
        let betHistory = [];       // stored in firestore
        let todayStats = { betsCount: 0, totalStake: 0 };
        let currentFilter = 'all';
        let refreshInterval = null;

        // Helper: show toast
        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = 'toast';
            const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
            toast.innerHTML = `${icons[type] || 'ℹ️'} ${message}`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // Update UI from user data
        async function loadUserData() {
            if (!userId) return;
            const userDoc = await db.collection('users').doc(userId).get();
            if (userDoc.exists) {
                userBalance = userDoc.data().balance || 1000;
                betHistory = userDoc.data().betHistory || [];
                todayStats = userDoc.data().todayStats || { betsCount: 0, totalStake: 0 };
                // reset today stats if new day
                const todayDate = new Date().toISOString().split('T')[0];
                if (todayStats.date !== todayDate) {
                    todayStats = { date: todayDate, betsCount: 0, totalStake: 0 };
                    await db.collection('users').doc(userId).update({ todayStats });
                }
            } else {
                userBalance = 1000;
                betHistory = [];
                todayStats = { date: new Date().toISOString().split('T')[0], betsCount: 0, totalStake: 0 };
                await db.collection('users').doc(userId).set({ balance: userBalance, betHistory, todayStats });
            }
            updateBalanceDisplay();
            updateStatsDisplay();
        }

        async function saveUserData() {
            if (!userId) return;
            await db.collection('users').doc(userId).update({ balance: userBalance, betHistory, todayStats });
        }

        function updateBalanceDisplay() {
            document.getElementById('balanceAmount').innerHTML = `£${userBalance.toFixed(2)}`;
        }

        function updateStatsDisplay() {
            document.getElementById('todayBetsCount').innerText = todayStats.betsCount;
            document.getElementById('todayStake').innerHTML = `£${todayStats.totalStake.toFixed(2)}`;
            const activeCount = betHistory.filter(b => b.status === 'active').length;
            document.getElementById('activeBetsCount').innerText = activeCount;
            const totalPL = betHistory.reduce((sum, b) => {
                if (b.status === 'won') return sum + (b.potentialWin - b.stake);
                if (b.status === 'lost') return sum - b.stake;
                return sum;
            }, 0);
            document.getElementById('profitLoss').innerHTML = `${totalPL >= 0 ? '+' : ''}£${totalPL.toFixed(2)}`;
            document.getElementById('profitLoss').style.color = totalPL >= 0 ? '#2ed573' : '#ff4757';
        }

        // ------------------- SPORTMONKS FETCH (REAL-TIME) -------------------
        async function fetchLiveFixtures() {
            try {
                // Use latest endpoint to get updated fixtures (scores, state, odds)
                const url = `${BASE_URL}/fixtures/latest?api_token=${API_TOKEN}&include=participants;scores;odds;league&filters=todayDate`;
                const response = await fetch(url);
                const data = await response.json();
                if (data.data && Array.isArray(data.data)) {
                    // Map API response to internal structure
                    const mapped = data.data.map(f => ({
                        id: f.id,
                        league: { id: f.league?.id, name: f.league?.name || "Unknown League" },
                        participants: f.participants?.map(p => ({ id: p.id, name: p.name })) || [{ name: "Home" }, { name: "Away" }],
                        starting_at: f.starting_at,
                        state: f.state || (f.time?.status === 'live' ? 'inplay' : (f.time?.status === 'finished' ? 'finished' : 'scheduled')),
                        scores: f.scores || [],
                        odds: (f.odds && f.odds.length) ? f.odds.slice(0,3).map((odd, idx) => ({
                            label: idx === 0 ? "Home" : (idx === 1 ? "Draw" : "Away"),
                            value: odd.label === "1" ? odd.value : (odd.label === "X" ? odd.value : odd.value),
                            type: idx === 0 ? "home" : (idx === 1 ? "draw" : "away")
                        })) : [
                            { label: "Home", value: 2.0, type: "home" },
                            { label: "Draw", value: 3.2, type: "draw" },
                            { label: "Away", value: 2.8, type: "away" }
                        ]
                    }));
                    // If latest returned empty, fallback to today fixtures
                    if (mapped.length === 0) {
                        return await fetchTodayFixtures();
                    }
                    return mapped;
                }
                return await fetchTodayFixtures();
            } catch (err) {
                console.warn("Latest fetch error, fallback to today:", err);
                return await fetchTodayFixtures();
            }
        }

        async function fetchTodayFixtures() {
            try {
                const today = new Date().toISOString().split('T')[0];
                const url = `${BASE_URL}/fixtures/date/${today}?api_token=${API_TOKEN}&include=participants;scores;odds;league`;
                const response = await fetch(url);
                const data = await response.json();
                if (data.data) {
                    return data.data.map(f => ({
                        id: f.id,
                        league: { id: f.league?.id, name: f.league?.name || "League" },
                        participants: f.participants?.map(p => ({ id: p.id, name: p.name })) || [{ name: "Home" }, { name: "Away" }],
                        starting_at: f.starting_at,
                        state: f.state || 'scheduled',
                        scores: f.scores || [],
                        odds: (f.odds && f.odds.length) ? f.odds.slice(0,3).map((odd, idx) => ({
                            label: idx === 0 ? "Home" : (idx === 1 ? "Draw" : "Away"),
                            value: odd.value,
                            type: idx === 0 ? "home" : (idx === 1 ? "draw" : "away")
                        })) : [
                            { label: "Home", value: 2.0, type: "home" },
                            { label: "Draw", value: 3.2, type: "draw" },
                            { label: "Away", value: 2.8, type: "away" }
                        ]
                    }));
                }
                return [];
            } catch (err) {
                console.error("Today fixtures error:", err);
                return [];
            }
        }

        async function refreshFixtures() {
            const newFixtures = await fetchLiveFixtures();
            if (newFixtures && newFixtures.length) {
                fixtures = newFixtures;
                renderFixtures();
            } else {
                if (fixtures.length === 0) document.getElementById('fixturesGrid').innerHTML = '<div class="empty-state">No matches today. Check back later.</div>';
            }
        }

        function renderFixtures() {
            let filtered = [...fixtures];
            if (currentFilter === 'inplay') filtered = fixtures.filter(f => f.state === 'inplay');
            else if (currentFilter === 'today') {
                const today = new Date().toISOString().split('T')[0];
                filtered = fixtures.filter(f => f.starting_at?.split('T')[0] === today);
            }
            if (filtered.length === 0) {
                document.getElementById('fixturesGrid').innerHTML = '<div class="empty-state">No matches for this filter</div>';
                return;
            }
            const html = `<div class="fixtures-grid">${filtered.map(fixture => {
                const homeTeam = fixture.participants[0]?.name || "Home";
                const awayTeam = fixture.participants[1]?.name || "Away";
                const homeScore = fixture.scores?.find(s => s.type === 'home')?.score ?? (fixture.scores?.find(s => s.id === fixture.participants[0]?.id)?.score ?? "-");
                const awayScore = fixture.scores?.find(s => s.type === 'away')?.score ?? (fixture.scores?.find(s => s.id === fixture.participants[1]?.id)?.score ?? "-");
                const scoreDisplay = fixture.state === 'finished' || fixture.state === 'inplay' ? `${homeScore} - ${awayScore}` : "VS";
                const statusClass = fixture.state === 'inplay' ? 'status-inplay' : (fixture.state === 'finished' ? 'status-finished' : 'status-scheduled');
                const statusText = fixture.state === 'inplay' ? '🔴 LIVE' : (fixture.state === 'finished' ? '✅ FINISHED' : '📅 SCHEDULED');
                return `
                    <div class="fixture-card">
                        <div class="fixture-header"><span class="league-name">${fixture.league.name}</span><span class="fixture-status ${statusClass}">${statusText}</span></div>
                        <div class="fixture-teams"><div class="team">${homeTeam}</div><div class="${fixture.state === 'scheduled' ? 'vs' : 'score'}">${scoreDisplay}</div><div class="team">${awayTeam}</div></div>
                        ${fixture.state !== 'finished' ? `<div class="odds-container">${fixture.odds.map(odd => `<div class="odd-btn" onclick="addToBetSlip(${fixture.id}, '${odd.label}', ${odd.value}, '${homeTeam} vs ${awayTeam}')"><div class="odd-label">${odd.label}</div><div class="odd-value">${odd.value.toFixed(2)}</div></div>`).join('')}</div>` : '<div style="text-align:center; margin-top:1rem; opacity:0.6;">Match Finished</div>'}
                    </div>`;
            }).join('')}</div>`;
            document.getElementById('fixturesGrid').innerHTML = html;
        }

        // ------------------- BETSLIP LOGIC -------------------
        function addToBetSlip(fixtureId, selection, odds, fixtureName) {
            if (betSlipItems.some(i => i.fixtureId === fixtureId && i.selection === selection)) {
                showToast("Already in bet slip", "warning");
                return;
            }
            betSlipItems.push({ fixtureId, fixtureName, selection, odds, stake: null });
            updateBetSlipUI();
            updateBetCount();
            showToast(`Added: ${fixtureName} - ${selection} @ ${odds.toFixed(2)}`, "success");
        }

        function updateBetSlipUI() {
            const container = document.getElementById('betSlipContent');
            if (betSlipItems.length === 0) {
                container.innerHTML = '<div class="empty-state">No selections added<br>Click on odds to add bets</div>';
                return;
            }
            let totalStake = 0, totalWin = 0;
            const html = betSlipItems.map((item, idx) => {
                const potential = item.stake ? (item.stake * item.odds).toFixed(2) : 0;
                if (item.stake) { totalStake += item.stake; totalWin += parseFloat(potential); }
                return `<div class="bet-item">
                    <div class="bet-fixture">${item.fixtureName}</div>
                    <div class="bet-details">${item.selection} | Odds: ${item.odds.toFixed(2)}</div>
                    <input type="number" class="stake-input" placeholder="Stake (£)" min="0.5" step="0.5" value="${item.stake || ''}" onchange="updateStake(${idx}, this.value)">
                    ${item.stake ? `<div class="potential-win">💰 Potential: £${potential}</div>` : ''}
                    <button class="remove-bet" onclick="removeFromBetSlip(${idx})">Remove</button>
                </div>`;
            }).join('');
            container.innerHTML = html + `<div class="bet-summary"><div>Total Stake: £${totalStake.toFixed(2)}</div><div>Total Potential: £${totalWin.toFixed(2)}</div></div>
            <button class="place-bet-btn" onclick="placeBets()" ${totalStake === 0 ? 'disabled' : ''}>Place Bets (£${totalStake.toFixed(2)})</button>`;
        }

        function updateStake(index, value) {
            const stake = parseFloat(value);
            if (isNaN(stake) || stake < 0.5) { betSlipItems[index].stake = null; showToast("Min stake £0.50", "warning"); }
            else if (stake > userBalance) { betSlipItems[index].stake = null; showToast("Insufficient balance", "error"); }
            else { betSlipItems[index].stake = stake; }
            updateBetSlipUI();
        }

        function removeFromBetSlip(index) {
            betSlipItems.splice(index, 1);
            updateBetSlipUI();
            updateBetCount();
        }

        function updateBetCount() { document.getElementById('betCount').innerText = betSlipItems.length; }

        async function placeBets() {
            const valid = betSlipItems.filter(i => i.stake && i.stake > 0);
            if (valid.length === 0) { showToast("Enter stakes", "warning"); return; }
            const total = valid.reduce((s,b) => s + b.stake, 0);
            if (total > userBalance) { showToast("Insufficient balance", "error"); return; }
            // deduct balance
            userBalance -= total;
            // record bets
            for (let bet of valid) {
                const potential = bet.stake * bet.odds;
                const newBet = {
                    id: Date.now() + Math.random(),
                    fixtureName: bet.fixtureName,
                    selection: bet.selection,
                    odds: bet.odds,
                    stake: bet.stake,
                    potentialWin: potential,
                    status: 'active',
                    createdAt: new Date().toISOString()
                };
                betHistory.push(newBet);
                todayStats.betsCount++;
                todayStats.totalStake += bet.stake;
            }
            betSlipItems = [];
            await saveUserData();
            updateBalanceDisplay();
            updateStatsDisplay();
            updateBetSlipUI();
            updateBetCount();
            toggleBetSlip(false);
            showToast(`Bets placed! Total stake £${total.toFixed(2)}`, "success");
            // Simulate auto-settlement for demo (random win/loss after 45 sec)
            setTimeout(() => settleRandomBets(), 45000);
        }

        async function settleRandomBets() {
            let updated = false;
            for (let bet of betHistory) {
                if (bet.status === 'active') {
                    const win = Math.random() > 0.45;
                    if (win) {
                        bet.status = 'won';
                        userBalance += bet.potentialWin;
                        showToast(`🎉 BET WON! ${bet.fixtureName} +£${bet.potentialWin.toFixed(2)}`, "success");
                    } else {
                        bet.status = 'lost';
                        showToast(`❌ BET LOST: ${bet.fixtureName}`, "error");
                    }
                    updated = true;
                }
            }
            if (updated) {
                await saveUserData();
                updateBalanceDisplay();
                updateStatsDisplay();
            }
        }

        // ------------------- AUTH & INIT -------------------
        async function anonymousLogin() {
            try {
                const credential = await auth.signInAnonymously();
                userId = credential.user.uid;
                await loadUserData();
                startLiveRefresh();
                showToast("Connected to live odds", "success");
            } catch (err) {
                console.error(err);
                showToast("Auth error, using demo mode", "error");
                userId = "demo_user";
                userBalance = 1000;
                betHistory = [];
                todayStats = { date: new Date().toISOString().split('T')[0], betsCount: 0, totalStake: 0 };
                updateBalanceDisplay();
                updateStatsDisplay();
                startLiveRefresh();
            }
        }

        function startLiveRefresh() {
            refreshFixtures();
            if (refreshInterval) clearInterval(refreshInterval);
            refreshInterval = setInterval(() => {
                refreshFixtures();
            }, 7000); // 7 sec poll for latest updates
        }

        // Modal & helpers
        function showAddFundsModal() {
            const modal = document.createElement('div');
            modal.className = 'modal';
            modal.innerHTML = `<div class="modal-content"><h2>💰 Add Funds</h2><div class="amount-options">
                <div class="amount-option" onclick="addFunds(10)">£10</div><div class="amount-option" onclick="addFunds(25)">£25</div>
                <div class="amount-option" onclick="addFunds(50)">£50</div><div class="amount-option" onclick="addFunds(100)">£100</div>
                <div class="amount-option" onclick="addFunds(250)">£250</div><div class="amount-option" onclick="addFunds(500)">£500</div>
            </div><input type="number" id="customAmount" class="custom-amount" placeholder="Custom amount (£)" min="1">
            <div><button class="modal-btn confirm" onclick="addCustomFunds()">Add Funds</button><button class="modal-btn cancel" onclick="closeModal()">Cancel</button></div></div>`;
            document.body.appendChild(modal);
        }
        window.addFunds = async (amount) => {
            userBalance += amount;
            await saveUserData();
            updateBalanceDisplay();
            showToast(`Added £${amount}`, "success");
            closeModal();
        };
        window.addCustomFunds = async () => {
            const inp = document.getElementById('customAmount');
            const amt = parseFloat(inp?.value);
            if (isNaN(amt) || amt <= 0) showToast("Valid amount", "warning");
            else await window.addFunds(amt);
        };
        window.closeModal = () => { const m = document.querySelector('.modal'); if(m) m.remove(); };
        window.toggleBetSlip = (open) => { const slip = document.getElementById('betSlip'); if(open === true) slip.classList.add('open'); else if(open === false) slip.classList.remove('open'); else slip.classList.toggle('open'); };
        window.filterFixtures = (filter, btn) => {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderFixtures();
        };
        window.addToBetSlip = addToBetSlip;
        window.updateStake = updateStake;
        window.removeFromBetSlip = removeFromBetSlip;
        window.placeBets = placeBets;
        window.showAddFundsModal = showAddFundsModal;

        anonymousLogin();
    </script>
</body>
</html>
