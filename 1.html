<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Betting Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .balance {
            font-size: 24px;
            font-weight: bold;
            color: #4CAF50;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .game-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }

        .game-card:hover {
            transform: translateY(-5px);
        }

        .game-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }

        .game-odds {
            color: #666;
            margin-bottom: 15px;
        }

        .bet-form {
            margin-top: 15px;
        }

        .bet-input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        .bet-button {
            width: 100%;
            padding: 10px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }

        .bet-button:hover {
            background: #45a049;
        }

        .message {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px;
            border-radius: 5px;
            display: none;
            z-index: 1000;
        }

        .message.success {
            background: #4CAF50;
            color: white;
        }

        .message.error {
            background: #f44336;
            color: white;
        }

        .history {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .history-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
        }

        .history-item {
            padding: 10px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
        }

        .history-item.win {
            color: #4CAF50;
        }

        .history-item.loss {
            color: #f44336;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
            }
            to {
                transform: translateX(0);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎲 Betting Platform</h1>
            <div class="balance">Balance: $<span id="balance">1000</span></div>
        </div>

        <div class="games-grid" id="gamesGrid">
            <!-- Games will be loaded here -->
        </div>

        <div class="history">
            <div class="history-title">Betting History</div>
            <div id="history"></div>
        </div>
    </div>

    <div id="message" class="message"></div>

    <script>
        const API_KEY = 'b3aae6120d7049a9bc323e501ba4f171';
        const API_BASE_URL = 'https://api.the-odds-api.com/v4';
        
        let userBalance = 1000;
        let bettingHistory = [];
        let currentGames = [];

        // Load saved data from localStorage
        function loadSavedData() {
            const savedBalance = localStorage.getItem('userBalance');
            const savedHistory = localStorage.getItem('bettingHistory');
            
            if (savedBalance) userBalance = parseFloat(savedBalance);
            if (savedHistory) bettingHistory = JSON.parse(savedHistory);
            
            updateBalanceDisplay();
            updateHistoryDisplay();
        }

        // Save data to localStorage
        function saveData() {
            localStorage.setItem('userBalance', userBalance);
            localStorage.setItem('bettingHistory', JSON.stringify(bettingHistory));
        }

        // Update balance display
        function updateBalanceDisplay() {
            document.getElementById('balance').textContent = userBalance.toFixed(2);
        }

        // Show message
        function showMessage(message, type = 'success') {
            const msgDiv = document.getElementById('message');
            msgDiv.textContent = message;
            msgDiv.className = `message ${type}`;
            msgDiv.style.display = 'block';
            msgDiv.style.animation = 'slideIn 0.5s ease-out';
            
            setTimeout(() => {
                msgDiv.style.display = 'none';
            }, 3000);
        }

        // Update history display
        function updateHistoryDisplay() {
            const historyDiv = document.getElementById('history');
            if (bettingHistory.length === 0) {
                historyDiv.innerHTML = '<p style="color: #999;">No bets placed yet</p>';
                return;
            }
            
            historyDiv.innerHTML = bettingHistory.slice().reverse().map(bet => `
                <div class="history-item ${bet.result}">
                    <span>${bet.game}</span>
                    <span>Bet: $${bet.amount}</span>
                    <span>Outcome: ${bet.result === 'win' ? `+$${bet.winAmount}` : `-$${bet.amount}`}</span>
                    <span>${new Date(bet.timestamp).toLocaleString()}</span>
                </div>
            `).join('');
        }

        // Fetch live games from API
        async function fetchGames() {
            try {
                const sports = ['basketball_nba', 'americanfootball_nfl', 'soccer_epl'];
                const allGames = [];
                
                for (const sport of sports) {
                    const response = await fetch(`${API_BASE_URL}/sports/${sport}/odds/?apiKey=${API_KEY}&regions=us&markets=h2h&oddsFormat=decimal`);
                    
                    if (!response.ok) {
                        console.warn(`Failed to fetch ${sport}`);
                        continue;
                    }
                    
                    const data = await response.json();
                    allGames.push(...data);
                }
                
                if (allGames.length === 0) {
                    // Fallback to demo data if API fails
                    return getDemoGames();
                }
                
                return allGames.slice(0, 6); // Limit to 6 games
            } catch (error) {
                console.error('Error fetching games:', error);
                return getDemoGames();
            }
        }

        // Demo games for fallback
        function getDemoGames() {
            return [
                {
                    id: '1',
                    home_team: 'Los Angeles Lakers',
                    away_team: 'Golden State Warriors',
                    sport_title: 'NBA',
                    commence_time: new Date().toISOString(),
                    bookmakers: [{
                        markets: [{
                            outcomes: [
                                { name: 'Los Angeles Lakers', price: 2.10 },
                                { name: 'Golden State Warriors', price: 1.85 }
                            ]
                        }]
                    }]
                },
                {
                    id: '2',
                    home_team: 'Kansas City Chiefs',
                    away_team: 'San Francisco 49ers',
                    sport_title: 'NFL',
                    commence_time: new Date().toISOString(),
                    bookmakers: [{
                        markets: [{
                            outcomes: [
                                { name: 'Kansas City Chiefs', price: 1.95 },
                                { name: 'San Francisco 49ers', price: 1.90 }
                            ]
                        }]
                    }]
                },
                {
                    id: '3',
                    home_team: 'Manchester City',
                    away_team: 'Liverpool',
                    sport_title: 'Premier League',
                    commence_time: new Date().toISOString(),
                    bookmakers: [{
                        markets: [{
                            outcomes: [
                                { name: 'Manchester City', price: 2.20 },
                                { name: 'Liverpool', price: 2.05 },
                                { name: 'Draw', price: 3.50 }
                            ]
                        }]
                    }]
                }
            ];
        }

        // Display games
        async function displayGames() {
            const gamesGrid = document.getElementById('gamesGrid');
            gamesGrid.innerHTML = '<div style="text-align: center; color: white;">Loading games...</div>';
            
            currentGames = await fetchGames();
            
            if (currentGames.length === 0) {
                gamesGrid.innerHTML = '<div style="text-align: center; color: white;">No games available at the moment</div>';
                return;
            }
            
            gamesGrid.innerHTML = currentGames.map(game => {
                const bookmaker = game.bookmakers?.[0];
                const market = bookmaker?.markets?.find(m => m.key === 'h2h');
                const outcomes = market?.outcomes || [];
                
                return `
                    <div class="game-card">
                        <div class="game-title">${game.home_team} vs ${game.away_team}</div>
                        <div class="game-odds">${game.sport_title} | ${new Date(game.commence_time).toLocaleString()}</div>
                        <div class="bet-form">
                            ${outcomes.map(outcome => `
                                <button class="bet-button" onclick="placeBet('${game.id}', '${outcome.name.replace(/'/g, "\\'")}', ${outcome.price}, '${game.home_team} vs ${game.away_team}')" style="margin-top: 10px; background: #2196F3;">
                                    Bet on ${outcome.name} @ ${outcome.price}
                                </button>
                            `).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Place a bet
        window.placeBet = async function(gameId, teamName, odds, gameTitle) {
            const betAmount = prompt(`Enter bet amount for ${teamName} (odds: ${odds}):`, "10");
            
            if (!betAmount) return;
            
            const amount = parseFloat(betAmount);
            
            if (isNaN(amount) || amount <= 0) {
                showMessage('Please enter a valid amount', 'error');
                return;
            }
            
            if (amount > userBalance) {
                showMessage('Insufficient balance!', 'error');
                return;
            }
            
            // Simulate bet outcome (in real app, this would be determined by actual game results)
            const random = Math.random();
            const isWin = random < (1 / odds); // Higher odds = lower chance of winning
            
            let winAmount = 0;
            let result = 'loss';
            
            if (isWin) {
                winAmount = amount * odds;
                userBalance += winAmount - amount;
                result = 'win';
                showMessage(`🎉 Congratulations! You won $${(winAmount - amount).toFixed(2)}!`, 'success');
            } else {
                userBalance -= amount;
                result = 'loss';
                showMessage(`😞 Sorry, you lost $${amount}. Better luck next time!`, 'error');
            }
            
            // Add to history
            bettingHistory.push({
                game: gameTitle,
                team: teamName,
                amount: amount,
                odds: odds,
                result: result,
                winAmount: winAmount,
                timestamp: new Date().toISOString()
            });
            
            // Keep only last 50 bets
            if (bettingHistory.length > 50) {
                bettingHistory = bettingHistory.slice(-50);
            }
            
            updateBalanceDisplay();
            updateHistoryDisplay();
            saveData();
        };

        // Refresh games
        async function refreshGames() {
            await displayGames();
            showMessage('Games refreshed!', 'success');
        }

        // Reset balance
        function resetBalance() {
            if (confirm('Are you sure you want to reset your balance to $1000?')) {
                userBalance = 1000;
                bettingHistory = [];
                updateBalanceDisplay();
                updateHistoryDisplay();
                saveData();
                showMessage('Balance reset to $1000', 'success');
            }
        }

        // Add refresh and reset buttons
        function addControls() {
            const header = document.querySelector('.header');
            const controlsDiv = document.createElement('div');
            controlsDiv.style.marginTop = '15px';
            controlsDiv.innerHTML = `
                <button onclick="refreshGames()" style="padding: 10px 20px; margin-right: 10px; background: #2196F3; color: white; border: none; border-radius: 5px; cursor: pointer;">Refresh Games</button>
                <button onclick="resetBalance()" style="padding: 10px 20px; background: #f44336; color: white; border: none; border-radius: 5px; cursor: pointer;">Reset Balance</button>
            `;
            header.appendChild(controlsDiv);
        }

        // Initialize the platform
        async function init() {
            loadSavedData();
            await displayGames();
            addControls();
            
            // Auto-refresh games every 30 seconds
            setInterval(refreshGames, 30000);
        }

        // Start the application
        init();
    </script>
</body>
</html>
