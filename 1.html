<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚽ Xlodon Bet - Live Football</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
        :root{--primary:#00ff9d;--danger:#ff4757;--bg:#0a0f1a;--surface:#111827;--surface-light:#1a2332;--text:#fff;--text-dim:#94a3b8}
        body{background:var(--bg);color:var(--text);padding-bottom:70px}
        .header{background:var(--surface);padding:12px 16px;display:flex;justify-content:space-between;border-bottom:2px solid var(--primary);position:sticky;top:0}
        .logo{font-size:20px;font-weight:700;color:var(--primary)}
        .balance{background:var(--surface-light);padding:6px 12px;border-radius:20px;border:1px solid var(--primary)}
        .main{padding:16px;max-width:1200px;margin:0 auto}
        .tabs{display:flex;gap:10px;margin-bottom:16px;overflow-x:auto}
        .tab{padding:10px 20px;background:var(--surface-light);border-radius:30px;cursor:pointer;border:none;color:var(--text)}
        .tab.active{background:var(--primary);color:#000}
        .matches{display:flex;flex-direction:column;gap:12px}
        .match{background:var(--surface);border-radius:16px;padding:12px;border:1px solid #1e293b}
        .match-header{display:flex;justify-content:space-between;font-size:12px;color:var(--text-dim);margin-bottom:8px}
        .teams{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
        .team{font-weight:600}
        .score{font-size:20px;font-weight:700;color:var(--primary)}
        .live{background:var(--danger);padding:2px 8px;border-radius:20px;font-size:10px;animation:pulse 1s infinite}
        @keyframes pulse{50%{opacity:0.5}}
        .odds-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
        .odd-btn{padding:8px;background:var(--surface-light);border-radius:8px;text-align:center;cursor:pointer}
        .odd-btn:hover{background:var(--primary)}
        .odd-name{font-size:10px;color:var(--text-dim)}
        .odd-value{font-weight:700;color:var(--primary)}
        .betslip{position:fixed;right:16px;top:80px;width:320px;background:var(--surface);border-radius:16px;padding:16px;border:2px solid var(--primary);z-index:100}
        .betslip-header{display:flex;justify-content:space-between;margin-bottom:12px}
        .betslip-items{max-height:300px;overflow-y:auto;margin-bottom:12px}
        .betslip-item{background:var(--surface-light);padding:10px;border-radius:8px;margin-bottom:8px}
        .remove{color:var(--danger);cursor:pointer;float:right}
        .bet-input{display:flex;background:var(--surface-light);border-radius:30px;padding:0 16px;margin:12px 0}
        .bet-input input{flex:1;padding:12px 0;background:transparent;border:none;color:var(--text);outline:none}
        .place-btn{width:100%;padding:14px;background:var(--primary);border:none;border-radius:30px;color:#000;font-weight:700;cursor:pointer}
        .place-btn:disabled{opacity:0.5}
        .nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);display:flex;justify-content:space-around;padding:8px;border-top:2px solid var(--primary)}
        .nav-item{text-align:center;color:var(--text-dim);text-decoration:none;font-size:11px}
        .nav-item.active{color:var(--primary)}
        .toast{position:fixed;bottom:80px;left:16px;right:16px;background:var(--surface);padding:12px;border-radius:30px;text-align:center;z-index:1000}
        .loading{border:3px solid var(--surface-light);border-top-color:var(--primary);border-radius:50%;width:40px;height:40px;animation:spin 1s linear infinite;margin:20px auto}
        @keyframes spin{to{transform:rotate(360deg)}}
        .status{background:rgba(0,255,157,0.1);padding:8px;border-radius:8px;text-align:center;font-size:12px;margin-bottom:12px}
        @media(max-width:768px){.betslip{position:relative;right:0;top:0;width:100%;margin-top:16px}}
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">⚽ Xlodon Bet</div>
        <div class="balance">💰 $<span id="balance">0</span></div>
    </div>

    <div class="main">
        <div class="tabs" id="tabs">
            <button class="tab active" data-market="all">📋 All</button>
            <button class="tab" data-market="live">🔴 Live</button>
        </div>
        
        <div class="status" id="status">🔄 Loading real matches from Sportmonks...</div>
        
        <div class="matches" id="matches">
            <div class="loading"></div>
        </div>
    </div>

    <div class="betslip">
        <div class="betslip-header">
            <strong>🎯 BET SLIP</strong>
            <button id="clearBtn" style="background:none;border:none;color:var(--danger);cursor:pointer">Clear</button>
        </div>
        <div class="betslip-items" id="betslipItems">
            <div style="text-align:center;padding:20px;color:var(--text-dim)">Click odds to add</div>
        </div>
        <div class="bet-input">
            <input type="number" id="stake" value="10" min="1" step="1">
            <span>$</span>
        </div>
        <div style="display:flex;justify-content:space-between;margin:8px 0">
            <span>Total Odds:</span>
            <span id="totalOdds" style="color:var(--primary);font-weight:700">0.00</span>
        </div>
        <div style="display:flex;justify-content:space-between;margin:8px 0">
            <span>Potential Return:</span>
            <span id="potentialReturn" style="color:var(--primary);font-weight:700">$0.00</span>
        </div>
        <button class="place-btn" id="placeBtn" disabled>PLACE BET</button>
    </div>

    <div class="nav">
        <a href="#" class="nav-item active">⚽ Football</a>
        <a href="#" class="nav-item">🎫 My Bets</a>
        <a href="#" class="nav-item">🏠 Home</a>
    </div>

    <div id="toast"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const API_TOKEN = "DkFdWG9jFZvH8XSEgLrRfGwczABWVg5rlV25GvIRyN06zdPsOI48Nsv9Wooy";
        
        let currentUser = null;
        let balance = 0;
        let matches = [];
        let selectedBets = [];
        let currentMarket = 'all';

        auth.onAuthStateChanged(async (user) => {
            if (user) {
                currentUser = user;
                await loadBalance();
                await fetchMatches();
                setInterval(fetchMatches, 60000);
                showToast(`Welcome ${user.email}`, 'success');
            } else {
                window.location.href = 'https://xcrazybet.github.io/millioner/login.html';
            }
        });

        async function fetchMatches() {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = '🔄 Fetching REAL live matches from Sportmonks...';
            
            try {
                const url = `https://api.sportmonks.com/v3/football/livescores/inplay?api_token=${API_TOKEN}&include=participants;scores;league`;
                const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(url)}`;
                const response = await fetch(proxyUrl);
                const data = await response.json();
                
                if (data.data && data.data.length > 0) {
                    matches = data.data.map(f => {
                        const home = f.participants?.find(p => p.meta?.location === 'home') || f.participants?.[0];
                        const away = f.participants?.find(p => p.meta?.location === 'away') || f.participants?.[1];
                        const score = f.scores?.find(s => s.description === 'CURRENT') || f.scores?.[0];
                        return {
                            id: f.id,
                            league: f.league?.name || 'Football',
                            home: home?.name || 'Home',
                            away: away?.name || 'Away',
                            homeScore: score?.score?.goals || 0,
                            awayScore: score?.score?.opponent_goals || 0,
                            live: true,
                            odds: { home: 2.1 + Math.random() * 0.5, draw: 3.2 + Math.random() * 0.3, away: 2.8 + Math.random() * 0.5 }
                        };
                    });
                    statusDiv.innerHTML = `✅ ${matches.length} REAL live matches from Sportmonks API`;
                } else {
                    statusDiv.innerHTML = '⚠️ No live matches right now. Showing preview.';
                    matches = [
                        { id: 1, league: 'Premier League', home: 'Manchester United', away: 'Arsenal', homeScore: null, awayScore: null, live: false, odds: { home: 2.10, draw: 3.40, away: 3.20 } },
                        { id: 2, league: 'La Liga', home: 'Barcelona', away: 'Real Madrid', homeScore: null, awayScore: null, live: false, odds: { home: 2.30, draw: 3.30, away: 2.90 } },
                        { id: 3, league: 'Bundesliga', home: 'Bayern Munich', away: 'Dortmund', homeScore: null, awayScore: null, live: false, odds: { home: 1.85, draw: 3.60, away: 3.80 } }
                    ];
                }
                renderMatches();
            } catch(err) {
                console.error(err);
                statusDiv.innerHTML = '⚠️ API error. Showing preview matches.';
                matches = [
                    { id: 1, league: 'Premier League', home: 'Manchester United', away: 'Arsenal', homeScore: null, awayScore: null, live: false, odds: { home: 2.10, draw: 3.40, away: 3.20 } },
                    { id: 2, league: 'La Liga', home: 'Barcelona', away: 'Real Madrid', homeScore: null, awayScore: null, live: false, odds: { home: 2.30, draw: 3.30, away: 2.90 } }
                ];
                renderMatches();
            }
        }

        function renderMatches() {
            let filtered = matches;
            if (currentMarket === 'live') filtered = matches.filter(m => m.live);
            
            const container = document.getElementById('matches');
            if (filtered.length === 0) {
                container.innerHTML = '<div style="text-align:center;padding:40px">No matches</div>';
                return;
            }
            
            container.innerHTML = filtered.map(m => `
                <div class="match">
                    <div class="match-header">
                        <span>🏆 ${m.league}</span>
                        <span>${m.live ? '<span class="live">🔴 LIVE</span>' : 'Upcoming'}</span>
                    </div>
                    <div class="teams">
                        <span class="team">${m.home}</span>
                        <span class="score">${m.homeScore !== null ? m.homeScore : '-'} : ${m.awayScore !== null ? m.awayScore : '-'}</span>
                        <span class="team">${m.away}</span>
                    </div>
                    <div class="odds-grid">
                        <div class="odd-btn" onclick="addBet('${m.id}', '1', ${m.odds.home}, '${m.home}')">
                            <div class="odd-name">HOME</div>
                            <div class="odd-value">${m.odds.home.toFixed(2)}</div>
                        </div>
                        <div class="odd-btn" onclick="addBet('${m.id}', 'X', ${m.odds.draw}, 'Draw')">
                            <div class="odd-name">DRAW</div>
                            <div class="odd-value">${m.odds.draw.toFixed(2)}</div>
                        </div>
                        <div class="odd-btn" onclick="addBet('${m.id}', '2', ${m.odds.away}, '${m.away}')">
                            <div class="odd-name">AWAY</div>
                            <div class="odd-value">${m.odds.away.toFixed(2)}</div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        window.addBet = function(matchId, selection, odds, display) {
            const match = matches.find(m => m.id == matchId);
            if (!match) return;
            selectedBets = [{ matchId, matchName: `${match.home} vs ${match.away}`, selection, display, odds }];
            updateBetSlip();
            showToast(`Added: ${display} @ ${odds}`, 'success');
        };

        function updateBetSlip() {
            const container = document.getElementById('betslipItems');
            const stake = parseFloat(document.getElementById('stake').value) || 10;
            const totalOdds = selectedBets.reduce((a, b) => a * b.odds, 1);
            const potential = stake * totalOdds;
            
            document.getElementById('totalOdds').textContent = totalOdds.toFixed(2);
            document.getElementById('potentialReturn').textContent = `$${potential.toFixed(2)}`;
            document.getElementById('placeBtn').disabled = selectedBets.length === 0;
            
            if (selectedBets.length === 0) {
                container.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-dim)">Click odds to add</div>';
            } else {
                container.innerHTML = selectedBets.map((bet, i) => `
                    <div class="betslip-item">
                        <span class="remove" onclick="removeBet(${i})">✖</span>
                        <strong>${bet.matchName}</strong><br>
                        ${bet.display} @ ${bet.odds.toFixed(2)}
                    </div>
                `).join('');
            }
        }

        window.removeBet = (i) => { selectedBets.splice(i, 1); updateBetSlip(); };

        async function loadBalance() {
            const doc = await db.collection('wallets').doc(currentUser.uid).get();
            balance = doc.exists ? doc.data().balance : 100;
            if (!doc.exists) await db.collection('wallets').doc(currentUser.uid).set({ balance: 100 });
            document.getElementById('balance').textContent = balance.toFixed(2);
        }

        async function placeBet() {
            const stake = parseFloat(document.getElementById('stake').value);
            if (selectedBets.length === 0) return showToast('No bets selected', 'error');
            if (stake > balance) return showToast('Insufficient funds', 'error');
            
            const totalOdds = selectedBets.reduce((a, b) => a * b.odds, 1);
            const ticket = `TKT-${Date.now()}-${Math.random().toString(36).substr(2, 6)}`;
            
            await db.collection('wallets').doc(currentUser.uid).update({ balance: balance - stake });
            await db.collection('football_bets').doc(ticket).set({
                ticketNumber: ticket,
                userId: currentUser.uid,
                selections: selectedBets,
                stake: stake,
                totalOdds: totalOdds,
                status: 'pending',
                createdAt: new Date()
            });
            
            balance -= stake;
            document.getElementById('balance').textContent = balance.toFixed(2);
            selectedBets = [];
            updateBetSlip();
            showToast(`✅ Bet placed! Ticket: ${ticket}`, 'success');
        }

        function showToast(msg, type) {
            const toast = document.getElementById('toast');
            toast.innerHTML = `<div style="background:#111827;padding:12px;border-radius:30px;border-left:4px solid ${type === 'success' ? '#00ff9d' : '#ff4757'}">${msg}</div>`;
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 3000);
        }

        document.getElementById('placeBtn').onclick = placeBet;
        document.getElementById('clearBtn').onclick = () => { selectedBets = []; updateBetSlip(); };
        document.getElementById('stake').oninput = updateBetSlip;
        
        document.querySelectorAll('.tab').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                btn.classList.add('active');
                currentMarket = btn.dataset.market;
                renderMatches();
            };
        });
    </script>
</body>
</html>
