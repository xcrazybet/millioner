<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced Working Betting Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes pulse-live {
            0%, 100% { background-color: rgb(239, 68, 68); }
            50% { background-color: rgb(220, 38, 38); }
        }
        .live-indicator {
            animation: pulse-live 2s infinite;
        }
        @keyframes slide-in {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .toast-notification {
            animation: slide-in 0.3s ease-out;
        }
        .match-card {
            transition: all 0.3s ease;
        }
        .match-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .odds-button {
            transition: all 0.2s ease;
        }
        .odds-button:hover {
            transform: scale(1.05);
        }
        .time-display {
            font-variant-numeric: tabular-nums;
        }
        .animate-spin {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Header -->
    <header class="bg-gradient-to-r from-blue-600 to-purple-600 text-white shadow-lg">
        <div class="container mx-auto px-4 py-4">
            <div class="flex justify-between items-center">
                <div class="flex items-center space-x-3">
                    <i class="fas fa-futbol text-3xl"></i>
                    <h1 class="text-2xl font-bold">Enhanced Working Betting Platform</h1>
                    <div class="flex items-center space-x-2">
                        <div class="w-3 h-3 bg-green-400 rounded-full animate-pulse"></div>
                        <span class="text-sm">Live Updates</span>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <div class="bg-white bg-opacity-20 px-3 py-2 rounded-lg">
                        <i class="fas fa-sync-alt mr-2"></i>
                        <span id="updateCounter">0</span> updates
                    </div>
                    <div class="bg-white bg-opacity-20 px-3 py-2 rounded-lg">
                        <i class="fas fa-clock mr-2"></i>
                        <span id="lastUpdate">Never</span>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-6">
        <!-- Tab Navigation -->
        <div class="bg-white rounded-lg shadow-md mb-6">
            <div class="flex border-b">
                <button onclick="switchTab('live')" class="tab-btn flex-1 py-3 px-4 font-semibold text-center hover:bg-gray-50 transition border-b-2 border-red-500 text-red-600" data-tab="live">
                    <i class="fas fa-broadcast-tower mr-2"></i>🔥 Live <span id="liveCount" class="bg-red-500 text-white px-2 py-1 rounded-full text-xs">0</span>
                </button>
                <button onclick="switchTab('upcoming')" class="tab-btn flex-1 py-3 px-4 font-semibold text-center hover:bg-gray-50 transition border-b-2 border-transparent" data-tab="upcoming">
                    <i class="fas fa-calendar-alt mr-2"></i>📅 Upcoming <span id="upcomingCount" class="bg-blue-500 text-white px-2 py-1 rounded-full text-xs">0</span>
                </button>
                <button onclick="switchTab('finished')" class="tab-btn flex-1 py-3 px-4 font-semibold text-center hover:bg-gray-50 transition border-b-2 border-transparent" data-tab="finished">
                    <i class="fas fa-flag-checkered mr-2"></i>🏁 Finished <span id="finishedCount" class="bg-green-500 text-white px-2 py-1 rounded-full text-xs">0</span>
                </button>
            </div>
        </div>

        <!-- Controls -->
        <div class="bg-white rounded-lg shadow-md p-4 mb-6">
            <div class="flex justify-between items-center">
                <div class="flex space-x-2">
                    <button onclick="toggleAutoUpdate()" id="autoUpdateBtn" class="bg-green-500 text-white px-4 py-2 rounded-lg font-semibold hover:bg-green-600 transition">
                        <i class="fas fa-play mr-2"></i>Auto Update: ON
                    </button>
                    <button onclick="manualRefresh()" class="bg-blue-500 text-white px-4 py-2 rounded-lg font-semibold hover:bg-blue-600 transition">
                        <i class="fas fa-sync mr-2"></i>Refresh Now
                    </button>
                    <button onclick="testConnection()" class="bg-purple-500 text-white px-4 py-2 rounded-lg font-semibold hover:bg-purple-600 transition">
                        <i class="fas fa-vial mr-2"></i>Test Connection
                    </button>
                    <button onclick="trySampleData()" class="bg-orange-500 text-white px-4 py-2 rounded-lg font-semibold hover:bg-orange-600 transition">
                        <i class="fas fa-database mr-2"></i>Sample Data
                    </button>
                </div>
                <div class="text-sm text-gray-600">
                    Update interval: <span id="updateInterval">7</span> seconds
                </div>
            </div>
        </div>

        <!-- Loading State -->
        <div id="loadingState" class="hidden">
            <div class="flex justify-center items-center py-12">
                <div class="text-center">
                    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto mb-4"></div>
                    <p class="text-gray-600 font-semibold">Loading matches...</p>
                </div>
            </div>
        </div>

        <!-- Matches Container -->
        <div id="matchesContainer" class="space-y-4">
            <!-- Matches will be loaded here -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden">
            <div class="text-center py-12 bg-white rounded-lg shadow">
                <i class="fas fa-futbol text-6xl text-gray-300 mb-4"></i>
                <h3 class="text-xl font-semibold text-gray-600 mb-2">No matches found</h3>
                <p class="text-gray-500">Try sample data or check connection</p>
            </div>
        </div>
    </main>

    <!-- Toast Container -->
    <div id="toastContainer" class="fixed top-4 right-4 z-50 space-y-2"></div>

    <script>
        // Configuration
        const API_TOKEN = 'DkFdWG9jFZvH8XSEgLrRfGwczABWVg5rlV25GvIRyN06zdPsOI48Nsv9Wooy';
        const BASE_URL = 'https://api.sportmonks.com/v3/football';
        const UPDATE_INTERVAL = 7000; // 7 seconds
        
        // CORS Proxies (same as working version)
        const PROXIES = [
            'https://cors-anywhere.herokuapp.com/',
            'https://api.allorigins.win/raw?url=',
            'https://corsproxy.io/?',
            'https://cors.bridged.cc/'
        ];
        
        // Global state
        let currentTab = 'live';
        let autoUpdateEnabled = true;
        let updateIntervalId = null;
        let updateCounter = 0;
        let currentProxy = 0;
        let matchData = {
            live: [],
            upcoming: [],
            finished: []
        };

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            console.log('🚀 Enhanced Working Betting Platform Initialized');
            
            // Show initial loading state
            showLoading(true);
            
            // Start auto-update
            startAutoUpdate();
            
            // Load initial matches
            setTimeout(() => {
                loadMatches();
            }, 1000); // 1 second delay to show loading state
        });

        // Tab switching
        function switchTab(tab) {
            currentTab = tab;
            
            // Update tab buttons
            document.querySelectorAll('.tab-btn').forEach(btn => {
                if (btn.dataset.tab === tab) {
                    btn.classList.add('border-red-500', 'text-red-600');
                    btn.classList.remove('border-transparent');
                } else {
                    btn.classList.remove('border-red-500', 'text-red-600');
                    btn.classList.add('border-transparent');
                }
            });
            
            loadMatches();
        }

        // Auto update control
        function toggleAutoUpdate() {
            autoUpdateEnabled = !autoUpdateEnabled;
            const btn = document.getElementById('autoUpdateBtn');
            
            if (autoUpdateEnabled) {
                startAutoUpdate();
                btn.innerHTML = '<i class="fas fa-pause mr-2"></i>Auto Update: ON';
                btn.className = 'bg-green-500 text-white px-4 py-2 rounded-lg font-semibold hover:bg-green-600 transition';
                showToast('success', 'Auto Update', 'Live updates enabled');
            } else {
                stopAutoUpdate();
                btn.innerHTML = '<i class="fas fa-play mr-2"></i>Auto Update: OFF';
                btn.className = 'bg-red-500 text-white px-4 py-2 rounded-lg font-semibold hover:bg-red-600 transition';
                showToast('warning', 'Auto Update', 'Live updates disabled');
            }
        }

        function startAutoUpdate() {
            if (updateIntervalId) clearInterval(updateIntervalId);
            updateIntervalId = setInterval(() => {
                if (autoUpdateEnabled) {
                    loadMatches(true);
                }
            }, UPDATE_INTERVAL);
        }

        function stopAutoUpdate() {
            if (updateIntervalId) {
                clearInterval(updateIntervalId);
                updateIntervalId = null;
            }
        }

        // Manual refresh
        function manualRefresh() {
            loadMatches(true);
            showToast('info', 'Manual Refresh', 'Updating matches...');
        }

        // Load matches
        async function loadMatches(isRefresh = false) {
            showLoading(true);
            
            try {
                let loaded = false;
                
                switch(currentTab) {
                    case 'live':
                        await loadLiveMatches(isRefresh);
                        loaded = true;
                        break;
                    case 'upcoming':
                        await loadUpcomingMatches(isRefresh);
                        loaded = true;
                        break;
                    case 'finished':
                        await loadFinishedMatches(isRefresh);
                        loaded = true;
                        break;
                }
                
                if (!loaded) {
                    renderMatches([], currentTab);
                }
                
            } catch (error) {
                console.error('💥 Load error:', error);
                showToast('error', 'Load Error', error.message);
                renderMatches([], currentTab);
            } finally {
                setTimeout(() => {
                    showLoading(false);
                }, 500); // Small delay to show loading state
            }
        }

        // Load live matches with working fetch
        async function loadLiveMatches(isRefresh = false) {
            try {
                console.log('🔥 Loading enhanced live matches...');
                
                // Try inplay first with full includes
                let url = `${BASE_URL}/livescores/inplay?api_token=${API_TOKEN}&include=state;participants;league;scores;events;lineups;statistics&per_page=20`;
                let response = await callAPI(url);
                
                if (!response || !response.data || response.data.length === 0) {
                    // Fallback to general livescores
                    url = `${BASE_URL}/livescores?api_token=${API_TOKEN}&include=state;participants;league;scores;events&per_page=20`;
                    response = await callAPI(url);
                    
                    if (response && response.data) {
                        response.data = response.data.filter(match => [2, 3, 4, 5, 6].includes(match.state_id));
                    }
                }
                
                if (response && response.data) {
                    matchData.live = response.data;
                    renderMatches(response.data, 'live');
                    updateCounts();
                    
                    if (isRefresh) {
                        updateCounter++;
                        document.getElementById('updateCounter').textContent = updateCounter;
                        document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
                        
                        if (response.data.length > 0) {
                            showToast('success', 'Live Update', `${response.data.length} live matches updated`);
                        }
                    }
                } else {
                    renderMatches([], 'live');
                }
            } catch (error) {
                console.error('💥 Live matches error:', error);
                renderMatches([], 'live');
            }
        }

        // Load upcoming matches
        async function loadUpcomingMatches(isRefresh = false) {
            try {
                console.log('📅 Loading enhanced upcoming matches...');
                
                const today = new Date().toISOString().split('T')[0];
                const tomorrow = new Date(Date.now() + 24 * 60 * 60 * 1000).toISOString().split('T')[0];
                
                // Try today first
                let url = `${BASE_URL}/fixtures/date/${today}?api_token=${API_TOKEN}&include=state;participants;league;scores;lineups&per_page=25`;
                let response = await callAPI(url);
                
                if (!response || !response.data || response.data.length === 0) {
                    // Try tomorrow
                    url = `${BASE_URL}/fixtures/date/${tomorrow}?api_token=${API_TOKEN}&include=state;participants;league;scores;lineups&per_page=25`;
                    response = await callAPI(url);
                }
                
                if (response && response.data) {
                    const upcoming = response.data.filter(match => [1, 45, 46].includes(match.state_id))
                        .sort((a, b) => new Date(a.starting_at) - new Date(b.starting_at));
                    
                    matchData.upcoming = upcoming;
                    renderMatches(upcoming, 'upcoming');
                    updateCounts();
                    
                    if (isRefresh && upcoming.length > 0) {
                        showToast('success', 'Upcoming Update', `${upcoming.length} upcoming matches updated`);
                    }
                } else {
                    renderMatches([], 'upcoming');
                }
            } catch (error) {
                console.error('💥 Upcoming matches error:', error);
                renderMatches([], 'upcoming');
            }
        }

        // Load finished matches
        async function loadFinishedMatches(isRefresh = false) {
            try {
                console.log('🏁 Loading enhanced finished matches...');
                
                const yesterday = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString().split('T')[0];
                
                // Try yesterday's matches
                let url = `${BASE_URL}/fixtures/date/${yesterday}?api_token=${API_TOKEN}&include=state;participants;league;scores;events&per_page=25`;
                let response = await callAPI(url);
                
                if (response && response.data) {
                    const finished = response.data.filter(match => [100, 90, 5].includes(match.state_id))
                        .sort((a, b) => new Date(b.starting_at) - new Date(a.starting_at));
                    
                    matchData.finished = finished;
                    renderMatches(finished, 'finished');
                    updateCounts();
                    
                    if (isRefresh && finished.length > 0) {
                        showToast('success', 'Finished Update', `${finished.length} finished matches updated`);
                    }
                } else {
                    renderMatches([], 'finished');
                }
            } catch (error) {
                console.error('💥 Finished matches error:', error);
                renderMatches([], 'finished');
            }
        }

        // Working API call function (same as JSONP version)
        async function callAPI(url) {
            for (let i = 0; i < PROXIES.length; i++) {
                const proxy = PROXIES[i];
                const proxyUrl = proxy + url;
                
                try {
                    console.log(`📡 Trying proxy ${i + 1}/${PROXIES.length}:`, proxy);
                    
                    const response = await fetch(proxyUrl);
                    console.log(`📊 Proxy ${i + 1} response:`, response.status);
                    
                    if (response.ok) {
                        const data = await response.json();
                        console.log(`✅ Proxy ${i + 1} success!`, data);
                        
                        currentProxy = i;
                        return data;
                    }
                } catch (error) {
                    console.log(`❌ Proxy ${i + 1} failed:`, error.message);
                }
            }
            
            console.log('❌ All proxies failed');
            return null;
        }

        // Render matches with enhanced display
        function renderMatches(matches, type) {
            const container = document.getElementById('matchesContainer');
            const emptyState = document.getElementById('emptyState');
            
            // Always hide empty state first
            emptyState.classList.add('hidden');
            
            if (!matches || matches.length === 0) {
                container.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }
            
            emptyState.classList.add('hidden');
            
            let html = '';
            matches.forEach(match => {
                html += createMatchCard(match, type);
            });
            
            // Ensure container is visible before setting content
            container.style.display = 'block';
            container.innerHTML = html;
        }

        // Create enhanced match card
        function createMatchCard(match, type) {
            const participants = match.participants || [];
            const homeTeam = participants.find(p => p.meta?.location === 'home') || participants[0];
            const awayTeam = participants.find(p => p.meta?.location === 'away') || participants[1];
            const scores = match.scores || {};
            const homeScore = scores.home_score || 0;
            const awayScore = scores.away_score || 0;
            const league = match.league || {};
            const state = match.state || {};
            
            const timeDisplay = getTimeDisplay(match, type);
            const isLive = type === 'live';
            
            return `
                <div class="match-card bg-white rounded-lg shadow-md p-6">
                    <div class="flex justify-between items-start mb-4">
                        <div class="flex items-center space-x-3">
                            ${isLive ? '<span class="live-indicator text-white px-3 py-1 rounded-full text-xs font-bold">LIVE</span>' : ''}
                            <div>
                                <div class="font-semibold text-gray-800">${league.name || 'League'}</div>
                                <div class="text-sm text-gray-500">${league.country?.name || 'International'}</div>
                            </div>
                        </div>
                        <div class="text-right">
                            <div class="text-sm font-semibold text-gray-700">${timeDisplay.text}</div>
                            <div class="text-xs text-gray-500">${timeDisplay.subtext}</div>
                        </div>
                    </div>
                    
                    <div class="flex justify-between items-center mb-4">
                        <div class="flex-1 text-center">
                            <div class="font-bold text-lg mb-2">${homeTeam?.name || 'Home Team'}</div>
                            ${isLive ? `<div class="text-3xl font-bold text-blue-600 time-display">${homeScore}</div>` : ''}
                            ${!isLive && type === 'upcoming' ? '<div class="text-gray-400">-</div>' : ''}
                            ${!isLive && type === 'finished' ? `<div class="text-2xl font-bold text-gray-600">${homeScore}</div>` : ''}
                        </div>
                        <div class="px-6">
                            <div class="text-gray-400 font-semibold">VS</div>
                            ${isLive && timeDisplay.minute ? `<div class="text-xs text-center mt-1 text-red-600 font-bold">${timeDisplay.minute}</div>` : ''}
                        </div>
                        <div class="flex-1 text-center">
                            <div class="font-bold text-lg mb-2">${awayTeam?.name || 'Away Team'}</div>
                            ${isLive ? `<div class="text-3xl font-bold text-blue-600 time-display">${awayScore}</div>` : ''}
                            ${!isLive && type === 'upcoming' ? '<div class="text-gray-400">-</div>' : ''}
                            ${!isLive && type === 'finished' ? `<div class="text-2xl font-bold text-gray-600">${awayScore}</div>` : ''}
                        </div>
                    </div>
                    
                    ${isLive ? `
                        <div class="border-t pt-3">
                            <div class="flex justify-between items-center">
                                <div class="text-sm text-gray-600">
                                    <i class="fas fa-clock mr-1"></i>
                                    Match started: ${formatTime(match.starting_at)}
                                </div>
                                <div class="text-sm text-gray-600">
                                    State: ${state.name || 'Live'}
                                </div>
                            </div>
                        </div>
                    ` : ''}
                    
                    ${type === 'upcoming' ? `
                        <div class="border-t pt-3">
                            <div class="flex justify-between items-center">
                                <div class="text-sm text-gray-600">
                                    <i class="fas fa-calendar mr-1"></i>
                                    ${formatDate(match.starting_at)}
                                </div>
                                <div class="text-sm text-gray-600">
                                    <i class="fas fa-clock mr-1"></i>
                                    ${formatTime(match.starting_at)}
                                </div>
                            </div>
                        </div>
                    ` : ''}
                    
                    <div class="mt-4 grid grid-cols-3 gap-2">
                        <button class="odds-button bg-blue-50 hover:bg-blue-100 text-blue-700 py-2 px-3 rounded-lg font-semibold text-sm">
                            1<br>2.45
                        </button>
                        <button class="odds-button bg-gray-50 hover:bg-gray-100 text-gray-700 py-2 px-3 rounded-lg font-semibold text-sm">
                            X<br>3.20
                        </button>
                        <button class="odds-button bg-blue-50 hover:bg-blue-100 text-blue-700 py-2 px-3 rounded-lg font-semibold text-sm">
                            2<br>2.80
                        </button>
                    </div>
                </div>
            `;
        }

        // Get time display based on match type
        function getTimeDisplay(match, type) {
            if (type === 'live') {
                const state = match.state || {};
                const minute = state.minute;
                
                if (minute) {
                    if (minute <= 45) {
                        return { text: `${minute}'`, subtext: 'First Half', minute: minute + "'" };
                    } else if (minute <= 50) {
                        return { text: 'HT', subtext: 'Half Time' };
                    } else if (minute <= 90) {
                        return { text: `${minute}'`, subtext: 'Second Half', minute: minute + "'" };
                    } else {
                        return { text: `${minute}'`, subtext: 'Added Time', minute: minute + "'" };
                    }
                }
                
                return { text: 'LIVE', subtext: 'In Progress' };
            }
            
            if (type === 'upcoming') {
                const date = new Date(match.starting_at);
                const now = new Date();
                const diffMs = date - now;
                const diffHours = Math.floor(diffMs / (1000 * 60 * 60));
                const diffDays = Math.floor(diffHours / 24);
                
                if (diffDays > 0) {
                    return { text: `In ${diffDays} day${diffDays > 1 ? 's' : ''}`, subtext: date.toLocaleDateString() };
                } else if (diffHours > 0) {
                    return { text: `In ${diffHours} hour${diffHours > 1 ? 's' : ''}`, subtext: date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) };
                } else {
                    return { text: 'Starting Soon', subtext: date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) };
                }
            }
            
            if (type === 'finished') {
                return { text: 'FT', subtext: formatDate(match.starting_at) };
            }
            
            return { text: 'N/A', subtext: '' };
        }

        // Format time
        function formatTime(timeString) {
            if (!timeString) return 'Time TBD';
            return new Date(timeString).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        // Format date
        function formatDate(timeString) {
            if (!timeString) return 'Date TBD';
            return new Date(timeString).toLocaleDateString();
        }

        // Update counts
        function updateCounts() {
            document.getElementById('liveCount').textContent = matchData.live.length;
            document.getElementById('upcomingCount').textContent = matchData.upcoming.length;
            document.getElementById('finishedCount').textContent = matchData.finished.length;
        }

        // Show/hide loading
        function showLoading(show) {
            const loadingState = document.getElementById('loadingState');
            const matchesContainer = document.getElementById('matchesContainer');
            const emptyState = document.getElementById('emptyState');
            
            if (show) {
                loadingState.classList.remove('hidden');
                matchesContainer.style.display = 'none';
                emptyState.classList.add('hidden');
            } else {
                loadingState.classList.add('hidden');
                matchesContainer.style.display = 'block';
            }
        }

        // Test connection
        async function testConnection() {
            showToast('info', 'Testing', 'Testing API connection...');
            
            try {
                const url = `${BASE_URL}/livescores?api_token=${API_TOKEN}&include=state;participants;league;scores&per_page=3`;
                const response = await callAPI(url);
                
                if (response) {
                    showToast('success', 'Connection OK', `API working! Found ${response.data?.length || 0} matches`);
                } else {
                    showToast('error', 'Connection Failed', 'All proxies failed');
                }
            } catch (error) {
                showToast('error', 'Connection Failed', error.message);
            }
        }

        // Try sample data
        function trySampleData() {
            const sampleMatches = [
                {
                    id: 1,
                    state_id: 2,
                    state: { name: 'Live', minute: 23 },
                    starting_at: new Date().toISOString(),
                    league: { name: 'Premier League', country: { name: 'England' } },
                    participants: [
                        { name: 'Manchester United', meta: { location: 'home' } },
                        { name: 'Liverpool', meta: { location: 'away' } }
                    ],
                    scores: { home_score: 2, away_score: 1 }
                },
                {
                    id: 2,
                    state_id: 2,
                    state: { name: 'Live', minute: 67 },
                    starting_at: new Date().toISOString(),
                    league: { name: 'La Liga', country: { name: 'Spain' } },
                    participants: [
                        { name: 'Real Madrid', meta: { location: 'home' } },
                        { name: 'Barcelona', meta: { location: 'away' } }
                    ],
                    scores: { home_score: 1, away_score: 1 }
                },
                {
                    id: 3,
                    state_id: 1,
                    state: { name: 'NS' },
                    starting_at: new Date(Date.now() + 2 * 60 * 60 * 1000).toISOString(),
                    league: { name: 'Serie A', country: { name: 'Italy' } },
                    participants: [
                        { name: 'Juventus', meta: { location: 'home' } },
                        { name: 'AC Milan', meta: { location: 'away' } }
                    ],
                    scores: { home_score: 0, away_score: 0 }
                }
            ];
            
            matchData[currentTab] = sampleMatches;
            renderMatches(sampleMatches, currentTab);
            updateCounts();
            showToast('success', 'Sample Data', `Loaded ${sampleMatches.length} sample matches`);
        }

        // Toast notification
        function showToast(type, title, message) {
            const toastContainer = document.getElementById('toastContainer');
            const toastId = Date.now();
            
            const colors = {
                success: 'bg-green-500',
                error: 'bg-red-500',
                warning: 'bg-yellow-500',
                info: 'bg-blue-500'
            };
            
            const toast = `
                <div id="toast-${toastId}" class="toast-notification ${colors[type]} text-white p-4 rounded-lg shadow-lg min-w-[300px]">
                    <div class="flex justify-between items-start">
                        <div>
                            <div class="font-bold">${title}</div>
                            <div class="text-sm">${message}</div>
                        </div>
                        <button onclick="removeToast('toast-${toastId}')" class="ml-4 text-white hover:text-gray-200">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                </div>
            `;
            
            toastContainer.innerHTML += toast;
            
            setTimeout(() => {
                removeToast(`toast-${toastId}`);
            }, 5000);
        }

        // Remove toast
        function removeToast(toastId) {
            const toast = document.getElementById(toastId);
            if (toast) {
                toast.remove();
            }
        }
    </script>
</body>
</html>
