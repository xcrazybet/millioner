<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sportmonks API Debug - Betting Platform</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: monospace;
            background: #0a0e27;
            color: #fff;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .status-card {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .green { color: #66ff66; }
        .yellow { color: #ffd700; }
        .red { color: #ff6666; }
        .match-card {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
        }
        .odds-container { display: flex; gap: 10px; margin-top: 10px; }
        .odds-btn {
            background: rgba(255,215,0,0.2);
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
        }
        pre {
            background: #1a1f3a;
            padding: 15px;
            border-radius: 10px;
            overflow-x: auto;
            font-size: 12px;
        }
        button {
            background: #ffd700;
            color: #1a1f3a;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        .tab {
            background: rgba(255,255,255,0.1);
            padding: 10px 20px;
            border: none;
            color: white;
            cursor: pointer;
        }
        .tab.active {
            background: #ffd700;
            color: #1a1f3a;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚽ Sportmonks API Debugger</h1>
        <p>Token Status: <span class="green" id="tokenStatus">Checking...</span></p>
        
        <div id="subscriptionInfo" class="status-card"></div>
        
        <div class="status-card">
            <h3>📡 API Test Endpoints</h3>
            <button onclick="testEndpoint('leagues')">📋 Get Leagues</button>
            <button onclick="testEndpoint('live')">🔴 Live Scores</button>
            <button onclick="testEndpoint('today')">📅 Today's Fixtures (Apr 3, 2026)</button>
            <button onclick="testEndpoint('tomorrow')">📅 Tomorrow's Fixtures (Apr 4, 2026)</button>
            <button onclick="testEndpoint('inplay')">⚡ In-Play Matches</button>
        </div>
        
        <div class="status-card">
            <h3>🎯 Available Matches</h3>
            <div id="matchesContainer">Click a button above to load data...</div>
        </div>
        
        <div class="status-card">
            <h3>📊 Raw API Response</h3>
            <pre id="rawResponse">No data yet. Click a button to see API response.</pre>
        </div>
    </div>

    <script>
        const API_TOKEN = 'DkFdWG9jFZvH8XSEgLrRfGwczABWVg5rlV25GvIRyN06zdPsOI48Nsv9Wooy';
        const BASE_URL = 'https://api.sportmonks.com/v3';
        
        async function callAPI(endpoint, include = '') {
            let url = `${BASE_URL}${endpoint}?api_token=${API_TOKEN}`;
            if (include) url += `&include=${include}`;
            
            try {
                const response = await fetch(url);
                const data = await response.json();
                document.getElementById('rawResponse').innerHTML = JSON.stringify(data, null, 2);
                return data;
            } catch (error) {
                document.getElementById('rawResponse').innerHTML = `Error: ${error.message}`;
                return null;
            }
        }
        
        async function testEndpoint(type) {
            const container = document.getElementById('matchesContainer');
            container.innerHTML = '<div class="status-card">Loading...</div>';
            
            let data = null;
            let title = '';
            
            switch(type) {
                case 'leagues':
                    title = '📋 Available Leagues';
                    data = await callAPI('/football/leagues');
                    if (data && data.data) {
                        container.innerHTML = `
                            <h4>${title}</h4>
                            ${data.data.slice(0, 20).map(league => `
                                <div class="match-card">
                                    <strong>${league.name}</strong><br>
                                    ID: ${league.id} | Country: ${league.country?.name || 'Unknown'} | Type: ${league.type || 'league'}
                                </div>
                            `).join('')}
                            ${data.data.length > 20 ? `<p>... and ${data.data.length - 20} more leagues</p>` : ''}
                        `;
                    }
                    break;
                    
                case 'live':
                    title = '🔴 Live Scores (In-Play)';
                    data = await callAPI('/football/livescores/inplay', 'participants;scores');
                    if (data && data.data) {
                        if (data.data.length === 0) {
                            container.innerHTML = `<div class="status-card yellow">⚠️ No live matches at this moment. Check back during match hours (typically 14:00-22:00 UTC).</div>`;
                        } else {
                            container.innerHTML = `<h4>${title}</h4>${formatMatches(data.data)}`;
                        }
                    }
                    break;
                    
                case 'today':
                    title = '📅 Fixtures for April 3, 2026';
                    data = await callAPI('/football/fixtures/date/2026-04-03', 'participants;league');
                    if (data && data.data) {
                        if (data.data.length === 0) {
                            container.innerHTML = `<div class="status-card yellow">⚠️ No fixtures scheduled for April 3, 2026. Try checking another date.</div>`;
                        } else {
                            container.innerHTML = `<h4>${title}</h4>${formatMatches(data.data, false)}`;
                        }
                    }
                    break;
                    
                case 'tomorrow':
                    title = '📅 Fixtures for April 4, 2026';
                    data = await callAPI('/football/fixtures/date/2026-04-04', 'participants;league');
                    if (data && data.data) {
                        if (data.data.length === 0) {
                            container.innerHTML = `<div class="status-card yellow">⚠️ No fixtures scheduled for April 4, 2026.</div>`;
                        } else {
                            container.innerHTML = `<h4>${title}</h4>${formatMatches(data.data, false)}`;
                        }
                    }
                    break;
                    
                case 'inplay':
                    title = '⚡ In-Play Matches';
                    data = await callAPI('/football/fixtures/inplay', 'participants;scores');
                    if (data && data.data) {
                        if (data.data.length === 0) {
                            container.innerHTML = `<div class="status-card yellow">⚠️ No in-play matches currently.</div>`;
                        } else {
                            container.innerHTML = `<h4>${title}</h4>${formatMatches(data.data)}`;
                        }
                    }
                    break;
            }
        }
        
        function formatMatches(matches, showScores = true) {
            if (!matches || matches.length === 0) return '<p>No matches found</p>';
            
            return matches.map(match => {
                const participants = match.participants || [];
                const homeTeam = participants.find(p => p.meta?.location === 'home') || participants[0];
                const awayTeam = participants.find(p => p.meta?.location === 'away') || participants[1];
                const scores = match.scores || [];
                const homeScore = scores.find(s => s.participant_id === homeTeam?.id)?.score?.goals || 0;
                const awayScore = scores.find(s => s.participant_id === awayTeam?.id)?.score?.goals || 0;
                
                return `
                    <div class="match-card">
                        <strong>${match.league?.name || 'Unknown League'}</strong>
                        <div style="font-size: 1.2rem; margin: 10px 0;">
                            ${homeTeam?.name || 'Home'} vs ${awayTeam?.name || 'Away'}
                            ${showScores ? `<span style="color: #ffd700; margin-left: 10px;">${homeScore} - ${awayScore}</span>` : ''}
                        </div>
                        <div>Status: ${match.state?.name || match.time?.status || 'Scheduled'}</div>
                        <div>Time: ${match.starting_at ? new Date(match.starting_at).toLocaleString() : 'TBD'}</div>
                    </div>
                `;
            }).join('');
        }
        
        // Check token status on load
        async function checkToken() {
            const data = await callAPI('/my/resources');
            if (data && data.subscription) {
                document.getElementById('tokenStatus').innerHTML = '✅ WORKING - Valid Subscription';
                const sub = data.subscription[0];
                document.getElementById('subscriptionInfo').innerHTML = `
                    <h3>📊 Your Subscription Details</h3>
                    <p>✅ Plan: <strong>${sub.plans?.map(p => p.plan).join(', ') || 'Active'}</strong></p>
                    <p>💰 Rate Limit Remaining: <strong class="green">${data.rate_limit?.remaining || 'N/A'} calls</strong></p>
                    <p>🔄 Resets in: ${Math.floor(data.rate_limit?.resets_in_seconds / 60) || 0} minutes</p>
                    <p>🎟️ Total calls remaining: ~${data.rate_limit?.remaining || 'Unknown'}</p>
                `;
            } else {
                document.getElementById('tokenStatus').innerHTML = '⚠️ Token Issue - Check Console';
            }
        }
        
        checkToken();
    </script>
</body>
</html>
