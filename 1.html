    <style>
        /* ===== YOUR ORIGINAL STYLES (PRESERVED) ===== */
        :root {
            --primary: #00ff9d;
            --primary-dark: #00cc7a;
            --secondary: #ff9800;
            --secondary-dark: #cc7a00;
            --buy: #00c853;
            --buy-dark: #00b248;
            --sell: #ff1744;
            --sell-dark: #d5002b;
            --danger: #ff5252;
            --success: #4caf50;
            --warning: #ffc107;
            --info: #2196f3;
            --bg: #0a0f1a;
            --surface: #111827;
            --surface-light: #1a2332;
            --surface-dark: #0a0f17;
            --text: #ffffff;
            --text-dim: #a0a8c9;
            --text-muted: #6b7280;
            --border: rgba(255, 255, 255, 0.1);
            --border-light: rgba(255, 255, 255, 0.05);
            --gradient-main: linear-gradient(135deg, #0f2b1a 0%, #1a1a2e 100%);
            --gradient-card: linear-gradient(145deg, #1a2332, #0f172a);
            --gradient-buy: linear-gradient(135deg, #00c85322, #00b24822);
            --gradient-sell: linear-gradient(135deg, #ff174422, #d5002b22);
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 10px 40px rgba(0, 0, 0, 0.5);
            --shadow-glow: 0 0 20px rgba(0, 255, 157, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 70px; }
        .bg-effects { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; background: radial-gradient(circle at 10% 20%, rgba(0,255,157,0.03) 0%, transparent 50%), linear-gradient(135deg, #000000 0%, var(--bg) 100%); }
        
        /* Header */
        .header { background: rgba(17, 24, 39, 0.98); padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--primary); backdrop-filter: blur(20px); position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; color: var(--primary); }
        .balance-display { background: var(--gradient-card); padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border); color: var(--primary); font-weight: 700; display: flex; align-items: center; gap: 8px; cursor: pointer; }
        
        /* Bottom Navigation */
        .bottom-nav { display: flex; justify-content: space-around; background: rgba(17, 24, 39, 0.98); padding: 12px 10px; border-top: 1px solid var(--border); backdrop-filter: blur(20px); position: fixed; bottom: 0; left: 0; right: 0; z-index: 1000; }
        .nav-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: var(--text-dim); font-size: 11px; gap: 4px; padding: 5px 10px; border-radius: 10px; cursor: pointer; }
        .nav-item i { font-size: 18px; }
        .nav-item.active { color: var(--primary); background: rgba(0, 255, 157, 0.1); }
        
        .main-container { padding: 15px; max-width: 1400px; margin: 0 auto; }
        .page { display: none; animation: fadeIn 0.3s ease-out; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Market Grid */
        .market-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
        .market-card { background: var(--gradient-card); border-radius: 12px; border: 1px solid var(--border); padding: 15px; cursor: pointer; transition: all 0.3s; }
        .market-card:hover { border-color: var(--primary); transform: translateY(-2px); }
        .coin-info { display: flex; align-items: center; gap: 10px; }
        .coin-icon { width: 32px; height: 32px; border-radius: 50%; background: var(--surface-light); display: flex; align-items: center; justify-content: center; }
        .price-change { font-size: 14px; font-weight: 600; padding: 4px 12px; border-radius: 20px; background: rgba(0, 200, 83, 0.1); color: var(--buy); }
        .price-change.negative { background: rgba(255, 23, 68, 0.1); color: var(--sell); }
        .current-price { font-size: 24px; font-weight: 700; }
        .action-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .action-btn { padding: 10px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .buy-btn { background: var(--gradient-buy); color: var(--buy); border: 1px solid var(--buy); }
        .sell-btn { background: var(--gradient-sell); color: var(--sell); border: 1px solid var(--sell); }
        
        /* Order Book Panel - NEW */
        .orderbook-panel { background: var(--surface); border-radius: 15px; padding: 15px; margin-top: 20px; }
        .orderbook-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 12px; border-bottom: 1px solid var(--border); }
        .bid-color { color: var(--buy); }
        .ask-color { color: var(--sell); }
        
        /* Trade Section */
        .trade-section { background: var(--gradient-card); border-radius: 15px; padding: 20px; margin-top: 20px; }
        .trade-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        .trade-tab { padding: 10px 20px; background: none; border: none; color: var(--text-dim); cursor: pointer; border-radius: 8px; font-weight: 600; }
        .trade-tab.active { background: rgba(0, 255, 157, 0.1); color: var(--primary); }
        .form-input { width: 100%; padding: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; color: var(--text); margin-bottom: 12px; }
        .percentage-buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 10px 0; }
        .percentage-btn { padding: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; color: var(--text-dim); cursor: pointer; text-align: center; }
        .order-summary { background: var(--surface); padding: 15px; border-radius: 8px; margin: 15px 0; }
        .submit-btn { padding: 15px; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); border: none; border-radius: 8px; color: #000; font-weight: 700; cursor: pointer; width: 100%; }
        .submit-btn.sell { background: linear-gradient(135deg, var(--sell), var(--sell-dark)); color: #fff; }
        
        .toast-container { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); z-index: 10000; width: 90%; max-width: 400px; }
        .toast { padding: 12px 16px; background: rgba(17, 24, 39, 0.95); border-radius: 12px; border-left: 4px solid var(--primary); margin-bottom: 8px; backdrop-filter: blur(20px); }
        
        .holdings-list { margin-top: 20px; }
        .holding-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: var(--surface); border-radius: 8px; margin-bottom: 8px; }
        
        @media (max-width: 768px) { .market-grid { grid-template-columns: 1fr; } }
    </style>
</head>

    <nav class="bottom-nav">

        <div class="nav-item" data-page="asset"><i class="fas fa-chart-line"></i><span>Trade</span></div>

    <div class="toast-container" id="toast-container"></div>

    <script>
        // ===== FIREBASE CONFIG (YOUR ORIGINAL) =====
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962",
            measurementId: "G-PTV4XMYQ6P"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        
        // ===== CRYPTO SYMBOLS (YOUR ORIGINAL) =====
        const symbols = ["btcusdt", "ethusdt", "bnbusdt", "adausdt", "solusdt", "xrpusdt", "dogeusdt"];
        const cryptoData = {
            btcusdt: { name: "Bitcoin", icon: "₿", color: "#f7931a" },
            ethusdt: { name: "Ethereum", icon: "Ξ", color: "#627eea" },
            bnbusdt: { name: "Binance Coin", icon: "B", color: "#f3ba2f" },
            adausdt: { name: "Cardano", icon: "A", color: "#0033ad" },
            solusdt: { name: "Solana", icon: "S", color: "#00ffa3" },
            xrpusdt: { name: "Ripple", icon: "X", color: "#23292f" },
            dogeusdt: { name: "Dogecoin", icon: "Ð", color: "#c2a633" }
        };
        
        // ===== REAL EXCHANGE STATE =====
        let currentUser = null;
        let balance = 10000;
        let holdings = {};
        let marketData = {};
        let trades = [];
        let currentAsset = "btcusdt";
        let orderType = "market";
        let activeTradeSide = "buy";
        
        // ===== ORDER BOOK (REAL MATCHING ENGINE) =====
        let orderBooks = {
            btcusdt: { bids: [], asks: [] },
            ethusdt: { bids: [], asks: [] },
            bnbusdt: { bids: [], asks: [] },
            adausdt: { bids: [], asks: [] },
            solusdt: { bids: [], asks: [] },
            xrpusdt: { bids: [], asks: [] },
            dogeusdt: { bids: [], asks: [] }
        };
        let nextOrderId = 1000;
        
        let webSocket = null;
        
        // ===== MATCHING ENGINE (CORE EXCHANGE LOGIC) =====
        function matchOrders(symbol) {
            const book = orderBooks[symbol];
            if (!book) return [];
            const executedTrades = [];
            
            // Sort bids descending, asks ascending
            book.bids.sort((a, b) => b.price - a.price);
            book.asks.sort((a, b) => a.price - b.price);
            
            while (book.bids.length > 0 && book.asks.length > 0) {
                const bestBid = book.bids[0];
                const bestAsk = book.asks[0];
                
                if (bestBid.price >= bestAsk.price) {
                    const tradeAmount = Math.min(bestBid.remaining, bestAsk.remaining);
                    const tradePrice = bestAsk.price;
                    
                    // Execute trade
                    const trade = executeTrade(bestBid, bestAsk, tradeAmount, tradePrice, symbol);
                    executedTrades.push(trade);
                    
                    bestBid.remaining -= tradeAmount;
                    bestAsk.remaining -= tradeAmount;
                    
                    if (bestBid.remaining <= 0.00000001) book.bids.shift();
                    if (bestAsk.remaining <= 0.00000001) book.asks.shift();
                } else {
                    break;
                }
            }
            return executedTrades;
        }
        
        function executeTrade(buyOrder, sellOrder, amount, price, symbol) {
            const total = amount * price;
            const fee = total * 0.001; // 0.1% fee
            const buyerCost = total + fee;
            const sellerRevenue = total - fee;
            
            // Update buyer (if it's current user)
            if (buyOrder.userId === currentUser?.uid) {
                if (balance < buyerCost) throw new Error("Insufficient balance");
                balance -= buyerCost;
                const currentHolding = holdings[symbol] || { amount: 0, avgPrice: 0 };
                const newAmount = currentHolding.amount + amount;
                const newAvgPrice = ((currentHolding.amount * currentHolding.avgPrice) + (amount * price)) / newAmount;
                holdings[symbol] = { amount: newAmount, avgPrice: newAvgPrice };
            }
            
            // Update seller
            if (sellOrder.userId === currentUser?.uid) {
                const holding = holdings[symbol];
                if (!holding || holding.amount < amount) throw new Error("Insufficient holdings");
                const costBasis = holding.avgPrice * amount;
                const pnl = total - costBasis;
                balance += sellerRevenue;
                const newAmount = holding.amount - amount;
                if (newAmount <= 0.00000001) {
                    delete holdings[symbol];
                } else {
                    holdings[symbol].amount = newAmount;
                }
                
                // Record trade with P&L
                const tradeRecord = {
                    type: "sell",
                    asset: symbol,
                    amount: amount,
                    price: price,
                    total: total,
                    fee: fee,
                    pnl: pnl,
                    timestamp: new Date(),
                    status: "completed"
                };
                trades.unshift(tradeRecord);
                saveTradeToFirestore(tradeRecord);
            } else if (buyOrder.userId === currentUser?.uid) {
                const tradeRecord = {
                    type: "buy",
                    asset: symbol,
                    amount: amount,
                    price: price,
                    total: total,
                    fee: fee,
                    pnl: null,
                    timestamp: new Date(),
                    status: "completed"
                };
                trades.unshift(tradeRecord);
                saveTradeToFirestore(tradeRecord);
            }
            
            saveWalletToFirestore();
            updateUI();
            return { amount, price, symbol };
        }
        
        // Add limit order to book
        function addLimitOrder(side, symbol, price, amount) {
            if (amount <= 0 || price <= 0) return { success: false, msg: "Invalid order" };
            
            const order = {
                id: nextOrderId++,
                userId: currentUser?.uid,
                side: side,
                price: price,
                amount: amount,
                remaining: amount,
                timestamp: Date.now()
            };
            
            const book = orderBooks[symbol];
            if (side === "buy") {
                book.bids.push(order);
            } else {
                book.asks.push(order);
            }
            
            const trades = matchOrders(symbol);
            updateOrderBookUI(symbol);
            saveOrderBooksToFirestore();
            
            return { success: true, trades: trades.length, msg: `Limit ${side} order placed at $${price}` };
        }
        
        // Market order - execute immediately
        function executeMarketOrder(side, symbol, amount) {
            const currentPrice = marketData[symbol]?.price;
            if (!currentPrice) return { success: false, msg: "Price not available" };
            
            const book = orderBooks[symbol];
            let remaining = amount;
            let totalExecuted = 0;
            let avgPrice = 0;
            
            if (side === "buy") {
                while (remaining > 0 && book.asks.length > 0) {
                    const ask = book.asks[0];
                    const fillAmount = Math.min(remaining, ask.remaining);
                    const fillPrice = ask.price;
                    
                    try {
                        executeTrade({ userId: currentUser?.uid, side: "buy" }, ask, fillAmount, fillPrice, symbol);
                        totalExecuted += fillAmount;
                        avgPrice = (avgPrice * (totalExecuted - fillAmount) + fillPrice * fillAmount) / totalExecuted;
                        remaining -= fillAmount;
                        ask.remaining -= fillAmount;
                        if (ask.remaining <= 0) book.asks.shift();
                    } catch (e) {
                        return { success: false, msg: e.message };
                    }
                }
            } else {
                while (remaining > 0 && book.bids.length > 0) {
                    const bid = book.bids[0];
                    const fillAmount = Math.min(remaining, bid.remaining);
                    const fillPrice = bid.price;
                    
                    try {
                        executeTrade(bid, { userId: currentUser?.uid, side: "sell" }, fillAmount, fillPrice, symbol);
                        totalExecuted += fillAmount;
                        avgPrice = (avgPrice * (totalExecuted - fillAmount) + fillPrice * fillAmount) / totalExecuted;
                        remaining -= fillAmount;
                        bid.remaining -= fillAmount;
                        if (bid.remaining <= 0) book.bids.shift();
                    } catch (e) {
                        return { success: false, msg: e.message };
                    }
                }
            }
            
            // If still remaining, execute against market price (liquidity provider simulation)
            if (remaining > 0.00000001) {
                const fillPrice = currentPrice;
                const totalCost = remaining * fillPrice;
                const fee = totalCost * 0.001;
                
                if (side === "buy") {
                    if (balance < totalCost + fee) return { success: false, msg: "Insufficient balance for remaining amount" };
                    balance -= (totalCost + fee);
                    const holding = holdings[symbol] || { amount: 0, avgPrice: 0 };
                    const newAmount = holding.amount + remaining;
                    const newAvgPrice = ((holding.amount * holding.avgPrice) + (remaining * fillPrice)) / newAmount;
                    holdings[symbol] = { amount: newAmount, avgPrice: newAvgPrice };
                } else {
                    const holding = holdings[symbol];
                    if (!holding || holding.amount < remaining) return { success: false, msg: "Insufficient holdings" };
                    const pnl = (fillPrice - holding.avgPrice) * remaining;
                    balance += (totalCost - fee);
                    const newAmount = holding.amount - remaining;
                    if (newAmount <= 0) delete holdings[symbol];
                    else holdings[symbol].amount = newAmount;
                    
                    const tradeRecord = { type: "sell", asset: symbol, amount: remaining, price: fillPrice, total: totalCost, fee: fee, pnl: pnl, timestamp: new Date() };
                    trades.unshift(tradeRecord);
                    saveTradeToFirestore(tradeRecord);
                }
                totalExecuted += remaining;
            }
            
            saveWalletToFirestore();
            updateUI();
            updateOrderBookUI(symbol);
            return { success: true, filledAmount: totalExecuted, avgPrice: avgPrice || currentPrice, msg: `Market ${side} executed: ${totalExecuted.toFixed(6)} ${symbol.toUpperCase()}` };
        }
        
        // ===== FIRESTORE PERSISTENCE =====
        async function saveWalletToFirestore() {
            if (!currentUser) return;
            await db.collection('wallets').doc(currentUser.uid).set({
                balance: balance,
                holdings: holdings,
                updatedAt: new Date()
            }, { merge: true });
        }
        
        async function saveTradeToFirestore(trade) {
            if (!currentUser) return;
            const txId = 'tx_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
            await db.collection('transactions').doc(txId).set({
                ...trade,
                userId: currentUser.uid,
                transactionId: txId,
                createdAt: new Date()
            });
        }
        
        async function saveOrderBooksToFirestore() {
            if (!currentUser) return;
            for (const [symbol, book] of Object.entries(orderBooks)) {
                await db.collection('order_books').doc(`${currentUser.uid}_${symbol}`).set({
                    bids: book.bids,
                    asks: book.asks,
                    updatedAt: new Date()
                }, { merge: true });
            }
        }
        
        async function loadOrderBooksFromFirestore() {
            if (!currentUser) return;
            for (const symbol of symbols) {
                const doc = await db.collection('order_books').doc(`${currentUser.uid}_${symbol}`).get();
                if (doc.exists) {
                    orderBooks[symbol] = doc.data();
                }
            }
        }
        
        // ===== BINANCE WEBSOCKET (REAL PRICES) =====
        function initWebSocket() {
            const streams = symbols.map(s => `${s}@ticker`).join('/');
            webSocket = new WebSocket(`wss://stream.binance.com:9443/stream?streams=${streams}`);
            
            webSocket.onmessage = (event) => {
                const data = JSON.parse(event.data);
                const symbol = data.data.s.toLowerCase();
                const price = parseFloat(data.data.c);
                const change = parseFloat(data.data.P);
                
                if (marketData[symbol]) {
                    marketData[symbol].price = price;
                    marketData[symbol].change = change;
                } else {
                    marketData[symbol] = { price, change, high: parseFloat(data.data.h), low: parseFloat(data.data.l) };
                }
                
                updateMarketUI();
                if (currentAsset === symbol) updateAssetPagePrice(price, change);
                updatePortfolioValues();
            };
            
            webSocket.onerror = () => console.warn("WebSocket error");
        }
        
        // ===== UI RENDERING =====
        function renderMarketGrid() {
            const grid = document.getElementById('market-grid');
            grid.innerHTML = '';
            
            symbols.forEach(symbol => {
                const data = marketData[symbol] || { price: 0, change: 0 };
                const crypto = cryptoData[symbol];
                const displaySym = symbol.toUpperCase().replace('USDT', '');
                const holding = holdings[symbol];
                
                const card = document.createElement('div');
                card.className = 'market-card';
                card.onclick = () => { currentAsset = symbol; loadAssetPage(); switchPage('asset'); };
                card.innerHTML = `
                    <div style="display: flex; justify-content: space-between;">
                        <div class="coin-info">
                            <div class="coin-icon" style="color: ${crypto.color}">${crypto.icon}</div>
                            <div><div class="coin-symbol">${displaySym}</div><div class="coin-name">${crypto.name}</div></div>
                        </div>
                        <div class="price-change ${data.change >= 0 ? '' : 'negative'}">${data.change >= 0 ? '+' : ''}${data.change.toFixed(2)}%</div>
                    </div>
                    <div class="current-price" id="price-${symbol}">$${data.price.toLocaleString(undefined, { minimumFractionDigits: 2 })}</div>
                    ${holding ? `<div style="font-size: 12px; margin: 8px 0;">Hold: ${holding.amount.toFixed(6)} ${displaySym}</div>` : ''}
                    <div class="action-buttons">
                        <button class="action-btn buy-btn" data-symbol="${symbol}" data-side="buy">BUY</button>
                        <button class="action-btn sell-btn" data-symbol="${symbol}" data-side="sell" ${!holding ? 'disabled' : ''}>SELL</button>
                    </div>
                `;
                grid.appendChild(card);
            });
            
            document.querySelectorAll('[data-side]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const symbol = btn.dataset.symbol;
                    const side = btn.dataset.side;
                    currentAsset = symbol;
                    activeTradeSide = side;
                    loadAssetPage();
                    switchPage('asset');
                });
            });
        }
        
        function updateMarketUI() {
            symbols.forEach(symbol => {
                const data = marketData[symbol];
                if (!data) return;
                const priceEl = document.getElementById(`price-${symbol}`);
                if (priceEl) priceEl.textContent = `$${data.price.toLocaleString(undefined, { minimumFractionDigits: 2 })}`;
            });
        }
        
        function loadAssetPage() {
            const data = marketData[currentAsset] || { price: 50000, change: 0 };
            const crypto = cryptoData[currentAsset];
            const displaySym = currentAsset.toUpperCase().replace('USDT', '');
            
            document.getElementById('asset-header').innerHTML = `
                <div style="background: var(--gradient-card); border-radius: 15px; padding: 20px; margin-bottom: 20px;">
                    <div style="display: flex; align-items: center; gap: 15px;">
                        <div class="coin-icon" style="width: 48px; height: 48px; font-size: 24px;">${crypto.icon}</div>
                        <div><h2>${crypto.name} (${displaySym})</h2>
                        <div class="current-price" id="asset-current-price">$${data.price.toFixed(2)}</div>
                        <div class="price-change ${data.change >= 0 ? '' : 'negative'}">${data.change >= 0 ? '+' : ''}${data.change.toFixed(2)}%</div></div>
                    </div>
                </div>
            `;
            
            // Load TradingView chart
            const chartContainer = document.getElementById('asset-chart');
            chartContainer.innerHTML = '';
            new TradingView.widget({
                width: "100%",
                height: "350",
                symbol: `BINANCE:${currentAsset.toUpperCase()}`,
                interval: "60",
                timezone: "Etc/UTC",
                theme: "dark",
                style: "1",
                locale: "en",
                container_id: "asset-chart"
            });
            
            updateOrderBookUI(currentAsset);
            renderOrderForm();
        }
        
        function updateOrderBookUI(symbol) {
            const book = orderBooks[symbol];
            if (!book) return;
            
            const bidsDiv = document.getElementById('orderbook-bids');
            const asksDiv = document.getElementById('orderbook-asks');
            
            if (bidsDiv) {
                bidsDiv.innerHTML = book.bids.slice(0, 8).map(o => 
                    `<div class="orderbook-row"><span class="bid-color">$${o.price.toFixed(2)}</span><span>${o.remaining.toFixed(6)}</span><span>$${(o.price * o.remaining).toFixed(2)}</span></div>`
                ).join('') || '<div class="orderbook-row">No bids</div>';
            }
            
            if (asksDiv) {
                asksDiv.innerHTML = book.asks.slice(0, 8).map(o => 
                    `<div class="orderbook-row"><span class="ask-color">$${o.price.toFixed(2)}</span><span>${o.remaining.toFixed(6)}</span><span>$${(o.price * o.remaining).toFixed(2)}</span></div>`
                ).join('') || '<div class="orderbook-row">No asks</div>';
            }
        }
        
        function renderOrderForm() {
            const data = marketData[currentAsset] || { price: 50000 };
            const holding = holdings[currentAsset];
            const displaySym = currentAsset.toUpperCase().replace('USDT', '');
            
            const formHtml = `
                <div class="form-group">
                    <label>Amount (${displaySym})</label>
                    <input type="number" id="order-amount" class="form-input" placeholder="0.00000000" step="any">
                </div>
                <div id="limit-price-container" style="display: ${orderType === 'limit' ? 'block' : 'none'}">
                    <label>Limit Price (USD)</label>
                    <input type="number" id="limit-price" class="form-input" value="${data.price.toFixed(2)}" step="any">
                </div>
                <div class="percentage-buttons">
                    <button class="percentage-btn" data-percent="25">25%</button>
                    <button class="percentage-btn" data-percent="50">50%</button>
                    <button class="percentage-btn" data-percent="75">75%</button>
                    <button class="percentage-btn" data-percent="100">100%</button>
                </div>
                <div class="order-summary">
                    <div>Market Price: $<span id="summary-price">${data.price.toFixed(2)}</span></div>
                    <div>Total + Fee (0.1%): $<span id="summary-total">0.00</span></div>
                </div>
                <button id="execute-order-btn" class="submit-btn ${activeTradeSide === 'sell' ? 'sell' : ''}">
                    ${activeTradeSide.toUpperCase()} ${displaySym}
                </button>
            `;
            
            document.getElementById('order-form').innerHTML = formHtml;
            
            // Event listeners
            const amountInput = document.getElementById('order-amount');
            const limitPriceInput = document.getElementById('limit-price');
            const summaryPrice = document.getElementById('summary-price');
            const summaryTotal = document.getElementById('summary-total');
            
            const updateSummary = () => {
                let amount = parseFloat(amountInput?.value) || 0;
                let price = orderType === 'limit' ? (parseFloat(limitPriceInput?.value) || data.price) : data.price;
                let total = amount * price;
                let fee = total * 0.001;
                summaryTotal.innerText = (total + fee).toFixed(2);
                if (summaryPrice) summaryPrice.innerText = price.toFixed(2);
            };
            
            amountInput?.addEventListener('input', updateSummary);
            limitPriceInput?.addEventListener('input', updateSummary);
            
            document.querySelectorAll('.percentage-btn').forEach(btn => {
                btn.onclick = () => {
                    let percent = parseFloat(btn.dataset.percent) / 100;
                    let maxAmount = 0;
                    if (activeTradeSide === 'buy') {
                        maxAmount = balance / data.price;
                    } else {
                        maxAmount = holdings[currentAsset]?.amount || 0;
                    }
                    if (amountInput) amountInput.value = (maxAmount * percent).toFixed(6);
                    updateSummary();
                };
            });
            
            document.getElementById('execute-order-btn').onclick = () => executeTradeOrder();
        }
        
        function executeTradeOrder() {
            const amount = parseFloat(document.getElementById('order-amount')?.value);
            if (!amount || amount <= 0) return showToast("Enter valid amount", "error");
            
            const price = marketData[currentAsset]?.price;
            if (!price) return showToast("Price not available", "error");
            
            if (orderType === 'limit') {
                const limitPrice = parseFloat(document.getElementById('limit-price')?.value);
                if (!limitPrice || limitPrice <= 0) return showToast("Enter valid limit price", "error");
                const result = addLimitOrder(activeTradeSide, currentAsset, limitPrice, amount);
                showToast(result.msg, result.success ? "success" : "error");
                if (result.success) saveOrderBooksToFirestore();
            } else {
                const result = executeMarketOrder(activeTradeSide, currentAsset, amount);
                showToast(result.msg, result.success ? "success" : "error");
            }
            
            updateUI();
            renderOrderForm();
            updateOrderBookUI(currentAsset);
        }
        
        function updateAssetPagePrice(price, change) {
            const priceEl = document.getElementById('asset-current-price');
            if (priceEl) priceEl.textContent = `$${price.toFixed(2)}`;
        }
        
        function updatePortfolioValues() {
            let totalValue = balance;
            Object.keys(holdings).forEach(asset => {
                const price = marketData[asset]?.price || 0;
                totalValue += holdings[asset].amount * price;
            });
            document.getElementById('balance-val').innerText = balance.toFixed(2);
        }
        
        function updateUI() {
            updatePortfolioValues();
            renderHoldingsList();
            renderTradeHistory();
            renderMarketGrid();
        }
        
        function renderHoldingsList() {
            const container = document.getElementById('holdings-list');
            if (!container) return;
            container.innerHTML = '';
            
            Object.keys(holdings).forEach(asset => {
                const holding = holdings[asset];
                const price = marketData[asset]?.price || 0;
                const value = holding.amount * price;
                const pnl = value - (holding.amount * holding.avgPrice);
                const displaySym = asset.toUpperCase().replace('USDT', '');
                
                container.innerHTML += `
                    <div class="holding-item">
                        <div><strong>${displaySym}</strong><br>${holding.amount.toFixed(6)}</div>
                        <div>$${value.toFixed(2)}</div>
                        <div class="${pnl >= 0 ? 'positive' : 'negative'}">${pnl >= 0 ? '+' : ''}$${pnl.toFixed(2)}</div>
                        <button class="action-small" onclick="quickTrade('${asset}', 'sell')">Sell</button>
                    </div>
                `;
            });
            
            if (Object.keys(holdings).length === 0) {
                container.innerHTML = '<div style="text-align: center; padding: 40px;">No holdings yet</div>';
            }
        }
        
        function renderTradeHistory() {
            const container = document.getElementById('trade-history-list');
            if (!container) return;
            container.innerHTML = '';
            
            trades.slice(0, 20).forEach(trade => {
                const displaySym = trade.asset.toUpperCase().replace('USDT', '');
                container.innerHTML += `
                    <div class="holding-item">
                        <div>${moment(trade.timestamp?.toDate ? trade.timestamp.toDate() : new Date(trade.timestamp)).format('MM/DD HH:mm')}</div>
                        <div class="${trade.type === 'buy' ? 'positive' : 'negative'}">${trade.type.toUpperCase()}</div>
                        <div>${trade.amount.toFixed(6)} ${displaySym}</div>
                        <div>@ $${trade.price.toFixed(2)}</div>
                        <div>${trade.pnl ? (trade.pnl >= 0 ? '+' : '') + '$' + Math.abs(trade.pnl).toFixed(2) : '-'}</div>
                    </div>
                `;
            });
        }
        
        function quickTrade(asset, side) {
            currentAsset = asset;
            activeTradeSide = side;
            loadAssetPage();
            switchPage('asset');
        }
        
        async function loadUserData() {
            if (!currentUser) return;
            const walletDoc = await db.collection('wallets').doc(currentUser.uid).get();
            if (walletDoc.exists) {
                balance = walletDoc.data().balance || 10000;
                holdings = walletDoc.data().holdings || {};
            } else {
                balance = 10000;
                holdings = {};
                await saveWalletToFirestore();
            }
            
            const tradesSnapshot = await db.collection('transactions')
                .where('userId', '==', currentUser.uid)
                .orderBy('createdAt', 'desc')
                .limit(100)
                .get();
            trades = [];
            tradesSnapshot.forEach(doc => trades.push(doc.data()));
            
            await loadOrderBooksFromFirestore();
            updateUI();
        }
        
        async function resetAccount() {
            if (!currentUser) return;
            balance = 10000;
            holdings = {};
            trades = [];
            orderBooks = {
                btcusdt: { bids: [], asks: [] }, ethusdt: { bids: [], asks: [] }, bnbusdt: { bids: [], asks: [] },
                adausdt: { bids: [], asks: [] }, solusdt: { bids: [], asks: [] }, xrpusdt: { bids: [], asks: [] },
                dogeusdt: { bids: [], asks: [] }
            };
            await saveWalletToFirestore();
            await saveOrderBooksToFirestore();
            
            const txSnapshot = await db.collection('transactions').where('userId', '==', currentUser.uid).get();
            txSnapshot.forEach(doc => doc.ref.delete());
            
            trades = [];
            updateUI();
            showToast("Account reset to $10,000", "success");
        }
        
        function switchPage(pageName) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(`page-${pageName}`).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.querySelector(`.nav-item[data-page="${pageName}"]`).classList.add('active');
            
            if (pageName === 'asset') loadAssetPage();
            if (pageName === 'portfolio') { renderHoldingsList(); renderTradeHistory(); }
        }
        
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.style.borderLeftColor = type === 'success' ? 'var(--buy)' : type === 'error' ? 'var(--danger)' : 'var(--primary)';
            toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-info-circle'}"></i> ${message}`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
        
        // ===== INITIALIZATION =====
        document.addEventListener('DOMContentLoaded', () => {
            auth.onAuthStateChanged(async (user) => {
                if (!user) {
                    currentUser = { uid: 'demo_' + Date.now(), email: 'demo@cryptopro.com' };
                    showToast('Demo mode - trades are simulated with real prices', 'info');
                } else {
                    currentUser = user;
                    document.getElementById('user-email').textContent = user.email;
                }
                await loadUserData();
                await fetch('https://api.binance.com/api/v3/ticker/24hr')
                    .then(res => res.json())
                    .then(data => {
                        data.forEach(item => {
                            const symbol = item.symbol.toLowerCase();
                            if (symbols.includes(symbol)) {
                                marketData[symbol] = {
                                    price: parseFloat(item.lastPrice),
                                    change: parseFloat(item.priceChangePercent),
                                    high: parseFloat(item.highPrice),
                                    low: parseFloat(item.lowPrice)
                                };
                            }
                        });
 ').forEach(tab => {
                tab.addEventListener('click', () => {                       renderMarketGrid();
                        if (currentAsset) loadAssetPage();
                    });
                initWebSocket();
                updateUI();
            });
            
            document.querySelectorAll('.nav-item').forEach(item => {
                item.addEventListener('click', () => switchPage(item.dataset.page));
            });
            
            document.querySelectorAll('.trade-tab
                    orderType = tab.dataset.type;
                    document.querySelectorAll('.trade-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    renderOrderForm();
                });
            });
            
            document.getElementById('reset-account-btn')?.addEventListener('click', resetAccount);
        });
        
        window.quickTrade = quickTrade;
    </script>
</body>
</html>
