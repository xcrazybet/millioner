<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>XLODON BET - Live Sports Betting Platform</title>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    
    <!-- Chart.js for analytics -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #0a0a2a 0%, #1a1a3a 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .bet-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        
        .bet-card:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        
        .odds-button {
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            transition: all 0.2s ease;
        }
        
        .odds-button:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(255, 107, 53, 0.4);
        }
        
        .live-badge {
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        .loading-spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 3px solid #ff6b35;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .toast-notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #ff6b35;
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #f7931e;
        }
        
        .tab-active {
            border-bottom: 3px solid #ff6b35;
            color: #ff6b35;
        }
        
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            opacity: 1;
        }
    </style>
</head>
<body>

<!-- Navigation Bar -->
<nav class="bg-black/50 backdrop-blur-md border-b border-white/10 sticky top-0 z-50">
    <div class="container mx-auto px-4 py-3">
        <div class="flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fas fa-trophy text-3xl text-orange-500"></i>
                <span class="text-2xl font-bold bg-gradient-to-r from-orange-500 to-red-500 bg-clip-text text-transparent">XLODON BET</span>
            </div>
            
            <div class="hidden md:flex space-x-6">
                <button onclick="showTab('live')" id="tab-live-btn" class="tab-btn text-gray-300 hover:text-orange-500 transition px-3 py-2 rounded-lg tab-active">Live Betting</button>
                <button onclick="showTab('upcoming')" id="tab-upcoming-btn" class="tab-btn text-gray-300 hover:text-orange-500 transition px-3 py-2 rounded-lg">Upcoming</button>
                <button onclick="showTab('mybets')" id="tab-mybets-btn" class="tab-btn text-gray-300 hover:text-orange-500 transition px-3 py-2 rounded-lg">My Bets</button>
                <button onclick="showTab('leaderboard')" id="tab-leaderboard-btn" class="tab-btn text-gray-300 hover:text-orange-500 transition px-3 py-2 rounded-lg">Leaderboard</button>
            </div>
            
            <div class="flex items-center space-x-4">
                <div id="userInfo" class="hidden">
                    <div class="flex items-center space-x-3">
                        <div class="text-right">
                            <div id="userName" class="text-white text-sm font-semibold"></div>
                            <div class="text-orange-400 text-xs">Balance: $<span id="userBalance">0</span></div>
                        </div>
                        <i class="fas fa-user-circle text-3xl text-gray-400"></i>
                    </div>
                </div>
                <button onclick="toggleAuth()" id="authBtn" class="bg-gradient-to-r from-orange-500 to-red-500 px-5 py-2 rounded-full text-white font-semibold hover:shadow-lg transition">
                    Login
                </button>
            </div>
        </div>
    </div>
</nav>

<!-- Main Content -->
<div class="container mx-auto px-4 py-8">
    <!-- Loading State -->
    <div id="loadingScreen" class="fixed inset-0 bg-black/80 flex items-center justify-center z-50">
        <div class="text-center">
            <div class="loading-spinner mx-auto mb-4"></div>
            <p class="text-white text-lg">Loading matches...</p>
        </div>
    </div>
    
    <!-- Live Betting Tab -->
    <div id="liveTab" class="tab-content">
        <div class="grid lg:grid-cols-3 gap-6">
            <!-- Matches List -->
            <div class="lg:col-span-2">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold text-white">
                        <i class="fas fa-circle text-red-500 live-badge mr-2"></i>
                        Live Matches
                    </h2>
                    <div class="text-sm text-gray-400">
                        <i class="fas fa-sync-alt mr-1"></i>
                        Updates every 6 seconds
                    </div>
                </div>
                <div id="liveMatches" class="space-y-4">
                    <!-- Matches will be injected here -->
                </div>
            </div>
            
            <!-- Bet Slip -->
            <div class="lg:col-span-1">
                <div class="bet-card p-6 sticky top-20">
                    <h3 class="text-xl font-bold text-white mb-4">
                        <i class="fas fa-receipt mr-2 text-orange-500"></i>
                        Bet Slip
                    </h3>
                    <div id="betSlip" class="space-y-3 max-h-[500px] overflow-y-auto">
                        <p class="text-gray-400 text-center py-8">No bets selected. Click on odds to add.</p>
                    </div>
                    <div id="betSlipTotal" class="hidden mt-4 pt-4 border-t border-white/10">
                        <div class="flex justify-between text-white mb-3">
                            <span>Total Stake:</span>
                            <span class="font-bold">$<span id="totalStake">0</span></span>
                        </div>
                        <div class="flex justify-between text-white mb-3">
                            <span>Potential Win:</span>
                            <span class="font-bold text-green-400">$<span id="potentialWin">0</span></span>
                        </div>
                        <input type="number" id="stakeInput" placeholder="Enter stake amount" class="w-full bg-white/10 border border-white/20 rounded-lg px-4 py-2 text-white mb-3 focus:outline-none focus:border-orange-500">
                        <button onclick="placeBet()" class="w-full odds-button text-white font-bold py-3 rounded-lg">
                            Place Bet
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Upcoming Tab -->
    <div id="upcomingTab" class="tab-content hidden">
        <h2 class="text-2xl font-bold text-white mb-6">
            <i class="fas fa-calendar-alt mr-2 text-orange-500"></i>
            Upcoming Matches
        </h2>
        <div id="upcomingMatches" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Upcoming matches will be injected here -->
        </div>
    </div>
    
    <!-- My Bets Tab -->
    <div id="mybetsTab" class="tab-content hidden">
        <h2 class="text-2xl font-bold text-white mb-6">
            <i class="fas fa-history mr-2 text-orange-500"></i>
            My Betting History
        </h2>
        <div id="myBetsList" class="space-y-4">
            <!-- User's bets will be injected here -->
        </div>
    </div>
    
    <!-- Leaderboard Tab -->
    <div id="leaderboardTab" class="tab-content hidden">
        <h2 class="text-2xl font-bold text-white mb-6">
            <i class="fas fa-chart-line mr-2 text-orange-500"></i>
            Top Bettors
        </h2>
        <div id="leaderboardList" class="bg-white/5 rounded-xl p-6">
            <!-- Leaderboard will be injected here -->
        </div>
    </div>
</div>

<script>
    // ==================== FIREBASE CONFIGURATION ====================
    const firebaseConfig = {
        apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
        authDomain: "x-bet-prod-jd.firebaseapp.com",
        projectId: "x-bet-prod-jd",
        storageBucket: "x-bet-prod-jd.firebasestorage.app",
        messagingSenderId: "499334334535",
        appId: "1:499334334535:web:bebc1bf817e24d9e3c4962",
        measurementId: "G-PTV4XMYQ6P"
    };
    
    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
    
    // ==================== SPORTMONKS API CONFIGURATION ====================
    const SPORTMONKS_TOKEN = 'DkFdWG9jFZvH8XSEgLrRfGwczABWVg5rlV25GvIRyN06zdPsOI48Nsv9Wooy';
    const SPORTMONKS_BASE = 'https://api.sportmonks.com/v3';
    
    // ==================== GLOBAL VARIABLES ====================
    let currentUser = null;
    let betSlip = [];
    let liveMatchesData = [];
    let updateInterval = null;
    
    // ==================== API FUNCTIONS ====================
    async function fetchLiveMatches() {
        try {
            const response = await axios.get(`${SPORTMONKS_BASE}/football/livescores/inplay`, {
                params: { api_token: SPORTMONKS_TOKEN }
            });
            return response.data.data || [];
        } catch (error) {
            console.error('Error fetching live matches:', error);
            return [];
        }
    }
    
    async function fetchLatestUpdates() {
        try {
            const response = await axios.get(`${SPORTMONKS_BASE}/football/fixtures/latest`, {
                params: {
                    api_token: SPORTMONKS_TOKEN,
                    include: 'participants;scores;events;odds'
                }
            });
            return response.data.data || [];
        } catch (error) {
            console.error('Error fetching latest updates:', error);
            return [];
        }
    }
    
    async function fetchUpcomingMatches() {
        try {
            const response = await axios.get(`${SPORTMONKS_BASE}/football/fixtures`, {
                params: {
                    api_token: SPORTMONKS_TOKEN,
                    include: 'participants;league',
                    filters: 'next7days'
                }
            });
            return response.data.data || [];
        } catch (error) {
            console.error('Error fetching upcoming matches:', error);
            return [];
        }
    }
    
    async function fetchOdds(fixtureId) {
        try {
            const response = await axios.get(`${SPORTMONKS_BASE}/football/odds/fixture/${fixtureId}`, {
                params: { api_token: SPORTMONKS_TOKEN }
            });
            return response.data.data || [];
        } catch (error) {
            console.error('Error fetching odds:', error);
            return null;
        }
    }
    
    // ==================== UI RENDERING FUNCTIONS ====================
    function renderLiveMatches(matches) {
        const container = document.getElementById('liveMatches');
        if (!matches || matches.length === 0) {
            container.innerHTML = '<div class="bet-card p-8 text-center"><p class="text-gray-400">No live matches at the moment</p></div>';
            return;
        }
        
        container.innerHTML = matches.map(match => `
            <div class="bet-card p-5" data-fixture-id="${match.id}">
                <div class="flex justify-between items-center mb-3">
                    <span class="text-xs text-orange-400 bg-orange-500/20 px-2 py-1 rounded">
                        ${match.league?.name || 'Football'}
                    </span>
                    <span class="text-xs text-red-400 flex items-center">
                        <i class="fas fa-circle text-red-500 live-badge mr-1" style="font-size: 8px;"></i>
                        LIVE
                    </span>
                </div>
                <div class="flex justify-between items-center mb-4">
                    <div class="text-center flex-1">
                        <div class="text-white font-semibold text-lg">${match.participants?.[0]?.name || 'Team A'}</div>
                        <div class="text-2xl font-bold text-white mt-1">${match.scores?.score?.[0]?.score || 0}</div>
                    </div>
                    <div class="text-gray-400 font-bold px-4">VS</div>
                    <div class="text-center flex-1">
                        <div class="text-white font-semibold text-lg">${match.participants?.[1]?.name || 'Team B'}</div>
                        <div class="text-2xl font-bold text-white mt-1">${match.scores?.score?.[1]?.score || 0}</div>
                    </div>
                </div>
                <div class="flex gap-2 mt-3">
                    <button onclick="addToBetSlip(${match.id}, '${match.participants?.[0]?.name}', '${match.participants?.[1]?.name}', 'home', 2.10)" class="flex-1 odds-button text-white py-2 rounded-lg text-sm font-semibold">
                        ${match.participants?.[0]?.name} <span class="ml-1">${2.10}</span>
                    </button>
                    <button onclick="addToBetSlip(${match.id}, '${match.participants?.[0]?.name}', '${match.participants?.[1]?.name}', 'draw', 3.40)" class="flex-1 odds-button text-white py-2 rounded-lg text-sm font-semibold">
                        Draw <span class="ml-1">${3.40}</span>
                    </button>
                    <button onclick="addToBetSlip(${match.id}, '${match.participants?.[0]?.name}', '${match.participants?.[1]?.name}', 'away', 2.80)" class="flex-1 odds-button text-white py-2 rounded-lg text-sm font-semibold">
                        ${match.participants?.[1]?.name} <span class="ml-1">${2.80}</span>
                    </button>
                </div>
                <div class="mt-3 text-xs text-gray-400 text-center">
                    ${match.time?.starting_at?.date ? new Date(match.time.starting_at.date).toLocaleTimeString() : 'In Progress'} | ${match.time?.minute || 0}' min
                </div>
            </div>
        `).join('');
    }
    
    function renderUpcomingMatches(matches) {
        const container = document.getElementById('upcomingMatches');
        if (!matches || matches.length === 0) {
            container.innerHTML = '<div class="col-span-full bet-card p-8 text-center"><p class="text-gray-400">No upcoming matches found</p></div>';
            return;
        }
        
        container.innerHTML = matches.slice(0, 12).map(match => `
            <div class="bet-card p-5">
                <div class="text-xs text-gray-400 mb-2">${new Date(match.time?.starting_at?.date).toLocaleDateString()}</div>
                <div class="flex justify-between items-center mb-3">
                    <div class="text-white font-semibold">${match.participants?.[0]?.name || 'Team A'}</div>
                    <div class="text-gray-400">VS</div>
                    <div class="text-white font-semibold">${match.participants?.[1]?.name || 'Team B'}</div>
                </div>
                <div class="flex gap-2 mt-3">
                    <button onclick="showNotification('Please login to bet', 'info')" class="flex-1 bg-white/10 text-white py-2 rounded-lg text-sm hover:bg-white/20 transition">
                        Bet Now
                    </button>
                </div>
            </div>
        `).join('');
    }
    
    function renderMyBets(bets) {
        const container = document.getElementById('myBetsList');
        if (!bets || bets.length === 0) {
            container.innerHTML = '<div class="bet-card p-8 text-center"><p class="text-gray-400">No bets placed yet</p></div>';
            return;
        }
        
        container.innerHTML = bets.map(bet => `
            <div class="bet-card p-5">
                <div class="flex justify-between items-center">
                    <div>
                        <div class="text-white font-semibold">${bet.matchName}</div>
                        <div class="text-sm text-gray-400">${bet.selection} @ ${bet.odds}</div>
                        <div class="text-xs text-gray-500">Stake: $${bet.stake}</div>
                    </div>
                    <div class="text-right">
                        <div class="text-${bet.status === 'WON' ? 'green' : bet.status === 'LOST' ? 'red' : 'orange'}-400 font-bold">
                            ${bet.status}
                        </div>
                        ${bet.potentialWin ? `<div class="text-sm text-gray-400">Potential: $${bet.potentialWin}</div>` : ''}
                    </div>
                </div>
            </div>
        `).join('');
    }
    
    function renderLeaderboard(users) {
        const container = document.getElementById('leaderboardList');
        const sortedUsers = (users || []).sort((a, b) => (b.totalWinnings || 0) - (a.totalWinnings || 0)).slice(0, 10);
        
        container.innerHTML = `
            <div class="space-y-3">
                ${sortedUsers.map((user, index) => `
                    <div class="flex justify-between items-center p-4 bg-white/5 rounded-lg">
                        <div class="flex items-center space-x-4">
                            <div class="text-2xl font-bold ${index === 0 ? 'text-yellow-500' : index === 1 ? 'text-gray-400' : index === 2 ? 'text-orange-600' : 'text-gray-500'}">
                                #${index + 1}
                            </div>
                            <div>
                                <div class="text-white font-semibold">${user.name || 'Anonymous'}</div>
                                <div class="text-xs text-gray-400">${user.betsCount || 0} bets</div>
                            </div>
                        </div>
                        <div class="text-right">
                            <div class="text-green-400 font-bold">$${user.totalWinnings || 0}</div>
                            <div class="text-xs text-gray-400">Total Won</div>
                        </div>
                    </div>
                `).join('')}
            </div>
        `;
    }
    
    function updateBetSlip() {
        const container = document.getElementById('betSlip');
        const totalDiv = document.getElementById('betSlipTotal');
        
        if (betSlip.length === 0) {
            container.innerHTML = '<p class="text-gray-400 text-center py-8">No bets selected. Click on odds to add.</p>';
            totalDiv.classList.add('hidden');
            return;
        }
        
        container.innerHTML = betSlip.map((bet, index) => `
            <div class="bg-white/5 rounded-lg p-3 relative">
                <button onclick="removeFromBetSlip(${index})" class="absolute top-2 right-2 text-gray-400 hover:text-red-400">
                    <i class="fas fa-times"></i>
                </button>
                <div class="text-white text-sm font-semibold">${bet.matchName}</div>
                <div class="text-orange-400 text-sm">${bet.selection} @ ${bet.odds}</div>
                <div class="text-xs text-gray-400 mt-1">${bet.stake ? `Stake: $${bet.stake}` : 'Click place bet to set stake'}</div>
            </div>
        `).join('');
        
        totalDiv.classList.remove('hidden');
        calculateTotals();
    }
    
    function calculateTotals() {
        const stake = parseFloat(document.getElementById('stakeInput')?.value) || 0;
        const totalOdds = betSlip.reduce((acc, bet) => acc * bet.odds, 1);
        const potentialWin = stake * totalOdds;
        
        document.getElementById('totalStake').innerText = stake.toFixed(2);
        document.getElementById('potentialWin').innerText = potentialWin.toFixed(2);
        
        // Update each bet's stake
        betSlip = betSlip.map(bet => ({ ...bet, stake: stake / betSlip.length }));
    }
    
    // ==================== BET SLIP FUNCTIONS ====================
    function addToBetSlip(fixtureId, homeTeam, awayTeam, selection, odds) {
        if (!currentUser) {
            showNotification('Please login to add bets', 'warning');
            toggleAuth();
            return;
        }
        
        const matchName = selection === 'home' ? homeTeam : selection === 'away' ? awayTeam : `Draw: ${homeTeam} vs ${awayTeam}`;
        const selectionText = selection === 'home' ? homeTeam : selection === 'away' ? awayTeam : 'Draw';
        
        betSlip.push({
            fixtureId,
            matchName: `${homeTeam} vs ${awayTeam}`,
            selection: selectionText,
            odds: odds,
            stake: 0
        });
        
        updateBetSlip();
        showNotification(`${selectionText} added to bet slip`, 'success');
    }
    
    function removeFromBetSlip(index) {
        betSlip.splice(index, 1);
        updateBetSlip();
        if (betSlip.length === 0) {
            document.getElementById('stakeInput').value = '';
        }
    }
    
    async function placeBet() {
        if (!currentUser) {
            showNotification('Please login to place bets', 'warning');
            return;
        }
        
        const stake = parseFloat(document.getElementById('stakeInput').value);
        if (!stake || stake <= 0) {
            showNotification('Please enter a valid stake amount', 'error');
            return;
        }
        
        if (betSlip.length === 0) {
            showNotification('Please add bets to your slip', 'warning');
            return;
        }
        
        const totalOdds = betSlip.reduce((acc, bet) => acc * bet.odds, 1);
        const potentialWin = stake * totalOdds;
        
        try {
            const userRef = db.collection('users').doc(currentUser.uid);
            const userDoc = await userRef.get();
            const currentBalance = userDoc.data()?.balance || 0;
            
            if (currentBalance < stake) {
                showNotification('Insufficient balance! Please deposit funds.', 'error');
                return;
            }
            
            // Create bet record
            const betRecord = {
                userId: currentUser.uid,
                userName: currentUser.email,
                bets: betSlip.map(bet => ({
                    fixtureId: bet.fixtureId,
                    matchName: bet.matchName,
                    selection: bet.selection,
                    odds: bet.odds
                })),
                totalOdds: totalOdds,
                totalStake: stake,
                potentialWin: potentialWin,
                status: 'PENDING',
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            };
            
            await db.collection('bets').add(betRecord);
            
            // Update user balance
            await userRef.update({
                balance: firebase.firestore.FieldValue.increment(-stake)
            });
            
            // Record transaction
            await db.collection('transactions').add({
                userId: currentUser.uid,
                type: 'BET_PLACED',
                amount: stake,
                balanceAfter: currentBalance - stake,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
            
            showNotification(`Bet placed successfully! Potential win: $${potentialWin.toFixed(2)}`, 'success');
            
            // Clear bet slip
            betSlip = [];
            updateBetSlip();
            document.getElementById('stakeInput').value = '';
            
            // Refresh user balance
            await loadUserData();
            
        } catch (error) {
            console.error('Error placing bet:', error);
            showNotification('Error placing bet: ' + error.message, 'error');
        }
    }
    
    // ==================== AUTHENTICATION FUNCTIONS ====================
    function toggleAuth() {
        if (currentUser) {
            auth.signOut();
        } else {
            const email = prompt('Enter your email:');
            const password = prompt('Enter your password (minimum 6 characters):');
            
            if (email && password) {
                auth.signInWithEmailAndPassword(email, password)
                    .catch(() => {
                        auth.createUserWithEmailAndPassword(email, password)
                            .then(async (userCredential) => {
                                await db.collection('users').doc(userCredential.user.uid).set({
                                    email: email,
                                    balance: 100,
                                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                                    totalBets: 0,
                                    totalWinnings: 0
                                });
                                showNotification('Account created! You received $100 bonus!', 'success');
                            });
                    });
            }
        }
    }
    
    async function loadUserData() {
        if (currentUser) {
            const userDoc = await db.collection('users').doc(currentUser.uid).get();
            const userData = userDoc.data();
            document.getElementById('userBalance').innerText = (userData?.balance || 0).toFixed(2);
            document.getElementById('userName').innerText = currentUser.email.split('@')[0];
            document.getElementById('userInfo').classList.remove('hidden');
            document.getElementById('authBtn').innerHTML = 'Logout';
            
            // Load user's bets
            const betsSnapshot = await db.collection('bets')
                .where('userId', '==', currentUser.uid)
                .orderBy('createdAt', 'desc')
                .limit(20)
                .get();
            
            const userBets = betsSnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            renderMyBets(userBets);
            
            // Load leaderboard
            const leaderboardSnapshot = await db.collection('users')
                .orderBy('totalWinnings', 'desc')
                .limit(10)
                .get();
            
            const leaderboardData = leaderboardSnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            renderLeaderboard(leaderboardData);
        } else {
            document.getElementById('userInfo').classList.add('hidden');
            document.getElementById('authBtn').innerHTML = 'Login';
            renderMyBets([]);
        }
    }
    
    // ==================== REAL-TIME UPDATE SYSTEM ====================
    async function startRealTimeUpdates() {
        // Initial load
        await refreshAllData();
        
        // Poll every 6 seconds as recommended
        if (updateInterval) clearInterval(updateInterval);
        updateInterval = setInterval(async () => {
            try {
                const updates = await fetchLatestUpdates();
                if (updates && updates.length > 0) {
                    await refreshAllData();
                }
            } catch (error) {
                console.error('Update error:', error);
            }
        }, 6000);
    }
    
    async function refreshAllData() {
        try {
            const [liveMatches, upcomingMatches] = await Promise.all([
                fetchLiveMatches(),
                fetchUpcomingMatches()
            ]);
            
            renderLiveMatches(liveMatches);
            renderUpcomingMatches(upcomingMatches);
            
            if (currentUser) {
                await loadUserData();
            }
        } catch (error) {
            console.error('Refresh error:', error);
        }
    }
    
    // ==================== UI HELPERS ====================
    function showTab(tabName) {
        document.querySelectorAll('.tab-content').forEach(tab => {
            tab.classList.add('hidden');
        });
        document.getElementById(`${tabName}Tab`).classList.remove('hidden');
        
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.remove('tab-active');
            btn.classList.add('text-gray-300');
        });
        document.getElementById(`tab-${tabName}-btn`).classList.add('tab-active');
        document.getElementById(`tab-${tabName}-btn`).classList.remove('text-gray-300');
    }
    
    function showNotification(message, type = 'info') {
        const colors = {
            success: 'bg-green-500',
            error: 'bg-red-500',
            warning: 'bg-yellow-500',
            info: 'bg-blue-500'
        };
        
        const notification = document.createElement('div');
        notification.className = `toast-notification ${colors[type]} text-white px-6 py-3 rounded-lg shadow-lg`;
        notification.innerHTML = `
            <div class="flex items-center space-x-3">
                <i class="fas fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : 'info-circle'}"></i>
                <span>${message}</span>
            </div>
        `;
        
        document.body.appendChild(notification);
        setTimeout(() => notification.remove(), 3000);
    }
    
    // ==================== EVENT LISTENERS ====================
    document.getElementById('stakeInput')?.addEventListener('input', calculateTotals);
    
    auth.onAuthStateChanged(async (user) => {
        currentUser = user;
        await loadUserData();
        if (user) {
            showNotification(`Welcome back, ${user.email}!`, 'success');
        }
    });
    
    // Initialize
    document.getElementById('loadingScreen').style.display = 'flex';
    startRealTimeUpdates().then(() => {
        setTimeout(() => {
            document.getElementById('loadingScreen').style.display = 'none';
        }, 1500);
    });
    
    // Add to window for global access
    window.addToBetSlip = addToBetSlip;
    window.removeFromBetSlip = removeFromBetSlip;
    window.placeBet = placeBet;
    window.toggleAuth = toggleAuth;
    window.showTab = showTab;
    window.showNotification = showNotification;
</script>
</body>
</html>
