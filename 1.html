<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoalBet - Football Betting Platform</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c32 0%, #0a1a1f 100%);
            color: #fff;
            overflow-x: hidden;
        }

        /* Navigation */
        .navbar {
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 1rem 0;
            border-bottom: 2px solid #00ff88;
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            background: linear-gradient(45deg, #00ff88, #00b4ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .logo i {
            margin-right: 10px;
            color: #00ff88;
        }

        .balance-card {
            background: linear-gradient(135deg, #2d5a4a, #1a3a30);
            padding: 0.8rem 1.5rem;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,255,136,0.2);
        }

        .balance-amount {
            font-size: 1.8rem;
            font-weight: bold;
            color: #00ff88;
        }

        /* Tab Navigation */
        .tabs {
            display: flex;
            gap: 1rem;
            margin: 2rem auto;
            max-width: 1400px;
            padding: 0 2rem;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 10px;
            color: white;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .tab-btn.active {
            background: #00ff88;
            color: #000;
            font-weight: bold;
        }

        .tab-btn:hover {
            background: rgba(0,255,136,0.3);
        }

        /* Content Containers */
        .tab-content {
            display: none;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem 2rem;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Match Cards */
        .matches-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
            margin-top: 1rem;
        }

        .match-card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 1.5rem;
            transition: transform 0.3s;
            cursor: pointer;
        }

        .match-card:hover {
            transform: translateY(-5px);
            background: rgba(255,255,255,0.15);
        }

        .teams {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .team {
            text-align: center;
            flex: 1;
        }

        .team-logo {
            width: 60px;
            height: 60px;
            object-fit: contain;
            margin-bottom: 0.5rem;
        }

        .vs {
            font-size: 1.2rem;
            font-weight: bold;
            color: #00ff88;
        }

        .match-info {
            text-align: center;
            margin: 1rem 0;
            padding: 0.5rem;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
        }

        .bet-odds {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }

        .odds-btn {
            flex: 1;
            background: linear-gradient(45deg, #00b4ff, #0088cc);
            border: none;
            padding: 0.7rem;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }

        .odds-btn:hover {
            transform: scale(1.05);
        }

        /* Standings Table */
        .standings-table {
            width: 100%;
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            overflow-x: auto;
        }

        .standings-table table {
            width: 100%;
            border-collapse: collapse;
        }

        .standings-table th,
        .standings-table td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .standings-table th {
            background: rgba(0,255,136,0.2);
            color: #00ff88;
        }

        /* Betting Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: linear-gradient(135deg, #1e3c32, #0a1a1f);
            padding: 2rem;
            border-radius: 20px;
            max-width: 500px;
            width: 90%;
            border: 1px solid #00ff88;
        }

        .bet-input {
            width: 100%;
            padding: 0.8rem;
            margin: 1rem 0;
            background: rgba(255,255,255,0.1);
            border: 1px solid #00ff88;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
        }

        /* Toast Message */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: #00ff88;
            color: #000;
            padding: 1rem 1.5rem;
            border-radius: 10px;
            display: none;
            z-index: 3000;
            animation: slideIn 0.3s;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }

        /* Loading Spinner */
        .loader {
            text-align: center;
            padding: 2rem;
        }

        .spinner {
            border: 3px solid rgba(255,255,255,0.3);
            border-top: 3px solid #00ff88;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .matches-grid {
                grid-template-columns: 1fr;
            }
            .teams {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

<div class="navbar">
    <div class="nav-container">
        <div class="logo">
            <i class="fas fa-futbol"></i> GoalBet
        </div>
        <div class="balance-card">
            <div>Your Balance</div>
            <div class="balance-amount">$<span id="balance">1000</span></div>
        </div>
    </div>
</div>

<div class="tabs">
    <button class="tab-btn active" onclick="switchTab('matches')">📅 Live Matches</button>
    <button class="tab-btn" onclick="switchTab('standings')">🏆 League Tables</button>
    <button class="tab-btn" onclick="switchTab('scorers')">⚽ Top Scorers</button>
    <button class="tab-btn" onclick="switchTab('history')">📜 Betting History</button>
</div>

<div id="matches-tab" class="tab-content active">
    <div class="matches-grid" id="matches-container">
        <div class="loader"><div class="spinner"></div><p>Loading matches...</p></div>
    </div>
</div>

<div id="standings-tab" class="tab-content">
    <div id="standings-container">
        <div class="loader"><div class="spinner"></div><p>Loading standings...</p></div>
    </div>
</div>

<div id="scorers-tab" class="tab-content">
    <div id="scorers-container">
        <div class="loader"><div class="spinner"></div><p>Loading top scorers...</p></div>
    </div>
</div>

<div id="history-tab" class="tab-content">
    <div id="history-container">
        <p>No bets placed yet. Start betting on matches!</p>
    </div>
</div>

<div id="betModal" class="modal">
    <div class="modal-content">
        <h3 id="modal-team">Place Your Bet</h3>
        <p>Odds: <span id="modal-odds">0</span>x</p>
        <input type="number" id="bet-amount" class="bet-input" placeholder="Enter amount in USD" min="1">
        <p>Potential Win: $<span id="potential-win">0</span></p>
        <button onclick="confirmBet()" style="background: #00ff88; color: #000; padding: 0.8rem; border: none; border-radius: 8px; width: 100%; margin-top: 1rem; cursor: pointer;">Place Bet</button>
        <button onclick="closeModal()" style="background: #ff4444; margin-top: 0.5rem;">Cancel</button>
    </div>
</div>

<div id="toast" class="toast"></div>

<script>
    // ============================================
    // CONFIGURATION
    // ============================================
    const API_KEY = 'b3aae6120d7049a9bc323e501ba4f171'; // Your API key
    const BASE_URL = 'https://api.football-data.org/v4';
    
    let currentBalance = 1000;
    let bettingHistory = [];
    let currentBet = null;
    
    // Headers for API requests
    const headers = {
        'X-Auth-Token': API_KEY
    };
    
    // ============================================
    // UTILITY FUNCTIONS
    // ============================================
    function showToast(message, isError = false) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.style.backgroundColor = isError ? '#ff4444' : '#00ff88';
        toast.style.color = isError ? 'white' : 'black';
        toast.style.display = 'block';
        setTimeout(() => {
            toast.style.display = 'none';
        }, 3000);
    }
    
    function updateBalanceUI() {
        document.getElementById('balance').textContent = currentBalance;
        localStorage.setItem('betting_balance', currentBalance);
    }
    
    function saveHistory() {
        localStorage.setItem('betting_history', JSON.stringify(bettingHistory));
    }
    
    function loadSavedData() {
        const savedBalance = localStorage.getItem('betting_balance');
        const savedHistory = localStorage.getItem('betting_history');
        if (savedBalance) currentBalance = parseFloat(savedBalance);
        if (savedHistory) bettingHistory = JSON.parse(savedHistory);
        updateBalanceUI();
        displayHistory();
    }
    
    // ============================================
    // API CALLS (All endpoints you requested)
    // ============================================
    
    // 1. Get today's matches from all competitions
    async function fetchTodayMatches() {
        try {
            const response = await fetch(`${BASE_URL}/matches`, { headers });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            return data.matches || [];
        } catch (error) {
            console.error('Error fetching matches:', error);
            return getDemoMatches();
        }
    }
    
    // 2. Get Champions League matches
    async function fetchChampionsLeagueMatches() {
        try {
            const response = await fetch(`${BASE_URL}/competitions/CL/matches`, { headers });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            return data.matches || [];
        } catch (error) {
            console.log('Using demo CL matches');
            return [];
        }
    }
    
    // 3. Get Real Madrid upcoming matches (team 86)
    async function fetchRealMadridMatches() {
        try {
            const response = await fetch(`${BASE_URL}/teams/86/matches?status=SCHEDULED`, { headers });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            return data.matches || [];
        } catch (error) {
            return [];
        }
    }
    
    // 4. Get Premier League matchday 11
    async function fetchPremierLeagueMatches() {
        try {
            const response = await fetch(`${BASE_URL}/competitions/PL/matches?matchday=11`, { headers });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            return data.matches || [];
        } catch (error) {
            return [];
        }
    }
    
    // 5. Get Eredivisie standings
    async function fetchStandings() {
        try {
            const response = await fetch(`${BASE_URL}/competitions/DED/standings`, { headers });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            return data.standings[0]?.table || [];
        } catch (error) {
            console.error('Error fetching standings:', error);
            return getDemoStandings();
        }
    }
    
    // 6. Get Serie A top scorers
    async function fetchTopScorers() {
        try {
            const response = await fetch(`${BASE_URL}/competitions/SA/scorers`, { headers });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            return data.scorers || [];
        } catch (error) {
            console.error('Error fetching scorers:', error);
            return getDemoScorers();
        }
    }
    
    // Demo data for fallback
    function getDemoMatches() {
        return [
            { id: 1, homeTeam: { name: "Real Madrid", crest: "https://cdn.freebiesupply.com/logos/large/2x/real-madrid-cf-logo-png-transparent.png" }, awayTeam: { name: "Barcelona", crest: "https://cdn.freebiesupply.com/logos/large/2x/fc-barcelona-logo-png-transparent.png" }, status: "SCHEDULED", odds: { homeWin: 2.1, draw: 3.5, awayWin: 3.2 } },
            { id: 2, homeTeam: { name: "Manchester City", crest: "https://cdn.freebiesupply.com/logos/large/2x/manchester-city-logo-png-transparent.png" }, awayTeam: { name: "Liverpool", crest: "https://cdn.freebiesupply.com/logos/large/2x/liverpool-fc-logo-png-transparent.png" }, status: "SCHEDULED", odds: { homeWin: 1.9, draw: 3.6, awayWin: 3.8 } }
        ];
    }
    
    function getDemoStandings() {
        return [
            { position: 1, team: { name: "Ajax", crest: "https://cdn.freebiesupply.com/logos/large/2x/ajax-amsterdam-logo-png-transparent.png" }, playedGames: 25, won: 20, drawn: 3, lost: 2, points: 63, goalsFor: 72, goalsAgainst: 18 },
            { position: 2, team: { name: "PSV", crest: "https://cdn.freebiesupply.com/logos/large/2x/psv-logo-png-transparent.png" }, playedGames: 25, won: 19, drawn: 4, lost: 2, points: 61, goalsFor: 68, goalsAgainst: 20 }
        ];
    }
    
    function getDemoScorers() {
        return [
            { player: { name: "Lautaro Martínez" }, team: { name: "Inter Milan", crest: "https://cdn.freebiesupply.com/logos/large/2x/internazionale-milano-logo-png-transparent.png" }, goals: 22, assists: 5 },
            { player: { name: "Dusan Vlahovic" }, team: { name: "Juventus", crest: "https://cdn.freebiesupply.com/logos/large/2x/juventus-fc-logo-png-transparent.png" }, goals: 18, assists: 3 }
        ];
    }
    
    // ============================================
    // DISPLAY FUNCTIONS
    // ============================================
    
    async function displayMatches() {
        const container = document.getElementById('matches-container');
        container.innerHTML = '<div class="loader"><div class="spinner"></div><p>Loading matches...</p></div>';
        
        const allMatches = await fetchTodayMatches();
        const clMatches = await fetchChampionsLeagueMatches();
        const rmMatches = await fetchRealMadridMatches();
        const plMatches = await fetchPremierLeagueMatches();
        
        // Combine all unique matches
        const combined = [...allMatches, ...clMatches, ...rmMatches, ...plMatches];
        const uniqueMatches = combined.filter((match, index, self) => 
            index === self.findIndex(m => m.id === match.id)
        );
        
        if (uniqueMatches.length === 0) {
            container.innerHTML = '<p>No matches available at the moment. Please check back later.</p>';
            return;
        }
        
        container.innerHTML = uniqueMatches.map(match => `
            <div class="match-card">
                <div class="teams">
                    <div class="team">
                        <img src="${match.homeTeam?.crest || 'https://via.placeholder.com/60?text=Team'}" class="team-logo" onerror="this.src='https://via.placeholder.com/60?text=Logo'">
                        <div>${match.homeTeam?.name || 'Home Team'}</div>
                    </div>
                    <div class="vs">VS</div>
                    <div class="team">
                        <img src="${match.awayTeam?.crest || 'https://via.placeholder.com/60?text=Team'}" class="team-logo" onerror="this.src='https://via.placeholder.com/60?text=Logo'">
                        <div>${match.awayTeam?.name || 'Away Team'}</div>
                    </div>
                </div>
                <div class="match-info">
                    ${match.status === 'SCHEDULED' ? '📅 Upcoming' : '⏳ Live'} 
                    ${match.utcDate ? new Date(match.utcDate).toLocaleString() : ''}
                </div>
                <div class="bet-odds">
                    <button class="odds-btn" onclick="openBetModal('${match.homeTeam?.name}', ${match.odds?.homeWin || 2.0}, '${match.id}')">${match.homeTeam?.name || 'Home'} ${match.odds?.homeWin || 2.0}x</button>
                    <button class="odds-btn" onclick="openBetModal('Draw', ${match.odds?.draw || 3.5}, '${match.id}')">Draw ${match.odds?.draw || 3.5}x</button>
                    <button class="odds-btn" onclick="openBetModal('${match.awayTeam?.name}', ${match.odds?.awayWin || 2.5}, '${match.id}')">${match.awayTeam?.name || 'Away'} ${match.odds?.awayWin || 2.5}x</button>
                </div>
            </div>
        `).join('');
    }
    
    async function displayStandings() {
        const container = document.getElementById('standings-container');
        container.innerHTML = '<div class="loader"><div class="spinner"></div><p>Loading standings...</p></div>';
        
        const standings = await fetchStandings();
        
        if (standings.length === 0) {
            container.innerHTML = '<p>No standings data available.</p>';
            return;
        }
        
        container.innerHTML = `
            <div class="standings-table">
                <table>
                    <thead>
                        <tr><th>Pos</th><th>Team</th><th>Pld</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>Pts</th></tr>
                    </thead>
                    <tbody>
                        ${standings.map(team => `
                            <tr>
                                <td>${team.position}</td>
                                <td><img src="${team.team?.crest || 'https://via.placeholder.com/30'}" style="width: 30px; vertical-align: middle; margin-right: 10px;" onerror="this.style.display='none'"> ${team.team?.name}</td>
                                <td>${team.playedGames}</td>
                                <td>${team.won}</td>
                                <td>${team.draw}</td>
                                <td>${team.lost}</td>
                                <td>${team.goalsFor}</td>
                                <td>${team.goalsAgainst}</td>
                                <td><strong>${team.points}</strong></td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            </div>
        `;
    }
    
    async function displayScorers() {
        const container = document.getElementById('scorers-container');
        container.innerHTML = '<div class="loader"><div class="spinner"></div><p>Loading top scorers...</p></div>';
        
        const scorers = await fetchTopScorers();
        
        if (scorers.length === 0) {
            container.innerHTML = '<p>No scorer data available.</p>';
            return;
        }
        
        container.innerHTML = `
            <div class="standings-table">
                <table>
                    <thead>
                        <tr><th>Rank</th><th>Player</th><th>Team</th><th>Goals</th><th>Assists</th></tr>
                    </thead>
                    <tbody>
                        ${scorers.map((scorer, index) => `
                            <tr>
                                <td>${index + 1}</td>
                                <td><strong>${scorer.player?.name}</strong></td>
                                <td><img src="${scorer.team?.crest || 'https://via.placeholder.com/30'}" style="width: 30px; vertical-align: middle; margin-right: 10px;" onerror="this.style.display='none'"> ${scorer.team?.name}</td>
                                <td>⚽ ${scorer.goals}</td>
                                <td>🎯 ${scorer.assists || 0}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            </div>
        `;
    }
    
    function displayHistory() {
        const container = document.getElementById('history-container');
        if (bettingHistory.length === 0) {
            container.innerHTML = '<p>No bets placed yet. Start betting on matches!</p>';
            return;
        }
        
        container.innerHTML = `
            <div class="standings-table">
                <table>
                    <thead>
                        <tr><th>Match</th><th>Bet On</th><th>Amount</th><th>Odds</th><th>Result</th><th>Win/Loss</th><th>Date</th></tr>
                    </thead>
                    <tbody>
                        ${bettingHistory.slice().reverse().map(bet => `
                            <tr style="${bet.result === 'win' ? 'background: rgba(0,255,136,0.1)' : 'background: rgba(255,68,68,0.1)'}">
                                <td>${bet.match}</td>
                                <td>${bet.betOn}</td>
                                <td>$${bet.amount}</td>
                                <td>${bet.odds}x</td>
                                <td>${bet.result === 'win' ? '✅ WIN' : '❌ LOSS'}</td>
                                <td style="color: ${bet.result === 'win' ? '#00ff88' : '#ff4444'}">${bet.result === 'win' ? `+$${bet.winAmount}` : `-$${bet.amount}`}</td>
                                <td>${new Date(bet.timestamp).toLocaleString()}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            </div>
        `;
    }
    
    // ============================================
    // BETTING LOGIC
    // ============================================
    
    function openBetModal(teamName, odds, matchId) {
        if (currentBalance <= 0) {
            showToast("Insufficient balance! Please reset your account.", true);
            return;
        }
        currentBet = { teamName, odds, matchId };
        document.getElementById('modal-team').innerHTML = `Place bet on <strong>${teamName}</strong>`;
        document.getElementById('modal-odds').textContent = odds;
        document.getElementById('potential-win').textContent = '0';
        document.getElementById('bet-amount').value = '';
        document.getElementById('betModal').style.display = 'flex';
        
        document.getElementById('bet-amount').oninput = function() {
            const amount = parseFloat(this.value);
            if (!isNaN(amount) && amount > 0) {
                document.getElementById('potential-win').textContent = (amount * odds).toFixed(2);
            } else {
                document.getElementById('potential-win').textContent = '0';
            }
        };
    }
    
    function closeModal() {
        document.getElementById('betModal').style.display = 'none';
        currentBet = null;
    }
    
    function confirmBet() {
        if (!currentBet) return;
        
        const amount = parseFloat(document.getElementById('bet-amount').value);
        if (isNaN(amount) || amount <= 0) {
            showToast("Please enter a valid amount", true);
            return;
        }
        
        if (amount > currentBalance) {
            showToast("Insufficient balance!", true);
            return;
        }
        
        // Simulate bet outcome (random based on odds)
        const random = Math.random();
        const winChance = 1 / currentBet.odds;
        const isWin = random < winChance;
        
        let winAmount = 0;
        if (isWin) {
            winAmount = amount * currentBet.odds;
            currentBalance += winAmount - amount;
            showToast(`🎉 Congratulations! You won $${(winAmount - amount).toFixed(2)}!`);
        } else {
            currentBalance -= amount;
            showToast(`😞 Sorry, you lost $${amount}. Better luck next time!`, true);
        }
        
        // Save to history
        bettingHistory.push({
            match: `Match ${currentBet.matchId}`,
            betOn: currentBet.teamName,
            amount: amount,
            odds: currentBet.odds,
            result: isWin ? 'win' : 'loss',
            winAmount: winAmount,
            timestamp: new Date().toISOString()
        });
        
        updateBalanceUI();
        saveHistory();
        displayHistory();
        closeModal();
    }
    
    function resetBalance() {
        if (confirm("Reset balance to $1000? This will not delete your betting history.")) {
            currentBalance = 1000;
            updateBalanceUI();
            showToast("Balance reset to $1000!");
        }
    }
    
    // ============================================
    // TAB SWITCHING
    // ============================================
    
    function switchTab(tabName) {
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        
        document.getElementById(`${tabName}-tab`).classList.add('active');
        event.target.classList.add('active');
        
        if (tabName === 'matches') displayMatches();
        else if (tabName === 'standings') displayStandings();
        else if (tabName === 'scorers') displayScorers();
        else if (tabName === 'history') displayHistory();
    }
    
    // ============================================
    // INITIALIZATION
    // ============================================
    
    async function init() {
        loadSavedData();
        await displayMatches();
        await displayStandings();
        await displayScorers();
        
        // Add reset button to navbar
        const navContainer = document.querySelector('.nav-container');
        const resetBtn = document.createElement('button');
        resetBtn.textContent = '⟳ Reset Balance';
        resetBtn.onclick = resetBalance;
        resetBtn.style.background = '#ff4444';
        resetBtn.style.border = 'none';
        resetBtn.style.padding = '0.5rem 1rem';
        resetBtn.style.borderRadius = '8px';
        resetBtn.style.color = 'white';
        resetBtn.style.cursor = 'pointer';
        navContainer.appendChild(resetBtn);
    }
    
    init();
</script>
</body>
</html>
