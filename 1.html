<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>X London | Professional Betting</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0A0C12;
            color: #E8EDF5;
            overflow-x: hidden;
        }

        /* Professional Dark Theme - Clean & Modern */
        :root {
            --bg-primary: #0A0C12;
            --bg-secondary: #12141C;
            --bg-card: #181C26;
            --border: #252A36;
            --primary: #2D7AFF;
            --primary-dark: #1A5CD8;
            --primary-light: #4A8EFF;
            --accent: #FF3B6F;
            --success: #00D26A;
            --warning: #FFB800;
            --danger: #FF4757;
            --text-muted: #8E94A3;
            --text-light: #B8BECF;
        }

        /* Layout - Clean Sidebar Style */
        .app-wrapper {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar Navigation */
        .sidebar {
            width: 280px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            z-index: 50;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
        }

        .sidebar-header {
            padding: 24px 20px;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
        }

        .logo-text {
            font-size: 1.4rem;
            font-weight: 800;
            background: linear-gradient(135deg, #FFFFFF, var(--primary));
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .user-info {
            padding: 20px;
            background: rgba(45, 122, 255, 0.08);
            margin: 16px;
            border-radius: 20px;
            border: 1px solid rgba(45, 122, 255, 0.15);
        }

        .user-avatar {
            width: 48px;
            height: 48px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .user-name {
            font-weight: 700;
            margin-bottom: 4px;
        }

        .user-email {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .balance-box {
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }

        .balance-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        .balance-amount {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--primary);
        }

        .nav-menu {
            flex: 1;
            padding: 0 12px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 16px;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-light);
            margin-bottom: 4px;
        }

        .nav-item:hover {
            background: rgba(45, 122, 255, 0.1);
            color: white;
        }

        .nav-item.active {
            background: var(--primary);
            color: white;
        }

        .nav-item i {
            width: 24px;
            font-size: 1.1rem;
        }

        .logout-btn {
            margin: 20px;
            padding: 14px;
            background: rgba(255, 71, 87, 0.1);
            border-radius: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--danger);
        }

        .logout-btn:hover {
            background: rgba(255, 71, 87, 0.2);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            margin-left: 280px;
            padding: 24px 32px;
        }

        /* Filter Tabs */
        .filter-section {
            display: flex;
            gap: 12px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-light);
        }

        .filter-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .filter-btn:hover:not(.active) {
            border-color: var(--primary);
            color: white;
        }

        /* Match Cards Grid */
        .matches-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .match-card {
            background: var(--bg-card);
            border-radius: 20px;
            border: 1px solid var(--border);
            overflow: hidden;
            transition: all 0.2s;
        }

        .match-card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .match-header {
            padding: 14px 20px;
            background: rgba(0, 0, 0, 0.2);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .league {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--primary);
            letter-spacing: 0.5px;
        }

        .live-tag {
            background: var(--danger);
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.65rem;
            font-weight: 700;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .match-body {
            padding: 20px;
        }

        /* Teams Row */
        .teams-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .team-block {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .team-block.away {
            justify-content: flex-end;
        }

        .team-badge {
            width: 52px;
            height: 52px;
            background: #1E2432;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--primary);
            border: 2px solid var(--border);
        }

        .team-name {
            font-weight: 700;
            font-size: 1rem;
        }

        .score-box {
            text-align: center;
            min-width: 100px;
        }

        .score-value {
            font-size: 2rem;
            font-weight: 800;
            color: white;
        }

        .match-time {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Odds Section */
        .odds-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        .odds-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 12px;
        }

        .odds-btn {
            background: #1E2432;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.15s;
            font-weight: 700;
            font-size: 1rem;
        }

        .odds-btn:hover {
            background: var(--primary);
            border-color: var(--primary);
            transform: scale(1.02);
        }

        .odds-label-sm {
            font-size: 0.65rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .double-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        /* Right Sidebar - Bet Slip */
        .right-sidebar {
            position: fixed;
            right: 0;
            top: 0;
            bottom: 0;
            width: 340px;
            background: var(--bg-secondary);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 40;
            overflow-y: auto;
        }

        .bet-slip-header {
            padding: 20px;
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
        }

        .bet-slip-title {
            font-weight: 800;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .bet-count {
            background: rgba(255,255,255,0.2);
            padding: 2px 10px;
            border-radius: 30px;
            font-size: 0.7rem;
        }

        .bet-items {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
        }

        .bet-item {
            background: var(--bg-card);
            border-radius: 14px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border);
        }

        .bet-info {
            flex: 1;
        }

        .bet-selection {
            font-weight: 700;
            font-size: 0.85rem;
        }

        .bet-type {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .bet-odds {
            font-weight: 800;
            color: var(--primary);
            font-size: 1rem;
        }

        .remove-bet {
            color: var(--danger);
            cursor: pointer;
            padding: 6px;
        }

        .bet-summary {
            padding: 16px;
            border-top: 1px solid var(--border);
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .stake-input {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 12px;
            width: 120px;
            text-align: right;
            color: white;
            font-weight: 600;
        }

        .potential-win {
            background: rgba(0, 210, 106, 0.1);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            margin: 16px 0;
        }

        .place-bet-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--success), #00A856);
            border: none;
            padding: 14px;
            border-radius: 40px;
            font-weight: 800;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
        }

        .place-bet-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 15px rgba(0, 210, 106, 0.3);
        }

        /* Stats Cards */
        .stats-section {
            padding: 16px;
            border-top: 1px solid var(--border);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 12px;
        }

        .stat-card {
            background: var(--bg-card);
            border-radius: 14px;
            padding: 12px;
            text-align: center;
        }

        .stat-value {
            font-size: 1.2rem;
            font-weight: 800;
        }

        .stat-label {
            font-size: 0.65rem;
            color: var(--text-muted);
        }

        /* Mobile Toggle */
        .mobile-menu-toggle {
            display: none;
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 60;
            background: var(--primary);
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
        }

        /* Toast */
        .toast-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 200;
            pointer-events: none;
        }

        .toast {
            background: var(--bg-card);
            border-left: 4px solid var(--primary);
            border-radius: 12px;
            padding: 12px 20px;
            margin-bottom: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            pointer-events: auto;
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .right-sidebar {
                width: 300px;
            }
            .main-content {
                margin-right: 300px;
            }
        }

        @media (max-width: 992px) {
            .sidebar {
                transform: translateX(-100%);
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .main-content {
                margin-left: 0;
                margin-right: 0;
                padding: 80px 16px 24px;
            }
            .right-sidebar {
                position: relative;
                width: 100%;
                margin-top: 24px;
                border-left: none;
                border-top: 1px solid var(--border);
            }
            .mobile-menu-toggle {
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .team-badge {
                width: 40px;
                height: 40px;
                font-size: 0.9rem;
            }
            .team-name {
                font-size: 0.8rem;
            }
            .score-value {
                font-size: 1.3rem;
            }
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <button class="mobile-menu-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <div class="logo-icon"><i class="fas fa-crown"></i></div>
                <span class="logo-text">X LONDON</span>
            </div>
        </div>
        
        <div class="user-info">
            <div class="user-avatar" id="userAvatar">U</div>
            <div class="user-name" id="userName">User</div>
            <div class="user-email" id="userEmail">user@example.com</div>
            <div class="balance-box">
                <div class="balance-label">AVAILABLE BALANCE</div>
                <div class="balance-amount" id="sidebarBalance">$0.00</div>
            </div>
        </div>

        <div class="nav-menu">
            <div class="nav-item active" onclick="loadLiveMatches()">
                <i class="fas fa-futbol"></i> <span>Live Matches</span>
            </div>
            <div class="nav-item" onclick="loadUpcomingMatches()">
                <i class="fas fa-calendar"></i> <span>Upcoming</span>
            </div>
            <div class="nav-item" onclick="loadFinishedMatches()">
                <i class="fas fa-check-circle"></i> <span>Finished</span>
            </div>
            <div class="nav-item" onclick="refreshData()">
                <i class="fas fa-sync-alt"></i> <span>Refresh</span>
            </div>
        </div>

        <div class="logout-btn" onclick="logout()">
            <i class="fas fa-sign-out-alt"></i> <span>Logout</span>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Filter Tabs (Mobile friendly) -->
        <div class="filter-section">
            <button class="filter-btn active" id="liveFilterBtn" onclick="loadLiveMatches()">LIVE</button>
            <button class="filter-btn" id="upcomingFilterBtn" onclick="loadUpcomingMatches()">UPCOMING</button>
            <button class="filter-btn" id="finishedFilterBtn" onclick="loadFinishedMatches()">FINISHED</button>
        </div>

        <!-- Matches Container -->
        <div id="matchesContainer" class="matches-grid">
            <div class="empty-state"><i class="fas fa-spinner fa-spin"></i> Loading matches...</div>
        </div>
    </div>

    <!-- Right Sidebar - Bet Slip -->
    <div class="right-sidebar">
        <div class="bet-slip-header">
            <div class="bet-slip-title">
                <i class="fas fa-receipt"></i> BET SLIP
                <span class="bet-count" id="betCount">0</span>
            </div>
        </div>
        
        <div class="bet-items" id="betSlipItems">
            <div style="text-align: center; padding: 40px 20px; color: var(--text-muted);">
                <i class="fas fa-plus-circle" style="font-size: 40px; margin-bottom: 12px; opacity: 0.5;"></i>
                <p>Click on odds to add</p>
            </div>
        </div>

        <div id="betSummaryPanel" style="display: none;">
            <div class="bet-summary">
                <div class="summary-row">
                    <span style="color: var(--text-muted);">Total Odds</span>
                    <span id="totalOdds" style="font-weight: 800; font-size: 1.2rem;">-</span>
                </div>
                <div class="summary-row">
                    <span style="color: var(--text-muted);">Stake</span>
                    <input type="number" id="stakeAmount" min="1" step="0.01" value="10.00" class="stake-input">
                </div>
                <div class="potential-win">
                    <span style="font-weight: 600;">Potential Win</span>
                    <span id="potentialWin" style="font-weight: 800; color: var(--success); font-size: 1.2rem;">$0.00</span>
                </div>
                <button class="place-bet-btn" id="placeBetBtn" onclick="placeBet()">PLACE BET</button>
            </div>
        </div>

        <!-- Stats Section -->
        <div class="stats-section">
            <div style="font-weight: 700; margin-bottom: 12px;"><i class="fas fa-chart-line"></i> Performance</div>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="statTotalBets">0</div>
                    <div class="stat-label">Total Bets</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="statWinRate">0%</div>
                    <div class="stat-label">Win Rate</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="statProfitLoss">$0</div>
                    <div class="stat-label">Profit/Loss</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="statOpenBets">0</div>
                    <div class="stat-label">Open Bets</div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };

        let auth, db, currentUser = null, userData = null, bettingSlip = [], currentMatchType = 'live';
        firebase.initializeApp(firebaseConfig);
        auth = firebase.auth();
        db = firebase.firestore();

        // Age Verification (simplified)
        if (!localStorage.getItem('ageVerified')) {
            if (confirm("You must be 18+ to continue. Click OK to confirm you are 18 or older.")) {
                localStorage.setItem('ageVerified', 'true');
            } else {
                window.location.href = 'about:blank';
            }
        }

        async function initializeApp() {
            auth.onAuthStateChanged(async (user) => {
                if (!user) { window.location.href = 'login.html'; return; }
                currentUser = user;
                await loadUserData();
                updateUI();
                loadLiveMatches();
                setInterval(() => { if(currentUser) loadUserStats(); }, 8000);
                setInterval(() => { if(currentUser) loadOpenBetsCount(); }, 5000);
            });
        }

        async function loadUserData() {
            try {
                const doc = await db.collection('wallets').doc(currentUser.uid).get();
                if (doc.exists) {
                    userData = doc.data();
                    updateBalance();
                    loadUserStats();
                }
            } catch(e) { console.error(e); }
        }

        function updateUI() {
            const name = userData?.username || currentUser.email.split('@')[0];
            document.getElementById('userName').innerText = name;
            document.getElementById('userEmail').innerText = currentUser.email;
            document.getElementById('userAvatar').innerText = name.charAt(0).toUpperCase();
            updateBalance();
        }

        function updateBalance() {
            const balance = `$${(userData?.balance || 0).toFixed(2)}`;
            document.getElementById('sidebarBalance').innerText = balance;
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}" style="margin-right: 8px; color: var(--primary);"></i> ${message}`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // Sample Match Data
        function getMatches() {
            return {
                live: [
                    { id: 1, league: "PREMIER LEAGUE", home: "Manchester United", away: "Liverpool", homeScore: 1, awayScore: 1, time: "65'", status: "live" },
                    { id: 2, league: "LA LIGA", home: "Real Madrid", away: "Barcelona", homeScore: 2, awayScore: 0, time: "52'", status: "live" },
                    { id: 3, league: "SERIE A", home: "AC Milan", away: "Inter", homeScore: 0, awayScore: 0, time: "28'", status: "live" },
                    { id: 4, league: "BUNDESLIGA", home: "Bayern Munich", away: "Dortmund", homeScore: 3, awayScore: 1, time: "78'", status: "live" }
                ],
                upcoming: [
                    { id: 5, league: "PREMIER LEAGUE", home: "Arsenal", away: "Chelsea", time: "Tomorrow 20:00", status: "upcoming" },
                    { id: 6, league: "CHAMPIONS LEAGUE", home: "PSG", away: "Man City", time: "Feb 15 21:00", status: "upcoming" },
                    { id: 7, league: "LA LIGA", home: "Atletico Madrid", away: "Sevilla", time: "Feb 16 18:30", status: "upcoming" }
                ],
                finished: [
                    { id: 8, league: "PREMIER LEAGUE", home: "Tottenham", away: "Newcastle", homeScore: 2, awayScore: 1, time: "FT", status: "finished" },
                    { id: 9, league: "SERIE A", home: "Juventus", away: "Roma", homeScore: 1, awayScore: 1, time: "FT", status: "finished" }
                ]
            };
        }

        function getOdds() {
            return {
                home: (Math.random() * 1.5 + 1.8).toFixed(2),
                draw: (Math.random() * 1.2 + 2.8).toFixed(2),
                away: (Math.random() * 1.5 + 1.8).toFixed(2),
                over: (Math.random() * 0.8 + 1.6).toFixed(2),
                under: (Math.random() * 0.8 + 2.0).toFixed(2)
            };
        }

        function renderMatchCard(match, type) {
            const odds = getOdds();
            const isLive = type === 'live';
            const isFinished = type === 'finished';
            const homeShort = match.home.split(' ').pop();
            const awayShort = match.away.split(' ').pop();
            
            return `
                <div class="match-card" data-match-id="${match.id}">
                    <div class="match-header">
                        <span class="league">${match.league}</span>
                        ${isLive ? '<span class="live-tag"><i class="fas fa-circle" style="font-size: 8px; margin-right: 4px;"></i> LIVE</span>' : ''}
                        ${!isLive && !isFinished ? `<span style="font-size: 0.7rem; color: var(--text-muted);">${match.time}</span>` : ''}
                    </div>
                    <div class="match-body">
                        <div class="teams-container">
                            <div class="team-block">
                                <div class="team-badge">${homeShort?.charAt(0) || 'H'}</div>
                                <span class="team-name">${match.home}</span>
                            </div>
                            <div class="score-box">
                                <div class="score-value">${isLive || isFinished ? `${match.homeScore || 0} - ${match.awayScore || 0}` : 'VS'}</div>
                                ${isLive ? `<div class="match-time">${match.time}</div>` : ''}
                            </div>
                            <div class="team-block away">
                                <span class="team-name">${match.away}</span>
                                <div class="team-badge">${awayShort?.charAt(0) || 'A'}</div>
                            </div>
                        </div>
                        
                        ${!isFinished ? `
                            <div class="odds-section">
                                <div class="odds-row">
                                    <div class="odds-btn" onclick="addToBetSlip(${match.id}, '${match.home}', '1', ${odds.home})">1 <strong>${odds.home}</strong></div>
                                    <div class="odds-btn" onclick="addToBetSlip(${match.id}, 'Draw', 'X', ${odds.draw})">X <strong>${odds.draw}</strong></div>
                                    <div class="odds-btn" onclick="addToBetSlip(${match.id}, '${match.away}', '2', ${odds.away})">2 <strong>${odds.away}</strong></div>
                                </div>
                                <div class="double-row">
                                    <div class="odds-btn" onclick="addToBetSlip(${match.id}, 'Over 2.5', 'Over', ${odds.over})">Over 2.5 <strong>${odds.over}</strong></div>
                                    <div class="odds-btn" onclick="addToBetSlip(${match.id}, 'Under 2.5', 'Under', ${odds.under})">Under 2.5 <strong>${odds.under}</strong></div>
                                </div>
                            </div>
                        ` : `
                            <div style="text-align: center; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); color: var(--text-muted);">
                                <i class="fas fa-flag-checkered"></i> Full Time
                            </div>
                        `}
                    </div>
                </div>
            `;
        }

        function loadLiveMatches() {
            currentMatchType = 'live';
            document.querySelectorAll('.filter-btn, .nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById('liveFilterBtn')?.classList.add('active');
            document.querySelector('.nav-item:first-child')?.classList.add('active');
            const matches = getMatches().live;
            document.getElementById('matchesContainer').innerHTML = matches.map(m => renderMatchCard(m, 'live')).join('');
        }

        function loadUpcomingMatches() {
            currentMatchType = 'upcoming';
            document.querySelectorAll('.filter-btn, .nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById('upcomingFilterBtn')?.classList.add('active');
            const matches = getMatches().upcoming;
            document.getElementById('matchesContainer').innerHTML = matches.map(m => renderMatchCard(m, 'upcoming')).join('');
        }

        function loadFinishedMatches() {
            currentMatchType = 'finished';
            document.querySelectorAll('.filter-btn, .nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById('finishedFilterBtn')?.classList.add('active');
            const matches = getMatches().finished;
            document.getElementById('matchesContainer').innerHTML = matches.map(m => renderMatchCard(m, 'finished')).join('');
        }

        function refreshData() {
            if (currentMatchType === 'live') loadLiveMatches();
            else if (currentMatchType === 'upcoming') loadUpcomingMatches();
            else loadFinishedMatches();
            showToast('Matches refreshed', 'success');
        }

        function addToBetSlip(matchId, selection, betType, odds) {
            bettingSlip.push({ matchId, selection, betType, odds: parseFloat(odds), id: Date.now() });
            updateBetSlip();
            showToast(`Added: ${selection} @ ${odds}`, 'success');
        }

        function updateBetSlip() {
            const container = document.getElementById('betSlipItems');
            const countSpan = document.getElementById('betCount');
            const summaryPanel = document.getElementById('betSummaryPanel');
            
            countSpan.innerText = bettingSlip.length;
            
            if (bettingSlip.length === 0) {
                container.innerHTML = `<div style="text-align: center; padding: 40px 20px; color: var(--text-muted);"><i class="fas fa-plus-circle" style="font-size: 40px; margin-bottom: 12px; opacity: 0.5;"></i><p>Click on odds to add</p></div>`;
                summaryPanel.style.display = 'none';
                return;
            }
            
            let html = '';
            let totalOdds = 1;
            bettingSlip.forEach((bet, idx) => {
                totalOdds *= bet.odds;
                html += `
                    <div class="bet-item">
                        <div class="bet-info">
                            <div class="bet-selection">${bet.selection}</div>
                            <div class="bet-type">${bet.betType}</div>
                        </div>
                        <div style="display: flex; align-items: center; gap: 12px;">
                            <span class="bet-odds">${bet.odds}</span>
                            <span class="remove-bet" onclick="removeFromBetSlip(${idx})"><i class="fas fa-trash-alt"></i></span>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
            summaryPanel.style.display = 'block';
            document.getElementById('totalOdds').innerText = totalOdds.toFixed(2);
            updatePotentialWin();
        }

        function removeFromBetSlip(index) {
            bettingSlip.splice(index, 1);
            updateBetSlip();
        }

        function updatePotentialWin() {
            const stake = parseFloat(document.getElementById('stakeAmount').value) || 0;
            const totalOdds = parseFloat(document.getElementById('totalOdds').innerText) || 1;
            document.getElementById('potentialWin').innerText = `$${(stake * totalOdds).toFixed(2)}`;
        }

        async function placeBet() {
            if (bettingSlip.length === 0) { showToast('No selections', 'error'); return; }
            const stake = parseFloat(document.getElementById('stakeAmount').value);
            if (stake < 1) { showToast('Minimum $1', 'error'); return; }
            if (stake > (userData?.balance || 0)) { showToast('Insufficient balance', 'error'); return; }
            
            const totalOdds = parseFloat(document.getElementById('totalOdds').innerText);
            const potentialWin = stake * totalOdds;
            if (!confirm(`Place $${stake} to win $${potentialWin.toFixed(2)}?`)) return;
            
            try {
                const betId = `bet_${Date.now()}_${Math.random().toString(36).substr(2, 6)}`;
                await db.collection('bets').doc(betId).set({
                    betId, userId: currentUser.uid, selections: bettingSlip,
                    stake, totalOdds, potentialWin, status: 'pending',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                
                const newBalance = (userData?.balance || 0) - stake;
                await db.collection('wallets').doc(currentUser.uid).update({ balance: newBalance });
                userData.balance = newBalance;
                updateBalance();
                bettingSlip = [];
                updateBetSlip();
                showToast(`Bet placed! $${stake} to win $${potentialWin.toFixed(2)}`, 'success');
                loadUserStats();
            } catch(e) { showToast('Bet failed', 'error'); }
        }

        async function loadUserStats() {
            try {
                const betsSnap = await db.collection('bets').where('userId', '==', currentUser.uid).get();
                const bets = betsSnap.docs.map(d => d.data());
                const total = bets.length;
                const won = bets.filter(b => b.status === 'won').length;
                const winRate = total ? ((won / total) * 100).toFixed(1) : 0;
                let profit = 0;
                bets.forEach(b => {
                    if (b.status === 'won') profit += (b.potentialWin - b.stake);
                    else if (b.status === 'lost') profit -= b.stake;
                });
                document.getElementById('statTotalBets').innerText = total;
                document.getElementById('statWinRate').innerText = `${winRate}%`;
                document.getElementById('statProfitLoss').innerHTML = `$${profit.toFixed(2)}`;
                document.getElementById('statProfitLoss').style.color = profit >= 0 ? 'var(--success)' : 'var(--danger)';
                await loadOpenBetsCount();
            } catch(e) { console.error(e); }
        }

        async function loadOpenBetsCount() {
            try {
                const openSnap = await db.collection('bets').where('userId', '==', currentUser.uid).where('status', '==', 'pending').get();
                document.getElementById('statOpenBets').innerText = openSnap.size;
            } catch(e) {}
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        async function logout() {
            await auth.signOut();
            window.location.href = 'login.html';
        }

        document.getElementById('stakeAmount')?.addEventListener('input', updatePotentialWin);
        window.onload = initializeApp;
    </script>
</body>
</html>
