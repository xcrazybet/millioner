<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>LIVE MATCHES (INPLAY)</title>

<style>
body {
    background:#0f172a;
    color:white;
    font-family:Arial;
    padding:20px;
}

h1 {
    text-align:center;
    margin-bottom:20px;
}

.container {
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:15px;
}

.card {
    background:#020617;
    padding:15px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.5);
}

.league {
    font-size:12px;
    color:#94a3b8;
}

.teams {
    font-size:18px;
    margin:10px 0;
}

.score {
    font-size:24px;
    color:#22c55e;
    font-weight:bold;
}

.status {
    font-size:12px;
    color:#facc15;
}

.odds {
    display:flex;
    justify-content:space-between;
    margin-top:10px;
}

.odd {
    background:#1e293b;
    padding:5px 10px;
    border-radius:5px;
}
</style>

</head>

<body>

<h1>⚽ LIVE IN-PLAY MATCHES</h1>

<div class="container" id="matches"></div>

<script>

const API_TOKEN = "YOUR_TOKEN"; // 🔴 PUT YOUR REAL TOKEN

async function loadLiveMatches() {

    const url = `https://api.sportmonks.com/v3/football/livescores/inplay?api_token=${API_TOKEN}&include=participants;scores;league;state;odds`;

    try {
        const res = await fetch(url);
        const json = await res.json();

        const container = document.getElementById("matches");
        container.innerHTML = "";

        json.data.forEach(match => {

            // Teams
            const home = match.participants?.find(t => t.meta.location === "home")?.name || "Home";
            const away = match.participants?.find(t => t.meta.location === "away")?.name || "Away";

            // Score
            const homeScore = match.scores?.find(s => s.description === "CURRENT" && s.participant === "home")?.score || 0;
            const awayScore = match.scores?.find(s => s.description === "CURRENT" && s.participant === "away")?.score || 0;

            // League
            const league = match.league?.name || "League";

            // Status
            const status = match.state?.name || "LIVE";

            // Odds (simple example)
            let oddsHtml = "";
            if(match.odds && match.odds.length > 0){
                const o = match.odds.slice(0,3); // first 3 odds
                oddsHtml = `
                    <div class="odds">
                        ${o.map(x => `<div class="odd">${x.value}</div>`).join("")}
                    </div>
                `;
            }

            const card = `
                <div class="card">
                    <div class="league">${league}</div>

                    <div class="teams">
                        ${home} vs ${away}
                    </div>

                    <div class="score">
                        ${homeScore} - ${awayScore}
                    </div>

                    <div class="status">
                        ${status}
                    </div>

                    ${oddsHtml}
                </div>
            `;

            container.innerHTML += card;
        });

    } catch (err) {
        console.log(err);
    }
}

// load first time
loadLiveMatches();

// auto refresh every 5 sec
setInterval(loadLiveMatches, 5000);

</script>

</body>
</html>
