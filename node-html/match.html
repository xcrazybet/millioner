<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎰 ProBet365 - Live Sports Betting Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .live-badge {
            animation: pulse 1.5s ease-in-out infinite;
        }
        .match-card:hover {
            transform: translateY(-2px);
            transition: all 0.3s ease;
        }
        .bet-slip {
            position: sticky;
            top: 20px;
        }
        .odds-button:hover {
            transform: scale(1.05);
            transition: transform 0.2s ease;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-900 to-gray-800 text-white">
    <div class="container mx-auto px-4 py-6">
        <!-- Header -->
        <div class="flex justify-between items-center mb-8 bg-gray-800 rounded-lg p-4 shadow-xl">
            <div>
                <h1 class="text-3xl font-bold bg-gradient-to-r from-yellow-400 to-red-500 bg-clip-text text-transparent">
                    🎰 ProBet365
                </h1>
                <p class="text-gray-400 text-sm">Live Sports Betting Platform</p>
            </div>
            <div class="flex gap-4">
                <div class="text-right">
                    <div class="text-sm text-gray-400">Balance</div>
                    <div class="text-2xl font-bold text-green-500" id="balance">$1,000.00</div>
                </div>
                <button onclick="resetBalance()" class="bg-blue-600 px-4 py-2 rounded-lg hover:bg-blue-700 transition">
                    💰 Reset
                </button>
            </div>
        </div>

        <!-- Main Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Left Column: Matches -->
            <div class="lg:col-span-2">
                <!-- Tabs -->
                <div class="bg-gray-800 rounded-lg p-1 mb-6 flex gap-2">
                    <button onclick="loadLiveMatches()" id="tabLive" class="flex-1 py-3 rounded-lg font-semibold transition bg-red-600">
                        🔴 LIVE <span id="liveCount" class="ml-2 bg-red-800 px-2 py-0.5 rounded text-xs">0</span>
                    </button>
                    <button onclick="loadUpcomingMatches()" id="tabUpcoming" class="flex-1 py-3 rounded-lg font-semibold transition hover:bg-gray-700">
                        📅 UPCOMING
                    </button>
                    <button onclick="loadFinishedMatches()" id="tabFinished" class="flex-1 py-3 rounded-lg font-semibold transition hover:bg-gray-700">
                        🏁 FINISHED
                    </button>
                </div>

                <!-- Search & Filter -->
                <div class="bg-gray-800 rounded-lg p-4 mb-6">
                    <div class="flex gap-4 flex-wrap">
                        <input type="text" id="searchInput" placeholder="🔍 Search teams or leagues..." 
                               class="flex-1 bg-gray-700 text-white px-4 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <select id="leagueFilter" class="bg-gray-700 text-white px-4 py-2 rounded-lg">
                            <option value="">All Leagues</option>
                        </select>
                        <button onclick="refreshMatches()" class="bg-green-600 px-6 py-2 rounded-lg hover:bg-green-700">
                            🔄 Refresh
                        </button>
                    </div>
                </div>

                <!-- Matches Container -->
                <div id="matchesContainer" class="space-y-4">
                    <div class="text-center py-12 bg-gray-800 rounded-lg">
                        <div class="text-4xl mb-4">⚽</div>
                        <p class="text-gray-400">Loading matches...</p>
                    </div>
                </div>
            </div>

            <!-- Right Column: Bet Slip -->
            <div class="lg:col-span-1">
                <div class="bet-slip bg-gray-800 rounded-lg p-6 shadow-xl">
                    <h2 class="text-xl font-bold mb-4 flex items-center gap-2">
                        🧾 Bet Slip
                        <span class="text-sm text-gray-400">(Max 10 bets)</span>
                    </h2>
                    
                    <div id="betSlipContent" class="space-y-3 max-h-96 overflow-y-auto mb-4">
                        <div class="text-center text-gray-400 py-8">
                            No bets selected<br>
                            <span class="text-sm">Click on odds to add bets</span>
                        </div>
                    </div>
                    
                    <div class="border-t border-gray-700 pt-4 mt-4">
                        <div class="flex justify-between mb-2">
                            <span class="text-gray-400">Total Bets:</span>
                            <span id="totalBets" class="font-semibold">0</span>
                        </div>
                        <div class="flex justify-between mb-4">
                            <span class="text-gray-400">Potential Payout:</span>
                            <span id="potentialPayout" class="text-2xl font-bold text-green-500">$0.00</span>
                        </div>
                        <input type="number" id="betAmount" placeholder="Enter stake amount" 
                               class="w-full bg-gray-700 text-white px-4 py-2 rounded-lg mb-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <button onclick="placeBet()" class="w-full bg-gradient-to-r from-green-600 to-green-700 py-3 rounded-lg font-bold hover:from-green-700 hover:to-green-800 transition">
                            🎲 PLACE BET
                        </button>
                    </div>
                </div>

                <!-- Stats Panel -->
                <div class="bg-gray-800 rounded-lg p-6 mt-6">
                    <h3 class="font-semibold mb-3">📊 Betting Stats</h3>
                    <div class="space-y-2 text-sm">
                        <div class="flex justify-between">
                            <span>Bets Placed:</span>
                            <span id="betsPlaced" class="font-semibold text-blue-400">0</span>
                        </div>
                        <div class="flex justify-between">
                            <span>Won/Lost:</span>
                            <span id="winLoss" class="font-semibold text-green-400">0/0</span>
                        </div>
                        <div class="flex justify-between">
                            <span>Win Rate:</span>
                            <span id="winRate" class="font-semibold text-yellow-400">0%</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ========== CONFIGURATION ==========
        const API_BASE = 'http://localhost:3000/api';
        let currentMatches = [];
        let betSlip = [];
        let userBalance = 1000;
        let bettingHistory = [];

        // ========== INITIALIZATION ==========
        async function init() {
            await loadLiveMatches();
            setInterval(autoRefresh, 30000); // Auto-refresh every 30 seconds
            updateBalance();
        }

        // ========== API CALLS ==========
        async function fetchFromAPI(endpoint, params = {}) {
            try {
                const queryParams = new URLSearchParams(params);
                const url = `${API_BASE}/${endpoint}?${queryParams}`;
                const response = await fetch(url);
                
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                return data.data || [];
            } catch (error) {
                console.error('API Error:', error);
                showNotification('Failed to fetch data', 'error');
                return [];
            }
        }

        async function loadLiveMatches() {
            setActiveTab('live');
            showLoading();
            
            try {
                const matches = await fetchFromAPI('livescores', {
                    include: 'participants;state;league;scores;events',
                    per_page: 50
                });
                
                const liveMatches = matches.filter(m => [2, 3, 4, 5, 6].includes(m.state_id));
                currentMatches = liveMatches;
                displayMatches(liveMatches, 'live');
                document.getElementById('liveCount').textContent = liveMatches.length;
                showNotification(`Found ${liveMatches.length} live matches`, 'success');
            } catch (error) {
                console.error('Error loading live matches:', error);
                showError('Failed to load live matches');
            }
        }

        async function loadUpcomingMatches() {
            setActiveTab('upcoming');
            showLoading();
            
            try {
                const today = new Date();
                const nextWeek = new Date(today);
                nextWeek.setDate(today.getDate() + 7);
                
                const todayStr = today.toISOString().split('T')[0];
                const nextWeekStr = nextWeek.toISOString().split('T')[0];
                
                const matches = await fetchFromAPI(`fixtures/between/${todayStr}/${nextWeekStr}`, {
                    include: 'participants;state;league;scores;venue',
                    per_page: 100
                });
                
                const upcomingMatches = matches.filter(m => [1, 45, 46].includes(m.state_id));
                currentMatches = upcomingMatches;
                displayMatches(upcomingMatches, 'upcoming');
                showNotification(`Found ${upcomingMatches.length} upcoming matches`, 'success');
            } catch (error) {
                console.error('Error loading upcoming matches:', error);
                showError('Failed to load upcoming matches');
            }
        }

        async function loadFinishedMatches() {
            setActiveTab('finished');
            showLoading();
            
            try {
                const today = new Date();
                const lastWeek = new Date(today);
                lastWeek.setDate(today.getDate() - 7);
                
                const lastWeekStr = lastWeek.toISOString().split('T')[0];
                const todayStr = today.toISOString().split('T')[0];
                
                const matches = await fetchFromAPI(`fixtures/between/${lastWeekStr}/${todayStr}`, {
                    include: 'participants;state;league;scores',
                    per_page: 100
                });
                
                const finishedMatches = matches.filter(m => [100, 90].includes(m.state_id));
                currentMatches = finishedMatches;
                displayMatches(finishedMatches, 'finished');
                showNotification(`Found ${finishedMatches.length} finished matches`, 'success');
            } catch (error) {
                console.error('Error loading finished matches:', error);
                showError('Failed to load finished matches');
            }
        }

        // ========== DISPLAY FUNCTIONS ==========
        function displayMatches(matches, type) {
            const container = document.getElementById('matchesContainer');
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const selectedLeague = document.getElementById('leagueFilter').value;
            
            // Populate league filter
            if (type === 'upcoming' && document.getElementById('leagueFilter').options.length <= 1) {
                const leagues = new Set();
                matches.forEach(match => {
                    if (match.league?.name) leagues.add(match.league.name);
                });
                leagues.forEach(league => {
                    const option = document.createElement('option');
                    option.value = league;
                    option.textContent = league;
                    document.getElementById('leagueFilter').appendChild(option);
                });
            }
            
            // Filter matches
            let filtered = matches.filter(match => {
                const matchSearch = `${match.league?.name || ''} ${match.participants?.map(p => p.name).join(' ') || ''}`.toLowerCase();
                const matchesSearch = matchSearch.includes(searchTerm);
                const matchesLeague = !selectedLeague || match.league?.name === selectedLeague;
                return matchesSearch && matchesLeague;
            });
            
            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 bg-gray-800 rounded-lg">
                        <div class="text-4xl mb-4">🔍</div>
                        <p class="text-gray-400">No matches found</p>
                        <button onclick="refreshMatches()" class="mt-4 bg-blue-600 px-4 py-2 rounded-lg">Refresh</button>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = filtered.map(match => createMatchCard(match, type)).join('');
        }

        function createMatchCard(match, type) {
            const participants = match.participants || [];
            const homeTeam = participants.find(p => p.meta?.location === 'home') || participants[0];
            const awayTeam = participants.find(p => p.meta?.location === 'away') || participants[1];
            const scores = match.scores || {};
            const homeScore = scores.home_score || scores.score?.home || 0;
            const awayScore = scores.away_score || scores.score?.away || 0;
            
            let timeDisplay = '';
            let statusBadge = '';
            
            if (type === 'live') {
                const minute = match.minute || Math.floor(Math.random() * 90);
                statusBadge = `<span class="live-badge bg-red-600 text-xs px-2 py-1 rounded-full">LIVE ${minute}'</span>`;
                timeDisplay = `
                    <div class="text-3xl font-bold">
                        ${homeScore} - ${awayScore}
                    </div>
                `;
            } else if (type === 'upcoming') {
                const matchTime = new Date(match.starting_at);
                timeDisplay = `
                    <div class="text-sm text-gray-400">
                        📅 ${matchTime.toLocaleDateString()} ${matchTime.toLocaleTimeString()}
                    </div>
                `;
                statusBadge = `<span class="bg-yellow-600 text-xs px-2 py-1 rounded-full">Scheduled</span>`;
            } else {
                timeDisplay = `
                    <div class="text-2xl font-bold">
                        ${homeScore} - ${awayScore}
                    </div>
                `;
                statusBadge = `<span class="bg-gray-600 text-xs px-2 py-1 rounded-full">FT</span>`;
            }
            
            // Generate odds based on match importance and type
            const odds = {
                home: type === 'upcoming' ? (Math.random() * 2 + 1.5).toFixed(2) : (Math.random() * 1 + 1.2).toFixed(2),
                draw: type === 'upcoming' ? (Math.random() * 2 + 2).toFixed(2) : (Math.random() * 1 + 2.5).toFixed(2),
                away: type === 'upcoming' ? (Math.random() * 2 + 1.5).toFixed(2) : (Math.random() * 1 + 1.2).toFixed(2)
            };
            
            return `
                <div class="match-card bg-gray-800 rounded-lg p-4 hover:shadow-xl transition">
                    <div class="flex justify-between items-start mb-3">
                        <div class="flex items-center gap-2">
                            <span class="text-sm text-gray-400">${match.league?.name || 'Unknown League'}</span>
                            ${statusBadge}
                        </div>
                        ${timeDisplay}
                    </div>
                    
                    <div class="flex justify-between items-center mb-4">
                        <div class="flex-1 text-center">
                            <div class="text-lg font-semibold mb-2">${homeTeam?.name || 'Home'}</div>
                            ${type !== 'upcoming' ? `<div class="text-3xl font-bold text-blue-400">${homeScore}</div>` : ''}
                        </div>
                        <div class="text-2xl font-bold text-gray-500 px-4">VS</div>
                        <div class="flex-1 text-center">
                            <div class="text-lg font-semibold mb-2">${awayTeam?.name || 'Away'}</div>
                            ${type !== 'upcoming' ? `<div class="text-3xl font-bold text-blue-400">${awayScore}</div>` : ''}
                        </div>
                    </div>
                    
                    ${type !== 'finished' ? `
                        <div class="grid grid-cols-3 gap-2 mt-4">
                            <button onclick='addToBetSlip(${JSON.stringify({
                                id: match.id,
                                homeTeam: homeTeam?.name,
                                awayTeam: awayTeam?.name,
                                type: '1',
                                odds: odds.home,
                                matchName: `${homeTeam?.name} vs ${awayTeam?.name}`
                            })})' class="odds-button bg-gray-700 hover:bg-green-600 p-2 rounded-lg transition">
                                <div class="text-xs text-gray-400">1</div>
                                <div class="font-bold">${odds.home}</div>
                            </button>
                            <button onclick='addToBetSlip(${JSON.stringify({
                                id: match.id,
                                homeTeam: homeTeam?.name,
                                awayTeam: awayTeam?.name,
                                type: 'X',
                                odds: odds.draw,
                                matchName: `${homeTeam?.name} vs ${awayTeam?.name}`
                            })})' class="odds-button bg-gray-700 hover:bg-green-600 p-2 rounded-lg transition">
                                <div class="text-xs text-gray-400">X</div>
                                <div class="font-bold">${odds.draw}</div>
                            </button>
                            <button onclick='addToBetSlip(${JSON.stringify({
                                id: match.id,
                                homeTeam: homeTeam?.name,
                                awayTeam: awayTeam?.name,
                                type: '2',
                                odds: odds.away,
                                matchName: `${homeTeam?.name} vs ${awayTeam?.name}`
                            })})' class="odds-button bg-gray-700 hover:bg-green-600 p-2 rounded-lg transition">
                                <div class="text-xs text-gray-400">2</div>
                                <div class="font-bold">${odds.away}</div>
                            </button>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        // ========== BETTING FUNCTIONS ==========
        function addToBetSlip(bet) {
            if (betSlip.length >= 10) {
                showNotification('Maximum 10 bets allowed!', 'error');
                return;
            }
            
            if (betSlip.some(b => b.id === bet.id && b.type === bet.type)) {
                showNotification('This bet is already in your slip!', 'warning');
                return;
            }
            
            betSlip.push({ ...bet, stake: 0 });
            updateBetSlip();
            showNotification(`${bet.matchName} - ${bet.type === '1' ? 'Home' : bet.type === 'X' ? 'Draw' : 'Away'} added!`, 'success');
        }
        
        function removeFromBetSlip(index) {
            betSlip.splice(index, 1);
            updateBetSlip();
        }
        
        function updateBetSlip() {
            const container = document.getElementById('betSlipContent');
            const totalBets = betSlip.length;
            
            if (totalBets === 0) {
                container.innerHTML = `
                    <div class="text-center text-gray-400 py-8">
                        No bets selected<br>
                        <span class="text-sm">Click on odds to add bets</span>
                    </div>
                `;
                document.getElementById('totalBets').textContent = '0';
                document.getElementById('potentialPayout').textContent = '$0.00';
                return;
            }
            
            let totalOdds = 1;
            container.innerHTML = betSlip.map((bet, index) => {
                totalOdds *= parseFloat(bet.odds);
                return `
                    <div class="bg-gray-700 rounded-lg p-3 text-sm">
                        <div class="flex justify-between items-start mb-2">
                            <div class="flex-1">
                                <div class="font-semibold">${bet.matchName}</div>
                                <div class="text-xs text-gray-400">
                                    ${bet.type === '1' ? 'Home Win' : bet.type === 'X' ? 'Draw' : 'Away Win'} @ ${bet.odds}
                                </div>
                            </div>
                            <button onclick="removeFromBetSlip(${index})" class="text-red-400 hover:text-red-300">✕</button>
                        </div>
                        <input type="number" placeholder="Stake" class="w-full bg-gray-600 text-white px-2 py-1 rounded text-sm" 
                               onchange="updateStake(${index}, this.value)">
                    </div>
                `;
            }).join('');
            
            document.getElementById('totalBets').textContent = totalBets;
            
            const stake = parseFloat(document.getElementById('betAmount').value) || 0;
            const payout = stake * totalOdds;
            document.getElementById('potentialPayout').textContent = `$${payout.toFixed(2)}`;
        }
        
        function updateStake(index, value) {
            betSlip[index].stake = parseFloat(value) || 0;
            updateTotalPayout();
        }
        
        function updateTotalPayout() {
            let totalOdds = 1;
            let totalStake = 0;
            
            betSlip.forEach(bet => {
                totalOdds *= parseFloat(bet.odds);
                totalStake += bet.stake;
            });
            
            const payout = totalStake * totalOdds;
            document.getElementById('potentialPayout').textContent = `$${payout.toFixed(2)}`;
        }
        
        function placeBet() {
            if (betSlip.length === 0) {
                showNotification('No bets in your slip!', 'error');
                return;
            }
            
            let totalStake = 0;
            let totalOdds = 1;
            
            betSlip.forEach(bet => {
                if (!bet.stake || bet.stake <= 0) {
                    showNotification('Please enter stake for all bets!', 'error');
                    return;
                }
                totalStake += bet.stake;
                totalOdds *= parseFloat(bet.odds);
            });
            
            if (totalStake > userBalance) {
                showNotification('Insufficient balance!', 'error');
                return;
            }
            
            // Process bet
            userBalance -= totalStake;
            const potentialWin = totalStake * totalOdds;
            
            bettingHistory.push({
                bets: [...betSlip],
                totalStake,
                potentialWin,
                date: new Date(),
                status: 'pending'
            });
            
            updateBalance();
            updateStats();
            
            // Simulate random win/loss (for demo)
            setTimeout(() => {
                const won = Math.random() > 0.5;
                if (won) {
                    userBalance += potentialWin;
                    updateBalance();
                    showNotification(`🎉 You won $${potentialWin.toFixed(2)}!`, 'success');
                } else {
                    showNotification(`😢 You lost $${totalStake.toFixed(2)}. Better luck next time!`, 'error');
                }
                updateStats();
            }, 2000);
            
            betSlip = [];
            updateBetSlip();
            document.getElementById('betAmount').value = '';
        }
        
        // ========== UTILITY FUNCTIONS ==========
        function updateBalance() {
            document.getElementById('balance').textContent = `$${userBalance.toFixed(2)}`;
        }
        
        function resetBalance() {
            userBalance = 1000;
            updateBalance();
            showNotification('Balance reset to $1,000!', 'success');
        }
        
        function updateStats() {
            const won = bettingHistory.filter(b => b.status === 'won').length;
            const lost = bettingHistory.filter(b => b.status === 'lost').length;
            const total = won + lost;
            const winRate = total > 0 ? (won / total * 100).toFixed(1) : 0;
            
            document.getElementById('betsPlaced').textContent = bettingHistory.length;
            document.getElementById('winLoss').textContent = `${won}/${lost}`;
            document.getElementById('winRate').textContent = `${winRate}%`;
        }
        
        function setActiveTab(tab) {
            const tabs = ['live', 'upcoming', 'finished'];
            tabs.forEach(t => {
                const btn = document.getElementById(`tab${t.charAt(0).toUpperCase() + t.slice(1)}`);
                if (btn) {
                    if (t === tab) {
                        btn.classList.add('bg-red-600');
                        btn.classList.remove('hover:bg-gray-700');
                    } else {
                        btn.classList.remove('bg-red-600');
                        btn.classList.add('hover:bg-gray-700');
                    }
                }
            });
        }
        
        function showLoading() {
            document.getElementById('matchesContainer').innerHTML = `
                <div class="text-center py-12 bg-gray-800 rounded-lg">
                    <div class="animate-spin text-4xl mb-4">⚽</div>
                    <p class="text-gray-400">Loading matches...</p>
                </div>
            `;
        }
        
        function showNotification(message, type) {
            const notification = document.createElement('div');
            notification.className = `fixed top-20 right-4 z-50 px-6 py-3 rounded-lg shadow-lg animate-bounce ${
                type === 'success' ? 'bg-green-600' : type === 'error' ? 'bg-red-600' : 'bg-yellow-600'
            } text-white`;
            notification.textContent = message;
            document.body.appendChild(notification);
            setTimeout(() => notification.remove(), 3000);
        }
        
        function showError(message) {
            showNotification(message, 'error');
        }
        
        function refreshMatches() {
            const activeTab = document.querySelector('[class*="bg-red-600"]')?.id || 'tabLive';
            if (activeTab === 'tabLive') loadLiveMatches();
            else if (activeTab === 'tabUpcoming') loadUpcomingMatches();
            else loadFinishedMatches();
        }
        
        function autoRefresh() {
            console.log('Auto-refreshing matches...');
            refreshMatches();
        }
        
        // Search listener
        document.getElementById('searchInput').addEventListener('input', () => {
            displayMatches(currentMatches, 'live');
        });
        
        document.getElementById('leagueFilter').addEventListener('change', () => {
            displayMatches(currentMatches, 'live');
        });
        
        document.getElementById('betAmount').addEventListener('input', updateTotalPayout);
        
        // Start app
        init();
    </script>
</body>
</html>
