name: Verify API Secret

on:
  workflow_dispatch:

jobs:
  check-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Check if secret exists
        env:
          API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
        run: |
          if [ -n "$API_TOKEN" ]; then
            echo "✅ SPORTMONKS_API_TOKEN secret is set!"
            echo "Token length: ${#API_TOKEN} characters"
            echo "Token prefix: ${API_TOKEN:0:10}..."
          else
            echo "❌ SPORTMONKS_API_TOKEN secret is NOT set!"
            exit 1
          fi
      
      - name: Test actual API call
        env:
          API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
        run: |
          echo "Making test API call..."
          curl -I -s "https://api.sportmonks.com/v3/football/livescores?api_token=$API_TOKEN&per_page=1" | head -n 1
