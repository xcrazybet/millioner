<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSONP Betting Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">
    <div class="max-w-6xl mx-auto">
        <h1 class="text-3xl font-bold text-center mb-8 text-blue-600">🏆 JSONP Betting Platform</h1>
        
        <!-- Status Display -->
        <div id="status" class="bg-white p-4 rounded-lg shadow mb-6">
            <h2 class="text-xl font-semibold mb-2">API Status</h2>
            <div id="statusContent" class="text-gray-600">Initializing...</div>
        </div>
        
        <!-- Match Display -->
        <div id="matches" class="bg-white p-4 rounded-lg shadow">
            <h2 class="text-xl font-semibold mb-4">Matches</h2>
            <div id="matchesContent" class="space-y-4">
                <div class="text-center py-8 text-gray-500">Ready to load matches...</div>
            </div>
        </div>
        
        <!-- Controls -->
        <div class="mt-6 bg-white p-4 rounded-lg shadow">
            <button onclick="testAPI()" class="bg-purple-500 text-white px-4 py-2 rounded mr-2 hover:bg-purple-600">
                🧪 Test API
            </button>
            <button onclick="loadLiveMatches()" class="bg-red-500 text-white px-4 py-2 rounded mr-2 hover:bg-red-600">
                🔥 Live Matches
            </button>
            <button onclick="loadUpcomingMatches()" class="bg-blue-500 text-white px-4 py-2 rounded mr-2 hover:bg-blue-600">
                📅 Upcoming
            </button>
            <button onclick="loadFinishedMatches()" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">
                🏁 Finished
            </button>
        </div>
        
        <!-- Alternative Methods -->
        <div class="mt-6 bg-yellow-50 p-4 rounded-lg border border-yellow-200">
            <h3 class="font-semibold text-yellow-800 mb-2">🔄 Alternative Methods</h3>
            <div class="space-y-2">
                <button onclick="tryServerMethod()" class="bg-indigo-500 text-white px-3 py-1 rounded text-sm hover:bg-indigo-600">
                    🖥️ Try Local Server Method
                </button>
                <button onclick="trySampleData()" class="bg-orange-500 text-white px-3 py-1 rounded text-sm hover:bg-orange-600">
                    📊 Try Sample Data (Demo)
                </button>
            </div>
        </div>
    </div>

    <script>
        const API_TOKEN = 'DkFdWG9jFZvH8XSEgLrRfGwczABWVg5rlV25GvIRyN06zdPsOI48Nsv9Wooy';
        
        // Update status
        function updateStatus(message, type = 'info') {
            const statusContent = document.getElementById('statusContent');
            const colors = {
                'success': 'text-green-600',
                'error': 'text-red-600',
                'warning': 'text-yellow-600',
                'info': 'text-blue-600'
            };
            
            statusContent.className = colors[type] || 'text-gray-600';
            statusContent.innerHTML = message;
        }
        
        // Display matches
        function displayMatches(matches, title) {
            const matchesContent = document.getElementById('matchesContent');
            
            if (!matches || matches.length === 0) {
                matchesContent.innerHTML = `
                    <div class="text-center py-8 text-gray-500">
                        <div class="text-2xl mb-2">📋</div>
                        <div>No ${title} matches found</div>
                        <div class="text-sm mt-2">Try sample data or local server</div>
                    </div>
                `;
                return;
            }
            
            let html = `<div class="text-lg font-semibold mb-4">${matches.length} ${title} matches found</div>`;
            
            matches.slice(0, 10).forEach(match => {
                const participants = match.participants || [];
                const homeTeam = participants.find(p => p.meta?.location === 'home') || participants[0];
                const awayTeam = participants.find(p => p.meta?.location === 'away') || participants[1];
                const scores = match.scores || {};
                const homeScore = scores.home_score || 0;
                const awayScore = scores.away_score || 0;
                const time = match.starting_at ? new Date(match.starting_at).toLocaleString() : 'Time TBD';
                
                html += `
                    <div class="border rounded-lg p-4 hover:bg-gray-50">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-sm text-gray-600">${match.league?.name || 'League'}</span>
                            <span class="text-sm text-gray-500">${time}</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <div class="flex-1 text-center">
                                <div class="font-semibold">${homeTeam?.name || 'Home Team'}</div>
                                <div class="text-xl font-bold text-blue-600">${homeScore}</div>
                            </div>
                            <div class="px-4 text-gray-400">VS</div>
                            <div class="flex-1 text-center">
                                <div class="font-semibold">${awayTeam?.name || 'Away Team'}</div>
                                <div class="text-xl font-bold text-blue-600">${awayScore}</div>
                            </div>
                        </div>
                        <div class="mt-2 text-center">
                            <span class="text-xs bg-gray-200 px-2 py-1 rounded">State: ${match.state_id || 'N/A'}</span>
                        </div>
                    </div>
                `;
            });
            
            matchesContent.innerHTML = html;
        }
        
        // Method 1: Try direct fetch with different headers
        async function tryDirectFetch() {
            try {
                updateStatus('Trying direct fetch with CORS headers...', 'info');
                
                const response = await fetch('https://api.sportmonks.com/v3/football/livescores?api_token=' + API_TOKEN + '&include=state;participants;league;scores&per_page=5', {
                    method: 'GET',
                    mode: 'cors',
                    headers: {
                        'Access-Control-Allow-Origin': '*',
                        'Content-Type': 'application/json'
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    updateStatus('✅ Direct fetch worked!', 'success');
                    return data;
                }
            } catch (error) {
                updateStatus('❌ Direct fetch failed: ' + error.message, 'error');
            }
            return null;
        }
        
        // Method 2: Try using a public CORS proxy that might work
        async function tryPublicProxy() {
            try {
                updateStatus('Trying public CORS proxy...', 'info');
                
                const proxyUrl = 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent('https://api.sportmonks.com/v3/football/livescores?api_token=' + API_TOKEN + '&include=state;participants;league;scores&per_page=5');
                
                const response = await fetch(proxyUrl);
                if (response.ok) {
                    const data = await response.json();
                    updateStatus('✅ Public proxy worked!', 'success');
                    return data;
                }
            } catch (error) {
                updateStatus('❌ Public proxy failed: ' + error.message, 'error');
            }
            return null;
        }
        
        // Method 3: Test API
        async function testAPI() {
            updateStatus('Testing all methods...', 'info');
            
            // Try direct fetch first
            let data = await tryDirectFetch();
            if (data) {
                displayMatches(data.data, 'Test');
                return;
            }
            
            // Try public proxy
            data = await tryPublicProxy();
            if (data) {
                displayMatches(data.data, 'Test');
                return;
            }
            
            updateStatus('❌ All API methods failed. Try local server or sample data.', 'error');
        }
        
        // Load live matches
        async function loadLiveMatches() {
            updateStatus('Loading live matches...', 'info');
            
            let data = await tryDirectFetch();
            if (data && data.data) {
                const liveMatches = data.data.filter(match => [2, 3, 4, 5, 6].includes(match.state_id));
                displayMatches(liveMatches, 'Live');
                return;
            }
            
            data = await tryPublicProxy();
            if (data && data.data) {
                const liveMatches = data.data.filter(match => [2, 3, 4, 5, 6].includes(match.state_id));
                displayMatches(liveMatches, 'Live');
                return;
            }
            
            displayMatches([], 'Live');
        }
        
        // Load upcoming matches
        async function loadUpcomingMatches() {
            updateStatus('Loading upcoming matches...', 'info');
            
            const today = new Date().toISOString().split('T')[0];
            const url = 'https://api.sportmonks.com/v3/football/fixtures/date/' + today + '?api_token=' + API_TOKEN + '&include=participants;state;league;scores&per_page=10';
            
            let data = await tryDirectFetch();
            if (data && data.data) {
                const upcoming = data.data.filter(match => [1, 45, 46].includes(match.state_id));
                displayMatches(upcoming, 'Upcoming');
                return;
            }
            
            displayMatches([], 'Upcoming');
        }
        
        // Load finished matches
        async function loadFinishedMatches() {
            updateStatus('Loading finished matches...', 'info');
            
            let data = await tryDirectFetch();
            if (data && data.data) {
                const finished = data.data.filter(match => [100, 90, 5].includes(match.state_id))
                    .sort((a, b) => new Date(b.starting_at) - new Date(a.starting_at))
                    .slice(0, 15);
                displayMatches(finished, 'Finished');
                return;
            }
            
            displayMatches([], 'Finished');
        }
        
        // Try server method
        function tryServerMethod() {
            updateStatus('📋 Instructions for Local Server:', 'info');
            document.getElementById('matchesContent').innerHTML = `
                <div class="bg-blue-50 p-6 rounded-lg">
                    <h3 class="font-bold text-blue-800 mb-4">🖥️ Local Server Instructions</h3>
                    <div class="space-y-3 text-blue-700">
                        <p><strong>Step 1:</strong> Open PowerShell/CMD as Administrator</p>
                        <p><strong>Step 2:</strong> Run: <code class="bg-blue-100 px-2 py-1 rounded">Set-ExecutionPolicy RemoteSigned</code></p>
                        <p><strong>Step 3:</strong> Navigate to your project folder</p>
                        <p><strong>Step 4:</strong> Run: <code class="bg-blue-100 px-2 py-1 rounded">npm install</code></p>
                        <p><strong>Step 5:</strong> Run: <code class="bg-blue-100 px-2 py-1 rounded">node server.js</code></p>
                        <p><strong>Step 6:</strong> Open: <code class="bg-blue-100 px-2 py-1 rounded">http://localhost:3000</code></p>
                    </div>
                    <div class="mt-4 p-3 bg-yellow-100 rounded">
                        <p class="text-yellow-800 text-sm">💡 The local server method (betting-server.html) is guaranteed to work as it bypasses all browser restrictions.</p>
                    </div>
                </div>
            `;
        }
        
        // Try sample data
        function trySampleData() {
            updateStatus('📊 Loading sample data for demo...', 'success');
            
            const sampleMatches = [
                {
                    id: 1,
                    state_id: 2,
                    starting_at: new Date().toISOString(),
                    league: { name: 'Premier League' },
                    participants: [
                        { name: 'Manchester United', meta: { location: 'home' } },
                        { name: 'Liverpool', meta: { location: 'away' } }
                    ],
                    scores: { home_score: 2, away_score: 1 }
                },
                {
                    id: 2,
                    state_id: 2,
                    starting_at: new Date().toISOString(),
                    league: { name: 'La Liga' },
                    participants: [
                        { name: 'Real Madrid', meta: { location: 'home' } },
                        { name: 'Barcelona', meta: { location: 'away' } }
                    ],
                    scores: { home_score: 1, away_score: 1 }
                },
                {
                    id: 3,
                    state_id: 1,
                    starting_at: new Date(Date.now() + 2 * 60 * 60 * 1000).toISOString(),
                    league: { name: 'Serie A' },
                    participants: [
                        { name: 'Juventus', meta: { location: 'home' } },
                        { name: 'AC Milan', meta: { location: 'away' } }
                    ],
                    scores: { home_score: 0, away_score: 0 }
                }
            ];
            
            displayMatches(sampleMatches, 'Sample');
            updateStatus('✅ Sample data loaded! This shows the platform works.', 'success');
        }
        
        // Initialize
        window.onload = function() {
            console.log('🚀 JSONP Betting Platform Loaded');
            updateStatus('Ready! Try API test, sample data, or local server.');
        };
    </script>
</body>
</html>
