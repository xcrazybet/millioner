<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🏁 XLODON RACING - 3D Arcade Racer</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    
    <!-- Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
            }
        }
    </script>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Orbitron', monospace;
            overflow: hidden;
            background: #000;
        }

        /* Canvas Container */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* UI Overlay */
        .ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* Header */
        .game-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: linear-gradient(135deg, rgba(0,0,0,0.95), rgba(10,10,20,0.95));
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #ff3366;
            z-index: 100;
            pointer-events: auto;
            box-shadow: 0 0 20px rgba(255,51,102,0.3);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .home-btn {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #ff3366, #ff6b35);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: white;
            font-size: 20px;
            transition: all 0.3s;
            box-shadow: 0 0 10px rgba(255,51,102,0.5);
        }

        .home-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(255,51,102,0.8);
        }

        .logo {
            font-size: 24px;
            font-weight: 900;
            background: linear-gradient(135deg, #ff3366, #ff6b35, #ffcc00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
        }

        .logo i {
            background: none;
            -webkit-text-fill-color: #ff3366;
            margin-right: 8px;
        }

        .balance-card {
            background: rgba(0,0,0,0.8);
            padding: 10px 25px;
            border-radius: 40px;
            border: 2px solid #ff3366;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 20px;
            color: #ff3366;
            box-shadow: 0 0 15px rgba(255,51,102,0.3);
        }

        /* Speedometer */
        .speedometer-card {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 130px;
            height: 130px;
            background: radial-gradient(circle at 30% 30%, rgba(0,0,0,0.9), #000);
            border-radius: 50%;
            border: 3px solid #ff3366;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            pointer-events: auto;
            box-shadow: 0 0 30px rgba(255,51,102,0.5);
            backdrop-filter: blur(5px);
        }

        .speed-number {
            font-size: 42px;
            font-weight: 900;
            color: #ff3366;
            font-family: 'Orbitron', monospace;
            text-shadow: 0 0 10px #ff3366;
        }

        .speed-unit {
            font-size: 12px;
            color: #888;
            letter-spacing: 2px;
        }

        /* Betting Panel */
        .betting-panel {
            position: fixed;
            bottom: 30px;
            left: 30px;
            background: linear-gradient(135deg, rgba(0,0,0,0.95), rgba(20,20,40,0.95));
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 20px;
            border: 2px solid #ff3366;
            width: 320px;
            z-index: 100;
            pointer-events: auto;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }

        @media (max-width: 768px) {
            .betting-panel {
                left: 15px;
                right: 15px;
                width: auto;
                bottom: 15px;
                padding: 15px;
            }
            .speedometer-card {
                bottom: 15px;
                right: 15px;
                width: 100px;
                height: 100px;
            }
            .speed-number {
                font-size: 32px;
            }
        }

        .panel-title {
            color: #ff3366;
            font-size: 14px;
            letter-spacing: 2px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid rgba(255,51,102,0.3);
            padding-bottom: 10px;
        }

        .bet-input-wrapper {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .bet-input {
            flex: 1;
            padding: 12px;
            background: rgba(0,0,0,0.6);
            border: 2px solid #ff3366;
            border-radius: 10px;
            color: white;
            font-size: 18px;
            font-weight: 700;
            text-align: center;
            font-family: 'Orbitron', monospace;
        }

        .bet-input:focus {
            outline: none;
            box-shadow: 0 0 10px #ff3366;
        }

        .quick-bets {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .quick-bet-btn {
            padding: 10px;
            background: rgba(255,51,102,0.2);
            border: 1px solid #ff3366;
            border-radius: 8px;
            color: #ff3366;
            text-align: center;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.2s;
            font-size: 14px;
        }

        .quick-bet-btn:hover {
            background: #ff3366;
            color: white;
            transform: translateY(-2px);
        }

        .race-button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #ff3366, #ff6b35);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 18px;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-family: 'Orbitron', monospace;
            letter-spacing: 2px;
        }

        .race-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .race-button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(255,51,102,0.5);
        }

        /* Stats Panel */
        .stats-panel {
            position: fixed;
            top: 100px;
            right: 20px;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 15px;
            border: 1px solid #ff6b35;
            min-width: 160px;
            z-index: 100;
            pointer-events: auto;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .stat-label {
            color: #888;
        }

        .stat-value {
            color: #ff3366;
            font-weight: 700;
        }

        /* Bonus Tracker */
        .bonus-tracker {
            position: fixed;
            top: 100px;
            left: 20px;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 12px 20px;
            border: 1px solid #ffcc00;
            z-index: 100;
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .bonus-icon {
            font-size: 24px;
            color: #ffcc00;
        }

        .bonus-text {
            font-size: 12px;
            color: #ffcc00;
            font-weight: 700;
        }

        /* Result Overlay */
        .result-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s;
            pointer-events: auto;
        }

        .result-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .result-card {
            background: linear-gradient(135deg, #1a1a2e, #0a0a1a);
            padding: 40px;
            border-radius: 30px;
            border: 3px solid #ff3366;
            text-align: center;
            max-width: 400px;
            width: 90%;
            animation: slideUp 0.5s ease;
            box-shadow: 0 0 50px rgba(255,51,102,0.3);
        }

        .result-title {
            font-size: 36px;
            font-weight: 900;
            margin-bottom: 20px;
        }

        .result-title.win {
            color: #00ff9d;
            text-shadow: 0 0 20px #00ff9d;
        }

        .result-title.lose {
            color: #ff3366;
            text-shadow: 0 0 20px #ff3366;
        }

        .result-amount {
            font-size: 48px;
            font-weight: 900;
            margin: 20px 0;
        }

        .result-amount.win {
            color: #00ff9d;
        }

        .result-amount.lose {
            color: #ff3366;
        }

        .result-position {
            font-size: 18px;
            color: #ffcc00;
            margin: 15px 0;
        }

        .play-again {
            margin-top: 25px;
            padding: 12px 30px;
            background: linear-gradient(135deg, #ff3366, #ff6b35);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Orbitron', monospace;
        }

        /* Toast */
        .toast-container {
            position: fixed;
            bottom: 200px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            pointer-events: none;
        }

        .toast {
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(10px);
            padding: 12px 24px;
            border-radius: 10px;
            border-left: 4px solid #ff3366;
            margin: 5px 0;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes slideIn {
            from {
                transform: translateX(-100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div class="ui-overlay">
        <div class="game-header">
            <div class="logo-area">
                <a href="#" class="home-btn" onclick="window.location.href='https://xcrazybet.github.io/millioner'">
                    <i class="fas fa-home"></i>
                </a>
                <div class="logo">
                    <i class="fas fa-flag-checkered"></i> XLODON RACING
                </div>
            </div>
            <div class="balance-card">
                <i class="fas fa-coins"></i>
                <span id="balance-display">$0.00</span>
            </div>
        </div>

        <div class="speedometer-card">
            <div class="speed-number" id="speed-value">0</div>
            <div class="speed-unit">KM/H</div>
        </div>

        <div class="bonus-tracker">
            <div class="bonus-icon">
                <i class="fas fa-gift"></i>
            </div>
            <div class="bonus-text" id="bonus-text">
                Races: 0/25
            </div>
        </div>

        <div class="stats-panel">
            <div class="stat-row">
                <span class="stat-label"><i class="fas fa-trophy"></i> WINS</span>
                <span class="stat-value" id="wins-count">0</span>
            </div>
            <div class="stat-row">
                <span class="stat-label"><i class="fas fa-skull"></i> LOSSES</span>
                <span class="stat-value" id="losses-count">0</span>
            </div>
            <div class="stat-row">
                <span class="stat-label"><i class="fas fa-chart-line"></i> WIN RATE</span>
                <span class="stat-value" id="winrate">0%</span>
            </div>
        </div>

        <div class="betting-panel">
            <div class="panel-title">
                <i class="fas fa-ticket-alt"></i> PLACE YOUR BET
            </div>
            <div class="bet-input-wrapper">
                <input type="number" id="bet-amount" class="bet-input" value="10" min="1" max="1000" step="1">
                <span style="color: #ff3366; font-size: 24px;">$</span>
            </div>
            <div class="quick-bets">
                <div class="quick-bet-btn" data-amount="5">$5</div>
                <div class="quick-bet-btn" data-amount="10">$10</div>
                <div class="quick-bet-btn" data-amount="25">$25</div>
                <div class="quick-bet-btn" data-amount="50">$50</div>
            </div>
            <button id="race-start" class="race-button">
                <i class="fas fa-flag-checkered"></i> START RACE
            </button>
        </div>
    </div>

    <div class="result-overlay" id="result-overlay">
        <div class="result-card">
            <div class="result-title" id="result-title">WINNER!</div>
            <div class="result-amount" id="result-amount">+$0.00</div>
            <div class="result-position" id="result-position"></div>
            <div id="result-bonus" style="color: #ffcc00; margin: 10px 0;"></div>
            <button class="play-again" id="play-again-btn">
                <i class="fas fa-redo-alt"></i> RACE AGAIN
            </button>
        </div>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.128.0/build/three.module.js';

        // ===== FIREBASE CONFIG =====
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ===== GAME STATE =====
        const gameState = {
            currentUser: null,
            balance: 0,
            betAmount: 10,
            isRacing: false,
            speed: 0,
            maxSpeed: 320,
            wins: 0,
            losses: 0,
            winProbability: 0.10, // 10% win rate
            bonusSystem: {
                racesPlayed: 0,
                racesForBonus: 25,
                bonusAmount: 5
            },
            currentRace: {
                win: false,
                payout: 0,
                position: 0,
                time: 0
            }
        };

        // ===== THREE.JS 3D SCENE =====
        let scene, camera, renderer, car, track;
        let roadMarkings = [];
        let environmentObjects = [];
        let animationFrameId;
        
        function init3DScene() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050510);
            scene.fog = new THREE.FogExp2(0x050510, 0.003);
            
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2.5, 6);
            camera.lookAt(0, 0, -15);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);
            
            // Lighting
            const ambientLight = new THREE.AmbientLight(0x333333);
            scene.add(ambientLight);
            
            const mainLight = new THREE.DirectionalLight(0xffffff, 1);
            mainLight.position.set(5, 10, 7);
            mainLight.castShadow = true;
            mainLight.receiveShadow = true;
            scene.add(mainLight);
            
            const fillLight = new THREE.PointLight(0xff3366, 0.5);
            fillLight.position.set(0, 3, 2);
            scene.add(fillLight);
            
            const backLight = new THREE.PointLight(0x3366ff, 0.3);
            backLight.position.set(0, 2, -5);
            scene.add(backLight);
            
            // Track
            const trackMat = new THREE.MeshStandardMaterial({ color: 0x1a1a2e, roughness: 0.3, metalness: 0.8 });
            const trackPlane = new THREE.Mesh(new THREE.PlaneGeometry(8, 200), trackMat);
            trackPlane.rotation.x = -Math.PI / 2;
            trackPlane.position.z = -50;
            trackPlane.receiveShadow = true;
            scene.add(trackPlane);
            
            // Road markings
            for (let z = -90; z <= 20; z += 3) {
                const markingMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 0.3 });
                const marking = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.1, 1.5), markingMat);
                marking.position.set(0, 0.05, z);
                marking.castShadow = true;
                scene.add(marking);
                roadMarkings.push(marking);
            }
            
            // Side lines
            const lineMat = new THREE.MeshStandardMaterial({ color: 0xff3366, emissive: 0xff3366, emissiveIntensity: 0.5 });
            for (let z = -90; z <= 20; z += 1.5) {
                const leftLine = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 0.8), lineMat);
                leftLine.position.set(-3.5, 0.05, z);
                scene.add(leftLine);
                
                const rightLine = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 0.8), lineMat);
                rightLine.position.set(3.5, 0.05, z);
                scene.add(rightLine);
            }
            
            // Car model
            const carGroup = new THREE.Group();
            
            // Body
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xff3366, metalness: 0.9, roughness: 0.2, emissive: 0x331100 });
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.35, 1.8), bodyMat);
            body.castShadow = true;
            body.receiveShadow = true;
            carGroup.add(body);
            
            // Roof
            const roofMat = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.8 });
            const roof = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.3, 1.0), roofMat);
            roof.position.y = 0.3;
            roof.castShadow = true;
            carGroup.add(roof);
            
            // Windows
            const windowMat = new THREE.MeshStandardMaterial({ color: 0x88aaff, metalness: 0.9, emissive: 0x224466 });
            const windshield = new THREE.Mesh(new THREE.BoxGeometry(0.65, 0.15, 0.5), windowMat);
            windshield.position.set(0, 0.45, -0.4);
            carGroup.add(windshield);
            
            // Wheels
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.5, roughness: 0.3 });
            const wheelPositions = [[-0.55, -0.15, -0.7], [0.55, -0.15, -0.7], [-0.55, -0.15, 0.7], [0.55, -0.15, 0.7]];
            wheelPositions.forEach(pos => {
                const wheelGeo = new THREE.CylinderGeometry(0.22, 0.22, 0.35, 24);
                const wheel = new THREE.Mesh(wheelGeo, wheelMat);
                wheel.rotation.z = Math.PI / 2;
                wheel.position.set(pos[0], pos[1], pos[2]);
                wheel.castShadow = true;
                carGroup.add(wheel);
            });
            
            // Neon underglow
            const neonMat = new THREE.MeshStandardMaterial({ color: 0xff3366, emissive: 0xff3366, emissiveIntensity: 0.8 });
            const underglow = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.05, 1.9), neonMat);
            underglow.position.y = -0.2;
            carGroup.add(underglow);
            
            // Spoiler
            const spoilerMat = new THREE.MeshStandardMaterial({ color: 0xcc3333 });
            const spoiler = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.1, 0.15), spoilerMat);
            spoiler.position.set(0, 0.25, 0.95);
            carGroup.add(spoiler);
            
            carGroup.position.y = 0.1;
            car = carGroup;
            scene.add(car);
            
            // Environment - Trees and lights
            const treeMat = new THREE.MeshStandardMaterial({ color: 0x2c5e2e });
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x8B5A2B });
            
            for (let z = -80; z <= 30; z += 7) {
                [-5.5, 5.5].forEach(side => {
                    const treeGroup = new THREE.Group();
                    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.45, 1.0, 6), trunkMat);
                    trunk.position.y = 0.5;
                    trunk.castShadow = true;
                    treeGroup.add(trunk);
                    
                    const foliage1 = new THREE.Mesh(new THREE.ConeGeometry(0.55, 0.9, 8), treeMat);
                    foliage1.position.y = 1.0;
                    foliage1.castShadow = true;
                    treeGroup.add(foliage1);
                    
                    const foliage2 = new THREE.Mesh(new THREE.ConeGeometry(0.45, 0.7, 8), treeMat);
                    foliage2.position.y = 1.5;
                    foliage2.castShadow = true;
                    treeGroup.add(foliage2);
                    
                    treeGroup.position.set(side, 0, z);
                    scene.add(treeGroup);
                    environmentObjects.push(treeGroup);
                });
            }
            
            // Street lights
            const poleMat = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.7 });
            const lightMat = new THREE.MeshStandardMaterial({ color: 0xffaa66, emissive: 0xffaa66, emissiveIntensity: 0.5 });
            
            for (let z = -70; z <= 20; z += 12) {
                [-4.2, 4.2].forEach(side => {
                    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.25, 3, 6), poleMat);
                    pole.position.set(side, 1.5, z);
                    pole.castShadow = true;
                    scene.add(pole);
                    
                    const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.3, 8, 8), lightMat);
                    lamp.position.set(side, 3, z);
                    lamp.castShadow = true;
                    scene.add(lamp);
                });
            }
            
            // Stars background
            const starGeometry = new THREE.BufferGeometry();
            const starCount = 1500;
            const starPositions = new Float32Array(starCount * 3);
            for (let i = 0; i < starCount; i++) {
                starPositions[i*3] = (Math.random() - 0.5) * 400;
                starPositions[i*3+1] = (Math.random() - 0.5) * 150 + 20;
                starPositions[i*3+2] = (Math.random() - 0.5) * 150 - 80;
            }
            starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
            const stars = new THREE.Points(starGeometry, new THREE.PointsMaterial({ color: 0xffffff, size: 0.2 }));
            scene.add(stars);
        }
        
        function animateRace(speed) {
            if (!gameState.isRacing) return;
            
            const speedFactor = Math.min(speed / gameState.maxSpeed, 1);
            const moveSpeed = 0.4 + speedFactor * 0.8;
            
            // Move road markings
            roadMarkings.forEach(marking => {
                marking.position.z += moveSpeed;
                if (marking.position.z > 20) {
                    marking.position.z = -90;
                }
            });
            
            // Move environment objects
            environmentObjects.forEach(obj => {
                obj.position.z += moveSpeed;
                if (obj.position.z > 30) {
                    obj.position.z = -80;
                }
            });
            
            // Car animations
            car.rotation.z = Math.sin(Date.now() * 0.015) * 0.03 * speedFactor;
            car.position.x = Math.sin(Date.now() * 0.02) * 0.15 * speedFactor;
            
            // Camera effects
            if (speed > 200) {
                camera.position.x = Math.sin(Date.now() * 0.08) * 0.08;
                camera.position.y = 2.5 + Math.sin(Date.now() * 0.15) * 0.05;
            } else {
                camera.position.x = 0;
                camera.position.y = 2.5;
            }
            
            // Update speedometer
            document.getElementById('speed-value').textContent = Math.floor(speed);
            
            renderer.render(scene, camera);
            animationFrameId = requestAnimationFrame(() => animateRace(gameState.speed));
        }
        
        function stopRaceAnimation() {
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
            }
        }
        
        // ===== RACE SIMULATION =====
        async function startRace() {
            const betAmount = parseFloat(document.getElementById('bet-amount').value);
            
            if (isNaN(betAmount) || betAmount < 1) {
                showToast('Invalid bet amount!', 'error');
                return;
            }
            
            if (betAmount > gameState.balance) {
                showToast('Insufficient balance!', 'error');
                return;
            }
            
            if (gameState.isRacing) {
                showToast('Race in progress!', 'warning');
                return;
            }
            
            // Deduct bet
            const result = await processTransaction(-betAmount, 'race_bet', `Race bet $${betAmount}`);
            if (!result.success) return;
            
            gameState.betAmount = betAmount;
            gameState.isRacing = true;
            
            const raceBtn = document.getElementById('race-start');
            raceBtn.disabled = true;
            raceBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> RACING...';
            
            // Animate speed
            let speed = 0;
            const raceDuration = 3500;
            const startTime = Date.now();
            
            const speedInterval = setInterval(() => {
                if (!gameState.isRacing) {
                    clearInterval(speedInterval);
                    return;
                }
                
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / raceDuration, 1);
                
                if (progress < 0.7) {
                    speed = gameState.maxSpeed * (progress / 0.7);
                } else {
                    speed = gameState.maxSpeed * (1 - (progress - 0.7) / 0.3);
                }
                
                gameState.speed = speed;
                
                if (progress >= 1) {
                    clearInterval(speedInterval);
                    determineRaceResult();
                }
            }, 50);
            
            // Start 3D animation
            init3DScene();
            animateRace(0);
            gameState.raceInterval = speedInterval;
        }
        
        function determineRaceResult() {
            // 90% LOSE RATE - ONLY 10% WIN
            const random = Math.random();
            const isWin = random <= gameState.winProbability;
            
            let payout = 0;
            let position = 0;
            
            if (isWin) {
                // Win - random multiplier between 0.8x and 2.5x
                const multiplier = 0.8 + Math.random() * 1.7;
                payout = gameState.betAmount * multiplier;
                position = Math.floor(Math.random() * 3) + 1;
                gameState.wins++;
                showToast(`🏆 VICTORY! +$${payout.toFixed(2)}`, 'success');
            } else {
                // Loss
                payout = 0;
                position = Math.floor(Math.random() * 7) + 4;
                gameState.losses++;
                showToast(`💀 ${position}th PLACE! Better luck next time!`, 'error');
            }
            
            gameState.currentRace = {
                win: isWin,
                payout: payout,
                position: position
            };
            
            // Process win
            if (isWin && payout > 0) {
                processTransaction(payout, 'race_win', `Race win $${payout.toFixed(2)}`);
            }
            
            // Update bonus
            updateBonusProgress();
            updateStatsDisplay();
            
            // End race
            setTimeout(() => {
                gameState.isRacing = false;
                stopRaceAnimation();
                
                const raceBtn = document.getElementById('race-start');
                raceBtn.disabled = false;
                raceBtn.innerHTML = '<i class="fas fa-flag-checkered"></i> START RACE';
                
                showResultOverlay();
            }, 500);
        }
        
        function showResultOverlay() {
            const race = gameState.currentRace;
            
            if (race.win) {
                document.getElementById('result-title').textContent = '🏆 VICTORY! 🏆';
                document.getElementById('result-title').className = 'result-title win';
                document.getElementById('result-amount').textContent = `+$${race.payout.toFixed(2)}`;
                document.getElementById('result-amount').className = 'result-amount win';
                document.getElementById('result-position').textContent = `Finished ${race.position}${getOrdinal(race.position)} Place!`;
            } else {
                document.getElementById('result-title').textContent = '💀 DEFEAT 💀';
                document.getElementById('result-title').className = 'result-title lose';
                document.getElementById('result-amount').textContent = `-$${gameState.betAmount.toFixed(2)}`;
                document.getElementById('result-amount').className = 'result-amount lose';
                document.getElementById('result-position').textContent = `Finished ${race.position}${getOrdinal(race.position)} Place`;
            }
            
            document.getElementById('result-overlay').classList.add('show');
        }
        
        function getOrdinal(n) {
            const s = ['th', 'st', 'nd', 'rd'];
            const v = n % 100;
            return s[(v - 20) % 10] || s[v] || s[0];
        }
        
        // ===== AUTH & BALANCE =====
        async function checkAuth() {
            auth.onAuthStateChanged(async (user) => {
                if (!user) {
                    showToast('Please login to play!', 'error');
                    setTimeout(() => {
                        window.location.href = 'https://xcrazybet.github.io/millioner/login.html';
                    }, 2000);
                    return;
                }
                gameState.currentUser = user;
                await loadBalance();
                await loadStats();
                await loadBonus();
                setupRealTimeListener();
            });
        }
        
        async function loadBalance() {
            try {
                const doc = await db.collection('wallets').doc(gameState.currentUser.uid).get();
                if (doc.exists) {
                    gameState.balance = doc.data().balance || 0;
                } else {
                    await db.collection('wallets').doc(gameState.currentUser.uid).set({ balance: 100 });
                    gameState.balance = 100;
                }
                updateBalanceDisplay();
            } catch (error) {
                console.error('Error loading balance:', error);
            }
        }
        
        async function loadStats() {
            try {
                const doc = await db.collection('race_stats').doc(gameState.currentUser.uid).get();
                if (doc.exists) {
                    gameState.wins = doc.data().wins || 0;
                    gameState.losses = doc.data().losses || 0;
                    updateStatsDisplay();
                }
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }
        
        async function loadBonus() {
            try {
                const doc = await db.collection('race_bonus').doc(gameState.currentUser.uid).get();
                if (doc.exists) {
                    gameState.bonusSystem = { ...gameState.bonusSystem, ...doc.data() };
                }
                updateBonusDisplay();
            } catch (error) {
                console.error('Error loading bonus:', error);
            }
        }
        
        async function updateBonusProgress() {
            gameState.bonusSystem.racesPlayed++;
            
            if (gameState.bonusSystem.racesPlayed >= gameState.bonusSystem.racesForBonus) {
                gameState.bonusSystem.racesPlayed = 0;
                await processTransaction(gameState.bonusSystem.bonusAmount, 'race_bonus', `Bonus $${gameState.bonusSystem.bonusAmount}`);
                showToast(`🎁 BONUS EARNED! +$${gameState.bonusSystem.bonusAmount}`, 'success');
                document.getElementById('result-bonus').innerHTML = `Bonus: +$${gameState.bonusSystem.bonusAmount}`;
            }
            
            updateBonusDisplay();
            await db.collection('race_bonus').doc(gameState.currentUser.uid).set(gameState.bonusSystem);
        }
        
        function updateBonusDisplay() {
            const left = gameState.bonusSystem.racesForBonus - gameState.bonusSystem.racesPlayed;
            document.getElementById('bonus-text').innerHTML = `<i class="fas fa-gift"></i> ${left} races to bonus!`;
        }
        
        async function updateStatsDisplay() {
            const total = gameState.wins + gameState.losses;
            const winRate = total > 0 ? ((gameState.wins / total) * 100).toFixed(1) : 0;
            
            document.getElementById('wins-count').textContent = gameState.wins;
            document.getElementById('losses-count').textContent = gameState.losses;
            document.getElementById('winrate').textContent = `${winRate}%`;
            
            if (gameState.currentUser) {
                await db.collection('race_stats').doc(gameState.currentUser.uid).set({
                    wins: gameState.wins,
                    losses: gameState.losses,
                    updatedAt: new Date()
                });
            }
        }
        
        async function processTransaction(amount, type, description) {
            try {
                const walletRef = db.collection('wallets').doc(gameState.currentUser.uid);
                
                return await db.runTransaction(async (transaction) => {
                    const doc = await transaction.get(walletRef);
                    if (!doc.exists) throw new Error('Wallet not found');
                    
                    const currentBalance = doc.data().balance || 0;
                    const newBalance = currentBalance + amount;
                    
                    if (newBalance < 0) throw new Error('Insufficient funds');
                    
                    transaction.update(walletRef, { balance: newBalance, updatedAt: new Date() });
                    gameState.balance = newBalance;
                    updateBalanceDisplay();
                    
                    return { success: true };
                });
            } catch (error) {
                showToast(error.message, 'error');
                return { success: false };
            }
        }
        
        function updateBalanceDisplay() {
            document.getElementById('balance-display').textContent = `$${gameState.balance.toFixed(2)}`;
        }
        
        function setupRealTimeListener() {
            const walletRef = db.collection('wallets').doc(gameState.currentUser?.uid);
            walletRef.onSnapshot((doc) => {
                if (doc.exists) {
                    gameState.balance = doc.data().balance || 0;
                    updateBalanceDisplay();
                }
            });
        }
        
        // ===== UI HELPERS =====
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-triangle'}"></i> ${message}`;
            container.appendChild(toast);
            
            setTimeout(() => toast.remove(), 3000);
        }
        
        function closeResult() {
            document.getElementById('result-overlay').classList.remove('show');
            document.getElementById('result-bonus').innerHTML = '';
        }
        
        // ===== EVENT LISTENERS =====
        document.getElementById('race-start').addEventListener('click', startRace);
        document.getElementById('play-again-btn').addEventListener('click', closeResult);
        
        document.querySelectorAll('.quick-bet-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const amount = parseFloat(btn.dataset.amount);
                document.getElementById('bet-amount').value = amount;
            });
        });
        
        document.getElementById('bet-amount').addEventListener('input', (e) => {
            let val = parseFloat(e.target.value);
            if (isNaN(val)) val = 1;
            val = Math.max(1, Math.min(val, 1000));
            e.target.value = val;
        });
        
        // Initialize
        checkAuth();
        
        // Start with basic scene
        init3DScene();
        animateRace(0);
    </script>
</body>
</html>
