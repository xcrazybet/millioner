<html lang="en">
<head>

    <script type="importmap">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Orbitron', monospace;
            overflow: hidden;
            background: linear-gradient(135deg, #0a0a2a, #1a0a2a);
        }

        #game-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* Header */
        .game-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: linear-gradient(135deg, rgba(0,0,0,0.95), rgba(255,51,102,0.3));
            backdrop-filter: blur(15px);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #ff3366;
            z-index: 100;
            pointer-events: auto;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .home-btn {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #ff3366, #ff6b35);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: white;
            font-size: 20px;
            transition: all 0.3s;
        }

        .balance-card {
            background: linear-gradient(135deg, rgba(0,0,0,0.8), rgba(255,51,102,0.3));
            padding: 8px 20px;
            border-radius: 40px;
            border: 2px solid #ff3366;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 20px;
            color: #ff3366;
        }

        /* Win Rate Indicator */
        .winrate-indicator {
            position: fixed;
            top: 80px;
            left: 20px;
            background: linear-gradient(135deg, rgba(0,0,0,0.85), rgba(255,51,102,0.2));
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 12px 20px;
            z-index: 100;
            pointer-events: auto;
            border-left: 4px solid #ff3366;
        }

        .winrate-title {
            font-size: 12px;
            color: #888;
            margin-bottom: 5px;
        }

        .winrate-value {
            font-size: 24px;
            font-weight: 900;
            color: #ff3366;
        }

        /* Distance Meter */
        .distance-meter {
            position: fixed;
            top: 80px;
            right: 20px;
            background: linear-gradient(135deg, rgba(0,0,0,0.85), rgba(255,51,102,0.2));
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 12px 20px;
            text-align: center;
            z-index: 100;
            pointer-events: auto;
            border-right: 4px solid #ffcc33;
        }

        .distance-label {
            font-size: 12px;
            color: #ffcc33;
        }

        .distance-value {
            font-size: 28px;
            font-weight: 900;
            color: #33ff66;
        }

        /* Speedometer */
        .speedometer {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 130px;
            height: 130px;
            background: radial-gradient(circle, rgba(0,0,0,0.9), rgba(255,51,102,0.3));
            border-radius: 50%;
            border: 3px solid #ff3366;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            pointer-events: auto;
        }

        .speed-number {
            font-size: 40px;
            font-weight: 900;
            background: linear-gradient(135deg, #ff3366, #ffcc33);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Boost Meter */
        .boost-meter {
            position: fixed;
            bottom: 30px;
            left: 30px;
            width: 220px;
            background: rgba(0,0,0,0.8);
            border-radius: 15px;
            padding: 12px;
            z-index: 100;
            pointer-events: auto;
        }

        .boost-label {
            font-size: 12px;
            color: #ffcc33;
            margin-bottom: 5px;
        }

        .boost-bar {
            height: 20px;
            background: linear-gradient(90deg, #ff3366, #ffcc33);
            border-radius: 10px;
            transition: width 0.1s;
            box-shadow: 0 0 10px #ff3366;
        }

        /* Controls Panel */
        .controls-panel {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            border-radius: 60px;
            padding: 12px 25px;
            display: flex;
            gap: 20px;
            z-index: 100;
            pointer-events: auto;
        }

        .control-btn {
            width: 65px;
            height: 65px;
            background: linear-gradient(135deg, #ff3366, #ff6b35);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            cursor: pointer;
            transition: all 0.05s linear;
            box-shadow: 0 0 15px rgba(255,51,102,0.5);
        }

        .control-btn:active {
            transform: scale(0.92);
        }

        /* Bet Panel */
        .bet-panel {
            position: fixed;
            bottom: 150px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, rgba(0,0,0,0.95), rgba(255,51,102,0.2));
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 15px 25px;
            display: flex;
            gap: 15px;
            align-items: center;
            z-index: 100;
            pointer-events: auto;
        }

        .bet-input {
            width: 120px;
            padding: 12px;
            background: rgba(0,0,0,0.6);
            border: 2px solid #ff3366;
            border-radius: 10px;
            color: white;
            font-size: 18px;
            text-align: center;
            font-family: 'Orbitron', monospace;
        }

        .start-btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #ff3366, #ff6b35);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Orbitron', monospace;
        }

        .start-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Countdown */
        .countdown {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 100px;
            font-weight: 900;
            color: #ff3366;
            text-shadow: 0 0 40px #ff3366;
            z-index: 200;
            pointer-events: none;
            font-family: 'Press Start 2P', monospace;
        }

        /* Result Overlay */
        .result-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0.98), rgba(255,51,102,0.6));
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.5s;
            pointer-events: auto;
        }

        .result-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .result-card {
            background: linear-gradient(135deg, #1a1a2e, #0a0a2a);
            padding: 50px;
            border-radius: 40px;
            border: 3px solid #ff3366;
            text-align: center;
            max-width: 450px;
            width: 90%;
            animation: slideUp 0.5s ease;
        }

        .result-title {
            font-size: 48px;
            font-weight: 900;
            margin-bottom: 20px;
        }

        .result-win { color: #33ff66; text-shadow: 0 0 20px #33ff66; }
        .result-lose { color: #ff3366; text-shadow: 0 0 20px #ff3366; }

        .result-amount {
            font-size: 56px;
            font-weight: 900;
            margin: 20px 0;
        }

        .result-details {
            color: #ffcc33;
            margin: 15px 0;
            font-size: 14px;
        }

        .play-again-btn {
            margin-top: 20px;
            padding: 12px 30px;
            background: linear-gradient(135deg, #ff3366, #ff6b35);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        @keyframes slideUp {
            from { transform: translateY(100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        .shake-effect {
            animation: shake 0.2s ease-in-out 3;
        }

        .toast-container {
            position: fixed;
            bottom: 250px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            pointer-events: none;
        }

        .toast {
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(10px);
            padding: 12px 24px;
            border-radius: 10px;
            border-left: 4px solid #ff3366;
            margin: 5px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { transform: translateX(-100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @media (max-width: 768px) {
            .controls-panel { bottom: 15px; padding: 10px 20px; gap: 15px; }
            .control-btn { width: 55px; height: 55px; font-size: 24px; }
            .speedometer { width: 100px; height: 100px; bottom: 15px; right: 15px; }
            .speed-number { font-size: 28px; }
            .boost-meter { width: 160px; bottom: 15px; left: 15px; }
            .bet-panel { bottom: 120px; padding: 10px 20px; }
            .bet-input { width: 100px; padding: 8px; font-size: 16px; }
            .start-btn { padding: 8px 20px; font-size: 14px; }
            .winrate-indicator { top: 70px; left: 10px; padding: 8px 15px; }
            .winrate-value { font-size: 18px; }
            .distance-meter { top: 70px; right: 10px; padding: 8px 15px; }
            .distance-value { font-size: 20px; }
        }
    </style>
</head>
<body>
    <div id="game-canvas"></div>

    <div class="ui-overlay">
        <div class="game-header">

            </div>

    <div class="countdown" id="countdown" style="display: none;"></div>

    <div class="result-overlay" id="result-overlay">

            <div class="result-amount" id="result-amount">+$0</div>

                <i class="fas fa-redo-alt"></i> RACE AGAIN
            </button>
        </div>

    <div class="toast-container" id="toast-container"></div>

    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.128.0/build/three.module.js';

        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Game State
        const gameState = {
            currentUser: null,
            balance: 0,
            betAmount: 10,
            isRacing: false,
            distance: 0,
            finishDistance: 2000,
            speed: 0,
            baseSpeed: 120,
            maxSpeed: 380,
            boost: 50,
            maxBoost: 100,
            wins: 0,
            losses: 0,
            winRate: 10, // 10% win rate
            currentWin: false,
            currentPayout: 0
        };

        // Controls
        const controls = {
            left: false,
            right: false,
            boost: false
        };

        // Three.js Variables
        let scene, camera, renderer, car;
        let roadMarkings = [], obstacles = [], trees = [], particles = [];
        let animationId;
        let finishLine;
        
        // Colors
        const carColor = 0xff3366;
        
        // Initialize 3D Scene
        function init3D() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050520);
            scene.fog = new THREE.FogExp2(0x050520, 0.002);
            
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2.5, 7);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.getElementById('game-canvas').appendChild(renderer.domElement);
            
            // Lighting
            const ambientLight = new THREE.AmbientLight(0x404060);
            scene.add(ambientLight);
            
            const mainLight = new THREE.DirectionalLight(0xffffff, 1);
            mainLight.position.set(5, 10, 7);
            mainLight.castShadow = true;
            scene.add(mainLight);
            
            const backLight = new THREE.PointLight(0xff3366, 0.5);
            backLight.position.set(0, 2, -5);
            scene.add(backLight);
            
            // Track
            const trackMat = new THREE.MeshStandardMaterial({ color: 0x2a2a3a, roughness: 0.4, metalness: 0.6 });
            const trackPlane = new THREE.Mesh(new THREE.PlaneGeometry(8, 500), trackMat);
            trackPlane.rotation.x = -Math.PI / 2;
            trackPlane.position.z = -150;
            trackPlane.receiveShadow = true;
            scene.add(trackPlane);
            
            // Road markings
            for (let z = -200; z <= 100; z += 4) {
                const markingMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 0.3 });
                const marking = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.1, 1.5), markingMat);
                marking.position.set(0, 0.05, z);
                marking.castShadow = true;
                scene.add(marking);
                roadMarkings.push(marking);
            }
            
            // Neon side lines
            const sideMat = new THREE.MeshStandardMaterial({ color: 0xff3366, emissive: 0xff3366, emissiveIntensity: 0.5 });
            for (let z = -200; z <= 100; z += 2) {
                [-3.2, 3.2].forEach(side => {
                    const line = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 1.2), sideMat);
                    line.position.set(side, 0.05, z);
                    scene.add(line);
                });
            }
            
            // Finish line
            const finishMat = new THREE.MeshStandardMaterial({ color: 0xffcc33, emissive: 0xffcc33, emissiveIntensity: 0.8 });
            finishLine = new THREE.Mesh(new THREE.BoxGeometry(8, 0.1, 1), finishMat);
            finishLine.position.set(0, 0.1, gameState.finishDistance);
            finishLine.castShadow = true;
            scene.add(finishLine);
            
            // Create Car
            const carGroup = new THREE.Group();
            
            // Body
            const bodyMat = new THREE.MeshStandardMaterial({ color: carColor, metalness: 0.9, roughness: 0.2 });
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.35, 1.7), bodyMat);
            body.castShadow = true;
            carGroup.add(body);
            
            // Roof
            const roof = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.25, 1.0), new THREE.MeshStandardMaterial({ color: 0x333333 }));
            roof.position.y = 0.28;
            carGroup.add(roof);
            
            // Neon stripe
            const stripeMat = new THREE.MeshStandardMaterial({ color: 0xffcc33, emissive: 0xffcc33, emissiveIntensity: 0.5 });
            const stripe = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.05, 1.5), stripeMat);
            stripe.position.y = 0.15;
            carGroup.add(stripe);
            
            // Wheels
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.6 });
            const positions = [[-0.6, -0.15, -0.65], [0.6, -0.15, -0.65], [-0.6, -0.15, 0.65], [0.6, -0.15, 0.65]];
            positions.forEach(pos => {
                const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.4, 24), wheelMat);
                wheel.rotation.z = Math.PI / 2;
                wheel.position.set(pos[0], pos[1], pos[2]);
                wheel.castShadow = true;
                carGroup.add(wheel);
            });
            
            carGroup.position.y = 0.1;
            car = carGroup;
            scene.add(car);
            
            // Environment - Trees
            for (let z = -150; z <= 150; z += 8) {
                [-4.5, 4.5].forEach(side => {
                    const treeMat = new THREE.MeshStandardMaterial({ color: 0x2c5e2e });
                    const treeGroup = new THREE.Group();
                    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.45, 1, 6), new THREE.MeshStandardMaterial({ color: 0x8B5A2B }));
                    trunk.position.y = 0.5;
                    treeGroup.add(trunk);
                    const foliage1 = new THREE.Mesh(new THREE.ConeGeometry(0.55, 0.9, 8), treeMat);
                    foliage1.position.y = 1.0;
                    treeGroup.add(foliage1);
                    const foliage2 = new THREE.Mesh(new THREE.ConeGeometry(0.45, 0.7, 8), treeMat);
                    foliage2.position.y = 1.5;
                    treeGroup.add(foliage2);
                    treeGroup.position.set(side, 0, z);
                    scene.add(treeGroup);
                    trees.push(treeGroup);
                });
            }
        }
        
        // Spawn Obstacles
        function spawnObstacle() {
            if (!gameState.isRacing) return;
            
            const obstacleMat = new THREE.MeshStandardMaterial({ color: 0xff3333, emissive: 0xff3333, emissiveIntensity: 0.3 });
            const obstacle = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.5, 0.8), obstacleMat);
            obstacle.position.set((Math.random() - 0.5) * 5, 0.25, -50);
            obstacle.castShadow = true;
            obstacle.userData = { damage: 15 };
            scene.add(obstacle);
            obstacles.push(obstacle);
        }
        
        // Check Collisions
        function checkCollisions() {
            for (let i = 0; i < obstacles.length; i++) {
                const obs = obstacles[i];
                if (Math.abs(obs.position.z - car.position.z) < 1.2 && Math.abs(obs.position.x - car.position.x) < 0.8) {
                    gameState.boost = Math.max(0, gameState.boost - obs.userData.damage);
                    showToast(`💥 CRASH! -${obs.userData.damage}% boost`, 'error');
                    cameraShake();
                    scene.remove(obs);
                    obstacles.splice(i, 1);
                    i--;
                }
            }
        }
        
        function cameraShake() {
            const originalX = camera.position.x;
            let shakes = 0;
            const interval = setInterval(() => {
                camera.position.x = (Math.random() - 0.5) * 0.3;
                shakes++;
                if (shakes > 8) {
                    camera.position.x = 0;
                    clearInterval(interval);
                }
            }, 30);
        }
        
        // Animation Loop
        function animateRace() {
            if (!gameState.isRacing) return;
            
            // Boost system
            if (controls.boost && gameState.boost > 0) {
                gameState.boost = Math.max(0, gameState.boost - 0.5);
            } else if (!controls.boost && gameState.boost < gameState.maxBoost) {
                gameState.boost = Math.min(gameState.maxBoost, gameState.boost + 0.3);
            }
            
            // Speed calculation
            const boostMultiplier = 1 + (gameState.boost / gameState.maxBoost) * 0.6;
            gameState.speed = Math.min(gameState.maxSpeed, gameState.baseSpeed * boostMultiplier);
            const moveSpeed = gameState.speed / 60;
            
            // Update distance
            gameState.distance += moveSpeed;
            document.getElementById('distance').textContent = Math.floor(gameState.distance);
            
            // Check finish
            if (gameState.distance >= gameState.finishDistance) {
                determineRaceResult();
                return;
            }
            
            // Update UI
            document.getElementById('boost-bar').style.width = `${(gameState.boost / gameState.maxBoost) * 100}%`;
            document.getElementById('speed').textContent = Math.floor(gameState.speed);
            document.getElementById('boost-text').innerHTML = controls.boost ? '<i class="fas fa-bolt"></i> BOOSTING!' : 'Press BOOST to fill';
            
            // Car movement
            if (controls.left) car.position.x -= 0.12;
            if (controls.right) car.position.x += 0.12;
            car.position.x = Math.max(-2.8, Math.min(2.8, car.position.x));
            car.rotation.z = -car.position.x * 0.1;
            
            // Camera follow
            camera.position.x += (car.position.x * 0.3 - camera.position.x) * 0.1;
            
            // Move road markings
            roadMarkings.forEach(marking => {
                marking.position.z += moveSpeed;
                if (marking.position.z > 50) marking.position.z = -200;
            });
            
            // Move obstacles
            obstacles.forEach(obs => {
                obs.position.z += moveSpeed;
                if (obs.position.z > 30) {
                    scene.remove(obs);
                    obstacles.splice(obstacles.indexOf(obs), 1);
                }
            });
            
            // Move trees
            trees.forEach(tree => {
                tree.position.z += moveSpeed;
                if (tree.position.z > 80) tree.position.z = -150;
            });
            
            // Collision detection
            checkCollisions();
            
            // Spawn obstacles
            if (Math.random() < 0.025 && obstacles.length < 6) spawnObstacle();
            
            renderer.render(scene, camera);
            animationId = requestAnimationFrame(animateRace);
        }
        
        // Determine Race Result with 10% WIN / 90% LOSS
        function determineRaceResult() {
            gameState.isRacing = false;
            cancelAnimationFrame(animationId);
            
            // Calculate skill score (player performance)
            const distancePercent = Math.min(1, gameState.distance / gameState.finishDistance);
            const boostUsed = (gameState.boost / gameState.maxBoost);
            const steeringAccuracy = 1 - (Math.abs(car.position.x) / 3);
            
            const skillScore = (distancePercent * 0.5) + (boostUsed * 0.3) + (steeringAccuracy * 0.2);
            
            // 90% LOSS RATE - ONLY 10% WIN RATE
            const randomRoll = Math.random() * 100;
            const isWin = randomRoll <= gameState.winRate;
            
            let payout = 0;
            
            if (isWin) {
                // WIN - Calculate payout based on skill
                const multiplier = 1.2 + (skillScore * 1.3);
                payout = gameState.betAmount * multiplier;
                gameState.wins++;
                showToast(`🏆 LUCKY WIN! +$${payout.toFixed(2)}`, 'success');
            } else {
                // LOSS - 90% chance
                payout = 0;
                gameState.losses++;
                showToast(`💀 DEFEAT! Lost $${gameState.betAmount.toFixed(2)}`, 'error');
            }
            
            gameState.currentWin = isWin;
            gameState.currentPayout = payout;
            
            // Process transaction
            if (isWin && payout > 0) {
                processTransaction(payout, 'race_win', `Race win $${payout.toFixed(2)}`);
            }
            
            // Show result
            showResult(isWin, payout, skillScore);
            
            // Update win rate display
            updateWinRateDisplay();
        }
        
        function showResult(win, amount, skillScore) {
            const overlay = document.getElementById('result-overlay');
            
            if (win) {
                document.getElementById('result-title').textContent = '🏆 VICTORY! 🏆';
                document.getElementById('result-title').className = 'result-title result-win';
                document.getElementById('result-amount').textContent = `+$${amount.toFixed(2)}`;
                document.getElementById('result-details').innerHTML = `
                    <i class="fas fa-tachometer-alt"></i> Distance: ${Math.floor(gameState.distance)}m<br>
                    <i class="fas fa-bolt"></i> Boost Used: ${Math.floor((gameState.boost / gameState.maxBoost) * 100)}%<br>
                    <i class="fas fa-chart-line"></i> Skill Score: ${(skillScore * 100).toFixed(1)}%<br>
                    <i class="fas fa-percent"></i> Win Rate: 10% (Lucky!)
                `;
            } else {
                document.getElementById('result-title').textContent = '💀 DEFEAT 💀';
                document.getElementById('result-title').className = 'result-title result-lose';
                document.getElementById('result-amount').textContent = `-$${gameState.betAmount.toFixed(2)}`;
                document.getElementById('result-details').innerHTML = `
                    <i class="fas fa-road"></i> Distance: ${Math.floor(gameState.distance)}m<br>
                    <i class="fas fa-bolt"></i> Boost Used: ${Math.floor((gameState.boost / gameState.maxBoost) * 100)}%<br>
                    <i class="fas fa-chart-line"></i> Skill Score: ${(skillScore * 100).toFixed(1)}%<br>
                    <i class="fas fa-percent"></i> Win Rate: 90% Loss Rate
                `;
            }
            
            overlay.classList.add('show');
        }
        
        function updateWinRateDisplay() {
            const total = gameState.wins + gameState.losses;
            const currentRate = total > 0 ? ((gameState.wins / total) * 100).toFixed(1) : 10;
            document.getElementById('winrate').innerHTML = `${currentRate}%<br><span style="font-size: 10px;">(Target: 10%)</span>`;
        }
        
        // Countdown
        async function startCountdown() {
            const countdownEl = document.getElementById('countdown');
            countdownEl.style.display = 'block';
            
            for (let i = 3; i > 0; i--) {
                countdownEl.textContent = i;
                await new Promise(r => setTimeout(r, 800));
            }
            countdownEl.textContent = 'GO!';
            await new Promise(r => setTimeout(r, 400));
            countdownEl.style.display = 'none';
        }
        
        // Start Race
        async function startRace() {
            const bet = parseFloat(document.getElementById('bet-amount').value);
            
            if (isNaN(bet) || bet < 1) {
                showToast('Invalid bet amount!', 'error');
                return;
            }
            
            if (bet > gameState.balance) {
                showToast('Insufficient balance!', 'error');
                return;
            }
            
            if (gameState.isRacing) {
                showToast('Race in progress!', 'warning');
                return;
            }
            
            // Deduct bet
            const result = await processTransaction(-bet, 'race_bet', `Race bet $${bet}`);
            if (!result.success) return;
            
            gameState.betAmount = bet;
            gameState.distance = 0;
            gameState.boost = 50;
            gameState.isRacing = true;
            
            // Clear obstacles
            obstacles.forEach(obs => scene.remove(obs));
            obstacles = [];
            
            await startCountdown();
            animateRace();
        }
        
        // Firebase Functions
        async function processTransaction(amount, type, description) {
            try {
                const walletRef = db.collection('wallets').doc(gameState.currentUser.uid);
                const doc = await walletRef.get();
                const currentBalance = doc.exists ? doc.data().balance || 0 : 0;
                const newBalance = currentBalance + amount;
                
                if (newBalance < 0) throw new Error('Insufficient funds');
                
                await walletRef.set({ balance: newBalance, updatedAt: new Date() });
                gameState.balance = newBalance;
                document.getElementById('balance').textContent = `$${gameState.balance.toFixed(2)}`;
                
                // Save stats
                await db.collection('racing_stats').doc(gameState.currentUser.uid).set({
                    wins: gameState.wins,
                    losses: gameState.losses,
                    updatedAt: new Date()
                });
                
                return { success: true };
            } catch (error) {
                showToast(error.message, 'error');
                return { success: false };
            }
        }
        
        async function checkAuth() {
            auth.onAuthStateChanged(async (user) => {
                if (!user) {
                    showToast('Please login to play!', 'error');
                    setTimeout(() => {
                        window.location.href = 'https://xcrazybet.github.io/millioner/login.html';
                    }, 2000);
                    return;
                }
                gameState.currentUser = user;
                
                const walletDoc = await db.collection('wallets').doc(user.uid).get();
                gameState.balance = walletDoc.exists ? walletDoc.data().balance || 100 : 100;
                document.getElementById('balance').textContent = `$${gameState.balance.toFixed(2)}`;
                
                const statsDoc = await db.collection('racing_stats').doc(user.uid).get();
                if (statsDoc.exists) {
                    gameState.wins = statsDoc.data().wins || 0;
                    gameState.losses = statsDoc.data().losses || 0;
                }
                updateWinRateDisplay();
            });
        }
        
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-triangle'}"></i> ${message}`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
        
        // Controls Setup
        function setupControls() {
            // Keyboard
            window.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft') controls.left = true;
                if (e.key === 'ArrowRight') controls.right = true;
                if (e.key === 'ArrowUp' || e.key === ' ') {
                    controls.boost = true;
                    e.preventDefault();
                }
            });
            
            window.addEventListener('keyup', (e) => {
                if (e.key === 'ArrowLeft') controls.left = false;
                if (e.key === 'ArrowRight') controls.right = false;
                if (e.key === 'ArrowUp' || e.key === ' ') controls.boost = false;
            });
            
            // Touch
            document.getElementById('left-btn').addEventListener('touchstart', () => controls.left = true);
            document.getElementById('left-btn').addEventListener('touchend', () => controls.left = false);
            document.getElementById('right-btn').addEventListener('touchstart', () => controls.right = true);
            document.getElementById('right-btn').addEventListener('touchend', () => controls.right = false);
            document.getElementById('boost-btn').addEventListener('touchstart', () => controls.boost = true);
            document.getElementById('boost-btn').addEventListener('touchend', () => controls.boost = false);
            
            // Mouse
            document.getElementById('left-btn').addEventListener('mousedown', () => controls.left = true);
            document.getElementById('left-btn').addEventListener('mouseup', () => controls.left = false);
            document.getElementById('right-btn').addEventListener('mousedown', () => controls.right = true);
            document.getElementById('right-btn').addEventListener('mouseup', () => controls.right = false);
            document.getElementById('boost-btn').addEventListener('mousedown', () => controls.boost = true);
            document.getElementById('boost-btn').addEventListener('mouseup', () => controls.boost = false);
        }
        
        // Initialize
        checkAuth();
        init3D();
        setupControls();
        
        document.getElementById('start-race').addEventListener('click', startRace);
        document.getElementById('play-again').addEventListener('click', () => {
            document.getElementById('result-overlay').classList.remove('show');
        });
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // Idle animation
        function idleAnimation() {
            if (!gameState.isRacing && car) {
                car.rotation.z = Math.sin(Date.now() * 0.003) * 0.05;
                car.position.y = 0.1 + Math.sin(Date.now() * 0.005) * 0.02;
            }
            requestAnimationFrame(idleAnimation);
        }
        idleAnimation();
    </script>
</body>
</html>
