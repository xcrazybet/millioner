<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🏎️ XLODON 5D RACING - Next Gen Arcade Racer</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <!-- Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
            }
        }
    </script>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Orbitron', monospace;
            overflow: hidden;
            background: linear-gradient(135deg, #0a0a2a, #1a0a2a);
        }

        #game-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* UI Overlay */
        .ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* Header */
        .game-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: linear-gradient(135deg, rgba(0,0,0,0.9), rgba(20,0,40,0.9));
            backdrop-filter: blur(15px);
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid;
            border-image: linear-gradient(90deg, #ff3366, #33ff66, #3366ff, #ff33cc) 1;
            z-index: 100;
            pointer-events: auto;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .home-btn {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #ff3366, #ff6b35);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: white;
            font-size: 20px;
            transition: all 0.3s;
            box-shadow: 0 0 15px rgba(255,51,102,0.5);
        }

        .home-btn:hover {
            transform: scale(1.1) rotate(360deg);
        }

        .logo {
            font-size: 28px;
            font-weight: 900;
            background: linear-gradient(135deg, #ff3366, #ffcc33, #33ff66, #3366ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
        }

        .balance-card {
            background: linear-gradient(135deg, rgba(0,0,0,0.8), rgba(255,51,102,0.2));
            padding: 10px 25px;
            border-radius: 40px;
            border: 2px solid #ff3366;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 22px;
            color: #ff3366;
            box-shadow: 0 0 20px rgba(255,51,102,0.3);
        }

        /* Level Indicator */
        .level-indicator {
            position: fixed;
            top: 100px;
            left: 20px;
            background: linear-gradient(135deg, #ff3366, #ffcc33);
            border-radius: 30px;
            padding: 12px 25px;
            z-index: 100;
            pointer-events: auto;
            box-shadow: 0 0 20px rgba(255,51,102,0.5);
            animation: pulse 2s infinite;
        }

        .level-text {
            color: white;
            font-weight: 900;
            font-size: 18px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        /* Speedometer 5D */
        .speedometer-5d {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, rgba(0,0,0,0.9), rgba(255,51,102,0.3));
            border-radius: 50%;
            border: 4px solid;
            border-image: linear-gradient(45deg, #ff3366, #33ff66, #3366ff, #ff33cc) 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            pointer-events: auto;
            box-shadow: 0 0 40px rgba(255,51,102,0.5);
            backdrop-filter: blur(10px);
        }

        .speed-number {
            font-size: 48px;
            font-weight: 900;
            background: linear-gradient(135deg, #ff3366, #ffcc33);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-family: 'Press Start 2P', monospace;
        }

        /* Race Control Panel */
        .race-panel {
            position: fixed;
            bottom: 30px;
            left: 30px;
            background: linear-gradient(135deg, rgba(0,0,0,0.95), rgba(255,51,102,0.2));
            backdrop-filter: blur(20px);
            border-radius: 25px;
            padding: 25px;
            border: 2px solid;
            border-image: linear-gradient(135deg, #ff3366, #33ff66) 1;
            width: 350px;
            z-index: 100;
            pointer-events: auto;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }

        @media (max-width: 768px) {
            .race-panel { width: auto; left: 15px; right: 15px; bottom: 15px; padding: 15px; }
            .speedometer-5d { width: 100px; height: 100px; bottom: 15px; right: 15px; }
            .speed-number { font-size: 28px; }
            .level-indicator { top: 80px; left: 10px; padding: 8px 15px; }
            .level-text { font-size: 12px; }
        }

        .panel-title {
            color: #ff3366;
            font-size: 16px;
            letter-spacing: 3px;
            margin-bottom: 15px;
            text-align: center;
        }

        .bet-slider {
            margin: 20px 0;
        }

        .bet-input {
            width: 100%;
            padding: 12px;
            background: rgba(0,0,0,0.6);
            border: 2px solid #ff3366;
            border-radius: 10px;
            color: white;
            font-size: 20px;
            font-weight: 700;
            text-align: center;
            font-family: 'Orbitron', monospace;
        }

        .quick-bets {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin: 15px 0;
        }

        .quick-bet {
            padding: 10px;
            background: linear-gradient(135deg, rgba(255,51,102,0.3), rgba(51,255,102,0.3));
            border: 1px solid #ff3366;
            border-radius: 8px;
            color: white;
            text-align: center;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.3s;
        }

        .quick-bet:hover {
            transform: translateY(-3px);
            background: linear-gradient(135deg, #ff3366, #33ff66);
            box-shadow: 0 0 15px rgba(255,51,102,0.5);
        }

        .race-button {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #ff3366, #ffcc33, #33ff66);
            border: none;
            border-radius: 15px;
            color: white;
            font-size: 20px;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Press Start 2P', monospace;
            letter-spacing: 2px;
            margin-top: 10px;
        }

        .race-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .race-button:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 0 30px rgba(255,51,102,0.8);
        }

        /* Stats Dashboard */
        .stats-dashboard {
            position: fixed;
            top: 100px;
            right: 20px;
            background: linear-gradient(135deg, rgba(0,0,0,0.85), rgba(255,51,102,0.2));
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 15px;
            border: 1px solid #ffcc33;
            min-width: 180px;
            z-index: 100;
            pointer-events: auto;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .stat-label {
            color: #ffcc33;
            font-size: 12px;
        }

        .stat-value {
            color: #33ff66;
            font-weight: 700;
            font-size: 14px;
        }

        /* Multiplier Display */
        .multiplier-display {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, rgba(255,51,102,0.9), rgba(0,0,0,0.9));
            padding: 20px 40px;
            border-radius: 60px;
            z-index: 150;
            pointer-events: none;
            font-size: 48px;
            font-weight: 900;
            color: white;
            text-shadow: 0 0 20px #ff3366;
            opacity: 0;
            transition: opacity 0.3s;
            white-space: nowrap;
        }

        /* Result Overlay */
        .result-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0.98), rgba(255,51,102,0.3));
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.5s;
            pointer-events: auto;
        }

        .result-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .result-card {
            background: linear-gradient(135deg, #1a1a2e, #0a0a2a);
            padding: 50px;
            border-radius: 40px;
            border: 3px solid;
            border-image: linear-gradient(135deg, #ff3366, #33ff66, #3366ff) 1;
            text-align: center;
            max-width: 450px;
            width: 90%;
            animation: slideUp 0.5s ease;
        }

        .result-title {
            font-size: 48px;
            font-weight: 900;
            margin-bottom: 20px;
        }

        .result-win { color: #33ff66; text-shadow: 0 0 20px #33ff66; }
        .result-lose { color: #ff3366; text-shadow: 0 0 20px #ff3366; }

        .result-amount {
            font-size: 56px;
            font-weight: 900;
            margin: 20px 0;
        }

        .result-details {
            font-size: 18px;
            color: #ffcc33;
            margin: 15px 0;
        }

        @keyframes slideUp {
            from { transform: translateY(100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .toast-container {
            position: fixed;
            bottom: 200px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            pointer-events: none;
        }

        .toast {
            background: linear-gradient(135deg, rgba(0,0,0,0.9), rgba(255,51,102,0.3));
            backdrop-filter: blur(10px);
            padding: 12px 24px;
            border-radius: 10px;
            border-left: 4px solid #33ff66;
            margin: 5px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { transform: translateX(-100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="game-canvas"></div>

    <div class="ui-overlay">
        <div class="game-header">
            <div class="logo-area">
                <a href="#" class="home-btn" onclick="window.location.href='https://xcrazybet.github.io/millioner'">
                    <i class="fas fa-home"></i>
                </a>
                <div class="logo">
                    <i class="fas fa-flag-checkered"></i> XLODON 5D RACING
                </div>
            </div>
            <div class="balance-card">
                <i class="fas fa-coins"></i>
                <span id="balance">$0.00</span>
            </div>
        </div>

        <div class="level-indicator">
            <div class="level-text">
                <i class="fas fa-star"></i> LEVEL <span id="current-level">1</span> / <span id="max-level">10</span>
            </div>
        </div>

        <div class="speedometer-5d">
            <div class="speed-number" id="speed">0</div>
            <div style="font-size: 10px; color: #ffcc33;">KM/H</div>
        </div>

        <div class="stats-dashboard">
            <div class="stat-item">
                <span class="stat-label"><i class="fas fa-trophy"></i> WINS</span>
                <span class="stat-value" id="wins">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label"><i class="fas fa-chart-line"></i> WIN STREAK</span>
                <span class="stat-value" id="streak">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label"><i class="fas fa-gem"></i> MULTIPLIER</span>
                <span class="stat-value" id="multiplier">1x</span>
            </div>
            <div class="stat-item">
                <span class="stat-label"><i class="fas fa-fire"></i> BOOST</span>
                <span class="stat-value" id="boost">0%</span>
            </div>
        </div>

        <div class="race-panel">
            <div class="panel-title">
                <i class="fas fa-gas-pump"></i> PLACE YOUR BET
            </div>
            <div class="bet-slider">
                <input type="number" id="bet-amount" class="bet-input" value="10" min="1" max="1000">
            </div>
            <div class="quick-bets">
                <div class="quick-bet" data-amount="5">$5</div>
                <div class="quick-bet" data-amount="10">$10</div>
                <div class="quick-bet" data-amount="25">$25</div>
                <div class="quick-bet" data-amount="50">$50</div>
                <div class="quick-bet" data-amount="100">$100</div>
            </div>
            <button id="race-btn" class="race-button">
                <i class="fas fa-flag-checkered"></i> START RACE
            </button>
        </div>
    </div>

    <div class="multiplier-display" id="multiplier-display"></div>

    <div class="result-overlay" id="result-overlay">
        <div class="result-card">
            <div class="result-title" id="result-title">VICTORY!</div>
            <div class="result-amount" id="result-amount">+$0</div>
            <div class="result-details" id="result-details"></div>
            <button id="play-again" class="race-button" style="margin-top: 20px; padding: 12px;">
                <i class="fas fa-redo-alt"></i> RACE AGAIN
            </button>
        </div>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.128.0/build/three.module.js';

        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Game State
        const gameState = {
            currentUser: null,
            balance: 0,
            betAmount: 10,
            isRacing: false,
            currentLevel: 1,
            maxLevel: 10,
            wins: 0,
            streak: 0,
            currentMultiplier: 1,
            boost: 0,
            levelMultipliers: {
                1: 1.2, 2: 1.5, 3: 2.0, 4: 2.5, 5: 3.0,
                6: 4.0, 7: 5.0, 8: 6.5, 9: 8.0, 10: 10.0
            },
            levelColors: {
                1: 0x33ff66, 2: 0x66ff33, 3: 0x99ff33, 4: 0xccff33, 5: 0xffcc33,
                6: 0xff9933, 7: 0xff6633, 8: 0xff3366, 9: 0xff33cc, 10: 0xcc33ff
            }
        };

        // Three.js Setup
        let scene, camera, renderer, car, track, lights = [];
        let roadMarkings = [], trees = [], particles = [];
        let animationId;
        
        function initGame3D() {
            const container = document.getElementById('game-canvas');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050520);
            scene.fog = new THREE.FogExp2(0x050520, 0.002);
            
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2.5, 6);
            camera.lookAt(0, 0, -20);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.setClearColor(0x050520);
            container.appendChild(renderer.domElement);
            
            // Dynamic Lighting
            const ambientLight = new THREE.AmbientLight(0x404060);
            scene.add(ambientLight);
            
            const mainLight = new THREE.DirectionalLight(0xffffff, 1);
            mainLight.position.set(5, 10, 7);
            mainLight.castShadow = true;
            scene.add(mainLight);
            
            // Colored point lights for 5D effect
            const colors = [0xff3366, 0x33ff66, 0x3366ff, 0xff33cc, 0xffcc33];
            for (let i = 0; i < 8; i++) {
                const light = new THREE.PointLight(colors[i % colors.length], 0.5);
                light.position.set(Math.sin(i) * 3, 1 + Math.cos(i) * 2, -10 - i * 5);
                scene.add(light);
                lights.push(light);
            }
            
            // Track with gradient colors
            const trackMat = new THREE.MeshStandardMaterial({ 
                color: 0x2a2a3a, 
                roughness: 0.3, 
                metalness: 0.7,
                emissive: 0x1a1a2a,
                emissiveIntensity: 0.3
            });
            const trackPlane = new THREE.Mesh(new THREE.PlaneGeometry(8, 300), trackMat);
            trackPlane.rotation.x = -Math.PI / 2;
            trackPlane.position.z = -70;
            trackPlane.receiveShadow = true;
            scene.add(trackPlane);
            
            // Rainbow road markings
            for (let z = -100; z <= 30; z += 3) {
                const color = gameState.levelColors[gameState.currentLevel] || 0xff3366;
                const markingMat = new THREE.MeshStandardMaterial({ color: color, emissive: color, emissiveIntensity: 0.5 });
                const marking = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.1, 1.8), markingMat);
                marking.position.set(0, 0.05, z);
                marking.castShadow = true;
                scene.add(marking);
                roadMarkings.push(marking);
            }
            
            // Neon side lines
            for (let z = -100; z <= 30; z += 2) {
                const neonColor = gameState.levelColors[gameState.currentLevel] || 0xff3366;
                const lineMat = new THREE.MeshStandardMaterial({ color: neonColor, emissive: neonColor, emissiveIntensity: 0.8 });
                [-3.5, 3.5].forEach(side => {
                    const line = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 1), lineMat);
                    line.position.set(side, 0.05, z);
                    scene.add(line);
                });
            }
            
            // Create Car
            const carGroup = new THREE.Group();
            
            // Body with color based on level
            const bodyMat = new THREE.MeshStandardMaterial({ 
                color: gameState.levelColors[gameState.currentLevel] || 0xff3366, 
                metalness: 0.9, 
                roughness: 0.2,
                emissive: gameState.levelColors[gameState.currentLevel] || 0xff3366,
                emissiveIntensity: 0.3
            });
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.35, 1.8), bodyMat);
            body.castShadow = true;
            carGroup.add(body);
            
            // Carbon fiber roof
            const roofMat = new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.8 });
            const roof = new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.25, 1.1), roofMat);
            roof.position.y = 0.28;
            carGroup.add(roof);
            
            // Neon stripes
            const stripeMat = new THREE.MeshStandardMaterial({ color: 0xffcc33, emissive: 0xffcc33, emissiveIntensity: 0.5 });
            const stripe = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.05, 1.6), stripeMat);
            stripe.position.y = 0.15;
            carGroup.add(stripe);
            
            // Wheels
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.5 });
            const positions = [[-0.6, -0.15, -0.7], [0.6, -0.15, -0.7], [-0.6, -0.15, 0.7], [0.6, -0.15, 0.7]];
            positions.forEach(pos => {
                const wheelGeo = new THREE.CylinderGeometry(0.24, 0.24, 0.4, 24);
                const wheel = new THREE.Mesh(wheelGeo, wheelMat);
                wheel.rotation.z = Math.PI / 2;
                wheel.position.set(pos[0], pos[1], pos[2]);
                wheel.castShadow = true;
                carGroup.add(wheel);
            });
            
            // Spoiler
            const spoiler = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.1, 0.2), new THREE.MeshStandardMaterial({ color: 0xff3366 }));
            spoiler.position.set(0, 0.25, 0.95);
            carGroup.add(spoiler);
            
            carGroup.position.y = 0.1;
            car = carGroup;
            scene.add(car);
            
            // Environment with colored trees
            for (let z = -90; z <= 40; z += 6) {
                [-5, 5].forEach(side => {
                    const treeColor = gameState.levelColors[gameState.currentLevel % 10] || 0x33ff66;
                    const treeMat = new THREE.MeshStandardMaterial({ color: treeColor, emissive: treeColor, emissiveIntensity: 0.2 });
                    const treeGroup = new THREE.Group();
                    
                    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.45, 1, 6), new THREE.MeshStandardMaterial({ color: 0x8B5A2B }));
                    trunk.position.y = 0.5;
                    treeGroup.add(trunk);
                    
                    const foliage1 = new THREE.Mesh(new THREE.ConeGeometry(0.55, 0.9, 8), treeMat);
                    foliage1.position.y = 1.0;
                    treeGroup.add(foliage1);
                    
                    const foliage2 = new THREE.Mesh(new THREE.ConeGeometry(0.45, 0.7, 8), treeMat);
                    foliage2.position.y = 1.5;
                    treeGroup.add(foliage2);
                    
                    treeGroup.position.set(side, 0, z);
                    scene.add(treeGroup);
                    trees.push(treeGroup);
                });
            }
            
            // Particle system for boost
            const particleCount = 500;
            const particleGeo = new THREE.BufferGeometry();
            const particlePositions = new Float32Array(particleCount * 3);
            for (let i = 0; i < particleCount; i++) {
                particlePositions[i*3] = (Math.random() - 0.5) * 20;
                particlePositions[i*3+1] = (Math.random() - 0.5) * 5;
                particlePositions[i*3+2] = (Math.random() - 0.5) * 100 - 50;
            }
            particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
            const particleMat = new THREE.PointsMaterial({ color: 0xff3366, size: 0.1 });
            const particleSystem = new THREE.Points(particleGeo, particleMat);
            scene.add(particleSystem);
        }
        
        function animateRace(speed, boost) {
            if (!gameState.isRacing) return;
            
            const speedFactor = Math.min(speed / 280, 1);
            const moveSpeed = 0.3 + speedFactor * 1.2 + (boost / 100) * 0.5;
            
            // Move road markings
            roadMarkings.forEach(marking => {
                marking.position.z += moveSpeed;
                if (marking.position.z > 30) marking.position.z = -100;
            });
            
            // Move trees
            trees.forEach(tree => {
                tree.position.z += moveSpeed;
                if (tree.position.z > 40) tree.position.z = -90;
            });
            
            // Animate lights
            lights.forEach((light, i) => {
                light.intensity = 0.3 + Math.sin(Date.now() * 0.005 + i) * 0.5 + (boost / 100);
                light.position.x = Math.sin(Date.now() * 0.003 + i) * 2;
            });
            
            // Car animations with boost
            car.rotation.z = Math.sin(Date.now() * 0.02) * 0.05 * speedFactor;
            car.rotation.x = Math.sin(Date.now() * 0.03) * 0.02 * speedFactor;
            car.position.y = 0.1 + Math.sin(Date.now() * 0.02) * 0.03;
            
            // Camera shake and zoom based on speed
            if (speed > 200) {
                camera.position.x = Math.sin(Date.now() * 0.1) * 0.1;
                camera.position.y = 2.5 + Math.sin(Date.now() * 0.15) * 0.08;
                camera.fov = 75 + Math.sin(Date.now() * 0.05) * 3;
            } else {
                camera.position.x = 0;
                camera.position.y = 2.5;
                camera.fov = 75;
            }
            camera.updateProjectionMatrix();
            
            // Update speed display
            document.getElementById('speed').textContent = Math.floor(speed);
            
            renderer.render(scene, camera);
            animationId = requestAnimationFrame(() => animateRace(gameState.currentSpeed, gameState.boost));
        }
        
        function stopRace() {
            if (animationId) cancelAnimationFrame(animationId);
        }
        
        // Game Logic
        async function startRace() {
            const bet = parseFloat(document.getElementById('bet-amount').value);
            
            if (isNaN(bet) || bet < 1) {
                showToast('Invalid bet amount!', 'error');
                return;
            }
            
            if (bet > gameState.balance) {
                showToast('Insufficient balance!', 'error');
                return;
            }
            
            if (gameState.isRacing) {
                showToast('Race in progress!', 'warning');
                return;
            }
            
            // Deduct bet
            const result = await processTransaction(-bet, 'race_bet', `Race bet $${bet}`);
            if (!result.success) return;
            
            gameState.betAmount = bet;
            gameState.isRacing = true;
            
            const raceBtn = document.getElementById('race-btn');
            raceBtn.disabled = true;
            raceBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> RACING...';
            
            // Simulate race with dynamic outcome
            let speed = 0;
            let boost = 0;
            const raceDuration = 4000;
            const startTime = Date.now();
            
            // Calculate win chance based on level (easier wins at higher levels)
            const baseWinChance = 0.65; // 65% base win rate
            const levelBonus = (gameState.currentLevel - 1) * 0.03; // Up to 27% bonus at level 10
            const streakBonus = Math.min(gameState.streak * 0.02, 0.2); // Up to 20% streak bonus
            const winChance = Math.min(baseWinChance + levelBonus + streakBonus, 0.95);
            
            const speedInterval = setInterval(() => {
                if (!gameState.isRacing) {
                    clearInterval(speedInterval);
                    return;
                }
                
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / raceDuration, 1);
                
                if (progress < 0.6) {
                    speed = 320 * (progress / 0.6);
                    boost = 100 * (progress / 0.6);
                } else {
                    speed = 320 * (1 - (progress - 0.6) / 0.4);
                    boost = 100 * (1 - (progress - 0.6) / 0.4);
                }
                
                gameState.currentSpeed = speed;
                gameState.boost = boost;
                
                if (progress >= 1) {
                    clearInterval(speedInterval);
                    
                    // Determine race outcome
                    const random = Math.random();
                    const isWin = random <= winChance;
                    
                    let payout = 0;
                    let position = 0;
                    
                    if (isWin) {
                        const multiplier = gameState.levelMultipliers[gameState.currentLevel] || 1.2;
                        const streakMultiplier = 1 + (gameState.streak * 0.05);
                        const finalMultiplier = multiplier * streakMultiplier;
                        payout = gameState.betAmount * finalMultiplier;
                        position = Math.floor(Math.random() * 3) + 1;
                        gameState.wins++;
                        gameState.streak++;
                        
                        // Level up logic
                        if (gameState.streak >= 3 && gameState.currentLevel < gameState.maxLevel) {
                            gameState.currentLevel++;
                            showToast(`🎉 LEVEL UP! Now at Level ${gameState.currentLevel}! 🎉`, 'success');
                            updateLevelUI();
                        }
                        
                        showToast(`🏆 VICTORY! ${position}${getOrdinal(position)} Place! +$${payout.toFixed(2)}`, 'success');
                        showMultiplierEffect(finalMultiplier);
                    } else {
                        payout = 0;
                        position = Math.floor(Math.random() * 7) + 4;
                        gameState.streak = 0;
                        showToast(`💀 ${position}${getOrdinal(position)} Place! Lost $${gameState.betAmount}`, 'error');
                    }
                    
                    gameState.currentRace = { win: isWin, payout: payout, position: position };
                    gameState.currentMultiplier = isWin ? (payout / gameState.betAmount) : 0;
                    
                    // Process win
                    if (isWin && payout > 0) {
                        processTransaction(payout, 'race_win', `Race win $${payout.toFixed(2)}`);
                    }
                    
                    updateStatsUI();
                    
                    setTimeout(() => {
                        gameState.isRacing = false;
                        stopRace();
                        raceBtn.disabled = false;
                        raceBtn.innerHTML = '<i class="fas fa-flag-checkered"></i> START RACE';
                        showResult();
                    }, 500);
                }
            }, 50);
        }
        
        function showMultiplierEffect(multiplier) {
            const display = document.getElementById('multiplier-display');
            display.textContent = `${multiplier.toFixed(1)}x MULTIPLIER!`;
            display.style.opacity = '1';
            setTimeout(() => display.style.opacity = '0', 1000);
        }
        
        function showResult() {
            const race = gameState.currentRace;
            const resultOverlay = document.getElementById('result-overlay');
            
            if (race.win) {
                document.getElementById('result-title').textContent = '🏆 VICTORY! 🏆';
                document.getElementById('result-title').className = 'result-title result-win';
                document.getElementById('result-amount').textContent = `+$${race.payout.toFixed(2)}`;
                document.getElementById('result-amount').style.color = '#33ff66';
                document.getElementById('result-details').innerHTML = `
                    <i class="fas fa-trophy"></i> ${race.position}${getOrdinal(race.position)} Place<br>
                    <i class="fas fa-chart-line"></i> ${gameState.currentMultiplier.toFixed(1)}x Multiplier<br>
                    <i class="fas fa-star"></i> Level ${gameState.currentLevel}
                `;
            } else {
                document.getElementById('result-title').textContent = '💀 DEFEAT 💀';
                document.getElementById('result-title').className = 'result-title result-lose';
                document.getElementById('result-amount').textContent = `-$${gameState.betAmount.toFixed(2)}`;
                document.getElementById('result-amount').style.color = '#ff3366';
                document.getElementById('result-details').innerHTML = `
                    <i class="fas fa-skull"></i> ${race.position}${getOrdinal(race.position)} Place<br>
                    <i class="fas fa-chart-line"></i> Streak Broken<br>
                    <i class="fas fa-arrow-up"></i> Keep Racing!
                `;
            }
            
            resultOverlay.classList.add('show');
        }
        
        function getOrdinal(n) {
            const s = ['th', 'st', 'nd', 'rd'];
            const v = n % 100;
            return s[(v - 20) % 10] || s[v] || s[0];
        }
        
        function updateLevelUI() {
            document.getElementById('current-level').textContent = gameState.currentLevel;
            
            // Update car color based on level
            if (car) {
                const color = gameState.levelColors[gameState.currentLevel] || 0xff3366;
                car.children.forEach(child => {
                    if (child.material && child.position.y === 0) {
                        child.material.color.setHex(color);
                        if (child.material.emissive) child.material.emissive.setHex(color);
                    }
                });
            }
        }
        
        function updateStatsUI() {
            document.getElementById('wins').textContent = gameState.wins;
            document.getElementById('streak').textContent = gameState.streak;
            document.getElementById('multiplier').textContent = `${gameState.currentMultiplier.toFixed(1)}x`;
            document.getElementById('boost').textContent = `${Math.floor(gameState.boost || 0)}%`;
        }
        
        // Firebase Integration
        async function checkAuth() {
            auth.onAuthStateChanged(async (user) => {
                if (!user) {
                    showToast('Please login to play!', 'error');
                    setTimeout(() => {
                        window.location.href = 'https://xcrazybet.github.io/millioner/login.html';
                    }, 2000);
                    return;
                }
                gameState.currentUser = user;
                await loadBalance();
                await loadStats();
                setupRealtimeListener();
            });
        }
        
        async function loadBalance() {
            try {
                const doc = await db.collection('wallets').doc(gameState.currentUser.uid).get();
                if (doc.exists) {
                    gameState.balance = doc.data().balance || 0;
                } else {
                    await db.collection('wallets').doc(gameState.currentUser.uid).set({ balance: 100 });
                    gameState.balance = 100;
                }
                document.getElementById('balance').textContent = `$${gameState.balance.toFixed(2)}`;
            } catch (error) {
                console.error('Error loading balance:', error);
            }
        }
        
        async function loadStats() {
            try {
                const doc = await db.collection('race_5d_stats').doc(gameState.currentUser.uid).get();
                if (doc.exists) {
                    gameState.wins = doc.data().wins || 0;
                    gameState.streak = doc.data().streak || 0;
                    gameState.currentLevel = doc.data().level || 1;
                    updateStatsUI();
                    updateLevelUI();
                }
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }
        
        async function processTransaction(amount, type, description) {
            try {
                const walletRef = db.collection('wallets').doc(gameState.currentUser.uid);
                
                return await db.runTransaction(async (transaction) => {
                    const doc = await transaction.get(walletRef);
                    if (!doc.exists) throw new Error('Wallet not found');
                    
                    const currentBalance = doc.data().balance || 0;
                    const newBalance = currentBalance + amount;
                    if (newBalance < 0) throw new Error('Insufficient funds');
                    
                    transaction.update(walletRef, { balance: newBalance, updatedAt: new Date() });
                    gameState.balance = newBalance;
                    document.getElementById('balance').textContent = `$${gameState.balance.toFixed(2)}`;
                    
                    // Save stats
                    await db.collection('race_5d_stats').doc(gameState.currentUser.uid).set({
                        wins: gameState.wins,
                        streak: gameState.streak,
                        level: gameState.currentLevel,
                        updatedAt: new Date()
                    });
                    
                    return { success: true };
                });
            } catch (error) {
                showToast(error.message, 'error');
                return { success: false };
            }
        }
        
        function setupRealtimeListener() {
            const walletRef = db.collection('wallets').doc(gameState.currentUser?.uid);
            walletRef.onSnapshot((doc) => {
                if (doc.exists) {
                    gameState.balance = doc.data().balance || 0;
                    document.getElementById('balance').textContent = `$${gameState.balance.toFixed(2)}`;
                }
            });
        }
        
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-triangle'}"></i> ${message}`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
        
        // Event Listeners
        document.getElementById('race-btn').addEventListener('click', startRace);
        document.getElementById('play-again').addEventListener('click', () => {
            document.getElementById('result-overlay').classList.remove('show');
        });
        
        document.querySelectorAll('.quick-bet').forEach(btn => {
            btn.addEventListener('click', () => {
                const amount = parseFloat(btn.dataset.amount);
                document.getElementById('bet-amount').value = amount;
            });
        });
        
        document.getElementById('bet-amount').addEventListener('input', (e) => {
            let val = parseFloat(e.target.value);
            if (isNaN(val)) val = 1;
            val = Math.max(1, Math.min(val, 1000));
            e.target.value = val;
        });
        
        // Initialize
        checkAuth();
        initGame3D();
        animateRace(0, 0);
    </script>
</body>
</html>
