<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🏇 Race Track - XCrazyBet</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Racing+Sans+One&display=swap" rel="stylesheet">
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --primary: #ff4081;
            --primary-dark: #d81b60;
            --secondary: #2196f3;
            --success: #4caf50;
            --danger: #ff5252;
            --warning: #ff9800;
            --info: #00bcd4;
            --dark-bg: #0a1929;
            --track-green: #2e7d32;
            --track-dirt: #8d6e63;
            --horse-red: #ff5252;
            --horse-blue: #2196f3;
            --horse-yellow: #ffeb3b;
            --horse-purple: #9c27b0;
            --horse-silver: #b0bec5;
            --horse-orange: #ff9800;
            --text: #ffffff;
            --text-dim: #b0b0b0;
            --panel-bg: rgba(17, 24, 39, 0.95);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background: var(--dark-bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            touch-action: manipulation;
        }

        /* Background Effects */
        .bg-effects {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255, 64, 129, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(33, 150, 243, 0.1) 0%, transparent 50%),
                linear-gradient(135deg, #0a0f1a 0%, var(--dark-bg) 100%);
        }

        /* Fullscreen Container */
        .game-container {
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        .game-header {
            background: rgba(17, 24, 39, 0.95);
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--primary);
            backdrop-filter: blur(10px);
            z-index: 1000;
            flex-shrink: 0;
            position: relative;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .home-btn {
            width: 40px;
            height: 40px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #000;
            font-size: 20px;
            transition: all 0.3s;
            font-weight: bold;
        }

        .home-btn:hover {
            background: var(--primary-dark);
            transform: scale(1.1);
        }

        .logo {
            font-family: 'Racing Sans One', cursive;
            font-size: 24px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .logo i {
            color: var(--primary);
            font-size: 28px;
        }

        .balance-display {
            background: linear-gradient(45deg, #1a2332, #0f172a);
            padding: 10px 20px;
            border-radius: 25px;
            border: 2px solid var(--primary);
            color: var(--primary);
            font-weight: 700;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 160px;
            justify-content: center;
        }

        .balance-display i {
            font-size: 20px;
        }

        /* Fullscreen Toggle */
        .fullscreen-toggle {
            position: absolute;
            top: 50%;
            right: 15px;
            transform: translateY(-50%);
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            font-size: 18px;
            cursor: pointer;
            z-index: 1001;
            border: 2px solid var(--primary);
        }

        /* Game Area */
        .game-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 15px;
            gap: 15px;
            overflow-y: auto;
            position: relative;
        }

        /* Race Track */
        .race-track {
            background: linear-gradient(135deg, #1a3b2a, #0f291c);
            border-radius: 15px;
            border: 5px solid #8b4513;
            position: relative;
            height: 300px;
            overflow: hidden;
            box-shadow: 
                inset 0 0 50px rgba(0, 0, 0, 0.5),
                0 10px 30px rgba(0, 0, 0, 0.8);
            margin-bottom: 15px;
        }

        .track-lines {
            position: absolute;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                to right,
                transparent,
                transparent 49px,
                rgba(255, 255, 255, 0.2) 49px,
                rgba(255, 255, 255, 0.2) 50px
            );
        }

        .starting-gate {
            position: absolute;
            left: 20px;
            top: 0;
            bottom: 0;
            width: 5px;
            background: linear-gradient(to bottom, #ffd700, #ff9800);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        .finish-line {
            position: absolute;
            right: 100px;
            top: 0;
            bottom: 0;
            width: 5px;
            background: repeating-linear-gradient(
                to bottom,
                #ffffff,
                #ffffff 10px,
                #ff0000 10px,
                #ff0000 20px
            );
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.7);
            z-index: 10;
        }

        .finish-flag {
            position: absolute;
            right: 110px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 40px;
            color: #ff0000;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
            z-index: 11;
        }

        /* Horses */
        .horse {
            position: absolute;
            width: 60px;
            height: 40px;
            transition: left 0.1s linear, top 0.1s ease-out;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .horse-icon {
            font-size: 32px;
            margin-bottom: 5px;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.5));
        }

        .horse-number {
            background: rgba(0, 0, 0, 0.7);
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            border: 2px solid white;
        }

        .horse-name {
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            font-size: 12px;
            font-weight: 600;
            background: rgba(0, 0, 0, 0.8);
            padding: 2px 8px;
            border-radius: 10px;
            min-width: 80px;
            text-align: center;
        }

        /* Race Info Panel */
        .race-info {
            background: var(--panel-bg);
            border-radius: 15px;
            padding: 15px;
            border: 2px solid rgba(255, 152, 0, 0.3);
            backdrop-filter: blur(10px);
            margin-bottom: 15px;
        }

        .race-status {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .race-timer {
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .race-phase {
            color: var(--text-dim);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .positions-tracker {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .position-item {
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            border: 2px solid transparent;
        }

        .position-item.first {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.1);
        }

        .position-item.second {
            border-color: #c0c0c0;
            background: rgba(192, 192, 192, 0.1);
        }

        .position-item.third {
            border-color: #cd7f32;
            background: rgba(205, 127, 50, 0.1);
        }

        .position-number {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .position-horse {
            font-size: 12px;
            color: var(--text-dim);
        }

        /* Betting Panel */
        .betting-panel {
            background: var(--panel-bg);
            border-radius: 15px;
            padding: 20px;
            border: 2px solid rgba(255, 152, 0, 0.3);
            backdrop-filter: blur(10px);
            margin-bottom: 15px;
        }

        .panel-title {
            color: var(--primary);
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 2px solid rgba(255, 152, 0, 0.2);
            padding-bottom: 10px;
        }

        /* Horse Selection */
        .horse-selection {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .horse-option {
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .horse-option:hover {
            transform: translateY(-3px);
            border-color: var(--primary);
        }

        .horse-option.selected {
            border-color: var(--primary);
            background: rgba(255, 64, 129, 0.2);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(255, 64, 129, 0.3);
        }

        .horse-option-icon {
            font-size: 32px;
            margin-bottom: 5px;
        }

        .horse-option-name {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .horse-option-odds {
            color: var(--warning);
            font-weight: 700;
            font-size: 16px;
        }

        /* Bet Controls */
        .bet-controls {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 15px;
            margin-bottom: 20px;
            align-items: center;
        }

        .bet-input-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .bet-input {
            flex: 1;
            padding: 15px;
            background: rgba(10, 15, 26, 0.8);
            border: 2px solid var(--primary);
            border-radius: 10px;
            color: var(--text);
            font-size: 18px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .bet-input:focus {
            outline: none;
            border-color: var(--secondary);
            box-shadow: 0 0 0 3px rgba(33, 150, 243, 0.1);
        }

        .currency {
            color: var(--primary);
            font-weight: 700;
            font-size: 18px;
        }

        .potential-win {
            text-align: center;
            color: var(--text-dim);
            font-size: 14px;
        }

        .potential-win-value {
            color: var(--success);
            font-weight: 700;
            font-size: 18px;
        }

        /* Quick Bets */
        .quick-bets {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .quick-bet {
            padding: 12px;
            background: rgba(10, 15, 26, 0.8);
            border: 1px solid var(--primary);
            border-radius: 8px;
            color: var(--primary);
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }

        .quick-bet:hover, .quick-bet.active {
            background: var(--primary);
            color: #000;
            transform: translateY(-2px);
        }

        /* Action Buttons */
        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        .btn {
            padding: 16px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #000;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 64, 129, 0.3);
        }

        .btn-secondary {
            background: linear-gradient(135deg, var(--secondary), #1976d2);
            color: #fff;
        }

        .btn-secondary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(33, 150, 243, 0.3);
        }

        /* Recent Winners */
        .winners-panel {
            background: var(--panel-bg);
            border-radius: 15px;
            padding: 15px;
            border: 2px solid rgba(255, 152, 0, 0.3);
            backdrop-filter: blur(10px);
            max-height: 200px;
            overflow-y: auto;
        }

        .winners-title {
            font-size: 16px;
            color: var(--primary);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 152, 0, 0.2);
        }

        .winners-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .winner-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            border-left: 4px solid var(--success);
            animation: slideIn 0.5s ease-out;
        }

        .winner-item.new {
            animation: highlightPulse 2s;
            border-left-color: #ffd700;
            background: rgba(255, 215, 0, 0.1);
        }

        .winner-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .winner-avatar {
            width: 30px;
            height: 30px;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
        }

        .winner-name {
            font-weight: 600;
            font-size: 14px;
        }

        .winner-details {
            font-size: 12px;
            color: var(--text-dim);
        }

        .winner-amount {
            color: var(--success);
            font-weight: 700;
            font-size: 16px;
        }

        /* Game Status */
        .game-status {
            text-align: center;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            margin-top: 15px;
            font-weight: 600;
            color: var(--primary);
            border: 1px solid rgba(0, 255, 157, 0.2);
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 5px;
        }

        /* Result Overlay */
        .result-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .result-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .result-content {
            background: rgba(17, 24, 39, 0.95);
            padding: 30px;
            border-radius: 20px;
            border: 3px solid var(--primary);
            text-align: center;
            max-width: 400px;
            width: 90%;
            backdrop-filter: blur(20px);
            box-shadow: 0 0 40px rgba(255, 64, 129, 0.3);
        }

        .result-title {
            font-size: 32px;
            font-weight: 900;
            margin-bottom: 15px;
            text-transform: uppercase;
            font-family: 'Racing Sans One', cursive;
        }

        .result-win {
            color: var(--primary);
            text-shadow: 0 0 20px rgba(255, 64, 129, 0.5);
        }

        .result-lose {
            color: var(--danger);
            text-shadow: 0 0 20px rgba(255, 82, 82, 0.5);
        }

        .result-horse {
            font-size: 48px;
            margin: 20px 0;
            animation: bounce 1s infinite alternate;
        }

        .result-details {
            font-size: 18px;
            margin: 15px 0;
            color: var(--text);
        }

        .result-amount {
            font-size: 42px;
            font-weight: 900;
            margin: 20px 0;
            color: var(--primary);
            text-shadow: 0 0 20px rgba(255, 64, 129, 0.5);
        }

        .result-amount.lose {
            color: var(--danger);
            text-shadow: 0 0 20px rgba(255, 82, 82, 0.5);
        }

        /* Toast Notifications */
        .toast-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 300px;
            width: 90%;
        }

        .toast {
            padding: 15px;
            background: rgba(17, 24, 39, 0.95);
            border-radius: 10px;
            border-left: 4px solid var(--primary);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
            transform: translateY(100%);
            opacity: 0;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
            font-size: 14px;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.success {
            border-color: var(--success);
        }

        .toast.error {
            border-color: var(--danger);
        }

        .toast.warning {
            border-color: var(--warning);
        }

        /* Crowd Animation */
        .crowd {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 30px;
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 10px,
                rgba(255, 255, 255, 0.1) 10px,
                rgba(255, 255, 255, 0.1) 20px
            );
            z-index: 1;
        }

        /* Animations */
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes highlightPulse {
            0%, 100% {
                background: rgba(255, 215, 0, 0.1);
            }
            50% {
                background: rgba(255, 215, 0, 0.3);
            }
        }

        @keyframes bounce {
            0% {
                transform: translateY(0);
            }
            100% {
                transform: translateY(-10px);
            }
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
            100% {
                transform: scale(1);
            }
        }

        @keyframes raceStart {
            0% {
                left: 20px;
            }
            100% {
                left: 30px;
            }
        }

        @keyframes finishLine {
            0% {
                opacity: 0.5;
            }
            50% {
                opacity: 1;
            }
            100% {
                opacity: 0.5;
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .game-header {
                flex-direction: column;
                gap: 10px;
                padding: 10px;
            }

            .header-left {
                width: 100%;
                justify-content: space-between;
            }

            .balance-display {
                width: 100%;
                min-width: auto;
            }

            .fullscreen-toggle {
                position: relative;
                top: auto;
                right: auto;
                transform: none;
                margin-top: 10px;
            }

            .race-track {
                height: 200px;
            }

            .horse {
                width: 50px;
                height: 30px;
            }

            .horse-icon {
                font-size: 24px;
            }

            .positions-tracker {
                grid-template-columns: repeat(3, 1fr);
            }

            .horse-selection {
                grid-template-columns: repeat(2, 1fr);
            }

            .bet-controls {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .quick-bets {
                grid-template-columns: repeat(2, 1fr);
            }

            .action-buttons {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            .race-track {
                height: 150px;
            }

            .horse {
                width: 40px;
                height: 25px;
            }

            .horse-icon {
                font-size: 20px;
            }

            .horse-name {
                font-size: 10px;
                bottom: -20px;
            }

            .positions-tracker {
                grid-template-columns: repeat(2, 1fr);
            }

            .horse-selection {
                grid-template-columns: 1fr;
            }

            .btn {
                padding: 14px;
                font-size: 14px;
            }
        }

        /* Loading */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 152, 0, 0.3);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

            try {
                const db = firebase.firestore();
                const auth = firebase.auth();
                const walletRef = db.collection("wallets").doc(gameState.currentUser.uid);
                
                return await db.runTransaction(async (transaction) => {
                    const walletDoc = await transaction.get(walletRef);
                    
                    if (!walletDoc.exists) {
                        throw new Error("Wallet not found");
                    }
                    
                    const currentBalance = walletDoc.data().balance || 0;
                    const newBalance = currentBalance + amount;
                    
                    if (newBalance < 0) {
                        throw new Error("Insufficient funds");
                    }
                    
                    // Update main balance
                    transaction.update(walletRef, {
                        balance: newBalance,
                        updatedAt: new Date()
                    });
                    
                    // Record transaction
                    const transactionRef = walletRef.collection("transactions").doc();
                    transaction.set(transactionRef, {
                        type: type,
                        amount: amount,
                        description: description,
                        createdAt: new Date(),
                        gameId: gameState.raceId || 'race_track',
                        beforeBalance: currentBalance,
                        afterBalance: newBalance
                    });
                    
                    // Update local balance
                    gameState.balance = newBalance;
                    updateBalanceDisplay();
                    
                    return { success: true, newBalance };
                    
                });
            } catch (error) {
                console.error('Transaction failed:', error);
                showToast('Transaction failed: ' + error.message, 'error');

        function calculateRaceOutcome() {
            const random = Math.random();
            
            // Apply 90% lose bias
            if (random < 0.90) { // 90% chance player loses
                // Make player's horse lose in various ways
                const playerHorse = getHorseById(gameState.selectedHorse);
                const loseType = Math.random();
                
                if (loseType < 0.4) {
                    // Slow start - falls behind early
                    playerHorse.speed *= 0.7;
                    playerHorse.acceleration *= 0.6;
                } else if (loseType < 0.7) {
                    // Fades at finish
                    playerHorse.stamina *= 0.5;
                } else if (loseType < 0.85) {
                    // Close but loses
                    playerHorse.speed *= 0.9;
                    playerHorse.stamina *= 0.9;
                } else {
                    // Bad luck - random issues
                    playerHorse.speed *= 0.8;
                    playerHorse.acceleration *= 0.8;
                    playerHorse.stamina *= 0.8;
                }
                
                // Boost other horses
                gameState.horses.forEach(horse => {
                    if (horse.id !== gameState.selectedHorse) {
                        horse.speed *= (1 + Math.random() * 0.3);
                        horse.acceleration *= (1 + Math.random() * 0.2);
                    }
                });
                
            } else { // 10% chance player wins
                const winType = Math.random();
                const playerHorse = getHorseById(gameState.selectedHorse);
                
                if (winType < 0.6) {
                    // Small win with favorite
                    playerHorse.speed *= 1.2;
                    playerHorse.acceleration *= 1.1;
                } else if (winType < 0.9) {
                    // Medium win
                    playerHorse.speed *= 1.5;
                    playerHorse.acceleration *= 1.3;
                } else {
                    // Big win with long shot
                    playerHorse.speed *= 2.0;
                    playerHorse.acceleration *= 1.8;
                }
            }
        }

                if (!horse.finished) {
                    // Calculate speed with some randomness
                    const speedVariation = 0.8 + Math.random() * 0.4;
                    const acceleration = horse.acceleration * speedVariation;
                    const maxSpeed = horse.speed * speedVariation;
                    
                    // Accelerate
                    horse.currentSpeed = Math.min(horse.currentSpeed + acceleration * 0.1, maxSpeed);
                    
                    // Move horse
                    horse.position += horse.currentSpeed * 5;
                    
                    // Check if finished
                    if (horse.position >= trackWidth) {
                        horse.finished = true;
                        horse.finishPosition = gameState.horses.filter(h => h.finished).length + 1;
                        horse.position = trackWidth;
                    }
                    
                    // Update DOM
                    const horseElement = document.getElementById(`horse-${horse.id}`);
                    if (horseElement) {
                        horseElement.style.left = horse.position + 'px';
                        
                        // Add bounce animation when running
                        horseElement.style.animation = `bounce ${0.5 / horse.currentSpeed}s infinite alternate`;
                    }
                }
            });
            
            updatePositionsTracker();
        }

        // ===== FINISH RACE =====
        async function finishRace() {
            gameState.racePhase = 'finished';
            audioManager.stopHoovesSound();
            
            // Sort by finish position
            const sortedHorses = [...gameState.horses].sort((a, b) => a.finishPosition - b.finishPosition);
            const winner = sortedHorses[0];
            const playerHorse = getHorseById(gameState.selectedHorse);
            const playerPosition = playerHorse.finishPosition;
            
            // Check if player won
            const playerWon = playerPosition === 1;
            let payout = 0;
            
            if (playerWon) {
                // Calculate payout
                payout = parseFloat((gameState.betAmount * playerHorse.odds).toFixed(2));
                
                // Process win transaction
                await processTransaction(
                    payout,
                    "race_win",
                    `Race win with ${playerHorse.name} - $${payout}`
                );
                
                // Play win sound
                audioManager.playWinSound();
                
                // Add to recent winners
                addRecentWinner(gameState.currentUser.displayName || gameState.currentUser.email.split('@')[0], payout, playerHorse.name);
            } else {
                // Play lose sound
                audioManager.playLoseSound();
            }
            
            // Update current race result
            gameState.currentRace.win = playerWon;
            gameState.currentRace.position = playerPosition;
            gameState.currentRace.payout = payout;
            
            // Show result overlay
            showResult(playerWon, playerHorse, playerPosition, payout, winner);
            
            // Reset for next race after delay
            setTimeout(() => {
                initializeRace();
                document.getElementById('bet-btn').disabled = false;
                document.getElementById('bet-amount').disabled = false;
            }, 5000);
        }

        // ===== RESULT DISPLAY =====
        function showResult(won, playerHorse, position, payout, winner) {
            const overlay = document.getElementById('result-overlay');
            const title = document.getElementById('result-title');
            const horseIcon = document.getElementById('result-horse');
            const horseName = document.getElementById('result-horse-name');
            const details = document.getElementById('result-details');
            const amount = document.getElementById('result-amount');
            
            if (won) {
                title.textContent = '🏆 VICTORY!';
                title.className = 'result-title result-win';
                horseIcon.textContent = playerHorse.icon;
                horseIcon.style.color = playerHorse.color;
                horseName.textContent = playerHorse.name;
                details.innerHTML = `Your horse finished <strong>1st Place</strong>!<br>Odds: ${playerHorse.odds}x`;
                amount.textContent = `+$${payout.toFixed(2)}`;
                amount.className = 'result-amount';
            } else {
                title.textContent = 'BETTER LUCK!';
                title.className = 'result-title result-lose';
                horseIcon.textContent = playerHorse.icon;
                horseIcon.style.color = playerHorse.color;
                horseName.textContent = playerHorse.name;
                details.innerHTML = `Your horse finished <strong>${position}${getOrdinal(position)} Place</strong><br>Winner: ${winner.name} (${winner.odds}x)`;
                amount.textContent = `-$${gameState.betAmount.toFixed(2)}`;
                amount.className = 'result-amount lose';
            }
            
            overlay.classList.add('show');
        }

        function getOrdinal(n) {
            const s = ["th", "st", "nd", "rd"];
            const v = n % 100;
            return s[(v - 20) % 10] || s[v] || s[0];
        }

        // ===== RECENT WINNERS =====
        function generateRecentWinners() {
            for (let i = 0; i < 10; i++) {
                const randomName = winnerNames[Math.floor(Math.random() * winnerNames.length)];
                const randomHorse = horsesConfig[Math.floor(Math.random() * horsesConfig.length)];
                const randomAmount = Math.floor(Math.random() * 500) + 50;
                
                gameState.recentWinners.unshift({
                    name: randomName,
                    amount: randomAmount,
                    horse: randomHorse.name,
                    time: 'Just now'
                });
            }
            updateWinnersList();
        }

        function addRecentWinner(name, amount, horse) {
            const winner = {
                name: name,
                amount: amount,
                horse: horse,
                time: 'Just now',
                new: true
            };
            
            gameState.recentWinners.unshift(winner);
            if (gameState.recentWinners.length > 10) {
                gameState.recentWinners.pop();
            }
            
            updateWinnersList();
            
            // Remove new flag after animation
            setTimeout(() => {
                if (winner.new) {
                    winner.new = false;
                    updateWinnersList();
                }
            }, 2000);
        }

        function updateWinnersList() {
            const list = document.getElementById('winners-list');
            list.innerHTML = '';
            
            gameState.recentWinners.forEach(winner => {
                const item = document.createElement('div');
                item.className = 'winner-item';
                if (winner.new) item.classList.add('new');
                
                item.innerHTML = `
                    <div class="winner-info">
                        <div class="winner-avatar">${winner.name.charAt(0)}</div>
                        <div>
                            <div class="winner-name">${winner.name}</div>
                            <div class="winner-details">Won on ${winner.horse}</div>
                        </div>
                    </div>
                    <div class="winner-amount">$${winner.amount}</div>
                `;
                
                list.appendChild(item);
            });
        }

        // ===== UI FUNCTIONS =====
        function updatePotentialWin() {
            if (!gameState.selectedHorse) {
                document.getElementById('potential-win').textContent = '$0.00';
                return;
            }
            
            const betAmount = parseFloat(document.getElementById('bet-amount').value) || 0;
            const horse = getHorseById(gameState.selectedHorse);
            const potentialWin = (betAmount * horse.odds).toFixed(2);
            document.getElementById('potential-win').textContent = `$${potentialWin}`;
        }

        function updateBetLimits() {
            const betInput = document.getElementById('bet-amount');
            const maxBet = Math.min(gameState.balance, 1000);
            betInput.max = maxBet;
            
            if (parseFloat(betInput.value) > maxBet) {
                betInput.value = maxBet;
                gameState.betAmount = maxBet;
            }
            
            updatePotentialWin();
        }

        function updateGameStatus() {
            const status = document.getElementById('game-status');
            
            switch(gameState.racePhase) {
                case 'betting':
                    status.innerHTML = `Select a horse and place your bet!<div style="font-size: 12px; color: var(--text-dim); margin-top: 5px;"><i class="fas fa-info-circle"></i> Race starts in ${gameState.raceTimer} seconds</div>`;
                    break;
                case 'starting':
                    status.innerHTML = `Race starting soon!<div style="font-size: 12px; color: var(--text-dim); margin-top: 5px;"><i class="fas fa-horse"></i> Get ready for the race!</div>`;
                    break;
                case 'racing':
                    status.innerHTML = `Race in progress!<div style="font-size: 12px; color: var(--text-dim); margin-top: 5px;"><i class="fas fa-tachometer-alt"></i> Watch your horse run!</div>`;
                    break;
                case 'finished':
                    status.innerHTML = `Race finished!<div style="font-size: 12px; color: var(--text-dim); margin-top: 5px;"><i class="fas fa-redo"></i> Next race starting soon...</div>`;
                    break;
            }
        }

        // ===== FULLSCREEN FUNCTIONS =====
        function setupFullscreen() {
            const toggleBtn = document.getElementById('fullscreen-toggle');
            
            toggleBtn.addEventListener('click', () => {
                const container = document.getElementById('game-container');
                
                if (!document.fullscreenElement) {
                    if (container.requestFullscreen) {
                        container.requestFullscreen();
                    } else if (container.webkitRequestFullscreen) {
                        container.webkitRequestFullscreen();
                    }
                    toggleBtn.innerHTML = '<i class="fas fa-compress"></i>';
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    } else if (document.webkitExitFullscreen) {
                        document.webkitExitFullscreen();
                    }
                    toggleBtn.innerHTML = '<i class="fas fa-expand"></i>';
                }
            });
            
            document.addEventListener('fullscreenchange', updateFullscreenButton);
            document.addEventListener('webkitfullscreenchange', updateFullscreenButton);
        }
        
        function updateFullscreenButton() {
            const toggleBtn = document.getElementById('fullscreen-toggle');
            toggleBtn.innerHTML = document.fullscreenElement 
                ? '<i class="fas fa-compress"></i>' 
                : '<i class="fas fa-expand"></i>';
        }

        // ===== EVENT LISTENERS =====
        function setupEventListeners() {
            console.log("Setting up event listeners...");
            
            // Bet button
            document.getElementById('bet-btn').addEventListener('click', startRace);
            
            // Quick bet buttons
            document.querySelectorAll('.quick-bet').forEach(btn => {
                btn.addEventListener('click', () => {
                    const amount = parseFloat(btn.dataset.amount);
                    document.getElementById('bet-amount').value = amount;
                    gameState.betAmount = amount;
                    updatePotentialWin();
                    
                    // Visual feedback
                    document.querySelectorAll('.quick-bet').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                });
            });
            
            // Bet input
            document.getElementById('bet-amount').addEventListener('input', (e) => {
                let value = parseFloat(e.target.value) || 1;
                value = Math.max(1, Math.min(value, Math.min(gameState.balance, 1000)));
                e.target.value = value;
                gameState.betAmount = value;
                updatePotentialWin();
            });
            
            // Play again button
            document.getElementById('play-again-btn').addEventListener('click', () => {
                document.getElementById('result-overlay').classList.remove('show');
            });
            
            // Enter key to place bet
            document.getElementById('bet-amount').addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && !gameState.raceActive) {
                    startRace();
                }
            });
            
            // Setup fullscreen
            setupFullscreen();
            
            console.log("✅ Event listeners setup complete!");
        }

        // ===== TOAST NOTIFICATIONS =====
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.add('show');
            }, 10);
            
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => {
                    if (container.contains(toast)) {
                        container.removeChild(toast);
                    }
                }, 300);
            }, 3000);
        }

        // ===== INITIAL SETUP =====
        setTimeout(() => {
            if (gameState.balance > 0) {
                updateBetLimits();
                showToast('🏇 Welcome to Race Track! Bet on your favorite horse!', 'success');
            }
        }, 2000);

        console.log("🏇 Race Track Game Ready!");
        console.log("💰 Real Money Integration: ACTIVE");
        console.log("🎯 House Edge: 90% lose rate");
        console.log("🚀 Ready to race!");
    </script>
</body>
</html>
