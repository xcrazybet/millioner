<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎭 FACE VALUE - XCrazyBet</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg-dark: #0b0b0e;
            --bg-surface: #111827;
            --bg-surface-light: #1a2332;
            --primary-gold: #F5C77A;
            --primary-dark-gold: #d4a55a;
            --danger-red: #B11226;
            --danger-dark-red: #8c0d1d;
            --logic-blue: #5DA9E9;
            --success-green: #00ff9d;
            --text: #ffffff;
            --text-dim: #a0a8c9;
            --vignette: rgba(11, 11, 14, 0.8);
            --timer-ring: rgba(93, 169, 233, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Montserrat', 'Inter', 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: var(--bg-dark);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            touch-action: manipulation;
        }

        /* Background Effects */
        .bg-effects {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: 
                radial-gradient(circle at 20% 30%, rgba(245, 199, 122, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(177, 18, 38, 0.05) 0%, transparent 50%),
                linear-gradient(135deg, var(--bg-dark) 0%, #151522 100%);
        }

        /* Vignette Effect */
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(ellipse at center, 
                transparent 40%, 
                var(--vignette) 80%);
            pointer-events: none;
        }

        /* Header */
        .header {
            background: rgba(17, 24, 39, 0.95);
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary-gold);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .home-btn {
            width: 36px;
            height: 36px;
            background: var(--primary-gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #000;
            font-size: 18px;
            font-weight: 700;
            transition: all 0.3s;
        }

        .home-btn:hover {
            background: var(--primary-dark-gold);
            transform: scale(1.1);
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--primary-gold);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .logo-icon {
            width: 24px;
            height: 24px;
            background: linear-gradient(45deg, var(--primary-gold), var(--logic-blue));
            border-radius: 50%;
            position: relative;
            overflow: hidden;
        }

        .logo-icon::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            width: 1px;
            height: 100%;
            background: var(--bg-dark);
            transform: translateX(-50%);
        }

        .logo-icon::after {
            content: '$';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 12px;
            font-weight: 900;
            color: var(--bg-dark);
        }

        .balance-display {
            background: linear-gradient(45deg, #1a2332, #0f172a);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--primary-gold);
            color: var(--primary-gold);
            font-weight: 700;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 140px;
            justify-content: center;
        }

        /* Game Container */
        .game-container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px 15px;
            min-height: calc(100vh - 140px);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Game Title */
        .game-title {
            text-align: center;
            margin-bottom: 20px;
            position: relative;
        }

        .game-title h1 {
            font-size: 32px;
            font-weight: 700;
            color: var(--primary-gold);
            margin-bottom: 5px;
            letter-spacing: 2px;
        }

        .game-title .tagline {
            color: var(--text-dim);
            font-size: 14px;
            font-style: italic;
        }

        /* Face Container */
        .face-container {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 0 auto 30px;
            perspective: 1000px;
        }

        .face-circle {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(135deg, #2a2a3a, #1a1a2e);
            position: relative;
            overflow: hidden;
            border: 3px solid rgba(255, 255, 255, 0.1);
            box-shadow: 
                0 0 60px rgba(245, 199, 122, 0.2),
                inset 0 0 40px rgba(0, 0, 0, 0.5);
        }

        /* Timer Ring */
        .timer-ring {
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            border-radius: 50%;
            border: 3px solid transparent;
            border-top-color: var(--timer-ring);
            z-index: 1;
            animation: timerSpin 1s linear infinite;
        }

        @keyframes timerSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .timer-ring.warning {
            border-top-color: var(--danger-red);
            animation-duration: 0.5s;
        }

        /* Face Features */
        .face {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            height: 80%;
        }

        .eye {
            position: absolute;
            width: 40px;
            height: 40px;
            background: #fff;
            border-radius: 50%;
            top: 40%;
        }

        .eye-left {
            left: 25%;
        }

        .eye-right {
            right: 25%;
        }

        .eye-pupil {
            position: absolute;
            width: 20px;
            height: 20px;
            background: #000;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .mouth {
            position: absolute;
            width: 80px;
            height: 10px;
            background: #fff;
            border-radius: 5px;
            bottom: 30%;
            left: 50%;
            transform: translateX(-50%);
        }

        .brow {
            position: absolute;
            width: 50px;
            height: 8px;
            background: #fff;
            border-radius: 4px;
            top: 30%;
        }

        .brow-left {
            left: 20%;
            transform: rotate(-5deg);
        }

        .brow-right {
            right: 20%;
            transform: rotate(5deg);
        }

        /* Game Mode Selector */
        .mode-selector {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }

        .mode-btn {
            padding: 12px 5px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: var(--text-dim);
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .mode-btn i {
            font-size: 16px;
        }

        .mode-btn.active {
            background: rgba(245, 199, 122, 0.2);
            border-color: var(--primary-gold);
            color: var(--primary-gold);
            box-shadow: 0 0 15px rgba(245, 199, 122, 0.3);
        }

        .mode-btn:hover:not(.active) {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--text-dim);
        }

        /* Decision Buttons */
        .decision-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .decision-btn {
            padding: 20px;
            border: none;
            border-radius: 15px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            letter-spacing: 1px;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
        }

        .decision-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.1);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .decision-btn:hover::before {
            opacity: 1;
        }

        .btn-high {
            background: linear-gradient(135deg, var(--primary-gold), var(--primary-dark-gold));
            color: #000;
        }

        .btn-low {
            background: linear-gradient(135deg, var(--logic-blue), #3d7bc8);
            color: #000;
        }

        .decision-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .decision-btn:disabled::before {
            display: none;
        }

        .decision-btn i {
            font-size: 24px;
        }

        /* Bet Controls */
        .bet-controls {
            background: rgba(17, 24, 39, 0.8);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(245, 199, 122, 0.2);
        }

        .bet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .bet-title {
            color: var(--primary-gold);
            font-weight: 600;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .bet-input-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .bet-input {
            flex: 1;
            padding: 15px;
            background: rgba(10, 15, 26, 0.8);
            border: 2px solid var(--primary-gold);
            border-radius: 10px;
            color: var(--text);
            font-size: 18px;
            font-weight: 600;
            text-align: center;
            transition: all 0.3s;
        }

        .bet-input:focus {
            outline: none;
            border-color: var(--logic-blue);
            box-shadow: 0 0 0 3px rgba(93, 169, 233, 0.1);
        }

        .currency {
            color: var(--primary-gold);
            font-weight: 700;
            font-size: 18px;
            min-width: 20px;
        }

        .quick-bets {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .quick-bet {
            padding: 10px 5px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: var(--text-dim);
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }

        .quick-bet:hover {
            background: rgba(245, 199, 122, 0.1);
            border-color: var(--primary-gold);
            color: var(--primary-gold);
        }

        /* Game Stats */
        .game-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }

        .stat-box {
            background: rgba(17, 24, 39, 0.8);
            padding: 15px 10px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-label {
            color: var(--text-dim);
            font-size: 12px;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value {
            color: var(--text);
            font-size: 18px;
            font-weight: 700;
        }

        .stat-value.win {
            color: var(--primary-gold);
        }

        .stat-value.streak {
            color: var(--success-green);
        }

        /* Recent Winners */
        .recent-winners {
            background: rgba(17, 24, 39, 0.9);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid rgba(245, 199, 122, 0.2);
            max-height: 200px;
            overflow-y: auto;
            backdrop-filter: blur(10px);
        }

        .winners-title {
            color: var(--primary-gold);
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(245, 199, 122, 0.2);
        }

        .winners-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .winner-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            font-size: 12px;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .winner-name {
            color: var(--text);
            font-weight: 600;
        }

        .winner-amount {
            color: var(--primary-gold);
            font-weight: 700;
        }

        /* Game History */
        .game-history {
            background: rgba(17, 24, 39, 0.8);
            border-radius: 15px;
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-height: 150px;
            overflow-y: auto;
        }

        .history-title {
            font-size: 14px;
            color: var(--text-dim);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            font-size: 11px;
            border-left: 3px solid var(--primary-gold);
        }

        .history-item.win {
            border-left-color: var(--primary-gold);
            background: rgba(245, 199, 122, 0.05);
        }

        .history-item.lose {
            border-left-color: var(--danger-red);
            background: rgba(177, 18, 38, 0.05);
        }

        .history-time {
            color: var(--text-dim);
        }

        .history-result {
            font-weight: 600;
        }

        .history-result.win {
            color: var(--primary-gold);
        }

        .history-result.lose {
            color: var(--danger-red);
        }

        /* Play Button */
        .play-btn-container {
            margin-top: 20px;
        }

        .play-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, var(--primary-gold), var(--primary-dark-gold));
            border: none;
            border-radius: 15px;
            color: #000;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .play-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(245, 199, 122, 0.4);
        }

        .play-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .play-btn i {
            font-size: 24px;
        }

        /* Result Overlay */
        .result-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 11, 14, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .result-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .result-content {
            background: rgba(17, 24, 39, 0.95);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 350px;
            width: 90%;
            backdrop-filter: blur(20px);
            box-shadow: 0 0 40px rgba(245, 199, 122, 0.3);
            border: 3px solid var(--primary-gold);
            animation: resultAppear 0.5s ease-out;
        }

        @keyframes resultAppear {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .result-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .result-win {
            color: var(--primary-gold);
            text-shadow: 0 0 20px rgba(245, 199, 122, 0.5);
        }

        .result-lose {
            color: var(--danger-red);
            text-shadow: 0 0 20px rgba(177, 18, 38, 0.5);
        }

        .result-details {
            font-size: 18px;
            margin: 15px 0;
            color: var(--text);
        }

        .result-amount {
            font-size: 36px;
            font-weight: 900;
            margin: 20px 0;
            color: var(--primary-gold);
        }

        .result-amount.lose {
            color: var(--danger-red);
        }

        /* Toast Notifications */
        .toast-container {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 300px;
            width: 90%;
        }

        .toast {
            padding: 15px;
            background: rgba(17, 24, 39, 0.95);
            border-radius: 10px;
            border-left: 4px solid var(--primary-gold);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
            transform: translateY(100%);
            opacity: 0;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
            font-size: 14px;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.success {
            border-color: var(--primary-gold);
        }

        .toast.error {
            border-color: var(--danger-red);
        }

        .toast.warning {
            border-color: var(--logic-blue);
        }

        /* Bottom Navigation */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            background: rgba(17, 24, 39, 0.95);
            padding: 12px 15px;
            border-top: 1px solid rgba(245, 199, 122, 0.2);
            backdrop-filter: blur(10px);
            position: sticky;
            bottom: 0;
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--text-dim);
            font-size: 11px;
            gap: 4px;
            transition: all 0.3s;
        }

        .nav-item i {
            font-size: 18px;
        }

        .nav-item.active {
            color: var(--primary-gold);
        }

        .nav-item:hover {
            color: var(--logic-blue);
        }

        /* Animations */
        @keyframes blink {
            0%, 95%, 100% { opacity: 1; }
            97% { opacity: 0.2; }
        }

        @keyframes microSmile {
            0%, 100% { transform: translateX(-50%) scaleY(1); }
            50% { transform: translateX(-50%) scaleY(0.8); }
        }

        @keyframes eyeDart {
            0% { transform: translate(-50%, -50%); }
            33% { transform: translate(-30%, -50%); }
            66% { transform: translate(-70%, -50%); }
            100% { transform: translate(-50%, -50%); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        /* Fullscreen Mode */
        body.fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overflow: hidden;
        }

        body.fullscreen .header,
        body.fullscreen .bottom-nav {
            display: none;
        }

        body.fullscreen .game-container {
            padding: 20px;
            min-height: 100vh;
            justify-content: center;
        }

        .fullscreen-toggle {
            position: fixed;
            top: 15px;
            right: 15px;
            width: 40px;
            height: 40px;
            background: rgba(17, 24, 39, 0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-gold);
            cursor: pointer;
            z-index: 1001;
            border: 1px solid var(--primary-gold);
            transition: all 0.3s;
        }

        .fullscreen-toggle:hover {
            background: var(--primary-gold);
            color: #000;
        }

        /* Loading */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(245, 199, 122, 0.3);
            border-radius: 50%;
            border-top-color: var(--primary-gold);
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 10px;
                padding: 10px;
            }

            .header-left {
                width: 100%;
                justify-content: space-between;
            }

            .balance-display {
                width: 100%;
                min-width: auto;
            }

            .game-container {
                padding: 15px;
            }

            .face-container {
                width: 250px;
                height: 250px;
            }

            .decision-buttons {
                grid-template-columns: 1fr;
                gap: 10px;
            }

                gameState.currentRound.payout = gameState.betAmount * multiplier;
                
                // Update stats
                gameState.currentStreak++;
                gameState.totalWins++;
                gameState.winRate = Math.round((gameState.totalWins / gameState.totalGames) * 100);
                
                // Add to recent winners
                addRecentWinner(gameState.currentRound.payout);
            } else {
                // Lose
                gameState.currentRound.payout = 0;
                gameState.currentStreak = 0;
                
                // Survivor mode elimination
                if (gameState.survivorActive) {
                    endSurvivorMode();
                }
            }
            
            // Update game stats
            updateGameStats();
        }

        async function showResult() {
            const round = gameState.currentRound;
            
            // Update UI elements
            document.getElementById('result-title').textContent = 
                round.result === 'win' ? 'YOU WIN!' : 'NO WIN';
            document.getElementById('result-title').className = 
                round.result === 'win' ? 'result-title result-win' : 'result-title result-lose';
            
            document.getElementById('result-details').textContent = 
                round.result === 'win' ? 'Correct judgment!' : 'Better luck next time';
            
            document.getElementById('result-amount').textContent = 
                round.result === 'win' ? `+$${round.payout.toFixed(2)}` : `-$${gameState.betAmount.toFixed(2)}`;
            document.getElementById('result-amount').className = 
                round.result === 'win' ? 'result-amount' : 'result-amount lose';
            
            // Play sound
            playSound(round.result === 'win' ? 'win' : 'lose');
            
            // Show overlay
            document.getElementById('result-overlay').classList.add('show');
            
            // Process win transaction if any
            if (round.result === 'win' && round.payout > 0) {
                const winResult = await processTransaction(
                    round.payout,
                    "facevalue_win",
                    `Face Value win of $${round.payout.toFixed(2)}`
                );
                
                if (winResult.success) {
                    addGameHistory('Win', 'win', round.payout);
                }
            } else {
                addGameHistory('Loss', 'lose', -gameState.betAmount);
            }
            
            // Save game record
            saveGameRecord();
        }

        function handleAutoLose() {
            gameState.currentRound.playerChoice = 'none';
            gameState.currentRound.result = 'lose';
            gameState.currentRound.payout = 0;
            gameState.currentStreak = 0;
            
            gameState.totalGames++;
            gameState.winRate = Math.round((gameState.totalWins / gameState.totalGames) * 100);
            
            updateGameStats();
            addGameHistory('Time Out', 'lose', -gameState.betAmount);
            
            showToast('Time out! You lost your bet', 'error');
            resetRound();
        }

        function resetRound() {
            gameState.isPlaying = false;
            gameState.roundActive = false;
            
            clearInterval(gameState.timerInterval);
            
            // Reset UI
            document.getElementById('play-btn').disabled = false;
            document.getElementById('btn-high').disabled = false;
            document.getElementById('btn-low').disabled = false;
            document.getElementById('bet-amount').disabled = false;
            document.getElementById('timer-ring').classList.remove('warning');
            
            // Reset face animation
            updateFaceExpression();
            
            // Hide result overlay
            document.getElementById('result-overlay').classList.remove('show');
            
            // Update survivor round if active
            if (gameState.survivorActive && gameState.currentRound.result === 'win') {
                gameState.survivorRound++;
                document.getElementById('survivor-round').textContent = gameState.survivorRound;
                
                // Check for survivor completion
                if (gameState.survivorRound > gameState.survivorMaxRounds) {
                    endSurvivorMode(true);
                }
            }
        }

        // ===== SURVIVOR MODE =====
        function startSurvivorMode() {
            gameState.survivorActive = true;
            gameState.survivorRound = 1;
            gameState.gameMode = 'survivor';
            
            // Update UI
            document.getElementById('survivor-indicator').style.display = 'flex';
            document.getElementById('survivor-round').textContent = '1';
            
            // Update mode buttons
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.mode === 'survivor') {
                    btn.classList.add('active');
                }
            });
            
            showToast('Survivor Mode Started! One wrong move and you\'re out!', 'warning');
        }

        function endSurvivorMode(success = false) {
            if (success) {
                // Big bonus for completing survivor mode
                const bonus = gameState.betAmount * 10;
                processTransaction(bonus, "facevalue_bonus", `Survivor Mode completion bonus of $${bonus}`);
                showToast(`Survivor Mode Completed! Bonus: $${bonus}`, 'success');
            }
            
            gameState.survivorActive = false;
            gameState.gameMode = 'classic';
            
            // Update UI
            document.getElementById('survivor-indicator').style.display = 'none';
            
            // Reset mode buttons
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.mode === 'classic') {
                    btn.classList.add('active');
                }
            });
        }

        // ===== BONUS SYSTEM =====
        async function updateBonusProgress() {
            const bonus = gameState.bonusSystem;
            bonus.roundsPlayed++;
            
            // Check if bonus earned
            if (bonus.roundsPlayed >= bonus.roundsForBonus && !bonus.bonusEarned) {
                bonus.bonusEarned = true;
                bonus.roundsPlayed = 0;
                
                // Award bonus
                await processTransaction(
                    bonus.bonusAmount,
                    "facevalue_bonus",
                    `Round completion bonus of $${bonus.bonusAmount}`
                );
                
                showToast(`Congratulations! You earned $${bonus.bonusAmount} bonus!`, 'success');
            }
            
            // Save to Firebase
            try {
                await db.collection("facevalue_bonus").doc(gameState.currentUser.uid).set({
                    roundsPlayed: bonus.roundsPlayed,
                    roundsForBonus: bonus.roundsForBonus,
                    bonusAmount: bonus.bonusAmount,
                    bonusEarned: bonus.bonusEarned,
                    updatedAt: new Date()
                });
            } catch (error) {
                console.error('Error saving bonus progress:', error);
            }
        }

        // ===== RECENT WINNERS =====
        function generateRecentWinners() {
            const winnersList = document.getElementById('winners-list');
            winnersList.innerHTML = '';
            
            // Generate random winners
            for (let i = 0; i < 5; i++) {
                const randomName = gameState.winnerNames[Math.floor(Math.random() * gameState.winnerNames.length)];
                const randomAmount = (Math.floor(Math.random() * 500) + 50).toFixed(2);
                const timeAgo = `${Math.floor(Math.random() * 5) + 1}m ago`;
                
                const winnerItem = document.createElement('div');
                winnerItem.className = 'winner-item';
                winnerItem.innerHTML = `
                    <div>
                        <span class="winner-name">${randomName}</span>
                        <span style="color: var(--text-dim); font-size: 10px; margin-left: 5px;">${timeAgo}</span>
                    </div>
                    <div class="winner-amount">+$${randomAmount}</div>
                `;
                
                winnersList.appendChild(winnerItem);
            }
            
            // Update periodically
            setInterval(() => {
                const randomName = gameState.winnerNames[Math.floor(Math.random() * gameState.winnerNames.length)];
                const randomAmount = (Math.floor(Math.random() * 1000) + 100).toFixed(2);
                
                const winnerItem = document.createElement('div');
                winnerItem.className = 'winner-item';
                winnerItem.innerHTML = `
                    <div>
                        <span class="winner-name">${randomName}</span>
                        <span style="color: var(--text-dim); font-size: 10px; margin-left: 5px;">just now</span>
                    </div>
                    <div class="winner-amount">+$${randomAmount}</div>
                `;
                
                winnersList.insertBefore(winnerItem, winnersList.firstChild);
                if (winnersList.children.length > 5) {
                    winnersList.removeChild(winnersList.lastChild);
                }
            }, 30000); // Every 30 seconds
        }

        function addRecentWinner(amount) {
            const winnersList = document.getElementById('winners-list');
            const randomName = gameState.winnerNames[Math.floor(Math.random() * gameState.winnerNames.length)];
            
            const winnerItem = document.createElement('div');
            winnerItem.className = 'winner-item';
            winnerItem.innerHTML = `
                <div>
                    <span class="winner-name">${randomName}</span>
                    <span style="color: var(--text-dim); font-size: 10px; margin-left: 5px;">just now</span>
                </div>
                <div class="winner-amount">+$${amount.toFixed(2)}</div>
            `;
            
            winnersList.insertBefore(winnerItem, winnersList.firstChild);
            if (winnersList.children.length > 5) {
                winnersList.removeChild(winnersList.lastChild);
            }
        }

        // ===== GAME HISTORY =====
        function addGameHistory(action, result, amount) {
            const historyItem = {
                action: action,
                result: result,
                amount: amount,
                timestamp: new Date(),
                betAmount: gameState.betAmount,
                mode: gameState.gameMode
            };
            
            gameState.gameHistory.unshift(historyItem);
            if (gameState.gameHistory.length > 10) {
                gameState.gameHistory.pop();
            }
            
            updateHistoryDisplay();
            
            // Save to Firebase
            saveGameHistoryToFirebase(historyItem);
        }

        function updateHistoryDisplay() {
            const historyList = document.getElementById('history-list');
            historyList.innerHTML = '';
            
            gameState.gameHistory.forEach(item => {
                const historyItem = document.createElement('div');
                historyItem.className = `history-item ${item.result}`;
                
                const time = new Date(item.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                
                historyItem.innerHTML = `
                    <div class="history-time">${time}</div>
                    <div class="history-result ${item.result}">
                        ${item.amount > 0 ? '+' : ''}$${Math.abs(item.amount).toFixed(2)}
                    </div>
                `;
                
                historyList.appendChild(historyItem);
            });
        }

        async function loadGameHistory() {
            try {
                const snapshot = await db.collection("facevalue_history")
                    .doc(gameState.currentUser?.uid)
                    .collection("games")
                    .orderBy('timestamp', 'desc')
                    .limit(10)
                    .get();
                
                snapshot.forEach(doc => {
                    const data = doc.data();
                    gameState.gameHistory.push({
                        action: data.action,
                        result: data.result,
                        amount: data.amount,
                        timestamp: data.timestamp.toDate(),
                        betAmount: data.betAmount,
                        mode: data.mode
                    });
                });
                
                updateHistoryDisplay();
            } catch (error) {
                console.error('Error loading game history:', error);
            }
        }

        async function saveGameHistoryToFirebase(historyItem) {
            try {
                await db.collection("facevalue_history").doc(gameState.currentUser.uid).collection("games").add({
                    userId: gameState.currentUser.uid,
                    ...historyItem,
                    gameId: gameState.gameId
                });
            } catch (error) {
                console.error('Error saving game history:', error);
            }
        }

        async function saveGameRecord() {
            try {
                await db.collection("facevalue_games").doc(gameState.currentUser.uid).collection("rounds").add({
                    userId: gameState.currentUser.uid,
                    gameId: gameState.gameId,
                    betAmount: gameState.betAmount,
                    result: gameState.currentRound.result,
                    payout: gameState.currentRound.payout,
                    choice: gameState.currentRound.playerChoice,
                    actualValue: gameState.currentRound.faceValue,
                    mode: gameState.gameMode,
                    streak: gameState.currentStreak,
                    timestamp: new Date()
                });
            } catch (error) {
                console.error('Error saving game record:', error);
            }
        }

        async function loadGameStats() {
            try {
                const statsDoc = await db.collection("facevalue_stats").doc(gameState.currentUser.uid).get();
                if (statsDoc.exists) {
                    const data = statsDoc.data();
                    gameState.totalWins = data.totalWins || 0;
                    gameState.totalGames = data.totalGames || 0;
                    gameState.winRate = data.winRate || 0;
                    gameState.currentStreak = data.currentStreak || 0;
                    updateGameStats();
                }
            } catch (error) {
                console.error('Error loading game stats:', error);
            }
        }

        function updateGameStats() {
            document.getElementById('streak-val').textContent = gameState.currentStreak;
            document.getElementById('win-rate').textContent = `${gameState.winRate}%`;
            document.getElementById('total-wins').textContent = gameState.totalWins;
            
            // Save stats to Firebase
            saveGameStats();
        }

        async function saveGameStats() {
            try {
                await db.collection("facevalue_stats").doc(gameState.currentUser.uid).set({
                    totalWins: gameState.totalWins,
                    totalGames: gameState.totalGames,
                    winRate: gameState.winRate,
                    currentStreak: gameState.currentStreak,
                    updatedAt: new Date()
                });
            } catch (error) {
                console.error('Error saving game stats:', error);
            }
        }

        // ===== SOUND SYSTEM =====
        function setupSounds() {
            // Load sound URLs (you'll need to provide actual URLs from SoundBible)
            const sounds = {
                tick: 'https://soundbible.com/mp3/Clock-Ticking.mp3',
                heartbeat: 'https://soundbible.com/mp3/heartbeat.mp3',
                win: 'https://soundbible.com/mp3/cash_register.mp3',
                lose: 'https://soundbible.com/mp3/wrong.mp3',
                reveal: 'https://soundbible.com/mp3/Click2.mp3'
            };
            
            // Create audio elements
            for (const [key, url] of Object.entries(sounds)) {
                const audio = document.getElementById(`sound-${key}`);
                audio.src = url;
                audio.load();
            }
        }

        function playSound(type) {
            const audio = document.getElementById(`sound-${type}`);
            if (audio) {
                audio.currentTime = 0;
                audio.play().catch(e => console.log('Audio play failed:', e));
            }
        }

        // ===== EVENT LISTENERS =====
        function setupEventListeners() {
            // Play button
            document.getElementById('play-btn').addEventListener('click', startRound);
            
            // Continue button
            document.getElementById('continue-btn').addEventListener('click', resetRound);
            
            // Mode selector
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const mode = btn.dataset.mode;
                    
                    if (gameState.isPlaying) {
                        showToast('Finish current round first', 'warning');
                        return;
                    }
                    
                    // Update active mode
                    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    
                    gameState.gameMode = mode;
                    
                    if (mode === 'survivor') {
                        startSurvivorMode();
                    } else {
                        if (gameState.survivorActive) {
                            endSurvivorMode();
                        }
                    }
                    
                    showToast(`Mode changed to ${mode.toUpperCase()}`, 'info');
                });
            });
            
            // Quick bet buttons
            document.querySelectorAll('.quick-bet').forEach(btn => {
                btn.addEventListener('click', () => {
                    const amount = parseFloat(btn.dataset.amount);
                    document.getElementById('bet-amount').value = amount;
                    gameState.betAmount = amount;
                });
            });
            
            // Bet input
            document.getElementById('bet-amount').addEventListener('input', (e) => {
                let value = parseFloat(e.target.value) || 1;
                const maxBet = Math.min(gameState.balance, gameState.maxBet);
                value = Math.max(1, Math.min(value, maxBet));
                e.target.value = value;
                gameState.betAmount = value;
            });
            
            // Fullscreen toggle
            document.getElementById('fullscreen-toggle').addEventListener('click', toggleFullscreen);
            
            // Keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                if (!gameState.roundActive) return;
                
                if (e.key === 'ArrowUp' || e.key === 'h') {
                    makeDecision('high');
                } else if (e.key === 'ArrowDown' || e.key === 'l') {
                    makeDecision('low');
                }
            });
        }

        // ===== FULLSCREEN FUNCTION =====
        function toggleFullscreen() {
            const toggleBtn = document.getElementById('fullscreen-toggle');
            
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
                document.body.classList.add('fullscreen');
                toggleBtn.innerHTML = '<i class="fas fa-compress"></i>';
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                    document.body.classList.remove('fullscreen');
                    toggleBtn.innerHTML = '<i class="fas fa-expand"></i>';
                }
            }
        }

        // ===== TOAST NOTIFICATIONS =====
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.add('show');
            }, 10);
            
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => {
                    if (container.contains(toast)) {
                        container.removeChild(toast);
                    }
                }, 300);
            }, 3000);
        }

        // ===== INITIAL SETUP =====
        // Set up sounds
        setupSounds();
        
        // Generate initial winners
        generateRecentWinners();
    </script>
</body>
</html>
