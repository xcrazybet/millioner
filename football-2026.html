<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Fixtures - 2026 Season</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1e1e2f 0%, #2a2a40 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
            font-size: 2.5em;
        }
        
        h1 span {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .season-badge {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .season-badge span {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 8px 20px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1.2em;
            display: inline-block;
        }
        
        .status-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }
        
        .status-info {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }
        
        .status-item {
            text-align: center;
        }
        
        .status-label {
            font-size: 0.9em;
            opacity: 0.9;
        }
        
        .status-value {
            font-size: 1.5em;
            font-weight: bold;
        }
        
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
        }
        
        .league-selector {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .league-btn {
            padding: 10px 20px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
        }
        
        .league-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }
        
        .league-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: transparent;
        }
        
        .date-picker {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .date-picker input {
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
        }
        
        .date-picker button {
            padding: 10px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 10px;
            flex-wrap: wrap;
        }
        
        .tab {
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
            font-weight: 500;
            transition: all 0.3s;
        }
        
        .tab:hover {
            background: #f0f0f0;
        }
        
        .tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .fixtures-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }
        
        .fixture-card {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
            overflow: hidden;
        }
        
        .fixture-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        
        .fixture-card.live::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #ff4757, #ff6b81);
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        .league-info {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .league-logo {
            width: 30px;
            height: 30px;
            object-fit: contain;
        }
        
        .league-name {
            font-size: 0.9em;
            color: #666;
            font-weight: 500;
        }
        
        .match-teams {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .team {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }
        
        .team-logo {
            width: 60px;
            height: 60px;
            object-fit: contain;
            margin-bottom: 10px;
        }
        
        .team-name {
            font-weight: 600;
            text-align: center;
            font-size: 0.9em;
        }
        
        .score {
            font-size: 2em;
            font-weight: bold;
            padding: 0 20px;
            color: #333;
        }
        
        .score.live {
            color: #ff4757;
        }
        
        .match-info {
            text-align: center;
            color: #666;
            font-size: 0.9em;
            margin-top: 10px;
        }
        
        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            font-weight: 500;
            background: #f0f0f0;
            color: #666;
        }
        
        .status-badge.live {
            background: #ff4757;
            color: white;
            animation: pulse 1.5s infinite;
        }
        
        .status-badge.finished {
            background: #2ecc71;
            color: white;
        }
        
        .loading {
            text-align: center;
            padding: 50px;
            color: #666;
        }
        
        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
            text-align: center;
        }
        
        .no-data {
            text-align: center;
            color: #999;
            padding: 40px;
            font-style: italic;
        }
        
        .stats-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .stat-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            border-left: 4px solid #667eea;
        }
        
        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }
        
        .stat-label {
            color: #666;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚽ <span>Football Fixtures</span> ⚽</h1>
        <div class="season-badge">
            <span>🏆 2026 SEASON 🏆</span>
        </div>
        
<!-- API Status Section -->
<div class="status-card" id="statusCard">
    <div>
        <h2>API Status</h2>
        <p id="accountInfo">Loading account info...</p>
    </div>
    <div class="status-info">
        <div class="status-item">
            <div class="status-label">Requests Today</div>
            <div class="status-value" id="requestsUsed">-</div>
        </div>
        <div class="status-item">
            <div class="status-label">Daily Limit</div>
            <div class="status-value" id="requestsLimit">-</div>
        </div>
    </div>
</div>

        <!-- Statistics Summary -->
        <div class="stats-summary" id="statsSummary">
            <div class="stat-box">
                <div class="stat-value" id="totalMatches">0</div>
                <div class="stat-label">Total Matches</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="liveMatches">0</div>
                <div class="stat-label">Live Now</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="finishedMatches">0</div>
                <div class="stat-label">Finished</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="upcomingMatches">0</div>
                <div class="stat-label">Upcoming</div>
            </div>
        </div>
        
        <!-- League Selector -->
        <div class="controls">
            <div class="league-selector">
                <button class="league-btn active" onclick="selectLeague('all')">🌍 All Leagues</button>
                <button class="league-btn" onclick="selectLeague('39')">🏴󠁧󠁢󠁥󠁮󠁧󠁿 Premier League</button>
                <button class="league-btn" onclick="selectLeague('140')">🇪🇸 La Liga</button>
                <button class="league-btn" onclick="selectLeague('78')">🇩🇪 Bundesliga</button>
                <button class="league-btn" onclick="selectLeague('135')">🇮🇹 Serie A</button>
                <button class="league-btn" onclick="selectLeague('61')">🇫🇷 Ligue 1</button>
            </div>
            
            <div class="date-picker">
                <input type="date" id="datePicker" value="2026-02-26">
                <button onclick="fetchByDate()">📅 Get Games</button>
            </div>
        </div>
        
        <!-- Tabs -->
        <div class="tabs">
            <div class="tab active" onclick="switchTab('all')">📊 ALL</div>
            <div class="tab" onclick="switchTab('live')">🔴 LIVE</div>
            <div class="tab" onclick="switchTab('upcoming')">📅 UPCOMING</div>
            <div class="tab" onclick="switchTab('finished')">✅ FINISHED</div>
        </div>
        
        <!-- Fixtures Container -->
        <div id="fixturesContainer">
            <div class="loading">
                <div class="loading-spinner"></div>
                <p>Loading 2026 season fixtures...</p>
            </div>
        </div>
    </div>

    <script>
        // Your API key
        const API_KEY = '2396236d9d5cd07468ce280da8390ad5';
        const BASE_URL = 'https://v3.football.api-sports.io';
        
        let currentTab = 'all';
        let currentLeague = 'all';
        let currentDate = '2026-02-26';
        
        // League mapping
        const leagues = {
            'all': null,
            '39': 'Premier League',
            '140': 'La Liga',
            '78': 'Bundesliga',
            '135': 'Serie A',
            '61': 'Ligue 1'
        };
        
        // Select league
        function selectLeague(leagueId) {
            currentLeague = leagueId;
            
            // Update active button
            document.querySelectorAll('.league-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            // Fetch fixtures
            fetchFixtures(currentTab);
        }
        
        // Fetch by date
        function fetchByDate() {
            currentDate = document.getElementById('datePicker').value;
            fetchFixtures(currentTab);
        }
        
        // Switch between tabs
        function switchTab(tab) {
            currentTab = tab;
            
            // Update active tab styling
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            
            // Fetch fixtures for selected tab
            fetchFixtures(tab);
        }
        
        // Fetch fixtures based on status
        async function fetchFixtures(status) {
            const container = document.getElementById('fixturesContainer');
            container.innerHTML = '<div class="loading"><div class="loading-spinner"></div><p>Loading 2026 season fixtures...</p></div>';
            
            // Build parameters for 2026 season
            let params = {
                season: '2026'  // Explicitly set to 2026 season
            };
            
            // Add league filter if not 'all'
            if (currentLeague !== 'all') {
                params.league = currentLeague;
            }
            
            // Set status parameter based on tab
            if (status === 'live') {
                params.live = 'all';
            } else if (status === 'upcoming') {
                params.date = currentDate;
                params.status = 'NS'; // Not Started
            } else if (status === 'finished') {
                params.date = currentDate;
                params.status = 'FT'; // Full Time
            } else if (status === 'all') {
                params.date = currentDate;
            }
            
            console.log('Fetching 2026 season with params:', params);
            
            try {
                // Build URL with params
                const queryString = new URLSearchParams(params).toString();
                const url = `${BASE_URL}/fixtures?${queryString}`;
                
                const response = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'x-apisports-key': API_KEY
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                console.log('2026 Season Data:', data);
                
                // Update API status
                const requestsUsed = response.headers.get('x-ratelimit-requests-remaining');
                const requestsLimit = response.headers.get('x-ratelimit-requests-limit');
                updateAPIStatus(requestsUsed, requestsLimit);
                
                if (data.results === 0) {
                    container.innerHTML = `
                        <div class="no-data">
                            <h3>No fixtures found for the 2026 season</h3>
                            <p>Try selecting a different date or league</p>
                            <p style="margin-top: 20px; color: #667eea;">📅 Current Date: ${currentDate}</p>
                        </div>
                    `;
                } else {
                    displayFixtures(data.response);
                    updateStats(data.response);
                }
                
            } catch (error) {
                console.error('Error:', error);
                container.innerHTML = `<div class="error">Error loading 2026 fixtures: ${error.message}</div>`;
            }
        }
        
        // Update statistics
        function updateStats(fixtures) {
            const total = fixtures.length;
            const live = fixtures.filter(f => 
                f.fixture.status.short === 'LIVE' || 
                f.fixture.status.short === '1H' || 
                f.fixture.status.short === '2H' || 
                f.fixture.status.short === 'HT'
            ).length;
            
            const finished = fixtures.filter(f => 
                f.fixture.status.short === 'FT' || 
                f.fixture.status.short === 'AET' || 
                f.fixture.status.short === 'PEN'
            ).length;
            
            const upcoming = fixtures.filter(f => 
                f.fixture.status.short === 'NS' || 
                f.fixture.status.short === 'TBD'
            ).length;
            
            document.getElementById('totalMatches').textContent = total;
            document.getElementById('liveMatches').textContent = live;
            document.getElementById('finishedMatches').textContent = finished;
            document.getElementById('upcomingMatches').textContent = upcoming;
        }
        
        // Display fixtures in the grid
        function displayFixtures(fixtures) {
            const container = document.getElementById('fixturesContainer');
            
            let html = '<div class="fixtures-grid">';
            
            fixtures.forEach(fixture => {
                const isLive = fixture.fixture.status.short === 'LIVE' || 
                              fixture.fixture.status.short === '1H' || 
                              fixture.fixture.status.short === '2H' || 
                              fixture.fixture.status.short === 'HT' ||
                              fixture.fixture.status.short === 'ET';
                
                const isFinished = fixture.fixture.status.short === 'FT' || 
                                  fixture.fixture.status.short === 'AET' || 
                                  fixture.fixture.status.short === 'PEN';
                
                const statusText = fixture.fixture.status.long;
                const homeScore = fixture.goals.home !== null ? fixture.goals.home : '-';
                const awayScore = fixture.goals.away !== null ? fixture.goals.away : '-';
                
                let statusClass = '';
                if (isLive) statusClass = 'live';
                else if (isFinished) statusClass = 'finished';
                
                html += `
                    <div class="fixture-card ${isLive ? 'live' : ''}">
                        <div class="league-info">
                            <img class="league-logo" src="${fixture.league.logo || 'https://via.placeholder.com/30'}" alt="${fixture.league.name}" onerror="this.src='https://via.placeholder.com/30'">
                            <span class="league-name">${fixture.league.name} (${fixture.league.country || 'International'})</span>
                        </div>
                        
                        <div class="match-teams">
                            <div class="team">
                                <img class="team-logo" src="${fixture.teams.home.logo || 'https://via.placeholder.com/60'}" alt="${fixture.teams.home.name}" onerror="this.src='https://via.placeholder.com/60'">
                                <span class="team-name">${fixture.teams.home.name}</span>
                            </div>
                            
                            <div class="score ${isLive ? 'live' : ''}">
                                ${homeScore} - ${awayScore}
                            </div>
                            
                            <div class="team">
                                <img class="team-logo" src="${fixture.teams.away.logo || 'https://via.placeholder.com/60'}" alt="${fixture.teams.away.name}" onerror="this.src='https://via.placeholder.com/60'">
                                <span class="team-name">${fixture.teams.away.name}</span>
                            </div>
                        </div>
                        
                        <div class="match-info">
                            <span class="status-badge ${statusClass}">${statusText}</span>
                            <p>${formatDate(fixture.fixture.date)}</p>
                            <p>${fixture.fixture.venue.name || 'Venue TBD'}</p>
                            <p style="font-size: 0.8em; color: #999;">Season: 2026</p>
                        </div>
                    </div>
                `;
            });
            
            html += '</div>';
            container.innerHTML = html;
        }
        
        // Update API status display
        function updateAPIStatus(used, limit) {
            document.getElementById('requestsUsed').textContent = used || '0';
            document.getElementById('requestsLimit').textContent = limit || '100';
        }
        
        // Fetch and display API account status
        async function fetchAPIStatus() {
            try {
                const response = await fetch(`${BASE_URL}/status`, {
                    method: 'GET',
                    headers: {
                        'x-apisports-key': API_KEY
                    }
                });
                
                const data = await response.json();
                console.log('Status response:', data);
                
                if (data.response && data.response.account) {
                    const account = data.response.account;
                    const subscription = data.response.subscription;
                    
                    document.getElementById('accountInfo').innerHTML = `
                        ${account.firstname} ${account.lastname} (${account.email}) - 
                        <strong>${subscription.plan} Plan</strong>
                    `;
                }
            } catch (error) {
                console.error('Error fetching status:', error);
            }
        }
        
        // Helper function to format date
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleString('en-US', {
                weekday: 'short',
                month: 'short',
                day: 'numeric',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }
        
        // Initial load
        async function init() {
            await fetchAPIStatus();
            await fetchFixtures('all');
            
            // Set today's date in the date picker
            document.getElementById('datePicker').value = '2026-02-26';
        }
        
        // Start the app
        init();
    </script>
</body>
</html>
