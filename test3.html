<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Live Market Prices</title>
<style>
body{
    background:#0f172a;
    font-family:Arial;
    color:white;
    padding:20px;
}
h1{
    text-align:center;
}
table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}
th, td{
    padding:12px;
    text-align:center;
}
th{
    background:#1e293b;
}
tr{
    border-bottom:1px solid #1e293b;
}
.green{
    color:#00ff88;
}
.red{
    color:#ff4d4d;
}
</style>
</head>
<body>

<h1>Live Market Prices (USD)</h1>

<table id="marketTable">
<thead>
<tr>
<th>Symbol</th>
<th>Name</th>
<th>Price (USD)</th>
<th>Change</th>
<th>% Change</th>
</tr>
</thead>
<tbody></tbody>
</table>

<script>

const symbols = [
    // Stocks
    "AAPL","MSFT","GOOGL","AMZN","TSLA",
    "META","NVDA","NFLX","JPM","V",

    // Forex (USD based)
    "EURUSD=X","GBPUSD=X","USDJPY=X","AUDUSD=X","USDCAD=X",

    // Commodities
    "GC=F","SI=F","CL=F","NG=F","HG=F"
];

async function fetchPrices(){
    try{
        const response = await fetch(`https://query1.finance.yahoo.com/v7/finance/quote?symbols=${symbols.join(",")}`);
        const data = await response.json();
        const results = data.quoteResponse.result;

        const tbody = document.querySelector("#marketTable tbody");
        tbody.innerHTML = "";

        results.forEach(asset=>{
            const row = document.createElement("tr");

            const changeClass = asset.regularMarketChange >= 0 ? "green" : "red";

            row.innerHTML = `
                <td>${asset.symbol}</td>
                <td>${asset.shortName || asset.longName || "-"}</td>
                <td>$${asset.regularMarketPrice.toFixed(2)}</td>
                <td class="${changeClass}">
                    ${asset.regularMarketChange.toFixed(2)}
                </td>
                <td class="${changeClass}">
                    ${asset.regularMarketChangePercent.toFixed(2)}%
                </td>
            `;

            tbody.appendChild(row);
        });

    }catch(error){
        console.error("Error fetching data:", error);
    }
}

// Initial load
fetchPrices();

// Refresh every 10 seconds
setInterval(fetchPrices, 10000);

</script>

</body>
</html>
