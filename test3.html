<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>⚡ XLODON BET - Live Football Betting Platform</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Poppins', sans-serif;
        }

        :root {
            --primary: #00ff9d;
            --primary-dark: #00cc7d;
            --secondary: #ff9800;
            --danger: #ff4757;
            --success: #4caf50;
            --warning: #ffc107;
            --bg: #0a0f1a;
            --bg-gradient: linear-gradient(135deg, #0a0f1a 0%, #0f172a 100%);
            --surface: rgba(17, 24, 39, 0.95);
            --surface-light: #1a2332;
            --text: #ffffff;
            --text-dim: #94a3b8;
            --border: #1e293b;
            --glow: 0 0 20px rgba(0, 255, 157, 0.3);
        }

        body {
            background: var(--bg-gradient);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 80px;
        }

        /* Header */
        .header {
            background: rgba(17, 24, 39, 0.95);
            backdrop-filter: blur(10px);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo a {
            text-decoration: none;
            color: inherit;
        }

        .balance-display {
            background: rgba(0, 255, 157, 0.1);
            padding: 8px 16px;
            border-radius: 40px;
            border: 1px solid var(--primary);
            color: var(--primary);
            font-weight: 700;
            backdrop-filter: blur(5px);
        }

        /* Stats Banner */
        .stats-banner {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .stat-card {
            background: rgba(17, 24, 39, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 16px;
            text-align: center;
            border: 1px solid rgba(0, 255, 157, 0.2);
            transition: all 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            border-color: var(--primary);
            box-shadow: var(--glow);
        }

        .stat-value {
            font-size: 32px;
            font-weight: 800;
            color: var(--primary);
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-dim);
            margin-top: 5px;
        }

        /* Main Layout */
        .main-layout {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 20px;
            max-width: 1600px;
            margin: 20px auto;
            padding: 0 20px;
        }

        @media (max-width: 1000px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
        }

        /* Matches Section */
        .matches-section {
            background: rgba(17, 24, 39, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 20px;
            border: 1px solid rgba(0, 255, 157, 0.2);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .live-counter {
            background: var(--danger);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .filter-tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 20px;
            background: rgba(26, 35, 50, 0.8);
            border: 1px solid var(--border);
            border-radius: 30px;
            color: var(--text-dim);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-btn.active {
            background: var(--primary);
            color: #000;
            border-color: var(--primary);
        }

        /* Match Cards */
        .matches-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-height: 650px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .matches-grid::-webkit-scrollbar {
            width: 6px;
        }

        .matches-grid::-webkit-scrollbar-track {
            background: var(--surface-light);
            border-radius: 10px;
        }

        .matches-grid::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }

        .match-card {
            background: rgba(26, 35, 50, 0.9);
            border-radius: 20px;
            padding: 16px;
            border: 1px solid var(--border);
            transition: all 0.3s;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .match-card:hover {
            transform: translateX(5px);
            border-color: var(--primary);
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 12px;
        }

        .league-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .league-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--primary);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        .live-badge {
            background: var(--danger);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: bold;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .teams {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 15px 0;
        }

        .team {
            flex: 1;
            text-align: center;
        }

        .team-name {
            font-weight: 700;
            font-size: 16px;
        }

        .score {
            font-size: 28px;
            font-weight: 800;
            color: var(--primary);
            margin: 0 20px;
        }

        .match-time {
            font-size: 11px;
            color: var(--text-dim);
            text-align: center;
            margin-top: 5px;
        }

        .odds-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .odd-btn {
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid var(--border);
        }

        .odd-btn:hover {
            background: var(--primary);
            transform: scale(1.05);
        }

        .odd-btn:hover .odd-value {
            color: #000;
        }

        .odd-label {
            font-size: 11px;
            color: var(--text-dim);
        }

        .odd-value {
            font-weight: 700;
            font-size: 16px;
            color: var(--primary);
        }

        /* Betslip */
        .betslip-section {
            background: rgba(17, 24, 39, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 20px;
            border: 2px solid var(--primary);
            position: sticky;
            top: 100px;
            box-shadow: var(--glow);
        }

        .betslip-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .betslip-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .betslip-tab {
            flex: 1;
            padding: 10px;
            background: rgba(26, 35, 50, 0.8);
            border: none;
            border-radius: 30px;
            color: var(--text);
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
        }

        .betslip-tab.active {
            background: var(--primary);
            color: #000;
        }

        .betslip-items {
            max-height: 280px;
            overflow-y: auto;
            margin: 15px 0;
        }

        .betslip-item {
            background: rgba(26, 35, 50, 0.8);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
        }

        .remove-bet {
            color: var(--danger);
            cursor: pointer;
            float: right;
            font-weight: bold;
        }

        .bet-input-group {
            background: rgba(26, 35, 50, 0.8);
            border-radius: 40px;
            padding: 5px 16px;
            display: flex;
            align-items: center;
            margin: 15px 0;
        }

        .bet-input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 12px 0;
            color: white;
            font-size: 16px;
            outline: none;
        }

        .place-bet-btn {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            border: none;
            border-radius: 40px;
            color: #000;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .place-bet-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .place-bet-btn:hover:not(:disabled) {
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(0, 255, 157, 0.5);
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(17, 24, 39, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-around;
            padding: 10px 16px;
            border-top: 2px solid var(--primary);
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--text-dim);
            font-size: 11px;
            gap: 4px;
            transition: color 0.2s;
        }

        .nav-item i { font-size: 22px; }
        .nav-item.active { color: var(--primary); }
        .nav-item:hover { color: var(--primary); }

        /* Toast */
        .toast-container {
            position: fixed;
            bottom: 80px;
            left: 20px;
            right: 20px;
            z-index: 1100;
        }

        .toast {
            background: rgba(17, 24, 39, 0.95);
            backdrop-filter: blur(10px);
            padding: 12px 16px;
            border-radius: 40px;
            border-left: 4px solid var(--primary);
            margin-bottom: 8px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .loading-spinner {
            border: 3px solid var(--surface-light);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 60px;
            color: var(--text-dim);
        }

        .empty-state i {
            font-size: 48px;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        .api-status {
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 20px;
            background: rgba(0,0,0,0.5);
        }

        .api-status.live { background: var(--success); color: #000; }
        .api-status.demo { background: var(--warning); color: #000; }
        .api-status.error { background: var(--danger); color: #000; }
    </style>
</head>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // API Configuration - Multiple Sources
        const APIS = {
            isports: {
                name: 'iSports',
                url: 'https://api.isportsapi.com/sport/football/livescores',
                key: 'XCFf1j8RZDWxDs6m',
                active: true
            },
            sportsrc: {
                name: 'SportSRC',
                url: 'https://sportsrc.com/api/soccer/live',
                key: null,
                active: true
            }
        };

        // Premium Live Matches Data (Fallback)
        const PREMIUM_MATCHES = [
            { id: "live_1", leagueId: "39", leagueName: "🏴 Premier League", homeTeam: "Manchester United", awayTeam: "Arsenal", homeScore: 2, awayScore: 1, status: "2H", minute: "78", isLive: true, odds: { home: 2.10, draw: 3.40, away: 3.20 } },
            { id: "live_2", leagueId: "140", leagueName: "🇪🇸 La Liga", homeTeam: "Barcelona", awayTeam: "Real Madrid", homeScore: 1, awayScore: 1, status: "2H", minute: "65", isLive: true, odds: { home: 2.30, draw: 3.30, away: 2.90 } },
            { id: "live_3", leagueId: "78", leagueName: "🇩🇪 Bundesliga", homeTeam: "Bayern Munich", awayTeam: "Borussia Dortmund", homeScore: 0, awayScore: 0, status: "1H", minute: "23", isLive: true, odds: { home: 1.65, draw: 4.00, away: 4.50 } },
            { id: "up_1", leagueId: "135", leagueName: "🇮🇹 Serie A", homeTeam: "AC Milan", awayTeam: "Inter Milan", homeScore: null, awayScore: null, status: "NS", time: "20:45", isLive: false, odds: { home: 2.60, draw: 3.20, away: 2.70 } },
            { id: "up_2", leagueId: "61", leagueName: "🇫🇷 Ligue 1", homeTeam: "PSG", awayTeam: "Marseille", homeScore: null, awayScore: null, status: "NS", time: "21:00", isLive: false, odds: { home: 1.45, draw: 4.50, away: 6.00 } },
            { id: "up_3", leagueId: "39", leagueName: "🏴 Premier League", homeTeam: "Liverpool", awayTeam: "Chelsea", homeScore: null, awayScore: null, status: "NS", time: "17:30", isLive: false, odds: { home: 1.85, draw: 3.60, away: 3.90 } },
            { id: "live_4", leagueId: "140", leagueName: "🇪🇸 La Liga", homeTeam: "Atletico Madrid", awayTeam: "Sevilla", homeScore: 1, awayScore: 0, status: "2H", minute: "72", isLive: true, odds: { home: 1.80, draw: 3.40, away: 4.50 } },
            { id: "live_5", leagueId: "78", leagueName: "🇩🇪 Bundesliga", homeTeam: "RB Leipzig", awayTeam: "Bayer Leverkusen", homeScore: 2, awayScore: 2, status: "2H", minute: "85", isLive: true, odds: { home: 2.20, draw: 3.60, away: 2.80 } },
            { id: "up_4", leagueId: "135", leagueName: "🇮🇹 Serie A", homeTeam: "Juventus", awayTeam: "Roma", homeScore: null, awayScore: null, status: "NS", time: "19:00", isLive: false, odds: { home: 1.95, draw: 3.30, away: 4.20 } }
        ];

        // App State
        let currentUser = null;
        let balance = 0;
        let selectedBets = [];
        let betType = 'single';
        let matches = [];
        let currentFilter = 'all';
        let currentApiSource = 'premium';

        // Auth Check
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                currentUser = user;
                await loadBalance();
                await fetchAllMatches();
                await loadOpenBets();
                await loadHistory();
                setupListeners();
                startAutoRefresh();
                showToast('🎉 Welcome to Xlodon Bet! Live matches loaded', 'success');
            } else {
                window.location.href = 'https://xcrazybet.github.io/millioner/login.html';
            }
        });

        // Fetch Matches from Multiple APIs
        async function fetchAllMatches() {
            const container = document.getElementById('matchesContainer');
            container.innerHTML = '<div class="loading-spinner"></div><p style="text-align:center;">🌐 Fetching live matches from global sources...</p>';
            
            let apiData = null;
            
            // Try iSports API first
            try {
                const response = await fetch(`${APIS.isports.url}?apikey=${APIS.isports.key}`, {
                    method: 'GET',
                    mode: 'cors',
                    headers: { 'Content-Type': 'application/json' }
                });
                if (response.ok) {
                    const data = await response.json();
                    if (data && (data.status === true || data.code === 200)) {
                        apiData = data;
                        currentApiSource = 'iSports';
                        updateApiStatus('iSports API', 'live');
                    }
                }
            } catch (e) {
                console.log('iSports API error:', e);
            }
            
            // Try SportSRC if iSports failed
            if (!apiData) {
                try {
                    const response = await fetch(APIS.sportsrc.url, { method: 'GET', mode: 'cors' });
                    if (response.ok) {
                        const data = await response.json();
                        if (data && data.data) {
                            apiData = data;
                            currentApiSource = 'SportSRC';
                            updateApiStatus('SportSRC', 'live');
                        }
                    }
                } catch (e) {
                    console.log('SportSRC error:', e);
                }
            }
            
            // Use premium mock data if all APIs fail
            if (!apiData) {
                matches = JSON.parse(JSON.stringify(PREMIUM_MATCHES));
                currentApiSource = 'Premium';
                updateApiStatus('Premium Demo Data', 'demo');
                showToast('Using premium demo data with live matches', 'info');
            } else {
                parseApiData(apiData);
            }
            
            updateStats();
            displayMatches();
            
            const liveCount = matches.filter(m => m.isLive).length;
            document.getElementById('lastUpdate').innerHTML = `🔄 Last update: ${new Date().toLocaleTimeString()} | ${liveCount} LIVE matches | Source: ${currentApiSource}`;
        }

        function parseApiData(data) {
            let rawMatches = [];
            if (data.data && Array.isArray(data.data)) rawMatches = data.data;
            else if (data.matches && Array.isArray(data.matches)) rawMatches = data.matches;
            else if (Array.isArray(data)) rawMatches = data;
            
            if (rawMatches.length === 0) {
                matches = JSON.parse(JSON.stringify(PREMIUM_MATCHES));
                return;
            }
            
            matches = rawMatches.slice(0, 30).map((m, idx) => {
                const isLiveStatus = (m.status === "1H" || m.status === "2H" || m.status === "HT" || m.live === true);
                const minute = m.minute || m.time || (isLiveStatus ? Math.floor(Math.random() * 90) + 1 : null);
                
                return {
                    id: m.match_id || m.id || `match_${idx}`,
                    leagueId: m.league_id ? m.league_id.toString() : (m.league?.id?.toString() || "0"),
                    leagueName: m.league_name || m.league?.name || "⚽ Football",
                    homeTeam: m.home_team_name || m.home_team?.name || m.home_name || "Home",
                    awayTeam: m.away_team_name || m.away_team?.name || m.away_name || "Away",
                    homeScore: m.home_score !== undefined ? m.home_score : (m.score?.home ?? (isLiveStatus ? Math.floor(Math.random() * 3) : null)),
                    awayScore: m.away_score !== undefined ? m.away_score : (m.score?.away ?? (isLiveStatus ? Math.floor(Math.random() * 3) : null)),
                    status: m.status || (isLiveStatus ? "LIVE" : "NS"),
                    minute: minute,
                    time: m.time || (isLiveStatus ? `LIVE ${minute}'` : "Scheduled"),
                    isLive: isLiveStatus,
                    odds: {
                        home: parseFloat(m.odds_home || m.odds?.home || (Math.random() * 2 + 1.5).toFixed(2)),
                        draw: parseFloat(m.odds_draw || m.odds?.draw || (Math.random() * 1.5 + 2.8).toFixed(2)),
                        away: parseFloat(m.odds_away || m.odds?.away || (Math.random() * 2 + 2.5).toFixed(2))
                    }
                };
            });
        }

        function updateApiStatus(source, status) {
            const statusEl = document.getElementById('apiStatus');
            const detailEl = document.getElementById('apiDetailStatus');
            if (status === 'live') {
                statusEl.innerHTML = '🟢 LIVE';
                detailEl.innerHTML = `📡 Connected to ${source} | Real-time data`;
                detailEl.className = 'api-status live';
            } else {
                statusEl.innerHTML = '🟡 DEMO';
                detailEl.innerHTML = `📊 ${source} | Live match simulation`;
                detailEl.className = 'api-status demo';
            }
        }

        function updateStats() {
            const liveMatches = matches.filter(m => m.isLive).length;
            document.getElementById('liveMatchesCount').textContent = liveMatches;
            document.getElementById('totalMatchesCount').textContent = matches.length;
        }

        function displayMatches() {
            const container = document.getElementById('matchesContainer');
            let filtered = matches;
            
            if (currentFilter === 'live') {
                filtered = matches.filter(m => m.isLive);
            } else if (currentFilter === 'upcoming') {
                filtered = matches.filter(m => !m.isLive);
            }
            
            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty-state"><i class="fas fa-futbol"></i><br>No matches found</div>';
                return;
            }
            
            container.innerHTML = filtered.map(match => `
                <div class="match-card">
                    <div class="match-header">
                        <div class="league-info">
                            <span class="league-icon">⚽</span>
                            <span>${match.leagueName}</span>
                        </div>
                        ${match.isLive ? `<span class="live-badge">🔴 LIVE ${match.minute ? match.minute + "'" : ''}</span>` : `<span>${match.time}</span>`}
                    </div>
                    <div class="teams">
                        <div class="team">
                            <div class="team-name">${match.homeTeam}</div>
                        </div>
                        <div class="score">${match.homeScore !== null ? match.homeScore : '-'} : ${match.awayScore !== null ? match.awayScore : '-'}</div>
                        <div class="team">
                            <div class="team-name">${match.awayTeam}</div>
                        </div>
                    </div>
                    <div class="odds-grid">
                        <div class="odd-btn" onclick="addToBetSlip('${match.id}', '1', ${match.odds.home}, '1', 'Match Winner')">
                            <div class="odd-label">HOME</div>
                            <div class="odd-value">${match.odds.home.toFixed(2)}</div>
                        </div>
                        <div class="odd-btn" onclick="addToBetSlip('${match.id}', 'X', ${match.odds.draw}, 'X', 'Match Winner')">
                            <div class="odd-label">DRAW</div>
                            <div class="odd-value">${match.odds.draw.toFixed(2)}</div>
                        </div>
                        <div class="odd-btn" onclick="addToBetSlip('${match.id}', '2', ${match.odds.away}, '2', 'Match Winner')">
                            <div class="odd-label">AWAY</div>
                            <div class="odd-value">${match.odds.away.toFixed(2)}</div>
                        </div>
                        <div class="odd-btn" onclick="addToBetSlip('${match.id}', 'Over 2.5', ${(match.odds.home + match.odds.away) / 2}, 'O2.5', 'Total Goals')">
                            <div class="odd-label">OVER 2.5</div>
                            <div class="odd-value">${((match.odds.home + match.odds.away) / 2).toFixed(2)}</div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function startAutoRefresh() {
            setInterval(() => {
                fetchAllMatches();
            }, 45000);
        }

        window.addToBetSlip = function(matchId, selection, odds, display, market) {
            const match = matches.find(m => m.id === matchId);
            if (!match) return;
            
            const bet = {
                matchId: match.id,
                matchName: `${match.homeTeam} vs ${match.awayTeam}`,
                market: market,
                selection: selection,
                display: display,
                odds: odds
            };
            
            if (betType === 'single') {
                selectedBets = [bet];
            } else {
                if (selectedBets.some(b => b.matchId === matchId)) {
                    showToast('Only one bet per match in ACCA', 'error');
                    return;
                }
                selectedBets.push(bet);
            }
            updateBetSlip();
            showToast(`✅ Added: ${bet.matchName} - ${display} @ ${odds.toFixed(2)}`, 'success');
        };

        function updateBetSlip() {
            const container = document.getElementById('betslipItems');
            const totalOddsSpan = document.getElementById('totalOdds');
            const potentialSpan = document.getElementById('potentialReturn');
            const placeBtn = document.getElementById('placeBetBtn');
            
            if (selectedBets.length === 0) {
                container.innerHTML = '<div class="empty-state"><i class="fas fa-hand-pointer"></i><p>Click on odds to add bets</p></div>';
                totalOddsSpan.textContent = '0.00';
                potentialSpan.textContent = '$0.00';
                placeBtn.disabled = true;
                return;
            }
            
            const totalOdds = selectedBets.reduce((acc, bet) => acc * bet.odds, 1);
            const betAmount = parseFloat(document.getElementById('betAmount').value) || 10;
            const potentialReturn = betAmount * totalOdds;
            
            totalOddsSpan.textContent = totalOdds.toFixed(2);
            potentialSpan.textContent = `$${potentialReturn.toFixed(2)}`;
            placeBtn.disabled = false;
            
            container.innerHTML = selectedBets.map((bet, index) => `
                <div class="betslip-item">
                    <div class="betslip-item-header">
                        <span><strong>${bet.matchName}</strong></span>
                        <span class="remove-bet" onclick="removeBet(${index})">✖</span>
                    </div>
                    <div style="font-size: 12px;">${bet.market} - ${bet.display}</div>
                    <div style="color: var(--primary); font-weight: bold;">${bet.odds.toFixed(2)}</div>
                </div>
            `).join('');
        }

        window.removeBet = function(index) {
            selectedBets.splice(index, 1);
            updateBetSlip();
        };

        function generateTicketNumber() {
            const date = new Date();
            return `TKT-${date.getFullYear()}${(date.getMonth()+1).toString().padStart(2,'0')}${date.getDate().toString().padStart(2,'0')}-${date.getHours().toString().padStart(2,'0')}${date.getMinutes().toString().padStart(2,'0')}${date.getSeconds().toString().padStart(2,'0')}-${Math.random().toString(36).substring(2, 6).toUpperCase()}`;
        }

        async function placeBet() {
            const betAmount = parseFloat(document.getElementById('betAmount').value);
            if (selectedBets.length === 0) { showToast('No bets selected', 'error'); return; }
            if (betAmount < 1 || betAmount > 5000) { showToast('Amount must be $1-$5000', 'error'); return; }
            if (betAmount > balance) { showToast('Insufficient funds', 'error'); return; }
            
            const totalOdds = selectedBets.reduce((acc, bet) => acc * bet.odds, 1);
            const ticketNumber = generateTicketNumber();
            
            try {
                const walletRef = db.collection("wallets").doc(currentUser.uid);
                await db.runTransaction(async (transaction) => {
                    const doc = await transaction.get(walletRef);
                    const newBalance = doc.data().balance - betAmount;
                    if (newBalance < 0) throw new Error('Insufficient funds');
                    transaction.update(walletRef, { balance: newBalance });
                });
                
                const betData = {
                    userId: currentUser.uid,
                    ticketNumber: ticketNumber,
                    selections: selectedBets,
                    stake: betAmount,
                    totalOdds: totalOdds,
                    potentialReturn: betAmount * totalOdds,
                    betType: betType,
                    status: 'pending',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    createdAtDate: new Date().toISOString(),
                    return: 0
                };
                await db.collection("football_bets").doc(ticketNumber).set(betData);
                balance -= betAmount;
                document.getElementById('balance').textContent = balance.toFixed(2);
                selectedBets = [];
                updateBetSlip();
                showToast(`✅ Bet placed! Ticket: ${ticketNumber}`, 'success');
                await loadOpenBets();
                await loadHistory();
            } catch (error) {
                showToast('Failed: ' + error.message, 'error');
            }
        }

        async function loadBalance() {
            try {
                const doc = await db.collection("wallets").doc(currentUser.uid).get();
                if (doc.exists) balance = doc.data().balance || 0;
                else { balance = 100; await db.collection("wallets").doc(currentUser.uid).set({ balance: 100 }); }
                document.getElementById('balance').textContent = balance.toFixed(2);
            } catch(e) { console.error(e); }
        }

        async function loadOpenBets() {
            try {
                const snapshot = await db.collection("football_bets").where("userId", "==", currentUser.uid).where("status", "==", "pending").get();
                document.getElementById('activeBetsCount').textContent = snapshot.size;
            } catch(e) { console.error(e); }
        }

        async function loadHistory() {
            try {
                const snapshot = await db.collection("football_bets").where("userId", "==", currentUser.uid).where("status", "in", ["won", "lost", "cashed_out"]).limit(10).get();
                const container = document.getElementById('historyContainer');
                if (snapshot.empty) { container.innerHTML = '<div class="empty-state"><i class="fas fa-history"></i><br>No betting history</div>'; return; }
                let html = '<div style="display: flex; flex-direction: column; gap: 10px;">';
                snapshot.forEach(doc => {
                    const bet = doc.data();
                    const returnAmount = bet.return || (bet.status === 'won' ? bet.stake * bet.totalOdds : 0);
                    html += `<div style="background: rgba(26,35,50,0.8); border-radius: 12px; padding: 12px; border-left: 4px solid ${bet.status === 'won' ? 'var(--success)' : bet.status === 'lost' ? 'var(--danger)' : 'var(--warning)'}">
                        <div style="display: flex; justify-content: space-between;"><span>${bet.ticketNumber.substring(0, 15)}</span><span style="background: ${bet.status === 'won' ? 'var(--success)' : bet.status === 'lost' ? 'var(--danger)' : 'var(--warning)'}; padding: 2px 8px; border-radius: 20px;">${bet.status.toUpperCase()}</span></div>
                        <div style="font-size: 12px;">${bet.selections.length} selections @ ${bet.totalOdds.toFixed(2)}</div>
                        <div>Stake: $${bet.stake.toFixed(2)} | Return: $${returnAmount.toFixed(2)}</div>
                    </div>`;
                });
                html += '</div>';
                container.innerHTML = html;
            } catch(e) { console.error(e); }
        }

        function setupListeners() {
            if (currentUser) {
                db.collection("wallets").doc(currentUser.uid).onSnapshot((doc) => {
                    if (doc.exists) { balance = doc.data().balance; document.getElementById('balance').textContent = balance.toFixed(2); }
                });
                db.collection("football_bets").where("userId", "==", currentUser.uid).onSnapshot(() => {
                    loadOpenBets();
                    loadHistory();
                });
            }
        }

        function showToast(message, type) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.style.borderLeftColor = type === 'success' ? 'var(--success)' : type === 'error' ? 'var(--danger)' : 'var(--primary)';
            toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-triangle' : 'fa-info-circle'}"></i> ${message}`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // Event Listeners
        document.getElementById('placeBetBtn').addEventListener('click', placeBet);
        document.getElementById('clearSlip').addEventListener('click', () => { selectedBets = []; updateBetSlip(); });
        document.getElementById('betAmount').addEventListener('input', updateBetSlip);
        
        document.querySelectorAll('.betslip-tab').forEach(btn => btn.addEventListener('click', () => {
            document.querySelectorAll('.betslip-tab').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            betType = btn.dataset.type;
            selectedBets = [];
            updateBetSlip();
        }));
        
        document.querySelectorAll('.filter-btn').forEach(btn => btn.addEventListener('click', () => {
            document.querySelectorAll('.filter-btn').forEach(f => f.classList.remove('active'));
            btn.classList.add('active');
            currentFilter = btn.dataset.filter;
            displayMatches();
        }));
    </script>
</body>
</html>
