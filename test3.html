<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>My Bets - XLondon Bet</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary: #00ff9d;
            --danger: #ff4757;
            --success: #4caf50;
            --warning: #ff9800;
            --bg-dark: #0a0f1a;
            --bg-surface: #111827;
            --bg-surface-light: #1a2332;
            --text: #ffffff;
            --text-dim: #94a3b8;
        }
        
        body {
            background: var(--bg-dark);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding-bottom: 70px;
        }
        
        .header {
            background: var(--bg-surface);
            padding: 12px 16px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 2px solid var(--primary);
        }
        
        .bet-card {
            background: var(--bg-surface);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            border-left: 4px solid;
            transition: all 0.3s;
        }
        
        .bet-card.pending { border-left-color: var(--warning); }
        .bet-card.won { border-left-color: var(--success); }
        .bet-card.lost { border-left-color: var(--danger); }
        .bet-card.cashed_out { border-left-color: var(--primary); }
        
        .bet-card:hover {
            transform: translateX(5px);
            background: var(--bg-surface-light);
        }
        
        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
        }
        
        .status-pending { background: var(--warning); color: #000; }
        .status-won { background: var(--success); color: #000; }
        .status-lost { background: var(--danger); color: #000; }
        .status-cashed_out { background: var(--primary); color: #000; }
        
        .filter-btn {
            padding: 8px 20px;
            background: var(--bg-surface);
            border: none;
            border-radius: 30px;
            color: var(--text-dim);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .filter-btn.active {
            background: var(--primary);
            color: #000;
        }
        
        .mobile-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-surface);
            display: flex;
            justify-content: space-around;
            padding: 8px 16px 12px;
            border-top: 2px solid var(--primary);
            z-index: 100;
        }
        
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--text-dim);
            font-size: 10px;
            gap: 4px;
        }
        
        .nav-item.active {
            color: var(--primary);
        }
        
        .nav-item i {
            font-size: 20px;
        }
        
        .loading-spinner {
            border: 3px solid var(--bg-surface-light);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 40px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .toast {
            position: fixed;
            bottom: 80px;
            left: 16px;
            right: 16px;
            background: var(--bg-surface);
            padding: 12px;
            border-radius: 12px;
            border-left: 4px solid var(--primary);
            z-index: 1000;
            animation: slideUp 0.3s ease;
        }
        
        @keyframes slideUp {
            from {
                transform: translateY(100%);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        .stat-card {
            background: var(--bg-surface);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary);
        }
        
        .stat-label {
            font-size: 11px;
            color: var(--text-dim);
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold" style="color: var(--primary);">
                <i class="fas fa-ticket-alt mr-2"></i>My Bets
            </h1>
            <div class="text-right">
                <div class="text-xs text-gray-400">Balance</div>
                <div class="text-xl font-bold" style="color: var(--primary);" id="balance">$0.00</div>
            </div>
        </div>
    </header>
    
    <main class="container mx-auto px-4 py-4">
        <!-- Statistics Cards -->
        <div class="grid grid-cols-4 gap-2 mb-6">
            <div class="stat-card">
                <div class="stat-value" id="totalBets">0</div>
                <div class="stat-label">Total</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="wonBets" style="color: var(--success);">0</div>
                <div class="stat-label">Won</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="lostBets" style="color: var(--danger);">0</div>
                <div class="stat-label">Lost</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="pendingBets" style="color: var(--warning);">0</div>
                <div class="stat-label">Pending</div>
            </div>
        </div>
        
        <!-- Filter Buttons -->
        <div class="flex gap-2 mb-4 overflow-x-auto pb-2">
            <button onclick="filterBets('all')" class="filter-btn active" data-filter="all">ALL</button>
            <button onclick="filterBets('pending')" class="filter-btn" data-filter="pending">PENDING</button>
            <button onclick="filterBets('won')" class="filter-btn" data-filter="won">WON</button>
            <button onclick="filterBets('lost')" class="filter-btn" data-filter="lost">LOST</button>
            <button onclick="filterBets('cashed_out')" class="filter-btn" data-filter="cashed_out">CASHED</button>
        </div>
        
        <!-- Bets Container -->
        <div id="betsContainer">
            <div class="loading-spinner"></div>
            <div class="text-center text-gray-400">Loading your bets...</div>
        </div>
    </main>
    
    <!-- Mobile Navigation -->
    <nav class="mobile-nav">
        <a href="betting.html" class="nav-item">
            <i class="fas fa-futbol"></i>
            <span>Football</span>
        </a>
        <a href="bets.html" class="nav-item active">
            <i class="fas fa-ticket-alt"></i>
            <span>My Bets</span>
        </a>
        <a href="index.html" class="nav-item">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>
        <a href="#" class="nav-item">
            <i class="fas fa-chart-line"></i>
            <span>Stats</span>
        </a>
        <a href="dashboard.html" class="nav-item">
            <i class="fas fa-wallet"></i>
            <span>Wallet</span>
        </a>
    </nav>
    
    <div id="toastContainer"></div>
    
    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        
        let allBets = [];
        let currentFilter = 'all';
        let userBalance = 0;
        
        // Auth Check
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                await loadBalance();
                await loadBets();
                setupRealtimeListener();
            } else {
                window.location.href = 'login.html';
            }
        });
        
        // Load Balance
        async function loadBalance() {
            try {
                const doc = await db.collection('wallets').doc(auth.currentUser.uid).get();
                if (doc.exists) {
                    userBalance = doc.data().balance || 0;
                    document.getElementById('balance').textContent = `$${userBalance.toFixed(2)}`;
                }
            } catch (error) {
                console.error('Balance error:', error);
            }
        }
        
        // Load Bets
        async function loadBets() {
            const container = document.getElementById('betsContainer');
            container.innerHTML = '<div class="loading-spinner"></div>';
            
            try {
                const snapshot = await db.collection('bets')
                    .where('userId', '==', auth.currentUser.uid)
                    .orderBy('createdAt', 'desc')
                    .limit(100)
                    .get();
                
                allBets = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    allBets.push({
                        id: doc.id,
                        ...data,
                        createdAtDate: data.createdAt?.toDate() || new Date()
                    });
                });
                
                updateStats();
                filterBets(currentFilter);
                
            } catch (error) {
                console.error('Load bets error:', error);
                container.innerHTML = `
                    <div class="text-center py-8 text-gray-400">
                        <i class="fas fa-exclamation-circle text-4xl mb-2"></i>
                        <p>Failed to load bets</p>
                        <button onclick="loadBets()" class="mt-4 px-4 py-2 rounded-lg" style="background: var(--primary); color: #000;">RETRY</button>
                    </div>
                `;
            }
        }
        
        // Setup Real-time Listener
        function setupRealtimeListener() {
            db.collection('bets')
                .where('userId', '==', auth.currentUser.uid)
                .onSnapshot((snapshot) => {
                    console.log('Real-time update received');
                    loadBets();
                    loadBalance();
                });
        }
        
        // Update Statistics
        function updateStats() {
            const total = allBets.length;
            const won = allBets.filter(b => b.status === 'won').length;
            const lost = allBets.filter(b => b.status === 'lost').length;
            const pending = allBets.filter(b => b.status === 'pending').length;
            
            document.getElementById('totalBets').textContent = total;
            document.getElementById('wonBets').textContent = won;
            document.getElementById('lostBets').textContent = lost;
            document.getElementById('pendingBets').textContent = pending;
        }
        
        // Filter Bets
        function filterBets(filter) {
            currentFilter = filter;
            
            // Update active button
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.filter === filter) {
                    btn.classList.add('active');
                }
            });
            
            let filtered = filter === 'all' ? allBets : allBets.filter(b => b.status === filter);
            displayBets(filtered);
        }
        
        // Display Bets
        function displayBets(bets) {
            const container = document.getElementById('betsContainer');
            
            if (bets.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-gray-400">
                        <i class="fas fa-inbox text-5xl mb-3"></i>
                        <p>No ${currentFilter === 'all' ? '' : currentFilter} bets found</p>
                        <a href="betting.html" class="inline-block mt-4 px-6 py-2 rounded-lg" style="background: var(--primary); color: #000;">PLACE A BET</a>
                    </div>
                `;
                return;
            }
            
            let html = '';
            
            bets.forEach(bet => {
                const selections = bet.selections || [];
                const selectionsHtml = selections.map(s => `
                    <div class="flex justify-between items-center py-2 border-b border-gray-800">
                        <div>
                            <div class="font-semibold text-sm">${s.teamName || 'Unknown'}</div>
                            <div class="text-xs text-gray-400">${s.selection || 'Selection'}</div>
                        </div>
                        <div style="color: var(--primary); font-weight: bold;">${s.odds?.toFixed(2) || '0.00'}</div>
                    </div>
                `).join('');
                
                const isWon = bet.status === 'won';
                const isLost = bet.status === 'lost';
                const isPending = bet.status === 'pending';
                const isCashedOut = bet.status === 'cashed_out';
                
                let returnAmount = 0;
                if (isWon) returnAmount = bet.potentialWin || 0;
                if (isCashedOut) returnAmount = bet.cashOutValue || 0;
                
                html += `
                    <div class="bet-card ${bet.status || 'pending'}">
                        <div class="flex justify-between items-start mb-3">
                            <div>
                                <span class="text-xs text-gray-400">#${bet.id.substring(0, 12)}</span>
                                <div class="text-xs text-gray-400 mt-1">
                                    ${bet.createdAtDate.toLocaleString()}
                                </div>
                            </div>
                            <span class="status-badge status-${bet.status || 'pending'}">
                                ${(bet.status || 'PENDING').toUpperCase()}
                            </span>
                        </div>
                        
                        <div class="mb-3">
                            ${selectionsHtml}
                        </div>
                        
                        <div class="flex justify-between items-center pt-2 border-t border-gray-800">
                            <div>
                                <div class="text-xs text-gray-400">Bet Type</div>
                                <div class="text-sm font-semibold">${(bet.betType || 'single').toUpperCase()}</div>
                            </div>
                            <div class="text-center">
                                <div class="text-xs text-gray-400">Stake</div>
                                <div class="font-bold">$${(bet.stake || 0).toFixed(2)}</div>
                            </div>
                            <div class="text-right">
                                <div class="text-xs text-gray-400">${isWon ? 'Won' : isCashedOut ? 'Cashed Out' : 'Potential'}</div>
                                <div class="font-bold" style="color: ${isWon ? 'var(--success)' : isLost ? 'var(--danger)' : 'var(--primary)'}">
                                    ${isWon || isCashedOut ? '+' : ''}$${returnAmount.toFixed(2)}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }
        
        // Show Toast
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast';
            
            const colors = {
                success: '#4caf50',
                error: '#ff4757',
                warning: '#ff9800',
                info: '#00ff9d'
            };
            
            toast.style.borderLeftColor = colors[type] || colors.info;
            toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle'} mr-2"></i>${message}`;
            
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
    </script>
</body>
</html>
