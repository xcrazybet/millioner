<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XQuantum Terminal | Live TradingView Feed</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #020617; color: #f1f5f9; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .tradingview-widget-container { height: 100% !important; width: 100% !important; }
    </style>
</head>
<body class="h-screen flex flex-col p-4 gap-4">

    <header class="h-16 glass rounded-2xl flex items-center justify-between px-8">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-cyan-500 rounded-xl flex items-center justify-center shadow-lg shadow-cyan-500/20">
                <i class="fas fa-chart-line text-white"></i>
            </div>
            <h1 class="text-xl font-black tracking-tighter">X<span class="text-cyan-400">QUANTUM</span> LIVE</h1>
        </div>
        <div class="flex items-center gap-6">
            <div class="hidden md:block text-right">
                <p class="text-[10px] text-slate-500 font-bold uppercase">Data Source</p>
                <p class="text-xs font-mono text-cyan-400">TradingView Real-Time</p>
            </div>
            <div class="h-8 w-[1px] bg-slate-800"></div>
            <p id="live-clock" class="font-mono text-sm text-slate-400">00:00:00</p>
        </div>
    </header>

    <main class="flex-1 grid grid-cols-12 gap-4 overflow-hidden">
        
        <aside class="col-span-12 lg:col-span-4 flex flex-col gap-4 overflow-y-auto pr-2">
            
            <div class="glass rounded-2xl p-1 h-32 overflow-hidden border border-slate-800 hover:border-cyan-500/50 transition">
                <div class="tradingview-widget-container">
                    <div class="tradingview-widget-container__widget"></div>
                    <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-mini-symbol-overview.js" async>
                    {
                    "symbol": "FX:EURUSD",
                    "width": "100%",
                    "height": "100%",
                    "locale": "en",
                    "dateRange": "12M",
                    "colorTheme": "dark",
                    "isTransparent": true,
                    "autosize": true,
                    "largeChartUrl": ""
                    }
                    </script>
                </div>
            </div>

            <div class="glass rounded-2xl p-1 h-32 overflow-hidden border border-slate-800 hover:border-cyan-500/50 transition">
                <div class="tradingview-widget-container">
                    <div class="tradingview-widget-container__widget"></div>
                    <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-mini-symbol-overview.js" async>
                    {
                    "symbol": "BITSTAMP:BTCUSD",
                    "width": "100%",
                    "height": "100%",
                    "locale": "en",
                    "dateRange": "12M",
                    "colorTheme": "dark",
                    "isTransparent": true,
                    "autosize": true,
                    "largeChartUrl": ""
                    }
                    </script>
                </div>
            </div>

            <div class="glass rounded-2xl p-1 h-32 overflow-hidden border border-slate-800 hover:border-cyan-500/50 transition">
                <div class="tradingview-widget-container">
                    <div class="tradingview-widget-container__widget"></div>
                    <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-mini-symbol-overview.js" async>
                    {
                    "symbol": "OANDA:XAUUSD",
                    "width": "100%",
                    "height": "100%",
                    "locale": "en",
                    "dateRange": "12M",
                    "colorTheme": "dark",
                    "isTransparent": true,
                    "autosize": true,
                    "largeChartUrl": ""
                    }
                    </script>
                </div>
            </div>

        </aside>

        <section class="col-span-12 lg:col-span-8 glass rounded-2xl overflow-hidden border border-slate-800 relative">
            <div class="tradingview-widget-container">
                <div id="tradingview_adv"></div>
                <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
                <script type="text/javascript">
                new TradingView.widget({
                    "autosize": true,
                    "symbol": "FX:EURUSD",
                    "interval": "15",
                    "timezone": "Etc/UTC",
                    "theme": "dark",
                    "style": "1",
                    "locale": "en",
                    "toolbar_bg": "#0f172a",
                    "enable_publishing": false,
                    "hide_top_toolbar": false,
                    "hide_legend": false,
                    "save_image": false,
                    "container_id": "tradingview_adv"
                });
                </script>
            </div>
        </section>

    </main>

    <footer class="h-10 glass rounded-xl flex items-center px-4 overflow-hidden shrink-0 border border-slate-800">
        <div class="tradingview-widget-container">
            <div class="tradingview-widget-container__widget"></div>
            <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
            {
            "symbols": [
                {"proName": "FOREXCOM:SPX500", "title": "S&P 500"},
                {"proName": "FOREXCOM:NSX100", "title": "Nasdaq 100"},
                {"fx_symbol": "FX_IDC:EURUSD", "title": "EUR/USD"},
                {"fx_symbol": "FX_IDC:GBPUSD", "title": "GBP/USD"},
                {"fx_symbol": "FX_IDC:USDJPY", "title": "USD/JPY"}
            ],
            "showSymbolLogo": true,
            "colorTheme": "dark",
            "isTransparent": true,
            "displayMode": "adaptive",
            "locale": "en"
            }
            </script>
        </div>
    </footer>

    <script>
        // System Utilities
        setInterval(() => {
            document.getElementById('live-clock').innerText = new Date().toLocaleTimeString('en-GB');
        }, 1000);
    </script>
</body>
</html>
