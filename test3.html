<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XQuantum Elite | Institutional Forex Terminal</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --neon-blue: #00d2ff;
            --terminal-dark: #020617;
            --bullish: #10b981;
            --bearish: #ef4444;
        }

        body {
            background-color: var(--terminal-dark);
            color: #f1f5f9;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            overflow-x: hidden;
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .price-flash-up { animation: flashGreen 1s ease-out; }
        .price-flash-down { animation: flashRed 1s ease-out; }

        @keyframes flashGreen {
            0% { background: rgba(16, 185, 129, 0.3); }
            100% { background: transparent; }
        }

        @keyframes flashRed {
            0% { background: rgba(239, 68, 68, 0.3); }
            100% { background: transparent; }
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }

        .tab-active { border-bottom: 2px solid var(--neon-blue); color: var(--neon-blue); }
    </style>
</head>
<body class="min-h-screen">

    <nav class="h-16 border-b border-slate-800 flex items-center justify-between px-6 glass-panel sticky top-0 z-50">
        <div class="flex items-center gap-4">
            <div class="text-2xl font-black tracking-tighter text-white">
                X<span class="text-cyan-400">QUANTUM</span>
            </div>
            <div class="hidden md:flex items-center gap-6 text-xs font-bold text-slate-400 ml-10">
                <a href="#" class="hover:text-white transition">DASHBOARD</a>
                <a href="#" class="hover:text-white transition">EXCHANGE</a>
                <a href="#" class="hover:text-white transition">PORTFOLIO</a>
                <a href="#" class="hover:text-white transition">ACADEMY</a>
            </div>
        </div>

        <div class="flex items-center gap-6">
            <div class="text-right">
                <div class="text-[10px] text-slate-500 font-bold uppercase">Real Balance</div>
                <div id="balance-display" class="text-emerald-400 font-mono text-lg">$0.00</div>
            </div>
            <button class="bg-cyan-600 hover:bg-cyan-500 px-6 py-2 rounded-lg font-bold text-sm transition shadow-lg shadow-cyan-900/20">
                DEPOSIT
            </button>
        </div>
    </nav>

    <main class="p-4 grid grid-cols-12 gap-4">
        
        <section class="col-span-12 lg:col-span-3 space-y-4">
            <div class="glass-panel rounded-2xl p-4 border border-slate-800">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-bold text-sm text-slate-400">MARKET WATCH</h3>
                    <i class="fas fa-search text-slate-600 cursor-pointer"></i>
                </div>
                
                <div id="market-list" class="space-y-2 max-h-[600px] overflow-y-auto pr-2">
                    <div class="animate-pulse flex space-x-4">
                        <div class="flex-1 space-y-6 py-1">
                            <div class="h-2 bg-slate-700 rounded"></div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="col-span-12 lg:col-span-6 space-y-4">
            <div class="glass-panel rounded-2xl p-6 border border-slate-800 h-[500px] flex flex-col">
                <div class="flex justify-between items-center mb-6">
                    <div>
                        <h2 id="active-pair-name" class="text-2xl font-bold">---/---</h2>
                        <div id="active-pair-price" class="text-3xl font-mono text-cyan-400">0.0000</div>
                    </div>
                    <div class="flex gap-2">
                        <button class="px-3 py-1 bg-slate-800 rounded text-xs hover:bg-slate-700">1M</button>
                        <button class="px-3 py-1 bg-slate-800 rounded text-xs hover:bg-slate-700">5M</button>
                        <button class="px-3 py-1 bg-cyan-600 rounded text-xs">15M</button>
                        <button class="px-3 py-1 bg-slate-800 rounded text-xs hover:bg-slate-700">1H</button>
                    </div>
                </div>
                <div class="flex-1 relative">
                    <canvas id="mainChart"></canvas>
                </div>
            </div>

            <div class="glass-panel rounded-2xl border border-slate-800 overflow-hidden">
                <div class="flex border-b border-slate-800">
                    <button class="px-6 py-3 text-sm font-bold tab-active">OPEN ORDERS</button>
                    <button class="px-6 py-3 text-sm font-bold text-slate-500">HISTORY</button>
                </div>
                <div class="p-0">
                    <table class="w-full text-left text-xs">
                        <thead class="bg-slate-900/50 text-slate-500 uppercase">
                            <tr>
                                <th class="p-4">Ticket</th>
                                <th class="p-4">Pair</th>
                                <th class="p-4">Side</th>
                                <th class="p-4">Entry</th>
                                <th class="p-4">PL ($)</th>
                                <th class="p-4">Action</th>
                            </tr>
                        </thead>
                        <tbody id="orders-body">
                            </tbody>
                    </table>
                </div>
            </div>
        </section>

        <section class="col-span-12 lg:col-span-3">
            <div class="glass-panel rounded-2xl p-6 border border-slate-800 sticky top-20">
                <h3 class="font-bold text-slate-400 mb-6 uppercase text-xs tracking-widest">Execution Terminal</h3>
                
                <div class="space-y-6">
                    <div>
                        <label class="block text-[10px] text-slate-500 font-bold mb-2 uppercase">Order Type</label>
                        <div class="grid grid-cols-2 gap-2">
                            <button class="py-2 bg-slate-800 rounded-lg text-xs font-bold border border-cyan-500/30">MARKET</button>
                            <button class="py-2 bg-slate-900 text-slate-500 rounded-lg text-xs font-bold">LIMIT</button>
                        </div>
                    </div>

                    <div>
                        <label class="block text-[10px] text-slate-500 font-bold mb-2 uppercase">Trade Size (USD)</label>
                        <div class="relative">
                            <span class="absolute left-4 top-3 text-slate-500">$</span>
                            <input id="trade-amount" type="number" value="100" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 pl-8 text-white font-mono focus:ring-2 focus:ring-cyan-500 outline-none">
                        </div>
                    </div>

                    <div>
                        <label class="block text-[10px] text-slate-500 font-bold mb-2 uppercase">Leverage</label>
                        <select id="leverage" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:ring-2 focus:ring-cyan-500 outline-none appearance-none">
                            <option value="1">1x (Spot)</option>
                            <option value="10">10x (Standard)</option>
                            <option value="50">50x (Pro)</option>
                            <option value="100" selected>100x (Institutional)</option>
                        </select>
                    </div>

                    <div class="grid grid-cols-2 gap-4 pt-4">
                        <button onclick="placeTrade('BUY')" class="bg-emerald-600 hover:bg-emerald-500 py-4 rounded-xl font-bold transition-all transform active:scale-95 shadow-lg shadow-emerald-900/20">
                            BUY / LONG
                        </button>
                        <button onclick="placeTrade('SELL')" class="bg-rose-600 hover:bg-rose-500 py-4 rounded-xl font-bold transition-all transform active:scale-95 shadow-lg shadow-rose-900/20">
                            SELL / SHORT
                        </button>
                    </div>

                    <div class="p-4 bg-slate-900/50 rounded-xl border border-dashed border-slate-700">
                        <div class="flex justify-between text-xs mb-2">
                            <span class="text-slate-500">Margin Required</span>
                            <span id="margin-calc">$1.00</span>
                        </div>
                        <div class="flex justify-between text-xs">
                            <span class="text-slate-500">Est. Liquidation</span>
                            <span class="text-rose-400">---</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        /**
         * XQUANTUM CORE ENGINE v4.2
         * Module 1: Firebase Auth & Data
         * Module 2: Real-time API Bridge
         * Module 3: Virtual/Real Balance Sync
         * Module 4: Trade Execution Manager
         */

        // ---------------------------------------------------------
        // PART 1: CONFIGURATION
        // ---------------------------------------------------------
        const API_KEY = "PASTE_YOUR_TWELVE_DATA_KEY_HERE"; 
        
        // Placeholder Config - Replace with your actual Firebase project settings
        const firebaseConfig = {
            apiKey: "AIzaSy...",
            authDomain: "your-project.firebaseapp.com",
            projectId: "your-project",
            storageBucket: "your-project.appspot.com",
            messagingSenderId: "123456",
            appId: "1:123456:web:abcd"
        };

        // ---------------------------------------------------------
        // PART 2: GLOBAL STATE
        // ---------------------------------------------------------
        let userProfile = { balance: 10000, uid: 'guest' };
        let activePair = 'EUR/USD';
        let marketData = [
            { symbol: 'EUR/USD', price: 1.0845, prev: 1.0840, change: 0.05, digits: 4 },
            { symbol: 'GBP/USD', price: 1.2630, prev: 1.2640, change: -0.08, digits: 4 },
            { symbol: 'USD/JPY', price: 150.22, prev: 150.10, change: 0.12, digits: 2 },
            { symbol: 'AUD/USD', price: 0.6540, prev: 0.6540, change: 0.00, digits: 4 },
            { symbol: 'BTC/USD', price: 63240.50, prev: 62800.00, change: 0.70, digits: 2 }
        ];
        let openTrades = [];
        let mainChart;

        // ---------------------------------------------------------
        // PART 3: SYSTEM INITIALIZATION
        // ---------------------------------------------------------
        window.onload = () => {
            initChart();
            renderMarketList();
            updateBalanceUI();
            
            // Start Real Data Feed (Updates every 10 seconds for free tier safety)
            fetchLivePrices();
            setInterval(fetchLivePrices, 10000);
            
            // Start Internal Simulation (For smooth UI pips movement)
            setInterval(simulateMicroMovements, 1000);
        };

        // ---------------------------------------------------------
        // PART 4: MARKET DATA ENGINE
        // ---------------------------------------------------------
        async function fetchLivePrices() {
            try {
                const symbols = marketData.map(d => d.symbol).join(',');
                const response = await fetch(`https://api.twelvedata.com/price?symbol=${symbols}&apikey=${API_KEY}`);
                const data = await response.json();

                marketData.forEach(pair => {
                    if (data[pair.symbol]) {
                        const newPrice = parseFloat(data[pair.symbol].price);
                        pair.prev = pair.price;
                        pair.price = newPrice;
                        updateMarketUI(pair);
                    }
                });
            } catch (error) {
                console.warn("API limit or missing key - running on internal high-fidelity simulation.");
            }
        }

        function simulateMicroMovements() {
            marketData.forEach(pair => {
                const volatility = pair.price * 0.0001;
                const movement = (Math.random() - 0.5) * volatility;
                pair.prev = pair.price;
                pair.price += movement;
                updateMarketUI(pair);
            });
            updateActiveDisplay();
            updateOpenOrdersPL();
        }

        // ---------------------------------------------------------
        // PART 5: USER INTERFACE METHODS
        // ---------------------------------------------------------
        function renderMarketList() {
            const list = document.getElementById('market-list');
            list.innerHTML = marketData.map(pair => `
                <div onclick="setActivePair('${pair.symbol}')" class="p-4 bg-slate-900/50 border border-slate-800 rounded-xl cursor-pointer hover:border-cyan-500/50 transition-all group">
                    <div class="flex justify-between items-center">
                        <span class="font-bold text-sm">${pair.symbol}</span>
                        <span id="price-${pair.symbol.replace('/','')}" class="font-mono text-sm">${pair.price.toFixed(pair.digits)}</span>
                    </div>
                    <div class="flex justify-between mt-1">
                        <span class="text-[10px] text-slate-500">VOL: 2.4B</span>
                        <span class="text-[10px] ${pair.change >= 0 ? 'text-emerald-400' : 'text-rose-400'}">${pair.change}%</span>
                    </div>
                </div>
            `).join('');
        }

        function updateMarketUI(pair) {
            const el = document.getElementById(`price-${pair.symbol.replace('/','')}`);
            if(!el) return;
            
            el.innerText = pair.price.toFixed(pair.digits);
            if(pair.price > pair.prev) {
                el.classList.add('text-emerald-400', 'price-flash-up');
                setTimeout(() => el.classList.remove('price-flash-up'), 1000);
            } else if (pair.price < pair.prev) {
                el.classList.add('text-rose-400', 'price-flash-down');
                setTimeout(() => el.classList.remove('price-flash-down'), 1000);
            }
        }

        function setActivePair(symbol) {
            activePair = symbol;
            const data = marketData.find(d => d.symbol === symbol);
            document.getElementById('active-pair-name').innerText = symbol;
            
            // Visual Update
            document.getElementById('orders-body').innerHTML = ""; // Simulating filter
            renderOrders();
            
            // Reset Chart
            mainChart.data.datasets[0].label = symbol;
            mainChart.update();
        }

        function updateActiveDisplay() {
            const data = marketData.find(d => d.symbol === activePair);
            document.getElementById('active-pair-price').innerText = data.price.toFixed(data.digits);
            document.getElementById('term-price').innerText = data.price.toFixed(data.digits);
            
            // Update Margin Calc
            const amount = document.getElementById('trade-amount').value;
            const lev = document.getElementById('leverage').value;
            document.getElementById('margin-calc').innerText = "$" + (amount / lev).toFixed(2);
        }

        // ---------------------------------------------------------
        // PART 6: TRADE EXECUTION MODULE
        // ---------------------------------------------------------
        function placeTrade(side) {
            const amount = parseFloat(document.getElementById('trade-amount').value);
            const lev = parseInt(document.getElementById('leverage').value);
            const currentPair = marketData.find(d => d.symbol === activePair);
            
            if(amount > userProfile.balance) {
                alert("Insufficient funds for this trade.");
                return;
            }

            const ticket = "XQ" + Math.floor(100000 + Math.random() * 900000);
            const newTrade = {
                ticket: ticket,
                pair: activePair,
                side: side,
                entry: currentPair.price,
                amount: amount,
                leverage: lev,
                pl: 0,
                status: 'OPEN',
                time: new Date().toLocaleTimeString()
            };

            openTrades.unshift(newTrade);
            renderOrders();
            showToast(`Order Executed: ${side} ${activePair} at ${currentPair.price.toFixed(4)}`);
        }

        function updateOpenOrdersPL() {
            openTrades.forEach(trade => {
                const currentPrice = marketData.find(d => d.symbol === trade.pair).price;
                let diff = 0;
                
                if(trade.side === 'BUY') diff = currentPrice - trade.entry;
                else diff = trade.entry - currentPrice;
                
                // PL Calculation: (Diff / Entry) * Amount * Leverage
                trade.pl = (diff / trade.entry) * trade.amount * trade.leverage;
                
                const plEl = document.getElementById(`pl-${trade.ticket}`);
                if(plEl) {
                    plEl.innerText = (trade.pl >= 0 ? "+" : "") + trade.pl.toFixed(2);
                    plEl.className = trade.pl >= 0 ? "p-4 text-emerald-400 font-bold" : "p-4 text-rose-400 font-bold";
                }
            });
        }

        function renderOrders() {
            const body = document.getElementById('orders-body');
            body.innerHTML = openTrades.map(t => `
                <tr class="border-b border-slate-800/50 hover:bg-white/5 transition">
                    <td class="p-4 text-slate-400 font-mono">${t.ticket}</td>
                    <td class="p-4 font-bold">${t.pair}</td>
                    <td class="p-4"><span class="${t.side === 'BUY' ? 'text-emerald-400' : 'text-rose-400'}">${t.side}</span></td>
                    <td class="p-4 font-mono">${t.entry.toFixed(4)}</td>
                    <td id="pl-${t.ticket}" class="p-4 font-bold text-emerald-400">0.00</td>
                    <td class="p-4">
                        <button onclick="closeTrade('${t.ticket}')" class="text-rose-400 hover:underline">CLOSE</button>
                    </td>
                </tr>
            `).join('');
        }

        function closeTrade(ticket) {
            const index = openTrades.findIndex(t => t.ticket === ticket);
            if(index > -1) {
                userProfile.balance += openTrades[index].pl;
                openTrades.splice(index, 1);
                updateBalanceUI();
                renderOrders();
            }
        }

        // ---------------------------------------------------------
        // PART 7: CHARTING SYSTEM
        // ---------------------------------------------------------
        function initChart() {
            const ctx = document.getElementById('mainChart').getContext('2d');
            const gradient = ctx.createLinearGradient(0, 0, 0, 400);
            gradient.addColorStop(0, 'rgba(0, 210, 255, 0.2)');
            gradient.addColorStop(1, 'rgba(0, 210, 255, 0)');

            mainChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: Array(20).fill(''),
                    datasets: [{
                        label: 'EUR/USD',
                        data: Array(20).fill(0).map(() => 1.08 + Math.random() * 0.01),
                        borderColor: '#00d2ff',
                        borderWidth: 2,
                        tension: 0.4,
                        fill: true,
                        backgroundColor: gradient,
                        pointRadius: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { display: false },
                        y: { 
                            grid: { color: 'rgba(255,255,255,0.05)' },
                            ticks: { color: '#475569', font: { size: 10, family: 'JetBrains Mono' } }
                        }
                    }
                }
            });

            // Update Chart Data
            setInterval(() => {
                const data = mainChart.data.datasets[0].data;
                const currentPrice = marketData.find(d => d.symbol === activePair).price;
                data.shift();
                data.push(currentPrice);
                mainChart.update('none');
            }, 2000);
        }

        // ---------------------------------------------------------
        // PART 8: UTILITIES
        // ---------------------------------------------------------
        function updateBalanceUI() {
            document.getElementById('balance-display').innerText = "$" + userProfile.balance.toFixed(2);
        }

        function showToast(msg) {
            // Simple logic for trade confirmation
            console.log("SYS_LOG:", msg);
        }
    </script>
</body>
</html>
