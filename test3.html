<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>My Bets | X London</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0A0C12; color: #E8EDF5; }
        :root { --bg-card: #141824; --border: #252A36; --primary: #2D7AFF; --success: #00D26A; --danger: #FF4757; --warning: #FFB800; --text-muted: #8E94A3; }
        .header { background: #0F1117; border-bottom: 1px solid var(--border); padding: 12px 0; position: sticky; top: 0; z-index: 100; }
        .header-content { max-width: 1200px; margin: 0 auto; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo { display: flex; align-items: center; gap: 10px; }
        .logo-icon { width: 40px; height: 40px; background: linear-gradient(135deg, var(--primary), #FF3B6F); border-radius: 12px; display: flex; align-items: center; justify-content: center; }
        .logo-text { font-size: 1.3rem; font-weight: 800; background: linear-gradient(135deg, #FFF, var(--primary)); background-clip: text; -webkit-background-clip: text; color: transparent; }
        .back-btn { background: var(--bg-card); border: 1px solid var(--border); padding: 8px 20px; border-radius: 40px; text-decoration: none; color: white; }
        .container { max-width: 1200px; margin: 0 auto; padding: 24px 20px; }
        .filter-tabs { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
        .filter-btn { background: var(--bg-card); border: 1px solid var(--border); padding: 10px 28px; border-radius: 40px; font-weight: 600; cursor: pointer; color: var(--text-muted); }
        .filter-btn.active { background: var(--primary); border-color: var(--primary); color: white; }
        .bets-grid { display: flex; flex-direction: column; gap: 16px; }
        .bet-card { background: var(--bg-card); border-radius: 20px; border: 1px solid var(--border); overflow: hidden; transition: all 0.2s; }
        .bet-card:hover { border-color: var(--primary); }
        .bet-header { padding: 14px 20px; background: rgba(0,0,0,0.2); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .bet-id { font-size: 0.7rem; color: var(--text-muted); font-family: monospace; }
        .bet-status { padding: 4px 12px; border-radius: 30px; font-size: 0.7rem; font-weight: 700; }
        .status-pending { background: rgba(255,184,0,0.2); color: var(--warning); }
        .status-won { background: rgba(0,210,106,0.2); color: var(--success); }
        .status-lost { background: rgba(255,71,87,0.2); color: var(--danger); }
        .bet-body { padding: 20px; }
        .selection-item { background: #1E2432; border-radius: 12px; padding: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .selection-match { font-weight: 700; font-size: 0.9rem; }
        .selection-detail { font-size: 0.75rem; color: var(--text-muted); }
        .selection-odds { font-weight: 800; color: var(--primary); }
        .bet-footer { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; background: rgba(0,0,0,0.15); }
        .bet-amount { font-size: 1.1rem; font-weight: 800; }
        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
        .stat-summary { background: var(--bg-card); border-radius: 20px; padding: 20px; margin-bottom: 24px; display: flex; justify-content: space-around; flex-wrap: wrap; gap: 20px; border: 1px solid var(--border); }
        .stat-item { text-align: center; }
        .stat-value { font-size: 1.8rem; font-weight: 800; }
        .stat-label { font-size: 0.7rem; color: var(--text-muted); margin-top: 4px; }
        @media (max-width: 768px) { .selection-item { flex-direction: column; align-items: flex-start; } .bet-header { flex-direction: column; align-items: flex-start; } }
    </style>
</head>
<body>

<header class="header">
    <div class="header-content">
        <div class="logo"><div class="logo-icon"><i class="fas fa-crown"></i></div><span class="logo-text">X LONDON</span></div>
        <a href="betting.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Betting</a>
    </div>
</header>

<div class="container">
    <div class="stat-summary" id="statsSummary">
        <div class="stat-item"><div class="stat-value" id="totalBets">0</div><div class="stat-label">Total Bets</div></div>
        <div class="stat-item"><div class="stat-value" id="openBets">0</div><div class="stat-label">Open Bets</div></div>
        <div class="stat-item"><div class="stat-value" id="wonBets">0</div><div class="stat-label">Won</div></div>
        <div class="stat-item"><div class="stat-value" id="lostBets">0</div><div class="stat-label">Lost</div></div>
        <div class="stat-item"><div class="stat-value" id="totalProfit" style="color: var(--success);">$0</div><div class="stat-label">Total Profit</div></div>
    </div>

    <div class="filter-tabs">
        <button class="filter-btn active" id="filterAll" onclick="filterBets('all')">ALL BETS</button>
        <button class="filter-btn" id="filterOpen" onclick="filterBets('pending')">OPEN</button>
        <button class="filter-btn" id="filterWon" onclick="filterBets('won')">WON</button>
        <button class="filter-btn" id="filterLost" onclick="filterBets('lost')">LOST</button>
        <button class="filter-btn" onclick="refreshBets()"><i class="fas fa-sync-alt"></i> Refresh</button>
    </div>

    <div id="betsContainer" class="bets-grid"><div class="empty-state"><i class="fas fa-spinner fa-spin"></i> Loading your bets...</div></div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
        authDomain: "x-bet-prod-jd.firebaseapp.com",
        projectId: "x-bet-prod-jd",
        storageBucket: "x-bet-prod-jd.firebasestorage.app",
        messagingSenderId: "499334334535",
        appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
    };
    let auth, db, currentUser = null, allBets = [], currentFilter = 'all';

    firebase.initializeApp(firebaseConfig);
    auth = firebase.auth();
    db = firebase.firestore();

    auth.onAuthStateChanged(async (user) => {
        if (!user) { window.location.href = 'login.html'; return; }
        currentUser = user;
        await loadAllBets();
        setInterval(() => loadAllBets(), 10000);
    });

    async function loadAllBets() {
        try {
            const betsSnap = await db.collection('bets').where('userId', '==', currentUser.uid).orderBy('createdAt', 'desc').get();
            allBets = betsSnap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            updateStatsSummary();
            filterBets(currentFilter);
        } catch(e) { console.error(e); }
    }

    function updateStatsSummary() {
        let total = allBets.length;
        let open = allBets.filter(b => b.status === 'pending').length;
        let won = allBets.filter(b => b.status === 'won').length;
        let lost = allBets.filter(b => b.status === 'lost').length;
        let profit = allBets.reduce((acc, b) => { if(b.status === 'won') return acc + (b.potentialWin - b.stake); if(b.status === 'lost') return acc - b.stake; return acc; }, 0);
        document.getElementById('totalBets').innerText = total;
        document.getElementById('openBets').innerText = open;
        document.getElementById('wonBets').innerText = won;
        document.getElementById('lostBets').innerText = lost;
        document.getElementById('totalProfit').innerHTML = `$${profit.toFixed(2)}`;
        document.getElementById('totalProfit').style.color = profit >= 0 ? 'var(--success)' : 'var(--danger)';
    }

    function filterBets(status) {
        currentFilter = status;
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        if(status === 'all') document.getElementById('filterAll').classList.add('active');
        else if(status === 'pending') document.getElementById('filterOpen').classList.add('active');
        else if(status === 'won') document.getElementById('filterWon').classList.add('active');
        else if(status === 'lost') document.getElementById('filterLost').classList.add('active');
        
        let filtered = status === 'all' ? allBets : allBets.filter(b => b.status === status);
        displayBets(filtered);
    }

    function displayBets(bets) {
        const container = document.getElementById('betsContainer');
        if(!bets || bets.length === 0) {
            container.innerHTML = `<div class="empty-state"><i class="fas fa-receipt"></i><p>No bets found</p><p style="font-size:0.8rem; margin-top:8px;">Place your first bet on the betting page!</p></div>`;
            return;
        }
        container.innerHTML = bets.map(bet => createBetCard(bet)).join('');
    }

    function getStatusBadge(status) {
        if(status === 'pending') return '<span class="bet-status status-pending"><i class="fas fa-clock"></i> PENDING</span>';
        if(status === 'won') return '<span class="bet-status status-won"><i class="fas fa-trophy"></i> WON</span>';
        return '<span class="bet-status status-lost"><i class="fas fa-times-circle"></i> LOST</span>';
    }

    function formatDate(timestamp) {
        if(!timestamp) return 'Just now';
        let date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
        return date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    }

    function createBetCard(bet) {
        let selections = bet.selections || [];
        let totalStake = bet.stake || 0;
        let totalOdds = bet.totalOdds || 1;
        let potentialWin = bet.potentialWin || 0;
        
        return `
            <div class="bet-card">
                <div class="bet-header">
                    <span class="bet-id"><i class="fas fa-hashtag"></i> ${bet.betId?.slice(-8) || bet.id?.slice(-8)}</span>
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <span style="font-size:0.7rem;">${formatDate(bet.createdAt)}</span>
                        ${getStatusBadge(bet.status)}
                    </div>
                </div>
                <div class="bet-body">
                    ${selections.map(sel => `
                        <div class="selection-item">
                            <div>
                                <div class="selection-match">${sel.homeTeam || 'Match'} vs ${sel.awayTeam || ''}</div>
                                <div class="selection-detail">${sel.selection} (${sel.betType})</div>
                            </div>
                            <div class="selection-odds">Odds: ${sel.odds}</div>
                        </div>
                    `).join('')}
                </div>
                <div class="bet-footer">
                    <div><span style="color:var(--text-muted);">Stake:</span> <span class="bet-amount">$${totalStake.toFixed(2)}</span></div>
                    <div><span style="color:var(--text-muted);">Total Odds:</span> <span style="font-weight:800;">${totalOdds}</span></div>
                    <div><span style="color:var(--text-muted);">Potential Win:</span> <span class="bet-amount" style="color:var(--success);">$${potentialWin.toFixed(2)}</span></div>
                </div>
            </div>
        `;
    }

    function refreshBets() { loadAllBets(); }
</script>
</body>
</html>
