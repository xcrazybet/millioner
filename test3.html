<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Live Gold Price</title>

<style>
body{
    background:#0f172a;
    color:white;
    font-family:Arial, sans-serif;
    text-align:center;
    padding:40px;
}

.price-box{
    background:#1e293b;
    padding:30px;
    border-radius:15px;
    width:300px;
    margin:0 auto;
    box-shadow:0 0 20px rgba(0,0,0,0.4);
}

h1{
    margin-bottom:20px;
    font-size:24px;
}

</style>
</head>
<body>

<div class="price-box">
    <h1>Gold Price (XAU/USD)</h1>
    
    <!-- TradingView Single Quote Widget -->
    <div class="tradingview-widget-container">
        <div class="tradingview-widget-container__widget"></div>
        <script type="text/javascript" 
                src="https://s3.tradingview.com/external-embedding/embed-widget-single-quote.js" 
                async>
        {
            "symbol": "COMEX:GC1!",
            "width": "100%",
            "colorTheme": "dark",
            "isTransparent": true,
            "locale": "en"
        }
        </script>
    </div>
</div>

</body>
</html>
