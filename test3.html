<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Live Market Prices</title>
<style>
body{
    background:#0f172a;
    font-family:Arial;
    color:white;
    padding:20px;
}
h1,h2{
    text-align:center;
}
table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}
th, td{
    padding:12px;
    text-align:center;
}
th{
    background:#1e293b;
}
tr{
    border-bottom:1px solid #1e293b;
}
.green{ color:#00ff88; }
.red{ color:#ff4d4d; }
.loading{
    text-align:center;
    margin-top:10px;
    font-size:16px;
}
</style>
</head>
<body>

<h1>Live Market Prices (USD)</h1>

<h2>Stocks</h2>
<div class="loading" id="loading-stocks">Loading stocks...</div>
<table id="stocksTable" style="display:none;">
<thead>
<tr>
<th>Symbol</th><th>Name</th><th>Price (USD)</th><th>Change</th><th>% Change</th>
</tr>
</thead>
<tbody></tbody>
</table>

<h2>Forex</h2>
<div class="loading" id="loading-forex">Loading forex...</div>
<table id="forexTable" style="display:none;">
<thead>
<tr>
<th>Symbol</th><th>Name</th><th>Price (USD)</th><th>Change</th><th>% Change</th>
</tr>
</thead>
<tbody></tbody>
</table>

<h2>Commodities</h2>
<div class="loading" id="loading-commodities">Loading commodities...</div>
<table id="commoditiesTable" style="display:none;">
<thead>
<tr>
<th>Symbol</th><th>Name</th><th>Price (USD)</th><th>Change</th><th>% Change</th>
</tr>
</thead>
<tbody></tbody>
</table>

<script>
// --- SYMBOLS ---
const stocks = ["AAPL","MSFT","GOOGL","AMZN","TSLA","META","NVDA","NFLX","JPM","V"];
const forex = ["EURUSD=X","GBPUSD=X","USDJPY=X","AUDUSD=X","USDCAD=X"];
const commodities = ["GC=F","SI=F","CL=F","NG=F","HG=F"];

// --- CORS Proxy ---
const proxy = "https://api.allorigins.win/raw?url=";

// --- FETCH FUNCTION ---
async function fetchPrices(symbolArray, tableId, loadingId){
    const tbody = document.querySelector(`#${tableId} tbody`);
    tbody.innerHTML = "";
    document.getElementById(loadingId).style.display = "block";
    document.getElementById(tableId).style.display = "none";

    try{
        const url = `https://query1.finance.yahoo.com/v7/finance/quote?symbols=${symbolArray.join(",")}`;
        const response = await fetch(proxy + encodeURIComponent(url));
        const data = await response.json();

        const results = data.quoteResponse.result;
        results.forEach(asset=>{
            const row = document.createElement("tr");
            const changeClass = asset.regularMarketChange >= 0 ? "green" : "red";

            row.innerHTML = `
                <td>${asset.symbol}</td>
                <td>${asset.shortName || asset.longName || "-"}</td>
                <td>$${asset.regularMarketPrice?.toFixed(4) || "-"}</td>
                <td class="${changeClass}">${asset.regularMarketChange?.toFixed(4) || "-"}</td>
                <td class="${changeClass}">${asset.regularMarketChangePercent?.toFixed(2) || "-"}%</td>
            `;
            tbody.appendChild(row);
        });

        document.getElementById(loadingId).style.display="none";
        document.getElementById(tableId).style.display="table";

    }catch(err){
        document.getElementById(loadingId).innerText="Error loading data.";
        console.error(err);
    }
}

// --- INITIAL LOAD ---
fetchPrices(stocks, "stocksTable", "loading-stocks");
fetchPrices(forex, "forexTable", "loading-forex");
fetchPrices(commodities, "commoditiesTable", "loading-commodities");

// --- AUTO REFRESH EVERY 10 SECONDS ---
setInterval(()=>fetchPrices(stocks, "stocksTable", "loading-stocks"), 10000);
setInterval(()=>fetchPrices(forex, "forexTable", "loading-forex"), 10000);
setInterval(()=>fetchPrices(commodities, "commoditiesTable", "loading-commodities"), 10000);
</script>

</body>
</html>
