<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Millionaire Live Hub | Real-Time Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Inter:wght@400;900&display=swap');
        body { font-family: 'Inter', sans-serif; background: #020617; color: #94a3b8; overflow-x: hidden; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .price-up { color: #22c55e; animation: flash-green 0.8s; }
        .price-down { color: #ef4444; animation: flash-red 0.8s; }
        @keyframes flash-green { from { background: rgba(34, 197, 94, 0.2); } to { background: transparent; } }
        @keyframes flash-red { from { background: rgba(239, 68, 68, 0.2); } to { background: transparent; } }
        
        /* Smooth scrolling ticker */
        .ticker-container { background: #0f172a; border-bottom: 1px solid #1e293b; overflow: hidden; white-space: nowrap; }
        .ticker-content { display: inline-block; animation: ticker-move 40s linear infinite; }
        @keyframes ticker-move { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
    </style>
</head>
<body x-data="millionaireSystem()" x-init="initSystem()">

    <div class="ticker-container py-2 text-[10px] font-bold uppercase tracking-tighter">
        <div class="ticker-content">
            <template x-for="w in winners">
                <span class="mx-6">
                    🏆 <span class="text-white" x-text="w.name"></span> WON 
                    <span class="text-yellow-400" x-text="'$' + w.amount"></span> IN 
                    <span class="text-blue-400" x-text="w.game"></span>
                </span>
            </template>
        </div>
    </div>

    <header class="sticky top-0 z-50 bg-[#020617]/80 backdrop-blur-md border-b border-slate-800 px-4 py-3">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="bg-blue-600 p-1.5 rounded-lg"><i class="fas fa-crown text-white text-xs"></i></div>
                <h1 class="text-lg font-black text-white tracking-tighter">OMNI<span class="text-blue-500">HUB</span></h1>
            </div>

            <div class="flex items-center gap-4">
                <div class="text-right">
                    <p class="text-[8px] font-black text-slate-500 uppercase">Live Wallet</p>
                    <p class="text-lg font-black text-yellow-400 mono">$<span x-text="wallet.toFixed(2)"></span></p>
                </div>
                <button @click="toggleMenu()" class="text-white text-xl">
                    <i class="fas fa-bars-staggered"></i>
                </button>
            </div>
        </div>
        
        <div x-show="menuOpen" class="bg-slate-900 border-t border-slate-800 p-4 space-y-4 font-bold text-xs uppercase">
            <a href="#" class="block text-white"><i class="fas fa-home mr-2 text-blue-500"></i> Home</a>
            <a href="#" class="block"><i class="fas fa-chart-pie mr-2 text-blue-500"></i> Dashboard</a>
            <a href="#" class="block"><i class="fas fa-wallet mr-2 text-blue-500"></i> Deposits</a>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-4">
        
        <section class="mb-10 bg-slate-900/50 rounded-2xl border border-slate-800 overflow-hidden">
            <div class="bg-slate-800/50 p-3 flex justify-between items-center border-b border-slate-800">
                <h2 class="text-[10px] font-black uppercase tracking-widest text-white">Live Global Liquidity</h2>
                <span class="text-[9px] text-green-500 font-bold animate-pulse">● LIVE DATA</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="text-[9px] uppercase text-slate-500">
                        <tr>
                            <th class="p-4">Asset</th>
                            <th class="p-4">Sell (Bid)</th>
                            <th class="p-4">Buy (Ask)</th>
                            <th class="p-4">Action</th>
                        </tr>
                    </thead>
                    <tbody class="mono text-xs">
                        <template x-for="asset in assets" :key="asset.symbol">
                            <tr class="border-b border-slate-800/50">
                                <td class="p-4 font-bold text-white" x-text="asset.symbol"></td>
                                <td class="p-4" :class="asset.trend === 'up' ? 'price-up' : 'price-down'" x-text="asset.bid"></td>
                                <td class="p-4" :class="asset.trend === 'up' ? 'price-up' : 'price-down'" x-text="asset.ask"></td>
                                <td class="p-4">
                                    <button @click="trade()" class="bg-blue-600/20 text-blue-400 px-3 py-1 rounded font-black text-[9px] hover:bg-blue-600 hover:text-white transition">TRADE</button>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </section>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <template x-for="i in 8" :key="i">
                <div @click="goToGame()" class="group cursor-pointer bg-slate-900 border border-slate-800 p-4 rounded-2xl hover:border-yellow-500 transition-all">
                    <div class="h-24 bg-slate-800 rounded-xl mb-3 flex items-center justify-center relative overflow-hidden">
                        <i class="fas fa-dice text-2xl text-slate-700 group-hover:text-yellow-500 transition"></i>
                        <div class="absolute bottom-0 w-full bg-blue-600 text-[8px] text-center font-bold py-1">PLAY NOW</div>
                    </div>
                    <h3 class="text-white text-[10px] font-black uppercase">Millionaire Slot <span x-text="i"></span></h3>
                </div>
            </template>
        </div>
    </main>

    <audio id="waterDrop" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3"></audio>

    <script>
        function millionaireSystem() {
            return {
                wallet: 25000.00,
                menuOpen: false,
                assets: [
                    { symbol: 'EUR/USD', bid: '0.0000', ask: '0.0000', dec: 4, trend: 'neutral' },
                    { symbol: 'GBP/USD', bid: '0.0000', ask: '0.0000', dec: 4, trend: 'neutral' },
                    { symbol: 'USD/JPY', bid: '000.00', ask: '000.00', dec: 2, trend: 'neutral' },
                    { symbol: 'XAU/USD', bid: '0000.00', ask: '0000.00', dec: 2, trend: 'neutral' },
                    { symbol: 'BTC/USD', bid: '00000', ask: '00000', dec: 0, trend: 'neutral' }
                ],
                winners: [
                    { name: 'X_Trader', amount: 450, game: 'Crash' },
                    { name: 'Boss77', amount: 1200, game: 'Slots' },
                    { name: 'King_Ace', amount: 80, game: 'Dice' }
                ],

                async initSystem() {
                    this.fetchLivePrices();
                    setInterval(() => this.fetchLivePrices(), 10000); // Live update every 10s
                },

                async fetchLivePrices() {
                    try {
                        // 1. Fetch Forex from Frankfurter
                        const fxRes = await fetch('https://api.frankfurter.app/latest?from=USD&to=EUR,GBP,JPY');
                        const fxData = await fxRes.json();

                        // 2. Fetch Crypto/Gold from CoinGecko
                        const cryptoRes = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,pax-gold&vs_currencies=usd');
                        const cryptoData = await cryptoRes.json();

                        const spread = 0.0005; // Standard 5-pip spread

                        this.assets.forEach(asset => {
                            let price;
                            const oldBid = asset.bid;

                            if (asset.symbol === 'EUR/USD') price = 1 / fxData.rates.EUR;
                            if (asset.symbol === 'GBP/USD') price = 1 / fxData.rates.GBP;
                            if (asset.symbol === 'USD/JPY') price = fxData.rates.JPY;
                            if (asset.symbol === 'BTC/USD') price = cryptoData.bitcoin.usd;
                            if (asset.symbol === 'XAU/USD') price = cryptoData['pax-gold'].usd;

                            asset.bid = (price * (1 - spread)).toFixed(asset.dec);
                            asset.ask = (price * (1 + spread)).toFixed(asset.dec);
                            asset.trend = asset.bid > oldBid ? 'up' : 'down';
                        });
                    } catch (e) {
                        console.log("API limit reached, simulating...");
                    }
                },

                toggleMenu() { this.menuOpen = !this.menuOpen; this.playEffect(); },
                playEffect() { 
                    const sfx = document.getElementById('waterDrop');
                    sfx.currentTime = 0; sfx.play(); 
                },
                trade() { this.playEffect(); alert('Order Executed!'); },
                goToGame() { this.playEffect(); setTimeout(() => { alert('Redirecting to Game...'); }, 300); }
            }
        }
    </script>
</body>
</html>
