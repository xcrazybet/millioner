<!DOCTYPE html>
<html>
<head>
  <title>Global Market Live Dashboard</title>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      background: #0f172a;
      font-family: Arial, sans-serif;
      color: white;
    }

    header {
      padding: 15px 20px;
      background: #111827;
      font-size: 20px;
      font-weight: bold;
    }

    section {
      padding: 20px;
    }

    h2 {
      margin-bottom: 15px;
      border-left: 4px solid #22c55e;
      padding-left: 10px;
    }

    .widget-box {
      margin-bottom: 40px;
    }
  </style>
</head>
<body>

<header>Global Markets Live Dashboard</header>

<!-- 🔥 TOP LIVE TICKER -->
<div class="tradingview-widget-container">
  <div class="tradingview-widget-container__widget"></div>
  <script type="text/javascript"
    src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js"
    async>
  {
    "symbols": [
      {"proName": "FX:EURUSD", "title": "EUR/USD"},
      {"proName": "FX:USDJPY", "title": "USD/JPY"},
      {"proName": "TVC:GOLD", "title": "Gold"},
      {"proName": "TVC:BRENT", "title": "Brent Oil"},
      {"proName": "NASDAQ:NVDA", "title": "Nvidia"},
      {"proName": "TVC:US10Y", "title": "US 10Y"}
    ],
    "colorTheme": "dark",
    "displayMode": "adaptive"
  }
  </script>
</div>

<section>

<!-- 📊 FOREX -->
<div class="widget-box">
<h2>Forex Market</h2>
<div class="tradingview-widget-container">
<div class="tradingview-widget-container__widget"></div>
<script type="text/javascript"
src="https://s3.tradingview.com/external-embedding/embed-widget-market-overview.js"
async>
{
  "colorTheme": "dark",
  "dateRange": "1D",
  "showChart": false,
  "locale": "en",
  "width": "100%",
  "height": 400,
  "tabs": [{
    "title": "Forex",
    "symbols": [
      {"s":"FX:EURUSD"},{"s":"FX:USDJPY"},{"s":"FX:GBPUSD"},
      {"s":"FX:AUDUSD"},{"s":"FX:USDCAD"},{"s":"FX:USDCHF"},
      {"s":"FX:NZDUSD"},{"s":"FX:EURGBP"},{"s":"FX:EURJPY"},
      {"s":"FX:GBPJPY"},{"s":"FX:USDCNY"},{"s":"FX:USDHKD"},
      {"s":"FX:USDZAR"},{"s":"FX:USDMXN"},{"s":"FX:USDINR"}
    ]
  }]
}
</script>
</div>
</div>

<!-- 🛢 COMMODITIES -->
<div class="widget-box">
<h2>Commodities</h2>
<div class="tradingview-widget-container">
<div class="tradingview-widget-container__widget"></div>
<script type="text/javascript"
src="https://s3.tradingview.com/external-embedding/embed-widget-market-overview.js"
async>
{
  "colorTheme": "dark",
  "dateRange": "1D",
  "showChart": false,
  "locale": "en",
  "width": "100%",
  "height": 400,
  "tabs": [{
    "title": "Commodities",
    "symbols": [
      {"s":"TVC:GOLD"},{"s":"TVC:SILVER"},
      {"s":"TVC:BRENT"},{"s":"TVC:WTI"},
      {"s":"TVC:NATURALGAS"},
      {"s":"CBOT:WHEAT"},{"s":"CBOT:CORN"},
      {"s":"CBOT:SOYBEAN"},
      {"s":"ICEUS:COFFEE"},{"s":"ICEUS:SUGAR"},
      {"s":"ICEUS:COCOA"}
    ]
  }]
}
</script>
</div>
</div>

<!-- 📈 STOCKS -->
<div class="widget-box">
<h2>Global Stocks</h2>
<div class="tradingview-widget-container">
<div class="tradingview-widget-container__widget"></div>
<script type="text/javascript"
src="https://s3.tradingview.com/external-embedding/embed-widget-market-overview.js"
async>
{
  "colorTheme": "dark",
  "dateRange": "1D",
  "showChart": false,
  "locale": "en",
  "width": "100%",
  "height": 400,
  "tabs": [{
    "title": "Stocks",
    "symbols": [
      {"s":"NASDAQ:NVDA"},{"s":"NASDAQ:AAPL"},
      {"s":"NASDAQ:MSFT"},{"s":"NASDAQ:GOOGL"},
      {"s":"NASDAQ:AMZN"},{"s":"NASDAQ:META"},
      {"s":"NASDAQ:TSLA"},{"s":"NYSE:TSM"},
      {"s":"NYSE:BRK.B"}
    ]
  }]
}
</script>
</div>
</div>

<!-- 💰 BONDS -->
<div class="widget-box">
<h2>Global Bonds</h2>
<div class="tradingview-widget-container">
<div class="tradingview-widget-container__widget"></div>
<script type="text/javascript"
src="https://s3.tradingview.com/external-embedding/embed-widget-market-overview.js"
async>
{
  "colorTheme": "dark",
  "dateRange": "1D",
  "showChart": false,
  "locale": "en",
  "width": "100%",
  "height": 400,
  "tabs": [{
    "title": "Bonds",
    "symbols": [
      {"s":"TVC:US10Y"},{"s":"TVC:US02Y"},

      {"s":"TVC:JP10Y"}
    ]
  }]
}

</div>
</div>

<!-- 📉 ADVANCED LIVE CHART -->
<div class="widget-box">
<h2>Live Advanced Chart</h2>
<div class="tradingview-widget-container">
<div id="tradingview_chart"></div>
<script type="text/javascript"
src="https://s3.tradingview.com/tv.js"></script>
<script type="text/javascript">
new TradingView.widget({
  "width": "100%",
  "height": 500,
  "symbol": "FX:EURUSD",
  "interval": "5",
  "timezone": "Etc/UTC",
  "theme": "dark",
  "style": "1",
  "locale": "en",
  "container_id": "tradingview_chart"
});
</script>
</div>
</div>

</section>

</body>
</html>
