<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Live EUR/USD Price</title>
<style>
body{
    background:#0f172a;
    color:white;
    font-family:Arial, sans-serif;
    text-align:center;
    padding:40px;
}
.price-box{
    background:#1e293b;
    padding:30px;
    border-radius:15px;
    display:inline-block;
    box-shadow:0 0 20px rgba(0,0,0,0.4);
}
h1{
    margin-bottom:20px;
}
</style>
</head>
<body>

<div class="price-box">
    <h1>Live EUR/USD (Forex)</h1>

    <!-- TradingView Single Quote Widget -->
    <div class="tradingview-widget-container">
      <div class="tradingview-widget-container__widget"></div>
      <script type="text/javascript" 
        src="https://s3.tradingview.com/external-embedding/embed-widget-single-quote.js" async>
      {
        "symbol": "FX_IDC:EURUSD",
        "width": "350",
        "colorTheme": "dark",
        "isTransparent": true,
        "locale": "en"
      }
      </script>
    </div>
    <!-- End TradingView Widget -->

</div>

</body>
</html>
