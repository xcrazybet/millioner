<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎯 Premium Prize Wheel - XCrazyBet</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --primary: #ff4081;
            --primary-dark: #d81b60;
            --secondary: #2196f3;
            --secondary-dark: #1976d2;
            --success: #4caf50;
            --danger: #f44336;
            --warning: #ff9800;
            --gold: #ffd700;
            --silver: #c0c0c0;
            --bronze: #cd7f32;
            --bg: #0a0a1a;
            --surface: #12122e;
            --surface-light: #1a1a3e;
            --text: #ffffff;
            --text-dim: #b0b7c3;
            --wheel-red: #ff5252;
            --wheel-blue: #448aff;
            --wheel-green: #4caf50;
            --wheel-yellow: #ffd740;
            --wheel-purple: #e040fb;
            --wheel-teal: #18ffff;
            --wheel-pink: #ff4081;
            --wheel-orange: #ff9100;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Segoe UI', 'Roboto', 'Arial', sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            touch-action: pan-y;
        }

        /* Background Effects */
        .bg-effects {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255, 64, 129, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(33, 150, 243, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(255, 215, 0, 0.05) 0%, transparent 70%),
                linear-gradient(135deg, #0a0a1a 0%, #12122e 100%);
        }

        /* Nebula Effect */
        .nebula {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.3;
            background: 
                radial-gradient(circle at 30% 40%, rgba(255, 64, 129, 0.3) 0%, transparent 40%),
                radial-gradient(circle at 70% 60%, rgba(33, 150, 243, 0.3) 0%, transparent 40%),
                radial-gradient(circle at 50% 30%, rgba(255, 215, 0, 0.2) 0%, transparent 40%);
            animation: nebulaFloat 20s infinite alternate ease-in-out;
        }

        @keyframes nebulaFloat {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-20px, 20px) scale(1.1); }
        }

        /* Loading Screen */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s;
            backdrop-filter: blur(10px);
        }

        .loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-wheel {
            width: 80px;
            height: 80px;
            border: 6px solid rgba(255, 64, 129, 0.2);
            border-radius: 50%;
            border-top-color: var(--primary);
            border-right-color: var(--secondary);
            border-bottom-color: var(--gold);
            animation: spin 1s linear infinite;
            margin-bottom: 30px;
            position: relative;
        }

        .loading-wheel:before {
            content: '';
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            border: 3px solid transparent;
            border-radius: 50%;
            border-top-color: rgba(255, 64, 129, 0.5);
            animation: spinReverse 1.5s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes spinReverse {
            to { transform: rotate(-360deg); }
        }

        .loading-text {
            margin-top: 20px;
            color: var(--text-dim);
            text-align: center;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, rgba(18, 18, 46, 0.95), rgba(26, 26, 62, 0.95));
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
            backdrop-filter: blur(15px);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 5px 30px rgba(0, 0, 0, 0.5);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text);
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary), var(--gold));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: #000;
        }

        .balance-container {
            display: flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, rgba(26, 35, 62, 0.8), rgba(33, 33, 82, 0.8));
            padding: 10px 20px;
            border-radius: 25px;
            border: 2px solid var(--primary);
            box-shadow: 0 0 20px rgba(255, 64, 129, 0.3);
        }

        .balance-icon {
            color: var(--gold);
            font-size: 1.2rem;
        }

        .balance-amount {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text);
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        /* Live Winners Feed */
        .winners-feed {
            background: linear-gradient(135deg, rgba(18, 18, 46, 0.9), rgba(26, 26, 62, 0.9));
            padding: 10px 15px;
            border-bottom: 1px solid rgba(255, 215, 0, 0.2);
            backdrop-filter: blur(10px);
            overflow: hidden;
            position: relative;
        }

        .winners-title {
            color: var(--gold);
            font-size: 0.9rem;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .winners-marquee {
            display: flex;
            gap: 30px;
            animation: marquee 30s linear infinite;
            white-space: nowrap;
        }

        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        .winner-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 5px 15px;
            background: rgba(255, 215, 0, 0.1);
            border-radius: 20px;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        .winner-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            color: white;
        }

        .winner-name {
            font-weight: 600;
            font-size: 0.9rem;
        }

        .winner-amount {
            color: var(--gold);
            font-weight: 700;
            font-size: 0.9rem;
        }

        /* Main Game Container */
        .game-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            min-height: calc(100vh - 200px);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Wheel Section */
        .wheel-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .wheel-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            aspect-ratio: 1;
            margin: 0 auto;
        }

        .wheel-outer-ring {
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            border: 20px solid transparent;
            border-image: linear-gradient(45deg, var(--gold), var(--primary), var(--secondary)) 1;
            border-radius: 50%;
            animation: ringGlow 3s ease-in-out infinite alternate;
            z-index: 1;
        }

        @keyframes ringGlow {
            0% { opacity: 0.5; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.02); }
        }

        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            border: 15px solid #1a1a3e;
            background: #0a0a1a;
            box-shadow: 
                0 0 50px rgba(255, 215, 0, 0.2),
                inset 0 0 100px rgba(0, 0, 0, 0.8);
            transition: transform 5s cubic-bezier(0.17, 0.67, 0.23, 0.99);
            z-index: 2;
        }

        /* Enhanced Wheel Spine */
        .wheel-spine {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background: radial-gradient(circle at 30% 30%, #8B0000, #4a0000, #220000);
            border-radius: 50%;
            z-index: 10;
            box-shadow: 
                0 0 30px rgba(139, 0, 0, 0.8),
                inset 0 0 20px rgba(255, 255, 255, 0.1);
            border: 8px solid #600;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .spine-center {
            width: 30px;
            height: 30px;
            background: radial-gradient(circle at 40% 40%, #ff0000, #8B0000);
            border-radius: 50%;
            border: 3px solid #ff4444;
            box-shadow: 
                inset 0 0 10px rgba(255, 255, 255, 0.2),
                0 0 15px rgba(255, 0, 0, 0.5);
        }

        .spine-connectors {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            z-index: 9;
        }

        .spine-connector {
            position: absolute;
            width: 12px;
            height: 50%;
            background: linear-gradient(to bottom, 
                rgba(139, 0, 0, 0.8) 0%,
                rgba(178, 34, 34, 0.9) 30%,
                rgba(205, 92, 92, 1) 50%,
                rgba(178, 34, 34, 0.9) 70%,
                rgba(139, 0, 0, 0.8) 100%);
            top: 50%;
            left: 50%;
            transform-origin: center 0;
            transform: translate(-50%, -50%) rotate(0deg);
            border-radius: 6px;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
        }

        /* Create 8 strong spine connectors */
        .spine-connector:nth-child(1) { transform: translate(-50%, -50%) rotate(0deg); }
        .spine-connector:nth-child(2) { transform: translate(-50%, -50%) rotate(45deg); }
        .spine-connector:nth-child(3) { transform: translate(-50%, -50%) rotate(90deg); }
        .spine-connector:nth-child(4) { transform: translate(-50%, -50%) rotate(135deg); }
        .spine-connector:nth-child(5) { transform: translate(-50%, -50%) rotate(180deg); }
        .spine-connector:nth-child(6) { transform: translate(-50%, -50%) rotate(225deg); }
        .spine-connector:nth-child(7) { transform: translate(-50%, -50%) rotate(270deg); }
        .spine-connector:nth-child(8) { transform: translate(-50%, -50%) rotate(315deg); }

        .wheel-segment {
            position: absolute;
            width: 50%;
            height: 50%;
            transform-origin: 100% 100%;
            left: 0;
            top: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            clip-path: polygon(0 0, 100% 0, 100% 100%);
        }

        .segment-content {
            position: absolute;
            left: 60px;
            bottom: 40px;
            transform: rotate(45deg);
            text-align: center;
            width: 120px;
        }

        .segment-name {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 5px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
        }

        .segment-value {
            font-size: 20px;
            font-weight: 900;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }

        .wheel-pointer {
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 80px;
            z-index: 20;
        }

        .pointer-arrow {
            width: 0;
            height: 0;
            border-left: 30px solid transparent;
            border-right: 30px solid transparent;
            border-top: 50px solid var(--danger);
            filter: drop-shadow(0 0 10px rgba(255, 0, 0, 0.7));
        }

        .pointer-base {
            width: 15px;
            height: 40px;
            background: linear-gradient(to bottom, #800000, #ff0000);
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 0 0 5px 5px;
        }

        /* Jackpot Display */
        .jackpot-display {
            background: linear-gradient(45deg, 
                rgba(255, 215, 0, 0.9),
                rgba(255, 165, 0, 0.9),
                rgba(255, 215, 0, 0.9));
            padding: 15px 40px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 
                0 10px 30px rgba(255, 215, 0, 0.4),
                0 0 50px rgba(255, 215, 0, 0.2);
            border: 3px solid rgba(255, 255, 255, 0.5);
            animation: jackpotGlow 2s infinite alternate;
        }

        @keyframes jackpotGlow {
            0% { box-shadow: 0 10px 30px rgba(255, 215, 0, 0.4); }
            100% { box-shadow: 0 10px 50px rgba(255, 215, 0, 0.8); }
        }

        .jackpot-label {
            font-size: 1rem;
            color: #000;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .jackpot-amount {
            font-size: 2.5rem;
            font-weight: 900;
            color: #000;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        /* Control Panel */
        .control-panel {
            background: linear-gradient(135deg, 
                rgba(18, 18, 46, 0.95),
                rgba(26, 26, 62, 0.95));
            border-radius: 25px;
            padding: 25px;
            border: 2px solid rgba(255, 64, 129, 0.3);
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .bet-section {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 20px;
            margin-bottom: 25px;
            align-items: center;
        }

        .bet-input-container {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .bet-input-wrapper {
            flex: 1;
            position: relative;
        }

        .bet-input {
            width: 100%;
            padding: 20px;
            background: rgba(10, 10, 26, 0.8);
            border: 3px solid var(--primary);
            border-radius: 15px;
            color: var(--text);
            font-size: 1.8rem;
            font-weight: 700;
            text-align: center;
            transition: all 0.3s;
            font-family: 'Courier New', monospace;
        }

        .bet-input:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 4px rgba(255, 215, 0, 0.2);
        }

        .bet-currency {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gold);
            font-size: 1.8rem;
            font-weight: 700;
            pointer-events: none;
        }

        .potential-win {
            text-align: center;
            padding: 15px 25px;
            background: rgba(10, 10, 26, 0.6);
            border-radius: 15px;
            border: 2px solid rgba(33, 150, 243, 0.3);
        }

        .potential-win-label {
            color: var(--text-dim);
            font-size: 0.9rem;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .potential-win-value {
            color: var(--primary);
            font-size: 2rem;
            font-weight: 900;
            text-shadow: 0 0 10px rgba(255, 64, 129, 0.3);
        }

        /* Quick Bets */
        .quick-bets {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 25px;
        }

        .quick-bet {
            padding: 18px;
            background: rgba(10, 10, 26, 0.8);
            border: 2px solid var(--primary);
            border-radius: 15px;
            color: var(--primary);
            font-weight: 700;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .quick-bet:hover {
            background: var(--primary);
            color: #000;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(255, 64, 129, 0.3);
        }

        .quick-bet.active {
            background: var(--primary);
            color: #000;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 64, 129, 0.4);
        }

        /* Multiplier Controls */
        .multiplier-section {
            background: rgba(10, 10, 26, 0.6);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 25px;
            border: 2px solid rgba(255, 215, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .multiplier-label {
            color: var(--gold);
            font-size: 1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        .multiplier-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            flex: 1;
        }

        .multiplier-btn {
            padding: 12px 24px;
            background: rgba(33, 150, 243, 0.2);
            border: 2px solid var(--secondary);
            border-radius: 12px;
            color: var(--text);
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1.1rem;
            min-width: 70px;
        }

        .multiplier-btn:hover {
            background: var(--secondary);
            color: #000;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(33, 150, 243, 0.3);
        }

        .multiplier-btn.active {
            background: var(--secondary);
            color: #000;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(33, 150, 243, 0.4);
        }

        .multiplier-display {
            font-size: 2rem;
            font-weight: 900;
            color: var(--gold);
            min-width: 80px;
            text-align: center;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
        }

        /* Action Buttons */
        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .action-btn {
            padding: 22px;
            border: none;
            border-radius: 18px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .double-btn {
            background: linear-gradient(135deg, var(--secondary), var(--secondary-dark));
            color: #000;
        }

        .double-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(33, 150, 243, 0.4);
        }

        .spin-btn {
            background: linear-gradient(135deg, var(--gold), var(--warning));
            color: #000;
            font-size: 1.8rem;
        }

        .spin-btn:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 20px 40px rgba(255, 215, 0, 0.4);
        }

        .spin-btn.pulsing {
            animation: pulseGlow 1.5s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { 
                transform: scale(1);
                box-shadow: 0 10px 30px rgba(255, 215, 0, 0.4);
            }
            100% { 
                transform: scale(1.05);
                box-shadow: 0 20px 50px rgba(255, 215, 0, 0.8);
            }
        }

        /* Game Stats */
        .game-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .stat-item {
            background: rgba(10, 10, 26, 0.6);
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-label {
            color: var(--text-dim);
            font-size: 0.9rem;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            color: var(--text);
            font-size: 1.4rem;
            font-weight: 700;
        }

        .stat-value.win-rate {
            color: var(--success);
        }

        .stat-value.lose-rate {
            color: var(--danger);
        }

        /* History Panel */
        .history-panel {
            background: linear-gradient(135deg, 
                rgba(18, 18, 46, 0.95),
                rgba(26, 26, 62, 0.95));
            border-radius: 25px;
            padding: 25px;
            border: 2px solid rgba(76, 175, 80, 0.3);
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .history-title {
            color: var(--success);
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .history-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .history-item {
            background: rgba(10, 10, 26, 0.6);
            padding: 20px;
            border-radius: 15px;
            border: 2px solid rgba(255, 64, 129, 0.2);
            transition: all 0.3s;
        }

        .history-item:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
            box-shadow: 0 10px 30px rgba(255, 64, 129, 0.2);
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

        // ===== BALANCE MANAGEMENT =====
        async function loadBalance() {
            try {
                const db = firebase.firestore();
                const walletRef = db.collection("wallets").doc(gameState.currentUser.uid);
                const walletDoc = await walletRef.get();
                
                if (walletDoc.exists) {
                    gameState.balance = walletDoc.data().balance || 0;
                    console.log("💰 Balance loaded:", gameState.balance);
                } else {
                    // Create new wallet
                    await walletRef.set({
                        balance: 100,
                        createdAt: new Date(),
                        updatedAt: new Date(),
                        userId: gameState.currentUser.uid,
                        totalWagered: 0,
                        totalWon: 0
                    });
                    gameState.balance = 100;
                    console.log("✅ New wallet created");
                }
                
                updateBalanceDisplay();
                setupBalanceListener();
                setupGame();
                
            } catch (error) {
                console.error('Error loading balance:', error);
                showError('Balance load failed. Using demo mode.');
                gameState.balance = 1000;
                updateBalanceDisplay();
                setupGame();
            }
        }

        function updateBalanceDisplay() {
            document.getElementById('balance-val').textContent = gameState.balance.toFixed(2);
        }

        function setupBalanceListener() {
            try {
                const db = firebase.firestore();
                const walletRef = db.collection("wallets").doc(gameState.currentUser.uid);
                
                walletRef.onSnapshot((doc) => {
                    if (doc.exists) {
                        const newBalance = doc.data().balance || 0;
                        if (newBalance !== gameState.balance) {
                            gameState.balance = newBalance;
                            updateBalanceDisplay();
                            updateBetLimits();
                        }
                    }
                });
            } catch (error) {
                console.error('Balance listener error:', error);
            }
        }

        // ===== TRANSACTION PROCESSING =====
        async function processTransaction(amount, type, description) {
            try {
                const db = firebase.firestore();
                const walletRef = db.collection("wallets").doc(gameState.currentUser.uid);
                
                return await db.runTransaction(async (transaction) => {
                    const walletDoc = await transaction.get(walletRef);
                    
                    if (!walletDoc.exists) {
                        throw new Error("Wallet not found");
                    }
                    
                    const walletData = walletDoc.data();
                    const currentBalance = walletData.balance || 0;
                    const newBalance = currentBalance + amount;
                    
                    if (newBalance < 0) {
                        throw new Error("Insufficient funds");
                    }
                    
                    // Update wallet
                    transaction.update(walletRef, {
                        balance: newBalance,
                        updatedAt: new Date(),
                        totalWagered: (walletData.totalWagered || 0) + (amount < 0 ? Math.abs(amount) : 0),
                        totalWon: (walletData.totalWon || 0) + (amount > 0 ? amount : 0)
                    });
                    
                    // Record transaction
                    const transactionRef = walletRef.collection("transactions").doc();
                    const spinId = gameState.currentSpin?.spinId || `wheel_${Date.now()}`;
                    
                    transaction.set(transactionRef, {
                        type: type,
                        amount: amount,
                        description: description,
                        createdAt: new Date(),
                        gameId: spinId,
                        beforeBalance: currentBalance,
                        afterBalance: newBalance,
                        segment: gameState.currentSpin?.segment?.name,
                        multiplier: gameState.currentSpin?.multiplier,
                        betAmount: gameState.currentSpin?.bet
                    });
                    
                    // Update game state
                    gameState.balance = newBalance;
                    updateBalanceDisplay();
                    
                    return { success: true, newBalance };
                });
            } catch (error) {
                console.error('Transaction failed:', error);
                showToast(`Transaction failed: ${error.message}`, 'error');
                return { success: false, error: error.message };
            }
        }

        // ===== WHEEL GENERATION =====
        function generateWheel() {
            const wheel = document.getElementById('wheel');
            wheel.innerHTML = '';
            
            let totalProbability = 0;
            gameState.segments.forEach(segment => {
                totalProbability += segment.probability;
            });
            
            let currentAngle = 0;
            
            gameState.segments.forEach((segment, index) => {
                const segmentAngle = (segment.probability / totalProbability) * 360;
                
                const segmentElement = document.createElement('div');
                segmentElement.className = 'wheel-segment';
                segmentElement.dataset.index = index;
                segmentElement.style.transform = `rotate(${currentAngle}deg)`;
                
                // Create gradient background
                const gradientColor = segment.color;
                segmentElement.style.background = `conic-gradient(
                    ${gradientColor} 0deg,
                    ${gradientColor} ${segmentAngle}deg,
                    transparent ${segmentAngle}deg
                )`;
                
                // Add border for segment separation
                segmentElement.style.borderRight = '2px solid rgba(255, 255, 255, 0.2)';
                
                // Create segment content
                const content = document.createElement('div');
                content.className = 'segment-content';
                content.style.transform = `rotate(${segmentAngle / 2}deg)`;
                
                content.innerHTML = `
                    <div class="segment-name">${segment.name}</div>
                    <div class="segment-value">${segment.multiplier.toFixed(1)}x</div>
                `;
                
                segmentElement.appendChild(content);
                wheel.appendChild(segmentElement);
                
                currentAngle += segmentAngle;
            });
        }

        // ===== GAME FUNCTIONS =====
        function setMultiplier(multiplier) {
            gameState.currentMultiplier = multiplier;
            document.getElementById('multiplierDisplay').textContent = `${multiplier}x`;
            
            // Update button states
            document.querySelectorAll('.multiplier-btn').forEach(btn => {
                btn.classList.toggle('active', parseInt(btn.dataset.multiplier) === multiplier);
            });
            
            updatePotentialWin();
        }

        function updatePotentialWin() {
            const betAmount = parseFloat(document.getElementById('betAmount').value) || 0;
            const multiplier = gameState.currentMultiplier;
            
            // Calculate average potential win based on segment probabilities
            let totalWeightedMultiplier = 0;
            let totalProbability = 0;
            
            gameState.segments.forEach(segment => {
                totalWeightedMultiplier += segment.multiplier * segment.probability;
                totalProbability += segment.probability;
            });
            
            const averageMultiplier = totalWeightedMultiplier / totalProbability;
            const potentialWin = (betAmount * averageMultiplier * multiplier).toFixed(2);
            
            document.getElementById('potentialWin').textContent = `$${potentialWin}`;
        }

        function updateBetLimits() {
            const betInput = document.getElementById('betAmount');
            const maxBet = Math.min(gameState.balance, 1000);
            
            betInput.max = maxBet;
            
            if (parseFloat(betInput.value) > maxBet) {
                betInput.value = maxBet;
                gameState.betAmount = maxBet;
            }
            
            updatePotentialWin();
        }

        // ===== SPIN FUNCTIONS =====
        async function spinWheel() {
            if (!gameState.isAuthenticated) {
                showToast('Please login to play with real money', 'warning');
                return;
            }
            
            const betAmount = parseFloat(document.getElementById('betAmount').value);
            
            // Validate bet
            if (betAmount < 1 || betAmount > Math.min(gameState.balance, 1000)) {
                showToast(`Bet must be between $1 and $${Math.min(gameState.balance, 1000)}`, 'error');
                return;
            }
            
            if (gameState.wheelSpinning) {
                showToast('Wheel is already spinning!', 'warning');
                return;
            }
            
            // Process bet
            const betResult = await processTransaction(
                -betAmount,
                "prizewheel_bet",
                `Prize Wheel bet: $${betAmount}`
            );
            
            if (!betResult.success) {
                return;
            }
            
            // Start wheel spin
            startWheelSpin(betAmount);
            SoundManager.play('spin');
        }

        function startWheelSpin(betAmount) {
            gameState.wheelSpinning = true;
            gameState.betAmount = betAmount;
            
            // Disable controls
            document.getElementById('spinBtn').disabled = true;
            document.getElementById('doubleBtn').disabled = true;
            document.getElementById('betAmount').disabled = true;
            
            // Create spin ID
            const spinId = `wheel_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
            
            // Select random segment based on probability (90% lose bias)
            const totalProbability = gameState.segments.reduce((sum, segment) => sum + segment.probability, 0);
            const random = Math.random() * totalProbability;
            
            let accumulated = 0;
            let selectedSegment = null;
            let selectedSegmentIndex = 0;
            
            for (let i = 0; i < gameState.segments.length; i++) {
                accumulated += gameState.segments[i].probability;
                if (random <= accumulated) {
                    selectedSegment = gameState.segments[i];
                    selectedSegmentIndex = i;
                    break;
                }
            }
            
            // Calculate spin parameters
            const segmentCount = gameState.segments.length;
            const segmentAngle = 360 / totalProbability * selectedSegment.probability;
            const baseAngle = (360 / segmentCount) * selectedSegmentIndex;
            const offset = segmentAngle / 2;
            const extraRotations = 5 + Math.floor(Math.random() * 3); // 5-7 extra rotations
            const finalRotation = (extraRotations * 360) + baseAngle + offset;
            
            // Store current spin
            gameState.currentSpin = {
                spinId: spinId,
                bet: betAmount,
                segment: selectedSegment,
                multiplier: selectedSegment.multiplier * gameState.currentMultiplier,
                winAmount: 0,
                startTime: Date.now()
            };
            
            // Animate wheel
            const wheel = document.getElementById('wheel');
            wheel.style.transition = 'transform 5s cubic-bezier(0.1, 0.1, 0.1, 1)';
            wheel.style.transform = `rotate(${finalRotation}deg)`;
            
            // Play spin sound
            const spinSound = new Audio(SoundManager.sounds.spin);
            spinSound.volume = 0.4;
            spinSound.play();
            
            // Process result after spin completes
            setTimeout(async () => {
                SoundManager.play('wheelStop');
                
                // Calculate win amount
                const winMultiplier = selectedSegment.multiplier * gameState.currentMultiplier;
                const winAmount = parseFloat((betAmount * winMultiplier).toFixed(2));
                gameState.currentSpin.winAmount = winAmount;
                
                // Play result sound
                if (selectedSegment.type === 'jackpot') {
                    SoundManager.play('jackpot');
                    ParticleSystem.createConfetti();
                    gameState.jackpotAmount += 1000;
                    updateJackpotDisplay();
                } else if (selectedSegment.type === 'win') {
                    SoundManager.play('win');
                    ParticleSystem.createParticles(50, selectedSegment.color, 
                        window.innerWidth / 2, window.innerHeight / 2);
                } else {
                    SoundManager.play('lose');
                }
                
                // Process win if any
                if (winAmount > 0) {
                    const winResult = await processTransaction(
                        winAmount,
                        "prizewheel_win",
                        `Prize Wheel win: ${winMultiplier.toFixed(2)}x - $${winAmount}`
                    );
                    
                    if (!winResult.success) {
                        showToast('Failed to process win', 'error');
                    }
                }
                
                // Update game state
                gameState.totalSpins++;
                document.getElementById('totalSpins').textContent = gameState.totalSpins;
                
                // Add to history
                addSpinHistory();
                
                // Show result
                showResult(selectedSegment, winAmount);
                
                // Re-enable controls
                setTimeout(() => {
                    gameState.wheelSpinning = false;
                    document.getElementById('spinBtn').disabled = false;
                    document.getElementById('doubleBtn').disabled = false;
                    document.getElementById('betAmount').disabled = false;
                }, 2000);
                
            }, 5000);
        }

        // ===== EVENT LISTENERS =====
        function setupEventListeners() {
            console.log("Setting up event listeners...");
            
            // Double bet button
            document.getElementById('doubleBtn').addEventListener('click', () => {
                SoundManager.play('click');
                doubleBet();
            });
            
            // Spin button
            document.getElementById('spinBtn').addEventListener('click', () => {
                SoundManager.play('click');
                spinWheel();
            });

            document.querySelectorAll('.quick-bet').forEach(btn => {

                    updateBetLimits();

                e.target.value = value;
                gameState.betAmount = value;
                updatePotentialWin();

                document.querySelectorAll('.quick-bet').forEach(btn => {
                    btn.classList.toggle('active', parseFloat(btn.dataset.amount) === value);

            document.getElementById('fullscreenToggle').addEventListener('click', toggleFullscreen);

            document.addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && !gameState.wheelSpinning) {
                    spinWheel();
                }

            // Touch events for mobile
            setupTouchEvents();
            
            console.log("✅ Event listeners setup complete");

        function setupTouchEvents() {
            const wheel = document.getElementById('wheel');
            let touchStartY = 0;
            
            wheel.addEventListener('touchstart', (e) => {
                touchStartY = e.touches[0].clientY;
            });
            
            wheel.addEventListener('touchend', (e) => {
                const touchEndY = e.changedTouches[0].clientY;
                const deltaY = touchEndY - touchStartY;
                
                // Swipe down to spin
                if (deltaY > 100 && !gameState.wheelSpinning) {
                    spinWheel();
                }
            });
        }

        function doubleBet() {
            if (!gameState.isAuthenticated) {
                showToast('Login to use this feature', 'warning');
                return;
            }
            
            const currentBet = gameState.betAmount;
            const newBet = currentBet * 2;
            const maxBet = Math.min(gameState.balance, 1000);
            
            if (newBet > maxBet) {
                showToast(`Maximum bet is $${maxBet}`, 'warning');
                return;
            }
            
            gameState.betAmount = newBet;
            document.getElementById('betAmount').value = newBet;
            updatePotentialWin();
            
            // Update quick bet selection
            document.querySelectorAll('.quick-bet').forEach(btn => {
                btn.classList.toggle('active', parseFloat(btn.dataset.amount) === newBet);
            });
            
            showToast(`Bet doubled to $${newBet}`, 'success');
        }

        function toggleFullscreen() {
            const container = document.getElementById('game-container');
            
            if (!document.fullscreenElement) {
                if (container.requestFullscreen) {
                    container.requestFullscreen();
                } else if (container.webkitRequestFullscreen) {
                    container.webkitRequestFullscreen();
                } else if (container.msRequestFullscreen) {
                    container.msRequestFullscreen();
                }
                document.getElementById('fullscreenToggle').innerHTML = '<i class="fas fa-compress"></i>';
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
                document.getElementById('fullscreenToggle').innerHTML = '<i class="fas fa-expand"></i>';
            }
        }

        // ===== UI HELPER FUNCTIONS =====
        function updateLoadingStatus(message) {
            const loadingStatus = document.getElementById('loadingStatus');
            if (loadingStatus) {
                loadingStatus.textContent = message;
            }
        }

        function showError(message) {
            console.error(message);
            showToast(message, 'error');
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            
            const icons = {
                success: '✅',
                error: '❌',
                warning: '⚠️',
                info: 'ℹ️'
            };
            
            toast.innerHTML = `
                <div class="toast-icon">${icons[type] || icons.info}</div>
                <div>${message}</div>
            `;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.add('show');
            }, 10);
            
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => {
                    if (container.contains(toast)) {
                        container.removeChild(toast);
                    }
                }, 300);
            }, 3000);
        }

        // ===== FULLSCREEN EVENT LISTENERS =====
        document.addEventListener('fullscreenchange', () => {
            const isFullscreen = !!document.fullscreenElement;
            document.body.classList.toggle('fullscreen-active', isFullscreen);
        });

        document.addEventListener('webkitfullscreenchange', () => {
            const isFullscreen = !!document.webkitFullscreenElement;
            document.body.classList.toggle('fullscreen-active', isFullscreen);
        });

        console.log("🎰 Win Rate: 10% | Lose Rate: 90%");
        console.log("🎯 Enhanced Spine Design: ACTIVE");
        console.log("📱 Full Mobile Touch Support: ACTIVE");
        console.log("🎯 Ready to spin!");
    </script>
