name: Update Football Matches
on:
  schedule:
    - cron: '*/15 * * * *'  # Every 15 minutes
  workflow_dispatch:  # Manual trigger
  push:
    branches: [ main ]

jobs:
  update-matches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          persist-credentials: false
          
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install dependencies
        run: |
          npm install axios firebase-admin
          
      - name: Create update script
        run: |
          cat > scripts/update-matches.js << 'EOF'
          // [Script content will be added next]
          EOF
          
      - name: Run update script
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          LIVESCORE_API_KEY: ${{ secrets.LIVESCORE_API_KEY }}
          SCOREBAT_TOKEN: ${{ secrets.SCOREBAT_TOKEN }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          FLASHSCORE: ${{ secrets.FLASHSCORE }}
          SOFASCORE: ${{ secrets.SOFASCORE }}
          API_FOOTBALL_KEY: '2396236d9d5cd07468ce280da8390ad5'
        run: node scripts/update-matches.js
        
      - name: Commit and push updates
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add matches.json football_data.json health.json
          git commit -m "🤖 Auto-update football matches [skip ci]" || echo "No changes to commit"
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          
      - name: Update status
        run: |
          echo "✅ Football matches updated successfully!"
          echo "🕒 Last update: $(date)"
          echo "⏳ Next update in 15 minutes"
