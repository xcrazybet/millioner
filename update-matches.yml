name: Update Football Data (GitHub Storage)

on:
  schedule:
    - cron: '*/15 * * * *'  # Every 15 minutes
  workflow_dispatch:         # Manual trigger
  push:
    paths:
      - 'update-matches.js' # Run when collector script changes

jobs:
  collect-and-update:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: |
        npm init -y --silent
        npm install axios --save
        
    - name: Run Data Collection
      run: node update-matches.js
      env:
        NODE_ENV: production
      
    - name: Commit and Push Updates
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        # Check if there are changes
        git add -A
        git diff --cached --quiet || {
          git commit -m "🤖 Auto-update football data [$(date +'%Y-%m-%d %H:%M UTC')]"
          git push origin main
          echo "✅ Data updated and pushed to GitHub"
        } || {
          echo "⏭️ No changes to commit"
        }
        
    - name: Verify Update
      run: |
        echo "📊 Data update completed!"
        echo "Next auto-run: 15 minutes"
        echo "Check: https://xcrazybet.github.io/millioner/api.html"
