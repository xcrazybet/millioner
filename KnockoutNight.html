<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🥊 XCrazyBet - Knockout Night</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --primary: #ff3b30;
            --primary-dark: #d32f2f;
            --secondary: #ff9800;
            --secondary-dark: #f57c00;
            --gold: #ffd700;
            --danger: #ff5252;
            --success: #4caf50;
            --warning: #ffc107;
            --bg: #0a0a0a;
            --surface: #1a1a1a;
            --surface-light: #2a2a2a;
            --text: #ffffff;
            --text-dim: #888888;
            --ring-red: #ff0000;
            --ring-gold: #ffd700;
            --neon-glow: 0 0 20px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Segoe UI', 'Roboto', system-ui, -apple-system, sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            touch-action: manipulation;
        }

        /* Background Effects */
        .bg-effects {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255, 59, 48, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(255, 152, 0, 0.1) 0%, transparent 50%),
                linear-gradient(135deg, #000000 0%, var(--bg) 100%);
        }

        /* Header */
        .header {
            background: rgba(26, 26, 26, 0.95);
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .home-btn {
            width: 36px;
            height: 36px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #fff;
            font-size: 18px;
            transition: all 0.3s;
        }

        .home-btn:hover {
            background: var(--primary-dark);
            transform: scale(1.1);
        }

        .logo {
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--primary);
        }

        .logo i {
            color: var(--primary);
        }

        .balance-display {
            background: linear-gradient(45deg, #2a2a2a, #1a1a1a);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--primary);
            color: var(--primary);
            font-weight: 700;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 140px;
            justify-content: center;
        }

        /* Main Game Container */
        .game-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            min-height: calc(100vh - 140px);
        }

        /* Result Banner */
        .result-banner {
            background: linear-gradient(135deg, rgba(255, 59, 48, 0.2), rgba(255, 59, 48, 0.4));
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            font-size: 20px;
            font-weight: 700;
            border: 2px solid var(--primary);
            display: none;
            animation: slideDown 0.5s ease-out;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .result-banner.show {
            display: block;
        }

        .result-banner.win {
            background: linear-gradient(135deg, rgba(255, 152, 0, 0.2), rgba(255, 152, 0, 0.4));
            border-color: var(--secondary);
            color: var(--secondary);
            animation: winPulse 2s infinite;
        }

        .result-banner.knockdown {
            background: linear-gradient(135deg, rgba(255, 193, 7, 0.2), rgba(255, 193, 7, 0.4));
            border-color: var(--warning);
            color: var(--warning);
            animation: warningPulse 1s infinite;
        }

        .result-banner.knockout {
            background: linear-gradient(135deg, rgba(255, 82, 82, 0.2), rgba(255, 82, 82, 0.4));
            border-color: var(--danger);
            color: var(--danger);
            animation: shake 0.5s;
        }

        /* Arena Container */
        .arena-container {
            position: relative;
            min-height: 350px;
            background: linear-gradient(135deg, #111, #000);
            border-radius: 20px;
            border: 3px solid #444;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 50px rgba(255, 59, 48, 0.1);
        }

        #arena-canvas {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        .arena-content {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 20px;
            width: 100%;
        }

        .round-display {
            font-size: 40px;
            font-weight: 900;
            margin: 20px 0;
            color: var(--gold);
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            transition: all 0.3s;
        }

        .multiplier-display {
            font-size: 32px;
            font-weight: 700;
            color: var(--secondary);
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(255, 152, 0, 0.3);
        }

        .current-win {
            font-size: 28px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 20px;
        }

        .player-health {
            width: 80%;
            height: 20px;
            background: rgba(255, 82, 82, 0.2);
            border-radius: 10px;
            margin: 20px auto;
            overflow: hidden;
            border: 2px solid rgba(255, 82, 82, 0.3);
        }

        .health-bar {
            height: 100%;
            background: linear-gradient(90deg, #ff3b30, #ff9800);
            width: 100%;
            transition: width 0.5s ease-out;
        }

        /* Countdown Timer */
        .countdown-timer {
            font-size: 48px;
            font-weight: 900;
            color: var(--warning);
            margin: 20px 0;
            text-shadow: 0 0 25px rgba(255, 193, 7, 0.5);
            animation: pulse 1s infinite;
            position: relative;
        }

        .countdown-ring {
            width: 100px;
            height: 100px;
            border: 5px solid transparent;
            border-radius: 50%;
            border-top-color: var(--warning);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: spin 1s linear infinite;
        }

        /* Action Panel */
        .action-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 20px;
        }

        .btn {
            padding: 20px;
            border: none;
            border-radius: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
            min-height: 60px;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: 0.5s;
        }

        .btn:hover:not(:disabled)::before {
            left: 100%;
        }

        .btn-cashout {
            background: linear-gradient(135deg, var(--success), #388e3c);
            color: white;
            box-shadow: 0 5px 20px rgba(76, 175, 80, 0.3);
        }

        .btn-cashout:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(76, 175, 80, 0.4);
        }

        .btn-continue {
            background: linear-gradient(135deg, var(--secondary), var(--secondary-dark));
            color: #000;
            box-shadow: 0 5px 20px rgba(255, 152, 0, 0.3);
        }

        .btn-continue:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 152, 0, 0.4);
        }

        .btn-fight {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            font-size: 20px;
            padding: 25px;
            grid-column: span 2;
        }

        .btn-fight:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 59, 48, 0.4);
        }

        /* Bet Controls */
        .bet-controls {
            background: rgba(26, 26, 26, 0.8);
            border-radius: 15px;
            padding: 20px;
            border: 2px solid rgba(255, 59, 48, 0.2);
            backdrop-filter: blur(10px);
        }

        .bet-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            align-items: center;
        }

        .bet-input {
            flex: 1;
            padding: 15px;
            background: rgba(10, 10, 10, 0.8);
            border: 2px solid var(--primary);
            border-radius: 10px;
            color: var(--text);
            font-size: 18px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .bet-input:focus {
            outline: none;
            border-color: var(--secondary);
            box-shadow: 0 0 0 3px rgba(255, 152, 0, 0.1);
        }

        .quick-bets {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .quick-bet {
            padding: 12px;
            background: rgba(10, 10, 10, 0.8);
            border: 1px solid var(--primary);
            border-radius: 8px;
            color: var(--primary);
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }

        .quick-bet:hover {
            background: var(--primary);
            color: white;
            transform: translateY(-2px);
        }

        .quick-bet.active {
            background: var(--primary);
            color: white;
            transform: scale(1.05);
        }

        /* History Panel */
        .history-panel {
            background: rgba(26, 26, 26, 0.8);
            border-radius: 15px;
            padding: 15px;
            border: 1px solid rgba(255, 59, 48, 0.2);
            max-height: 200px;
            overflow-y: auto;
            backdrop-filter: blur(10px);
        }

        .history-title {
            font-size: 14px;
            color: var(--secondary);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 152, 0, 0.2);
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .history-item {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            align-items: center;
            padding: 8px 12px;
            background: rgba(10, 10, 10, 0.5);
            border-radius: 8px;
            font-size: 12px;
            border-left: 3px solid var(--primary);
            gap: 10px;
        }

        .history-item.safe {
            border-left-color: var(--success);
            background: rgba(76, 175, 80, 0.05);
        }

        .history-item.knockdown {
            border-left-color: var(--warning);
            background: rgba(255, 193, 7, 0.05);
        }

        .history-item.knockout {
            border-left-color: var(--danger);
            background: rgba(255, 82, 82, 0.05);
        }

        .history-round {
            color: var(--text);
            font-weight: 600;
        }

        .history-result {
            color: var(--text-dim);
        }

        .history-multiplier {
            font-weight: 600;
            text-align: right;
        }

        .history-multiplier.safe {
            color: var(--success);
        }

        .history-multiplier.knockdown {
            color: var(--warning);
        }

        .history-multiplier.knockout {
            color: var(--danger);
        }

        /* Live Winners Feed */
        .winners-feed {
            background: rgba(26, 26, 26, 0.8);
            border-radius: 15px;
            padding: 15px;
            border: 1px solid rgba(255, 59, 48, 0.2);
            margin-top: 15px;
            backdrop-filter: blur(10px);
            max-height: 150px;
            overflow: hidden;
            position: relative;
        }

        .winners-title {
            font-size: 14px;
            color: var(--primary);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 59, 48, 0.2);
        }

        .winners-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .winner-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 10px;
            background: rgba(255, 59, 48, 0.05);
            border-radius: 8px;
            font-size: 12px;
            animation: slideIn 0.5s ease-out;
        }

        .winner-avatar {
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: white;
        }

        .winner-name {
            flex: 1;
            color: var(--text);
        }

        .winner-amount {
            color: var(--primary);
            font-weight: 600;
        }

        .winner-time {
            color: var(--text-dim);
            font-size: 10px;
            margin-left: 5px;
        }

        /* Fullscreen Controls */
        .fullscreen-controls {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .fullscreen-btn {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            cursor: pointer;
            border: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.3s;
        }

        .fullscreen-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }

        .return-btn {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--secondary), var(--secondary-dark));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-size: 20px;
            cursor: pointer;
            border: none;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.3s;
        }

        .return-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }

        /* Animations */
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes winPulse {
            0%, 100% { box-shadow: 0 0 20px rgba(255, 152, 0, 0.3); }
            50% { box-shadow: 0 0 40px rgba(255, 152, 0, 0.6); }
        }

        @keyframes warningPulse {
            0%, 100% { box-shadow: 0 0 20px rgba(255, 193, 7, 0.3); }
            50% { box-shadow: 0 0 40px rgba(255, 193, 7, 0.6); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }

        @keyframes slideDown {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes slideIn {
            from { transform: translateX(-100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes spin {
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        @keyframes healthDrain {
            from { width: 100%; }
            to { width: 0%; }
        }

        @keyframes flash {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @keyframes impact {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        /* Loading */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 59, 48, 0.3);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 1s ease-in-out infinite;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 10px;
                padding: 10px;
            }

            .header-left {
                width: 100%;
                justify-content: space-between;
            }

            .balance-display {
                width: 100%;
                min-width: auto;
            }

            .game-container {
                padding: 10px;
                gap: 10px;
            }

            .round-display {
                font-size: 32px;
            }

            .multiplier-display {
                font-size: 24px;
            }

            .action-panel {
                grid-template-columns: 1fr;
                padding: 15px;
            }

            .btn-fight {
                grid-column: span 1;
            }

            .quick-bets {
                grid-template-columns: repeat(2, 1fr);
            }

            .fullscreen-controls {
                bottom: 10px;
                right: 10px;
            }

            .fullscreen-btn,
            .return-btn {
                width: 44px;
                height: 44px;
                font-size: 18px;
            }
        }

        @media (max-width: 480px) {
            .round-display {
                font-size: 28px;
            }

            .multiplier-display {
                font-size: 20px;
            }

            .countdown-timer {
                font-size: 36px;
            }

            .btn {
                padding: 16px;
                font-size: 16px;
            }

            .bet-input {
                padding: 12px;
                font-size: 16px;
            }

            .quick-bets {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* Fullscreen Styles */
        :fullscreen .fullscreen-btn .fa-expand {
            display: none;
        }

        :fullscreen .fullscreen-btn .fa-compress {
            display: block;
        }

        .fullscreen-btn .fa-compress {
            display: none;
        }

        :fullscreen .game-container {
            max-width: 100%;
            padding: 20px;
        }

        :fullscreen .arena-container {
            min-height: 50vh;
        }
    </style>
</head>
<body>
    <!-- Background Effects -->
    <div class="bg-effects"></div>

    <!-- Header -->
    <header class="header">
        <div class="header-left">
            <a href="https://xcrazybet.github.io/millioner" class="home-btn" title="Return to Home">
                <i class="fas fa-home"></i>
            </a>
            <div class="logo">
                <i class="fas fa-fist-raised"></i>
                KNOCKOUT NIGHT
            </div>
        </div>
        <div class="balance-display">
            <i class="fas fa-wallet"></i>
            $<span id="balance-val">0.00</span>
        </div>
    </header>

    <!-- Main Game Container -->
    <div class="game-container">
        <!-- Result Banner -->
        <div class="result-banner" id="result-banner">
            <span id="result-text"></span>
        </div>

        <!-- Arena -->
        <div class="arena-container">
            <canvas id="arena-canvas"></canvas>
            <div class="arena-content" id="arena-content">
                <div class="round-display" id="round-display">
                    ROUND 1
                </div>
                <div class="multiplier-display" id="multiplier-display">
                    MULTIPLIER: <span id="multiplier-value">1.00x</span>
                </div>
                <div class="current-win" id="current-win">
                    CURRENT WIN: $<span id="current-win-amount">0</span>
                </div>
                
                <div class="player-health" id="player-health">
                    <div class="health-bar" id="health-bar"></div>
                </div>
                
                <div class="countdown-timer" id="countdown-timer" style="display: none;">
                    <div class="countdown-ring"></div>
                    <span id="countdown-value">5</span>
                </div>
            </div>
        </div>

        <!-- Action Panel -->
        <div class="action-panel" id="action-panel">
            <button id="cashout-btn" class="btn btn-cashout" disabled>
                <i class="fas fa-hand-holding-usd"></i> CASH OUT
            </button>
            <button id="continue-btn" class="btn btn-continue" disabled>
                <i class="fas fa-forward"></i> CONTINUE
            </button>
            <button id="fight-btn" class="btn btn-fight">
                <i class="fas fa-fist-raised"></i> START FIGHT
            </button>
        </div>

        <!-- Bet Controls -->
        <div class="bet-controls">
            <!-- Quick Bets -->
            <div class="quick-bets">
                <div class="quick-bet" data-amount="5">$5</div>
                <div class="quick-bet" data-amount="10">$10</div>
                <div class="quick-bet" data-amount="25">$25</div>
                <div class="quick-bet" data-amount="50">$50</div>
                <div class="quick-bet" data-amount="100">$100</div>
                <div class="quick-bet" data-amount="250">$250</div>
                <div class="quick-bet" data-amount="500">$500</div>
                <div class="quick-bet" data-amount="1000">$1000</div>
            </div>

            <!-- Bet Input -->
            <div class="bet-input-group">
                <input type="number" class="bet-input" id="bet-amount" value="25" min="5" max="1000" step="5">
                <div class="currency">$</div>
            </div>
        </div>

        <!-- History Panel -->
        <div class="history-panel">
            <div class="history-title">
                <i class="fas fa-history"></i> FIGHT HISTORY
            </div>
            <div class="history-list" id="history-list">
                <!-- History items will be added here -->
            </div>
        </div>

        <!-- Live Winners Feed -->
        <div class="winners-feed">
            <div class="winners-title">
                <i class="fas fa-trophy"></i> RECENT KNOCKOUTS
            </div>
            <div class="winners-list" id="winners-list">
                <!-- Winner items will be added here -->
            </div>

        // ===== CANVAS ARENA SYSTEM =====
        class ArenaSystem {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.particles = [];
                this.lights = [];
                this.resize();
                
                // Handle resize
                window.addEventListener('resize', () => this.resize());
            }
            
            resize() {
                this.canvas.width = this.canvas.offsetWidth;
                this.canvas.height = this.canvas.offsetHeight;
            }
            
            // Draw arena ring
            drawRing() {
                const centerX = this.canvas.width / 2;
                const centerY = this.canvas.height / 2;
                const ringSize = Math.min(this.canvas.width, this.canvas.height) * 0.4;
                
                // Outer ring
                this.ctx.beginPath();
                this.ctx.arc(centerX, centerY, ringSize, 0, Math.PI * 2);
                this.ctx.strokeStyle = '#444';
                this.ctx.lineWidth = 10;
                this.ctx.stroke();
                
                // Inner ring
                this.ctx.beginPath();
                this.ctx.arc(centerX, centerY, ringSize - 20, 0, Math.PI * 2);
                this.ctx.strokeStyle = '#ff3b30';
                this.ctx.lineWidth = 5;
                this.ctx.stroke();
                
                // Ring floor
                const gradient = this.ctx.createRadialGradient(
                    centerX, centerY, 0,
                    centerX, centerY, ringSize - 25
                );
                gradient.addColorStop(0, 'rgba(255, 59, 48, 0.1)');
                gradient.addColorStop(1, 'rgba(0, 0, 0, 0.5)');
                
                this.ctx.beginPath();
                this.ctx.arc(centerX, centerY, ringSize - 25, 0, Math.PI * 2);
                this.ctx.fillStyle = gradient;
                this.ctx.fill();
                
                // Corner posts
                const corners = [
                    {x: centerX - ringSize, y: centerY - ringSize},
                    {x: centerX + ringSize, y: centerY - ringSize},
                    {x: centerX - ringSize, y: centerY + ringSize},
                    {x: centerX + ringSize, y: centerY + ringSize}
                ];
                
                corners.forEach(corner => {
                    this.ctx.beginPath();
                    this.ctx.arc(corner.x, corner.y, 15, 0, Math.PI * 2);
                    this.ctx.fillStyle = '#ff3b30';
                    this.ctx.fill();
                    this.ctx.strokeStyle = '#fff';
                    this.ctx.lineWidth = 2;
                    this.ctx.stroke();
                });
            }
            
            // Create impact effect
            createImpact(x, y, type) {
                const colors = {
                    safe: ['#4caf50', '#8bc34a'],
                    knockdown: ['#ff9800', '#ffc107'],
                    knockout: ['#ff3b30', '#ff5252']
                };
                
                const colorSet = colors[type] || colors.safe;
                
                for (let i = 0; i < 30; i++) {
                    this.particles.push({
                        x, y,
                        vx: (Math.random() - 0.5) * 15,
                        vy: (Math.random() - 0.5) * 15,
                        radius: Math.random() * 5 + 2,
                        color: colorSet[Math.floor(Math.random() * colorSet.length)],
                        alpha: 1,
                        life: 40,
                        gravity: 0.1
                    });
                }
                
                // Add shockwave
                this.lights.push({
                    x, y,
                    radius: 5,
                    maxRadius: 100,
                    color: colorSet[0],
                    alpha: 0.8,
                    life: 30
                });
            }
            
            createKnockoutEffect() {
                const centerX = this.canvas.width / 2;
                const centerY = this.canvas.height / 2;
                
                // Big explosion
                for (let i = 0; i < 100; i++) {
                    this.particles.push({
                        x: centerX,
                        y: centerY,
                        vx: (Math.random() - 0.5) * 20,
                        vy: (Math.random() - 0.5) * 20,
                        radius: Math.random() * 8 + 3,
                        color: '#ff3b30',
                        alpha: 1,
                        life: 60,
                        gravity: 0.05
                    });
                }
                
                // Multiple shockwaves
                for (let i = 0; i < 3; i++) {
                    setTimeout(() => {
                        this.lights.push({
                            x: centerX,
                            y: centerY,
                            radius: 10,
                            maxRadius: 200,
                            color: '#ff3b30',
                            alpha: 0.6,
                            life: 40
                        });
                    }, i * 100);
                }
            }
            
            createVictoryEffect() {
                const centerX = this.canvas.width / 2;
                const centerY = this.canvas.height / 2;
                
                // Confetti
                const colors = ['#ffd700', '#ff9800', '#4caf50', '#2196f3'];
                for (let i = 0; i < 80; i++) {
                    this.particles.push({
                        x: centerX,
                        y: centerY,
                        vx: (Math.random() - 0.5) * 12,
                        vy: Math.random() * -20 - 5,
                        radius: Math.random() * 6 + 2,
                        color: colors[Math.floor(Math.random() * colors.length)],
                        alpha: 1,
                        life: 120,
                        gravity: 0.2
                    });
                }
            }
            
            update() {
                // Clear canvas with dark fade
                this.ctx.fillStyle = 'rgba(10, 10, 10, 0.2)';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                
                // Draw ring
                this.drawRing();
                
                // Update lights
                for (let i = this.lights.length - 1; i >= 0; i--) {
                    const light = this.lights[i];
                    
                    // Draw light
                    const gradient = this.ctx.createRadialGradient(
                        light.x, light.y, light.radius,
                        light.x, light.y, light.maxRadius
                    );
                    gradient.addColorStop(0, light.color + Math.floor(light.alpha * 255).toString(16).padStart(2, '0'));
                    gradient.addColorStop(1, 'transparent');
                    
                    this.ctx.beginPath();
                    this.ctx.arc(light.x, light.y, light.maxRadius, 0, Math.PI * 2);
                    this.ctx.fillStyle = gradient;
                    this.ctx.fill();
                    
                    // Animate
                    light.radius += (light.maxRadius - light.radius) * 0.2;
                    light.alpha -= 1 / light.life;
                    
                    // Remove dead lights
                    if (light.alpha <= 0) {
                        this.lights.splice(i, 1);
                    }
                }
                
                // Update particles
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const p = this.particles[i];
                    
                    // Apply physics
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += (p.gravity || 0);
                    p.alpha -= 1 / p.life;
                    
                    // Draw particle
                    this.ctx.beginPath();
                    this.ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    this.ctx.fillStyle = p.color;
                    this.ctx.globalAlpha = p.alpha;
                    this.ctx.fill();
                    
                    // Remove dead particles
                    if (p.alpha <= 0 || p.y > this.canvas.height || p.x < 0 || p.x > this.canvas.width) {
                        this.particles.splice(i, 1);
                    }
                }
                
                this.ctx.globalAlpha = 1;
            }
        }

        // ===== BALANCE MANAGEMENT =====
        async function loadBalance() {

                    gameState.balance = doc.data().balance || 0;
                    updateBalanceDisplay();

                        updatedAt: new Date()

        // ===== REAL-TIME LISTENERS =====
        function setupRealTimeListeners() {
            if (!gameState.currentUser) return;
            
            const walletRef = db.collection("wallets").doc(gameState.currentUser.uid);
            
            walletRef.onSnapshot((doc) => {
                if (doc.exists) {
                    const newBalance = doc.data().balance || 0;
                    if (newBalance !== gameState.balance) {
                        gameState.balance = newBalance;
                        updateBalanceDisplay();
                        updateBetLimits();
                    }
                }
            }, (error) => {
                console.error('Balance listener error:', error);
            });
        }

        // ===== ATOMIC TRANSACTIONS =====
        async function processTransaction(amount, type, description) {
            try {
                const walletRef = db.collection("wallets").doc(gameState.currentUser.uid);
                
                return await db.runTransaction(async (transaction) => {
                    const walletDoc = await transaction.get(walletRef);
                    
                    if (!walletDoc.exists) {
                        throw new Error("Wallet not found");
                    }
                    
                    const currentBalance = walletDoc.data().balance || 0;
                    const newBalance = currentBalance + amount;
                    
                    if (newBalance < 0) {
                        throw new Error("Insufficient funds");
                    }
                    
                    // Update main balance
                    transaction.update(walletRef, {
                        balance: newBalance,
                        updatedAt: new Date()
                    });
                    
                    // Record transaction
                    const transactionRef = walletRef.collection("transactions").doc();
                    transaction.set(transactionRef, {
                        type: type,
                        amount: amount,
                        description: description,
                        createdAt: new Date(),
                        gameId: gameState.roundId || 'knockout_night',
                        beforeBalance: currentBalance,
                        afterBalance: newBalance
                    });
                    
                    // Update game history
                    const gameHistoryRef = db.collection("knockout_history").doc(gameState.currentUser.uid).collection("fights").doc();
                    transaction.set(gameHistoryRef, {
                        userId: gameState.currentUser.uid,
                        gameId: gameState.roundId,
                        bet: gameState.betAmount,
                        round: gameState.round,
                        multiplier: gameState.multiplier,
                        result: amount > 0 ? 'cashout' : 'knockout',
                        amount: amount,
                        timestamp: new Date()
                    });
                    
                    // Update local balance
                    gameState.balance = newBalance;
                    updateBalanceDisplay();
                    
                    return { success: true, newBalance };
                    
                });
            } catch (error) {
                console.error('Transaction failed:', error);
                showToast('Transaction failed: ' + error.message, 'error');
                return { success: false, error: error.message };
            }
        }

        // ===== GAME LOGIC =====
        async function startFight() {
            const betAmount = parseFloat(document.getElementById('bet-amount').value);
            
            // Validation
            if (betAmount < 5 || betAmount > Math.min(gameState.balance, 1000)) {
                showToast('Bet must be between $5 and $' + Math.min(gameState.balance, 1000), 'error');
                return;
            }
            
            if (gameState.roundActive) {
                showToast('Fight already in progress', 'warning');
                return;
            }
            
            // Process bet transaction
            const result = await processTransaction(
                -betAmount,
                "knockout_bet",
                `Knockout Night bet of $${betAmount}`

            if (!result.success) {
                return;
            }
            
            // Update game state
            gameState.betAmount = betAmount;
            gameState.round = 1;
            gameState.multiplier = gameState.roundMultipliers[1];
            gameState.currentWin = betAmount * gameState.multiplier;
            gameState.health = 100;
            gameState.roundActive = true;
            gameState.gamePhase = 'countdown';
            gameState.roundId = 'knockout_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            gameState.canCashout = true;
            
            // Update UI
            updateUI();
            updateHealthBar();
            
            // Start countdown
            startCountdown();
        }

        function startCountdown() {
            let countdown = 5;
            const timerElement = document.getElementById('countdown-timer');
            const countdownValue = document.getElementById('countdown-value');
            const betInput = document.getElementById('bet-amount');
            const fightBtn = document.getElementById('fight-btn');
            
            // Show timer
            timerElement.style.display = 'block';
            countdownValue.textContent = countdown;
            
            // Disable controls
            betInput.disabled = true;
            fightBtn.disabled = true;
            document.querySelectorAll('.quick-bet').forEach(btn => {
                btn.style.pointerEvents = 'none';
                btn.style.opacity = '0.5';
            });
            
            // Countdown interval
            const countdownInterval = setInterval(() => {
                countdown--;
                countdownValue.textContent = countdown;
                
                if (countdown === 0) {
                    clearInterval(countdownInterval);
                    timerElement.style.display = 'none';
                    startRound();
                }
            }, 1000);
            
            // Store interval for cancellation
            gameState.countdownInterval = countdownInterval;
        }

        function startRound() {
            gameState.gamePhase = 'fighting';
            updateUI();
            
            // Show round display
            document.getElementById('round-display').textContent = `ROUND ${gameState.round}`;
            
            // Process round after delay
            setTimeout(() => {
                processRound();
            }, 1500);
        }

        function processRound() {
            // Apply hidden survival rate (10-15% chance to survive)
            const survivalRate = gameState.survivalRate();
            const roll = Math.random();
            
            let result;
            if (roll <= survivalRate) {
                // Player survives (safe)
                result = 'safe';
            } else if (roll <= survivalRate + 0.2) {
                // Player gets knockdown (warning)
                result = 'knockdown';
            } else {
                // Player gets knocked out
                result = 'knockout';
            }
            
            // Process result
            processRoundResult(result);
        }

        function processRoundResult(result) {
            const centerX = document.getElementById('arena-canvas').width / 2;
            const centerY = document.getElementById('arena-canvas').height / 2;
            
            switch (result) {
                case 'safe':
                    // Player survives
                    handleSafe();
                    arenaSystem.createImpact(centerX, centerY, 'safe');
                    break;
                    
                case 'knockdown':
                    // Player gets knockdown
                    handleKnockdown();
                    arenaSystem.createImpact(centerX, centerY, 'knockdown');
                    break;
                    
                case 'knockout':
                    // Player gets knocked out
                    handleKnockout();
                    arenaSystem.createKnockoutEffect();
                    break;
            }
        }

        function handleSafe() {
            // Update health
            gameState.health -= gameState.healthDamage.safe;
            if (gameState.health < 0) gameState.health = 0;
            
            // Update multiplier for next round
            gameState.round++;
            gameState.multiplier = gameState.roundMultipliers[gameState.round] || gameState.multiplier * 2;
            gameState.currentWin = gameState.betAmount * gameState.multiplier;
            
            // Show result
            showResult(`SAFE! Round ${gameState.round-1} Complete`, 'win');
            
            // Update history
            addGameHistory('Safe', 'safe', gameState.round-1, gameState.multiplier);
            
            // Update UI for next round
            gameState.gamePhase = 'result';
            updateUI();
            updateHealthBar();
            
            // Enable continue/cashout buttons
            document.getElementById('continue-btn').disabled = false;
            document.getElementById('cashout-btn').disabled = false;
        }

        function handleKnockdown() {
            // Update health
            gameState.health -= gameState.healthDamage.knockdown;
            if (gameState.health < 0) gameState.health = 0;
            
            // Show result
            showResult(`KNOCKDOWN! Round ${gameState.round}`, 'knockdown');
            
            // Update history
            addGameHistory('Knockdown', 'knockdown', gameState.round, gameState.multiplier);
            
            // Update UI
            updateUI();
            updateHealthBar();
            
            // Player can still continue or cash out
            setTimeout(() => {
                gameState.gamePhase = 'result';
                updateUI();
                document.getElementById('continue-btn').disabled = false;
                document.getElementById('cashout-btn').disabled = false;
            }, 2000);
        }

        function handleKnockout() {
            // Player loses
            gameState.health = 0;
            
            // Show result
            showResult(`KNOCKOUT! You lost Round ${gameState.round}`, 'knockout');
            
            // Update history
            addGameHistory('Knockout', 'knockout', gameState.round, gameState.multiplier);
            
            // Update UI
            updateUI();
            updateHealthBar();
            
            // Add to winners feed (someone else won)
            addToWinnersFeed(gameState.betAmount * gameState.multiplier);
            
            // Reset game state after delay
            setTimeout(() => {
                gameState.roundActive = false;
                gameState.gamePhase = 'idle';
                gameState.round = 1;
                gameState.multiplier = 1.00;
                gameState.currentWin = 0;
                gameState.health = 100;
                updateUI();
                updateHealthBar();
                
                // Re-enable bet controls
                document.getElementById('bet-amount').disabled = false;
                document.getElementById('fight-btn').disabled = false;
                document.querySelectorAll('.quick-bet').forEach(btn => {
                    btn.style.pointerEvents = 'auto';
                    btn.style.opacity = '1';
                });
            }, 3000);
        }

        async function cashOut() {
            if (!gameState.roundActive || !gameState.canCashout) return;
            
            // Process win transaction
            const winAmount = gameState.currentWin;
            const result = await processTransaction(
                winAmount,
                "knockout_cashout",
                `Knockout Night cashout of $${winAmount.toFixed(2)} (Round ${gameState.round})`
            );
            
            if (result.success) {
                // Show victory effect
                const centerX = document.getElementById('arena-canvas').width / 2;
                const centerY = document.getElementById('arena-canvas').height / 2;
                arenaSystem.createVictoryEffect();
                
                showResult(`CASHOUT! You won $${winAmount.toFixed(2)}`, 'win');
                addGameHistory('Cashout', 'safe', gameState.round, gameState.multiplier);
                
                // Add to winners feed
                addToWinnersFeed(winAmount);
            }
            
            // Reset game state
            setTimeout(() => {
                gameState.roundActive = false;
                gameState.gamePhase = 'idle';
                gameState.round = 1;
                gameState.multiplier = 1.00;
                gameState.currentWin = 0;
                gameState.health = 100;
                updateUI();
                updateHealthBar();
                
                // Re-enable bet controls
                document.getElementById('bet-amount').disabled = false;
                document.getElementById('fight-btn').disabled = false;
                document.querySelectorAll('.quick-bet').forEach(btn => {
                    btn.style.pointerEvents = 'auto';
                    btn.style.opacity = '1';
                });
            }, 2000);
        }

        function continueFight() {
            if (!gameState.roundActive) return;
            
            // Start next round
            gameState.gamePhase = 'fighting';
            gameState.canCashout = true;
            updateUI();
            
            // Show round display
            document.getElementById('round-display').textContent = `ROUND ${gameState.round}`;
            
            // Process next round after delay
            setTimeout(() => {
                processRound();
            }, 1000);
        }

        function showResult(message, type) {
            const banner = document.getElementById('result-banner');
            const text = document.getElementById('result-text');
            
            text.textContent = message;
            banner.className = `result-banner show ${type}`;
            
            // Auto hide after 3 seconds
            setTimeout(() => {
                banner.classList.remove('show');

        function updateHealthBar() {
            const healthBar = document.getElementById('health-bar');
            healthBar.style.width = `${gameState.health}%`;
            
            // Update color based on health
            if (gameState.health > 60) {
                healthBar.style.background = 'linear-gradient(90deg, #4caf50, #8bc34a)';
            } else if (gameState.health > 30) {
                healthBar.style.background = 'linear-gradient(90deg, #ff9800, #ffc107)';
            } else {
                healthBar.style.background = 'linear-gradient(90deg, #ff3b30, #ff5252)';
            }
        }

        // ===== WINNERS FEED =====
        function startWinnersFeed() {
            // Add initial winners
            for (let i = 0; i < 5; i++) {
                addRandomWinner();
            }
            
            // Add new winners periodically
            setInterval(() => {
                if (Math.random() > 0.4) { // 60% chance to add new winner
                    addRandomWinner();
                }
            }, 8000 + Math.random() * 12000); // Random interval 8-20 seconds
        }

        function addRandomWinner() {
            const winner = {
                name: gameState.winnersPool[Math.floor(Math.random() * gameState.winnersPool.length)],
                amount: Math.floor(Math.random() * 2000) + 100,
                time: Math.floor(Math.random() * 10) + 1
            };
            
            addToWinnersFeed(winner.amount, winner.name, winner.time);
        }

        function addToWinnersFeed(amount, name = null, time = null) {
            const winnerName = name || gameState.winnersPool[Math.floor(Math.random() * gameState.winnersPool.length)];
            const winTime = time || 1;
            
            const winnersList = document.getElementById('winners-list');
            const winnerItem = document.createElement('div');
            winnerItem.className = 'winner-item';
            
            winnerItem.innerHTML = `
                <div class="winner-avatar">
                    <i class="fas fa-fist-raised"></i>
                </div>
                <div class="winner-name">${winnerName}</div>
                <div class="winner-amount">$${amount.toFixed(2)}</div>
                <div class="winner-time">${winTime} min ago</div>
            `;
            
            winnersList.insertBefore(winnerItem, winnersList.firstChild);
            
            // Limit to 10 items
            if (winnersList.children.length > 10) {
                winnersList.removeChild(winnersList.lastChild);
            }
        }

        // ===== GAME HISTORY =====
        function addGameHistory(action, result, round, multiplier) {
            const historyItem = {
                action: action,
                result: result,
                round: round,
                multiplier: multiplier,
                timestamp: new Date()
            };
            
            gameState.gameHistory.unshift(historyItem);
            if (gameState.gameHistory.length > 10) {
                gameState.gameHistory.pop();
            }
            
            updateHistoryDisplay();
            
            // Save to Firebase
            saveGameHistoryToFirebase(historyItem);
        }

        function updateHistoryDisplay() {
            const historyList = document.getElementById('history-list');
            historyList.innerHTML = '';
            
            gameState.gameHistory.forEach(item => {
                const historyItem = document.createElement('div');
                historyItem.className = `history-item ${item.result}`;
                
                const actionText = item.action === 'Safe' ? `Round ${item.round}` : item.action;
                
                historyItem.innerHTML = `
                    <div class="history-round">R${item.round}</div>
                    <div class="history-result">${actionText}</div>
                    <div class="history-multiplier ${item.result}">${item.multiplier.toFixed(2)}x</div>
                `;
                
                historyList.appendChild(historyItem);
            });
        }

        async function saveGameHistoryToFirebase(historyItem) {
            try {
                await db.collection("knockout_history")
                    .doc(gameState.currentUser?.uid)
                    .collection("rounds")
                    .add({
                        userId: gameState.currentUser.uid,
                        ...historyItem,
                        gameId: gameState.roundId
                    });
            } catch (error) {
                console.error('Error saving game history:', error);
            }
        }

        async function loadGameHistory() {
            try {
                if (!gameState.currentUser) return;
                
                const snapshot = await db.collection("knockout_history")
                    .doc(gameState.currentUser.uid)
                    .collection("rounds")
                    .orderBy('timestamp', 'desc')
                    .limit(10)
                    .get();
                
                snapshot.forEach(doc => {
                    const data = doc.data();
                    gameState.gameHistory.push({
                        action: data.action || 'Round',
                        result: data.result || 'safe',
                        round: data.round || 1,
                        multiplier: data.multiplier || 1.00,
                        timestamp: data.timestamp?.toDate() || new Date()
                    });
                });
                
                updateHistoryDisplay();
            } catch (error) {
                console.error('Error loading game history:', error);
            }
        }

        // ===== UI UPDATES =====
        function updateUI() {
            // Update round display
            document.getElementById('round-display').textContent = gameState.roundActive ? `ROUND ${gameState.round}` : 'KNOCKOUT NIGHT';
            
            // Update multiplier
            document.getElementById('multiplier-value').textContent = `${gameState.multiplier.toFixed(2)}x`;
            
            // Update current win
            document.getElementById('current-win-amount').textContent = gameState.currentWin.toFixed(2);
            
            // Update button states based on game phase
            const fightBtn = document.getElementById('fight-btn');
            const cashoutBtn = document.getElementById('cashout-btn');
            const continueBtn = document.getElementById('continue-btn');
            const betInput = document.getElementById('bet-amount');
            
            switch (gameState.gamePhase) {
                case 'idle':
                    fightBtn.disabled = false;
                    cashoutBtn.disabled = true;
                    continueBtn.disabled = true;
                    betInput.disabled = false;
                    fightBtn.innerHTML = '<i class="fas fa-fist-raised"></i> START FIGHT';
                    break;
                    
                case 'countdown':
                case 'fighting':
                    fightBtn.disabled = true;
                    cashoutBtn.disabled = true;
                    continueBtn.disabled = true;
                    betInput.disabled = true;
                    fightBtn.innerHTML = '<i class="fas fa-fist-raised"></i> FIGHTING...';
                    break;
                    
                case 'result':
                    fightBtn.disabled = true;
                    cashoutBtn.disabled = !gameState.canCashout;
                    continueBtn.disabled = false;
                    betInput.disabled = true;
                    fightBtn.innerHTML = '<i class="fas fa-fist-raised"></i> IN PROGRESS';
                    break;
            }
            
            // Show/hide health bar
            document.getElementById('player-health').style.display = 
                gameState.roundActive ? 'block' : 'none';
            
            // Update bet limits
            updateBetLimits();
        }

        function updateBetLimits() {
            const betInput = document.getElementById('bet-amount');
            betInput.max = Math.min(gameState.balance, 1000);
            
            if (parseFloat(betInput.value) > betInput.max) {
                betInput.value = betInput.max;
            }
        }

        // ===== EVENT LISTENERS =====
        function setupEventListeners() {
            // Fight button
            document.getElementById('fight-btn').addEventListener('click', startFight);
            
            // Cashout button
            document.getElementById('cashout-btn').addEventListener('click', cashOut);
            
            // Continue button
            document.getElementById('continue-btn').addEventListener('click', continueFight);
            
            // Quick bet buttons
            document.querySelectorAll('.quick-bet').forEach(btn => {
                btn.addEventListener('click', () => {
                    if (gameState.roundActive) return;
                    
                    const amount = parseFloat(btn.dataset.amount);
                    document.getElementById('bet-amount').value = amount;
                    gameState.betAmount = amount;
                    
                    // Update active state
                    document.querySelectorAll('.quick-bet').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                });
            });
            
            // Bet input
            document.getElementById('bet-amount').addEventListener('input', (e) => {
                if (gameState.roundActive) return;
                
                let value = parseFloat(e.target.value) || 5;
                value = Math.max(5, Math.min(value, Math.min(gameState.balance, 1000)));
                e.target.value = value;
                gameState.betAmount = value;
                
                // Update active quick bet
                document.querySelectorAll('.quick-bet').forEach(btn => {
                    btn.classList.toggle('active', parseFloat(btn.dataset.amount) === value);
                });
            });
            
            // Fullscreen button
            document.getElementById('fullscreen-btn').addEventListener('click', toggleFullscreen);
            
            // Prevent form submission
            document.getElementById('bet-amount').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    startFight();
                }
            });
        }

        // ===== FULLSCREEN =====
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.error(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // Update fullscreen button icon
        document.addEventListener('fullscreenchange', () => {
            const btn = document.getElementById('fullscreen-btn');
            if (document.fullscreenElement) {
                btn.querySelector('.fa-expand').style.display = 'none';
                btn.querySelector('.fa-compress').style.display = 'block';
            } else {
                btn.querySelector('.fa-expand').style.display = 'block';
                btn.querySelector('.fa-compress').style.display = 'none';
            }
        });

        // ===== TOAST NOTIFICATIONS =====
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.add('show');
            }, 10);
            
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => {
                    if (container.contains(toast)) {
                        container.removeChild(toast);
                    }
                }, 300);
            }, 3000);
        }

        // ===== INITIAL SETUP =====
        // Set initial active quick bet
        document.querySelector(`.quick-bet[data-amount="25"]`).classList.add('active');
        
        // Setup real-time listeners after auth
        auth.onAuthStateChanged(user => {
            if (user) {
                setupRealTimeListeners();
            }
        });
    </script>
</body>
</html>
