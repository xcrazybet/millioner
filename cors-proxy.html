<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORS Proxy Betting Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">
    <div class="max-w-6xl mx-auto">
        <h1 class="text-3xl font-bold text-center mb-8 text-blue-600">🏆 CORS Proxy Betting Platform</h1>
        
        <!-- Status Display -->
        <div id="status" class="bg-white p-4 rounded-lg shadow mb-6">
            <h2 class="text-xl font-semibold mb-2">API Status</h2>
            <div id="statusContent" class="text-gray-600">Testing connection...</div>
        </div>
        
        <!-- Match Display -->
        <div id="matches" class="bg-white p-4 rounded-lg shadow">
            <h2 class="text-xl font-semibold mb-4">Matches</h2>
            <div id="matchesContent" class="space-y-4">
                <div class="text-center py-8 text-gray-500">Loading matches...</div>
            </div>
        </div>
        
        <!-- Controls -->
        <div class="mt-6 bg-white p-4 rounded-lg shadow">
            <button onclick="testProxy()" class="bg-purple-500 text-white px-4 py-2 rounded mr-2 hover:bg-purple-600">
                🧪 Test Proxy
            </button>
            <button onclick="loadLiveMatches()" class="bg-red-500 text-white px-4 py-2 rounded mr-2 hover:bg-red-600">
                🔥 Live Matches
            </button>
            <button onclick="loadUpcomingMatches()" class="bg-blue-500 text-white px-4 py-2 rounded mr-2 hover:bg-blue-600">
                📅 Upcoming
            </button>
            <button onclick="loadFinishedMatches()" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">
                🏁 Finished
            </button>
        </div>
        
        <!-- Debug Info -->
        <div class="mt-6 bg-yellow-50 p-4 rounded-lg border border-yellow-200">
            <h3 class="font-semibold text-yellow-800 mb-2">🔧 Debug Info</h3>
            <div id="debugInfo" class="text-sm text-yellow-700">Loading debug info...</div>
        </div>
    </div>

    <script>
        const API_TOKEN = 'DkFdWG9jFZvH8XSEgLrRfGwczABWVg5rlV25GvIRyN06zdPsOI48Nsv9Wooy';
        
        // CORS Proxy options - try multiple
        const PROXIES = [
            'https://cors-anywhere.herokuapp.com/',
            'https://api.allorigins.win/raw?url=',
            'https://corsproxy.io/?',
            'https://cors.bridged.cc/'
        ];
        
        let currentProxy = 0;
        
        // Update status display
        function updateStatus(message, type = 'info') {
            const statusContent = document.getElementById('statusContent');
            const colors = {
                'success': 'text-green-600',
                'error': 'text-red-600',
                'warning': 'text-yellow-600',
                'info': 'text-blue-600'
            };
            
            statusContent.className = colors[type] || 'text-gray-600';
            statusContent.innerHTML = message;
        }
        
        // Update debug info
        function updateDebug(message) {
            document.getElementById('debugInfo').innerHTML = message;
        }
        
        // Make API call through proxy
        async function callAPI(url) {
            for (let i = 0; i < PROXIES.length; i++) {
                const proxy = PROXIES[i];
                const proxyUrl = proxy + url;
                
                try {
                    updateStatus(`Trying proxy ${i + 1}/${PROXIES.length}: ${proxy}`, 'info');
                    updateDebug(`Attempting: ${proxyUrl}`);
                    
                    console.log(`📡 Trying proxy ${i + 1}:`, proxyUrl);
                    
                    const response = await fetch(proxyUrl);
                    console.log(`📊 Proxy ${i + 1} response:`, response.status);
                    
                    if (response.ok) {
                        const data = await response.json();
                        console.log(`✅ Proxy ${i + 1} success!`, data);
                        
                        updateStatus(`✅ Success using proxy ${i + 1}`, 'success');
                        updateDebug(`Working proxy: ${proxy}`);
                        currentProxy = i;
                        return data;
                    }
                } catch (error) {
                    console.log(`❌ Proxy ${i + 1} failed:`, error.message);
                    updateDebug(`Proxy ${i + 1} failed: ${error.message}`);
                }
            }
            
            updateStatus('❌ All proxies failed', 'error');
            updateDebug('No working CORS proxy found. Try using a local server instead.');
            return null;
        }
        
        // Display matches
        function displayMatches(matches, title) {
            const matchesContent = document.getElementById('matchesContent');
            
            if (!matches || matches.length === 0) {
                matchesContent.innerHTML = `
                    <div class="text-center py-8 text-gray-500">
                        <div class="text-2xl mb-2">📋</div>
                        <div>No ${title} matches found</div>
                        <div class="text-sm mt-2">Try again later or check a different category</div>
                    </div>
                `;
                return;
            }
            
            let html = `<div class="text-lg font-semibold mb-4">${matches.length} ${title} matches found</div>`;
            
            matches.slice(0, 10).forEach(match => {
                const participants = match.participants || [];
                const homeTeam = participants.find(p => p.meta?.location === 'home') || participants[0];
                const awayTeam = participants.find(p => p.meta?.location === 'away') || participants[1];
                const scores = match.scores || {};
                const homeScore = scores.home_score || 0;
                const awayScore = scores.away_score || 0;
                const time = match.starting_at ? new Date(match.starting_at).toLocaleString() : 'Time TBD';
                
                html += `
                    <div class="border rounded-lg p-4 hover:bg-gray-50">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-sm text-gray-600">${match.league?.name || 'League'}</span>
                            <span class="text-sm text-gray-500">${time}</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <div class="flex-1 text-center">
                                <div class="font-semibold">${homeTeam?.name || 'Home Team'}</div>
                                <div class="text-xl font-bold text-blue-600">${homeScore}</div>
                            </div>
                            <div class="px-4 text-gray-400">VS</div>
                            <div class="flex-1 text-center">
                                <div class="font-semibold">${awayTeam?.name || 'Away Team'}</div>
                                <div class="text-xl font-bold text-blue-600">${awayScore}</div>
                            </div>
                        </div>
                        <div class="mt-2 text-center">
                            <span class="text-xs bg-gray-200 px-2 py-1 rounded">State: ${match.state_id || 'N/A'}</span>
                        </div>
                    </div>
                `;
            });
            
            matchesContent.innerHTML = html;
        }
        
        // Test proxy
        async function testProxy() {
            updateStatus('Testing CORS proxies...', 'info');
            
            const testUrl = `https://api.sportmonks.com/v3/football/livescores?api_token=${API_TOKEN}&include=state;participants;league;scores&per_page=3`;
            const data = await callAPI(testUrl);
            
            if (data) {
                updateStatus('✅ Proxy working!', 'success');
                updateDebug(`Found ${data.data?.length || 0} test matches`);
            }
        }
        
        // Load live matches
        async function loadLiveMatches() {
            updateStatus('Loading live matches...', 'info');
            
            const url = `https://api.sportmonks.com/v3/football/livescores/inplay?api_token=${API_TOKEN}&include=state;participants;league;scores&per_page=10`;
            let data = await callAPI(url);
            
            if (data && data.data && data.data.length > 0) {
                displayMatches(data.data, 'Live');
                return;
            }
            
            // Fallback to general livescores
            const fallbackUrl = `https://api.sportmonks.com/v3/football/livescores?api_token=${API_TOKEN}&include=state;participants;league;scores&per_page=10`;
            data = await callAPI(fallbackUrl);
            
            if (data && data.data && data.data.length > 0) {
                const liveMatches = data.data.filter(match => [2, 3, 4, 5, 6].includes(match.state_id));
                displayMatches(liveMatches, 'Live');
                return;
            }
            
            displayMatches([], 'Live');
        }
        
        // Load upcoming matches
        async function loadUpcomingMatches() {
            updateStatus('Loading upcoming matches...', 'info');
            
            const today = new Date().toISOString().split('T')[0];
            const url = `https://api.sportmonks.com/v3/football/fixtures/date/${today}?api_token=${API_TOKEN}&include=participants;state;league;scores&per_page=15`;
            const data = await callAPI(url);
            
            if (data && data.data && data.data.length > 0) {
                const upcoming = data.data.filter(match => [1, 45, 46].includes(match.state_id));
                displayMatches(upcoming, 'Upcoming');
                return;
            }
            
            displayMatches([], 'Upcoming');
        }
        
        // Load finished matches
        async function loadFinishedMatches() {
            updateStatus('Loading finished matches...', 'info');
            
            const url = `https://api.sportmonks.com/v3/football/fixtures?api_token=${API_TOKEN}&include=participants;state;league;scores&per_page=20`;
            const data = await callAPI(url);
            
            if (data && data.data && data.data.length > 0) {
                const finished = data.data.filter(match => [100, 90, 5].includes(match.state_id))
                    .sort((a, b) => new Date(b.starting_at) - new Date(a.starting_at))
                    .slice(0, 15);
                displayMatches(finished, 'Finished');
                return;
            }
            
            displayMatches([], 'Finished');
        }
        
        // Initialize
        window.onload = function() {
            console.log('🚀 CORS Proxy Betting Platform Loaded');
            updateDebug('Platform ready. Click "Test Proxy" to check CORS bypass.');
            testProxy();
        };
    </script>
</body>
</html>
