name: Update Football Data
on:
  schedule:
    - cron: '*/3 * * * *'  # Every 3 minutes
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Update
        run: |
          curl -s "https://xcrazybet.github.io/millioner/fot.html" > /dev/null
          echo "Data updated at $(date)"
