async function loadBalance() {
    try {
        const u = auth.currentUser; if (!u) return 0;
        const doc = await db.collection('wallets').doc(u.uid).get();
        const balance = doc.exists ? (parseFloat(doc.data().balance) || 0) : 1000;
        document.getElementById('balance-display').textContent = `$${balance.toFixed(2)}`;
        return balance;
    } catch (e) { debugError('Balance load failed:', e.message); return 0; }
}

async function loadBets() {
    const u = auth.currentUser; if (!u) return;
    const statusEl = document.getElementById('loading-status');
    
    try {
        if (statusEl) statusEl.textContent = 'Connecting to database...';
        
        const { data, error } = await supabaseClient.from('bets').select('*')
            .eq('user_id', u.uid).order('placed_at', { ascending: false });
            
        if (error) throw new Error(`Database error: ${error.message || JSON.stringify(error)}`);
        
        const rawBets = data || [];
        if (statusEl) statusEl.textContent = `Processing ${rawBets.length} bets...`;
        
        const allFixtureIds = new Set();
        for (const bet of rawBets) {
            if (bet.fixture_id) allFixtureIds.add(bet.fixture_id);
            let selections = bet.selections;
            if (typeof selections === 'string') selections = safeParseJSON(selections);
            if (Array.isArray(selections)) {
                bet.selections = selections;
                selections.forEach(s => { const fid = s.fixtureId || s.fixture_id; if (fid) allFixtureIds.add(fid); });
            }
        }
        
        const matchMap = [...allFixtureIds].length > 0 ? await fetchMatchesBatch([...allFixtureIds]) : {};
        if (statusEl) statusEl.textContent = 'Enriching bet data...';
        
        for (const bet of rawBets) {
            if (bet.selections && typeof bet.selections === 'string') bet.selections = safeParseJSON(bet.selections) || [];
            const hasMulti = Array.isArray(bet.selections) && bet.selections.length > 0;
            if (hasMulti && bet.bet_type !== 'accumulator') bet.bet_type = 'accumulator';
            if (!hasMulti && bet.bet_type === 'accumulator') bet.bet_type = 'home';
            if (hasMulti) bet.selections.forEach(s => { const fid = s.fixtureId || s.fixture_id; if (fid && matchMap[fid]) s._match = matchMap[fid]; });
            
            let hFb = 'Home', aFb = 'Away';
            if (bet.match_name?.includes(' vs ')) { const p = bet.match_name.split(' vs '); if (p[0]?.trim()) hFb = p[0].trim(); if (p[1]?.trim()) aFb = p[1].trim(); }
            
            if (bet.fixture_id && matchMap[bet.fixture_id]) {
                const m = matchMap[bet.fixture_id];
                const hn = m.home_team?.name && m.home_team.name !== 'Home' ? m.home_team.name : hFb;
                const an = m.away_team?.name && m.away_team.name !== 'Away' ? m.away_team.name : aFb;
                bet.match_name = `${hn} vs ${an}`;
                bet._homeTeam = { name: hn, logo: m.home_team?.logo || `https://ui-avatars.com/api/?name=${encodeURIComponent(hn.substring(0,2))}&size=36&background=1a2332&color=00ff9d` };
                bet._awayTeam = { name: an, logo: m.away_team?.logo || `https://ui-avatars.com/api/?name=${encodeURIComponent(an.substring(0,2))}&size=36&background=1a2332&color=ff9800` };
                bet._league = m.league_name || ''; bet._kickoff = m.start_time || bet.placed_at;
                bet._matchStatus = m.status || 'NS'; bet._elapsed = m.elapsed || 0;
                bet._score = { home: m.goals_home || 0, away: m.goals_away || 0 }; bet._match = m;
            } else {
                bet._homeTeam = { name: hFb, logo: `https://ui-avatars.com/api/?name=${encodeURIComponent(hFb.substring(0,2))}&size=36&background=1a2332&color=00ff9d` };
                bet._awayTeam = { name: aFb, logo: `https://ui-avatars.com/api/?name=${encodeURIComponent(aFb.substring(0,2))}&size=36&background=1a2332&color=ff9800` };
                bet._score = { home: 0, away: 0 }; bet._league = bet.league_name || 'Sports Match';
                bet._kickoff = bet.placed_at || bet.kickoff_time || null; bet._matchStatus = bet.match_status || 'NS';
                bet._elapsed = bet.match_elapsed || 0; bet._match = null;
            }
            bet._isPreMatch = bet.placed_at && bet._kickoff ? new Date(bet.placed_at) < new Date(bet._kickoff) : true;
            bet._isCashoutProcessing = false;
            bet._settlementTriggered = false; // v16.6: Track if immediate settlement was triggered
        }
        
        allBets = rawBets;
        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').style.display = 'block';
        
        updateStats(); updateCounts(); filterBets(currentFilter); startSettlementTimers();
        
        // v16.6: Check if any matches are already finished and trigger immediate settlement
        const hasFinishedMatches = allBets.some(b =>
            b.status === 'active' &&
            ['finished', 'ft', 'aet', 'pen'].includes((b._matchStatus || '').toLowerCase())
        );
        if (hasFinishedMatches) {
            debugLog('Found finished matches on load — triggering immediate settlement');
            scheduleImmediateSettlement();
        }
        
        // Run regular settlement and retry failed payouts
        await autoSettleBets();
        if (settlementManager) {
            await settlementManager.retryFailedPayouts();
            await loadBalance();
        }
        
        debugLog(`Loaded ${allBets.length} bets successfully`);
    } catch (e) {
        debugError('Load bets failed:', e.message);
        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').style.display = 'block';
        const container = document.getElementById('bet-list-container');
        if (container) {
            container.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-triangle" style="color:var(--danger);"></i><p style="font-size:15px;font-weight:600;">Failed to load bets</p><p style="font-size:11px;margin-top:6px;">${escapeHtml(e.message)}</p><button class="btn-action-tool" onclick="loadBets()" style="margin-top:16px;"><i class="fas fa-redo"></i> Retry</button></div>`;
        }
    }
}

// ╔══════════════════════════════════════════════════════════════╗
// ║  INSTANT SETTLEMENT (v16.6 NEW)                             ║
// ╚══════════════════════════════════════════════════════════════╝
function scheduleImmediateSettlement() {
    // Clear any existing timeout to debounce multiple triggers
    if (settlementTimeout) {
        clearTimeout(settlementTimeout);
        debugLog('Debounced: resetting immediate settlement timer');
    }
    
    // Wait SETTLEMENT_DEBOUNCE_MS to batch multiple finished matches
    settlementTimeout = setTimeout(async () => {
        debugLog('⚡ Running immediate settlement...');
        showSettlementStatus('Settling finished matches...', '', true);
        
        await autoSettleBets();
        
        if (settlementManager) {
            await settlementManager.retryFailedPayouts();
        }
        
        await loadBalance();
        updateStats();
        updateCounts();
        filterBets(currentFilter);
        
        showSettlementStatus(null);
        settlementTimeout = null;
        
        debugLog('✅ Immediate settlement complete');
    }, SETTLEMENT_DEBOUNCE_MS);
}

async function autoSettleBets() {
    const u = auth.currentUser;
    if (!u) return;
    
    if (!settlementManager) {
        settlementManager = new DuplicateProofSettlementManager(u.uid);
    }
    
    if (settlementManager.emergencyStop) {
        debugLog('Emergency stop active — settlement skipped');
        return;
    }
    
    const active = allBets.filter(b =>
        b.status === 'active' &&
        !settlementManager.settledBetIds.has(b.id)
    );
    
    if (!active.length) return;
    
    debugLog(`Auto-settling ${active.length} active bets...`);
    const result = await settlementManager.processBets(active);
    
    if (result.processed > 0 || result.duplicates > 0) {
        await loadBalance();
        updateStats();
        updateCounts();
        filterBets(currentFilter);
        
        if (result.processed > 0) {
            showNotification(`✅ ${result.processed} bet${result.processed > 1 ? 's' : ''} settled`, 'success');
        }
    }
}

// ╔══════════════════════════════════════════════════════════════╗
// ║  CANCEL + CASHOUT (MULTI-LAYER LOCKING)                     ║
// ╚══════════════════════════════════════════════════════════════╝
function isBetLocked(betId) { return processingBetIds.has(betId); }

function lockBet(betId, bet) {
    processingBetIds.add(betId);
    if (bet) bet._isCashoutProcessing = true;
    disableBetButtons(betId);
}

function unlockBet(betId, bet) {
    processingBetIds.delete(betId);
    if (bet) bet._isCashoutProcessing = false;
    enableBetButtons(betId);
}

async function cancelBet(betId) {
    if (isBetLocked(betId)) return showNotification('⏳ Operation in progress...', 'warning');
    const bet = allBets.find(b => b.id === betId);
    if (!bet || bet.status !== 'active') return showNotification('❌ Cannot cancel', 'error');
    if (bet.selections?.length > 0) return showNotification('❌ Accumulators cannot be cancelled', 'error');
    if (settlementManager?.settledBetIds.has(betId)) return showNotification('❌ Being settled', 'error');
    if (bet._kickoff && new Date() > new Date(bet._kickoff)) return showNotification('❌ Match started', 'error');
    
    const stake = parseFloat(bet.amount || 0), refund = parseFloat((stake * 0.95).toFixed(2));
    if (!confirm(`Cancel?\n\nStake: $${stake.toFixed(2)}\nRefund (95%): $${refund.toFixed(2)}\nFee (5%): $${(stake-refund).toFixed(2)}`)) return;
    
    lockBet(betId, bet);
    try {
        const { error, data } = await supabaseClient.from('bets').update({
            status: 'cancelled', cancellation_fee: stake - refund, refund_amount: refund,
            cancelled_at: new Date().toISOString(), settlement_reason: 'Cancelled – 5% fee', updated_at: new Date().toISOString()
        }).eq('id', betId).eq('status', 'active').select('id');
        
        if (error || !data?.length) { unlockBet(betId, bet); return showNotification('❌ Cancel failed', 'error'); }
        
        if (settlementManager) {
            settlementManager.settledBetIds.add(betId);
            settlementManager._saveSet('xl_settled_ids', settlementManager.settledBetIds);
            await settlementManager._refund(bet.user_id, bet.id, refund, 'user_cancellation');
        }
        bet.status = 'cancelled';
        showNotification(`✅ Refunded $${refund.toFixed(2)}`, 'success');
        await loadBalance(); updateStats(); updateCounts(); filterBets(currentFilter);
    } catch (e) { unlockBet(betId, bet); showNotification(`Error: ${e.message}`, 'error'); }
}

async function cashoutBet(betId, partialPct = 100) {
    if (isBetLocked(betId)) return showNotification('⏳ Cashout in progress...', 'warning');
    const bet = allBets.find(b => b.id === betId);
    if (!bet || bet.status !== 'active') return showNotification('❌ Cannot cash out', 'error');
    if (bet._isCashoutProcessing) return showNotification('⏳ Processing...', 'warning');
    if (settlementManager?.settledBetIds.has(betId)) return showNotification('❌ Being settled', 'error');
    
    const baseStake = parseFloat(bet.amount || 0), partialAmt = parseFloat((baseStake * (partialPct / 100)).toFixed(2));
    const remaining = parseFloat((baseStake - partialAmt).toFixed(2));
    if (partialPct < 100 && remaining < 1) return showNotification('❌ Remaining stake < $1.00', 'error');
    
    const odds = parseFloat(bet.odds || 2), elapsed = bet._elapsed || 45, rm = Math.max(1, 90 - elapsed);
    let cv = partialAmt * odds * 0.45 * Math.pow(rm / 90, 0.7) * 0.95;
    cv = parseFloat(Math.max(partialAmt * 0.05, Math.min(partialAmt * odds * 0.95, cv)).toFixed(2));
    const profit = parseFloat((cv - partialAmt).toFixed(2)), label = partialPct === 100 ? 'Full' : `${partialPct}% Partial`;
    
    if (!confirm(`${label} Cash Out?\n\nStake: $${partialAmt.toFixed(2)}\nReceive: $${cv.toFixed(2)}\n${profit >= 0 ? 'Profit' : 'Loss'}: $${Math.abs(profit).toFixed(2)}`)) return;
    
    lockBet(betId, bet);
    try {
        if (partialPct === 100) {
            const { error, data } = await supabaseClient.from('bets').update({
                status: 'cashed-out', cashout_amount: cv, cashed_out_at: new Date().toISOString(),
                settlement_reason: 'Cashed out 100%', updated_at: new Date().toISOString()
            }).eq('id', betId).eq('status', 'active').select('id');
            if (error || !data?.length) { unlockBet(betId, bet); return showNotification('❌ Cashout failed', 'error'); }
            if (settlementManager) { settlementManager.settledBetIds.add(betId); settlementManager._saveSet('xl_settled_ids', settlementManager.settledBetIds); }
            bet.status = 'cashed-out'; bet.cashout_amount = cv;
        } else {
            let hist = bet.partial_history || [];
            hist.push({ timestamp: new Date().toISOString(), percentage: partialPct, cashed_out_val: cv, stake_before: baseStake, stake_after: remaining });
            const { error } = await supabaseClient.from('bets').update({ amount: remaining, partial_history: hist, updated_at: new Date().toISOString() }).eq('id', betId).eq('status', 'active');
            if (error) { unlockBet(betId, bet); return showNotification('❌ Partial failed', 'error'); }
            bet.amount = remaining; bet.partial_history = hist;
        }
        if (settlementManager) await settlementManager._payoutWithRetry(bet.user_id, bet.id, cv, profit, { type: 'cashout', percentage: partialPct });
        showNotification(`✅ ${label} cashout: $${cv.toFixed(2)}`, 'success');
        await loadBalance(); updateStats(); updateCounts(); filterBets(currentFilter);
    } catch (e) { unlockBet(betId, bet); showNotification(`Error: ${e.message}`, 'error'); }
}

function disableBetButtons(betId) {
    const card = document.querySelector(`[data-bet-id="${betId}"]`);
    if (card) { card.classList.add('processing'); card.querySelectorAll('button').forEach(b => { b.disabled = true; }); }
}

function enableBetButtons(betId) {
    const card = document.querySelector(`[data-bet-id="${betId}"]`);
    if (card) { card.classList.remove('processing'); card.querySelectorAll('button').forEach(b => { b.disabled = false; }); }
}

// ╔══════════════════════════════════════════════════════════════╗
// ║  UI RENDERING                                               ║
// ╚══════════════════════════════════════════════════════════════╝
function updateStats() {
    const total = allBets.length;
    const won = allBets.filter(b => b.status === 'won');
    const lost = allBets.filter(b => b.status === 'lost');
    const active = allBets.filter(b => b.status === 'active');
    const cashedOut = allBets.filter(b => b.status === 'cashed-out');
    
    let wonAmount = 0, lostAmount = 0, netProfit = 0;
    won.forEach(b => { const p = parseFloat(b.payout || 0); wonAmount += p; netProfit += p - parseFloat(b.amount || 0); });
    lost.forEach(b => { const s = parseFloat(b.amount || 0); lostAmount += s; netProfit -= s; });
    cashedOut.forEach(b => { netProfit += parseFloat(b.cashout_amount || 0) - parseFloat(b.amount || 0); });
    
    const settledCount = won.length + lost.length;
    const winRate = settledCount > 0 ? ((won.length / settledCount) * 100).toFixed(1) : 0;
    
    document.getElementById('total-bets').textContent = total;
    document.getElementById('total-won').textContent = won.length;
    document.getElementById('total-lost').textContent = lost.length;
    document.getElementById('total-active').textContent = active.length;
    document.getElementById('won-amount').textContent = `$${wonAmount.toFixed(2)}`;
    document.getElementById('lost-amount').textContent = `$${lostAmount.toFixed(2)}`;
    document.getElementById('win-rate-display').textContent = `${winRate}%`;
    document.getElementById('win-rate-fill').style.width = `${winRate}%`;
    
    const plEl = document.getElementById('total-pl');
    plEl.textContent = (netProfit >= 0 ? '+' : '') + '$' + netProfit.toFixed(2);
    plEl.style.color = netProfit >= 0 ? 'var(--success)' : 'var(--danger)';
}

function updateCounts() {
    const counts = {
        all: allBets.length, active: allBets.filter(b => b.status === 'active').length,
        won: allBets.filter(b => b.status === 'won').length, lost: allBets.filter(b => b.status === 'lost').length,
        cancelled: allBets.filter(b => b.status === 'cancelled').length,
        'cashed-out': allBets.filter(b => b.status === 'cashed-out').length
    };
    for (const [key, value] of Object.entries(counts)) {
        const el = document.getElementById(`cnt-${key}`); if (el) el.textContent = value;
    }
}

function filterBets(filter) {
    currentFilter = filter;
    let filtered = [...allBets];
    if (filter !== 'all') filtered = filtered.filter(b => b.status === filter);
    
    const searchValue = document.getElementById('bet-search-input')?.value?.toLowerCase().trim();
    if (searchValue) {
        filtered = filtered.filter(b => {
            const mn = (b.match_name || '').toLowerCase(), lg = (b._league || '').toLowerCase();
            const tk = ('XL' + (b.id?.slice(-8) || '')).toLowerCase();
            return mn.includes(searchValue) || lg.includes(searchValue) || tk.includes(searchValue);
        });
    }
    
    filtered.sort((a, b) => {
        if (a.status === 'active' && b.status !== 'active') return -1;
        if (a.status !== 'active' && b.status === 'active') return 1;
        if (a.status === 'active') {
            const ka = a._kickoff ? new Date(a._kickoff).getTime() : Infinity;
            const kb = b._kickoff ? new Date(b._kickoff).getTime() : Infinity;
            return ka - kb;
        }
        return new Date(b.settled_at || b.cashed_out_at || b.placed_at || 0).getTime() -
               new Date(a.settled_at || a.cashed_out_at || a.placed_at || 0).getTime();
    });
    
    const container = document.getElementById('bet-list-container');
    if (!container) return;
    
    if (!filtered.length) {
        container.innerHTML = `<div class="empty-state"><i class="fas fa-ticket-alt"></i><p style="font-size:15px;font-weight:600;">No bets found</p><p style="font-size:11px;margin-top:4px;color:var(--text-secondary);">${filter !== 'all' ? 'Try a different filter' : 'Place your first bet!'}</p></div>`;
    } else {
        container.innerHTML = filtered.map(b => {
            try { return createBetCard(b); }
            catch (e) {
                debugError(`Render error for bet ${b.id}:`, e.message);
                return `<div class="bet-card render-error" data-bet-id="${b.id}"><div class="bet-top"><span class="bet-status-badge lost">⚠️ Render Error</span></div><p style="font-size:11px;padding:8px 0;">Bet #${escapeHtml(b.id?.slice(-8) || '?')} could not be displayed.<br><small style="color:var(--text-secondary);">${escapeHtml(e.message)}</small></p></div>`;
            }
        }).join('');
    }
    
    startSettlementTimers();
}

function createBetCard(bet) {
    const amount = parseFloat(bet.amount || 0), odds = parseFloat(bet.odds || 2);
    const payout = parseFloat(bet.payout || bet.potential_win || 0);
    
    let profit = 0;
    if (bet.status === 'won') profit = payout - amount;
    else if (bet.status === 'lost') profit = -amount;
    else if (bet.status === 'cashed-out') profit = parseFloat(bet.cashout_amount || 0) - amount;
    
    const ticketNum = 'XL' + (bet.id?.slice(-8) || '').toUpperCase();
    const isActive = bet.status === 'active';
    const hasSelections = bet.selections && Array.isArray(bet.selections) && bet.selections.length > 0;
    const isAcc = bet.bet_type === 'accumulator' || hasSelections;
    
    const matchStatus = (bet._matchStatus || '').toLowerCase();
    const isLive = ['live', '1h', '2h', 'ht'].includes(matchStatus);
    const matchStarted = isLive || ['finished', 'ft', 'aet', 'pen'].includes(matchStatus);
    const isHalftime = matchStatus === 'ht';
    const isPreMatch = bet._isPreMatch !== undefined ? bet._isPreMatch : true;
    
    const canCancel = isActive && !isAcc && !matchStarted && !settlementManager?.settledBetIds.has(bet.id);
    const canCashout = isActive && matchStarted && isLive && !isHalftime && !isAcc && !settlementManager?.settledBetIds.has(bet.id);
    const isProcessing = isBetLocked(bet.id) || bet._isCashoutProcessing;
    
    const homeTeam = bet._homeTeam || { name: 'Home', logo: '' };
    const awayTeam = bet._awayTeam || { name: 'Away', logo: '' };
    const homeLogo = homeTeam.logo || `https://ui-avatars.com/api/?name=${encodeURIComponent((homeTeam.name || 'H').substring(0,2))}&size=36&background=1a2332&color=00ff9d`;
    const awayLogo = awayTeam.logo || `https://ui-avatars.com/api/?name=${encodeURIComponent((awayTeam.name || 'A').substring(0,2))}&size=36&background=1a2332&color=ff9800`;
    
    const scoreDisplay = bet._score ? `<span class="bet-score-display${isLive ? ' live' : ''}">${bet._score.home} - ${bet._score.away}</span>` : '';
    
    const statusClass = bet.status === 'won' ? 'won' : bet.status === 'lost' ? 'lost' : bet.status === 'cancelled' ? 'cancelled' : bet.status === 'cashed-out' ? 'cashed-out' : 'active';
    
    // Cashout preview
    let cashoutHTML = '';
    if (canCashout && !isProcessing) {
        const elapsed = bet._elapsed || 45, rm = Math.max(1, 90 - elapsed);
        let cv = amount * odds * 0.45 * Math.pow(rm / 90, 0.7) * 0.95;
        cv = Math.max(amount * 0.05, Math.min(amount * odds * 0.95, cv));
        cashoutHTML = `<div class="cashout-preview"><div class="cashout-metrics"><span>Est. Cash Out: <strong>$${cv.toFixed(2)}</strong></span><span>Profit: <span style="color:${cv >= amount ? 'var(--success)' : 'var(--danger)'}">${cv >= amount ? '+' : ''}$${(cv - amount).toFixed(2)}</span></span></div><div class="partial-cashout-box"><span>Stake: <strong class="pct-val">100%</strong></span><input type="range" class="partial-slider" min="10" max="100" step="10" value="100"></div></div>`;
    } else if (isActive && isHalftime && !isAcc) {
        cashoutHTML = `<div class="cashout-preview" style="border-color:var(--orange);"><div style="color:var(--orange);font-weight:700;">⏸️ Cash Out suspended (Half-time)</div></div>`;
    }
    
    // Accumulator selections
    let accaHTML = '';
    if (isAcc && hasSelections) {
        accaHTML = `<div class="selections-container"><div style="font-size:11px;font-weight:700;color:var(--accent);margin-bottom:10px;"><i class="fas fa-list-ol"></i> Accumulator (${bet.selections.length} legs)</div>${bet.selections.map((s, i) => {
            const m = s._match; let badge = '<span style="color:var(--text-secondary);">⏳ Pending</span>', scoreStr = '';
            if (m) {
                const mst = (m.status || '').toLowerCase();
                if (['finished', 'ft', 'aet', 'pen'].includes(mst)) {
                    const lr = settlementManager?._determineResult({ bet_type: s.betType || s.bet_type }, m);
                    badge = lr?.won ? '<span style="color:var(--success);">✅ WON</span>' : lr?.refund ? '<span style="color:var(--orange);">↩️ REFUND</span>' : '<span style="color:var(--danger);">❌ LOST</span>';
                    scoreStr = `(${m.goals_home || 0}-${m.goals_away || 0})`;
                } else if (['live', '1h', '2h', 'ht'].includes(mst)) {
                    badge = `<span style="color:var(--orange);">🔴 LIVE ${m.elapsed || ''}'</span>`; scoreStr = `(${m.goals_home || 0}-${m.goals_away || 0})`;
                }
            }
            return `<div class="selection-item"><span class="selection-match">[${i + 1}] ${escapeHtml(s.matchName || 'Match')} ${scoreStr}</span><span class="selection-pick">${escapeHtml(formatBetTypeName(s.betType || s.bet_type))}</span><span class="selection-odds">@${parseFloat(s.odds || 1).toFixed(2)}</span> ${badge}</div>`;
        }).join('')}</div>`;
    }
    
    // Action buttons
    let actionsHTML = '';
    if (isActive) {
        actionsHTML = '<div class="bet-actions"><div class="bet-action-row-buttons">';
        if (canCancel && !isProcessing) actionsHTML += '<button class="cancel-btn" data-action="cancel"><i class="fas fa-ban"></i> Cancel</button>';
        if (canCashout && !isProcessing) actionsHTML += '<button class="cashout-btn" data-action="cashout"><i class="fas fa-money-bill-wave"></i> Cash Out</button>';
        if (isProcessing) actionsHTML += '<button disabled style="background:var(--bg-tertiary);color:var(--text-secondary);"><i class="fas fa-spinner fa-spin"></i> Processing...</button>';
        actionsHTML += '</div></div>';
    }
    
    // Settlement info
    let settlementInfoHTML = '';
    if (!isActive && bet.settled_at) {
        const settledBy = bet.settled_by || 'auto';
        const settledLabel = settledBy === 'admin' ? '👤 Admin' : '🤖 Auto-Settlement';
        const settledClass = settledBy === 'admin' ? 'admin' : 'auto';
        settlementInfoHTML = `<div class="settlement-info-bar ${settledClass}"><i class="fas ${settledBy === 'admin' ? 'fa-user-shield' : 'fa-robot'}"></i><span>Settled by: <strong>${settledLabel}</strong> • ${formatFullDateTime(bet.settled_at)} (${timeAgo(bet.settled_at)})</span></div>`;
    }
    
    return `<div class="bet-card ${statusClass}${isProcessing ? ' processing' : ''}" data-bet-id="${bet.id}">
        <div class="bet-top"><div><span class="bet-type-tag ${isAcc ? 'accumulator' : 'single'}">${isAcc ? 'ACCUMULATOR' : 'SINGLE'}</span><span class="bet-ticket-num">#${ticketNum}</span>${!isPreMatch && isActive ? '<span class="live-bet-badge"><i class="fas fa-bolt"></i> LIVE BET</span>' : ''}</div><span class="bet-status-badge ${statusClass}">${bet.status === 'won' ? '🏆 WON' : bet.status === 'lost' ? '❌ LOST' : bet.status === 'cancelled' ? '⛔ CANCELLED' : bet.status === 'cashed-out' ? '💰 CASHED OUT' : '⏳ ACTIVE'}</span></div>
        <div class="bet-body">${isAcc ? `<div class="bet-match-name"><i class="fas fa-layer-group" style="color:var(--orange);"></i> ${bet.selections?.length || 0}-Fold Accumulator</div><div class="bet-league">${bet.selections?.map(s => escapeHtml(s.matchName || '?')).join(' • ') || 'Multiple Selections'}</div>` : `<div class="bet-match-row"><img class="team-logo-small" src="${homeLogo}" onerror="this.style.display='none'" alt=""><div class="bet-match-name">${escapeHtml(homeTeam.name)} <span style="color:var(--text-secondary);">vs</span> ${escapeHtml(awayTeam.name)}${scoreDisplay}</div><img class="team-logo-small" src="${awayLogo}" onerror="this.style.display='none'" alt=""></div><div class="bet-league">${escapeHtml(bet._league || 'Sports Match')}${bet._elapsed ? ` | ${bet._elapsed}'` : ''}${matchStatus ? ` | ${matchStatus.toUpperCase()}` : ''}</div>`}<div class="bet-pick">${escapeHtml(formatBetTypeName(isAcc ? 'accumulator' : bet.bet_type))} <span>@${odds.toFixed(2)}</span></div></div>
        ${accaHTML}
        <div class="bet-meta-row"><span><i class="fas fa-calendar-plus"></i> ${formatFullDate(bet.placed_at)}</span><span><i class="fas fa-clock"></i> ${formatFullDate(bet._kickoff)}</span></div>
        ${cashoutHTML}
        <div class="bet-details-grid"><div class="bet-detail"><div class="lbl">Stake</div><div class="val">$${amount.toFixed(2)}</div></div><div class="bet-detail"><div class="lbl">${isActive ? 'Potential' : 'Payout'}</div><div class="val">$${payout.toFixed(2)}</div></div><div class="bet-detail"><div class="lbl">P/L</div><div class="val" style="color:${profit >= 0 ? 'var(--success)' : 'var(--danger)'}">${profit >= 0 ? '+' : ''}$${Math.abs(profit).toFixed(2)}</div></div>${isActive ? `<div class="bet-detail"><div class="lbl">⏱️ Time to Settle</div><div class="val"><span class="settlement-timer timer-${bet.id}">--:--:--</span></div></div>` : ''}</div>
        ${bet.settlement_reason ? `<div class="bet-result-row ${statusClass}"><i class="fas fa-gavel"></i> ${escapeHtml(bet.settlement_reason)}</div>` : ''}
        ${settlementInfoHTML}
        ${actionsHTML}
    </div>`;
}

function showDetails(betId) {
    const bet = allBets.find(b => b.id === betId); if (!bet) return;
    const modal = document.getElementById('bet-modal'), body = document.getElementById('modal-body');
    const ticketNum = 'XL' + (bet.id?.slice(-8) || '').toUpperCase();
    const amount = parseFloat(bet.amount || 0), odds = parseFloat(bet.odds || 2);
    const payout = parseFloat(bet.payout || bet.potential_win || 0);
    
    let profit = 0;
    if (bet.status === 'won') profit = payout - amount;
    else if (bet.status === 'lost') profit = -amount;
    else if (bet.status === 'cashed-out') profit = parseFloat(bet.cashout_amount || 0) - amount;
    
    const isAcc = bet.bet_type === 'accumulator' || (bet.selections?.length > 0);
    const settledBy = bet.settled_by === 'admin' ? '👤 Admin' : bet.settled_by === 'auto' ? '🤖 Auto-Settlement' : 'N/A';
    
    let selectionsHTML = '';
    if (isAcc && bet.selections?.length) {
        selectionsHTML = `<div class="modal-section"><h4><i class="fas fa-list-ol"></i> Selections (${bet.selections.length})</h4>${bet.selections.map((s, i) => `<div class="modal-row"><span class="lbl">Leg ${i + 1}</span><span>${escapeHtml(s.matchName || 'Match')} — ${escapeHtml(formatBetTypeName(s.betType || s.bet_type))} @${parseFloat(s.odds || 1).toFixed(2)}</span></div>`).join('')}</div>`;
    }
    
    body.innerHTML = `<div class="modal-section"><h4><i class="fas fa-ticket-alt"></i> Ticket #${ticketNum}</h4><div class="modal-row"><span class="lbl">Status</span><span>${bet.status?.toUpperCase()}</span></div><div class="modal-row"><span class="lbl">Type</span><span>${isAcc ? `Accumulator (${bet.selections?.length || 0} legs)` : 'Single'}</span></div>${!isAcc ? `<div class="modal-row"><span class="lbl">Match</span><span>${escapeHtml(bet.match_name || 'N/A')}</span></div><div class="modal-row"><span class="lbl">Score</span><span style="font-family:monospace;color:var(--orange);">${bet._score ? `${bet._score.home}-${bet._score.away}` : 'N/A'}</span></div><div class="modal-row"><span class="lbl">League</span><span>${escapeHtml(bet._league || 'N/A')}</span></div>` : ''}<div class="modal-row"><span class="lbl">Placed</span><span>${formatFullDateTime(bet.placed_at)}</span></div>${bet.settled_at ? `<div class="modal-row"><span class="lbl">Settled</span><span>${formatFullDateTime(bet.settled_at)}</span></div><div class="modal-row"><span class="lbl">Settled By</span><span>${settledBy}</span></div>` : ''}</div>${selectionsHTML}<div class="modal-section"><h4><i class="fas fa-chart-line"></i> Financial</h4><div class="modal-row"><span class="lbl">Stake</span><span>$${amount.toFixed(2)}</span></div><div class="modal-row"><span class="lbl">Odds</span><span>@${odds.toFixed(2)}</span></div><div class="modal-row"><span class="lbl">Payout</span><span>$${payout.toFixed(2)}</span></div><div class="modal-row"><span class="lbl">P/L</span><span style="color:${profit >= 0 ? 'var(--success)' : 'var(--danger)'}">${profit >= 0 ? '+' : ''}$${profit.toFixed(2)}</span></div></div>${bet.settlement_reason ? `<div class="modal-section"><h4><i class="fas fa-gavel"></i> Settlement</h4><div class="modal-row"><span class="lbl">Reason</span><span>${escapeHtml(bet.settlement_reason)}</span></div></div>` : ''}`;
    modal.classList.add('show');
}

// ╔══════════════════════════════════════════════════════════════╗
// ║  REAL-TIME SETTLEMENT TIMER (v16.6 — INSTANT TRIGGER)      ║
// ╚══════════════════════════════════════════════════════════════╝
function startSettlementTimers() {
    settlementTimers.forEach(clearInterval);
    settlementTimers = [];
    
    // Track which finished matches have already triggered settlement
    const triggeredBets = new Set();
    
    const updateAllTimers = () => {
        let hasNewlyFinished = false;
        
        allBets.filter(b => b.status === 'active').forEach(bet => {
            const timerElements = document.querySelectorAll(`.timer-${bet.id}`);
            if (!timerElements.length) return;
            
            const matchStatus = (bet._matchStatus || '').toLowerCase();
            
            // v16.6: Match just finished — trigger debounced settlement
            if (['finished', 'ft', 'aet', 'pen'].includes(matchStatus)) {
                timerElements.forEach(el => {
                    el.innerHTML = '<span style="color:var(--success);font-weight:700;">✅ Settling…</span>';
                    el.classList.remove('urgent');
                });
                
                // Only trigger once per batch of finished matches
                if (!triggeredBets.has(bet.id) && !settlementManager?.settledBetIds.has(bet.id)) {
                    triggeredBets.add(bet.id);
                    hasNewlyFinished = true;
                }
                return;
            }
            
            const kickoff = bet._kickoff ? new Date(bet._kickoff) : null;
            if (!kickoff) {
                timerElements.forEach(el => { el.textContent = '--:--:--'; el.classList.remove('urgent'); });
                return;
            }
            
            const now = new Date();
            const settleBy = new Date(kickoff.getTime() + 115 * 60000);
            const diff = settleBy - now;
            
            if (diff <= 0) {
                timerElements.forEach(el => {
                    el.innerHTML = '<span style="color:var(--success);font-weight:700;">🔄 Settling Now…</span>';
                    el.classList.remove('urgent');
                });
                if (!triggeredBets.has(bet.id) && !settlementManager?.settledBetIds.has(bet.id)) {
                    triggeredBets.add(bet.id);
                    hasNewlyFinished = true;
                }
            } else {
                const hours = Math.floor(diff / 3600000);
                const minutes = Math.floor((diff % 3600000) / 60000);
                const seconds = Math.floor((diff % 60000) / 1000);
                const timeStr = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
                
                timerElements.forEach(el => {
                    el.textContent = timeStr;
                    if (hours === 0 && minutes < 5) el.classList.add('urgent');
                    else el.classList.remove('urgent');
                });
            }
        });
        
        // v16.6: Trigger debounced settlement if any matches just finished
        if (hasNewlyFinished) {
            debugLog(`Timer detected finished matches — scheduling immediate settlement`);
            scheduleImmediateSettlement();
        }
    };
    
    updateAllTimers();
    settlementTimers.push(setInterval(updateAllTimers, 1000));
}

async function forceSettleBet(bet) {
    if (!settlementManager) settlementManager = new DuplicateProofSettlementManager(auth.currentUser?.uid);
    try {
        const matchMap = bet.fixture_id ? await fetchMatchesBatch([bet.fixture_id]) : {};
        const match = matchMap[bet.fixture_id] || null;
        const settled = await settlementManager._settleSingleBet(bet, match);
        if (settled) { await loadBalance(); updateStats(); updateCounts(); filterBets(currentFilter); }
    } catch (e) { debugWarn(`Force settle failed for ${bet.id}:`, e.message); }
}

// ╔══════════════════════════════════════════════════════════════╗
// ║  EVENT LISTENERS                                            ║
// ╚══════════════════════════════════════════════════════════════╝
document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('bet-list-container').addEventListener('click', function(e) {
        const card = e.target.closest('.bet-card'); if (!card) return;
        if (card.classList.contains('processing')) return;
        const betId = card.dataset.betId;
        const actionBtn = e.target.closest('button[data-action]');
        if (actionBtn) {
            e.stopPropagation();
            if (actionBtn.dataset.action === 'cancel') cancelBet(betId);
            if (actionBtn.dataset.action === 'cashout') {
                const slider = card.querySelector('.partial-slider');
                cashoutBet(betId, slider ? parseInt(slider.value) : 100);
            }
        } else { showDetails(betId); }
    });

    document.getElementById('bet-list-container').addEventListener('input', function(e) {
        if (e.target.classList.contains('partial-slider')) {
            const valDisplay = e.target.closest('.bet-card')?.querySelector('.pct-val');
            if (valDisplay) valDisplay.textContent = e.target.value + '%';
        }
    });

    document.getElementById('bet-modal').addEventListener('click', (e) => {
        if (e.target.id === 'bet-modal' || e.target.id === 'modalCloseBtn') {
            document.getElementById('bet-modal').classList.remove('show');
        }
    });

    const debouncedFilter = debounce(() => filterBets(currentFilter), 300);
    document.getElementById('bet-search-input').addEventListener('input', debouncedFilter);

    document.querySelectorAll('.filter-chip').forEach(chip => {
        chip.addEventListener('click', function() {
            document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
            this.classList.add('active');
            filterBets(this.dataset.filter);
        });
    });

    document.getElementById('themeToggleBtn').addEventListener('click', () => {
        document.body.classList.toggle('light-theme');
        localStorage.setItem('theme', document.body.classList.contains('light-theme') ? 'light' : 'dark');
    });

    document.getElementById('langToggleBtn').addEventListener('click', () => {
        const isArabic = document.body.classList.toggle('arabic');
        localStorage.setItem('lang', isArabic ? 'ar' : 'en');
        document.documentElement.dir = isArabic ? 'rtl' : 'ltr';
    });

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') document.getElementById('bet-modal').classList.remove('show');
    });

    auth.onAuthStateChanged(async u => {
        if (!u) { window.location.href = '../login.html'; return; }
        if (localStorage.getItem('theme') === 'light') document.body.classList.add('light-theme');
        if (localStorage.getItem('lang') === 'ar') { document.body.classList.add('arabic'); document.documentElement.dir = 'rtl'; }
        
        if (DEBUG) console.log('%c🐛 Debug Mode Active %c| %cMy Bets v16.6', 'color:#00ff9d;font-weight:bold;', '', 'color:#aaa;');
        
        await loadBalance();
        await loadBets();
        
        if (refreshInterval) clearInterval(refreshInterval);
        refreshInterval = setInterval(async () => { await loadBets(); await loadBalance(); }, 30000);
        
        // v16.6: 15-second settlement poll (was 60s)
        if (settleInterval) clearInterval(settleInterval);
        if (!localStorage.getItem('xl_emergency_stop')) {
            settleInterval = setInterval(async () => {
                await autoSettleBets();
                if (settlementManager) await settlementManager.retryFailedPayouts();
                await loadBalance();
            }, SETTLEMENT_POLL_MS);
        }
    });

    window.addEventListener('beforeunload', () => {
        if (refreshInterval) clearInterval(refreshInterval);
        if (settleInterval) clearInterval(settleInterval);
        if (settlementTimeout) clearTimeout(settlementTimeout);
        settlementTimers.forEach(clearInterval);
    });
});

window.loadBets = loadBets;

console.log('%c✅ My Bets v16.6 %c| %c⚡ Instant Settlement %c| %cParallel Batching • 15s Poll • Debounced Trigger • Wallet Fix • Cashout Lock',
    'color:#00ff9d;font-weight:bold;font-size:14px;', '', 'color:#ff9800;', '', 'color:#aaa;font-size:10px;');
