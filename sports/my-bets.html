<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Bets - X Lodon | رهاناتي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0f1a; color: white; font-family: 'Segoe UI', 'Tajawal', sans-serif; min-height: 100vh; }
        .header { background: #111827; padding: 12px 15px; border-bottom: 2px solid #00ff9d; position: sticky; top: 0; z-index: 100; }
        .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .back-btn { color: #00ff9d; text-decoration: none; font-size: 20px; }
        .lang-toggle { background: #1a2332; border: 1px solid #00ff9d; color: #00ff9d; padding: 5px 12px; border-radius: 20px; font-size: 14px; cursor: pointer; }
        .tabs { display: flex; gap: 5px; overflow-x: auto; white-space: nowrap; padding-bottom: 3px; }
        .tab { padding: 8px 12px; background: #1a2332; border-radius: 20px; color: white; text-decoration: none; font-size: 12px; }
        .tab.active { background: #00ff9d; color: black; }
        .container { max-width: 1200px; margin: 0 auto; padding: 15px; }
        
        .settlement-panel { background: linear-gradient(135deg, #1a2332, #111827); border-radius: 16px; padding: 15px 18px; margin-bottom: 20px; border: 1px solid #00ff9d33; }
        .settlement-title { display: flex; align-items: center; gap: 8px; color: #00ff9d; font-weight: 600; margin-bottom: 10px; }
        .settlement-details { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; text-align: center; }
        .settlement-item { background: #0a0f1a; padding: 10px; border-radius: 10px; }
        .settlement-label { color: #a0a8c9; font-size: 11px; margin-bottom: 4px; }
        .settlement-value { font-weight: 600; font-size: 16px; }
        .settlement-value.pending { color: #ffc107; }
        .settlement-value.ready { color: #00ff9d; }
        .progress-bar { background: #1a2332; height: 4px; border-radius: 4px; margin-top: 10px; overflow: hidden; }
        .progress-fill { background: #00ff9d; height: 100%; width: 0%; transition: width 1s linear; }
        
        .stats-cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
        .stat-card { background: #111827; padding: 15px; border-radius: 12px; text-align: center; border: 1px solid #ffffff11; }
        .stat-card.wide { grid-column: span 2; }
        .stat-label { color: #a0a8c9; font-size: 12px; margin-bottom: 5px; }
        .stat-value { font-size: 22px; font-weight: bold; color: #00ff9d; }
        .stat-value.negative { color: #ff5252; }
        .stat-breakdown { display: flex; justify-content: center; gap: 20px; margin-top: 5px; font-size: 13px; }
        
        .filter-bar { display: flex; gap: 5px; margin-bottom: 15px; flex-wrap: wrap; }
        .filter-btn { padding: 10px 14px; background: #1a2332; border: none; border-radius: 20px; color: #a0a8c9; font-size: 12px; font-weight: 600; cursor: pointer; }
        .filter-btn.active { background: #00ff9d; color: black; }
        .filter-btn .count { background: #00000033; padding: 2px 6px; border-radius: 10px; margin-left: 5px; font-size: 11px; }
        
        .bets-list { display: flex; flex-direction: column; gap: 12px; }
        
        .bet-card { background: #111827; border-radius: 16px; padding: 16px; border-left: 4px solid #00ff9d; }
        .bet-card.single { border-left-color: #00ff9d; }
        .bet-card.accumulator { border-left-color: #ff9800; }
        .bet-card.won { border-left-color: #4caf50; }
        .bet-card.lost { border-left-color: #ff5252; }
        .bet-card.active { border-left-color: #ffc107; }
        .bet-card.cancelled { border-left-color: #a0a8c9; opacity: 0.7; }
        .bet-card.cashed_out { border-left-color: #9c27b0; }
        
        .bet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .bet-type-badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
        .bet-type-badge.single { background: #00ff9d22; color: #00ff9d; }
        .bet-type-badge.accumulator { background: #ff980022; color: #ff9800; }
        .bet-status { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .bet-status.active { background: #ffc107; color: black; }
        .bet-status.won { background: #4caf50; color: white; }
        .bet-status.lost { background: #ff5252; color: white; }
        .bet-status.cancelled { background: #a0a8c9; color: white; }
        .bet-status.cashed_out { background: #9c27b0; color: white; }
        
        .match-status { display: flex; align-items: center; gap: 5px; font-size: 13px; margin-bottom: 12px; padding: 8px 12px; background: #0a0f1a; border-radius: 8px; }
        .status-upcoming { color: #00ff9d; }
        .status-live { color: #ff5252; }
        .status-settling { color: #ffc107; }
        
        .bet-matches { margin-bottom: 12px; }
        .match-item { padding: 8px 0; border-bottom: 1px solid #ffffff11; }
        .match-teams { display: flex; justify-content: space-between; align-items: center; }
        .match-name { font-weight: 500; font-size: 14px; }
        .match-pick { color: #00ff9d; font-weight: 600; font-size: 13px; }
        .match-odds { color: #ff9800; font-size: 13px; }
        
        .expand-btn { color: #a0a8c9; font-size: 12px; cursor: pointer; padding: 5px 0; }
        .acc-selections { margin-top: 8px; padding-left: 10px; border-left: 2px solid #ff9800; }
        
        .total-odds-row { display: flex; justify-content: space-between; padding: 8px 0; color: #a0a8c9; font-size: 13px; }
        .total-odds-value { color: #ff9800; font-weight: bold; }
        
        .bet-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; padding-top: 12px; border-top: 1px solid #ffffff11; }
        .bet-amount { display: flex; flex-direction: column; }
        .amount-value { font-weight: 600; font-size: 16px; }
        .bet-payout { text-align: right; }
        .payout-value { font-weight: 700; font-size: 18px; }
        .payout-value.won { color: #4caf50; }
        .payout-value.lost { color: #ff5252; }
        .payout-value.pending { color: #ffc107; }
        
        .bet-date { color: #a0a8c9; font-size: 11px; margin-top: 8px; }
        
        .action-buttons { display: flex; gap: 8px; margin-top: 12px; }
        .cancel-btn, .cashout-btn { padding: 8px 16px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; }
        .cancel-btn { background: #ff525222; border: 1px solid #ff5252; color: #ff5252; }
        .cashout-btn { background: #ff980022; border: 1px solid #ff9800; color: #ff9800; }
        
        .fee-info { font-size: 11px; color: #a0a8c9; margin-top: 5px; }
        .fee-highlight { color: #ff9800; }
        
        .empty-state { text-align: center; padding: 60px 20px; color: #a0a8c9; }
        
        .arabic { font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-top">
            <div class="header-left">
                <a href="betting-sport.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
                <h1 style="font-size:18px;"><i class="fas fa-futbol"></i> <span class="en">My Bets</span><span class="ar" style="display:none;">رهاناتي</span></h1>
            </div>
            <button class="lang-toggle" onclick="toggleLanguage()"><span class="en">🇸🇦 عربي</span><span class="ar" style="display:none;">🇬🇧 English</span></button>
        </div>
        <div class="tabs">
            <a href="betting-sport.html" class="tab"><span class="en">Home</span><span class="ar" style="display:none;">الرئيسية</span></a>
            <a href="live-matches.html" class="tab"><span class="en">Live</span><span class="ar" style="display:none;">مباشر</span></a>
            <a href="upcoming-matches.html" class="tab"><span class="en">Upcoming</span><span class="ar" style="display:none;">قادم</span></a>
            <a href="finished-matches.html" class="tab"><span class="en">Results</span><span class="ar" style="display:none;">النتائج</span></a>
            <a href="my-bets.html" class="tab active"><span class="en">My Bets</span><span class="ar" style="display:none;">رهاناتي</span></a>
        </div>

    <div class="container">
        <div class="settlement-panel">
            <div class="settlement-title"><i class="fas fa-clock"></i> <span class="en">Settlement Information</span><span class="ar" style="display:none;">معلومات التسوية</span></div>
            <div class="settlement-details">
                <div class="settlement-item"><div class="settlement-label"><span class="en">Auto-Settlement</span></div><div class="settlement-value ready"><span class="en">Active</span></div></div>
                <div class="settlement-item"><div class="settlement-label"><span class="en">Pending</span></div><div class="settlement-value pending" id="pending-count">0</div></div>
                <div class="settlement-item"><div class="settlement-label"><span class="en">Next Check</span></div><div class="settlement-value" id="next-check">45s</div></div>
            </div>
            <div class="progress-bar"><div class="progress-fill" id="settlement-progress" style="width:0%"></div></div>
            <div style="color:#a0a8c9; font-size:12px; margin-top:10px; text-align:center;"><i class="fas fa-info-circle"></i> <span class="en">Bets settle within 60s of match completion</span></div>
        </div>
        
        <div class="stats-cards">
            <div class="stat-card"><div class="stat-label"><span class="en">Total Bets</span></div><div class="stat-value" id="total-bets">0</div><div class="stat-breakdown"><span><i class="fas fa-ticket-alt"></i> <span id="single-count">0</span></span><span><i class="fas fa-layer-group"></i> <span id="acc-count">0</span></span></div></div>
            <div class="stat-card"><div class="stat-label"><span class="en">Win Rate</span></div><div class="stat-value" id="win-rate">0%</div><div class="stat-breakdown"><span class="breakdown-single"><span id="single-winrate">0%</span></span><span class="breakdown-acc"><span id="acc-winrate">0%</span></span></div></div>
            <div class="stat-card wide"><div class="stat-label"><span class="en">Total P/L</span></div><div class="stat-value" id="total-pl">$0.00</div><div class="stat-breakdown"><span class="breakdown-single"><span id="single-pl">$0</span></span><span class="breakdown-acc"><span id="acc-pl">$0</span></span></div></div>
        </div>
        
        <div class="filter-bar">
            <button class="filter-btn active" data-filter="all"><span class="en">All</span> <span class="count" id="filter-all">0</span></button>
            <button class="filter-btn" data-filter="active"><span class="en">Active</span> <span class="count" id="filter-active">0</span></button>
            <button class="filter-btn" data-filter="won"><span class="en">Won</span> <span class="count" id="filter-won">0</span></button>
            <button class="filter-btn" data-filter="lost"><span class="en">Lost</span> <span class="count" id="filter-lost">0</span></button>
            <button class="filter-btn" data-filter="single"><i class="fas fa-ticket-alt"></i> <span class="en">Single</span></button>
            <button class="filter-btn" data-filter="accumulator"><i class="fas fa-layer-group"></i> <span class="en">Acc</span></button>
        </div>
        
        <div id="bets-container"><div style="text-align:center; padding:40px; color:#a0a8c9;"><i class="fas fa-spinner fa-spin"></i> Loading bets...</div></div>
    </div>

    <script src="../js/betting-engine.js"></script>
    <script src="../js/sports-api.js"></script>
    <script>
        function toggleLanguage() {
            const isEn = document.querySelector('.en').style.display !== 'none';
            document.querySelectorAll('.en').forEach(el => el.style.display = isEn ? 'none' : 'inline');
            document.querySelectorAll('.ar').forEach(el => el.style.display = isEn ? 'inline' : 'none');
            document.documentElement.dir = isEn ? 'rtl' : 'ltr';
            localStorage.setItem('lang', isEn ? 'ar' : 'en');
        }
        if (localStorage.getItem('lang') === 'ar') { toggleLanguage(); }
        
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), db = firebase.firestore();
        
        let allBets = [], currentFilter = 'all', matchCache = {}, secondsUntilCheck = 60;
        
        auth.onAuthStateChanged(u => { if (!u) location.href = '../login.html'; else loadBets(); });
        
        async function loadBets() {
            db.collection('bets').where('userId', '==', auth.currentUser.uid).orderBy('placedAt', 'desc').onSnapshot(async snap => {
                allBets = []; snap.forEach(d => allBets.push({ id: d.id, ...d.data() }));
                
                // Pre-load match data for all bets
                const matchIds = [...new Set(allBets.filter(b => b.fixtureId).map(b => b.fixtureId))];
                for (const id of matchIds) {
                    if (!matchCache[id]) {
                        const m = await db.collection('sports_matches').doc(id.toString()).get();
                        if (m.exists) matchCache[id] = m.data();
                    }
                }
                
                updateStats(); updateFilterCounts(); filterBets(currentFilter);
            });
        }
        
        function updateStats() {
            const total = allBets.length;
            const singleBets = allBets.filter(b => !b.selections);
            const accBets = allBets.filter(b => b.selections);
            const won = allBets.filter(b => b.status === 'won').length;
            const singleWon = singleBets.filter(b => b.status === 'won').length;
            const accWon = accBets.filter(b => b.status === 'won').length;
            
            document.getElementById('total-bets').textContent = total;
            document.getElementById('single-count').textContent = singleBets.length;
            document.getElementById('acc-count').textContent = accBets.length;
            document.getElementById('win-rate').textContent = total ? `${((won/total)*100).toFixed(1)}%` : '0%';
            document.getElementById('single-winrate').textContent = singleBets.length ? `${((singleWon/singleBets.length)*100).toFixed(0)}%` : '0%';
            document.getElementById('acc-winrate').textContent = accBets.length ? `${((accWon/accBets.length)*100).toFixed(0)}%` : '0%';
            
            let pl = 0, singlePL = 0, accPL = 0;
            allBets.forEach(b => {
                const betPL = b.status === 'won' ? (b.payout || b.potentialWin) - b.amount : (b.status === 'lost' ? -b.amount : 0);
                pl += betPL;
                if (b.selections) accPL += betPL; else singlePL += betPL;
            });
            
            const plEl = document.getElementById('total-pl'); plEl.textContent = `${pl>=0?'+':''}$${pl.toFixed(2)}`; plEl.style.color = pl>=0?'#4caf50':'#ff5252';
            document.getElementById('single-pl').textContent = `${singlePL>=0?'+':''}$${singlePL.toFixed(2)}`;
            document.getElementById('acc-pl').textContent = `${accPL>=0?'+':''}$${accPL.toFixed(2)}`;
            
            const pending = allBets.filter(b => b.status === 'active' && matchCache[b.fixtureId]?.status === 'finished').length;
            document.getElementById('pending-count').textContent = pending;
        }
        
        function updateFilterCounts() {
            document.getElementById('filter-all').textContent = allBets.length;
            document.getElementById('filter-active').textContent = allBets.filter(b => b.status === 'active').length;
            document.getElementById('filter-won').textContent = allBets.filter(b => b.status === 'won').length;
            document.getElementById('filter-lost').textContent = allBets.filter(b => b.status === 'lost').length;
        }
        
        function filterBets(filter) {
            currentFilter = filter;
            let filtered = allBets;
            if (filter === 'active') filtered = allBets.filter(b => b.status === 'active');
            else if (filter === 'won') filtered = allBets.filter(b => b.status === 'won');
            else if (filter === 'lost') filtered = allBets.filter(b => b.status === 'lost');
            else if (filter === 'single') filtered = allBets.filter(b => !b.selections);
            else if (filter === 'accumulator') filtered = allBets.filter(b => b.selections);
            
            displayBets(filtered);
        }
        
        function displayBets(bets) {
            const container = document.getElementById('bets-container');
            if (!bets.length) { container.innerHTML = '<div class="empty-state"><i class="fas fa-ticket-alt"></i><p>No bets found</p></div>'; return; }
            
            container.innerHTML = '<div class="bets-list"></div>';
            const list = container.querySelector('.bets-list');
            
            bets.forEach(bet => { list.appendChild(createBetCard(bet)); });
        }
        
        function createBetCard(bet) {
            const card = document.createElement('div');
            const isAcc = bet.selections && bet.selections.length > 0;
            card.className = `bet-card ${isAcc ? 'accumulator' : 'single'} ${bet.status}`;
            
            const placedDate = bet.placedAt?.toDate() || new Date();
            const match = matchCache[bet.fixtureId];
            const matchStatus = match?.status || 'upcoming';
            
            let feePercent = 5;
            if (matchStatus === 'upcoming' && match) {
                const mins = getMinutesUntilKickoff(match.startTime);
                if (mins < 5) feePercent = 50; else if (mins < 60) feePercent = 20;
            }
            
            const statusText = bet.status === 'active' ? 'Active' : bet.status === 'won' ? 'Won' : bet.status === 'lost' ? 'Lost' : bet.status === 'cashed_out' ? 'Cashed Out' : 'Cancelled';
            
            let matchStatusHtml = '';
            if (bet.status === 'active' && match) {
                if (matchStatus === 'upcoming') {
                    const mins = getMinutesUntilKickoff(match.startTime);
                    matchStatusHtml = `<div class="match-status status-upcoming"><i class="far fa-clock"></i> Starts in ${Math.floor(mins/60)}h ${mins%60}m</div>`;
                } else if (matchStatus === 'live') {
                    matchStatusHtml = `<div class="match-status status-live"><i class="fas fa-circle"></i> LIVE - ${getMatchMinute(match.startTime)}'</div>`;
                } else if (matchStatus === 'finished') {
                    matchStatusHtml = `<div class="match-status status-settling"><i class="fas fa-hourglass-half"></i> Awaiting settlement...</div>`;
                }
            }
            
            let matchesHtml = '';
            if (isAcc) {
                matchesHtml = `<div class="match-item"><div class="match-teams"><span class="match-name">${bet.selections.length} selections</span></div></div>`;
            } else {
                const betTypeName = bet.betType === 'home' ? 'Home Win' : bet.betType === 'draw' ? 'Draw' : 'Away Win';
                matchesHtml = `<div class="match-item"><div class="match-teams"><span class="match-name">${bet.matchName || 'Match'}</span><span class="match-odds">${bet.odds?.toFixed(2) || '2.00'}</span></div><div class="match-teams"><span class="match-pick">${betTypeName}</span></div></div>`;
            }
            
            let payoutDisplay = '';
            if (bet.status === 'won') payoutDisplay = `+$${(bet.payout || bet.potentialWin || 0).toFixed(2)}`;
            else if (bet.status === 'lost') payoutDisplay = `-$${(bet.amount || 0).toFixed(2)}`;
            else if (bet.status === 'cashed_out') payoutDisplay = `$${(bet.cashoutAmount || 0).toFixed(2)}`;
            else if (bet.status === 'active') payoutDisplay = `$${(bet.potentialWin || (bet.amount * (bet.totalOdds || bet.odds)) || 0).toFixed(2)}`;
            else payoutDisplay = '$0.00';
            
            let feeInfoHtml = '';
            if (bet.status === 'active' && matchStatus === 'upcoming') {
                const fee = bet.amount * (feePercent / 100);
                feeInfoHtml = `<div class="fee-info"><i class="fas fa-info-circle"></i> Cancel fee: <span class="fee-highlight">${feePercent}% ($${fee.toFixed(2)})</span> • Refund: $${(bet.amount - fee).toFixed(2)}</div>`;
            }
            
            let actionHtml = '';
            if (bet.status === 'active') {
                if (matchStatus === 'upcoming') {
                    actionHtml = `<button class="cancel-btn" onclick="cancelBet('${bet.id}')"><i class="fas fa-times"></i> Cancel Bet</button>`;
                } else if (matchStatus === 'live' && bet.canCashout) {
                    actionHtml = `<button class="cashout-btn" onclick="cashoutBet('${bet.id}')"><i class="fas fa-hand-holding-usd"></i> Cash Out</button>`;
                }
            }
            
            card.innerHTML = `
                <div class="bet-header"><span class="bet-type-badge ${isAcc?'accumulator':'single'}"><i class="fas ${isAcc?'fa-layer-group':'fa-ticket-alt'}"></i> ${isAcc?`Accumulator (${bet.selections.length})`:'Single'}</span><span class="bet-status ${bet.status}">${statusText}</span></div>
                ${matchStatusHtml}
                <div class="bet-matches">${matchesHtml}</div>
                ${isAcc && bet.totalOdds ? `<div class="total-odds-row"><span>Total Odds:</span><span class="total-odds-value">${bet.totalOdds.toFixed(2)}</span></div>` : ''}
                <div class="bet-footer"><div class="bet-amount"><span class="amount-value">$${(bet.amount||0).toFixed(2)}</span></div><div class="bet-payout"><span class="payout-value ${bet.status}">${payoutDisplay}</span></div></div>
                ${feeInfoHtml}
                ${actionHtml ? `<div class="action-buttons">${actionHtml}</div>` : ''}
                <div class="bet-date"><i class="far fa-calendar-alt"></i> ${placedDate.toLocaleDateString()} at ${placedDate.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</div>
            `;
            return card;
        }
        
        window.cancelBet = async (id) => {
            const bet = allBets.find(b => b.id === id);
            if (!bet) return;
            const match = matchCache[bet.fixtureId];
            const mins = getMinutesUntilKickoff(match?.startTime);
            let fee = 5; if (mins < 5) fee = 50; else if (mins < 60) fee = 20;
            if (!confirm(`Cancel this bet? ${fee}% fee. Refund: $${(bet.amount*(1-fee/100)).toFixed(2)}`)) return;
            try { const r = await cancelBetWithFee(id); alert(r.success ? `Refunded: $${r.refund.toFixed(2)}` : r.error); } catch(e) { alert('Error cancelling'); }
        };
        
        window.cashoutBet = async (id) => { if (!confirm('Cash out?')) return; try { const r = await cashoutBet(id); alert(r.success ? `Cashed out: $${r.amount.toFixed(2)}` : r.error); } catch(e) { alert('Error'); } };
        
        document.querySelectorAll('.filter-btn').forEach(b => b.addEventListener('click', function() { document.querySelectorAll('.filter-btn').forEach(x => x.classList.remove('active')); this.classList.add('active'); filterBets(this.dataset.filter); }));
        
        function updateTimer() { secondsUntilCheck--; if (secondsUntilCheck <= 0) secondsUntilCheck = 60; document.getElementById('next-check').textContent = `${secondsUntilCheck}s`; document.getElementById('settlement-progress').style.width = `${((60-secondsUntilCheck)/60)*100}%`; }
        setInterval(updateTimer, 1000);
        
        function getMinutesUntilKickoff(startTime) { if (!startTime) return 0; const now = new Date(); const kickoff = startTime.toDate ? startTime.toDate() : new Date(startTime); return Math.floor((kickoff - now) / 60000); }
        function getMatchMinute(startTime) { if (!startTime) return 45; try { return Math.floor((new Date() - (startTime.toDate ? startTime.toDate() : new Date(startTime))) / 60000); } catch { return 45; } }
    </script>
</body>
</html>
