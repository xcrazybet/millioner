class DuplicateProofSettlementManager {
    constructor(userId) {
        this.userId = userId;
        this.isRunning = false;
        this.emergencyStop = localStorage.getItem('xl_emergency_stop') === 'true';
        this.settledBetIds = this.loadFromStorage('xl_settled_ids');

    loadFromStorage(key) {

        } catch (e) { return new Set(); }

                    const match = matchMap[bet.fixture_id] || null;
                    const settled = await this.settleSingleBet(bet, match);
                    if (settled) { this.settledBetIds.add(bet.id); this.saveToStorage('xl_settled_ids', this.settledBetIds); processed++; }
                } catch (err) { console.error(`Error settling bet ${bet.id}:`, err); errors++; }
            }
        } catch (err) { console.error('Settlement engine error:', err); errors++; }
        finally { this.isRunning = false; }
        
        console.log(`✅ Settlement: ${processed} processed, ${duplicatesFound} duplicates, ${errors} errors`);
        return { processed, duplicates: duplicatesFound, errors };
    }
    
    async handleDuplicates(bets) {
        const groups = {};
        for (const bet of bets) {
            const key = this.createDuplicateKey(bet);
            if (!groups[key]) groups[key] = [];
            groups[key].push(bet);
        }
        
        const cleanBets = []; let duplicateCount = 0;
        for (const [key, group] of Object.entries(groups)) {
            if (group.length === 1) { cleanBets.push(group[0]); continue; }
            console.warn(`⚠️ Found ${group.length} duplicates: ${key}`);
            const sorted = group.sort((a, b) => new Date(a.placed_at || 0) - new Date(b.placed_at || 0));
            cleanBets.push(sorted[0]);
            duplicateCount += sorted.length - 1;
            for (const dup of sorted.slice(1)) {
                await this.cancelDuplicate(dup, sorted[0].id);
                this.settledBetIds.add(dup.id);
                this.duplicateGroupIds.add(dup.id);
            }
            this.saveToStorage('xl_settled_ids', this.settledBetIds);
            this.saveToStorage('xl_dup_groups', this.duplicateGroupIds);
        }
        return { cleanBets, duplicateCount };
    }
    
    createDuplicateKey(bet) {
        if (bet.bet_type === 'accumulator' && bet.selections && Array.isArray(bet.selections)) {
            const selHash = bet.selections.map(s => `${s.fixtureId || s.fixture_id}_${s.betType || s.bet_type}_${s.odds}`).sort().join('|');
            return `ACC_${bet.user_id}_${bet.amount}_${bet.odds}_${selHash}`;
        }
        return `SGL_${bet.user_id}_${bet.fixture_id}_${bet.bet_type}_${bet.amount}_${bet.odds}`;
    }
    
    async cancelDuplicate(duplicateBet, originalBetId) {
        const stake = parseFloat(duplicateBet.amount || 0);
        try {
            const { error, data } = await supabaseClient.from('bets').update({
                status: 'cancelled', settlement_reason: `DUPLICATE - Original: ${originalBetId}`,
                is_duplicate: true, duplicate_of: originalBetId, refund_amount: stake,
                cancelled_at: new Date().toISOString(), updated_at: new Date().toISOString()
            }).eq('id', duplicateBet.id).eq('status', 'active').select('id');
            
            if (error || !data || data.length === 0) return false;
            if (stake > 0) await this.executeRefund(duplicateBet.user_id, duplicateBet.id, stake, 'duplicate_cancellation');
            duplicateBet.status = 'cancelled';
            duplicateBet.settlement_reason = `DUPLICATE - Original: ${originalBetId}`;
            showNotification(`🔄 Duplicate refunded: $${stake.toFixed(2)}`, 'warning');
            return true;
        } catch (e) { return false; }
    }
    
    async settleSingleBet(bet, match) {
        if (bet.bet_type === 'accumulator') return await this.settleAccumulator(bet);
        if (!match) return false;
        
        const status = (match.status || '').toUpperCase();
        if (!['FINISHED', 'FT', 'AET', 'PEN'].includes(status)) return false;
        
        const result = this.determineResult(bet, match);
        if (!result) return false;
        
        const stake = parseFloat(bet.amount || 0);
        const odds = parseFloat(bet.odds || 1);
        let newStatus, payoutAmount, profitAmount;
        
        if (result.refund) { newStatus = 'cancelled'; payoutAmount = stake; profitAmount = 0; }
        else if (result.won) { newStatus = 'won'; payoutAmount = stake * odds; profitAmount = payoutAmount - stake; }
        else { newStatus = 'lost'; payoutAmount = 0; profitAmount = -stake; }
        
        const { error, data } = await supabaseClient.from('bets').update({
            status: newStatus, payout: payoutAmount, profit_loss: profitAmount,
            settlement_reason: result.reason, settled_at: new Date().toISOString(),
            match_score: `${match.goals_home || 0}-${match.goals_away || 0}`, updated_at: new Date().toISOString()
        }).eq('id', bet.id).eq('status', 'active').is('settled_at', null).select('id, status');
        
        if (error || !data || data.length === 0) { console.warn(`⚠️ Bet ${bet.id} already settled`); return false; }
        if (payoutAmount > 0) await this.executePayout(bet.user_id, bet.id, payoutAmount, profitAmount, { stake, odds, reason: result.reason, bet_type: bet.bet_type });
        
        bet.status = newStatus; bet.payout = payoutAmount; bet.profit_loss = profitAmount;
        bet.settlement_reason = result.reason; bet.settled_at = new Date().toISOString();
        
        if (newStatus === 'won') showNotification(`🏆 WON: ${escapeHtml(bet.match_name || 'Match')} - +$${profitAmount.toFixed(2)}`, 'success');
        else if (newStatus === 'lost') showNotification(`❌ LOST: ${escapeHtml(bet.match_name || 'Match')} - $${stake.toFixed(2)}`, 'error');
        return true;
    }
    
    async settleAccumulator(bet) {
        if (!bet.selections || !Array.isArray(bet.selections) || bet.selections.length === 0) return false;
        const fids = bet.selections.map(s => s.fixtureId || s.fixture_id).filter(Boolean);
        if (fids.length === 0) return false;
        
        const matchMap = await fetchMatchesBatch(fids);
        const finishedStatuses = ['FINISHED', 'FT', 'AET', 'PEN'];
        let allFinished = true;
        const selectionResults = [];
        
        for (const sel of bet.selections) {
            const fid = sel.fixtureId || sel.fixture_id;
            const match = matchMap[fid];
            if (!match || !finishedStatuses.includes((match.status || '').toUpperCase())) { allFinished = false; break; }
            const res = this.determineResult({ bet_type: sel.betType || sel.bet_type }, match);
            if (!res) { allFinished = false; break; }
            selectionResults.push(res);
        }
        if (!allFinished) return false;
        
        const anyLost = selectionResults.some(r => r.won === false && !r.refund);
        const allWon = selectionResults.every(r => r.won === true);
        const hasRefund = selectionResults.some(r => r.refund);
        const stake = parseFloat(bet.amount || 0);
        const odds = parseFloat(bet.odds || 1);
        
        let newStatus, payoutAmount, profitAmount, reason;
        if (anyLost) { newStatus = 'lost'; payoutAmount = 0; profitAmount = -stake; reason = 'One or more legs lost'; }
        else if (hasRefund) { newStatus = 'cancelled'; payoutAmount = stake; profitAmount = 0; reason = 'One or more legs refunded'; }
        else if (allWon) { newStatus = 'won'; payoutAmount = stake * odds; profitAmount = payoutAmount - stake; reason = 'All legs won!'; }
        else return false;
        
        const { error, data } = await supabaseClient.from('bets').update({
            status: newStatus, payout: payoutAmount, profit_loss: profitAmount,
            settlement_reason: reason, settled_at: new Date().toISOString(), updated_at: new Date().toISOString()
        }).eq('id', bet.id).eq('status', 'active').is('settled_at', null).select('id');
        
        if (error || !data || data.length === 0) return false;
        if (payoutAmount > 0) await this.executePayout(bet.user_id, bet.id, payoutAmount, profitAmount, { stake, odds, reason, bet_type: 'accumulator' });
        
        bet.status = newStatus; bet.payout = payoutAmount; bet.profit_loss = profitAmount;
        bet.settlement_reason = reason; bet.settled_at = new Date().toISOString();
        return true;
    }
    
    determineResult(bet, match) {
        const hg = parseInt(match.goals_home || 0);
        const ag = parseInt(match.goals_away || 0);
        const tg = hg + ag;
        const bt = bet.bet_type;
        
        const resultMap = {
            'home': { won: hg > ag, reason: `${hg}-${ag} (Home Win)` },
            'away': { won: ag > hg, reason: `${hg}-${ag} (Away Win)` },
            'draw': { won: hg === ag, reason: `${hg}-${ag} (Draw)` },
            '1X': { won: hg >= ag, reason: `${hg}-${ag} (1X)` },
            '12': { won: hg !== ag, reason: `${hg}-${ag} (12)` },
            'X2': { won: ag >= hg, reason: `${hg}-${ag} (X2)` },
            'over05': { won: tg > 0.5, reason: `${hg}-${ag} (Over 0.5)` },
            'under05': { won: tg < 0.5, reason: `${hg}-${ag} (Under 0.5)` },
            'over15': { won: tg > 1.5, reason: `${hg}-${ag} (Over 1.5)` },
            'under15': { won: tg < 1.5, reason: `${hg}-${ag} (Under 1.5)` },
            'over25': { won: tg > 2.5, reason: `${hg}-${ag} (Over 2.5)` },
            'under25': { won: tg < 2.5, reason: `${hg}-${ag} (Under 2.5)` },
            'over35': { won: tg > 3.5, reason: `${hg}-${ag} (Over 3.5)` },
            'under35': { won: tg < 3.5, reason: `${hg}-${ag} (Under 3.5)` },
            'btts_yes': { won: hg > 0 && ag > 0, reason: `${hg}-${ag} (BTTS Yes)` },
            'btts_no': { won: !(hg > 0 && ag > 0), reason: `${hg}-${ag} (BTTS No)` },
            'home_dnb': hg === ag ? { refund: true, reason: `${hg}-${ag} (DNB Refund)` } : { won: hg > ag, reason: `${hg}-${ag} (Home DNB)` },
            'away_dnb': hg === ag ? { refund: true, reason: `${hg}-${ag} (DNB Refund)` } : { won: ag > hg, reason: `${hg}-${ag} (Away DNB)` }
        };
        return resultMap[bt] || null;
    }
    
    async executePayout(userId, betId, totalPayout, profit, metadata) {
        if (this.processedPayouts.has(betId)) { console.warn(`⚠️ Payout already processed: ${betId}`); return; }
        
        try {
            const walletRef = db.collection('wallets').doc(userId);
            const payoutLockRef = db.collection('payout_logs').doc(betId);
            
            await db.runTransaction(async (transaction) => {
                const existingLock = await transaction.get(payoutLockRef);
                if (existingLock.exists) throw new Error('DUPLICATE_PAYOUT_LOCK');
                
                const walletDoc = await transaction.get(walletRef);
                const currentBalance = walletDoc.exists ? (walletDoc.data().balance || 0) : 0;
                const newBalance = parseFloat((currentBalance + totalPayout).toFixed(2));
                
                transaction.set(payoutLockRef, { user_id: userId, bet_id: betId, amount: totalPayout, profit, type: 'settlement_payout', balance_before: currentBalance, balance_after: newBalance, timestamp: firebase.firestore.FieldValue.serverTimestamp(), metadata });
                transaction.update(walletRef, { balance: newBalance, updated_at: new Date().toISOString() });
                
                const historyRef = db.collection('transactions').doc();
                transaction.set(historyRef, { user_id: userId, bet_id: betId, amount: totalPayout, profit, type: 'settlement_payout', balance_before: currentBalance, balance_after: newBalance, timestamp: firebase.firestore.FieldValue.serverTimestamp(), metadata });
            });
            
            this.processedPayouts.add(betId);
            this.saveToStorage('xl_payout_ids', this.processedPayouts);
            console.log(`💰 Payout: $${totalPayout.toFixed(2)} for bet ${betId}`);
        } catch (e) {
            if (e.message === 'DUPLICATE_PAYOUT_LOCK') { this.processedPayouts.add(betId); this.saveToStorage('xl_payout_ids', this.processedPayouts); }
            else { console.error(`❌ Payout failed for ${betId}:`, e); throw e; }
        }
    }
    
    async executeRefund(userId, betId, amount, reason) {
        const refundKey = `refund_${betId}`;
        if (this.processedPayouts.has(refundKey)) return;
        
        try {
            const walletRef = db.collection('wallets').doc(userId);
            const refundLockRef = db.collection('refund_logs').doc(betId);
            
            await db.runTransaction(async (transaction) => {
                const existingLock = await transaction.get(refundLockRef);
                if (existingLock.exists) throw new Error('DUPLICATE_REFUND_LOCK');
                
                const walletDoc = await transaction.get(walletRef);
                const currentBalance = walletDoc.exists ? (walletDoc.data().balance || 0) : 0;
                const newBalance = parseFloat((currentBalance + amount).toFixed(2));
                
                transaction.set(refundLockRef, { user_id: userId, bet_id: betId, amount, type: 'refund', reason, balance_before: currentBalance, balance_after: newBalance, timestamp: firebase.firestore.FieldValue.serverTimestamp() });
                transaction.update(walletRef, { balance: newBalance, updated_at: new Date().toISOString() });
            });
            
            this.processedPayouts.add(refundKey);
            this.saveToStorage('xl_payout_ids', this.processedPayouts);
        } catch (e) {
            if (e.message === 'DUPLICATE_REFUND_LOCK') { this.processedPayouts.add(refundKey); this.saveToStorage('xl_payout_ids', this.processedPayouts); }
        }
    }
}

// ============================================
// SAFE DATA EXTRACTION HELPERS
// ============================================
function safeParseJSON(val) {
    if (!val) return null;
    if (typeof val === 'object') return val;
    if (typeof val === 'string') {
        try { return JSON.parse(val); } catch(e) { return null; }
    }
    return null;
}

function extractTeamName(teamData, fallback) {
    if (!teamData) return fallback || 'Team';
    if (typeof teamData === 'string') {
        const parsed = safeParseJSON(teamData);
        if (parsed && parsed.name && parsed.name !== 'Home' && parsed.name !== 'Away') return parsed.name;
        if (teamData.trim() && teamData !== 'Home' && teamData !== 'Away') return teamData.trim();
        return fallback || 'Team';
    }
    if (typeof teamData === 'object' && teamData.name && teamData.name !== 'Home' && teamData.name !== 'Away') return teamData.name;
    return fallback || 'Team';
}

function extractTeamLogo(teamData) {
    if (!teamData) return '';
    if (typeof teamData === 'string') {
        const parsed = safeParseJSON(teamData);
        if (parsed?.logo) return parsed.logo;
    }
    if (typeof teamData === 'object' && teamData.logo) return teamData.logo;
    return '';
}

function extractScore(scoreData) {
    if (!scoreData) return { home: 0, away: 0 };
    if (typeof scoreData === 'object') return { home: scoreData.home || 0, away: scoreData.away || 0 };
    if (typeof scoreData === 'string') {
        const parsed = safeParseJSON(scoreData);
        if (parsed) return { home: parsed.home || 0, away: parsed.away || 0 };
    }
    return { home: 0, away: 0 };
}

// ============================================
// MATCH DATA FETCHING (FIXED FOR SUPABASE)
// ============================================
async function fetchMatchFromAPI(fid) {
    try {
        const r = await fetch(`${API_BASE}/api/fixture/${fid}`);
        if (!r.ok) return null;
        const d = await r.json();
        if (d.success && d.fixture) {
            const f = d.fixture;
            return {
                fixture_id: fid,
                status: f.fixture?.status?.short || 'NS',
                elapsed: f.fixture?.status?.elapsed || 0,
                goals_home: f.goals?.home || 0,
                goals_away: f.goals?.away || 0,
                start_time: f.fixture?.date || '',
                league_name: f.league?.name || '',
                home_team: { name: extractTeamName(f.teams?.home, 'Home'), logo: f.teams?.home?.logo || '' },
                away_team: { name: extractTeamName(f.teams?.away, 'Away'), logo: f.teams?.away?.logo || '' }
            };
        }
        return null;
    } catch(e) { return null; }
}

async function fetchMatchesBatch(fids) {
    if (!fids || !fids.length) return {};
    const result = {};
    
    // Step 1: Try Supabase
    try {
        const { data, error } = await supabaseClient.from('sports_matches').select('*').in('fixture_id', fids);
        
        if (!error && data && data.length > 0) {
            console.log(`✅ Supabase returned ${data.length}/${fids.length} matches`);
            
            for (const row of data) {
                const score = extractScore(row.score);
                const homeName = extractTeamName(row.home_team, 'Home');
                const awayName = extractTeamName(row.away_team, 'Away');
                const homeLogo = extractTeamLogo(row.home_team);
                const awayLogo = extractTeamLogo(row.away_team);
                
                result[row.fixture_id] = {
                    fixture_id: row.fixture_id,
                    status: row.status || 'NS',
                    elapsed: row.elapsed || 0,
                    goals_home: score.home,
                    goals_away: score.away,
                    start_time: row.start_time || '',
                    league_name: row.league_name || '',
                    home_team: { name: homeName, logo: homeLogo || `https://ui-avatars.com/api/?name=${encodeURIComponent(homeName)}&size=32&background=1a2332&color=00ff9d` },
                    away_team: { name: awayName, logo: awayLogo || `https://ui-avatars.com/api/?name=${encodeURIComponent(awayName)}&size=32&background=1a2332&color=ff9800` }
                };
            }
        } else if (error) {
            console.warn('Supabase fetch warning:', error.message || error);
        }
    } catch(e) {
        console.warn('Supabase fetch exception:', e.message || e);
    }
    
    // Step 2: Fetch missing from API
    const missing = fids.filter(fid => !result[fid]);
    if (missing.length > 0) {
        console.log(`Fetching ${missing.length} missing matches from API...`);
        const apiPromises = missing.map(async (fid) => {
            try {
                const match = await fetchMatchFromAPI(fid);
                return match ? { fid, data: match } : null;
            } catch(e) { return null; }
        });
        
        const apiResults = await Promise.all(apiPromises);
        apiResults.forEach(res => {
            if (res) result[res.fid] = res.data;
        });
    }
    
    console.log(`📊 Match data: ${Object.keys(result).length}/${fids.length} fixtures resolved`);
    return result;
}

// ============================================
// UTILITY FUNCTIONS
// ============================================
function escapeHtml(s) {
    if (!s) return '';
    return String(s).replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
}

function showNotification(msg, type = 'info') {
    const existing = document.querySelectorAll('.notification');
    if (existing.length > 3) existing[0].remove();
    
    const n = document.createElement('div');
    n.className = 'notification';
    switch(type) {
        case 'success': n.style.background = 'linear-gradient(135deg, #00c853, #00e676)'; break;
        case 'error': n.style.background = 'linear-gradient(135deg, #ff1744, #ff5252)'; break;
        case 'warning': n.style.background = 'linear-gradient(135deg, #ff9100, #ffab40)'; break;
        default: n.style.background = 'linear-gradient(135deg, #2979ff, #448aff)';
    }
    n.innerHTML = msg;
    document.body.appendChild(n);
    setTimeout(() => { n.style.opacity = '0'; n.style.transition = 'opacity 0.3s'; setTimeout(() => n.remove(), 300); }, 4000);
}

function formatFullDate(d) {
    if (!d) return '-';
    return new Date(d).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function formatBetTypeName(bt) {
    const names = {
        'home': '🏠 Home Win', 'draw': '🤝 Draw', 'away': '✈️ Away Win',
        'over25': 'Over 2.5', 'under25': 'Under 2.5', 'btts_yes': 'BTTS Yes', 'btts_no': 'BTTS No',
        '1X': '1X', '12': '12', 'X2': 'X2', 'over05': 'Over 0.5', 'under05': 'Under 0.5',
        'over15': 'Over 1.5', 'under15': 'Under 1.5', 'over35': 'Over 3.5', 'under35': 'Under 3.5',
        'home_dnb': 'Home DNB', 'away_dnb': 'Away DNB', 'accumulator': 'Accumulator'
    };
    return names[bt] || bt.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
}

async function loadBets() {
    const u = auth.currentUser;
    if (!u) return;
    
    try {
        const statusEl = document.getElementById('loading-status');
        if (statusEl) statusEl.textContent = 'Connecting to database...';
        
        const { data, error } = await supabaseClient
            .from('bets')
            .select('*')
            .eq('user_id', u.uid)
            .order('placed_at', { ascending: false });
        
        if (error) {
            console.error('Supabase query error:', error);
            throw new Error(`Database error: ${error.message || JSON.stringify(error)}`);
        }
        
        const liveBets = data || [];
        console.log(`📥 Loaded ${liveBets.length} bets from Supabase`);
        
        if (statusEl) statusEl.textContent = `Loading match data for ${liveBets.length} bets...`;
        
        // Extract all fixture IDs
        const uniqueFids = [...new Set(liveBets.map(b => b.fixture_id).filter(Boolean))];
        
        // Also extract acca fixture IDs
        for (const b of liveBets) {
            if (b.bet_type === 'accumulator' && b.selections) {
                let selections = b.selections;
                if (typeof selections === 'string') {
                    try { selections = JSON.parse(selections); } catch(e) { selections = []; }
                }
                if (Array.isArray(selections)) {
                    selections.forEach(s => {
                        const fid = s.fixtureId || s.fixture_id;
                        if (fid && !uniqueFids.includes(fid)) uniqueFids.push(fid);
                    });
                }
            }
        }
        
        // Fetch all match data
        const matchMap = uniqueFids.length > 0 ? await fetchMatchesBatch(uniqueFids) : {};
        
        // Enrich bets with match data
        for (let b of liveBets) {
            // Parse selections for accumulators
            if (b.bet_type === 'accumulator' && b.selections) {
                if (typeof b.selections === 'string') {
                    try { b.selections = JSON.parse(b.selections); } catch(e) { b.selections = []; }
                }
                
                if (Array.isArray(b.selections)) {
                    b.selections.forEach(s => {
                        const fid = s.fixtureId || s.fixture_id;
                        if (fid && matchMap[fid]) s._match = matchMap[fid];
                    });
                }
            }
            
            // Set defaults
            let hFallback = 'Home', aFallback = 'Away';
            if (b.match_name && b.match_name.includes(' vs ')) {
                const parts = b.match_name.split(' vs ');
                if (parts[0]?.trim()) hFallback = parts[0].trim();
                if (parts[1]?.trim()) aFallback = parts[1].trim();
            }
            
            b._homeTeam = { name: hFallback, logo: `https://ui-avatars.com/api/?name=${encodeURIComponent(hFallback)}&size=32&background=1a2332&color=00ff9d` };
            b._awayTeam = { name: aFallback, logo: `https://ui-avatars.com/api/?name=${encodeURIComponent(aFallback)}&size=32&background=1a2332&color=ff9800` };
            b._score = { home: 0, away: 0 };
            b._league = 'Sports Match';
            b._kickoff = b.placed_at;
            b._matchStatus = 'NS';
            b._isPreMatch = true;
            
            // Enrich from match data if available
            if (b.fixture_id && matchMap[b.fixture_id]) {
                const m = matchMap[b.fixture_id];
                const homeName = m.home_team?.name && m.home_team.name !== 'Home' ? m.home_team.name : hFallback;
                const awayName = m.away_team?.name && m.away_team.name !== 'Away' ? m.away_team.name : aFallback;
                
                b.match_name = `${homeName} vs ${awayName}`;
                b._homeTeam = { name: homeName, logo: m.home_team?.logo || b._homeTeam.logo };
                b._awayTeam = { name: awayName, logo: m.away_team?.logo || b._awayTeam.logo };
                b._league = m.league_name || b._league;
                b._kickoff = m.start_time || b._kickoff;
                b._matchStatus = m.status || 'NS';
                b._elapsed = m.elapsed || 0;
                b._score = { home: m.goals_home || 0, away: m.goals_away || 0 };
                b._match = m;
            }
        }
        
        allBets = liveBets;
        
        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').style.display = 'block';
        
        updateStats();
        updateCounts();
        filterBets(currentFilter);
        startSettlementTimers();
        
        await autoSettleBets();
        
    } catch (e) {
        console.error('Load bets error:', e);
        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').style.display = 'block';
        
        const container = document.getElementById('bet-list-container');
        if (container) {
            container.innerHTML = `<div class="empty-state">
                <i class="fas fa-exclamation-triangle" style="color:var(--danger);"></i>
                <p>Failed to load bets</p>
                <p style="font-size:11px;color:var(--text-secondary);margin-top:5px;">${escapeHtml(e.message || 'Unknown error')}</p>
                <button class="btn-action-tool" onclick="loadBets()" style="margin-top:15px;"><i class="fas fa-redo"></i> Retry</button>
            </div>`;
        }
    }
}

async function autoSettleBets() {
    const u = auth.currentUser;
    if (!u) return;
    if (!settlementManager) settlementManager = new DuplicateProofSettlementManager(u.uid);
    if (settlementManager.emergencyStop) return;
    
    const activeBets = allBets.filter(b => b.status === 'active' && !settlementManager.settledBetIds.has(b.id));
    if (activeBets.length === 0) return;
    
    const result = await settlementManager.processBets(activeBets);
    if (result.processed > 0 || result.duplicates > 0) {
        await loadBalance();
        updateStats();
        updateCounts();
        filterBets(currentFilter);
    }
}

// ============================================
// CANCEL BET
// ============================================
async function cancelBet(betId) {
    const bet = allBets.find(b => b.id === betId);
    if (!bet || bet.status !== 'active') { showNotification('❌ Cannot cancel', 'error'); return; }
    if (bet.bet_type === 'accumulator') { showNotification('❌ Accumulators cannot be cancelled', 'error'); return; }
    if (settlementManager?.settledBetIds.has(betId)) return;
    
    let matchStarted = false;
    if (bet._kickoff) matchStarted = new Date() > new Date(bet._kickoff);
    if (matchStarted) { showNotification('❌ Match started', 'error'); return; }
    
    const stake = parseFloat(bet.amount || 0);
    const feePercent = 5;
    const refundAmount = parseFloat((stake * (1 - feePercent / 100)).toFixed(2));
    const fee = parseFloat((stake - refundAmount).toFixed(2));
    
    if (!confirm(`Cancel?\n\nStake: $${stake.toFixed(2)}\nRefund: $${refundAmount.toFixed(2)}\nFee (${feePercent}%): $${fee.toFixed(2)}`)) return;
    
    try {
        const { error, data } = await supabaseClient.from('bets').update({
            status: 'cancelled', cancellation_fee: fee, refund_amount: refundAmount,
            cancelled_at: new Date().toISOString(), settlement_reason: `Cancelled - ${feePercent}% fee`, updated_at: new Date().toISOString()
        }).eq('id', betId).eq('status', 'active').select('id');
        
        if (error || !data || data.length === 0) { showNotification('❌ Cancel failed', 'error'); return; }
        
        settlementManager.settledBetIds.add(betId);
        settlementManager.saveToStorage('xl_settled_ids', settlementManager.settledBetIds);
        await settlementManager.executeRefund(bet.user_id, bet.id, refundAmount, 'user_cancellation');
        
        bet.status = 'cancelled';
        showNotification(`✅ Refunded: $${refundAmount.toFixed(2)}`, 'success');
        await loadBalance(); updateStats(); updateCounts(); filterBets(currentFilter);
    } catch (e) { showNotification(`Error: ${e.message}`, 'error'); }
}

// UI FUNCTIONS

function updateStats() {
    const total = allBets.length;
    const won = allBets.filter(b => b.status === 'won');
    const lost = allBets.filter(b => b.status === 'lost');
    const active = allBets.filter(b => b.status === 'active');
    
    let wonAmount = 0, lostAmount = 0, netPnl = 0;
    won.forEach(b => { const p = parseFloat(b.payout || 0); wonAmount += p; netPnl += p - parseFloat(b.amount || 0); });
    lost.forEach(b => { const s = parseFloat(b.amount || 0); lostAmount += s; netPnl -= s; });
    allBets.filter(b => b.status === 'cashed-out').forEach(b => { netPnl += parseFloat(b.cashout_amount || 0) - parseFloat(b.amount || 0); });
    
    const winRate = (won.length + lost.length) > 0 ? ((won.length / (won.length + lost.length)) * 100).toFixed(1) : 0;
    
    document.getElementById('total-bets').textContent = total;
    document.getElementById('total-won').textContent = won.length;
    document.getElementById('total-lost').textContent = lost.length;
    document.getElementById('total-active').textContent = active.length;
    document.getElementById('won-amount').textContent = `$${wonAmount.toFixed(2)}`;
    document.getElementById('lost-amount').textContent = `$${lostAmount.toFixed(2)}`;
    document.getElementById('win-rate-display').textContent = `${winRate}%`;
    document.getElementById('win-rate-fill').style.width = `${winRate}%`;
    
    const plEl = document.getElementById('total-pl');
    plEl.textContent = (netPnl >= 0 ? '+' : '') + '$' + netPnl.toFixed(2);
    plEl.style.color = netPnl >= 0 ? '#4caf50' : 'var(--danger)';
}

function updateCounts() {
    const counts = {
        'all': allBets.length, 'active': allBets.filter(b => b.status === 'active').length,
        'won': allBets.filter(b => b.status === 'won').length, 'lost': allBets.filter(b => b.status === 'lost').length,
        'cancelled': allBets.filter(b => b.status === 'cancelled').length, 'cashed-out': allBets.filter(b => b.status === 'cashed-out').length
    };
    for (const [key, val] of Object.entries(counts)) {
        const el = document.getElementById(`cnt-${key}`);
        if (el) el.textContent = val;
    }
}

function filterBets(filter) {
    currentFilter = filter;
    let filtered = [...allBets];
    if (filter !== 'all') filtered = filtered.filter(b => b.status === filter);
    
    const searchVal = document.getElementById('bet-search-input')?.value?.toLowerCase().trim();
    if (searchVal) {
        filtered = filtered.filter(b => {
            const mn = (b.match_name || '').toLowerCase();
            const lg = (b._league || '').toLowerCase();
            const tk = ('XL' + (b.id?.slice(-8) || '')).toLowerCase();
            return mn.includes(searchVal) || lg.includes(searchVal) || tk.includes(searchVal);
        });
    }
    
    filtered.sort((a, b) => {
        if (a.status === 'active' && b.status !== 'active') return -1;
        if (a.status !== 'active' && b.status === 'active') return 1;
        if (a.status === 'active') {
            const ka = a._kickoff ? new Date(a._kickoff).getTime() : Infinity;
            const kb = b._kickoff ? new Date(b._kickoff).getTime() : Infinity;
            return ka - kb;
        }
        const ta = new Date(a.settled_at || a.cashed_out_at || a.placed_at || 0).getTime();
        const tb = new Date(b.settled_at || b.cashed_out_at || b.placed_at || 0).getTime();
        return tb - ta;
    });
    
    const container = document.getElementById('bet-list-container');
    if (container) {
        container.innerHTML = filtered.length 
            ? filtered.map(b => createBetCard(b)).join('')
            : `<div class="empty-state"><i class="fas fa-ticket-alt"></i><p>No bets found</p></div>`;
    }
    startSettlementTimers();
}

function createBetCard(bet) {
    const amt = parseFloat(bet.amount || 0);
    const odds = parseFloat(bet.odds || 2);
    const payout = parseFloat(bet.payout || bet.potential_win || 0);
    const profit = bet.status === 'won' ? (payout - amt) : (bet.status === 'lost' ? -amt : 0);
    const ticket = 'XL' + (bet.id?.slice(-8) || '').toUpperCase();
    const isActive = bet.status === 'active';
    const isAcc = bet.bet_type === 'accumulator';
    const matchStatus = (bet._matchStatus || '').toLowerCase();
    const isLive = ['live', '1h', '2h', 'ht'].includes(matchStatus);
    const matchStarted = isLive || ['finished', 'ft', 'aet', 'pen'].includes(matchStatus);
    const isPreMatch = bet._kickoff ? new Date(bet.placed_at) < new Date(bet._kickoff) : true;
    const isHalftime = matchStatus === 'ht';
    
    const canCancel = isActive && !isAcc && !matchStarted && !(settlementManager?.settledBetIds.has(bet.id));
    const canCashout = isActive && matchStarted && isPreMatch && !isHalftime && isLive && !(settlementManager?.settledBetIds.has(bet.id));
    
    const homeTeam = bet._homeTeam || { name: 'Home', logo: '' };
    const awayTeam = bet._awayTeam || { name: 'Away', logo: '' };
    const scoreDisplay = bet._score ? `<span class="bet-score-display${isLive ? ' live' : ''}">${bet._score.home} - ${bet._score.away}</span>` : '';
    
    const statusClass = bet.status === 'won' ? 'won' : bet.status === 'lost' ? 'lost' : bet.status === 'cancelled' ? 'cancelled' : bet.status === 'cashed-out' ? 'cashed-out' : 'active';
    
    let cashoutHTML = '';
    if (canCashout) {
        const elapsed = bet._elapsed || 45;
        const remainingMin = Math.max(1, 90 - elapsed);
        const potentialReturn = amt * odds;
        let coVal = potentialReturn * 0.45 * Math.pow(remainingMin / 90, 0.7) * 0.95;
        coVal = Math.max(amt * 0.05, Math.min(potentialReturn * 0.95, coVal));
        
        cashoutHTML = `
        <div class="cashout-preview">
            <div class="cashout-metrics">
                <span>Est. Cash Out: <strong>$${coVal.toFixed(2)}</strong></span>
                <span>Profit: <span style="color:${coVal >= amt ? '#4caf50' : 'var(--danger)'}">${coVal >= amt ? '+' : ''}$${(coVal - amt).toFixed(2)}</span></span>
            </div>
            <div class="partial-cashout-box">
                <span>Stake: <strong id="pct-val-${bet.id}">100%</strong></span>
                <input type="range" class="partial-slider" min="10" max="100" step="10" value="100"
                    oninput="document.getElementById('pct-val-${bet.id}').textContent = this.value + '%'" id="slider-${bet.id}">
            </div>
        </div>`;
    } else if (isActive && isHalftime) {
        cashoutHTML = `<div class="cashout-preview" style="border-color:var(--orange);"><div style="color:var(--orange);font-weight:bold;">⏸️ Cash Out suspended - Resumes 2nd Half</div></div>`;
    }
    
    let actionsHTML = '';
    if (isActive) {
        actionsHTML = '<div class="bet-actions"><div class="bet-action-row-buttons">';
        if (canCancel) actionsHTML += `<button class="cancel-btn" onclick="event.stopPropagation();cancelBet('${bet.id}')"><i class="fas fa-ban"></i> Cancel</button>`;
        if (canCashout) actionsHTML += `<button class="cashout-btn" onclick="event.stopPropagation();cashoutBet('${bet.id}', parseInt(document.getElementById('slider-${bet.id}')?.value || 100))"><i class="fas fa-money-bill-wave"></i> Cash Out</button>`;
        actionsHTML += '</div></div>';
    }
    
    return `
    <div class="bet-card ${statusClass}" onclick="showDetails('${bet.id}')">
        <div class="bet-top">
            <div>
                <span class="bet-type-tag ${isAcc ? 'accumulator' : 'single'}">${isAcc ? 'ACCUMULATOR' : 'SINGLE'}</span>
                <span class="bet-ticket-num">#${ticket}</span>
                ${!isPreMatch && isActive ? '<span class="live-bet-badge"><i class="fas fa-bolt"></i> LIVE BET</span>' : ''}
            </div>
            <span class="bet-status-badge ${statusClass}">
                ${bet.status === 'won' ? '🏆 WON' : bet.status === 'lost' ? '❌ LOST' : bet.status === 'cancelled' ? '⛔ CANCELLED' : bet.status === 'cashed-out' ? '💰 CASHED OUT' : '⏳ ACTIVE'}
            </span>
        </div>
        <div class="bet-body">
            <div class="bet-match-row">
                <img class="team-logo-small" src="${homeTeam.logo || ''}" onerror="this.style.display='none'" alt="">
                <div class="bet-match-name">${escapeHtml(homeTeam.name)} vs ${escapeHtml(awayTeam.name)}${scoreDisplay}</div>
                <img class="team-logo-small" src="${awayTeam.logo || ''}" onerror="this.style.display='none'" alt="">
            </div>
            <div class="bet-league">${escapeHtml(bet._league || '')}${bet._elapsed ? ` | ${bet._elapsed}'` : ''} | ${matchStatus.toUpperCase()}</div>
            <div class="bet-pick">${escapeHtml(formatBetTypeName(bet.bet_type))} <span>@${odds.toFixed(2)}</span></div>
        </div>
        <div class="bet-meta-row">
            <span><i class="fas fa-calendar-plus"></i> ${formatFullDate(bet.placed_at)}</span>
            <span><i class="fas fa-clock"></i> ${formatFullDate(bet._kickoff)}</span>
            ${isActive ? `<span><i class="fas fa-hourglass-end"></i> <span class="settlement-timer" id="timer-${bet.id}">...</span></span>` : ''}
        </div>
        ${cashoutHTML}
        <div class="bet-details-grid">
            <div class="bet-detail"><div class="lbl">Stake</div><div class="val">$${amt.toFixed(2)}</div></div>
            <div class="bet-detail"><div class="lbl">${isActive ? 'Potential' : 'Payout'}</div><div class="val">$${payout.toFixed(2)}</div></div>
            <div class="bet-detail"><div class="lbl">P/L</div><div class="val" style="color:${profit >= 0 ? '#4caf50' : 'var(--danger)'}">${profit >= 0 ? '+' : ''}$${Math.abs(profit).toFixed(2)}</div></div>
        </div>
        ${bet.settlement_reason ? `<div class="bet-result-row ${statusClass}"><i class="fas fa-gavel"></i> ${escapeHtml(bet.settlement_reason)}</div>` : ''}
        ${actionsHTML}
    </div>`;
}

function closeModal(e) {
    if (!e || e.target === document.getElementById('bet-modal')) {
        document.getElementById('bet-modal').classList.remove('show');
    }
}

function startSettlementTimers() {
    settlementTimers.forEach(clearInterval);
    settlementTimers = [];
    allBets.filter(b => b.status === 'active').forEach(bet => {
        const el = document.getElementById(`timer-${bet.id}`);
        if (!el) return;
        const update = () => {
            const ko = bet._kickoff ? new Date(bet._kickoff) : null;
            if (!ko) { el.textContent = 'TBD'; return; }
            const settleBy = new Date(ko.getTime() + 115 * 60000);
            const diff = settleBy - new Date();
            if (diff <= 0) { el.innerHTML = '<span style="color:var(--success);">Settling...</span>'; }
            else { const h = Math.floor(diff / 3600000), m = Math.floor((diff % 3600000) / 60000); el.textContent = h > 0 ? `${h}h ${m}m` : `${m}m`; }
        };
        update();
        settlementTimers.push(setInterval(update, 60000));
    });
}

// Simple cashout (can be enhanced later)
async function cashoutBet(betId, partialPct = 100) {
    const bet = allBets.find(b => b.id === betId);
    if (!bet || bet.status !== 'active') { showNotification('❌ Cannot cash out', 'error'); return; }
    if (settlementManager?.settledBetIds.has(betId)) return;
    
    const stake = parseFloat(bet.amount || 0);
    const odds = parseFloat(bet.odds || 2);
    const elapsed = bet._elapsed || 45;
    const remainingMin = Math.max(1, 90 - elapsed);
    const potentialReturn = stake * odds;
    let cashoutVal = potentialReturn * 0.45 * Math.pow(remainingMin / 90, 0.7) * 0.95;
    cashoutVal = parseFloat(Math.max(stake * 0.05, Math.min(potentialReturn * 0.95, cashoutVal)).toFixed(2));
    const profit = parseFloat((cashoutVal - stake).toFixed(2));
    
    if (!confirm(`Cash Out?\n\nReceived: $${cashoutVal.toFixed(2)}\n${profit >= 0 ? 'Profit' : 'Loss'}: $${Math.abs(profit).toFixed(2)}`)) return;
    
    try {
        const { error, data } = await supabaseClient.from('bets').update({
            status: 'cashed-out', cashout_amount: cashoutVal, cashed_out_at: new Date().toISOString(),
            settlement_reason: 'Cashed out', updated_at: new Date().toISOString()
        }).eq('id', betId).eq('status', 'active').select('id');
        
        if (error || !data || data.length === 0) { showNotification('❌ Cashout failed', 'error'); return; }
        
        settlementManager.settledBetIds.add(betId);
        settlementManager.saveToStorage('xl_settled_ids', settlementManager.settledBetIds);
        await settlementManager.executePayout(bet.user_id, bet.id, cashoutVal, profit, { type: 'cashout' });
        
        bet.status = 'cashed-out';
        bet.cashout_amount = cashoutVal;
        showNotification(`✅ Cashed out: $${cashoutVal.toFixed(2)}`, 'success');
        await loadBalance(); updateStats(); updateCounts(); filterBets(currentFilter);
    } catch (e) { showNotification(`Error: ${e.message}`, 'error'); }
}
