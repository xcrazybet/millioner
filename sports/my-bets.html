<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Bets - X Lodon | رهاناتي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0f1a; color: white; font-family: 'Segoe UI', 'Tajawal', sans-serif; min-height: 100vh; }
        .header { background: #111827; padding: 12px 15px; border-bottom: 2px solid #00ff9d; position: sticky; top: 0; z-index: 100; }
        .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .back-btn { color: #00ff9d; text-decoration: none; font-size: 20px; }
        .lang-toggle { background: #1a2332; border: 1px solid #00ff9d; color: #00ff9d; padding: 5px 12px; border-radius: 20px; font-size: 14px; cursor: pointer; }
        .tabs { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 3px; }
        .tab { padding: 8px 12px; background: #1a2332; border-radius: 20px; color: white; text-decoration: none; font-size: 12px; }
        .tab.active { background: #00ff9d; color: black; }
        .container { max-width: 1200px; margin: 0 auto; padding: 15px; }
        
        /* Settlement Panel */
        .settlement-panel { background: linear-gradient(135deg, #1a2332, #111827); border-radius: 16px; padding: 15px; margin-bottom: 20px; border: 1px solid #00ff9d33; }
        .settlement-title { color: #00ff9d; font-weight: 600; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        .settlement-stats { display: flex; justify-content: space-around; text-align: center; }
        .stat-item { flex: 1; }
        .stat-label { color: #a0a8c9; font-size: 11px; }
        .stat-value { font-size: 20px; font-weight: bold; }
        .stat-value.green { color: #4caf50; }
        .stat-value.red { color: #ff5252; }
        .stat-value.yellow { color: #ffc107; }
        .settlement-actions { display: flex; gap: 10px; margin-top: 12px; }
        .action-btn { flex: 1; padding: 10px; background: #1a2332; border: 1px solid #00ff9d; border-radius: 8px; color: #00ff9d; font-size: 13px; font-weight: 600; cursor: pointer; }
        .action-btn:hover { background: #00ff9d; color: black; }
        .progress-bar { background: #1a2332; height: 4px; border-radius: 4px; margin-top: 10px; overflow: hidden; }
        .progress-fill { background: #00ff9d; height: 100%; width: 0%; transition: width 1s linear; }
        
        /* Stats Cards */
        .stats-cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
        .stat-card { background: #111827; padding: 15px; border-radius: 12px; text-align: center; border: 1px solid #ffffff11; }
        .stat-card .label { color: #a0a8c9; font-size: 12px; margin-bottom: 5px; }
        .stat-card .value { font-size: 24px; font-weight: bold; color: #00ff9d; }
        .stat-card .sub { font-size: 11px; color: #a0a8c9; margin-top: 3px; }
        
        /* Filter Bar */
        .filter-bar { display: flex; gap: 5px; margin-bottom: 15px; flex-wrap: wrap; }
        .filter-btn { padding: 8px 14px; background: #1a2332; border: none; border-radius: 20px; color: #a0a8c9; font-size: 12px; font-weight: 600; cursor: pointer; }
        .filter-btn.active { background: #00ff9d; color: black; }
        .filter-btn .count { background: #00000033; padding: 2px 6px; border-radius: 10px; margin-left: 5px; }
        
        /* Bet Cards */
        .bets-list { display: flex; flex-direction: column; gap: 12px; }
        .bet-card { background: #111827; border-radius: 16px; padding: 16px; border-left: 4px solid #ffc107; transition: all 0.2s; cursor: pointer; }
        .bet-card.single { border-left-color: #00ff9d; }
        .bet-card.accumulator { border-left-color: #ff9800; }
        .bet-card.won { border-left-color: #4caf50; background: linear-gradient(135deg, #111827, #0a1a0f); }
        .bet-card.lost { border-left-color: #ff5252; background: linear-gradient(135deg, #111827, #1a0a0a); }
        .bet-card.active { border-left-color: #ffc107; }
        .bet-card.cashed_out { border-left-color: #9c27b0; }
        .bet-card.cancelled { border-left-color: #a0a8c9; opacity: 0.7; }
        
        .bet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .bet-type { display: flex; align-items: center; gap: 8px; }
        .bet-type-badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
        .bet-type-badge.single { background: #00ff9d22; color: #00ff9d; }
        .bet-type-badge.accumulator { background: #ff980022; color: #ff9800; }
        .bet-status { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .bet-status.active { background: #ffc107; color: black; }
        .bet-status.won { background: #4caf50; color: white; }
        .bet-status.lost { background: #ff5252; color: white; }
        .bet-status.cashed_out { background: #9c27b0; color: white; }
        .bet-status.cancelled { background: #a0a8c9; color: white; }
        .bet-status.pending { background: #ff9800; color: black; }
        
        .bet-matches { margin-bottom: 12px; }
        .match-item { padding: 5px 0; }
        .match-teams { display: flex; justify-content: space-between; align-items: center; }
        .match-name { font-weight: 500; font-size: 14px; }
        .match-pick { color: #00ff9d; font-size: 13px; }
        .match-odds { color: #ff9800; font-size: 13px; }
        
        .bet-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; padding-top: 12px; border-top: 1px solid #ffffff11; }
        .bet-amount { display: flex; flex-direction: column; }
        .amount-label { color: #a0a8c9; font-size: 11px; }
        .amount-value { font-weight: 600; font-size: 16px; }
        .bet-payout { text-align: right; }
        .payout-label { color: #a0a8c9; font-size: 11px; }
        .payout-value { font-weight: 700; font-size: 18px; }
        .payout-value.won { color: #4caf50; }
        .payout-value.lost { color: #ff5252; }
        .payout-value.pending { color: #ffc107; }
        
        .bet-timestamps { margin-top: 10px; font-size: 11px; color: #a0a8c9; }
        .timestamp-row { display: flex; align-items: center; gap: 5px; margin-top: 3px; }
        .timestamp-row i { width: 14px; }
        .settlement-timer { color: #ff9800; font-weight: 600; }
        
        .action-buttons { display: flex; gap: 8px; margin-top: 12px; }
        .cancel-btn, .cashout-btn { padding: 8px 16px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .cancel-btn { background: #ff525222; border: 1px solid #ff5252; color: #ff5252; }
        .cashout-btn { background: #ff980022; border: 1px solid #ff9800; color: #ff9800; }
        
        .empty-state { text-align: center; padding: 60px 20px; color: #a0a8c9; }
        .empty-state i { font-size: 56px; opacity: 0.2; margin-bottom: 20px; }
        
        /* Modal Pop-out */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.9); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 15px; }
        .modal-overlay.show { display: flex; }
        .modal-content { background: #111827; border-radius: 20px; padding: 20px; max-width: 500px; width: 100%; max-height: 80vh; overflow-y: auto; border: 2px solid #00ff9d; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-title { color: #00ff9d; font-size: 18px; font-weight: 600; }
        .modal-close { background: none; border: none; color: #a0a8c9; font-size: 24px; cursor: pointer; }
        .modal-section { margin-bottom: 20px; }
        .modal-section h4 { color: #00ff9d; font-size: 14px; margin-bottom: 10px; }
        .modal-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #ffffff11; }
        .modal-item .label { color: #a0a8c9; }
        .modal-item .value { font-weight: 600; }
        .modal-item .value.won { color: #4caf50; }
        .modal-item .value.lost { color: #ff5252; }
        
        .arabic { font-family: 'Tajawal', sans-serif; }
    </style>
</head>

    <script src="../js/betting-engine.js"></script>

    <script>
        function toggleLanguage() {
            var isEn = document.querySelector('.en').style.display !== 'none';
            document.querySelectorAll('.en').forEach(el => el.style.display = isEn ? 'none' : '');
            document.querySelectorAll('.ar').forEach(el => el.style.display = isEn ? '' : 'none');
            document.documentElement.dir = isEn ? 'rtl' : 'ltr';
            localStorage.setItem('lang', isEn ? 'ar' : 'en');
        }
        if (localStorage.getItem('lang') === 'ar') { toggleLanguage(); }
        
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), db = firebase.firestore();
        
        let allBets = [], currentFilter = 'all', matchCache = {}, settlementTimer = null, secondsUntilCheck = 30;
        
        auth.onAuthStateChanged(u => { if (!u) location.href = '../login.html'; else loadBets(); });
        
        async function loadBets() {
            db.collection('bets').where('userId', '==', auth.currentUser.uid).orderBy('placedAt', 'desc').onSnapshot(async snap => {
                allBets = []; snap.forEach(d => allBets.push({ id: d.id, ...d.data() }));
                
                // Pre-load match data
                for (const bet of allBets) {
                    if (bet.fixtureId && !matchCache[bet.fixtureId]) {
                        const m = await db.collection('sports_matches').doc(String(bet.fixtureId)).get();
                        if (m.exists) matchCache[bet.fixtureId] = m.data();
                    }
                }
                
                updateStats();
                updateFilterCounts();
                filterBets(currentFilter);
                startSettlementTimer();
            });
        }
        
        function updateStats() {
            const total = allBets.length;
            const single = allBets.filter(b => !b.selections).length;
            const acc = allBets.filter(b => b.selections).length;
            const won = allBets.filter(b => b.status === 'won').length;
            const pending = allBets.filter(b => b.status === 'active' && matchCache[b.fixtureId]?.status === 'finished').length;
            
            document.getElementById('total-bets').textContent = total;
            document.getElementById('single-count').textContent = single;
            document.getElementById('acc-count').textContent = acc;
            document.getElementById('win-rate').textContent = total ? ((won/total)*100).toFixed(1) + '%' : '0%';
            document.getElementById('pending-count').textContent = pending;
            
            let pl = 0;
            allBets.forEach(b => {
                if (b.status === 'won') pl += (b.payout || b.potentialWin) - b.amount;
                else if (b.status === 'lost') pl -= b.amount;
            });
            const plEl = document.getElementById('total-pl');
            plEl.textContent = (pl >= 0 ? '+' : '') + '$' + pl.toFixed(2);
            plEl.style.color = pl >= 0 ? '#4caf50' : '#ff5252';
        }
        
        function updateFilterCounts() {
            document.getElementById('filter-all').textContent = allBets.length;
            document.getElementById('filter-active').textContent = allBets.filter(b => b.status === 'active').length;
            document.getElementById('filter-won').textContent = allBets.filter(b => b.status === 'won').length;
            document.getElementById('filter-lost').textContent = allBets.filter(b => b.status === 'lost').length;
        }
        
        function filterBets(filter) {
            currentFilter = filter;
            let filtered = allBets;
            if (filter === 'active') filtered = allBets.filter(b => b.status === 'active');
            else if (filter === 'won') filtered = allBets.filter(b => b.status === 'won');
            else if (filter === 'lost') filtered = allBets.filter(b => b.status === 'lost');
            displayBets(filtered);
        }
        
        function displayBets(bets) {
            const container = document.getElementById('bets-container');
            if (!bets.length) {
                container.innerHTML = '<div class="empty-state"><i class="fas fa-ticket-alt"></i><p>No bets found</p></div>';
                return;
            }
            container.innerHTML = '<div class="bets-list"></div>';
            const list = container.querySelector('.bets-list');
            bets.forEach(b => list.appendChild(createCard(b)));
        }
        
        function createCard(bet) {
            const card = document.createElement('div');
            const isAcc = bet.betCategory === 'accumulator' || (bet.selections && bet.selections.length > 0);
            card.className = `bet-card ${isAcc ? 'accumulator' : 'single'} ${bet.status}`;
            card.onclick = () => showBetDetails(bet);
            
            const placed = bet.placedAt?.toDate() || new Date();
            const settled = bet.settledAt?.toDate();
            const match = matchCache[bet.fixtureId];
            
            let statusText = bet.status === 'active' ? 'Active' : 
                            bet.status === 'won' ? 'Won' : 
                            bet.status === 'lost' ? 'Lost' : 
                            bet.status === 'cashed_out' ? 'Cashed Out' : 'Cancelled';
            
            if (bet.status === 'active' && match?.status === 'finished') {
                statusText = 'Pending';
                card.classList.add('pending');
            }
            
            let matchDisplay = '';
            if (isAcc) {
                matchDisplay = `<div class="match-item"><div class="match-teams"><span class="match-name">${bet.selections?.length || 0} selections</span></div></div>`;
            } else {
                const type = bet.betType === 'home' ? 'Home' : bet.betType === 'draw' ? 'Draw' : 'Away';
                matchDisplay = `<div class="match-item"><div class="match-teams"><span class="match-name">${bet.matchName || 'Match'}</span><span class="match-odds">${bet.odds?.toFixed(2) || '2.00'}</span></div>
                    <div class="match-teams"><span class="match-pick">${type}</span></div></div>`;
            }
            
            let payoutDisplay = '';
            if (bet.status === 'won') payoutDisplay = '+' + (bet.payout || bet.potentialWin).toFixed(2);
            else if (bet.status === 'lost') payoutDisplay = '-' + (bet.amount || 0).toFixed(2);
            else if (bet.status === 'cashed_out') payoutDisplay = (bet.cashoutAmount || 0).toFixed(2);
            else payoutDisplay = (bet.potentialWin || 0).toFixed(2);
            
            let timerHtml = '';
            if (bet.status === 'active' && match?.status === 'finished') {
                timerHtml = `<div class="timestamp-row"><i class="fas fa-hourglass-half"></i> <span class="settlement-timer">Settling in ${secondsUntilCheck}s...</span></div>`;
            }
            
            let actionHtml = '';
            if (bet.status === 'active') {
                actionHtml = `<div class="action-buttons" onclick="event.stopPropagation()">
                    <button class="cancel-btn" onclick="cancelBet('${bet.id}')"><i class="fas fa-times"></i> Cancel</button>
                    ${bet.canCashout ? `<button class="cashout-btn" onclick="cashoutBet('${bet.id}')"><i class="fas fa-hand-holding-usd"></i> Cash Out</button>` : ''}
                </div>`;
            }
            
            card.innerHTML = `
                <div class="bet-header">
                    <div class="bet-type">
                        <span class="bet-type-badge ${isAcc ? 'accumulator' : 'single'}">
                            <i class="fas ${isAcc ? 'fa-layer-group' : 'fa-ticket-alt'}"></i> ${isAcc ? 'Acc' : 'Single'}
                        </span>
                    </div>
                    <span class="bet-status ${bet.status}">${statusText}</span>
                </div>
                <div class="bet-matches">${matchDisplay}</div>
                <div class="bet-footer">
                    <div class="bet-amount"><span class="amount-label">Stake</span><span class="amount-value">$${(bet.amount||0).toFixed(2)}</span></div>
                    <div class="bet-payout"><span class="payout-label">${bet.status==='active'?'Potential':'Payout'}</span><span class="payout-value ${bet.status}">$${payoutDisplay}</span></div>
                </div>
                <div class="bet-timestamps">
                    <div class="timestamp-row"><i class="far fa-calendar-plus"></i> ${formatTime(placed)}</div>
                    ${settled ? `<div class="timestamp-row"><i class="far fa-calendar-check"></i> Settled: ${formatTime(settled)}</div>` : ''}
                    ${timerHtml}
                </div>
                ${actionHtml}
            `;
            return card;
        }
        
        function formatTime(date) {
            const now = new Date();
            const isToday = date.toDateString() === now.toDateString();
            const isYesterday = new Date(now.setDate(now.getDate()-1)).toDateString() === date.toDateString();
            const timeStr = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            if (isToday) return `Today ${timeStr}`;
            if (isYesterday) return `Yesterday ${timeStr}`;
            return date.toLocaleDateString() + ' ' + timeStr;
        }
        
        function showBetDetails(bet) {
            const modal = document.getElementById('bet-modal');
            const body = document.getElementById('modal-body');
            const isAcc = bet.betCategory === 'accumulator' || (bet.selections && bet.selections.length > 0);
            const match = matchCache[bet.fixtureId];
            const placed = bet.placedAt?.toDate() || new Date();
            const settled = bet.settledAt?.toDate();
            
            let statusText = bet.status === 'active' ? 'Active' : 
                            bet.status === 'won' ? 'Won' : 
                            bet.status === 'lost' ? 'Lost' : 
                            bet.status === 'cashed_out' ? 'Cashed Out' : 'Cancelled';
            
            let matchStatus = match ? match.status : 'unknown';
            let matchScore = match ? `${match.score?.home || 0} - ${match.score?.away || 0}` : '-';
            
            let selectionsHtml = '';
            if (isAcc && bet.selections) {
                selectionsHtml = bet.selections.map(s => `
                    <div class="modal-item">
                        <span class="label">${s.matchName}</span>
                        <span class="value">${s.betTypeName || s.betType} @ ${s.odds?.toFixed(2)}</span>
                    </div>
                `).join('');
            }
            
            let payoutDisplay = '';
            if (bet.status === 'won') payoutDisplay = '+' + (bet.payout || bet.potentialWin).toFixed(2);
            else if (bet.status === 'lost') payoutDisplay = '-' + (bet.amount || 0).toFixed(2);
            else if (bet.status === 'cashed_out') payoutDisplay = (bet.cashoutAmount || 0).toFixed(2);
            else payoutDisplay = (bet.potentialWin || 0).toFixed(2);
            
            body.innerHTML = `
                <div class="modal-section">
                    <h4><span class="en">Bet Information</span></h4>
                    <div class="modal-item"><span class="label">Type</span><span class="value">${isAcc ? 'Accumulator (' + (bet.selections?.length || 0) + ')' : 'Single'}</span></div>
                    <div class="modal-item"><span class="label">Status</span><span class="value ${bet.status}">${statusText}</span></div>
                    <div class="modal-item"><span class="label">Placed</span><span class="value">${placed.toLocaleString()}</span></div>
                    ${settled ? `<div class="modal-item"><span class="label">Settled</span><span class="value">${settled.toLocaleString()}</span></div>` : ''}
                </div>
                ${!isAcc ? `
                <div class="modal-section">
                    <h4><span class="en">Match Information</span></h4>
                    <div class="modal-item"><span class="label">Match</span><span class="value">${bet.matchName || 'Match'}</span></div>
                    <div class="modal-item"><span class="label">Status</span><span class="value">${matchStatus}</span></div>
                    <div class="modal-item"><span class="label">Score</span><span class="value">${matchScore}</span></div>
                    <div class="modal-item"><span class="label">Your Pick</span><span class="value">${bet.betType === 'home' ? 'Home' : bet.betType === 'draw' ? 'Draw' : 'Away'}</span></div>
                    <div class="modal-item"><span class="label">Odds</span><span class="value">${bet.odds?.toFixed(2) || '2.00'}</span></div>
                </div>
                ` : `
                <div class="modal-section">
                    <h4><span class="en">Selections</span></h4>
                    ${selectionsHtml}
                    <div class="modal-item"><span class="label">Total Odds</span><span class="value" style="color:#ff9800;">${bet.totalOdds?.toFixed(2) || '1.00'}</span></div>
                </div>
                `}
                <div class="modal-section">
                    <h4><span class="en">Financial</span></h4>
                    <div class="modal-item"><span class="label">Stake</span><span class="value">$${(bet.amount||0).toFixed(2)}</span></div>
                    <div class="modal-item"><span class="label">${bet.status==='active'?'Potential':'Payout'}</span><span class="value ${bet.status}">$${payoutDisplay}</span></div>
                    ${bet.cancelFee ? `<div class="modal-item"><span class="label">Cancel Fee</span><span class="value">$${bet.cancelFee.toFixed(2)}</span></div>` : ''}
                    ${bet.cashoutFee ? `<div class="modal-item"><span class="label">Cashout Fee</span><span class="value">$${bet.cashoutFee.toFixed(2)}</span></div>` : ''}
                </div>
            `;
            
            document.getElementById('modal-title').textContent = isAcc ? 'Accumulator Bet Details' : 'Single Bet Details';
            modal.classList.add('show');
        }
        
        function closeModal(event) {
            if (!event || event.target === document.getElementById('bet-modal')) {
                document.getElementById('bet-modal').classList.remove('show');
            }
        }
        
        function startSettlementTimer() {
            if (settlementTimer) clearInterval(settlementTimer);
            settlementTimer = setInterval(() => {
                secondsUntilCheck--;
                if (secondsUntilCheck <= 0) {
                    secondsUntilCheck = 30;
                    checkSettlements();
                }
                document.getElementById('next-check').textContent = secondsUntilCheck + 's';
                document.getElementById('settlement-progress').style.width = ((30 - secondsUntilCheck) / 30 * 100) + '%';
                
                document.querySelectorAll('.settlement-timer').forEach(el => {
                    el.textContent = `Settling in ${secondsUntilCheck}s...`;
                });
            }, 1000);
        }
        
        async function checkSettlements() {
            if (typeof settleNow === 'function') {
                await settleNow();
            }
            // Refresh match cache
            for (const bet of allBets) {
                if (bet.fixtureId) {
                    const m = await db.collection('sports_matches').doc(String(bet.fixtureId)).get();
                    if (m.exists) matchCache[bet.fixtureId] = m.data();
                }
            }
            secondsUntilCheck = 30;
        }
        
        async function forceSettleAll() {
            if (typeof settleAllFinishedMatches === 'function') {
                const settled = await settleAllFinishedMatches();
                alert(`Settled ${settled} bets`);
                secondsUntilCheck = 30;
            } else {
                alert('Settlement function not available');
            }
        }
        
        window.cancelBet = async id => {
            if (!confirm('Cancel this bet? Fee applies.')) return;
            try { const r = await cancelBetWithFee(id); alert(r.success ? `Refunded: $${r.refund.toFixed(2)}` : r.error); }
            catch(e) { alert('Error cancelling bet'); }
        };
        window.cashoutBet = async id => {
            if (!confirm('Cash out this bet?')) return;
            try { const r = await cashoutBet(id); alert(r.success ? `Cashed out: $${r.amount.toFixed(2)}` : r.error); }
            catch(e) { alert('Error cashing out'); }
        };
        window.checkSettlements = checkSettlements;
        window.forceSettleAll = forceSettleAll;
        window.closeModal = closeModal;
        
        document.querySelectorAll('.filter-btn').forEach(b => b.addEventListener('click', function() {
            document.querySelectorAll('.filter-btn').forEach(x => x.classList.remove('active'));
            this.classList.add('active');
            filterBets(this.dataset.filter);
        }));
        
        window.addEventListener('beforeunload', () => { if (settlementTimer) clearInterval(settlementTimer); });
    </script>
</body>
</html>
