    <style>

        body { background: #0a0f1a; color: white; font-family: 'Segoe UI', 'Tajawal', sans-serif; min-height: 100vh; }
        
        .header { background: #111827; padding: 12px 15px; border-bottom: 2px solid #00ff9d; position: sticky; top: 0; z-index: 100; }
        .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; flex-wrap: wrap; gap: 10px; }

        .back-btn { color: #00ff9d; text-decoration: none; font-size: 20px; }
        .lang-toggle { background: #1a2332; border: 1px solid #00ff9d; color: #00ff9d; padding: 5px 12px; border-radius: 20px; cursor: pointer; }
        .tabs { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 3px; }

        .tab.active { background: #00ff9d; color: black; }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 15px; }

        .balance-label { font-size: 14px; color: #a0a8c9; }
        .balance-amount { font-size: 28px; font-weight: bold; color: #00ff9d; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 20px; }
        .stat-box { background: #111827; padding: 15px 10px; border-radius: 12px; text-align: center; border: 1px solid #ffffff11; transition: all 0.2s; }
        .stat-box:hover { transform: translateY(-2px); border-color: #00ff9d33; }
        .stat-box .val { font-size: 24px; font-weight: bold; }
        .stat-box .val.up { color: #4caf50; }
        .stat-box .val.down { color: #ff5252; }
        .stat-box .lbl { font-size: 11px; color: #a0a8c9; margin-top: 5px; }
        .stat-box .sub { font-size: 10px; color: #666; margin-top: 3px; }
        
        .filter-row { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .filter-chip { padding: 8px 16px; background: #1a2332; border: none; border-radius: 25px; color: #a0a8c9; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; }

        .bet-card { background: #111827; border-radius: 16px; padding: 16px; margin-bottom: 12px; border-left: 5px solid #ffc107; cursor: pointer; transition: all 0.2s; animation: fadeIn 0.3s ease; }
        .bet-card:hover { transform: translateX(3px); background: #1a2332; }
        .bet-card.won { border-left-color: #4caf50; background: linear-gradient(135deg, #111827, #0a1a0f); }
        .bet-card.lost { border-left-color: #ff5252; background: linear-gradient(135deg, #111827, #1a0a0a); }
        .bet-card.active { border-left-color: #ffc107; }
        .bet-card.cancelled { border-left-color: #9c27b0; opacity: 0.7; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .bet-type-tag { padding: 4px 12px; border-radius: 20px; font-size: 10px; font-weight: 600; }

        .bet-type-tag.accumulator { background: #ff980022; color: #ff9800; }
        .bet-ticket-num { font-size: 10px; color: #a0a8c9; font-family: monospace; background: #00000033; padding: 2px 6px; border-radius: 8px; }
        
        .bet-status-icon { font-size: 20px; }
        .bet-status-icon.won { color: #4caf50; }
        .bet-status-icon.lost { color: #ff5252; }
        .bet-status-icon.active { color: #ffc107; animation: pulse 1s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }

        .bet-detail { text-align: center; }
        .bet-detail .lbl { color: #a0a8c9; font-size: 10px; }

        .countdown-timer.urgent { color: #ff9800; animation: pulse 1s infinite; }

        .bet-result-row.won { border-left: 3px solid #4caf50; background: #1a2332; }

        .cancel-btn:hover { background: #ff5252; color: white; }

        .cashout-btn:hover { background: #ff9800; color: black; }
        
        .modal-overlay { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.95); z-index:1000; display:none; align-items:center; justify-content:center; padding:15px; }

        .win-rate-fill { height: 100%; background: #4caf50; border-radius: 2px; transition: width 0.3s; }
        
        @media (max-width: 600px) {
            .stats-grid { grid-template-columns: repeat(3, 1fr); }
            .bet-details-grid { grid-template-columns: repeat(2, 1fr); }
        }

    <script>
        // ============================================
        // MY BETS PAGE - FULLY ENHANCED

        // Supabase Configuration
        const SUPABASE_URL = 'https://jnazybaeajyynpyoszmy.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpuYXp5YmFlYWp5eW5weW9zem15Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyNzgwMDMsImV4cCI6MjA5Mjg1NDAwM30.P_8V-_s6DQDiYekZX1yaNup48WBRaLhb3ILAkvzTDTY';
        
        let supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        
        const db = firebase.firestore();
        const auth = firebase.auth();
        
        let allBets = [];
        let currentFilter = 'all';
        let refreshInterval = null;
        let countdownIntervals = [];
        
        // ===== HELPER FUNCTIONS =====
        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        function toggleLanguage() {
            const isArabic = document.body.classList.toggle('arabic');
            localStorage.setItem('lang', isArabic ? 'ar' : 'en');
            document.documentElement.dir = isArabic ? 'rtl' : 'ltr';
            document.querySelectorAll('.en').forEach(el => el.style.display = isArabic ? 'none' : '');
            document.querySelectorAll('.ar').forEach(el => el.style.display = isArabic ? '' : 'none');
        }
        
        if (localStorage.getItem('lang') === 'ar') toggleLanguage();
        
        // ===== LOAD BALANCE FROM FIREBASE =====
        async function loadBalance() {
            try {
                const user = auth.currentUser;
                if (!user) return 0;
                
                const doc = await db.collection('wallets').doc(user.uid).get();
                const balance = doc.exists ? (doc.data().balance || 0) : 1000;
                document.getElementById('balance-display').textContent = `$${balance.toFixed(2)}`;
                return balance;
            } catch(e) { 
                console.error('Balance load error:', e); 
                return 0;
            }
        }
        
        // ===== LOAD BETS FROM SUPABASE =====
        async function loadBets() {
            const user = auth.currentUser;
            if (!user) return;
            
            try {
                const { data, error } = await supabaseClient
                    .from('bets')
                    .select('*')
                    .eq('user_id', user.uid)
                    .order('placed_at', { ascending: false });
                
                if (error) throw error;
                
                allBets = data || [];
                
                // Enrich bets with match data
                for (let bet of allBets) {
                    if (bet.fixture_id && !bet.match_name) {
                        const { data: match } = await supabaseClient
                            .from('sports_matches')
                            .select('home_team, away_team, league_name, start_time, status, score')
                            .eq('fixture_id', bet.fixture_id)
                            .single();
                        
                        if (match) {
                            let homeTeam = match.home_team;
                            let awayTeam = match.away_team;
                            if (typeof homeTeam === 'string') homeTeam = JSON.parse(homeTeam);
                            if (typeof awayTeam === 'string') awayTeam = JSON.parse(awayTeam);
                            
                            bet.match_name = `${homeTeam?.name || 'Home'} vs ${awayTeam?.name || 'Away'}`;
                            bet.home_team = homeTeam;
                            bet.away_team = awayTeam;
                            bet.league_name = match.league_name;
                            bet.kickoff_time = match.start_time;
                            bet.match_status = match.status;
                            bet.current_score = match.score;
                        }
                    }
                }
                
                updateStats();
                updateCounts();
                filterBets(currentFilter);
                
                // Start countdowns for active bets
                startAllCountdowns();
                
            } catch(e) {
                console.error('Load bets error:', e);
                document.getElementById('bet-list-container').innerHTML = `<div class="empty-state">Error loading bets: ${e.message}</div>`;
            }
        }
        
        // ===== UPDATE STATISTICS =====
        function updateStats() {
            const total = allBets.length;
            const won = allBets.filter(b => b.status === 'won');
            const lost = allBets.filter(b => b.status === 'lost');
            const active = allBets.filter(b => b.status === 'active');
            const cancelled = allBets.filter(b => b.status === 'cancelled');
            
            let totalWonAmount = 0;
            let totalLostAmount = 0;
            let netProfit = 0;
            
            won.forEach(b => {
                const payout = parseFloat(b.payout || b.potential_win || 0);
                const stake = parseFloat(b.amount || 0);
                totalWonAmount += payout;
                netProfit += (payout - stake);
            });
            
            lost.forEach(b => {
                const stake = parseFloat(b.amount || 0);
                totalLostAmount += stake;
                netProfit -= stake;
            });
            
            const winRate = total > 0 ? ((won.length / total) * 100).toFixed(1) : 0;
            
            document.getElementById('total-bets').textContent = total;
            document.getElementById('total-won').textContent = won.length;
            document.getElementById('total-lost').textContent = lost.length;
            document.getElementById('total-active').textContent = active.length;
            document.getElementById('won-amount').textContent = `$${totalWonAmount.toFixed(2)}`;
            document.getElementById('lost-amount').textContent = `$${totalLostAmount.toFixed(2)}`;
            document.getElementById('win-rate-display').textContent = `${winRate}%`;
            document.getElementById('win-rate-fill').style.width = `${winRate}%`;
            
            const plEl = document.getElementById('total-pl');
            plEl.textContent = (netProfit >= 0 ? '+' : '') + '$' + netProfit.toFixed(2);
            plEl.style.color = netProfit >= 0 ? '#4caf50' : '#ff5252';
        }
        
        function updateCounts() {
            document.getElementById('cnt-all').textContent = allBets.length;
            document.getElementById('cnt-active').textContent = allBets.filter(b => b.status === 'active').length;
            document.getElementById('cnt-won').textContent = allBets.filter(b => b.status === 'won').length;
            document.getElementById('cnt-lost').textContent = allBets.filter(b => b.status === 'lost').length;
            document.getElementById('cnt-cancelled').textContent = allBets.filter(b => b.status === 'cancelled').length;
        }
        
        // ===== COUNTDOWN TIMER =====
        function startAllCountdowns() {
            countdownIntervals.forEach(clearInterval);
            countdownIntervals = [];
            
            document.querySelectorAll('.countdown-timer[data-fixture]').forEach(el => {
                const fixtureId = el.dataset.fixture;
                const kickoffTime = el.dataset.kickoff;
                if (kickoffTime) {
                    updateCountdown(el, kickoffTime);
                    const interval = setInterval(() => updateCountdown(el, kickoffTime), 1000);
                    countdownIntervals.push(interval);
                }
            });
        }
        
        function updateCountdown(element, kickoffTime) {
            const now = new Date();
            const kickoff = new Date(kickoffTime);
            const diff = kickoff - now;
            
            if (diff <= 0) {
                element.innerHTML = '<i class="fas fa-play"></i> Started';
                element.classList.remove('urgent');
                return;
            }
            
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (86400000)) / 3600000);
            const minutes = Math.floor((diff % 3600000) / 60000);
            const seconds = Math.floor((diff % 60000) / 1000);
            
            let display = '';
            if (days > 0) display = `${days}d ${hours}h`;
            else if (hours > 0) display = `${hours}h ${minutes}m`;
            else display = `${minutes}m ${seconds}s`;
            
            element.innerHTML = `<i class="fas fa-hourglass-half"></i> ${display}`;
            
            if (minutes < 5 && days === 0 && hours === 0) {
                element.classList.add('urgent');
            } else {
                element.classList.remove('urgent');
            }
        }
        
        // ===== CREATE BET CARD =====
        function createBetCard(bet) {
            const isAcc = bet.bet_category === 'accumulator' || (bet.selections && bet.selections.length > 0);
            let statusIcon = '';
            let statusClass = bet.status;
            
            if (bet.status === 'won') statusIcon = '🏆';
            else if (bet.status === 'lost') statusIcon = '❌';
            else if (bet.status === 'cancelled') statusIcon = '⛔';
            else if (bet.status === 'active') statusIcon = '⏳';
            
            const amount = parseFloat(bet.amount || 0);
            const payout = parseFloat(bet.payout || bet.potential_win || 0);
            const profit = bet.status === 'won' ? payout - amount : (bet.status === 'lost' ? -amount : 0);
            const placed = bet.placed_at ? new Date(bet.placed_at) : new Date();
            const settled = bet.settled_at ? new Date(bet.settled_at) : null;
            const betType = bet.bet_category || 'single';
            const ticketNumber = 'XL' + (bet.id.toString().slice(-8)).toUpperCase();
            
            let matchDisplay = bet.match_name || 'Match';
            let pickDisplay = bet.bet_name || bet.bet_type || '';
            let teamLogo = '';
            
            if (bet.home_team) {
                let homeTeam = bet.home_team;
                if (typeof homeTeam === 'string') homeTeam = JSON.parse(homeTeam);
                teamLogo = homeTeam?.logo || '';
            }
            
            let settlementTime = '';
            if (bet.status === 'active' && bet.kickoff_time) {
                const kickoff = new Date(bet.kickoff_time);
                const estimatedSettle = new Date(kickoff.getTime() + (2 * 60 * 60 * 1000));
                settlementTime = estimatedSettle.toLocaleDateString() + ' ' + estimatedSettle.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
            }
            
            let reasonText = '';
            if (bet.settlement_reason) {
                reasonText = `<div class="bet-result-row ${statusClass}"><i class="fas fa-info-circle"></i> ${escapeHtml(bet.settlement_reason)}</div>`;
            }
            
            return `
                <div class="bet-card ${statusClass}" onclick="showDetails('${bet.id}')">
                    <div class="bet-top">
                        <div>
                            <span class="bet-type-tag ${betType}">${betType.toUpperCase()}</span>
                            <span class="bet-ticket-num"> #${ticketNumber}</span>
                        </div>
                        <span class="bet-status-icon ${statusClass}">${statusIcon}</span>
                    </div>
                    <div class="bet-body">
                        <div class="bet-match-name">
                            ${teamLogo ? `<img class="team-logo-small" src="${teamLogo}" onerror="this.style.display='none'">` : ''}
                            ${escapeHtml(matchDisplay)}
                        </div>
                        <div class="bet-pick">${escapeHtml(pickDisplay)} <span class="bet-odds">@${parseFloat(bet.odds || 2).toFixed(2)}</span></div>
                    </div>
                    <div class="bet-details-grid">
                        <div class="bet-detail"><div class="lbl">Stake</div><div class="val">$${amount.toFixed(2)}</div></div>
                        <div class="bet-detail"><div class="lbl">${bet.status === 'active' ? 'Potential' : 'Payout'}</div><div class="val" style="color:${bet.status === 'won' ? '#4caf50' : (bet.status === 'lost' ? '#ff5252' : '#fff')}">$${payout.toFixed(2)}</div></div>
                        <div class="bet-detail"><div class="lbl">P/L</div><div class="val" style="color:${profit >= 0 ? '#4caf50' : '#ff5252'}">${profit >= 0 ? '+' : ''}$${Math.abs(profit).toFixed(2)}</div></div>
                        ${bet.status === 'active' && bet.kickoff_time ? `<div class="bet-detail"><div class="lbl">Time to Start</div><div class="val"><span class="countdown-timer" data-fixture="${bet.fixture_id}" data-kickoff="${bet.kickoff_time}"></span></div></div>` : ''}
                        ${settlementTime ? `<div class="bet-detail"><div class="lbl">Est. Settlement</div><div class="val">${settlementTime}</div></div>` : ''}
                    </div>
                    ${reasonText}
                    <div class="bet-timestamps">
                        <span><i class="far fa-calendar-alt"></i> Placed: ${placed.toLocaleString()}</span>
                        ${settled ? `<span><i class="fas fa-check-circle"></i> Settled: ${settled.toLocaleString()}</span>` : ''}
                    </div>
                    ${bet.status === 'active' ? `
                        <div class="bet-actions">
                            <button class="cancel-btn" onclick="event.stopPropagation();cancelBet('${bet.id}')"><i class="fas fa-ban"></i> Cancel Bet</button>
                            <button class="cashout-btn" onclick="event.stopPropagation();cashoutBet('${bet.id}')"><i class="fas fa-money-bill-wave"></i> Cash Out</button>
                        </div>
                    ` : ''}
                </div>
            `;
        }
        
        function filterBets(filter) {
            currentFilter = filter;
            let filtered = allBets;
            
            if (filter === 'active') filtered = allBets.filter(b => b.status === 'active');
            else if (filter === 'won') filtered = allBets.filter(b => b.status === 'won');
            else if (filter === 'lost') filtered = allBets.filter(b => b.status === 'lost');
            else if (filter === 'cancelled') filtered = allBets.filter(b => b.status === 'cancelled');
            
            const container = document.getElementById('bet-list-container');
            
            if (!filtered.length) {
                container.innerHTML = '<div class="empty-state"><i class="fas fa-ticket-alt" style="font-size:48px;opacity:0.3;"></i><p>No bets found</p></div>';
                return;
            }
            
            container.innerHTML = '<div class="bet-list">' + filtered.map(b => createBetCard(b)).join('') + '</div>';
            startAllCountdowns();
        }
        
        // ===== BET ACTIONS =====
        async function cancelBet(betId) {
            const bet = allBets.find(b => b.id === betId);
            if (!bet) return;
            
            if (bet.status !== 'active') {
                alert('This bet cannot be cancelled');
                return;
            }
            
            const feePercent = 5;
            const refundAmount = bet.amount * (1 - feePercent / 100);
            const fee = bet.amount - refundAmount;
            
            if (!confirm(`Cancel this bet? Refund: $${refundAmount.toFixed(2)} (Fee: $${fee.toFixed(2)} - ${feePercent}%)`)) return;
            
            try {
                // Update bet status
                await supabaseClient
                    .from('bets')
                    .update({ 
                        status: 'cancelled', 
                        cancellation_fee: fee,
                        refund_amount: refundAmount,
                        cancelled_at: new Date().toISOString()
                    })
                    .eq('id', betId);
                
                // Refund to wallet
                const user = auth.currentUser;
                const walletRef = db.collection('wallets').doc(user.uid);
                await walletRef.update({
                    balance: firebase.firestore.FieldValue.increment(refundAmount),
                    updated_at: new Date().toISOString()
                });
                
                alert(`Bet cancelled! Refund: $${refundAmount.toFixed(2)}`);
                await loadBets();
                await loadBalance();
                
            } catch(e) {
                console.error('Cancel error:', e);
                alert(`Cancellation failed: ${e.message}`);
            }
        }
        
        async function cashoutBet(betId) {
            const bet = allBets.find(b => b.id === betId);
            if (!bet || bet.status !== 'active') {
                alert('This bet is not available for cash out');
                return;
            }
            
            // Calculate cashout value (simplified - 70% of potential win)
            const cashoutValue = (bet.amount * bet.odds) * 0.7;
            const fee = (bet.amount * bet.odds) * 0.3;
            
            if (!confirm(`Cash out this bet? You receive: $${cashoutValue.toFixed(2)} (Fee: $${fee.toFixed(2)})`)) return;
            
            try {
                await supabaseClient
                    .from('bets')
                    .update({ 
                        status: 'cancelled', 
                        cashout_amount: cashoutValue,
                        cashout_fee: fee,
                        cashed_out_at: new Date().toISOString(),
                        settlement_reason: 'Cashew out by user'
                    })
                    .eq('id', betId);
                
                const user = auth.currentUser;
                const walletRef = db.collection('wallets').doc(user.uid);
                await walletRef.update({
                    balance: firebase.firestore.FieldValue.increment(cashoutValue),
                    updated_at: new Date().toISOString()
                });
                
                alert(`Cashew out successful! Received: $${cashoutValue.toFixed(2)}`);
                await loadBets();
                await loadBalance();
                
            } catch(e) {
                console.error('Cashout error:', e);
                alert(`Cashout failed: ${e.message}`);
            }
        }
        
        // ===== SHOW DETAILS MODAL =====
        function showDetails(betId) {
            const bet = allBets.find(b => b.id === betId);
            if (!bet) return;
            
            const modal = document.getElementById('bet-modal');
            const body = document.getElementById('modal-body');
            
            const amount = parseFloat(bet.amount || 0);
            const payout = parseFloat(bet.payout || bet.potential_win || 0);
            const profit = bet.status === 'won' ? payout - amount : (bet.status === 'lost' ? -amount : 0);
            const ticketNumber = 'XL' + (bet.id.toString().slice(-8)).toUpperCase();
            const placed = bet.placed_at ? new Date(bet.placed_at) : new Date();
            const settled = bet.settled_at ? new Date(bet.settled_at) : null;
            
            let homeTeam = bet.home_team;
            let awayTeam = bet.away_team;
            if (homeTeam && typeof homeTeam === 'string') homeTeam = JSON.parse(homeTeam);
            if (awayTeam && typeof awayTeam === 'string') awayTeam = JSON.parse(awayTeam);
            
            body.innerHTML = `
                <div class="modal-section">
                    <h4><i class="fas fa-ticket-alt"></i> Ticket Information</h4>
                    <div class="modal-row"><span class="lbl">Ticket Number</span><span><strong>${ticketNumber}</strong></span></div>
                    <div class="modal-row"><span class="lbl">Support Reference</span><span><small>Use this ticket number for support: ${ticketNumber}</small></span></div>
                </div>
                
                <div class="modal-section">
                    <h4><i class="fas fa-info-circle"></i> Bet Details</h4>
                    <div class="modal-row"><span class="lbl">Type</span><span>${bet.bet_category === 'accumulator' ? 'Accumulator' : 'Single'}</span></div>
                    <div class="modal-row"><span class="lbl">Status</span><span class="${bet.status}" style="color:${bet.status === 'won' ? '#4caf50' : (bet.status === 'lost' ? '#ff5252' : '#ffc107')}">${bet.status?.toUpperCase()}</span></div>
                    <div class="modal-row"><span class="lbl">Match</span><span>${escapeHtml(bet.match_name || 'N/A')}</span></div>
                    ${homeTeam && awayTeam ? `<div class="modal-row"><span class="lbl">Teams</span><span><img src="${homeTeam.logo}" style="width:20px;height:20px;vertical-align:middle;"> ${homeTeam.name} vs ${awayTeam.name} <img src="${awayTeam.logo}" style="width:20px;height:20px;vertical-align:middle;"></span></div>` : ''}
                    <div class="modal-row"><span class="lbl">Bet Type</span><span>${bet.bet_name || bet.bet_type}</span></div>
                    <div class="modal-row"><span class="lbl">Odds</span><span>${parseFloat(bet.odds || 2).toFixed(2)}</span></div>
                    <div class="modal-row"><span class="lbl">Placed Date/Time</span><span>${placed.toLocaleString()}</span></div>
                    ${settled ? `<div class="modal-row"><span class="lbl">Settled Date/Time</span><span>${settled.toLocaleString()}</span></div>` : ''}
                </div>
                
                <div class="modal-section">
                    <h4><i class="fas fa-chart-line"></i> Financial Summary</h4>
                    <div class="modal-row"><span class="lbl">Stake</span><span>$${amount.toFixed(2)}</span></div>
                    <div class="modal-row"><span class="lbl">Potential Win</span><span>$${parseFloat(bet.potential_win || 0).toFixed(2)}</span></div>
                    <div class="modal-row"><span class="lbl">Actual Payout</span><span class="${bet.status === 'won' ? 'value-won' : ''}">$${payout.toFixed(2)}</span></div>
                    <div class="modal-row"><span class="lbl">Profit/Loss</span><span style="color:${profit >= 0 ? '#4caf50' : '#ff5252'}">${profit >= 0 ? '+' : ''}$${profit.toFixed(2)}</span></div>
                    ${bet.cancellation_fee ? `<div class="modal-row"><span class="lbl">Cancel Fee</span><span>$${bet.cancellation_fee.toFixed(2)}</span></div>` : ''}
                    ${bet.refund_amount ? `<div class="modal-row"><span class="lbl">Refund Amount</span><span>$${bet.refund_amount.toFixed(2)}</span></div>` : ''}
                </div>
                
                ${bet.result || bet.settlement_reason ? `
                <div class="modal-section">
                    <h4><i class="fas fa-flag-checkered"></i> Result & Settlement</h4>
                    ${bet.result ? `<div class="modal-row"><span class="lbl">Match Result</span><span>${bet.result === 'home' ? 'Home Win' : (bet.result === 'away' ? 'Away Win' : 'Draw')}</span></div>` : ''}
                    ${bet.settlement_reason ? `<div class="modal-row"><span class="lbl">Settlement Reason</span><span>${escapeHtml(bet.settlement_reason)}</span></div>` : ''}
                    <div class="modal-row"><span class="lbl">Outcome</span><span style="color:${bet.status === 'won' ? '#4caf50' : '#ff5252'};font-weight:bold;">${bet.status === 'won' ? 'WINNER!' : (bet.status === 'lost' ? 'Lost' : bet.status)}</span></div>
                </div>
                ` : ''}
                
                <div class="modal-section">
                    <h4><i class="fas fa-headset"></i> Need Help?</h4>
                    <div class="modal-row"><span class="lbl">Support Ticket</span><span>Contact X Lodon support with your ticket number: <strong>${ticketNumber}</strong></span></div>
                    <div class="modal-row"><span class="lbl">Email</span><span>support@xlodon.co.uk</span></div>
                </div>
            `;
            
            modal.classList.add('show');
        }
        
        function closeModal(event) {
            if (!event || event.target === document.getElementById('bet-modal')) {
                document.getElementById('bet-modal').classList.remove('show');
            }
        }
        
        function exportBetsToCSV() {
            if (!allBets.length) {
                alert('No bets to export');
                return;
            }
            
            const headers = ['Ticket Number', 'Date', 'Type', 'Match', 'Pick', 'Odds', 'Stake', 'Payout', 'P/L', 'Status', 'Result', 'Settlement Reason'];
            const rows = allBets.map(b => {
                const ticketNumber = 'XL' + (b.id.toString().slice(-8)).toUpperCase();
                const amount = parseFloat(b.amount || 0);
                const payout = parseFloat(b.payout || b.potential_win || 0);
                const profit = b.status === 'won' ? payout - amount : (b.status === 'lost' ? -amount : 0);
                
                return [
                    ticketNumber,
                    new Date(b.placed_at).toLocaleDateString(),
                    b.bet_category || 'single',
                    b.match_name || '',
                    b.bet_name || b.bet_type || '',
                    parseFloat(b.odds || 2).toFixed(2),
                    amount.toFixed(2),
                    payout.toFixed(2),
                    (profit >= 0 ? '+' : '') + profit.toFixed(2),
                    b.status || '',
                    b.result || '',
                    b.settlement_reason || ''
                ];
            });
            
            let csv = headers.join(',') + '\n' + rows.map(r => r.map(c => `"${c}"`).join(',')).join('\n');
            const blob = new Blob([csv], { type: 'text/csv' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `xlodon-bets-${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
        }
        
        function startAutoRefresh() {
            if (refreshInterval) clearInterval(refreshInterval);
            refreshInterval = setInterval(() => {
                loadBets();
                loadBalance();
            }, 30000);
        }
        
        // ===== INITIALIZATION =====
        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = '../login.html';
                return;
            }
            
            await loadBalance();
            await loadBets();
            startAutoRefresh();
        });
        
        // Filter chips
        document.querySelectorAll('.filter-chip').forEach(chip => {
            chip.addEventListener('click', function() {
                document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
                this.classList.add('active');
                filterBets(this.dataset.filter);
            });
        });
        
        // Cleanup intervals
        window.addEventListener('beforeunload', () => {
            if (refreshInterval) clearInterval(refreshInterval);
            countdownIntervals.forEach(clearInterval);
        });
        
        // Expose global functions
        window.toggleLanguage = toggleLanguage;
        window.closeModal = closeModal;
        window.cancelBet = cancelBet;
        window.cashoutBet = cashoutBet;
        window.showDetails = showDetails;
        window.exportBetsToCSV = exportBetsToCSV;
        
        console.log('✅ My Bets page fully loaded and enhanced');
    </script>
</body>
</html>
