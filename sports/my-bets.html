    if (settleInterval) { clearInterval(settleInterval); settleInterval = null; }

            await loadBalance();
        }, 60000);

}

// ============================================
// 🔒 BULLETPROOF PAYOUT WITH IDEMPOTENCY
// ============================================
async function executeSecurePayoutAPI(userId,betId,amount,transactionType,metaData={}){
    // Generate deterministic idempotency key
    const idempotencyKey=`${betId}_${transactionType}`;
    
    // Check if payout already processed in local session memory
    if(processedPayouts.has(idempotencyKey)){
        console.warn(`⛔ Payout already processed: ${idempotencyKey}`);
        return;
    }
    
    // Check Firestore for transaction record before processing
    try{
        const existingSnapshot=await db.collection('transactions')
            .where('idempotency_key','==',idempotencyKey)
            .limit(1)
            .get();
        
        if(!existingSnapshot.empty){
            console.warn(`⛔ Transaction already exists in Firestore: ${idempotencyKey}`);
            processedPayouts.add(idempotencyKey);
            saveSetToStorage('xl_payouts',processedPayouts);
            return;
        }
    }catch(e){
        console.warn('Firestore idempotency check failed, proceeding with caution:',e);
    }
    
    const walletRef=db.collection('wallets').doc(userId);
    
    try{
        await db.runTransaction(async(transaction)=>{
            const doc=await transaction.get(walletRef);
            const currentBalance=doc.exists?(doc.data().balance||0):0;
            const newBalance=Math.round((currentBalance+amount)*100)/100;
            
            transaction.update(walletRef,{
                balance:newBalance,
                updated_at:new Date().toISOString()
            });
            
            // Build descriptive ledger entry
            const stake=parseFloat(metaData.stake||0);
            const odds=parseFloat(metaData.odds||1);
            const profit=parseFloat(metaData.profit||0);
            const mName=metaData.match_name || 'Match';
            let desc='';
            
            if(transactionType==='cancel_refund'){
                desc=`Cancellation refund on ${mName}. Refund returned: $${amount.toFixed(2)}.`;
            }else if(transactionType==='partial_cashout'){
                desc=`Cash out executed on ${mName}. Stake value evaluated: $${amount.toFixed(2)}.`;
            }else if(transactionType==='duplicate_refund'){
                desc=`Duplicate wager refund on ${mName}. Refund returned: $${amount.toFixed(2)}.`;
            }else{
                desc=`Winnings: Stake $${stake.toFixed(2)} × Odds @${odds.toFixed(2)} = $${amount.toFixed(2)}. Profit: +$${profit.toFixed(2)}. Match: ${mName}.`;
            }
            
            const logRef=db.collection('transactions').doc();
            transaction.set(logRef,{
                user_id:userId,
                bet_id:betId,
                amount:amount,
                type:transactionType,
                balance_before:currentBalance,
                balance_after:newBalance,
                idempotency_key:idempotencyKey,
                timestamp:new Date().toISOString(),
                description:desc,
                profit_amount:profit
            });
        });
        
        processedPayouts.add(idempotencyKey);
        saveSetToStorage('xl_payouts',processedPayouts);
        console.log(`✅ Payout: $${amount.toFixed(2)} | Key: ${idempotencyKey}`);
        
    }catch(e){
        console.error(`❌ Payout failed for ${idempotencyKey}:`,e);
        throw e;
    }
}

function extractTeamDetails(teamInput, fallbackName) {
    const safeFallback = (fallbackName && fallbackName !== 'Home' && fallbackName !== 'Away') ? fallbackName : 'Team';
    if (!teamInput) return { name: safeFallback, logo: '' };
    if (typeof teamInput === 'object') {
        const parsedName = teamInput.name && teamInput.name !== 'Home' && teamInput.name !== 'Away' ? teamInput.name : safeFallback;
        return { name: parsedName, logo: teamInput.logo || '' };
    }
    if (typeof teamInput === 'string') {
        const trimmed = teamInput.trim();
        if (trimmed.startsWith('{')) {
            try {
                const parsedObj = JSON.parse(trimmed);
                const parsedName = parsedObj.name && parsedObj.name !== 'Home' && parsedObj.name !== 'Away' ? parsedObj.name : safeFallback;
                return { name: parsedName, logo: parsedObj.logo || '' };
            } catch(e) {}
        }
        if (trimmed !== '' && trimmed !== 'Home' && trimmed !== 'Away') return { name: trimmed, logo: '' };
    }
    return { name: safeFallback, logo: '' };
}

function isBetPlacedBeforeKickoff(bet, match) {
    if (!bet.placed_at || !match || !match.start_time) return true;
    const bp = new Date(bet.placed_at);
    const mk = new Date(match.start_time);
    return bp < mk;
}

function getMatchesMapForBet(bet) {
    const map = {};
    if (bet.selections) {
        bet.selections.forEach(s => {
            if (s._match) map[s.fixtureId || s.fixture_id] = s._match;
        });
    }
    return map;
}

// Win Probability calculations for live evaluations
function calculateWinProbability(bt, hg, ag, tg, elapsed) {
    const rm = Math.max(1, 90 - elapsed);
    switch(bt) {
        case 'home': return hg > ag ? 0.85 : (hg === ag ? 0.42 : 0.18);
        case 'draw': return hg === ag ? 0.45 : 0.15;
        case 'away': return ag > hg ? 0.85 : (ag === hg ? 0.42 : 0.18);
        case 'over25': return tg >= 3 ? 1 : (tg === 2 ? 0.55 : 0.15);
        case 'under25': return tg < 2 ? 1 : (tg === 2 ? 0.45 : 0);
        case 'btts_yes': return (hg > 0 && ag > 0) ? 1 : 0.35;
        case 'btts_no': return (hg === 0 || ag === 0) ? 0.65 : 0;
        default: return 0.50;
    }
}

// Cash Out Value Equations (Stake * Odds * winProb * timeFactor)
function calculateCashoutValue(bet, match, partialPct = 100) {
    if (!match) {
        const stake = parseFloat(bet.amount || 0) * (partialPct / 100);
        return { value: parseFloat((stake * 0.8).toFixed(2)), winProbability: 0.5, profit: parseFloat(((stake * 0.8) - stake).toFixed(2)), margin: 0.05, timeRemaining: 45 };
    }
    const stake = parseFloat(bet.amount || 0) * (partialPct / 100);
    const potentialReturn = stake * parseFloat(bet.odds || 2);
    const elapsed = match.elapsed || 0;
    const remainingMinutes = Math.max(1, 90 - elapsed);
    const winProb = calculateWinProbability(bet.bet_type, match.goals_home || 0, match.goals_away || 0, (match.goals_home || 0) + (match.goals_away || 0), elapsed);
    const timeFactor = Math.pow(remainingMinutes / 90, 0.7);
    let cashoutVal = potentialReturn * winProb * timeFactor;
    cashoutVal *= 0.95; // 5% risk configuration margin
    const floor = stake * 0.05;
    const ceiling = potentialReturn * 0.95;
    return {
        value: parseFloat(Math.max(floor, Math.min(ceiling, cashoutVal)).toFixed(2)),
        winProbability: winProb,
        profit: parseFloat((cashoutVal - stake).toFixed(2)),
        margin: 0.05,
        timeRemaining: remainingMinutes
    };
}

function calculateAccaCashout(bet, matches, partialPct = 100) {
    if (!bet.selections || !bet.selections.length) return null;
    
    let combinedWinProb = 1.0;
    let allLegsHaveData = true;
    let brokenLeg = false;
    let completedLegs = 0;
    
    for (const selection of bet.selections) {
        const match = matches[selection.fixtureId || selection.fixture_id];
        if (!match || !match.status) { allLegsHaveData = false; break; }
        
        const ms = (match.status || '').toLowerCase();
        const isFinished = ['finished', 'ft', 'aet', 'pen'].includes(ms);
        
        if (isFinished) {
            completedLegs++;
            const result = determineBetResult({ bet_type: selection.betType || selection.bet_type }, match);
            if (result && result.won) { combinedWinProb *= 1.0; }
            else { combinedWinProb *= 0.0; brokenLeg = true; }
        } else if (['live', '1h', '2h', 'ht'].includes(ms)) {
            const legProb = calculateWinProbability(selection.betType || selection.bet_type, match.goals_home || 0, match.goals_away || 0, (match.goals_home || 0) + (match.goals_away || 0), match.elapsed || 0);
            combinedWinProb *= legProb;
        } else {
            combinedWinProb *= (1 / parseFloat(selection.odds || 2));
        }
    }
    
    if (!allLegsHaveData) return null;
    if (brokenLeg) return { value: 0, winProbability: 0, legsWon: completedLegs, legsTotal: bet.selections.length, broken: true };
    
    const stake = parseFloat(bet.amount || 0) * (partialPct / 100);
    const potentialReturn = stake * parseFloat(bet.odds || 2);
    let cashoutValue = potentialReturn * combinedWinProb * 0.92; // 8% acca margin configuration
    cashoutValue = Math.max(cashoutValue, stake * 0.02);
    cashoutValue = Math.min(cashoutValue, potentialReturn * 0.95);
    
    return {
        value: parseFloat(cashoutValue.toFixed(2)),
        winProbability: combinedWinProb,
        legsWon: completedLegs,
        legsTotal: bet.selections.length,
        broken: false
    };
}

async function updateAutoCashoutThreshold(betId, value) {

    } catch (e) {
        showNotification('Error updating auto cashout: ' + e.message, 'error');
    }
}

// ============================================
// DUPLICATE DETECTION ENGINE
// ============================================
function createDuplicateKey(bet){
    if(bet.bet_type==='accumulator'&&bet.selections&&Array.isArray(bet.selections)){
        const selHash=bet.selections.map(s=>`${s.fixtureId||s.fixture_id}_${s.betType||s.bet_type}_${s.odds}`).sort().join('|');
        return `ACC_${bet.user_id}_${bet.amount}_${bet.odds}_${selHash}`;
    }
    return `SGL_${bet.user_id}_${bet.fixture_id}_${bet.bet_type}_${bet.amount}_${bet.odds}`;
}

async function detectAndCancelDuplicates(pendingBets){
    const groups={};
    
    for(const bet of pendingBets){
        const key=createDuplicateKey(bet);
        if(!groups[key])groups[key]=[];
        groups[key].push(bet);
    }
    
    const cleanBets=[];
    let duplicateCount=0;
    
    for(const[key,group]of Object.entries(groups)){
        if(group.length===1){
            cleanBets.push(group[0]);
            continue;
        }
        
        console.warn(`⚠️ Found ${group.length} duplicate bets: ${key}`);
        
        const sorted=group.sort((a,b)=>new Date(a.placed_at||0)-new Date(b.placed_at||0));
        const keep=sorted[0];
        const duplicates=sorted.slice(1);
        
        cleanBets.push(keep);
        duplicateCount+=duplicates.length;
        
        for(const dup of duplicates){
            await cancelDuplicateBet(dup,keep.id);
            settledBetIds.add(dup.id);
            duplicateGroupIds.add(dup.id);
        }
        
        saveSetToStorage('xl_settled',settledBetIds);
        saveSetToStorage('xl_dup',duplicateGroupIds);
    }
    
    return{cleanBets,duplicateCount};
}

async function cancelDuplicateBet(duplicateBet,originalBetId){
    const stake=parseFloat(duplicateBet.amount||0);
    
    try{
        const{error,data}=await supabaseClient
            .from('bets')
            .update({
                status:'cancelled',
                settlement_reason:`DUPLICATE - Original: ${originalBetId}`,
                is_duplicate:true,
                duplicate_of:originalBetId,
                refund_amount:stake,
                cancelled_at:new Date().toISOString(),
                updated_at:new Date().toISOString()
            })
            .eq('id',duplicateBet.id)
            .eq('status','active')
            .select('id');
        
        if(error||!data||data.length===0){
            console.warn(`Duplicate ${duplicateBet.id} already processed`);
            return false;
        }
        
        if(stake>0){
            await executeSecurePayoutAPI(
                duplicateBet.user_id,duplicateBet.id,stake,
                'duplicate_refund',{reason:'Duplicate bet cancellation', match_name: duplicateBet.match_name || 'Match'}
            );
        }
        
        duplicateBet.status='cancelled';
        duplicateBet.settlement_reason=`DUPLICATE - Original: ${originalBetId}`;
        
        showNotification(`🔄 Duplicate bet refunded: $${stake.toFixed(2)}`,'warning');
        return true;
    }catch(e){
        console.error(`Error cancelling duplicate ${duplicateBet.id}:`,e);
        return false;
    }
}

// ============================================
// MATCH DATA FETCHING
// ============================================
function isMatchConcluded(match){
    if(!match)return false;
    const status=(match.status||'').toLowerCase();
    if(['finished','ft','aet','pen','full time'].includes(status))return true;
    if(match.start_time){
        const kickoff=new Date(match.start_time);
        if((new Date()-kickoff)/(1000*60)>180)return true;
    }
    return false;
}

function handleSpecialMatchStates(match){
    if(!match)return null;
    const status=(match.status||'').toLowerCase();
    const states={
        'abandoned':{refund:true,reason:'Match abandoned'},
        'postponed':{refund:true,reason:'Match postponed'},
        'cancelled':{refund:true,reason:'Match cancelled'},
        'void':{refund:true,reason:'Match voided'}
    };
    return states[status]||null;
}

function determineBetResult(bet,match){
    if(!match)return null;
    const special=handleSpecialMatchStates(match);
    if(special)return special;
    if(!isMatchConcluded(match))return null;
    
    const hg=parseInt(match.goals_home||0);
    const ag=parseInt(match.goals_away||0);
    const tg=hg+ag;
    const bt=bet.bet_type;
    
    const map={
        'home':{won:hg>ag,reason:`Finished: ${hg}-${ag} (Home Win)`},
        'away':{won:ag>hg,reason:`Finished: ${hg}-${ag} (Away Win)`},
        'draw':{won:hg===ag,reason:`Finished: ${hg}-${ag} (Draw)`},
        '1X':{won:hg>=ag,reason:`Finished: ${hg}-${ag} (Home Win or Draw)`},
        '12':{won:hg!==ag,reason:`Finished: ${hg}-${ag} (Home or Away Win)`},
        'X2':{won:ag>=hg,reason:`Finished: ${hg}-${ag} (Away Win or Draw)`},
        'home_dnb':hg===ag?{refund:true,reason:`Finished: ${hg}-${ag} (Draw Refund)`}:{won:hg>ag,reason:`Finished: ${hg}-${ag} (Home Draw No Bet)`},
        'away_dnb':hg===ag?{refund:true,reason:`Finished: ${hg}-${ag} (Draw Refund)`}:{won:ag>hg,reason:`Finished: ${hg}-${ag} (Away Draw No Bet)`},
        'over05':{won:tg>0.5,reason:`Finished: ${hg}-${ag} (Over 0.5 Goals)`},
        'under05':{won:tg<0.5,reason:`Finished: ${hg}-${ag} (Under 0.5 Goals)`},
        'over15':{won:tg>1.5,reason:`Finished: ${hg}-${ag} (Over 1.5 Goals)`},
        'under15':{won:tg<1.5,reason:`Finished: ${hg}-${ag} (Under 1.5 Goals)`},
        'over25':{won:tg>2.5,reason:`Finished: ${hg}-${ag} (Over 2.5 Goals)`},
        'under25':{won:tg<2.5,reason:`Finished: ${hg}-${ag} (Under 2.5 Goals)`},
        'over35':{won:tg>3.5,reason:`Finished: ${hg}-${ag} (Over 3.5 Goals)`},
        'under35':{won:tg<3.5,reason:`Finished: ${hg}-${ag} (Under 3.5 Goals)`},
        'over45':{won:tg>4.5,reason:`Finished: ${hg}-${ag} (Over 4.5 Goals)`},
        'under45':{won:tg<4.5,reason:`Finished: ${hg}-${ag} (Under 4.5 Goals)`},
        'btts_yes':{won:hg>0&&ag>0,reason:`Finished: ${hg}-${ag} (Both Teams To Score Yes)`},
        'btts_no':{won:!(hg>0&&ag>0),reason:`Finished: ${hg}-${ag} (Both Teams To Score No)`}
    };
    
    if(map[bt])return map[bt];
    if(bt.startsWith('over')){const th=parseFloat(bt.replace('over','').replace('_','.'));return{won:tg>th,reason:`Finished: ${hg}-${ag} (Over ${th} Goals)`};}
    if(bt.startsWith('under')){const th=parseFloat(bt.replace('under','').replace('_','.'));return{won:tg<th,reason:`Finished: ${hg}-${ag} (Under ${th} Goals)`};}
    return null;
}

// ============================================
// 🔒 ATOMIC SETTLEMENT WITH VERIFICATION
// ============================================
async function settleBet(bet,result){
    const stake=parseFloat(bet.amount||0);
    const odds=parseFloat(bet.odds||1);
    let newStatus,payoutAmount,profitAmount;
    
    if(result.refund){
        newStatus='cancelled';
        payoutAmount=stake;
        profitAmount=0;
    }else if(result.won){
        newStatus='won';
        payoutAmount=Math.round(stake*odds*100)/100;
        profitAmount=Math.round((payoutAmount-stake)*100)/100;
    }else{
        newStatus='lost';
        payoutAmount=0;
        profitAmount=-stake;
    }
    
    try{
        // 🔒 ATOMIC UPDATE: Check rows affected and confirm active status to guarantee single settlement
        const{error,data}=await supabaseClient
            .from('bets')
            .update({
                status:newStatus,
                payout:payoutAmount,
                profit_loss:profitAmount,
                settlement_reason:result.reason,
                settled_at:new Date().toISOString(),
                updated_at:new Date().toISOString()
            })
            .eq('id',bet.id)
            .eq('status','active')
            .is('settled_at',null)
            .select('id');
        
        if(error){
            console.error(`❌ DB update failed for ${bet.id}:`,error);
            return false;
        }
        
        // 🔒 VERIFY: Only proceed with payouts if update affects active records
        if(!data||data.length===0){
            console.warn(`⚠️ Bet ${bet.id} was already settled (0 rows affected)`);
            settledBetIds.add(bet.id);
            saveSetToStorage('xl_settled',settledBetIds);
            return false;
        }
        
        // 🔒 PAYOUT ENFORCED POST TRANSACTION SUCCESS
        if(payoutAmount>0){
            await executeSecurePayoutAPI(bet.user_id,bet.id,payoutAmount,'settlement_payout',{
                stake:stake,
                odds:odds,
                profit:profitAmount,
                reason:result.reason,
                match_name: bet.match_name || 'Match'
            });
        }
        
        bet.status=newStatus;
        bet.payout=payoutAmount;
        bet.profit_loss=profitAmount;
        bet.settlement_reason=result.reason;
        bet.settled_at=new Date().toISOString();
        
        settledBetIds.add(bet.id);
        saveSetToStorage('xl_settled',settledBetIds);
        
        if(result.refund){
            showNotification(`↩️ REFUND: ${escapeHtml(bet.match_name||'Match')} - $${payoutAmount.toFixed(2)} refunded`,'info');
        }else if(result.won){
            showNotification(`🏆 WON: ${escapeHtml(bet.match_name||'Match')} - +$${profitAmount.toFixed(2)} ($${payoutAmount.toFixed(2)} payout)`,`success`);
        }else{
            showNotification(`❌ LOST: ${escapeHtml(bet.match_name||'Match')} - -$${Math.abs(profitAmount).toFixed(2)}`,`error`);
        }
        
        return true;
    }catch(e){
        console.error('Settlement exception:',e);
        return false;
    }
}

// ============================================
// AUTO SETTLEMENT LOOP WITH INTEGRITY FALLBACKS
// ============================================
async function autoSettleBets(){
    if(localStorage.getItem('xl_emergency_stop') === 'true'){
        console.warn('🚨 Settlements are paused via EMERGENCY STOP.');
        return;
    }
    if(isProcessingSettlement)return;
    isProcessingSettlement=true;
    
    try{
        const pendingBets=allBets.filter(b=>
            b.status==='active'&&
            !settledBetIds.has(b.id)&&
            !duplicateGroupIds.has(b.id)
        );
        
        if(!pendingBets.length){isProcessingSettlement=false;return;}
        
        console.log(`📋 Processing ${pendingBets.length} pending bets...`);
        
        // 🔒 STEP 1: Process identical wager group filtering
        const{cleanBets,duplicateCount}=await detectAndCancelDuplicates(pendingBets);
        
        if(duplicateCount>0){
            console.log(`🗑️ Cancelled ${duplicateCount} duplicate bets`);
        }
        
        // 🔒 STEP 2: Gather clean matches mapped
        const uniqueFids=[...new Set(cleanBets.map(b=>b.fixture_id).filter(Boolean))];
        const matchMap=uniqueFids.length>0?await fetchMatchesBatch(uniqueFids):{};
        
        // 🔒 STEP 3: Process clean selections
        let settledCount=0;
        for(const bet of cleanBets){
            if(settledBetIds.has(bet.id))continue;
            
            try{
                if(bet.bet_type==='accumulator'&&bet.selections&&bet.selections.length>0){
                    let allWon=true,hasRefund=false,allFinished=true;
                    const selectionResults=[];
                    
                    for(const sel of bet.selections){
                        const fid=sel.fixtureId||sel.fixture_id;
                        const sm=matchMap[fid];
                        
                        if(!sm||!isMatchConcluded(sm)){
                            allFinished=false;
                            break;
                        }
                        
                        const sr=determineBetResult({bet_type:sel.betType||sel.bet_type},sm);
                        if(!sr){allFinished=false;break;}
                        
                        selectionResults.push(sr);
                        if(sr.refund)hasRefund=true;
                        else if(!sr.won)allWon=false;
                    }
                    
                    if(!allFinished)continue;
                    
                    let accaResult;
                    if(hasRefund){accaResult={refund:true,reason:'Acca with refund(s)'};}
                    else{accaResult={won:allWon,reason:allWon?'All legs won':'One or more legs lost'};}
                    
                    if(await settleBet(bet,accaResult))settledCount++;
                    
                }else{
                    const match=matchMap[bet.fixture_id];
                    if(!match||!isMatchConcluded(match))continue;
                    
                    const result=determineBetResult(bet,match);
                    if(!result)continue;
                    
                    if(await settleBet(bet,result))settledCount++;
                }
            }catch(e){
                console.error(`Error settling bet ${bet.id}:`,e);
            }
        }
        
        if(settledCount>0||duplicateCount>0){
            await loadBalance();
            updateStats();
            updateCounts();
            filterBets(currentFilter);
        }
        
        console.log(`✅ Settled: ${settledCount} | Duplicates: ${duplicateCount}`);
        
    }catch(e){
        console.error('Auto-settlement error:',e);
    }finally{
        isProcessingSettlement=false;
    }
}

// CANCEL BET (PRE-MATCH ONLY)
// ============================================
async function cancelBet(betId){
    const bet=allBets.find(b=>b.id===betId);
    if(!bet||bet.status!=='active'){showNotification('❌ Cannot cancel','error');return;}
    if(bet.bet_type==='accumulator'){showNotification('❌ Accumulators cannot be cancelled','error');return;}
    if(settledBetIds.has(betId)){showNotification('❌ Already processed','error');return;}
    
    let matchStarted=false;
    if(bet.fixture_id&&bet._kickoff){
        matchStarted=new Date()>new Date(bet._kickoff);
    }
    if(matchStarted){showNotification('❌ Match started - Cancel unavailable','error');return;}
    
    const stake=parseFloat(bet.amount||0);
    const feePercent=5;
    const refundAmount=stake*(1-feePercent/100);
    const fee=stake-refundAmount;
    
    if(!confirm(`Cancel?\n\nStake: $${stake.toFixed(2)}\nRefund: $${refundAmount.toFixed(2)}\nFee (${feePercent}%): $${fee.toFixed(2)}`))return;
    
    try{
        const{error,data}=await supabaseClient
            .from('bets')
            .update({
                status:'cancelled',
                cancellation_fee:fee,
                refund_amount:refundAmount,
                cancelled_at:new Date().toISOString(),
                settlement_reason:`Cancelled - ${feePercent}% fee`,
                updated_at:new Date().toISOString()
            })
            .eq('id',betId)
            .eq('status','active')
            .select('id');
        
        if(error||!data||data.length===0){
            showNotification('❌ Cancel failed - bet may already be settled','error');
            return;
        }
        
        settledBetIds.add(betId);
        saveSetToStorage('xl_settled',settledBetIds);
        
        await executeSecurePayoutAPI(bet.user_id,bet.id,refundAmount,'cancel_refund',{fee:fee, match_name: bet.match_name || 'Match'});
        
        bet.status='cancelled';
        showNotification(`✅ Refunded: $${refundAmount.toFixed(2)}`,'success');
        
        await loadBalance();
        updateStats();
        updateCounts();
        filterBets(currentFilter);
    }catch(e){
        showNotification(`Error: ${e.message}`,'error');
    }
}

// DATA LOADING
// ============================================
async function loadBets(){
    const u=auth.currentUser;
    if(!u)return;
    
    try{
        const{data,error}=await supabaseClient
            .from('bets')
            .select('*')
            .eq('user_id',u.uid)
            .order('placed_at',{ascending:false});
        
        if(error)throw error;
        
        const liveBets=data||[];
        const uniqueFids=[...new Set(liveBets.map(b=>b.fixture_id).filter(Boolean))];
        const matchMap=uniqueFids.length>0?await fetchMatchesBatch(uniqueFids):{};
        
        for(let b of liveBets){
            let hFallback='Home',aFallback='Away';
            if(b.match_name&&b.match_name.includes(' vs ')){
                const parts=b.match_name.split(' vs ');
                if(parts[0]?.trim())hFallback=parts[0].trim();
                if(parts[1]?.trim())aFallback=parts[1].trim();
            }
            
            b._homeTeam={name:hFallback,logo:`https://ui-avatars.com/api/?name=${encodeURIComponent(hFallback)}&size=32&background=1a2332&color=00ff9d`};
            b._awayTeam={name:aFallback,logo:`https://ui-avatars.com/api/?name=${encodeURIComponent(aFallback)}&size=32&background=1a2332&color=ff9800`};
            b._score={home:0,away:0};
            b._league='Sports Match';
            b._kickoff=b.placed_at;
            b._matchStatus='NS';
            b._isPreMatch=true;
            
            if(b.fixture_id){
                const m=matchMap[b.fixture_id];
                if(m){
                    b._match=m;
                    b.match_name=`${hFallback} vs ${aFallback}`;
                    b._league=m.league_name||b._league;
                    b._kickoff=m.start_time||b._kickoff;
                    b._matchStatus=m.status;
                    b._elapsed=m.elapsed;
                    b._score={home:m.goals_home||0,away:m.goals_away||0};
                }
            }
            
            if (b.bet_type === 'accumulator' && b.selections) {
                b.selections.forEach(s => {
                    const sm = matchMap[s.fixtureId || s.fixture_id];
                    if (sm) s._match = sm;
                });
            }
        }
        
        allBets=liveBets;
        
        document.getElementById('loading').style.display='none';
        document.getElementById('content').style.display='block';
        
        updateStats();
        updateCounts();
        filterBets(currentFilter);
        startSettlementTimers();
        
        await safeAutoSettle();
        
    }catch(e){
        console.error('Load bets error',e);
        document.getElementById('loading').style.display='none';
        document.getElementById('content').style.display='block';
    }
}

function sortBets(bets){
    const now=new Date();
    const active=[],settled=[];
    bets.forEach(b=>{
        if(b.status==='active'){
            let overdue=false;
            if(b._kickoff&&now>new Date(new Date(b._kickoff).getTime()+115*60000))overdue=true;
            if(['finished','ft','aet','pen'].includes((b._matchStatus||'').toLowerCase()))overdue=true;
            active.push({bet:b,overdue});
        }else{settled.push(b);}
    });
    active.sort((x,y)=>x.overdue!==y.overdue?(x.overdue?1:-1):((x.bet._kickoff?new Date(x.bet._kickoff).getTime():Infinity)-(y.bet._kickoff?new Date(y.bet._kickoff).getTime():Infinity)));
    settled.sort((x,y)=>new Date(y.settled_at||y.cashed_out_at||y.placed_at||0).getTime()-new Date(x.settled_at||x.cashed_out_at||x.placed_at||0).getTime());
    return[...active.map(a=>a.bet),...settled];
}

function updateStats(){
    const t=allBets.length,w=allBets.filter(b=>b.status==='won'),l=allBets.filter(b=>b.status==='lost'),a=allBets.filter(b=>b.status==='active');
    let wa=0,la=0,np=0;
    w.forEach(b=>{const p=parseFloat(b.payout||b.potential_win||0);wa+=p;np+=p-parseFloat(b.amount||0);});
    l.forEach(b=>{const s=parseFloat(b.amount||0);la+=s;np-=s;});
    allBets.filter(b=>b.status==='cashed-out').forEach(b=>{np+=parseFloat(b.cashout_amount||0)-parseFloat(b.amount||0);});
    const wr=(w.length+l.length)>0?((w.length/(w.length+l.length))*100).toFixed(1):0;
    document.getElementById('total-bets').textContent=t;
    document.getElementById('total-won').textContent=w.length;
    document.getElementById('total-lost').textContent=l.length;
    document.getElementById('total-active').textContent=a.length;
    document.getElementById('won-amount').textContent=`$${wa.toFixed(2)}`;
    document.getElementById('lost-amount').textContent=`$${la.toFixed(2)}`;
    document.getElementById('win-rate-display').textContent=`${wr}%`;
    document.getElementById('win-rate-fill').style.width=`${wr}%`;
    const pe=document.getElementById('total-pl');
    pe.textContent=(np>=0?'+':'')+'$'+np.toFixed(2);
    pe.style.color=np>=0?'#4caf50':'var(--danger)';
}

function updateCounts(){
    const c={all:allBets.length,active:allBets.filter(b=>b.status==='active').length,won:allBets.filter(b=>b.status==='won').length,lost:allBets.filter(b=>b.status==='lost').length,cancelled:allBets.filter(b=>b.status==='cancelled').length,'cashed-out':allBets.filter(b=>b.status==='cashed-out').length};
    for(const[k,v]of Object.entries(c)){const e=document.getElementById(`cnt-${k}`);if(e)e.textContent=v;}
}

function filterBets(f){
    currentFilter=f;
    let fl=sortBets(allBets);
    if(f!=='all')fl=fl.filter(b=>b.status===f);
    const sVal=document.getElementById('bet-search-input')?.value?.toLowerCase().trim();
    if(sVal)fl=fl.filter(b=>{const mn=(b.match_name||'').toLowerCase(),lg=(b._league||'').toLowerCase(),tk=('XL'+(b.id?.slice(-8)||'')).toLowerCase();return mn.includes(sVal)||lg.includes(sVal)||tk.includes(sVal);});
    const c=document.getElementById('bet-list-container');
    if(c){c.innerHTML=fl.length?fl.map(b=>createBetCard(b)).join(''):`<div class="empty-state"><i class="fas fa-ticket-alt"></i><p>No bets found</p></div>`;}
    startSettlementTimers();
}

    const pr=bet.status==='won'?pay-amt:(bet.status==='lost'?-amt:(bet.status==='cashed-out'?(parseFloat(bet.cashout_amount||0)-amt):0));
    
    let sh='';
    if(bet.bet_type==='accumulator'&&bet.selections?.length>0){
        sh=`<div class="modal-section"><h4>Selections (${bet.selections.length})</h4>${bet.selections.map((s,i)=>`<div class="modal-row"><span class="lbl">#${i+1}</span><span>${escapeHtml(s.matchName)} - ${escapeHtml(formatBetTypeName(s.betType || s.bet_type))} @${s.odds}</span></div>`).join('')}</div>`;
    }
    
    body.innerHTML=`<div class="modal-section"><h4>Ticket #${tk}</h4><div class="modal-row"><span class="lbl">Status</span><span>${bet.status?.toUpperCase()}</span></div><div class="modal-row"><span class="lbl">Match</span><span>${escapeHtml(bet.match_name||'N/A')}</span></div><div class="modal-row"><span class="lbl">Score</span><span>${bet._score?`${bet._score.home}-${bet._score.away}`:'N/A'}</span></div></div><div class="modal-section"><h4>Financial</h4><div class="modal-row"><span class="lbl">Stake</span><span>$${amt.toFixed(2)}</span></div><div class="modal-row"><span class="lbl">Odds</span><span>@${parseFloat(bet.odds||2).toFixed(2)}</span></div><div class="modal-row"><span class="lbl">Payout</span><span>$${pay.toFixed(2)}</span></div><div class="modal-row"><span class="lbl">Profit / Loss</span><span style="color:${pr>=0?'#4caf50':'var(--danger)'}">${pr>=0?'+':''}$${pr.toFixed(2)}</span></div></div>${sh}${bet.settlement_reason?`<div class="modal-section"><h4>Settlement</h4><div class="modal-row"><span class="lbl">Reason</span><span>${escapeHtml(bet.settlement_reason)}</span></div></div>`:''}`;
    modal.classList.add('show');
}

function closeModal(e){if(!e||e.target===document.getElementById('bet-modal'))document.getElementById('bet-modal').classList.remove('show');}

function startSettlementTimers(){
    settlementTimers.forEach(clearInterval);
    settlementTimers=[];
    allBets.filter(b=>b.status==='active').forEach(bet=>{
        const el=document.getElementById(`timer-${bet.id}`);
        if(!el)return;
        const update=()=>{
            const ko=bet._kickoff?new Date(bet._kickoff):null;
            if(!ko){el.textContent='TBD';return;}
            const settleBy=new Date(ko.getTime()+115*60000);
            const diff=settleBy-new Date();
            if(diff<=0){el.innerHTML='<span style="color:var(--success);">Settling...</span>';}
            else{const h=Math.floor(diff/3600000),m=Math.floor((diff%3600000)/60000);el.textContent=h>0?`${h}h ${m}m`:`${m}m`;}
        };
        update();
        settlementTimers.push(setInterval(update,60000));
    });
}

async function safeAutoSettle() {
    if (localStorage.getItem('xl_emergency_stop') === 'true') {
        console.warn('🚨 Settlements are paused via EMERGENCY STOP.');
        return;
    }
    if (isProcessingSettlement) return;
    try {
        await autoSettleBets();
    } catch(e) {
        console.error("Auto settlement failed to process on loop:", e);
    }
}

// ============================================
// INITIALIZATION
// ============================================
auth.onAuthStateChanged(async u=>{
    if(!u){window.location.href='../login.html';return;}
    
    settledBetIds=loadSetFromStorage('xl_settled');
    duplicateGroupIds=loadSetFromStorage('xl_dup');
    processedPayouts=loadSetFromStorage('xl_payouts');
    
    await loadBalance();
    await loadBets();
    
    refreshInterval=setInterval(async()=>{await loadBets();await loadBalance();},30000);
    
    if (localStorage.getItem('xl_emergency_stop') !== 'true') {
        settleInterval=setInterval(async()=>{await safeAutoSettle();await loadBalance();},60000);
    }
});

document.querySelectorAll('.filter-chip').forEach(c=>{c.addEventListener('click',function(){document.querySelectorAll('.filter-chip').forEach(x=>x.classList.remove('active'));this.classList.add('active');filterBets(this.dataset.filter);});});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
window.addEventListener('beforeunload',()=>{if(refreshInterval)clearInterval(refreshInterval);if(settleInterval)clearInterval(settleInterval);settlementTimers.forEach(clearInterval);});

// Expose globally
window.cancelBet=cancelBet;window.cashoutBet=cashoutBet;window.showDetails=showDetails;
window.closeModal=closeModal;window.toggleTheme=toggleTheme;
window.filterBets=filterBets;window.openResponsibleGambling=openResponsibleGambling;
window.closeRG=closeRG;window.saveRGLimits=saveRGLimits;
window.printBetReceipt=printBetReceipt;window.updateAutoCashoutThreshold=updateAutoCashoutThreshold;
window.updatePartialCashout=updatePartialCashout;window.updatePartialCashoutLabel=updatePartialCashoutLabel;

console.log('✅ My Bets v11.5 - Consolidated Helpers & Keyboard Kill-switch Connected');
