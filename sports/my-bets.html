// ============================================
// 🛡️ POLYMORPHIC TEAM EXTRACTER (PREVENTS HOME/AWAY WIPES)
// ============================================
function extractTeamDetails(teamInput, fallbackName) {
    const safeFallback = (fallbackName && fallbackName !== 'Home' && fallbackName !== 'Away') ? fallbackName : 'Team';
    if (!teamInput) return { name: safeFallback, logo: '' };

    // 1. If payload is an object
    if (typeof teamInput === 'object') {
        const parsedName = teamInput.name && teamInput.name !== 'Home' && teamInput.name !== 'Away' ? teamInput.name : safeFallback;
        return {
            name: parsedName,
            logo: teamInput.logo || ''
        };
    }

    // 2. If payload is a string
    if (typeof teamInput === 'string') {
        const trimmed = teamInput.trim();
        // Detect if payload is actually stringified JSON
        if (trimmed.startsWith('{')) {
            try {
                const parsedObj = JSON.parse(trimmed);
                const parsedName = parsedObj.name && parsedObj.name !== 'Home' && parsedObj.name !== 'Away' ? parsedObj.name : safeFallback;
                return {
                    name: parsedName,
                    logo: parsedObj.logo || ''
                };
            } catch(e) {
                // Not stringified JSON, continue
            }
        }
        
        // Handle as a direct plain text team name
        if (trimmed !== '' && trimmed !== 'Home' && trimmed !== 'Away') {
            return { name: trimmed, logo: '' };
        }
    }

    return { name: safeFallback, logo: '' };
}

async function fetchMatchFromAPI(fid){
    try{
        const r=await fetch(`${API_BASE}/api/fixture/${fid}`);
        if(!r.ok)return null;
        const d=await r.json();
        if(d.success&&d.fixture){
            const f=d.fixture,g=f.goals||{home:0,away:0},sc=f.score||{fulltime:{home:0,away:0},halftime:{home:0,away:0}};
            return {
                fixture_id: f.fixture?.id||fid,
                status: f.fixture?.status?.short||'NS',
                elapsed: f.fixture?.status?.elapsed||0,
                home_team: extractTeamDetails(f.teams?.home, 'Home'),
                away_team: extractTeamDetails(f.teams?.away, 'Away'),
                league_name: f.league?.name||'',
                start_time: f.fixture?.date||'',
                goals_home: g.home||sc.fulltime?.home||0,
                goals_away: g.away||sc.fulltime?.away||0,
                ht_home: sc.halftime?.home||0,
                ht_away: sc.halftime?.away||0
            };
        }
        return null;
    } catch(e) {
        return null;
    }
}

            .from('sports_matches')

            data.forEach(row => {

                const previousAway = existingDataMap[row.fixture_id]?.away_team?.name || 'Away';
                
                const homeDetails = extractTeamDetails(row.home_team, previousHome);
                const awayDetails = extractTeamDetails(row.away_team, previousAway);

                let score = row.score;
                if (typeof score === 'string') { try { score = JSON.parse(score); } catch(e){} }

                batchResult[row.fixture_id] = {
                    fixture_id: row.fixture_id,
                    status: row.status,
                    elapsed: row.elapsed || 0,
                    home_team: homeDetails,

                    league_name: row.league_name || '',
                    start_time: row.start_time || '',
                    goals_home: score?.home !== undefined ? score.home : 0,
                    goals_away: score?.away !== undefined ? score.away : 0,
                    ht_home: score?.halftime?.home !== undefined ? score.halftime.home : 0,
                    ht_away: score?.halftime?.away !== undefined ? score.halftime.away : 0
                };
            });
        }
    } catch(e) {
        console.warn('Batch database fetch error', e);
    }

    // Identify missing matches and run queries in parallel
    const missingFids = fids.filter(fid => !batchResult[fid]);
    if (missingFids.length > 0) {
        const liveFetches = await Promise.all(missingFids.map(async (fid) => {
            const apiMatch = await fetchMatchFromAPI(fid);
            return { fid, data: apiMatch };
        }));

        liveFetches.forEach(res => {
            if (res.data) {
                const previousHome = existingDataMap[res.fid]?.home_team?.name || 'Home';
                const previousAway = existingDataMap[res.fid]?.away_team?.name || 'Away';
                
                res.data.home_team = extractTeamDetails(res.data.home_team, previousHome);
                res.data.away_team = extractTeamDetails(res.data.away_team, previousAway);
                batchResult[res.fid] = res.data;
            }
        });
    }

    return batchResult;
}

function calculateRealCashout(bet,match){
    const stake=parseFloat(bet.amount||0);const odds=parseFloat(bet.odds||2);const potentialWin=stake*odds;
    const elapsed=match.elapsed||0;const hg=match.goals_home||0;const ag=match.goals_away||0;
    const tg=hg+ag;const bt=bet.bet_type;
    const winProb=calculateWinProbability(bt,hg,ag,tg,elapsed);
    const timeDecay=getTimeDecay(elapsed);
    let cv=potentialWin*winProb*timeDecay;
    if(winProb<0.25)cv=stake*(winProb*0.4);else if(winProb<0.40)cv=Math.max(cv,stake*winProb*0.5);
    const fee=cv*0.03;cv-=fee;cv=Math.max(cv,stake*0.01);cv=Math.min(cv,potentialWin*0.92);
    const profit=cv-stake;const isW=winProb>=0.50;const isL=winProb<0.30;
    return{value:parseFloat(cv.toFixed(2)),profit:parseFloat(profit.toFixed(2)),winProbability:parseFloat((winProb*100).toFixed(1)),timeDecay:parseFloat((timeDecay*100).toFixed(0)),isWinning:isW,isLosing:isL,fee:parseFloat(fee.toFixed(2)),status:isW?'WINNING':(isL?'LOSING':'NEUTRAL')};
}

function calculateWinProbability(bt,hg,ag,tg,elapsed){const rm=Math.max(1,90-elapsed);const gpm=tg/Math.max(elapsed,1);
    switch(bt){case'home':return calcHomeWinProb(hg,ag,elapsed,rm);case'draw':return calcDrawProb(hg,ag,elapsed,rm);case'away':return calcAwayWinProb(hg,ag,elapsed,rm);
    case'1X':return Math.max(calcHomeWinProb(hg,ag,elapsed,rm),calcDrawProb(hg,ag,elapsed,rm));case'12':return 1-calcDrawProb(hg,ag,elapsed,rm);case'X2':return Math.max(calcDrawProb(hg,ag,elapsed,rm),calcAwayWinProb(hg,ag,elapsed,rm));
    case'home_dnb':return calcHomeWinProb(hg,ag,elapsed,rm);case'away_dnb':return calcAwayWinProb(hg,ag,elapsed,rm);
    case'over05':return tg>=1?1:calcOverProb(tg,0.5,rm,gpm);case'under05':return 1-(tg>=1?1:calcOverProb(tg,0.5,rm,gpm));
    case'over15':return tg>=2?1:calcOverProb(tg,1.5,rm,gpm);case'under15':return 1-(tg>=2?1:calcOverProb(tg,1.5,rm,gpm));
    case'over25':return tg>=3?1:calcOverProb(tg,2.5,rm,gpm);case'under25':return 1-(tg>=3?1:calcOverProb(tg,2.5,rm,gpm));
    case'over35':return tg>=4?1:calcOverProb(tg,3.5,rm,gpm);case'under35':return 1-(tg>=4?1:calcOverProb(tg,3.5,rm,gpm));
    case'over45':return tg>=5?1:calcOverProb(tg,4.5,rm,gpm);case'under45':return 1-(tg>=5?1:calcOverProb(tg,4.5,rm,gpm));
    case'btts_yes':return calcBTTSYesProb(hg,ag,rm,gpm);case'btts_no':return 1-calcBTTSYesProb(hg,ag,rm,gpm);
    default:if(bt.startsWith('over')){const th=parseFloat(bt.replace('over','').replace('_','.'));return tg>th?1:calcOverProb(tg,th,rm,gpm);}if(bt.startsWith('under')){const th=parseFloat(bt.replace('under','').replace('_','.'));return 1-(tg>th?1:calcOverProb(tg,th,rm,gpm));}return 0.50;}
}

function calcHomeWinProb(hg,ag,elapsed,rm){const gd=hg-ag;const rr=rm/90;if(gd>=3)return 0.98;if(gd===2)return 0.92-(rr*0.04);if(gd===1)return 0.78-(rr*0.18);if(gd===0)return 0.42-(rr*0.06);if(gd===-1)return 0.18-(rr*0.06);if(gd===-2)return 0.05;return 0.02;}
function calcDrawProb(hg,ag,elapsed,rm){const gd=Math.abs(hg-ag);if(gd===0){if(elapsed>75)return 0.70;if(elapsed>60)return 0.55;if(elapsed>30)return 0.35;return 0.28;}if(gd===1){if(elapsed>80)return 0.08;if(elapsed>60)return 0.15;if(elapsed>30)return 0.22;return 0.25;}if(gd===2)return elapsed>70?0.03:0.08;return 0.02;}
function calcAwayWinProb(hg,ag,elapsed,rm){return calcHomeWinProb(ag,hg,elapsed,rm);}
function calcOverProb(c,t,rm,gpm){if(c>t)return 1;const n=t-c;const e=c+(gpm*rm);if(e>=t+0.5)return 0.85;if(e>=t)return 0.65;if(e>=t-0.5)return 0.40;if(rm<10)return n<=0.5?0.08:0.02;if(rm<20)return n<=0.5?0.18:(n<=1?0.10:0.04);if(rm<35)return n<=0.5?0.35:(n<=1?0.22:0.10);return n<=0.5?0.55:(n<=1?0.35:0.18);}
function calcBTTSYesProb(hg,ag,rm,gpm){if(hg>0&&ag>0)return 1;const bn=hg===0&&ag===0;const on=(hg===0&&ag>0)||(hg>0&&ag===0);if(bn){if(rm<10)return 0.04;if(rm<20)return 0.12;if(rm<35)return 0.25;return 0.40;}if(on){if(rm<5)return 0.06;if(rm<15)return 0.15;if(rm<30)return 0.28;return 0.45;}return 0.50;}
function getTimeDecay(elapsed){if(elapsed<=15)return 0.95;if(elapsed<=30)return 0.88;if(elapsed<=45)return 0.78;if(elapsed<=50)return 0.72;if(elapsed<=60)return 0.65;if(elapsed<=75)return 0.52;if(elapsed<=85)return 0.38;return 0.20;}

function isBetPlacedBeforeKickoff(bet,match){if(!bet.placed_at||!match||!match.start_time)return true;const bp=new Date(bet.placed_at);const mk=new Date(match.start_time);return bp<mk;}

function determineBetResult(bet,match){if(!match||!bet)return null;const g={home:match.goals_home||0,away:match.goals_away||0},tg=g.home+g.away;const bt=bet.bet_type;let w=false,rs='';const rules={'home':()=>{w=g.home>g.away;rs=`${g.home}-${g.away}`;},'draw':()=>{w=g.home===g.away;rs=`${g.home}-${g.away}`;},'away':()=>{w=g.away>g.home;rs=`${g.home}-${g.away}`;},'1X':()=>{w=g.home>=g.away;rs=`${g.home}-${g.away}`;},'12':()=>{w=g.home!==g.away;rs=`${g.home}-${g.away}`;},'X2':()=>{w=g.away>=g.home;rs=`${g.home}-${g.away}`;},'over05':()=>{w=tg>0.5;rs=`${tg}g`;},'under05':()=>{w=tg<0.5;rs=`${tg}g`;},'over15':()=>{w=tg>1.5;rs=`${tg}g`;},'under15':()=>{w=tg<1.5;rs=`${tg}g`;},'over25':()=>{w=tg>2.5;rs=`${tg}g`;},'under25':()=>{w=tg<2.5;rs=`${tg}g`;},'over35':()=>{w=tg>3.5;rs=`${tg}g`;},'under35':()=>{w=tg<3.5;rs=`${tg}g`;},'btts_yes':()=>{w=g.home>0&&g.away>0;rs=`BTTS ${w?'Yes':'No'}`;},'btts_no':()=>{w=!(g.home>0&&g.away>0);rs=`BTTS ${w?'No':'Yes'}`;}};if(rules[bt]){rules[bt]();return{won:w,reason:rs};}if(bt.startsWith('over')){const th=parseFloat(bt.replace('over','').replace('_','.'));w=tg>th;return{won:w,reason:`${tg}g O${th}`};}if(bt.startsWith('under')){const th=parseFloat(bt.replace('under','').replace('_','.'));w=tg<th;return{won:w,reason:`${tg}g U${th}`};}return null;}

async function autoSettleBets(){const ab=allBets.filter(b=>b.status==='active'&&!settledBets.has(b.id));if(!ab.length)return;
    const uniqueFids = [...new Set(ab.map(b => b.fixture_id).filter(Boolean))];
    const matchMap = await fetchMatchesBatch(uniqueFids);

    for(const bet of ab){if(!bet.fixture_id)continue;try{const m=matchMap[bet.fixture_id];if(!m||(m.status!=='finished'&&m.status!=='FT'&&m.status!=='AET'&&m.status!=='PEN'))continue;let result;if(bet.bet_type==='accumulator'&&bet.selections){let aw=true,sr=[];for(const s of bet.selections){const sm=matchMap[s.fixtureId||s.fixture_id];if(sm&&(sm.status==='finished'||sm.status==='FT')){const sr2=determineBetResult({bet_type:s.betType||s.bet_type},sm);if(sr2){sr.push({...s,won:sr2.won,reason:sr2.reason});if(!sr2.won)aw=false;}else{aw=false;}}else{aw=false;break;}}if(sr.length===bet.selections.length)result={won:aw,reason:`Acca: ${aw?'ALL WON':'Lost'}`};}else{result=determineBetResult(bet,m);}if(result){await settleBet(bet,result);settledBets.add(bet.id);}}catch(e){console.warn('Auto settlement cycle exception', e);}}}

async function settleBet(bet,result){const ns=result.won?'won':'lost',pay=result.won?(bet.amount*bet.odds):0,pr=result.won?(pay-bet.amount):-bet.amount;try{await supabaseClient.from('bets').update({status:ns,payout:pay,settlement_reason:result.reason,settled_at:new Date().toISOString(),updated_at:new Date().toISOString()}).eq('id',bet.id).eq('status','active');if(result.won&&pay>0)await updateWalletBalance(bet.user_id,pay);bet.status=ns;bet.payout=pay;bet.settlement_reason=result.reason;bet.settled_at=new Date().toISOString();showNotification(`${result.won?'🏆':'❌'} ${result.won?'WON':'LOST'}: ${escapeHtml(bet.match_name||'Match')} - ${result.won?'+':'-'}$${Math.abs(pr).toFixed(2)}`,result.won?'success':'error');await loadBalance();updateStats();updateCounts();filterBets(currentFilter);}catch(e){}}

async function cashoutBet(betId){const bet=allBets.find(b=>b.id===betId);if(!bet||bet.status!=='active'){showNotification('❌ Cannot cash out','error');return;}if(settledBets.has(betId)){showNotification('❌ Already processed','error');return;}

    const td=getTimeDecay(bet._elapsed||30);let cv=bet.amount*to*avgProb*td;if(avgProb<0.25)cv=bet.amount*(avgProb*0.3);
    const fee2=cv*0.03;cv-=fee2;cv=Math.max(cv,bet.amount*0.01);cv=Math.min(cv,bet.amount*to*0.90);
    const isW=avgProb>=0.50,isL=avgProb<0.30;

async function loadBets(){
    const u=auth.currentUser;
    if(!u)return;

    const cacheKey = `xl_bets_state_cache_${u.uid}`;
    const cachedBets = localStorage.getItem(cacheKey);

    // Render local cache instantly
    if(cachedBets){
        try {
            allBets = JSON.parse(cachedBets);
            console.log("⚡ Instant local UI load complete from cache.");
            updateStats();
            updateCounts();
            filterBets(currentFilter);
            startSettlementTimers();
            
            const elLoading = document.getElementById('loading');
            if (elLoading) elLoading.style.display = 'none';
            
            const elContent = document.getElementById('content');
            if (elContent) elContent.style.display = 'block';

            // Background quick settlement checks
            autoSettleBets();
        } catch(e) {
            console.warn('Cache read bypass, querying database directly', e);
        }
    }

    try{
        const{data,error}=await supabaseClient.from('bets').select('*').eq('user_id',u.uid).order('placed_at',{ascending:false});
        if(error)throw error;
        const liveBets = data || [];

        // Query matches batch in parallel
        const uniqueFids = [...new Set(liveBets.map(b => b.fixture_id).filter(Boolean))];
        
        const existingDataMap = {};
        allBets.forEach(b => {
            if(b.fixture_id && b._match) {
                existingDataMap[b.fixture_id] = b._match;
            }
        });

        const matchMap = await fetchMatchesBatch(uniqueFids, existingDataMap);

        for(let b of liveBets){
            // High fidelity split of existing names on the bet record
            let bHomeFallback = 'Home';
            let bAwayFallback = 'Away';
            if (b.match_name && b.match_name.includes(' vs ')) {
                const parts = b.match_name.split(' vs ');
                if (parts[0] && parts[0].trim() !== '') bHomeFallback = parts[0].trim();
                if (parts[1] && parts[1].trim() !== '') bAwayFallback = parts[1].trim();
            }

            if(b.fixture_id){
                const m=matchMap[b.fixture_id];
                if(m){
                    b._match=m;
                    const cleanHome = m.home_team?.name && m.home_team.name !== 'Home' ? m.home_team.name : bHomeFallback;
                    const cleanAway = m.away_team?.name && m.away_team.name !== 'Away' ? m.away_team.name : bAwayFallback;

                    b.match_name=`${cleanHome} vs ${cleanAway}`;
                    b._homeTeam={ ...m.home_team, name: cleanHome };
                    b._awayTeam={ ...m.away_team, name: cleanAway };
                    b._league=m.league_name;
                    b._kickoff=m.start_time;
                    b._matchStatus=m.status;
                    b._elapsed=m.elapsed;
                    b._score={home:m.goals_home||0,away:m.goals_away||0};
                    b._isPreMatch=isBetPlacedBeforeKickoff(b,m);
                } else {
                    b.match_name=`${bHomeFallback} vs ${bAwayFallback}`;
                    b._homeTeam={ name: bHomeFallback, logo: '' };
                    b._awayTeam={ name: bAwayFallback, logo: '' };
                }
            } else if (!b.match_name) {
                b.match_name=`${bHomeFallback} vs ${bAwayFallback}`;
            }
        }

        allBets = liveBets;
        localStorage.setItem(cacheKey, JSON.stringify(allBets));

        const elLoading = document.getElementById('loading');
        if (elLoading) elLoading.style.display = 'none';
        
        const elContent = document.getElementById('content');
        if (elContent) elContent.style.display = 'block';

        updateStats();
        updateCounts();
        filterBets(currentFilter);
        startSettlementTimers();
        await autoSettleBets();

    }catch(e){
        console.error("Revalidation loop failed", e);
        if(!allBets.length){
            const elContainer = document.getElementById('bet-list-container');
            if (elContainer) {
                elContainer.innerHTML=`<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Error</p><small>${escapeHtml(e.message)}</small></div>`;
            }
        }
    }
}

function startSettlementTimers(){settlementTimers.forEach(clearInterval);settlementTimers=[];allBets.filter(b=>b.status==='active').forEach(bet=>{const el=document.getElementById(`timer-${bet.id}`);if(!el)return;const u=()=>{const ko=bet._kickoff?new Date(bet._kickoff):null;if(!ko){el.textContent='TBD';return;}const ee=new Date(ko.getTime()+115*60000),n=new Date(),d=ee-n;if(d<=0){el.innerHTML='<span style="color:#4caf50;">Settling...</span>';}else{const h=Math.floor(d/3600000),m=Math.floor((d%3600000)/60000);el.textContent=h>0?`${h}h ${m}m`:`${m}m`;if(m<10&&h===0)el.classList.add('urgent');}};u();settlementTimers.push(setInterval(u,60000));});}

function formatBetTypeName(bt){const n={'home':'🏠 Home Win','draw':'🤝 Draw','away':'✈️ Away Win','1X':'Home/Draw','12':'Home/Away','X2':'Draw/Away','home_dnb':'Home DNB','away_dnb':'Away DNB','over25':'Over 2.5','under25':'Under 2.5','over15':'Over 1.5','under15':'Under 1.5','over35':'Over 3.5','under35':'Under 3.5','btts_yes':'BTTS Yes','btts_no':'BTTS No','accumulator':'Accumulator'};return n[bt]||bt.replace(/_/g,' ').replace(/\b\w/g,l=>l.toUpperCase());}

function updateStats(){
    const t=allBets.length,
          w=allBets.filter(b=>b.status==='won'),
          l=allBets.filter(b=>b.status==='lost'),
          a=allBets.filter(b=>b.status==='active');
    let wa=0,la=0,np=0;
    w.forEach(b=>{
        wa+=parseFloat(b.payout||b.potential_win||0);
        np+=parseFloat(b.payout||b.potential_win||0)-parseFloat(b.amount||0);
    });
    l.forEach(b=>{
        la+=parseFloat(b.amount||0);
        np-=parseFloat(b.amount||0);
    });
    allBets.filter(b=>b.status==='cashed-out').forEach(b=>{
        np+=parseFloat(b.cashout_amount||0)-parseFloat(b.amount||0);
    });
    const wr=(w.length+l.length)>0?((w.length/(w.length+l.length))*100).toFixed(1):0;
    
    const elBets = document.getElementById('total-bets');
    if (elBets) elBets.textContent = t;
    
    const elWon = document.getElementById('total-won');
    if (elWon) elWon.textContent = w.length;
    
    const elLost = document.getElementById('total-lost');
    if (elLost) elLost.textContent = l.length;
    
    const elActive = document.getElementById('total-active');
    if (elActive) elActive.textContent = a.length;
    
    const elWonAmt = document.getElementById('won-amount');
    if (elWonAmt) elWonAmt.textContent = `$${wa.toFixed(2)}`;
    
    const elLostAmt = document.getElementById('lost-amount');
    if (elLostAmt) elLostAmt.textContent = `$${la.toFixed(2)}`;
    
    const elWrDisp = document.getElementById('win-rate-display');
    if (elWrDisp) elWrDisp.textContent = `${wr}%`;
    
    const elWrFill = document.getElementById('win-rate-fill');
    if (elWrFill) elWrFill.style.width = `${wr}%`;
    
    const pe = document.getElementById('total-pl');
    if (pe) {
        pe.textContent = (np >= 0 ? '+' : '') + '$' + np.toFixed(2);
        pe.style.color = np >= 0 ? '#4caf50' : 'var(--danger)';
    }
}

function updateCounts(){
    const c={
        all:allBets.length,
        active:allBets.filter(b=>b.status==='active').length,
        won:allBets.filter(b=>b.status==='won').length,
        lost:allBets.filter(b=>b.status==='lost').length,
        cancelled:allBets.filter(b=>b.status==='cancelled').length,
        'cashed-out':allBets.filter(b=>b.status==='cashed-out').length
    };
    for(const[k,v]of Object.entries(c)){
        const e=document.getElementById(`cnt-${k}`);
        if(e)e.textContent=v;
    }
}

function filterBets(f){
    currentFilter=f;
    let fl=allBets;
    if(f!=='all') fl=allBets.filter(b=>b.status===f);
    
    const c=document.getElementById('bet-list-container');
    if(c){
        if(!fl.length){
            c.innerHTML=`<div class="empty-state"><i class="fas fa-ticket-alt"></i><p>No ${f==='all'?'':f} bets</p></div>`;
            return;
        }
        c.innerHTML=fl.map(b=>createBetCard(b)).join('');
    }
    startSettlementTimers();
}

const ht=bet._homeTeam||{name:'Home',logo:''},at=bet._awayTeam||{name:'Away',logo:''},hl=ht.logo||`https://ui-avatars.com/api/?name=${encodeURIComponent(ht.name?.substring(0,2)||'H')}&size=32&background=1a2332&color=00ff9d`,al=at.logo||`https://ui-avatars.com/api/?name=${encodeURIComponent(at.name?.substring(0,2)||'A')}&size=32&background=1a2332&color=ff9800`;let sh='';if(isAcc&&bet.selections?.length>0){sh=`<div class="selections-container"><div style="font-size:10px;color:var(--text2);margin-bottom:5px;">📋 ${bet.selections.length} Selections</div>${bet.selections.map(s=>`<div class="selection-item"><span class="selection-match">${escapeHtml(s.matchName||`#${s.fixtureId}`)}</span><span class="selection-pick">${escapeHtml(s.betTypeName||'')}</span><span class="selection-odds">@${s.odds}</span></div>`).join('')}</div>`;}const sd=bet._score?`<span class="bet-score-display${isLive?' live':''}">${bet._score.home} - ${bet._score.away}</span>`:'';const kd=bet._kickoff?formatFullDate(bet._kickoff):'TBD';const se=bet._kickoff?formatFullDate(new Date(new Date(bet._kickoff).getTime()+115*60000)):'TBD';

if(canCashout){const co2=bet._match?calculateRealCashout(bet,bet._match):null;const bc=co2&&co2.isLosing?'cashout-btn losing':'cashout-btn';ah+=`<button class="${bc}" onclick="event.stopPropagation();cashoutBet('${bet.id}')"><i class="fas fa-money-bill-wave"></i> Cash Out${co2?` ($${co2.value.toFixed(2)})`:''}</button>`;}
else if(canAccaCashout)ah+=`<button class="cashout-btn" onclick="event.stopPropagation();cashoutBet('${bet.id}')"><i class="fas fa-money-bill-wave"></i> Cash Out Acca</button>`;
else if(isActive&&!matchStarted)ah+=`<span class="action-info"><i class="fas fa-hourglass-start"></i> Cash out when live</span>`;
else if(isActive&&isLive&&!isPreMatch)ah+=`<span class="action-info locked"><i class="fas fa-shield-alt"></i> Live bet - Cash out locked</span>`;
else if(isActive&&matchStarted&&!isLive)ah+=`<span class="action-info"><i class="fas fa-flag-checkered"></i> Awaiting settlement</span>`;
ah+='</div>';}
return`<div class="bet-card ${bet.status}" onclick="showDetails('${bet.id}')"><div class="bet-top"><div><span class="bet-type-tag ${isAcc?'accumulator':'single'}">${isAcc?'ACCUMULATOR':'SINGLE'}</span><span class="bet-ticket-num">#${tk}</span>${!isPreMatch&&isActive?`<span class="live-bet-badge"><i class="fas fa-bolt"></i> LIVE BET</span>`:''}</div><span class="bet-status-badge ${bet.status}">${bet.status==='won'?'🏆 WON':bet.status==='lost'?'❌ LOST':bet.status==='cancelled'?'⛔ CANCELLED':bet.status==='cashed-out'?'💰 CASHED OUT':'⏳ ACTIVE'}</span></div><div class="bet-body"><div class="bet-match-row"><img class="team-logo-small" src="${hl}" onerror="this.style.display='none'" alt=""><div class="bet-match-name">${escapeHtml(ht.name||'Home')} <span style="color:var(--text2);">vs</span> ${escapeHtml(at.name||'Away')}${sd}</div><img class="team-logo-small" src="${al}" onerror="this.style.display='none'" alt=""></div><div class="bet-league">${escapeHtml(bet._league||'')}${bet._elapsed?` | ${bet._elapsed}'`:''} | ${ms.toUpperCase()}</div><div class="bet-pick">${escapeHtml(formatBetTypeName(bet.bet_type))} <span class="bet-odds">@${odds.toFixed(2)}</span></div></div>${sh}<div class="bet-meta-row"><span><i class="fas fa-calendar-plus"></i> Placed: ${formatFullDate(bet.placed_at)}</span><span><i class="fas fa-clock"></i> Kickoff: ${kd}</span>${isActive?`<span><i class="fas fa-hourglass-end"></i> Settle by: ${se}</span>`:''}</div>${cashoutPreview}<div class="bet-details-grid"><div class="bet-detail"><div class="lbl">Stake</div><div class="val">$${amt.toFixed(2)}</div></div><div class="bet-detail"><div class="lbl">${isActive?'Potential':'Payout'}</div><div class="val" style="color:${bet.status==='won'?'#4caf50':bet.status==='lost'?'var(--danger)':'#fff'}">$${pay.toFixed(2)}</div></div><div class="bet-detail"><div class="lbl">P/L</div><div class="val" style="color:${pr>=0?'#4caf50':'var(--danger)'}">${pr>=0?'+':''}$${Math.abs(pr).toFixed(2)}</div></div>${isActive?`<div class="be div class="modal-row"><span class="lbl">Placed</span><span>${placed.toLocaleString()}</span></div><div class="modal-row"><span class="lbl">Kickoff</span><span>${bet._kickoff?new Date(bet._kickoff).toLocaleString():'TBD'}</span></div><div class="modal-row"><span class="lbl">Est. Settlement</span><span>${bet._kickoff?new Date(new Date(bet._kickoff).getTime()+115*60000).toLocaleString():'TBD'}</span></div>${bet.settled_at?`<div class="modal-row"><span class="lbl">Settled</span><span>${new Date(bet.settled_at).toLocaleString()}</span></div>`:''}</div><div class="modal-section"><h4><i class="fas fa-info-circle"></i> Bet Details</h4><div class="modal-row"><span class="lbl">Pick</span><span>${escapeHtml(formatBetTypeName(bet.bet_type))}</span></div><div class="modal-row"><span class="lbl">Odds</span><span>${parseFloat(bet.odds||2).toFixed(2)}</span></div>${!isPreMatch?`<div class="modal-row"><span class="lbl">Cash Out</span><span style="color:var(--orange);">🔒 Locked (Live Bet)</span></div>`:''}</div>${sh}<div class="modal-section"><h4><i class="fas fa-chart-line"></i> Financial</h4><div class="modal-row"><span class="lbl">Stake</span><span>$${amt.toFixed(2)}</span></div><div class="modal-row"><span class="lbl">Potential</span><span>$${parseFloat(bet.potential_win||0).toFixed(2)}</span></div><div class="modal-row"><span class="lbl">Payout</span><span>$${pay.toFixed(2)}</span></div><div class="modal-row"><span class="lbl">P/L</span><span style="color:${pr>=0?'#4caf50':'var(--danger)'}">${pr>=0?'+':''}$${pr.toFixed(2)}</span></div></div>${bet.settlement_reason?`<div class="modal-section"><h4><i class="fas fa-gavel"></i> Settlement</h4><div class="modal-row"><span class="lbl">Reason</span><span>${escapeHtml(bet.settlement_reason)}</span></div></div>`:''}<div class="modal-section"><h4><i class="fas fa-headset"></i> Support</h4><div class="modal-row"><span class="lbl">Ticket</span><span><strong>${tk}</strong></span></div></div>`;m.classList.add('show');}

function exportBetsToCSV(){if(!allBets.length){alert('No bets');return;}const h=['Ticket','Date','Type','Match','Pick','Odds','Stake','Payout','P/L','Status'];const r=allBets.map(b=>{const a=parseFloat(b.amount||0),p=parseFloat(b.payout||b.potential_win||0),pr=b.status==='won'?p-a:(b.status==='lost'?-a:0);return['XL'+(b.id?.toString().slice(-8)||'00000000').toUpperCase(),new Date(b.placed_at).toLocaleDateString(),b.bet_type==='accumulator'?'Acca':'Single',b.match_name||'',formatBetTypeName(b.bet_type),parseFloat(b.odds||2).toFixed(2),a.toFixed(2),p.toFixed(2),(pr>=0?'+':'')+pr.toFixed(2),b.status];});const csv=h.join(',')+'\n'+r.map(r=>r.map(c=>`"${c}"`).join(',')).join('\n');const bl=new Blob([csv],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download=`xlodon-bets-${new Date().toISOString().split('T')[0]}.csv`;a.click();}
