<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Bets - X Lodon | رهاناتي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="../css/sports-betting.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0f1a; color: white; font-family: 'Segoe UI', 'Tajawal', sans-serif; min-height: 100vh; }
        .header { background: #111827; padding: 12px 15px; border-bottom: 2px solid #00ff9d; position: sticky; top: 0; z-index: 100; }
        .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .back-btn { color: #00ff9d; text-decoration: none; font-size: 20px; }
        .lang-toggle { background: #1a2332; border: 1px solid #00ff9d; color: #00ff9d; padding: 5px 12px; border-radius: 20px; font-size: 14px; cursor: pointer; }
        .tabs { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 3px; }
        .tab { padding: 8px 12px; background: #1a2332; border-radius: 20px; color: white; text-decoration: none; font-size: 12px; }
        .tab.active { background: #00ff9d; color: black; }
        .container { max-width: 1200px; margin: 0 auto; padding: 15px; }
        
        .settlement-panel { background: linear-gradient(135deg, #1a2332, #111827); border-radius: 16px; padding: 15px; margin-bottom: 20px; border: 1px solid #00ff9d33; }
        .settlement-title { color: #00ff9d; font-weight: 600; margin-bottom: 10px; }
        .settlement-actions { display: flex; gap: 10px; }
        .settle-btn { padding: 10px 20px; background: #00ff9d; color: black; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        
        .stats-cards { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; margin-bottom: 20px; }
        .stat-card { background: #111827; padding: 15px; border-radius: 12px; text-align: center; }
        .stat-value { font-size: 22px; font-weight: bold; color: #00ff9d; }
        
        .filter-bar { display: flex; gap: 5px; margin-bottom: 15px; flex-wrap: wrap; }
        .filter-btn { padding: 8px 12px; background: #1a2332; border: none; border-radius: 20px; color: #a0a8c9; font-size: 12px; cursor: pointer; }
        .filter-btn.active { background: #00ff9d; color: black; }
        
        .bet-card { background: #111827; border-radius: 16px; padding: 16px; margin-bottom: 12px; border-left: 4px solid #00ff9d; }
        .bet-card.won { border-left-color: #4caf50; }
        .bet-card.lost { border-left-color: #ff5252; }
        .bet-card.active { border-left-color: #ffc107; }
        .bet-card.single { border-left-color: #00ff9d; }
        .bet-card.accumulator { border-left-color: #ff9800; }
        
        .bet-header { display: flex; justify-content: space-between; margin-bottom: 12px; }
        .bet-status { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .bet-status.active { background: #ffc107; color: black; }
        .bet-status.won { background: #4caf50; color: white; }
        .bet-status.lost { background: #ff5252; color: white; }
        
        .bet-matches { margin-bottom: 12px; }
        .match-item { padding: 5px 0; }
        
        .bet-footer { display: flex; justify-content: space-between; margin-top: 12px; padding-top: 12px; border-top: 1px solid #ffffff11; }
        .payout-value { font-weight: 700; font-size: 18px; }
        .payout-value.won { color: #4caf50; }
        .payout-value.lost { color: #ff5252; }
        
        .cancel-btn { padding: 8px 16px; background: #ff525222; border: 1px solid #ff5252; color: #ff5252; border-radius: 8px; cursor: pointer; }
        
        .empty-state { text-align: center; padding: 50px; color: #a0a8c9; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-top">
            <div class="header-left">
                <a href="betting-sport.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
                <h1 style="font-size:18px;"><i class="fas fa-futbol"></i> My Bets</h1>
            </div>
            <button class="lang-toggle" onclick="toggleLanguage()">🇸🇦 عربي</button>
        </div>
        <div class="tabs">
            <a href="betting-sport.html" class="tab">Home</a>
            <a href="live-matches.html" class="tab">Live</a>
            <a href="upcoming-matches.html" class="tab">Upcoming</a>
            <a href="finished-matches.html" class="tab">Results</a>
            <a href="my-bets.html" class="tab active">My Bets</a>
        </div>
    </div>
    
    <div class="container">
        <div class="settlement-panel">
            <div class="settlement-title"><i class="fas fa-clock"></i> Settlement Status: <span id="settlement-status">Checking...</span></div>
            <div class="settlement-actions">
                <button class="settle-btn" onclick="forceSettlement()"><i class="fas fa-gavel"></i> Settle All Finished Matches</button>
                <button class="settle-btn" style="background:#ff9800;" onclick="checkPendingSettlements()"><i class="fas fa-search"></i> Check Pending</button>
            </div>
        </div>
        
        <div class="stats-cards">
            <div class="stat-card"><div>Total Bets</div><div class="stat-value" id="total-bets">0</div></div>
            <div class="stat-card"><div>Win Rate</div><div class="stat-value" id="win-rate">0%</div></div>
        </div>
        
        <div class="filter-bar">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="won">Won</button>
            <button class="filter-btn" data-filter="lost">Lost</button>
        </div>
        
        <div id="bets-container"></div>
        <div id="empty-state" class="empty-state" style="display:none;"><i class="fas fa-ticket-alt" style="font-size:48px; opacity:0.3;"></i><p>No bets found</p></div>
    </div>

    <script src="../js/betting-engine.js"></script>
    <script src="../js/sports-api.js"></script>
    <script>
        function toggleLanguage() { location.reload(); }
        
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), db = firebase.firestore();
        let allBets = [], currentFilter = 'all';
        
        auth.onAuthStateChanged(u => { if (!u) location.href = '../login.html'; else loadBets(); });
        
        function loadBets() {
            db.collection('bets').where('userId', '==', auth.currentUser.uid).orderBy('placedAt', 'desc').onSnapshot(snap => {
                allBets = []; snap.forEach(d => allBets.push({ id: d.id, ...d.data() }));
                updateStats(); filterBets(currentFilter); checkSettlementStatus();
            });
        }
        
        function updateStats() {
            const total = allBets.length;
            const won = allBets.filter(b => b.status === 'won').length;
            document.getElementById('total-bets').textContent = total;
            document.getElementById('win-rate').textContent = total ? ((won/total)*100).toFixed(1) + '%' : '0%';
        }
        
        function checkSettlementStatus() {
            const pending = allBets.filter(b => b.status === 'active').length;
            const finishedPending = allBets.filter(b => b.status === 'active' && b.matchFinished).length;
            document.getElementById('settlement-status').textContent = `${pending} active bets (${finishedPending} awaiting settlement)`;
        }
        
        async function forceSettlement() {
            if (typeof settleAllFinishedMatches === 'function') {
                const settled = await settleAllFinishedMatches();
                alert(`Settled ${settled} bets`);
            } else { alert('Settlement function not available'); }
        }
        
        async function checkPendingSettlements() {
            const activeBets = allBets.filter(b => b.status === 'active');
            let pending = 0;
            for (const bet of activeBets) {
                if (bet.fixtureId) {
                    const m = await db.collection('sports_matches').doc(String(bet.fixtureId)).get();
                    if (m.exists && m.data().status === 'finished') pending++;
                }
            }
            alert(`${pending} bets ready for settlement`);
        }
        
        function filterBets(filter) {
            currentFilter = filter;
            let filtered = allBets;
            if (filter === 'active') filtered = allBets.filter(b => b.status === 'active');
            else if (filter === 'won') filtered = allBets.filter(b => b.status === 'won');
            else if (filter === 'lost') filtered = allBets.filter(b => b.status === 'lost');
            displayBets(filtered);
        }
        
        function displayBets(bets) {
            const container = document.getElementById('bets-container');
            const empty = document.getElementById('empty-state');
            if (!bets.length) { container.style.display = 'none'; empty.style.display = 'block'; return; }
            container.style.display = 'block'; empty.style.display = 'none';
            container.innerHTML = ''; bets.forEach(b => container.appendChild(createCard(b)));
        }
        
        function createCard(bet) {
            const card = document.createElement('div');
            const isAcc = bet.selections && bet.selections.length > 0;
            card.className = `bet-card ${isAcc ? 'accumulator' : 'single'} ${bet.status}`;
            
            const placed = bet.placedAt?.toDate() || new Date();
            const statusText = bet.status === 'active' ? 'Active' : bet.status === 'won' ? 'Won' : bet.status === 'lost' ? 'Lost' : 'Settled';
            
            let matchesHtml = isAcc ? `${bet.selections.length} selections` : (bet.matchName || 'Match');
            let payout = bet.status === 'won' ? '+' + (bet.payout || bet.potentialWin).toFixed(2) : bet.status === 'lost' ? '-' + bet.amount.toFixed(2) : (bet.potentialWin || 0).toFixed(2);
            
            card.innerHTML = `
                <div class="bet-header"><span>${isAcc ? '🎲 Accumulator' : '🎯 Single'}</span><span class="bet-status ${bet.status}">${statusText}</span></div>
                <div class="bet-matches"><div class="match-item">${matchesHtml}</div></div>
                <div class="bet-footer"><span>Stake: $${(bet.amount||0).toFixed(2)}</span><span class="payout-value ${bet.status}">$${payout}</span></div>
                ${bet.status === 'active' ? `<button class="cancel-btn" onclick="cancelBet('${bet.id}')">Cancel</button>` : ''}
                <div style="color:#a0a8c9; font-size:11px; margin-top:8px;">${placed.toLocaleString()}</div>
            `;
            return card;
        }
        
        window.cancelBet = async id => { if (confirm('Cancel bet?')) { const r = await cancelBetWithFee(id); alert(r.success ? 'Refunded: $' + r.refund.toFixed(2) : r.error); } };
        window.forceSettlement = forceSettlement;
        window.checkPendingSettlements = checkPendingSettlements;
        
        document.querySelectorAll('.filter-btn').forEach(b => b.addEventListener('click', function() {
            document.querySelectorAll('.filter-btn').forEach(x => x.classList.remove('active'));
            this.classList.add('active'); filterBets(this.dataset.filter);
        }));
    </script>
</body>
</html>
