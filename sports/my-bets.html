<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Bets - X London | Sports Betting</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    
    <style>
        :root {
            --bg-primary: #0a0f1a; --bg-secondary: #111827; --bg-tertiary: #1a2332;
            --accent: #00ff9d; --accent2: #ff9800; --danger: #ff5252; --success: #4caf50;
            --orange: #ff9800; --red: #ff5252; --purple: #9c27b0; --blue: #00bcd4;
            --text-primary: #ffffff; --text-secondary: #a0a8c9; --border: rgba(255,255,255,0.1);
            --card-shadow: 0 4px 20px rgba(0,0,0,0.3);
            --card-hover-shadow: 0 8px 30px rgba(0,255,157,0.1);
            --transition-fast: 0.15s ease;
            --transition-smooth: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        body.light-theme {
            --bg-primary: #f3f4f6; --bg-secondary: #ffffff; --bg-tertiary: #e5e7eb;
            --text-primary: #111827; --text-secondary: #4b5563; --border: rgba(0,0,0,0.1);
            --card-shadow: 0 4px 20px rgba(0,0,0,0.08);
            --card-hover-shadow: 0 8px 30px rgba(0,0,0,0.12);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg-primary); color: var(--text-primary);
            font-family: 'Segoe UI', 'Tajawal', sans-serif; min-height: 100vh;
            overflow-x: hidden; transition: background var(--transition-smooth), color var(--transition-smooth);
            -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-secondary); }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 3px; }
        
        .offline-banner {
            position: fixed; top: 0; left: 0; right: 0; z-index: 10000;
            background: var(--danger); color: #fff; text-align: center;
            padding: 8px; font-size: 12px; font-weight: 600;
            display: none; align-items: center; justify-content: center; gap: 8px;
        }
        .offline-banner.show { display: flex; }
        .offline-banner i { animation: pulse 1.5s infinite; }
        
        .header {
            background: var(--bg-secondary); padding: 12px 20px;
            border-bottom: 2px solid var(--accent); display: flex; align-items: center;
            gap: 15px; flex-wrap: wrap; position: sticky; top: 0; z-index: 100;
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        }
        .back-btn {
            color: var(--accent); text-decoration: none; font-size: 18px; cursor: pointer;
            background: none; border: none; padding: 8px 12px; border-radius: 8px;
            transition: all var(--transition-fast); display: flex; align-items: center; gap: 6px;
        }
        .back-btn:hover { background: rgba(0,255,157,0.1); transform: translateX(-2px); }
        .btn-action-tool {
            background: var(--bg-tertiary); border: 1px solid var(--border);
            color: var(--text-primary); padding: 8px 14px; border-radius: 8px;
            cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 6px;
            transition: all var(--transition-fast); font-weight: 500;
        }
        .btn-action-tool:hover { border-color: var(--accent); transform: translateY(-1px); }
        .btn-action-tool:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        
        .last-updated {
            font-size: 10px; color: var(--text-secondary); text-align: right;
            margin-bottom: 15px; display: flex; align-items: center; justify-content: flex-end; gap: 6px;
        }
        .rate-limit-indicator {
            display: inline-flex; align-items: center; gap: 4px;
            font-size: 9px; color: var(--accent2); margin-left: 8px; animation: pulse 1s infinite;
        }
        .backend-status {
            display: inline-flex; align-items: center; gap: 4px;
            font-size: 9px; color: var(--success); margin-left: 8px;
        }
        .backend-status.offline { color: var(--danger); }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        
        .balance-bar {
            background: linear-gradient(135deg, var(--bg-secondary), var(--bg-tertiary));
            padding: 18px 24px; border-radius: 16px; margin-bottom: 20px;
            display: flex; justify-content: space-between; align-items: center;
            border: 1px solid rgba(0,255,157,0.15); box-shadow: var(--card-shadow);
        }
        .balance-amount { color: var(--accent); font-weight: 700; font-size: 24px; letter-spacing: -0.5px; }
        .balance-label { font-size: 13px; color: var(--text-secondary); display: flex; align-items: center; gap: 8px; }
        
        .settlement-status-banner {
            display: flex; align-items: center; gap: 10px; padding: 10px 16px;
            border-radius: 10px; font-size: 12px; font-weight: 600; margin-bottom: 15px;
            background: rgba(0,255,157,0.08); border: 1px solid rgba(0,255,157,0.15); color: var(--accent);
        }
        .settlement-status-banner.running { background: rgba(255,152,0,0.08); border: 1px solid rgba(255,152,0,0.15); color: var(--orange); }
        .settlement-status-banner.error { background: rgba(255,82,82,0.08); border: 1px solid rgba(255,82,82,0.15); color: var(--danger); }
        
        .stats-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 20px; }
        .stat-box {
            background: var(--bg-secondary); padding: 16px 12px; border-radius: 14px;
            text-align: center; border: 1px solid rgba(255,255,255,0.04);
            transition: all var(--transition-smooth); cursor: default;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .stat-box:hover { transform: translateY(-3px); border-color: rgba(0,255,157,0.2); box-shadow: var(--card-hover-shadow); }
        .stat-box .val { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }
        .stat-box .lbl { font-size: 10px; color: var(--text-secondary); margin-top: 5px; text-transform: uppercase; letter-spacing: 0.8px; font-weight: 600; }
        .stat-box .sub { font-size: 10px; margin-top: 3px; font-weight: 500; }
        
        .win-rate-container { margin-bottom: 20px; }
        .win-rate-label { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-secondary); margin-bottom: 6px; font-weight: 500; }
        .win-rate-bar { height: 6px; background: var(--bg-tertiary); border-radius: 3px; overflow: hidden; }
        .win-rate-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--success)); border-radius: 3px; transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        
        .search-wrapper { margin-bottom: 18px; }
        .search-input-container { position: relative; }
        .search-input-container i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); font-size: 14px; }
        #bet-search-input {
            width: 100%; padding: 12px 16px 12px 40px; background: var(--bg-secondary);
            border: 1px solid var(--border); color: var(--text-primary); border-radius: 12px;
            font-size: 13px; outline: none; transition: border-color var(--transition-fast);
        }
        #bet-search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,255,157,0.08); }
        
        .filter-row { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 6px; scroll-behavior: smooth; }
        .filter-row::-webkit-scrollbar { height: 3px; }
        .filter-row::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 3px; }
        .filter-chip {
            padding: 9px 16px; background: var(--bg-tertiary); border: 1px solid transparent;
            border-radius: 25px; color: var(--text-secondary); font-size: 12px; font-weight: 600;
            cursor: pointer; white-space: nowrap; transition: all var(--transition-fast); user-select: none;
        }
        .filter-chip:hover { border-color: var(--accent); color: var(--text-primary); }
        .filter-chip.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 700; }
        .filter-chip .count { background: rgba(255,255,255,0.12); color: inherit; padding: 2px 7px; border-radius: 10px; font-size: 10px; margin-left: 6px; font-weight: 600; }
        .filter-chip.active .count { background: rgba(0,0,0,0.18); }
        
        .bet-card {
            background: var(--bg-secondary); border-radius: 16px; padding: 18px;
            margin-bottom: 14px; border-left: 5px solid var(--orange); cursor: pointer;
            transition: all var(--transition-smooth); position: relative;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1); overflow: hidden;
        }
        .bet-card::after { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(135deg, transparent, rgba(0,255,157,0.02)); pointer-events: none; opacity: 0; transition: opacity var(--transition-smooth); }
        .bet-card:hover { transform: translateX(4px); box-shadow: var(--card-hover-shadow); }
        .bet-card:hover::after { opacity: 1; }
        .bet-card.won { border-left-color: var(--success); }
        .bet-card.lost { border-left-color: var(--danger); }
        .bet-card.cancelled { border-left-color: var(--purple); }
        .bet-card.cashed-out { border-left-color: var(--blue); }
        .bet-card.processing { opacity: 0.65; pointer-events: none; filter: grayscale(20%); }
        .bet-card.render-error { border-left-color: var(--danger); opacity: 0.7; }
        .bet-card.just-settled { animation: settleGlow 2s ease-out; }
        @keyframes settleGlow { 0% { box-shadow: 0 0 0 0 rgba(0,255,157,0.6); } 50% { box-shadow: 0 0 30px 5px rgba(0,255,157,0.3); } 100% { box-shadow: var(--card-shadow); } }
        
        .bet-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 10px; }
        .bet-type-tag { padding: 5px 12px; border-radius: 20px; font-size: 10px; font-weight: 700; letter-spacing: 0.5px; white-space: nowrap; }
        .bet-type-tag.single { background: rgba(0,255,157,0.12); color: var(--accent); }
        .bet-type-tag.accumulator { background: rgba(255,152,0,0.12); color: var(--orange); }
        .bet-ticket-num { font-size: 10px; color: var(--text-secondary); font-family: 'Courier New', monospace; margin-left: 8px; letter-spacing: 0.3px; }
        .live-bet-badge { display: inline-flex; align-items: center; gap: 4px; background: rgba(255,82,82,0.18); color: var(--danger); padding: 3px 10px; border-radius: 10px; font-size: 9px; font-weight: 700; margin-left: 6px; animation: pulse 1.5s infinite; }
        .bet-status-badge { display: inline-flex; align-items: center; gap: 5px; padding: 5px 14px; border-radius: 20px; font-size: 11px; font-weight: 700; white-space: nowrap; }
        .bet-status-badge.won { background: rgba(76,175,80,0.15); color: var(--success); }
        .bet-status-badge.lost { background: rgba(255,82,82,0.15); color: var(--danger); }
        .bet-status-badge.cancelled { background: rgba(156,39,176,0.15); color: var(--purple); }
        .bet-status-badge.cashed-out { background: rgba(0,188,212,0.15); color: var(--blue); }
        .bet-status-badge.active { background: rgba(255,152,0,0.15); color: var(--orange); }
        
        .bet-body { margin-bottom: 12px; }
        .bet-match-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
        .team-logo-small { width: 38px; height: 38px; object-fit: contain; border-radius: 50%; background: rgba(255,255,255,0.06); padding: 4px; border: 1px solid rgba(255,255,255,0.08); }
        .bet-match-name { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .bet-score-display { font-family: 'Courier New', monospace; font-size: 13px; font-weight: 700; color: var(--accent); background: var(--bg-primary); padding: 3px 10px; border-radius: 6px; letter-spacing: 1px; }
        .bet-score-display.live { color: var(--danger); animation: blink 1s infinite; }
        .bet-league { font-size: 10px; color: var(--text-secondary); margin-bottom: 5px; font-weight: 500; }
        .bet-pick { color: var(--accent); font-size: 12px; font-weight: 700; }
        .bet-pick span { color: var(--accent2); font-weight: 700; margin-left: 5px; }
        
        .selections-container { margin-top: 10px; padding: 12px; background: var(--bg-tertiary); border-radius: 10px; }
        .selection-item { display: flex; justify-content: space-between; gap: 8px; padding: 7px 0; border-bottom: 1px dashed rgba(255,255,255,0.06); font-size: 11px; flex-wrap: wrap; }
        .selection-item:last-child { border-bottom: none; }
        .selection-match { flex: 1; font-weight: 500; min-width: 100px; }
        .selection-pick { color: var(--accent); font-weight: 600; }
        .selection-odds { color: var(--accent2); font-weight: 700; }
        
        .bet-meta-row { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 10px; color: var(--text-secondary); }
        .bet-meta-row span { display: flex; align-items: center; gap: 5px; }
        .bet-meta-row i { color: var(--accent); font-size: 11px; }
        
        .cashout-preview { display: flex; flex-direction: column; gap: 10px; background: rgba(0,255,157,0.04); padding: 14px; border-radius: 10px; margin-top: 10px; border: 1px dashed rgba(0,255,157,0.18); font-size: 11px; }
        .cashout-metrics { display: flex; justify-content: space-between; font-weight: 600; flex-wrap: wrap; gap: 8px; }
        .partial-cashout-box { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.04); padding: 8px 12px; border-radius: 8px; }
        .partial-slider { flex: 1; accent-color: var(--accent); cursor: pointer; height: 4px; }
        
        .bet-details-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding-top: 14px; text-align: center; }
        .bet-details-grid .bet-detail .lbl { font-size: 9px; color: var(--text-secondary); text-transform: uppercase; margin-bottom: 5px; letter-spacing: 0.5px; }
        .bet-details-grid .bet-detail .val { font-size: 14px; font-weight: 700; }
        
        .settlement-timer { font-family: 'Courier New', monospace; color: var(--accent); font-size: 13px; font-weight: 700; }
        .settlement-timer.urgent { color: var(--danger) !important; animation: pulse 1s infinite; }
        
        .bet-result-row { display: flex; align-items: center; gap: 8px; margin-top: 12px; padding: 10px 12px; border-radius: 8px; font-size: 12px; font-weight: 500; }
        .bet-result-row.won { background: rgba(76,175,80,0.08); color: var(--success); border: 1px solid rgba(76,175,80,0.18); }
        .bet-result-row.lost { background: rgba(255,82,82,0.08); color: var(--danger); border: 1px solid rgba(255,82,82,0.18); }
        
        .bet-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.05); }
        .bet-action-row-buttons { display: flex; gap: 10px; width: 100%; flex-wrap: wrap; }
        .bet-actions button { flex: 1; min-width: 100px; padding: 11px 16px; border: none; border-radius: 10px; font-size: 12px; font-weight: 700; cursor: pointer; transition: all var(--transition-fast); display: flex; align-items: center; justify-content: center; gap: 7px; letter-spacing: 0.3px; }
        .bet-actions button:disabled { opacity: 0.45; cursor: not-allowed; transform: none !important; }
        .cancel-btn { background: rgba(255,82,82,0.12); color: var(--danger); border: 1px solid rgba(255,82,82,0.25); }
        .cancel-btn:hover:not(:disabled) { background: var(--danger); color: #fff; transform: translateY(-1px); }
        .cashout-btn { background: var(--blue); color: #000; }
        .cashout-btn:hover:not(:disabled) { background: #00d2ff; transform: translateY(-1px); }
        
        .settlement-info-bar { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 8px; font-size: 11px; margin-top: 12px; }
        .settlement-info-bar.auto { background: rgba(0,255,157,0.06); color: var(--accent); border: 1px solid rgba(0,255,157,0.12); }
        .settlement-info-bar.admin { background: rgba(255,152,0,0.06); color: var(--accent2); border: 1px solid rgba(255,152,0,0.12); }
        .settlement-info-bar.backend { background: rgba(156,39,176,0.06); color: #ce93d8; border: 1px solid rgba(156,39,176,0.12); }
        
        .empty-state { text-align: center; padding: 70px 20px; color: var(--text-secondary); }
        .empty-state i { font-size: 56px; margin-bottom: 16px; color: var(--accent); opacity: 0.2; display: block; }
        
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); z-index: 1000; display: none; align-items: center; justify-content: center; opacity: 0; transition: opacity var(--transition-smooth); backdrop-filter: blur(4px); }
        .modal-overlay.show { display: flex; opacity: 1; }
        .modal-content { background: var(--bg-secondary); border-radius: 20px; width: 520px; max-width: 95vw; max-height: 90vh; overflow-y: auto; padding: 28px; border: 1px solid rgba(0,255,157,0.15); position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
        .modal-close { position: absolute; top: 14px; right: 14px; background: var(--bg-tertiary); border: none; color: var(--text-primary); font-size: 22px; cursor: pointer; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: all var(--transition-fast); }
        .modal-close:hover { background: var(--danger); color: #fff; }
        .modal-section { margin-bottom: 22px; }
        .modal-section h4 { color: var(--accent); font-size: 13px; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.8px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 8px; font-weight: 700; }
        .modal-row { display: flex; justify-content: space-between; padding: 7px 0; font-size: 12px; border-bottom: 1px dashed rgba(255,255,255,0.04); gap: 12px; }
        .modal-row:last-child { border-bottom: none; }
        .modal-row .lbl { color: var(--text-secondary); font-weight: 500; }
        
        #loading { text-align: center; padding: 60px 20px; }
        .spinner-large { width: 44px; height: 44px; border: 4px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto; }
        
        .notification { position: fixed; top: 20px; right: 20px; padding: 14px 22px; border-radius: 14px; color: #fff; font-size: 13px; font-weight: 600; z-index: 9999; animation: slideIn 0.35s cubic-bezier(0.4, 0, 0.2, 1); max-width: 380px; box-shadow: 0 10px 40px rgba(0,0,0,0.4); display: flex; align-items: center; gap: 10px; line-height: 1.4; pointer-events: none; }
        
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }
        @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0.3; } }
        @keyframes slideIn { from { transform: translateX(120%); opacity:0; } to { transform: translateX(0); opacity:1; } }
        
        @media(max-width:768px) { .stats-grid { grid-template-columns: repeat(3, 1fr); } .bet-details-grid { grid-template-columns: repeat(2, 1fr); gap: 14px; } .header { padding: 10px 14px; gap: 10px; } .header h1 { font-size: 16px; } }
        @media(max-width:400px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } .bet-actions button { font-size: 11px; padding: 10px; } }
    </style>
</head>
<body>
    <div class="offline-banner" id="offline-banner"><i class="fas fa-wifi"></i> You are offline. Some features may be unavailable.</div>
    
    <div class="header">
        <a class="back-btn" href="https://xlodon.co.uk/sports/betting-sport.html"><i class="fas fa-arrow-left"></i> Back</a>
        <h1 style="font-size:18px;font-weight:700;"><i class="fas fa-layer-group"></i> My Bets</h1>
        <button class="btn-action-tool" id="themeToggleBtn"><i class="fas fa-adjust"></i> Theme</button>
        <button class="btn-action-tool" id="langToggleBtn">عربي</button>
        <button class="btn-action-tool" id="refreshBtn" title="Refresh bets"><i class="fas fa-sync-alt"></i></button>
    </div>
    
    <div class="container">
        <div class="balance-bar">
            <span class="balance-label"><i class="fas fa-wallet"></i> Your Balance</span>
            <span class="balance-amount" id="balance-display">$0.00</span>
        </div>
        
        <div class="last-updated" id="last-updated">
            <i class="fas fa-clock"></i> <span id="last-updated-text">Loading...</span>
            <span class="rate-limit-indicator" id="rate-indicator" style="display:none;"><i class="fas fa-hourglass-half"></i> Rate limited</span>
            <span class="backend-status" id="backend-status"><i class="fas fa-shield-alt"></i> <span id="backend-status-text">Backend: Checking...</span></span>
        </div>
        
        <div id="settlement-status" class="settlement-status-banner" style="display:none;">
            <i class="fas fa-sync-alt fa-spin"></i>
            <span id="settlement-status-text">Settling bets...</span>
            <span id="settlement-status-count" style="margin-left:auto;font-family:monospace;"></span>
        </div>
        
        <div class="search-wrapper">
            <div class="search-input-container">
                <i class="fas fa-search"></i>
                <input type="text" id="bet-search-input" placeholder="Search by team, league, or ticket #...">
            </div>
        </div>
        
        <div id="loading">
            <div class="spinner-large"></div>
            <div style="margin-top:14px;font-size:16px;font-weight:600;">Loading your bets...</div>
            <div id="loading-status" style="font-size:11px;color:var(--accent2);margin-top:6px;"></div>
        </div>
        
        <div id="content" style="display:none;">
            <div class="stats-grid">

class RateLimiter {
    constructor(maxCalls, windowMs) { this.maxCalls = maxCalls; this.windowMs = windowMs; this.calls = []; }
    async acquire() {
        const now = Date.now(); this.calls = this.calls.filter(t => now - t < this.windowMs);
        if (this.calls.length < this.maxCalls) { this.calls.push(now); return true; }
        if (CONFIG.RATE_LIMIT_QUEUE_ENABLED) {
            const wait = this.calls[0] + this.windowMs - now + 100;
            document.getElementById('rate-indicator').style.display = 'inline-flex';
            await new Promise(r => setTimeout(r, wait));
            document.getElementById('rate-indicator').style.display = 'none';
            this.calls.push(Date.now()); return true;
        }
        return false;
    }
}

function generateIdempotencyKey(betId, action) {
    const timestamp = Date.now().toString(36);
    const random = Math.random().toString(36).substring(2, 10);
    return `${action}_${betId}_${timestamp}_${random}`;
}

function isIdempotencyKeyUsed(key) {
    if (idempotencyKeysUsed.has(key)) return true;
    try {
        const usedKeys = JSON.parse(localStorage.getItem('xl_idempotency_keys') || '[]');
        return usedKeys.includes(key);
    } catch (e) { return false; }
}

function markIdempotencyKeyUsed(key) {
    idempotencyKeysUsed.add(key);
    try {
        const usedKeys = JSON.parse(localStorage.getItem('xl_idempotency_keys') || '[]');
        usedKeys.push(key);
        if (usedKeys.length > 200) usedKeys.splice(0, usedKeys.length - 200);
        localStorage.setItem('xl_idempotency_keys', JSON.stringify(usedKeys));
    } catch (e) { debugWarn('Failed to store idempotency key:', e.message); }
}

// ║  v18.3: LOCALSTORAGE WITH QUOTA HANDLING                    ║

function safeLocalStorageSet(key, value) {
    try { localStorage.setItem(key, value); return true; } catch (e) {
        if (e.name === 'QuotaExceededError') { cleanOldStorageEntries(); try { localStorage.setItem(key, value); return true; } catch (e2) { return false; } }
        return false;
    }
}
function safeLocalStorageGet(key, dv = null) { try { const v = localStorage.getItem(key); return v !== null ? v : dv; } catch (e) { return dv; } }
function cleanOldStorageEntries() {
    try {
        const now = Date.now(), ttl = CONFIG.STORAGE_TTL_DAYS * 24 * 60 * 60 * 1000, toRemove = [];
        for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k?.startsWith('xl_')) { try { const d = JSON.parse(localStorage.getItem(k)); if (d?._timestamp && (now - d._timestamp) > ttl) toRemove.push(k); } catch (e) { toRemove.push(k); } } }
        toRemove.forEach(k => localStorage.removeItem(k)); if (toRemove.length) debugLog(`🧹 Cleaned ${toRemove.length} expired localStorage entries`);
    } catch (e) {}
}

const SettlementAPI = (function() {
    async function _callEdgeFunction(payload) {
        if (!backendOnline) return Result.fail('Backend offline');
        
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), CONFIG.EDGE_FUNCTION_TIMEOUT_MS);
        
        try {
            const session = supabaseClient.auth.session();
            const accessToken = session?.access_token || '';
            
            const response = await fetch(EDGE_FUNCTION_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${accessToken}`,
                    'X-Idempotency-Key': payload.idempotencyKey,
                    'X-Client-Version': '18.3'
                },
                body: JSON.stringify(payload),
                signal: controller.signal
            });
            
            clearTimeout(timeout);
            
            if (!response.ok) {
                const errorBody = await response.text();
                debugError(`Edge Function returned ${response.status}: ${errorBody}`);
                return Result.fail(`Server error: ${response.status}`);
            }
            
            const result = await response.json();
            
            if (result.success) {
                markIdempotencyKeyUsed(payload.idempotencyKey);
                return Result.ok(result.data);
            } else {
                return Result.fail(result.error || 'Settlement failed');
            }
        } catch (e) {
            clearTimeout(timeout);
            if (e.name === 'AbortError') return Result.fail('Settlement request timed out');
            debugError('Edge Function call failed:', e.message);
            return Result.fail(e.message);
        }
    }
    
    return {
        async requestSettlement(betId, userId, fixtureId, matchData) {
            const idempotencyKey = generateIdempotencyKey(betId, 'settle');
            if (isIdempotencyKeyUsed(idempotencyKey)) { debugLog(`Idempotency key already used for bet ${betId}`); return Result.fail('Duplicate prevented'); }
            return await _callEdgeFunction({
                action: 'settle', idempotencyKey, betId, userId, fixtureId,
                matchData: matchData ? { status: matchData.status, goals_home: matchData.goals_home, goals_away: matchData.goals_away, elapsed: matchData.elapsed } : null,
                timestamp: new Date().toISOString()
            });
        },
        async requestCashout(betId, userId, cashoutAmount, partialPct) {
            const idempotencyKey = generateIdempotencyKey(betId, 'cashout');
            if (isIdempotencyKeyUsed(idempotencyKey)) { debugLog(`Idempotency key already used for cashout ${betId}`); return Result.fail('Duplicate prevented'); }
            return await _callEdgeFunction({
                action: 'cashout', idempotencyKey, betId, userId, cashoutAmount, partialPct, timestamp: new Date().toISOString()
            });
        },
        async requestCancellation(betId, userId, refundAmount) {
            const idempotencyKey = generateIdempotencyKey(betId, 'cancel');
            if (isIdempotencyKeyUsed(idempotencyKey)) { debugLog(`Idempotency key already used for cancel ${betId}`); return Result.fail('Duplicate prevented'); }
            return await _callEdgeFunction({
                action: 'cancel', idempotencyKey, betId, userId, refundAmount,
                cancellationFee: CONFIG.CANCELLATION_FEE_PERCENT, timestamp: new Date().toISOString()
            });
        }
    };
})();

// ║  SETTLEMENT MANAGER v18.3 — FRONTEND ORCHESTRATION ONLY    ║
// ╚══════════════════════════════════════════════════════════════╝
class DuplicateProofSettlementManager {
    constructor(userId) {
        this.userId = userId; this.isRunning = false;
        this.emergencyStop = safeLocalStorageGet('xl_emergency_stop') === 'true';
        this.settledBetIds = this._loadSet('xl_settled_ids');
    }
    _loadSet(key) { try { const r = safeLocalStorageGet(`${key}_${this.userId}`); if (!r) return new Set(); const p = JSON.parse(r); return new Set(Array.isArray(p) ? p : p._data || []); } catch (e) { return new Set(); } }
    _saveSet(key, s) { const a = [...s]; safeLocalStorageSet(`${key}_${this.userId}`, JSON.stringify({ _data: a.length > CONFIG.MAX_STORED_IDS ? a.slice(-Math.floor(CONFIG.MAX_STORED_IDS * 0.8)) : a, _timestamp: Date.now() })); }

    async processBets(bets) {
        if (this.emergencyStop || this.isRunning || !isOnline) return { processed: 0, duplicates: 0, errors: 0 };
        this.isRunning = true;
        let processed = 0, duplicates = 0, errors = 0;
        try {
            const pending = bets.filter(b => b.status === 'active' && !this.settledBetIds.has(b.id) && !processingBetIds.has(b.id));
            if (!pending.length) return { processed: 0, duplicates: 0, errors: 0 };
            const { cleanBets, duplicateCount } = await this._handleDuplicates(pending);
            duplicates = duplicateCount;
            const fids = [...new Set(cleanBets.flatMap(b => [b.fixture_id, ...(b.selections || []).map(s => s.fixtureId || s.fixture_id)].filter(Boolean)))];
            let mm = {}; if (fids.length && await apiRateLimiter.acquire()) mm = await this._fetchMatchesWithRetry(fids, CONFIG.MATCH_FETCH_MAX_RETRIES);
            const totalBets = cleanBets.length; let completedBets = 0;
            showSettlementStatus(`Settling ${totalBets} bets...`, `0/${totalBets}`, true);
            
            for (let i = 0; i < cleanBets.length; i += CONFIG.BATCH_SIZE) {
                const batch = cleanBets.slice(i, i + CONFIG.BATCH_SIZE);
                await Promise.allSettled(batch.map(async (bet) => {
                    try {
                        if (this.settledBetIds.has(bet.id) || processingBetIds.has(bet.id)) return;
                        processingBetIds.add(bet.id);
                        const check = this._checkSettlementReadiness(bet, mm);
                        if (!check.isOk()) { processingBetIds.delete(bet.id); completedBets++; showSettlementStatus(`Settling bets...`, `${completedBets}/${totalBets}`, true); return; }
                        
                        if (CONFIG.BACKEND_SETTLEMENT_ENABLED && backendOnline) {
                            const result = await SettlementAPI.requestSettlement(bet.id, bet.user_id, bet.fixture_id, mm[bet.fixture_id] || null);
                            if (result.isOk()) {
                                const d = result.getData();
                                Object.assign(bet, { status: d.status, payout: d.payout, profit_loss: d.profit_loss, settlement_reason: d.settlement_reason, settled_at: d.settled_at, settled_by: 'backend' });
                                this.settledBetIds.add(bet.id); this._saveSet('xl_settled_ids', this.settledBetIds);
                                newlySettledBetIds.add(bet.id); processed++;
                            } else { errors++; }
                        }
                    } catch (err) { errors++; } finally { processingBetIds.delete(bet.id); completedBets++; showSettlementStatus(`Settling bets...`, `${completedBets}/${totalBets}`, true); }
                }));
            }
        } catch (err) { errors++; } finally { this.isRunning = false; showSettlementStatus(null); if (processed > 0) showNotification(`✅ ${processed} bet${processed > 1 ? 's' : ''} settled`, 'settlement'); }
        return { processed, duplicates, errors };
    }

    _checkSettlementReadiness(bet, mm) {
        if (bet.selections?.length > 0) {
            if (CONFIG.ACCA_EARLY_SETTLE_ENABLED) for (const sel of bet.selections) { const fid = sel.fixtureId || sel.fixture_id, m = mm[fid]; if (m && ['FINISHED','FT','AET','PEN'].includes((m.status||'').toUpperCase())) { const r = this._determineResultLocal({ bet_type: sel.betType || sel.bet_type }, m); if (r && r.won === false && !r.refund) return Result.ok({ ready: true, reason: 'early_loss' }); } }
            return Result.fail('Not all legs confirmed');
        }
        const match = mm[bet.fixture_id]; if (!match) return Result.fail('No match data');
        const ms = (match.status || '').toUpperCase(), isFinished = ['FINISHED','FT','AET','PEN'].includes(ms);
        const ko = bet._kickoff ? new Date(bet._kickoff) : null, isTE = ko && (new Date() >= new Date(ko.getTime() + CONFIG.SETTLEMENT_TIMEOUT_MINUTES * 60000));
        if (isFinished) { const now = new Date(), est = ko ? new Date(ko.getTime() + 105 * 60000) : now; if (now < new Date(est.getTime() + CONFIG.SETTLEMENT_GRACE_PERIOD_MINUTES * 60000)) return Result.fail('Grace period'); return Result.ok({ ready: true, reason: 'match_finished' }); }
        if (isTE) return Result.ok({ ready: true, reason: 'timer_expired' });
        return Result.fail('Not ready');
    }

    _determineResultLocal(bet, match) { const hg=parseInt(match.goals_home||0),ag=parseInt(match.goals_away||0),tg=hg+ag; const map={home:{won:hg>ag,reason:`${hg}-${ag} (Home)`},away:{won:ag>hg,reason:`${hg}-${ag} (Away)`},draw:{won:hg===ag,reason:`${hg}-${ag} (Draw)`},'1X':{won:hg>=ag,reason:`${hg}-${ag} (1X)`},'12':{won:hg!==ag,reason:`${hg}-${ag} (12)`},X2:{won:ag>=hg,reason:`${hg}-${ag} (X2)`},over05:{won:tg>0.5},under05:{won:tg<0.5},over15:{won:tg>1.5},under15:{won:tg<1.5},over25:{won:tg>2.5},under25:{won:tg<2.5},over35:{won:tg>3.5},under35:{won:tg<3.5},btts_yes:{won:hg>0&&ag>0},btts_no:{won:!(hg>0&&ag>0)},home_dnb:hg===ag?{refund:true}:{won:hg>ag},away_dnb:hg===ag?{refund:true}:{won:ag>hg},home_over05:{won:hg>0.5},away_over05:{won:ag>0.5},home_over15:{won:hg>1.5},away_over15:{won:ag>1.5},home_over25:{won:hg>2.5},away_over25:{won:ag>2.5},home_under05:{won:hg<0.5},away_under05:{won:ag<0.5},home_under15:{won:hg<1.5},away_under15:{won:ag<1.5},double_chance_1x:{won:hg>=ag},double_chance_12:{won:hg!==ag},double_chance_x2:{won:ag>=hg},exact_goals_0:{won:tg===0},exact_goals_1:{won:tg===1},exact_goals_2:{won:tg===2},exact_goals_3:{won:tg===3},exact_goals_4plus:{won:tg>=4},handicap_home_1:{won:(hg+1)>ag},handicap_away_1:{won:(ag+1)>hg},handicap_home_m1:{won:(hg-1)>ag},handicap_away_m1:{won:(ag-1)>hg}}; return map[bet.bet_type]||null; }

    async _fetchMatchesWithRetry(fids, maxRetries) { const toFetch = fids.filter(f => !missingFixtureCache.has(f)); if (!toFetch.length) return {}; for (let a=1;a<=maxRetries;a++){try{const r=await fetchMatchesBatch(toFetch);if(Object.keys(r).length>0)return r;}catch(e){}if(a<maxRetries)await new Promise(r=>setTimeout(r,CONFIG.MATCH_FETCH_RETRY_DELAY*a));} return {}; }

    async _handleDuplicates(bets) { const g={};for(const b of bets){const k=this._dupKey(b);(g[k]||=[]).push(b);} const clean=[];let dc=0; for(const[k,grp]of Object.entries(g)){if(grp.length===1){clean.push(grp[0]);continue;} const s=grp.sort((a,b)=>new Date(a.placed_at||0).getTime()-new Date(b.placed_at||0).getTime());clean.push(s[0]);for(let i=1;i<s.length;i++){try{const dup=s[i],stk=parseFloat(dup.amount||0);if(stk>0&&CONFIG.BACKEND_SETTLEMENT_ENABLED&&backendOnline){await SettlementAPI.requestCancellation(dup.id,dup.user_id,stk);} this.settledBetIds.add(dup.id);dc++;dup.status='cancelled';}catch(e){}} this._saveSet('xl_settled_ids',this.settledBetIds);} return{cleanBets:clean,duplicateCount:dc}; }
    _dupKey(bet) { if(bet.selections?.length){const h=bet.selections.map(s=>`${s.fixtureId||s.fixture_id}_${s.betType||s.bet_type}_${s.odds}`).sort().join('|');return`ACC_${bet.user_id}_${bet.amount}_${bet.odds}_${h}`;} return`SGL_${bet.user_id}_${bet.fixture_id}_${bet.bet_type}_${bet.amount}_${bet.odds}`; }
}

function safeParseJSON(v) { if (!v) return null; if (typeof v === 'object') return v; try { return JSON.parse(v); } catch (e) { return null; } }
function extractTeamName(d, fb) { if (!d) return fb || 'Team'; if (typeof d === 'string') { const p = safeParseJSON(d); if (p?.name && p.name !== 'Home' && p.name !== 'Away') return p.name; if (d.trim() && d !== 'Home' && d !== 'Away') return d.trim(); return fb || 'Team'; } if (typeof d === 'object' && d.name && d.name !== 'Home' && d.name !== 'Away') return d.name; return fb || 'Team'; }
function extractTeamLogo(d) { if (!d) return ''; if (typeof d === 'string') { const p = safeParseJSON(d); if (p?.logo) return p.logo; } if (typeof d === 'object' && d.logo) return d.logo; return ''; }
function extractScore(d) { if (!d) return { home: 0, away: 0 }; if (typeof d === 'object') return { home: d.home || 0, away: d.away || 0 }; const p = safeParseJSON(d); return p ? { home: p.home || 0, away: p.away || 0 } : { home: 0, away: 0 }; }

async function fetchMatchFromAPI(fid, attempt = 1) { if (missingFixtureCache.has(fid)) return null; const MAX_A = 2; try { if (!await apiRateLimiter.acquire()) return null; const ctrl = new AbortController(), t = setTimeout(() => ctrl.abort(), 10000); const r = await fetch(`${API_BASE}/api/fixture/${fid}`, { signal: ctrl.signal }); clearTimeout(t); if (!r.ok) { if (r.status === 404) { missingFixtureCache.add(fid); return null; } if (r.status === 429 && attempt < MAX_A) { await new Promise(r => setTimeout(r, 2000 * attempt)); return fetchMatchFromAPI(fid, attempt + 1); } return null; } const d = await r.json(); if (d.success && d.fixture) { const f = d.fixture; return { fixture_id: fid, status: f.fixture?.status?.short || 'NS', elapsed: f.fixture?.status?.elapsed || 0, goals_home: f.goals?.home || 0, goals_away: f.goals?.away || 0, start_time: f.fixture?.date || '', league_name: f.league?.name || '', home_team: { name: extractTeamName(f.teams?.home, 'Home'), logo: f.teams?.home?.logo || '' }, away_team: { name: extractTeamName(f.teams?.away, 'Away'), logo: f.teams?.away?.logo || '' } }; } return null; } catch (e) { if (e.name === 'AbortError' && attempt < MAX_A) return fetchMatchFromAPI(fid, attempt + 1); return null; } }

async function fetchMatchesBatch(fids) { if (!fids?.length) return {}; const toFetch = fids.filter(f => !missingFixtureCache.has(f)); if (!toFetch.length) return {}; const result = {}; try { const { data, error } = await supabaseClient.from('sports_matches').select('*').in('fixture_id', toFetch); if (!error && data?.length) for (const row of data) { const sc = extractScore(row.score), hn = extractTeamName(row.home_team, 'Home'), an = extractTeamName(row.away_team, 'Away'); result[row.fixture_id] = { fixture_id: row.fixture_id, status: row.status || 'NS', elapsed: row.elapsed || 0, goals_home: sc.home, goals_away: sc.away, start_time: row.start_time || '', league_name: row.league_name || '', home_team: { name: hn, logo: extractTeamLogo(row.home_team) || `https://ui-avatars.com/api/?name=${encodeURIComponent(hn.substring(0,2))}&size=32&background=1a2332&color=00ff9d` }, away_team: { name: an, logo: extractTeamLogo(row.away_team) || `https://ui-avatars.com/api/?name=${encodeURIComponent(an.substring(0,2))}&size=32&background=1a2332&color=ff9800` } }; } } catch (e) {} const missing = toFetch.filter(f => !result[f]); if (missing.length) { const api = await Promise.allSettled(missing.map(f => fetchMatchFromAPI(f))); api.forEach((r, i) => { if (r.status === 'fulfilled' && r.value) result[missing[i]] = r.value; }); } return result; }

function escapeHtml(s) { if (!s) return ''; return String(s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m])); }
function formatFullDate(d) { return d ? new Date(d).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '-'; }
function formatFullDateTime(d) { return d ? new Date(d).toLocaleString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' }) : '-'; }
function timeAgo(d) { if (!d) return ''; const diff = Math.floor((new Date() - new Date(d)) / 1000); if (diff < 60) return `${diff}s ago`; if (diff < 3600) return `${Math.floor(diff / 60)}m ago`; if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`; return `${Math.floor(diff / 86400)}d ago`; }
function formatBetTypeName(bt) { const n = { home:'🏠 Home Win',draw:'🤝 Draw',away:'✈️ Away Win','1X':'1X','12':'12',X2:'X2',over05:'O0.5',under05:'U0.5',over15:'O1.5',under15:'U1.5',over25:'O2.5',under25:'U2.5',over35:'O3.5',under35:'U3.5',btts_yes:'BTTS Yes',btts_no:'BTTS No',home_dnb:'Home DNB',away_dnb:'Away DNB',home_over05:'Home O0.5',away_over05:'Away O0.5',home_over15:'Home O1.5',away_over15:'Away O1.5',home_over25:'Home O2.5',away_over25:'Away O2.5',home_under05:'Home U0.5',away_under05:'Away U0.5',home_under15:'Home U1.5',away_under15:'Away U1.5',double_chance_1x:'DC 1X',double_chance_12:'DC 12',double_chance_x2:'DC X2',exact_goals_0:'Exact 0',exact_goals_1:'Exact 1',exact_goals_2:'Exact 2',exact_goals_3:'Exact 3',exact_goals_4plus:'Exact 4+',handicap_home_1:'Home +1',handicap_away_1:'Away +1',handicap_home_m1:'Home -1',handicap_away_m1:'Away -1',accumulator:'Accumulator'}; return n[bt]||bt.replace(/_/g,' ').replace(/\b\w/g,l=>l.toUpperCase()); }
function debounce(fn, delay) { let t; return function(...a) { clearTimeout(t); t = setTimeout(() => fn.apply(this, a), delay); }; }

async function loadBalance() { try { const u = auth.currentUser; if (!u) return 0; const d = await db.collection('wallets').doc(u.uid).get(); const b = d.exists ? (parseFloat(d.data().balance) || 0) : 1000; document.getElementById('balance-display').textContent = `$${b.toFixed(2)}`; return b; } catch (e) { return 0; } }

async function enrichBets(bets) { const now=new Date(),allFids=new Set(); for(const bet of bets){if(bet.fixture_id&&(bet.status==='active'||(bet.placed_at&&(now-new Date(bet.placed_at))<CONFIG.RECENT_MATCH_WINDOW_MS)))allFids.add(bet.fixture_id);let sels=bet.selections;if(typeof sels==='string')sels=safeParseJSON(sels);if(Array.isArray(sels)){bet.selections=sels;sels.forEach(s=>{const fid=s.fixtureId||s.fixture_id;if(fid)allFids.add(fid);});}} const mm=[...allFids].length>0?await fetchMatchesBatch([...allFids]):{}; for(const bet of bets){if(bet.selections&&typeof bet.selections==='string')bet.selections=safeParseJSON(bet.selections)||[];const hasMulti=Array.isArray(bet.selections)&&bet.selections.length>0;if(hasMulti&&bet.bet_type!=='accumulator')bet.bet_type='accumulator';if(!hasMulti&&bet.bet_type==='accumulator')bet.bet_type='home';if(hasMulti)bet.selections.forEach(s=>{const fid=s.fixtureId||s.fixture_id;if(fid&&mm[fid])s._match=mm[fid];});let hFb='Home',aFb='Away';if(bet.match_name?.includes(' vs ')){const p=bet.match_name.split(' vs ');if(p[0]?.trim())hFb=p[0].trim();if(p[1]?.trim())aFb=p[1].trim();} if(bet.fixture_id&&mm[bet.fixture_id]){const m=mm[bet.fixture_id];const hn=m.home_team?.name&&m.home_team.name!=='Home'?m.home_team.name:hFb,an=m.away_team?.name&&m.away_team.name!=='Away'?m.away_team.name:aFb;bet.match_name=`${hn} vs ${an}`;bet._homeTeam={name:hn,logo:m.home_team?.logo||`https://ui-avatars.com/api/?name=${encodeURIComponent(hn.substring(0,2))}&size=36&background=1a2332&color=00ff9d`};bet._awayTeam={name:an,logo:m.away_team?.logo||`https://ui-avatars.com/api/?name=${encodeURIComponent(an.substring(0,2))}&size=36&background=1a2332&color=ff9800`};bet._league=m.league_name||'';bet._kickoff=m.start_time||bet.placed_at;bet._matchStatus=m.status||'NS';bet._elapsed=m.elapsed||0;bet._score={home:m.goals_home||0,away:m.goals_away||0};bet._match=m;}else{bet._homeTeam={name:hFb,logo:`https://ui-avatars.com/api/?name=${encodeURIComponent(hFb.substring(0,2))}&size=36&background=1a2332&color=00ff9d`};bet._awayTeam={name:aFb,logo:`https://ui-avatars.com/api/?name=${encodeURIComponent(aFb.substring(0,2))}&size=36&background=1a2332&color=ff9800`};bet._score={home:0,away:0};bet._league=bet.league_name||'Sports Match';bet._kickoff=bet.placed_at||bet.kickoff_time||null;bet._matchStatus=bet.match_status||'NS';bet._elapsed=bet.match_elapsed||0;bet._match=null;} bet._isCashoutProcessing=false;bet._settlementTriggered=false;} }

async function loadBets() { if(!isOnline){updateStats();updateCounts();filterBets(currentFilter);return;} const u=auth.currentUser;if(!u)return;const st=document.getElementById('loading-status');try{if(st)st.textContent='Connecting...';const{data,error}=await supabaseClient.from('bets').select('*').eq('user_id',u.uid).order('placed_at',{ascending:false});if(error)throw new Error(`DB: ${error.message}`);const raw=data||[];if(st)st.textContent=`Processing ${raw.length} bets...`;await enrichBets(raw);allBets=raw;document.getElementById('loading').style.display='none';document.getElementById('content').style.display='block';updateLastUpdated();updateStats();updateCounts();filterBets(currentFilter);startSettlementTimers();const hasFinished=allBets.some(b=>b.status==='active'&&['finished','ft','aet','pen'].includes((b._matchStatus||'').toLowerCase()));if(hasFinished){debugLog('Found finished matches — triggering immediate settlement');scheduleImmediateSettlement();} await autoSettleBets();await loadBalance();if(openModalBetId)showDetails(openModalBetId);}catch(e){debugError('Load failed:',e.message);document.getElementById('loading').style.display='none';document.getElementById('content').style.display='block';const c=document.getElementById('bet-list-container');if(c)c.innerHTML=`<div class="empty-state"><i class="fas fa-exclamation-triangle" style="color:var(--danger);"></i><p style="font-size:15px;font-weight:600;">Failed to load bets</p><p style="font-size:11px;margin-top:6px;">${escapeHtml(e.message)}</p><button class="btn-action-tool" onclick="loadBets()" style="margin-top:16px;"><i class="fas fa-redo"></i> Retry</button></div>`;} }

function scheduleImmediateSettlement() { if(settlementTimeout){clearTimeout(settlementTimeout);} settlementTimeout=setTimeout(async()=>{debugLog('⚡ Running immediate settlement...');showSettlementStatus('Settling finished matches...','',true);await autoSettleBets();await loadBalance();updateStats();updateCounts();filterBets(currentFilter);showSettlementStatus(null);settlementTimeout=null;},CONFIG.SETTLEMENT_DEBOUNCE_MS); }

async function autoSettleBets() { if(!isOnline)return;const u=auth.currentUser;if(!u)return;if(!settlementManager)settlementManager=new DuplicateProofSettlementManager(u.uid);if(settlementManager.emergencyStop)return;newlySettledBetIds.clear();const active=allBets.filter(b=>b.status==='active'&&!settlementManager.settledBetIds.has(b.id));if(!active.length)return;const result=await settlementManager.processBets(active);if(result.processed>0||result.duplicates>0){await loadBalance();updateStats();updateCounts();filterBets(currentFilter);if(openModalBetId&&newlySettledBetIds.has(openModalBetId))showDetails(openModalBetId);setTimeout(()=>document.querySelectorAll('.bet-card.just-settled').forEach(c=>c.classList.remove('just-settled')),CONFIG.SETTLE_GLOW_DURATION_MS);} }

function isBetLocked(betId){return processingBetIds.has(betId);}
function lockBet(betId,bet){processingBetIds.add(betId);if(bet)bet._isCashoutProcessing=true;disableBetButtons(betId);}
function unlockBet(betId,bet){processingBetIds.delete(betId);if(bet)bet._isCashoutProcessing=false;enableBetButtons(betId);}

async function cancelBet(betId){if(!isOnline)return showNotification('📴 Cannot cancel while offline','warning');if(!CONFIG.CANCELLATION_ENABLED)return showNotification('❌ Cancellation disabled','error');if(isBetLocked(betId))return showNotification('⏳ In progress...','warning');const bet=allBets.find(b=>b.id===betId);if(!bet||bet.status!=='active')return showNotification('❌ Cannot cancel','error');if(bet.selections?.length>0)return showNotification('❌ Accumulators cannot be cancelled','error');if(settlementManager?.settledBetIds.has(betId))return showNotification('❌ Being settled','error');if(bet._kickoff&&new Date()>new Date(bet._kickoff))return showNotification('❌ Match started','error');const stake=parseFloat(bet.amount||0),fee=parseFloat((stake*CONFIG.CANCELLATION_FEE_PERCENT).toFixed(2)),refund=parseFloat((stake-fee).toFixed(2));if(!confirm(`Cancel?\n\nStake: $${stake.toFixed(2)}\nRefund: $${refund.toFixed(2)}\nFee: $${fee.toFixed(2)}`))return;lockBet(betId,bet);try{if(CONFIG.BACKEND_SETTLEMENT_ENABLED&&backendOnline){const result=await SettlementAPI.requestCancellation(betId,bet.user_id,refund);if(result.isOk()){bet.status='cancelled';bet.refund_amount=refund;if(settlementManager){settlementManager.settledBetIds.add(betId);settlementManager._saveSet('xl_settled_ids',settlementManager.settledBetIds);} showNotification(`✅ Refunded $${refund.toFixed(2)}`,'success');}else{unlockBet(betId,bet);return showNotification(`❌ ${result.getError()}`,'error');}}else{const{error,data}=await supabaseClient.from('bets').update({status:'cancelled',refund_amount:refund,cancelled_at:new Date().toISOString(),settlement_reason:`Cancelled – ${(CONFIG.CANCELLATION_FEE_PERCENT*100).toFixed(0)}% fee`,cancellation_fee:fee,updated_at:new Date().toISOString()}).eq('id',betId).eq('status','active').select('id');if(error||!data?.length){unlockBet(betId,bet);return showNotification('❌ Cancel failed','error');}bet.status='cancelled';if(settlementManager){settlementManager.settledBetIds.add(betId);settlementManager._saveSet('xl_settled_ids',settlementManager.settledBetIds);}} await loadBalance();updateStats();updateCounts();filterBets(currentFilter);}catch(e){unlockBet(betId,bet);showNotification(`Error: ${e.message}`,'error');}}

async function cashoutBet(betId,partialPct=100){if(!isOnline)return showNotification('📴 Cannot cash out while offline','warning');if(isBetLocked(betId))return showNotification('⏳ In progress...','warning');const bet=allBets.find(b=>b.id===betId);if(!bet||bet.status!=='active')return showNotification('❌ Cannot cash out','error');if(bet._isCashoutProcessing)return showNotification('⏳ Processing...','warning');if(settlementManager?.settledBetIds.has(betId))return showNotification('❌ Being settled','error');const baseStake=parseFloat(bet.amount||0),partialAmt=parseFloat((baseStake*(partialPct/100)).toFixed(2)),remaining=parseFloat((baseStake-partialAmt).toFixed(2));if(partialPct<100&&remaining<1)return showNotification('❌ Remaining < $1.00','error');const odds=parseFloat(bet.odds||2),elapsed=bet._elapsed||45,rm=Math.max(1,90-elapsed);let cv=partialAmt*odds*CONFIG.CASHOUT_BASE_MULTIPLIER*Math.pow(rm/90,CONFIG.CASHOUT_TIME_DECAY)*CONFIG.CASHOUT_FEE_MULTIPLIER;if(CONFIG.CASHOUT_SCORE_IMPACT_ENABLED&&bet._score){const sc=bet._score;if(sc.home>sc.away&&bet.bet_type==='home')cv*=1.3;if(sc.away>sc.home&&bet.bet_type==='away')cv*=1.3;if(sc.home===sc.away&&bet.bet_type==='draw')cv*=1.3;if(sc.home<sc.away&&bet.bet_type==='home')cv*=0.7;if(sc.away<sc.home&&bet.bet_type==='away')cv*=0.7;} cv=parseFloat(Math.max(partialAmt*0.05,Math.min(partialAmt*odds*0.95,cv)).toFixed(2));const profit=parseFloat((cv-partialAmt).toFixed(2)),label=partialPct===100?'Full':`${partialPct}% Partial`;if(!confirm(`${label} Cash Out?\n\nStake: $${partialAmt.toFixed(2)}\nReceive: $${cv.toFixed(2)}\n${profit>=0?'Profit':'Loss'}: $${Math.abs(profit).toFixed(2)}`))return;lockBet(betId,bet);try{if(CONFIG.BACKEND_SETTLEMENT_ENABLED&&backendOnline){const result=await SettlementAPI.requestCashout(betId,bet.user_id,cv,partialPct);if(result.isOk()){if(partialPct===100){bet.status='cashed-out';bet.cashout_amount=cv;}else{bet.amount=remaining;} if(settlementManager&&partialPct===100){settlementManager.settledBetIds.add(betId);settlementManager._saveSet('xl_settled_ids',settlementManager.settledBetIds);} showNotification(`✅ ${label} cashout: $${cv.toFixed(2)}`,'success');}else{unlockBet(betId,bet);return showNotification(`❌ ${result.getError()}`,'error');}}else{if(partialPct===100){const{error,data}=await supabaseClient.from('bets').update({status:'cashed-out',cashout_amount:cv,cashed_out_at:new Date().toISOString(),settlement_reason:'Cashed out 100%',updated_at:new Date().toISOString()}).eq('id',betId).eq('status','active').select('id');if(error||!data?.length){unlockBet(betId,bet);return showNotification('❌ Failed','error');}bet.status='cashed-out';bet.cashout_amount=cv;}else{let hist=bet.partial_history||[];hist.push({timestamp:new Date().toISOString(),percentage:partialPct,cashed_out_val:cv,stake_before:baseStake,stake_after:remaining});const{error}=await supabaseClient.from('bets').update({amount:remaining,partial_history:hist,updated_at:new Date().toISOString()}).eq('id',betId).eq('status','active');if(error){unlockBet(betId,bet);return showNotification('❌ Failed','error');}bet.amount=remaining;bet.partial_history=hist;} if(settlementManager&&partialPct===100){settlementManager.settledBetIds.add(betId);settlementManager._saveSet('xl_settled_ids',settlementManager.settledBetIds);}} await loadBalance();updateStats();updateCounts();filterBets(currentFilter);}catch(e){unlockBet(betId,bet);showNotification(`Error: ${e.message}`,'error');}}

function disableBetButtons(betId){const c=document.querySelector(`[data-bet-id="${betId}"]`);if(c){c.classList.add('processing');c.querySelectorAll('button').forEach(b=>b.disabled=true);}}
function enableBetButtons(betId){const c=document.querySelector(`[data-bet-id="${betId}"]`);if(c){c.classList.remove('processing');c.querySelectorAll('button').forEach(b=>b.disabled=false);}}

function updateStats(){const t=allBets.length,w=allBets.filter(b=>b.status==='won'),l=allBets.filter(b=>b.status==='lost'),a=allBets.filter(b=>b.status==='active'),co=allBets.filter(b=>b.status==='cashed-out');let wa=0,la=0,np=0;w.forEach(b=>{const p=parseFloat(b.payout||0);wa+=p;np+=p-parseFloat(b.amount||0);});l.forEach(b=>{const s=parseFloat(b.amount||0);la+=s;np-=s;});co.forEach(b=>{np+=parseFloat(b.cashout_amount||0)-parseFloat(b.amount||0);});const wr=(w.length+l.length)>0?((w.length/(w.length+l.length))*100).toFixed(1):0;document.getElementById('total-bets').textContent=t;document.getElementById('total-won').textContent=w.length;document.getElementById('total-lost').textContent=l.length;document.getElementById('total-active').textContent=a.length;document.getElementById('won-amount').textContent=`$${wa.toFixed(2)}`;document.getElementById('lost-amount').textContent=`$${la.toFixed(2)}`;document.getElementById('win-rate-display').textContent=`${wr}%`;document.getElementById('win-rate-fill').style.width=`${wr}%`;const pe=document.getElementById('total-pl');pe.textContent=(np>=0?'+':'')+'$'+np.toFixed(2);pe.style.color=np>=0?'var(--success)':'var(--danger)';}
function updateCounts(){const c={all:allBets.length,active:allBets.filter(b=>b.status==='active').length,won:allBets.filter(b=>b.status==='won').length,lost:allBets.filter(b=>b.status==='lost').length,cancelled:allBets.filter(b=>b.status==='cancelled').length,'cashed-out':allBets.filter(b=>b.status==='cashed-out').length};for(const[k,v]of Object.entries(c)){const el=document.getElementById(`cnt-${k}`);if(el)el.textContent=v;}}
function filterBets(filter){currentFilter=filter;let fl=[...allBets];if(filter!=='all')fl=fl.filter(b=>b.status===filter);const sv=document.getElementById('bet-search-input')?.value?.toLowerCase().trim();if(sv)fl=fl.filter(b=>{const mn=(b.match_name||'').toLowerCase(),lg=(b._league||'').toLowerCase(),tk=('XL'+(b.id?.slice(-8)||'')).toLowerCase();return mn.includes(sv)||lg.includes(sv)||tk.includes(sv);});fl.sort((a,b)=>{if(a.status==='active'&&b.status!=='active')return-1;if(a.status!=='active'&&b.status==='active')return 1;if(a.status==='active'){const ka=a._kickoff?new Date(a._kickoff).getTime():Infinity,kb=b._kickoff?new Date(b._kickoff).getTime():Infinity;return ka-kb;}return new Date(b.settled_at||b.cashed_out_at||b.placed_at||0).getTime()-new Date(a.settled_at||a.cashed_out_at||a.placed_at||0).getTime();});const c=document.getElementById('bet-list-container');if(!c)return;if(!fl.length)c.innerHTML=`<div class="empty-state"><i class="fas fa-ticket-alt"></i><p style="font-size:15px;font-weight:600;">No bets found</p></div>`;else c.innerHTML=fl.map(b=>{try{return createBetCard(b);}catch(e){return`<div class="bet-card render-error" data-bet-id="${b.id}"><div class="bet-top"><span class="bet-status-badge lost">⚠️ Error</span></div><p style="font-size:11px;padding:8px 0;">Bet #${escapeHtml(b.id?.slice(-8)||'?')}</p></div>`;}}).join('');startSettlementTimers();}

function createBetCard(bet){const amt=parseFloat(bet.amount||0),odds=parseFloat(bet.odds||2),payout=parseFloat(bet.payout||bet.potential_win||0);let profit=0;if(bet.status==='won')profit=payout-amt;else if(bet.status==='lost')profit=-amt;else if(bet.status==='cashed-out')profit=parseFloat(bet.cashout_amount||0)-amt;const tk='XL'+(bet.id?.slice(-8)||'').toUpperCase(),isActive=bet.status==='active',hasSel=bet.selections?.length>0,isAcc=bet.bet_type==='accumulator'||hasSel;const ms=(bet._matchStatus||'').toLowerCase(),isLive=['live','1h','2h','ht'].includes(ms),started=isLive||['finished','ft','aet','pen'].includes(ms),isHT=ms==='ht';const canCancel=isActive&&!isAcc&&!started&&CONFIG.CANCELLATION_ENABLED&&!settlementManager?.settledBetIds.has(bet.id);const canCashout=isActive&&started&&isLive&&!isHT&&!isAcc&&!settlementManager?.settledBetIds.has(bet.id);const isProc=isBetLocked(bet.id)||bet._isCashoutProcessing,justSet=newlySettledBetIds.has(bet.id);const ht2=bet._homeTeam||{name:'Home',logo:''},at=bet._awayTeam||{name:'Away',logo:''};const hl=ht2.logo||`https://ui-avatars.com/api/?name=${encodeURIComponent((ht2.name||'H').substring(0,2))}&size=36&background=1a2332&color=00ff9d`,al=at.logo||`https://ui-avatars.com/api/?name=${encodeURIComponent((at.name||'A').substring(0,2))}&size=36&background=1a2332&color=ff9800`;const sd=bet._score?`<span class="bet-score-display${isLive?' live':''}">${bet._score.home} - ${bet._score.away}</span>`:'';const sc=bet.status==='won'?'won':bet.status==='lost'?'lost':bet.status==='cancelled'?'cancelled':bet.status==='cashed-out'?'cashed-out':'active';let coHTML='';if(canCashout&&!isProc){const el=bet._elapsed||45,rm=Math.max(1,90-el);let cv=amt*odds*CONFIG.CASHOUT_BASE_MULTIPLIER*Math.pow(rm/90,CONFIG.CASHOUT_TIME_DECAY)*CONFIG.CASHOUT_FEE_MULTIPLIER;if(CONFIG.CASHOUT_SCORE_IMPACT_ENABLED&&bet._score){const sc2=bet._score;if(sc2.home>sc2.away&&bet.bet_type==='home')cv*=1.3;if(sc2.away>sc2.home&&bet.bet_type==='away')cv*=1.3;if(sc2.home===sc2.away&&bet.bet_type==='draw')cv*=1.3;if(sc2.home<sc2.away&&bet.bet_type==='home')cv*=0.7;if(sc2.away<sc2.home&&bet.bet_type==='away')cv*=0.7;} cv=Math.max(amt*0.05,Math.min(amt*odds*0.95,cv));coHTML=`<div class="cashout-preview"><div class="cashout-metrics"><span>Est. Cash Out: <strong>$${cv.toFixed(2)}</strong></span><span>Profit: <span style="color:${cv>=amt?'var(--success)':'var(--danger)'}">${cv>=amt?'+':''}$${(cv-amt).toFixed(2)}</span></span></div><div class="partial-cashout-box"><span>Stake: <strong class="pct-val">100%</strong></span><input type="range" class="partial-slider" min="10" max="100" step="10" value="100"></div></div>`;}else if(isActive&&isHT&&!isAcc)coHTML=`<div class="cashout-preview" style="border-color:var(--orange);"><div style="color:var(--orange);font-weight:700;">⏸️ Cash Out suspended (Half-time)</div></div>`;let accaHTML='';if(isAcc&&hasSel)accaHTML=`<div class="selections-container"><div style="font-size:11px;font-weight:700;color:var(--accent);margin-bottom:10px;"><i class="fas fa-list-ol"></i> Accumulator (${bet.selections.length} legs)</div>${bet.selections.map((s,i)=>{const m=s._match;let badge='<span style="color:var(--text-secondary);">⏳ Pending</span>',scoreStr='';if(m){const mst=(m.status||'').toLowerCase();if(['finished','ft','aet','pen'].includes(mst)){const lr=settlementManager?._determineResultLocal({bet_type:s.betType||s.bet_type},m);badge=lr?.won?'<span style="color:var(--success);">✅ WON</span>':lr?.refund?'<span style="color:var(--orange);">↩️ REFUND</span>':'<span style="color:var(--danger);">❌ LOST</span>';scoreStr=`(${m.goals_home||0}-${m.goals_away||0})`;}else if(['live','1h','2h','ht'].includes(mst)){badge=`<span style="color:var(--orange);">🔴 LIVE ${m.elapsed||''}'</span>`;scoreStr=`(${m.goals_home||0}-${m.goals_away||0})`;}} return`<div class="selection-item"><span class="selection-match">[${i+1}] ${escapeHtml(s.matchName||'Match')} ${scoreStr}</span><span class="selection-pick">${escapeHtml(formatBetTypeName(s.betType||s.bet_type))}</span><span class="selection-odds">@${parseFloat(s.odds||1).toFixed(2)}</span> ${badge}</div>`;}).join('')}</div>`;let acts='';if(isActive){acts='<div class="bet-actions"><div class="bet-action-row-buttons">';if(canCancel&&!isProc&&isOnline)acts+='<button class="cancel-btn" data-action="cancel"><i class="fas fa-ban"></i> Cancel</button>';if(canCashout&&!isProc&&isOnline)acts+='<button class="cashout-btn" data-action="cashout"><i class="fas fa-money-bill-wave"></i> Cash Out</button>';if(isProc)acts+='<button disabled style="background:var(--bg-tertiary);color:var(--text-secondary);"><i class="fas fa-spinner fa-spin"></i> Processing...</button>';if(!isOnline&&isActive)acts+='<button disabled style="background:var(--bg-tertiary);color:var(--text-secondary);"><i class="fas fa-wifi"></i> Offline</button>';acts+='</div></div>';} let siHTML='';if(!isActive&&bet.settled_at){const sb=bet.settled_by||'auto';const sl=sb==='admin'?'👤 Admin':sb==='backend'?'🔒 Backend':'🤖 Auto-Settlement';const scl=sb==='admin'?'admin':sb==='backend'?'backend':'auto';siHTML=`<div class="settlement-info-bar ${scl}"><i class="fas ${sb==='admin'?'fa-user-shield':sb==='backend'?'fa-shield-alt':'fa-robot'}"></i><span>Settled by: <strong>${sl}</strong> • ${formatFullDateTime(bet.settled_at)} (${timeAgo(bet.settled_at)})</span></div>`;} return`<div class="bet-card ${sc}${isProc?' processing':''}${justSet?' just-settled':''}" data-bet-id="${bet.id}"><div class="bet-top"><div><span class="bet-type-tag ${isAcc?'accumulator':'single'}">${isAcc?'ACCUMULATOR':'SINGLE'}</span><span class="bet-ticket-num">#${tk}</span>${started&&isActive?'<span class="live-bet-badge"><i class="fas fa-bolt"></i> LIVE</span>':''}</div><span class="bet-status-badge ${sc}">${bet.status==='won'?'🏆 WON':bet.status==='lost'?'❌ LOST':bet.status==='cancelled'?'⛔ CANCELLED':bet.status==='cashed-out'?'💰 CASHED OUT':'⏳ ACTIVE'}</span></div><div class="bet-body">${isAcc?`<div class="bet-match-name"><i class="fas fa-layer-group" style="color:var(--orange);"></i> ${bet.selections?.length||0}-Fold Accumulator</div><div class="bet-league">${bet.selections?.map(s=>escapeHtml(s.matchName||'?')).join(' • ')||'Multiple'}</div>`:`<div class="bet-match-row"><img class="team-logo-small" src="${hl}" onerror="this.style.display='none'" alt=""><div class="bet-match-name">${escapeHtml(ht2.name)} <span style="color:var(--text-secondary);">vs</span> ${escapeHtml(at.name)}${sd}</div><img class="team-logo-small" src="${al}" onerror="this.style.display='none'" alt=""></div><div class="bet-league">${escapeHtml(bet._league||'Sports')}${bet._elapsed?` | ${bet._elapsed}'`:''}${ms?` | ${ms.toUpperCase()}`:''}</div>`}<div class="bet-pick">${escapeHtml(formatBetTypeName(isAcc?'accumulator':bet.bet_type))} <span>@${odds.toFixed(2)}</span></div></div>${accaHTML}<div class="bet-meta-row"><span><i class="fas fa-calendar-plus"></i> ${formatFullDate(bet.placed_at)}</span><span><i class="fas fa-clock"></i> ${formatFullDate(bet._kickoff)}</span></div>${coHTML}<div class="bet-details-grid"><div class="bet-detail"><div class="lbl">Stake</div><div class="val">$${amt.toFixed(2)}</div></div><div class="bet-detail"><div class="lbl">${isActive?'Potential':'Payout'}</div><div class="val">$${payout.toFixed(2)}</div></div><div class="bet-detail"><div class="lbl">P/L</div><div class="val" style="color:${profit>=0?'var(--success)':'var(--danger)'}">${profit>=0?'+':''}$${Math.abs(profit).toFixed(2)}</div></div>${isActive?`<div class="bet-detail"><div class="lbl">⏱️ Time to Settle</div><div class="val"><span class="settlement-timer timer-${bet.id}">--:--:--</span></div></div>`:''}</div>${bet.settlement_reason?`<div class="bet-result-row ${sc}"><i class="fas fa-gavel"></i> ${escapeHtml(bet.settlement_reason)}</div>`:''}${siHTML}${acts}</div>`;}

function showDetails(betId){const bet=allBets.find(b=>b.id===betId);if(!bet)return;openModalBetId=betId;const modal=document.getElementById('bet-modal'),body=document.getElementById('modal-body');const tk='XL'+(bet.id?.slice(-8)||'').toUpperCase(),amt=parseFloat(bet.amount||0),odds=parseFloat(bet.odds||2),payout=parseFloat(bet.payout||bet.potential_win||0);let profit=0;if(bet.status==='won')profit=payout-amt;else if(bet.status==='lost')profit=-amt;else if(bet.status==='cashed-out')profit=parseFloat(bet.cashout_amount||0)-amt;const isAcc=bet.bet_type==='accumulator'||(bet.selections?.length>0);const sb=bet.settled_by==='admin'?'👤 Admin':bet.settled_by==='backend'?'🔒 Backend (Secure)':bet.settled_by==='auto'?'🤖 Auto':'N/A';let sHTML='';if(isAcc&&bet.selections?.length)sHTML=`<div class="modal-section"><h4><i class="fas fa-list-ol"></i> Selections (${bet.selections.length})</h4>${bet.selections.map((s,i)=>`<div class="modal-row"><span class="lbl">Leg ${i+1}</span><span>${escapeHtml(s.matchName||'Match')} — ${escapeHtml(formatBetTypeName(s.betType||s.bet_type))} @${parseFloat(s.odds||1).toFixed(2)}</span></div>`).join('')}</div>`;body.innerHTML=`<div class="modal-section"><h4><i class="fas fa-ticket-alt"></i> Ticket #${tk}</h4><div class="modal-row"><span class="lbl">Status</span><span>${bet.status?.toUpperCase()}</span></div><div class="modal-row"><span class="lbl">Type</span><span>${isAcc?`Accumulator (${bet.selections?.length||0} legs)`:'Single'}</span></div>${!isAcc?`<div class="modal-row"><span class="lbl">Match</span><span>${escapeHtml(bet.match_name||'N/A')}</span></div><div class="modal-row"><span class="lbl">Score</span><span style="font-family:monospace;color:var(--orange);">${bet._score?`${bet._score.home}-${bet._score.away}`:'N/A'}</span></div><div class="modal-row"><span class="lbl">League</span><span>${escapeHtml(bet._league||'N/A')}</span></div>`:''}<div class="modal-row"><span class="lbl">Placed</span><span>${formatFullDateTime(bet.placed_at)}</span></div>${bet.settled_at?`<div class="modal-row"><span class="lbl">Settled</span><span>${formatFullDateTime(bet.settled_at)}</span></div><div class="modal-row"><span class="lbl">Settled By</span><span>${sb}</span></div>`:''}</div>${sHTML}<div class="modal-section"><h4><i class="fas fa-chart-line"></i> Financial</h4><div class="modal-row"><span class="lbl">Stake</span><span>$${amt.toFixed(2)}</span></div><div class="modal-row"><span class="lbl">Odds</span><span>@${odds.toFixed(2)}</span></div><div class="modal-row"><span class="lbl">Payout</span><span>$${payout.toFixed(2)}</span></div><div class="modal-row"><span class="lbl">P/L</span><span style="color:${profit>=0?'var(--success)':'var(--danger)'}">${profit>=0?'+':''}$${profit.toFixed(2)}</span></div></div>${bet.settlement_reason?`<div class="modal-section"><h4><i class="fas fa-gavel"></i> Settlement</h4><div class="modal-row"><span class="lbl">Reason</span><span>${escapeHtml(bet.settlement_reason)}</span></div></div>`:''}`;modal.classList.add('show');}

// ║  SETTLEMENT TIMER                                           ║

function startSettlementTimers(){settlementTimers.forEach(clearInterval);settlementTimers=[];const triggered=new Set();const upd=()=>{let hasNew=false;allBets.filter(b=>b.status==='active').forEach(bet=>{const els=document.querySelectorAll(`.timer-${bet.id}`);if(!els.length)return;const ms=(bet._matchStatus||'').toLowerCase();if(['finished','ft','aet','pen'].includes(ms)){els.forEach(el=>{el.innerHTML='<span style="color:var(--success);font-weight:700;">✅ Settling…</span>';el.classList.remove('urgent');});if(!triggered.has(bet.id)&&!settlementManager?.settledBetIds.has(bet.id)){triggered.add(bet.id);hasNew=true;}return;}const ko=bet._kickoff?new Date(bet._kickoff):null;if(!ko){els.forEach(el=>{el.textContent='--:--:--';el.classList.remove('urgent');});return;}const diff=new Date(ko.getTime()+CONFIG.SETTLEMENT_TIMEOUT_MINUTES*60000)-new Date();if(diff<=0){els.forEach(el=>{el.innerHTML='<span style="color:var(--success);font-weight:700;">🔄 Settling Now…</span>';el.classList.remove('urgent');});if(!triggered.has(bet.id)&&!settlementManager?.settledBetIds.has(bet.id)){triggered.add(bet.id);hasNew=true;}}else{const h=Math.floor(diff/3600000),m=Math.floor((diff%3600000)/60000),s=Math.floor((diff%60000)/1000),ts=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;els.forEach(el=>{el.textContent=ts;if(h===0&&m<5)el.classList.add('urgent');else el.classList.remove('urgent');});}});if(hasNew)scheduleImmediateSettlement();};upd();settlementTimers.push(setInterval(upd,1000));}

document.addEventListener('DOMContentLoaded',()=>{cleanOldStorageEntries();updateOnlineStatus();checkBackendHealth();setInterval(checkBackendHealth,60000);document.getElementById('bet-list-container').addEventListener('click',function(e){const card=e.target.closest('.bet-card');if(!card||card.classList.contains('processing'))return;const bid=card.dataset.betId,ab=e.target.closest('button[data-action]');if(ab){e.stopPropagation();if(ab.dataset.action==='cancel')cancelBet(bid);if(ab.dataset.action==='cashout'){const s=card.querySelector('.partial-slider');cashoutBet(bid,s?parseInt(s.value):100);}}else showDetails(bid);});document.getElementById('bet-list-container').addEventListener('input',function(e){if(e.target.classList.contains('partial-slider')){const v=e.target.closest('.bet-card')?.querySelector('.pct-val');if(v)v.textContent=e.target.value+'%';}});document.getElementById('bet-modal').addEventListener('click',(e)=>{if(e.target.id==='bet-modal'||e.target.id==='modalCloseBtn'){document.getElementById('bet-modal').classList.remove('show');openModalBetId=null;}});document.getElementById('bet-search-input').addEventListener('input',debounce(()=>filterBets(currentFilter),CONFIG.SEARCH_DEBOUNCE_MS));document.querySelectorAll('.filter-chip').forEach(ch=>ch.addEventListener('click',function(){document.querySelectorAll('.filter-chip').forEach(c=>c.classList.remove('active'));this.classList.add('active');filterBets(this.dataset.filter);}));document.getElementById('themeToggleBtn').addEventListener('click',()=>{document.body.classList.toggle('light-theme');safeLocalStorageSet('theme',document.body.classList.contains('light-theme')?'light':'dark');});document.getElementById('langToggleBtn').addEventListener('click',()=>{const ia=document.body.classList.toggle('arabic');safeLocalStorageSet('lang',ia?'ar':'en');document.documentElement.dir=ia?'rtl':'ltr';});document.getElementById('refreshBtn').addEventListener('click',async()=>{if(!isOnline){showNotification('📴 Offline','warning');return;}const btn=document.getElementById('refreshBtn');btn.disabled=true;btn.querySelector('i').classList.add('fa-spin');await loadBets();await loadBalance();btn.disabled=false;btn.querySelector('i').classList.remove('fa-spin');});document.addEventListener('keydown',(e)=>{if(e.key==='Escape'){document.getElementById('bet-modal').classList.remove('show');openModalBetId=null;}});auth.onAuthStateChanged(async u=>{if(!u){window.location.href='../login.html';return;}if(safeLocalStorageGet('theme')==='light')document.body.classList.add('light-theme');if(safeLocalStorageGet('lang')==='ar'){document.body.classList.add('arabic');document.documentElement.dir='rtl';}settlementManager=new DuplicateProofSettlementManager(u.uid);await loadBalance();await loadBets();if(refreshInterval)clearInterval(refreshInterval);refreshInterval=setInterval(async()=>{if(isOnline){await loadBets();await loadBalance();}},CONFIG.REFRESH_INTERVAL);if(settleInterval)clearInterval(settleInterval);if(!safeLocalStorageGet('xl_emergency_stop'))settleInterval=setInterval(async()=>{if(isOnline){await autoSettleBets();await loadBalance();}},CONFIG.AUTO_SETTLE_INTERVAL);});window.addEventListener('beforeunload',()=>{if(refreshInterval)clearInterval(refreshInterval);if(settleInterval)clearInterval(settleInterval);if(settlementTimeout)clearTimeout(settlementTimeout);settlementTimers.forEach(clearInterval);});});window.loadBets=loadBets;window.CONFIG=CONFIG;console.log('%c✅ My Bets v18.3 SECURE %c| %c🔒 Firebase Wallets via Backend %c| %cOption A — Complete','color:#00ff9d;font-weight:bold;font-size:14px;','','color:#ce93d8;font-weight:bold;','','color:#aaa;font-size:10px;');
</script>
