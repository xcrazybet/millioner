    <script>
        // ============================================

        const SUPABASE_URL = 'https://jnazybaeajyynpyoszmy.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpuYXp5YmFlYWp5eW5weW9zem15Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyNzgwMDMsImV4cCI6MjA5Mjg1NDAwM30.P_8V-_s6DQDiYekZX1yaNup48WBRaLhb3ILAkvzTDTY';
        
        let supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        
        const db = firebase.firestore();
        const auth = firebase.auth();
        
        let allBets = [];
        let currentFilter = 'all';
        let refreshInterval = null;
        let settlementTimers = [];
        
        // Track which bets have been processed for actions
        let processedBets = new Set();
        
        const API_BASE = 'https://millioner.onrender.com';
        
        // ===== HELPER FUNCTIONS =====
        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        function toggleLanguage() {
            const isArabic = document.body.classList.toggle('arabic');
            localStorage.setItem('lang', isArabic ? 'ar' : 'en');
            document.documentElement.dir = isArabic ? 'rtl' : 'ltr';
            document.querySelectorAll('.en').forEach(el => el.style.display = isArabic ? 'none' : '');
            document.querySelectorAll('.ar').forEach(el => el.style.display = isArabic ? '' : 'none');
        }
        
        if (localStorage.getItem('lang') === 'ar') toggleLanguage();
        
        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            notification.style.position = 'fixed';
            notification.style.top = '20px';
            notification.style.right = '20px';
            notification.style.background = type === 'success' ? '#4caf50' : type === 'error' ? '#ff5252' : '#ff9800';
            notification.style.color = 'white';
            notification.style.padding = '12px 20px';
            notification.style.borderRadius = '8px';
            notification.style.zIndex = '9999';
            notification.style.fontSize = '14px';
            notification.innerHTML = message;
            document.body.appendChild(notification);
            setTimeout(() => notification.remove(), 3000);
        }
        
        // ===== LOAD BALANCE FROM FIREBASE =====
        async function loadBalance() {
            try {
                const user = auth.currentUser;
                if (!user) return 0;
                
                const doc = await db.collection('wallets').doc(user.uid).get();
                const balance = doc.exists ? (doc.data().balance || 0) : 1000;
                document.getElementById('balance-display').textContent = `$${balance.toFixed(2)}`;
                return balance;
            } catch(e) { 
                console.error('Balance load error:', e); 
                return 0;
            }
        }
        
        async function updateWalletBalance(userId, amount) {
            const walletRef = db.collection('wallets').doc(userId);
            await walletRef.update({
                balance: firebase.firestore.FieldValue.increment(amount),
                updated_at: new Date().toISOString()
            });
        }
        
        // ===== CANCEL BET (ONE TIME ONLY - Before match starts) =====
        async function cancelBet(betId) {
            const bet = allBets.find(b => b.id === betId);
            if (!bet) return;
            
            // CRITICAL: Check if already processed
            if (bet.status !== 'active') {
                showNotification(`❌ This bet is already ${bet.status}`, 'error');
                return;
            }
            
            // Check if already processed in this session
            if (processedBets.has(betId)) {
                showNotification('❌ This bet has already been processed', 'error');
                return;
            }
            
            // Check if match has already started
            const { data: match } = await supabaseClient
                .from('sports_matches')
                .select('start_time, status')
                .eq('fixture_id', bet.fixture_id)
                .maybeSingle();
            
            if (match && match.status === 'live') {
                showNotification('❌ Cannot cancel - Match has already started! Use Cash Out instead.', 'error');
                return;
            }
            
            if (match && new Date(match.start_time) < new Date()) {
                showNotification('❌ Cannot cancel - Match has already started!', 'error');
                return;
            }
            
            const feePercent = 5;
            const refundAmount = bet.amount * (1 - feePercent / 100);
            const fee = bet.amount - refundAmount;
            
            if (!confirm(`Cancel this bet?\n\nOriginal Stake: $${bet.amount.toFixed(2)}\nRefund: $${refundAmount.toFixed(2)}\nFee (${feePercent}%): $${fee.toFixed(2)}\n\n⚠️ This action can only be done ONCE!`)) return;
            
            try {
                // Update bet status - CRITICAL: This makes it non-cancellable again
                const { error } = await supabaseClient
                    .from('bets')
                    .update({ 
                        status: 'cancelled', 
                        cancellation_fee: fee,
                        refund_amount: refundAmount,
                        cancelled_at: new Date().toISOString(),
                        settlement_reason: `Cancelled before match start - Fee: ${feePercent}%`
                    })
                    .eq('id', betId)
                    .eq('status', 'active'); // Only update if still active
            
                if (error) throw error;
                
                // Mark as processed
                processedBets.add(betId);
                
                // Refund to wallet
                await updateWalletBalance(bet.user_id, refundAmount);
                
                showNotification(`✅ Bet cancelled! Refunded: $${refundAmount.toFixed(2)}`, 'success');
                await loadBets();
                await loadBalance();
                
            } catch(e) {
                console.error('Cancel error:', e);
                showNotification(`Cancellation failed: ${e.message}`, 'error');
            }
        }
        
        // ===== CASHOUT BET (ONE TIME ONLY - During live match) =====
        async function cashoutBet(betId) {
            const bet = allBets.find(b => b.id === betId);
            if (!bet) return;
            
            // CRITICAL: Check if already processed
            if (bet.status !== 'active') {
                showNotification(`❌ This bet is already ${bet.status}`, 'error');
                return;
            }
            
            // Check if already processed in this session
            if (processedBets.has(betId)) {
                showNotification('❌ This bet has already been processed', 'error');
                return;
            }
            
            // Check match is live
            const { data: match } = await supabaseClient
                .from('sports_matches')
                .select('status, elapsed, score')
                .eq('fixture_id', bet.fixture_id)
                .maybeSingle();
            
            if (!match || match.status !== 'live') {
                showNotification('❌ Cash Out only available during live matches', 'error');
                return;
            }
            
            // Calculate cashout value
            const elapsed = match.elapsed || 0;
            const score = match.score || { home: 0, away: 0 };
            
            let cashoutPercent = 0.7;
            if (elapsed < 30) cashoutPercent = 0.85;
            else if (elapsed < 60) cashoutPercent = 0.75;
            else cashoutPercent = 0.65;
            
            const cashoutValue = bet.amount * bet.odds * cashoutPercent;
            const fee = (bet.amount * bet.odds) - cashoutValue;
            
            if (!confirm(`Cash out this bet?\n\nStake: $${bet.amount.toFixed(2)} @ ${bet.odds}\nCash Out Value: $${cashoutValue.toFixed(2)}\nFee: $${fee.toFixed(2)}\nMatch Status: ${elapsed}'\n\n⚠️ This action can only be done ONCE!`)) return;
            
            try {
                // Update bet status - CRITICAL: This makes it non-cashout-able again
                const { error } = await supabaseClient
                    .from('bets')
                    .update({ 
                        status: 'cashed-out', 
                        cashout_amount: cashoutValue,
                        cashout_fee: fee,
                        cashed_out_at: new Date().toISOString(),
                        settlement_reason: `Cashew out at ${elapsed}' - Score: ${score.home}-${score.away}`
                    })
                    .eq('id', betId)
                    .eq('status', 'active'); // Only update if still active
            
                if (error) throw error;
                
                // Mark as processed
                processedBets.add(betId);
                
                await updateWalletBalance(bet.user_id, cashoutValue);
                
                showNotification(`✅ Cash Out successful! Received: $${cashoutValue.toFixed(2)}`, 'success');
                await loadBets();
                await loadBalance();
                
            } catch(e) {
                console.error('Cashout error:', e);
                showNotification(`Cashout failed: ${e.message}`, 'error');
            }
        }
        
        // ===== LOAD BETS FROM SUPABASE =====
        async function loadBets() {
            const user = auth.currentUser;
            if (!user) return;
            
            try {
                const { data, error } = await supabaseClient
                    .from('bets')
                    .select('*')
                    .eq('user_id', user.uid)
                    .order('placed_at', { ascending: false });
                
                if (error) throw error;
                
                allBets = data || [];
                
                // Enrich bets with match data
                for (let bet of allBets) {
                    if (bet.fixture_id && !bet.match_name) {
                        const { data: match } = await supabaseClient
                            .from('sports_matches')
                            .select('home_team, away_team, league_name, start_time, status, score, elapsed')
                            .eq('fixture_id', bet.fixture_id)
                            .maybeSingle();
                        
                        if (match) {
                            let homeTeam = match.home_team;
                            let awayTeam = match.away_team;
                            if (typeof homeTeam === 'string') homeTeam = JSON.parse(homeTeam);
                            if (typeof awayTeam === 'string') awayTeam = JSON.parse(awayTeam);
                            
                            bet.match_name = `${homeTeam?.name || 'Home'} vs ${awayTeam?.name || 'Away'}`;
                            bet.home_team = homeTeam;
                            bet.away_team = awayTeam;
                            bet.home_logo = homeTeam?.logo || '';
                            bet.away_logo = awayTeam?.logo || '';
                            bet.league_name = match.league_name;
                            bet.kickoff_time = match.start_time;
                            bet.match_status = match.status;
                            bet.current_score = match.score;
                            bet.match_elapsed = match.elapsed;
                        }
                    }
                }
                
                updateStats();
                updateCounts();
                filterBets(currentFilter);
                startSettlementTimers();
                
            } catch(e) {
                console.error('Load bets error:', e);
                document.getElementById('bet-list-container').innerHTML = `<div class="empty-state">Error loading bets: ${e.message}</div>`;
            }
        }
        
        function startSettlementTimers() {
            settlementTimers.forEach(clearInterval);
            settlementTimers = [];
            
            const activeBets = allBets.filter(b => b.status === 'active');
            
            activeBets.forEach(bet => {
                if (bet.kickoff_time) {
                    const kickoff = new Date(bet.kickoff_time);
                    const estimatedEnd = new Date(kickoff.getTime() + (105 * 60000));
                    
                    function updateTimer() {
                        const timerEl = document.getElementById(`timer-${bet.id}`);
                        if (timerEl) {
                            const now = new Date();
                            const diff = estimatedEnd - now;
                            
                            if (diff <= 0) {
                                timerEl.innerHTML = '<span style="color:#4caf50;">Settlement pending...</span>';
                                timerEl.classList.remove('urgent');
                            } else {
                                const hours = Math.floor(diff / 3600000);
                                const minutes = Math.floor((diff % 3600000) / 60000);
                                
                                if (hours > 0) {
                                    timerEl.innerHTML = `⏰ Est. settlement: ${hours}h ${minutes}m`;
                                } else {
                                    timerEl.innerHTML = `⏰ Est. settlement: ${minutes}m`;
                                }
                                
                                if (minutes < 10 && hours === 0) {
                                    timerEl.classList.add('urgent');
                                }
                            }
                        }
                    }
                    
                    updateTimer();
                    const interval = setInterval(updateTimer, 60000);
                    settlementTimers.push(interval);
                }
            });
        }
        
        function updateStats() {
            const total = allBets.length;
            const won = allBets.filter(b => b.status === 'won');
            const lost = allBets.filter(b => b.status === 'lost');
            const active = allBets.filter(b => b.status === 'active');
            const cancelled = allBets.filter(b => b.status === 'cancelled');
            const cashedOut = allBets.filter(b => b.status === 'cashed-out');
            
            let totalWonAmount = 0;
            let totalLostAmount = 0;
            let netProfit = 0;
            
            won.forEach(b => {
                const payout = parseFloat(b.payout || b.potential_win || 0);
                const stake = parseFloat(b.amount || 0);
                totalWonAmount += payout;
                netProfit += (payout - stake);
            });
            
            lost.forEach(b => {
                const stake = parseFloat(b.amount || 0);
                totalLostAmount += stake;
                netProfit -= stake;
            });
            
            cashedOut.forEach(b => {
                const cashout = parseFloat(b.cashout_amount || 0);
                const stake = parseFloat(b.amount || 0);
                netProfit += (cashout - stake);
            });
            
            const winRate = total > 0 ? ((won.length / (won.length + lost.length)) * 100).toFixed(1) : 0;
            
            document.getElementById('total-bets').textContent = total;
            document.getElementById('total-won').textContent = won.length;
            document.getElementById('total-lost').textContent = lost.length;
            document.getElementById('total-active').textContent = active.length;
            document.getElementById('won-amount').textContent = `$${totalWonAmount.toFixed(2)}`;
            document.getElementById('lost-amount').textContent = `$${totalLostAmount.toFixed(2)}`;
            document.getElementById('win-rate-display').textContent = `${winRate}%`;
            document.getElementById('win-rate-fill').style.width = `${winRate}%`;
            
            const plEl = document.getElementById('total-pl');
            plEl.textContent = (netProfit >= 0 ? '+' : '') + '$' + netProfit.toFixed(2);
            plEl.style.color = netProfit >= 0 ? '#4caf50' : '#ff5252';
        }
        
        function updateCounts() {
            document.getElementById('cnt-all').textContent = allBets.length;
            document.getElementById('cnt-active').textContent = allBets.filter(b => b.status === 'active').length;
            document.getElementById('cnt-won').textContent = allBets.filter(b => b.status === 'won').length;
            document.getElementById('cnt-lost').textContent = allBets.filter(b => b.status === 'lost').length;
            document.getElementById('cnt-cancelled').textContent = allBets.filter(b => b.status === 'cancelled').length;
            document.getElementById('cnt-cashed-out').textContent = allBets.filter(b => b.status === 'cashed-out').length;
        }
        
        function filterBets(filter) {
            currentFilter = filter;
            let filtered = allBets;
            
            if (filter === 'active') filtered = allBets.filter(b => b.status === 'active');
            else if (filter === 'won') filtered = allBets.filter(b => b.status === 'won');
            else if (filter === 'lost') filtered = allBets.filter(b => b.status === 'lost');
            else if (filter === 'cancelled') filtered = allBets.filter(b => b.status === 'cancelled');
            else if (filter === 'cashed-out') filtered = allBets.filter(b => b.status === 'cashed-out');
            
            const container = document.getElementById('bet-list-container');
            
            if (!filtered.length) {
                container.innerHTML = '<div class="empty-state"><i class="fas fa-ticket-alt" style="font-size:48px;opacity:0.3;"></i><p>No bets found</p></div>';
                return;
            }
            
            container.innerHTML = '<div class="bet-list">' + filtered.map(b => createBetCard(b)).join('') + '</div>';
            startSettlementTimers();
        }
        
        function formatBetTypeName(betType) {
            const types = {
                'home': 'Home Win',
                'draw': 'Draw',
                'away': 'Away Win',
                '1X': 'Home or Draw',
                '12': 'Home or Away',
                'X2': 'Draw or Away',
                'over25': 'Over 2.5 Goals',
                'under25': 'Under 2.5 Goals',
                'btts_yes': 'Both Teams to Score',
                'btts_no': 'Both Teams to Score - No'
            };
            return types[betType] || betType;
        }
        
        function createBetCard(bet) {
            const isAcc = bet.bet_type === 'accumulator';
            let statusIcon = '';
            let statusClass = bet.status;
            
            if (bet.status === 'won') statusIcon = '🏆';
            else if (bet.status === 'lost') statusIcon = '❌';
            else if (bet.status === 'cancelled') statusIcon = '⛔';
            else if (bet.status === 'cashed-out') statusIcon = '💰';
            else if (bet.status === 'active') statusIcon = '⏳';
            
            const amount = parseFloat(bet.amount || 0);
            const payout = parseFloat(bet.payout || bet.potential_win || 0);
            const profit = bet.status === 'won' ? payout - amount : (bet.status === 'lost' ? -amount : 0);
            const placed = bet.placed_at ? new Date(bet.placed_at) : new Date();
            const ticketNumber = 'XL' + (bet.id.toString().slice(-8)).toUpperCase();
            
            // Check if cancel/cashout is available (ONLY for active bets not processed)
            const isActive = bet.status === 'active';
            const canCancel = isActive && bet.match_status !== 'live' && !processedBets.has(bet.id);
            const canCashout = isActive && bet.match_status === 'live' && !processedBets.has(bet.id);
            
            // Build selections HTML for accumulator
            let selectionsHtml = '';
            if (isAcc && bet.selections && bet.selections.length > 0) {
                selectionsHtml = `
                    <div class="selections-container">
                        <div class="bet-detail" style="margin-bottom: 5px;"><div class="lbl">Selections (${bet.selections.length})</div></div>
                        ${bet.selections.map(s => `
                            <div class="selection-item">
                                <span class="selection-match">${escapeHtml(s.matchName)}</span>
                                <span class="selection-pick">${escapeHtml(s.betTypeName)}</span>
                                <span class="selection-odds">@${s.odds}</span>
                            </div>
                        `).join('')}
                    </div>
                `;
            }
            
            // Show match info with logos for single bets
            let matchDisplayHtml = '';
            if (!isAcc && bet.home_team) {
                matchDisplayHtml = `
                    <div class="bet-match-name">
                        ${bet.home_logo ? `<img class="team-logo-small" src="${bet.home_logo}" onerror="this.style.display='none'">` : '<i class="fas fa-shield-alt"></i>'}
                        <span>${escapeHtml(bet.home_team?.name || 'Home')}</span>
                        <span class="vs">vs</span>
                        <span>${escapeHtml(bet.away_team?.name || 'Away')}</span>
                        ${bet.away_logo ? `<img class="team-logo-small" src="${bet.away_logo}" onerror="this.style.display='none'">` : '<i class="fas fa-shield-alt"></i>'}
                    </div>
                `;
            } else if (!isAcc) {
                matchDisplayHtml = `<div class="bet-match-name">${escapeHtml(bet.match_name || 'Match')}</div>`;
            } else {
                matchDisplayHtml = `<div class="bet-match-name"><i class="fas fa-layer-group"></i> ${bet.selections?.length || 0}-Fold Accumulator</div>`;
            }
            
            return `
                <div class="bet-card ${statusClass}" onclick="showDetails('${bet.id}')">
                    <div class="bet-top">
                        <div>
                            <span class="bet-type-tag ${isAcc ? 'accumulator' : 'single'}">${isAcc ? 'ACCUMULATOR' : 'SINGLE'}</span>
                            <span class="bet-ticket-num"> #${ticketNumber}</span>
                        </div>
                        <span class="bet-status-icon ${statusClass}">${statusIcon}</span>
                    </div>
                    <div class="bet-body">
                        ${matchDisplayHtml}
                        <div class="bet-pick">${escapeHtml(formatBetTypeName(bet.bet_type))} <span class="bet-odds">@${parseFloat(bet.odds || 2).toFixed(2)}</span></div>
                    </div>
                    ${selectionsHtml}
                    <div class="bet-details-grid">
                        <div class="bet-detail"><div class="lbl">Stake</div><div class="val">$${amount.toFixed(2)}</div></div>
                        <div class="bet-detail"><div class="lbl">${bet.status === 'active' ? 'Potential' : 'Payout'}</div><div class="val" style="color:${bet.status === 'won' ? '#4caf50' : (bet.status === 'lost' ? '#ff5252' : '#fff')}">$${payout.toFixed(2)}</div></div>
                        <div class="bet-detail"><div class="lbl">P/L</div><div class="val" style="color:${profit >= 0 ? '#4caf50' : '#ff5252'}">${profit >= 0 ? '+' : ''}$${Math.abs(profit).toFixed(2)}</div></div>
                        ${bet.status === 'active' ? `<div class="bet-detail"><div class="lbl">Est. Settlement</div><div class="val"><span class="settlement-timer" id="timer-${bet.id}">Calculating...</span></div></div>` : ''}
                    </div>
                    ${bet.settlement_reason ? `<div class="bet-result-row ${statusClass}"><i class="fas fa-info-circle"></i> ${escapeHtml(bet.settlement_reason)}</div>` : ''}
                    <div class="bet-timestamps">
                        <span><i class="far fa-calendar-alt"></i> Placed: ${placed.toLocaleString()}</span>
                    </div>
                    ${isActive ? `
                        <div class="bet-actions">
                            ${canCancel ? `<button class="cancel-btn" onclick="event.stopPropagation();cancelBet('${bet.id}')"><i class="fas fa-ban"></i> Cancel Bet</button>` : ''}
                            ${canCashout ? `<button class="cashout-btn" onclick="event.stopPropagation();cashoutBet('${bet.id}')"><i class="fas fa-money-bill-wave"></i> Cash Out</button>` : ''}
                        </div>
                    ` : ''}
                </div>
            `;
        }
        
        // ===== SHOW DETAILS MODAL =====
        function showDetails(betId) {
            const bet = allBets.find(b => b.id === betId);
            if (!bet) return;
            
            const modal = document.getElementById('bet-modal');
            const body = document.getElementById('modal-body');
            
            const amount = parseFloat(bet.amount || 0);
            const payout = parseFloat(bet.payout || bet.potential_win || 0);
            const profit = bet.status === 'won' ? payout - amount : (bet.status === 'lost' ? -amount : 0);
            const ticketNumber = 'XL' + (bet.id.toString().slice(-8)).toUpperCase();
            const placed = bet.placed_at ? new Date(bet.placed_at) : new Date();
            
            let selectionsHtml = '';
            if (bet.bet_type === 'accumulator' && bet.selections && bet.selections.length > 0) {
                selectionsHtml = `
                    <div class="modal-section">
                        <h4><i class="fas fa-layer-group"></i> Accumulator Selections (${bet.selections.length})</h4>
                        ${bet.selections.map((s, i) => `
                            <div class="selection-item-detail">
                                <span class="match">#${i+1} - ${escapeHtml(s.matchName)}</span>
                                <span class="pick">${escapeHtml(s.betTypeName)} @ ${s.odds}</span>
                            </div>
                        `).join('')}
                    </div>
                `;
            }
            
            body.innerHTML = `
                <div class="modal-section">
                    <h4><i class="fas fa-ticket-alt"></i> Ticket Information</h4>
                    <div class="modal-row"><span class="lbl">Ticket Number</span><span><strong>${ticketNumber}</strong></span></div>
                    <div class="modal-row"><span class="lbl">Support Reference</span><span><small>Use this ticket number for support: ${ticketNumber}</small></span></div>
                </div>
                
                <div class="modal-section">
                    <h4><i class="fas fa-info-circle"></i> Bet Details</h4>
                    <div class="modal-row"><span class="lbl">Type</span><span>${bet.bet_type === 'accumulator' ? 'Accumulator' : 'Single'}</span></div>
                    <div class="modal-row"><span class="lbl">Status</span><span class="${bet.status}" style="color:${bet.status === 'won' ? '#4caf50' : (bet.status === 'lost' ? '#ff5252' : '#ffc107')}">${bet.status?.toUpperCase()}</span></div>
                    <div class="modal-row"><span class="lbl">Match</span><span>${escapeHtml(bet.match_name || 'N/A')}</span></div>
                    <div class="modal-row"><span class="lbl">Bet Type</span><span>${escapeHtml(formatBetTypeName(bet.bet_type))}</span></div>
                    <div class="modal-row"><span class="lbl">Odds</span><span>${parseFloat(bet.odds || 2).toFixed(2)}</span></div>
                    <div class="modal-row"><span class="lbl">Placed Date/Time</span><span>${placed.toLocaleString()}</span></div>
                </div>
                
                ${selectionsHtml}
                
                <div class="modal-section">
                    <h4><i class="fas fa-chart-line"></i> Financial Summary</h4>
                    <div class="modal-row"><span class="lbl">Stake</span><span>$${amount.toFixed(2)}</span></div>
                    <div class="modal-row"><span class="lbl">Potential Win</span><span>$${parseFloat(bet.potential_win || 0).toFixed(2)}</span></div>
                    <div class="modal-row"><span class="lbl">Actual Payout</span><span class="${bet.status === 'won' ? 'value-won' : ''}">$${payout.toFixed(2)}</span></div>
                    <div class="modal-row"><span class="lbl">Profit/Loss</span><span style="color:${profit >= 0 ? '#4caf50' : '#ff5252'}">${profit >= 0 ? '+' : ''}$${profit.toFixed(2)}</span></div>
                    ${bet.cancellation_fee ? `<div class="modal-row"><span class="lbl">Cancel Fee</span><span>$${bet.cancellation_fee.toFixed(2)}</span></div>` : ''}
                    ${bet.refund_amount ? `<div class="modal-row"><span class="lbl">Refund Amount</span><span>$${bet.refund_amount.toFixed(2)}</span></div>` : ''}
                    ${bet.cashout_amount ? `<div class="modal-row"><span class="lbl">Cash Out Amount</span><span>$${bet.cashout_amount.toFixed(2)}</span></div>` : ''}
                    ${bet.cashout_fee ? `<div class="modal-row"><span class="lbl">Cash Out Fee</span><span>$${bet.cashout_fee.toFixed(2)}</span></div>` : ''}
                </div>
                
                ${bet.settlement_reason ? `
                <div class="modal-section">
                    <h4><i class="fas fa-flag-checkered"></i> Settlement Reason</h4>
                    <div class="modal-row"><span class="lbl">Reason</span><span>${escapeHtml(bet.settlement_reason)}</span></div>
                </div>
                ` : ''}
                
                <div class="modal-section">
                    <h4><i class="fas fa-headset"></i> Need Help?</h4>
                    <div class="modal-row"><span class="lbl">Support Ticket</span><span>Contact X Lodon support with your ticket number: <strong>${ticketNumber}</strong></span></div>
                    <div class="modal-row"><span class="lbl">Email</span><span>support@xlodon.co.uk</span></div>
                </div>
            `;
            
            modal.classList.add('show');
        }
        
        function closeModal(event) {
            if (!event || event.target === document.getElementById('bet-modal')) {
                document.getElementById('bet-modal').classList.remove('show');
            }
        }
        
        function exportBetsToCSV() {
            if (!allBets.length) {
                alert('No bets to export');
                return;
            }
            
            const headers = ['Ticket Number', 'Date', 'Type', 'Match', 'Pick', 'Odds', 'Stake', 'Payout', 'P/L', 'Status', 'Settlement Reason'];
            const rows = allBets.map(b => {
                const ticketNumber = 'XL' + (b.id.toString().slice(-8)).toUpperCase();
                const amount = parseFloat(b.amount || 0);
                const payout = parseFloat(b.payout || b.potential_win || 0);
                const profit = b.status === 'won' ? payout - amount : (b.status === 'lost' ? -amount : 0);
                
                return [
                    ticketNumber,
                    new Date(b.placed_at).toLocaleDateString(),
                    b.bet_type === 'accumulator' ? 'Accumulator' : 'Single',
                    b.match_name || '',
                    formatBetTypeName(b.bet_type),
                    parseFloat(b.odds || 2).toFixed(2),
                    amount.toFixed(2),
                    payout.toFixed(2),
                    (profit >= 0 ? '+' : '') + profit.toFixed(2),
                    b.status || '',
                    b.settlement_reason || ''
                ];
            });
            
            let csv = headers.join(',') + '\n' + rows.map(r => r.map(c => `"${c}"`).join(',')).join('\n');
            const blob = new Blob([csv], { type: 'text/csv' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `xlodon-bets-${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
        }
        
        function startAutoRefresh() {
            if (refreshInterval) clearInterval(refreshInterval);
            refreshInterval = setInterval(() => {
                loadBets();
                loadBalance();
            }, 30000);
        }
        
        // ===== INITIALIZATION =====
        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = '../login.html';
                return;
            }
            
            await loadBalance();
            await loadBets();
            startAutoRefresh();
        });
        
        // Filter chips
        document.querySelectorAll('.filter-chip').forEach(chip => {
            chip.addEventListener('click', function() {
                document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
                this.classList.add('active');
                filterBets(this.dataset.filter);
            });
        });
        
        // Cleanup
        window.addEventListener('beforeunload', () => {
            if (refreshInterval) clearInterval(refreshInterval);
            settlementTimers.forEach(clearInterval);
        });
        
        // Expose global functions
        window.toggleLanguage = toggleLanguage;
        window.closeModal = closeModal;
        window.cancelBet = cancelBet;
        window.cashoutBet = cashoutBet;
        window.showDetails = showDetails;
        window.exportBetsToCSV = exportBetsToCSV;
        
        console.log('✅ My Bets page fully loaded');
        console.log('   - Cancel: ONLY before match start, ONE TIME ONLY');
        console.log('   - Cash Out: ONLY during live matches, ONE TIME ONLY');
        console.log('   - Once action taken, bet is locked forever');
        console.log('   - Single bets show team logos');
        console.log('   - Accumulator bets show all selections');
    </script>
</body>
</html>
