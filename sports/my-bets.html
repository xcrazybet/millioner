        const currentBalance = doc.exists ? (doc.data().balance || 0) : 0;
        const newBalance = parseFloat((currentBalance + amount).toFixed(2));
        
        transaction.update(walletRef, { 
            balance: newBalance, 
            updated_at: new Date().toISOString() 
        });
        
        const logRef = db.collection('transactions').doc();
        transaction.set(logRef, {
            user_id: userId,
            bet_id: betId,
            amount: amount,
            type: transactionType,
            balance_before: currentBalance,
            balance_after: newBalance,
            timestamp: new Date().toISOString(),
            description: metaData.reason || `${transactionType}: $${amount.toFixed(2)}`
        });
    });
}

async function loadBalance(){try{const u=auth.currentUser;if(!u)return 0;const d=await db.collection('wallets').doc(u.uid).get();const b=d.exists?(d.data().balance||0):1000;const el=document.getElementById('balance-display');if(el)el.textContent=`$${b.toFixed(2)}`;return b;}catch(e){return 0;}}

function extractTeamDetails(teamInput, fallbackName) {
    const safeFallback = (fallbackName && fallbackName !== 'Home' && fallbackName !== 'Away') ? fallbackName : 'Team';
    if (!teamInput) return { name: safeFallback, logo: '' };
    if (typeof teamInput === 'object') {
        const parsedName = teamInput.name && teamInput.name !== 'Home' && teamInput.name !== 'Away' ? teamInput.name : safeFallback;
        return { name: parsedName, logo: teamInput.logo || '' };
    }
    if (typeof teamInput === 'string') {
        const trimmed = teamInput.trim();
        if (trimmed.startsWith('{')) {
            try {
                const parsedObj = JSON.parse(trimmed);
                const parsedName = parsedObj.name && parsedObj.name !== 'Home' && parsedObj.name !== 'Away' ? parsedObj.name : safeFallback;
                return { name: parsedName, logo: parsedObj.logo || '' };
            } catch(e) {}
        }
        if (trimmed !== '' && trimmed !== 'Home' && trimmed !== 'Away') return { name: trimmed, logo: '' };
    }
    return { name: safeFallback, logo: '' };
}

async function fetchMatchFromAPI(fid){
    try{
        const r=await fetch(`${API_BASE}/api/fixture/${fid}`);
        if(!r.ok)return null;
        const d=await r.json();
        if(d.success&&d.fixture){
            const f=d.fixture,g=f.goals||{home:0,away:0},sc=f.score||{fulltime:{home:0,away:0},halftime:{home:0,away:0}};
            return {
                fixture_id: f.fixture?.id||fid,
                status: f.fixture?.status?.short||'NS',
                elapsed: f.fixture?.status?.elapsed||0,
                home_team: extractTeamDetails(f.teams?.home, 'Home'),
                away_team: extractTeamDetails(f.teams?.away, 'Away'),
                league_name: f.league?.name||'',
                start_time: f.fixture?.date||'',
                goals_home: g.home||sc.fulltime?.home||0,
                goals_away: g.away||sc.fulltime?.away||0,
                ht_home: sc.halftime?.home||0,
                ht_away: sc.halftime?.away||0
            };
        }
        return null;
    } catch(e) { return null; }
}

async function fetchMatchesBatch(fids, existingDataMap = {}) {
    if (!fids || !fids.length) return {};
    const batchResult = {};
    try {
        const { data, error } = await supabaseClient.from('sports_matches').select('*').in('fixture_id', fids);
        if (!error && data) {
            data.forEach(row => {
                const previousHome = existingDataMap[row.fixture_id]?.home_team?.name || 'Home';
                const previousAway = existingDataMap[row.fixture_id]?.away_team?.name || 'Away';
                const homeDetails = extractTeamDetails(row.home_team, previousHome);
                const awayDetails = extractTeamDetails(row.away_team, previousAway);
                let score = row.score;
                if (typeof score === 'string') { try { score = JSON.parse(score); } catch(e){} }
                batchResult[row.fixture_id] = {
                    fixture_id: row.fixture_id,
                    status: row.status,
                    elapsed: row.elapsed || 0,
                    home_team: homeDetails,
                    away_team: awayDetails,
                    league_name: row.league_name || '',
                    start_time: row.start_time || '',
                    goals_home: score?.home !== undefined ? score.home : 0,
                    goals_away: score?.away !== undefined ? score.away : 0,
                    ht_home: score?.halftime?.home !== undefined ? score.halftime.home : 0,
                    ht_away: score?.halftime?.away !== undefined ? score.halftime.away : 0
                };
            });
        }
    } catch(e) { console.warn('Batch DB fetch error', e); }

    const missingFids = fids.filter(fid => !batchResult[fid]);
    if (missingFids.length > 0) {
        const liveFetches = await Promise.all(missingFids.map(async (fid) => {
            const apiMatch = await fetchMatchFromAPI(fid);
            return { fid, data: apiMatch };
        }));
        liveFetches.forEach(res => {
            if (res.data) {
                const previousHome = existingDataMap[res.fid]?.home_team?.name || 'Home';
                const previousAway = existingDataMap[res.fid]?.away_team?.name || 'Away';
                res.data.home_team = extractTeamDetails(res.data.home_team, previousHome);
                res.data.away_team = extractTeamDetails(res.data.away_team, previousAway);
                batchResult[res.fid] = res.data;
            }
        });
    }
    return batchResult;
}

function isBetPlacedBeforeKickoff(bet,match){if(!bet.placed_at||!match||!match.start_time)return true;const bp=new Date(bet.placed_at);const mk=new Date(match.start_time);return bp<mk;}

// Win Probability calculations
function calculateWinProbability(bt,hg,ag,tg,elapsed){const rm=Math.max(1,90-elapsed);const gpm=tg/Math.max(elapsed,1);
    switch(bt){case'home':return calcHomeWinProb(hg,ag,elapsed,rm);case'draw':return calcDrawProb(hg,ag,elapsed,rm);case'away':return calcAwayWinProb(hg,ag,elapsed,rm);
    case'over25':return tg>=3?1:calcOverProb(tg,2.5,rm,gpm);case'under25':return 1-(tg>=3?1:calcOverProb(tg,2.5,rm,gpm));
    case'btts_yes':return calcBTTSYesProb(hg,ag,rm,gpm);case'btts_no':return 1-calcBTTSYesProb(hg,ag,rm,gpm);
    default:return 0.50;}
}

function calcHomeWinProb(hg,ag,elapsed,rm){const gd=hg-ag;const rr=rm/90;if(gd>=3)return 0.98;if(gd===2)return 0.92-(rr*0.04);if(gd===1)return 0.78-(rr*0.18);if(gd===0)return 0.42-(rr*0.06);if(gd===-1)return 0.18-(rr*0.06);if(gd===-2)return 0.05;return 0.02;}
function calcDrawProb(hg,ag,elapsed,rm){const gd=Math.abs(hg-ag);if(gd===0){if(elapsed>75)return 0.70;if(elapsed>60)return 0.55;if(elapsed>30)return 0.35;return 0.28;}if(gd===1){if(elapsed>80)return 0.08;if(elapsed>60)return 0.15;if(elapsed>30)return 0.22;return 0.25;}if(gd===2)return elapsed>70?0.03:0.08;return 0.02;}
function calcAwayWinProb(hg,ag,elapsed,rm){return calcHomeWinProb(ag,hg,elapsed,rm);}
function calcOverProb(c,t,rm,gpm){if(c>t)return 1;const n=t-c;const e=c+(gpm*rm);if(e>=t+0.5)return 0.85;if(e>=t)return 0.65;if(e>=t-0.5)return 0.40;if(rm<10)return n<=0.5?0.08:0.02;if(rm<20)return n<=0.5?0.18:(n<=1?0.10:0.04);if(rm<35)return n<=0.5?0.35:(n<=1?0.22:0.10);return n<=0.5?0.55:(n<=1?0.35:0.18);}
function calcBTTSYesProb(hg,ag,rm,gpm){if(hg>0&&ag>0)return 1;const bn=hg===0&&ag===0;const on=(hg===0&&ag>0)||(hg>0&&ag===0);if(bn){if(rm<10)return 0.04;if(rm<20)return 0.12;if(rm<35)return 0.25;return 0.40;}if(on){if(rm<5)return 0.06;if(rm<15)return 0.15;if(rm<30)return 0.28;return 0.45;}return 0.50;}

function calculateCashoutValue(bet, match, partialPct = 100) {
    if (!match) {
        const stake = parseFloat(bet.amount || 0) * (partialPct / 100);
        return { value: parseFloat((stake * 0.8).toFixed(2)), winProbability: 0.5, profit: parseFloat(((stake * 0.8) - stake).toFixed(2)), margin: 0.05, timeRemaining: 45 };
    }
    const stake = parseFloat(bet.amount || 0) * (partialPct / 100);
    const potentialReturn = stake * parseFloat(bet.odds || 2);
    const elapsed = match.elapsed || 0;
    const remainingMinutes = Math.max(1, 90 - elapsed);
    const winProb = calculateWinProbability(bet.bet_type, match.goals_home||0, match.goals_away||0, (match.goals_home||0)+(match.goals_away||0), elapsed);
    const timeFactor = Math.pow(remainingMinutes / 90, 0.7);
    let cashoutVal = potentialReturn * winProb * timeFactor;
    const margin = 0.05;
    cashoutVal *= (1 - margin);
    const floor = stake * 0.05;
    const ceiling = potentialReturn * 0.95;
    return {
        value: parseFloat(Math.max(floor, Math.min(ceiling, cashoutVal)).toFixed(2)),
        winProbability: winProb,
        profit: parseFloat((cashoutVal - stake).toFixed(2)),
        margin: margin,
        timeRemaining: remainingMinutes
    };
}

// ============================================
// FIXED SETTLEMENT - Only credits PROFIT
// ============================================
async function settleBet(bet,result){
    let ns, pay, pr, fullPayout;
    if (result.refund) {
        ns = 'cancelled'; 
        pay = bet.amount;  // Refund the stake
        pr = 0;
        fullPayout = bet.amount;
    } else {
        ns = result.won ? 'won' : 'lost';
        fullPayout = result.won ? (bet.amount * bet.odds) : 0;
        
        // 🔧 FIXED: Only credit PROFIT (stake already deducted when bet was placed)
        if (result.won) {
            pay = fullPayout - bet.amount;  // ONLY THE PROFIT
            pr = pay;
        } else {
            pay = 0;   // Lost bet - no refund
            pr = -bet.amount;  // Lost the stake
        }
    }
    
    try{
        await supabaseClient.from('bets').update({
            status: ns, 
            payout: fullPayout,  // Store full payout for display
            settlement_reason: result.reason, 
            settled_at: new Date().toISOString(), 
            updated_at: new Date().toISOString(),
            profit_loss: pr  // Store actual profit/loss
        }).eq('id', bet.id).eq('status', 'active');
        
        // 🔧 Only credit the PROFIT amount (stake was already deducted at bet placement)
        if(pay > 0) {
            await executeSecurePayoutAPI(
                bet.user_id, 
                bet.id, 
                pay,  // Only the profit
                'settlement_payout', 
                { 
                    reason: result.reason,
                    full_payout: fullPayout,
                    stake: bet.amount,
                    profit: pay,
                    odds: bet.odds
                }
            );
        }
        
        bet.status = ns;
        bet.payout = fullPayout;
        bet.settlement_reason = result.reason;
        bet.settled_at = new Date().toISOString();
        bet.profit_loss = pr;
        
        if (result.refund) {
            showNotification(`↩️ VOID/REFUND: ${escapeHtml(bet.match_name||'Match')} - $${pay.toFixed(2)} refunded`,'info');
        } else if (result.won) {
            showNotification(`🏆 WON: ${escapeHtml(bet.match_name||'Match')} - Profit: +$${pay.toFixed(2)} (Total Payout: $${fullPayout.toFixed(2)})`,'success');
        } else {
            showNotification(`❌ LOST: ${escapeHtml(bet.match_name||'Match')} - Lost: $${bet.amount.toFixed(2)}`,'error');
        }
        
        await loadBalance();
        updateStats();
        updateCounts();
        filterBets(currentFilter);
    }catch(e){ 
        console.error('Settle exception', e); 
    }
}

function determineBetResult(bet, match) {
    if (!match) return null;
    const status = (match.status || '').toUpperCase();
    if (status !== 'FINISHED' && status !== 'FT' && status !== 'AET' && status !== 'PEN') {
        return null;
    }

    const hg = parseInt(match.goals_home !== undefined ? match.goals_home : 0);
    const ag = parseInt(match.goals_away !== undefined ? match.goals_away : 0);
    const tg = hg + ag;
    const bt = bet.bet_type;

    switch (bt) {
        case 'home': return { won: hg > ag, reason: `Finished: ${hg}-${ag} (Home Win)` };
        case 'away': return { won: ag > hg, reason: `Finished: ${hg}-${ag} (Away Win)` };
        case 'draw': return { won: hg === ag, reason: `Finished: ${hg}-${ag} (Draw)` };
        case 'over25': return { won: tg > 2.5, reason: `Finished: ${hg}-${ag} (Over 2.5 Goals)` };
        case 'under25': return { won: tg < 2.5, reason: `Finished: ${hg}-${ag} (Under 2.5 Goals)` };
        case 'btts_yes': return { won: hg > 0 && ag > 0, reason: `Finished: ${hg}-${ag} (BTTS Yes)` };
        case 'btts_no': return { won: !(hg > 0 && ag > 0), reason: `Finished: ${hg}-${ag} (BTTS No)` };
        default: return null;
    }
}

async function autoSettleBets(){
    const ab = allBets.filter(b => b.status === 'active' && !settledBets.has(b.id) && !localProcessingBets.has(b.id));
    if(!ab.length) return;
    const uniqueFids = [...new Set(ab.map(b => b.fixture_id).filter(Boolean))];
    const matchMap = await fetchMatchesBatch(uniqueFids);

    for(const bet of ab){
        if(!bet.fixture_id) continue;
        try{
            const m = matchMap[bet.fixture_id];
            if(!m || (m.status !== 'finished' && m.status !== 'FT' && m.status !== 'AET' && m.status !== 'PEN')) continue;
            
            localProcessingBets.add(bet.id);
            const result = determineBetResult(bet, m);
            if(result){
                await settleBet(bet, result);
                settledBets.add(bet.id);
            }
            localProcessingBets.delete(bet.id);
        }catch(e){ 
            localProcessingBets.delete(bet.id);
            console.warn('Auto settlement cycle exception', e); 
        }
    }
}

async function cancelBet(betId){
    const bet = allBets.find(b => b.id === betId);
    if(!bet || bet.status !== 'active'){ showNotification('❌ Cannot cancel','error'); return; }
    if(bet.bet_type === 'accumulator'){ showNotification('❌ Accumulators cannot be cancelled','error'); return; }
    if(settledBets.has(betId) || localProcessingBets.has(betId)) return;
    
    let ms = false;
    if(bet.fixture_id){
        const m = await fetchMatchFromAPI(bet.fixture_id);
        if(m){
            const n = new Date(), ko = new Date(m.start_time);
            const msl = (m.status||'').toLowerCase();
            ms = msl === 'live' || msl === '1h' || msl === '2h' || msl === 'ht' || msl === 'finished' || msl === 'ft' || ko < n;
        }
    }
    if(ms){ showNotification('❌ Match started - Cancel unavailable','error'); return; }
    
    const fp = 5, ra = bet.amount * (1 - fp/100), fee = bet.amount - ra;
    if(!confirm(`Cancel?\n\nStake: $${bet.amount.toFixed(2)}\nRefund: $${ra.toFixed(2)}\nFee (${fp}%): $${fee.toFixed(2)}`)) return;
    
    try{
        localProcessingBets.add(betId);
        await supabaseClient.from('bets').update({
            status: 'cancelled', cancellation_fee: fee, refund_amount: ra, cancelled_at: new Date().toISOString(), 
            settlement_reason: `Cancelled - ${fp}% fee`, updated_at: new Date().toISOString()
        }).eq('id', betId).eq('status', 'active');
        settledBets.add(betId);
        
        await executeSecurePayoutAPI(bet.user_id, bet.id, ra, 'cancel_refund', { reason: `Cancelled - ${fp}% fee` });
        bet.status = 'cancelled';
        showNotification(`✅ Refunded: $${ra.toFixed(2)}`,'success');
        await loadBalance();
        updateStats();
        updateCounts();
        filterBets(currentFilter);
        localProcessingBets.delete(betId);
    }catch(e){
        localProcessingBets.delete(betId);
        showNotification(`Error: ${e.message}`,'error');
    }
}

async function cashoutBet(betId, partialPct = 100, isAutoTrigger = false){
    const bet = allBets.find(b => b.id === betId);
    if(!bet || bet.status !== 'active'){ showNotification('❌ Cannot cash out','error'); return; }
    if(settledBets.has(betId) || localProcessingBets.has(betId)) return;
    
    const baseStake = parseFloat(bet.amount || 0);
    const partialAmt = baseStake * (partialPct / 100);
    const remainingStake = baseStake - partialAmt;

    if (partialPct < 100 && remainingStake < 1.00) {
        showNotification('❌ Remaining stake cannot fall below $1.00','error');
        return;
    }

    let ml = false;
    if(bet.fixture_id){
        const m = await fetchMatchFromAPI(bet.fixture_id);
        if(m){
            if(!isBetPlacedBeforeKickoff(bet, m)){
                showNotification('🔒 Cash Out locked - This bet was placed during live match.','warning');
                return;
            }
            const ms = (m.status||'').toLowerCase();
            ml = ms === 'live' || ms === '1h' || ms === '2h' || ms === 'ht';
            const isHalftime = ms === 'ht';

            if(ml && !isHalftime){
                localProcessingBets.add(betId);
                const co = calculateCashoutValue(bet, m, partialPct);
                const pt = co.profit >= 0 ? `+$${co.profit.toFixed(2)} PROFIT` : `-$${Math.abs(co.profit).toFixed(2)} LOSS`;
                
                if(!isAutoTrigger && !confirm(`Confirm Cash Out (${partialPct}%)?\n\nReceived: $${co.value.toFixed(2)}\nProfit/Loss: ${pt}`)) {
                    localProcessingBets.delete(betId);
                    return;
                }
                
                try{
                    if (partialPct === 100) {
                        await supabaseClient.from('bets').update({
                            status: 'cashed-out', cashout_amount: co.value, cashed_out_at: new Date().toISOString(), 
                            settlement_reason: `Cashed out 100%`, updated_at: new Date().toISOString()
                        }).eq('id', betId).eq('status', 'active');
                        settledBets.add(betId);
                        bet.status = 'cashed-out';
                    } else {
                        let p_hist = bet.partial_history || [];
                        p_hist.push({ timestamp: new Date().toISOString(), percentage: partialPct, cashed_out_val: co.value, stake_before: baseStake, stake_after: remainingStake });
                        await supabaseClient.from('bets').update({
                            amount: remainingStake, partial_history: p_hist, updated_at: new Date().toISOString()
                        }).eq('id', betId);
                        bet.amount = remainingStake;
                        bet.partial_history = p_hist;
                        showNotification(`Partial cashout complete. Remaining stake: $${remainingStake.toFixed(2)}`, 'success');
                    }

                    await executeSecurePayoutAPI(bet.user_id, bet.id, co.value, 'partial_cashout', { percentage: partialPct });
                    await loadBalance();
                    updateStats();
                    updateCounts();
                    filterBets(currentFilter);
                    localProcessingBets.delete(betId);
                }catch(e){
                    localProcessingBets.delete(betId);
                    showNotification(`Error: ${e.message}`,'error');
                }
            }
        }
    }
    if(!ml){ showNotification('❌ Cash Out only during live matches','error'); return; }
}

        const { data, error } = await supabaseClient.from('bets').select('*').eq('user_id', u.uid).order('placed_at', { ascending: false });

        }

function sortBets(bets) {
    const now = new Date();
    const active = [], settled = [];
    
    bets.forEach(b => {
        if (b.status === 'active') {
            let isOverdue = false;
            if (b._kickoff) {
                const ko = new Date(b._kickoff);
                if (now > new Date(ko.getTime() + 115 * 60000)) isOverdue = true;
            }
            const ms = (b._matchStatus || '').toLowerCase();
            if (ms === 'finished' || ms === 'ft' || ms === 'aet' || ms === 'pen') isOverdue = true;
            active.push({ bet: b, isOverdue });
        } else { settled.push(b); }
    });
    
    active.sort((x, y) => {
        if (x.isOverdue !== y.isOverdue) return x.isOverdue ? 1 : -1;
        const kX = x.bet._kickoff ? new Date(x.bet._kickoff).getTime() : Infinity;
        const kY = y.bet._kickoff ? new Date(y.bet._kickoff).getTime() : Infinity;
        return kX - kY;
    });
    
    settled.sort((x, y) => {
        const tX = new Date(x.settled_at || x.cashed_out_at || x.cancelled_at || x.placed_at || 0).getTime();
        const tY = new Date(y.settled_at || y.cashed_out_at || y.cancelled_at || y.placed_at || 0).getTime();
        return tY - tX;
    });
    return [...active.map(a => a.bet), ...settled];
}

function startSettlementTimers(){
    settlementTimers.forEach(clearInterval);
    settlementTimers = [];
    allBets.filter(b => b.status === 'active').forEach(bet => {
        const el = document.getElementById(`timer-${bet.id}`);
        if(!el) return;
        const u = () => {
            const ko = bet._kickoff ? new Date(bet._kickoff) : null;
            if(!ko){ el.textContent = 'TBD'; return; }
            const ee = new Date(ko.getTime() + 115*60000), n = new Date(), d = ee - n;
            const ms = (bet._matchStatus || '').toLowerCase();
            const isMatchEnded = ms === 'finished' || ms === 'ft' || ms === 'aet' || ms === 'pen';

            if (isMatchEnded || d <= 0) {
                el.innerHTML = '<span style="color:var(--success);font-weight:bold;">Settling...</span>';
            } else {
                const h = Math.floor(d/3600000), m = Math.floor((d%3600000)/60000);
                el.textContent = h > 0 ? `${h}h ${m}m` : `${m}m`;
                if(m < 10 && h === 0) el.classList.add('urgent');
            }
        };
        u();
        settlementTimers.push(setInterval(u, 60000));
    });
}

function formatBetTypeName(bt){
    const n = {'home':'🏠 Home Win','draw':'🤝 Draw','away':'✈️ Away Win','over25':'Over 2.5','under25':'Under 2.5','btts_yes':'BTTS Yes','btts_no':'BTTS No','accumulator':'Accumulator'};
    return n[bt] || bt.replace(/_/g,' ').replace(/\b\w/g,l=>l.toUpperCase());
}

function updateStats(){
    const t = allBets.length, w = allBets.filter(b => b.status === 'won'), l = allBets.filter(b => b.status === 'lost'), a = allBets.filter(b => b.status === 'active');
    let wa = 0, la = 0, np = 0;
    w.forEach(b => {
        const fullPayout = parseFloat(b.payout || b.potential_win || 0);
        const stake = parseFloat(b.amount || 0);
        wa += fullPayout;
        np += (fullPayout - stake);
    });
    l.forEach(b => {
        const stake = parseFloat(b.amount || 0);
        la += stake;
        np -= stake;
    });
    allBets.filter(b => b.status === 'cashed-out').forEach(b => {
        np += parseFloat(b.cashout_amount || 0) - parseFloat(b.amount || 0);
    });
    const wr = (w.length + l.length) > 0 ? ((w.length/(w.length + l.length))*100).toFixed(1) : 0;
    
    document.getElementById('total-bets').textContent = t;
    document.getElementById('total-won').textContent = w.length;
    document.getElementById('total-lost').textContent = l.length;
    document.getElementById('total-active').textContent = a.length;
    document.getElementById('won-amount').textContent = `$${wa.toFixed(2)}`;
    document.getElementById('lost-amount').textContent = `$${la.toFixed(2)}`;
    document.getElementById('win-rate-display').textContent = `${wr}%`;
    document.getElementById('win-rate-fill').style.width = `${wr}%`;
    const pe = document.getElementById('total-pl');
    pe.textContent = (np >= 0 ? '+' : '') + '$' + np.toFixed(2);
    pe.style.color = np >= 0 ? '#4caf50' : 'var(--danger)';
}

function updateCounts(){
    const c = {
        all: allBets.length,
        active: allBets.filter(b => b.status === 'active').length,
        won: allBets.filter(b => b.status === 'won').length,
        lost: allBets.filter(b => b.status === 'lost').length,
        cancelled: allBets.filter(b => b.status === 'cancelled').length,
        'cashed-out': allBets.filter(b => b.status === 'cashed-out').length
    };
    for(const [k, v] of Object.entries(c)){
        const e = document.getElementById(`cnt-${k}`);
        if(e) e.textContent = v;
    }
}

function filterBets(f){
    currentFilter = f;
    let fl = sortBets(allBets);
    if(f !== 'all') fl = fl.filter(b => b.status === f);

    const sVal = document.getElementById('bet-search-input')?.value.toLowerCase().trim();
    if (sVal) {
        fl = fl.filter(b => {
            const matchName = (b.match_name || '').toLowerCase();
            const league = (b._league || '').toLowerCase();
            const ticket = ('XL' + (b.id?.toString().slice(-8) || '').toUpperCase()).toLowerCase();
            return matchName.includes(sVal) || league.includes(sVal) || ticket.includes(sVal);
        });
    }
    
    const c = document.getElementById('bet-list-container');
    if(c){
        if(!fl.length){
            c.innerHTML = `<div class="empty-state"><i class="fas fa-ticket-alt"></i><p>No bets found</p></div>`;
            return;
        }
        c.innerHTML = fl.map(b => createBetCard(b)).join('');
    }
    startSettlementTimers();
}

function createBetCard(bet){
    const isAcc = bet.bet_type === 'accumulator', amt = parseFloat(bet.amount || 0), odds = parseFloat(bet.odds || 2);
    const fullPayout = parseFloat(bet.payout || bet.potential_win || 0);
    const pr = bet.status === 'won' ? (fullPayout - amt) : (bet.status === 'lost' ? -amt : (bet.status === 'cashed-out' ? (parseFloat(bet.cashout_amount || 0) - amt) : 0));
    const tk = 'XL' + (bet.id?.toString().slice(-8) || '00000000').toUpperCase();
    const isActive = bet.status === 'active';
    const ms = (bet._matchStatus || '').toLowerCase();
    const isLive = ms === 'live' || ms === '1h' || ms === '2h' || ms === 'ht';
    const matchStarted = isLive || ms === 'finished' || ms === 'ft' || (bet._kickoff && new Date(bet._kickoff) < new Date());
    const isPreMatch = bet._isPreMatch !== undefined ? bet._isPreMatch : true;
    const isHalftime = ms === 'ht';
    
    const canCancel = isActive && !isAcc && !matchStarted && !settledBets.has(bet.id);
    const canCashout = isActive && !settledBets.has(bet.id) && matchStarted && isPreMatch && !isHalftime;
    
    let cashoutPreview = '';
    if(canCashout && !isHalftime){
        let displaysCoValue = amt * odds * 0.45;
        let displayProb = 45;
        let pcStatus = 'neutral';
        
        if (bet._match) {
            const co = calculateCashoutValue(bet, bet._match, 100);
            displaysCoValue = co.value;
            displayProb = co.winProbability * 100;
            pcStatus = co.value >= amt ? 'winning' : 'neutral';
        }
        
        cashoutPreview = `
        <div class="cashout-preview">
            <div class="cashout-metrics">
                <span>Win Prob: <span class="prob ${pcStatus}">${displayProb.toFixed(1)}%</span></span>
                <span>Max Cash Out: <span style="color:${displaysCoValue>=amt?'#4caf50':'var(--danger)'};font-weight:bold;" id="cashout-amount-${bet.id}">$${displaysCoValue.toFixed(2)}</span></span>
            </div>
            <div class="partial-cashout-box">
                <span style="font-size:10px;">Stake to cash: <strong id="pct-val-${bet.id}">100%</strong></span>
                <input type="range" class="partial-slider" min="10" max="100" step="10" value="100" 
                    oninput="updatePartialCashoutLabel('${bet.id}', this.value)" 
                    id="slider-${bet.id}">
            </div>
        </div>`;
    } else if(isHalftime) {
        cashoutPreview = `
        <div class="cashout-preview" style="border-color:var(--orange); background:rgba(255,152,0,0.05);">
            <div style="color:var(--orange); font-weight:bold; display:flex; align-items:center; gap:6px;">
                <i class="fas fa-pause-circle"></i> ⏸️ Cash Out temporarily suspended - Resumes in 2nd Half
            </div>
        </div>`;
    }
    
    const ht = bet._homeTeam || {name:'Home',logo:''}, at = bet._awayTeam || {name:'Away',logo:''};
    const hl = ht.logo || `https://ui-avatars.com/api/?name=${encodeURIComponent(ht.name?.substring(0,2)||'H')}&size=32&background=1a2332&color=00ff9d`;
    const al = at.logo || `https://ui-avatars.com/api/?name=${encodeURIComponent(at.name?.substring(0,2)||'A')}&size=32&background=1a2332&color=ff9800`;
    
    const sd = bet._score ? `<span class="bet-score-display${isLive?' live':''}">${bet._score.home} - ${bet._score.away}</span>` : '';
    const kd = bet._kickoff ? formatFullDate(bet._kickoff) : 'TBD';
    const se = bet._kickoff ? formatFullDate(new Date(new Date(bet._kickoff).getTime() + 115*60000)) : 'TBD';
    
    let ah = '<div class="bet-actions">';
    ah += `<div class="bet-action-row-buttons" style="margin-top:5px;">`;
    if(canCancel) ah += `<button class="cancel-btn" onclick="event.stopPropagation();cancelBet('${bet.id}')"><i class="fas fa-ban"></i> Cancel</button>`;
    else if(isAcc && isActive && !matchStarted) ah += `<span class="action-info"><i class="fas fa-info-circle"></i> Accas cannot be cancelled</span>`;
    
    if(canCashout) {
        ah += `<button class="cashout-btn" onclick="event.stopPropagation();cashoutBet('${bet.id}', parseInt(document.getElementById('slider-${bet.id}').value))"><i class="fas fa-money-bill-wave"></i> Confirm Cash Out</button>`;
    } else if(isActive && isHalftime) {
        ah += `<button class="cashout-btn" style="opacity:0.5; cursor:not-allowed;" disabled><i class="fas fa-pause"></i> Cash Out Suspended</button>`;
    }
    ah += '</div>';
    ah += `<button class="btn-action-tool" onclick="event.stopPropagation(); printBetReceipt('${bet.id}')" style="margin-top: 5px; width: 100%; justify-content: center; font-size: 11px; background: var(--bg-tertiary);"><i class="fas fa-file-pdf"></i> Download Slip Receipt</button>`;
    ah += '</div>';
    
    return `<div class="bet-card ${bet.status}" onclick="showDetails('${bet.id}')">
        <div class="bet-top">
            <div>
                <span class="bet-type-tag ${isAcc?'accumulator':'single'}">${isAcc?'ACCUMULATOR':'SINGLE'}</span>
                <span class="bet-ticket-num">#${tk}</span>
                ${!isPreMatch&&isActive?`<span class="live-bet-badge"><i class="fas fa-bolt"></i> LIVE BET</span>`:''}
            </div>
            <span class="bet-status-badge ${bet.status}">${bet.status==='won'?'🏆 WON':bet.status==='lost'?'❌ LOST':bet.status==='cancelled'?'⛔ CANCELLED':bet.status==='cashed-out'?'💰 CASHED OUT':'⏳ ACTIVE'}</span>
        </div>
        <div class="bet-body">
            <div class="bet-match-row">
                <img class="team-logo-small" src="${hl}" onerror="this.style.display='none'" alt="">
                <div class="bet-match-name">${escapeHtml(ht.name||'Home')} <span style="color:var(--text2);">vs</span> ${escapeHtml(at.name||'Away')}${sd}</div>
                <img class="team-logo-small" src="${al}" onerror="this.style.display='none'" alt="">
            </div>
            <div class="bet-league">${escapeHtml(bet._league||'')}${bet._elapsed?` | ${bet._elapsed}'`:''} | ${ms.toUpperCase()}</div>
            <div class="bet-pick">${escapeHtml(formatBetTypeName(bet.bet_type))} <span>@${odds.toFixed(2)}</span></div>
        </div>
        <div class="bet-meta-row">
            <span><i class="fas fa-calendar-plus"></i> Placed: ${formatFullDate(bet.placed_at)}</span>
            <span><i class="fas fa-clock"></i> Kickoff: ${kd}</span>
            ${isActive?`<span><i class="fas fa-hourglass-end"></i> Settle by: ${se}</span>`:''}
        </div>
        ${cashoutPreview}
        <div class="bet-details-grid">
            <div class="bet-detail"><div class="lbl">Stake</div><div class="val">$${amt.toFixed(2)}</div></div>
            <div class="bet-detail"><div class="lbl">${isActive?'Potential':'Payout'}</div><div class="val">$${fullPayout.toFixed(2)}</div></div>
            <div class="bet-detail"><div class="lbl">P/L</div><div class="val" style="color:${pr>=0?'#4caf50':'var(--danger)'}">${pr>=0?'+':''}$${Math.abs(pr).toFixed(2)}</div></div>
            ${isActive?`<div class="bet-detail"><div class="lbl">Est. Settlement</div><div class="val"><span class="settlement-timer" id="timer-${bet.id}">...</span></div></div>`:''}
        </div>
        ${bet.settlement_reason?`<div class="bet-result-row ${bet.status}"><i class="fas fa-gavel"></i> ${escapeHtml(bet.settlement_reason)}</div>`:''}
        ${ah}
    </div>`;
}

    const amt = parseFloat(bet.amount || 0), fullPayout = parseFloat(bet.payout || bet.potential_win || 0);
    const pr = bet.status === 'won' ? (fullPayout - amt) : (bet.status === 'lost' ? -amt : (bet.status === 'cashed-out' ? (parseFloat(bet.cashout_amount || 0) - amt) : 0));
    const tk = 'XL' + (bet.id?.toString().slice(-8) || '00000000').toUpperCase();
    const placed = bet.placed_at ? new Date(bet.placed_at) : new Date();
    const ht = bet._homeTeam || {name:'Home',logo:''}, at = bet._awayTeam || {name:'Away',logo:''};

            <div class="modal-row"><span class="lbl">Type</span><span>${bet.bet_type==='accumulator'?'Accumulator':'Single'}${!isPreMatch?' <span style="color:var(--danger);font-size:10px;">(LIVE BET)</span>':''}</span></div>
            <div class="modal-row"><span class="lbl">Status</span><span>${bet.status?.toUpperCase()}</span></div>

            <div class="modal-row"><span class="lbl">League</span><span>${escapeHtml(bet._league||'N/A')}</span></div>

        </div>
        <div class="modal-section"><h4><i class="fas fa-calendar-alt"></i> Timeline</h4>

            ${bet.settled_at?`<div class="modal-row"><span class="lbl">Settled</span><span>${new Date(bet.settled_at).toLocaleString()}</span></div>`:''}
        </div>
        <div class="modal-section"><h4><i class="fas fa-info-circle"></i> Bet Details</h4>
            <div class="modal-row"><span class="lbl">Pick</span><span>${escapeHtml(formatBetTypeName(bet.bet_type))}</span></div>
            <div class="modal-row"><span class="lbl">Odds</span><span>${parseFloat(bet.odds||2).toFixed(2)}</span></div>
        </div>
        <div class="modal-section"><h4><i class="fas fa-chart-line"></i> Financial</h4>
            <div class="modal-row"><span class="lbl">Stake</span><span>$${amt.toFixed(2)}</span></div>
            <div class="modal-row"><span class="lbl">Total Payout</span><span>$${fullPayout.toFixed(2)}</span></div>
            <div class="modal-row"><span class="lbl">P/L</span><span style="color:${pr>=0?'#4caf50':'var(--danger)'}">${pr>=0?'+':''}$${pr.toFixed(2)}</span></div>
        </div>
        ${bet.settlement_reason?`<div class="modal-section"><h4><i class="fas fa-gavel"></i> Settlement</h4><div class="modal-row"><span class="lbl">Reason</span><span>${escapeHtml(bet.settlement_reason)}</span></div></div>`:''}
        <div class="modal-section"><h4><i class="fas fa-headset"></i> Support</h4><div class="modal-row"><span class="lbl">Ticket</span><span><strong>${tk}</strong></span></div></div>
    `;
    m.classList.add('show');
}

function closeModal(e){ if(!e||e.target===document.getElementById('bet-modal')) document.getElementById('bet-modal').classList.remove('show'); }

function updatePartialCashoutLabel(betId, val) {
    document.getElementById(`pct-val-${betId}`).textContent = `${val}%`;
    const bet = allBets.find(b => b.id === betId);
    if (!bet || !bet._match) return;
    const co = calculateCashoutValue(bet, bet._match, val);
    document.getElementById(`cashout-amount-${betId}`).textContent = `$${co.value.toFixed(2)}`;
}

function printBetReceipt(betId) {
    const bet = allBets.find(b => b.id === betId);
    if (!bet) { showNotification('Bet details not found', 'error'); return; }

    const placed = bet.placed_at ? new Date(bet.placed_at).toLocaleString() : 'N/A';
    const amt = parseFloat(bet.amount || 0);
    const odds = parseFloat(bet.odds || 2);
    const potential = parseFloat(bet.potential_win || 0);
    const fullPayout = parseFloat(bet.payout || 0);
    
    const printWindow = window.open('', '_blank', 'width=600,height=800');
    printWindow.document.write(`
        <html><head><title>Betting Slip - ${tk}</title>
        <style>body{font-family:monospace;padding:20px;color:#000;}.receipt{max-width:400px;margin:0 auto;border:1px solid #000;padding:15px;}.header{text-align:center;border-bottom:2px dashed #000;padding-bottom:10px;margin-bottom:10px;}.title{font-size:18px;font-weight:bold;}.row{display:flex;justify-content:space-between;margin:4px 0;}.footer{border-top:2px dashed #000;padding-top:10px;text-align:center;font-size:12px;margin-top:15px;}</style>
        </head><body onload="window.print();window.close();">

        <div class="row"><span>Ticket:</span><span>${tk}</span></div>

        <div class="row"><span>Match:</span><span>${escapeHtml(bet.match_name||'Match')}</span></div>
        <div class="row"><span>Market:</span><span>${escapeHtml(formatBetTypeName(bet.bet_type))}</span></div>
        <div class="row"><span>Odds:</span><span>@${odds.toFixed(2)}</span></div>
        <div class="row"><span>Stake:</span><span>$${amt.toFixed(2)}</span></div>
        <div class="row"><span>Potential:</span><span>$${potential.toFixed(2)}</span></div>
        ${bet.status==='won'?`<div class="row"><span>Payout:</span><span>$${fullPayout.toFixed(2)}</span></div>`:''}
        <div class="footer"><p>Thank you for playing!</p><p>Play responsibly.</p></div></div>
        </body></html>
    `);
    printWindow.document.close();
}

auth.onAuthStateChanged(async u => {
    if(!u){ window.location.href = '../login.html'; return; }
    await loadBalance();
    await loadBets();
    refreshInterval = setInterval(async () => { await loadBets(); await loadBalance(); }, 30000);
    settleInterval = setInterval(async () => { await autoSettleBets(); await loadBalance(); }, 60000);
});

document.querySelectorAll('.filter-chip').forEach(c => {
    c.addEventListener('click', function(){
        document.querySelectorAll('.filter-chip').forEach(x => x.classList.remove('active'));
        this.classList.add('active');
        filterBets(this.dataset.filter);
    });
});

document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });
window.addEventListener('beforeunload', () => {
    if(refreshInterval) clearInterval(refreshInterval);
    if(settleInterval) clearInterval(settleInterval);
    settlementTimers.forEach(clearInterval);
});
