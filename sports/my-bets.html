document.addEventListener('DOMContentLoaded', () => { cleanOldStorageEntries(); updateOnlineStatus(); document.getElementById('bet-list-container').addEventListener('click', function(e) { const card = e.target.closest('.bet-card'); if (!card || card.classList.contains('processing')) return; const betId = card.dataset.betId, actionBtn = e.target.closest('button[data-action]'); if (actionBtn) { e.stopPropagation(); if (actionBtn.dataset.action === 'cancel') cancelBet(betId); if (actionBtn.dataset.action === 'cashout') { const slider = card.querySelector('.partial-slider'); cashoutBet(betId, slider ? parseInt(slider.value) : 100); } } else showDetails(betId); }); document.getElementById('bet-list-container').addEventListener('input', function(e) { if (e.target.classList.contains('partial-slider')) { const valDisplay = e.target.closest('.bet-card')?.querySelector('.pct-val'); if (valDisplay) valDisplay.textContent = e.target.value + '%'; } }); document.getElementById('bet-modal').addEventListener('click', (e) => { if (e.target.id === 'bet-modal' || e.target.id === 'modalCloseBtn') { document.getElementById('bet-modal').classList.remove('show'); openModalBetId = null; } }); const debouncedFilter = debounce(() => filterBets(currentFilter), CONFIG.SEARCH_DEBOUNCE_MS); document.getElementById('bet-search-input').addEventListener('input', debouncedFilter); document.querySelectorAll('.filter-chip').forEach(chip => { chip.addEventListener('click', function() { document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active')); this.classList.add('active'); filterBets(this.dataset.filter); }); }); document.getElementById('themeToggleBtn').addEventListener('click', () => { document.body.classList.toggle('light-theme'); safeLocalStorageSet('theme', document.body.classList.contains('light-theme') ? 'light' : 'dark'); }); document.getElementById('langToggleBtn').addEventListener('click', () => { const isArabic = document.body.classList.toggle('arabic'); safeLocalStorageSet('lang', isArabic ? 'ar' : 'en'); document.documentElement.dir = isArabic ? 'rtl' : 'ltr'; }); document.getElementById('refreshBtn').addEventListener('click', async () => { if (!isOnline) { showNotification('📴 Cannot refresh while offline', 'warning'); return; } const btn = document.getElementById('refreshBtn'); btn.disabled = true; btn.querySelector('i').classList.add('fa-spin'); await loadBets(); await loadBalance(); btn.disabled = false; btn.querySelector('i').classList.remove('fa-spin'); showNotification('✅ Bets refreshed', 'success'); }); document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { document.getElementById('bet-modal').classList.remove('show'); openModalBetId = null; } }); auth.onAuthStateChanged(async u => { if (!u) { window.location.href = '../login.html'; return; } if (safeLocalStorageGet('theme') === 'light') document.body.classList.add('light-theme'); if (safeLocalStorageGet('lang') === 'ar') { document.body.classList.add('arabic'); document.documentElement.dir = 'rtl'; } if (DEBUG) console.log('%c🐛 Debug Mode Active %c| %cMy Bets v18.2', 'color:#00ff9d;font-weight:bold;', '', 'color:#aaa;'); settlementManager = new DuplicateProofSettlementManager(u.uid); await loadBalance(); await loadBets(); if (refreshInterval) clearInterval(refreshInterval); refreshInterval = setInterval(async () => { if (isOnline) { await loadBets(); await loadBalance(); } }, CONFIG.REFRESH_INTERVAL); if (settleInterval) clearInterval(settleInterval); if (!safeLocalStorageGet('xl_emergency_stop')) settleInterval = setInterval(async () => { if (isOnline) { await autoSettleBets(); if (settlementManager) await settlementManager.retryFailedPayouts(); await loadBalance(); } }, CONFIG.AUTO_SETTLE_INTERVAL); if (cleanMissingFixturesInterval) clearInterval(cleanMissingFixturesInterval); cleanMissingFixturesInterval = setInterval(() => { if (missingFixtureCache.size > 100) { missingFixtureCache.cleanExpired(); } }, 3600000); }); window.addEventListener('beforeunload', () => { if (refreshInterval) clearInterval(refreshInterval); if (settleInterval) clearInterval(settleInterval); if (settlementTimeout) clearTimeout(settlementTimeout); if (cleanMissingFixturesInterval) clearInterval(cleanMissingFixturesInterval); settlementTimers.forEach(clearInterval); }); }); window.loadBets = loadBets; window.loadBalance = loadBalance; window.CONFIG = CONFIG; console.log('%c✅ My Bets v18.2 %c| %cPerformance Fixed %c| %cPersistent Cache • Timeout Retry • Warmup • DB Status',
    'color:#00ff9d;font-weight:bold;font-size:14px;', '', 'color:#ff9800;font-weight:bold;', '', 'color:#aaa;font-size:10px;');
