// ║  v18: SETTLEMENT TIMER (WITH TRIGGER from v16.7)            ║
// ╚══════════════════════════════════════════════════════════════╝
function startSettlementTimers() {
    settlementTimers.forEach(clearInterval); settlementTimers = [];
    const triggeredBets = new Set(); // v18: Track bets that triggered settlement
    
    const upd = () => {
        let hasNew = false;
        allBets.filter(b => b.status === 'active').forEach(bet => {
            const els = document.querySelectorAll(`.timer-${bet.id}`); if (!els.length) return;
            const ms = (bet._matchStatus || '').toLowerCase();
            
            // v18: Timer-triggered settlement detection (from v16.7)
            if (['finished', 'ft', 'aet', 'pen'].includes(ms)) {
                els.forEach(el => { el.innerHTML = '<span style="color:var(--success);font-weight:700;">✅ Settling…</span>'; el.classList.remove('urgent'); });
                if (!triggeredBets.has(bet.id) && !settlementManager?.settledBetIds.has(bet.id)) {
                    triggeredBets.add(bet.id);
                    hasNew = true;
                }
                return;
            }
            
            const ko = bet._kickoff ? new Date(bet._kickoff) : null;
            if (!ko) { els.forEach(el => { el.textContent = '--:--:--'; el.classList.remove('urgent'); }); return; }
            const diff = new Date(ko.getTime() + CONFIG.SETTLEMENT_TIMEOUT_MINUTES * 60000) - new Date();
            if (diff <= 0) {
                els.forEach(el => { el.innerHTML = '<span style="color:var(--success);font-weight:700;">🔄 Settling Now…</span>'; el.classList.remove('urgent'); });
                if (!triggeredBets.has(bet.id) && !settlementManager?.settledBetIds.has(bet.id)) {
                    triggeredBets.add(bet.id);
                    hasNew = true;
                }
            } else {
                const h = Math.floor(diff / 3600000), m = Math.floor((diff % 3600000) / 60000), s = Math.floor((diff % 60000) / 1000), ts = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
                els.forEach(el => { el.textContent = ts; if (h === 0 && m < 5) el.classList.add('urgent'); else el.classList.remove('urgent'); });
            }
        });
        // v18: Trigger immediate settlement when timer detects finished matches
        if (hasNew) scheduleImmediateSettlement();
    };
    upd(); settlementTimers.push(setInterval(upd, 1000));
}

async function forceSettleBet(bet) {
    if (isBetLocked(bet.id)) return;
    if (!settlementManager) settlementManager = new DuplicateProofSettlementManager(auth.currentUser?.uid);
    try {
        lockBet(bet.id, bet);
        const mm = bet.fixture_id ? await fetchMatchesBatch([bet.fixture_id]) : {};
        const result = await settlementManager._settleSingleBet(bet, mm[bet.fixture_id] || null, mm);
        if (result.isOk()) { await loadBalance(); updateStats(); updateCounts(); filterBets(currentFilter); }
    } catch (e) { debugWarn(`Force settle failed for ${bet.id}:`, e.message); }
    finally { unlockBet(bet.id, bet); }
}

document.addEventListener('DOMContentLoaded', () => {
    cleanOldStorageEntries();
    updateOnlineStatus();
    
    document.getElementById('bet-list-container').addEventListener('click', function(e) {
        const card = e.target.closest('.bet-card'); if (!card || card.classList.contains('processing')) return;
        const bid = card.dataset.betId, ab = e.target.closest('button[data-action]');
        if (ab) { e.stopPropagation(); if (ab.dataset.action === 'cancel') cancelBet(bid); if (ab.dataset.action === 'cashout') { const s = card.querySelector('.partial-slider'); cashoutBet(bid, s ? parseInt(s.value) : 100); } }
        else showDetails(bid);
    });
    
    document.getElementById('bet-list-container').addEventListener('input', function(e) {
        if (e.target.classList.contains('partial-slider')) { const v = e.target.closest('.bet-card')?.querySelector('.pct-val'); if (v) v.textContent = e.target.value + '%'; }
    });
    
    document.getElementById('bet-modal').addEventListener('click', (e) => {
        if (e.target.id === 'bet-modal' || e.target.id === 'modalCloseBtn') { document.getElementById('bet-modal').classList.remove('show'); openModalBetId = null; }
    });
    
    document.getElementById('bet-search-input').addEventListener('input', debounce(() => filterBets(currentFilter), CONFIG.SEARCH_DEBOUNCE_MS));
    
    document.querySelectorAll('.filter-chip').forEach(ch => ch.addEventListener('click', function() {
        document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active')); this.classList.add('active'); filterBets(this.dataset.filter);
    }));
    
    document.getElementById('themeToggleBtn').addEventListener('click', () => { document.body.classList.toggle('light-theme'); safeLocalStorageSet('theme', document.body.classList.contains('light-theme') ? 'light' : 'dark'); });
    document.getElementById('langToggleBtn').addEventListener('click', () => { const ia = document.body.classList.toggle('arabic'); safeLocalStorageSet('lang', ia ? 'ar' : 'en'); document.documentElement.dir = ia ? 'rtl' : 'ltr'; });
    document.getElementById('refreshBtn').addEventListener('click', async () => {
        if (!isOnline) { showNotification('📴 Cannot refresh while offline', 'warning'); return; }
        const btn = document.getElementById('refreshBtn'); btn.disabled = true; btn.querySelector('i').classList.add('fa-spin');
        await loadBets(); await loadBalance(); btn.disabled = false; btn.querySelector('i').classList.remove('fa-spin');
        showNotification('✅ Bets refreshed', 'success');
    });
    
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { document.getElementById('bet-modal').classList.remove('show'); openModalBetId = null; } });
    
    auth.onAuthStateChanged(async u => {
        if (!u) { window.location.href = '../login.html'; return; }
        if (safeLocalStorageGet('theme') === 'light') document.body.classList.add('light-theme');
        if (safeLocalStorageGet('lang') === 'ar') { document.body.classList.add('arabic'); document.documentElement.dir = 'rtl'; }
        if (DEBUG) console.log('%c🐛 Debug Mode Active %c| %cMy Bets v18.0', 'color:#00ff9d;font-weight:bold;', '', 'color:#aaa;');
        
        settlementManager = new DuplicateProofSettlementManager(u.uid);
        await loadBalance(); await loadBets();
        
        if (refreshInterval) clearInterval(refreshInterval);
        refreshInterval = setInterval(async () => { if (isOnline) { await loadBets(); await loadBalance(); } }, CONFIG.REFRESH_INTERVAL);
        
        if (settleInterval) clearInterval(settleInterval);
        if (!safeLocalStorageGet('xl_emergency_stop')) {
            settleInterval = setInterval(async () => {
                if (isOnline) { await autoSettleBets(); if (settlementManager) await settlementManager.retryFailedPayouts(); await loadBalance(); }
            }, CONFIG.AUTO_SETTLE_INTERVAL);
        }
    });
    
    window.addEventListener('beforeunload', () => { if (refreshInterval) clearInterval(refreshInterval); if (settleInterval) clearInterval(settleInterval); if (settlementTimeout) clearTimeout(settlementTimeout); settlementTimers.forEach(clearInterval); });
});

window.loadBets = loadBets;
window.loadBalance = loadBalance;
window.CONFIG = CONFIG;

console.log('%c✅ My Bets v18.0 %c| %cULTIMATE RELEASE %c| %cAll Features • Zero Compromises • Production Ready',
    'color:#00ff9d;font-weight:bold;font-size:14px;', '', 'color:#ff9800;font-weight:bold;', '', 'color:#aaa;font-size:10px;');
