<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Bets - X Lodon</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="../css/sports-betting.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0f1a; color: white; font-family: 'Segoe UI', sans-serif; min-height: 100vh; }
        .header { background: #111827; padding: 12px 15px; border-bottom: 2px solid #00ff9d; position: sticky; top: 0; z-index: 100; }
        .header-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .back-btn { color: #00ff9d; text-decoration: none; font-size: 20px; }
        .header h1 { font-size: 18px; color: white; }
        .tabs { display: flex; gap: 5px; overflow-x: auto; white-space: nowrap; padding-bottom: 3px; }
        .tab { padding: 8px 12px; background: #1a2332; border-radius: 20px; color: white; text-decoration: none; font-size: 12px; }
        .tab.active { background: #00ff9d; color: black; }
        .container { max-width: 1200px; margin: 0 auto; padding: 15px; }
        
        .stats-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .stat-card { background: linear-gradient(135deg, #111827, #1a2332); padding: 15px 10px; border-radius: 12px; text-align: center; border: 1px solid #00ff9d22; }
        .stat-label { color: #a0a8c9; font-size: 12px; margin-bottom: 5px; }
        .stat-value { font-size: 22px; font-weight: bold; color: #00ff9d; }
        .stat-value.negative { color: #ff5252; }
        
        .filter-bar { display: flex; gap: 5px; margin-bottom: 20px; background: #111827; padding: 8px; border-radius: 12px; }
        .filter-btn { flex: 1; padding: 12px; background: transparent; border: none; border-radius: 8px; color: #a0a8c9; font-weight: 600; font-size: 13px; cursor: pointer; transition: all 0.2s; }
        .filter-btn.active { background: #00ff9d; color: black; }
        .filter-btn:hover { background: #00ff9d22; color: white; }
        
        .bets-list { display: flex; flex-direction: column; gap: 12px; }
        
        .bet-card { background: #111827; border-radius: 16px; padding: 16px; border-left: 4px solid #00ff9d; transition: transform 0.2s; }
        .bet-card.single { border-left-color: #00ff9d; }
        .bet-card.accumulator { border-left-color: #ff9800; }
        .bet-card.won { border-left-color: #4caf50; background: linear-gradient(135deg, #111827, #1a2332); }
        .bet-card.lost { border-left-color: #ff5252; }
        .bet-card.active { border-left-color: #ffc107; }
        .bet-card.cancelled { border-left-color: #a0a8c9; opacity: 0.7; }
        
        .bet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .bet-type-badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
        .bet-type-badge.single { background: #00ff9d22; color: #00ff9d; }
        .bet-type-badge.accumulator { background: #ff980022; color: #ff9800; }
        .bet-status { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .bet-status.active { background: #ffc107; color: black; }
        .bet-status.won { background: #4caf50; color: white; }
        .bet-status.lost { background: #ff5252; color: white; }
        .bet-status.cancelled { background: #a0a8c9; color: white; }
        
        .bet-matches { margin-bottom: 15px; }
        .match-item { padding: 8px 0; border-bottom: 1px solid #ffffff11; }
        .match-item:last-child { border-bottom: none; }
        .match-teams { display: flex; justify-content: space-between; align-items: center; }
        .match-name { font-weight: 500; font-size: 14px; }
        .match-pick { color: #00ff9d; font-weight: 600; font-size: 13px; }
        .match-odds { color: #ff9800; font-size: 13px; }
        .match-result { font-size: 12px; margin-top: 4px; }
        .match-result.won { color: #4caf50; }
        .match-result.lost { color: #ff5252; }
        
        .bet-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; padding-top: 15px; border-top: 1px solid #ffffff11; }
        .bet-amount { display: flex; flex-direction: column; }
        .amount-label { color: #a0a8c9; font-size: 11px; }
        .amount-value { font-weight: 600; font-size: 16px; }
        .bet-payout { text-align: right; }
        .payout-label { color: #a0a8c9; font-size: 11px; }
        .payout-value { font-weight: 700; font-size: 18px; }
        .payout-value.won { color: #4caf50; }
        .payout-value.lost { color: #ff5252; }
        
        .bet-date { color: #a0a8c9; font-size: 11px; margin-top: 10px; display: flex; align-items: center; gap: 5px; }
        
        .cancel-btn { padding: 8px 16px; background: #ff525222; border: 1px solid #ff5252; border-radius: 8px; color: #ff5252; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .cancel-btn:hover { background: #ff5252; color: white; }
        
        .cashout-btn { padding: 8px 16px; background: #ff980022; border: 1px solid #ff9800; border-radius: 8px; color: #ff9800; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .cashout-btn:hover { background: #ff9800; color: black; }
        
        .empty-state { text-align: center; padding: 60px 20px; color: #a0a8c9; }
        .empty-state i { font-size: 56px; opacity: 0.2; margin-bottom: 20px; }
        .empty-state p { margin-bottom: 15px; }
        .empty-state a { color: #00ff9d; text-decoration: none; font-weight: 600; }
        
        .export-btn { background: #00ff9d22; border: 1px solid #00ff9d; color: #00ff9d; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; margin-top: 20px; }
        .export-btn:hover { background: #00ff9d; color: black; }
        
        .bottom-nav { display: flex; justify-content: space-around; background: #111827; padding: 12px; position: sticky; bottom: 0; border-top: 1px solid #00ff9d33; margin-top: 30px; }
        .nav-item { color: #a0a8c9; text-decoration: none; text-align: center; font-size: 12px; }
        .nav-item.active { color: #00ff9d; }
        .nav-item i { font-size: 20px; display: block; margin-bottom: 3px; }
        
        .loading-spinner { text-align: center; padding: 40px; }
        .spinner { width: 40px; height: 40px; border: 3px solid #00ff9d22; border-top-color: #00ff9d; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 15px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-top">
            <a href="betting-sport.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
            <h1><i class="fas fa-futbol"></i> X Lodon Sports</h1>
        </div>
        <div class="tabs">
            <a href="betting-sport.html" class="tab">Home</a>
            <a href="live-matches.html" class="tab">Live</a>
            <a href="upcoming-matches.html" class="tab">Upcoming</a>
            <a href="finished-matches.html" class="tab">Results</a>
            <a href="my-bets.html" class="tab active">My Bets</a>
        </div>
    </div>
    
    <div class="container">
        <!-- Stats Cards -->
        <div class="stats-cards">
            <div class="stat-card">
                <div class="stat-label">Total Bets</div>
                <div class="stat-value" id="total-bets">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Win Rate</div>
                <div class="stat-value" id="win-rate">0%</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total P/L</div>
                <div class="stat-value" id="total-pl">$0.00</div>
            </div>
        </div>
        
        <!-- Filter Bar -->
        <div class="filter-bar">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="won">Won</button>
            <button class="filter-btn" data-filter="lost">Lost</button>
        </div>
        
        <!-- Bets Container -->
        <div id="bets-container">
            <div class="loading-spinner">
                <div class="spinner"></div>
                <p style="color:#a0a8c9;">Loading your bets...</p>
            </div>
        </div>
        
        <!-- Export Button -->
        <div style="text-align: right;">
            <button class="export-btn" id="export-btn">
                <i class="fas fa-download"></i> Export CSV
            </button>
        </div>
    </div>
    
    <div class="bottom-nav">
        <a href="../index.html" class="nav-item"><i class="fas fa-home"></i><span>Home</span></a>
        <a href="../games.html" class="nav-item"><i class="fas fa-gamepad"></i><span>Casino</span></a>
        <a href="betting-sport.html" class="nav-item"><i class="fas fa-futbol"></i><span>Sports</span></a>
        <a href="../dashboard.html" class="nav-item"><i class="fas fa-user"></i><span>Account</span></a>
    </div>
    
    <script src="../js/betting-engine.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), db = firebase.firestore();
        
        let currentUser = null;
        let allBets = [];
        let currentFilter = 'all';
        let unsubscribe = null;
        
        auth.onAuthStateChanged(u => {
            if (!u) { location.href = '../login.html'; return; }
            currentUser = u;
            loadBets();
        });
        
        function loadBets() {
            const container = document.getElementById('bets-container');
            
            unsubscribe = db.collection('bets')
                .where('userId', '==', currentUser.uid)
                .orderBy('placedAt', 'desc')
                .limit(100)
                .onSnapshot(snap => {
                    allBets = [];
                    snap.forEach(doc => {
                        allBets.push({ id: doc.id, ...doc.data() });
                    });
                    
                    updateStats();
                    filterBets(currentFilter);
                    
                }, error => {
                    console.error('Error loading bets:', error);
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-exclamation-triangle"></i>
                            <p>Error loading bets</p>
                            <small>${error.message}</small>
                        </div>
                    `;
                });
        }
        
        function updateStats() {
            const total = allBets.length;
            const won = allBets.filter(b => b.status === 'won').length;
            const winRate = total > 0 ? ((won / total) * 100).toFixed(1) : '0.0';
            
            let totalPL = 0;
            allBets.forEach(bet => {
                if (bet.status === 'won') {
                    totalPL += (bet.payout || bet.potentialWin || 0) - (bet.amount || 0);
                } else if (bet.status === 'lost') {
                    totalPL -= (bet.amount || 0);
                }
            });
            
            document.getElementById('total-bets').textContent = total;
            document.getElementById('win-rate').textContent = `${winRate}%`;
            
            const plEl = document.getElementById('total-pl');
            plEl.textContent = `${totalPL >= 0 ? '+' : ''}$${totalPL.toFixed(2)}`;
            plEl.className = totalPL >= 0 ? 'stat-value' : 'stat-value negative';
        }
        
        function filterBets(filter) {
            currentFilter = filter;
            
            let filtered = allBets;
            if (filter !== 'all') {
                filtered = allBets.filter(b => b.status === filter);
            }
            
            displayBets(filtered);
        }
        
        function displayBets(bets) {
            const container = document.getElementById('bets-container');
            
            if (bets.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-ticket-alt"></i>
                        <p>No ${currentFilter !== 'all' ? currentFilter : ''} bets found</p>
                        <a href="upcoming-matches.html">Browse matches →</a>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = '<div class="bets-list"></div>';
            const list = container.querySelector('.bets-list');
            
            bets.forEach(bet => {
                const card = createBetCard(bet);
                list.appendChild(card);
            });
        }
        
        function createBetCard(bet) {
            const card = document.createElement('div');
            
            const isAccumulator = bet.betCategory === 'accumulator' || bet.selections;
            card.className = `bet-card ${isAccumulator ? 'accumulator' : 'single'} ${bet.status}`;
            
            const placedDate = bet.placedAt?.toDate() || new Date();
            const dateStr = placedDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            const timeStr = placedDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            // Status badge
            const statusText = bet.status === 'active' ? 'Active' : 
                              bet.status === 'won' ? 'Won' : 
                              bet.status === 'lost' ? 'Lost' : 'Cancelled';
            
            let matchesHtml = '';
            
            if (isAccumulator && bet.selections) {
                // Accumulator bet - show all selections
                matchesHtml = bet.selections.map(sel => {
                    const resultClass = bet.status === 'won' ? 'won' : (bet.status === 'lost' ? 'lost' : '');
                    return `
                        <div class="match-item">
                            <div class="match-teams">
                                <span class="match-name">${sel.matchName || 'Match'}</span>
                                <span class="match-odds">${sel.odds?.toFixed(2) || '2.00'}</span>
                            </div>
                            <div class="match-teams">
                                <span class="match-pick">${sel.betTypeName || sel.betType}</span>
                                <span class="match-result ${resultClass}">
                                    ${bet.status === 'won' ? '✓ Won' : (bet.status === 'lost' ? '✗ Lost' : '')}
                                </span>
                            </div>
                        </div>
                    `;
                }).join('');
            } else {
                // Single bet
                const betTypeName = bet.betType === 'home' ? 'Home Win' : 
                                   bet.betType === 'draw' ? 'Draw' : 
                                   bet.betType === 'away' ? 'Away Win' : bet.betType;
                
                matchesHtml = `
                    <div class="match-item">
                        <div class="match-teams">
                            <span class="match-name">${bet.matchName || 'Match'}</span>
                            <span class="match-odds">${bet.odds?.toFixed(2) || '2.00'}</span>
                        </div>
                        <div class="match-teams">
                            <span class="match-pick">${betTypeName}</span>
                            <span class="match-result ${bet.status === 'won' ? 'won' : (bet.status === 'lost' ? 'lost' : '')}">
                                ${bet.status === 'won' ? '✓ Won' : (bet.status === 'lost' ? '✗ Lost' : '')}
                            </span>
                        </div>
                    </div>
                `;
            }
            
            // Payout display
            let payoutDisplay = '';
            if (bet.status === 'won') {
                payoutDisplay = `+$${(bet.payout || bet.potentialWin || 0).toFixed(2)}`;
            } else if (bet.status === 'lost') {
                payoutDisplay = `-$${(bet.amount || 0).toFixed(2)}`;
            } else if (bet.status === 'active') {
                payoutDisplay = `$${(bet.potentialWin || (bet.amount * (bet.totalOdds || bet.odds)) || 0).toFixed(2)}`;
            } else {
                payoutDisplay = '$0.00';
            }
            
            // Action buttons
            let actionButtons = '';
            if (bet.status === 'active') {
                if (bet.canCancel !== false) {
                    actionButtons = `<button class="cancel-btn" onclick="window.cancelBet('${bet.id}')"><i class="fas fa-times"></i> Cancel</button>`;
                }
                if (bet.canCashout) {
                    actionButtons = `<button class="cashout-btn" onclick="window.cashoutBet('${bet.id}')"><i class="fas fa-hand-holding-usd"></i> Cash Out</button>`;
                }
            }
            
            card.innerHTML = `
                <div class="bet-header">
                    <span class="bet-type-badge ${isAccumulator ? 'accumulator' : 'single'}">
                        <i class="fas ${isAccumulator ? 'fa-layer-group' : 'fa-ticket-alt'}"></i>
                        ${isAccumulator ? 'Accumulator' : 'Single'}
                        ${isAccumulator && bet.selections ? ` (${bet.selections.length})` : ''}
                    </span>
                    <span class="bet-status ${bet.status}">${statusText}</span>
                </div>
                
                <div class="bet-matches">
                    ${matchesHtml}
                </div>
                
                ${isAccumulator && bet.totalOdds ? `
                    <div style="display:flex; justify-content:space-between; padding:8px 0; color:#a0a8c9; font-size:13px;">
                        <span>Total Odds:</span>
                        <span style="color:#ff9800; font-weight:bold;">${bet.totalOdds.toFixed(2)}</span>
                    </div>
                ` : ''}
                
                <div class="bet-footer">
                    <div class="bet-amount">
                        <span class="amount-label">Stake</span>
                        <span class="amount-value">$${(bet.amount || 0).toFixed(2)}</span>
                    </div>
                    <div class="bet-payout">
                        <span class="payout-label">${bet.status === 'active' ? 'Potential' : 'Payout'}</span>
                        <span class="payout-value ${bet.status}">${payoutDisplay}</span>
                    </div>
                </div>
                
                <div class="bet-date">
                    <i class="far fa-calendar-alt"></i> ${dateStr} at ${timeStr}
                    ${bet.settledAt ? ` • Settled: ${bet.settledAt.toDate().toLocaleDateString()}` : ''}
                </div>
                
                ${actionButtons ? `<div style="margin-top: 12px; display: flex; gap: 10px;">${actionButtons}</div>` : ''}
            `;
            
            return card;
        }
        
        // Global functions for buttons
        window.cancelBet = async (betId) => {
            if (!confirm('Cancel this bet? A 5% fee will be deducted.')) return;
            
            try {
                const result = await cancelBetWithFee(betId);
                if (result.success) {
                    alert(`Bet cancelled! Refunded: $${result.refund.toFixed(2)} (Fee: $${result.fee.toFixed(2)})`);
                } else {
                    alert('Error: ' + result.error);
                }
            } catch (e) {
                alert('Error cancelling bet');
            }
        };
        
        window.cashoutBet = async (betId) => {
            if (!confirm('Cash out this bet? A 10% fee will be deducted.')) return;
            
            try {
                const result = await cashoutBet(betId);
                if (result.success) {
                    alert(`Cashed out! Received: $${result.amount.toFixed(2)} (Fee: $${result.fee.toFixed(2)})`);
                } else {
                    alert('Error: ' + result.error);
                }
            } catch (e) {
                alert('Error cashing out');
            }
        };
        
        // Filter buttons
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                filterBets(btn.dataset.filter);
            });
        });
        
        // Export CSV
        document.getElementById('export-btn').addEventListener('click', () => {
            if (allBets.length === 0) { alert('No bets to export'); return; }
            
            const headers = ['Date', 'Type', 'Match(es)', 'Stake', 'Odds', 'Status', 'Payout', 'P/L'];
            const rows = allBets.map(bet => {
                const date = bet.placedAt?.toDate().toLocaleDateString() || '';
                const type = bet.betCategory === 'accumulator' ? 'Accumulator' : 'Single';
                const match = bet.betCategory === 'accumulator' ? 
                    bet.selections?.map(s => s.matchName).join('; ') : bet.matchName;
                const stake = (bet.amount || 0).toFixed(2);
                const odds = bet.betCategory === 'accumulator' ? 
                    (bet.totalOdds || 1).toFixed(2) : (bet.odds || 2).toFixed(2);
                const status = bet.status;
                const payout = bet.status === 'won' ? (bet.payout || bet.potentialWin || 0).toFixed(2) : '0.00';
                const pl = bet.status === 'won' ? ((bet.payout || 0) - bet.amount).toFixed(2) : 
                          (bet.status === 'lost' ? (-bet.amount).toFixed(2) : '0.00');
                
                return [date, type, match, stake, odds, status, payout, pl];
            });
            
            let csv = headers.join(',') + '\n';
            rows.forEach(row => csv += row.map(c => `"${c}"`).join(',') + '\n');
            
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `x-lodon-bets-${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
            URL.revokeObjectURL(url);
        });
        
        window.addEventListener('beforeunload', () => {
            if (unsubscribe) unsubscribe();
        });
    </script>
</body>
</html>
