<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Bets - X Lodon | رهاناتي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <link rel="stylesheet" href="../css/sports-betting.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0f1a; color: white; font-family: 'Segoe UI', 'Tajawal', sans-serif; min-height: 100vh; }
        .header { background: #111827; padding: 12px 15px; border-bottom: 2px solid #00ff9d; position: sticky; top: 0; z-index: 100; }
        .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; flex-wrap: wrap; gap: 10px; }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .back-btn { color: #00ff9d; text-decoration: none; font-size: 20px; }
        .lang-toggle { background: #1a2332; border: 1px solid #00ff9d; color: #00ff9d; padding: 5px 12px; border-radius: 20px; cursor: pointer; }
        .tabs { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 3px; }
        .tab { padding: 8px 12px; background: #1a2332; border-radius: 20px; color: white; text-decoration: none; font-size: 12px; }
        .tab.active { background: #00ff9d; color: black; }
        .container { max-width: 1200px; margin: 0 auto; padding: 15px; }
        .balance-bar { background: #111827; padding: 10px 15px; border-radius: 12px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #00ff9d33; flex-wrap: wrap; gap: 10px; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
        .stat-box { background: #111827; padding: 15px 10px; border-radius: 12px; text-align: center; border: 1px solid #ffffff11; }
        .stat-box .val { font-size: 24px; font-weight: bold; }
        .stat-box .val.up { color: #4caf50; }
        .stat-box .val.down { color: #ff5252; }
        .stat-box .lbl { font-size: 11px; color: #a0a8c9; margin-top: 5px; }
        .filter-row { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .filter-chip { padding: 8px 16px; background: #1a2332; border: none; border-radius: 25px; color: #a0a8c9; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .filter-chip.active { background: #00ff9d; color: black; }
        .filter-chip .count { background: #00000033; padding: 2px 6px; border-radius: 12px; margin-left: 5px; font-size: 11px; }
        .bet-card { background: #111827; border-radius: 16px; padding: 16px; margin-bottom: 12px; border-left: 5px solid #ffc107; cursor: pointer; transition: all 0.2s; }
        .bet-card:hover { transform: translateX(3px); }
        .bet-card.won { border-left-color: #4caf50; background: linear-gradient(135deg, #111827, #0a1a0f); }
        .bet-card.lost { border-left-color: #ff5252; background: linear-gradient(135deg, #111827, #1a0a0a); }
        .bet-card.active { border-left-color: #ffc107; }
        .bet-card.cancelled { border-left-color: #9c27b0; opacity: 0.7; }
        .bet-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
        .bet-type-tag { padding: 4px 12px; border-radius: 20px; font-size: 10px; font-weight: 600; }
        .bet-type-tag.single { background: #00ff9d22; color: #00ff9d; }
        .bet-type-tag.accumulator { background: #ff980022; color: #ff9800; }
        .bet-ticket-num { font-size: 10px; color: #a0a8c9; font-family: monospace; }
        .bet-status-icon { font-size: 20px; }
        .bet-status-icon.won { color: #4caf50; }
        .bet-status-icon.lost { color: #ff5252; }
        .bet-status-icon.active { color: #ffc107; animation: pulse 1s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
        .bet-body { margin-bottom: 12px; }
        .bet-match-name { font-weight: 600; font-size: 14px; }
        .bet-pick { color: #00ff9d; font-size: 13px; margin-top: 4px; }
        .bet-odds { color: #ff9800; font-size: 12px; }
        .bet-details-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 12px 0; font-size: 11px; }
        .bet-detail { text-align: center; }
        .bet-detail .lbl { color: #a0a8c9; font-size: 10px; }
        .bet-detail .val { font-weight: 600; font-size: 12px; }
        .bet-result-row { background: #1a2332; padding: 10px; border-radius: 8px; margin-top: 10px; font-size: 12px; }
        .bet-result-row.won { border-left: 3px solid #4caf50; background: #1a2332; }
        .bet-result-row.lost { border-left: 3px solid #ff5252; background: #1a2332; }
        .bet-timestamps { font-size: 10px; color: #a0a8c9; margin-top: 8px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
        .bet-actions { display: flex; gap: 10px; margin-top: 12px; padding-top: 12px; border-top: 1px solid #ffffff11; }
        .cancel-btn { background: #ff525222; color: #ff5252; border: 1px solid #ff5252; padding: 6px 12px; border-radius: 20px; font-size: 11px; cursor: pointer; transition: all 0.2s; }
        .cancel-btn:hover { background: #ff5252; color: white; }
        .cashout-btn { background: #ff980022; color: #ff9800; border: 1px solid #ff9800; padding: 6px 12px; border-radius: 20px; font-size: 11px; cursor: pointer; transition: all 0.2s; }
        .cashout-btn:hover { background: #ff9800; color: black; }
        .modal-overlay { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.95); z-index:1000; display:none; align-items:center; justify-content:center; padding:15px; }
        .modal-overlay.show { display:flex; }
        .modal-content { background: #111827; border-radius:20px; padding:20px; max-width:500px; width:100%; max-height:80vh; overflow-y:auto; border:2px solid #00ff9d; }
        .modal-close { background:none; border:none; color:#a0a8c9; font-size:24px; cursor:pointer; float:right; }
        .modal-section { margin-bottom:20px; }
        .modal-section h4 { color:#00ff9d; font-size:14px; margin-bottom:10px; }
        .modal-row { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #ffffff11; font-size:13px; flex-wrap:wrap; gap:8px; }
        .modal-row .lbl { color:#a0a8c9; }
        .empty-state { text-align: center; padding: 60px; color: #a0a8c9; }
        .export-btn { background: #00ff9d22; border: 1px solid #00ff9d; color: #00ff9d; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 12px; }
        .arabic { font-family: 'Tajawal', sans-serif; }
        .loading-spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid #00ff9d; border-top-color: transparent; border-radius: 50%; animation: spin 0.6s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 600px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .bet-details-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-top">
            <div class="header-left">
                <a href="betting-sport.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
                <h1 style="font-size:18px;"><i class="fas fa-futbol"></i> <span class="en">My Bets</span><span class="ar" style="display:none;">رهاناتي</span></h1>
            </div>
            <div style="display:flex; gap:10px; align-items:center;">
                <button class="export-btn" onclick="exportBetsToCSV()"><i class="fas fa-download"></i> <span class="en">Export</span><span class="ar" style="display:none;">تصدير</span></button>
                <button class="lang-toggle" onclick="toggleLanguage()"><span class="en">عربي</span><span class="ar" style="display:none;">English</span></button>
            </div>
        </div>
        <div class="tabs">
            <a href="betting-sport.html" class="tab"><span class="en">Home</span><span class="ar" style="display:none;">الرئيسية</span></a>
            <a href="live-matches.html" class="tab"><span class="en">Live</span><span class="ar" style="display:none;">مباشر</span></a>
            <a href="upcoming-matches.html" class="tab"><span class="en">Upcoming</span><span class="ar" style="display:none;">قادم</span></a>
            <a href="finished-matches.html" class="tab"><span class="en">Results</span><span class="ar" style="display:none;">النتائج</span></a>
            <a href="my-bets.html" class="tab active"><span class="en">My Bets</span><span class="ar" style="display:none;">رهاناتي</span></a>
        </div>
    </div>
    
    <div class="container">
        <div class="balance-bar">
            <span><i class="fas fa-wallet"></i> <span class="en">Balance</span><span class="ar" style="display:none;">الرصيد</span></span>
            <span style="color:#00ff9d;font-weight:bold;font-size:18px;" id="balance-display">$0.00</span>
        </div>
        
        <div class="stats-grid">
            <div class="stat-box"><div class="val" id="total-bets">0</div><div class="lbl"><span class="en">Total Bets</span><span class="ar" style="display:none;">إجمالي الرهانات</span></div></div>
            <div class="stat-box"><div class="val up" id="total-won">0</div><div class="lbl"><span class="en">Won</span><span class="ar" style="display:none;">فائز</span></div></div>
            <div class="stat-box"><div class="val down" id="total-lost">0</div><div class="lbl"><span class="en">Lost</span><span class="ar" style="display:none;">خاسر</span></div></div>
            <div class="stat-box"><div class="val" id="total-pl" style="color:#00ff9d;">$0</div><div class="lbl"><span class="en">Profit/Loss</span><span class="ar" style="display:none;">ربح/خسارة</span></div></div>
        </div>
        
        <div class="filter-row">
            <button class="filter-chip active" data-filter="all"><span class="en">All</span><span class="ar" style="display:none;">الكل</span> <span class="count" id="cnt-all">0</span></button>
            <button class="filter-chip" data-filter="active"><span class="en">Active</span><span class="ar" style="display:none;">نشط</span> <span class="count" id="cnt-active">0</span></button>
            <button class="filter-chip" data-filter="won"><span class="en">Won</span><span class="ar" style="display:none;">فائز</span> <span class="count" id="cnt-won">0</span></button>
            <button class="filter-chip" data-filter="lost"><span class="en">Lost</span><span class="ar" style="display:none;">خاسر</span> <span class="count" id="cnt-lost">0</span></button>
            <button class="filter-chip" data-filter="cancelled"><span class="en">Cancelled</span><span class="ar" style="display:none;">ملغي</span> <span class="count" id="cnt-cancelled">0</span></button>
        </div>
        
        <div id="bet-list-container"><div style="text-align:center;padding:40px;"><div class="loading-spinner"></div> Loading your bets...</div></div>
    </div>
    
    <div class="modal-overlay" id="bet-modal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <div id="modal-body"></div>
        </div>
    </div>

    <script src="../js/supabase-client.js"></script>
    <script src="../js/betting-engine.js"></script>
    <script>
        let allBets = [];
        let currentFilter = 'all';
        let refreshInterval = null;
        
        function toggleLanguage() {
            const isArabic = document.body.classList.toggle('arabic');
            localStorage.setItem('lang', isArabic ? 'ar' : 'en');
            document.documentElement.dir = isArabic ? 'rtl' : 'ltr';
            document.querySelectorAll('.en').forEach(el => el.style.display = isArabic ? 'none' : '');
            document.querySelectorAll('.ar').forEach(el => el.style.display = isArabic ? '' : 'none');
        }
        if (localStorage.getItem('lang') === 'ar') toggleLanguage();
        
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        
        firebase.auth().onAuthStateChanged(async (u) => {
            if (!u) {
                location.href = '../login.html';
            } else {
                await loadBalance();
                await loadBets();
                startAutoRefresh();
            }
        });
        
        async function loadBalance() {
            try {
                const db = firebase.firestore();
                const doc = await db.collection('wallets').doc(firebase.auth().currentUser.uid).get();
                const balance = doc.exists ? (doc.data().balance || 0) : 0;
                document.getElementById('balance-display').textContent = `$${balance.toFixed(2)}`;
            } catch(e) { console.error(e); }
        }
        
        async function loadBets() {
            if (!window.supaDB) return;
            
            try {
                const bets = await window.supaDB.getUserBets(firebase.auth().currentUser.uid);
                allBets = bets || [];
                updateStats();
                updateCounts();
                filterBets(currentFilter);
            } catch(e) {
                console.error(e);
                document.getElementById('bet-list-container').innerHTML = `<div class="empty-state">Error loading bets: ${e.message}</div>`;
            }
        }
        
        function updateStats() {
            const total = allBets.length;
            const won = allBets.filter(b => b.status === 'won').length;
            const lost = allBets.filter(b => b.status === 'lost').length;
            const cancelled = allBets.filter(b => b.status === 'cancelled').length;
            
            let pl = 0;
            allBets.forEach(b => {
                const amount = parseFloat(b.amount || 0);
                if (b.status === 'won') {
                    pl += parseFloat(b.payout || b.potential_win || 0) - amount;
                } else if (b.status === 'lost') {
                    pl -= amount;
                } else if (b.status === 'cancelled') {
                    pl += parseFloat(b.refund_amount || 0) - amount;
                }
            });
            
            document.getElementById('total-bets').textContent = total;
            document.getElementById('total-won').textContent = won;
            document.getElementById('total-lost').textContent = lost;
            
            const plEl = document.getElementById('total-pl');
            plEl.textContent = (pl >= 0 ? '+' : '') + '$' + pl.toFixed(2);
            plEl.style.color = pl >= 0 ? '#4caf50' : '#ff5252';
        }
        
        function updateCounts() {
            document.getElementById('cnt-all').textContent = allBets.length;
            document.getElementById('cnt-active').textContent = allBets.filter(b => b.status === 'active').length;
            document.getElementById('cnt-won').textContent = allBets.filter(b => b.status === 'won').length;
            document.getElementById('cnt-lost').textContent = allBets.filter(b => b.status === 'lost').length;
            document.getElementById('cnt-cancelled').textContent = allBets.filter(b => b.status === 'cancelled').length;
        }
        
        function filterBets(filter) {
            currentFilter = filter;
            let filtered = allBets;
            
            if (filter === 'active') filtered = allBets.filter(b => b.status === 'active');
            else if (filter === 'won') filtered = allBets.filter(b => b.status === 'won');
            else if (filter === 'lost') filtered = allBets.filter(b => b.status === 'lost');
            else if (filter === 'cancelled') filtered = allBets.filter(b => b.status === 'cancelled');
            
            const container = document.getElementById('bet-list-container');
            
            if (!filtered.length) {
                container.innerHTML = '<div class="empty-state"><i class="fas fa-ticket-alt" style="font-size:48px;opacity:0.3;"></i><p>No bets found</p></div>';
                return;
            }
            
            container.innerHTML = '<div class="bet-list">' + filtered.map(b => createBetCard(b)).join('') + '</div>';
        }
        
        function createBetCard(bet) {
            const isAcc = bet.bet_category === 'accumulator' || (bet.selections && bet.selections.length > 0);
            let statusIcon = '⏳';
            let statusClass = bet.status;
            
            if (bet.status === 'won') statusIcon = '✅';
            else if (bet.status === 'lost') statusIcon = '❌';
            else if (bet.status === 'cancelled') statusIcon = '🚫';
            else if (bet.status === 'active') statusIcon = '⏳';
            
            const amount = parseFloat(bet.amount || 0);
            const payout = parseFloat(bet.payout || bet.potential_win || 0);
            const profit = bet.status === 'won' ? payout - amount : (bet.status === 'lost' ? -amount : 0);
            const placed = bet.placed_at ? new Date(bet.placed_at) : new Date();
            const settled = bet.settled_at ? new Date(bet.settled_at) : null;
            const betType = bet.bet_category || 'single';
            const ticketNumber = 'XL' + bet.id.toString().slice(-8).toUpperCase();
            
            let matchDisplay = isAcc ? `${bet.selections?.length || 0} selections` : (bet.match_name || 'Match');
            let pickDisplay = bet.bet_name || bet.bet_type || '';
            
            // Calculate remaining time for active bets
            let remainingTime = '';
            if (bet.status === 'active' && bet.kickoff_time) {
                const kickoff = new Date(bet.kickoff_time);
                const now = new Date();
                const diff = kickoff - now;
                if (diff > 0) {
                    const hours = Math.floor(diff / 3600000);
                    const minutes = Math.floor((diff % 3600000) / 60000);
                    remainingTime = `${hours}h ${minutes}m`;
                } else {
                    remainingTime = 'Started';
                }
            }
            
            return `
                <div class="bet-card ${statusClass}" onclick="showDetails('${bet.id}')">
                    <div class="bet-top">
                        <div>
                            <span class="bet-type-tag ${betType}">${betType.toUpperCase()}</span>
                            <span class="bet-ticket-num"> #${ticketNumber}</span>
                        </div>
                        <span class="bet-status-icon ${statusClass}">${statusIcon}</span>
                    </div>
                    <div class="bet-body">
                        <div class="bet-match-name">${escapeHtml(matchDisplay)}</div>
                        <div class="bet-pick">${escapeHtml(pickDisplay)} <span class="bet-odds">@${parseFloat(bet.odds || 2).toFixed(2)}</span></div>
                    </div>
                    <div class="bet-details-grid">
                        <div class="bet-detail"><div class="lbl">Stake</div><div class="val">$${amount.toFixed(2)}</div></div>
                        <div class="bet-detail"><div class="lbl">${bet.status === 'active' ? 'Potential' : 'Payout'}</div><div class="val" style="color:${bet.status === 'won' ? '#4caf50' : (bet.status === 'lost' ? '#ff5252' : '#fff')}">$${payout.toFixed(2)}</div></div>
                        <div class="bet-detail"><div class="lbl">P/L</div><div class="val" style="color:${profit >= 0 ? '#4caf50' : '#ff5252'}">${profit >= 0 ? '↑' : '↓'} $${Math.abs(profit).toFixed(2)}</div></div>
                        ${remainingTime ? `<div class="bet-detail"><div class="lbl">Remaining</div><div class="val">${remainingTime}</div></div>` : ''}
                    </div>
                    ${bet.status !== 'active' ? `
                        <div class="bet-result-row ${statusClass}">
                            ${statusIcon} ${bet.status === 'won' ? 'Won' : (bet.status === 'lost' ? 'Lost' : 'Cancelled')}: ${pickDisplay} @${parseFloat(bet.odds || 2).toFixed(2)}
                        </div>
                    ` : ''}
                    <div class="bet-timestamps">
                        <span><i class="far fa-calendar-alt"></i> ${placed.toLocaleString()}</span>
                        ${settled ? `<span><i class="fas fa-check-circle"></i> Settled: ${settled.toLocaleString()}</span>` : ''}
                    </div>
                    ${bet.status === 'active' ? `
                        <div class="bet-actions">
                            <button class="cancel-btn" onclick="event.stopPropagation();cancelBet('${bet.id}')"><i class="fas fa-ban"></i> Cancel Bet</button>
                        </div>
                    ` : ''}
                </div>
            `;
        }
        
        async function cancelBet(betId) {
            if (!confirm('Are you sure you want to cancel this bet? A cancellation fee will apply.')) return;
            
            const result = await window.cancelBet(betId);
            
            if (result.success) {
                alert(`Bet cancelled! Refund: $${result.refund.toFixed(2)} (Fee: $${result.fee.toFixed(2)} - ${result.feePercent}%)`);
                await loadBets();
                await loadBalance();
            } else {
                alert(`Cancellation failed: ${result.error}`);
            }
        }
        
        function showDetails(betId) {
            const bet = allBets.find(b => b.id === betId);
            if (!bet) return;
            
            const modal = document.getElementById('bet-modal');
            const body = document.getElementById('modal-body');
            
            const amount = parseFloat(bet.amount || 0);
            const payout = parseFloat(bet.payout || bet.potential_win || 0);
            const profit = bet.status === 'won' ? payout - amount : (bet.status === 'lost' ? -amount : 0);
            const ticketNumber = 'XL' + bet.id.toString().slice(-8).toUpperCase();
            const placed = bet.placed_at ? new Date(bet.placed_at) : new Date();
            const settled = bet.settled_at ? new Date(bet.settled_at) : null;
            
            let selectionsHtml = '';
            if (bet.selections && bet.selections.length > 0) {
                selectionsHtml = '<div class="modal-section"><h4>📋 Selections</h4>';
                bet.selections.forEach((s, i) => {
                    selectionsHtml += `<div class="modal-row"><span class="lbl">#${i+1}</span><span>${s.matchName} - ${s.betTypeName} @ ${s.odds.toFixed(2)}</span></div>`;
                });
                selectionsHtml += '</div>';
            }
            
            body.innerHTML = `
                <div class="modal-section"><h4>📋 Bet Information</h4>
                    <div class="modal-row"><span class="lbl">Ticket Number</span><span>${ticketNumber}</span></div>
                    <div class="modal-row"><span class="lbl">Type</span><span>${bet.bet_category === 'accumulator' ? 'Accumulator' : 'Single'}</span></div>
                    <div class="modal-row"><span class="lbl">Status</span><span class="${bet.status}" style="color:${bet.status === 'won' ? '#4caf50' : (bet.status === 'lost' ? '#ff5252' : '#ffc107')}">${bet.status?.toUpperCase()}</span></div>
                    <div class="modal-row"><span class="lbl">Match</span><span>${bet.match_name || 'N/A'}</span></div>
                    <div class="modal-row"><span class="lbl">Pick</span><span>${bet.bet_name || bet.bet_type} @ ${parseFloat(bet.odds || 2).toFixed(2)}</span></div>
                    <div class="modal-row"><span class="lbl">Placed</span><span>${placed.toLocaleString()}</span></div>
                    ${settled ? `<div class="modal-row"><span class="lbl">Settled</span><span>${settled.toLocaleString()}</span></div>` : ''}
                </div>
                ${selectionsHtml}
                <div class="modal-section"><h4>💰 Financial</h4>
                    <div class="modal-row"><span class="lbl">Stake</span><span>$${amount.toFixed(2)}</span></div>
                    <div class="modal-row"><span class="lbl">Odds</span><span>${parseFloat(bet.odds || 2).toFixed(2)}</span></div>
                    <div class="modal-row"><span class="lbl">Potential Win</span><span>$${parseFloat(bet.potential_win || 0).toFixed(2)}</span></div>
                    <div class="modal-row"><span class="lbl">Actual Payout</span><span class="${bet.status}" style="color:${bet.status === 'won' ? '#4caf50' : '#fff'}">$${payout.toFixed(2)}</span></div>
                    <div class="modal-row"><span class="lbl">Profit/Loss</span><span style="color:${profit >= 0 ? '#4caf50' : '#ff5252'}">${profit >= 0 ? '+' : ''}$${profit.toFixed(2)}</span></div>
                    ${bet.cancel_fee ? `<div class="modal-row"><span class="lbl">Cancel Fee</span><span>$${bet.cancel_fee.toFixed(2)}</span></div>` : ''}
                    ${bet.refund_amount ? `<div class="modal-row"><span class="lbl">Refund Amount</span><span>$${bet.refund_amount.toFixed(2)}</span></div>` : ''}
                </div>
                ${bet.result ? `<div class="modal-section"><h4>🏁 Result</h4>
                    <div class="modal-row"><span class="lbl">Match Result</span><span>${bet.result === 'home' ? 'Home Win' : (bet.result === 'away' ? 'Away Win' : 'Draw')}</span></div>
                    <div class="modal-row"><span class="lbl">Your Bet</span><span>${bet.bet_name || bet.bet_type}</span></div>
                    <div class="modal-row"><span class="lbl">Outcome</span><span style="color:${bet.status === 'won' ? '#4caf50' : '#ff5252'}">${bet.status === 'won' ? 'WINNER!' : 'Lost'}</span></div>
                </div>` : ''}
            `;
            
            modal.classList.add('show');
        }
        
        function closeModal(event) {
            if (!event || event.target === document.getElementById('bet-modal')) {
                document.getElementById('bet-modal').classList.remove('show');
            }
        }
        
        function exportBetsToCSV() {
            if (!allBets.length) {
                alert('No bets to export');
                return;
            }
            
            const headers = ['Ticket Number', 'Date', 'Type', 'Match', 'Pick', 'Odds', 'Stake', 'Payout', 'P/L', 'Status', 'Result'];
            const rows = allBets.map(b => {
                const ticketNumber = 'XL' + b.id.toString().slice(-8).toUpperCase();
                const amount = parseFloat(b.amount || 0);
                const payout = parseFloat(b.payout || b.potential_win || 0);
                const profit = b.status === 'won' ? payout - amount : (b.status === 'lost' ? -amount : 0);
                
                return [
                    ticketNumber,
                    new Date(b.placed_at).toLocaleDateString(),
                    b.bet_category || 'single',
                    b.match_name || '',
                    b.bet_name || b.bet_type || '',
                    parseFloat(b.odds || 2).toFixed(2),
                    amount.toFixed(2),
                    payout.toFixed(2),
                    (profit >= 0 ? '+' : '') + profit.toFixed(2),
                    b.status || '',
                    b.result || ''
                ];
            });
            
            let csv = headers.join(',') + '\n' + rows.map(r => r.map(c => `"${c}"`).join(',')).join('\n');
            const blob = new Blob([csv], { type: 'text/csv' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `x-lodon-bets-${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
        }
        
        function startAutoRefresh() {
            if (refreshInterval) clearInterval(refreshInterval);
            refreshInterval = setInterval(() => {
                loadBets();
                loadBalance();
            }, 30000);
        }
        
        // Filter chips
        document.querySelectorAll('.filter-chip').forEach(chip => {
            chip.addEventListener('click', function() {
                document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
                this.classList.add('active');
                filterBets(this.dataset.filter);
            });
        });
        
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        window.closeModal = closeModal;
        window.cancelBet = cancelBet;
        window.exportBetsToCSV = exportBetsToCSV;
        window.toggleLanguage = toggleLanguage;
        
        console.log('✅ My Bets page loaded');
    </script>
</body>
</html>
