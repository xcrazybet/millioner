<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Bets - X Lodon | رهاناتي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="../css/sports-betting.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0f1a; color: white; font-family: 'Segoe UI', 'Tajawal', sans-serif; min-height: 100vh; }
        .header { background: #111827; padding: 12px 15px; border-bottom: 2px solid #00ff9d; position: sticky; top: 0; z-index: 100; }
        .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .back-btn { color: #00ff9d; text-decoration: none; font-size: 20px; }
        .lang-toggle { background: #1a2332; border: 1px solid #00ff9d; color: #00ff9d; padding: 5px 12px; border-radius: 20px; font-size: 14px; cursor: pointer; }
        .tabs { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 3px; }
        .tab { padding: 8px 12px; background: #1a2332; border-radius: 20px; color: white; text-decoration: none; font-size: 12px; }
        .tab.active { background: #00ff9d; color: black; }
        .container { max-width: 1200px; margin: 0 auto; padding: 15px; }
        
        .settlement-panel { background: linear-gradient(135deg, #1a2332, #111827); border-radius: 16px; padding: 15px; margin-bottom: 20px; border: 1px solid #00ff9d33; }
        .settlement-title { color: #00ff9d; font-weight: 600; margin-bottom: 10px; }
        .settlement-status { display: flex; justify-content: space-between; color: #a0a8c9; font-size: 13px; }
        .progress-bar { background: #1a2332; height: 4px; border-radius: 4px; margin: 10px 0; }
        .progress-fill { background: #00ff9d; height: 100%; width: 0%; }
        
        .stats-cards { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; margin-bottom: 20px; }
        .stat-card { background: #111827; padding: 15px; border-radius: 12px; text-align: center; }
        .stat-value { font-size: 22px; font-weight: bold; color: #00ff9d; }
        .stat-breakdown { display: flex; justify-content: center; gap: 15px; margin-top: 5px; font-size: 12px; }
        
        .filter-bar { display: flex; gap: 5px; margin-bottom: 15px; flex-wrap: wrap; }
        .filter-btn { padding: 8px 12px; background: #1a2332; border: none; border-radius: 20px; color: #a0a8c9; font-size: 12px; cursor: pointer; }
        .filter-btn.active { background: #00ff9d; color: black; }
        
        .bet-card { background: #111827; border-radius: 16px; padding: 16px; margin-bottom: 12px; border-left: 4px solid #00ff9d; }
        .bet-card.single { border-left-color: #00ff9d; }
        .bet-card.accumulator { border-left-color: #ff9800; }
        .bet-card.won { border-left-color: #4caf50; }
        .bet-card.lost { border-left-color: #ff5252; }
        .bet-card.active { border-left-color: #ffc107; }
        .bet-card.cashed_out { border-left-color: #9c27b0; }
        
        .bet-header { display: flex; justify-content: space-between; margin-bottom: 12px; }
        .bet-type { display: flex; align-items: center; gap: 5px; }
        .bet-type-badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; }
        .bet-type-badge.single { background: #00ff9d22; color: #00ff9d; }
        .bet-type-badge.accumulator { background: #ff980022; color: #ff9800; }
        .bet-status { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .bet-status.active { background: #ffc107; color: black; }
        .bet-status.won { background: #4caf50; color: white; }
        .bet-status.lost { background: #ff5252; color: white; }
        .bet-status.cashed_out { background: #9c27b0; color: white; }
        
        .bet-matches { margin-bottom: 12px; }
        .match-item { padding: 5px 0; border-bottom: 1px solid #ffffff11; }
        .match-teams { display: flex; justify-content: space-between; }
        .match-pick { color: #00ff9d; font-size: 13px; }
        .match-result { font-size: 12px; }
        .match-result.won { color: #4caf50; }
        .match-result.lost { color: #ff5252; }
        
        .expand-btn { color: #a0a8c9; font-size: 12px; cursor: pointer; padding: 5px 0; }
        .acc-selections { margin-top: 8px; padding-left: 10px; border-left: 2px solid #ff9800; display: none; }
        .acc-selections.show { display: block; }
        
        .total-odds-row { display: flex; justify-content: space-between; padding: 8px 0; color: #a0a8c9; font-size: 13px; }
        .total-odds-value { color: #ff9800; font-weight: bold; }
        
        .bet-footer { display: flex; justify-content: space-between; margin-top: 12px; padding-top: 12px; border-top: 1px solid #ffffff11; }
        .payout-value { font-weight: 700; font-size: 18px; }
        .payout-value.won { color: #4caf50; }
        .payout-value.lost { color: #ff5252; }
        
        .action-buttons { display: flex; gap: 8px; margin-top: 12px; }
        .cancel-btn, .cashout-btn { padding: 8px 16px; border-radius: 8px; font-size: 12px; cursor: pointer; }
        .cancel-btn { background: #ff525222; border: 1px solid #ff5252; color: #ff5252; }
        .cashout-btn { background: #ff980022; border: 1px solid #ff9800; color: #ff9800; }
        
        .fee-info { font-size: 11px; color: #a0a8c9; margin-top: 5px; }
        
        .empty-state { text-align: center; padding: 50px; color: #a0a8c9; }
        .arabic { font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-top">
            <div class="header-left">
                <a href="betting-sport.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
                <h1 style="font-size:18px;"><i class="fas fa-futbol"></i> <span class="en">My Bets</span><span class="ar" style="display:none;">رهاناتي</span></h1>
            </div>
            <button class="lang-toggle" onclick="toggleLanguage()"><span class="en">🇸🇦 عربي</span><span class="ar" style="display:none;">🇬🇧 English</span></button>
        </div>
        <div class="tabs">
            <a href="betting-sport.html" class="tab"><span class="en">Home</span><span class="ar" style="display:none;">الرئيسية</span></a>
            <a href="live-matches.html" class="tab"><span class="en">Live</span><span class="ar" style="display:none;">مباشر</span></a>
            <a href="upcoming-matches.html" class="tab"><span class="en">Upcoming</span><span class="ar" style="display:none;">قادم</span></a>
            <a href="finished-matches.html" class="tab"><span class="en">Results</span><span class="ar" style="display:none;">النتائج</span></a>
            <a href="my-bets.html" class="tab active"><span class="en">My Bets</span><span class="ar" style="display:none;">رهاناتي</span></a>
        </div>
    </div>
    
    <div class="container">
        <div class="settlement-panel">
            <div class="settlement-title"><i class="fas fa-clock"></i> <span class="en">Settlement Status</span><span class="ar" style="display:none;">حالة التسوية</span></div>
            <div class="settlement-status"><span><span class="en">Pending:</span><span class="ar" style="display:none;">معلق:</span> <span id="pending-count">0</span></span><span><span class="en">Next check:</span><span class="ar" style="display:none;">الفحص التالي:</span> <span id="next-check">45s</span></span></div>
            <div class="progress-bar"><div class="progress-fill" id="settlement-progress" style="width:0%"></div></div>
        </div>
        
        <div class="stats-cards">
            <div class="stat-card"><div><span class="en">Total Bets</span><span class="ar" style="display:none;">الإجمالي</span></div><div class="stat-value" id="total-bets">0</div><div class="stat-breakdown"><span>🎯 <span id="single-count">0</span></span><span>🎲 <span id="acc-count">0</span></span></div></div>
            <div class="stat-card"><div><span class="en">Win Rate</span><span class="ar" style="display:none;">نسبة الفوز</span></div><div class="stat-value" id="win-rate">0%</div><div class="stat-breakdown"><span>🎯 <span id="single-winrate">0%</span></span><span>🎲 <span id="acc-winrate">0%</span></span></div></div>
        </div>
        
        <div class="filter-bar">
            <button class="filter-btn active" data-filter="all"><span class="en">All</span><span class="ar" style="display:none;">الكل</span></button>
            <button class="filter-btn" data-filter="active"><span class="en">Active</span><span class="ar" style="display:none;">نشط</span></button>
            <button class="filter-btn" data-filter="won"><span class="en">Won</span><span class="ar" style="display:none;">فوز</span></button>
            <button class="filter-btn" data-filter="lost"><span class="en">Lost</span><span class="ar" style="display:none;">خسارة</span></button>
            <button class="filter-btn" data-filter="single"><i class="fas fa-ticket-alt"></i> <span class="en">Single</span></button>
            <button class="filter-btn" data-filter="accumulator"><i class="fas fa-layer-group"></i> <span class="en">Acc</span></button>
        </div>
        
        <div id="bets-container"></div>
        <div id="empty-state" class="empty-state" style="display:none;"><i class="fas fa-ticket-alt" style="font-size:48px; opacity:0.3;"></i><p><span class="en">No bets found</span><span class="ar" style="display:none;">لا توجد رهانات</span></p></div>
    </div>

    <script src="../js/betting-engine.js"></script>
    <script src="../js/sports-api.js"></script>
    <script>
        function toggleLanguage() {
            var isEn = document.querySelector('.en').style.display !== 'none';
            document.querySelectorAll('.en').forEach(el => el.style.display = isEn ? 'none' : '');
            document.querySelectorAll('.ar').forEach(el => el.style.display = isEn ? '' : 'none');
            document.documentElement.dir = isEn ? 'rtl' : 'ltr';
            localStorage.setItem('lang', isEn ? 'ar' : 'en');
        }
        if (localStorage.getItem('lang') === 'ar') { toggleLanguage(); }
        
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), db = firebase.firestore();
        let allBets = [], currentFilter = 'all', secondsUntilCheck = 60;
        
        auth.onAuthStateChanged(u => { if (!u) location.href = '../login.html'; else loadBets(); });
        
        function loadBets() {
            db.collection('bets').where('userId', '==', auth.currentUser.uid).orderBy('placedAt', 'desc').onSnapshot(snap => {
                allBets = []; snap.forEach(d => allBets.push({ id: d.id, ...d.data() }));
                updateStats(); filterBets(currentFilter);
            });
        }
        
        function updateStats() {
            const total = allBets.length;
            const single = allBets.filter(b => !b.selections).length;
            const acc = allBets.filter(b => b.selections).length;
            const won = allBets.filter(b => b.status === 'won').length;
            const singleWon = allBets.filter(b => !b.selections && b.status === 'won').length;
            const accWon = allBets.filter(b => b.selections && b.status === 'won').length;
            
            document.getElementById('total-bets').textContent = total;
            document.getElementById('single-count').textContent = single;
            document.getElementById('acc-count').textContent = acc;
            document.getElementById('win-rate').textContent = total ? ((won/total)*100).toFixed(1) + '%' : '0%';
            document.getElementById('single-winrate').textContent = single ? ((singleWon/single)*100).toFixed(0) + '%' : '0%';
            document.getElementById('acc-winrate').textContent = acc ? ((accWon/acc)*100).toFixed(0) + '%' : '0%';
            
            const pending = allBets.filter(b => b.status === 'active' && b.matchFinished).length;
            document.getElementById('pending-count').textContent = pending;
        }
        
        function filterBets(filter) {
            currentFilter = filter;
            let filtered = allBets;
            if (filter === 'active') filtered = allBets.filter(b => b.status === 'active');
            else if (filter === 'won') filtered = allBets.filter(b => b.status === 'won');
            else if (filter === 'lost') filtered = allBets.filter(b => b.status === 'lost');
            else if (filter === 'single') filtered = allBets.filter(b => !b.selections);
            else if (filter === 'accumulator') filtered = allBets.filter(b => b.selections);
            displayBets(filtered);
        }
        
        function displayBets(bets) {
            const container = document.getElementById('bets-container');
            const empty = document.getElementById('empty-state');
            if (!bets.length) { container.style.display = 'none'; empty.style.display = 'block'; return; }
            container.style.display = 'block'; empty.style.display = 'none';
            container.innerHTML = ''; bets.forEach(b => container.appendChild(createCard(b)));
        }
        
        function createCard(bet) {
            const card = document.createElement('div');
            const isAcc = bet.betCategory === 'accumulator' || (bet.selections && bet.selections.length > 0);
            card.className = `bet-card ${isAcc ? 'accumulator' : 'single'} ${bet.status}`;
            
            const placed = bet.placedAt?.toDate() || new Date();
            const statusText = bet.status === 'active' ? 'Active' : bet.status === 'won' ? 'Won' : bet.status === 'lost' ? 'Lost' : bet.status === 'cashed_out' ? 'Cashed Out' : 'Settled';
            
            let matchesHtml = '';
            if (isAcc && bet.selections) {
                matchesHtml = `<div class="match-item"><div class="match-teams"><span>${bet.selections.length} selections</span></div>
                    <div class="expand-btn" onclick="toggleExpand('${bet.id}')"><i class="fas fa-chevron-down"></i> Show selections</div>
                    <div class="acc-selections" id="acc-${bet.id}">${bet.selections.map(s => `
                        <div class="match-item"><div class="match-teams"><span>${s.matchName}</span><span>${s.odds?.toFixed(2)}</span></div>
                        <div class="match-teams"><span class="match-pick">${s.betTypeName || s.betType}</span><span class="match-result ${bet.status}">${bet.status==='won'?'✓':bet.status==='lost'?'✗':''}</span></div></div>
                    `).join('')}</div></div>`;
            } else {
                const type = bet.betType === 'home' ? 'Home' : bet.betType === 'draw' ? 'Draw' : 'Away';
                matchesHtml = `<div class="match-item"><div class="match-teams"><span>${bet.matchName || 'Match'}</span><span>${bet.odds?.toFixed(2) || '2.00'}</span></div>
                    <div class="match-teams"><span class="match-pick">${type}</span><span class="match-result ${bet.status}">${bet.status==='won'?'✓ Won':bet.status==='lost'?'✗ Lost':''}</span></div></div>`;
            }
            
            let payoutDisplay = '';
            if (bet.status === 'won') payoutDisplay = '+' + (bet.payout || bet.potentialWin).toFixed(2);
            else if (bet.status === 'lost') payoutDisplay = '-' + (bet.amount || 0).toFixed(2);
            else if (bet.status === 'cashed_out') payoutDisplay = (bet.cashoutAmount || 0).toFixed(2);
            else payoutDisplay = (bet.potentialWin || 0).toFixed(2);
            
            let actionHtml = '';
            if (bet.status === 'active') {
                const fee = typeof getCancelFee === 'function' ? getCancelFee(bet.kickoffTime) : 5;
                actionHtml = `<div class="action-buttons"><button class="cancel-btn" onclick="cancelBet('${bet.id}')"><i class="fas fa-times"></i> Cancel</button>${bet.canCashout ? `<button class="cashout-btn" onclick="cashoutBet('${bet.id}')"><i class="fas fa-hand-holding-usd"></i> Cash Out</button>` : ''}</div>
                    <div class="fee-info"><i class="fas fa-info-circle"></i> Cancel fee: ${fee}%</div>`;
            }
            
            card.innerHTML = `
                <div class="bet-header"><div class="bet-type"><span class="bet-type-badge ${isAcc?'accumulator':'single'}"><i class="fas ${isAcc?'fa-layer-group':'fa-ticket-alt'}"></i> ${isAcc?'Accumulator':'Single'}</span></div><span class="bet-status ${bet.status}">${statusText}</span></div>
                <div class="bet-matches">${matchesHtml}</div>
                ${isAcc && bet.totalOdds ? `<div class="total-odds-row"><span>Total Odds:</span><span class="total-odds-value">${bet.totalOdds.toFixed(2)}</span></div>` : ''}
                <div class="bet-footer"><span>Stake: $${(bet.amount||0).toFixed(2)}</span><span class="payout-value ${bet.status}">$${payoutDisplay}</span></div>
                ${actionHtml}
                <div style="color:#a0a8c9; font-size:11px; margin-top:8px;">${placed.toLocaleString()}</div>
            `;
            return card;
        }
        
        window.toggleExpand = id => { const el = document.getElementById('acc-' + id); el.classList.toggle('show'); };
        window.cancelBet = async id => { if (confirm('Cancel bet? Fee applies.')) { const r = await cancelBetWithFee(id); alert(r.success ? 'Refunded: $' + r.refund.toFixed(2) : r.error); } };
        window.cashoutBet = async id => { if (confirm('Cash out?')) { const r = await cashoutBet(id); alert(r.success ? 'Cashed out: $' + r.amount.toFixed(2) : r.error); } };
        
        document.querySelectorAll('.filter-btn').forEach(b => b.addEventListener('click', function() {
            document.querySelectorAll('.filter-btn').forEach(x => x.classList.remove('active'));
            this.classList.add('active'); filterBets(this.dataset.filter);
        }));
        
        setInterval(() => { secondsUntilCheck--; if (secondsUntilCheck<=0) secondsUntilCheck=60; document.getElementById('next-check').textContent = secondsUntilCheck+'s'; document.getElementById('settlement-progress').style.width = ((60-secondsUntilCheck)/60*100)+'%'; }, 1000);
    </script>
</body>
</html>
