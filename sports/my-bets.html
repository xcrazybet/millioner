<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Bets - X London | Sports Betting</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    
    <style>
        :root {
            --bg-primary: #0a0f1a; --bg-secondary: #111827; --bg-tertiary: #1a2332;
            --accent: #00ff9d; --accent2: #ff9800; --danger: #ff5252; --success: #4caf50;
            --orange: #ff9800; --red: #ff5252; --purple: #9c27b0; --blue: #00bcd4;
            --text-primary: #ffffff; --text-secondary: #a0a8c9; --border: rgba(255,255,255,0.1);
            --card-shadow: 0 4px 20px rgba(0,0,0,0.3);
            --card-hover-shadow: 0 8px 30px rgba(0,255,157,0.1);
            --transition-fast: 0.15s ease;
            --transition-smooth: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        body.light-theme {
            --bg-primary: #f3f4f6; --bg-secondary: #ffffff; --bg-tertiary: #e5e7eb;
            --text-primary: #111827; --text-secondary: #4b5563; --border: rgba(0,0,0,0.1);
            --card-shadow: 0 4px 20px rgba(0,0,0,0.08);
            --card-hover-shadow: 0 8px 30px rgba(0,0,0,0.12);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg-primary); color: var(--text-primary);
            font-family: 'Segoe UI', 'Tajawal', sans-serif; min-height: 100vh;
            overflow-x: hidden; transition: background var(--transition-smooth), color var(--transition-smooth);
            -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-secondary); }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 3px; }
        
        .offline-banner {
            position: fixed; top: 0; left: 0; right: 0; z-index: 10000;
            background: var(--danger); color: #fff; text-align: center;
            padding: 8px; font-size: 12px; font-weight: 600;
            display: none; align-items: center; justify-content: center; gap: 8px;
        }
        .offline-banner.show { display: flex; }
        .offline-banner i { animation: pulse 1.5s infinite; }
        
        .header {
            background: var(--bg-secondary); padding: 12px 20px;
            border-bottom: 2px solid var(--accent); display: flex; align-items: center;
            gap: 15px; flex-wrap: wrap; position: sticky; top: 0; z-index: 100;
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        }
        .back-btn {
            color: var(--accent); text-decoration: none; font-size: 18px; cursor: pointer;
            background: none; border: none; padding: 8px 12px; border-radius: 8px;
            transition: all var(--transition-fast); display: flex; align-items: center; gap: 6px;
        }
        .back-btn:hover { background: rgba(0,255,157,0.1); transform: translateX(-2px); }
        .btn-action-tool {
            background: var(--bg-tertiary); border: 1px solid var(--border);
            color: var(--text-primary); padding: 8px 14px; border-radius: 8px;
            cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 6px;
            transition: all var(--transition-fast); font-weight: 500;
        }
        .btn-action-tool:hover { border-color: var(--accent); transform: translateY(-1px); }
        .btn-action-tool:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        
        .last-updated {
            font-size: 10px; color: var(--text-secondary); text-align: right;
            margin-bottom: 15px; display: flex; align-items: center; justify-content: flex-end;
            gap: 6px; flex-wrap: wrap;
        }
        .last-updated i { font-size: 9px; }
        
        .rate-limit-indicator {
            display: inline-flex; align-items: center; gap: 4px;
            font-size: 9px; color: var(--accent2); margin-left: 8px;
            animation: pulse 1s infinite;
        }
        
        /* v18.2: Supabase connection status */
        .supabase-status {
            display: inline-flex; align-items: center; gap: 4px;
            font-size: 9px; margin-left: 8px; font-weight: 600;
        }
        .supabase-status.online { color: var(--success); }
        .supabase-status.slow { color: var(--orange); animation: pulse 1.5s infinite; }
        .supabase-status.offline { color: var(--danger); }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        
        .balance-bar {
            background: linear-gradient(135deg, var(--bg-secondary), var(--bg-tertiary));
            padding: 18px 24px; border-radius: 16px; margin-bottom: 20px;
            display: flex; justify-content: space-between; align-items: center;
            border: 1px solid rgba(0,255,157,0.15); box-shadow: var(--card-shadow);
        }
        .balance-amount { color: var(--accent); font-weight: 700; font-size: 24px; letter-spacing: -0.5px; }
        .balance-label { font-size: 13px; color: var(--text-secondary); display: flex; align-items: center; gap: 8px; }
        
        .settlement-status-banner {
            display: flex; align-items: center; gap: 10px; padding: 10px 16px;
            border-radius: 10px; font-size: 12px; font-weight: 600; margin-bottom: 15px;
            background: rgba(0,255,157,0.08); border: 1px solid rgba(0,255,157,0.15); color: var(--accent);
        }
        .settlement-status-banner.running { background: rgba(255,152,0,0.08); border: 1px solid rgba(255,152,0,0.15); color: var(--orange); }
        
        .stats-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 20px; }
        .stat-box {
            background: var(--bg-secondary); padding: 16px 12px; border-radius: 14px;
            text-align: center; border: 1px solid rgba(255,255,255,0.04);
            transition: all var(--transition-smooth); cursor: default;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .stat-box:hover { transform: translateY(-3px); border-color: rgba(0,255,157,0.2); box-shadow: var(--card-hover-shadow); }
        .stat-box .val { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }
        .stat-box .lbl { font-size: 10px; color: var(--text-secondary); margin-top: 5px; text-transform: uppercase; letter-spacing: 0.8px; font-weight: 600; }
        .stat-box .sub { font-size: 10px; margin-top: 3px; font-weight: 500; }
        
        .win-rate-container { margin-bottom: 20px; }
        .win-rate-label { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-secondary); margin-bottom: 6px; font-weight: 500; }
        .win-rate-bar { height: 6px; background: var(--bg-tertiary); border-radius: 3px; overflow: hidden; }
        .win-rate-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--success)); border-radius: 3px; transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        
        .search-wrapper { margin-bottom: 18px; }
        .search-input-container { position: relative; }
        .search-input-container i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); font-size: 14px; }
        #bet-search-input {
            width: 100%; padding: 12px 16px 12px 40px; background: var(--bg-secondary);
            border: 1px solid var(--border); color: var(--text-primary); border-radius: 12px;
            font-size: 13px; outline: none; transition: border-color var(--transition-fast);
        }
        #bet-search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,255,157,0.08); }
        #bet-search-input::placeholder { color: var(--text-secondary); opacity: 0.6; }
        
        .filter-row { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 6px; scroll-behavior: smooth; }
        .filter-row::-webkit-scrollbar { height: 3px; }
        .filter-row::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 3px; }
        .filter-chip {
            padding: 9px 16px; background: var(--bg-tertiary); border: 1px solid transparent;
            border-radius: 25px; color: var(--text-secondary); font-size: 12px; font-weight: 600;
            cursor: pointer; white-space: nowrap; transition: all var(--transition-fast);
            user-select: none;
        }
        .filter-chip:hover { border-color: var(--accent); color: var(--text-primary); }
        .filter-chip.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 700; }
        .filter-chip .count {
            background: rgba(255,255,255,0.12); color: inherit; padding: 2px 7px;
            border-radius: 10px; font-size: 10px; margin-left: 6px; font-weight: 600;
        }
        .filter-chip.active .count { background: rgba(0,0,0,0.18); }
        
        .bet-card {
            background: var(--bg-secondary); border-radius: 16px; padding: 18px;
            margin-bottom: 14px; border-left: 5px solid var(--orange); cursor: pointer;
            transition: all var(--transition-smooth); position: relative;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1); overflow: hidden;
        }
        .bet-card::after {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, transparent, rgba(0,255,157,0.02));
            pointer-events: none; opacity: 0; transition: opacity var(--transition-smooth);
        }
        .bet-card:hover { transform: translateX(4px); box-shadow: var(--card-hover-shadow); }
        .bet-card:hover::after { opacity: 1; }
        .bet-card.won { border-left-color: var(--success); }
        .bet-card.lost { border-left-color: var(--danger); }
        .bet-card.cancelled { border-left-color: var(--purple); }
        .bet-card.cashed-out { border-left-color: var(--blue); }
        .bet-card.processing { opacity: 0.65; pointer-events: none; filter: grayscale(20%); }
        .bet-card.render-error { border-left-color: var(--danger); opacity: 0.7; }
        .bet-card.just-settled { animation: settleGlow 2s ease-out; }
        @keyframes settleGlow {
            0% { box-shadow: 0 0 0 0 rgba(0,255,157,0.6); }
            50% { box-shadow: 0 0 30px 5px rgba(0,255,157,0.3); }
            100% { box-shadow: var(--card-shadow); }
        }
        
        .bet-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 10px; }
        .bet-type-tag { padding: 5px 12px; border-radius: 20px; font-size: 10px; font-weight: 700; letter-spacing: 0.5px; white-space: nowrap; }
        .bet-type-tag.single { background: rgba(0,255,157,0.12); color: var(--accent); }
        .bet-type-tag.accumulator { background: rgba(255,152,0,0.12); color: var(--orange); }
        .bet-ticket-num { font-size: 10px; color: var(--text-secondary); font-family: 'Courier New', monospace; margin-left: 8px; letter-spacing: 0.3px; }
        .live-bet-badge {
            display: inline-flex; align-items: center; gap: 4px;
            background: rgba(255,82,82,0.18); color: var(--danger);
            padding: 3px 10px; border-radius: 10px; font-size: 9px; font-weight: 700;
            margin-left: 6px; animation: pulse 1.5s infinite;
        }
        .bet-status-badge {
            display: inline-flex; align-items: center; gap: 5px; padding: 5px 14px;
            border-radius: 20px; font-size: 11px; font-weight: 700; white-space: nowrap;
        }
        .bet-status-badge.won { background: rgba(76,175,80,0.15); color: var(--success); }
        .bet-status-badge.lost { background: rgba(255,82,82,0.15); color: var(--danger); }
        .bet-status-badge.cancelled { background: rgba(156,39,176,0.15); color: var(--purple); }
        .bet-status-badge.cashed-out { background: rgba(0,188,212,0.15); color: var(--blue); }
        .bet-status-badge.active { background: rgba(255,152,0,0.15); color: var(--orange); }
        
        .bet-body { margin-bottom: 12px; }
        .bet-match-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
        .team-logo-small {
            width: 38px; height: 38px; object-fit: contain; border-radius: 50%;
            background: rgba(255,255,255,0.06); padding: 4px; border: 1px solid rgba(255,255,255,0.08);
        }
        .bet-match-name { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .bet-score-display {
            font-family: 'Courier New', monospace; font-size: 13px; font-weight: 700;
            color: var(--accent); background: var(--bg-primary); padding: 3px 10px;
            border-radius: 6px; letter-spacing: 1px;
        }
        .bet-score-display.live { color: var(--danger); animation: blink 1s infinite; }
        .bet-league { font-size: 10px; color: var(--text-secondary); margin-bottom: 5px; font-weight: 500; }
        .bet-pick { color: var(--accent); font-size: 12px; font-weight: 700; }
        .bet-pick span { color: var(--accent2); font-weight: 700; margin-left: 5px; }
        
        .selections-container { margin-top: 10px; padding: 12px; background: var(--bg-tertiary); border-radius: 10px; }
        .selection-item {
            display: flex; justify-content: space-between; gap: 8px; padding: 7px 0;
            border-bottom: 1px dashed rgba(255,255,255,0.06); font-size: 11px; flex-wrap: wrap;
        }
        .selection-item:last-child { border-bottom: none; }
        .selection-match { flex: 1; font-weight: 500; min-width: 100px; }
        .selection-pick { color: var(--accent); font-weight: 600; }
        .selection-odds { color: var(--accent2); font-weight: 700; }
        
        .bet-meta-row {
            display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px;
            padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.04);
            font-size: 10px; color: var(--text-secondary);
        }
        .bet-meta-row span { display: flex; align-items: center; gap: 5px; }
        .bet-meta-row i { color: var(--accent); font-size: 11px; }
        
        .cashout-preview {
            display: flex; flex-direction: column; gap: 10px;
            background: rgba(0,255,157,0.04); padding: 14px; border-radius: 10px;
            margin-top: 10px; border: 1px dashed rgba(0,255,157,0.18); font-size: 11px;
        }
        .cashout-metrics { display: flex; justify-content: space-between; font-weight: 600; flex-wrap: wrap; gap: 8px; }
        .partial-cashout-box { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.04); padding: 8px 12px; border-radius: 8px; }
        .partial-slider { flex: 1; accent-color: var(--accent); cursor: pointer; height: 4px; }
        
        .bet-details-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding-top: 14px; text-align: center; }
        .bet-details-grid .bet-detail .lbl { font-size: 9px; color: var(--text-secondary); text-transform: uppercase; margin-bottom: 5px; letter-spacing: 0.5px; }
        .bet-details-grid .bet-detail .val { font-size: 14px; font-weight: 700; }
        
        .settlement-timer { font-family: 'Courier New', monospace; color: var(--accent); font-size: 13px; font-weight: 700; }
        .settlement-timer.urgent { color: var(--danger) !important; animation: pulse 1s infinite; }
        
        .bet-result-row {
            display: flex; align-items: center; gap: 8px; margin-top: 12px; padding: 10px 12px;
            border-radius: 8px; font-size: 12px; font-weight: 500;
        }
        .bet-result-row.won { background: rgba(76,175,80,0.08); color: var(--success); border: 1px solid rgba(76,175,80,0.18); }
        .bet-result-row.lost { background: rgba(255,82,82,0.08); color: var(--danger); border: 1px solid rgba(255,82,82,0.18); }
        
        .bet-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.05); }
        .bet-action-row-buttons { display: flex; gap: 10px; width: 100%; flex-wrap: wrap; }
        .bet-actions button {
            flex: 1; min-width: 100px; padding: 11px 16px; border: none; border-radius: 10px;
            font-size: 12px; font-weight: 700; cursor: pointer; transition: all var(--transition-fast);
            display: flex; align-items: center; justify-content: center; gap: 7px;
            letter-spacing: 0.3px;
        }
        .bet-actions button:disabled { opacity: 0.45; cursor: not-allowed; transform: none !important; }
        .cancel-btn { background: rgba(255,82,82,0.12); color: var(--danger); border: 1px solid rgba(255,82,82,0.25); }
        .cancel-btn:hover:not(:disabled) { background: var(--danger); color: #fff; transform: translateY(-1px); }
        .cashout-btn { background: var(--blue); color: #000; }
        .cashout-btn:hover:not(:disabled) { background: #00d2ff; transform: translateY(-1px); }
        
        .settlement-info-bar {
            display: flex; align-items: center; gap: 8px; padding: 10px 14px;
            border-radius: 8px; font-size: 11px; margin-top: 12px;
        }
        .settlement-info-bar.auto { background: rgba(0,255,157,0.06); color: var(--accent); border: 1px solid rgba(0,255,157,0.12); }
        .settlement-info-bar.admin { background: rgba(255,152,0,0.06); color: var(--accent2); border: 1px solid rgba(255,152,0,0.12); }
        
        .empty-state { text-align: center; padding: 70px 20px; color: var(--text-secondary); }
        .empty-state i { font-size: 56px; margin-bottom: 16px; color: var(--accent); opacity: 0.2; display: block; }
        
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85); z-index: 1000; display: none;
            align-items: center; justify-content: center; opacity: 0;
            transition: opacity var(--transition-smooth); backdrop-filter: blur(4px);
        }
        .modal-overlay.show { display: flex; opacity: 1; }
        .modal-content {
            background: var(--bg-secondary); border-radius: 20px; width: 520px;
            max-width: 95vw; max-height: 90vh; overflow-y: auto; padding: 28px;
            border: 1px solid rgba(0,255,157,0.15); position: relative;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .modal-close {
            position: absolute; top: 14px; right: 14px; background: var(--bg-tertiary);
            border: none; color: var(--text-primary); font-size: 22px; cursor: pointer;
            width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center;
            justify-content: center; transition: all var(--transition-fast);
        }
        .modal-close:hover { background: var(--danger); color: #fff; }
        .modal-section { margin-bottom: 22px; }
        .modal-section h4 {
            color: var(--accent); font-size: 13px; margin-bottom: 12px;
            text-transform: uppercase; letter-spacing: 0.8px; border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 8px; font-weight: 700;
        }
        .modal-row {
            display: flex; justify-content: space-between; padding: 7px 0; font-size: 12px;
            border-bottom: 1px dashed rgba(255,255,255,0.04); gap: 12px;
        }
        .modal-row:last-child { border-bottom: none; }
        .modal-row .lbl { color: var(--text-secondary); font-weight: 500; }
        
        #loading { text-align: center; padding: 60px 20px; }
        .spinner-large {
            width: 44px; height: 44px; border: 4px solid var(--border);
            border-top-color: var(--accent); border-radius: 50%;
            animation: spin 0.8s linear infinite; margin: 0 auto;
        }
        
        .notification {
            position: fixed; top: 20px; right: 20px; padding: 14px 22px;
            border-radius: 14px; color: #fff; font-size: 13px; font-weight: 600;
            z-index: 9999; animation: slideIn 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            max-width: 380px; box-shadow: 0 10px 40px rgba(0,0,0,0.4);
            display: flex; align-items: center; gap: 10px; line-height: 1.4;
            pointer-events: none;
        }
        
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }
        @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0.3; } }
        @keyframes slideIn { from { transform: translateX(120%); opacity:0; } to { transform: translateX(0); opacity:1; } }
        
        @media(max-width:768px) {
            .stats-grid { grid-template-columns: repeat(3, 1fr); }
            .bet-details-grid { grid-template-columns: repeat(2, 1fr); gap: 14px; }
            .header { padding: 10px 14px; gap: 10px; }
            .header h1 { font-size: 16px; }
        }
        @media(max-width:400px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .bet-actions button { font-size: 11px; padding: 10px; }
        }
    </style>
</head>
<body>
    <!-- v18.2: Chrome Extension Noise Suppression -->
    <div class="offline-banner" id="offline-banner">
        <i class="fas fa-wifi"></i> You are offline. Some features may be unavailable.
    </div>
    
    <div class="header">
        <a class="back-btn" href="https://xlodon.co.uk/sports/betting-sport.html"><i class="fas fa-arrow-left"></i> Back</a>
        <h1 style="font-size:18px;font-weight:700;"><i class="fas fa-layer-group"></i> My Bets</h1>
        <button class="btn-action-tool" id="themeToggleBtn"><i class="fas fa-adjust"></i> Theme</button>
        <button class="btn-action-tool" id="langToggleBtn">عربي</button>
        <button class="btn-action-tool" id="refreshBtn" title="Refresh bets"><i class="fas fa-sync-alt"></i></button>
    </div>
    
    <div class="container">
        <div class="balance-bar">
            <span class="balance-label"><i class="fas fa-wallet"></i> Your Balance</span>
            <span class="balance-amount" id="balance-display">$0.00</span>
        </div>
        
        <!-- v18.2: Settlement Status Banner -->
        <div id="settlement-status" class="settlement-status-banner" style="display:none;">
            <i class="fas fa-sync-alt fa-spin"></i>
            <span id="settlement-status-text">Settling bets...</span>
            <span id="settlement-status-count" style="margin-left:auto;font-family:monospace;"></span>
        </div>
        
        <div class="last-updated" id="last-updated">
            <i class="fas fa-clock"></i> <span id="last-updated-text">Loading...</span>
            <span class="rate-limit-indicator" id="rate-indicator" style="display:none;">
                <i class="fas fa-hourglass-half"></i> Rate limited
            </span>

class RateLimiter {
    constructor(maxCalls, windowMs) {
        this.maxCalls = maxCalls; this.windowMs = windowMs; this.calls = [];
    }
    
    async acquire() {
        const now = Date.now();
        this.calls = this.calls.filter(t => now - t < this.windowMs);
        
        if (this.calls.length < this.maxCalls) {
            this.calls.push(now); return true;
        }
        
        if (CONFIG.RATE_LIMIT_QUEUE_ENABLED) {
            const waitTime = this.calls[0] + this.windowMs - now + 100;
            document.getElementById('rate-indicator').style.display = 'inline-flex';
            await new Promise(r => setTimeout(r, waitTime));
            document.getElementById('rate-indicator').style.display = 'none';
            this.calls.push(Date.now()); return true;
        }
        return false;
    }
}

const missingFixtureCache = {
    _data: null,

    _load() {
        if (this._loaded) return;
        try {
            const raw = localStorage.getItem('xl_missing_fixtures');
            if (raw) {

    _save() {
        try {
            const arr = [...this._data];
            if (arr.length > CONFIG.MISSING_FIXTURE_CACHE_MAX) {
                arr.splice(0, arr.length - Math.floor(CONFIG.MISSING_FIXTURE_CACHE_MAX * 0.8));

            localStorage.setItem('xl_missing_fixtures', JSON.stringify({
                _data: arr,
                _timestamp: Date.now()

        } catch (e) {
            try {
                localStorage.removeItem('xl_missing_fixtures');
                const trimmed = [...this._data].slice(-100);
                localStorage.setItem('xl_missing_fixtures', JSON.stringify({
                    _data: trimmed,
                    _timestamp: Date.now()
                }));
            } catch (e2) {}
        }
    },
    
    has(fid) {
        this._load();
        return this._data.has(fid);
    },
    
    add(fid) {
        this._load();
        if (!this._data.has(fid)) {
            this._data.add(fid);
            this._save();
            debugLog(`📦 Cached missing fixture: ${fid} (total: ${this._data.size})`);
        }
    },
    
    get size() {
        this._load();
        return this._data.size;
    },
    
    cleanExpired() {
        this._load();
        const now = Date.now();
        const ttl = CONFIG.MISSING_FIXTURE_CACHE_TTL_DAYS * 24 * 60 * 60 * 1000;
        try {
            const raw = localStorage.getItem('xl_missing_fixtures');
            if (raw) {
                const parsed = JSON.parse(raw);
                if (parsed._timestamp && (now - parsed._timestamp) > ttl) {
                    localStorage.removeItem('xl_missing_fixtures');
                    this._data = new Set();
                    this._loaded = true;
                    debugLog('🧹 Expired missing fixture cache cleared');
                }
            }
        } catch (e) {}
    }
};

function safeLocalStorageSet(key, value) {
    try { localStorage.setItem(key, value); return true; } catch (e) {
        if (e.name === 'QuotaExceededError') { cleanOldStorageEntries(); try { localStorage.setItem(key, value); return true; } catch (e2) { return false; } }
        return false;
    }
}
function safeLocalStorageGet(key, defaultValue = null) { try { const val = localStorage.getItem(key); return val !== null ? val : defaultValue; } catch (e) { return defaultValue; } }
function cleanOldStorageEntries() {
    try {
        const now = Date.now(), ttlMs = CONFIG.STORAGE_TTL_DAYS * 24 * 60 * 60 * 1000, keysToRemove = [];
        for (let i = 0; i < localStorage.length; i++) { const key = localStorage.key(i); if (key && key.startsWith('xl_')) { try { const data = JSON.parse(localStorage.getItem(key)); if (data && data._timestamp && (now - data._timestamp) > ttlMs) keysToRemove.push(key); } catch (e) { keysToRemove.push(key); } } }
        keysToRemove.forEach(key => { localStorage.removeItem(key); }); if (keysToRemove.length) debugLog(`🧹 Cleaned ${keysToRemove.length} expired localStorage entries`);
    } catch (e) {}
}

// ║  SETTLEMENT MANAGER v18.2 — SMART + PARALLEL + INSTANT      ║
// ╚══════════════════════════════════════════════════════════════╝
class DuplicateProofSettlementManager {
    constructor(userId) {
        this.userId = userId; this.isRunning = false;
        this.emergencyStop = safeLocalStorageGet('xl_emergency_stop') === 'true';
        this.settledBetIds = this._loadSet('xl_settled_ids');
        this.processedPayouts = this._loadSet('xl_payout_ids');
        this.failedPayouts = this._loadSet('xl_failed_payouts');
    }

    _loadSet(key) { try { const raw = safeLocalStorageGet(`${key}_${this.userId}`); if (!raw) return new Set(); const parsed = JSON.parse(raw); return new Set(Array.isArray(parsed) ? parsed : parsed._data || []); } catch (e) { return new Set(); } }
    _saveSet(key, s) { const arr = [...s]; let dataToStore = arr; if (arr.length > CONFIG.MAX_STORED_IDS) dataToStore = arr.slice(-Math.floor(CONFIG.MAX_STORED_IDS * 0.8)); safeLocalStorageSet(`${key}_${this.userId}`, JSON.stringify({ _data: dataToStore, _timestamp: Date.now() })); }

    async processBets(bets) {
        if (this.emergencyStop || this.isRunning || !isOnline) return { processed: 0, duplicates: 0, errors: 0 };
        this.isRunning = true; settlementInProgress = true;
        let processed = 0, duplicates = 0, errors = 0;
        try {
            const pending = bets.filter(b => b.status === 'active' && !this.settledBetIds.has(b.id) && !processingBetIds.has(b.id));
            if (!pending.length) return { processed: 0, duplicates: 0, errors: 0 };
            
            const { cleanBets, duplicateCount } = await this._handleDuplicates(pending);
            duplicates = duplicateCount;
            
            const fids = [...new Set(cleanBets.flatMap(b => [b.fixture_id, ...(b.selections || []).map(s => s.fixtureId || s.fixture_id)].filter(Boolean)))];
            let mm = {}; if (fids.length && await apiRateLimiter.acquire()) mm = await this._fetchMatchesWithRetry(fids, CONFIG.MATCH_FETCH_MAX_RETRIES);
            
            const totalBets = cleanBets.length; let completedBets = 0;
            showSettlementStatus(`Settling ${totalBets} bets...`, `0/${totalBets}`, true);
            
            for (let i = 0; i < cleanBets.length; i += CONFIG.BATCH_SIZE) {
                const batch = cleanBets.slice(i, i + CONFIG.BATCH_SIZE);
                await Promise.allSettled(batch.map(async (bet) => {
                    try {
                        if (this.settledBetIds.has(bet.id) || processingBetIds.has(bet.id)) return;
                        processingBetIds.add(bet.id);
                        const result = await this._settleSingleBet(bet, mm[bet.fixture_id] || null, mm);
                        if (result.isOk() && result.getData()) { this.settledBetIds.add(bet.id); this._saveSet('xl_settled_ids', this.settledBetIds); newlySettledBetIds.add(bet.id); processed++; }
                        else if (!result.isOk()) errors++;
                    } catch (err) { errors++; }
                    finally { processingBetIds.delete(bet.id); completedBets++; showSettlementStatus(`Settling bets...`, `${completedBets}/${totalBets}`, true); }
                }));
            }
        } catch (err) { errors++; }
        finally { this.isRunning = false; settlementInProgress = false; showSettlementStatus(null); if (processed > 0) showNotification(`✅ ${processed} bet${processed > 1 ? 's' : ''} settled`, 'settlement'); }
        return { processed, duplicates, errors };
    }

    async _fetchMatchesWithRetry(fids, maxRetries) {
        const fidsToFetch = fids.filter(f => !missingFixtureCache.has(f));
        if (fidsToFetch.length === 0) return {};
        for (let attempt = 1; attempt <= maxRetries; attempt++) { try { const result = await fetchMatchesBatch(fidsToFetch); if (Object.keys(result).length > 0) return result; } catch (e) { debugWarn(`Match fetch attempt ${attempt}/${maxRetries} failed:`, e.message); } if (attempt < maxRetries) await new Promise(r => setTimeout(r, CONFIG.MATCH_FETCH_RETRY_DELAY * attempt)); }
        return {};
    }

    async _handleDuplicates(bets) {
        const groups = {}; for (const b of bets) { const k = this._dupKey(b); if (!groups[k]) groups[k] = []; groups[k].push(b); }
        const clean = []; let dc = 0;
        for (const [key, group] of Object.entries(groups)) {
            if (group.length === 1) { clean.push(group[0]); continue; }
            const sorted = group.sort((a, b) => new Date(a.placed_at || 0).getTime() - new Date(b.placed_at || 0).getTime()); clean.push(sorted[0]);
            for (let i = 1; i < sorted.length; i++) { try { const r = await this._cancelDuplicate(sorted[i], sorted[0].id); if (r.isOk()) { this.settledBetIds.add(sorted[i].id); dc++; } } catch (e) { debugError(`Failed to cancel duplicate ${sorted[i].id}:`, e.message); } }
            this._saveSet('xl_settled_ids', this.settledBetIds);
        }
        return { cleanBets: clean, duplicateCount: dc };
    }

    _dupKey(bet) { if (bet.selections && Array.isArray(bet.selections) && bet.selections.length > 0) { const h = bet.selections.map(s => `${s.fixtureId || s.fixture_id}_${s.betType || s.bet_type}_${s.odds}`).sort().join('|'); return `ACC_${bet.user_id}_${bet.amount}_${bet.odds}_${h}`; } return `SGL_${bet.user_id}_${bet.fixture_id}_${bet.bet_type}_${bet.amount}_${bet.odds}`; }

    async _cancelDuplicate(dup, originalId) {
        const stake = parseFloat(dup.amount || 0); if (stake <= 0) return Result.fail('Stake is zero or negative');
        const { error, data } = await supabaseClient.from('bets').update({ status: 'cancelled', settlement_reason: `DUPLICATE - Original: ${originalId}`, refund_amount: stake, cancelled_at: new Date().toISOString(), updated_at: new Date().toISOString(), settled_by: 'auto' }).eq('id', dup.id).eq('status', 'active').select('id');
        if (error || !data?.length) return Result.fail(error?.message || 'Update failed');
        await this._refundAtomic(dup.user_id, dup.id, stake, 'duplicate_cancellation'); dup.status = 'cancelled';
        return Result.ok(true);
    }

    async _settleSingleBet(bet, match, allMatches = {}) {
        if (bet.selections && Array.isArray(bet.selections) && bet.selections.length > 0) return await this._settleAccumulatorSmart(bet, allMatches);
        if (!match) return Result.fail(`No match data for fixture ${bet.fixture_id}`);
        const matchStatus = (match.status || '').toUpperCase(), finishedStatuses = ['FINISHED', 'FT', 'AET', 'PEN'];
        const kickoff = bet._kickoff ? new Date(bet._kickoff) : null, now = new Date();
        const isFinished = finishedStatuses.includes(matchStatus), isTimerExpired = kickoff && (now >= new Date(kickoff.getTime() + CONFIG.SETTLEMENT_TIMEOUT_MINUTES * 60000));
        let shouldWait = false;
        if (isFinished && !isTimerExpired) { const estEnd = kickoff ? new Date(kickoff.getTime() + 105 * 60000) : now; if (now < new Date(estEnd.getTime() + CONFIG.SETTLEMENT_GRACE_PERIOD_MINUTES * 60000)) shouldWait = true; }
        if (!((isFinished && !shouldWait) || isTimerExpired)) return Result.fail(isFinished ? 'Grace period active' : 'Not ready to settle');
        const result = this._determineResult(bet, match); if (!result) return Result.fail(`Unknown bet type: ${bet.bet_type}`);
        return await this._finalizeSettlement(bet, result, isTimerExpired && !isFinished ? 'timer_expired' : 'match_finished', match);
    }

    async _settleAccumulatorSmart(bet, allMatches) {
        if (!bet.selections?.length) return Result.fail('No selections');
        const now = new Date(), finished = ['FINISHED', 'FT', 'AET', 'PEN'], results = []; let allDone = true, earlyLoss = false;
        for (const sel of bet.selections) {
            const fid = sel.fixtureId || sel.fixture_id, m = allMatches[fid] || null; if (!m) { allDone = false; continue; }
            const ms = (m.status || '').toUpperCase(), isF = finished.includes(ms), ko = m.start_time ? new Date(m.start_time) : null, isTE = ko && (now >= new Date(ko.getTime() + CONFIG.SETTLEMENT_TIMEOUT_MINUTES * 60000));
            if (!isF && !isTE) { allDone = false; continue; }
            if (isF && !isTE) { const est = ko ? new Date(ko.getTime() + 105 * 60000) : now; if (now < new Date(est.getTime() + CONFIG.SETTLEMENT_GRACE_PERIOD_MINUTES * 60000)) { allDone = false; continue; } }
            const r = this._determineResult({ bet_type: sel.betType || sel.bet_type }, m); if (!r) { allDone = false; continue; }
            results.push(r); if (CONFIG.ACCA_EARLY_SETTLE_ENABLED && r.won === false && !r.refund) { earlyLoss = true; break; }
        }
        if (earlyLoss) return await this._finalizeSettlement(bet, { won: false, refund: false, reason: 'One or more legs lost' }, 'early_loss_detection');
        if (!allDone || results.length !== bet.selections.length) return Result.fail('Not all legs finished');
        const anyLost = results.some(r => r.won === false && !r.refund), allWon = results.every(r => r.won === true), hasRefund = results.some(r => r.refund);
        let fr; if (anyLost) fr = { won: false, refund: false, reason: 'One or more legs lost' }; else if (hasRefund) fr = { won: true, refund: true, reason: 'Leg(s) refunded' }; else if (allWon) fr = { won: true, refund: false, reason: 'All legs won!' }; else return Result.fail('Incomplete');
        return await this._finalizeSettlement(bet, fr, 'acca_settled');
    }

    async _finalizeSettlement(bet, result, settleReason, match = null) {
        const stake = parseFloat(bet.amount || 0), odds = parseFloat(bet.odds || 1); let ns, pay, pr;
        if (result.refund) { ns = 'cancelled'; pay = stake; pr = 0; } else if (result.won) { ns = 'won'; pay = parseFloat((stake * odds).toFixed(2)); pr = parseFloat((pay - stake).toFixed(2)); } else { ns = 'lost'; pay = 0; pr = parseFloat((-stake).toFixed(2)); }
        const settledAt = new Date().toISOString(), score = match ? `${match.goals_home || 0}-${match.goals_away || 0}` : 'N/A';
        const ur = await this._atomicBetUpdate(bet.id, { status: ns, payout: pay, profit_loss: pr, settlement_reason: `${result.reason} (${settleReason})`, settled_at: settledAt, settled_by: 'auto', match_score: score, updated_at: settledAt }); if (!ur.isOk()) return ur;
        if (pay > 0) { const pr2 = await this._payoutAtomic(bet.user_id, bet.id, pay, pr, { stake, odds, reason: result.reason, settleReason }); if (!pr2.isOk()) { this.failedPayouts.add(bet.id); this._saveSet('xl_failed_payouts', this.failedPayouts); } }
        Object.assign(bet, { status: ns, payout: pay, profit_loss: pr, settlement_reason: result.reason, settled_at: settledAt, settled_by: 'auto' });
        return Result.ok(true);
    }

    _determineResult(bet, match) {
        const hg = parseInt(match.goals_home || 0), ag = parseInt(match.goals_away || 0), tg = hg + ag;
        const map = {
            home: { won: hg > ag, reason: `${hg}-${ag} (Home Win)` }, away: { won: ag > hg, reason: `${hg}-${ag} (Away Win)` }, draw: { won: hg === ag, reason: `${hg}-${ag} (Draw)` },
            '1X': { won: hg >= ag, reason: `${hg}-${ag} (1X)` }, '12': { won: hg !== ag, reason: `${hg}-${ag} (12)` }, X2: { won: ag >= hg, reason: `${hg}-${ag} (X2)` },
            over05: { won: tg > 0.5, reason: `${hg}-${ag} (Over 0.5)` }, under05: { won: tg < 0.5, reason: `${hg}-${ag} (Under 0.5)` },
            over15: { won: tg > 1.5, reason: `${hg}-${ag} (Over 1.5)` }, under15: { won: tg < 1.5, reason: `${hg}-${ag} (Under 1.5)` },
            over25: { won: tg > 2.5, reason: `${hg}-${ag} (Over 2.5)` }, under25: { won: tg < 2.5, reason: `${hg}-${ag} (Under 2.5)` },
            over35: { won: tg > 3.5, reason: `${hg}-${ag} (Over 3.5)` }, under35: { won: tg < 3.5, reason: `${hg}-${ag} (Under 3.5)` },
            btts_yes: { won: hg > 0 && ag > 0, reason: `${hg}-${ag} (BTTS Yes)` }, btts_no: { won: !(hg > 0 && ag > 0), reason: `${hg}-${ag} (BTTS No)` },
            home_dnb: hg === ag ? { refund: true, reason: `${hg}-${ag} (DNB Refund)` } : { won: hg > ag, reason: `${hg}-${ag} (Home DNB)` },
            away_dnb: hg === ag ? { refund: true, reason: `${hg}-${ag} (DNB Refund)` } : { won: ag > hg, reason: `${hg}-${ag} (Away DNB)` },
            home_over05: { won: hg > 0.5, reason: `${hg}-${ag} (Home O0.5)` }, away_over05: { won: ag > 0.5, reason: `${hg}-${ag} (Away O0.5)` },
            home_over15: { won: hg > 1.5, reason: `${hg}-${ag} (Home O1.5)` }, away_over15: { won: ag > 1.5, reason: `${hg}-${ag} (Away O1.5)` },
            home_over25: { won: hg > 2.5, reason: `${hg}-${ag} (Home O2.5)` }, away_over25: { won: ag > 2.5, reason: `${hg}-${ag} (Away O2.5)` },
            home_under05: { won: hg < 0.5, reason: `${hg}-${ag} (Home U0.5)` }, away_under05: { won: ag < 0.5, reason: `${hg}-${ag} (Away U0.5)` },
            home_under15: { won: hg < 1.5, reason: `${hg}-${ag} (Home U1.5)` }, away_under15: { won: ag < 1.5, reason: `${hg}-${ag} (Away U1.5)` },
            double_chance_1x: { won: hg >= ag, reason: `${hg}-${ag} (DC 1X)` }, double_chance_12: { won: hg !== ag, reason: `${hg}-${ag} (DC 12)` }, double_chance_x2: { won: ag >= hg, reason: `${hg}-${ag} (DC X2)` },
            exact_goals_0: { won: tg === 0, reason: `${hg}-${ag} (Exact 0)` }, exact_goals_1: { won: tg === 1, reason: `${hg}-${ag} (Exact 1)` },
            exact_goals_2: { won: tg === 2, reason: `${hg}-${ag} (Exact 2)` }, exact_goals_3: { won: tg === 3, reason: `${hg}-${ag} (Exact 3)` }, exact_goals_4plus: { won: tg >= 4, reason: `${hg}-${ag} (Exact 4+)` },
            handicap_home_1: { won: (hg + 1) > ag, reason: `${hg}-${ag} (H +1)` }, handicap_away_1: { won: (ag + 1) > hg, reason: `${hg}-${ag} (A +1)` },
            handicap_home_m1: { won: (hg - 1) > ag, reason: `${hg}-${ag} (H -1)` }, handicap_away_m1: { won: (ag - 1) > hg, reason: `${hg}-${ag} (A -1)` },
        };
        return map[bet.bet_type] || null;
    }

    async _atomicBetUpdate(betId, payload) {
        let result = await supabaseClient.from('bets').update(payload).eq('id', betId).eq('status', 'active').select('id');
        if (!result.error && result.data?.length) return Result.ok(result.data);
        result = await supabaseClient.from('bets').update({ status: payload.status, payout: payload.payout, profit_loss: payload.profit_loss, settlement_reason: payload.settlement_reason, match_score: payload.match_score, updated_at: payload.updated_at }).eq('id', betId).eq('status', 'active').select('id');
        return (!result.error && result.data?.length) ? Result.ok(result.data) : Result.fail(result.error?.message || 'Update failed');
    }

    async _payoutAtomic(userId, betId, total, profit, meta) {
        if (this.processedPayouts.has(betId)) return Result.fail('Payout already processed');
        try {
            const wRef = db.collection('wallets').doc(userId), lRef = db.collection('payout_logs').doc(betId);
            await db.runTransaction(async (txn) => { if ((await txn.get(lRef)).exists) throw new Error('DUPLICATE_PAYOUT'); const wDoc = await txn.get(wRef), before = wDoc.exists ? (parseFloat(wDoc.data().balance) || 0) : 0, after = parseFloat((before + total).toFixed(2)); txn.set(lRef, { user_id: userId, bet_id: betId, amount: total, profit, type: 'settlement_payout', balance_before: before, balance_after: after, timestamp: firebase.firestore.FieldValue.serverTimestamp(), metadata: meta }); txn.set(wRef, { balance: after, updated_at: new Date().toISOString() }, { merge: true }); txn.set(db.collection('transactions').doc(), { user_id: userId, bet_id: betId, amount: total, profit, type: 'settlement_payout', balance_before: before, balance_after: after, timestamp: firebase.firestore.FieldValue.serverTimestamp() }); });
            this.processedPayouts.add(betId); this._saveSet('xl_payout_ids', this.processedPayouts); return Result.ok(true);
        } catch (e) { if (e.message === 'DUPLICATE_PAYOUT') { this.processedPayouts.add(betId); this._saveSet('xl_payout_ids', this.processedPayouts); } return Result.fail(e.message); }
    }

    async _refundAtomic(userId, betId, amount, reason) {
        const key = `refund_${betId}`; if (this.processedPayouts.has(key)) return Result.fail('Already refunded');
        try {
            const wRef = db.collection('wallets').doc(userId), lRef = db.collection('refund_logs').doc(betId);
            await db.runTransaction(async (txn) => { if ((await txn.get(lRef)).exists) throw new Error('DUPLICATE_REFUND'); const wDoc = await txn.get(wRef), before = wDoc.exists ? (parseFloat(wDoc.data().balance) || 0) : 0, after = parseFloat((before + amount).toFixed(2)); txn.set(lRef, { user_id: userId, bet_id: betId, amount, type: 'refund', reason, balance_before: before, balance_after: after, timestamp: firebase.firestore.FieldValue.serverTimestamp() }); txn.set(wRef, { balance: after, updated_at: new Date().toISOString() }, { merge: true }); });
            this.processedPayouts.add(key); this._saveSet('xl_payout_ids', this.processedPayouts); return Result.ok(true);
        } catch (e) { if (e.message === 'DUPLICATE_REFUND') { this.processedPayouts.add(key); this._saveSet('xl_payout_ids', this.processedPayouts); } return Result.fail(e.message); }
    }

    async _payoutWithRetry(userId, betId, total, profit, meta, attempt = 1) { const r = await this._payoutAtomic(userId, betId, total, profit, meta); if (r.isOk()) { this.failedPayouts.delete(betId); this._saveSet('xl_failed_payouts', this.failedPayouts); return true; } if (attempt < CONFIG.MAX_RETRIES) { await new Promise(r => setTimeout(r, CONFIG.RETRY_DELAY * attempt)); return this._payoutWithRetry(userId, betId, total, profit, meta, attempt + 1); } return false; }

    async retryFailedPayouts() { if (this.failedPayouts.size === 0 || !isOnline) return; for (const betId of [...this.failedPayouts]) { try { const bet = allBets.find(b => b.id === betId); if (!bet || bet.status === 'active') { this.failedPayouts.delete(betId); continue; } const pay = parseFloat(bet.payout || 0); if (pay > 0) { const r = await this._payoutAtomic(bet.user_id, betId, pay, parseFloat(bet.profit_loss || 0), { stake: parseFloat(bet.amount || 0), odds: parseFloat(bet.odds || 1), reason: bet.settlement_reason || 'retry' }); if (r.isOk()) this.failedPayouts.delete(betId); } else this.failedPayouts.delete(betId); } catch (e) {} } this._saveSet('xl_failed_payouts', this.failedPayouts); }
}

function safeParseJSON(v) { if (!v) return null; if (typeof v === 'object') return v; try { return JSON.parse(v); } catch (e) { return null; } }
function extractTeamName(d, fb) { if (!d) return fb || 'Team'; if (typeof d === 'string') { const p = safeParseJSON(d); if (p?.name && p.name !== 'Home' && p.name !== 'Away') return p.name; if (d.trim() && d !== 'Home' && d !== 'Away') return d.trim(); return fb || 'Team'; } if (typeof d === 'object' && d.name && d.name !== 'Home' && d.name !== 'Away') return d.name; return fb || 'Team'; }
function extractTeamLogo(d) { if (!d) return ''; if (typeof d === 'string') { const p = safeParseJSON(d); if (p?.logo) return p.logo; } if (typeof d === 'object' && d.logo) return d.logo; return ''; }
function extractScore(d) { if (!d) return { home: 0, away: 0 }; if (typeof d === 'object') return { home: d.home || 0, away: d.away || 0 }; const p = safeParseJSON(d); return p ? { home: p.home || 0, away: p.away || 0 } : { home: 0, away: 0 }; }

// ╔══════════════════════════════════════════════════════════════╗
// ║  MATCH DATA FETCHING (WITH 404 CACHE + RATE LIMITING)       ║
// ╚══════════════════════════════════════════════════════════════╝
async function fetchMatchFromAPI(fid, attempt = 1) {
    if (missingFixtureCache.has(fid)) return null;
    const MAX_ATTEMPTS = 2;
    try {
        if (!await apiRateLimiter.acquire()) return null;
        const ctrl = new AbortController(), timeout = setTimeout(() => ctrl.abort(), 10000);
        const response = await fetch(`${API_BASE}/api/fixture/${fid}`, { signal: ctrl.signal }); clearTimeout(timeout);
        if (!response.ok) { if (response.status === 404) { missingFixtureCache.add(fid); debugLog(`📦 Cached missing fixture: ${fid}`); return null; } if (response.status === 429 && attempt < MAX_ATTEMPTS) { await new Promise(r => setTimeout(r, 2000 * attempt)); return fetchMatchFromAPI(fid, attempt + 1); } return null; }
        const data = await response.json();
        if (data.success && data.fixture) { const f = data.fixture; return { fixture_id: fid, status: f.fixture?.status?.short || 'NS', elapsed: f.fixture?.status?.elapsed || 0, goals_home: f.goals?.home || 0, goals_away: f.goals?.away || 0, start_time: f.fixture?.date || '', league_name: f.league?.name || '', home_team: { name: extractTeamName(f.teams?.home, 'Home'), logo: f.teams?.home?.logo || '' }, away_team: { name: extractTeamName(f.teams?.away, 'Away'), logo: f.teams?.away?.logo || '' } }; }
        return null;
    } catch (e) { if (e.name === 'AbortError' && attempt < MAX_ATTEMPTS) return fetchMatchFromAPI(fid, attempt + 1); return null; }
}

async function fetchMatchesBatch(fids) {
    if (!fids?.length) return {}; const fidsToFetch = fids.filter(f => !missingFixtureCache.has(f)); if (fidsToFetch.length === 0) return {};
    const result = {};
    try { const { data, error } = await supabaseClient.from('sports_matches').select('*').in('fixture_id', fidsToFetch); if (!error && data?.length) for (const row of data) { const score = extractScore(row.score), hn = extractTeamName(row.home_team, 'Home'), an = extractTeamName(row.away_team, 'Away'); result[row.fixture_id] = { fixture_id: row.fixture_id, status: row.status || 'NS', elapsed: row.elapsed || 0, goals_home: score.home, goals_away: score.away, start_time: row.start_time || '', league_name: row.league_name || '', home_team: { name: hn, logo: extractTeamLogo(row.home_team) || `https://ui-avatars.com/api/?name=${encodeURIComponent(hn.substring(0,2))}&size=32&background=1a2332&color=00ff9d` }, away_team: { name: an, logo: extractTeamLogo(row.away_team) || `https://ui-avatars.com/api/?name=${encodeURIComponent(an.substring(0,2))}&size=32&background=1a2332&color=ff9800` } }; } } catch (e) { debugWarn('Supabase match fetch failed:', e.message); }
    const missing = fidsToFetch.filter(f => !result[f]); if (missing.length) { const apiResults = await Promise.allSettled(missing.map(f => fetchMatchFromAPI(f))); apiResults.forEach((r, i) => { if (r.status === 'fulfilled' && r.value) result[missing[i]] = r.value; }); }
    return result;
}

function escapeHtml(s) { if (!s) return ''; return String(s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m])); }
function formatFullDate(d) { return d ? new Date(d).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '-'; }
function formatFullDateTime(d) { return d ? new Date(d).toLocaleString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' }) : '-'; }
function timeAgo(d) { if (!d) return ''; const diff = Math.floor((new Date() - new Date(d)) / 1000); if (diff < 60) return `${diff}s ago`; if (diff < 3600) return `${Math.floor(diff / 60)}m ago`; if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`; return `${Math.floor(diff / 86400)}d ago`; }
function formatBetTypeName(bt) { const names = { home: '🏠 Home Win', draw: '🤝 Draw', away: '✈️ Away Win', '1X': '1X (Home/Draw)', '12': '12 (No Draw)', X2: 'X2 (Away/Draw)', over05: 'Over 0.5', under05: 'Under 0.5', over15: 'Over 1.5', under15: 'Under 1.5', over25: 'Over 2.5', under25: 'Under 2.5', over35: 'Over 3.5', under35: 'Under 3.5', btts_yes: 'BTTS Yes', btts_no: 'BTTS No', home_dnb: 'Home DNB', away_dnb: 'Away DNB', home_over05: 'Home Over 0.5', away_over05: 'Away Over 0.5', home_over15: 'Home Over 1.5', away_over15: 'Away Over 1.5', home_over25: 'Home Over 2.5', away_over25: 'Away Over 2.5', home_under05: 'Home Under 0.5', away_under05: 'Away Under 0.5', home_under15: 'Home Under 1.5', away_under15: 'Away Under 1.5', double_chance_1x: 'Double Chance 1X', double_chance_12: 'Double Chance 12', double_chance_x2: 'Double Chance X2', exact_goals_0: 'Exact Goals 0', exact_goals_1: 'Exact Goals 1', exact_goals_2: 'Exact Goals 2', exact_goals_3: 'Exact Goals 3', exact_goals_4plus: 'Exact Goals 4+', handicap_home_1: 'Home +1', handicap_away_1: 'Away +1', handicap_home_m1: 'Home -1', handicap_away_m1: 'Away -1', accumulator: 'Accumulator' }; return names[bt] || bt.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase()); }
function debounce(fn, delay) { let timeout; return function(...args) { clearTimeout(timeout); timeout = setTimeout(() => fn.apply(this, args), delay); }; }
function updateLastUpdated() { const el = document.getElementById('last-updated-text'); if (el) { lastFetchTimestamp = new Date(); el.textContent = `Last updated: ${lastFetchTimestamp.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' })}`; } }

// ║  v18.2: DATA LOADING (WITH TIMEOUT + CACHED FIRST RENDER)   ║
// ╚══════════════════════════════════════════════════════════════╝
async function loadBalance() { try { const u = auth.currentUser; if (!u) return 0; const doc = await db.collection('wallets').doc(u.uid).get(); const balance = doc.exists ? (parseFloat(doc.data().balance) || 0) : 1000; document.getElementById('balance-display').textContent = `$${balance.toFixed(2)}`; return balance; } catch (e) { return 0; } }

async function enrichBets(bets) {
    const now = new Date(), allFixtureIds = new Set();
    for (const bet of bets) {
        const isActive = bet.status === 'active', isRecent = bet.placed_at && (now - new Date(bet.placed_at)) < CONFIG.RECENT_MATCH_WINDOW_MS;
        if (bet.fixture_id && (isActive || isRecent)) allFixtureIds.add(bet.fixture_id);
        let selections = bet.selections; if (typeof selections === 'string') selections = safeParseJSON(selections);
        if (Array.isArray(selections)) { bet.selections = selections; selections.forEach(s => { const fid = s.fixtureId || s.fixture_id; if (fid) allFixtureIds.add(fid); }); }
    }
    const matchMap = [...allFixtureIds].length > 0 ? await fetchMatchesBatch([...allFixtureIds]) : {};
    for (const bet of bets) {
        if (bet.selections && typeof bet.selections === 'string') bet.selections = safeParseJSON(bet.selections) || [];
        const hasMulti = Array.isArray(bet.selections) && bet.selections.length > 0;
        if (hasMulti && bet.bet_type !== 'accumulator') bet.bet_type = 'accumulator';
        if (!hasMulti && bet.bet_type === 'accumulator') bet.bet_type = 'home';
        if (hasMulti) bet.selections.forEach(s => { const fid = s.fixtureId || s.fixture_id; if (fid && matchMap[fid]) s._match = matchMap[fid]; });
        let homeFallback = 'Home', awayFallback = 'Away'; if (bet.match_name?.includes(' vs ')) { const parts = bet.match_name.split(' vs '); if (parts[0]?.trim()) homeFallback = parts[0].trim(); if (parts[1]?.trim()) awayFallback = parts[1].trim(); }
        if (bet.fixture_id && matchMap[bet.fixture_id]) { const m = matchMap[bet.fixture_id]; const hn = m.home_team?.name && m.home_team.name !== 'Home' ? m.home_team.name : homeFallback, an = m.away_team?.name && m.away_team.name !== 'Away' ? m.away_team.name : awayFallback; bet.match_name = `${hn} vs ${an}`; bet._homeTeam = { name: hn, logo: m.home_team?.logo || `https://ui-avatars.com/api/?name=${encodeURIComponent(hn.substring(0,2))}&size=36&background=1a2332&color=00ff9d` }; bet._awayTeam = { name: an, logo: m.away_team?.logo || `https://ui-avatars.com/api/?name=${encodeURIComponent(an.substring(0,2))}&size=36&background=1a2332&color=ff9800` }; bet._league = m.league_name || ''; bet._kickoff = m.start_time || bet.placed_at; bet._matchStatus = m.status || 'NS'; bet._elapsed = m.elapsed || 0; bet._score = { home: m.goals_home || 0, away: m.goals_away || 0 }; bet._match = m; }

async function loadBets() {
    if (!isOnline) { updateStats(); updateCounts(); filterBets(currentFilter); return; }
    const u = auth.currentUser; if (!u) return;
    const statusEl = document.getElementById('loading-status');
    
    // v18.2: Show cached data immediately while fetching fresh data
    const loadingEl = document.getElementById('loading');
    const contentEl = document.getElementById('content');
    if (allBets.length > 0) {
        loadingEl.style.display = 'none';
        contentEl.style.display = 'block';
        updateStats(); updateCounts(); filterBets(currentFilter);
        debugLog('📦 Showing cached data while fetching updates...');
    }
    
    try {
        // v18.2: Warm up Supabase connection
        if (!window._supabaseWarmed) {
            try {
                if (statusEl) statusEl.textContent = 'Warming up connection...';
                await Promise.race([
                    supabaseClient.from('bets').select('id').limit(1),
                    new Promise((_, reject) => setTimeout(() => reject(new Error('WARMUP_TIMEOUT')), 5000))
                ]);
                window._supabaseWarmed = true;
                debugLog('🔥 Supabase connection warmed up');
            } catch (e) { debugWarn('Supabase warmup failed — proceeding normally'); }
        }
        
        if (statusEl) statusEl.textContent = 'Connecting...';
        
        // v18.2: Supabase query with timeout + retry
        let data, error;
        let supabaseAttempts = 0;
        const queryStart = performance.now();
        
        while (supabaseAttempts <= CONFIG.SUPABASE_MAX_RETRIES) {
            try {
                const result = await Promise.race([
                    supabaseClient.from('bets').select('*').eq('user_id', u.uid).order('placed_at', { ascending: false }),
                    new Promise((_, reject) => setTimeout(() => reject(new Error('SUPABASE_TIMEOUT')), CONFIG.SUPABASE_QUERY_TIMEOUT_MS))
                ]);
                data = result.data; error = result.error;
                
                const queryTime = Math.round(performance.now() - queryStart);
                supabaseLatency = queryTime;
                if (queryTime > 5000) { updateSupabaseStatus('slow', queryTime); }
                else { updateSupabaseStatus('online', queryTime); }
                debugLog(`⏱️ Supabase query: ${queryTime}ms`);
                break;
            } catch (e) {
                supabaseAttempts++;
                if (e.message === 'SUPABASE_TIMEOUT') {
                    debugWarn(`Supabase timeout (attempt ${supabaseAttempts}/${CONFIG.SUPABASE_MAX_RETRIES + 1})`);
                    if (statusEl) statusEl.textContent = `Database slow — retrying (${supabaseAttempts})...`;
                    updateSupabaseStatus('slow');
                } else { throw e; }
                if (supabaseAttempts > CONFIG.SUPABASE_MAX_RETRIES) {
                    error = { message: 'Database timeout after retries' }; data = null;
                }
            }
        }
        
        if (error) throw new Error(`Database error: ${error.message}`);
        
        const rawBets = data || [];
        if (statusEl) statusEl.textContent = `Processing ${rawBets.length} bets...`;
        
        await enrichBets(rawBets);
        allBets = rawBets;
        
        if (!allBets.length || loadingEl.style.display !== 'none') {
            loadingEl.style.display = 'none';
            contentEl.style.display = 'block';
        }
        
        updateLastUpdated(); updateStats(); updateCounts(); filterBets(currentFilter); startSettlementTimers();
        
        const hasFinished = allBets.some(b => b.status === 'active' && ['finished', 'ft', 'aet', 'pen'].includes((b._matchStatus || '').toLowerCase()));
        if (hasFinished) { debugLog('Found finished matches — triggering immediate settlement'); scheduleImmediateSettlement(); }
        
        await autoSettleBets(); if (settlementManager) { await settlementManager.retryFailedPayouts(); await loadBalance(); }
        if (openModalBetId) showDetails(openModalBetId);
        debugLog(`Loaded ${allBets.length} bets successfully`);
    } catch (e) {
        debugError('Load failed:', e.message);
        updateSupabaseStatus('offline');
        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').style.display = 'block';
        const container = document.getElementById('bet-list-container');
        if (container) { container.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-triangle" style="color:var(--danger);"></i><p style="font-size:15px;font-weight:600;">Failed to load bets</p><p style="font-size:11px;margin-top:6px;">${escapeHtml(e.message)}</p><button class="btn-action-tool" onclick="loadBets()" style="margin-top:16px;"><i class="fas fa-redo"></i> Retry</button></div>`; }
    }
}

function scheduleImmediateSettlement() {
    if (settlementTimeout) { clearTimeout(settlementTimeout); debugLog('Debounced: resetting settlement timer'); }
    settlementTimeout = setTimeout(async () => { debugLog('⚡ Running immediate settlement...'); showSettlementStatus('Settling finished matches...', '', true); await autoSettleBets(); if (settlementManager) await settlementManager.retryFailedPayouts(); await loadBalance(); updateStats(); updateCounts(); filterBets(currentFilter); showSettlementStatus(null); settlementTimeout = null; }, CONFIG.SETTLEMENT_DEBOUNCE_MS);
}

async function autoSettleBets() {
    if (!isOnline) return; const u = auth.currentUser; if (!u) return;
    if (!settlementManager) settlementManager = new DuplicateProofSettlementManager(u.uid);
    if (settlementManager.emergencyStop) return;
    newlySettledBetIds.clear();
    const active = allBets.filter(b => b.status === 'active' && !settlementManager.settledBetIds.has(b.id));
    if (!active.length) return;
    const result = await settlementManager.processBets(active);
    if (result.processed > 0 || result.duplicates > 0) { await loadBalance(); updateStats(); updateCounts(); filterBets(currentFilter); if (openModalBetId && newlySettledBetIds.has(openModalBetId)) showDetails(openModalBetId); setTimeout(() => document.querySelectorAll('.bet-card.just-settled').forEach(c => c.classList.remove('just-settled')), CONFIG.SETTLE_GLOW_DURATION_MS); }
}

function isBetLocked(betId) { return processingBetIds.has(betId); }
function lockBet(betId, bet) { processingBetIds.add(betId); if (bet) bet._isCashoutProcessing = true; disableBetButtons(betId); }
function unlockBet(betId, bet) { processingBetIds.delete(betId); if (bet) bet._isCashoutProcessing = false; enableBetButtons(betId); }

async function cancelBet(betId) {
    if (!isOnline) return showNotification('📴 Cannot cancel while offline', 'warning');
    if (!CONFIG.CANCELLATION_ENABLED) return showNotification('❌ Cancellation disabled', 'error');
    if (isBetLocked(betId)) return showNotification('⏳ Operation in progress...', 'warning');
    const bet = allBets.find(b => b.id === betId); if (!bet || bet.status !== 'active') return showNotification('❌ Cannot cancel', 'error');
    if (bet.selections?.length > 0) return showNotification('❌ Accumulators cannot be cancelled', 'error');
    if (settlementManager?.settledBetIds.has(betId)) return showNotification('❌ Being settled', 'error');
    if (bet._kickoff && new Date() > new Date(bet._kickoff)) return showNotification('❌ Match started', 'error');
    const stake = parseFloat(bet.amount || 0), fee = parseFloat((stake * CONFIG.CANCELLATION_FEE_PERCENT).toFixed(2)), refund = parseFloat((stake - fee).toFixed(2));
    if (!confirm(`Cancel this bet?\n\nStake: $${stake.toFixed(2)}\nRefund: $${refund.toFixed(2)}\nFee (${(CONFIG.CANCELLATION_FEE_PERCENT * 100).toFixed(0)}%): $${fee.toFixed(2)}`)) return;
    lockBet(betId, bet);
    try {
        const updatePayload = { status: 'cancelled', refund_amount: refund, cancelled_at: new Date().toISOString(), settlement_reason: `Cancelled – ${(CONFIG.CANCELLATION_FEE_PERCENT * 100).toFixed(0)}% fee`, updated_at: new Date().toISOString() }; if (CONFIG.CANCELLATION_FEE_PERCENT > 0) updatePayload.cancellation_fee = fee;
        const { error, data } = await supabaseClient.from('bets').update(updatePayload).eq('id', betId).eq('status', 'active').select('id');
        if (error || !data?.length) { unlockBet(betId, bet); return showNotification('❌ Cancellation failed', 'error'); }
        if (settlementManager) { settlementManager.settledBetIds.add(betId); settlementManager._saveSet('xl_settled_ids', settlementManager.settledBetIds); await settlementManager._refundAtomic(bet.user_id, bet.id, refund, 'user_cancellation'); }
        bet.status = 'cancelled'; showNotification(`✅ Refunded $${refund.toFixed(2)}`, 'success');
        await loadBalance(); updateStats(); updateCounts(); filterBets(currentFilter);
    } catch (e) { unlockBet(betId, bet); showNotification(`Error: ${e.message}`, 'error'); }
}

async function cashoutBet(betId, partialPct = 100) {
    if (!isOnline) return showNotification('📴 Cannot cash out while offline', 'warning');
    if (isBetLocked(betId)) return showNotification('⏳ Cashout in progress...', 'warning');
    const bet = allBets.find(b => b.id === betId); if (!bet || bet.status !== 'active') return showNotification('❌ Cannot cash out', 'error');
    if (bet._isCashoutProcessing) return showNotification('⏳ Processing...', 'warning');
    if (settlementManager?.settledBetIds.has(betId)) return showNotification('❌ Being settled', 'error');
    const baseStake = parseFloat(bet.amount || 0), partialAmt = parseFloat((baseStake * (partialPct / 100)).toFixed(2)), remaining = parseFloat((baseStake - partialAmt).toFixed(2));
    if (partialPct < 100 && remaining < 1) return showNotification('❌ Remaining stake < $1.00', 'error');
    const odds = parseFloat(bet.odds || 2), elapsed = bet._elapsed || 45, rm = Math.max(1, 90 - elapsed);
    let cv = partialAmt * odds * CONFIG.CASHOUT_BASE_MULTIPLIER * Math.pow(rm / 90, CONFIG.CASHOUT_TIME_DECAY) * CONFIG.CASHOUT_FEE_MULTIPLIER;
    if (CONFIG.CASHOUT_SCORE_IMPACT_ENABLED && bet._score) { const sc = bet._score; if (sc.home > sc.away && bet.bet_type === 'home') cv *= 1.3; if (sc.away > sc.home && bet.bet_type === 'away') cv *= 1.3; if (sc.home === sc.away && bet.bet_type === 'draw') cv *= 1.3; if (sc.home < sc.away && bet.bet_type === 'home') cv *= 0.7; if (sc.away < sc.home && bet.bet_type === 'away') cv *= 0.7; }
    cv = parseFloat(Math.max(partialAmt * 0.05, Math.min(partialAmt * odds * 0.95, cv)).toFixed(2)); const profit = parseFloat((cv - partialAmt).toFixed(2)), label = partialPct === 100 ? 'Full' : `${partialPct}% Partial`;
    if (!confirm(`${label} Cash Out?\n\nStake: $${partialAmt.toFixed(2)}\nYou receive: $${cv.toFixed(2)}\n${profit >= 0 ? 'Profit' : 'Loss'}: $${Math.abs(profit).toFixed(2)}`)) return;
    lockBet(betId, bet);
    try {
        if (partialPct === 100) { const { error, data } = await supabaseClient.from('bets').update({ status: 'cashed-out', cashout_amount: cv, cashed_out_at: new Date().toISOString(), settlement_reason: 'Cashed out 100%', updated_at: new Date().toISOString() }).eq('id', betId).eq('status', 'active').select('id'); if (error || !data?.length) { unlockBet(betId, bet); return showNotification('❌ Cashout failed', 'error'); } if (settlementManager) { settlementManager.settledBetIds.add(betId); settlementManager._saveSet('xl_settled_ids', settlementManager.settledBetIds); } bet.status = 'cashed-out'; bet.cashout_amount = cv; }
        else { let history = bet.partial_history || []; history.push({ timestamp: new Date().toISOString(), percentage: partialPct, cashed_out_val: cv, stake_before: baseStake, stake_after: remaining }); const { error } = await supabaseClient.from('bets').update({ amount: remaining, partial_history: history, updated_at: new Date().toISOString() }).eq('id', betId).eq('status', 'active'); if (error) { unlockBet(betId, bet); return showNotification('❌ Partial cashout failed', 'error'); } bet.amount = remaining; bet.partial_history = history; }
        if (settlementManager) { const ok = await settlementManager._payoutWithRetry(bet.user_id, bet.id, cv, profit, { type: 'cashout', percentage: partialPct }); if (!ok) showNotification('⚠️ Payout delayed — will retry', 'warning'); }
        showNotification(`✅ ${label} cashout: $${cv.toFixed(2)}`, 'success'); await loadBalance(); updateStats(); updateCounts(); filterBets(currentFilter);
    } catch (e) { unlockBet(betId, bet); showNotification(`Error: ${e.message}`, 'error'); }

lt({ bet_type: s.betType || s.bet_type }, m); badge = lr?.won ? '<span style="color:var(--success);">✅ WON</span>' : lr?.refund ? '<span style="color:var(--orange);">↩️ REFUND</span>' : '<span style="color:var(--danger);">❌ LOST</span>'; scoreStr = `(${m.goals_home || 0}-${m.goals_away || 0})`; } else if (['live', '1h', '2h', 'ht'].includes(mst)) { badge = `<span style="color:var(--orange);">🔴 LIVE ${m.elapsed || ''}'</span>`; scoreStr = `(${m.goals_home || 0}-${m.goals_away || 0})`; } } return `<div class="selection-item"><span class="selection-match">[${i + 1}] ${escapeHtml(s.matchName || 'Match')} ${scoreStr}</span><span class="selection-pick">${escapeHtml(formatBetTypeName(s.betType || s.bet_type))}</span><span class="selection-odds">@${parseFloat(s.odds || 1).toFixed(2)}</span> ${badge}</div>`; }).join('')}</div>`; let actionsHTML = ''; if (isActive) { actionsHTML = '<div class="bet-actions"><div class="bet-action-row-buttons">'; if (canCancel && !isProcessing && isOnline) actionsHTML += '<button class="cancel-btn" data-action="cancel"><i class="fas fa-ban"></i> Cancel</button>'; if (canCashout && !isProcessing && isOnline) actionsHTML += '<button class="cashout-btn" data-action="cashout"><i class="fas fa-money-bill-wave"></i> Cash Out</button>'; if (isProcessing) actionsHTML += '<button disabled style="background:var(--bg-tertiary);color:var(--text-secondary);"><i class="fas fa-spinner fa-spin"></i> Processing...</button>'; if (!isOnline && isActive) actionsHTML += '<button disabled style="background:var(--bg-tertiary);color:var(--text-secondary);"><i class="fas fa-wifi"></i> Offline</button>'; actionsHTML += '</div></div>'; } let settlementInfoHTML = ''; if (!isActive && bet.settled_at) { const settledBy = bet.settled_by || 'auto', settledLabel = settledBy === 'admin' ? '👤 Admin' : '🤖 Auto-Settlement', settledClass = settledBy === 'admin' ? 'admin' : 'auto'; settlementInfoHTML = `<div class="settlement-info-bar ${settledClass}"><i class="fas ${settledBy === ' function showDetails(betId) { const bet = allBets.find(b => b.id === betId); if (!bet) return; openModalBetId = betId; const modal = document.getElementById('bet-modal'), body = document.getElementById('modal-body'); const ticketNum = 'XL' + (bet.id?.slice(-8) || '').toUpperCase(), amount = parseFloat(bet.amount || 0), odds = parseFloat(bet.odds || 2), payout = parseFloat(bet.payout || bet.potential_win || 0); let profit = 0; if (bet.status === 'won') profit = payout - amount; else if (bet.status === 'lost') profit = -amount; else if (bet.status === 'cashed-out') profit = parseFloat(bet.cashout_amount || 0) - amount; const isAcc = bet.bet_type === 'accumulator' || (bet.selections?.length > 0), settledBy = bet.settled_by === 'admin' ? '👤 Admin' : bet.settled_by === 'auto' ? '🤖 Auto-Settlement' : 'N/A'; let selectionsHTML = ''; if (isAcc && bet.selections?.length) selectionsHTML = `<div class="modal-section"><h4><i class="fas fa-list-ol"></i> Selections (${bet.selections.length})</h4>${bet.selections.map((s, i) => `<div class="modal-row"><span class="lbl">Leg ${i + 1}</span><span>${escapeHtml(s.matchName || 'Match')} — ${escapeHtml(formatBetTypeName(s.betType || s.bet_type))} @${parseFloat(s.odds || 1).toFixed(2)}</span></div>`).join('')}</div>`; body.innerHTML = `<div class="modal-section"><h4><i class="fas fa-ticket-alt"></i> Ticket #${ticketNum}</h4><div class="modal-row"><span class="lbl">Status</span><span>${bet.status?.toUpperCase()}</span></div><div class="modal-row"><span class="lbl">Type</span><span>${isAcc ? `Accumulator (${bet.selections?.length || 0} legs)` : 'Single'}</span></div>${!isAcc ? `<div class="modal-row"><span class="lbl">Match</span><span>${escapeHtml(bet.match_name || 'N/A')}</span></div><div class="modal-row"><span class="lbl">Score</span><span style="font-family:monospace;color:var(--orange);">${bet._score ? `${bet._score.home}-${bet._score.away}` : 'N/A'}</span></div><div class="modal-row"><span class="lbl">League</span><span>${escapeHtml(bet._league || 'N/A')}</span></div>` : ''}<div class="modal-row"><span class="lbl">Placed</span><span>${formatFullDateTime(bet.placed_at)}</span></div>${bet.settled_at ? `<div class="modal-row"><span class="lbl">Settled</span><span>${formatFullDateTime(bet.settled_at)}</span></div><div class="modal-row"><span class="lbl">Settled By</span><span>${settledBy}</span></div>` : ''}</div>${selectionsHTML}<div class="modal-section"><h4><i class="fas fa-chart-line"></i> Financial</h4><div class="modal-row"><span class="lbl">Stake</span><span>$${amount.toFixed(2)}</span></div><div class="modal-row"><span class="lbl">Odds</span><span>@${odds.toFixed(2)}</span></div><div class="modal-row"><span class="lbl">Payout</span><span>$${payout.toFixed(2)}</span></div><div class="modal-row"><span class="lbl">P/L</span><span style="color:${profit >= 0 ? 'var(--success)' : 'var(--danger)'}">${profit >= 0 ? '+' : ''}$${profit.toFixed(2)}</span></div></div>${bet.settlement_reason ? `<div class="modal-section"><h4><i class="fas fa-gavel"></i> Settlement</h4><div class="modal-row"><span class="lbl">Reason</span><span>${escapeHtml(bet.settlement_reason)}</span></div></div>` : ''}`; modal.classList.add('show'); }

function startSettlementTimers() { settlementTimers.forEach(clearInterval); settlementTimers = []; const triggeredBets = new Set(); const updateAllTimers = () => { let hasNew = false; allBets.filter(b => b.status === 'active').forEach(bet => { const timerElements = document.querySelectorAll(`.timer-${bet.id}`); if (!timerElements.length) return; const matchStatus = (bet._matchStatus || '').toLowerCase(); if (['finished', 'ft', 'aet', 'pen'].includes(matchStatus)) { timerElements.forEach(el => { el.innerHTML = '<span style="color:var(--success);font-weight:700;">✅ Settling…</span>'; el.classList.remove('urgent'); }); if (!triggeredBets.has(bet.id) && !settlementManager?.settledBetIds.has(bet.id)) { triggeredBets.add(bet.id); hasNew = true; } return; } const kickoff = bet._kickoff ? new Date(bet._kickoff) : null; if (!kickoff) { timerElements.forEach(el => { el.textContent = '--:--:--'; el.classList.remove('urgent'); }); return; } const diff = new Date(kickoff.getTime() + CONFIG.SETTLEMENT_TIMEOUT_MINUTES * 60000) - new Date(); if (diff <= 0) { timerElements.forEach(el => { el.innerHTML = '<span style="color:var(--success);font-weight:700;">🔄 Settling Now…</span>'; el.classList.remove('urgent'); }); if (!triggeredBets.has(bet.id) && !settlementManager?.settledBetIds.has(bet.id)) { triggeredBets.add(bet.id); hasNew = true; } } else { const hours = Math.floor(diff / 3600000), minutes = Math.floor((diff % 3600000) / 60000), seconds = Math.floor((diff % 60000) / 1000), timeStr = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`; timerElements.forEach(el => { el.textContent = timeStr; if (hours === 0 && minutes < 5) el.classList.add('urgent'); else el.classList.remove('urgent'); }); } }); if (hasNew) scheduleImmediateSettlement(); }; updateAllTimers(); settlementTimers.push(setInterval(updateAllTimers, 1000)); }

async function forceSettleBet(bet) { if (isBetLocked(bet.id)) return; if (!settlementManager) settlementManager = new DuplicateProofSettlementManager(auth.currentUser?.uid); try { lockBet(bet.id, bet); const matchMap = bet.fixture_id ? await fetchMatchesBatch([bet.fixture_id]) : {}; const result = await settlementManager._settleSingleBet(bet, matchMap[bet.fixture_id] || null, matchMap); if (result.isOk()) { await loadBalance(); updateStats(); updateCounts(); filterBets(currentFilter); } } catch (e) { debugWarn(`Force settle failed for ${bet.id}:`, e.message); } finally { unlockBet(bet.id, bet); } }
