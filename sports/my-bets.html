const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpuYXp5YmFlYWp5eW5weW9zem15Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyNzgwMDMsImV4cCI6MjA5Mjg1NDAwM30.P_8V-_s6DQDiYekZX1yaNup48WBRaLhb3ILAkvzTDTY';

const firebaseConfig={apiKey:"AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",authDomain:"x-bet-prod-jd.firebaseapp.com",projectId:"x-bet-prod-jd",storageBucket:"x-bet-prod-jd.firebasestorage.app",messagingSenderId:"499334334535",appId:"1:499334334535:web:bebc1bf817e24d9e3c4962"};
if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);

// ============================================

class DuplicateProofSettlementManager{
    constructor(userId){
        this.userId=userId;this.isRunning=false;
        this.emergencyStop=localStorage.getItem('xl_emergency_stop')==='true';
        this.settledBetIds=this._load('xl_settled_ids');
        this.processedPayouts=this._load('xl_payout_ids');
        this.duplicateGroupIds=this._load('xl_dup_groups');
    }
    _load(k){try{const d=localStorage.getItem(`${k}_${this.userId}`);return d?new Set(JSON.parse(d)):new Set();}catch(e){return new Set();}}
    _save(k,s){try{localStorage.setItem(`${k}_${this.userId}`,JSON.stringify([...s]));}catch(e){}}

    async processBets(bets){
        if(this.emergencyStop||this.isRunning)return{processed:0,duplicates:0,errors:0};
        this.isRunning=true;let p=0,d=0,e=0;
        try{
            const pending=bets.filter(b=>b.status==='active'&&!this.settledBetIds.has(b.id));
            if(!pending.length)return{processed:0,duplicates:0,errors:0};
            const{cleanBets,duplicateCount}=await this._handleDuplicates(pending);d=duplicateCount;
            const fids=[...new Set(cleanBets.map(b=>b.fixture_id).filter(Boolean))];
            const matchMap=fids.length?await fetchMatchesBatch(fids):{};
            for(const bet of cleanBets){
                try{if(this.settledBetIds.has(bet.id))continue;
                    const match=matchMap[bet.fixture_id]||null;
                    const settled=await this._settleSingleBet(bet,match);
                    if(settled){this.settledBetIds.add(bet.id);this._save('xl_settled_ids',this.settledBetIds);p++;}
                }catch(err){console.error(err);e++;}
            }
        }catch(err){console.error(err);e++;}finally{this.isRunning=false;}
        return{processed:p,duplicates:d,errors:e};
    }

    async _handleDuplicates(bets){
        const g={};for(const b of bets){const k=this._dupKey(b);(g[k]||=[]).push(b);}
        const clean=[];let dc=0;
        for(const[k,grp]of Object.entries(g)){
            if(grp.length===1){clean.push(grp[0]);continue;}
            const s=grp.sort((a,b)=>new Date(a.placed_at||0)-new Date(b.placed_at||0));
            clean.push(s[0]);dc+=s.length-1;
            for(const dup of s.slice(1)){await this._cancelDup(dup,s[0].id);this.settledBetIds.add(dup.id);this.duplicateGroupIds.add(dup.id);}
            this._save('xl_settled_ids',this.settledBetIds);this._save('xl_dup_groups',this.duplicateGroupIds);
        }
        return{cleanBets:clean,duplicateCount:dc};
    }

    _dupKey(bet){
        if(bet.bet_type==='accumulator'&&Array.isArray(bet.selections)){
            const h=bet.selections.map(s=>`${s.fixtureId||s.fixture_id}_${s.betType||s.bet_type}_${s.odds}`).sort().join('|');
            return`ACC_${bet.user_id}_${bet.amount}_${bet.odds}_${h}`;
        }
        return`SGL_${bet.user_id}_${bet.fixture_id}_${bet.bet_type}_${bet.amount}_${bet.odds}`;
    }

    async _cancelDup(dup,origId){
        const stake=parseFloat(dup.amount||0);
        try{
            const{error,data}=await supabaseClient.from('bets').update({status:'cancelled',settlement_reason:`DUPLICATE - Original: ${origId}`,is_duplicate:true,duplicate_of:origId,refund_amount:stake,cancelled_at:new Date().toISOString(),updated_at:new Date().toISOString()}).eq('id',dup.id).eq('status','active').select('id');
            if(error||!data?.length)return false;
            if(stake>0)await this._refund(dup.user_id,dup.id,stake,'duplicate_cancellation');
            dup.status='cancelled';showNotification(`🔄 Duplicate refunded: $${stake.toFixed(2)}`,'warning');return true;
        }catch(e){return false;}
    }

    async _settleSingleBet(bet,match){
        // Determine if this is truly an accumulator or a single bet
        const hasSelections = bet.bet_type === 'accumulator' || (bet.selections && Array.isArray(bet.selections) && bet.selections.length > 0);
        if(hasSelections && bet.selections && bet.selections.length > 0)return await this._settleAccumulator(bet);
        if(!match)return false;
        const st=(match.status||'').toUpperCase();
        if(!['FINISHED','FT','AET','PEN'].includes(st))return false;
        const result=this._determineResult(bet,match);if(!result)return false;
        const stake=parseFloat(bet.amount||0),odds=parseFloat(bet.odds||1);
        let ns,pa,pr;
        if(result.refund){ns='cancelled';pa=stake;pr=0;}else if(result.won){ns='won';pa=stake*odds;pr=pa-stake;}else{ns='lost';pa=0;pr=-stake;}
        const{error,data}=await supabaseClient.from('bets').update({status:ns,payout:pa,profit_loss:pr,settlement_reason:result.reason,settled_at:new Date().toISOString(),match_score:`${match.goals_home||0}-${match.goals_away||0}`,updated_at:new Date().toISOString()}).eq('id',bet.id).eq('status','active').is('settled_at',null).select('id');
        if(error||!data?.length){console.warn(`⚠️ ${bet.id} already settled`);return false;}
        if(pa>0)await this._payout(bet.user_id,bet.id,pa,pr,{stake,odds,reason:result.reason});
        bet.status=ns;bet.payout=pa;bet.profit_loss=pr;bet.settlement_reason=result.reason;bet.settled_at=new Date().toISOString();
        const nm=escapeHtml(bet.match_name||'Match');
        if(ns==='won')showNotification(`🏆 WON: ${nm} — +$${pr.toFixed(2)}`,'success');
        else if(ns==='lost')showNotification(`❌ LOST: ${nm} — $${stake.toFixed(2)}`,'error');
        else if(ns==='cancelled')showNotification(`↩️ REFUNDED: ${nm} — $${stake.toFixed(2)}`,'info');
        return true;
    }

    async _settleAccumulator(bet){
        if(!bet.selections||!Array.isArray(bet.selections)||!bet.selections.length)return false;
        const fids=bet.selections.map(s=>s.fixtureId||s.fixture_id).filter(Boolean);
        if(!fids.length)return false;
        const matchMap=await fetchMatchesBatch(fids);
        const finished=['FINISHED','FT','AET','PEN'];
        const results=[];
        for(const sel of bet.selections){
            const m=matchMap[sel.fixtureId||sel.fixture_id];
            if(!m||!finished.includes((m.status||'').toUpperCase()))return false;
            const r=this._determineResult({bet_type:sel.betType||sel.bet_type},m);
            if(!r)return false;
            results.push(r);
        }
        const anyLost=results.some(r=>r.won===false&&!r.refund);
        const allWon=results.every(r=>r.won===true);
        const hasRefund=results.some(r=>r.refund);
        const stake=parseFloat(bet.amount||0),odds=parseFloat(bet.odds||1);
        let ns,pa,pr,reason;
        if(anyLost){ns='lost';pa=0;pr=-stake;reason='One or more legs lost';}
        else if(hasRefund){ns='cancelled';pa=stake;pr=0;reason='Leg(s) refunded';}
        else if(allWon){ns='won';pa=stake*odds;pr=pa-stake;reason='All legs won!';}
        else return false;
        const{error,data}=await supabaseClient.from('bets').update({status:ns,payout:pa,profit_loss:pr,settlement_reason:reason,settled_at:new Date().toISOString(),updated_at:new Date().toISOString()}).eq('id',bet.id).eq('status','active').is('settled_at',null).select('id');
        if(error||!data?.length)return false;
        if(pa>0)await this._payout(bet.user_id,bet.id,pa,pr,{stake,odds,reason});
        bet.status=ns;bet.payout=pa;bet.profit_loss=pr;bet.settlement_reason=reason;bet.settled_at=new Date().toISOString();
        return true;
    }

    _determineResult(bet,match){
        const hg=parseInt(match.goals_home||0),ag=parseInt(match.goals_away||0),tg=hg+ag;
        const map={
            home:{won:hg>ag,reason:`${hg}-${ag} (Home Win)`},away:{won:ag>hg,reason:`${hg}-${ag} (Away Win)`},
            draw:{won:hg===ag,reason:`${hg}-${ag} (Draw)`},'1X':{won:hg>=ag,reason:`${hg}-${ag} (1X)`},
            '12':{won:hg!==ag,reason:`${hg}-${ag} (12)`},X2:{won:ag>=hg,reason:`${hg}-${ag} (X2)`},
            over05:{won:tg>0.5,reason:`${hg}-${ag} (Over 0.5)`},under05:{won:tg<0.5,reason:`${hg}-${ag} (Under 0.5)`},
            over15:{won:tg>1.5,reason:`${hg}-${ag} (Over 1.5)`},under15:{won:tg<1.5,reason:`${hg}-${ag} (Under 1.5)`},
            over25:{won:tg>2.5,reason:`${hg}-${ag} (Over 2.5)`},under25:{won:tg<2.5,reason:`${hg}-${ag} (Under 2.5)`},
            over35:{won:tg>3.5,reason:`${hg}-${ag} (Over 3.5)`},under35:{won:tg<3.5,reason:`${hg}-${ag} (Under 3.5)`},
            btts_yes:{won:hg>0&&ag>0,reason:`${hg}-${ag} (BTTS Yes)`},btts_no:{won:!(hg>0&&ag>0),reason:`${hg}-${ag} (BTTS No)`},
            home_dnb:hg===ag?{refund:true,reason:`${hg}-${ag} (DNB Refund)`}:{won:hg>ag,reason:`${hg}-${ag} (Home DNB)`},
            away_dnb:hg===ag?{refund:true,reason:`${hg}-${ag} (DNB Refund)`}:{won:ag>hg,reason:`${hg}-${ag} (Away DNB)`}
        };
        return map[bet.bet_type]||null;
    }

    async _payout(userId,betId,total,profit,meta){
        if(this.processedPayouts.has(betId))return;
        try{
            const wr=db.collection('wallets').doc(userId),lr=db.collection('payout_logs').doc(betId);
            await db.runTransaction(async(txn)=>{
                const lock=await txn.get(lr);if(lock.exists)throw new Error('DUPLICATE');
                const w=await txn.get(wr),before=w.exists?(w.data().balance||0):0,after=parseFloat((before+total).toFixed(2));
                txn.set(lr,{user_id:userId,bet_id:betId,amount:total,profit,type:'settlement_payout',balance_before:before,balance_after:after,timestamp:firebase.firestore.FieldValue.serverTimestamp(),metadata:meta});
                txn.update(wr,{balance:after,updated_at:new Date().toISOString()});
                txn.set(db.collection('transactions').doc(),{user_id:userId,bet_id:betId,amount:total,profit,type:'settlement_payout',balance_before:before,balance_after:after,timestamp:firebase.firestore.FieldValue.serverTimestamp()});
            });
            this.processedPayouts.add(betId);this._save('xl_payout_ids',this.processedPayouts);
        }catch(e){if(e.message==='DUPLICATE'){this.processedPayouts.add(betId);this._save('xl_payout_ids',this.processedPayouts);}}
    }

    async _refund(userId,betId,amount,reason){
        const key=`refund_${betId}`;if(this.processedPayouts.has(key))return;
        try{
            const wr=db.collection('wallets').doc(userId),lr=db.collection('refund_logs').doc(betId);
            await db.runTransaction(async(txn)=>{
                const lock=await txn.get(lr);if(lock.exists)throw new Error('DUPLICATE');
                const w=await txn.get(wr),before=w.exists?(w.data().balance||0):0,after=parseFloat((before+amount).toFixed(2));
                txn.set(lr,{user_id:userId,bet_id:betId,amount,type:'refund',reason,balance_before:before,balance_after:after,timestamp:firebase.firestore.FieldValue.serverTimestamp()});
                txn.update(wr,{balance:after,updated_at:new Date().toISOString()});
            });
            this.processedPayouts.add(key);this._save('xl_payout_ids',this.processedPayouts);
        }catch(e){if(e.message==='DUPLICATE'){this.processedPayouts.add(key);this._save('xl_payout_ids',this.processedPayouts);}}
    }
}

function safeParseJSON(v){if(!v)return null;if(typeof v==='object')return v;try{return JSON.parse(v);}catch(e){return null;}}
function extractTeamName(d,fb){if(!d)return fb||'Team';if(typeof d==='string'){const p=safeParseJSON(d);if(p?.name&&p.name!=='Home'&&p.name!=='Away')return p.name;if(d.trim()&&d!=='Home'&&d!=='Away')return d.trim();return fb||'Team';}if(typeof d==='object'&&d.name&&d.name!=='Home'&&d.name!=='Away')return d.name;return fb||'Team';}
function extractTeamLogo(d){if(!d)return'';if(typeof d==='string'){const p=safeParseJSON(d);if(p?.logo)return p.logo;}if(typeof d==='object'&&d.logo)return d.logo;return'';}
function extractScore(d){if(!d)return{home:0,away:0};if(typeof d==='object')return{home:d.home||0,away:d.away||0};const p=safeParseJSON(d);return p?{home:p.home||0,away:p.away||0}:{home:0,away:0};}

// ============================================
// MATCH DATA FETCHING (FIXED 404 HANDLING)
// ============================================
async function fetchMatchFromAPI(fid){
    try{
        const controller=new AbortController();
        const timeout=setTimeout(()=>controller.abort(),8000);
        const r=await fetch(`${API_BASE}/api/fixture/${fid}`,{signal:controller.signal});
        clearTimeout(timeout);
        if(!r.ok)return null;
        const d=await r.json();
        if(d.success&&d.fixture){
            const f=d.fixture;
            return{fixture_id:fid,status:f.fixture?.status?.short||'NS',elapsed:f.fixture?.status?.elapsed||0,goals_home:f.goals?.home||0,goals_away:f.goals?.away||0,start_time:f.fixture?.date||'',league_name:f.league?.name||'',home_team:{name:extractTeamName(f.teams?.home,'Home'),logo:f.teams?.home?.logo||''},away_team:{name:extractTeamName(f.teams?.away,'Away'),logo:f.teams?.away?.logo||''}};
        }
        return null;
    }catch(e){return null;}
}

async function fetchMatchesBatch(fids){
    if(!fids?.length)return{};
    const result={};
    // Step 1: Supabase cache
    try{
        const{data,error}=await supabaseClient.from('sports_matches').select('*').in('fixture_id',fids);
        if(!error&&data?.length){
            for(const row of data){
                const sc=extractScore(row.score);
                const hn=extractTeamName(row.home_team,'Home');
                const an=extractTeamName(row.away_team,'Away');
                result[row.fixture_id]={fixture_id:row.fixture_id,status:row.status||'NS',elapsed:row.elapsed||0,goals_home:sc.home,goals_away:sc.away,start_time:row.start_time||'',league_name:row.league_name||'',home_team:{name:hn,logo:extractTeamLogo(row.home_team)||`https://ui-avatars.com/api/?name=${encodeURIComponent(hn)}&size=32&background=1a2332&color=00ff9d`},away_team:{name:an,logo:extractTeamLogo(row.away_team)||`https://ui-avatars.com/api/?name=${encodeURIComponent(an)}&size=32&background=1a2332&color=ff9800`}};
            }
        }
    }catch(e){console.warn('Supabase fetch:',e.message);}
    
    // Step 2: API for missing — with error suppression
    const missing=fids.filter(f=>!result[f]);
    if(missing.length){
        const apiResults=await Promise.allSettled(missing.map(fid=>fetchMatchFromAPI(fid)));
        apiResults.forEach((res,i)=>{
            if(res.status==='fulfilled'&&res.value)result[missing[i]]=res.value;
        });
    }
    return result;
}

function showNotification(msg,type='info'){

async function loadBalance(){try{const u=auth.currentUser;if(!u)return 0;const d=await db.collection('wallets').doc(u.uid).get();const b=d.exists?(d.data().balance||0):1000;const el=document.getElementById('balance-display');if(el)el.textContent=`$${b.toFixed(2)}`;return b;}catch(e){return 0;}}

async function loadBets(){
    const u=auth.currentUser;if(!u)return;
    const statusEl=document.getElementById('loading-status');
    try{
        if(statusEl)statusEl.textContent='Connecting...';
        const{data,error}=await supabaseClient.from('bets').select('*').eq('user_id',u.uid).order('placed_at',{ascending:false});
        if(error)throw new Error(`Database: ${error.message||JSON.stringify(error)}`);
        const liveBets=data||[];
        if(statusEl)statusEl.textContent=`Loading ${liveBets.length} bets...`;
        
        // Collect all fixture IDs including acca legs
        const allFids=new Set();
        for(const b of liveBets){
            if(b.fixture_id)allFids.add(b.fixture_id);
            // Parse selections to extract fixture IDs for accumulators
            let sels=b.selections;
            if(typeof sels==='string')sels=safeParseJSON(sels);
            if(Array.isArray(sels)){b.selections=sels;sels.forEach(s=>{const fid=s.fixtureId||s.fixture_id;if(fid)allFids.add(fid);});}
        }
        
        const uniqueFids=[...allFids];
        const matchMap=uniqueFids.length?await fetchMatchesBatch(uniqueFids):{};
        
        for(let b of liveBets){
            // Parse selections properly
            if(b.selections&&typeof b.selections==='string')b.selections=safeParseJSON(b.selections)||[];
            
            // Determine if this is actually an accumulator (has multiple selections)
            const hasMultiSelections=Array.isArray(b.selections)&&b.selections.length>0;
            if(hasMultiSelections&&b.bet_type!=='accumulator')b.bet_type='accumulator';
            if(!hasMultiSelections&&b.bet_type==='accumulator')b.bet_type='home'; // fallback for mislabeled
            
            // Enrich acca selections with match data
            if(hasMultiSelections){
                b.selections.forEach(s=>{
                    const fid=s.fixtureId||s.fixture_id;
                    if(fid&&matchMap[fid])s._match=matchMap[fid];
                    // Ensure selection has match name
                    if(!s.matchName&&s._match){
                        s.matchName=`${s._match.home_team?.name||'Home'} vs ${s._match.away_team?.name||'Away'}`;
                    }
                });
            }
            
            // Set team names from match data OR match_name field
            let hFb='Home',aFb='Away';
            if(b.match_name&&b.match_name.includes(' vs ')){
                const parts=b.match_name.split(' vs ');
                if(parts[0]?.trim())hFb=parts[0].trim();
                if(parts[1]?.trim())aFb=parts[1].trim();
            }
            // Override from match data if available
            if(b.fixture_id&&matchMap[b.fixture_id]){
                const m=matchMap[b.fixture_id];
                const hn=m.home_team?.name&&m.home_team.name!=='Home'?m.home_team.name:hFb;
                const an=m.away_team?.name&&m.away_team.name!=='Away'?m.away_team.name:aFb;
                b.match_name=`${hn} vs ${an}`;
                b._homeTeam={name:hn,logo:m.home_team?.logo||`https://ui-avatars.com/api/?name=${encodeURIComponent(hn)}&size=32&background=1a2332&color=00ff9d`};
                b._awayTeam={name:an,logo:m.away_team?.logo||`https://ui-avatars.com/api/?name=${encodeURIComponent(an)}&size=32&background=1a2332&color=ff9800`};
                b._league=m.league_name||'';
                b._kickoff=m.start_time||b.placed_at;
                b._matchStatus=m.status||'NS';
                b._elapsed=m.elapsed||0;
                b._score={home:m.goals_home||0,away:m.goals_away||0};
                b._match=m;
            }else{
                // No match data — use extracted names
                b._homeTeam={name:hFb,logo:`https://ui-avatars.com/api/?name=${encodeURIComponent(hFb)}&size=32&background=1a2332&color=00ff9d`};
                b._awayTeam={name:aFb,logo:`https://ui-avatars.com/api/?name=${encodeURIComponent(aFb)}&size=32&background=1a2332&color=ff9800`};
                b._score={home:0,away:0};
                b._league=b.league_name||'Sports Match';
                b._kickoff=b.placed_at||b.kickoff_time||null;
                b._matchStatus=b.match_status||'NS';
                b._elapsed=b.match_elapsed||0;
                b._match=null;
            }
            b._isPreMatch=b.placed_at&&b._kickoff?new Date(b.placed_at)<new Date(b._kickoff):true;
        }
        
        allBets=liveBets;
        document.getElementById('loading').style.display='none';
        document.getElementById('content').style.display='block';
        updateStats();updateCounts();filterBets(currentFilter);startSettlementTimers();
        await autoSettleBets();
    }catch(e){
        console.error('Load error:',e);
        document.getElementById('loading').style.display='none';
        document.getElementById('content').style.display='block';
        const c=document.getElementById('bet-list-container');
        if(c)c.innerHTML=`<div class="empty-state"><i class="fas fa-exclamation-triangle" style="color:var(--danger);"></i><p>Failed to load bets</p><p style="font-size:11px;">${escapeHtml(e.message)}</p><button class="btn-action-tool" onclick="loadBets()" style="margin-top:15px;"><i class="fas fa-redo"></i> Retry</button></div>`;
    }
}

async function autoSettleBets(){
    const u=auth.currentUser;if(!u)return;
    if(!settlementManager)settlementManager=new DuplicateProofSettlementManager(u.uid);
    if(settlementManager.emergencyStop)return;
    const active=allBets.filter(b=>b.status==='active'&&!settlementManager.settledBetIds.has(b.id));
    if(!active.length)return;
    const r=await settlementManager.processBets(active);
    if(r.processed>0||r.duplicates>0){await loadBalance();updateStats();updateCounts();filterBets(currentFilter);}
}

// ============================================
async function cancelBet(betId){
    const bet=allBets.find(b=>b.id===betId);
    if(!bet||bet.status!=='active'){showNotification('❌ Cannot cancel','error');return;}
    if(bet.bet_type==='accumulator'||(bet.selections&&Array.isArray(bet.selections)&&bet.selections.length>0)){showNotification('❌ Accumulators cannot be cancelled','error');return;}
    if(settlementManager?.settledBetIds.has(betId))return;
    if(bet._kickoff&&new Date()>new Date(bet._kickoff)){showNotification('❌ Match started','error');return;}
    const stake=parseFloat(bet.amount||0),feePct=5,refund=parseFloat((stake*(1-feePct/100)).toFixed(2));
    if(!confirm(`Cancel?\n\nStake: $${stake.toFixed(2)}\nRefund: $${refund.toFixed(2)}\nFee (${feePct}%): $${(stake-refund).toFixed(2)}`))return;
    try{
        const{error,data}=await supabaseClient.from('bets').update({status:'cancelled',cancellation_fee:stake-refund,refund_amount:refund,cancelled_at:new Date().toISOString(),settlement_reason:`Cancelled – ${feePct}% fee`,updated_at:new Date().toISOString()}).eq('id',betId).eq('status','active').select('id');
        if(error||!data?.length){showNotification('❌ Cancel failed','error');return;}
        settlementManager.settledBetIds.add(betId);settlementManager._save('xl_settled_ids',settlementManager.settledBetIds);
        await settlementManager._refund(bet.user_id,bet.id,refund,'user_cancellation');
        bet.status='cancelled';showNotification(`✅ Refunded: $${refund.toFixed(2)}`,'success');
        await loadBalance();updateStats();updateCounts();filterBets(currentFilter);
    }catch(e){showNotification(`Error: ${e.message}`,'error');}
}

async function cashoutBet(betId,partialPct=100){
    const bet=allBets.find(b=>b.id===betId);
    if(!bet||bet.status!=='active'){showNotification('❌ Cannot cash out','error');return;}
    if(settlementManager?.settledBetIds.has(betId))return;
    const baseStake=parseFloat(bet.amount||0),partialAmt=parseFloat((baseStake*(partialPct/100)).toFixed(2)),remainingStake=parseFloat((baseStake-partialAmt).toFixed(2));
    if(partialPct<100&&remainingStake<1){showNotification('❌ Remaining stake < $1.00','error');return;}
    const odds=parseFloat(bet.odds||2),elapsed=bet._elapsed||45,rm=Math.max(1,90-elapsed);
    let cv=partialAmt*odds*0.45*Math.pow(rm/90,0.7)*0.95;
    cv=parseFloat(Math.max(partialAmt*0.05,Math.min(partialAmt*odds*0.95,cv)).toFixed(2));
    const profit=parseFloat((cv-partialAmt).toFixed(2)),label=partialPct===100?'Full':`${partialPct}% Partial`;
    if(!confirm(`${label} Cash Out?\n\nStake: $${partialAmt.toFixed(2)}\nReceived: $${cv.toFixed(2)}\n${profit>=0?'Profit':'Loss'}: $${Math.abs(profit).toFixed(2)}`))return;
    try{
        if(partialPct===100){
            const{error,data}=await supabaseClient.from('bets').update({status:'cashed-out',cashout_amount:cv,cashed_out_at:new Date().toISOString(),settlement_reason:'Cashed out 100%',updated_at:new Date().toISOString()}).eq('id',betId).eq('status','active').select('id');
            if(error||!data?.length){showNotification('❌ Cashout failed','error');return;}
            settlementManager.settledBetIds.add(betId);settlementManager._save('xl_settled_ids',settlementManager.settledBetIds);
            bet.status='cashed-out';bet.cashout_amount=cv;
        }else{
            let hist=bet.partial_history||[];hist.push({timestamp:new Date().toISOString(),percentage:partialPct,cashed_out_val:cv,stake_before:baseStake,stake_after:remainingStake});
            const{error}=await supabaseClient.from('bets').update({amount:remainingStake,partial_history:hist,updated_at:new Date().toISOString()}).eq('id',betId).eq('status','active');
            if(error){showNotification('❌ Partial cashout failed','error');return;}
            bet.amount=remainingStake;bet.partial_history=hist;
        }
        await settlementManager._payout(bet.user_id,bet.id,cv,profit,{type:'partial_cashout',percentage:partialPct});
        showNotification(`✅ ${label} cashout: $${cv.toFixed(2)}`,'success');
        await loadBalance();updateStats();updateCounts();filterBets(currentFilter);
    }catch(e){showNotification(`Error: ${e.message}`,'error');}
}

// ============================================
// UI
// ============================================
function updateStats(){
    const t=allBets.length,w=allBets.filter(b=>b.status==='won'),l=allBets.filter(b=>b.status==='lost'),a=allBets.filter(b=>b.status==='active');
    let wa=0,la=0,np=0;
    w.forEach(b=>{const p=parseFloat(b.payout||0);wa+=p;np+=p-parseFloat(b.amount||0);});
    l.forEach(b=>{const s=parseFloat(b.amount||0);la+=s;np-=s;});
    allBets.filter(b=>b.status==='cashed-out').forEach(b=>{np+=parseFloat(b.cashout_amount||0)-parseFloat(b.amount||0);});
    const wr=(w.length+l.length)>0?((w.length/(w.length+l.length))*100).toFixed(1):0;
    document.getElementById('total-bets').textContent=t;document.getElementById('total-won').textContent=w.length;
    document.getElementById('total-lost').textContent=l.length;document.getElementById('total-active').textContent=a.length;
    document.getElementById('won-amount').textContent=`$${wa.toFixed(2)}`;document.getElementById('lost-amount').textContent=`$${la.toFixed(2)}`;
    document.getElementById('win-rate-display').textContent=`${wr}%`;document.getElementById('win-rate-fill').style.width=`${wr}%`;
    const pe=document.getElementById('total-pl');pe.textContent=(np>=0?'+':'')+'$'+np.toFixed(2);pe.style.color=np>=0?'#4caf50':'var(--danger)';
}

function updateCounts(){
    const c={all:allBets.length,active:allBets.filter(b=>b.status==='active').length,won:allBets.filter(b=>b.status==='won').length,lost:allBets.filter(b=>b.status==='lost').length,cancelled:allBets.filter(b=>b.status==='cancelled').length,'cashed-out':allBets.filter(b=>b.status==='cashed-out').length};
    for(const[k,v]of Object.entries(c)){const el=document.getElementById(`cnt-${k}`);if(el)el.textContent=v;}
}

function filterBets(filter){
    currentFilter=filter;let fl=[...allBets];if(filter!=='all')fl=fl.filter(b=>b.status===filter);
    const sv=document.getElementById('bet-search-input')?.value?.toLowerCase().trim();
    if(sv)fl=fl.filter(b=>{const mn=(b.match_name||'').toLowerCase(),lg=(b._league||'').toLowerCase(),tk=('XL'+(b.id?.slice(-8)||'')).toLowerCase();return mn.includes(sv)||lg.includes(sv)||tk.includes(sv);});
    fl.sort((a,b)=>{
        if(a.status==='active'&&b.status!=='active')return-1;if(a.status!=='active'&&b.status==='active')return 1;
        if(a.status==='active'){const ka=a._kickoff?new Date(a._kickoff).getTime():Infinity,kb=b._kickoff?new Date(b._kickoff).getTime():Infinity;return ka-kb;}
        return new Date(b.settled_at||b.cashed_out_at||b.placed_at||0).getTime()-new Date(a.settled_at||a.cashed_out_at||a.placed_at||0).getTime();
    });
    const c=document.getElementById('bet-list-container');
    if(c)c.innerHTML=fl.length?fl.map(b=>createBetCard(b)).join(''):'<div class="empty-state"><i class="fas fa-ticket-alt"></i><p>No bets found</p></div>';
    startSettlementTimers();
}

function createBetCard(bet){
    const amt=parseFloat(bet.amount||0),odds=parseFloat(bet.odds||2),payout=parseFloat(bet.payout||bet.potential_win||0);
    const profit=bet.status==='won'?(payout-amt):bet.status==='lost'?-amt:bet.status==='cashed-out'?(parseFloat(bet.cashout_amount||0)-amt):0;
    const tk='XL'+(bet.id?.slice(-8)||'').toUpperCase(),isActive=bet.status==='active';
    const hasSelections=bet.selections&&Array.isArray(bet.selections)&&bet.selections.length>0;
    const isAcc=bet.bet_type==='accumulator'||hasSelections;
    const ms=(bet._matchStatus||'').toLowerCase(),isLive=['live','1h','2h','ht'].includes(ms);
    const matchStarted=isLive||['finished','ft','aet','pen'].includes(ms);
    const isPreMatch=bet._isPreMatch!==undefined?bet._isPreMatch:true;
    const isHalftime=ms==='ht';
    const canCancel=isActive&&!isAcc&&!matchStarted&&!(settlementManager?.settledBetIds.has(bet.id));
    const canCashout=isActive&&matchStarted&&isPreMatch&&!isHalftime&&isLive&&!(settlementManager?.settledBetIds.has(bet.id));
    
    const ht=bet._homeTeam||{name:'Home',logo:''},at=bet._awayTeam||{name:'Away',logo:''};
    const hl=ht.logo||`https://ui-avatars.com/api/?name=${encodeURIComponent((ht.name||'H').substring(0,2))}&size=36&background=1a2332&color=00ff9d`;
    const al=at.logo||`https://ui-avatars.com/api/?name=${encodeURIComponent((at.name||'A').substring(0,2))}&size=36&background=1a2332&color=ff9800`;
    const sd=bet._score?`<span class="bet-score-display${isLive?' live':''}">${bet._score.home} - ${bet._score.away}</span>`:'';
    const sc=bet.status==='won'?'won':bet.status==='lost'?'lost':bet.status==='cancelled'?'cancelled':bet.status==='cashed-out'?'cashed-out':'active';
    
    // Cashout preview
    let coHTML='';
    if(canCashout&&!isAcc){
        const elapsed=bet._elapsed||45,rm=Math.max(1,90-elapsed);
        let cv=amt*odds*0.45*Math.pow(rm/90,0.7)*0.95;
        cv=Math.max(amt*0.05,Math.min(amt*odds*0.95,cv));
        coHTML=`<div class="cashout-preview"><div class="cashout-metrics"><span>Est. Cash Out: <strong>$${cv.toFixed(2)}</strong></span><span>Profit: <span style="color:${cv>=amt?'#4caf50':'var(--danger)'}">${cv>=amt?'+':''}$${(cv-amt).toFixed(2)}</span></span></div><div class="partial-cashout-box"><span>Stake: <strong id="pct-val-${bet.id}">100%</strong></span><input type="range" class="partial-slider" min="10" max="100" step="10" value="100" oninput="document.getElementById('pct-val-${bet.id}').textContent=this.value+'%'" id="slider-${bet.id}"></div></div>`;
    }else if(isActive&&isHalftime&&!isAcc){
        coHTML='<div class="cashout-preview" style="border-color:var(--orange);"><div style="color:var(--orange);font-weight:bold;">⏸️ Cash Out suspended</div></div>';
    }
    
    // Acca selections display
    let accaHTML='';
    if(isAcc&&hasSelections){
        accaHTML=`<div class="selections-container"><div style="font-size:11px;font-weight:bold;color:var(--accent);margin-bottom:8px;"><i class="fas fa-list-ol"></i> Accumulator (${bet.selections.length} legs)</div>${bet.selections.map((s,i)=>{const m=s._match;let badge='<span style="color:var(--text-secondary);">⏳ Pending</span>',scoreStr='';if(m){const mst=(m.status||'').toLowerCase();if(['finished','ft','aet','pen'].includes(mst)){const lr=settlementManager?._determineResult?.({bet_type:s.betType||s.bet_type},m);badge=lr&&lr.won?'<span style="color:var(--success);">✅ WON</span>':lr?.refund?'<span style="color:var(--orange);">↩️ REFUND</span>':'<span style="color:var(--danger);">❌ LOST</span>';scoreStr=`(${m.goals_home||0}-${m.goals_away||0})`;}else if(['live','1h','2h','ht'].includes(mst)){badge=`<span style="color:var(--orange);">🔴 LIVE ${m.elapsed||''}'</span>`;scoreStr=`(${m.goals_home||0}-${m.goals_away||0})`;}}return`<div class="selection-item"><span class="selection-match">[${i+1}] ${escapeHtml(s.matchName||'Match')} ${scoreStr}</span><span class="selection-pick">${escapeHtml(formatBetTypeName(s.betType||s.bet_type))}</span><span class="selection-odds">@${parseFloat(s.odds||1).toFixed(2)}</span> ${badge}</div>`;}).join('')}</div>`;
    }
    
    // Actions
    let acts='';
    if(isActive){
        acts='<div class="bet-actions"><div class="bet-action-row-buttons">';
        if(canCancel)acts+=`<button class="cancel-btn" onclick="event.stopPropagation();cancelBet('${bet.id}')"><i class="fas fa-ban"></i> Cancel</button>`;
        if(canCashout&&!isAcc)acts+=`<button class="cashout-btn" onclick="event.stopPropagation();cashoutBet('${bet.id}',parseInt(document.getElementById('slider-${bet.id}')?.value||100))"><i class="fas fa-money-bill-wave"></i> Cash Out</button>`;
        acts+='</div></div>';
    }
    
    const settledDisplay=bet.settled_at?`<div class="bet-result-row ${sc}"><i class="fas fa-check-circle"></i> Settled: ${formatFullDateTime(bet.settled_at)}</div>`:'';
    
    return`<div class="bet-card ${sc}" onclick="showDetails('${bet.id}')">
        <div class="bet-top"><div><span class="bet-type-tag ${isAcc?'accumulator':'single'}">${isAcc?'ACCUMULATOR':'SINGLE'}</span><span class="bet-ticket-num">#${tk}</span>${!isPreMatch&&isActive?'<span class="live-bet-badge"><i class="fas fa-bolt"></i> LIVE BET</span>':''}</div><span class="bet-status-badge ${sc}">${bet.status==='won'?'🏆 WON':bet.status==='lost'?'❌ LOST':bet.status==='cancelled'?'⛔ CANCELLED':bet.status==='cashed-out'?'💰 CASHED OUT':'⏳ ACTIVE'}</span></div>
        <div class="bet-body">
            ${isAcc?`<div class="bet-match-name"><i class="fas fa-layer-group" style="color:var(--orange);"></i> ${bet.selections?.length||0}-Fold Accumulator</div><div class="bet-league">${bet.selections?.map(s=>escapeHtml(s.matchName||'?')).join(' • ')||'Multiple Selections'}</div>`:`<div class="bet-match-row"><img class="team-logo-small" src="${hl}" onerror="this.style.display='none'" alt=""><div class="bet-match-name">${escapeHtml(ht.name)} <span style="color:var(--text-secondary);">vs</span> ${escapeHtml(at.name)}${sd}</div><img class="team-logo-small" src="${al}" onerror="this.style.display='none'" alt=""></div><div class="bet-league">${escapeHtml(bet._league||'Sports Match')}${bet._elapsed?` | ${bet._elapsed}'`:''} | ${ms.toUpperCase()}</div>`}
            <div class="bet-pick">${escapeHtml(formatBetTypeName(isAcc?'accumulator':bet.bet_type))} <span>@${odds.toFixed(2)}</span></div>
        </div>
        ${accaHTML}
        <div class="bet-meta-row"><span><i class="fas fa-calendar-plus"></i> ${formatFullDate(bet.placed_at)}</span><span><i class="fas fa-clock"></i> ${formatFullDate(bet._kickoff)}</span>${isActive?`<span><i class="fas fa-hourglass-end"></i> <span class="settlement-timer" id="timer-${bet.id}">...</span></span>`:''}</div>
        ${coHTML}
        <div class="bet-details-grid"><div class="bet-detail"><div class="lbl">Stake</div><div class="val">$${amt.toFixed(2)}</div></div><div class="bet-detail"><div class="lbl">${isActive?'Potential':'Payout'}</div><div class="val">$${payout.toFixed(2)}</div></div><div class="bet-detail"><div class="lbl">P/L</div><div class="val" style="color:${profit>=0?'#4caf50':'var(--danger)'}">${profit>=0?'+':''}$${Math.abs(profit).toFixed(2)}</div></div></div>
        ${bet.settlement_reason?`<div class="bet-result-row ${sc}"><i class="fas fa-gavel"></i> ${escapeHtml(bet.settlement_reason)}</div>`:''}
        ${settledDisplay}
        ${acts}
    </div>`;
}

function showDetails(betId){
    const bet=allBets.find(b=>b.id===betId);if(!bet)return;
    const modal=document.getElementById('bet-modal'),body=document.getElementById('modal-body');
    const tk='XL'+(bet.id?.slice(-8)||'').toUpperCase();
    const amt=parseFloat(bet.amount||0),odds=parseFloat(bet.odds||2),payout=parseFloat(bet.payout||bet.potential_win||0);
    const profit=bet.status==='won'?(payout-amt):bet.status==='lost'?-amt:bet.status==='cashed-out'?(parseFloat(bet.cashout_amount||0)-amt):0;
    const isAcc=bet.bet_type==='accumulator'||(bet.selections&&Array.isArray(bet.selections)&&bet.selections.length>0);
    
    let selHTML='';
    if(isAcc&&bet.selections?.length){
        selHTML=`<div class="modal-section"><h4><i class="fas fa-list-ol"></i> Selections (${bet.selections.length})</h4>${bet.selections.map((s,i)=>`<div class="modal-row"><span class="lbl">Leg ${i+1}</span><span>${escapeHtml(s.matchName||'Match')} — ${escapeHtml(formatBetTypeName(s.betType||s.bet_type))} @${parseFloat(s.odds||1).toFixed(2)}</span></div>`).join('')}</div>`;
    }
    
    body.innerHTML=`<div class="modal-section"><h4><i class="fas fa-ticket-alt"></i> Ticket #${tk}</h4><div class="modal-row"><span class="lbl">Status</span><span>${bet.status?.toUpperCase()}</span></div><div class="modal-row"><span class="lbl">Type</span><span>${isAcc?`Accumulator (${bet.selections?.length||0} legs)`:'Single'}</span></div>${!isAcc?`<div class="modal-row"><span class="lbl">Match</span><span>${escapeHtml(bet.match_name||'N/A')}</span></div><div class="modal-row"><span class="lbl">Score</span><span style="font-family:monospace;color:var(--orange);">${bet._score?`${bet._score.home}-${bet._score.away}`:'N/A'}</span></div><div class="modal-row"><span class="lbl">League</span><span>${escapeHtml(bet._league||'N/A')}</span></div>`:''}<div class="modal-row"><span class="lbl">Placed</span><span>${formatFullDateTime(bet.placed_at)}</span></div>${bet.settled_at?`<div class="modal-row"><span class="lbl">Settled</span><span>${formatFullDateTime(bet.settled_at)}</span></div>`:''}</div>${selHTML}<div class="modal-section"><h4><i class="fas fa-chart-line"></i> Financial</h4><div class="modal-row"><span class="lbl">Stake</span><span>$${amt.toFixed(2)}</span></div><div class="modal-row"><span class="lbl">Odds</span><span>@${odds.toFixed(2)}</span></div><div class="modal-row"><span class="lbl">Payout</span><span>$${payout.toFixed(2)}</span></div><div class="modal-row"><span class="lbl">P/L</span><span style="color:${profit>=0?'#4caf50':'var(--danger)'}">${profit>=0?'+':''}$${profit.toFixed(2)}</span></div></div>${bet.settlement_reason?`<div class="modal-section"><h4><i class="fas fa-gavel"></i> Settlement</h4><div class="modal-row"><span class="lbl">Reason</span><span>${escapeHtml(bet.settlement_reason)}</span></div></div>`:''}`;
    modal.classList.add('show');
}

function closeModal(e){if(!e||e.target===document.getElementById('bet-modal'))document.getElementById('bet-modal').classList.remove('show');}

function startSettlementTimers(){
    settlementTimers.forEach(clearInterval);settlementTimers=[];
    allBets.filter(b=>b.status==='active').forEach(bet=>{
        const el=document.getElementById(`timer-${bet.id}`);if(!el)return;
        const upd=()=>{const ko=bet._kickoff?new Date(bet._kickoff):null;if(!ko){el.textContent='TBD';return;}const sb=new Date(ko.getTime()+115*60000),d=sb-new Date();if(d<=0)el.innerHTML='<span style="color:var(--success);">Settling…</span>';else{const h=Math.floor(d/3600000),m=Math.floor((d%3600000)/60000);el.textContent=h>0?`${h}h ${m}m`:`${m}m`;if(m<10&&h===0)el.classList.add('urgent');else el.classList.remove('urgent');}};
        upd();settlementTimers.push(setInterval(upd,60000));
    });
}

// ============================================
// INIT
// ============================================
document.querySelectorAll('.filter-chip').forEach(chip=>chip.addEventListener('click',function(){document.querySelectorAll('.filter-chip').forEach(c=>c.classList.remove('active'));this.classList.add('active');filterBets(this.dataset.filter);}));
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.ctrlKey&&e.shiftKey&&e.key==='S'){e.preventDefault();emergencyStop();}if(e.ctrlKey&&e.shiftKey&&e.key==='R'){e.preventDefault();emergencyResume();}});

auth.onAuthStateChanged(async u=>{
    if(!u){window.location.href='../login.html';return;}
    if(localStorage.getItem('theme')==='light')document.body.classList.add('light-theme');
    if(localStorage.getItem('lang')==='ar'){document.body.classList.add('arabic');document.documentElement.dir='rtl';}
    await loadBalance();await loadBets();
    if(refreshInterval)clearInterval(refreshInterval);refreshInterval=setInterval(async()=>{await loadBets();await loadBalance();},30000);
    if(settleInterval)clearInterval(settleInterval);
    if(!localStorage.getItem('xl_emergency_stop'))settleInterval=setInterval(async()=>{await autoSettleBets();await loadBalance();},60000);
});

window.addEventListener('beforeunload',()=>{if(refreshInterval)clearInterval(refreshInterval);if(settleInterval)clearInterval(settleInterval);settlementTimers.forEach(clearInterval);});

window.emergencyStop=emergencyStop;window.emergencyResume=emergencyResume;window.cancelBet=cancelBet;window.cashoutBet=cashoutBet;window.showDetails=showDetails;window.closeModal=closeModal;window.filterBets=filterBets;window.toggleTheme=toggleTheme;window.toggleLanguage=toggleLanguage;window.loadBets=loadBets;

console.log('✅ My Bets v14.4 — Fixed: API 404 suppression, team logos, acca detection, settlement times');
</script>
