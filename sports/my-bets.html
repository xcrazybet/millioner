<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Bets - X Lodon</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <link rel="stylesheet" href="../css/sports-betting.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0f1a; color: white; font-family: 'Segoe UI', sans-serif; min-height: 100vh; }
        .header { background: #111827; padding: 12px 15px; border-bottom: 2px solid #00ff9d; position: sticky; top: 0; z-index: 100; }
        .header-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .back-btn { color: #00ff9d; text-decoration: none; font-size: 20px; }
        .tabs { display: flex; gap: 5px; overflow-x: auto; white-space: nowrap; padding-bottom: 3px; }
        .tab { padding: 8px 12px; background: #1a2332; border-radius: 20px; color: white; text-decoration: none; font-size: 12px; }
        .tab.active { background: #00ff9d; color: black; }
        .container { max-width: 1200px; margin: 0 auto; padding: 15px; }
        .bet-card { background: #111827; border-radius: 16px; padding: 16px; margin-bottom: 12px; border-left: 4px solid #ffc107; }
        .bet-card.won { border-left-color: #4caf50; background: linear-gradient(135deg, #111827, #0a1a0f); }
        .bet-card.lost { border-left-color: #ff5252; background: linear-gradient(135deg, #111827, #1a0a0a); }
        .bet-header { display: flex; justify-content: space-between; margin-bottom: 12px; }
        .bet-status { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .bet-status.active { background: #ffc107; color: black; }
        .bet-status.won { background: #4caf50; color: white; }
        .bet-status.lost { background: #ff5252; color: white; }
        .bet-footer { display: flex; justify-content: space-between; margin-top: 12px; padding-top: 12px; border-top: 1px solid #ffffff11; }
        .payout-value { font-weight: 700; font-size: 18px; }
        .payout-value.won { color: #4caf50; }
        .payout-value.lost { color: #ff5252; }
        .cancel-btn { padding: 8px 16px; background: #ff525222; border: 1px solid #ff5252; color: #ff5252; border-radius: 8px; cursor: pointer; }
        .empty-state { text-align: center; padding: 50px; color: #a0a8c9; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-top">
            <a href="betting-sport.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
            <h1 style="font-size:18px;"><i class="fas fa-futbol"></i> My Bets</h1>
        </div>
        <div class="tabs">
            <a href="betting-sport.html" class="tab">Home</a>
            <a href="live-matches.html" class="tab">Live</a>
            <a href="upcoming-matches.html" class="tab">Upcoming</a>
            <a href="finished-matches.html" class="tab">Results</a>
            <a href="my-bets.html" class="tab active">My Bets</a>
        </div>
    </div>
    
    <div class="container">
        <div id="bets-container"><div style="text-align:center; padding:40px;">Loading bets...</div></div>
    </div>

    <script src="../js/supabase-client.js"></script>
    <script src="../js/betting-engine.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        
        auth.onAuthStateChanged(u => { if (!u) location.href = '../login.html'; else loadBets(); });
        
        async function loadBets() {
            const container = document.getElementById('bets-container');
            
            if (!window.supaDB) {
                container.innerHTML = '<div class="empty-state">Supabase not connected</div>';
                return;
            }
            
            const bets = await window.supaDB.getUserBets(auth.currentUser.uid);
            
            if (bets.length === 0) {
                container.innerHTML = '<div class="empty-state"><i class="fas fa-ticket-alt"></i><p>No bets found</p></div>';
                return;
            }
            
            container.innerHTML = '';
            bets.forEach(bet => container.appendChild(createCard(bet)));
        }
        
        function createCard(bet) {
            const card = document.createElement('div');
            const isAcc = bet.bet_category === 'accumulator';
            card.className = `bet-card ${bet.status}`;
            
            const placed = bet.placed_at ? new Date(bet.placed_at) : new Date();
            const settled = bet.settled_at ? new Date(bet.settled_at) : null;
            
            const statusText = bet.status === 'active' ? 'Active' : bet.status === 'won' ? 'Won' : bet.status === 'lost' ? 'Lost' : 'Settled';
            
            let matchDisplay = isAcc ? `${bet.selections?.length || 0} selections` : (bet.match_name || 'Match');
            let payout = bet.status === 'won' ? '+' + parseFloat(bet.payout || bet.potential_win).toFixed(2) : bet.status === 'lost' ? '-' + parseFloat(bet.amount).toFixed(2) : parseFloat(bet.potential_win || 0).toFixed(2);
            
            card.innerHTML = `
                <div class="bet-header">
                    <span>${isAcc ? '🎲 Accumulator' : '🎯 Single'}</span>
                    <span class="bet-status ${bet.status}">${statusText}</span>
                </div>
                <div>${matchDisplay}</div>
                <div class="bet-footer">
                    <span>Stake: $${parseFloat(bet.amount).toFixed(2)}</span>
                    <span class="payout-value ${bet.status}">$${payout}</span>
                </div>
                <div style="color:#a0a8c9; font-size:11px; margin-top:8px;">
                    Placed: ${placed.toLocaleString()}
                    ${settled ? ' | Settled: ' + settled.toLocaleString() : ''}
                </div>
                ${bet.status === 'active' ? `<button class="cancel-btn" onclick="cancelBet('${bet.id}')">Cancel</button>` : ''}
            `;
            return card;
        }
        
        window.cancelBet = async id => {
            if (!confirm('Cancel this bet?')) return;
            try { const r = await cancelBetWithFee(id); alert(r.success ? `Refunded: $${r.refund.toFixed(2)}` : r.error); }
            catch(e) { alert('Error'); }
        };
    </script>
</body>
</html>
