<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bets - X Lodon | رهاناتي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="../css/sports-betting.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0f1a; color: white; font-family: 'Segoe UI', 'Tajawal', sans-serif; min-height: 100vh; }
        .header { background: #111827; padding: 12px 15px; border-bottom: 2px solid #00ff9d; }
        .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .back-btn { color: #00ff9d; text-decoration: none; font-size: 20px; }
        .lang-toggle { background: #1a2332; border: 1px solid #00ff9d; color: #00ff9d; padding: 5px 12px; border-radius: 20px; cursor: pointer; }
        .tabs { display: flex; gap: 5px; overflow-x: auto; }
        .tab { padding: 8px 12px; background: #1a2332; border-radius: 20px; color: white; text-decoration: none; font-size: 12px; }
        .tab.active { background: #00ff9d; color: black; }
        .container { max-width: 1200px; margin: 0 auto; padding: 15px; }
        .stats-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .stat-card { background: #111827; padding: 15px; border-radius: 12px; text-align: center; }
        .stat-value { font-size: 22px; font-weight: bold; color: #00ff9d; }
        .filter-bar { display: flex; gap: 5px; margin-bottom: 20px; }
        .filter-btn { flex: 1; padding: 12px; background: #1a2332; border: none; border-radius: 8px; color: white; cursor: pointer; }
        .filter-btn.active { background: #00ff9d; color: black; }
        .bet-card { background: #111827; border-radius: 12px; padding: 15px; margin-bottom: 12px; border-left: 4px solid #ffc107; }
        .bet-card.won { border-left-color: #4caf50; background: linear-gradient(135deg, #111827, #1a2332); }
        .bet-card.lost { border-left-color: #ff5252; }
        .bet-card.cashed_out { border-left-color: #ff9800; }
        .bet-header { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .bet-status { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .bet-status.active { background: #ffc107; color: black; }
        .bet-status.won { background: #4caf50; color: white; }
        .bet-status.lost { background: #ff5252; color: white; }
        .bet-status.cashed_out { background: #ff9800; color: black; }
        .bet-amount { font-size: 18px; font-weight: bold; }
        .bet-amount.won { color: #4caf50; }
        .bet-amount.lost { color: #ff5252; }
        .action-btn { padding: 8px 16px; border-radius: 8px; font-size: 12px; cursor: pointer; margin-right: 8px; }
        .cancel-btn { background: #ff525222; border: 1px solid #ff5252; color: #ff5252; }
        .cashout-btn { background: #ff980022; border: 1px solid #ff9800; color: #ff9800; }
        .arabic { font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-top">
            <div class="header-left">
                <a href="betting-sport.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
                <h1 style="font-size:18px;"><i class="fas fa-futbol"></i> <span class="en">My Bets</span><span class="ar" style="display:none;">رهاناتي</span></h1>
            </div>
            <button class="lang-toggle" onclick="toggleLanguage()"><span class="en">🇸🇦 عربي</span><span class="ar" style="display:none;">🇬🇧 English</span></button>
        </div>
        <div class="tabs">
            <a href="betting-sport.html" class="tab"><span class="en">Home</span><span class="ar" style="display:none;">الرئيسية</span></a>
            <a href="live-matches.html" class="tab"><span class="en">Live</span><span class="ar" style="display:none;">مباشر</span></a>
            <a href="upcoming-matches.html" class="tab"><span class="en">Upcoming</span><span class="ar" style="display:none;">قادم</span></a>
            <a href="finished-matches.html" class="tab"><span class="en">Results</span><span class="ar" style="display:none;">النتائج</span></a>
            <a href="my-bets.html" class="tab active"><span class="en">My Bets</span><span class="ar" style="display:none;">رهاناتي</span></a>
        </div>
    </div>
    
    <div class="container">
        <div class="stats-cards">
            <div class="stat-card"><div class="stat-label"><span class="en">Total Bets</span><span class="ar" style="display:none;">إجمالي الرهانات</span></div><div class="stat-value" id="total-bets">0</div></div>
            <div class="stat-card"><div class="stat-label"><span class="en">Win Rate</span><span class="ar" style="display:none;">نسبة الفوز</span></div><div class="stat-value" id="win-rate">0%</div></div>
            <div class="stat-card"><div class="stat-label"><span class="en">Total P/L</span><span class="ar" style="display:none;">الربح/الخسارة</span></div><div class="stat-value" id="total-pl">$0.00</div></div>
        </div>
        
        <div class="filter-bar">
            <button class="filter-btn active" data-filter="all"><span class="en">All</span><span class="ar" style="display:none;">الكل</span></button>
            <button class="filter-btn" data-filter="active"><span class="en">Active</span><span class="ar" style="display:none;">نشط</span></button>
            <button class="filter-btn" data-filter="won"><span class="en">Won</span><span class="ar" style="display:none;">فوز</span></button>
            <button class="filter-btn" data-filter="lost"><span class="en">Lost</span><span class="ar" style="display:none;">خسارة</span></button>
        </div>
        
        <div id="bets-container"></div>
    </div>

    <script src="../js/betting-engine.js"></script>
    <script>
        function toggleLanguage() {
            const isEn = document.querySelector('.en').style.display !== 'none';
            document.querySelectorAll('.en').forEach(el => el.style.display = isEn ? 'none' : 'inline');
            document.querySelectorAll('.ar').forEach(el => el.style.display = isEn ? 'inline' : 'none');
            document.documentElement.dir = isEn ? 'rtl' : 'ltr';
            localStorage.setItem('lang', isEn ? 'ar' : 'en');
        }
        
        if (localStorage.getItem('lang') === 'ar') {
            document.querySelectorAll('.en').forEach(el => el.style.display = 'none');
            document.querySelectorAll('.ar').forEach(el => el.style.display = 'inline');
            document.documentElement.dir = 'rtl';
        }
        
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), db = firebase.firestore();
        let allBets = [], currentFilter = 'all';
        
        auth.onAuthStateChanged(u => { if (!u) location.href = '../login.html'; else loadBets(); });
        
        function loadBets() {
            db.collection('bets').where('userId', '==', auth.currentUser.uid).orderBy('placedAt', 'desc').onSnapshot(snap => {
                allBets = []; snap.forEach(d => allBets.push({ id: d.id, ...d.data() }));
                updateStats(); filterBets(currentFilter);
            });
        }
        
        function updateStats() {
            const total = allBets.length, won = allBets.filter(b => b.status === 'won').length;
            document.getElementById('total-bets').textContent = total;
            document.getElementById('win-rate').textContent = total ? `${((won/total)*100).toFixed(1)}%` : '0%';
            let pl = 0;
            allBets.forEach(b => { if (b.status === 'won') pl += (b.payout || b.potentialWin) - b.amount; else if (b.status === 'lost') pl -= b.amount; });
            const plEl = document.getElementById('total-pl');
            plEl.textContent = `${pl >= 0 ? '+' : ''}$${pl.toFixed(2)}`;
            plEl.style.color = pl >= 0 ? '#4caf50' : '#ff5252';
        }
        
        function filterBets(filter) {
            currentFilter = filter;
            const filtered = filter === 'all' ? allBets : allBets.filter(b => b.status === filter);
            const container = document.getElementById('bets-container');
            
            if (!filtered.length) { container.innerHTML = '<div style="text-align:center;padding:40px;color:#a0a8c9;">No bets found</div>'; return; }
            
            container.innerHTML = '';
            filtered.forEach(bet => {
                const card = document.createElement('div'); card.className = `bet-card ${bet.status}`;
                const isAcc = bet.betCategory === 'accumulator';
                const matchDisplay = isAcc ? `${bet.selections?.length || 0} selections` : (bet.matchName || 'Match');
                const amount = bet.amount || 0;
                const returned = bet.status === 'won' ? (bet.payout || bet.potentialWin) : (bet.status === 'cashed_out' ? bet.cashoutAmount : 0);
                
                card.innerHTML = `
                    <div class="bet-header">
                        <span>${isAcc ? '🎲 Accumulator' : '🎯 Single'} - ${matchDisplay}</span>
                        <span class="bet-status ${bet.status}">${bet.status.toUpperCase()}</span>
                    </div>
                    <div style="display:flex; justify-content:space-between; margin:10px 0;">
                        <span>Stake: $${amount.toFixed(2)}</span>
                        <span>Odds: ${isAcc ? (bet.totalOdds?.toFixed(2) || '1.00') : (bet.odds?.toFixed(2) || '2.00')}</span>
                    </div>
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span class="bet-amount ${bet.status}">
                            ${bet.status === 'won' ? `+$${returned.toFixed(2)}` : (bet.status === 'lost' ? `-$${amount.toFixed(2)}` : `→ $${returned.toFixed(2)}`)}
                        </span>
                        <div>
                            ${bet.status === 'active' ? `
                                <button class="action-btn cancel-btn" onclick="cancelBet('${bet.id}')">Cancel</button>
                                ${bet.canCashout ? `<button class="action-btn cashout-btn" onclick="cashoutBet('${bet.id}')">Cash Out</button>` : ''}
                            ` : ''}
                        </div>
                    </div>
                    <div style="color:#a0a8c9; font-size:11px; margin-top:10px;">${bet.placedAt?.toDate().toLocaleString() || ''}</div>
                `;
                container.appendChild(card);
            });
        }
        
        window.cancelBet = async (id) => { if (confirm('Cancel this bet? Fee may apply.')) { const r = await cancelBetWithFee(id); alert(r.success ? `Refunded: $${r.refund.toFixed(2)}` : r.error); } };
        window.cashoutBet = async (id) => { if (confirm('Cash out this bet?')) { const r = await cashoutBet(id); alert(r.success ? `Cashed out: $${r.amount.toFixed(2)}` : r.error); } };
        
        document.querySelectorAll('.filter-btn').forEach(b => b.addEventListener('click', function() {
            document.querySelectorAll('.filter-btn').forEach(x => x.classList.remove('active'));
            this.classList.add('active'); filterBets(this.dataset.filter);
        }));
    </script>
</body>
</html>
