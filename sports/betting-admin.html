    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0f1a; color: white; font-family: 'Segoe UI', sans-serif; }
        .header { background: #111827; padding: 12px 15px; border-bottom: 2px solid #ff9800; }
        .header-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .logo { font-size: 20px; font-weight: bold; color: #ff9800; }
        .logout-btn { background: #ff5252; border: none; color: white; padding: 8px 16px; border-radius: 8px; cursor: pointer; }
        .container { max-width: 1400px; margin: 0 auto; padding: 15px; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
        .stat-card { background: #111827; border-radius: 12px; padding: 15px; text-align: center; border: 1px solid #ff980033; cursor: pointer; }
        .stat-card .value { font-size: 28px; font-weight: bold; color: #ff9800; }
        
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn { padding: 8px 20px; background: #1a2332; border: none; color: white; border-radius: 8px; cursor: pointer; }
        .tab-btn.active { background: #ff9800; color: black; }
        .tab-btn .badge { background: #ff5252; border-radius: 10px; padding: 2px 6px; margin-left: 5px; font-size: 10px; }
        
        .panel { display: none; }
        .panel.active { display: block; }
        
        .card { background: #111827; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .card-title { font-size: 18px; font-weight: bold; color: #ff9800; margin-bottom: 15px; border-left: 3px solid #ff9800; padding-left: 10px; }
        
        .settle-card {
            background: #0f1622;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid #2a2a3a;
            overflow: hidden;
        }
        .settle-card.single { border-left: 4px solid #00ff9d; }
        .settle-card.accumulator { border-left: 4px solid #ff9800; }
        
        .settle-header {
            background: #1a2332;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            border-bottom: 1px solid #2a2a3a;
        }
        .settle-body { padding: 16px; }
        
        .match-score {
            background: #0a0f1a;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 15px;
        }
        .match-score .teams { font-size: 14px; }
        .match-score .score { font-size: 28px; font-weight: bold; color: #ff9800; margin: 5px 0; }
        
        .legs-list { margin-bottom: 15px; }
        .leg-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            border-bottom: 1px solid #2a2a3a;
            font-size: 12px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .leg-row:last-child { border-bottom: none; }
        .leg-match { flex: 2; font-weight: 600; }
        .leg-score { color: #ff9800; min-width: 60px; text-align: center; }
        .leg-pick { color: #00ff9d; min-width: 100px; }
        .leg-result { min-width: 70px; text-align: right; }
        
        .fin-row {
            display: flex;
            gap: 20px;
            padding: 12px;
            background: #1a2332;
            border-radius: 8px;
            margin-bottom: 15px;

        }
        .fin-item .label { font-size: 10px; color: #888; }
        .fin-item .value { font-size: 16px; font-weight: bold; }
        
        .action-buttons { display: flex; gap: 12px; flex-wrap: wrap; }
        .btn-win { background: #4caf50; color: white; border: none; padding: 10px 24px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-lose { background: #ff5252; color: white; border: none; padding: 10px 24px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-win:hover { background: #388e3c; }

        .badge { padding: 3px 8px; border-radius: 12px; font-size: 10px; font-weight: bold; display: inline-block; }
        .badge-won { background: #4caf50; color: white; }
        .badge-lost { background: #ff5252; color: white; }
        .badge-pending { background: #ff9800; color: black; }
        
        .search-box { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .search-box input, .search-box select { padding: 8px 12px; background: #1a2332; border: 1px solid #2a2a3a; border-radius: 6px; color: white; }
        .btn { padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; }
        .btn-primary { background: #ff9800; color: black; }
        .btn-success { background: #4caf50; color: white; }
        
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid #2a2a3a; font-size: 12px; }

        .notification.error { background: #ff5252; }
        .loading-spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid #ff9800; border-top-color: transparent; border-radius: 50%; animation: spin 0.6s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .empty-state { text-align: center; padding: 40px; color: #888; }
        
        @media (max-width: 768px) {
            .leg-row { flex-direction: column; align-items: flex-start; }
            .stats-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

let allPending = [];
let matchCache = {};

function showNotification(msg, isError = false) {
    const n = document.createElement('div');
    n.className = `notification ${isError ? 'error' : ''}`;
    n.innerHTML = msg;
    document.body.appendChild(n);
    setTimeout(() => n.remove(), 3000);
}

function esc(str) { if (!str) return ''; return String(str).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }
function $c(v) { return '$' + (parseFloat(v) || 0).toFixed(2); }

function formatBetType(t) {
    const types = { 'home': 'Home Win', 'away': 'Away Win', 'draw': 'Draw', 'over25': 'Over 2.5', 'under25': 'Under 2.5', 'btts_yes': 'BTTS Yes', 'btts_no': 'BTTS No' };
    return types[t] || t;
}

function detectWinner(betType, homeScore, awayScore) {
    const hs = parseInt(homeScore) || 0;
    const as = parseInt(awayScore) || 0;
    const total = hs + as;
    switch(betType) {
        case 'home': return hs > as;
        case 'away': return as > hs;
        case 'draw': return hs === as;
        case 'over25': return total > 2.5;
        case 'under25': return total < 2.5;
        case 'btts_yes': return hs > 0 && as > 0;
        case 'btts_no': return hs === 0 || as === 0;
        default: return false;
    }
}

function parseSelections(bet) {
    if (!bet) return [];
    if (bet.selections && Array.isArray(bet.selections)) return bet.selections;
    if (bet.selections && typeof bet.selections === 'string') {
        try { return JSON.parse(bet.selections); } catch(e) { return []; }
    }
    return [];
}

async function loadPending() {
    showNotification('Loading pending settlements...');
    document.getElementById('pending-list').innerHTML = '<div class="loading-spinner"></div> Loading...';
    
    try {
        // Get all finished matches
        const { data: finishedMatches } = await supabase
            .from('sports_matches')
            .select('*')
            .eq('status', 'finished');
        
        // Cache matches
        const finishedIds = new Set();
        for (const m of finishedMatches || []) {
            matchCache[m.fixture_id] = m;
            finishedIds.add(m.fixture_id);
        }
        
        // Get all active bets
        const { data: activeBets } = await supabase
            .from('bets')
            .select('*')
            .eq('status', 'active');
        
        // Find bets that need settlement
        allPending = [];
        for (const bet of activeBets || []) {
            const isAcc = bet.bet_type === 'accumulator' || bet.bet_category === 'accumulator';
            if (!isAcc) {
                if (finishedIds.has(bet.fixture_id)) {
                    allPending.push(bet);
                }
            } else {
                const selections = parseSelections(bet);
                const hasFinished = selections.some(s => finishedIds.has(s.fixture_id || s.fixtureId));
                if (hasFinished && selections.length > 0) {
                    allPending.push(bet);
                }
            }
        }
        
        // Load match data for accumulator legs
        for (const bet of allPending) {
            const selections = parseSelections(bet);
            for (const s of selections) {
                const fid = s.fixture_id || s.fixtureId;
                if (fid && !matchCache[fid]) {
                    const { data: m } = await supabase.from('sports_matches').select('*').eq('fixture_id', fid).single();
                    if (m) matchCache[fid] = m;
                }
            }
        }
        
        renderPending();
        updateStats();
    } catch(e) {
        console.error('Load pending error:', e);
        document.getElementById('pending-list').innerHTML = '<div class="empty-state">Error loading data</div>';
        showNotification('Error: ' + e.message, true);
    }
}

function renderPending() {
    const search = (document.getElementById('search-pending')?.value || '').toLowerCase();
    let filtered = allPending;
    if (search) {
        filtered = filtered.filter(b => 
            (b.user_email || '').toLowerCase().includes(search) ||
            (b.id || '').toLowerCase().includes(search)
        );
    }
    
    if (filtered.length === 0) {
        document.getElementById('pending-list').innerHTML = '<div class="empty-state">✅ No pending settlements</div>';
        document.getElementById('stat-pending').textContent = '0';
        document.getElementById('pending-badge').textContent = '0';
        return;
    }
    
    let html = '';
    
    for (const bet of filtered) {
        const isAcc = bet.bet_type === 'accumulator' || bet.bet_category === 'accumulator';
        
        if (!isAcc) {
            // SINGLE BET
            const match = matchCache[bet.fixture_id];
            const homeName = match?.home_team?.name || match?.home_team || 'Home';
            const awayName = match?.away_team?.name || match?.away_team || 'Away';
            const homeScore = match?.score?.home ?? '?';
            const awayScore = match?.score?.away ?? '?';
            const hasScore = typeof homeScore === 'number' && typeof awayScore === 'number';
            const isWin = hasScore ? detectWinner(bet.bet_type, homeScore, awayScore) : null;
            
            html += `
            <div class="settle-card single">
                <div class="settle-header">
                    <div><strong>#${String(bet.id).slice(-8)}</strong> <span class="badge" style="background:#00ff9d22;color:#00ff9d;">SINGLE</span></div>
                    <div>👤 ${esc(bet.user_email || bet.user_id?.slice(-10))}</div>
                    <div>💰 ${$c(bet.amount)} @ ${bet.odds}</div>
                </div>
                <div class="settle-body">
                    <div class="match-score">
                        <div class="teams">${esc(homeName)} vs ${esc(awayName)}</div>
                        <div class="score">${homeScore} - ${awayScore}</div>
                        <div style="font-size:11px;color:#888;">Fixture #${bet.fixture_id}</div>
                    </div>
                    <div class="legs-list">
                        <div class="leg-row">
                            <span class="leg-match">${esc(homeName)} vs ${esc(awayName)}</span>
                            <span class="leg-score">${homeScore}–${awayScore}</span>
                            <span class="leg-pick">${formatBetType(bet.bet_type)} @ ${bet.odds}</span>
                            <span class="leg-result">
                                ${isWin !== null ? `<span class="badge ${isWin ? 'badge-won' : 'badge-lost'}">${isWin ? 'WINS' : 'LOSS'}</span>` : '<span class="badge badge-pending">Waiting</span>'}
                            </span>
                        </div>
                    </div>
                    <div class="fin-row">
                        <div class="fin-item"><div class="label">Stake</div><div class="value">${$c(bet.amount)}</div></div>
                        <div class="fin-item"><div class="label">Potential Win</div><div class="value" style="color:#4caf50;">${$c(bet.potential_win)}</div></div>
                    </div>
                    <div class="action-buttons">
                        <button class="btn-win" onclick="settleBet('${bet.id}', 'won', false)">🏆 WIN - Pay ${$c(bet.potential_win)}</button>
                        <button class="btn-lose" onclick="settleBet('${bet.id}', 'lost', false)">❌ LOSE - No Payout</button>
                    </div>
                </div>
            </div>`;
        } else {
            // ACCUMULATOR BET
            const selections = parseSelections(bet);
            let legsHtml = '';
            let allWon = true;
            let hasAllScores = true;
            
            for (let i = 0; i < selections.length; i++) {
                const s = selections[i];

                const homeName = match?.home_team?.name || match?.home_team || 'Home';

                    verdictHtml = `<div style="background:#ff525222;padding:10px;border-radius:8px;margin-bottom:15px;border:1px solid #ff5252;color:#ff5252;">❌ AT LEAST ONE LEG LOST - Settle as LOSS</div>`;

            html += `

    document.getElementById('pending-list').innerHTML = html;
    document.getElementById('stat-pending').textContent = filtered.length;
    document.getElementById('pending-badge').textContent = filtered.length;
}

// MAIN SETTLEMENT FUNCTION
async function settleBet(betId, result, isAccumulator) {
    const confirmMsg = `Settle ${isAccumulator ? 'accumulator' : 'bet'} as ${result.toUpperCase()}? ${result === 'won' ? 'User will receive payout.' : 'No payout.'}`;
    if (!confirm(confirmMsg)) return;
    
    try {
        const { data: bet, error } = await supabase.from('bets').select('*').eq('id', betId).single();
        if (error) throw error;
        
        const payout = result === 'won' ? parseFloat(bet.potential_win || bet.amount * (bet.total_odds || bet.odds)) : 0;
        
        // Update bet
        await supabase.from('bets').update({
            status: result,
            payout: payout,
            settled_at: new Date().toISOString(),
            settled_by: auth.currentUser?.email
        }).eq('id', betId);
        
        // Update wallet if won
        if (result === 'won' && payout > 0) {
            try {
                await db.collection('wallets').doc(bet.user_id).update({
                    balance: firebase.firestore.FieldValue.increment(payout)
                });
            } catch(e) { console.log('Wallet error:', e); }
        }
        
        // Mark matches as settled
        if (!isAccumulator && bet.fixture_id) {
            await supabase.from('sports_matches').update({ bets_settled: true }).eq('fixture_id', bet.fixture_id);
        } else if (isAccumulator) {
            const selections = parseSelections(bet);
            for (const s of selections) {
                const fid = s.fixture_id || s.fixtureId;
                if (fid) await supabase.from('sports_matches').update({ bets_settled: true }).eq('fixture_id', fid);
            }
        }
        
        showNotification(`✅ Bet settled as ${result.toUpperCase()}! ${result === 'won' ? `Paid ${$c(payout)}` : ''}`);
        await loadPending();
        await loadActive();
        await loadSettled();
        updateStats();
    } catch(e) {
        showNotification('Error: ' + e.message, true);
    }
}

async function autoSettleAll() {
    if (allPending.length === 0) {
        showNotification('No pending bets to settle');
        return;
    }
    if (!confirm(`Auto-settle ${allPending.length} bets based on scores?`)) return;
    
    let settled = 0;
    for (const bet of allPending) {
        const isAcc = bet.bet_type === 'accumulator' || bet.bet_category === 'accumulator';
        let result = null;
        
        if (!isAcc) {
            const match = matchCache[bet.fixture_id];
            if (match?.score && typeof match.score.home === 'number') {
                const isWin = detectWinner(bet.bet_type, match.score.home, match.score.away);
                result = isWin ? 'won' : 'lost';
            }
        } else {
            const selections = parseSelections(bet);
            let allWon = true;
            let hasData = true;
            for (const s of selections) {
                const fid = s.fixture_id || s.fixtureId;
                const match = matchCache[fid];
                if (!match?.score || typeof match.score.home !== 'number') {
                    hasData = false;
                    break;
                }
                const isWin = detectWinner(s.bet_type || s.betType, match.score.home, match.score.away);
                if (!isWin) allWon = false;
            }
            if (hasData) result = allWon ? 'won' : 'lost';
        }
        
        if (result) {
            const payout = result === 'won' ? parseFloat(bet.potential_win || bet.amount * (bet.total_odds || bet.odds)) : 0;
            await supabase.from('bets').update({
                status: result,
                payout: payout,
                settled_at: new Date().toISOString(),
                settled_by: auth.currentUser?.email
            }).eq('id', bet.id);
            if (result === 'won' && payout > 0) {
                try { await db.collection('wallets').doc(bet.user_id).update({ balance: firebase.firestore.FieldValue.increment(payout) }); } catch(e) {}
            }
            settled++;
        }
    }
    
    showNotification(`Auto-settled ${settled} bets`);
    await loadPending();
    await loadActive();
    await loadSettled();
    updateStats();
}

async function loadActive() {
    const { data } = await supabase.from('bets').select('*').eq('status', 'active').limit(100);
    if (data) {
        document.getElementById('active-list').innerHTML = data.map(b => `<tr>
            <td>#${b.id?.slice(-8)}</td><td>${esc(b.user_email || '')}</td>
            <td>${b.match_name || 'N/A'}</td><td>${b.bet_type}</td>
            <td>${b.odds}</td><td>${$c(b.amount)}</td><td>${$c(b.potential_win)}</td>
        </tr>`).join('');
        document.getElementById('stat-active').textContent = data.length;
    }
}

async function loadSettled() {
    const { data } = await supabase.from('bets').select('*').in('status', ['won', 'lost']).order('settled_at', { ascending: false }).limit(100);
    if (data) {
        document.getElementById('settled-list').innerHTML = data.map(b => `<tr>
            <td>#${b.id?.slice(-8)}</td><td>${esc(b.user_email || '')}</td>
            <td>${b.match_name || 'N/A'}</td>
            <td><span class="badge ${b.status === 'won' ? 'badge-won' : 'badge-lost'}">${b.status}</span></td>
            <td class="${b.status === 'won' ? 'badge-won' : 'badge-lost'}">${$c(b.payout)}</td>
            <td>${b.settled_at ? new Date(b.settled_at).toLocaleString() : '-'}</td>
        </tr>`).join('');
        document.getElementById('stat-settled').textContent = data.length;
    }
}

async function loadUsers() {
    const { data } = await supabase.from('wallets').select('*').limit(50);
    if (data) {
        document.getElementById('users-list').innerHTML = data.map(w => `<td>
            <td>${esc(w.user_id)}</td><td>${$c(w.balance)}</td><td>${$c(w.total_wagered || 0)}</td>
        </tr>`).join('');
    }
}

async function updateStats() {
    const { count: pending } = await supabase.from('bets').select('*', { count: 'exact', head: true }).eq('status', 'active');
    document.getElementById('stat-pending').textContent = pending || 0;
}

function filterPending() { renderPending(); }

function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
    document.getElementById(`${tab}-panel`).classList.add('active');
    
    if (tab === 'pending') loadPending();
    if (tab === 'active') loadActive();
    if (tab === 'settled') loadSettled();
    if (tab === 'users') loadUsers();
}

async function logout() { await auth.signOut(); window.location.href = '../login.html'; }

document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.onclick = () => switchTab(btn.dataset.tab);
});

auth.onAuthStateChanged(async (user) => {
    if (!user) { window.location.href = '../login.html'; return; }
    if (!ALLOWED_ADMINS.includes(user.email)) {
        alert('Access Denied!');
        await auth.signOut();
        window.location.href = '../login.html';
        return;
    }
    document.getElementById('admin-email').textContent = user.email;
    await loadPending();
    await loadActive();
    await loadSettled();
    await loadUsers();
    setInterval(() => { loadPending(); updateStats(); }, 30000);
});

window.settleBet = settleBet;
window.autoSettleAll = autoSettleAll;
window.filterPending = filterPending;
window.switchTab = switchTab;
window.logout = logout;
window.loadPending = loadPending;

console.log('✅ Admin panel v5 loaded - accumulator settlement working');
</script>
</body>
