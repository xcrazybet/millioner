        .tabs { display: flex; gap: 6px; margin-bottom: 20px; border-bottom: 2px solid #ffffff11; padding-bottom: 10px; flex-wrap: wrap; }

    <script>
        // ============================================
        // ADMIN PANEL - COMPLETE WITH SETTLEMENT TIMERS
        // ============================================
        
        // Supabase Configuration
        const SUPABASE_URL = 'https://jnazybaeajyynpyoszmy.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpuYXp5YmFlYWp5eW5weW9zem15Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyNzgwMDMsImV4cCI6MjA5Mjg1NDAwM30.P_8V-_s6DQDiYekZX1yaNup48WBRaLhb3ILAkvzTDTY';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        // API Fallback (SAME AS MY-BETS.HTML)
        const API_BASE = 'https://millioner.onrender.com';
        
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        
        const ALLOWED_ADMINS = ['coca@x.com', 'ooo@x.com'];
        
        let allBets = [];
        let allMatches = [];
        let matchCache = {};
        let userEmailCache = {};
        let settlementTimers = [];
        
        // ===== HELPER FUNCTIONS =====
        function escapeHtml(str) { if (!str) return ''; return String(str).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }
        function formatCurrency(amount) { return '$' + (parseFloat(amount) || 0).toFixed(2); }
        function formatFullDate(dateStr) { if (!dateStr) return '-'; return new Date(dateStr).toLocaleString('en-US', { month:'short', day:'numeric', year:'numeric', hour:'2-digit', minute:'2-digit' }); }
        
        // 🔥 COMPLETE BET TYPE MAPPING - SAME AS MY-BETS.HTML
        function formatBetType(type) {
            const map = { 
                'home': '🏆 Home Win',
                'draw': '🤝 Draw', 
                'away': '🏆 Away Win',
                '1X': '🏠 Home or Draw',
                '12': '⚡ Home or Away',
                'X2': '🚀 Draw or Away',
                'over25': '⚽ Over 2.5 Goals',
                'under25': '🥅 Under 2.5 Goals',
                'btts_yes': '✅ Both Teams to Score',
                'btts_no': '❌ Both Teams to Score - No',
                'accumulator': '📊 Accumulator'
            };
            return map[type] || type;
        }
        
        function showNotification(msg, type = 'success') {
            const n = document.createElement('div');
            n.className = `notification ${type}`;
            n.innerHTML = `<i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}"></i> ${msg}`;
            document.body.appendChild(n);
            setTimeout(() => n.remove(), 3000);
        }
        
        // ===== CALCULATE SETTLEMENT TIME =====
        function calculateSettlementTime(kickoffTime, matchStatus) {
            if (!kickoffTime) return null;
            
            const kickoff = new Date(kickoffTime);
            const now = new Date();
            
            // If match hasn't started yet
            if (now < kickoff) {
                const diff = kickoff - now;
                const hours = Math.floor(diff / 3600000);
                const minutes = Math.floor((diff % 3600000) / 60000);
                return {
                    status: 'upcoming',
                    display: `⏰ Starts in ${hours}h ${minutes}m`,
                    urgent: false,
                    estimatedEnd: null
                };
            }
            
            // If match is live or finished, calculate estimated end (kickoff + 105 minutes)
            const estimatedEnd = new Date(kickoff.getTime() + (105 * 60000));
            
            if (matchStatus === 'live') {
                const diff = estimatedEnd - now;
                if (diff > 0) {
                    const minutes = Math.floor(diff / 60000);
                    return {
                        status: 'live',
                        display: `⏳ Settlement in ${minutes}m`,
                        urgent: minutes < 10,
                        estimatedEnd: estimatedEnd
                    };
                } else {
                    return {
                        status: 'settling',
                        display: '🔄 Settlement pending...',
                        urgent: false,
                        estimatedEnd: null
                    };
                }
            }
            
            if (matchStatus === 'finished') {
                return {
                    status: 'finished',
                    display: '✅ Match finished - Ready for settlement',
                    urgent: false,
                    estimatedEnd: null
                };
            }
            
            return null;
        }
        
        // ===== FETCH MATCH FROM API (FALLBACK) =====
        async function fetchMatchFromAPI(fixtureId) {
            try {
                const response = await fetch(`${API_BASE}/api/fixture/${fixtureId}`);
                const data = await response.json();
                
                if (data.success && data.fixture) {
                    return {
                        home_team: { 
                            name: data.teams?.home?.name || 'Home', 
                            logo: data.teams?.home?.logo || '' 
                        },
                        away_team: { 
                            name: data.teams?.away?.name || 'Away', 
                            logo: data.teams?.away?.logo || '' 
                        },
                        league_name: data.league?.name || 'League',
                        start_time: data.fixture.date,
                        status: data.fixture.status?.short === 'FT' ? 'finished' : (data.fixture.status?.short === 'LIVE' ? 'live' : 'upcoming'),
                        score: { home: data.goals?.home || 0, away: data.goals?.away || 0 },
                        elapsed: data.fixture.status?.elapsed || 0
                    };
                }
                return null;
            } catch(e) {
                console.log('API fetch error:', e);
                return null;
            }
        }
        
        // ===== GET MATCH DETAILS WITH FALLBACK =====
        async function getMatchDetails(fixtureId) {
            if (!fixtureId) return null;
            if (matchCache[fixtureId]) return matchCache[fixtureId];
            
            // FIRST TRY: Supabase
            try {
                const { data, error } = await supabaseClient
                    .from('sports_matches')
                    .select('*')
                    .eq('fixture_id', fixtureId)
                    .maybeSingle();
                
                if (!error && data) {
                    let homeTeam = data.home_team;
                    let awayTeam = data.away_team;
                    let score = data.score;
                    
                    if (homeTeam && typeof homeTeam === 'string') {
                        try { homeTeam = JSON.parse(homeTeam); } catch(e) { homeTeam = { name: 'Home', logo: '' }; }
                    }
                    if (awayTeam && typeof awayTeam === 'string') {
                        try { awayTeam = JSON.parse(awayTeam); } catch(e) { awayTeam = { name: 'Away', logo: '' }; }
                    }
                    if (score && typeof score === 'string') {
                        try { score = JSON.parse(score); } catch(e) { score = { home: 0, away: 0 }; }
                    }
                    
                    const enrichedData = {
                        ...data,
                        home_team: homeTeam || { name: 'Home', logo: '' },
                        away_team: awayTeam || { name: 'Away', logo: '' },
                        score: score || { home: 0, away: 0 }
                    };
                    
                    matchCache[fixtureId] = enrichedData;
                    return enrichedData;
                }
            } catch(e) {
                console.log('Supabase error, trying API...');
            }
            
            // SECOND TRY: API Fallback
            const apiData = await fetchMatchFromAPI(fixtureId);
            if (apiData) {
                matchCache[fixtureId] = apiData;
                return apiData;
            }
            
            return null;
        }
        
        // ===== GET USER EMAIL =====
        async function getUserEmail(userId) {
            if (!userId) return 'Unknown';
            if (userEmailCache[userId]) return userEmailCache[userId];
            
            try {
                const userRecord = await auth.getUser(userId).catch(() => null);
                if (userRecord && userRecord.email) {
                    userEmailCache[userId] = userRecord.email;
                    return userRecord.email;
                }
            } catch(e) {}
            
            return userId.slice(-12);
        }
        
        // ===== LOAD BETS WITH FULL ENRICHMENT =====
        async function loadBets() {
            try {
                const { data, error } = await supabaseClient
                    .from('bets')
                    .select('*')
                    .order('placed_at', { ascending: false });
                
                if (error) throw error;
                allBets = data || [];
                
                for (let i = 0; i < allBets.length; i++) {
                    const bet = allBets[i];
                    
                    if (bet.fixture_id && bet.bet_type !== 'accumulator') {
                        const match = await getMatchDetails(bet.fixture_id);
                        if (match) {
                            bet.match_name = `${match.home_team?.name || 'Home'} vs ${match.away_team?.name || 'Away'}`;
                            bet.home_team = match.home_team;
                            bet.away_team = match.away_team;
                            bet.home_logo = match.home_team?.logo || '';
                            bet.away_logo = match.away_team?.logo || '';
                            bet.league_name = match.league_name;
                            bet.kickoff_time = match.start_time;
                            bet.match_status = match.status;
                            bet.current_score = match.score;
                        } else {
                            bet.match_name = `Match #${bet.fixture_id}`;
                        }
                    }
                    
                    if (bet.bet_type === 'accumulator' && bet.selections && bet.selections.length) {
                        for (let leg of bet.selections) {
                            if (leg.fixture_id) {
                                const match = await getMatchDetails(leg.fixture_id);
                                if (match) {
                                    leg.matchName = `${match.home_team?.name || 'Home'} vs ${match.away_team?.name || 'Away'}`;
                                    leg.home_team = match.home_team;
                                    leg.away_team = match.away_team;
                                    leg.score = match.score || { home: 0, away: 0 };
                                    leg.match_status = match.status || 'upcoming';
                                    leg.league_name = match.league_name || '';
                                    leg.kickoff_time = match.start_time || null;
                                } else {
                                    leg.matchName = `Match #${leg.fixture_id}`;
                                    leg.score = { home: '?', away: '?' };
                                }
                            }
                        }
                    }
                    
                    if (bet.user_id && !bet.user_email) {
                        bet.user_email = await getUserEmail(bet.user_id);
                    }
                }
                
                renderBetsTable();
                updateStats();
                console.log('Loaded and enriched', allBets.length, 'bets');
                
            } catch(e) {
                console.error('Load bets error:', e);
                document.getElementById('bets-tbody').innerHTML = `<tr><td colspan="9">Error: ${e.message}</td></tr>`;
            }
        }
        
        function renderBetsTable() {
            const filter = document.getElementById('bet-status-filter').value;
            const search = document.getElementById('bet-search').value.toLowerCase();
            
            let filtered = allBets;
            if (filter !== 'all') filtered = filtered.filter(b => b.status === filter);
            if (search) {
                filtered = filtered.filter(b => 
                    (b.user_email || b.user_id || '').toLowerCase().includes(search) ||
                    (b.match_name || '').toLowerCase().includes(search)
                );
            }
            
            if (!filtered.length) {
                document.getElementById('bets-tbody').innerHTML = '<tr><td colspan="9">No bets found</td></tr>';
                return;
            }
            
            let html = '';
            for (const b of filtered) {
                const statusClass = b.status === 'won' ? 'status-won' : (b.status === 'lost' ? 'status-lost' : 'status-active');
                const matchDisplay = b.bet_type === 'accumulator' ? `${b.selections?.length || 0}-Fold Accumulator` : (b.match_name || `Match #${b.fixture_id}`);
                const userDisplay = b.user_email || b.user_id?.slice(-12) || 'Unknown';
                
                html += `<tr onclick="showBetDetails('${b.id}')">
                    <td>#${b.id?.slice(-8)}</td>
                    <td>${escapeHtml(userDisplay)}</td>
                    <td>${escapeHtml(matchDisplay)}</td>
                    <td>${escapeHtml(formatBetType(b.bet_type))}</td>
                    <td>${b.odds}</td>
                    <td>${formatCurrency(b.amount)}</td>
                    <td class="text-green">${formatCurrency(b.potential_win)}</td>
                    <td><span class="status-badge ${statusClass}">${b.status?.toUpperCase()}</span></td>
                    <td>${b.status === 'active' ? `<button class="btn btn-danger btn-sm" onclick="event.stopPropagation(); cancelBet('${b.id}')">Cancel</button>` : ''}</td>
                </tr>`;
            }
            document.getElementById('bets-tbody').innerHTML = html;
        }

        function closeModal() {
            document.getElementById('bet-modal').classList.remove('show');
        }
        
        // ===== SETTLE BET =====
        async function settleBet(betId, result) {
            if (!confirm(`Settle this bet as ${result.toUpperCase()}?`)) return;
            
            const bet = allBets.find(b => b.id === betId);
            if (!bet) return;
            
            const payout = result === 'won' ? (bet.amount * bet.odds) : 0;
            
            try {
                await supabaseClient
                    .from('bets')
                    .update({
                        status: result,
                        payout: payout,
                        settled_at: new Date().toISOString(),
                        settled_by: auth.currentUser?.email,
                        settlement_reason: `Admin marked as ${result.toUpperCase()}`
                    })
                    .eq('id', betId);
                
                if (result === 'won' && payout > 0) {
                    try {
                        await db.collection('wallets').doc(bet.user_id).update({
                            balance: firebase.firestore.FieldValue.increment(payout)
                        });
                    } catch(e) { console.log('Wallet update failed:', e); }
                }
                
                showNotification(`Bet settled as ${result.toUpperCase()}`, 'success');
                closeModal();
                await loadAllData();
            } catch(e) {
                showNotification(`Error: ${e.message}`, 'error');
            }
        }
        
        // ===== CANCEL BET =====
        async function cancelBet(betId) {
            if (!confirm('Cancel this bet and refund?')) return;
            
            const bet = allBets.find(b => b.id === betId);
            if (!bet || bet.status !== 'active') return;
            
            try {
                await db.collection('wallets').doc(bet.user_id).update({
                    balance: firebase.firestore.FieldValue.increment(bet.amount)
                });
                
                await supabaseClient
                    .from('bets')
                    .update({
                        status: 'cancelled',
                        settlement_reason: `Admin cancelled - Refunded $${bet.amount}`,
                        settled_at: new Date().toISOString()
                    })
                    .eq('id', betId);
                
                showNotification(`Bet cancelled, $${bet.amount} refunded`, 'success');
                await loadAllData();
            } catch(e) {
                showNotification(`Failed: ${e.message}`, 'error');
            }
        }

        // ===== SETTLE MATCH MANUALLY =====
        async function settleMatchManually() {
            const fixtureId = parseInt(document.getElementById('settle-fixture-id').value);
            if (!fixtureId) { showNotification('Enter fixture ID', 'error'); return; }
            
            const homeScore = parseInt(document.getElementById('settle-home-score').value) || 0;
            const awayScore = parseInt(document.getElementById('settle-away-score').value) || 0;
            
            if (!confirm(`Settle match ${fixtureId} with score ${homeScore}-${awayScore}?`)) return;
            
            try {
                await supabaseClient
                    .from('sports_matches')
                    .update({
                        score: { home: homeScore, away: awayScore },
                        status: 'finished'
                    })
                    .eq('fixture_id', fixtureId);
                
                const matchBets = allBets.filter(b => b.fixture_id === fixtureId && b.status === 'active');
                
                for (const bet of matchBets) {
                    let result = 'lost';
                    const hs = homeScore, as = awayScore;
                    switch(bet.bet_type) {
                        case 'home': result = hs > as ? 'won' : 'lost'; break;
                        case 'away': result = as > hs ? 'won' : 'lost'; break;
                        case 'draw': result = hs === as ? 'won' : 'lost'; break;
                        case 'over25': result = (hs + as) > 2.5 ? 'won' : 'lost'; break;
                        case 'under25': result = (hs + as) < 2.5 ? 'won' : 'lost'; break;
                        case 'btts_yes': result = (hs > 0 && as > 0) ? 'won' : 'lost'; break;
                        case 'btts_no': result = (hs === 0 || as === 0) ? 'won' : 'lost'; break;
                    }
                    const payout = result === 'won' ? (bet.amount * bet.odds) : 0;
                    
                    await supabaseClient
                        .from('bets')
                        .update({
                            status: result,
                            payout: payout,
                            settled_at: new Date().toISOString(),
                            settlement_reason: `Match finished ${homeScore}-${awayScore}`
                        })
                        .eq('id', bet.id);
                    
                    if (result === 'won' && payout > 0) {
                        try {
                            await db.collection('wallets').doc(bet.user_id).update({
                                balance: firebase.firestore.FieldValue.increment(payout)
                            });
                        } catch(e) {}
                    }
                }
                
                showNotification(`Match ${fixtureId} settled`, 'success');
                matchCache = {};
                await loadAllData();
            } catch(e) {
                showNotification(`Error: ${e.message}`, 'error');
            }
        }
        
        // ===== LOAD MATCHES =====
        async function loadMatches() {
            try {
                const { data } = await supabaseClient.from('sports_matches').select('*').order('start_time', { ascending: false }).limit(100);
                allMatches = data || [];
                renderMatchesTable();
            } catch(e) { console.error(e); }
        }
        
        function renderMatchesTable() {
            const search = document.getElementById('match-search')?.value.toLowerCase() || '';
            let filtered = allMatches;
            if (search) {
                filtered = filtered.filter(m => {
                    let homeName = m.home_team?.name || '';
                    let awayName = m.away_team?.name || '';
                    if (typeof homeName === 'string' && homeName.startsWith('"')) {
                        try { homeName = JSON.parse(homeName); } catch(e) {}
                    }
                    if (typeof awayName === 'string' && awayName.startsWith('"')) {
                        try { awayName = JSON.parse(awayName); } catch(e) {}
                    }
                    return homeName.toLowerCase().includes(search) || awayName.toLowerCase().includes(search);
                });
            }
            
            if (!filtered.length) {
                document.getElementById('matches-tbody').innerHTML = '<tr><td colspan="5">No matches found</td></tr>';
                return;
            }
            
            let html = '';
            for (const m of filtered) {
                let homeName = m.home_team?.name || 'Home';
                let awayName = m.away_team?.name || 'Away';
                if (typeof homeName === 'string' && homeName.startsWith('"')) {
                    try { homeName = JSON.parse(homeName); } catch(e) {}
                }
                if (typeof awayName === 'string' && awayName.startsWith('"')) {
                    try { awayName = JSON.parse(awayName); } catch(e) {}
                }
                
                const score = m.score ? `${m.score.home||0} - ${m.score.away||0}` : 'vs';
                const statusClass = m.status === 'live' ? 'status-live' : (m.status === 'upcoming' ? 'status-upcoming' : 'status-finished');
                html += `<tr onclick="document.getElementById('settle-fixture-id').value=${m.fixture_id}; switchTab('settle')">
                    <td>${m.fixture_id}</td>
                    <td>${escapeHtml(m.league_name || 'N/A')}</td>
                    <td><strong>${escapeHtml(homeName)}</strong> vs <strong>${escapeHtml(awayName)}</strong></td>
                    <td><span style="color:#ff9800;font-weight:bold;">${score}</span></td>
                    <td><span class="status-badge ${statusClass}">${m.status?.toUpperCase()}</span></td>
                </tr>`;
            }
            document.getElementById('matches-tbody').innerHTML = html;
        }
        
        // ===== STATS =====
        async function updateStats() {
            document.getElementById('total-bets').textContent = allBets.length;
            document.getElementById('won-bets').textContent = allBets.filter(b => b.status === 'won').length;
            document.getElementById('lost-bets').textContent = allBets.filter(b => b.status === 'lost').length;
            document.getElementById('total-wagered').textContent = formatCurrency(allBets.reduce((s,b) => s + (b.amount||0), 0));
            document.getElementById('total-won').textContent = formatCurrency(allBets.filter(b => b.status === 'won').reduce((s,b) => s + (b.payout||0), 0));
        }
        
        // ===== FILTERS =====
        function filterBets() { renderBetsTable(); }
        function filterMatches() { renderMatchesTable(); }
        
        // ===== LOAD ALL DATA =====
        async function loadAllData() {
            await loadBets();
            await loadPendingSettlements();
        }
        
        // ===== SWITCH TAB =====
        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelector(`[data-tab="${tabName}"]`).classList.add('active');
            document.getElementById(`${tabName}-panel`).classList.add('active');
            if (tabName === 'matches') loadMatches();
            if (tabName === 'settle') loadPendingSettlements();
        }
        
        // ===== LOGOUT =====
        async function logout() { await auth.signOut(); window.location.href = '../login.html'; }
        
        // ===== INIT =====
        document.querySelectorAll('.tab-btn').forEach(b => {
            b.onclick = function() { switchTab(this.dataset.tab); };
        });
        
        auth.onAuthStateChanged(async user => {
            if (!user) { window.location.href = '../login.html'; return; }
            if (!ALLOWED_ADMINS.includes(user.email)) {
                alert('Access Denied!');
                await auth.signOut();
                window.location.href = '../login.html';
                return;
            }
            document.getElementById('admin-email').innerHTML = user.email;
            await loadBets();
            await loadMatches();
            await loadPendingSettlements();
            
            setInterval(async () => {
                await loadBets();
                await loadPendingSettlements();
            }, 30000);
        });
        
        document.getElementById('bet-modal').addEventListener('click', function(e) { if (e.target === this) closeModal(); });
        
        // Make functions global
        window.switchTab = switchTab;
        window.loadAllData = loadAllData;
        window.filterBets = filterBets;
        window.filterMatches = filterMatches;
        window.showBetDetails = showBetDetails;
        window.closeModal = closeModal;
        window.settleBet = settleBet;
        window.cancelBet = cancelBet;
        window.settleMatchManually = settleMatchManually;
        window.loadMatches = loadMatches;
        window.loadPendingSettlements = loadPendingSettlements;
        window.logout = logout;
        
        console.log('🚀 Admin panel loaded with Settlement Timers!');
        console.log('✅ Settlement times calculated based on match start + 105 minutes');
    </script>
</body>
</html>
