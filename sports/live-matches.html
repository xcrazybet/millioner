<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live - X Lodon | مباشر</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <link rel="stylesheet" href="../css/sports-betting.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0f1a; color: white; font-family: 'Segoe UI', 'Tajawal', sans-serif; min-height: 100vh; }
        .header { background: #111827; padding: 12px 15px; border-bottom: 2px solid #ff5252; position: sticky; top: 0; z-index: 100; }
        .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .back-btn { color: #00ff9d; text-decoration: none; font-size: 20px; }
        .lang-toggle { background: #1a2332; border: 1px solid #00ff9d; color: #00ff9d; padding: 5px 12px; border-radius: 20px; cursor: pointer; }
        .tabs { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 3px; }
        .tab { padding: 8px 12px; background: #1a2332; border-radius: 20px; color: white; text-decoration: none; font-size: 12px; }
        .tab.active { background: #ff5252; color: white; }
        .container { max-width: 1200px; margin: 0 auto; padding: 15px; }
        .balance-bar { background: #111827; padding: 10px 15px; border-radius: 12px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #00ff9d33; }
        .live-header { display: flex; justify-content: space-between; margin-bottom: 15px; }
        .live-badge { background: #ff5252; padding: 8px 16px; border-radius: 25px; font-weight: 600; }
        .match-card { background: #111827; border-radius: 16px; padding: 18px; margin-bottom: 15px; border: 1px solid #ff525233; position: relative; overflow: hidden; }
        .match-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: #ff5252; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
        .match-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
        .match-league { color: #a0a8c9; font-size: 13px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .live-tag { background: #ff5252; padding: 2px 10px; border-radius: 15px; font-size: 11px; margin-left: 8px; }
        .match-minute-badge { background: #ff5252; padding: 4px 12px; border-radius: 20px; font-size: 14px; font-weight: 600; }
        .teams-section { display: flex; align-items: center; justify-content: space-around; margin: 15px 0; flex-wrap: wrap; gap: 15px; }
        .team-block { text-align: center; flex: 1; min-width: 100px; }
        .team-logo-img {
            width: 56px;
            height: 56px;
            margin: 0 auto 8px;
            object-fit: contain;
            background: rgba(255,255,255,0.08);
            border-radius: 50%;
            padding: 6px;
            transition: transform 0.2s ease;
            display: block;
        }
        .team-name { font-weight: 600; font-size: 15px; margin-top: 4px; }
        .score-display { font-size: 42px; font-weight: bold; letter-spacing: 6px; color: #ff5252; margin: 0 8px; }
        .events-section { margin-top: 12px; padding-top: 12px; border-top: 1px solid #ffffff11; }
        .event-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 12px; flex-wrap: wrap; }
        .event-icon.goal { color: #ff9800; }
        .event-icon.yellow-card { color: #ffc107; }
        .event-icon.red-card { color: #ff5252; }
        .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid #ffffff11; }
        .stat-item { text-align: center; }
        .stat-value { font-size: 16px; font-weight: bold; color: #00ff9d; }
        .stat-label { font-size: 10px; color: #a0a8c9; }
        .timer-section { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-top: 12px; padding-top: 12px; border-top: 1px solid #ffffff11; }
        .timer-item { text-align: center; }
        .timer-value { font-size: 12px; font-weight: 600; color: white; }
        .timer-label { font-size: 9px; color: #a0a8c9; }
        .info-row { text-align: center; color: #ff5252; font-size: 12px; margin-top: 15px; padding-top: 15px; border-top: 1px solid #ffffff11; }
        .empty-state { text-align: center; padding: 50px; color: #a0a8c9; }
        .debug-bar { background: #1a2332; padding: 8px 15px; border-radius: 8px; margin-bottom: 10px; font-size: 11px; color: #00ff9d; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .refresh-btn { background: #00ff9d; color: black; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 11px; margin-left: auto; }
        .arabic { font-family: 'Tajawal', sans-serif; }
        
        @media (max-width: 600px) {
            .team-logo-img { width: 48px; height: 48px; }
            .score-display { font-size: 32px; letter-spacing: 3px; }
            .team-name { font-size: 13px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-top">
            <div class="header-left">
                <a href="betting-sport.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
                <h1 style="font-size:18px;"><i class="fas fa-futbol"></i> X Lodon Sports</h1>
            </div>
            <button class="lang-toggle" onclick="toggleLanguage()">عربي</button>
        </div>
        <div class="tabs">
            <a href="betting-sport.html" class="tab">Home</a>
            <a href="live-matches.html" class="tab active">Live</a>
            <a href="upcoming-matches.html" class="tab">Upcoming</a>
            <a href="finished-matches.html" class="tab">Results</a>
            <a href="my-bets.html" class="tab">My Bets</a>
        </div>
    </div>
    
    <div class="container">
        <div class="balance-bar">
            <span><i class="fas fa-wallet"></i> Balance</span>
            <span style="color:#00ff9d;font-weight:bold;font-size:18px;" id="balance-display">$0.00</span>
        </div>
        
        <div class="debug-bar" id="debug-bar">
            <i class="fas fa-play-circle"></i> <span id="debug-text">Loading live matches...</span>
            <button class="refresh-btn" onclick="loadLiveMatches()"><i class="fas fa-sync-alt"></i> Refresh</button>
        </div>
        
        <div class="live-header">
            <span class="live-badge"><i class="fas fa-circle"></i> LIVE MATCHES <span id="match-count">0</span></span>
        </div>
        
        <div id="matches-container"></div>
        <div id="empty-state" class="empty-state" style="display:none;">
            <i class="fas fa-futbol" style="font-size:48px; opacity:0.3;"></i>
            <p>No live matches at the moment</p>
            <p style="font-size:12px; margin-top:10px;">Check back during match hours</p>
        </div>
    </div>

    <script src="../js/supabase-client.js"></script>
    <script>
        function toggleLanguage() {
            var isEn = document.querySelector('.en') && document.querySelector('.en').style.display !== 'none';
            if(document.querySelector('.en')){
                document.querySelectorAll('.en').forEach(function(el) { el.style.display = isEn ? 'none' : ''; });
                document.querySelectorAll('.ar').forEach(function(el) { el.style.display = isEn ? '' : 'none'; });
                document.documentElement.dir = isEn ? 'rtl' : 'ltr';
                localStorage.setItem('lang', isEn ? 'ar' : 'en');
            }
        }
        if(localStorage.getItem('lang') === 'ar') { setTimeout(toggleLanguage, 10); }
        
        var firebaseConfig = { 
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM", 
            authDomain: "x-bet-prod-jd.firebaseapp.com", 
            projectId: "x-bet-prod-jd", 
            storageBucket: "x-bet-prod-jd.firebasestorage.app", 
            messagingSenderId: "499334334535", 
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962" 
        };
        if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        
        var liveMatches = [];
        var timerInterval = null;
        
        firebase.auth().onAuthStateChanged(function(u) { 
            if(!u) {
                location.href = '../login.html';
            } else {
                init();
            }
        });
        
        async function init(){
            await loadBalance();
            loadLiveMatches();
            setInterval(loadLiveMatches, 30000);
        }
        
        async function loadBalance(){
            try {
                var db = firebase.firestore();
                var w = await db.collection('wallets').doc(firebase.auth().currentUser.uid).get();
                var balance = w.exists ? (w.data().balance || 0) : 0;
                document.getElementById('balance-display').textContent = '$' + balance.toFixed(2);
            } catch(e) {
                console.log("Balance load error:", e);
            }
        }
        
        function getTeamName(teamData) {
            if (!teamData) return 'Unknown';
            if (typeof teamData === 'object') {
                if (teamData.name) return teamData.name;
                if (teamData.team_name) return teamData.team_name;
            }
            if (typeof teamData === 'string') return teamData;
            return 'Unknown';
        }
        
        function getTeamLogo(teamData) {
            if (!teamData) return null;
            if (typeof teamData === 'object') {
                if (teamData.logo) return teamData.logo;
            }
            return null;
        }
        
        function getTeamId(teamData) {
            if (!teamData) return null;
            if (typeof teamData === 'object') {
                if (teamData.id) return teamData.id;
            }
            return null;
        }
        
        function getFallbackLogo(teamName) {
            var initials = teamName.substring(0, 2).toUpperCase();
            return "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle fill="#2a3a5e" cx="50" cy="50" r="48"/><text x="50" y="67" font-size="38" text-anchor="middle" fill="white" font-weight="bold">' + initials + '</text></svg>');
        }
        
        async function loadLiveMatches(){
            if(!supaClient) {
                console.error("Supabase not connected");
                document.getElementById('debug-text').innerHTML = 'Supabase connection failed';
                return;
            }
            
            try {
                document.getElementById('debug-text').innerHTML = '<i class="fas fa-spinner fa-spin"></i> Loading live matches...';
                
                // Query Supabase for live matches
                var { data: matches, error } = await supaClient
                    .from('sports_matches')
                    .select('*')
                    .eq('status', 'live')
                    .order('start_time', { ascending: false });
                
                if (error) throw error;
                
                console.log("Live matches found:", matches ? matches.length : 0);
                
                // Log first match details to debug
                if (matches && matches.length > 0) {
                    console.log("First match data:", JSON.stringify(matches[0], null, 2));
                }
                
                // Filter out matches older than 3.5 hours
                var threeHalfHoursAgo = new Date(Date.now() - 3.5 * 60 * 60 * 1000);
                var filteredMatches = [];
                
                for (var i = 0; i < (matches || []).length; i++) {
                    var m = matches[i];
                    var matchStart = new Date(m.start_time);
                    if (matchStart > threeHalfHoursAgo) {
                        filteredMatches.push(m);
                    }
                }
                
                liveMatches = filteredMatches;
                
                document.getElementById('match-count').textContent = liveMatches.length;
                
                var container = document.getElementById('matches-container');
                var emptyDiv = document.getElementById('empty-state');
                
                if(liveMatches.length === 0) {
                    container.style.display = 'none';
                    emptyDiv.style.display = 'block';
                    document.getElementById('debug-text').innerHTML = 'No live matches currently';
                    return;
                }
                
                container.style.display = 'block';
                emptyDiv.style.display = 'none';
                document.getElementById('debug-text').innerHTML = liveMatches.length + ' live match(es) in progress';
                
                // Build HTML for each match
                var html = '';
                for (var i = 0; i < liveMatches.length; i++) {
                    html += createMatchCard(liveMatches[i]);
                }
                container.innerHTML = html;
                
                // Fetch events for each match
                for (var i = 0; i < liveMatches.length; i++) {
                    fetchMatchEvents(liveMatches[i].fixture_id);
                }
                
            } catch(error) {
                console.error("Error loading live matches:", error);
                document.getElementById('debug-text').innerHTML = 'Error: ' + error.message;
            }
        }
        
        function createMatchCard(m) {
            // Extract team names safely
            var homeTeamObj = m.home_team;
            var awayTeamObj = m.away_team;
            
            var homeName = getTeamName(homeTeamObj);
            var awayName = getTeamName(awayTeamObj);
            
            var homeLogo = getTeamLogo(homeTeamObj);
            var awayLogo = getTeamLogo(awayTeamObj);
            
            var homeLogoUrl = homeLogo ? homeLogo : getFallbackLogo(homeName);
            var awayLogoUrl = awayLogo ? awayLogo : getFallbackLogo(awayName);
            
            var startTime = new Date(m.start_time);
            var now = new Date();
            var elapsed = Math.floor((now - startTime) / 60000);
            if (elapsed < 0) elapsed = 0;
            
            // Determine match period
            var period = '';
            if (elapsed < 45) {
                period = '1st Half';
            } else if (elapsed < 60) {
                period = 'Half Time';
            } else if (elapsed < 105) {
                period = '2nd Half';
            } else {
                period = 'Full Time';
            }
            
            var scoreHome = (m.score && m.score.home !== undefined) ? m.score.home : 0;
            var scoreAway = (m.score && m.score.away !== undefined) ? m.score.away : 0;
            
            var leagueName = m.league_name || 'League';
            var leagueLogo = m.league_logo || '';
            
            var elapsedDisplay = elapsed > 0 ? elapsed + "'" : "0'";
            var remaining = 0;
            if (elapsed < 45) {
                remaining = 45 - elapsed;
            } else if (elapsed >= 45 && elapsed < 105) {
                remaining = 90 - elapsed;
            }
            
            return `
            <div class="match-card" data-fixture="${m.fixture_id}">
                <div class="match-header-row">
                    <div class="match-league">
                        ${leagueLogo ? '<img src="' + leagueLogo + '" style="width:20px;height:20px;object-fit:contain;" onerror="this.style.display=\'none\'">' : '<i class="fas fa-trophy" style="color:#ff9800;"></i>'}
                        <span>${escapeHtml(leagueName)}</span>
                        <span class="live-tag"><i class="fas fa-circle"></i> LIVE</span>
                    </div>
                    <div class="match-minute-badge">${period} ${elapsedDisplay}</div>
                </div>
                <div class="teams-section">
                    <div class="team-block">
                        <img class="team-logo-img" src="${homeLogoUrl}" alt="${escapeHtml(homeName)}" onerror="this.src='${getFallbackLogo(homeName)}'">
                        <div class="team-name">${escapeHtml(homeName)}</div>
                    </div>
                    <div class="score-display">${scoreHome} - ${scoreAway}</div>
                    <div class="team-block">
                        <img class="team-logo-img" src="${awayLogoUrl}" alt="${escapeHtml(awayName)}" onerror="this.src='${getFallbackLogo(awayName)}'">
                        <div class="team-name">${escapeHtml(awayName)}</div>
                    </div>
                </div>
                <div class="events-section" id="events-${m.fixture_id}">
                    <div class="event-row"><span style="color:#a0a8c9;">Loading events...</span></div>
                </div>
                <div class="stats-row">
                    <div class="stat-item"><div class="stat-value">${period}</div><div class="stat-label">Period</div></div>
                    <div class="stat-item"><div class="stat-value">${elapsedDisplay}</div><div class="stat-label">Elapsed</div></div>
                    <div class="stat-item"><div class="stat-value">${remaining > 0 ? remaining + "'" : "0'"}</div><div class="stat-label">Remaining</div></div>
                </div>
                <div class="timer-section">
                    <div class="timer-item"><div class="timer-value">${startTime.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</div><div class="timer-label">Started</div></div>
                    <div class="timer-item"><div class="timer-value">${period}</div><div class="timer-label">Half</div></div>
                    <div class="timer-item"><div class="timer-value">${elapsed > 90 ? '90+' : elapsed}'</div><div class="timer-label">Live</div></div>
                </div>
                <div class="info-row"><i class="fas fa-info-circle"></i> Betting closed - Match in progress</div>
            </div>`;
        }
        
        async function fetchMatchEvents(fixtureId) {
            if (!fixtureId) return;
            try {
                var response = await fetch('https://millioner.onrender.com/api/fixtures/events/' + fixtureId);
                var data = await response.json();
                if(data.success && data.data && data.data.length > 0) {
                    var eventsDiv = document.getElementById('events-' + fixtureId);
                    if(eventsDiv) {
                        var goals = [];
                        var yellows = [];
                        var reds = [];
                        
                        for (var i = 0; i < data.data.length; i++) {
                            var e = data.data[i];
                            if(e.type === 'Goal') {
                                goals.push(e);
                            } else if(e.type === 'Card' && e.detail === 'Yellow Card') {
                                yellows.push(e);
                            } else if(e.type === 'Card' && e.detail === 'Red Card') {
                                reds.push(e);
                            }
                        }
                        
                        var html = '';
                        if(goals.length) {
                            var goalText = '';
                            for (var i = 0; i < goals.length; i++) {
                                var g = goals[i];
                                var playerName = (g.player && g.player.name) ? g.player.name : 'Player';
                                var minute = (g.time && g.time.elapsed) ? g.time.elapsed : '';
                                goalText += (goalText ? ', ' : '') + playerName + (minute ? ' ' + minute + "'" : '');
                            }
                            html += '<div class="event-row"><i class="fas fa-futbol event-icon goal"></i> ⚽ Goals: ' + goalText + '</div>';
                        }
                        if(yellows.length) {
                            var yellowText = '';
                            for (var i = 0; i < yellows.length; i++) {
                                var y = yellows[i];
                                var playerName = (y.player && y.player.name) ? y.player.name : 'Player';
                                yellowText += (yellowText ? ', ' : '') + playerName;
                            }
                            html += '<div class="event-row"><i class="fas fa-square event-icon yellow-card"></i> 🟨 Yellow Cards: ' + yellowText + '</div>';
                        }
                        if(reds.length) {
                            var redText = '';
                            for (var i = 0; i < reds.length; i++) {
                                var r = reds[i];
                                var playerName = (r.player && r.player.name) ? r.player.name : 'Player';
                                redText += (redText ? ', ' : '') + playerName;
                            }
                            html += '<div class="event-row"><i class="fas fa-square event-icon red-card"></i> 🟥 Red Cards: ' + redText + '</div>';
                        }
                        if(!goals.length && !yellows.length && !reds.length) {
                            html = '<div class="event-row"><span style="color:#a0a8c9;">No events recorded yet</span></div>';
                        }
                        eventsDiv.innerHTML = html;
                    }
                }
            } catch(e) {
                console.log("Events fetch error for", fixtureId, e.message);
            }
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        window.loadLiveMatches = loadLiveMatches;
        window.escapeHtml = escapeHtml;
        
        console.log("Live matches page loaded");
    </script>
</body>
</html>
