<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live - X Lodon | مباشر</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <link rel="stylesheet" href="../css/sports-betting.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0f1a; color: white; font-family: 'Segoe UI', 'Tajawal', sans-serif; min-height: 100vh; }
        .header { background: #111827; padding: 12px 15px; border-bottom: 2px solid #ff5252; position: sticky; top: 0; z-index: 100; }
        .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .back-btn { color: #00ff9d; text-decoration: none; font-size: 20px; }
        .lang-toggle { background: #1a2332; border: 1px solid #00ff9d; color: #00ff9d; padding: 5px 12px; border-radius: 20px; cursor: pointer; }
        .tabs { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 3px; }
        .tab { padding: 8px 12px; background: #1a2332; border-radius: 20px; color: white; text-decoration: none; font-size: 12px; }
        .tab.active { background: #ff5252; color: white; }
        .container { max-width: 1200px; margin: 0 auto; padding: 15px; }
        .balance-bar { background: #111827; padding: 10px 15px; border-radius: 12px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #00ff9d33; }
        .live-header { display: flex; justify-content: space-between; margin-bottom: 15px; }
        .live-badge { background: #ff5252; padding: 8px 16px; border-radius: 25px; font-weight: 600; }
        .match-card { background: #111827; border-radius: 16px; padding: 18px; margin-bottom: 15px; border: 1px solid #ff525233; position: relative; overflow: hidden; }
        .match-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: #ff5252; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
        .match-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .match-league { color: #a0a8c9; font-size: 13px; }
        .live-tag { background: #ff5252; padding: 2px 10px; border-radius: 15px; font-size: 11px; margin-left: 8px; }
        .match-minute-badge { background: #ff5252; padding: 4px 12px; border-radius: 20px; font-size: 14px; font-weight: 600; }
        .teams-section { display: flex; align-items: center; justify-content: space-around; margin: 15px 0; }
        .team-block { text-align: center; flex: 1; }
        /* NEW: logo image styling - replaces colored background with real logos */
        .team-logo-img {
            width: 56px;
            height: 56px;
            margin: 0 auto 8px;
            object-fit: contain;
            background: rgba(255,255,255,0.08);
            border-radius: 50%;
            padding: 6px;
            transition: transform 0.2s ease;
            display: block;
        }
        .team-logo-img:hover {
            transform: scale(1.05);
        }
        /* fallback text style when logo fails to load */
        .team-logo-fallback {
            width: 56px;
            height: 56px;
            margin: 0 auto 8px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            font-size: 18px;
            background: linear-gradient(135deg, #2a3a5e, #1a2538);
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .team-name { font-weight: 600; font-size: 15px; margin-top: 4px; }
        .score-display { font-size: 42px; font-weight: bold; letter-spacing: 6px; color: #ff5252; text-shadow: 0 0 4px rgba(0,0,0,0.5); margin: 0 8px; }
        .events-section { margin-top: 12px; padding-top: 12px; border-top: 1px solid #ffffff11; }
        .event-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 12px; }
        .event-icon.goal { color: #ff9800; }
        .event-icon.yellow-card { color: #ffc107; }
        .event-icon.red-card { color: #ff5252; }
        .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid #ffffff11; }
        .stat-item { text-align: center; }
        .stat-value { font-size: 16px; font-weight: bold; color: #00ff9d; }
        .stat-label { font-size: 10px; color: #a0a8c9; }
        .timer-section { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-top: 12px; padding-top: 12px; border-top: 1px solid #ffffff11; }
        .timer-item { text-align: center; }
        .timer-value { font-size: 12px; font-weight: 600; color: white; }
        .timer-label { font-size: 9px; color: #a0a8c9; }
        .info-row { text-align: center; color: #ff5252; font-size: 12px; margin-top: 15px; padding-top: 15px; border-top: 1px solid #ffffff11; }
        .empty-state { text-align: center; padding: 50px; color: #a0a8c9; }
        .arabic { font-family: 'Tajawal', sans-serif; }
        /* small responsive */
        @media (max-width: 600px) {
            .team-logo-img, .team-logo-fallback { width: 48px; height: 48px; }
            .score-display { font-size: 32px; letter-spacing: 3px; }
            .team-name { font-size: 13px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-top">
            <div class="header-left">
                <a href="betting-sport.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
                <h1 style="font-size:18px;"><i class="fas fa-futbol"></i> <span class="en">X Lodon Sports</span><span class="ar" style="display:none;">إكس لودون سبورت</span></h1>
            </div>
            <button class="lang-toggle" onclick="toggleLanguage()"><span class="en">🇸🇦 عربي</span><span class="ar" style="display:none;">🇬🇧 English</span></button>
        </div>
        <div class="tabs">
            <a href="betting-sport.html" class="tab"><span class="en">Home</span></a>
            <a href="live-matches.html" class="tab active"><span class="en">Live</span> <span id="live-count">0</span></a>
            <a href="upcoming-matches.html" class="tab"><span class="en">Upcoming</span></a>
            <a href="finished-matches.html" class="tab"><span class="en">Results</span></a>
            <a href="my-bets.html" class="tab"><span class="en">My Bets</span></a>
        </div>
    </div>
    
    <div class="container">
        <div class="balance-bar">
            <span><i class="fas fa-wallet"></i> <span class="en">Balance</span></span>
            <span style="color:#00ff9d;font-weight:bold;font-size:18px;" id="balance-display">$0.00</span>
        </div>
        <div class="live-header">
            <span class="live-badge"><i class="fas fa-circle"></i> <span class="en">LIVE MATCHES</span> <span id="match-count">0</span></span>
        </div>
        <div id="matches-container"></div>
        <div id="empty-state" class="empty-state" style="display:none;">
            <i class="fas fa-futbol" style="font-size:48px; opacity:0.3;"></i>
            <p>No live matches at the moment</p>
        </div>
    </div>

    <script src="../js/supabase-client.js"></script>
    <script>
        // LANGUAGE TOGGLE (unchanged functionality)
        function toggleLanguage() {
            var isEn = document.querySelector('.en').style.display !== 'none';
            document.querySelectorAll('.en').forEach(el => el.style.display = isEn ? 'none' : '');
            document.querySelectorAll('.ar').forEach(el => el.style.display = isEn ? '' : 'none');
            document.documentElement.dir = isEn ? 'rtl' : 'ltr';
            localStorage.setItem('lang', isEn ? 'ar' : 'en');
        }
        if(localStorage.getItem('lang')==='ar'){ setTimeout(toggleLanguage,10); }
        
        const firebaseConfig = { apiKey:"AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM", authDomain:"x-bet-prod-jd.firebaseapp.com", projectId:"x-bet-prod-jd", storageBucket:"x-bet-prod-jd.firebasestorage.app", messagingSenderId:"499334334535", appId:"1:499334334535:web:bebc1bf817e24d9e3c4962" };
        if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        
        let liveMatches=[], timerInterval=null;
        
        firebase.auth().onAuthStateChanged(u => { if(!u) location.href='../login.html'; else init(); });
        
        async function init(){
            await loadBalance();
            loadLive();
        }
        
        async function loadBalance(){
            try {
                const db = firebase.firestore();
                const w = await db.collection('wallets').doc(firebase.auth().currentUser.uid).get();
                document.getElementById('balance-display').textContent = '$' + (w.exists ? (w.data().balance||0) : 0).toFixed(2);
            } catch(e){}
        }
        
        // ENHANCED: fetch logo mapping for each match based on team names or API endpoint
        // We will try to get logos from the football-data or fallback to sportsdb / custom CDN.
        // Since supabase live matches might include logo URLs, we will fetch team info separately if needed.
        // Also we attempt to fetch from popular open football API (but we rely on existing data if present)
        // For demo: we build a local cache of logo URLs using team names + external logo API (the free flagpedia / media).
        // To keep reliability, we combine: if m.home_team.logo exists we use it, else try to get from free API or generate nice placeholder.
        
        // In-memory logo cache to avoid repeated requests
        const teamLogoCache = new Map();
        
        // Helper to get team logo URL (async fetch from reliable free source - TheSportsDB or similar)
        // We'll use a generic pattern: if the fixture contains team id, we could fetch, but first check:
        // Many sources provide logo endpoints like https://media.api-sports.io/football/teams/{teamId}.png
        // We'll try to use team IDs from match data if available, else use name-based fallback.
        async function fetchTeamLogo(teamName, teamId = null) {
            if (!teamName) return null;
            const cacheKey = teamId ? `id_${teamId}` : teamName.toLowerCase().trim();
            if (teamLogoCache.has(cacheKey)) return teamLogoCache.get(cacheKey);
            
            // Strategy 1: if teamId exists and we can build a logo URL (typical API-Sports pattern)
            if (teamId && typeof teamId === 'number') {
                const logoUrl = `https://media.api-sports.io/football/teams/${teamId}.png`;
                // We'll test it later via image onError, but we can return this optimistic URL
                teamLogoCache.set(cacheKey, logoUrl);
                return logoUrl;
            }
            
            // Strategy 2: Use free icons from https://www.thesportsdb.com/api/v1/json/3/searchteams.php?t={teamName}
            // But to avoid heavy API calls, we'll first attempt a simple generic football kit icon if unknown.
            // However we will implement a lightweight fetch to sportsDB for better logos (one per team per session)
            try {
                // Only fetch if not already tried for this team name (avoid spam)
                const searchName = encodeURIComponent(teamName);
                const response = await fetch(`https://www.thesportsdb.com/api/v1/json/3/searchteams.php?t=${searchName}`, {
                    signal: AbortSignal.timeout(3000)
                });
                const data = await response.json();
                if (data && data.teams && data.teams.length > 0 && data.teams[0].strTeamBadge) {
                    const badgeUrl = data.teams[0].strTeamBadge;
                    teamLogoCache.set(cacheKey, badgeUrl);
                    return badgeUrl;
                }
            } catch(e) {
                console.warn(`Logo fetch error for ${teamName}:`, e);
            }
            
            // Strategy 3: fallback to dynamic SVG with team initials (no external dependency)
            const fallbackSvg = `data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle fill='%23333e5e' cx='50' cy='50' r='48'/%3E%3Ctext x='50' y='67' font-size='42' text-anchor='middle' fill='white' font-weight='bold'%3E${teamName.substring(0,2).toUpperCase()}%3C/text%3E%3C/svg%3E`;
            teamLogoCache.set(cacheKey, fallbackSvg);
            return fallbackSvg;
        }
        
        // Function to generate HTML for team logo container with dynamic error handling
        function getTeamLogoHtml(teamName, teamId, teamLogoFromData) {
            // priority: if match object already contains team logo string (from supabase)
            if (teamLogoFromData && (teamLogoFromData.startsWith('http') || teamLogoFromData.startsWith('data:'))) {
                return `<img class="team-logo-img" src="${teamLogoFromData}" alt="${teamName}" onerror="this.onerror=null; this.src='${getFallbackLogoUrl(teamName)}';" loading="lazy">`;
            }
            // else we generate async - but we will call async function, but since createCardHTML is synchronous,
            // we will modify DOM after fetching logos. Better: create placeholder and later replace with real logo.
            // To avoid complex rewriting, we will return a div with data-team attributes and then after card creation we update logos.
            // However simpler: generate a fallback container and later we run a batch update logos.
            // I'll implement a function that after rendering matches, for each team we fetch actual logo and replace.
            return `<div class="team-logo-fallback" data-team-name="${teamName}" data-team-id="${teamId || ''}" data-original-placeholder="true">${teamName.substring(0,2).toUpperCase()}</div>`;
        }
        
        function getFallbackLogoUrl(teamName) {
            return `data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle fill='%23444c6e' cx='50' cy='50' r='48'/%3E%3Ctext x='50' y='67' font-size='38' text-anchor='middle' fill='white'%3E${teamName.substring(0,2).toUpperCase()}%3C/text%3E%3C/svg%3E`;
        }
        
        // After rendering, enhance all team logo containers with actual logo images
        async function enhanceTeamLogos() {
            // select all fallback logo elements or potential img that might need upgrade
            const fallbackElements = document.querySelectorAll('.team-logo-fallback[data-original-placeholder="true"]');
            for (const el of fallbackElements) {
                const teamName = el.getAttribute('data-team-name');
                const teamIdAttr = el.getAttribute('data-team-id');
                const teamId = teamIdAttr && teamIdAttr !== 'null' ? Number(teamIdAttr) : null;
                if (!teamName) continue;
                const logoUrl = await fetchTeamLogo(teamName, teamId);
                if (logoUrl && !logoUrl.includes('svg')) {
                    // replace fallback div with img
                    const newImg = document.createElement('img');
                    newImg.className = 'team-logo-img';
                    newImg.src = logoUrl;
                    newImg.alt = teamName;
                    newImg.loading = 'lazy';
                    newImg.onerror = function() {
                        this.onerror = null;
                        this.src = getFallbackLogoUrl(teamName);
                    };
                    el.parentNode.replaceChild(newImg, el);
                } else if (logoUrl && logoUrl.includes('svg')) {
                    // if we got svg fallback, we could keep as background but we'll keep the fallback div style
                    // but update background maybe?
                    el.style.background = 'linear-gradient(135deg, #2a3a5e, #1a2538)';
                    el.textContent = teamName.substring(0,2).toUpperCase();
                }
            }
            // Also handle any direct img logo tag with broken images (just in case)
            document.querySelectorAll('.team-logo-img').forEach(img => {
                img.onerror = function() {
                    this.onerror = null;
                    const fallbackName = this.alt || 'Team';
                    this.src = getFallbackLogoUrl(fallbackName);
                };
            });
        }
        
        async function loadLive(){
            const container=document.getElementById('matches-container');
            const empty=document.getElementById('empty-state');
            if(!window.supaDB) return;
            
            liveMatches = await window.supaDB.getLiveMatches();
            // Filter out matches older than 3.5 hours
            const threeHalfHoursAgo = new Date(Date.now() - 3.5 * 60 * 60 * 1000);
            liveMatches = liveMatches.filter(m => new Date(m.start_time) > threeHalfHoursAgo);
            
            document.getElementById('live-count').textContent = liveMatches.length;
            document.getElementById('match-count').textContent = liveMatches.length;
            
            if(liveMatches.length===0){ container.style.display='none'; empty.style.display='block'; return; }
            else { container.style.display='block'; empty.style.display='none'; }
            
            // Build each card including placeholder for logos (to be replaced later with actual logos)
            let cardsHtml = '';
            for (const m of liveMatches) {
                // get additional team info: try to extract logos from match object if present
                const homeLogoOriginal = m.home_team?.logo || null;
                const awayLogoOriginal = m.away_team?.logo || null;
                const homeTeamId = m.home_team?.id || (m.fixture_id ? null : null);
                const awayTeamId = m.away_team?.id || null;
                cardsHtml += createCardHTMLWithLogoPlaceholders(m, homeLogoOriginal, awayLogoOriginal, homeTeamId, awayTeamId);
            }
            container.innerHTML = cardsHtml;
            
            // After inserting, async load real logos from external APIs or cache
            enhanceTeamLogos();
            
            // fetch match events (unchanged)
            liveMatches.forEach(m => fetchMatchEvents(m.fixture_id));
            startTimer();
            setTimeout(loadLive, 30000);
        }
        
        function createCardHTMLWithLogoPlaceholders(m, homePreLogo, awayPreLogo, homeTeamId, awayTeamId) {
            const startTime = new Date(m.start_time);
            const endTime = new Date(startTime.getTime() + 105 * 60000);
            const elapsed = Math.floor((new Date() - startTime) / 60000);
            const half = elapsed < 45 ? '1st Half' : elapsed < 60 ? 'HT' : '2nd Half';
            const homeName = m.home_team?.name || 'Home';
            const awayName = m.away_team?.name || 'Away';
            
            // Generate logo placeholder for home team with support for pre-existing logo from data source
            let homeLogoHtml = '';
            if (homePreLogo && (homePreLogo.startsWith('http') || homePreLogo.startsWith('data:'))) {
                homeLogoHtml = `<img class="team-logo-img" src="${homePreLogo}" alt="${homeName}" onerror="this.onerror=null;this.src='${getFallbackLogoUrl(homeName)}';">`;
            } else {
                homeLogoHtml = `<div class="team-logo-fallback" data-team-name="${homeName}" data-team-id="${homeTeamId || ''}" data-original-placeholder="true">${homeName.substring(0,2).toUpperCase()}</div>`;
            }
            
            let awayLogoHtml = '';
            if (awayPreLogo && (awayPreLogo.startsWith('http') || awayPreLogo.startsWith('data:'))) {
                awayLogoHtml = `<img class="team-logo-img" src="${awayPreLogo}" alt="${awayName}" onerror="this.onerror=null;this.src='${getFallbackLogoUrl(awayName)}';">`;
            } else {
                awayLogoHtml = `<div class="team-logo-fallback" data-team-name="${awayName}" data-team-id="${awayTeamId || ''}" data-original-placeholder="true">${awayName.substring(0,2).toUpperCase()}</div>`;
            }
            
            const scoreHome = m.score?.home !== undefined ? m.score.home : (m.score?.fulltime?.home ?? (m.score?.halftime?.home ?? 0));
            const scoreAway = m.score?.away !== undefined ? m.score.away : (m.score?.fulltime?.away ?? (m.score?.halftime?.away ?? 0));
            
            return `
            <div class="match-card" data-fixture="${m.fixture_id}">
                <div class="match-header-row">
                    <span class="match-league"><i class="fas fa-trophy" style="color:#ff9800;"></i> ${m.league_name || 'League'}<span class="live-tag"><i class="fas fa-circle"></i> LIVE</span></span>
                    <span class="match-minute-badge">${half} ${elapsed > 0 ? elapsed + "'" : "0'"}</span>
                </div>
                <div class="teams-section">
                    <div class="team-block">
                        ${homeLogoHtml}
                        <div class="team-name">${homeName}</div>
                    </div>
                    <div style="text-align:center;">
                        <div class="score-display">${scoreHome} - ${scoreAway}</div>
                    </div>
                    <div class="team-block">
                        ${awayLogoHtml}
                        <div class="team-name">${awayName}</div>
                    </div>
                </div>
                <div class="events-section" id="events-${m.fixture_id}"><div class="event-row"><span style="color:#a0a8c9;">Loading events...</span></div></div>
                <div class="stats-row">
                    <div class="stat-item"><div class="stat-value">${half}</div><div class="stat-label">Period</div></div>
                    <div class="stat-item"><div class="stat-value">${elapsed > 0 ? elapsed + "'" : "0'"}</div><div class="stat-label">Elapsed</div></div>
                    <div class="stat-item"><div class="stat-value">${Math.max(0, (elapsed < 45 ? 45 - elapsed : (elapsed < 90 ? 90 - elapsed : 0)))}'</div><div class="stat-label">Remaining</div></div>
                </div>
                <div class="timer-section">
                    <div class="timer-item"><div class="timer-value">${startTime.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div><div class="timer-label">Started</div></div>
                    <div class="timer-item"><div class="timer-value">${half}</div><div class="timer-label">Half</div></div>
                    <div class="timer-item"><div class="timer-value">${endTime.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div><div class="timer-label">Ends ~</div></div>
                    <div class="timer-item"><div class="timer-value">${elapsed > 90 ? '90+' : elapsed}'</div><div class="timer-label">Live</div></div>
                </div>
                <div class="info-row"><i class="fas fa-info-circle"></i> Betting closed - Match in progress</div>
            </div>`;
        }
        
        // Fetch events unchanged, but add extra check
        async function fetchMatchEvents(fixtureId){
            if (!fixtureId) return;
            try {
                const r = await fetch(`https://millioner.onrender.com/api/fixtures/events/${fixtureId}`);
                const d = await r.json();
                if(d.success && d.data){
                    const el = document.getElementById('events-'+fixtureId);
                    if(el){
                        const goals = d.data.filter(e=>e.type==='Goal');
                        const yellows = d.data.filter(e=>e.type==='Card'&&e.detail==='Yellow Card');
                        const reds = d.data.filter(e=>e.type==='Card'&&e.detail==='Red Card');
                        let html = '';
                        if(goals.length) html += `<div class="event-row"><i class="fas fa-futbol event-icon goal"></i> ⚽ Goals: ${goals.map(g=>`${g.player?.name||'Player'} ${g.time?.elapsed||''}'`).join(', ')}</div>`;
                        if(yellows.length) html += `<div class="event-row"><i class="fas fa-square event-icon yellow-card"></i> 🟨 Yellow (${yellows.length}): ${yellows.map(y=>y.player?.name||'Player').join(', ')}</div>`;
                        if(reds.length) html += `<div class="event-row"><i class="fas fa-square event-icon red-card"></i> 🟥 Red (${reds.length}): ${reds.map(r=>r.player?.name||'Player').join(', ')}</div>`;
                        if(!goals.length&&!yellows.length&&!reds.length) html = '<div class="event-row"><span style="color:#a0a8c9;">⚽ No events recorded</span></div>';
                        el.innerHTML = html;
                    }
                }
            } catch(e){}
        }
        
        function startTimer(){ if(timerInterval)clearInterval(timerInterval); timerInterval=setInterval(() => { if(liveMatches.length) loadLive(); }, 30000); }
        window.addEventListener('beforeunload',()=>{ if(timerInterval)clearInterval(timerInterval); });
    </script>
</body>
</html>
