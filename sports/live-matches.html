<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live - X Lodon | مباشر</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="../css/sports-betting.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0f1a; color: white; font-family: 'Segoe UI', 'Tajawal', sans-serif; min-height: 100vh; }
        .header { background: #111827; padding: 12px 15px; border-bottom: 2px solid #ff5252; position: sticky; top: 0; z-index: 100; }
        .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .back-btn { color: #00ff9d; text-decoration: none; font-size: 20px; }
        .lang-toggle { background: #1a2332; border: 1px solid #00ff9d; color: #00ff9d; padding: 5px 12px; border-radius: 20px; cursor: pointer; }
        .tabs { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 3px; }
        .tab { padding: 8px 12px; background: #1a2332; border-radius: 20px; color: white; text-decoration: none; font-size: 12px; }
        .tab.active { background: #ff5252; color: white; }
        .container { max-width: 1200px; margin: 0 auto; padding: 15px; }
        
        .live-header { display: flex; justify-content: space-between; margin-bottom: 15px; }
        .live-badge { background: #ff5252; padding: 8px 16px; border-radius: 25px; font-weight: 600; }
        .refresh-btn { background: transparent; border: 1px solid #00ff9d; color: #00ff9d; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 12px; }
        .sync-btn { background: transparent; border: 1px solid #ff9800; color: #ff9800; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 12px; }
        .debug-bar { background: #1a2332; padding: 8px 15px; border-radius: 8px; margin-bottom: 15px; font-size: 12px; }
        .debug-bar.success { border-left: 4px solid #4caf50; }
        .debug-bar.warning { border-left: 4px solid #ff9800; }
        
        .league-group { margin-bottom: 25px; }
        .league-header { color: #00ff9d; font-size: 16px; font-weight: 600; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #00ff9d33; display: flex; justify-content: space-between; cursor: pointer; }
        .league-header i { transition: transform 0.3s; }
        .league-header.collapsed i { transform: rotate(-90deg); }
        .league-matches.collapsed { display: none; }
        
        .match-card { background: #111827; border-radius: 16px; padding: 18px; margin-bottom: 15px; border: 1px solid #ff525233; position: relative; overflow: hidden; cursor: pointer; }
        .match-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: #ff5252; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
        .match-league { color: #a0a8c9; font-size: 13px; margin-bottom: 12px; }
        .live-tag { background: #ff5252; padding: 2px 10px; border-radius: 15px; font-size: 11px; margin-left: 8px; }
        .match-teams { display: flex; align-items: center; justify-content: space-around; margin: 15px 0; }
        .team { text-align: center; flex: 1; font-weight: 600; font-size: 16px; }
        .score { font-size: 36px; font-weight: bold; letter-spacing: 8px; }
        .timer-section { background: #1a2332; border-radius: 10px; padding: 12px; margin-top: 15px; }
        .timer-row { display: flex; justify-content: space-between; color: #a0a8c9; font-size: 13px; margin-bottom: 5px; }
        .timer-value { color: white; font-weight: 600; }
        .timer-badge { background: #ff5252; padding: 4px 12px; border-radius: 20px; font-size: 14px; font-weight: 600; display: inline-block; }
        .info-row { text-align: center; color: #ff5252; font-size: 12px; margin-top: 15px; padding-top: 15px; border-top: 1px solid #ffffff11; }
        .empty-state { text-align: center; padding: 50px; color: #a0a8c9; }
        .arabic { font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-top">
            <div class="header-left">
                <a href="betting-sport.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
                <h1 style="font-size:18px;"><i class="fas fa-futbol"></i> <span class="en">X Lodon Sports</span><span class="ar" style="display:none;">إكس لودون سبورت</span></h1>
            </div>
            <button class="lang-toggle" onclick="toggleLanguage()"><span class="en">🇸🇦 عربي</span><span class="ar" style="display:none;">🇬🇧 English</span></button>
        </div>
        <div class="tabs">
            <a href="betting-sport.html" class="tab"><span class="en">Home</span><span class="ar" style="display:none;">الرئيسية</span></a>
            <a href="live-matches.html" class="tab active"><span class="en">Live</span><span class="ar" style="display:none;">مباشر</span> <span id="live-count">0</span></a>
            <a href="upcoming-matches.html" class="tab"><span class="en">Upcoming</span><span class="ar" style="display:none;">قادم</span></a>
            <a href="finished-matches.html" class="tab"><span class="en">Results</span><span class="ar" style="display:none;">النتائج</span></a>
            <a href="my-bets.html" class="tab"><span class="en">My Bets</span><span class="ar" style="display:none;">رهاناتي</span></a>
        </div>
    </div>
    
    <div class="container">
        <div class="live-header">
            <span class="live-badge"><i class="fas fa-circle"></i> <span class="en">LIVE MATCHES</span><span class="ar" style="display:none;">مباريات مباشرة</span> <span id="match-count">0</span></span>
            <div style="display:flex; gap:8px;">
                <button class="sync-btn" onclick="forceSync()"><i class="fas fa-cloud-download-alt"></i> <span class="en">Sync</span></button>
                <button class="refresh-btn" onclick="forceRefresh()"><i class="fas fa-sync-alt"></i> <span class="en">Refresh</span></button>
            </div>
        </div>
        
        <div class="debug-bar warning" id="debug-bar">
            <i class="fas fa-database"></i> <span id="debug-text">Checking for live matches...</span>
        </div>
        
        <div id="matches-container"></div>
        <div id="empty-state" class="empty-state" style="display:none;">
            <i class="fas fa-futbol" style="font-size:48px; opacity:0.3;"></i>
            <p><span class="en">No live matches at the moment</span><span class="ar" style="display:none;">لا توجد مباريات مباشرة حالياً</span></p>
        </div>
    </div>

    <script src="../js/sports-api.js"></script>
    <script>
        function toggleLanguage() {
            var isEn = document.querySelector('.en').style.display !== 'none';
            document.querySelectorAll('.en').forEach(el => el.style.display = isEn ? 'none' : '');
            document.querySelectorAll('.ar').forEach(el => el.style.display = isEn ? '' : 'none');
            document.documentElement.dir = isEn ? 'rtl' : 'ltr';
            localStorage.setItem('lang', isEn ? 'ar' : 'en');
        }
        if (localStorage.getItem('lang') === 'ar') { toggleLanguage(); }
        
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), db = firebase.firestore();
        let unsubscribe = null, timerInterval = null, liveMatches = [];
        
        auth.onAuthStateChanged(u => { if (!u) location.href = '../login.html'; else loadLive(); });
        
        function loadLive() {
            const container = document.getElementById('matches-container');
            const empty = document.getElementById('empty-state');
            const debugBar = document.getElementById('debug-bar');
            const debugText = document.getElementById('debug-text');
            
            unsubscribe = db.collection('sports_matches').where('status', '==', 'live').onSnapshot(snap => {
                liveMatches = [];
                snap.forEach(d => {
                    const m = d.data();
                    if (m.fixtureId && m.fixtureId < 1000000 && m.homeTeam?.name) {
                        liveMatches.push(m);
                    }
                });
                
                debugText.textContent = `Found ${liveMatches.length} live matches in database`;
                debugBar.className = liveMatches.length > 0 ? 'debug-bar success' : 'debug-bar warning';
                
                document.getElementById('live-count').textContent = liveMatches.length;
                document.getElementById('match-count').textContent = liveMatches.length;
                
                if (liveMatches.length === 0) {
                    container.style.display = 'none';
                    empty.style.display = 'block';
                } else {
                    container.style.display = 'block';
                    empty.style.display = 'none';
                    renderMatches();
                }
                startLiveTimer();
            }, error => {
                debugText.textContent = `Error: ${error.message}`;
                debugBar.className = 'debug-bar warning';
                console.error('Live matches error:', error);
            });
        }
        
        function renderMatches() {
            const container = document.getElementById('matches-container');
            
            // Group by league
            const grouped = {};
            liveMatches.forEach(m => {
                const league = m.leagueName || 'Other';
                if (!grouped[league]) grouped[league] = [];
                grouped[league].push(m);
            });
            
            container.innerHTML = '';
            Object.keys(grouped).sort().forEach(league => {
                const group = document.createElement('div');
                group.className = 'league-group';
                group.innerHTML = `
                    <div class="league-header" onclick="toggleLeague(this)">
                        <span>${league} (${grouped[league].length})</span>
                        <i class="fas fa-chevron-down"></i>
                    </div>
                    <div class="league-matches" id="league-${league.replace(/\s/g,'')}"></div>
                `;
                container.appendChild(group);
                
                const matchesDiv = group.querySelector('.league-matches');
                grouped[league].sort((a,b) => b.startTime?.toDate() - a.startTime?.toDate()).forEach(m => {
                    matchesDiv.appendChild(createCard(m));
                });
            });
        }
        
        function createCard(m) {
            const card = document.createElement('div');
            card.className = 'match-card';
            card.onclick = () => location.href = `match-details.html?id=${m.fixtureId}`;
            
            const timer = typeof getLiveTimer === 'function' ? getLiveTimer(m.startTime) : 'LIVE';
            const startTime = m.startTime?.toDate() || new Date();
            const endTime = new Date(startTime.getTime() + 105 * 60000);
            const elapsed = typeof getMatchMinute === 'function' ? getMatchMinute(m.startTime) : 0;
            
            card.innerHTML = `
                <div class="match-league">
                    <i class="fas fa-trophy" style="color:#ff9800;"></i> ${m.leagueName||'League'}
                    <span class="live-tag"><i class="fas fa-circle"></i> LIVE</span>
                </div>
                <div class="match-teams">
                    <div class="team">${m.homeTeam?.name||'Home'}</div>
                    <div class="score">${m.score?.home||0} - ${m.score?.away||0}</div>
                    <div class="team">${m.awayTeam?.name||'Away'}</div>
                </div>
                <div class="timer-section">
                    <div class="timer-row">
                        <span><i class="far fa-clock"></i> Timer</span>
                        <span class="timer-value"><span class="timer-badge" id="timer-${m.fixtureId}">${timer}</span></span>
                    </div>
                    <div class="timer-row">
                        <span><i class="fas fa-play"></i> Started</span>
                        <span class="timer-value">${startTime.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>
                    </div>
                    <div class="timer-row">
                        <span><i class="fas fa-stop"></i> Ends ~</span>
                        <span class="timer-value">${endTime.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>
                    </div>
                    <div class="timer-row">
                        <span><i class="fas fa-hourglass-half"></i> Elapsed</span>
                        <span class="timer-value">${elapsed} mins</span>
                    </div>
                </div>
                <div class="info-row">
                    <i class="fas fa-info-circle"></i> Betting closed - Match in progress
                </div>
            `;
            return card;
        }
        
        function startLiveTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                liveMatches.forEach(m => {
                    const el = document.getElementById('timer-' + m.fixtureId);
                    if (el && typeof getLiveTimer === 'function') {
                        el.textContent = getLiveTimer(m.startTime);
                    }
                });
            }, 30000);
        }
        
        function toggleLeague(el) {
            el.classList.toggle('collapsed');
            el.nextElementSibling.classList.toggle('collapsed');
        }
        
        function forceRefresh() {
            loadLive();
        }
        
        function forceSync() {
            if (typeof syncNow === 'function') {
                syncNow().then(() => {
                    setTimeout(() => loadLive(), 1000);
                });
            }
        }
        
        window.toggleLeague = toggleLeague;
        window.addEventListener('beforeunload', () => {
            if (unsubscribe) unsubscribe();
            if (timerInterval) clearInterval(timerInterval);
        });
    </script>
</body>
</html>
