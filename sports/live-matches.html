<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Matches - X Lodon</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="../css/sports-betting.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0f1a; color: white; font-family: 'Segoe UI', sans-serif; min-height: 100vh; }
        .header { background: #111827; padding: 12px 15px; border-bottom: 2px solid #ff5252; position: sticky; top: 0; z-index: 100; }
        .header-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .back-btn { color: #00ff9d; text-decoration: none; font-size: 20px; }
        .header h1 { font-size: 18px; color: white; }
        .tabs { display: flex; gap: 5px; overflow-x: auto; white-space: nowrap; padding-bottom: 3px; }
        .tab { padding: 8px 12px; background: #1a2332; border-radius: 20px; color: white; text-decoration: none; font-size: 12px; }
        .tab.active { background: #ff5252; color: white; }
        .container { max-width: 1200px; margin: 0 auto; padding: 15px; }
        
        .live-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .live-badge { background: #ff5252; padding: 8px 16px; border-radius: 25px; font-weight: 600; font-size: 14px; }
        .live-count { background: white; color: #ff5252; padding: 2px 8px; border-radius: 15px; margin-left: 8px; }
        .refresh-indicator { color: #a0a8c9; font-size: 12px; }
        .sync-status { font-size: 11px; color: #00ff9d; margin-left: 10px; }
        
        .match-card { background: #111827; border-radius: 16px; padding: 18px; margin-bottom: 15px; border: 1px solid #ff525233; position: relative; overflow: hidden; }
        .match-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: #ff5252; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
        
        .match-league { color: #a0a8c9; font-size: 13px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .live-tag { background: #ff5252; padding: 2px 10px; border-radius: 15px; font-size: 11px; color: white; }
        .match-teams { display: flex; align-items: center; justify-content: space-around; margin: 15px 0; }
        .team { text-align: center; flex: 1; }
        .team-name { font-weight: 600; font-size: 16px; }
        .score-section { text-align: center; }
        .score { font-size: 36px; font-weight: bold; letter-spacing: 8px; }
        .minute-badge { background: #ff5252; padding: 4px 15px; border-radius: 20px; font-size: 13px; font-weight: 600; display: inline-block; margin-top: 8px; }
        .info-row { text-align: center; color: #ff5252; font-size: 12px; margin-top: 15px; padding-top: 15px; border-top: 1px solid #ffffff11; }
        
        .empty-state { text-align: center; padding: 60px 20px; color: #a0a8c9; }
        .empty-state i { font-size: 56px; opacity: 0.2; margin-bottom: 20px; }
        .empty-state p { margin-bottom: 15px; }
        .empty-state a { color: #00ff9d; text-decoration: none; font-weight: 600; }
        
        .update-timer { text-align: right; color: #a0a8c9; font-size: 11px; margin-top: 10px; }
        
        .loading-spinner { text-align: center; padding: 40px; }
        .spinner { width: 40px; height: 40px; border: 3px solid #ff525222; border-top-color: #ff5252; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 15px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .bottom-nav { display: flex; justify-content: space-around; background: #111827; padding: 12px; position: sticky; bottom: 0; border-top: 1px solid #00ff9d33; margin-top: 30px; }
        .nav-item { color: #a0a8c9; text-decoration: none; text-align: center; font-size: 12px; }
        .nav-item.active { color: #00ff9d; }
        .nav-item i { font-size: 20px; display: block; margin-bottom: 3px; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-top">
            <a href="betting-sport.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
            <h1><i class="fas fa-futbol"></i> X Lodon Sports</h1>
        </div>
        <div class="tabs">
            <a href="betting-sport.html" class="tab">Home</a>
            <a href="live-matches.html" class="tab active">Live <span id="live-badge">0</span></a>
            <a href="upcoming-matches.html" class="tab">Upcoming</a>
            <a href="finished-matches.html" class="tab">Results</a>
            <a href="my-bets.html" class="tab">My Bets</a>
        </div>
    </div>
    
    <div class="container">
        <div class="live-header">
            <span class="live-badge">
                <i class="fas fa-circle"></i> LIVE MATCHES
                <span class="live-count" id="match-count">0</span>
            </span>
            <span class="refresh-indicator">
                <i class="fas fa-sync-alt fa-spin"></i> Real-time
                <span class="sync-status" id="sync-status"></span>
            </span>
        </div>
        
        <div id="matches-container">
            <div class="loading-spinner">
                <div class="spinner"></div>
                <p>Loading live matches...</p>
            </div>
        </div>
        
        <div id="empty-state" class="empty-state" style="display: none;">
            <i class="fas fa-futbol"></i>
            <p>No live matches at the moment</p>
            <a href="upcoming-matches.html">View upcoming matches →</a>
        </div>
        
        <div class="update-timer" id="update-timer">Next update: 5s</div>
    </div>
    
    <div class="bottom-nav">
        <a href="../index.html" class="nav-item"><i class="fas fa-home"></i><span>Home</span></a>
        <a href="../games.html" class="nav-item"><i class="fas fa-gamepad"></i><span>Casino</span></a>
        <a href="betting-sport.html" class="nav-item"><i class="fas fa-futbol"></i><span>Sports</span></a>
        <a href="../dashboard.html" class="nav-item"><i class="fas fa-user"></i><span>Account</span></a>
    </div>
    
    <script src="../js/sports-api.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), db = firebase.firestore();
        
        let countdownSeconds = 5;
        let syncInterval = null;
        let unsubscribe = null;
        
        auth.onAuthStateChanged(u => { 
            if (!u) { location.href = '../login.html'; return; }
            loadLiveMatches();
            startAutoSync();
        });
        
        function startAutoSync() {
            if (syncInterval) clearInterval(syncInterval);
            
            // Force sync immediately
            if (typeof syncNow === 'function') {
                syncNow().then(() => {
                    document.getElementById('sync-status').textContent = '✓ Synced';
                    setTimeout(() => document.getElementById('sync-status').textContent = '', 2000);
                });
            }
            
            // Sync every 5 seconds
            syncInterval = setInterval(() => {
                if (typeof syncNow === 'function') {
                    syncNow().then(() => {
                        document.getElementById('sync-status').textContent = '✓ Synced';
                        setTimeout(() => document.getElementById('sync-status').textContent = '', 2000);
                    });
                }
            }, 5000);
        }
        
        function loadLiveMatches() {
            const container = document.getElementById('matches-container');
            const empty = document.getElementById('empty-state');
            
            unsubscribe = db.collection('sports_matches')
                .where('status', '==', 'live')
                .onSnapshot(snap => {
                    // Filter ONLY real matches from API (fixtureId < 1000000 and has valid data)
                    const realMatches = [];
                    snap.forEach(d => {
                        const m = d.data();
                        
                        // Skip sample/demo data - only real API matches
                        const isRealMatch = m.fixtureId && m.fixtureId < 1000000 && 
                                           m.leagueId && m.leagueId > 0 &&
                                           m.homeTeam?.name && m.awayTeam?.name &&
                                           m.homeTeam.name !== 'Home' && m.awayTeam.name !== 'Away';
                        
                        if (isRealMatch) {
                            realMatches.push(m);
                        }
                    });
                    
                    document.getElementById('live-badge').textContent = realMatches.length;
                    document.getElementById('match-count').textContent = realMatches.length;
                    
                    if (realMatches.length === 0) {
                        container.style.display = 'none';
                        empty.style.display = 'block';
                    } else {
                        container.style.display = 'block';
                        empty.style.display = 'none';
                        container.innerHTML = '';
                        
                        // Sort by start time (most recent first)
                        realMatches.sort((a, b) => {
                            const aTime = a.startTime?.toDate?.() || new Date(0);
                            const bTime = b.startTime?.toDate?.() || new Date(0);
                            return bTime - aTime;
                        });
                        
                        realMatches.forEach((m, i) => container.appendChild(createLiveCard(m, i + 1)));
                    }
                    
                    countdownSeconds = 5;
                }, error => {
                    console.error('Live matches error:', error);
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-exclamation-triangle"></i>
                            <p>Error loading matches</p>
                            <small>Please refresh the page</small>
                        </div>
                    `;
                });
        }
        
        function createLiveCard(m, index) {
            const card = document.createElement('div');
            card.className = 'match-card';
            
            const minute = getMatchMinute(m.startTime);
            const homeScore = m.score?.home || 0;
            const awayScore = m.score?.away || 0;
            
            card.innerHTML = `
                <div class="match-league">
                    <i class="fas fa-trophy" style="color:#ff9800;"></i> ${m.leagueName || 'League'}
                    <span class="live-tag"><i class="fas fa-circle"></i> LIVE</span>
                    <span style="margin-left:auto; color:#a0a8c9; font-size:12px;">#${index}</span>
                </div>
                <div class="match-teams">
                    <div class="team"><span class="team-name">${m.homeTeam?.name || 'Home'}</span></div>
                    <div class="score-section">
                        <div class="score">${homeScore} - ${awayScore}</div>
                        <span class="minute-badge">${minute}'</span>
                    </div>
                    <div class="team"><span class="team-name">${m.awayTeam?.name || 'Away'}</span></div>
                </div>
                <div class="info-row">
                    <i class="fas fa-info-circle"></i> Betting closed - Match in progress
                </div>
            `;
            return card;
        }
        
        function getMatchMinute(startTime) {
            if (!startTime) return '45';
            try {
                const now = new Date();
                const start = startTime.toDate ? startTime.toDate() : new Date(startTime);
                const diff = Math.floor((now - start) / 60000);
                if (diff < 1) return '1';
                if (diff > 90) return '90+';
                return diff;
            } catch (e) {
                return '45';
            }
        }
        
        // Countdown timer display
        setInterval(() => {
            countdownSeconds--;
            if (countdownSeconds <= 0) countdownSeconds = 5;
            document.getElementById('update-timer').textContent = `Next update: ${countdownSeconds}s`;
        }, 1000);
        
        // Cleanup
        window.addEventListener('beforeunload', () => {
            if (syncInterval) clearInterval(syncInterval);
            if (unsubscribe) unsubscribe();
        });
    </script>
</body>
</html>
