<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live - X Lodon</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <link rel="stylesheet" href="../css/sports-betting.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0f1a; color: white; font-family: 'Segoe UI', sans-serif; min-height: 100vh; }
        .header { background: #111827; padding: 12px 15px; border-bottom: 2px solid #ff5252; position: sticky; top: 0; z-index: 100; }
        .header-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .back-btn { color: #00ff9d; text-decoration: none; font-size: 20px; }
        .tabs { display: flex; gap: 5px; overflow-x: auto; white-space: nowrap; padding-bottom: 3px; }
        .tab { padding: 8px 12px; background: #1a2332; border-radius: 20px; color: white; text-decoration: none; font-size: 12px; }
        .tab.active { background: #ff5252; color: white; }
        .container { max-width: 1200px; margin: 0 auto; padding: 15px; }
        .live-header { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .live-badge { background: #ff5252; padding: 8px 16px; border-radius: 25px; font-weight: 600; }
        .match-card { background: #111827; border-radius: 16px; padding: 18px; margin-bottom: 15px; border: 1px solid #ff525233; position: relative; overflow: hidden; }
        .match-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: #ff5252; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
        .match-league { color: #a0a8c9; font-size: 13px; margin-bottom: 12px; }
        .live-tag { background: #ff5252; padding: 2px 10px; border-radius: 15px; font-size: 11px; margin-left: 8px; }
        .match-teams { display: flex; align-items: center; justify-content: space-around; margin: 15px 0; }
        .team { text-align: center; flex: 1; font-weight: 600; font-size: 16px; }
        .score { font-size: 36px; font-weight: bold; letter-spacing: 8px; }
        .minute-badge { background: #ff5252; padding: 4px 15px; border-radius: 20px; font-size: 13px; display: inline-block; margin-top: 8px; }
        .info-row { text-align: center; color: #ff5252; font-size: 12px; margin-top: 15px; padding-top: 15px; border-top: 1px solid #ffffff11; }
        .empty-state { text-align: center; padding: 50px; color: #a0a8c9; }
        .debug-bar { background: #1a2332; padding: 8px 15px; border-radius: 8px; margin-bottom: 15px; font-size: 12px; color: #00ff9d; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-top">
            <a href="betting-sport.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
            <h1 style="font-size:18px;"><i class="fas fa-futbol"></i> X Lodon Sports</h1>
        </div>
        <div class="tabs">
            <a href="betting-sport.html" class="tab">Home</a>
            <a href="live-matches.html" class="tab active">Live <span id="live-count">0</span></a>
            <a href="upcoming-matches.html" class="tab">Upcoming</a>
            <a href="finished-matches.html" class="tab">Results</a>
            <a href="my-bets.html" class="tab">My Bets</a>
        </div>
    </div>
    
    <div class="container">
        <div class="live-header">
            <span class="live-badge"><i class="fas fa-circle"></i> LIVE MATCHES <span id="match-count">0</span></span>
            <span style="color:#a0a8c9; font-size:12px;"><i class="fas fa-sync-alt fa-spin"></i> Real-time</span>
        </div>
        <div class="debug-bar" id="debug-bar">
            <i class="fas fa-database"></i> Loading matches from Supabase...
        </div>
        <div id="matches-container"></div>
        <div id="empty-state" class="empty-state" style="display:none;">
            <i class="fas fa-futbol" style="font-size:48px; opacity:0.3;"></i>
            <p>No live matches at the moment</p>
            <button onclick="window.syncNow?.()" style="margin-top:15px; padding:10px 20px; background:#00ff9d; color:black; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">
                Sync Now
            </button>
        </div>
    </div>

    <script src="../js/supabase-client.js"></script>
    <script src="../js/sports-api.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        
        auth.onAuthStateChanged(u => { if (!u) location.href = '../login.html'; else loadLive(); });
        
        async function loadLive() {
            const container = document.getElementById('matches-container');
            const empty = document.getElementById('empty-state');
            const debugBar = document.getElementById('debug-bar');
            
            if (!window.supaDB) {
                debugBar.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Supabase not connected';
                return;
            }
            
            // Get live matches from Supabase
            const matches = await window.supaDB.getLiveMatches();
            
            debugBar.innerHTML = `<i class="fas fa-check-circle"></i> Found ${matches.length} live matches (Supabase)`;
            document.getElementById('live-count').textContent = matches.length;
            document.getElementById('match-count').textContent = matches.length;
            
            if (matches.length === 0) {
                container.style.display = 'none';
                empty.style.display = 'block';
            } else {
                container.style.display = 'block';
                empty.style.display = 'none';
                container.innerHTML = '';
                matches.forEach(m => container.appendChild(createCard(m)));
            }
            
            // Refresh every 30 seconds
            setTimeout(loadLive, 30000);
        }
        
        function createCard(m) {
            const card = document.createElement('div');
            card.className = 'match-card';
            const min = getMinute(m.start_time);
            const homeName = m.home_team?.name || 'Home';
            const awayName = m.away_team?.name || 'Away';
            const homeScore = m.score?.home || 0;
            const awayScore = m.score?.away || 0;
            
            card.innerHTML = `
                <div class="match-league"><i class="fas fa-trophy" style="color:#ff9800;"></i> ${m.league_name||'League'}<span class="live-tag"><i class="fas fa-circle"></i> LIVE</span></div>
                <div class="match-teams"><div class="team">${homeName}</div><div class="score">${homeScore} - ${awayScore}</div><div class="team">${awayName}</div></div>
                <div style="text-align:center;"><span class="minute-badge">${min}'</span></div>
                <div class="info-row"><i class="fas fa-info-circle"></i> Betting closed</div>
            `;
            return card;
        }
        
        function getMinute(start) {
            if (!start) return '45';
            try { const diff = Math.floor((new Date() - new Date(start)) / 60000); return diff < 1 ? '1' : diff > 90 ? '90+' : diff; }
            catch { return '45'; }
        }
    </script>
</body>
</html>
