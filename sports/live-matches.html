<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Matches - X London | مباريات مباشرة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0f1a; color: white; font-family: 'Segoe UI', 'Tajawal', sans-serif; min-height: 100vh; }
        
        .header { background: #111827; padding: 12px 15px; border-bottom: 2px solid #ff4444; position: sticky; top: 0; z-index: 100; }
        .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; flex-wrap: wrap; gap: 10px; }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .back-btn { color: #00ff9d; text-decoration: none; font-size: 20px; background: none; border: none; cursor: pointer; }
        .lang-toggle { background: #1a2332; border: 1px solid #00ff9d; color: #00ff9d; padding: 5px 12px; border-radius: 20px; cursor: pointer; }
        .tabs { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 3px; }
        .tab { padding: 8px 12px; background: #1a2332; border-radius: 20px; color: white; text-decoration: none; font-size: 12px; }
        .tab.active { background: #ff4444; color: white; }
        
        .container { max-width: 1400px; margin: 0 auto; padding: 15px; padding-bottom: 20px; }
        
        .balance-bar { background: linear-gradient(135deg, #111827, #1a2332); padding: 15px 20px; border-radius: 16px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #ff444433; flex-wrap: wrap; gap: 10px; }
        .balance-label { font-size: 14px; color: #a0a8c9; }
        .balance-amount { font-size: 28px; font-weight: bold; color: #00ff9d; }
        
        .selector-bar { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .league-select, .search-input { padding: 12px; background: #111827; border: 1px solid #ffffff22; border-radius: 12px; color: white; font-size: 13px; }
        .league-select { flex: 1; min-width: 180px; }
        .search-input { flex: 2; min-width: 200px; }
        
        .debug-bar { background: #1a2332; padding: 8px 15px; border-radius: 8px; margin-bottom: 10px; font-size: 11px; color: #ff4444; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .refresh-btn { background: #00ff9d; color: black; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 11px; }
        
        .live-header { margin-bottom: 15px; }
        .live-badge { background: #ff4444; padding: 10px 20px; border-radius: 30px; font-weight: 600; display: inline-block; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.7; } }
        
        .match-card { background: #111827; border-radius: 16px; padding: 18px; margin-bottom: 15px; border: 1px solid #ff444433; cursor: pointer; transition: all 0.2s; position: relative; }
        .match-card:hover { transform: translateX(5px); background: #1a2332; }
        .match-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: #ff4444; animation: livePulse 1.5s infinite; border-radius: 16px 0 0 16px; }
        @keyframes livePulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
        
        .match-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
        .match-league { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #a0a8c9; }
        .league-logo { width: 20px; height: 20px; object-fit: contain; }
        .live-tag { background: #ff4444; padding: 2px 10px; border-radius: 15px; font-size: 10px; animation: blink 1s infinite; }
        @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
        .match-minute { background: #ff4444; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .match-minute.ht { background: #ff9800; }
        
        .teams-section { display: flex; align-items: center; justify-content: space-around; margin: 15px 0; flex-wrap: wrap; gap: 15px; }
        .team-block { text-align: center; flex: 1; min-width: 100px; cursor: pointer; position: relative; }
        .team-logo { width: 60px; height: 60px; margin: 0 auto 8px; object-fit: contain; background: rgba(255,255,255,0.08); border-radius: 50%; padding: 8px; transition: transform 0.2s; }
        .team-logo:hover { transform: scale(1.05); }
        .team-name { font-weight: 600; font-size: 14px; }
        .score { font-size: 36px; font-weight: bold; letter-spacing: 4px; color: #ff4444; }
        .score.goal-animation { animation: goalFlash 0.5s ease; }
        @keyframes goalFlash { 0% { color: #ff9800; text-shadow: 0 0 10px #ff9800; transform: scale(1.1); } 100% { color: #ff4444; transform: scale(1); } }
        
        .match-info { display: flex; justify-content: center; gap: 20px; margin: 10px 0; font-size: 11px; color: #a0a8c9; flex-wrap: wrap; }
        .events-section { margin-top: 12px; padding-top: 12px; border-top: 1px solid #ffffff11; font-size: 12px; max-height: 80px; overflow-y: auto; }
        .event-row { padding: 4px 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .event-goal { color: #ff9800; }
        .event-yellow { color: #ffc107; }
        .event-red { color: #ff4444; }
        .event-subs { color: #00ff9d; }
        
        .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 12px; padding-top: 12px; border-top: 1px solid #ffffff11; text-align: center; }
        .stat-label { font-size: 10px; color: #a0a8c9; }
        .stat-value { font-size: 14px; font-weight: bold; color: #00ff9d; }
        
        .odds-preview { display: flex; gap: 10px; justify-content: center; margin-top: 15px; padding-top: 15px; border-top: 1px solid #ffffff11; }
        .odd-box { text-align: center; padding: 6px 12px; background: #0a0f1a; border-radius: 8px; cursor: pointer; transition: all 0.2s; }
        .odd-box:hover { background: #00ff9d22; transform: scale(1.05); }
        .odd-box .label { font-size: 10px; color: #a0a8c9; }
        .odd-box .value { font-size: 16px; font-weight: bold; color: #00ff9d; }
        
        .betting-timer { font-family: monospace; font-size: 11px; text-align: center; margin-top: 10px; padding: 5px; border-radius: 8px; background: #1a2332; }
        .betting-timer.warning { background: #ff980022; color: #ff9800; }
        .betting-timer.closed { background: #ff444422; color: #ff4444; }
        
        .place-bet-btn { width: 100%; margin-top: 15px; padding: 10px; background: #00ff9d; color: black; border: none; border-radius: 25px; font-weight: bold; cursor: pointer; transition: all 0.2s; }
        .place-bet-btn:hover { background: #00cc7d; transform: scale(1.02); }
        .place-bet-btn.disabled { background: #a0a8c9; cursor: not-allowed; opacity: 0.5; }
        
        .side-cart { position: fixed; right: -400px; top: 0; width: 380px; height: 100vh; background: #111827; border-left: 2px solid #ff9800; z-index: 1001; transition: right 0.3s ease; display: flex; flex-direction: column; box-shadow: -5px 0 20px rgba(0,0,0,0.5); }
        .side-cart.open { right: 0; }
        .cart-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 1000; display: none; }
        .cart-overlay.show { display: block; }
        .cart-header { padding: 15px; background: #1a2332; border-bottom: 1px solid #ff9800; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; }
        .cart-header h3 { color: #ff9800; font-size: 18px; }
        .cart-close { background: none; border: none; color: white; font-size: 24px; cursor: pointer; }
        .cart-close:hover { color: #ff5252; }
        .cart-items { flex: 1; overflow-y: auto; padding: 15px; }
        .cart-item { background: #1a2332; border-radius: 10px; padding: 10px; margin-bottom: 10px; position: relative; border-left: 3px solid #ff9800; }
        .cart-item-match { font-weight: bold; font-size: 13px; margin-bottom: 5px; }
        .cart-item-bet { font-size: 11px; color: #00ff9d; }
        .cart-item-odds { font-size: 12px; color: #ff9800; font-weight: bold; margin-top: 5px; }
        .cart-remove { position: absolute; top: 10px; right: 10px; background: none; border: none; color: #ff5252; cursor: pointer; font-size: 14px; }
        .cart-remove:hover { color: #ff8888; }
        .cart-footer { padding: 15px; background: #1a2332; border-top: 1px solid #ffffff22; }
        .cart-total { display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: bold; }
        .cart-total-odds { color: #ff9800; font-size: 18px; }
        .cart-stake { width: 100%; padding: 10px; background: #0a0f1a; border: 1px solid #ff9800; border-radius: 8px; color: white; margin: 10px 0; text-align: center; }
        .cart-potential { background: #00ff9d11; padding: 10px; border-radius: 8px; text-align: center; margin: 10px 0; }
        .cart-potential-value { font-size: 18px; font-weight: bold; color: #00ff9d; }
        .cart-place-btn { width: 100%; padding: 12px; background: #ff9800; color: black; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: all 0.2s; }
        .cart-place-btn:hover:not(:disabled) { background: #e68900; }
        .cart-place-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .cart-icon { position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px; background: #ff9800; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 999; box-shadow: 0 4px 15px rgba(0,0,0,0.3); transition: all 0.2s; }
        .cart-icon:hover { transform: scale(1.05); background: #e68900; }
        .cart-icon .badge { position: absolute; top: -5px; right: -5px; background: #ff5252; color: white; border-radius: 50%; width: 22px; height: 22px; font-size: 12px; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .cart-icon i { font-size: 24px; color: black; }
        
        .team-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.95); z-index: 2000; display: none; align-items: center; justify-content: center; padding: 20px; }
        .team-modal.show { display: flex; }
        .team-modal-content { background: #111827; border-radius: 20px; padding: 20px; max-width: 500px; width: 100%; max-height: 80vh; overflow-y: auto; border: 2px solid #ff4444; }
        .team-modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .team-modal-close { background: none; border: none; color: white; font-size: 24px; cursor: pointer; }
        .player-list { display: flex; flex-direction: column; gap: 10px; }
        .player-item { display: flex; align-items: center; gap: 10px; padding: 8px; background: #1a2332; border-radius: 8px; }
        .player-number { font-weight: bold; color: #ff9800; width: 30px; }
        .player-name { flex: 1; }
        .player-position { font-size: 11px; color: #a0a8c9; }
        
        .league-group { margin-bottom: 20px; }
        .league-group-header { background: #1a2332; padding: 12px 15px; border-radius: 12px; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .league-group-header:hover { background: #00ff9d22; }
        .league-matches { transition: all 0.3s; }
        .league-matches.collapsed { display: none; }
        
        .empty-state { text-align: center; padding: 60px; color: #a0a8c9; }
        .loading-spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid #ff4444; border-top-color: transparent; border-radius: 50%; animation: spin 0.6s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .notification { position: fixed; top: 20px; right: 20px; background: #00ff9d; color: black; padding: 10px 20px; border-radius: 8px; font-size: 12px; z-index: 2000; animation: slideIn 0.3s ease, fadeOut 0.3s ease 2.7s forwards; }
        .notification.error { background: #ff5252; color: white; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeOut { to { opacity: 0; visibility: hidden; } }
        
        .arabic { font-family: 'Tajawal', sans-serif; }
        
        @media (max-width: 600px) {
            .team-logo { width: 45px; height: 45px; }
            .score { font-size: 28px; letter-spacing: 2px; }
            .team-name { font-size: 12px; }
            .match-info { flex-direction: column; align-items: center; gap: 5px; }
            .stats-row { grid-template-columns: repeat(2, 1fr); }
            .side-cart { width: 100%; right: -100%; }
        }
    </style>
</head>

            <button onclick="location.href='upcoming-matches.html'" style="margin-top:15px;padding:10px 20px;background:#ff9800;color:black;border:none;border-radius:8px;cursor:pointer;">View Upcoming Matches</button>
        </div>

    <!-- Cart Icon -->
    <div class="cart-icon" id="cart-icon" onclick="toggleCart()">
        <i class="fas fa-shopping-cart"></i>
        <span class="badge" id="cart-badge">0</span>
    </div>
    
    <!-- Floating Side Cart -->
    <div class="cart-overlay" id="cart-overlay" onclick="toggleCart()"></div>
    <div class="side-cart" id="side-cart">
        <div class="cart-header">
            <h3><i class="fas fa-layer-group"></i> Bet Slip</h3>
            <button class="cart-close" onclick="toggleCart()">&times;</button>
        </div>
        <div class="cart-items" id="cart-items">
            <div style="text-align:center; padding:20px; color:#a0a8c9;">No selections added</div>
        </div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>Total Odds:</span>
                <span class="cart-total-odds" id="cart-total-odds">1.00</span>
            </div>
            <input type="number" id="cart-stake" class="cart-stake" placeholder="Enter stake amount" min="1" step="1" value="10">

                <div>Potential Win</div>
                <div class="cart-potential-value" id="cart-potential">$0.00</div>

    <!-- Team Details Modal -->
    <div id="team-modal" class="team-modal" onclick="closeTeamModal(event)">
        <div class="team-modal-content" onclick="event.stopPropagation()">

                <h3 id="modal-team-name"><i class="fas fa-users"></i> Team Details</h3>
                <button class="team-modal-close" onclick="closeTeamModal()">&times;</button>

    <script>
        // ============================================
        // LIVE MATCHES v2.0 - FULLY FUNCTIONAL
        // ============================================
        
        const SUPABASE_URL = 'https://jnazybaeajyynpyoszmy.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpuYXp5YmFlYWp5eW5weW9zem15Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyNzgwMDMsImV4cCI6MjA5Mjg1NDAwM30.P_8V-_s6DQDiYekZX1yaNup48WBRaLhb3ILAkvzTDTY';
        
        let supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        
        const db = firebase.firestore();
        const auth = firebase.auth();
        
        let liveMatches = [];
        let refreshInterval = null;
        let eventInterval = null;
        let selectedLeague = 'all';
        let previousScores = {};
        let teamCache = {};
        let accumulatorSlip = [];
        
        const API_BASE = 'https://millioner.onrender.com';
        const BETTING_CLOSE_MINUTE = 80;
        
        // ===== LOAD BALANCE FROM FIRESTORE =====
        async function loadBalance() {
            try {
                const user = auth.currentUser;
                if (!user) return 0;
                
                const doc = await db.collection('wallets').doc(user.uid).get();
                const balance = doc.exists ? (doc.data().balance || 0) : 1000;
                document.getElementById('balance-display').textContent = `$${balance.toFixed(2)}`;
                return balance;
            } catch(e) { 
                console.error('Balance load error:', e); 
                return 0;
            }
        }
        
        async function updateWalletBalance(userId, amount) {
            const walletRef = db.collection('wallets').doc(userId);
            await walletRef.update({
                balance: firebase.firestore.FieldValue.increment(amount),
                updated_at: new Date().toISOString()
            });
        }
        
        // ===== NOTIFICATION =====
        function showNotification(message, type = 'success') {
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.innerHTML = `<i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}"></i> ${message}`;
            document.body.appendChild(notification);
            setTimeout(() => notification.remove(), 3000);
        }
        
        // ===== CART FUNCTIONS =====
        function toggleCart() {
            const cart = document.getElementById('side-cart');
            const overlay = document.getElementById('cart-overlay');
            cart.classList.toggle('open');
            overlay.classList.toggle('show');
        }
        
        function updateCartUI() {
            const cartItemsContainer = document.getElementById('cart-items');
            const cartBadge = document.getElementById('cart-badge');
            const cartTotalOdds = document.getElementById('cart-total-odds');
            const cartPlaceBtn = document.getElementById('cart-place-btn');
            const stakeInput = document.getElementById('cart-stake');
            
            cartBadge.textContent = accumulatorSlip.length;
            
            if (accumulatorSlip.length === 0) {
                cartItemsContainer.innerHTML = '<div style="text-align:center; padding:20px; color:#a0a8c9;">No selections added<br>Click on odds to add</div>';
                cartTotalOdds.textContent = '1.00';
                cartPlaceBtn.disabled = true;
                cartPlaceBtn.textContent = 'Add selections (2+ needed)';
                document.getElementById('cart-potential').textContent = '$0.00';
                return;
            }
            
            let itemsHtml = '';
            let totalOdds = 1;
            
            accumulatorSlip.forEach((item, index) => {
                totalOdds *= item.odds;
                itemsHtml += `
                    <div class="cart-item">
                        <div class="cart-item-match">${escapeHtml(item.matchName)}</div>
                        <div class="cart-item-bet">${escapeHtml(item.betTypeName)}</div>
                        <div class="cart-item-odds">Odds: ${item.odds.toFixed(2)}</div>
                        <button class="cart-remove" onclick="removeFromSlip(${index})"><i class="fas fa-trash-alt"></i></button>
                    </div>
                `;
            });
            
            cartItemsContainer.innerHTML = itemsHtml;
            cartTotalOdds.textContent = totalOdds.toFixed(2);
            
            const stake = parseFloat(stakeInput.value) || 0;
            const potential = stake * totalOdds;
            document.getElementById('cart-potential').textContent = `$${potential.toFixed(2)}`;
            
            cartPlaceBtn.disabled = accumulatorSlip.length < 2;
            cartPlaceBtn.textContent = accumulatorSlip.length < 2 ? `Add ${2 - accumulatorSlip.length} more selection(s)` : 'Place Accumulator Bet';
        }
        
        function addToSlip(fixtureId, betType, odds, homeTeam, awayTeam) {
            if (!betType) {
                const selectedType = prompt('Select bet type:\n1 - Home Win\n2 - Draw\n3 - Away Win', '1');
                if (selectedType === '1') {
                    betType = 'home';
                    const match = liveMatches.find(m => m.fixture_id == fixtureId);
                    odds = match?.odds?.home || 2.50;
                } else if (selectedType === '2') {
                    betType = 'draw';
                    const match = liveMatches.find(m => m.fixture_id == fixtureId);
                    odds = match?.odds?.draw || 3.20;
                } else if (selectedType === '3') {
                    betType = 'away';
                    const match = liveMatches.find(m => m.fixture_id == fixtureId);
                    odds = match?.odds?.away || 2.80;
                } else {
                    showNotification('Invalid selection', 'error');
                    return;
                }
            }
            
            const match = liveMatches.find(m => m.fixture_id == fixtureId);
            if (!match) return;
            
            let betTypeName = '';
            if (betType === 'home') betTypeName = `${homeTeam} to win`;
            else if (betType === 'draw') betTypeName = 'Draw';
            else if (betType === 'away') betTypeName = `${awayTeam} to win`;
            
            const existingIndex = accumulatorSlip.findIndex(s => s.fixtureId === fixtureId && s.betType === betType);
            if (existingIndex !== -1) {
                showNotification(`Already in slip: ${betTypeName}`, 'error');
                return;
            }
            
            accumulatorSlip.push({
                fixtureId: fixtureId,
                matchName: `${homeTeam} vs ${awayTeam}`,
                betType: betType,
                betTypeName: betTypeName,
                odds: parseFloat(odds)
            });
            
            updateCartUI();
            showNotification(`Added to slip: ${betTypeName} @ ${odds}`);
        }
        
        function removeFromSlip(index) {
            accumulatorSlip.splice(index, 1);
            updateCartUI();
        }
        
        // ===== FIXED: PLACE ACCUMULATOR BET (fixture_id: 0, NOT null) =====
        async function placeAccumulatorBet() {
            if (accumulatorSlip.length < 2) {
                showNotification(`Add at least 2 selections (currently ${accumulatorSlip.length})`, 'error');
                return;
            }
            
            const stake = parseFloat(document.getElementById('cart-stake').value);
            if (!stake || stake < 1) {
                showNotification('Please enter a valid stake amount (minimum $1)', 'error');
                return;
            }
            
            const user = auth.currentUser;
            if (!user) {
                showNotification('Please login', 'error');
                window.location.href = '../login.html';
                return;
            }
            
            const balance = await loadBalance();
            if (stake > balance) {
                showNotification(`Insufficient balance! Your balance: $${balance.toFixed(2)}`, 'error');
                return;
            }
            
            let totalOdds = 1;
            accumulatorSlip.forEach(s => totalOdds *= s.odds);
            const potentialWin = stake * totalOdds;
            
            if (!confirm(`Place accumulator bet?\nSelections: ${accumulatorSlip.length}\nTotal Odds: ${totalOdds.toFixed(2)}\nStake: $${stake.toFixed(2)}\nPotential Win: $${potentialWin.toFixed(2)}`)) {
                return;
            }
            
            const btn = document.getElementById('cart-place-btn');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<div class="loading-spinner"></div> Processing...';
            
            try {
                const betId = `${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
                
                // ✅ FIXED: Use fixture_id: 0 instead of null
                const bet = {
                    id: betId,
                    user_id: user.uid,
                    fixture_id: 0,  // ← FIXED: 0 indicates accumulator bet
                    bet_type: 'accumulator',
                    bet_name: `${accumulatorSlip.length}-fold Accumulator`,
                    odds: totalOdds,
                    amount: stake,
                    potential_win: potentialWin,
                    status: 'active',
                    placed_at: new Date().toISOString(),
                    selections: accumulatorSlip
                };
                
                const { error } = await supabaseClient.from('bets').insert(bet);
                if (error) throw new Error(error.message);
                
                await updateWalletBalance(user.uid, -stake);
                
                showNotification(`✅ Accumulator bet placed! Potential win: $${potentialWin.toFixed(2)}`, 'success');
                
                accumulatorSlip = [];
                updateCartUI();
                toggleCart();
                await loadBalance();
                
                setTimeout(() => {
                    if (confirm('View your active bets?')) {
                        window.location.href = 'my-bets.html';
                    }
                }, 1000);
                
            } catch(e) {
                console.error('Bet error:', e);
                showNotification(`Failed to place bet: ${e.message}`, 'error');
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        }
        
        document.getElementById('cart-stake')?.addEventListener('input', () => updateCartUI());
        
        // ===== TEAM DETAILS =====
        async function fetchTeamDetails(teamId, teamName) {
            if (teamCache[teamId]) return teamCache[teamId];
            
            try {
                const response = await fetch(`${API_BASE}/api/team/${teamId}`);
                const data = await response.json();
                if (data.success && data.data) {
                    const teamInfo = {
                        name: teamName,
                        stadium: data.data.venue?.name || 'Unknown Stadium',
                        city: data.data.venue?.city || 'Unknown City',
                        capacity: data.data.venue?.capacity || 'N/A',
                        players: data.data.players || [],
                        coach: data.data.coach?.name || 'Unknown'
                    };
                    teamCache[teamId] = teamInfo;
                    return teamInfo;
                }
            } catch(e) {
                console.error('Error fetching team details:', e);
            }
            
            return {
                name: teamName,
                stadium: 'Information not available',
                city: 'N/A',
                capacity: 'N/A',
                players: [],
                coach: 'Unknown'
            };
        }
        
        async function showTeamDetails(teamId, teamName) {
            const teamInfo = await fetchTeamDetails(teamId, teamName);
            const modal = document.getElementById('team-modal');
            const modalBody = document.getElementById('modal-team-details');
            const modalTitle = document.getElementById('modal-team-name');
            
            modalTitle.innerHTML = `<i class="fas fa-shield-alt"></i> ${escapeHtml(teamInfo.name)}`;
            
            let playersHtml = '<div class="player-list">';
            if (teamInfo.players && teamInfo.players.length > 0) {
                teamInfo.players.slice(0, 20).forEach(player => {
                    playersHtml += `
                        <div class="player-item">
                            <span class="player-number">${player.number || '?'}</span>
                            <span class="player-name">${escapeHtml(player.name)}</span>
                            <span class="player-position">${player.position || 'N/A'}</span>
                        </div>
                    `;
                });
            } else {
                playersHtml += '<div class="player-item">Player information not available</div>';
            }
            playersHtml += '</div>';
            
            modalBody.innerHTML = `
                <div style="margin-bottom: 15px;">
                    <h4><i class="fas fa-info-circle"></i> Stadium Information</h4>
                    <div style="margin-top: 10px;">
                        <div><strong>Stadium:</strong> ${escapeHtml(teamInfo.stadium)}</div>
                        <div><strong>City:</strong> ${escapeHtml(teamInfo.city)}</div>
                        <div><strong>Capacity:</strong> ${teamInfo.capacity}</div>
                        <div><strong>Head Coach:</strong> ${escapeHtml(teamInfo.coach)}</div>
                    </div>
                </div>
                <div>
                    <h4><i class="fas fa-users"></i> Squad (${teamInfo.players.length} players)</h4>
                    <div style="max-height: 300px; overflow-y: auto; margin-top: 10px;">
                        ${playersHtml}
                    </div>
                </div>
            `;
            
            modal.classList.add('show');
        }
        
        function closeTeamModal(event) {
            if (!event || event.target === document.getElementById('team-modal')) {
                document.getElementById('team-modal').classList.remove('show');
            }
        }
        
        // ===== FETCH LIVE MATCHES =====
        async function loadLiveMatches() {
            try {
                document.getElementById('debug-text').innerHTML = '<div class="loading-spinner"></div> Loading live matches...';
                
                const response = await fetch(`${API_BASE}/api/livescores`);
                const data = await response.json();
                
                console.log(`🔴 API returned ${data.count || 0} live matches`);
                
                if (!data.success || !data.data || data.data.length === 0) {
                    document.getElementById('matches-container').style.display = 'none';
                    document.getElementById('empty-state').style.display = 'block';
                    document.getElementById('debug-text').innerHTML = 'No live matches currently';
                    document.getElementById('match-count').textContent = '0';
                    document.getElementById('live-count').textContent = '0';
                    liveMatches = [];
                    return;
                }
                
                const now = new Date();
                const processedMatches = [];
                
                for (const match of data.data) {
                    const startTime = new Date(match.fixture.date);
                    let elapsed = match.fixture.elapsed || Math.floor((now - startTime) / 60000);
                    if (elapsed < 0) elapsed = 0;
                    
                    const statusShort = match.fixture.status?.short;
                    const isLive = statusShort === '1H' || statusShort === '2H' || statusShort === 'HT';
                    
                    if (isLive) {
                        const isBettingClosed = elapsed >= BETTING_CLOSE_MINUTE;
                        
                        processedMatches.push({
                            fixture_id: match.fixture.id,
                            start_time: match.fixture.date,
                            status: 'live',
                            elapsed: elapsed,
                            is_betting_closed: isBettingClosed,
                            league_id: match.league.id,
                            league_name: match.league.name,
                            league_logo: match.league.logo,
                            home_team: {
                                id: match.teams.home.id,
                                name: match.teams.home.name,
                                logo: match.teams.home.logo
                            },
                            away_team: {
                                id: match.teams.away.id,
                                name: match.teams.away.name,
                                logo: match.teams.away.logo
                            },
                            score: {
                                home: match.goals?.home || 0,
                                away: match.goals?.away || 0
                            },
                            odds: {
                                home: (1.80 + ((match.fixture.id % 20) / 100)).toFixed(2),
                                draw: (3.20 + ((match.fixture.id % 15) / 100)).toFixed(2),
                                away: (2.80 + ((match.fixture.id % 25) / 100)).toFixed(2)
                            }
                        });
                    }
                }
                
                liveMatches = processedMatches;
                
                document.getElementById('match-count').textContent = liveMatches.length;
                document.getElementById('live-count').textContent = liveMatches.length;
                document.getElementById('debug-text').innerHTML = `🔴 ${liveMatches.length} live match(es) | Updates every 10s | Betting closes at ${BETTING_CLOSE_MINUTE}'`;
                
                if (liveMatches.length === 0) {
                    document.getElementById('matches-container').style.display = 'none';
                    document.getElementById('empty-state').style.display = 'block';
                    return;
                }
                
                document.getElementById('matches-container').style.display = 'block';
                document.getElementById('empty-state').style.display = 'none';
                
                filterMatches();
                
                for (const match of liveMatches) {
                    fetchMatchEvents(match.fixture_id);
                    fetchMatchStats(match.fixture_id);
                }
                
            } catch(e) {
                console.error('Load live matches error:', e);
                document.getElementById('debug-text').innerHTML = `❌ Error: ${e.message}`;
            }
        }
        
        async function fetchMatchEvents(fixtureId) {
            try {
                const response = await fetch(`${API_BASE}/api/fixtures/events/${fixtureId}`);
                const data = await response.json();
                const eventsDiv = document.getElementById(`events-${fixtureId}`);
                
                if (eventsDiv && data.success && data.data && data.data.length > 0) {
                    const goals = data.data.filter(e => e.type === 'Goal');
                    const yellows = data.data.filter(e => e.type === 'Card' && e.detail === 'Yellow Card');
                    const reds = data.data.filter(e => e.type === 'Card' && e.detail === 'Red Card');
                    const subs = data.data.filter(e => e.type === 'subst');
                    
                    let html = '';
                    if (goals.length) html += `<div class="event-row"><i class="fas fa-futbol event-goal"></i> ⚽ ${goals.slice(-3).map(g => `${g.player?.name || 'Player'} ${g.time?.elapsed}'`).join(', ')}</div>`;
                    if (yellows.length) html += `<div class="event-row"><i class="fas fa-square event-yellow"></i> 🟨 ${yellows.slice(-2).map(y => y.player?.name || 'Player').join(', ')}</div>`;
                    if (reds.length) html += `<div class="event-row"><i class="fas fa-square event-red"></i> 🟥 ${reds.map(r => r.player?.name || 'Player').join(', ')}</div>`;
                    if (subs.length) html += `<div class="event-row"><i class="fas fa-exchange-alt event-subs"></i> 🔄 ${subs.slice(-2).map(s => s.player?.name || 'Player').join(', ')}</div>`;
                    if (!html) html = '<div class="event-row"><span style="color:#a0a8c9;">No recent events</span></div>';
                    
                    eventsDiv.innerHTML = html;
                } else if (eventsDiv) {
                    eventsDiv.innerHTML = '<div class="event-row"><span style="color:#a0a8c9;">No events yet</span></div>';
                }
            } catch(e) {}
        }
        
        async function fetchMatchStats(fixtureId) {
            try {
                const response = await fetch(`${API_BASE}/api/fixtures/statistics/${fixtureId}`);
                const data = await response.json();
                const statsDiv = document.getElementById(`stats-${fixtureId}`);
                
                if (statsDiv && data.success && data.data && data.data[0]) {
                    const stats = data.data[0]?.statistics || [];
                    const possession = stats.find(s => s.type === 'Ball Possession')?.value || '50%';
                    const shots = stats.find(s => s.type === 'Total Shots')?.value || '0';
                    const shotsOnTarget = stats.find(s => s.type === 'Shots on Goal')?.value || '0';
                    const corners = stats.find(s => s.type === 'Corner Kicks')?.value || '0';
                    
                    statsDiv.innerHTML = `
                        <div class="stat-item"><div class="stat-value">${possession}</div><div class="stat-label">Possession</div></div>
                        <div class="stat-item"><div class="stat-value">${shots}</div><div class="stat-label">Shots</div></div>
                        <div class="stat-item"><div class="stat-value">${shotsOnTarget}</div><div class="stat-label">On Target</div></div>
                        <div class="stat-item"><div class="stat-value">${corners}</div><div class="stat-label">Corners</div></div>
                    `;
                }
            } catch(e) {}
        }
        
        function filterMatches() {
            const search = document.getElementById('search-input').value.toLowerCase();
            let filtered = [...liveMatches];
            
            if (selectedLeague !== 'all') {
                filtered = filtered.filter(m => m.league_id == selectedLeague);
            }
            
            if (search) {
                filtered = filtered.filter(m => 
                    (m.home_team?.name || '').toLowerCase().includes(search) || 
                    (m.away_team?.name || '').toLowerCase().includes(search) || 
                    (m.league_name || '').toLowerCase().includes(search)
                );
            }
            
            if (filtered.length === 0) {
                document.getElementById('matches-container').innerHTML = '<div class="empty-state">No live matches match your filters</div>';
                return;
            }
            
            const groupedByLeague = {};
            filtered.forEach(m => {
                const ln = m.league_name || 'Other Leagues';
                if (!groupedByLeague[ln]) groupedByLeague[ln] = [];
                groupedByLeague[ln].push(m);
            });
            
            let html = '';
            Object.keys(groupedByLeague).sort().forEach(leagueName => {
                const leagueMatches = groupedByLeague[leagueName];
                const leagueLogo = leagueMatches[0]?.league_logo || '';
                let matchesHtml = '';
                leagueMatches.forEach(m => { matchesHtml += createMatchCard(m); });
                html += `
                    <div class="league-group">
                        <div class="league-group-header" onclick="this.classList.toggle('collapsed');this.nextElementSibling.classList.toggle('collapsed');">
                            ${leagueLogo ? `<img class="league-logo" src="${leagueLogo}" onerror="this.style.display='none'">` : '<i class="fas fa-trophy"></i>'}
                            <span style="font-weight:600;">${escapeHtml(leagueName)}</span>
                            <span style="margin-left:auto; font-size:12px; color:#a0a8c9;">${leagueMatches.length} live</span>
                            <i class="fas fa-chevron-down"></i>
                        </div>
                        <div class="league-matches">${matchesHtml}</div>
                    </div>
                `;
            });
            document.getElementById('matches-container').innerHTML = html;
        }
        
        function createMatchCard(m) {
            const startTime = new Date(m.start_time);
            const elapsed = m.elapsed;
            
            let period = '';
            if (elapsed < 45) period = `1st Half ${elapsed}'`;
            else if (elapsed < 60) period = 'Half Time';
            else if (elapsed < 90) period = `2nd Half ${elapsed - 45}'`;
            else period = `Added Time ${elapsed - 90}'`;
            
            const isBettingOpen = !m.is_betting_closed && elapsed < BETTING_CLOSE_MINUTE;
            const remainingForBetting = Math.max(0, BETTING_CLOSE_MINUTE - elapsed);
            
            const homeTeam = m.home_team || { name: 'Home', logo: '', id: 0 };
            const awayTeam = m.away_team || { name: 'Away', logo: '', id: 0 };
            const scoreHome = m.score?.home || 0;
            const scoreAway = m.score?.away || 0;
            const leagueName = m.league_name || 'League';
            const leagueLogo = m.league_logo || '';
            const odds = m.odds || { home: 2.50, draw: 3.20, away: 2.80 };
            
            const fixtureId = m.fixture_id;
            const currentScore = `${scoreHome}-${scoreAway}`;
            const previousScore = previousScores[fixtureId];
            const scoreClass = (previousScore && previousScore !== currentScore) ? 'goal-animation' : '';
            previousScores[fixtureId] = currentScore;
            
            const bettingTimerHtml = isBettingOpen 
                ? `<div class="betting-timer">⏰ Betting Open for ${remainingForBetting} more minutes (closes at ${BETTING_CLOSE_MINUTE}')</div>`
                : `<div class="betting-timer closed">🔒 Betting Closed - Match at ${elapsed}' (closes at ${BETTING_CLOSE_MINUTE}')</div>`;
            
            return `
                <div class="match-card">
                    <div class="match-header-row">
                        <div class="match-league">
                            ${leagueLogo ? `<img class="league-logo" src="${leagueLogo}" onerror="this.style.display='none'">` : '<i class="fas fa-trophy"></i>'}
                            <span>${escapeHtml(leagueName)}</span>
                            <span class="live-tag"><i class="fas fa-circle"></i> LIVE</span>
                        </div>
                        <div class="match-minute">${period}</div>
                    </div>
                    <div class="match-info">
                        <span><i class="far fa-calendar-alt"></i> ${startTime.toLocaleDateString()}</span>
                        <span><i class="fas fa-hourglass-start"></i> KO: ${startTime.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>
                    </div>
                    <div class="teams-section">
                        <div class="team-block" onclick="event.stopPropagation();showTeamDetails(${homeTeam.id || 0}, '${escapeHtml(homeTeam.name)}')">
                            <img class="team-logo" src="${homeTeam.logo || 'https://placehold.co/60x60?text=' + (homeTeam.name || 'H').substring(0,2)}" onerror="this.src='https://placehold.co/60x60?text=' + encodeURIComponent((homeTeam.name || 'Home').substring(0,2))">
                            <div class="team-name">${escapeHtml(homeTeam.name)}</div>
                        </div>
                        <div class="score ${scoreClass}" id="score-${fixtureId}">${scoreHome} - ${scoreAway}</div>
                        <div class="team-block" onclick="event.stopPropagation();showTeamDetails(${awayTeam.id || 0}, '${escapeHtml(awayTeam.name)}')">
                            <img class="team-logo" src="${awayTeam.logo || 'https://placehold.co/60x60?text=' + (awayTeam.name || 'A').substring(0,2)}" onerror="this.src='https://placehold.co/60x60?text=' + encodeURIComponent((awayTeam.name || 'Away').substring(0,2))">
                            <div class="team-name">${escapeHtml(awayTeam.name)}</div>
                        </div>
                    </div>
                    ${bettingTimerHtml}
                    <div class="events-section" id="events-${fixtureId}">
                        <div class="event-row"><span style="color:#a0a8c9;">Loading events...</span></div>
                    </div>
                    <div class="stats-row" id="stats-${fixtureId}">
                        <div class="stat-item"><div class="stat-value">--</div><div class="stat-label">Possession</div></div>
                        <div class="stat-item"><div class="stat-value">--</div><div class="stat-label">Shots</div></div>
                        <div class="stat-item"><div class="stat-value">--</div><div class="stat-label">On Target</div></div>
                        <div class="stat-item"><div class="stat-value">--</div><div class="stat-label">Corners</div></div>
                    </div>
                    <div class="odds-preview">
                        <div class="odd-box" onclick="event.stopPropagation();addToSlip(${fixtureId}, 'home', ${odds.home}, '${escapeHtml(homeTeam.name)}', '${escapeHtml(awayTeam.name)}')">
                            <div class="label">1</div>
                            <div class="value">${odds.home}</div>
                        </div>
                        <div class="odd-box" onclick="event.stopPropagation();addToSlip(${fixtureId}, 'draw', ${odds.draw}, '${escapeHtml(homeTeam.name)}', '${escapeHtml(awayTeam.name)}')">
                            <div class="label">X</div>
                            <div class="value">${odds.draw}</div>
                        </div>
                        <div class="odd-box" onclick="event.stopPropagation();addToSlip(${fixtureId}, 'away', ${odds.away}, '${escapeHtml(homeTeam.name)}', '${escapeHtml(awayTeam.name)}')">
                            <div class="label">2</div>
                            <div class="value">${odds.away}</div>
                        </div>
                    </div>
                    <button class="place-bet-btn ${!isBettingOpen ? 'disabled' : ''}" onclick="event.stopPropagation();goToMatch(${fixtureId})">
                        <i class="fas fa-gavel"></i> ${isBettingOpen ? 'PLACE BET' : 'BETTING CLOSED'}
                    </button>
                </div>
            `;
        }
        
        function goToMatch(fixtureId) { 
            location.href = `match-details.html?id=${fixtureId}`; 
        }
        
        async function loadLeagues() {
            try {
                const res = await fetch(`${API_BASE}/api/leagues`);
                const data = await res.json();
                if (data.success && data.data) {
                    const select = document.getElementById('league-filter');
                    select.innerHTML = '<option value="all">🏆 All Leagues</option>';
                    data.data.slice(0, 30).forEach(league => {
                        const option = document.createElement('option');
                        option.value = league.id;
                        option.textContent = league.name;
                        select.appendChild(option);
                    });
                }
            } catch(e) { console.error(e); }
            document.getElementById('league-filter').onchange = (e) => { selectedLeague = e.target.value; filterMatches(); };
        }
        
        function startAutoRefresh() {
            if (refreshInterval) clearInterval(refreshInterval);
            if (eventInterval) clearInterval(eventInterval);
            
            refreshInterval = setInterval(() => { 
                loadLiveMatches(); 
                loadBalance(); 
            }, 10000);
            
            eventInterval = setInterval(() => { 
                for (const match of liveMatches) {
                    fetchMatchEvents(match.fixture_id);
                    fetchMatchStats(match.fixture_id);
                }
            }, 8000);
            
            console.log('🔄 Live matches auto-refresh active (every 10 seconds)');
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        function toggleLanguage() {
            const isArabic = document.body.classList.toggle('arabic');
            localStorage.setItem('lang', isArabic ? 'ar' : 'en');
            document.documentElement.dir = isArabic ? 'rtl' : 'ltr';
            document.querySelector('.lang-toggle').textContent = isArabic ? 'English' : 'عربي';
        }
        
        if (localStorage.getItem('lang') === 'ar') toggleLanguage();
        
        // ===== INITIALIZATION =====
        auth.onAuthStateChanged(async (user) => {
            if (!user) { 
                window.location.href = '../login.html';
                return;
            }
            
            await loadBalance();
            await loadLeagues();
            await loadLiveMatches();
            startAutoRefresh();
        });
        
        window.loadLiveMatches = loadLiveMatches;
        window.goToMatch = goToMatch;
        window.toggleLanguage = toggleLanguage;
        window.showTeamDetails = showTeamDetails;
        window.closeTeamModal = closeTeamModal;
        window.addToSlip = addToSlip;
        window.removeFromSlip = removeFromSlip;
        window.placeAccumulatorBet = placeAccumulatorBet;
        window.toggleCart = toggleCart;
        
        console.log('✅ Live matches page v2.0 loaded');
        console.log('   🔴 Shows ONLY live matches');
        console.log('   🛒 Click odds to add to accumulator cart');
        console.log('   🔒 Betting closes at 80 minutes');
        console.log('   ✅ Accumulator bets use fixture_id: 0 (fixed)');
    </script>
</body>
