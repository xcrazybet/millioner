<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live - X Lodon | مباشر</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0f1a; color: white; font-family: 'Segoe UI', 'Tajawal', sans-serif; min-height: 100vh; }
        .header { background: #111827; padding: 12px 15px; border-bottom: 2px solid #ff5252; position: sticky; top: 0; z-index: 100; }
        .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; flex-wrap: wrap; gap: 10px; }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .back-btn { color: #00ff9d; text-decoration: none; font-size: 20px; }
        .lang-toggle { background: #1a2332; border: 1px solid #00ff9d; color: #00ff9d; padding: 5px 12px; border-radius: 20px; cursor: pointer; }
        .tabs { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 3px; }
        .tab { padding: 8px 12px; background: #1a2332; border-radius: 20px; color: white; text-decoration: none; font-size: 12px; }
        .tab.active { background: #ff5252; color: white; }
        .container { max-width: 1400px; margin: 0 auto; padding: 15px; }
        .balance-bar { background: #111827; padding: 10px 15px; border-radius: 12px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; border: 1px solid #00ff9d33; }
        .balance-amount { color: #00ff9d; font-weight: bold; font-size: 18px; }
        .selector-bar { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .league-select, .search-input { padding: 12px; background: #111827; border: 1px solid #ffffff22; border-radius: 12px; color: white; font-size: 13px; }
        .league-select { flex: 1; min-width: 180px; }
        .search-input { flex: 2; min-width: 200px; }
        .debug-bar { background: #1a2332; padding: 8px 15px; border-radius: 8px; margin-bottom: 10px; font-size: 11px; color: #ff5252; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .refresh-btn { background: #00ff9d; color: black; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 11px; }
        .live-header { margin-bottom: 15px; }
        .live-badge { background: #ff5252; padding: 10px 20px; border-radius: 30px; font-weight: 600; display: inline-block; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.7; } }
        .match-card { background: #111827; border-radius: 16px; padding: 18px; margin-bottom: 15px; border: 1px solid #ff525233; cursor: pointer; transition: all 0.2s; position: relative; }
        .match-card:hover { transform: translateX(5px); background: #1a2332; }
        .match-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: #ff5252; animation: livePulse 1.5s infinite; border-radius: 16px 0 0 16px; }
        @keyframes livePulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
        .match-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
        .match-league { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #a0a8c9; }
        .league-logo { width: 20px; height: 20px; object-fit: contain; }
        .live-tag { background: #ff5252; padding: 2px 10px; border-radius: 15px; font-size: 10px; animation: blink 1s infinite; }
        @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
        .match-minute { background: #ff5252; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .match-minute.ht { background: #ff9800; }
        .match-minute.betting-closed { background: #a0a8c9; color: black; }
        .teams-section { display: flex; align-items: center; justify-content: space-around; margin: 15px 0; flex-wrap: wrap; gap: 15px; }
        .team-block { text-align: center; flex: 1; min-width: 100px; }
        .team-logo { width: 60px; height: 60px; margin: 0 auto 8px; object-fit: contain; background: rgba(255,255,255,0.08); border-radius: 50%; padding: 8px; }
        .team-name { font-weight: 600; font-size: 14px; }
        .score { font-size: 36px; font-weight: bold; letter-spacing: 4px; color: #ff5252; }
        .score.goal-animation { animation: goalFlash 0.5s ease; }
        @keyframes goalFlash { 0% { color: #ff9800; text-shadow: 0 0 10px #ff9800; transform: scale(1.1); } 100% { color: #ff5252; transform: scale(1); } }
        .match-info { display: flex; justify-content: center; gap: 20px; margin: 10px 0; font-size: 11px; color: #a0a8c9; flex-wrap: wrap; }
        .events-section { margin-top: 12px; padding-top: 12px; border-top: 1px solid #ffffff11; font-size: 12px; max-height: 80px; overflow-y: auto; }
        .event-row { padding: 4px 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .event-goal { color: #ff9800; }
        .event-yellow { color: #ffc107; }
        .event-red { color: #ff5252; }
        .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 12px; padding-top: 12px; border-top: 1px solid #ffffff11; text-align: center; }
        .stat-label { font-size: 10px; color: #a0a8c9; }
        .stat-value { font-size: 14px; font-weight: bold; color: #00ff9d; }
        .odds-preview { display: flex; gap: 10px; justify-content: center; margin-top: 15px; padding-top: 15px; border-top: 1px solid #ffffff11; }
        .odd-box { text-align: center; padding: 6px 12px; background: #0a0f1a; border-radius: 8px; }
        .odd-box .label { font-size: 10px; color: #a0a8c9; }
        .odd-box .value { font-size: 16px; font-weight: bold; color: #00ff9d; }
        .bet-open-btn { width: 100%; margin-top: 15px; padding: 10px; background: #00ff9d; color: black; border: none; border-radius: 25px; font-weight: bold; cursor: pointer; transition: all 0.2s; }
        .bet-open-btn:hover { background: #00cc7d; transform: scale(1.02); }
        .bet-closed-btn { width: 100%; margin-top: 15px; padding: 10px; background: #a0a8c9; color: #333; border: none; border-radius: 25px; font-weight: bold; cursor: not-allowed; }
        .bet-closed-warning { background: #ff525233; color: #ff5252; border: 1px solid #ff5252; }
        .countdown-timer { font-size: 11px; text-align: center; margin-top: 10px; padding: 5px; border-radius: 8px; background: #1a2332; }
        .countdown-warning { background: #ff525222; color: #ff5252; }
        .settlement-badge { font-size: 10px; background: #4caf50; color: white; padding: 2px 8px; border-radius: 12px; margin-left: 8px; }
        .empty-state { text-align: center; padding: 60px; color: #a0a8c9; }
        .loading-spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid #ff5252; border-top-color: transparent; border-radius: 50%; animation: spin 0.6s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 600px) {
            .team-logo { width: 45px; height: 45px; }
            .score { font-size: 28px; letter-spacing: 2px; }
            .team-name { font-size: 12px; }
            .match-info { flex-direction: column; align-items: center; gap: 5px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-top">
            <div class="header-left">
                <a href="betting-sport.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
                <h1 style="font-size:18px;"><i class="fas fa-futbol"></i> X Lodon Sports</h1>
            </div>
            <button class="lang-toggle" onclick="toggleLanguage()">عربي</button>
        </div>
        <div class="tabs">
            <a href="betting-sport.html" class="tab">Home</a>
            <a href="live-matches.html" class="tab active">Live</a>
            <a href="upcoming-matches.html" class="tab">Upcoming</a>
            <a href="finished-matches.html" class="tab">Results</a>
            <a href="my-bets.html" class="tab">My Bets</a>
        </div>
    </div>
    
    <div class="container">
        <div class="balance-bar">
            <span><i class="fas fa-wallet"></i> Balance</span>
            <span class="balance-amount" id="balance-display">$0.00</span>
        </div>
        
        <div class="selector-bar">
            <select id="league-filter" class="league-select"><option value="all">🏆 All Leagues</option></select>
            <input type="text" id="search-input" class="search-input" placeholder="🔍 Search team or league..." oninput="filterMatches()">
        </div>
        
        <div class="debug-bar">
            <i class="fas fa-play-circle"></i> <span id="debug-text">Loading live matches...</span>
            <button class="refresh-btn" onclick="loadLiveMatches()"><i class="fas fa-sync-alt"></i> Refresh</button>
        </div>
        
        <div class="live-header">
            <span class="live-badge"><i class="fas fa-circle"></i> LIVE MATCHES <span id="match-count">0</span></span>
        </div>
        
        <div id="matches-container"><div style="text-align:center;padding:50px;"><div class="loading-spinner"></div> Loading live matches...</div></div>
        <div id="empty-state" class="empty-state" style="display:none;">
            <i class="fas fa-futbol" style="font-size:48px; opacity:0.3;"></i>
            <p>No live matches at the moment</p>
            <button onclick="location.href='upcoming-matches.html'" style="margin-top:15px;padding:10px 20px;background:#ff9800;color:black;border:none;border-radius:8px;cursor:pointer;">View Upcoming Matches</button>
        </div>
    </div>

    <script src="../js/supabase-client.js"></script>
    <script src="../js/sports-api.js"></script>
    <script src="../js/betting-engine.js"></script>
    <script>
        let liveMatches = [];
        let refreshInterval = null;
        let eventInterval = null;
        let settlementInterval = null;
        let selectedLeague = 'all';
        let previousScores = {};
        
        const API_BASE = 'https://millioner.onrender.com';
        const BETTING_CLOSE_MINUTE = 80; // 🔥 Betting closes at 80th minute
        const MATCH_DURATION = 105; // 90 min + 15 min halftime + stoppage time
        
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        
        function toggleLanguage() {
            const isArabic = document.body.classList.toggle('arabic');
            localStorage.setItem('lang', isArabic ? 'ar' : 'en');
            document.documentElement.dir = isArabic ? 'rtl' : 'ltr';
        }
        if (localStorage.getItem('lang') === 'ar') toggleLanguage();
        
        firebase.auth().onAuthStateChanged(async (u) => {
            if (!u) { location.href = '../login.html'; }
            else {
                await loadBalance();
                await loadLeagues();
                await loadLiveMatches();
                startAutoRefresh();
            }
        });
        
        async function loadBalance() {
            try {
                const db = firebase.firestore();
                const doc = await db.collection('wallets').doc(firebase.auth().currentUser.uid).get();
                document.getElementById('balance-display').textContent = `$${(doc.exists ? (doc.data().balance || 0) : 0).toFixed(2)}`;
            } catch(e) { console.error(e); }
        }
        
        async function loadLeagues() {
            try {
                const res = await fetch(`${API_BASE}/api/leagues`);
                const data = await res.json();
                if (data.success && data.data) {
                    const select = document.getElementById('league-filter');
                    data.data.slice(0, 30).forEach(league => {
                        const option = document.createElement('option');
                        option.value = league.id;
                        option.textContent = league.name;
                        select.appendChild(option);
                    });
                }
            } catch(e) { console.error(e); }
            document.getElementById('league-filter').onchange = (e) => { selectedLeague = e.target.value; filterMatches(); };
        }
        
        // 🔥 FETCH LIVE MATCHES AND CHECK FOR FINISHED MATCHES
        async function loadLiveMatches() {
            try {
                document.getElementById('debug-text').innerHTML = '<div class="loading-spinner"></div> Loading live matches...';
                
                const response = await fetch(`${API_BASE}/api/livescores`);
                const data = await response.json();
                
                console.log(`🔴 API returned ${data.count || 0} live matches`);
                
                if (!data.success || !data.data || data.data.length === 0) {
                    document.getElementById('matches-container').style.display = 'none';
                    document.getElementById('empty-state').style.display = 'block';
                    document.getElementById('debug-text').innerHTML = 'No live matches currently';
                    document.getElementById('match-count').textContent = '0';
                    liveMatches = [];
                    return;
                }
                
                // Process live matches with elapsed time
                const now = new Date();
                const processedMatches = [];
                
                for (const match of data.data) {
                    const startTime = new Date(match.fixture.date);
                    let elapsed = match.fixture.elapsed || Math.floor((now - startTime) / 60000);
                    if (elapsed < 0) elapsed = 0;
                    
                    // 🔥 Check if match is finished (elapsed > 105 minutes)
                    const isFinished = elapsed > MATCH_DURATION;
                    
                    // If finished, trigger settlement
                    if (isFinished) {
                        console.log(`🏁 Match ${match.fixture.id} is finished (${elapsed}'), triggering settlement...`);
                        await triggerMatchSettlement(match.fixture.id, match.goals);
                        continue; // Skip adding to live matches
                    }
                    
                    // Check if betting is closed (elapsed >= 80 minutes)
                    const isBettingClosed = elapsed >= BETTING_CLOSE_MINUTE;
                    
                    processedMatches.push({
                        fixture_id: match.fixture.id,
                        start_time: match.fixture.date,
                        status: 'live',
                        elapsed: elapsed,
                        is_betting_closed: isBettingClosed,
                        league_id: match.league.id,
                        league_name: match.league.name,
                        league_logo: match.league.logo,
                        home_team: {
                            id: match.teams.home.id,
                            name: match.teams.home.name,
                            logo: match.teams.home.logo
                        },
                        away_team: {
                            id: match.teams.away.id,
                            name: match.teams.away.name,
                            logo: match.teams.away.logo
                        },
                        score: {
                            home: match.goals?.home || 0,
                            away: match.goals?.away || 0
                        },
                        odds: {
                            home: (1.80 + ((match.fixture.id % 20) / 100)).toFixed(2),
                            draw: (3.20 + ((match.fixture.id % 15) / 100)).toFixed(2),
                            away: (2.80 + ((match.fixture.id % 25) / 100)).toFixed(2)
                        }
                    });
                }
                
                liveMatches = processedMatches;
                
                document.getElementById('match-count').textContent = liveMatches.length;
                document.getElementById('debug-text').innerHTML = `🔴 ${liveMatches.length} live match(es) | Betting closes at ${BETTING_CLOSE_MINUTE}' | Auto-settlement active`;
                
                if (liveMatches.length === 0) {
                    document.getElementById('matches-container').style.display = 'none';
                    document.getElementById('empty-state').style.display = 'block';
                    return;
                }
                
                document.getElementById('matches-container').style.display = 'block';
                document.getElementById('empty-state').style.display = 'none';
                
                filterMatches();
                
                // Fetch events for each live match
                for (const match of liveMatches) {
                    fetchMatchEvents(match.fixture_id);
                }
                
            } catch(e) {
                console.error('Load live matches error:', e);
                document.getElementById('debug-text').innerHTML = `❌ Error: ${e.message}`;
            }
        }
        
        // 🔥 TRIGGER MATCH SETTLEMENT
        async function triggerMatchSettlement(fixtureId, goals) {
            console.log(`💰 Settling match ${fixtureId}...`);
            
            const homeScore = goals?.home || 0;
            const awayScore = goals?.away || 0;
            const result = homeScore > awayScore ? 'home' : (homeScore < awayScore ? 'away' : 'draw');
            
            // Update match status in Supabase
            const { error } = await supabaseClient
                .from('sports_matches')
                .update({ 
                    status: 'finished', 
                    result: result,
                    score: { home: homeScore, away: awayScore },
                    updated_at: new Date().toISOString(),
                    bets_settled: true
                })
                .eq('fixture_id', fixtureId);
            
            if (error) {
                console.error(`❌ Failed to update match ${fixtureId}:`, error);
                return;
            }
            
            console.log(`✅ Match ${fixtureId} updated to finished. Result: ${result} (${homeScore}-${awayScore})`);
            
            // Call settlement function from sports-api.js
            if (typeof settleMatchBets === 'function') {
                await settleMatchBets(fixtureId, result);
            } else {
                console.warn('settleMatchBets function not available');
            }
        }
        
        function filterMatches() {
            const search = document.getElementById('search-input').value.toLowerCase();
            let filtered = [...liveMatches];
            
            if (selectedLeague !== 'all') {
                filtered = filtered.filter(m => m.league_id == selectedLeague);
            }
            
            if (search) {
                filtered = filtered.filter(m => 
                    (m.home_team?.name || '').toLowerCase().includes(search) || 
                    (m.away_team?.name || '').toLowerCase().includes(search) || 
                    (m.league_name || '').toLowerCase().includes(search)
                );
            }
            
            if (filtered.length === 0) {
                document.getElementById('matches-container').innerHTML = '<div class="empty-state">No live matches match your filters</div>';
                return;
            }
            
            // Group by league
            const groupedByLeague = {};
            filtered.forEach(m => {
                const ln = m.league_name || 'Other Leagues';
                if (!groupedByLeague[ln]) groupedByLeague[ln] = [];
                groupedByLeague[ln].push(m);
            });
            
            let html = '';
            Object.keys(groupedByLeague).sort().forEach(leagueName => {
                const leagueMatches = groupedByLeague[leagueName];
                const leagueLogo = leagueMatches[0]?.league_logo || '';
                let matchesHtml = '';
                leagueMatches.forEach(m => { matchesHtml += createMatchCard(m); });
                html += `
                    <div class="league-group">
                        <div class="league-group-header" style="background:#1a2332; padding:10px 15px; border-radius:12px; margin-bottom:10px; display:flex; align-items:center; gap:10px;">
                            ${leagueLogo ? `<img src="${leagueLogo}" style="width:24px;height:24px;object-fit:contain;" onerror="this.style.display='none'">` : '<i class="fas fa-trophy"></i>'}
                            <span style="font-weight:600;">${escapeHtml(leagueName)}</span>
                            <span style="margin-left:auto; font-size:12px; color:#a0a8c9;">${leagueMatches.length} live</span>
                        </div>
                        <div>${matchesHtml}</div>
                    </div>
                `;
            });
            document.getElementById('matches-container').innerHTML = html;
        }
        
        function createMatchCard(m) {
            const startTime = new Date(m.start_time);
            const elapsed = m.elapsed;
            
            let period = '';
            let periodClass = '';
            let bettingStatus = '';
            
            if (elapsed < 45) { period = '1st Half'; periodClass = ''; }
            else if (elapsed < 60) { period = 'Half Time'; periodClass = 'ht'; }
            else if (elapsed < 90) { period = '2nd Half'; periodClass = ''; }
            else { period = 'Added Time'; periodClass = ''; }
            
            // 🔥 Betting status
            const isBettingOpen = !m.is_betting_closed && elapsed < BETTING_CLOSE_MINUTE;
            const remainingForBetting = Math.max(0, BETTING_CLOSE_MINUTE - elapsed);
            
            const homeTeam = m.home_team || { name: 'Home', logo: '' };
            const awayTeam = m.away_team || { name: 'Away', logo: '' };
            const scoreHome = m.score?.home || 0;
            const scoreAway = m.score?.away || 0;
            const leagueName = m.league_name || 'League';
            const leagueLogo = m.league_logo || '';
            const odds = m.odds || { home: 2.50, draw: 3.20, away: 2.80 };
            const matchDate = startTime.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
            
            const fixtureId = m.fixture_id;
            const currentScore = `${scoreHome}-${scoreAway}`;
            const previousScore = previousScores[fixtureId];
            const scoreClass = (previousScore && previousScore !== currentScore) ? 'goal-animation' : '';
            previousScores[fixtureId] = currentScore;
            
            const endTime = new Date(startTime.getTime() + MATCH_DURATION * 60000);
            const remainingMinutes = Math.max(0, MATCH_DURATION - elapsed);
            
            // Betting button based on status
            let buttonHtml = '';
            if (!isBettingOpen) {
                if (elapsed >= BETTING_CLOSE_MINUTE) {
                    buttonHtml = `<button class="bet-closed-btn" disabled><i class="fas fa-ban"></i> Betting Closed (${elapsed}' - After ${BETTING_CLOSE_MINUTE}')</button>`;
                } else {
                    buttonHtml = `<button class="bet-closed-btn bet-closed-warning" disabled><i class="fas fa-hourglass-end"></i> Betting Closes at ${BETTING_CLOSE_MINUTE}' (${remainingForBetting} min left)</button>`;
                }
            } else {
                buttonHtml = `<button class="bet-open-btn" onclick="event.stopPropagation();goToMatch(${fixtureId})"><i class="fas fa-gavel"></i> Place Bet Now (${remainingForBetting} min left)</button>`;
            }
            
            // Countdown display
            let countdownHtml = '';
            if (elapsed >= BETTING_CLOSE_MINUTE && elapsed < MATCH_DURATION) {
                countdownHtml = `<div class="countdown-timer countdown-warning">⚠️ Betting Closed - Match in progress (${elapsed}')</div>`;
            } else if (elapsed < BETTING_CLOSE_MINUTE) {
                countdownHtml = `<div class="countdown-timer">⏰ Betting open for ${remainingForBetting} more minutes</div>`;
            }
            
            return `
                <div class="match-card" onclick="goToMatch(${fixtureId})">
                    <div class="match-header-row">
                        <div class="match-league">
                            ${leagueLogo ? `<img class="league-logo" src="${leagueLogo}" onerror="this.style.display='none'">` : '<i class="fas fa-trophy"></i>'}
                            <span>${escapeHtml(leagueName)}</span>
                            <span class="live-tag"><i class="fas fa-circle"></i> LIVE</span>
                        </div>
                        <div class="match-minute ${periodClass}">${period} ${elapsed}'</div>
                    </div>
                    <div class="match-info">
                        <span><i class="far fa-calendar-alt"></i> ${matchDate}</span>
                        <span><i class="fas fa-hourglass-start"></i> ${startTime.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>
                        <span><i class="fas fa-hourglass-end"></i> ~${endTime.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>
                    </div>
                    <div class="teams-section">
                        <div class="team-block">
                            <img class="team-logo" src="${homeTeam.logo || 'https://via.placeholder.com/60?text=?'}" onerror="this.src='https://via.placeholder.com/60?text=${escapeHtml(homeTeam.name.substring(0,2))}'">
                            <div class="team-name">${escapeHtml(homeTeam.name)}</div>
                        </div>
                        <div class="score ${scoreClass}" id="score-${fixtureId}">${scoreHome} - ${scoreAway}</div>
                        <div class="team-block">
                            <img class="team-logo" src="${awayTeam.logo || 'https://via.placeholder.com/60?text=?'}" onerror="this.src='https://via.placeholder.com/60?text=${escapeHtml(awayTeam.name.substring(0,2))}'">
                            <div class="team-name">${escapeHtml(awayTeam.name)}</div>
                        </div>
                    </div>
                    ${countdownHtml}
                    <div class="events-section" id="events-${fixtureId}">
                        <div class="event-row"><span style="color:#a0a8c9;">Loading events...</span></div>
                    </div>
                    <div class="stats-row">
                        <div class="stat-item"><div class="stat-value">${period}</div><div class="stat-label">Period</div></div>
                        <div class="stat-item"><div class="stat-value">${elapsed}'</div><div class="stat-label">Elapsed</div></div>
                        <div class="stat-item"><div class="stat-value">${remainingMinutes}'</div><div class="stat-label">Remaining</div></div>
                        <div class="stat-item"><div class="stat-value">${startTime.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</div><div class="stat-label">Kickoff</div></div>
                    </div>
                    <div class="odds-preview">
                        <div class="odd-box"><div class="label">1</div><div class="value">${odds.home}</div></div>
                        <div class="odd-box"><div class="label">X</div><div class="value">${odds.draw}</div></div>
                        <div class="odd-box"><div class="label">2</div><div class="value">${odds.away}</div></div>
                    </div>
                    ${buttonHtml}
                </div>
            `;
        }
        
        async function fetchMatchEvents(fixtureId) {
            try {
                const response = await fetch(`${API_BASE}/api/fixtures/events/${fixtureId}`);
                const data = await response.json();
                const eventsDiv = document.getElementById(`events-${fixtureId}`);
                if (eventsDiv && data.success && data.data && data.data.length > 0) {
                    const goals = data.data.filter(e => e.type === 'Goal');
                    const yellows = data.data.filter(e => e.type === 'Card' && e.detail === 'Yellow Card');
                    const reds = data.data.filter(e => e.type === 'Card' && e.detail === 'Red Card');
                    let html = '';
                    if (goals.length) html += `<div class="event-row"><i class="fas fa-futbol event-goal"></i> ⚽ ${goals.map(g => `${g.player?.name || 'Player'} ${g.time?.elapsed}'`).join(', ')}</div>`;
                    if (yellows.length) html += `<div class="event-row"><i class="fas fa-square event-yellow"></i> 🟨 ${yellows.map(y => y.player?.name || 'Player').join(', ')}</div>`;
                    if (reds.length) html += `<div class="event-row"><i class="fas fa-square event-red"></i> 🟥 ${reds.map(r => r.player?.name || 'Player').join(', ')}</div>`;
                    if (!html) html = '<div class="event-row"><span style="color:#a0a8c9;">No recent events</span></div>';
                    eventsDiv.innerHTML = html;
                }
            } catch(e) {}
        }
        
        function goToMatch(fixtureId) { 
            location.href = `match-details.html?id=${fixtureId}`; 
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        function startAutoRefresh() {
            if (refreshInterval) clearInterval(refreshInterval);
            if (eventInterval) clearInterval(eventInterval);
            if (settlementInterval) clearInterval(settlementInterval);
            
            // Refresh matches every 10 seconds (faster for live)
            refreshInterval = setInterval(() => { 
                loadLiveMatches(); 
                loadBalance(); 
            }, 10000);
            
            // Refresh events every 8 seconds
            eventInterval = setInterval(() => { 
                for (const match of liveMatches) {
                    fetchMatchEvents(match.fixture_id);
                }
            }, 8000);
            
            // Check for settlements every 15 seconds
            settlementInterval = setInterval(() => {
                for (const match of liveMatches) {
                    if (match.elapsed >= MATCH_DURATION) {
                        triggerMatchSettlement(match.fixture_id, match.score);
                    }
                }
            }, 15000);
            
            console.log('🔄 Live matches auto-refresh active (every 10 seconds)');
            console.log(`🔒 Betting closes at ${BETTING_CLOSE_MINUTE} minutes`);
            console.log(`💰 Auto-settlement when matches end`);
        }
        
        window.loadLiveMatches = loadLiveMatches;
        window.goToMatch = goToMatch;
        window.toggleLanguage = toggleLanguage;
        
        console.log('✅ Live matches page ready - Betting closes at 80th minute, auto-settlement active');
    </script>
</body>
</html>
