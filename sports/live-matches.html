<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live - X Lodon | مباشر</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <link rel="stylesheet" href="../css/sports-betting.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0f1a; color: white; font-family: 'Segoe UI', 'Tajawal', sans-serif; min-height: 100vh; }
        .header { background: #111827; padding: 12px 15px; border-bottom: 2px solid #ff5252; position: sticky; top: 0; z-index: 100; }
        .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .back-btn { color: #00ff9d; text-decoration: none; font-size: 20px; }
        .lang-toggle { background: #1a2332; border: 1px solid #00ff9d; color: #00ff9d; padding: 5px 12px; border-radius: 20px; cursor: pointer; }
        .tabs { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 3px; }
        .tab { padding: 8px 12px; background: #1a2332; border-radius: 20px; color: white; text-decoration: none; font-size: 12px; }
        .tab.active { background: #ff5252; color: white; }
        .container { max-width: 1200px; margin: 0 auto; padding: 15px; }
        
        .live-header { display: flex; justify-content: space-between; margin-bottom: 15px; }
        .live-badge { background: #ff5252; padding: 8px 16px; border-radius: 25px; font-weight: 600; }
        .refresh-btn { background: transparent; border: 1px solid #00ff9d; color: #00ff9d; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 12px; }
        
        .league-group { margin-bottom: 25px; }
        .league-header { color: #00ff9d; font-size: 16px; font-weight: 600; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #00ff9d33; display: flex; justify-content: space-between; cursor: pointer; }
        .league-header i { transition: transform 0.3s; }
        .league-header.collapsed i { transform: rotate(-90deg); }
        .league-matches.collapsed { display: none; }
        
        .match-card { background: #111827; border-radius: 16px; padding: 18px; margin-bottom: 15px; border: 1px solid #ff525233; position: relative; overflow: hidden; cursor: pointer; }
        .match-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: #ff5252; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
        .match-card.expanded { max-height: none; }
        
        .match-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .match-league { color: #a0a8c9; font-size: 13px; display: flex; align-items: center; gap: 5px; }
        .live-tag { background: #ff5252; padding: 2px 10px; border-radius: 15px; font-size: 11px; margin-left: 8px; }
        .match-minute-badge { background: #ff5252; padding: 4px 12px; border-radius: 20px; font-size: 14px; font-weight: 600; }
        
        .teams-section { display: flex; align-items: center; justify-content: space-around; margin: 15px 0; }
        .team-block { text-align: center; flex: 1; }
        .team-logo { width: 48px; height: 48px; margin: 0 auto 5px; }
        .team-logo img { width: 100%; height: 100%; object-fit: contain; }
        .team-name { font-weight: 600; font-size: 16px; }
        .score-section { text-align: center; }
        .score-display { font-size: 36px; font-weight: bold; letter-spacing: 8px; color: #ff5252; }
        
        .events-section { margin-top: 12px; padding-top: 12px; border-top: 1px solid #ffffff11; }
        .event-row { display: flex; align-items: center; gap: 8px; padding: 3px 0; font-size: 12px; }
        .event-icon { width: 16px; text-align: center; }
        .event-icon.goal { color: #ff9800; }
        .event-icon.yellow { color: #ffc107; }
        .event-icon.red { color: #ff5252; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; padding-top: 12px; border-top: 1px solid #ffffff11; }
        .stat-item { text-align: center; }
        .stat-value { font-size: 18px; font-weight: bold; color: #00ff9d; }
        .stat-label { font-size: 10px; color: #a0a8c9; }
        
        .timer-section { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid #ffffff11; }
        .timer-item { text-align: center; }
        .timer-value { font-size: 13px; font-weight: 600; color: white; }
        .timer-label { font-size: 10px; color: #a0a8c9; }
        
        .h2h-section { margin-top: 12px; padding-top: 12px; border-top: 1px solid #ffffff11; display: none; }
        .h2h-section.show { display: block; }
        .h2h-row { display: flex; justify-content: space-around; font-size: 11px; color: #a0a8c9; }
        
        .expand-bar { text-align: center; color: #a0a8c9; font-size: 12px; cursor: pointer; padding: 8px 0; margin-top: 10px; border-top: 1px solid #ffffff11; }
        .expand-bar i { margin-right: 5px; }
        
        .info-row { text-align: center; color: #ff5252; font-size: 12px; margin-top: 15px; padding-top: 15px; border-top: 1px solid #ffffff11; }
        .empty-state { text-align: center; padding: 50px; color: #a0a8c9; }
        .debug-bar { background: #1a2332; padding: 8px 15px; border-radius: 8px; margin-bottom: 15px; font-size: 12px; color: #00ff9d; }
        .arabic { font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-top">
            <div class="header-left">
                <a href="betting-sport.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
                <h1 style="font-size:18px;"><i class="fas fa-futbol"></i> <span class="en">X Lodon Sports</span><span class="ar" style="display:none;">إكس لودون سبورت</span></h1>
            </div>
            <button class="lang-toggle" onclick="toggleLanguage()"><span class="en">🇸🇦 عربي</span><span class="ar" style="display:none;">🇬🇧 English</span></button>
        </div>
        <div class="tabs">
            <a href="betting-sport.html" class="tab"><span class="en">Home</span></a>
            <a href="live-matches.html" class="tab active"><span class="en">Live</span> <span id="live-count">0</span></a>
            <a href="upcoming-matches.html" class="tab"><span class="en">Upcoming</span></a>
            <a href="finished-matches.html" class="tab"><span class="en">Results</span></a>
            <a href="my-bets.html" class="tab"><span class="en">My Bets</span></a>
        </div>
    </div>
    
    <div class="container">
        <div class="live-header">
            <span class="live-badge"><i class="fas fa-circle"></i> <span class="en">LIVE MATCHES</span> <span id="match-count">0</span></span>
            <button class="refresh-btn" onclick="refreshLive()"><i class="fas fa-sync-alt"></i> Refresh</button>
        </div>
        <div class="debug-bar" id="debug-bar"><i class="fas fa-database"></i> <span id="debug-text">Loading matches...</span></div>
        <div id="matches-container"></div>
        <div id="empty-state" class="empty-state" style="display:none;">
            <i class="fas fa-futbol" style="font-size:48px; opacity:0.3;"></i>
            <p>No live matches at the moment</p>
        </div>
    </div>

    <script src="../js/supabase-client.js"></script>
    <script src="../js/sports-api.js"></script>
    <script>
        function toggleLanguage() {
            var isEn = document.querySelector('.en').style.display !== 'none';
            document.querySelectorAll('.en').forEach(el => el.style.display = isEn ? 'none' : '');
            document.querySelectorAll('.ar').forEach(el => el.style.display = isEn ? '' : 'none');
            document.documentElement.dir = isEn ? 'rtl' : 'ltr';
        }
        
        const firebaseConfig = { apiKey:"AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM", authDomain:"x-bet-prod-jd.firebaseapp.com", projectId:"x-bet-prod-jd", storageBucket:"x-bet-prod-jd.firebasestorage.app", messagingSenderId:"499334334535", appId:"1:499334334535:web:bebc1bf817e24d9e3c4962" };
        if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth=firebase.auth();
        let liveMatches=[], timerInterval=null, eventCache={}, statCache={};
        
        auth.onAuthStateChanged(u=>{ if(!u)location.href='../login.html'; else loadLive(); });
        
        async function loadLive(){
            const container=document.getElementById('matches-container');
            const empty=document.getElementById('empty-state');
            const debugBar=document.getElementById('debug-bar');
            const debugText=document.getElementById('debug-text');
            
            if(!window.supaDB){ debugText.textContent='Supabase not connected'; return; }
            
            liveMatches = await window.supaDB.getLiveMatches();
            debugText.textContent = `Found ${liveMatches.length} live matches`;
            document.getElementById('live-count').textContent = liveMatches.length;
            document.getElementById('match-count').textContent = liveMatches.length;
            
            if(liveMatches.length===0){ container.style.display='none'; empty.style.display='block'; }
            else { container.style.display='block'; empty.style.display='none'; renderMatches(); }
            
            // Fetch events/stats for each match
            for(const m of liveMatches){
                if(!eventCache[m.fixture_id]) fetchMatchEvents(m.fixture_id);
                if(!statCache[m.fixture_id]) fetchMatchStats(m.fixture_id);
            }
            
            startTimer();
            setTimeout(loadLive, 30000);
        }
        
        async function fetchMatchEvents(fixtureId){
            try {
                const r = await fetch(`https://millioner.onrender.com/api/fixtures/events/${fixtureId}`);
                const d = await r.json();
                if(d.success) eventCache[fixtureId] = d.data;
            } catch(e){}
        }
        
        async function fetchMatchStats(fixtureId){
            try {
                const r = await fetch(`https://millioner.onrender.com/api/fixtures/statistics/${fixtureId}`);
                const d = await r.json();
                if(d.success) statCache[fixtureId] = d.data;
            } catch(e){}
        }
        
        function renderMatches(){
            const container=document.getElementById('matches-container');
            const grouped = {};
            liveMatches.forEach(m => {
                const league = m.league_name || 'Other';
                if(!grouped[league]) grouped[league] = [];
                grouped[league].push(m);
            });
            
            container.innerHTML = '';
            Object.keys(grouped).sort().forEach(league => {
                const group = document.createElement('div'); group.className = 'league-group';
                group.innerHTML = `<div class="league-header" onclick="toggleLeague(this)"><span>${league} (${grouped[league].length})</span><i class="fas fa-chevron-down"></i></div><div class="league-matches">${grouped[league].map(m => createCardHTML(m)).join('')}</div>`;
                container.appendChild(group);
            });
        }
        
        function createCardHTML(m){
            const events = eventCache[m.fixture_id] || [];
            const stats = statCache[m.fixture_id] || [];
            const timer = typeof getLiveTimer === 'function' ? getLiveTimer(m.start_time) : 'LIVE';
            const startTime = new Date(m.start_time);
            const endTime = new Date(startTime.getTime() + 105 * 60000);
            const elapsed = typeof getMatchMinute === 'function' ? getMatchMinute(m.start_time) : 0;
            const remaining1st = Math.max(0, 45 - elapsed);
            const remaining2nd = Math.max(0, 90 - elapsed);
            const remaining = elapsed < 45 ? remaining1st : remaining2nd;
            
            // Extract events
            const goals = events.filter(e => e.type === 'Goal').map(e => `${e.player?.name||'Player'} ${e.time?.elapsed||''}'`).join(', ');
            const yellows = events.filter(e => e.type === 'Card' && e.detail === 'Yellow Card');
            const reds = events.filter(e => e.type === 'Card' && e.detail === 'Red Card');
            
            // Extract stats
            const possession = stats.find(s => s.type === 'Ball Possession');
            const shots = stats.find(s => s.type === 'Total Shots');
            const corners = stats.find(s => s.type === 'Corner Kicks');
            const fouls = stats.find(s => s.type === 'Fouls');
            
            const homeName = m.home_team?.name || 'Home';
            const awayName = m.away_team?.name || 'Away';
            const homeLogo = m.home_team?.logo || '';
            const awayLogo = m.away_team?.logo || '';
            const homeScore = m.score?.home || 0;
            const awayScore = m.score?.away || 0;
            
            return `
            <div class="match-card" id="card-${m.fixture_id}">
                <div class="match-header-row">
                    <span class="match-league"><i class="fas fa-trophy" style="color:#ff9800;"></i> ${m.league_name||'League'}<span class="live-tag"><i class="fas fa-circle"></i> LIVE</span></span>
                    <span class="match-minute-badge" id="timer-${m.fixture_id}">${timer}</span>
                </div>
                
                <div class="teams-section">
                    <div class="team-block">
                        <div class="team-logo">${homeLogo ? `<img src="${homeLogo}" onerror="this.style.display='none'">` : ''}</div>
                        <div class="team-name">${homeName}</div>
                    </div>
                    <div class="score-section">
                        <div class="score-display">${homeScore} - ${awayScore}</div>
                    </div>
                    <div class="team-block">
                        <div class="team-logo">${awayLogo ? `<img src="${awayLogo}" onerror="this.style.display='none'">` : ''}</div>
                        <div class="team-name">${awayName}</div>
                    </div>
                </div>
                
                ${goals ? `<div class="events-section"><div class="event-row"><i class="fas fa-futbol event-icon goal"></i> Goals: ${goals}</div></div>` : ''}
                ${yellows.length ? `<div class="events-section"><div class="event-row"><i class="fas fa-square event-icon yellow"></i> Yellow: ${yellows.length} (${yellows.map(y=>y.player?.name||'Player').join(', ')})</div></div>` : ''}
                ${reds.length ? `<div class="events-section"><div class="event-row"><i class="fas fa-square event-icon red"></i> Red: ${reds.length} (${reds.map(r=>r.player?.name||'Player').join(', ')})</div></div>` : ''}
                
                <div class="stats-grid">
                    <div class="stat-item"><div class="stat-value">${possession?.statistics?.[0]?.value||'-'}%</div><div class="stat-label">Possession</div></div>
                    <div class="stat-item"><div class="stat-value">${shots?.statistics?.[0]?.value||'-'} - ${shots?.statistics?.[1]?.value||'-'}</div><div class="stat-label">Shots</div></div>
                    <div class="stat-item"><div class="stat-value">${corners?.statistics?.[0]?.value||'-'} - ${corners?.statistics?.[1]?.value||'-'}</div><div class="stat-label">Corners</div></div>
                </div>
                
                <div class="timer-section">
                    <div class="timer-item"><div class="timer-value">${startTime.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</div><div class="timer-label">Started</div></div>
                    <div class="timer-item"><div class="timer-value">${remaining}' left</div><div class="timer-label">Remaining</div></div>
                    <div class="timer-item"><div class="timer-value">${endTime.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</div><div class="timer-label">Ends ~</div></div>
                </div>
                
                <div class="expand-bar" onclick="toggleExpand('${m.fixture_id}')"><i class="fas fa-chevron-down"></i> Show Details</div>
                <div class="h2h-section" id="h2h-${m.fixture_id}">
                    <div class="h2h-row"><span>H2H: Loading...</span></div>
                </div>
                
                <div class="info-row"><i class="fas fa-info-circle"></i> Betting closed - Match in progress</div>
            </div>`;
        }
        
        function toggleExpand(fixtureId){
            const h2h = document.getElementById('h2h-'+fixtureId);
            h2h.classList.toggle('show');
            if(h2h.classList.contains('show')) loadH2H(fixtureId);
        }
        
        async function loadH2H(fixtureId){
            const match = liveMatches.find(m => m.fixture_id == fixtureId);
            if(!match) return;
            try {
                const h1 = match.home_team?.id, h2 = match.away_team?.id;
                if(!h1 || !h2) return;
                const r = await fetch(`https://millioner.onrender.com/api/fixtures/h2h/${h1}/${h2}`);
                const d = await r.json();
                if(d.success && d.data){
                    const last3 = d.data.slice(0,3);
                    const h2hEl = document.getElementById('h2h-'+fixtureId);
                    h2hEl.innerHTML = `<div class="h2h-row">H2H (Last 3): ${last3.map(m => `${m.teams?.home?.name} ${m.goals?.home}-${m.goals?.away} ${m.teams?.away?.name}`).join(' | ')}</div>`;
                }
            } catch(e){}
        }
        
        function startTimer(){
            if(timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                liveMatches.forEach(m => {
                    const el = document.getElementById('timer-'+m.fixture_id);
                    if(el && typeof getLiveTimer === 'function') el.textContent = getLiveTimer(m.start_time);
                });
            }, 30000);
        }
        
        function toggleLeague(el){ el.classList.toggle('collapsed'); el.nextElementSibling.classList.toggle('collapsed'); }
        function refreshLive(){ loadLive(); }
        window.toggleLeague = toggleLeague; window.toggleExpand = toggleExpand;
        window.addEventListener('beforeunload',()=>{ if(timerInterval) clearInterval(timerInterval); });
    </script>
</body>
</html>
