<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live - X Lodon | مباشر</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <link rel="stylesheet" href="../css/sports-betting.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0f1a; color: white; font-family: 'Segoe UI', 'Tajawal', sans-serif; min-height: 100vh; }
        .header { background: #111827; padding: 12px 15px; border-bottom: 2px solid #ff5252; position: sticky; top: 0; z-index: 100; }
        .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .back-btn { color: #00ff9d; text-decoration: none; font-size: 20px; }
        .lang-toggle { background: #1a2332; border: 1px solid #00ff9d; color: #00ff9d; padding: 5px 12px; border-radius: 20px; cursor: pointer; }
        .tabs { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 3px; }
        .tab { padding: 8px 12px; background: #1a2332; border-radius: 20px; color: white; text-decoration: none; font-size: 12px; }
        .tab.active { background: #ff5252; color: white; }
        .container { max-width: 1200px; margin: 0 auto; padding: 15px; }
        .balance-bar { background: #111827; padding: 10px 15px; border-radius: 12px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #00ff9d33; }
        .live-header { display: flex; justify-content: space-between; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .live-badge { background: #ff5252; padding: 8px 16px; border-radius: 25px; font-weight: 600; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.7; } }
        .debug-bar { background: #1a2332; padding: 8px 15px; border-radius: 8px; margin-bottom: 10px; font-size: 11px; color: #ff5252; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .refresh-btn { background: #00ff9d; color: black; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 11px; }
        .match-card { background: #111827; border-radius: 16px; padding: 18px; margin-bottom: 15px; border: 1px solid #ff525233; position: relative; overflow: hidden; cursor: pointer; transition: transform 0.2s; }
        .match-card:hover { transform: translateX(5px); }
        .match-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: #ff5252; animation: livePulse 1.5s infinite; }
        @keyframes livePulse { 0%,100% { opacity: 1; background: #ff5252; } 50% { opacity: 0.4; background: #ff0000; } }
        .match-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
        .match-league { color: #a0a8c9; font-size: 13px; display: flex; align-items: center; gap: 8px; }
        .live-tag { background: #ff5252; padding: 2px 10px; border-radius: 15px; font-size: 11px; animation: blink 1s infinite; }
        @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
        .match-minute-badge { background: #ff5252; padding: 4px 12px; border-radius: 20px; font-size: 14px; font-weight: 600; }
        .teams-section { display: flex; align-items: center; justify-content: space-around; margin: 15px 0; flex-wrap: wrap; gap: 15px; }
        .team-block { text-align: center; flex: 1; min-width: 100px; }
        .team-logo-img { width: 56px; height: 56px; margin: 0 auto 8px; object-fit: contain; background: rgba(255,255,255,0.08); border-radius: 50%; padding: 6px; display: block; }
        .team-name { font-weight: 600; font-size: 15px; margin-top: 4px; }
        .score-display { font-size: 42px; font-weight: bold; letter-spacing: 6px; color: #ff5252; margin: 0 8px; }
        .events-section { margin-top: 12px; padding-top: 12px; border-top: 1px solid #ffffff11; }
        .event-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 12px; flex-wrap: wrap; }
        .event-icon.goal { color: #ff9800; }
        .event-icon.yellow-card { color: #ffc107; }
        .event-icon.red-card { color: #ff5252; }
        .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid #ffffff11; }
        .stat-item { text-align: center; }
        .stat-value { font-size: 16px; font-weight: bold; color: #00ff9d; }
        .stat-label { font-size: 10px; color: #a0a8c9; }
        .timer-section { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-top: 12px; padding-top: 12px; border-top: 1px solid #ffffff11; }
        .timer-item { text-align: center; }
        .timer-value { font-size: 12px; font-weight: 600; color: white; }
        .timer-label { font-size: 9px; color: #a0a8c9; }
        .empty-state { text-align: center; padding: 50px; color: #a0a8c9; }
        .bet-open-btn { background: #00ff9d; color: black; border: none; padding: 10px 20px; border-radius: 25px; font-weight: bold; cursor: pointer; margin-top: 15px; width: 100%; transition: all 0.3s; }
        .bet-open-btn:hover { background: #00cc7d; transform: scale(1.02); }
        .loading-spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid #ff5252; border-top-color: transparent; border-radius: 50%; animation: spin 0.6s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .goal-animation { animation: goalFlash 0.5s ease; }
        @keyframes goalFlash { 0% { background: rgba(255,165,0,0.3); } 100% { background: transparent; } }
        @media (max-width: 600px) {
            .team-logo-img { width: 48px; height: 48px; }
            .score-display { font-size: 32px; letter-spacing: 3px; }
            .team-name { font-size: 13px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-top">
            <div class="header-left">
                <a href="betting-sport.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
                <h1 style="font-size:18px;"><i class="fas fa-futbol"></i> X Lodon Sports</h1>
            </div>
            <button class="lang-toggle" onclick="toggleLanguage()">عربي</button>
        </div>
        <div class="tabs">
            <a href="betting-sport.html" class="tab">Home</a>
            <a href="live-matches.html" class="tab active">Live</a>
            <a href="upcoming-matches.html" class="tab">Upcoming</a>
            <a href="finished-matches.html" class="tab">Results</a>
            <a href="my-bets.html" class="tab">My Bets</a>
        </div>
    </div>
    
    <div class="container">
        <div class="balance-bar">
            <span><i class="fas fa-wallet"></i> Balance</span>
            <span style="color:#00ff9d;font-weight:bold;font-size:18px;" id="balance-display">$0.00</span>
        </div>
        
        <div class="debug-bar">
            <i class="fas fa-play-circle"></i> <span id="debug-text">Loading live matches...</span>
            <button class="refresh-btn" onclick="loadLiveMatches()"><i class="fas fa-sync-alt"></i> Refresh</button>
        </div>
        
        <div class="live-header">
            <span class="live-badge"><i class="fas fa-circle"></i> LIVE MATCHES <span id="match-count">0</span></span>
        </div>
        
        <div id="matches-container"><div style="text-align:center;padding:50px;"><div class="loading-spinner"></div> Loading live matches...</div></div>
        <div id="empty-state" class="empty-state" style="display:none;">
            <i class="fas fa-futbol" style="font-size:48px; opacity:0.3;"></i>
            <p>No live matches at the moment</p>
            <p style="font-size:12px; margin-top:10px;">Check upcoming matches for betting opportunities</p>
            <button onclick="location.href='upcoming-matches.html'" style="margin-top:15px;padding:10px 20px;background:#ff9800;color:black;border:none;border-radius:8px;cursor:pointer;">View Upcoming Matches</button>
        </div>
    </div>

    <script src="../js/supabase-client.js"></script>
    <script src="../js/betting-engine.js"></script>
    <script>
        let liveMatches = [];
        let refreshInterval = null;
        let eventInterval = null;
        let previousScores = {};
        
        function toggleLanguage() {
            const isArabic = document.body.classList.toggle('arabic');
            localStorage.setItem('lang', isArabic ? 'ar' : 'en');
            document.documentElement.dir = isArabic ? 'rtl' : 'ltr';
        }
        if (localStorage.getItem('lang') === 'ar') toggleLanguage();
        
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        
        firebase.auth().onAuthStateChanged(async (u) => {
            if (!u) {
                location.href = '../login.html';
            } else {
                await loadBalance();
                await loadLiveMatches();
                startAutoRefresh();
            }
        });
        
        async function loadBalance() {
            try {
                const db = firebase.firestore();
                const doc = await db.collection('wallets').doc(firebase.auth().currentUser.uid).get();
                const balance = doc.exists ? (doc.data().balance || 0) : 0;
                document.getElementById('balance-display').textContent = `$${balance.toFixed(2)}`;
            } catch(e) { console.error(e); }
        }
        
        async function loadLiveMatches() {
            if (!window.supaDB) {
                document.getElementById('debug-text').innerHTML = '⚠️ Waiting for database...';
                return;
            }
            
            try {
                document.getElementById('debug-text').innerHTML = '<div class="loading-spinner"></div> Loading live matches...';
                
                const matches = await window.supaDB.getLiveMatches();
                liveMatches = matches || [];
                
                document.getElementById('match-count').textContent = liveMatches.length;
                
                const container = document.getElementById('matches-container');
                const emptyDiv = document.getElementById('empty-state');
                
                if (liveMatches.length === 0) {
                    container.style.display = 'none';
                    emptyDiv.style.display = 'block';
                    document.getElementById('debug-text').innerHTML = 'No live matches currently';
                    return;
                }
                
                container.style.display = 'block';
                emptyDiv.style.display = 'none';
                document.getElementById('debug-text').innerHTML = `🔴 ${liveMatches.length} live match(es) in progress - Click any match to place bet`;
                
                // Build HTML
                let html = '';
                for (const match of liveMatches) {
                    html += createMatchCard(match);
                }
                container.innerHTML = html;
                
                // Check for score changes and animate
                for (const match of liveMatches) {
                    const fixtureId = match.fixture_id;
                    const currentScore = `${match.score?.home || 0}-${match.score?.away || 0}`;
                    const previousScore = previousScores[fixtureId];
                    
                    if (previousScore && previousScore !== currentScore) {
                        // Score changed - animate
                        const scoreElement = document.getElementById(`score-${fixtureId}`);
                        if (scoreElement) {
                            scoreElement.classList.add('goal-animation');
                            setTimeout(() => scoreElement.classList.remove('goal-animation'), 500);
                        }
                    }
                    previousScores[fixtureId] = currentScore;
                }
                
                // Fetch events for each match
                for (const match of liveMatches) {
                    fetchMatchEvents(match.fixture_id);
                }
                
            } catch(e) {
                console.error(e);
                document.getElementById('debug-text').innerHTML = `❌ Error: ${e.message}`;
            }
        }
        
        function createMatchCard(m) {
            const startTime = new Date(m.start_time);
            const now = new Date();
            let elapsed = Math.floor((now - startTime) / 60000);
            if (elapsed < 0) elapsed = 0;
            
            let period = '';
            let remaining = 0;
            
            if (elapsed < 45) {
                period = '1st Half';
                remaining = 45 - elapsed;
            } else if (elapsed < 60) {
                period = 'Half Time';
                remaining = 15 - (elapsed - 45);
            } else if (elapsed < 105) {
                period = '2nd Half';
                remaining = 105 - elapsed;
            } else {
                period = 'Full Time';
                remaining = 0;
            }
            
            const homeTeam = m.home_team || { name: 'Home', logo: '' };
            const awayTeam = m.away_team || { name: 'Away', logo: '' };
            const scoreHome = m.score?.home || 0;
            const scoreAway = m.score?.away || 0;
            const leagueName = m.league_name || 'League';
            const leagueLogo = m.league_logo || '';
            const odds = m.odds || { home: 2.50, draw: 3.20, away: 2.80 };
            
            const elapsedDisplay = elapsed > 0 ? elapsed + "'" : "0'";
            const remainingDisplay = remaining > 0 ? remaining + "'" : "0'";
            
            return `
                <div class="match-card" onclick="goToMatch(${m.fixture_id})">
                    <div class="match-header-row">
                        <div class="match-league">
                            ${leagueLogo ? `<img src="${leagueLogo}" style="width:20px;height:20px;object-fit:contain;" onerror="this.style.display='none'">` : '<i class="fas fa-trophy" style="color:#ff9800;"></i>'}
                            <span>${escapeHtml(leagueName)}</span>
                            <span class="live-tag"><i class="fas fa-circle"></i> LIVE</span>
                        </div>
                        <div class="match-minute-badge">${period} ${elapsedDisplay}</div>
                    </div>
                    <div class="teams-section">
                        <div class="team-block">
                            <img class="team-logo-img" src="${homeTeam.logo || 'https://via.placeholder.com/56?text=?'}" alt="${escapeHtml(homeTeam.name)}" onerror="this.src='https://via.placeholder.com/56?text=${escapeHtml(homeTeam.name.substring(0,2))}'">
                            <div class="team-name">${escapeHtml(homeTeam.name)}</div>
                        </div>
                        <div class="score-display" id="score-${m.fixture_id}">${scoreHome} - ${scoreAway}</div>
                        <div class="team-block">
                            <img class="team-logo-img" src="${awayTeam.logo || 'https://via.placeholder.com/56?text=?'}" alt="${escapeHtml(awayTeam.name)}" onerror="this.src='https://via.placeholder.com/56?text=${escapeHtml(awayTeam.name.substring(0,2))}'">
                            <div class="team-name">${escapeHtml(awayTeam.name)}</div>
                        </div>
                    </div>
                    <div class="events-section" id="events-${m.fixture_id}">
                        <div class="event-row"><span style="color:#a0a8c9;">Loading events...</span></div>
                    </div>
                    <div class="stats-row">
                        <div class="stat-item"><div class="stat-value">${period}</div><div class="stat-label">Period</div></div>
                        <div class="stat-item"><div class="stat-value">${elapsedDisplay}</div><div class="stat-label">Elapsed</div></div>
                        <div class="stat-item"><div class="stat-value">${remainingDisplay}</div><div class="stat-label">Remaining</div></div>
                    </div>
                    <div class="timer-section">
                        <div class="timer-item"><div class="timer-value">${startTime.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</div><div class="timer-label">Started</div></div>
                        <div class="timer-item"><div class="timer-value">${period}</div><div class="timer-label">Half</div></div>
                        <div class="timer-item"><div class="timer-value">${elapsed > 90 ? '90+' : elapsed}'</div><div class="timer-label">Live</div></div>
                    </div>
                    <div class="odds-preview" style="display: flex; gap: 10px; margin-top: 15px; padding-top: 15px; border-top: 1px solid #ffffff11; justify-content: center;">
                        <div style="text-align: center; padding: 5px 10px; background: #0a0f1a; border-radius: 8px;">
                            <div style="font-size: 11px; color: #a0a8c9;">1</div>
                            <div style="font-size: 16px; font-weight: bold; color: #00ff9d;">${odds.home}</div>
                        </div>
                        <div style="text-align: center; padding: 5px 10px; background: #0a0f1a; border-radius: 8px;">
                            <div style="font-size: 11px; color: #a0a8c9;">X</div>
                            <div style="font-size: 16px; font-weight: bold; color: #00ff9d;">${odds.draw}</div>
                        </div>
                        <div style="text-align: center; padding: 5px 10px; background: #0a0f1a; border-radius: 8px;">
                            <div style="font-size: 11px; color: #a0a8c9;">2</div>
                            <div style="font-size: 16px; font-weight: bold; color: #00ff9d;">${odds.away}</div>
                        </div>
                    </div>
                    <button class="bet-open-btn" onclick="event.stopPropagation();goToMatch(${m.fixture_id})">
                        <i class="fas fa-gavel"></i> Place Bet Now
                    </button>
                </div>
            `;
        }
        
        async function fetchMatchEvents(fixtureId) {
            if (!fixtureId) return;
            try {
                const response = await fetch(`https://millioner.onrender.com/api/fixtures/events/${fixtureId}`);
                const data = await response.json();
                
                const eventsDiv = document.getElementById(`events-${fixtureId}`);
                if (eventsDiv && data.success && data.data && data.data.length > 0) {
                    const goals = data.data.filter(e => e.type === 'Goal');
                    const yellows = data.data.filter(e => e.type === 'Card' && e.detail === 'Yellow Card');
                    const reds = data.data.filter(e => e.type === 'Card' && e.detail === 'Red Card');
                    
                    let html = '';
                    if (goals.length) {
                        const goalText = goals.map(g => {
                            const player = g.player?.name || 'Player';
                            const minute = g.time?.elapsed || '';
                            return `${player} ${minute}'`;
                        }).join(', ');
                        html += `<div class="event-row"><i class="fas fa-futbol event-icon goal"></i> ⚽ Goals: ${goalText}</div>`;
                    }
                    if (yellows.length) {
                        const yellowText = yellows.map(y => y.player?.name || 'Player').join(', ');
                        html += `<div class="event-row"><i class="fas fa-square event-icon yellow-card"></i> 🟨 Yellow Cards: ${yellowText}</div>`;
                    }
                    if (reds.length) {
                        const redText = reds.map(r => r.player?.name || 'Player').join(', ');
                        html += `<div class="event-row"><i class="fas fa-square event-icon red-card"></i> 🟥 Red Cards: ${redText}</div>`;
                    }
                    if (!html) {
                        html = '<div class="event-row"><span style="color:#a0a8c9;">No events recorded yet</span></div>';
                    }
                    eventsDiv.innerHTML = html;
                }
            } catch(e) {
                const eventsDiv = document.getElementById(`events-${fixtureId}`);
                if (eventsDiv && eventsDiv.innerHTML.includes('Loading')) {
                    eventsDiv.innerHTML = '<div class="event-row"><span style="color:#a0a8c9;">No events available</span></div>';
                }
            }
        }
        
        function goToMatch(fixtureId) {
            location.href = `match-details.html?id=${fixtureId}`;
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        function startAutoRefresh() {
            if (refreshInterval) clearInterval(refreshInterval);
            if (eventInterval) clearInterval(eventInterval);
            
            // Refresh match list every 15 seconds (faster for live)
            refreshInterval = setInterval(loadLiveMatches, 15000);
            
            // Refresh events every 10 seconds for live matches
            eventInterval = setInterval(() => {
                for (const match of liveMatches) {
                    fetchMatchEvents(match.fixture_id);
                }
            }, 10000);
            
            console.log('🔄 Live matches auto-refresh active (every 15 seconds)');
        }
        
        window.loadLiveMatches = loadLiveMatches;
        window.goToMatch = goToMatch;
        window.toggleLanguage = toggleLanguage;
        
        console.log('✅ Live matches page loaded - Betting is OPEN on live matches!');
    </script>
</body>
</html>
