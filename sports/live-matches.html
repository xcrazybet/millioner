<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Matches - X Lodon</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="../css/sports-betting.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0f1a; color: white; font-family: 'Segoe UI', sans-serif; min-height: 100vh; }
        .header { background: #111827; padding: 15px; border-bottom: 2px solid #ff5252; position: sticky; top: 0; z-index: 100; }
        .header h1 { font-size: 20px; display: flex; align-items: center; gap: 10px; }
        .back-btn { color: #00ff9d; text-decoration: none; margin-right: 10px; }
        .tabs { display: flex; gap: 5px; margin-top: 10px; overflow-x: auto; }
        .tab { padding: 10px 15px; background: #1a2332; border-radius: 25px; color: white; text-decoration: none; font-size: 13px; }
        .tab.active { background: #ff5252; color: white; }
        .container { max-width: 1200px; margin: 0 auto; padding: 15px; }
        .live-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .live-badge-large { background: #ff5252; padding: 5px 15px; border-radius: 20px; font-size: 14px; }
        .update-indicator { color: #a0a8c9; font-size: 12px; }
        .match-card { background: #111827; border-radius: 12px; padding: 15px; margin-bottom: 12px; border-left: 4px solid #ff5252; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%,100% { border-left-color: #ff5252; } 50% { border-left-color: #ff525255; } }
        .match-league { color: #a0a8c9; font-size: 13px; margin-bottom: 8px; }
        .match-teams { display: flex; align-items: center; justify-content: space-around; margin: 10px 0; }
        .team { text-align: center; flex: 1; }
        .team-name { font-weight: 600; font-size: 16px; }
        .score-box { text-align: center; }
        .score { font-size: 32px; font-weight: bold; color: white; }
        .match-minute { background: #ff5252; color: white; padding: 4px 12px; border-radius: 20px; font-size: 13px; display: inline-block; }
        .empty-state { text-align: center; padding: 50px; color: #a0a8c9; }
        .refresh-timer { text-align: right; color: #a0a8c9; font-size: 11px; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>
            <a href="betting-sport.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
            <i class="fas fa-futbol"></i> X Lodon Sports
        </h1>
        <div class="tabs">
            <a href="betting-sport.html" class="tab">Home</a>
            <a href="live-matches.html" class="tab active"><i class="fas fa-circle"></i> Live <span id="live-count">0</span></a>
            <a href="upcoming-matches.html" class="tab">Upcoming</a>
            <a href="finished-matches.html" class="tab">Results</a>
            <a href="my-bets.html" class="tab">My Bets</a>
        </div>
    </div>
    
    <div class="container">
        <div class="live-header">
            <span class="live-badge-large"><i class="fas fa-circle"></i> LIVE MATCHES <span id="match-count">0</span></span>
            <span class="update-indicator"><i class="fas fa-sync-alt fa-spin"></i> Live updates</span>
        </div>
        
        <div id="matches-container"></div>
        <div id="empty-state" class="empty-state" style="display:none;">
            <i class="fas fa-futbol" style="font-size:48px; opacity:0.3;"></i>
            <p>No live matches at the moment</p>
            <a href="upcoming-matches.html" style="color:#00ff9d;">View upcoming matches →</a>
        </div>
        <div class="refresh-timer" id="refresh-timer">Next update: 7s</div>
    </div>
    
    <script src="../js/sports-api.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), db = firebase.firestore();
        
        let countdown = 7;
        
        auth.onAuthStateChanged(u => { if (!u) location.href = '../login.html'; else loadLiveMatches(); });
        
        function loadLiveMatches() {
            db.collection('sports_matches').where('status', '==', 'live').onSnapshot(snap => {
                const container = document.getElementById('matches-container');
                const empty = document.getElementById('empty-state');
                
                document.getElementById('live-count').textContent = snap.size;
                document.getElementById('match-count').textContent = snap.size;
                
                if (snap.empty) {
                    container.style.display = 'none';
                    empty.style.display = 'block';
                } else {
                    container.style.display = 'block';
                    empty.style.display = 'none';
                    container.innerHTML = '';
                    
                    const matches = [];
                    snap.forEach(d => matches.push(d.data()));
                    matches.sort((a, b) => (b.startTime?.toDate() || 0) - (a.startTime?.toDate() || 0));
                    
                    matches.forEach((m, i) => container.appendChild(createLiveCard(m, i + 1)));
                }
                
                countdown = 7;
            });
        }
        
        function createLiveCard(m, index) {
            const card = document.createElement('div');
            card.className = 'match-card';
            
            const minute = getMatchMinute(m.startTime);
            const homeScore = m.score?.home || 0;
            const awayScore = m.score?.away || 0;
            
            card.innerHTML = `
                <div style="display:flex; justify-content:space-between;">
                    <span class="match-league"><i class="fas fa-trophy"></i> ${m.leagueName||'League'}</span>
                    <span style="color:#a0a8c9;">#${index}</span>
                </div>
                <div class="match-teams">
                    <div class="team">
                        <div class="team-name">${m.homeTeam?.name||'Home'}</div>
                    </div>
                    <div class="score-box">
                        <div class="score">${homeScore} - ${awayScore}</div>
                        <span class="match-minute">${minute}'</span>
                    </div>
                    <div class="team">
                        <div class="team-name">${m.awayTeam?.name||'Away'}</div>
                    </div>
                </div>
                <div style="text-align:center; color:#ff5252; font-size:12px; margin-top:5px;">
                    <i class="fas fa-info-circle"></i> Betting closed
                </div>
            `;
            return card;
        }
        
        function getMatchMinute(startTime) {
            const now = new Date();
            const start = startTime.toDate();
            const diff = Math.floor((now - start) / 60000);
            if (diff < 1) return '1';
            if (diff > 90) return '90+';
            return diff;
        }
        
        // Countdown timer
        setInterval(() => {
            countdown--;
            if (countdown <= 0) countdown = 7;
            document.getElementById('refresh-timer').textContent = `Next update: ${countdown}s`;
        }, 1000);
        
        // Force sync every 7 seconds
        setInterval(() => {
            if (typeof syncNow === 'function') syncNow();
        }, 7000);
    </script>
</body>
</html>
