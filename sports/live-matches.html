<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live - X Lodon | مباشر</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="../css/sports-betting.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0f1a; color: white; font-family: 'Segoe UI', 'Tajawal', sans-serif; min-height: 100vh; }
        .header { background: #111827; padding: 12px 15px; border-bottom: 2px solid #ff5252; position: sticky; top: 0; z-index: 100; }
        .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .back-btn { color: #00ff9d; text-decoration: none; font-size: 20px; }
        .lang-toggle { background: #1a2332; border: 1px solid #00ff9d; color: #00ff9d; padding: 5px 12px; border-radius: 20px; font-size: 14px; cursor: pointer; }
        .tabs { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 3px; }
        .tab { padding: 8px 12px; background: #1a2332; border-radius: 20px; color: white; text-decoration: none; font-size: 12px; }
        .tab.active { background: #ff5252; color: white; }
        .container { max-width: 1200px; margin: 0 auto; padding: 15px; }
        .live-header { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .live-badge { background: #ff5252; padding: 8px 16px; border-radius: 25px; font-weight: 600; }
        .match-card { background: #111827; border-radius: 16px; padding: 18px; margin-bottom: 15px; border: 1px solid #ff525233; position: relative; overflow: hidden; }
        .match-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: #ff5252; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
        .match-league { color: #a0a8c9; font-size: 13px; margin-bottom: 12px; }
        .live-tag { background: #ff5252; padding: 2px 10px; border-radius: 15px; font-size: 11px; margin-left: 8px; }
        .match-teams { display: flex; align-items: center; justify-content: space-around; margin: 15px 0; }
        .team { text-align: center; flex: 1; font-weight: 600; font-size: 16px; }
        .score { font-size: 36px; font-weight: bold; letter-spacing: 8px; }
        .timer-badge { background: #ff5252; padding: 4px 15px; border-radius: 20px; font-size: 13px; display: inline-block; margin-top: 8px; }
        .info-row { text-align: center; color: #ff5252; font-size: 12px; margin-top: 15px; padding-top: 15px; border-top: 1px solid #ffffff11; }
        .empty-state { text-align: center; padding: 50px; color: #a0a8c9; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-top">
            <div class="header-left">
                <a href="betting-sport.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
                <h1 style="font-size:18px;"><i class="fas fa-futbol"></i> X Lodon Sports</h1>
            </div>
            <button class="lang-toggle" onclick="toggleLanguage()">🇸🇦 عربي</button>
        </div>
        <div class="tabs">
            <a href="betting-sport.html" class="tab">Home</a>
            <a href="live-matches.html" class="tab active">Live <span id="live-count">0</span></a>
            <a href="upcoming-matches.html" class="tab">Upcoming</a>
            <a href="finished-matches.html" class="tab">Results</a>
            <a href="my-bets.html" class="tab">My Bets</a>
        </div>
    </div>
    
    <div class="container">
        <div class="live-header">
            <span class="live-badge"><i class="fas fa-circle"></i> LIVE MATCHES <span id="match-count">0</span></span>
        </div>
        <div id="matches-container"></div>
        <div id="empty-state" class="empty-state" style="display:none;">
            <i class="fas fa-futbol" style="font-size:48px; opacity:0.3;"></i>
            <p>No live matches at the moment</p>
        </div>
    </div>

    <script src="../js/sports-api.js"></script>
    <script>
        function toggleLanguage() { location.reload(); }
        
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), db = firebase.firestore();
        let unsubscribe = null, timerInterval = null, liveMatches = [];
        
        auth.onAuthStateChanged(u => { if (!u) location.href = '../login.html'; else loadLive(); });
        
        function loadLive() {
            const container = document.getElementById('matches-container');
            const empty = document.getElementById('empty-state');
            const threeHoursAgo = new Date(Date.now() - 3 * 60 * 60 * 1000);
            
            unsubscribe = db.collection('sports_matches').where('status', '==', 'live').onSnapshot(snap => {
                // Filter: only matches from last 3 hours (removes finished/stuck matches)
                liveMatches = [];
                snap.forEach(d => {
                    const m = d.data();
                    const matchTime = m.startTime?.toDate() || new Date();
                    if (matchTime > threeHoursAgo) liveMatches.push(m);
                });
                
                document.getElementById('live-count').textContent = liveMatches.length;
                document.getElementById('match-count').textContent = liveMatches.length;
                
                if (liveMatches.length === 0) { container.style.display = 'none'; empty.style.display = 'block'; }
                else { container.style.display = 'block'; empty.style.display = 'none'; renderMatches(); }
                startTimer();
            });
        }
        
        function renderMatches() {
            const container = document.getElementById('matches-container');
            container.innerHTML = '';
            liveMatches.sort((a,b) => b.startTime?.toDate() - a.startTime?.toDate()).forEach(m => {
                const card = document.createElement('div'); card.className = 'match-card';
                const timer = typeof getLiveTimer === 'function' ? getLiveTimer(m.startTime) : 'LIVE';
                card.innerHTML = `
                    <div class="match-league"><i class="fas fa-trophy" style="color:#ff9800;"></i> ${m.leagueName||'League'}<span class="live-tag"><i class="fas fa-circle"></i> LIVE</span></div>
                    <div class="match-teams"><div class="team">${m.homeTeam?.name||'Home'}</div><div class="score">${m.score?.home||0} - ${m.score?.away||0}</div><div class="team">${m.awayTeam?.name||'Away'}</div></div>
                    <div style="text-align:center;"><span class="timer-badge" id="timer-${m.fixtureId}">${timer}</span></div>
                    <div class="info-row"><i class="fas fa-info-circle"></i> Betting closed - Match in progress</div>
                `;
                container.appendChild(card);
            });
        }
        
        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                liveMatches.forEach(m => {
                    const el = document.getElementById('timer-' + m.fixtureId);
                    if (el && typeof getLiveTimer === 'function') el.textContent = getLiveTimer(m.startTime);
                });
            }, 30000);
        }
        
        window.addEventListener('beforeunload', () => { if (unsubscribe) unsubscribe(); if (timerInterval) clearInterval(timerInterval); });
    </script>
</body>
</html>
