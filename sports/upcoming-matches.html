<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Upcoming - X Lodon | المباريات القادمة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <link rel="stylesheet" href="../css/sports-betting.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0f1a; color: white; font-family: 'Segoe UI', 'Tajawal', sans-serif; min-height: 100vh; }
        .header { background: #111827; padding: 12px 15px; border-bottom: 2px solid #00ff9d; position: sticky; top: 0; z-index: 100; }
        .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .back-btn { color: #00ff9d; text-decoration: none; font-size: 20px; }
        .lang-toggle { background: #1a2332; border: 1px solid #00ff9d; color: #00ff9d; padding: 5px 12px; border-radius: 20px; cursor: pointer; }
        .tabs { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 3px; }
        .tab { padding: 8px 12px; background: #1a2332; border-radius: 20px; color: white; text-decoration: none; font-size: 12px; }
        .tab.active { background: #00ff9d; color: black; }
        .container { max-width: 1200px; margin: 0 auto; padding: 15px; padding-bottom: 180px; }
        .balance-bar { background: #111827; padding: 10px 15px; border-radius: 12px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #00ff9d33; }
        .selector-bar { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .league-select { flex: 1; padding: 14px; background: #111827; border: 1px solid #ffffff22; border-radius: 12px; color: white; font-size: 14px; min-width: 150px; }
        .search-input { flex: 2; padding: 14px; background: #111827; border: 1px solid #ffffff22; border-radius: 12px; color: white; font-size: 14px; min-width: 200px; }
        .debug-bar { background: #1a2332; padding: 8px 15px; border-radius: 8px; margin-bottom: 10px; font-size: 11px; color: #00ff9d; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .refresh-btn { background: #00ff9d; color: black; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 11px; }
        .force-refresh-btn { background: #ff9800; color: black; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 11px; margin-left: auto; }
        .date-section { margin-bottom: 15px; }
        .date-header { color: #00ff9d; font-size: 15px; font-weight: 600; margin-bottom: 8px; padding: 8px 12px; background: #0a0f1a; border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .date-matches.collapsed { display: none; }
        .league-group { margin-bottom: 10px; }
        .league-group-header { display: flex; align-items: center; gap: 8px; padding: 6px 8px; cursor: pointer; border-radius: 6px; background: #1a2332; margin-bottom: 5px; }
        .league-group-header .name { font-weight: 600; font-size: 13px; color: #00ff9d; }
        .league-group-header .count { color: #a0a8c9; font-size: 11px; margin-left: auto; }
        .league-matches.collapsed { display: none; }
        .match-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid #ffffff0a; font-size: 12px; flex-wrap: wrap; }
        .match-time-col { text-align: center; min-width: 60px; }
        .match-time-col .time { font-weight: bold; color: #00ff9d; }
        .match-time-col .countdown { font-size: 10px; color: #a0a8c9; }
        .team-col { flex: 2; display: flex; align-items: center; gap: 6px; min-width: 180px; }
        .team-col img { width: 24px; height: 24px; object-fit: contain; border-radius: 50%; }
        .team-col .names { font-weight: 500; }
        .team-col .vs { color: #ff9800; margin: 0 5px; }
        .odds-col { display: flex; gap: 4px; }
        .odd-mini { padding: 6px 10px; background: #0a0f1a; border-radius: 6px; font-size: 12px; text-align: center; min-width: 50px; border: 1px solid #ffffff11; cursor: pointer; transition: all 0.2s; }
        .odd-mini:hover { background: #00ff9d22; border-color: #00ff9d; }
        .odd-mini span { color: #00ff9d; font-weight: bold; font-size: 14px; }
        .bet-btn, .slip-btn { padding: 6px 12px; border-radius: 20px; font-size: 10px; font-weight: 700; cursor: pointer; border: none; }
        .bet-btn { background: #00ff9d; color: black; }
        .slip-btn { background: #ff9800; color: black; }
        .bet-slip { position: fixed; bottom: 0; left: 0; right: 0; background: #111827; border-top: 2px solid #ff9800; padding: 15px; z-index: 1000; max-height: 250px; overflow-y: auto; }
        .slip-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .slip-title { color: #ff9800; font-weight: 600; }
        .slip-clear { color: #ff5252; font-size: 12px; cursor: pointer; }
        .slip-item { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #ffffff11; font-size: 12px; }
        .slip-remove { color: #ff5252; cursor: pointer; }
        .slip-total { display: flex; justify-content: space-between; padding: 10px 0; font-weight: bold; }
        .slip-total-odds { color: #ff9800; font-size: 18px; }
        .slip-place-btn { width: 100%; padding: 12px; background: #ff9800; color: black; border: none; border-radius: 10px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .empty-state { text-align: center; padding: 50px; color: #a0a8c9; }
        .today-badge { background: #ff5252; color: white; font-size: 10px; padding: 2px 8px; border-radius: 12px; margin-left: 8px; }
        .loading-spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid #00ff9d; border-top-color: transparent; border-radius: 50%; animation: spin 0.6s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 768px) {
            .match-row { flex-direction: column; align-items: stretch; }
            .team-col { justify-content: center; }
            .odds-col { justify-content: center; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-top">
            <div class="header-left">
                <a href="betting-sport.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
                <h1 style="font-size:18px;"><i class="fas fa-futbol"></i> X Lodon Sports</h1>
            </div>
            <button class="lang-toggle" onclick="toggleLanguage()">عربي</button>
        </div>
        <div class="tabs">
            <a href="betting-sport.html" class="tab">Home</a>
            <a href="live-matches.html" class="tab">Live</a>
            <a href="upcoming-matches.html" class="tab active">Upcoming</a>
            <a href="finished-matches.html" class="tab">Results</a>
            <a href="my-bets.html" class="tab">My Bets</a>
        </div>
    </div>
    
    <div class="container">
        <div class="balance-bar">
            <span><i class="fas fa-wallet"></i> Balance</span>
            <span style="color:#00ff9d;font-weight:bold;font-size:18px;" id="balance-display">$0.00</span>
        </div>
        
        <div class="selector-bar">
            <select id="league-filter" class="league-select"><option value="all">🏆 All Leagues</option></select>
            <input type="text" id="search-input" class="search-input" placeholder="🔍 Search league or team..." oninput="filterMatches()">
        </div>
        
        <div class="debug-bar">
            <i class="fas fa-database"></i> <span id="debug-text">Loading matches...</span>
            <button class="refresh-btn" onclick="loadMatches()"><i class="fas fa-sync-alt"></i> Refresh</button>
            <button class="force-refresh-btn" onclick="forceRefreshData()"><i class="fas fa-database"></i> Force Sync</button>
        </div>
        
        <div id="matches-container"><div style="text-align:center;padding:50px;"><div class="loading-spinner"></div> Loading upcoming matches...</div></div>
    </div>
    
    <div class="bet-slip" id="bet-slip" style="display:none;">
        <div class="slip-header">
            <span class="slip-title"><i class="fas fa-layer-group"></i> Bet Slip (<span id="slip-count">0</span>)</span>
            <span class="slip-clear" onclick="window.clearSlip()">Clear All</span>
        </div>
        <div id="slip-items"></div>
        <div class="slip-total"><span>Total Odds:</span><span class="slip-total-odds" id="slip-total-odds">1.00</span></div>
        <button class="slip-place-btn" id="place-acc-btn" disabled onclick="placeAccumulatorBet()">Place Accumulator (2+ Selections)</button>
    </div>

    <script src="../js/supabase-client.js"></script>
    <script src="../js/betting-engine.js"></script>
    <script>
        let allMatches = [];
        let countdownInterval;
        let selectedLeague = 'all';
        let autoRefreshInterval;
        
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        
        // Language Toggle
        function toggleLanguage() {
            const isArabic = document.body.classList.toggle('arabic');
            localStorage.setItem('lang', isArabic ? 'ar' : 'en');
            document.documentElement.dir = isArabic ? 'rtl' : 'ltr';
        }
        if (localStorage.getItem('lang') === 'ar') toggleLanguage();
        
        // Auth check
        firebase.auth().onAuthStateChanged(async (u) => {
            if (!u) {
                location.href = '../login.html';
            } else {
                await loadBalance();
                await loadLeagues();
                await loadMatches();
                startAutoRefresh();
            }
        });
        
        async function loadBalance() {
            try {
                const db = firebase.firestore();
                const doc = await db.collection('wallets').doc(firebase.auth().currentUser.uid).get();
                const balance = doc.exists ? (doc.data().balance || 0) : 0;
                document.getElementById('balance-display').textContent = `$${balance.toFixed(2)}`;
            } catch(e) { console.error(e); }
        }
        
        async function loadLeagues() {
            try {
                const res = await fetch('https://millioner.onrender.com/api/leagues');
                const data = await res.json();
                if (data.success && data.data) {
                    const select = document.getElementById('league-filter');
                    data.data.forEach(league => {
                        const option = document.createElement('option');
                        option.value = league.id;
                        option.textContent = league.name;
                        select.appendChild(option);
                    });
                }
            } catch(e) { console.error(e); }
            document.getElementById('league-filter').onchange = (e) => {
                selectedLeague = e.target.value;
                filterMatches();
            };
        }
        
        async function loadMatches() {
            if (!window.supaDB) {
                document.getElementById('debug-text').innerHTML = '⚠️ Waiting for database...';
                return;
            }
            
            try {
                document.getElementById('debug-text').innerHTML = '<div class="loading-spinner"></div> Loading...';
                
                const matches = await window.supaDB.getUpcomingMatches();
                allMatches = matches || [];
                
                // Calculate stats
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                
                const todayMatches = allMatches.filter(m => {
                    const d = new Date(m.start_time);
                    d.setHours(0, 0, 0, 0);
                    return d.getTime() === today.getTime();
                }).length;
                
                const futureMatches = allMatches.length - todayMatches;
                
                const uniqueDates = [...new Set(allMatches.map(m => new Date(m.start_time).toDateString()))];
                
                document.getElementById('debug-text').innerHTML = `✅ ${allMatches.length} matches (Today: ${todayMatches} | Next 7 days: ${futureMatches}) | Dates: ${uniqueDates.slice(0,3).join(', ')}${uniqueDates.length > 3 ? '...' : ''}`;
                
                if (allMatches.length === 0) {
                    document.getElementById('matches-container').innerHTML = `<div class="empty-state"><i class="fas fa-database"></i><p>No matches found. Click "Force Sync" to generate data.</p></div>`;
                } else {
                    filterMatches();
                    startCountdowns();
                }
                
            } catch(e) {
                console.error(e);
                document.getElementById('debug-text').innerHTML = `❌ Error: ${e.message}`;
            }
        }
        
        async function forceRefreshData() {
            document.getElementById('debug-text').innerHTML = '<div class="loading-spinner"></div> Forcing data sync...';
            
            if (window.refreshSportsData) {
                await window.refreshSportsData();
            }
            
            await loadMatches();
        }
        
        function filterMatches() {
            const container = document.getElementById('matches-container');
            const search = document.getElementById('search-input').value.toLowerCase();
            
            let filtered = [...allMatches];
            
            if (selectedLeague !== 'all') {
                filtered = filtered.filter(m => m.league_id == selectedLeague);
            }
            
            if (search) {
                filtered = filtered.filter(m => {
                    const homeName = (m.home_team?.name || '').toLowerCase();
                    const awayName = (m.away_team?.name || '').toLowerCase();
                    const leagueName = (m.league_name || '').toLowerCase();
                    return homeName.includes(search) || awayName.includes(search) || leagueName.includes(search);
                });
            }
            
            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty-state">No matches found</div>';
                return;
            }
            
            // Group by date
            const groupedByDate = {};
            filtered.forEach(m => {
                const date = new Date(m.start_time).toDateString();
                if (!groupedByDate[date]) groupedByDate[date] = [];
                groupedByDate[date].push(m);
            });
            
            const today = new Date().toDateString();
            const tomorrow = new Date(Date.now() + 86400000).toDateString();
            
            container.innerHTML = '';
            
            Object.keys(groupedByDate).sort().forEach(dateKey => {
                const date = new Date(dateKey);
                let label = date.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
                let badge = '';
                
                if (dateKey === today) {
                    label = `📅 TODAY - ${label}`;
                    badge = '<span class="today-badge">Today</span>';
                } else if (dateKey === tomorrow) {
                    label = `📅 TOMORROW - ${label}`;
                }
                
                // Group by league within date
                const groupedByLeague = {};
                groupedByDate[dateKey].forEach(m => {
                    const leagueName = m.league_name || 'Other';
                    if (!groupedByLeague[leagueName]) groupedByLeague[leagueName] = [];
                    groupedByLeague[leagueName].push(m);
                });
                
                let leaguesHtml = '';
                Object.keys(groupedByLeague).sort().forEach(leagueName => {
                    const matchesHtml = groupedByLeague[leagueName].map(m => createMatchRow(m)).join('');
                    leaguesHtml += `
                        <div class="league-group">
                            <div class="league-group-header" onclick="this.classList.toggle('collapsed');this.nextElementSibling.classList.toggle('collapsed');">
                                <span class="name">${escapeHtml(leagueName)}</span>
                                <span class="count">${groupedByLeague[leagueName].length} matches</span>
                                <i class="fas fa-chevron-down"></i>
                            </div>
                            <div class="league-matches">${matchesHtml}</div>
                        </div>
                    `;
                });
                
                const section = document.createElement('div');
                section.className = 'date-section';
                section.innerHTML = `
                    <div class="date-header" onclick="this.classList.toggle('collapsed');this.nextElementSibling.classList.toggle('collapsed');">
                        <span>${label} ${badge}</span>
                        <span>${groupedByDate[dateKey].length} matches</span>
                        <i class="fas fa-chevron-down"></i>
                    </div>
                    <div class="date-matches">${leaguesHtml}</div>
                `;
                container.appendChild(section);
            });
        }
        
        function createMatchRow(m) {
            const time = new Date(m.start_time);
            const homeTeam = m.home_team || { name: 'Home', logo: '' };
            const awayTeam = m.away_team || { name: 'Away', logo: '' };
            const odds = m.odds || { home: 2.50, draw: 3.20, away: 2.80 };
            
            return `
                <div class="match-row" data-fixture="${m.fixture_id}">
                    <div class="match-time-col">
                        <div class="time">${time.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</div>
                        <div class="countdown" data-time="${m.start_time}">--:--:--</div>
                    </div>
                    <div class="team-col">
                        ${homeTeam.logo ? `<img src="${homeTeam.logo}" onerror="this.style.display='none'">` : '<i class="fas fa-shield-alt"></i>'}
                        <span class="names">${escapeHtml(homeTeam.name)} <span class="vs">vs</span> ${escapeHtml(awayTeam.name)}</span>
                        ${awayTeam.logo ? `<img src="${awayTeam.logo}" onerror="this.style.display='none'">` : '<i class="fas fa-shield-alt"></i>'}
                    </div>
                    <div class="odds-col">
                        <div class="odd-mini" onclick="goToMatchWithBet(${m.fixture_id}, 'home', ${odds.home})">1 <span>${odds.home}</span></div>
                        <div class="odd-mini" onclick="goToMatchWithBet(${m.fixture_id}, 'draw', ${odds.draw})">X <span>${odds.draw}</span></div>
                        <div class="odd-mini" onclick="goToMatchWithBet(${m.fixture_id}, 'away', ${odds.away})">2 <span>${odds.away}</span></div>
                    </div>
                    <button class="bet-btn" onclick="goToMatch(${m.fixture_id})">Bet</button>
                    <button class="slip-btn" onclick="showAccumulatorPopup(${m.fixture_id}, '${escapeHtml(homeTeam.name)}', '${escapeHtml(awayTeam.name)}', ${odds.home}, ${odds.draw}, ${odds.away})">+Slip</button>
                </div>
            `;
        }
        
        function goToMatch(fixtureId) {
            location.href = `match-details.html?id=${fixtureId}`;
        }
        
        function goToMatchWithBet(fixtureId, betType, odds) {
            sessionStorage.setItem('selectedBet', JSON.stringify({ fixtureId, betType, odds }));
            location.href = `match-details.html?id=${fixtureId}`;
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;'
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        function startCountdowns() {
            if (countdownInterval) clearInterval(countdownInterval);
            
            function updateCountdowns() {
                document.querySelectorAll('.countdown').forEach(el => {
                    const startTime = el.dataset.time;
                    if (startTime) {
                        const diff = new Date(startTime) - new Date();
                        if (diff <= 0) {
                            el.textContent = 'Now';
                            el.style.color = '#ff9800';
                        } else {
                            const hours = Math.floor(diff / 3600000);
                            const minutes = Math.floor((diff % 3600000) / 60000);
                            const seconds = Math.floor((diff % 60000) / 1000);
                            el.textContent = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
                            el.style.color = '#a0a8c9';
                        }
                    }
                });
            }
            
            updateCountdowns();
            countdownInterval = setInterval(updateCountdowns, 1000);
        }
        
        function startAutoRefresh() {
            if (autoRefreshInterval) clearInterval(autoRefreshInterval);
            autoRefreshInterval = setInterval(loadMatches, 60000);
        }
        
        // Bet Slip UI Update
        window.updateSlipUI = function() {
            const slip = document.getElementById('bet-slip');
            const selections = window.ACCUMULATOR_SLIP || [];
            
            if (selections.length === 0) {
                slip.style.display = 'none';
                return;
            }
            
            slip.style.display = 'block';
            document.getElementById('slip-count').textContent = selections.length;
            
            let itemsHtml = '';
            let totalOdds = 1;
            
            selections.forEach((s, i) => {
                totalOdds *= s.odds;
                itemsHtml += `
                    <div class="slip-item">
                        <span>${s.betTypeName} - ${s.matchName} @ ${s.odds.toFixed(2)}</span>
                        <span class="slip-remove" onclick="window.removeFromSlip(${i})"><i class="fas fa-times"></i></span>
                    </div>
                `;
            });
            
            document.getElementById('slip-items').innerHTML = itemsHtml;
            document.getElementById('slip-total-odds').textContent = totalOdds.toFixed(2);
            document.getElementById('place-acc-btn').disabled = selections.length < 2;
        };
        
        async function placeAccumulatorBet() {
            if (!window.ACCUMULATOR_SLIP || window.ACCUMULATOR_SLIP.length < 2) {
                alert('Add at least 2 selections');
                return;
            }
            
            const amount = parseFloat(prompt('Enter stake amount ($):', '10'));
            if (!amount || amount < 1) return;
            
            const result = await window.placeAccumulatorBet(window.ACCUMULATOR_SLIP, amount);
            
            if (result.success) {
                alert(`✅ Bet placed! Potential win: $${result.potentialWin.toFixed(2)}`);
                window.clearSlip();
                await loadBalance();
                location.href = 'my-bets.html';
            } else {
                alert(`❌ Failed: ${result.error}`);
            }
        }
        
        // Expose functions globally
        window.goToMatch = goToMatch;
        window.placeAccumulatorBet = placeAccumulatorBet;
        window.loadMatches = loadMatches;
        window.forceRefreshData = forceRefreshData;
        window.toggleLanguage = toggleLanguage;
        
        console.log('✅ Upcoming matches page loaded');
    </script>
</body>
</html>
