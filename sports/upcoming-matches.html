<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Upcoming - X Lodon | المباريات القادمة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="../css/sports-betting.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0f1a; color: white; font-family: 'Segoe UI', 'Tajawal', sans-serif; min-height: 100vh; }
        .header { background: #111827; padding: 12px 15px; border-bottom: 2px solid #00ff9d; position: sticky; top: 0; z-index: 100; }
        .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .back-btn { color: #00ff9d; text-decoration: none; font-size: 20px; }
        .lang-toggle { background: #1a2332; border: 1px solid #00ff9d; color: #00ff9d; padding: 5px 12px; border-radius: 20px; font-size: 14px; cursor: pointer; }
        .tabs { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 3px; }
        .tab { padding: 8px 12px; background: #1a2332; border-radius: 20px; color: white; text-decoration: none; font-size: 12px; }
        .tab.active { background: #00ff9d; color: black; }
        .container { max-width: 1200px; margin: 0 auto; padding: 15px; }
        .filter-section { margin-bottom: 20px; }
        .filter-select { width: 100%; padding: 15px; background: #111827; border: 1px solid #ffffff22; border-radius: 10px; color: white; font-size: 14px; }
        .date-header { color: #00ff9d; font-size: 16px; margin: 20px 0 15px; padding-bottom: 8px; border-bottom: 1px solid #00ff9d33; display: flex; justify-content: space-between; }
        .match-card { background: #111827; border-radius: 12px; padding: 15px; margin-bottom: 12px; border-left: 4px solid #00ff9d; cursor: pointer; }
        .match-league { color: #a0a8c9; font-size: 12px; margin-bottom: 8px; display: flex; align-items: center; gap: 5px; }
        .match-teams { display: flex; align-items: center; justify-content: space-around; margin: 10px 0; }
        .team { text-align: center; flex: 1; }
        .team-logo { width: 40px; height: 40px; margin: 0 auto 5px; }
        .team-logo img { width: 100%; height: 100%; object-fit: contain; }
        .team-name { font-weight: 600; font-size: 13px; }
        .vs { color: #ff9800; font-weight: bold; padding: 0 10px; }
        .countdown-box { background: #1a2332; border-radius: 8px; padding: 10px; margin-top: 10px; text-align: center; }
        .countdown-label { color: #a0a8c9; font-size: 11px; }
        .countdown-value { color: #00ff9d; font-size: 18px; font-weight: bold; }
        .match-datetime { color: #a0a8c9; font-size: 11px; margin-top: 5px; }
        .odds { display: flex; gap: 8px; margin-top: 12px; }
        .odd { flex: 1; text-align: center; padding: 8px; background: #0a0f1a; border-radius: 6px; }
        .odd-value { color: #00ff9d; font-weight: bold; }
        .empty-state { text-align: center; padding: 50px; color: #a0a8c9; }
        .refresh-btn { background: #00ff9d; color: black; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        .arabic { font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-top">
            <div class="header-left">
                <a href="betting-sport.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
                <h1 style="font-size:18px;"><i class="fas fa-futbol"></i> <span class="en">X Lodon Sports</span><span class="ar" style="display:none;">إكس لودون سبورت</span></h1>
            </div>
            <button class="lang-toggle" onclick="toggleLanguage()"><span class="en">🇸🇦 عربي</span><span class="ar" style="display:none;">🇬🇧 English</span></button>
        </div>
        <div class="tabs">
            <a href="betting-sport.html" class="tab"><span class="en">Home</span><span class="ar" style="display:none;">الرئيسية</span></a>
            <a href="live-matches.html" class="tab"><span class="en">Live</span><span class="ar" style="display:none;">مباشر</span></a>
            <a href="upcoming-matches.html" class="tab active"><span class="en">Upcoming</span><span class="ar" style="display:none;">قادم</span> <span id="upcoming-count">0</span></a>
            <a href="finished-matches.html" class="tab"><span class="en">Results</span><span class="ar" style="display:none;">النتائج</span></a>
            <a href="my-bets.html" class="tab"><span class="en">My Bets</span><span class="ar" style="display:none;">رهاناتي</span></a>
        </div>
    </div>
    
    <div class="container">
        <div class="filter-section">
            <select id="league-filter" class="filter-select">
                <option value="all"><span class="en">All Leagues</span><span class="ar" style="display:none;">جميع الدوريات</span></option>
            </select>
        </div>
        
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <span style="color:#00ff9d;"><i class="fas fa-calendar"></i> <span class="en">Next 7 Days</span><span class="ar" style="display:none;">٧ أيام القادمة</span></span>
            <button onclick="window.syncNow?.()" style="background:#1a2332; color:#00ff9d; border:1px solid #00ff9d; padding:8px 16px; border-radius:20px; cursor:pointer; font-size:12px;">
                <i class="fas fa-sync-alt"></i> <span class="en">Refresh</span><span class="ar" style="display:none;">تحديث</span>
            </button>
        </div>
        
        <div id="matches-container"></div>
        <div id="empty-state" class="empty-state" style="display:none;">
            <i class="fas fa-calendar" style="font-size:48px; opacity:0.3;"></i>
            <p><span class="en">No upcoming matches in next 7 days</span><span class="ar" style="display:none;">لا توجد مباريات قادمة في الأيام الـ ٧ القادمة</span></p>
            <button onclick="window.syncNow?.()" class="refresh-btn"><i class="fas fa-sync-alt"></i> <span class="en">Sync Now</span><span class="ar" style="display:none;">مزامنة الآن</span></button>
        </div>
    </div>

    <script src="../js/sports-api.js"></script>
    <script>
        function toggleLanguage() {
            const isEn = document.querySelector('.en').style.display !== 'none';
            document.querySelectorAll('.en').forEach(el => el.style.display = isEn ? 'none' : 'inline');
            document.querySelectorAll('.ar').forEach(el => el.style.display = isEn ? 'inline' : 'none');
            document.documentElement.dir = isEn ? 'rtl' : 'ltr';
            localStorage.setItem('lang', isEn ? 'ar' : 'en');
        }
        
        const savedLang = localStorage.getItem('lang');
        if (savedLang === 'ar') {
            document.querySelectorAll('.en').forEach(el => el.style.display = 'none');
            document.querySelectorAll('.ar').forEach(el => el.style.display = 'inline');
            document.documentElement.dir = 'rtl';
        }
        
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), db = firebase.firestore();
        let allMatches = [], leagues = new Set(), countdownInterval;
        
        auth.onAuthStateChanged(u => { if (!u) location.href = '../login.html'; else loadMatches(); });
        
        function loadMatches() {
            const container = document.getElementById('matches-container');
            const empty = document.getElementById('empty-state');
            const countEl = document.getElementById('upcoming-count');
            const now = new Date();
            const nextWeek = new Date(now); nextWeek.setDate(now.getDate() + 7);
            
            db.collection('sports_matches')
                .where('status', '==', 'upcoming')
                .where('startTime', '>=', now)
                .where('startTime', '<=', nextWeek)
                .orderBy('startTime', 'asc')
                .onSnapshot(snap => {
                    allMatches = []; leagues.clear();
                    snap.forEach(d => { const m = d.data(); allMatches.push(m); if (m.leagueName) leagues.add(m.leagueName); });
                    countEl.textContent = allMatches.length;
                    
                    if (allMatches.length === 0) { container.style.display = 'none'; empty.style.display = 'block'; }
                    else { container.style.display = 'block'; empty.style.display = 'none'; populateFilter(); displayMatches(allMatches); }
                }, e => { console.error(e); });
        }
        
        function populateFilter() {
            const select = document.getElementById('league-filter');
            const allText = document.querySelector('.en')?.style.display !== 'none' ? 'All Leagues' : 'جميع الدوريات';
            select.innerHTML = `<option value="all">${allText}</option>`;
            Array.from(leagues).sort().forEach(l => { const o = document.createElement('option'); o.value = l; o.textContent = l; select.appendChild(o); });
            select.onchange = e => displayMatches(e.target.value === 'all' ? allMatches : allMatches.filter(m => m.leagueName === e.target.value));
        }
        
        function displayMatches(matches) {
            const container = document.getElementById('matches-container');
            const grouped = {};
            matches.forEach(m => { const k = m.startTime.toDate().toDateString(); if (!grouped[k]) grouped[k] = []; grouped[k].push(m); });
            container.innerHTML = '';
            Object.keys(grouped).sort().forEach(k => {
                const d = new Date(k); const today = new Date(); today.setHours(0,0,0,0);
                const tomorrow = new Date(today); tomorrow.setDate(today.getDate()+1);
                let label = d.toLocaleDateString('en-US', {weekday:'long', month:'short', day:'numeric'});
                if (d.toDateString() === today.toDateString()) label = '📅 TODAY - ' + label;
                else if (d.toDateString() === tomorrow.toDateString()) label = '📅 TOMORROW - ' + label;
                container.innerHTML += `<div class="date-header"><span>${label}</span><span>${grouped[k].length} matches</span></div>`;
                grouped[k].forEach(m => container.appendChild(createCard(m)));
            });
            startCountdowns();
        }
        
        function createCard(m) {
            const card = document.createElement('div'); card.className = 'match-card';
            card.onclick = () => location.href = `match-details.html?id=${m.fixtureId}`;
            const time = m.startTime.toDate();
            const id = `cd-${m.fixtureId}`;
            
            const homeLogo = m.homeTeam?.logo || '';
            const awayLogo = m.awayTeam?.logo || '';
            
            card.innerHTML = `
                <div class="match-league"><i class="fas fa-trophy" style="color:#ff9800;"></i> ${m.leagueName||'League'}</div>
                <div class="match-teams">
                    <div class="team">
                        <div class="team-logo">${homeLogo ? `<img src="${homeLogo}" onerror="this.style.display='none'">` : ''}</div>
                        <div class="team-name">${m.homeTeam?.name||'Home'}</div>
                    </div>
                    <div class="vs">VS</div>
                    <div class="team">
                        <div class="team-logo">${awayLogo ? `<img src="${awayLogo}" onerror="this.style.display='none'">` : ''}</div>
                        <div class="team-name">${m.awayTeam?.name||'Away'}</div>
                    </div>
                </div>
                <div class="countdown-box">
                    <div class="countdown-label">⏱️ Starts in</div>
                    <div class="countdown-value" id="${id}">--:--:--</div>
                    <div class="match-datetime">${time.toLocaleDateString()} • ${time.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</div>
                </div>
                <div class="odds">
                    <div class="odd">H: <span class="odd-value">${m.odds?.home||'2.00'}</span></div>
                    <div class="odd">D: <span class="odd-value">${m.odds?.draw||'3.50'}</span></div>
                    <div class="odd">A: <span class="odd-value">${m.odds?.away||'3.80'}</span></div>
                </div>
            `;
            return card;
        }
        
        function startCountdowns() {
            if (countdownInterval) clearInterval(countdownInterval);
            countdownInterval = setInterval(() => {
                allMatches.forEach(m => {
                    const el = document.getElementById(`cd-${m.fixtureId}`);
                    if (el) {
                        const diff = m.startTime.toDate() - new Date();
                        if (diff <= 0) { el.textContent = 'Starting...'; setTimeout(() => loadMatches(), 1000); }
                        else {
                            const h = Math.floor(diff / 3600000), m = Math.floor((diff % 3600000) / 60000), s = Math.floor((diff % 60000) / 1000);
                            el.textContent = `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
                        }
                    }
                });
            }, 1000);
        }
        
        window.addEventListener('beforeunload', () => { if (countdownInterval) clearInterval(countdownInterval); });
    </script>
</body>
</html>
