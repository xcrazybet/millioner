<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Upcoming - X Lodon | المباريات القادمة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <link rel="stylesheet" href="../css/sports-betting.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0f1a; color: white; font-family: 'Segoe UI', 'Tajawal', sans-serif; min-height: 100vh; }
        .header { background: #111827; padding: 12px 15px; border-bottom: 2px solid #00ff9d; position: sticky; top: 0; z-index: 100; }
        .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .back-btn { color: #00ff9d; text-decoration: none; font-size: 20px; }
        .lang-toggle { background: #1a2332; border: 1px solid #00ff9d; color: #00ff9d; padding: 5px 12px; border-radius: 20px; font-size: 14px; cursor: pointer; }
        .tabs { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 3px; }
        .tab { padding: 8px 12px; background: #1a2332; border-radius: 20px; color: white; text-decoration: none; font-size: 12px; white-space: nowrap; }
        .tab.active { background: #00ff9d; color: black; }
        .container { max-width: 1200px; margin: 0 auto; padding: 15px; padding-bottom: 180px; }
        .balance-bar { background: #111827; padding: 10px 15px; border-radius: 12px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #00ff9d33; }
        .selector-bar { display: flex; gap: 10px; margin-bottom: 15px; }
        .league-select { flex: 1; padding: 14px; background: #111827; border: 1px solid #ffffff22; border-radius: 12px; color: white; font-size: 14px; }
        .search-input { flex: 2; padding: 14px; background: #111827; border: 1px solid #ffffff22; border-radius: 12px; color: white; font-size: 14px; }
        .debug-bar { background: #1a2332; padding: 8px 15px; border-radius: 8px; margin-bottom: 10px; font-size: 11px; color: #00ff9d; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .refresh-btn { background: #00ff9d; color: black; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 11px; margin-left: auto; }
        
        .date-section { margin-bottom: 15px; }
        .date-header { color: #00ff9d; font-size: 15px; font-weight: 600; margin-bottom: 8px; padding: 8px 12px; background: #0a0f1a; border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; border: 1px solid #00ff9d22; }
        .date-header i { transition: transform 0.3s; font-size: 12px; }
        .date-header.collapsed i { transform: rotate(-90deg); }
        .date-matches.collapsed { display: none; }
        
        .league-group { margin-bottom: 10px; }
        .league-group-header { display: flex; align-items: center; gap: 8px; padding: 6px 8px; cursor: pointer; border-radius: 6px; }
        .league-group-header:hover { background: #ffffff08; }
        .league-group-header .name { font-weight: 600; font-size: 13px; color: #00ff9d; }
        .league-group-header .count { color: #a0a8c9; font-size: 11px; margin-left: auto; }
        .league-group-header i { color: #a0a8c9; transition: transform 0.3s; font-size: 10px; }
        .league-group-header.collapsed i { transform: rotate(-90deg); }
        .league-matches { border-left: 2px solid #00ff9d22; padding-left: 10px; }
        .league-matches.collapsed { display: none; }
        
        .match-row { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid #ffffff0a; font-size: 12px; flex-wrap: wrap; }
        .match-time-col { text-align: center; min-width: 55px; }
        .match-time-col .time { font-weight: bold; color: #00ff9d; font-size: 13px; }
        .match-time-col .countdown { font-size: 10px; color: #a0a8c9; font-family: monospace; }
        .team-col { flex: 2; display: flex; align-items: center; gap: 8px; min-width: 180px; }
        .team-col img { width: 24px; height: 24px; object-fit: contain; border-radius: 50%; background: #1a2332; padding: 2px; }
        .team-col .names { font-weight: 500; font-size: 13px; }
        .team-col .names .vs { color: #ff9800; margin: 0 5px; font-weight: bold; }
        .odds-col { display: flex; gap: 5px; }
        .odd-mini { padding: 5px 8px; background: #0a0f1a; border-radius: 6px; font-size: 11px; text-align: center; min-width: 42px; border: 1px solid #ffffff15; cursor: pointer; transition: all 0.2s; }
        .odd-mini:hover { background: #00ff9d22; border-color: #00ff9d; }
        .odd-mini span { color: #00ff9d; font-weight: bold; font-size: 12px; }
        .bet-btn, .slip-btn { padding: 6px 14px; border-radius: 20px; font-size: 11px; font-weight: 700; cursor: pointer; transition: all 0.2s; border: none; }
        .bet-btn { background: #00ff9d; color: black; }
        .bet-btn:hover { background: #00cc7a; transform: scale(1.02); }
        .slip-btn { background: #ff9800; color: black; }
        .slip-btn:hover { background: #e68900; transform: scale(1.02); }
        
        .bet-slip { position: fixed; bottom: 0; left: 0; right: 0; background: #111827; border-top: 2px solid #ff9800; padding: 15px; z-index: 1000; max-height: 250px; overflow-y: auto; }
        .slip-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .slip-title { color: #ff9800; font-weight: 600; }
        .slip-clear { color: #ff5252; font-size: 12px; cursor: pointer; }
        .slip-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #ffffff11; font-size: 12px; }
        .slip-remove { color: #ff5252; cursor: pointer; margin-left: 10px; }
        .slip-total { display: flex; justify-content: space-between; padding: 10px 0; font-weight: bold; }
        .slip-total-odds { color: #ff9800; font-weight: bold; font-size: 18px; }
        .slip-place-btn { width: 100%; padding: 12px; background: #ff9800; color: black; border: none; border-radius: 10px; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 5px; }
        .slip-place-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .empty-state { text-align: center; padding: 50px; color: #a0a8c9; }
        .empty-state i { font-size: 48px; margin-bottom: 15px; color: #00ff9d44; }
        .arabic { font-family: 'Tajawal', sans-serif; }
        
        @media (max-width: 768px) {
            .match-row { flex-direction: column; align-items: flex-start; gap: 8px; padding: 12px 0; }
            .team-col { width: 100%; }
            .odds-col { width: 100%; justify-content: center; }
            .bet-btn, .slip-btn { flex: 1; text-align: center; }
            .match-row > * { width: 100%; }
            .bet-btn, .slip-btn { width: calc(50% - 5px); display: inline-block; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-top">
            <div class="header-left">
                <a href="betting-sport.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
                <h1 style="font-size:18px;"><i class="fas fa-futbol"></i> X Lodon Sports</h1>
            </div>
            <button class="lang-toggle" onclick="toggleLanguage()">🇸🇦 عربي</button>
        </div>
        <div class="tabs">
            <a href="betting-sport.html" class="tab">Home</a>
            <a href="live-matches.html" class="tab">Live</a>
            <a href="upcoming-matches.html" class="tab active">Upcoming</a>
            <a href="finished-matches.html" class="tab">Results</a>
            <a href="my-bets.html" class="tab">My Bets</a>
        </div>
    </div>
    
    <div class="container">
        <div class="balance-bar">
            <span><i class="fas fa-wallet"></i> Balance</span>
            <span style="color:#00ff9d;font-weight:bold;font-size:18px;" id="balance-display">$0.00</span>
        </div>
        <div class="selector-bar">
            <select id="league-filter" class="league-select"><option value="all">🏆 All Leagues</option></select>
            <input type="text" id="search-input" class="search-input" placeholder="🔍 Search league or team..." oninput="filterMatches()">
        </div>
        <div class="debug-bar" id="debug-bar">
            <i class="fas fa-database"></i> 
            <span id="debug-text">Initializing...</span>
            <button class="refresh-btn" onclick="loadAllMatches()"><i class="fas fa-sync-alt"></i> Refresh</button>
        </div>
        <div id="matches-container"><div style="text-align:center;padding:30px;"><i class="fas fa-spinner fa-spin"></i> Loading upcoming matches...</div></div>
    </div>
    
    <div class="bet-slip" id="bet-slip" style="display:none;">
        <div class="slip-header">
            <span class="slip-title"><i class="fas fa-layer-group"></i> Bet Slip (<span id="slip-count">0</span>)</span>
            <span class="slip-clear" onclick="clearSlip()"><i class="fas fa-trash"></i> Clear</span>
        </div>
        <div id="slip-items"></div>
        <div class="slip-total"><span>Total Odds:</span><span class="slip-total-odds" id="slip-total-odds">1.00</span></div>
        <button class="slip-place-btn" id="place-acc-btn" disabled onclick="placeAccumulator()">Place Bet (2+ selections)</button>
    </div>

    <script src="../js/supabase-client.js"></script>
    <script src="../js/betting-engine.js"></script>
    <script>
        // Language toggle
        function toggleLanguage() {
            var isEn = document.querySelector('.en')?.style.display !== 'none';
            if(document.querySelector('.en')){
                document.querySelectorAll('.en').forEach(el => el.style.display = isEn ? 'none' : '');
                document.querySelectorAll('.ar').forEach(el => el.style.display = isEn ? '' : 'none');
                document.documentElement.dir = isEn ? 'rtl' : 'ltr';
                localStorage.setItem('lang', isEn ? 'ar' : 'en');
            }
        }
        
        // Firebase config (Auth & Wallet only)
        const firebaseConfig = { 
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM", 
            authDomain: "x-bet-prod-jd.firebaseapp.com", 
            projectId: "x-bet-prod-jd", 
            storageBucket: "x-bet-prod-jd.firebasestorage.app", 
            messagingSenderId: "499334334535", 
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962" 
        };
        if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        
        let allMatches = [];
        let countdownInterval;
        let selectedLeague = 'all';
        
        // Auth check
        firebase.auth().onAuthStateChanged(async (u) => { 
            if(!u) {
                location.href = '../login.html';
            } else {
                await init();
            }
        });
        
        async function init() {
            await loadBalance();
            await loadLeaguesFilter();
            await loadAllMatches();
            // Auto refresh every 30 seconds to remove started matches
            setInterval(loadAllMatches, 30000);
        }
        
        async function loadBalance() {
            try {
                const db = firebase.firestore();
                const uid = firebase.auth().currentUser?.uid;
                if(!uid) return;
                const w = await db.collection('wallets').doc(uid).get();
                const balance = w.exists ? (w.data().balance || 0) : 0;
                document.getElementById('balance-display').textContent = '$' + balance.toFixed(2);
            } catch(e) {
                console.error('Balance error:', e);
            }
        }
        
        async function loadLeaguesFilter() {
            const select = document.getElementById('league-filter');
            try {
                const r = await fetch('https://millioner.onrender.com/api/leagues');
                const d = await r.json();
                if(d.success && d.data) {
                    d.data.sort((a,b) => (a.name || '').localeCompare(b.name || ''));
                    d.data.forEach(l => { 
                        if(l.name) { 
                            const o = document.createElement('option'); 
                            o.value = l.id; 
                            o.textContent = l.name; 
                            select.appendChild(o); 
                        } 
                    });
                }
            } catch(e) {
                console.error('Leagues error:', e);
            }
            select.onchange = function() { 
                selectedLeague = this.value; 
                filterMatches(); 
            };
        }
        
        async function loadAllMatches() {
            if(!window.supaDB) {
                document.getElementById('debug-text').innerHTML = '⚠️ Waiting for Supabase...';
                return;
            }
            
            try {
                document.getElementById('debug-text').innerHTML = '<i class="fas fa-spinner fa-spin"></i> Fetching matches from Supabase...';
                
                // Get date range: START FROM TODAY MIDNIGHT to TODAY + 7 days
                const startOfToday = new Date();
                startOfToday.setHours(0, 0, 0, 0);
                
                const endDate = new Date(startOfToday);
                endDate.setDate(startOfToday.getDate() + 7);
                
                console.log('Fetching matches from:', startOfToday, 'to:', endDate);
                
                // Get matches from Supabase using your existing function
                let matches = await window.supaDB.getUpcomingByDate(startOfToday, endDate);
                
                console.log('Raw matches from Supabase:', matches.length);
                
                if(!matches || matches.length === 0) {
                    document.getElementById('debug-text').innerHTML = '⚠️ No matches found in Supabase';
                    document.getElementById('matches-container').innerHTML = '<div class="empty-state"><i class="fas fa-database"></i><p>No matches found in database</p><button onclick="loadAllMatches()" style="margin-top:15px;padding:10px 20px;background:#00ff9d;color:black;border:none;border-radius:8px;cursor:pointer;">Retry</button></div>';
                    return;
                }
                
                // Filter out matches that have already started
                const now = new Date();
                const upcomingMatches = matches.filter(match => {
                    const matchTime = new Date(match.start_time);
                    return matchTime > now;
                });
                
                const startedCount = matches.length - upcomingMatches.length;
                allMatches = upcomingMatches;
                
                document.getElementById('debug-text').innerHTML = `✅ ${allMatches.length} upcoming matches (${startedCount} started/live hidden) - Next 7 days`;
                
                if(allMatches.length === 0) {
                    document.getElementById('matches-container').innerHTML = '<div class="empty-state"><i class="fas fa-calendar-alt"></i><p>No upcoming matches in the next 7 days</p><small>Check back later for new fixtures</small></div>';
                } else {
                    filterMatches();
                }
            } catch(error) {
                console.error('Load matches error:', error);
                document.getElementById('debug-text').innerHTML = `❌ Error: ${error.message}`;
                document.getElementById('matches-container').innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Failed to load matches: ${error.message}</p><button onclick="loadAllMatches()" style="margin-top:15px;padding:10px 20px;background:#00ff9d;color:black;border:none;border-radius:8px;cursor:pointer;">Retry</button></div>`;
            }
        }
        
        function filterMatches() {
            const container = document.getElementById('matches-container');
            const search = (document.getElementById('search-input').value || '').toLowerCase();
            
            let filtered = [...allMatches];
            
            // Apply league filter
            if(selectedLeague !== 'all') {
                filtered = filtered.filter(m => String(m.league_id) === String(selectedLeague));
            }
            
            // Apply search filter
            if(search) {
                filtered = filtered.filter(m => {
                    const homeName = (m.home_team?.name || m.home_team_name || '').toLowerCase();
                    const awayName = (m.away_team?.name || m.away_team_name || '').toLowerCase();
                    const leagueName = (m.league_name || '').toLowerCase();
                    return homeName.includes(search) || awayName.includes(search) || leagueName.includes(search);
                });
            }
            
            if(filtered.length === 0) { 
                container.innerHTML = '<div class="empty-state"><i class="fas fa-filter"></i><p>No matches match your filters</p><button onclick="document.getElementById(\'search-input\').value=\'\';selectedLeague=\'all\';document.getElementById(\'league-filter\').value=\'all\';filterMatches();" style="margin-top:15px;padding:10px 20px;background:#00ff9d;color:black;border:none;border-radius:8px;cursor:pointer;">Clear Filters</button></div>'; 
                return; 
            }
            
            // Group by date
            const dateGrouped = {};
            filtered.forEach(m => { 
                const d = new Date(m.start_time); 
                const key = d.toDateString(); 
                if(!dateGrouped[key]) dateGrouped[key] = []; 
                dateGrouped[key].push(m); 
            });
            
            container.innerHTML = '';
            const today = new Date(); 
            today.setHours(0, 0, 0, 0);
            const tomorrow = new Date(today); 
            tomorrow.setDate(today.getDate() + 1);
            
            // Sort dates
            Object.keys(dateGrouped).sort((a, b) => new Date(a) - new Date(b)).forEach(key => {
                const date = new Date(key);
                let label = date.toLocaleDateString('en-US', {weekday: 'long', month: 'short', day: 'numeric'});
                if(date.toDateString() === today.toDateString()) label = '📅 TODAY - ' + label;
                else if(date.toDateString() === tomorrow.toDateString()) label = '📅 TOMORROW - ' + label;
                
                // Group by league within each date
                const leagueGrouped = {};
                dateGrouped[key].forEach(m => {
                    const leagueName = m.league_name || 'Other Leagues';
                    if(!leagueGrouped[leagueName]) leagueGrouped[leagueName] = [];
                    leagueGrouped[leagueName].push(m);
                });
                
                let leagueHtml = '';
                Object.keys(leagueGrouped).sort().forEach(leagueName => {
                    leagueHtml += `
                    <div class="league-group">
                        <div class="league-group-header" onclick="this.classList.toggle('collapsed');this.nextElementSibling.classList.toggle('collapsed');">
                            <i class="fas fa-trophy"></i>
                            <span class="name">${escapeHtml(leagueName)}</span>
                            <span class="count">${leagueGrouped[leagueName].length} matches</span>
                            <i class="fas fa-chevron-down"></i>
                        </div>
                        <div class="league-matches">
                            ${leagueGrouped[leagueName].map(m => createMatchRow(m)).join('')}
                        </div>
                    </div>`;
                });
                
                const section = document.createElement('div'); 
                section.className = 'date-section';
                section.innerHTML = `
                    <div class="date-header" onclick="this.classList.toggle('collapsed');this.nextElementSibling.classList.toggle('collapsed');">
                        <span><i class="far fa-calendar-alt"></i> ${label}</span>
                        <span style="font-size:12px;color:#a0a8c9;">${dateGrouped[key].length} matches</span>
                        <i class="fas fa-chevron-down"></i>
                    </div>
                    <div class="date-matches">${leagueHtml}</div>
                `;
                container.appendChild(section);
            });
            
            startCountdowns(filtered);
        }
        
        function createMatchRow(m) {
            const time = new Date(m.start_time);
            
            // Extract team names and logos correctly from Supabase structure
            let homeName = 'Home';
            let awayName = 'Away';
            let homeLogo = '';
            let awayLogo = '';
            
            if(m.home_team) {
                homeName = m.home_team.name || 'Home';
                homeLogo = m.home_team.logo || '';
            } else if(m.home_team_name) {
                homeName = m.home_team_name;
            }
            
            if(m.away_team) {
                awayName = m.away_team.name || 'Away';
                awayLogo = m.away_team.logo || '';
            } else if(m.away_team_name) {
                awayName = m.away_team_name;
            }
            
            // Get odds
            const odds = m.odds || { home: 2.00, draw: 3.50, away: 3.80 };
            const homeOdds = odds.home || 2.00;
            const drawOdds = odds.draw || 3.50;
            const awayOdds = odds.away || 3.80;
            
            const matchId = m.fixture_id || m.id;
            
            return `
                <div class="match-row" data-fixture-id="${matchId}">
                    <div class="match-time-col">
                        <div class="time">${time.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'})}</div>
                        <div class="countdown" id="cd-${matchId}">--:--:--</div>
                    </div>
                    <div class="team-col">
                        ${homeLogo ? `<img src="${homeLogo}" onerror="this.style.display='none'" alt="${homeName}">` : '<i class="fas fa-shield-alt" style="width:24px;color:#00ff9d44;"></i>'}
                        <span class="names">${escapeHtml(homeName)} <span class="vs">vs</span> ${escapeHtml(awayName)}</span>
                        ${awayLogo ? `<img src="${awayLogo}" onerror="this.style.display='none'" alt="${awayName}">` : '<i class="fas fa-shield-alt" style="width:24px;color:#00ff9d44;"></i>'}
                    </div>
                    <div class="odds-col">
                        <div class="odd-mini" onclick="addToSlip('${matchId}', '${escapeHtml(homeName)} vs ${escapeHtml(awayName)}', 'home', ${homeOdds})">1 <span>${homeOdds.toFixed(2)}</span></div>
                        <div class="odd-mini" onclick="addToSlip('${matchId}', '${escapeHtml(homeName)} vs ${escapeHtml(awayName)}', 'draw', ${drawOdds})">X <span>${drawOdds.toFixed(2)}</span></div>
                        <div class="odd-mini" onclick="addToSlip('${matchId}', '${escapeHtml(homeName)} vs ${escapeHtml(awayName)}', 'away', ${awayOdds})">2 <span>${awayOdds.toFixed(2)}</span></div>
                    </div>
                    <button class="bet-btn" onclick="goToMatch('${matchId}')"><i class="fas fa-ticket-alt"></i> Bet</button>
                    <button class="slip-btn" onclick="addToSlip('${matchId}', '${escapeHtml(homeName)} vs ${escapeHtml(awayName)}', 'pick', ${homeOdds})"><i class="fas fa-plus-circle"></i> +Slip</button>
                </div>
            `;
        }
        
        function escapeHtml(str) {
            if(!str) return '';
            return String(str).replace(/[&<>]/g, function(m) {
                if(m === '&') return '&amp;';
                if(m === '<') return '&lt;';
                if(m === '>') return '&gt;';
                return m;
            });
        }
        
        function startCountdowns(matches) {
            if(countdownInterval) clearInterval(countdownInterval);
            
            function updateCountdowns() {
                const now = new Date();
                let needsRefresh = false;
                
                matches.forEach(m => {
                    const matchId = m.fixture_id || m.id;
                    const el = document.getElementById('cd-' + matchId);
                    if(el) {
                        const matchTime = new Date(m.start_time);
                        const diff = matchTime - now;
                        
                        if(diff <= 0) {
                            el.textContent = '🔴 LIVE';
                            el.style.color = '#ff5252';
                            el.style.fontWeight = 'bold';
                            needsRefresh = true;
                        } else {
                            const hours = Math.floor(diff / 3600000);
                            const minutes = Math.floor((diff % 3600000) / 60000);
                            const seconds = Math.floor((diff % 60000) / 1000);
                            el.textContent = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
                            el.style.color = '#a0a8c9';
                        }
                    }
                });
                
                // Refresh if any matches have started
                if(needsRefresh) {
                    loadAllMatches();
                }
            }
            
            updateCountdowns();
            countdownInterval = setInterval(updateCountdowns, 1000);
        }
        
        // Accumulator functions
        window.ACCUMULATOR_SLIP = JSON.parse(localStorage.getItem('accumulator_slip') || '[]');
        
        function addToSlip(matchId, matchName, betType, odds) {
            let betTypeName = '';
            if(betType === 'home') betTypeName = 'Home Win';
            else if(betType === 'draw') betTypeName = 'Draw';
            else if(betType === 'away') betTypeName = 'Away Win';
            else if(betType === 'pick') {
                const choice = prompt('Select bet type:\n1 - Home Win\n2 - Draw\n3 - Away Win', '1');
                if(choice === '1') betTypeName = 'Home Win';
                else if(choice === '2') betTypeName = 'Draw';
                else if(choice === '3') betTypeName = 'Away Win';
                else return;
            }
            
            window.ACCUMULATOR_SLIP.push({
                matchId: matchId,
                matchName: matchName,
                betType: betTypeName,
                odds: odds,
                timestamp: Date.now()
            });
            
            saveSlip();
            updateSlipUI();
            alert(`✅ Added: ${matchName} - ${betTypeName} @ ${odds.toFixed(2)}`);
        }
        
        function saveSlip() {
            localStorage.setItem('accumulator_slip', JSON.stringify(window.ACCUMULATOR_SLIP));
        }
        
        function updateSlipUI() {
            const slip = document.getElementById('bet-slip');
            const count = window.ACCUMULATOR_SLIP.length;
            
            if(count === 0) {
                slip.style.display = 'none';
                return;
            }
            
            slip.style.display = 'block';
            document.getElementById('slip-count').textContent = count;
            
            let itemsHtml = '';
            let totalOdds = 1;
            
            window.ACCUMULATOR_SLIP.forEach((s, i) => {
                totalOdds *= s.odds;
                itemsHtml += `
                    <div class="slip-item">
                        <span>${escapeHtml(s.matchName)}<br><small>${s.betType} @ ${s.odds.toFixed(2)}</small></span>
                        <span class="slip-remove" onclick="removeFromSlip(${i})"><i class="fas fa-times-circle"></i></span>
                    </div>
                `;
            });
            
            document.getElementById('slip-items').innerHTML = itemsHtml;
            document.getElementById('slip-total-odds').textContent = totalOdds.toFixed(2);
            document.getElementById('place-acc-btn').disabled = count < 2;
        }
        
        window.removeFromSlip = function(index) {
            window.ACCUMULATOR_SLIP.splice(index, 1);
            saveSlip();
            updateSlipUI();
        };
        
        window.clearSlip = function() {
            window.ACCUMULATOR_SLIP = [];
            saveSlip();
            updateSlipUI();
        };
        
        async function placeAccumulator() {
            if(window.ACCUMULATOR_SLIP.length < 2) {
                alert('Add at least 2 selections for accumulator');
                return;
            }
            
            const amount = parseFloat(prompt('Enter stake amount ($):', '10'));
            if(!amount || amount < 1) {
                alert('Invalid stake amount');
                return;
            }
            
            const balanceEl = document.getElementById('balance-display');
            const currentBalance = parseFloat(balanceEl.textContent.replace('$', ''));
            
            if(amount > currentBalance) {
                alert(`Insufficient balance! Your balance is $${currentBalance.toFixed(2)}`);
                return;
            }
            
            try {
                if(typeof placeAccumulatorBet === 'function') {
                    const result = await placeAccumulatorBet(window.ACCUMULATOR_SLIP, amount);
                    if(result.success) {
                        alert('✅ Bet placed successfully!');
                        clearSlip();
                        loadBalance();
                        if(result.redirectTo) location.href = result.redirectTo;
                    } else {
                        alert('Error: ' + (result.error || 'Failed to place bet'));
                    }
                } else {
                    alert('Bet placed! (Demo mode)');
                    clearSlip();
                    await loadBalance();
                }
            } catch(e) {
                alert('Error placing bet: ' + e.message);
            }
        }
        
        function goToMatch(matchId) {
            window.location.href = `match-details.html?id=${matchId}`;
        }
        
        window.loadAllMatches = loadAllMatches;
        window.placeAccumulator = placeAccumulator;
        window.updateSlipUI = updateSlipUI;
        
        // Cleanup interval on page unload
        window.addEventListener('beforeunload', () => {
            if(countdownInterval) clearInterval(countdownInterval);
        });
    </script>
</body>
</html>
