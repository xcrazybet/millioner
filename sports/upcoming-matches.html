<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Upcoming - X Lodon | المباريات القادمة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="../css/sports-betting.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0f1a; color: white; font-family: 'Segoe UI', 'Tajawal', sans-serif; min-height: 100vh; }
        .header { background: #111827; padding: 12px 15px; border-bottom: 2px solid #00ff9d; position: sticky; top: 0; z-index: 100; }
        .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .back-btn { color: #00ff9d; text-decoration: none; font-size: 20px; }
        .lang-toggle { background: #1a2332; border: 1px solid #00ff9d; color: #00ff9d; padding: 5px 12px; border-radius: 20px; font-size: 14px; cursor: pointer; }
        .tabs { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 3px; }
        .tab { padding: 8px 12px; background: #1a2332; border-radius: 20px; color: white; text-decoration: none; font-size: 12px; white-space: nowrap; }
        .tab.active { background: #00ff9d; color: black; }
        .container { max-width: 1200px; margin: 0 auto; padding: 15px; }
        
        /* Date Picker Styles */
        .date-selector { display: flex; gap: 8px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px; }
        .date-btn { padding: 10px 16px; background: #1a2332; border: 1px solid #ffffff22; border-radius: 25px; color: white; font-size: 13px; cursor: pointer; white-space: nowrap; transition: all 0.2s; }
        .date-btn.active { background: #00ff9d; color: black; border-color: #00ff9d; }
        .date-btn i { margin-right: 5px; }
        .calendar-input { display: none; }
        .custom-date-btn { background: #00ff9d22; border-color: #00ff9d; color: #00ff9d; }
        
        .filter-row { display: flex; gap: 10px; margin-bottom: 15px; }
        .filter-select { flex: 1; padding: 12px; background: #111827; border: 1px solid #ffffff22; border-radius: 10px; color: white; font-size: 14px; }
        
        .info-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; color: #a0a8c9; font-size: 13px; }
        .load-more-btn { background: transparent; border: 1px dashed #00ff9d; color: #00ff9d; padding: 12px; border-radius: 10px; width: 100%; cursor: pointer; margin-top: 15px; }
        
        .match-card { background: #111827; border-radius: 12px; padding: 15px; margin-bottom: 10px; border-left: 4px solid #00ff9d; cursor: pointer; transition: transform 0.15s; }
        .match-card:active { transform: scale(0.99); }
        .match-league { color: #a0a8c9; font-size: 12px; margin-bottom: 10px; display: flex; align-items: center; gap: 5px; }
        .match-teams { display: flex; align-items: center; justify-content: space-around; margin: 10px 0; }
        .team { text-align: center; flex: 1; }
        .team-initials { width: 45px; height: 45px; margin: 0 auto 8px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 16px; color: white; }
        .team-name { font-weight: 600; font-size: 13px; }
        .vs { color: #ff9800; font-weight: bold; padding: 0 10px; }
        .countdown-box { background: #1a2332; border-radius: 8px; padding: 10px; margin-top: 12px; text-align: center; }
        .countdown-label { color: #a0a8c9; font-size: 11px; }
        .countdown-value { color: #00ff9d; font-size: 18px; font-weight: bold; }
        .match-time { color: #a0a8c9; font-size: 11px; margin-top: 5px; }
        .odds { display: flex; gap: 8px; margin-top: 12px; }
        .odd { flex: 1; text-align: center; padding: 8px; background: #0a0f1a; border-radius: 6px; }
        .odd-value { color: #00ff9d; font-weight: bold; }
        
        .empty-state { text-align: center; padding: 50px 20px; color: #a0a8c9; }
        .loading-skeleton { text-align: center; padding: 30px; }
        .skeleton-card { background: #1a2332; border-radius: 12px; padding: 15px; margin-bottom: 10px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }
        
        .arabic { font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-top">
            <div class="header-left">
                <a href="betting-sport.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
                <h1 style="font-size:18px;"><i class="fas fa-futbol"></i> <span class="en">X Lodon Sports</span><span class="ar" style="display:none;">إكس لودون سبورت</span></h1>
            </div>
            <button class="lang-toggle" onclick="toggleLanguage()"><span class="en">🇸🇦 عربي</span><span class="ar" style="display:none;">🇬🇧 English</span></button>
        </div>
        <div class="tabs">
            <a href="betting-sport.html" class="tab"><span class="en">Home</span><span class="ar" style="display:none;">الرئيسية</span></a>
            <a href="live-matches.html" class="tab"><span class="en">Live</span><span class="ar" style="display:none;">مباشر</span></a>
            <a href="upcoming-matches.html" class="tab active"><span class="en">Upcoming</span><span class="ar" style="display:none;">قادم</span> <span id="upcoming-count">0</span></a>
            <a href="finished-matches.html" class="tab"><span class="en">Results</span><span class="ar" style="display:none;">النتائج</span></a>
            <a href="my-bets.html" class="tab"><span class="en">My Bets</span><span class="ar" style="display:none;">رهاناتي</span></a>
        </div>
    </div>
    
    <div class="container">
        <!-- Date Selector -->
        <div class="date-selector" id="date-selector">
            <button class="date-btn active" data-date="today"><i class="far fa-calendar-check"></i> <span class="en">Today</span><span class="ar" style="display:none;">اليوم</span></button>
            <button class="date-btn" data-date="tomorrow"><i class="far fa-calendar"></i> <span class="en">Tomorrow</span><span class="ar" style="display:none;">الغد</span></button>
            <button class="date-btn custom-date-btn" onclick="document.getElementById('custom-date').click()"><i class="fas fa-calendar-alt"></i> <span class="en">Pick Date</span><span class="ar" style="display:none;">اختر تاريخ</span></button>
            <input type="date" id="custom-date" class="calendar-input" min="" max="">
        </div>
        
        <!-- League Filter -->
        <div class="filter-row">
            <select id="league-filter" class="filter-select">
                <option value="all"><span class="en">All Leagues</span><span class="ar" style="display:none;">جميع الدوريات</span></option>
            </select>
        </div>
        
        <!-- Info Bar -->
        <div class="info-bar">
            <span id="selected-date-display"><i class="far fa-calendar"></i> <span class="en">Today</span><span class="ar" style="display:none;">اليوم</span></span>
            <span id="match-count-display">0 <span class="en">matches</span><span class="ar" style="display:none;">مباراة</span></span>
        </div>
        
        <!-- Matches Container -->
        <div id="matches-container">
            <div class="loading-skeleton">
                <div class="skeleton-card" style="height:120px;"></div>
                <div class="skeleton-card" style="height:120px;"></div>
                <div class="skeleton-card" style="height:120px;"></div>
            </div>
        </div>
        
        <!-- Load More Button -->
        <button class="load-more-btn" id="load-more-btn" style="display:none;" onclick="loadMoreDays()">
            <i class="fas fa-plus"></i> <span class="en">Load Next Day</span><span class="ar" style="display:none;">تحميل اليوم التالي</span>
        </button>
        
        <!-- Empty State -->
        <div id="empty-state" class="empty-state" style="display:none;">
            <i class="fas fa-calendar-times" style="font-size:48px; opacity:0.3;"></i>
            <p><span class="en">No matches on this date</span><span class="ar" style="display:none;">لا توجد مباريات في هذا التاريخ</span></p>
            <button onclick="window.syncNow?.()" style="margin-top:15px; padding:10px 20px; background:#00ff9d; color:black; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">
                <i class="fas fa-sync-alt"></i> <span class="en">Refresh</span><span class="ar" style="display:none;">تحديث</span>
            </button>
        </div>
    </div>

    <script src="../js/sports-api.js"></script>
    <script>
        // Language Toggle
        function toggleLanguage() {
            const isEn = document.querySelector('.en').style.display !== 'none';
            document.querySelectorAll('.en').forEach(el => el.style.display = isEn ? 'none' : 'inline');
            document.querySelectorAll('.ar').forEach(el => el.style.display = isEn ? 'inline' : 'none');
            document.documentElement.dir = isEn ? 'rtl' : 'ltr';
            localStorage.setItem('lang', isEn ? 'ar' : 'en');
        }
        if (localStorage.getItem('lang') === 'ar') {
            document.querySelectorAll('.en').forEach(el => el.style.display = 'none');
            document.querySelectorAll('.ar').forEach(el => el.style.display = 'inline');
            document.documentElement.dir = 'rtl';
        }
        
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), db = firebase.firestore();
        
        let currentDate = new Date();
        currentDate.setHours(0, 0, 0, 0);
        let loadedDays = 1;
        let allMatches = [], leagues = new Set(), countdownInterval;
        let cachedLeagues = JSON.parse(localStorage.getItem('cachedLeagues') || '[]');
        
        // Set date picker min/max
        const today = new Date(); today.setHours(0,0,0,0);
        const maxDate = new Date(today); maxDate.setDate(today.getDate() + 7);
        document.getElementById('custom-date').min = today.toISOString().split('T')[0];
        document.getElementById('custom-date').max = maxDate.toISOString().split('T')[0];
        
        auth.onAuthStateChanged(u => { if (!u) location.href = '../login.html'; else initialize(); });
        
        function initialize() {
            setupDatePicker();
            loadMatchesForDate(currentDate);
        }
        
        function setupDatePicker() {
            document.querySelectorAll('.date-btn[data-date]').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.date-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    
                    const dateType = btn.dataset.date;
                    if (dateType === 'today') currentDate = new Date(today);
                    else if (dateType === 'tomorrow') { currentDate = new Date(today); currentDate.setDate(today.getDate() + 1); }
                    
                    loadedDays = 1;
                    loadMatchesForDate(currentDate);
                    updateDateDisplay();
                });
            });
            
            document.getElementById('custom-date').addEventListener('change', (e) => {
                if (e.target.value) {
                    document.querySelectorAll('.date-btn').forEach(b => b.classList.remove('active'));
                    currentDate = new Date(e.target.value);
                    loadedDays = 1;
                    loadMatchesForDate(currentDate);
                    updateDateDisplay();
                }
            });
        }
        
        function updateDateDisplay() {
            const display = document.getElementById('selected-date-display');
            const date = currentDate;
            const todayStr = today.toDateString();
            const tomorrowStr = new Date(today); tomorrowStr.setDate(today.getDate() + 1);
            
            let label = date.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
            if (date.toDateString() === todayStr) label = '📅 Today - ' + label;
            else if (date.toDateString() === tomorrowStr.toDateString()) label = '📅 Tomorrow - ' + label;
            
            display.innerHTML = `<i class="far fa-calendar"></i> ${label}`;
        }
        
        async function loadMatchesForDate(date, append = false) {
            const container = document.getElementById('matches-container');
            const empty = document.getElementById('empty-state');
            const loadMoreBtn = document.getElementById('load-more-btn');
            
            if (!append) {
                container.innerHTML = '<div class="loading-skeleton"><div class="skeleton-card" style="height:120px;"></div></div>';
            }
            
            const startOfDay = new Date(date); startOfDay.setHours(0, 0, 0, 0);
            const endOfDay = new Date(date); endOfDay.setHours(23, 59, 59, 999);
            
            const snapshot = await db.collection('sports_matches')
                .where('status', '==', 'upcoming')
                .where('startTime', '>=', startOfDay)
                .where('startTime', '<=', endOfDay)
                .orderBy('startTime', 'asc')
                .get();
            
            const matches = [];
            snapshot.forEach(d => { const m = d.data(); matches.push(m); if (m.leagueName) leagues.add(m.leagueName); });
            
            if (!append) {
                allMatches = matches;
                container.innerHTML = '';
            } else {
                allMatches = [...allMatches, ...matches];
            }
            
            document.getElementById('match-count-display').innerHTML = `${allMatches.length} <span class="en">matches</span><span class="ar" style="display:none;">مباراة</span>`;
            
            if (allMatches.length === 0) {
                container.style.display = 'none';
                empty.style.display = 'block';
                loadMoreBtn.style.display = 'none';
            } else {
                container.style.display = 'block';
                empty.style.display = 'none';
                populateLeagueFilter();
                renderMatches();
                
                // Show load more if less than 3 days loaded and within 7 days
                const daysFromToday = Math.floor((currentDate - today) / (1000 * 60 * 60 * 24));
                loadMoreBtn.style.display = (loadedDays < 3 && daysFromToday + loadedDays < 7) ? 'block' : 'none';
            }
            
            // Background pre-load next day
            if (!append && loadedDays === 1) {
                setTimeout(() => preloadNextDay(), 2000);
            }
        }
        
        async function preloadNextDay() {
            const nextDate = new Date(currentDate); nextDate.setDate(currentDate.getDate() + 1);
            if (nextDate <= maxDate) {
                console.log('🔄 Background pre-loading:', nextDate.toDateString());
                const endOfDay = new Date(nextDate); endOfDay.setHours(23, 59, 59, 999);
                await db.collection('sports_matches')
                    .where('status', '==', 'upcoming')
                    .where('startTime', '>=', nextDate)
                    .where('startTime', '<=', endOfDay)
                    .get();
            }
        }
        
        function loadMoreDays() {
            currentDate.setDate(currentDate.getDate() + 1);
            loadedDays++;
            loadMatchesForDate(currentDate, true);
            updateDateDisplay();
        }
        
        function populateLeagueFilter() {
            if (cachedLeagues.length === 0 && leagues.size > 0) {
                cachedLeagues = Array.from(leagues).sort();
                localStorage.setItem('cachedLeagues', JSON.stringify(cachedLeagues));
            }
            
            const select = document.getElementById('league-filter');
            const allText = document.querySelector('.en')?.style.display !== 'none' ? 'All Leagues' : 'جميع الدوريات';
            select.innerHTML = `<option value="all">${allText}</option>`;
            
            const leagueList = cachedLeagues.length > 0 ? cachedLeagues : Array.from(leagues).sort();
            leagueList.forEach(l => { const o = document.createElement('option'); o.value = l; o.textContent = l; select.appendChild(o); });
            
            select.onchange = (e) => {
                const filtered = e.target.value === 'all' ? allMatches : allMatches.filter(m => m.leagueName === e.target.value);
                renderMatches(filtered);
            };
        }
        
        function renderMatches(matchesToRender = allMatches) {
            const container = document.getElementById('matches-container');
            container.innerHTML = '';
            
            matchesToRender.forEach(m => container.appendChild(createCard(m)));
            startCountdowns(matchesToRender);
        }
        
        function getTeamColor(name) {
            const hash = (name || 'Team').split('').reduce((a, b) => a + b.charCodeAt(0), 0);
            const hue = hash % 360;
            return `hsl(${hue}, 65%, 45%)`;
        }
        
        function createCard(m) {
            const card = document.createElement('div'); card.className = 'match-card';
            card.onclick = () => location.href = `match-details.html?id=${m.fixtureId}`;
            
            const time = m.startTime.toDate();
            const id = `cd-${m.fixtureId}`;
            const homeName = m.homeTeam?.name || 'Home';
            const awayName = m.awayTeam?.name || 'Away';
            
            card.innerHTML = `
                <div class="match-league"><i class="fas fa-trophy" style="color:#ff9800;"></i> ${m.leagueName||'League'}</div>
                <div class="match-teams">
                    <div class="team">
                        <div class="team-initials" style="background: ${getTeamColor(homeName)};">${homeName.substring(0, 2).toUpperCase()}</div>
                        <div class="team-name">${homeName}</div>
                    </div>
                    <div class="vs">VS</div>
                    <div class="team">
                        <div class="team-initials" style="background: ${getTeamColor(awayName)};">${awayName.substring(0, 2).toUpperCase()}</div>
                        <div class="team-name">${awayName}</div>
                    </div>
                </div>
                <div class="countdown-box">
                    <div class="countdown-label"><i class="far fa-clock"></i> <span class="en">Starts in</span><span class="ar" style="display:none;">يبدأ خلال</span></div>
                    <div class="countdown-value" id="${id}">--:--:--</div>
                    <div class="match-time">${time.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</div>
                </div>
                <div class="odds">
                    <div class="odd">1 <span class="odd-value">${m.odds?.home||'2.00'}</span></div>
                    <div class="odd">X <span class="odd-value">${m.odds?.draw||'3.50'}</span></div>
                    <div class="odd">2 <span class="odd-value">${m.odds?.away||'3.80'}</span></div>
                </div>
            `;
            return card;
        }
        
        function startCountdowns(matches) {
            if (countdownInterval) clearInterval(countdownInterval);
            countdownInterval = setInterval(() => {
                matches.forEach(m => {
                    const el = document.getElementById(`cd-${m.fixtureId}`);
                    if (el) {
                        const diff = m.startTime.toDate() - new Date();
                        if (diff <= 0) { el.textContent = '00:00:00'; }
                        else {
                            const h = Math.floor(diff / 3600000), mn = Math.floor((diff % 3600000) / 60000), s = Math.floor((diff % 60000) / 1000);
                            el.textContent = `${h.toString().padStart(2,'0')}:${mn.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
                        }
                    }
                });
            }, 1000);
        }
        
        window.loadMoreDays = loadMoreDays;
        window.addEventListener('beforeunload', () => { if (countdownInterval) clearInterval(countdownInterval); });
    </script>
</body>
</html>
