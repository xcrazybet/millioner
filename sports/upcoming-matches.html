<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Upcoming - X Lodon | المباريات القادمة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0f1a; color: white; font-family: 'Segoe UI', 'Tajawal', sans-serif; min-height: 100vh; }
        .header { background: #111827; padding: 12px 15px; border-bottom: 2px solid #00ff9d; position: sticky; top: 0; z-index: 100; }
        .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .back-btn { color: #00ff9d; text-decoration: none; font-size: 20px; }
        .lang-toggle { background: #1a2332; border: 1px solid #00ff9d; color: #00ff9d; padding: 5px 12px; border-radius: 20px; cursor: pointer; }
        .tabs { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 3px; }
        .tab { padding: 8px 12px; background: #1a2332; border-radius: 20px; color: white; text-decoration: none; font-size: 12px; }
        .tab.active { background: #00ff9d; color: black; }
        .container { max-width: 1200px; margin: 0 auto; padding: 15px; padding-bottom: 180px; }
        .balance-bar { background: #111827; padding: 10px 15px; border-radius: 12px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #00ff9d33; }
        .selector-bar { display: flex; gap: 10px; margin-bottom: 15px; }
        .league-select { flex: 1; padding: 14px; background: #111827; border: 1px solid #ffffff22; border-radius: 12px; color: white; font-size: 14px; }
        .search-input { flex: 2; padding: 14px; background: #111827; border: 1px solid #ffffff22; border-radius: 12px; color: white; font-size: 14px; }
        .debug-bar { background: #1a2332; padding: 8px 15px; border-radius: 8px; margin-bottom: 10px; font-size: 12px; color: #00ff9d; display: flex; align-items: center; gap: 8px; }
        .refresh-btn { background: #00ff9d; color: black; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 11px; margin-left: auto; }
        
        .main-section { margin-bottom: 25px; background: #111827; border-radius: 16px; padding: 15px; border: 1px solid #ffffff11; }
        .section-title { font-size: 20px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
        .section-title .icon { font-size: 24px; }
        .section-title .label { flex: 1; }
        .section-title .count { font-size: 14px; color: #a0a8c9; font-weight: 400; }
        
        .date-subsection { margin-bottom: 15px; }
        .date-subsection:last-child { margin-bottom: 0; }
        .date-header { color: #00ff9d; font-size: 14px; font-weight: 600; margin-bottom: 8px; padding: 8px 10px; border-bottom: 1px solid #00ff9d22; display: flex; justify-content: space-between; align-items: center; cursor: pointer; background: #0a0f1a; border-radius: 8px; }
        .date-header:hover { background: #00ff9d11; }
        .date-header i { transition: transform 0.3s; font-size: 12px; }
        .date-header.collapsed i { transform: rotate(-90deg); }
        .date-matches { transition: max-height 0.3s ease; overflow: hidden; }
        .date-matches.collapsed { max-height: 0; }
        
        .match-row { display: flex; align-items: center; gap: 8px; padding: 10px 8px; border-bottom: 1px solid #ffffff0a; font-size: 12px; border-radius: 8px; transition: background 0.2s; }
        .match-row:hover { background: #ffffff08; }
        .match-time-col { text-align: center; min-width: 50px; }
        .match-time-col .time { font-weight: bold; color: #00ff9d; font-size: 13px; }
        .match-time-col .countdown { font-size: 10px; color: #a0a8c9; }
        .team-col { flex: 1; display: flex; align-items: center; gap: 6px; }
        .team-col img { width: 22px; height: 22px; object-fit: contain; border-radius: 4px; }
        .team-col .names { font-weight: 500; font-size: 13px; }
        .team-col .names .vs { color: #ff9800; margin: 0 6px; font-size: 11px; }
        .league-badge { font-size: 10px; color: #a0a8c9; background: #1a2332; padding: 2px 6px; border-radius: 4px; margin-left: auto; }
        .odds-col { display: flex; gap: 4px; }
        .odd-mini { padding: 4px 7px; background: #0a0f1a; border-radius: 6px; font-size: 11px; text-align: center; min-width: 38px; border: 1px solid #ffffff11; cursor: pointer; transition: all 0.2s; }
        .odd-mini:hover { border-color: #00ff9d; background: #00ff9d11; }
        .odd-mini span { color: #00ff9d; font-weight: bold; }
        .bet-btn { padding: 6px 14px; background: #00ff9d; color: black; border: none; border-radius: 20px; font-size: 11px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
        .bet-btn:hover { background: #00e88a; transform: scale(1.05); }
        .slip-btn { padding: 6px 14px; background: #ff9800; color: black; border: none; border-radius: 20px; font-size: 11px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
        .slip-btn:hover { background: #f08800; transform: scale(1.05); }
        
        .bet-slip { position: fixed; bottom: 0; left: 0; right: 0; background: #111827; border-top: 2px solid #ff9800; padding: 15px; z-index: 1000; max-height: 220px; overflow-y: auto; box-shadow: 0 -5px 20px rgba(0,0,0,0.5); }
        .slip-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .slip-title { color: #ff9800; font-weight: 600; }
        .slip-clear { color: #ff5252; font-size: 12px; cursor: pointer; }
        .slip-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #ffffff11; font-size: 12px; }
        .slip-remove { color: #ff5252; cursor: pointer; }
        .slip-total { display: flex; justify-content: space-between; padding: 10px 0; }
        .slip-total-odds { color: #ff9800; font-weight: bold; font-size: 16px; }
        .slip-place-btn { width: 100%; padding: 12px; background: #ff9800; color: black; border: none; border-radius: 10px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .slip-place-btn:disabled { opacity: 0.5; }
        
        .empty-state { text-align: center; padding: 50px; color: #a0a8c9; }
        .empty-state i { font-size: 48px; margin-bottom: 15px; display: block; color: #00ff9d; }
        .arabic { font-family: 'Tajawal', sans-serif; }
        
        .loading-spinner { text-align: center; padding: 40px; }
        .loading-spinner i { font-size: 40px; color: #00ff9d; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        @media (max-width: 768px) {
            .match-row { flex-wrap: wrap; }
            .odds-col { order: 3; width: 100%; justify-content: center; margin-top: 5px; }
            .bet-btn, .slip-btn { order: 4; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-top">
            <div class="header-left">
                <a href="betting-sport.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
                <h1 style="font-size:18px;"><i class="fas fa-futbol"></i> X Lodon Sports</h1>
            </div>
            <button class="lang-toggle" onclick="toggleLanguage()">🇸🇦 عربي</button>
        </div>
        <div class="tabs">
            <a href="betting-sport.html" class="tab">Home</a>
            <a href="live-matches.html" class="tab">Live</a>
            <a href="upcoming-matches.html" class="tab active">Upcoming</a>
            <a href="finished-matches.html" class="tab">Results</a>
            <a href="my-bets.html" class="tab">My Bets</a>
        </div>
    </div>
    
    <div class="container">
        <div class="balance-bar">
            <span><i class="fas fa-wallet"></i> Balance</span>
            <span style="color:#00ff9d;font-weight:bold;font-size:18px;" id="balance-display">$0.00</span>
        </div>
        <div class="selector-bar">
            <select id="league-filter" class="league-select"><option value="all">All Leagues</option></select>
            <input type="text" id="search-input" class="search-input" placeholder="Search league or team..." oninput="filterMatches()">
        </div>
        <div class="debug-bar" id="debug-bar">
            <i class="fas fa-database"></i> 
            <span id="debug-text">Loading matches from API...</span>
            <button class="refresh-btn" onclick="loadAllMatches()"><i class="fas fa-sync-alt"></i> Refresh</button>
        </div>
        <div id="matches-container">
            <div class="loading-spinner">
                <i class="fas fa-futbol"></i>
                <p style="margin-top:15px;">Loading all upcoming matches...</p>
            </div>
        </div>
    </div>
    
    <div class="bet-slip" id="bet-slip" style="display:none;">
        <div class="slip-header">
            <span class="slip-title"><i class="fas fa-layer-group"></i> Bet Slip (<span id="slip-count">0</span>)</span>
            <span class="slip-clear" onclick="clearSlip()"><i class="fas fa-trash"></i> Clear</span>
        </div>
        <div id="slip-items"></div>
        <div class="slip-total"><span>Total Odds:</span><span class="slip-total-odds" id="slip-total-odds">1.00</span></div>
        <button class="slip-place-btn" id="place-acc-btn" disabled onclick="placeAccumulator()">Add 2+ Selections</button>
    </div>

    <script>
        // ============ FIREBASE INIT ============
        const firebaseConfig = { 
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM", 
            authDomain: "x-bet-prod-jd.firebaseapp.com", 
            projectId: "x-bet-prod-jd", 
            storageBucket: "x-bet-prod-jd.firebasestorage.app", 
            messagingSenderId: "499334334535", 
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962" 
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        
        // ============ GLOBAL STATE ============
        let allMatches = [];
        let countdownInterval = null;
        let selectedLeague = 'all';
        let accSlip = [];
        const API_BASE = 'https://millioner.onrender.com/api';
        
        // ============ AUTH CHECK ============
        firebase.auth().onAuthStateChanged(user => {
            if (!user) {
                location.href = '../login.html';
            } else {
                init();
            }
        });
        
        // ============ INITIALIZATION ============
        async function init() {
            await loadBalance();
            await loadLeaguesFilter();
            await loadAllMatches();
        }
        
        // ============ LOAD BALANCE ============
        async function loadBalance() {
            try {
                const db = firebase.firestore();
                const walletDoc = await db.collection('wallets').doc(firebase.auth().currentUser.uid).get();
                const balance = walletDoc.exists ? (walletDoc.data().balance || 0) : 0;
                document.getElementById('balance-display').textContent = '$' + balance.toFixed(2);
            } catch (e) {
                console.error('Balance load error:', e);
                document.getElementById('balance-display').textContent = '$0.00';
            }
        }
        
        // ============ LOAD LEAGUES FILTER ============
        async function loadLeaguesFilter() {
            const select = document.getElementById('league-filter');
            try {
                const response = await fetch(`${API_BASE}/leagues`);
                const data = await response.json();
                
                if (data.success && data.data) {
                    // Sort leagues alphabetically
                    data.data.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
                    
                    data.data.forEach(league => {
                        if (league.name) {
                            const option = document.createElement('option');
                            option.value = league.id;
                            option.textContent = `${league.name} (${league.country || 'World'})`;
                            select.appendChild(option);
                        }
                    });
                }
            } catch (e) {
                console.error('Leagues load error:', e);
            }
            
            select.onchange = function() {
                selectedLeague = this.value;
                filterMatches();
            };
        }
        
        // ============ LOAD ALL MATCHES FROM API ============
        async function loadAllMatches() {
            const debugText = document.getElementById('debug-text');
            const container = document.getElementById('matches-container');
            
            debugText.textContent = 'Fetching from API...';
            container.innerHTML = '<div class="loading-spinner"><i class="fas fa-futbol"></i><p style="margin-top:15px;">Loading matches...</p></div>';
            
            try {
                // Fetch both today's and this week's matches
                const [todayRes, weekRes] = await Promise.all([
                    fetch(`${API_BASE}/fixtures/today`),
                    fetch(`${API_BASE}/fixtures/week`)
                ]);
                
                const todayData = await todayRes.json();
                const weekData = await weekRes.json();
                
                // Combine and deduplicate
                let allFixtures = [];
                const seenIds = new Set();
                
                if (todayData.success && todayData.data) {
                    todayData.data.forEach(fixture => {
                        if (!seenIds.has(fixture.fixture.id)) {
                            allFixtures.push(fixture);
                            seenIds.add(fixture.fixture.id);
                        }
                    });
                }
                
                if (weekData.success && weekData.data) {
                    weekData.data.forEach(fixture => {
                        if (!seenIds.has(fixture.fixture.id)) {
                            allFixtures.push(fixture);
                            seenIds.add(fixture.fixture.id);
                        }
                    });
                }
                
                // Transform API format to app format
                allMatches = allFixtures.map(transformFixture);
                
                debugText.textContent = `Loaded ${allMatches.length} upcoming matches (API live data)`;
                console.log('✅ Matches loaded:', allMatches.length);
                
                filterMatches();
            } catch (error) {
                console.error('❌ API fetch failed:', error);
                debugText.textContent = 'Failed to load matches. Check console (F12)';
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle"></i>
                        <p>Failed to load matches</p>
                        <p style="font-size:12px;margin-top:5px;">${error.message}</p>
                        <button onclick="loadAllMatches()" style="margin-top:15px;padding:10px 20px;background:#00ff9d;color:black;border:none;border-radius:8px;cursor:pointer;font-weight:bold;">
                            <i class="fas fa-redo"></i> Try Again
                        </button>
                    </div>`;
            }
        }
        
        // ============ TRANSFORM API FIXTURE TO APP FORMAT ============
        function transformFixture(item) {
            // Generate realistic-looking odds based on fixture ID (deterministic)
            const seed = item.fixture.id % 100;
            const homeOdds = (1.5 + (seed % 30) / 10).toFixed(2);
            const drawOdds = (2.5 + (seed % 40) / 10).toFixed(2);
            const awayOdds = (2.0 + (seed % 50) / 10).toFixed(2);
            
            return {
                fixture_id: item.fixture.id,
                start_time: item.fixture.date,
                league_name: item.league?.name || 'Unknown League',
                league_id: item.league?.id,
                league_country: item.league?.country || '',
                league_logo: item.league?.logo || '',
                home_team: {
                    name: item.teams?.home?.name || 'Home Team',
                    logo: item.teams?.home?.logo || ''
                },
                away_team: {
                    name: item.teams?.away?.name || 'Away Team',
                    logo: item.teams?.away?.logo || ''
                },
                odds: {
                    home: homeOdds,
                    draw: drawOdds,
                    away: awayOdds
                },
                status: item.fixture?.status?.short || 'NS',
                goals: item.goals || null,
                score: item.score || null
            };
        }
        
        // ============ FILTER AND RENDER MATCHES ============
        function filterMatches() {
            const container = document.getElementById('matches-container');
            const search = (document.getElementById('search-input').value || '').toLowerCase();
            
            let filtered = allMatches;
            
            // Apply league filter
            if (selectedLeague !== 'all') {
                filtered = filtered.filter(m => m.league_id == selectedLeague);
            }
            
            // Apply search filter
            if (search) {
                filtered = filtered.filter(m => {
                    const hn = (m.home_team?.name || '').toLowerCase();
                    const an = (m.away_team?.name || '').toLowerCase();
                    const ln = (m.league_name || '').toLowerCase();
                    return hn.includes(search) || an.includes(search) || ln.includes(search);
                });
            }
            
            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-calendar-times"></i>
                        <p>No matches found</p>
                        <p style="font-size:12px;margin-top:5px;">Try different filters or refresh</p>
                        <button onclick="loadAllMatches()" style="margin-top:15px;padding:10px 20px;background:#00ff9d;color:black;border:none;border-radius:8px;cursor:pointer;font-weight:bold;">
                            <i class="fas fa-sync-alt"></i> Refresh Now
                        </button>
                    </div>`;
                return;
            }
            
            // ===== AUTO DATE GROUPING: TODAY + NEXT 6 DAYS =====
            const now = new Date();
            const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const todayEnd = new Date(todayStart);
            todayEnd.setHours(23, 59, 59, 999);
            
            const next6Start = new Date(todayStart);
            next6Start.setDate(next6Start.getDate() + 1);
            next6Start.setHours(0, 0, 0, 0);
            
            const next6End = new Date(todayStart);
            next6End.setDate(next6End.getDate() + 6);
            next6End.setHours(23, 59, 59, 999);
            
            // Split matches into TODAY and NEXT 6 DAYS
            const todayMatches = filtered.filter(m => {
                const matchDate = new Date(m.start_time);
                return matchDate >= todayStart && matchDate <= todayEnd;
            });
            
            const next6DaysMatches = filtered.filter(m => {
                const matchDate = new Date(m.start_time);
                return matchDate >= next6Start && matchDate <= next6End;
            });
            
            // Build HTML
            let html = '';
            
            // SECTION 1: TODAY
            const todayLabel = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
            html += buildMainSection('1', '⚽', 'TODAY', todayLabel, todayMatches);
            
            // SECTION 2: NEXT 6 DAYS
            html += buildMainSection('2', '📅', 'NEXT 6 DAYS', 
                `${next6Start.toLocaleDateString('en-US', {month:'short', day:'numeric'})} → ${next6End.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'})}`, 
                next6DaysMatches);
            
            container.innerHTML = html;
            
            // Attach toggle handlers
            document.querySelectorAll('.date-header').forEach(header => {
                header.addEventListener('click', function() {
                    this.classList.toggle('collapsed');
                    this.nextElementSibling.classList.toggle('collapsed');
                });
            });
            
            // Attach odds click handlers
            document.querySelectorAll('.odd-mini').forEach(odd => {
                odd.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const fixtureId = parseInt(this.dataset.fixtureId);
                    const betType = this.dataset.betType;
                    const odds = parseFloat(this.dataset.odds);
                    const hn = this.dataset.homeName;
                    const an = this.dataset.awayName;
                    addToSlip(fixtureId, hn, an, betType, odds);
                });
            });
            
            startCountdowns(filtered);
        }
        
        // ============ BUILD MAIN SECTION ============
        function buildMainSection(number, icon, title, subtitle, matches) {
            if (matches.length === 0) {
                return `
                    <div class="main-section">
                        <div class="section-title">
                            <span class="icon">${icon}</span>
                            <span class="label">${number}. ${title}</span>
                            <span class="count">0 matches</span>
                        </div>
                        <div style="text-align:center;padding:20px;color:#a0a8c9;">
                            <i class="far fa-calendar-alt" style="font-size:24px;display:block;margin-bottom:8px;"></i>
                            No matches scheduled
                        </div>
                    </div>`;
            }
            
            // Group matches by date within the section
            const dateGrouped = {};
            matches.forEach(m => {
                const d = new Date(m.start_time);
                const dateKey = d.toDateString();
                if (!dateGrouped[dateKey]) dateGrouped[dateKey] = [];
                dateGrouped[dateKey].push(m);
            });
            
            let subsectionsHtml = '';
            const sortedDates = Object.keys(dateGrouped).sort();
            
            sortedDates.forEach(dateKey => {
                const date = new Date(dateKey);
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                const tomorrow = new Date(today);
                tomorrow.setDate(today.getDate() + 1);
                
                let dateLabel;
                if (date.toDateString() === today.toDateString()) {
                    dateLabel = 'Today';
                } else if (date.toDateString() === tomorrow.toDateString()) {
                    dateLabel = 'Tomorrow';
                } else {
                    dateLabel = date.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
                }
                
                subsectionsHtml += `
                    <div class="date-subsection">
                        <div class="date-header">
                            <span>📌 ${dateLabel}</span>
                            <span style="font-size:12px;color:#a0a8c9;">${dateGrouped[dateKey].length} matches</span>
                            <i class="fas fa-chevron-down"></i>
                        </div>
                        <div class="date-matches">
                            ${dateGrouped[dateKey].map(m => createMatchRow(m)).join('')}
                        </div>
                    </div>`;
            });
            
            return `
                <div class="main-section">
                    <div class="section-title">
                        <span class="icon">${icon}</span>
                        <span class="label">${number}. ${title}</span>
                        <span class="count">${matches.length} matches</span>
                    </div>
                    <div style="font-size:13px;color:#a0a8c9;margin-bottom:10px;">${subtitle}</div>
                    ${subsectionsHtml}
                </div>`;
        }
        
        // ============ CREATE MATCH ROW ============
        function createMatchRow(m) {
            const time = new Date(m.start_time);
            const hn = m.home_team?.name || 'Home';
            const an = m.away_team?.name || 'Away';
            const hl = m.home_team?.logo || '';
            const al = m.away_team?.logo || '';
            const odds = m.odds || {};
            const leagueFlag = m.league_country ? 
                `<span class="league-badge" title="${m.league_name}">${m.league_name}</span>` : '';
            
            return `
                <div class="match-row">
                    <div class="match-time-col">
                        <div class="time">${time.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'})}</div>
                        <div class="countdown" id="cd-${m.fixture_id}">--:--:--</div>
                    </div>
                    <div class="team-col">
                        ${hl ? `<img src="${hl}" onerror="this.style.display='none'" alt="">` : ''}
                        <span class="names">${hn} <span class="vs">vs</span> ${an}</span>
                        ${al ? `<img src="${al}" onerror="this.style.display='none'" alt="">` : ''}
                        ${leagueFlag}
                    </div>
                    <div class="odds-col">
                        <div class="odd-mini" data-fixture-id="${m.fixture_id}" data-bet-type="home" data-odds="${odds.home || '2.00'}" data-home-name="${hn.replace(/'/g, "\\'")}" data-away-name="${an.replace(/'/g, "\\'")}">
                            1 <span>${odds.home || '2.00'}</span>
                        </div>
                        <div class="odd-mini" data-fixture-id="${m.fixture_id}" data-bet-type="draw" data-odds="${odds.draw || '3.50'}" data-home-name="${hn.replace(/'/g, "\\'")}" data-away-name="${an.replace(/'/g, "\\'")}">
                            X <span>${odds.draw || '3.50'}</span>
                        </div>
                        <div class="odd-mini" data-fixture-id="${m.fixture_id}" data-bet-type="away" data-odds="${odds.away || '3.80'}" data-home-name="${hn.replace(/'/g, "\\'")}" data-away-name="${an.replace(/'/g, "\\'")}">
                            2 <span>${odds.away || '3.80'}</span>
                        </div>
                    </div>
                    <button class="bet-btn" onclick="event.stopPropagation();goToMatch(${m.fixture_id})">Bet</button>
                    <button class="slip-btn" onclick="event.stopPropagation();addToSlip(${m.fixture_id},'${hn.replace(/'/g, "\\'")}','${an.replace(/'/g, "\\'")}','home',${odds.home || 2.00})">+Slip</button>
                </div>`;
        }
        
        // ============ ADD TO ACCUMULATOR SLIP ============
        function addToSlip(fixtureId, homeName, awayName, betType, odds) {
            const betTypeNames = { home: '1 (Home Win)', draw: 'X (Draw)', away: '2 (Away Win)' };
            const slipItem = {
                fixture_id: fixtureId,
                matchName: `${homeName} vs ${awayName}`,
                betType: betType,
                betTypeName: betTypeNames[betType] || betType,
                odds: parseFloat(odds)
            };
            
            // Remove if already exists for same fixture
            accSlip = accSlip.filter(s => s.fixture_id !== fixtureId);
            accSlip.push(slipItem);
            
            updateSlipUI();
        }
        
        // ============ UPDATE SLIP UI ============
        function updateSlipUI() {
            const slip = document.getElementById('bet-slip');
            
            if (accSlip.length === 0) {
                slip.style.display = 'none';
                return;
            }
            
            slip.style.display = 'block';
            document.getElementById('slip-count').textContent = accSlip.length;
            
            let items = '';
            let totalOdds = 1;
            
            accSlip.forEach((s, i) => {
                totalOdds *= s.odds;
                items += `
                    <div class="slip-item">
                        <span>${s.betTypeName} - ${s.matchName} @${s.odds.toFixed(2)}</span>
                        <span class="slip-remove" onclick="removeFromSlip(${i})"><i class="fas fa-times"></i></span>
                    </div>`;
            });
            
            document.getElementById('slip-items').innerHTML = items;
            document.getElementById('slip-total-odds').textContent = totalOdds.toFixed(2);
            document.getElementById('place-acc-btn').disabled = accSlip.length < 2;
            document.getElementById('place-acc-btn').textContent = 
                accSlip.length < 2 ? 'Add 2+ Selections' : `Place Accumulator (${totalOdds.toFixed(2)}x)`;
        }
        
        function removeFromSlip(index) {
            accSlip.splice(index, 1);
            updateSlipUI();
        }
        
        function clearSlip() {
            accSlip = [];
            updateSlipUI();
        }
        
        // ============ PLACE ACCUMULATOR BET ============
        async function placeAccumulator() {
            if (accSlip.length < 2) return;
            
            const amount = parseFloat(prompt('Enter stake amount ($):', '10'));
            if (!amount || amount < 1) return;
            
            try {
                // Here you would integrate with your betting engine
                // const result = await placeAccumulatorBet(accSlip, amount);
                // For now, simulate success
                alert(`✅ Accumulator placed!\n${accSlip.length} selections\nStake: $${amount.toFixed(2)}`);
                clearSlip();
                // location.href = 'my-bets.html';
            } catch (e) {
                alert('❌ Error placing bet: ' + e.message);
            }
        }
        
        // ============ NAVIGATION ============
        function goToMatch(fixtureId) {
            location.href = `match-details.html?id=${fixtureId}`;
        }
        
        // ============ COUNTDOWN TIMER ============
        function startCountdowns(matches) {
            if (countdownInterval) clearInterval(countdownInterval);
            
            countdownInterval = setInterval(() => {
                matches.forEach(m => {
                    const el = document.getElementById('cd-' + m.fixture_id);
                    if (!el) return;
                    
                    const diff = new Date(m.start_time) - new Date();
                    
                    if (diff <= 0) {
                        el.textContent = 'Starting';
                        el.style.color = '#ff9800';
                    } else {
                        const h = Math.floor(diff / 3600000);
                        const mn = Math.floor((diff % 3600000) / 60000);
                        const s = Math.floor((diff % 60000) / 1000);
                        el.textContent = `${h.toString().padStart(2, '0')}:${mn.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                        el.style.color = '#a0a8c9';
                    }
                });
            }, 1000);
        }
        
        // ============ LANGUAGE TOGGLE ============
        function toggleLanguage() {
            const isEn = document.querySelector('.en')?.style.display !== 'none';
            if (document.querySelector('.en')) {
                document.querySelectorAll('.en').forEach(el => el.style.display = isEn ? 'none' : '');
                document.querySelectorAll('.ar').forEach(el => el.style.display = isEn ? '' : 'none');
                document.documentElement.dir = isEn ? 'rtl' : 'ltr';
                localStorage.setItem('lang', isEn ? 'ar' : 'en');
            }
        }
        
        // ============ CLEANUP ============
        window.addEventListener('beforeunload', () => {
            if (countdownInterval) clearInterval(countdownInterval);
        });
        
        // ============ EXPORT FUNCTIONS ============
        window.loadAllMatches = loadAllMatches;
        window.addToSlip = addToSlip;
        window.removeFromSlip = removeFromSlip;
        window.clearSlip = clearSlip;
        window.placeAccumulator = placeAccumulator;
        window.goToMatch = goToMatch;
        window.toggleLanguage = toggleLanguage;
    </script>
</body>
</html>
