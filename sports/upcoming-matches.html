<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Meta Tags -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="description" content="XLodon Sports Betting - Upcoming Matches">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <title>Upcoming Matches - XLodon Sports Betting</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    
    <!-- Supabase Client Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* =============================================
           CSS RESET & GLOBAL STYLES
           ============================================= */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* Color Palette */
            --primary: #1a1a2e;
            --secondary: #16213e;
            --accent: #e94560;
            --accent-hover: #c23152;
            --gold: #ffd700;
            --success: #00c853;
            --warning: #ff9800;
            --danger: #f44336;
            --info: #2196f3;
            --light: #f8f9fa;
            --dark: #212529;
            --gray-100: #f8f9fa;
            --gray-200: #e9ecef;
            --gray-300: #dee2e6;
            --gray-400: #ced4da;
            --gray-500: #adb5bd;
            --gray-600: #6c757d;
            --gray-700: #495057;
            --gray-800: #343a40;
            --gray-900: #212529;
            
            /* Gradients */
            --gradient-primary: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            --gradient-accent: linear-gradient(135deg, var(--accent) 0%, #ff6b6b 100%);
            --gradient-gold: linear-gradient(135deg, var(--gold) 0%, #ffaa00 100%);
            
            /* Shadows */
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.24);
            --shadow-md: 0 4px 6px rgba(0,0,0,0.1), 0 2px 4px rgba(0,0,0,0.06);
            --shadow-lg: 0 10px 15px rgba(0,0,0,0.1), 0 4px 6px rgba(0,0,0,0.05);
            --shadow-xl: 0 20px 25px rgba(0,0,0,0.1), 0 10px 10px rgba(0,0,0,0.04);
            
            /* Transitions */
            --transition-fast: 150ms ease;
            --transition-base: 300ms ease;
            --transition-slow: 500ms ease;
            
            /* Border Radius */
            --radius-sm: 4px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --radius-xl: 16px;
            --radius-full: 9999px;
            
            /* Spacing */
            --spacing-xs: 4px;
            --spacing-sm: 8px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
            --spacing-xl: 32px;
            --spacing-2xl: 48px;
            --spacing-3xl: 64px;
        }

        html {
            font-size: 16px;
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #ffffff;
            min-height: 100vh;
            line-height: 1.6;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated Background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(233, 69, 96, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 215, 0, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 50% 80%, rgba(33, 150, 243, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        /* Container */
        .app-container {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: var(--spacing-md);
        }

        /* =============================================
           HEADER SECTION
           ============================================= */
        .header {
            background: rgba(26, 26, 46, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-xl);
            padding: var(--spacing-lg) var(--spacing-xl);
            margin-bottom: var(--spacing-xl);
            box-shadow: var(--shadow-xl);
            position: sticky;
            top: var(--spacing-md);
            z-index: 100;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: var(--spacing-md);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
        }

        .brand-logo {
            width: 48px;
            height: 48px;
            background: var(--gradient-accent);
            border-radius: var(--radius-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 800;
            color: white;
            box-shadow: 0 4px 15px rgba(233, 69, 96, 0.3);
        }

        .brand-text h1 {
            font-size: 1.5rem;
            font-weight: 700;
            background: var(--gradient-gold);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0;
            line-height: 1.2;
        }

        .brand-text small {
            font-size: 0.75rem;
            color: var(--gray-400);
            display: block;
        }

        .balance-display {
            background: linear-gradient(135deg, rgba(0, 200, 83, 0.1), rgba(0, 200, 83, 0.05));
            border: 1px solid rgba(0, 200, 83, 0.3);
            border-radius: var(--radius-full);
            padding: var(--spacing-sm) var(--spacing-lg);
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        .balance-amount {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--success);
            font-variant-numeric: tabular-nums;
        }

        .nav-buttons {
            display: flex;
            gap: var(--spacing-sm);
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: var(--radius-full);
            font-family: inherit;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-base);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn-primary {
            background: var(--gradient-accent);
            color: white;
            box-shadow: 0 4px 15px rgba(233, 69, 96, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(233, 69, 96, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .btn-success {
            background: linear-gradient(135deg, #00c853, #00e676);
            color: white;
            box-shadow: 0 4px 15px rgba(0, 200, 83, 0.3);
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 0.75rem;
        }

        .btn-lg {
            padding: 14px 28px;
            font-size: 1rem;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            pointer-events: none;
        }

        /* =============================================
           SEARCH & FILTER SECTION
           ============================================= */
        .search-filter-section {
            background: rgba(26, 26, 46, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-xl);
            padding: var(--spacing-lg);
            margin-bottom: var(--spacing-xl);
        }

        .search-container {
            position: relative;
            margin-bottom: var(--spacing-md);
        }

        .search-input {
            width: 100%;
            padding: 14px 50px 14px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-full);
            color: white;
            font-family: inherit;
            font-size: 0.95rem;
            transition: all var(--transition-base);
            outline: none;
        }

        .search-input:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(233, 69, 96, 0.2);
        }

        .search-input::placeholder {
            color: var(--gray-500);
        }

        .search-icon {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray-500);
            font-size: 1.1rem;
            pointer-events: none;
        }

        .filter-tags {
            display: flex;
            gap: var(--spacing-sm);
            flex-wrap: wrap;
        }

        .filter-tag {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-full);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all var(--transition-fast);
            color: var(--gray-300);
            white-space: nowrap;
        }

        .filter-tag:hover,
        .filter-tag.active {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
            box-shadow: 0 2px 10px rgba(233, 69, 96, 0.3);
        }

        /* =============================================
           STATS BAR
           ============================================= */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-xl);
        }

        .stat-card {
            background: rgba(26, 26, 46, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-lg);
            padding: var(--spacing-md) var(--spacing-lg);
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            transition: transform var(--transition-base);
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .stat-info h4 {
            font-size: 0.85rem;
            color: var(--gray-400);
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-info .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: white;
            line-height: 1.2;
        }

        /* =============================================
           MATCHES SECTION
           ============================================= */
        .matches-section {
            position: relative;
        }

        .matches-section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-lg);
        }

        .matches-section-header h2 {
            font-size: 1.75rem;
            font-weight: 700;
            background: var(--gradient-gold);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .refresh-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-full);
            padding: 10px 20px;
            color: white;
            cursor: pointer;
            transition: all var(--transition-base);
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
            font-weight: 500;
        }

        .refresh-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .refresh-btn .fa-sync-alt {
            transition: transform var(--transition-base);
        }

        .refresh-btn.refreshing .fa-sync-alt {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Date Group */
        .date-group {
            margin-bottom: var(--spacing-xl);
            animation: fadeInUp 0.5s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .date-header {
            background: rgba(233, 69, 96, 0.1);
            border: 1px solid rgba(233, 69, 96, 0.2);
            border-radius: var(--radius-lg);
            padding: var(--spacing-md) var(--spacing-lg);
            margin-bottom: var(--spacing-md);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .date-header.today {
            background: rgba(233, 69, 96, 0.2);
            border-color: var(--accent);
            box-shadow: 0 4px 15px rgba(233, 69, 96, 0.2);
        }

        .date-label {
            font-size: 1.1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .today-badge {
            background: var(--accent);
            color: white;
            padding: 4px 12px;
            border-radius: var(--radius-full);
            font-size: 0.75rem;
            font-weight: 600;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .match-count-badge {
            background: rgba(255, 255, 255, 0.1);
            padding: 4px 12px;
            border-radius: var(--radius-full);
            font-size: 0.85rem;
            font-weight: 600;
        }

        /* Match Cards Grid */
        .matches-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: var(--spacing-md);
        }

        .match-card {
            background: rgba(26, 26, 46, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-lg);
            overflow: hidden;
            transition: all var(--transition-base);
            cursor: pointer;
            position: relative;
        }

        .match-card::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--gradient-accent);
            transform: scaleX(0);
            transition: transform var(--transition-base);
        }

        .match-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-xl);
            border-color: rgba(233, 69, 96, 0.3);
        }

        .match-card:hover::after {
            transform: scaleX(1);
        }

        .match-card-header {
            padding: var(--spacing-md);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .league-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            color: var(--gray-400);
            font-weight: 500;
        }

        .league-icon {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
        }

        .match-time {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--gold);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .match-card-body {
            padding: var(--spacing-lg);
            text-align: center;
        }

        .teams-display {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: var(--spacing-md);
        }

        .team {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--spacing-sm);
        }

        .team-name {
            font-size: 1rem;
            font-weight: 600;
            color: white;
            text-align: center;
            line-height: 1.3;
        }

        .vs-divider {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--gray-500);
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 12px;
            border-radius: var(--radius-full);
        }

        .match-card-footer {
            padding: var(--spacing-md);
            display: flex;
            gap: var(--spacing-sm);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .odds-btn {
            flex: 1;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-md);
            color: white;
            cursor: pointer;
            transition: all var(--transition-fast);
            text-align: center;
            font-family: inherit;
            font-size: 0.8rem;
        }

        .odds-btn:hover {
            background: rgba(233, 69, 96, 0.2);
            border-color: var(--accent);
            box-shadow: 0 2px 8px rgba(233, 69, 96, 0.2);
        }

        .odds-label {
            display: block;
            font-size: 0.7rem;
            color: var(--gray-400);
            margin-bottom: 2px;
            text-transform: uppercase;
        }

        .odds-value {
            display: block;
            font-weight: 700;
            font-size: 1rem;
            color: var(--gold);
        }

        /* =============================================
           LOADING & STATES
           ============================================= */
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-3xl) var(--spacing-xl);
            gap: var(--spacing-md);
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 1.1rem;
            color: var(--gray-400);
            animation: pulse 2s infinite;
        }

        .empty-state {
            text-align: center;
            padding: var(--spacing-3xl);
            background: rgba(26, 26, 46, 0.8);
            border-radius: var(--radius-xl);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: var(--spacing-md);
            opacity: 0.5;
        }

        .empty-state h3 {
            font-size: 1.3rem;
            margin-bottom: var(--spacing-sm);
            color: white;
        }

        .empty-state p {
            color: var(--gray-400);
            margin-bottom: var(--spacing-lg);
        }

        .error-state {
            text-align: center;
            padding: var(--spacing-xl);
            background: rgba(244, 67, 54, 0.1);
            border: 1px solid rgba(244, 67, 54, 0.3);
            border-radius: var(--radius-xl);
        }

        .error-state-icon {
            font-size: 3rem;
            color: var(--danger);
            margin-bottom: var(--spacing-md);
        }

        .error-state h3 {
            color: var(--danger);
            margin-bottom: var(--spacing-sm);
        }

        .error-state p {
            color: var(--gray-400);
            margin-bottom: var(--spacing-md);
        }

        /* Toast Notifications */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            min-width: 300px;
            padding: 16px 20px;
            border-radius: var(--radius-md);
            color: white;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideInRight 0.3s ease;
            box-shadow: var(--shadow-lg);
        }

        .toast.success {
            background: var(--success);
        }

        .toast.error {
            background: var(--danger);
        }

        .toast.info {
            background: var(--info);
        }

        @keyframes slideInRight {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
            }
            
            .matches-grid {
                grid-template-columns: 1fr;
            }
            
            .stats-bar {
                grid-template-columns: 1fr 1fr;
            }
            
            .btn {
                padding: 8px 16px;
                font-size: 0.8rem;
            }
            
            .match-card-footer {
                flex-direction: column;
            }
        }

        @media (max-width: 480px) {
            .stats-bar {
                grid-template-columns: 1fr;
            }
            
            .teams-display {
                flex-direction: column;
                gap: var(--spacing-sm);
            }
            
            .vs-divider {
                align-self: center;
            }
        }

        /* Print Styles */
        @media print {
            body {
                background: white;
                color: black;
            }
            
            .header, .search-filter-section, .stats-bar, .nav-buttons {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- Toast Container for Notifications -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Main App Container -->
    <div class="app-container">
        <!-- Header -->

                        <small>Premium Betting Experience</small>
                    </div>
                </div>
                
                <div class="balance-display">

        <!-- Statistics Bar -->
        <div class="stats-bar">

            <div class="stat-card">

                </div>
                <div class="stat-info">
                    <h4>Total Upcoming</h4>
                    <span class="stat-value" id="totalCount">0</span>
                </div>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon" style="background: rgba(33, 150, 243, 0.2);">
                    <i class="fas fa-globe" style="color: var(--info);"></i>
                </div>
                <div class="stat-info">
                    <h4>Leagues</h4>
                    <span class="stat-value" id="leaguesCount">0</span>
                </div>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon" style="background: rgba(0, 200, 83, 0.2);">
                    <i class="fas fa-clock" style="color: var(--success);"></i>
                </div>
                <div class="stat-info">
                    <h4>Next 7 Days</h4>

            </div>
        </div>

        <!-- Matches Section -->
        <div class="matches-section">
            <div class="matches-section-header">
                <h2>Upcoming Matches</h2>
                <button class="refresh-btn" id="refreshBtn" onclick="refreshMatches()">
                    <i class="fas fa-sync-alt"></i>
                    Refresh
                </button>
            </div>
            
            <!-- Matches Container -->
            <div id="matchesContainer">
                <div class="loading-container">
                    <div class="spinner"></div>
                    <p class="loading-text">Loading upcoming matches...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Betting Modal (Hidden by default) -->
    <div id="betModal" style="display: none;">
        <!-- Modal content will be injected by JavaScript -->
    </div>

    <script>
        // ============================================
        // GLOBAL CONFIGURATION
        // ============================================
        const CONFIG = {
            // Supabase Configuration
            SUPABASE_URL: 'https://inazbyaeaiyyynvposzym.supabase.co',
            SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImluYXpieWFlYWl5eXludnBvc3p5bSIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzA0NjQ4MDAwLCJleHAiOjIwMjAyMjQwMDB9.placeholder-key',
            
            // Firebase Configuration
            FIREBASE_CONFIG: {
                apiKey: "AIzaSyD-placeholder-key",
                authDomain: "millioner-js.firebaseapp.com",
                projectId: "millioner-js",
                storageBucket: "millioner-js.appspot.com",
                messagingSenderId: "123456789",
                appId: "1:123456789:web:abc123def456"
            },
            
            // API Endpoints
            API: {
                LEAGUES: 'https://milioner.onrender.com/api/leagues',
                SPORTS_MATCHES: '/rest/v1/sports_matches'
            },
            
            // Date Range Configuration
            DATE_RANGE: {
                DAYS_FORWARD: 7, // Today + 6 days = 7 days total
                INCLUDE_TODAY: true
            },
            
            // Refresh Interval (milliseconds)
            AUTO_REFRESH_INTERVAL: 5 * 60 * 1000, // 5 minutes
        };

        // ============================================
        // STATE MANAGEMENT
        // ============================================
        const AppState = {
            matches: [],
            filteredMatches: [],
            groupedMatches: {},
            statistics: {
                todayCount: 0,
                totalCount: 0,
                leaguesCount: 0,
                weekCount: 0
            },
            loading: false,
            error: null,
            currentFilter: 'all',
            searchQuery: '',
            supabase: null,
            firebase: null,
            autoRefreshTimer: null,
            lastRefresh: null
        };

        // ============================================
        // UTILITY FUNCTIONS
        // ============================================

        /**
         * Get dynamic date range (Today 00:00:00 to Today+6 23:59:59)
         */
        function getDateRange() {
            const now = new Date();
            
            // Start of today (00:00:00.000)
            const startDate = new Date(now);
            startDate.setHours(0, 0, 0, 0);
            
            // End of day 6 (23:59:59.999)
            const endDate = new Date(startDate);
            endDate.setDate(endDate.getDate() + CONFIG.DATE_RANGE.DAYS_FORWARD);
            endDate.setHours(23, 59, 59, 999);
            
            return {
                start: startDate.toISOString(),
                end: endDate.toISOString(),
                display: {
                    start: startDate.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' }),
                    end: endDate.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' })
                }
            };
        }

        /**
         * Format date for display
         */
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
        }

        /**
         * Format time for display
         */
        function formatTime(dateString) {
            const date = new Date(dateString);
            return date.toLocaleTimeString('en-US', {
                hour: '2-digit',
                minute: '2-digit',
                hour12: true
            });
        }

        /**
         * Check if a date is today
         */
        function isToday(dateString) {
            const date = new Date(dateString);
            const today = new Date();
            return date.getDate() === today.getDate() &&
                   date.getMonth() === today.getMonth() &&
                   date.getFullYear() === today.getFullYear();
        }

        /**
         * Check if a date is tomorrow
         */
        function isTomorrow(dateString) {
            const date = new Date(dateString);
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            return date.getDate() === tomorrow.getDate() &&
                   date.getMonth() === tomorrow.getMonth() &&
                   date.getFullYear() === tomorrow.getFullYear();
        }

        /**
         * Show toast notification
         */
        function showToast(message, type = 'info', duration = 3000) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            
            const icons = {
                success: 'fa-check-circle',
                error: 'fa-exclamation-circle',
                info: 'fa-info-circle'
            };
            
            toast.innerHTML = `
                <i class="fas ${icons[type] || icons.info}"></i>
                <span>${message}</span>
            `;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100%)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, duration);
        }

        /**
         * Format currency
         */
        function formatCurrency(amount) {
            return new Intl.NumberFormat('en-US', {
                style: 'currency',
                currency: 'USD',
                minimumFractionDigits: 2
            }).format(amount);
        }

        // ============================================
        // DATABASE INITIALIZATION
        // ============================================

        /**
         * Initialize Supabase client
         */
        function initSupabase() {
            try {
                if (typeof supabase === 'undefined') {
                    throw new Error('Supabase SDK not loaded');
                }
                
                AppState.supabase = supabase.createClient(
                    CONFIG.SUPABASE_URL,
                    CONFIG.SUPABASE_ANON_KEY
                );
                
                console.log('✅ Supabase initialized successfully');
                return true;
            } catch (error) {
                console.error('❌ Supabase initialization failed:', error);
                showToast('Database connection failed', 'error');
                return false;
            }
        }

        /**
         * Initialize Firebase
         */
        function initFirebase() {
            try {
                if (typeof firebase === 'undefined') {
                    throw new Error('Firebase SDK not loaded');
                }
                
                firebase.initializeApp(CONFIG.FIREBASE_CONFIG);
                AppState.firebase = firebase;
                
                console.log('✅ Firebase initialized successfully');
                return true;
            } catch (error) {
                console.error('❌ Firebase initialization failed:', error);
                return false;
            }
        }

        // ============================================
        // DATA FETCHING
        // ============================================

        /**
         * Fetch matches from Supabase with dynamic date range
         */
        async function fetchMatches() {
            if (AppState.loading) {
                console.log('⏳ Already loading matches');
                return null;
            }
            
            AppState.loading = true;
            AppState.error = null;
            
            try {
                const dateRange = getDateRange();
                
                console.log('📅 Fetching matches for range:', dateRange.display);
                
                if (!AppState.supabase) {
                    throw new Error('Supabase not initialized');
                }
                
                const { data, error } = await AppState.supabase
                    .from('sports_matches')
                    .select('*')
                    .eq('status', 'upcoming')
                    .gte('start_time', dateRange.start)
                    .lte('start_time', dateRange.end)
                    .order('start_time', { ascending: true });
                
                if (error) {
                    throw new Error(`Query failed: ${error.message}`);
                }
                
                console.log(`✅ Fetched ${data?.length || 0} matches`);
                AppState.matches = data || [];
                AppState.lastRefresh = new Date();
                
                return AppState.matches;
                
            } catch (error) {
                console.error('❌ Failed to fetch matches:', error);
                AppState.error = error.message;
                showToast('Failed to load matches. Please try again.', 'error');
                return null;
            } finally {
                AppState.loading = false;
            }
        }

        /**
         * Fetch leagues data
         */
        async function fetchLeagues() {
            try {
                const response = await fetch(CONFIG.API.LEAGUES);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                return await response.json();
            } catch (error) {
                console.warn('⚠️ Failed to fetch leagues:', error);
                return null;
            }
        }

        // ============================================
        // DATA PROCESSING
        // ============================================

        /**
         * Group matches by date
         */
        function groupMatchesByDate(matches) {
            const grouped = {};
            
            matches.forEach(match => {
                const matchDate = new Date(match.start_time);
                const dateKey = matchDate.toLocaleDateString('en-US', {
                    weekday: 'long',
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });
                
                if (!grouped[dateKey]) {
                    grouped[dateKey] = [];
                }
                
                grouped[dateKey].push({
                    ...match,
                    formattedTime: formatTime(match.start_time),
                    isToday: isToday(match.start_time),
                    isTomorrow: isTomorrow(match.start_time)
                });
            });
            
            return grouped;
        }

        /**
         * Calculate statistics
         */
        function calculateStatistics(matches) {
            const todayMatches = matches.filter(m => isToday(m.start_time));
            const uniqueLeagues = new Set(matches.map(m => m.league_name || m.league_id));
            
            return {
                todayCount: todayMatches.length,
                totalCount: matches.length,
                leaguesCount: uniqueLeagues.size,
                weekCount: matches.length
            };
        }

        /**
         * Filter matches based on search and filter criteria
         */
        function filterMatches(matches, searchQuery, filter) {
            let filtered = [...matches];
            
            // Apply search filter
            if (searchQuery) {
                const query = searchQuery.toLowerCase().trim();
                filtered = filtered.filter(match => 
                    (match.home_team && match.home_team.toLowerCase().includes(query)) ||
                    (match.away_team && match.away_team.toLowerCase().includes(query)) ||
                    (match.league_name && match.league_name.toLowerCase().includes(query)) ||
                    (match.sport_type && match.sport_type.toLowerCase().includes(query))
                );
            }
            
            // Apply category filter
            if (filter && filter !== 'all') {
                switch(filter) {
                    case 'today':
                        filtered = filtered.filter(m => isToday(m.start_time));
                        break;
                    case 'football':
                    case 'basketball':
                    case 'tennis':
                    case 'cricket':
                        filtered = filtered.filter(m => 
                            m.sport_type && m.sport_type.toLowerCase() === filter
                        );
                        break;
                }
            }
            
            return filtered;
        }

        // ============================================
        // UI RENDERING
        // ============================================

        /**
         * Render all matches
         */
        function renderMatches() {
            const container = document.getElementById('matchesContainer');
            
            // Apply filters
            AppState.filteredMatches = filterMatches(
                AppState.matches,
                AppState.searchQuery,
                AppState.currentFilter
            );
            
            // Group filtered matches
            AppState.groupedMatches = groupMatchesByDate(AppState.filteredMatches);
            
            // Update statistics
            AppState.statistics = calculateStatistics(AppState.filteredMatches);
            updateStatisticsDisplay();
            
            // Show appropriate state
            if (AppState.loading) {
                renderLoading();
                return;
            }
            
            if (AppState.error) {
                renderError();
                return;
            }
            
            if (AppState.filteredMatches.length === 0) {
                renderEmpty();
                return;
            }
            
            // Render grouped matches
            let html = '';
            
            for (const [date, matches] of Object.entries(AppState.groupedMatches)) {
                const firstMatch = matches[0];
                const dateClass = firstMatch.isToday ? 'today' : '';
                
                html += `
                    <div class="date-group">
                        <div class="date-header ${dateClass}">
                            <div class="date-label">
                                ${firstMatch.isToday ? '🔥' : firstMatch.isTomorrow ? '📅' : '📆'} 
                                ${date}
                                ${firstMatch.isToday ? '<span class="today-badge">TODAY</span>' : ''}
                                ${firstMatch.isTomorrow ? '<span class="today-badge" style="background: var(--info);">TOMORROW</span>' : ''}
                            </div>
                            <span class="match-count-badge">
                                ${matches.length} match${matches.length !== 1 ? 'es' : ''}
                            </span>
                        </div>
                        <div class="matches-grid">
                            ${matches.map(match => renderMatchCard(match)).join('')}
                        </div>
                    </div>
                `;
            }
            
            container.innerHTML = html;
            
            // Attach event listeners
            attachMatchCardListeners();
        }

        /**
         * Render individual match card
         */
        function renderMatchCard(match) {
            const odds = match.odds || {};
            
            return `
                <div class="match-card" data-match-id="${match.id}" data-match='${JSON.stringify(match).replace(/'/g, "&#39;")}'>
                    <div class="match-card-header">
                        <div class="league-badge">
                            <span class="league-icon"></span>
                            ${match.league_name || 'Unknown League'}
                        </div>
                        <div class="match-time">
                            <i class="far fa-clock"></i>
                            ${match.formattedTime || formatTime(match.start_time)}
                        </div>
                    </div>
                    <div class="match-card-body">
                        <div class="teams-display">
                            <div class="team">
                                <span class="team-name">${match.home_team || 'Home Team'}</span>
                            </div>
                            <div class="vs-divider">VS</div>
                            <div class="team">
                                <span class="team-name">${match.away_team || 'Away Team'}</span>
                            </div>
                        </div>
                    </div>
                    <div class="match-card-footer">
                        <button class="odds-btn" onclick="placeBet('${match.id}', 'home', event)">
                            <span class="odds-label">Home</span>
                            <span class="odds-value">${odds.home || 'N/A'}</span>
                        </button>
                        <button class="odds-btn" onclick="placeBet('${match.id}', 'draw', event)">
                            <span class="odds-label">Draw</span>
                            <span class="odds-value">${odds.draw || 'N/A'}</span>
                        </button>
                        <button class="odds-btn" onclick="placeBet('${match.id}', 'away', event)">
                            <span class="odds-label">Away</span>
                            <span class="odds-value">${odds.away || 'N/A'}</span>
                        </button>
                    </div>
                </div>
            `;
        }

        /**
         * Render loading state
         */
        function renderLoading() {
            document.getElementById('matchesContainer').innerHTML = `
                <div class="loading-container">
                    <div class="spinner"></div>
                    <p class="loading-text">Loading upcoming matches...</p>
                </div>
            `;
        }

        /**
         * Render empty state
         */
        function renderEmpty() {
            const dateRange = getDateRange();
            document.getElementById('matchesContainer').innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">📅</div>
                    <h3>No Upcoming Matches Found</h3>
                    <p>There are no matches scheduled from ${dateRange.display.start} to ${dateRange.display.end}.</p>
                    <button class="btn btn-primary" onclick="refreshMatches()">
                        <i class="fas fa-sync-alt"></i>
                        Refresh
                    </button>
                </div>
            `;
        }

        /**
         * Render error state
         */
        function renderError() {
            document.getElementById('matchesContainer').innerHTML = `
                <div class="error-state">
                    <div class="error-state-icon">⚠️</div>
                    <h3>Error Loading Matches</h3>
                    <p>${AppState.error || 'An unexpected error occurred'}</p>
                    <button class="btn btn-primary" onclick="refreshMatches()">
                        <i class="fas fa-redo"></i>
                        Try Again
                    </button>
                </div>
            `;
        }

        /**
         * Update statistics display
         */
        function updateStatisticsDisplay() {
            document.getElementById('todayCount').textContent = AppState.statistics.todayCount;
            document.getElementById('totalCount').textContent = AppState.statistics.totalCount;
            document.getElementById('leaguesCount').textContent = AppState.statistics.leaguesCount;
            document.getElementById('weekCount').textContent = AppState.statistics.weekCount;
        }

        // ============================================
        // EVENT HANDLERS
        // ============================================

        /**
         * Attach match card click listeners
         */
        function attachMatchCardListeners() {
            document.querySelectorAll('.match-card').forEach(card => {
                card.addEventListener('click', function(e) {
                    // Don't trigger if clicking on odds button
                    if (e.target.closest('.odds-btn')) {
                        return;
                    }
                    
                    const matchId = this.dataset.matchId;
                    showMatchDetails(matchId);
                });
            });
        }

        /**
         * Show match details
         */
        function showMatchDetails(matchId) {
            const match = AppState.matches.find(m => m.id === matchId || m.id === parseInt(matchId));
            if (match) {
                console.log('Match details:', match);
                showToast(`Selected: ${match.home_team} vs ${match.away_team}`, 'info');
                // Implement modal or navigation to match details page
            }
        }

        /**
         * Place a bet
         */
        function placeBet(matchId, betType, event) {
            if (event) {
                event.stopPropagation();
            }
            
            const match = AppState.matches.find(m => m.id === matchId || m.id === parseInt(matchId));
            if (!match) {
                showToast('Match not found', 'error');
                return;
            }
            
            console.log(`Placing bet: Match ${matchId}, Type: ${betType}`);
            showToast(`Bet placed: ${betType.toUpperCase()} on ${match.home_team} vs ${match.away_team}`, 'success');
            
            // Implement actual betting logic here
        }

        /**
         * Handle search input
         */
        function handleSearch(event) {
            AppState.searchQuery = event.target.value;
            renderMatches();
        }

        /**
         * Handle filter tag click
         */
        function handleFilterClick(filter) {
            AppState.currentFilter = filter;
            
            // Update active state on filter tags
            document.querySelectorAll('.filter-tag').forEach(tag => {
                tag.classList.toggle('active', tag.dataset.filter === filter);
            });
            
            renderMatches();
        }

        /**
         * Refresh matches manually
         */
        async function refreshMatches() {
            const refreshBtn = document.getElementById('refreshBtn');
            refreshBtn.classList.add('refreshing');
            
            await fetchMatches();
            renderMatches();
            
            refreshBtn.classList.remove('refreshing');
            showToast('Matches refreshed successfully', 'success');
        }

        /**
         * Navigation handler
         */
        function navigateTo(page) {
            const urls = {
                'live': '/sports/live-matches.html',
                'upcoming': '/sports/upcoming-matches.html',
                'history': '/sports/betting-history.html'
            };
            
            if (urls[page]) {
                window.location.href = urls[page];
            }
        }

        // ============================================
        // INITIALIZATION
        // ============================================

        /**
         * Initialize the application
         */
        async function initApp() {
            console.log('🚀 Initializing XLodon Sports Matches...');
            
            // Initialize databases
            const supabaseReady = initSupabase();
            const firebaseReady = initFirebase();
            
            if (!supabaseReady) {
                renderError();
                return;
            }
            
            // Add event listeners
            document.getElementById('searchInput').addEventListener('input', handleSearch);
            
            document.querySelectorAll('.filter-tag').forEach(tag => {
                tag.addEventListener('click', function() {
                    handleFilterClick(this.dataset.filter);
                });
            });
            
            // Fetch initial data
            await fetchMatches();
            
            // Fetch leagues in background
            fetchLeagues().then(leagues => {
                if (leagues) {
                    console.log('📊 Leagues loaded:', leagues.length);
                }
            });
            
            // Render matches
            renderMatches();
            
            // Set up auto-refresh
            AppState.autoRefreshTimer = setInterval(async () => {
                console.log('🔄 Auto-refreshing matches...');
                await fetchMatches();
                renderMatches();
            }, CONFIG.AUTO_REFRESH_INTERVAL);
            
            console.log('✅ Application initialized successfully');
            showToast('Matches loaded successfully', 'success', 2000);
        }

        /**
         * Clean up on page unload
         */
        function cleanup() {
            if (AppState.autoRefreshTimer) {
                clearInterval(AppState.autoRefreshTimer);
            }
            console.log('🧹 Cleanup completed');
        }

        // Initialize when DOM is ready
        document.addEventListener('DOMContentLoaded', initApp);
        
        // Clean up on page unload
        window.addEventListener('beforeunload', cleanup);
        
        // Handle visibility change to optimize refresh
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                // Pause auto-refresh when page is not visible
                if (AppState.autoRefreshTimer) {
                    clearInterval(AppState.autoRefreshTimer);
                    AppState.autoRefreshTimer = null;
                }
            } else {
                // Resume auto-refresh when page becomes visible
                if (!AppState.autoRefreshTimer) {
                    AppState.autoRefreshTimer = setInterval(async () => {
                        console.log('🔄 Auto-refreshing matches...');
                        await fetchMatches();
                        renderMatches();
                    }, CONFIG.AUTO_REFRESH_INTERVAL);
                    
                    // Also refresh immediately when becoming visible
                    fetchMatches().then(() => renderMatches());
                }
            }
        });

        // Export global functions
        window.refreshMatches = refreshMatches;
        window.placeBet = placeBet;
        window.navigateTo = navigateTo;
    </script>
</body>
</html>
