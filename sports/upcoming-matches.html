<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Upcoming - X Lodon | المباريات القادمة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <link rel="stylesheet" href="../css/sports-betting.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0f1a; color: white; font-family: 'Segoe UI', 'Tajawal', sans-serif; min-height: 100vh; }
        .header { background: #111827; padding: 12px 15px; border-bottom: 2px solid #00ff9d; position: sticky; top: 0; z-index: 100; }
        .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; flex-wrap: wrap; gap: 10px; }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .back-btn { color: #00ff9d; text-decoration: none; font-size: 20px; }
        .lang-toggle { background: #1a2332; border: 1px solid #00ff9d; color: #00ff9d; padding: 5px 12px; border-radius: 20px; cursor: pointer; }
        .tabs { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 3px; }
        .tab { padding: 8px 12px; background: #1a2332; border-radius: 20px; color: white; text-decoration: none; font-size: 12px; }
        .tab.active { background: #00ff9d; color: black; }
        .container { max-width: 1400px; margin: 0 auto; padding: 15px; padding-bottom: 180px; }
        .balance-bar { background: #111827; padding: 10px 15px; border-radius: 12px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #00ff9d33; flex-wrap: wrap; gap: 10px; }
        .selector-bar { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .league-select { flex: 2; padding: 12px; background: #111827; border: 1px solid #ffffff22; border-radius: 12px; color: white; font-size: 13px; min-width: 180px; }
        .search-input { flex: 3; padding: 12px; background: #111827; border: 1px solid #ffffff22; border-radius: 12px; color: white; font-size: 13px; min-width: 200px; }
        .date-filter { flex: 1; padding: 12px; background: #111827; border: 1px solid #ffffff22; border-radius: 12px; color: white; font-size: 13px; min-width: 140px; }
        .debug-bar { background: #1a2332; padding: 8px 15px; border-radius: 8px; margin-bottom: 10px; font-size: 11px; color: #00ff9d; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .refresh-btn { background: #00ff9d; color: black; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 11px; }
        .force-sync-btn { background: #ff9800; color: black; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 11px; margin-left: auto; }
        .date-section { margin-bottom: 20px; }
        .date-header { background: linear-gradient(135deg, #00ff9d11, #00ff9d05); border-left: 3px solid #00ff9d; padding: 12px 15px; border-radius: 8px; margin-bottom: 10px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .date-header .date-title { font-weight: bold; font-size: 16px; color: #00ff9d; }
        .date-header .match-count { font-size: 12px; color: #a0a8c9; }
        .date-matches.collapsed { display: none; }
        .league-group { margin-bottom: 15px; background: #0f1420; border-radius: 12px; overflow: hidden; }
        .league-group-header { background: #1a2332; padding: 10px 15px; cursor: pointer; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #ffffff0a; }
        .league-group-header .league-logo { width: 24px; height: 24px; object-fit: contain; }
        .league-group-header .league-name { font-weight: 600; font-size: 14px; color: #ff9800; }
        .league-group-header .match-count { font-size: 11px; color: #a0a8c9; margin-left: auto; }
        .league-matches.collapsed { display: none; }
        .match-row { display: flex; align-items: center; gap: 10px; padding: 12px 15px; border-bottom: 1px solid #ffffff0a; transition: background 0.2s; flex-wrap: wrap; }
        .match-row:hover { background: #ffffff08; }
        .match-time-col { text-align: center; min-width: 70px; }
        .match-time-col .time { font-weight: bold; color: #00ff9d; font-size: 13px; }
        .match-time-col .countdown { font-size: 10px; color: #a0a8c9; }
        .team-col { flex: 2; display: flex; align-items: center; gap: 8px; min-width: 200px; }
        .team-col .team-logo { width: 28px; height: 28px; object-fit: contain; border-radius: 50%; background: #1a2332; padding: 2px; }
        .team-col .team-name { font-weight: 500; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .team-col .vs { color: #ff9800; margin: 0 5px; font-size: 11px; }
        .odds-col { display: flex; gap: 6px; }
        .odd-mini { padding: 6px 12px; background: #0a0f1a; border-radius: 8px; font-size: 12px; text-align: center; min-width: 55px; border: 1px solid #ffffff11; cursor: pointer; transition: all 0.2s; }
        .odd-mini:hover { background: #00ff9d22; border-color: #00ff9d; transform: scale(1.02); }
        .odd-mini .odd-label { font-size: 10px; color: #a0a8c9; }
        .odd-mini .odd-value { font-weight: bold; color: #00ff9d; font-size: 14px; }
        .bet-btn, .slip-btn { padding: 6px 14px; border-radius: 25px; font-size: 11px; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; }
        .bet-btn { background: #00ff9d; color: black; }
        .bet-btn:hover { transform: scale(1.02); background: #00cc7d; }
        .slip-btn { background: #ff9800; color: black; }
        .slip-btn:hover { transform: scale(1.02); background: #e68900; }
        .bet-slip { position: fixed; bottom: 0; left: 0; right: 0; background: #111827; border-top: 2px solid #ff9800; padding: 15px; z-index: 1000; max-height: 280px; overflow-y: auto; }
        .slip-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .slip-title { color: #ff9800; font-weight: 600; }
        .slip-clear { color: #ff5252; font-size: 12px; cursor: pointer; }
        .slip-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #ffffff11; font-size: 12px; }
        .slip-remove { color: #ff5252; cursor: pointer; margin-left: 10px; }
        .slip-total { display: flex; justify-content: space-between; padding: 10px 0; font-weight: bold; }
        .slip-total-odds { color: #ff9800; font-size: 18px; }
        .slip-place-btn { width: 100%; padding: 12px; background: #ff9800; color: black; border: none; border-radius: 10px; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .empty-state { text-align: center; padding: 60px; color: #a0a8c9; }
        .today-badge { background: #ff5252; color: white; font-size: 10px; padding: 2px 8px; border-radius: 12px; margin-left: 8px; }
        .live-badge { background: #ff5252; color: white; font-size: 10px; padding: 2px 8px; border-radius: 12px; margin-left: 8px; animation: pulse 1s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }
        .loading-spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid #00ff9d; border-top-color: transparent; border-radius: 50%; animation: spin 0.6s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 768px) {
            .match-row { flex-direction: column; align-items: stretch; }
            .team-col { justify-content: center; }
            .odds-col { justify-content: center; }
            .match-time-col { display: flex; justify-content: space-between; align-items: center; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-top">
            <div class="header-left">
                <a href="betting-sport.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
                <h1 style="font-size:18px;"><i class="fas fa-futbol"></i> X Lodon Sports</h1>
            </div>
            <button class="lang-toggle" onclick="toggleLanguage()">عربي</button>
        </div>
        <div class="tabs">
            <a href="betting-sport.html" class="tab">Home</a>
            <a href="live-matches.html" class="tab">Live</a>
            <a href="upcoming-matches.html" class="tab active">Upcoming</a>
            <a href="finished-matches.html" class="tab">Results</a>
            <a href="my-bets.html" class="tab">My Bets</a>
        </div>
    </div>
    
    <div class="container">
        <div class="balance-bar">
            <span><i class="fas fa-wallet"></i> Balance</span>
            <span style="color:#00ff9d;font-weight:bold;font-size:18px;" id="balance-display">$0.00</span>
        </div>
        
        <div class="selector-bar">
            <select id="league-filter" class="league-select">
                <option value="all">🏆 All Leagues</option>
            </select>
            <input type="text" id="search-input" class="search-input" placeholder="🔍 Search team or league..." oninput="filterMatches()">
            <input type="date" id="date-filter" class="date-filter" onchange="filterByDate()">
        </div>
        
        <div class="debug-bar">
            <i class="fas fa-database"></i> <span id="debug-text">Loading matches...</span>
            <button class="refresh-btn" onclick="loadMatches()"><i class="fas fa-sync-alt"></i> Refresh</button>
            <button class="force-sync-btn" onclick="forceSync()"><i class="fas fa-database"></i> Force Sync</button>
        </div>
        
        <div id="matches-container"><div style="text-align:center;padding:50px;"><div class="loading-spinner"></div> Loading upcoming matches...</div></div>
    </div>
    
    <div class="bet-slip" id="bet-slip" style="display:none;">
        <div class="slip-header">
            <span class="slip-title"><i class="fas fa-layer-group"></i> Bet Slip (<span id="slip-count">0</span>)</span>
            <span class="slip-clear" onclick="window.clearSlip()">Clear All</span>
        </div>
        <div id="slip-items"></div>
        <div class="slip-total">
            <span>Total Odds:</span>
            <span class="slip-total-odds" id="slip-total-odds">1.00</span>
        </div>
        <button class="slip-place-btn" id="place-acc-btn" disabled onclick="placeAccumulatorBet()">Place Accumulator (2+ Selections)</button>
    </div>

    <script src="../js/supabase-client.js"></script>
    <script src="../js/betting-engine.js"></script>
    <script>
        let allMatches = [];
        let filteredMatches = [];
        let countdownInterval;
        let selectedLeague = 'all';
        let selectedDate = '';
        
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        
        // Language Toggle
        function toggleLanguage() {
            const isArabic = document.body.classList.toggle('arabic');
            localStorage.setItem('lang', isArabic ? 'ar' : 'en');
            document.documentElement.dir = isArabic ? 'rtl' : 'ltr';
        }
        if (localStorage.getItem('lang') === 'ar') toggleLanguage();
        
        // Auth check
        firebase.auth().onAuthStateChanged(async (u) => {
            if (!u) {
                location.href = '../login.html';
            } else {
                await loadBalance();
                await loadLeagues();
                await loadMatches();
                startAutoRefresh();
            }
        });
        
        async function loadBalance() {
            try {
                const db = firebase.firestore();
                const doc = await db.collection('wallets').doc(firebase.auth().currentUser.uid).get();
                const balance = doc.exists ? (doc.data().balance || 0) : 0;
                document.getElementById('balance-display').textContent = `$${balance.toFixed(2)}`;
            } catch(e) { console.error(e); }
        }
        
        async function loadLeagues() {
            try {
                const res = await fetch('https://millioner.onrender.com/api/leagues');
                const data = await res.json();
                if (data.success && data.data) {
                    const select = document.getElementById('league-filter');
                    data.data.forEach(league => {
                        const option = document.createElement('option');
                        option.value = league.league?.id || league.id;
                        option.textContent = league.league?.name || league.name;
                        select.appendChild(option);
                    });
                }
            } catch(e) { console.error(e); }
            
            document.getElementById('league-filter').onchange = (e) => {
                selectedLeague = e.target.value;
                filterMatches();
            };
        }
        
        async function loadMatches() {
            if (!window.supaDB) {
                document.getElementById('debug-text').innerHTML = '⚠️ Waiting for database...';
                return;
            }
            
            try {
                document.getElementById('debug-text').innerHTML = '<div class="loading-spinner"></div> Loading from database...';
                
                const matches = await window.supaDB.getUpcomingMatches();
                allMatches = matches || [];
                
                // Get unique leagues
                const leagues = [...new Set(allMatches.map(m => m.league_name))];
                console.log(`📊 Loaded ${allMatches.length} matches from ${leagues.length} leagues`);
                
                // Calculate stats
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                
                const todayMatches = allMatches.filter(m => {
                    const d = new Date(m.start_time);
                    d.setHours(0, 0, 0, 0);
                    return d.getTime() === today.getTime();
                }).length;
                
                const futureMatches = allMatches.length - todayMatches;
                const uniqueDates = [...new Set(allMatches.map(m => new Date(m.start_time).toDateString()))];
                
                document.getElementById('debug-text').innerHTML = `✅ ${allMatches.length} matches (Today: ${todayMatches} | Next 7 days: ${futureMatches}) | ${uniqueDates.length} days | ${leagues.length} leagues`;
                
                if (allMatches.length === 0) {
                    document.getElementById('matches-container').innerHTML = `<div class="empty-state"><i class="fas fa-calendar"></i><p>No matches found. Click "Force Sync" to load data.</p></div>`;
                } else {
                    filterMatches();
                    startCountdowns();
                }
                
            } catch(e) {
                console.error(e);
                document.getElementById('debug-text').innerHTML = `❌ Error: ${e.message}`;
            }
        }
        
        async function forceSync() {
            document.getElementById('debug-text').innerHTML = '<div class="loading-spinner"></div> Forcing sync from API...';
            
            try {
                const response = await fetch('https://millioner.onrender.com/api/fixtures/week');
                const data = await response.json();
                
                if (data.success && data.data && data.data.length > 0) {
                    let saved = 0;
                    for (const match of data.data) {
                        const matchData = {
                            fixture_id: match.fixture.id,
                            status: match.fixture.status?.short === 'NS' ? 'upcoming' : 
                                    (match.fixture.status?.short === 'FT' ? 'finished' : 'live'),
                            league_id: match.league.id,
                            league_name: match.league.name,
                            league_logo: match.league.logo,
                            home_team: { id: match.teams.home.id, name: match.teams.home.name, logo: match.teams.home.logo },
                            away_team: { id: match.teams.away.id, name: match.teams.away.name, logo: match.teams.away.logo },
                            start_time: match.fixture.date,
                            odds: { home: 2.50, draw: 3.20, away: 2.80 },
                            score: { home: 0, away: 0 }
                        };
                        if (await window.supaDB.upsertMatch(matchData)) saved++;
                    }
                    console.log(`✅ Synced ${saved} matches`);
                }
                await loadMatches();
            } catch(e) {
                console.error('Force sync error:', e);
                document.getElementById('debug-text').innerHTML = `❌ Sync error: ${e.message}`;
            }
        }
        
        function filterMatches() {
            const search = document.getElementById('search-input').value.toLowerCase();
            const dateFilter = document.getElementById('date-filter').value;
            
            filteredMatches = [...allMatches];
            
            // Filter by league
            if (selectedLeague !== 'all') {
                filteredMatches = filteredMatches.filter(m => m.league_id == selectedLeague);
            }
            
            // Filter by search
            if (search) {
                filteredMatches = filteredMatches.filter(m => {
                    const homeName = (m.home_team?.name || '').toLowerCase();
                    const awayName = (m.away_team?.name || '').toLowerCase();
                    const leagueName = (m.league_name || '').toLowerCase();
                    return homeName.includes(search) || awayName.includes(search) || leagueName.includes(search);
                });
            }
            
            // Filter by date
            if (dateFilter) {
                const filterDate = new Date(dateFilter);
                filterDate.setHours(0, 0, 0, 0);
                filteredMatches = filteredMatches.filter(m => {
                    const matchDate = new Date(m.start_time);
                    matchDate.setHours(0, 0, 0, 0);
                    return matchDate.getTime() === filterDate.getTime();
                });
            }
            
            if (filteredMatches.length === 0) {
                document.getElementById('matches-container').innerHTML = '<div class="empty-state">No matches found for selected filters</div>';
                return;
            }
            
            // Group by date
            const groupedByDate = {};
            filteredMatches.forEach(m => {
                const date = new Date(m.start_time).toDateString();
                if (!groupedByDate[date]) groupedByDate[date] = [];
                groupedByDate[date].push(m);
            });
            
            const today = new Date().toDateString();
            const tomorrow = new Date(Date.now() + 86400000).toDateString();
            
            let html = '';
            
            Object.keys(groupedByDate).sort().forEach(dateKey => {
                const date = new Date(dateKey);
                let label = date.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
                let badge = '';
                
                if (dateKey === today) {
                    badge = '<span class="today-badge"><i class="fas fa-calendar-day"></i> TODAY</span>';
                } else if (dateKey === tomorrow) {
                    badge = '<span class="today-badge"><i class="fas fa-calendar-day"></i> TOMORROW</span>';
                }
                
                // Group by league within date
                const groupedByLeague = {};
                groupedByDate[dateKey].forEach(m => {
                    const leagueName = m.league_name || 'Other Leagues';
                    if (!groupedByLeague[leagueName]) groupedByLeague[leagueName] = [];
                    groupedByLeague[leagueName].push(m);
                });
                
                let leaguesHtml = '';
                Object.keys(groupedByLeague).sort().forEach(leagueName => {
                    const leagueMatches = groupedByLeague[leagueName];
                    const leagueLogo = leagueMatches[0]?.league_logo || '';
                    
                    let matchesHtml = '';
                    leagueMatches.forEach(m => {
                        matchesHtml += createMatchRow(m);
                    });
                    
                    leaguesHtml += `
                        <div class="league-group">
                            <div class="league-group-header" onclick="this.classList.toggle('collapsed');this.nextElementSibling.classList.toggle('collapsed');">
                                ${leagueLogo ? `<img class="league-logo" src="${leagueLogo}" onerror="this.style.display='none'">` : '<i class="fas fa-trophy"></i>'}
                                <span class="league-name">${escapeHtml(leagueName)}</span>
                                <span class="match-count">${leagueMatches.length} matches</span>
                                <i class="fas fa-chevron-down"></i>
                            </div>
                            <div class="league-matches">${matchesHtml}</div>
                        </div>
                    `;
                });
                
                html += `
                    <div class="date-section">
                        <div class="date-header" onclick="this.classList.toggle('collapsed');this.nextElementSibling.classList.toggle('collapsed');">
                            <span class="date-title"><i class="far fa-calendar-alt"></i> ${label} ${badge}</span>
                            <span class="match-count">${groupedByDate[dateKey].length} matches</span>
                            <i class="fas fa-chevron-down"></i>
                        </div>
                        <div class="date-matches">${leaguesHtml}</div>
                    </div>
                `;
            });
            
            document.getElementById('matches-container').innerHTML = html;
        }
        
        function createMatchRow(m) {
            const time = new Date(m.start_time);
            const homeTeam = m.home_team || { name: 'Home', logo: '' };
            const awayTeam = m.away_team || { name: 'Away', logo: '' };
            const odds = m.odds || { home: 2.50, draw: 3.20, away: 2.80 };
            const isLive = m.status === 'live';
            
            return `
                <div class="match-row" data-fixture="${m.fixture_id}" data-time="${m.start_time}">
                    <div class="match-time-col">
                        <div class="time">${time.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</div>
                        <div class="countdown">--:--:--</div>
                        ${isLive ? '<span class="live-badge"><i class="fas fa-circle"></i> LIVE</span>' : ''}
                    </div>
                    <div class="team-col">
                        ${homeTeam.logo ? `<img class="team-logo" src="${homeTeam.logo}" onerror="this.style.display='none'">` : '<i class="fas fa-shield-alt"></i>'}
                        <span class="team-name">${escapeHtml(homeTeam.name)}</span>
                        <span class="vs">vs</span>
                        <span class="team-name">${escapeHtml(awayTeam.name)}</span>
                        ${awayTeam.logo ? `<img class="team-logo" src="${awayTeam.logo}" onerror="this.style.display='none'">` : '<i class="fas fa-shield-alt"></i>'}
                    </div>
                    <div class="odds-col">
                        <div class="odd-mini" onclick="goToMatchWithBet(${m.fixture_id}, 'home', ${odds.home})">
                            <div class="odd-label">1</div>
                            <div class="odd-value">${odds.home}</div>
                        </div>
                        <div class="odd-mini" onclick="goToMatchWithBet(${m.fixture_id}, 'draw', ${odds.draw})">
                            <div class="odd-label">X</div>
                            <div class="odd-value">${odds.draw}</div>
                        </div>
                        <div class="odd-mini" onclick="goToMatchWithBet(${m.fixture_id}, 'away', ${odds.away})">
                            <div class="odd-label">2</div>
                            <div class="odd-value">${odds.away}</div>
                        </div>
                    </div>
                    <button class="bet-btn" onclick="goToMatch(${m.fixture_id})"><i class="fas fa-gavel"></i> Bet</button>
                    <button class="slip-btn" onclick="showAccumulatorPopup(${m.fixture_id}, '${escapeHtml(homeTeam.name)}', '${escapeHtml(awayTeam.name)}', ${odds.home}, ${odds.draw}, ${odds.away})"><i class="fas fa-plus"></i> Slip</button>
                </div>
            `;
        }
        
        function goToMatch(fixtureId) {
            location.href = `match-details.html?id=${fixtureId}`;
        }
        
        function goToMatchWithBet(fixtureId, betType, odds) {
            sessionStorage.setItem('selectedBet', JSON.stringify({ fixtureId, betType, odds }));
            location.href = `match-details.html?id=${fixtureId}`;
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        function startCountdowns() {
            if (countdownInterval) clearInterval(countdownInterval);
            
            function updateCountdowns() {
                document.querySelectorAll('.match-row').forEach(row => {
                    const startTime = row.dataset.time;
                    if (startTime) {
                        const diff = new Date(startTime) - new Date();
                        const countdownEl = row.querySelector('.countdown');
                        if (countdownEl) {
                            if (diff <= 0) {
                                countdownEl.textContent = 'Started';
                                countdownEl.style.color = '#ff9800';
                            } else {
                                const hours = Math.floor(diff / 3600000);
                                const minutes = Math.floor((diff % 3600000) / 60000);
                                const seconds = Math.floor((diff % 60000) / 1000);
                                countdownEl.textContent = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
                                countdownEl.style.color = '#a0a8c9';
                            }
                        }
                    }
                });
            }
            
            updateCountdowns();
            countdownInterval = setInterval(updateCountdowns, 1000);
        }
        
        function startAutoRefresh() {
            setInterval(() => {
                loadBalance();
                loadMatches();
            }, 60000);
        }
        
        function filterByDate() {
            filterMatches();
        }
        
        // Bet Slip UI
        window.updateSlipUI = function() {
            const slip = document.getElementById('bet-slip');
            const selections = window.ACCUMULATOR_SLIP || [];
            
            if (selections.length === 0) {
                slip.style.display = 'none';
                return;
            }
            
            slip.style.display = 'block';
            document.getElementById('slip-count').textContent = selections.length;
            
            let itemsHtml = '';
            let totalOdds = 1;
            
            selections.forEach((s, i) => {
                totalOdds *= s.odds;
                itemsHtml += `
                    <div class="slip-item">
                        <span><strong>${s.betTypeName}</strong><br><small>${s.matchName}</small> @ ${s.odds.toFixed(2)}</span>
                        <span class="slip-remove" onclick="window.removeFromSlip(${i})"><i class="fas fa-times-circle"></i></span>
                    </div>
                `;
            });
            
            document.getElementById('slip-items').innerHTML = itemsHtml;
            document.getElementById('slip-total-odds').textContent = totalOdds.toFixed(2);
            document.getElementById('place-acc-btn').disabled = selections.length < 2;
        };
        
        async function placeAccumulatorBet() {
            if (!window.ACCUMULATOR_SLIP || window.ACCUMULATOR_SLIP.length < 2) {
                alert('Add at least 2 selections');
                return;
            }
            
            const amount = parseFloat(prompt('Enter stake amount ($):', '10'));
            if (!amount || amount < 1) return;
            
            const result = await window.placeAccumulator(window.ACCUMULATOR_SLIP, amount);
            
            if (result.success) {
                alert(`✅ Bet placed! Potential win: $${result.potentialWin.toFixed(2)}`);
                window.clearSlip();
                await loadBalance();
                location.href = 'my-bets.html';
            } else {
                alert(`❌ Failed: ${result.error}`);
            }
        }
        
        window.goToMatch = goToMatch;
        window.placeAccumulatorBet = placeAccumulatorBet;
        window.loadMatches = loadMatches;
        window.forceSync = forceSync;
        window.toggleLanguage = toggleLanguage;
        
        console.log('✅ Upcoming matches page loaded - All leagues available');
    </script>
</body>
</html>
