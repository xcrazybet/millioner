<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upcoming - X Lodon</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        body { background: #0a0f1a; color: white; font-family: 'Segoe UI', sans-serif; margin: 0; }
        .header { background: #111827; padding: 15px; border-bottom: 2px solid #00ff9d; }
        .container { max-width: 1200px; margin: 0 auto; padding: 15px; }
        .date-header { color: #00ff9d; margin: 20px 0 10px; }
        .match-card { background: #111827; border-radius: 10px; padding: 15px; margin: 10px 0; border-left: 4px solid #00ff9d; cursor: pointer; }
        .teams { display: flex; justify-content: space-around; align-items: center; }
        .odds { display: flex; gap: 10px; margin-top: 10px; }
        .odd { flex: 1; text-align: center; background: #1a2332; padding: 8px; border-radius: 6px; }
    </style>
</head>
<body>
    <div class="header">
        <h1><i class="fas fa-calendar"></i> Upcoming Matches</h1>
        <a href="betting-sport.html" style="color:#00ff9d;">← Back</a>
    </div>
    <div class="container">
        <div id="matches-container"></div>
    </div>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        
        firebase.auth().onAuthStateChanged(u => {
            if (!u) return location.href = '../login.html';
            const nextWeek = new Date(); nextWeek.setDate(nextWeek.getDate() + 7);
            db.collection('sports_matches')
                .where('status', '==', 'upcoming')
                .where('startTime', '>=', new Date())
                .where('startTime', '<=', nextWeek)
                .orderBy('startTime').onSnapshot(snap => {
                    const container = document.getElementById('matches-container');
                    const grouped = {};
                    snap.forEach(d => {
                        const m = d.data();
                        const key = m.startTime.toDate().toDateString();
                        if (!grouped[key]) grouped[key] = [];
                        grouped[key].push(m);
                    });
                    container.innerHTML = '';
                    Object.keys(grouped).sort().forEach(key => {
                        container.innerHTML += `<div class="date-header">${key}</div>`;
                        grouped[key].forEach(m => {
                            const div = document.createElement('div'); div.className = 'match-card';
                            div.onclick = () => location.href = `match-details.html?id=${m.fixtureId}`;
                            div.innerHTML = `
                                <div>${m.leagueName}</div>
                                <div class="teams">
                                    <span>${m.homeTeam.name}</span><span>VS</span><span>${m.awayTeam.name}</span>
                                </div>
                                <div>${m.startTime.toDate().toLocaleTimeString()}</div>
                                <div class="odds">
                                    <div class="odd">H: ${m.odds.home}</div>
                                    <div class="odd">D: ${m.odds.draw}</div>
                                    <div class="odd">A: ${m.odds.away}</div>
                                </div>
                            `;
                            container.appendChild(div);
                        });
                    });
                });
        });
    </script>
    <script src="../js/sports-api.js"></script>
</body>
</html>
