<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Upcoming - X Lodon</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <link rel="stylesheet" href="../css/sports-betting.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0f1a; color: white; font-family: 'Segoe UI', sans-serif; min-height: 100vh; }
        .header { background: #111827; padding: 12px 15px; border-bottom: 2px solid #00ff9d; position: sticky; top: 0; z-index: 100; }
        .header-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .back-btn { color: #00ff9d; text-decoration: none; font-size: 20px; }
        .tabs { display: flex; gap: 5px; overflow-x: auto; white-space: nowrap; padding-bottom: 3px; }
        .tab { padding: 8px 12px; background: #1a2332; border-radius: 20px; color: white; text-decoration: none; font-size: 12px; }
        .tab.active { background: #00ff9d; color: black; }
        .container { max-width: 1200px; margin: 0 auto; padding: 15px; }
        .date-tabs { display: flex; gap: 5px; margin-bottom: 15px; overflow-x: auto; }
        .date-tab { padding: 10px 16px; background: #1a2332; border: none; border-radius: 25px; color: white; font-size: 13px; cursor: pointer; white-space: nowrap; }
        .date-tab.active { background: #00ff9d; color: black; }
        .match-card { background: #111827; border-radius: 12px; padding: 15px; margin-bottom: 10px; border-left: 4px solid #00ff9d; cursor: pointer; }
        .match-teams { display: flex; align-items: center; justify-content: space-around; margin: 10px 0; }
        .team { text-align: center; flex: 1; font-weight: 600; }
        .vs { color: #ff9800; font-weight: bold; }
        .countdown-box { background: #1a2332; border-radius: 8px; padding: 10px; margin-top: 10px; text-align: center; }
        .countdown-value { color: #00ff9d; font-size: 18px; font-weight: bold; }
        .match-time { color: #a0a8c9; font-size: 12px; margin-top: 5px; }
        .odds { display: flex; gap: 8px; margin-top: 12px; }
        .odd { flex: 1; text-align: center; padding: 8px; background: #0a0f1a; border-radius: 6px; }
        .odd-value { color: #00ff9d; font-weight: bold; }
        .empty-state { text-align: center; padding: 50px; color: #a0a8c9; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-top">
            <a href="betting-sport.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
            <h1 style="font-size:18px;"><i class="fas fa-futbol"></i> X Lodon Sports</h1>
        </div>
        <div class="tabs">
            <a href="betting-sport.html" class="tab">Home</a>
            <a href="live-matches.html" class="tab">Live</a>
            <a href="upcoming-matches.html" class="tab active">Upcoming</a>
            <a href="finished-matches.html" class="tab">Results</a>
            <a href="my-bets.html" class="tab">My Bets</a>
        </div>
    </div>
    
    <div class="container">
        <div class="date-tabs" id="date-tabs">
            <button class="date-tab active" data-days="0">Today</button>
            <button class="date-tab" data-days="1">Tomorrow</button>
            <button class="date-tab" data-days="2"></button>
            <button class="date-tab" data-days="3"></button>
            <button class="date-tab" data-days="4"></button>
            <button class="date-tab" data-days="5"></button>
            <button class="date-tab" data-days="6"></button>
        </div>
        <div id="matches-container"></div>
        <div id="empty-state" class="empty-state" style="display:none;">No matches found</div>
    </div>

    <script src="../js/supabase-client.js"></script>
    <script src="../js/sports-api.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        
        let currentDays = 0, countdownInterval;
        
        auth.onAuthStateChanged(u => { if (!u) location.href = '../login.html'; else init(); });
        
        function init() {
            setupDateTabs();
            loadMatches();
        }
        
        function setupDateTabs() {
            const tabs = document.querySelectorAll('.date-tab');
            const today = new Date();
            tabs.forEach((tab, i) => {
                const days = parseInt(tab.dataset.days);
                const date = new Date(today);
                date.setDate(today.getDate() + days);
                const dayName = date.toLocaleDateString('en-US', { weekday: 'short' });
                const dayMonth = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                tab.textContent = days === 0 ? 'Today' : days === 1 ? 'Tomorrow' : `${dayName} ${dayMonth}`;
                tab.addEventListener('click', function() {
                    document.querySelectorAll('.date-tab').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    currentDays = parseInt(this.dataset.days);
                    loadMatches();
                });
            });
        }
        
        async function loadMatches() {
            const container = document.getElementById('matches-container');
            const empty = document.getElementById('empty-state');
            container.innerHTML = '<div style="padding:30px;text-align:center;">Loading...</div>';
            
            if (!window.supaDB) {
                container.innerHTML = '<div class="empty-state">Supabase not connected</div>';
                return;
            }
            
            const targetDate = new Date();
            targetDate.setDate(targetDate.getDate() + currentDays);
            const startDate = new Date(targetDate); startDate.setHours(0,0,0,0);
            const endDate = new Date(targetDate); endDate.setHours(23,59,59,999);
            
            const matches = await window.supaDB.getUpcomingByDate(startDate, endDate);
            
            if (matches.length === 0) {
                container.style.display = 'none';
                empty.style.display = 'block';
                return;
            }
            
            container.style.display = 'block';
            empty.style.display = 'none';
            container.innerHTML = '';
            matches.forEach(m => container.appendChild(createCard(m)));
            startCountdowns(matches);
        }
        
        function getTeamColor(name) { let hash = 0; for (let i=0; i<name.length; i++) hash += name.charCodeAt(i); return 'hsl(' + (hash % 360) + ', 65%, 45%)'; }
        
        function createCard(m) {
            const card = document.createElement('div');
            card.className = 'match-card';
            card.onclick = () => location.href = 'match-details.html?id=' + m.fixture_id;
            const time = new Date(m.start_time);
            const id = 'cd-' + m.fixture_id;
            const homeName = m.home_team?.name || 'Home';
            const awayName = m.away_team?.name || 'Away';
            
            card.innerHTML = `
                <div class="match-teams">
                    <div class="team"><div style="width:40px;height:40px;margin:0 auto 5px;border-radius:50%;background:${getTeamColor(homeName)};display:flex;align-items:center;justify-content:center;font-weight:bold;color:white;">${homeName.substring(0,2).toUpperCase()}</div><div>${homeName}</div></div>
                    <div class="vs">VS</div>
                    <div class="team"><div style="width:40px;height:40px;margin:0 auto 5px;border-radius:50%;background:${getTeamColor(awayName)};display:flex;align-items:center;justify-content:center;font-weight:bold;color:white;">${awayName.substring(0,2).toUpperCase()}</div><div>${awayName}</div></div>
                </div>
                <div class="countdown-box">
                    <div class="countdown-value" id="${id}">--:--:--</div>
                    <div class="match-time">${time.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</div>
                </div>
                <div class="odds">
                    <div class="odd">1 <span class="odd-value">${m.odds?.home||'2.00'}</span></div>
                    <div class="odd">X <span class="odd-value">${m.odds?.draw||'3.50'}</span></div>
                    <div class="odd">2 <span class="odd-value">${m.odds?.away||'3.80'}</span></div>
                </div>
            `;
            return card;
        }
        
        function startCountdowns(matches) {
            if (countdownInterval) clearInterval(countdownInterval);
            countdownInterval = setInterval(() => {
                matches.forEach(m => {
                    const el = document.getElementById('cd-' + m.fixture_id);
                    if (el) {
                        const diff = new Date(m.start_time) - new Date();
                        if (diff <= 0) { el.textContent = 'Starting...'; }
                        else { const h = Math.floor(diff/3600000), mn = Math.floor((diff%3600000)/60000), s = Math.floor((diff%60000)/1000); el.textContent = `${h.toString().padStart(2,'0')}:${mn.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`; }
                    }
                });
            }, 1000);
        }
        
        window.addEventListener('beforeunload', () => { if (countdownInterval) clearInterval(countdownInterval); });
    </script>
</body>
</html>
