<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Upcoming - X Lodon | المباريات القادمة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <link rel="stylesheet" href="../css/sports-betting.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0f1a; color: white; font-family: 'Segoe UI', 'Tajawal', sans-serif; min-height: 100vh; }
        .header { background: #111827; padding: 12px 15px; border-bottom: 2px solid #00ff9d; position: sticky; top: 0; z-index: 100; }
        .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .back-btn { color: #00ff9d; text-decoration: none; font-size: 20px; }
        .lang-toggle { background: #1a2332; border: 1px solid #00ff9d; color: #00ff9d; padding: 5px 12px; border-radius: 20px; cursor: pointer; }
        .tabs { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 3px; }
        .tab { padding: 8px 12px; background: #1a2332; border-radius: 20px; color: white; text-decoration: none; font-size: 12px; }
        .tab.active { background: #00ff9d; color: black; }
        .container { max-width: 1200px; margin: 0 auto; padding: 15px; }
        .balance-bar { background: #111827; padding: 10px 15px; border-radius: 12px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #00ff9d33; }
        .selector-bar { display: flex; gap: 10px; margin-bottom: 15px; }
        .league-select { flex: 1; padding: 14px; background: #111827; border: 1px solid #ffffff22; border-radius: 12px; color: white; font-size: 14px; }
        .day-select { flex: 1; padding: 14px; background: #111827; border: 1px solid #ffffff22; border-radius: 12px; color: white; font-size: 14px; }
        
        .league-group { margin-bottom: 20px; }
        .league-group-header { display: flex; align-items: center; gap: 10px; padding: 10px 0; cursor: pointer; }
        .league-group-header .name { font-weight: 600; font-size: 15px; color: #00ff9d; }
        .league-group-header .count { color: #a0a8c9; font-size: 12px; margin-left: auto; }
        .league-group-header i { color: #a0a8c9; transition: transform 0.3s; font-size: 14px; }
        .league-group-header.collapsed i { transform: rotate(-90deg); }
        .league-matches { border-left: 2px solid #00ff9d22; padding-left: 12px; }
        .league-matches.collapsed { display: none; }
        
        .match-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #ffffff11; cursor: pointer; font-size: 13px; }
        .match-time-col { text-align: center; min-width: 50px; }
        .match-time-col .time { font-weight: bold; color: #00ff9d; }
        .match-time-col .countdown { font-size: 11px; color: #a0a8c9; }
        .team-col { flex: 1; display: flex; align-items: center; gap: 8px; }
        .team-col img { width: 24px; height: 24px; object-fit: contain; }
        .team-col .names { font-weight: 500; }
        .team-col .names .vs { color: #ff9800; margin: 0 5px; }
        .odds-col { display: flex; gap: 5px; }
        .odd-mini { padding: 4px 8px; background: #0a0f1a; border-radius: 4px; font-size: 12px; text-align: center; min-width: 40px; }
        .odd-mini span { color: #00ff9d; font-weight: bold; }
        .bet-btn { padding: 6px 14px; background: #00ff9d; color: black; border: none; border-radius: 20px; font-size: 11px; font-weight: 600; cursor: pointer; }
        .empty-state { text-align: center; padding: 50px; color: #a0a8c9; }
        .arabic { font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-top">
            <div class="header-left">
                <a href="betting-sport.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
                <h1 style="font-size:18px;"><i class="fas fa-futbol"></i> <span class="en">X Lodon Sports</span><span class="ar" style="display:none;">إكس لودون سبورت</span></h1>
            </div>
            <button class="lang-toggle" onclick="toggleLanguage()"><span class="en">🇸🇦 عربي</span><span class="ar" style="display:none;">🇬🇧 English</span></button>
        </div>
        <div class="tabs">
            <a href="betting-sport.html" class="tab"><span class="en">Home</span></a>
            <a href="live-matches.html" class="tab"><span class="en">Live</span></a>
            <a href="upcoming-matches.html" class="tab active"><span class="en">Upcoming</span></a>
            <a href="finished-matches.html" class="tab"><span class="en">Results</span></a>
            <a href="my-bets.html" class="tab"><span class="en">My Bets</span></a>
        </div>
    </div>
    
    <div class="container">
        <div class="balance-bar">
            <span><i class="fas fa-wallet"></i> <span class="en">Balance</span></span>
            <span style="color:#00ff9d;font-weight:bold;font-size:18px;" id="balance-display">$0.00</span>
        </div>
        <div class="selector-bar">
            <select id="league-filter" class="league-select"><option value="all">All Leagues</option></select>
            <select id="day-filter" class="day-select"><option value="0">Today</option></select>
        </div>
        <div id="matches-container"><div style="text-align:center;padding:30px;">Loading...</div></div>
    </div>

    <script src="../js/supabase-client.js"></script>
    <script>
        function toggleLanguage() {
            var isEn = document.querySelector('.en').style.display !== 'none';
            document.querySelectorAll('.en').forEach(el => el.style.display = isEn ? 'none' : '');
            document.querySelectorAll('.ar').forEach(el => el.style.display = isEn ? '' : 'none');
            document.documentElement.dir = isEn ? 'rtl' : 'ltr';
            localStorage.setItem('lang', isEn ? 'ar' : 'en');
        }
        if(localStorage.getItem('lang')==='ar'){setTimeout(toggleLanguage,10);}
        
        const firebaseConfig = { apiKey:"AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM", authDomain:"x-bet-prod-jd.firebaseapp.com", projectId:"x-bet-prod-jd", storageBucket:"x-bet-prod-jd.firebasestorage.app", messagingSenderId:"499334334535", appId:"1:499334334535:web:bebc1bf817e24d9e3c4962" };
        if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        
        let allMatches=[], currentDays=0, countdownInterval, selectedLeague='all';
        
        firebase.auth().onAuthStateChanged(u => { if(!u) location.href='../login.html'; else init(); });
        
        async function init(){
            await loadBalance();
            await loadLeaguesFilter();
            setupDayFilter();
            await loadAllMatches();
        }
        
        async function loadBalance(){
            try {
                const db = firebase.firestore();
                const w = await db.collection('wallets').doc(firebase.auth().currentUser.uid).get();
                document.getElementById('balance-display').textContent = '$' + (w.exists ? (w.data().balance||0) : 0).toFixed(2);
            } catch(e){}
        }
        
        async function loadLeaguesFilter(){
            const select=document.getElementById('league-filter');
            try {
                const r = await fetch('https://millioner.onrender.com/api/leagues');
                const d = await r.json();
                if(d.success && d.data){
                    d.data.sort((a,b)=>(a.name||'').localeCompare(b.name||''));
                    d.data.forEach(l => { if(l.name){ const o=document.createElement('option'); o.value=l.id; o.textContent=l.name; select.appendChild(o); } });
                }
            } catch(e){}
            select.onchange = function(){ selectedLeague=this.value; filterMatches(); };
        }
        
        function setupDayFilter(){
            const select=document.getElementById('day-filter');
            const today=new Date();
            for(let i=0;i<7;i++){
                const date=new Date(today); date.setDate(today.getDate()+i);
                const label = i===0 ? 'Today' : i===1 ? 'Tomorrow' : date.toLocaleDateString('en-US',{weekday:'long', month:'short', day:'numeric'});
                select.innerHTML += `<option value="${i}">${label}</option>`;
            }
            select.onchange = function(){ currentDays=parseInt(this.value); filterMatches(); };
        }
        
        async function loadAllMatches(){
            if(!window.supaDB) return;
            const now = new Date();
            const nextWeek = new Date(); nextWeek.setDate(now.getDate()+7);
            allMatches = await window.supaDB.getUpcomingByDate(now, nextWeek);
            filterMatches();
        }
        
        function filterMatches(){
            const container=document.getElementById('matches-container');
            let filtered = allMatches;
            const targetDate = new Date(); targetDate.setDate(targetDate.getDate()+currentDays);
            const startDay = new Date(targetDate); startDay.setHours(0,0,0,0);
            const endDay = new Date(targetDate); endDay.setHours(23,59,59,999);
            filtered = filtered.filter(m => { const mt = new Date(m.start_time); return mt >= startDay && mt <= endDay; });
            if(selectedLeague !== 'all') filtered = filtered.filter(m => m.league_id == selectedLeague);
            
            if(filtered.length===0){ container.innerHTML='<div class="empty-state"><i class="fas fa-calendar"></i><p>No matches found</p></div>'; return; }
            
            const grouped={};
            filtered.forEach(m=>{ const l=m.league_name||'Other'; if(!grouped[l])grouped[l]=[]; grouped[l].push(m); });
            
            container.innerHTML='';
            Object.keys(grouped).sort().forEach(league=>{
                const group=document.createElement('div'); group.className='league-group';
                group.innerHTML=`<div class="league-group-header" onclick="toggleLeague(this)"><span class="name">${league}</span><span class="count">${grouped[league].length} matches</span><i class="fas fa-chevron-down"></i></div><div class="league-matches">${grouped[league].map(m=>createMatchRow(m)).join('')}</div>`;
                container.appendChild(group);
            });
            startCountdowns(filtered);
        }
        
        function createMatchRow(m){
            const time=new Date(m.start_time);
            const hn=m.home_team?.name||'Home', an=m.away_team?.name||'Away';
            const hl=m.home_team?.logo||'', al=m.away_team?.logo||'';
            const odds=m.odds||{};
            return `<div class="match-row">
                <div class="match-time-col"><div class="time">${time.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div><div class="countdown" id="cd-${m.fixture_id}">--:--:--</div></div>
                <div class="team-col">${hl?`<img src="${hl}" onerror="this.style.display='none'">`:''}<span class="names">${hn} <span class="vs">vs</span> ${an}</span>${al?`<img src="${al}" onerror="this.style.display='none'">`:''}</div>
                <div class="odds-col"><div class="odd-mini">1 <span>${odds.home||'2.00'}</span></div><div class="odd-mini">X <span>${odds.draw||'3.50'}</span></div><div class="odd-mini">2 <span>${odds.away||'3.80'}</span></div></div>
                <button class="bet-btn" onclick="event.stopPropagation();goToMatch(${m.fixture_id})">Bet</button>
            </div>`;
        }
        
        function startCountdowns(matches){
            if(countdownInterval)clearInterval(countdownInterval);
            countdownInterval=setInterval(()=>{matches.forEach(m=>{const el=document.getElementById('cd-'+m.fixture_id);if(el){const diff=new Date(m.start_time)-new Date();if(diff<=0)el.textContent='Starting';else{const h=Math.floor(diff/3600000),mn=Math.floor((diff%3600000)/60000),s=Math.floor((diff%60000)/1000);el.textContent=`${h.toString().padStart(2,'0')}:${mn.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;}}});},1000);
        }
        
        function toggleLeague(el){el.classList.toggle('collapsed');el.nextElementSibling.classList.toggle('collapsed');}
        function goToMatch(fixtureId){location.href=`match-details.html?id=${fixtureId}`;}
        window.toggleLeague=toggleLeague;
        window.addEventListener('beforeunload',()=>{if(countdownInterval)clearInterval(countdownInterval);});
    </script>
</body>
</html>
