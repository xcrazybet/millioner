<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upcoming Matches - X Lodon</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="../css/sports-betting.css">
    <style>
        body { background: #0a0f1a; color: white; font-family: 'Segoe UI', sans-serif; margin: 0; }
        .container { max-width: 1200px; margin: 0 auto; padding: 15px; }
        .header { background: #111827; padding: 15px; border-bottom: 2px solid #00ff9d; }
        .tabs { display: flex; gap: 5px; margin-top: 10px; flex-wrap: wrap; }
        .tab { padding: 10px 15px; background: #1a2332; border-radius: 8px; color: white; text-decoration: none; font-size: 14px; }
        .tab.active { background: #00ff9d; color: black; }
        .match-card { background: #111827; border-radius: 10px; padding: 15px; margin: 10px 0; border-left: 4px solid #00ff9d; cursor: pointer; }
        .match-date-badge { background: #1a2332; padding: 4px 10px; border-radius: 20px; font-size: 12px; color: #00ff9d; }
        .teams { display: flex; align-items: center; justify-content: space-around; margin: 10px 0; }
        .team { text-align: center; flex: 1; }
        .vs-badge { color: #ff9800; font-weight: bold; padding: 0 10px; }
        .odds { display: flex; gap: 8px; margin-top: 12px; }
        .odd { flex: 1; text-align: center; padding: 8px; background: #1a2332; border-radius: 6px; }
        .odd-value { color: #00ff9d; font-weight: bold; }
        .empty-state { text-align: center; padding: 40px; color: #a0a8c9; }
        .back-btn { color: #00ff9d; text-decoration: none; font-size: 20px; margin-right: 15px; }
        .filter-select { width: 100%; padding: 15px; background: #111827; border: 1px solid #ffffff22; border-radius: 10px; color: white; font-size: 16px; margin-bottom: 20px; }
        .date-header { color: #00ff9d; font-size: 16px; margin: 25px 0 15px; padding-bottom: 8px; border-bottom: 1px solid #00ff9d33; display: flex; justify-content: space-between; }
        .match-time { color: #a0a8c9; font-size: 13px; }
        .match-full-date { color: #a0a8c9; font-size: 12px; margin-top: 3px; }
    </style>
</head>
<body>
    <div class="header">
        <h1 style="margin: 0 0 10px 0;"><i class="fas fa-futbol"></i> X Lodon Sports</h1>
        <div class="tabs">
            <a href="betting-sport.html" class="tab"><i class="fas fa-home"></i> Home</a>
            <a href="live-matches.html" class="tab"><i class="fas fa-circle" style="color: #ff5252;"></i> Live</a>
            <a href="upcoming-matches.html" class="tab active"><i class="fas fa-calendar"></i> Upcoming <span id="upcoming-count">0</span></a>
            <a href="finished-matches.html" class="tab"><i class="fas fa-check-circle"></i> Results</a>
            <a href="my-bets.html" class="tab"><i class="fas fa-ticket-alt"></i> My Bets</a>
        </div>
    </div>
    
    <div class="container">
        <div style="display: flex; align-items: center; margin-bottom: 15px;">
            <a href="betting-sport.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
            <div style="font-size: 18px; color: #00ff9d;"><i class="fas fa-calendar"></i> Next 7 Days</div>
        </div>
        
        <select id="league-filter" class="filter-select">
            <option value="all">All Leagues</option>
        </select>
        
        <div id="matches-container"></div>
        <div id="empty-state" class="empty-state" style="display: none;">
            <i class="fas fa-calendar" style="font-size: 48px; opacity: 0.3;"></i>
            <p>No upcoming matches in the next 7 days</p>
        </div>
    </div>
    
    <nav style="display: flex; justify-content: space-around; background: #111827; padding: 12px; margin-top: 30px; border-top: 1px solid #00ff9d20;">
        <a href="../index.html" style="color: #a0a8c9; text-decoration: none;"><i class="fas fa-home"></i> Home</a>
        <a href="../games.html" style="color: #a0a8c9; text-decoration: none;"><i class="fas fa-gamepad"></i> Casino</a>
        <a href="betting-sport.html" style="color: #00ff9d; text-decoration: none;"><i class="fas fa-futbol"></i> Sports</a>
        <a href="../dashboard.html" style="color: #a0a8c9; text-decoration: none;"><i class="fas fa-user"></i> Account</a>
    </nav>
    
    <script src="../js/sports-api.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), db = firebase.firestore();
        
        let allMatches = [];
        let leagues = new Set();
        let unsubscribe = null;
        
        auth.onAuthStateChanged(u => { if (!u) location.href = '../login.html'; else loadMatches(); });
        
        function loadMatches() {
            const container = document.getElementById('matches-container');
            const empty = document.getElementById('empty-state');
            const countEl = document.getElementById('upcoming-count');
            
            const now = new Date();
            const nextWeek = new Date(now);
            nextWeek.setDate(now.getDate() + 7);
            
            unsubscribe = db.collection('sports_matches')
                .where('status', '==', 'upcoming')
                .where('isRealData', '==', true)
                .where('startTime', '>=', now)
                .where('startTime', '<=', nextWeek)
                .orderBy('startTime', 'asc')
                .onSnapshot(snap => {
                    allMatches = [];
                    leagues.clear();
                    
                    snap.forEach(doc => {
                        const m = doc.data();
                        allMatches.push(m);
                        if (m.leagueName) leagues.add(m.leagueName);
                    });
                    
                    countEl.textContent = allMatches.length;
                    
                    if (allMatches.length === 0) {
                        container.style.display = 'none';
                        empty.style.display = 'block';
                    } else {
                        container.style.display = 'block';
                        empty.style.display = 'none';
                        populateFilter();
                        displayMatches(allMatches);
                    }
                }, e => { console.error(e); container.innerHTML = '<p class="empty-state">Error</p>'; });
        }
        
        function populateFilter() {
            const select = document.getElementById('league-filter');
            select.innerHTML = '<option value="all">All Leagues</option>';
            Array.from(leagues).sort().forEach(l => {
                const opt = document.createElement('option');
                opt.value = l;
                opt.textContent = l;
                select.appendChild(opt);
            });
            select.onchange = (e) => {
                const filtered = e.target.value === 'all' ? allMatches : allMatches.filter(m => m.leagueName === e.target.value);
                displayMatches(filtered);
            };
        }
        
        function displayMatches(matches) {
            const container = document.getElementById('matches-container');
            const grouped = {};
            
            matches.forEach(m => {
                const dateKey = m.startTime.toDate().toDateString();
                if (!grouped[dateKey]) grouped[dateKey] = [];
                grouped[dateKey].push(m);
            });
            
            container.innerHTML = '';
            
            Object.keys(grouped).sort().forEach(dateKey => {
                const date = new Date(dateKey);
                const today = new Date();
                const tomorrow = new Date(today);
                tomorrow.setDate(today.getDate() + 1);
                
                let label = date.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
                if (date.toDateString() === today.toDateString()) label = '📅 TODAY - ' + label;
                else if (date.toDateString() === tomorrow.toDateString()) label = '📅 TOMORROW - ' + label;
                
                const header = document.createElement('div');
                header.className = 'date-header';
                header.innerHTML = `<span><i class="fas fa-calendar-day"></i> ${label}</span><span class="match-date-badge">${grouped[dateKey].length} match${grouped[dateKey].length>1?'es':''}</span>`;
                container.appendChild(header);
                
                grouped[dateKey].forEach(m => container.appendChild(createCard(m)));
            });
        }
        
        function createCard(m) {
            const card = document.createElement('div');
            card.className = 'match-card';
            card.onclick = () => location.href = `match-details.html?id=${m.fixtureId}`;
            
            const matchDate = m.startTime.toDate();
            const timeStr = matchDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const fullDateStr = matchDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            
            card.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span style="color: #a0a8c9; font-size: 13px;"><i class="fas fa-trophy"></i> ${m.leagueName || 'League'}</span>
                    <span class="match-date-badge"><i class="far fa-clock"></i> ${timeStr}</span>
                </div>
                <div class="teams">
                    <div class="team"><strong>${m.homeTeam?.name || 'Home'}</strong></div>
                    <div class="vs-badge">VS</div>
                    <div class="team"><strong>${m.awayTeam?.name || 'Away'}</strong></div>
                </div>
                <div class="match-full-date"><i class="far fa-calendar-alt"></i> ${fullDateStr}</div>
                <div class="odds">
                    <div class="odd"><div>Home</div><div class="odd-value">${m.odds?.home?.toFixed(2) || '2.00'}</div></div>
                    <div class="odd"><div>Draw</div><div class="odd-value">${m.odds?.draw?.toFixed(2) || '3.50'}</div></div>
                    <div class="odd"><div>Away</div><div class="odd-value">${m.odds?.away?.toFixed(2) || '3.80'}</div></div>
                </div>
            `;
            return card;
        }
        
        window.addEventListener('beforeunload', () => { if (unsubscribe) unsubscribe(); });
    </script>
</body>
</html>
