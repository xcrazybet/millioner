<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Upcoming - X Lodon | المباريات القادمة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <link rel="stylesheet" href="../css/sports-betting.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0f1a; color: white; font-family: 'Segoe UI', 'Tajawal', sans-serif; min-height: 100vh; }
        .header { background: #111827; padding: 12px 15px; border-bottom: 2px solid #00ff9d; position: sticky; top: 0; z-index: 100; }
        .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .back-btn { color: #00ff9d; text-decoration: none; font-size: 20px; }
        .lang-toggle { background: #1a2332; border: 1px solid #00ff9d; color: #00ff9d; padding: 5px 12px; border-radius: 20px; cursor: pointer; }
        .tabs { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 3px; }
        .tab { padding: 8px 12px; background: #1a2332; border-radius: 20px; color: white; text-decoration: none; font-size: 12px; }
        .tab.active { background: #00ff9d; color: black; }
        .container { max-width: 1200px; margin: 0 auto; padding: 15px; padding-bottom: 180px; }
        
        .selector-bar { display: flex; gap: 10px; margin-bottom: 15px; }
        .league-select { flex: 1; padding: 14px; background: #111827; border: 1px solid #ffffff22; border-radius: 12px; color: white; font-size: 14px; }
        
        .day-tabs { display: flex; gap: 5px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px; }
        .day-tab { padding: 10px 16px; background: #1a2332; border: none; border-radius: 25px; color: white; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
        .day-tab.active { background: #00ff9d; color: black; }
        
        .league-group { margin-bottom: 20px; }
        .league-group-header { display: flex; align-items: center; gap: 10px; padding: 10px 0; cursor: pointer; }
        .league-group-header .name { font-weight: 600; font-size: 15px; color: #00ff9d; }
        .league-group-header .count { color: #a0a8c9; font-size: 12px; margin-left: auto; }
        .league-group-header i { color: #a0a8c9; transition: transform 0.3s; font-size: 14px; }
        .league-group-header.collapsed i { transform: rotate(-90deg); }
        .league-matches { border-left: 2px solid #00ff9d22; padding-left: 12px; }
        .league-matches.collapsed { display: none; }
        
        .match-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #ffffff11; cursor: pointer; font-size: 13px; }
        .match-time-col { text-align: center; min-width: 50px; }
        .match-time-col .time { font-weight: bold; color: #00ff9d; }
        .match-time-col .countdown { font-size: 11px; color: #a0a8c9; }
        .team-col { flex: 1; display: flex; align-items: center; gap: 8px; }
        .team-col .names { font-weight: 500; }
        .team-col .names .vs { color: #ff9800; margin: 0 5px; }
        .odds-col { display: flex; gap: 5px; }
        .odd-mini { padding: 4px 8px; background: #0a0f1a; border-radius: 4px; font-size: 12px; text-align: center; min-width: 40px; }
        .odd-mini span { color: #00ff9d; font-weight: bold; }
        .bet-btn { padding: 6px 14px; background: #00ff9d; color: black; border: none; border-radius: 20px; font-size: 11px; font-weight: 600; cursor: pointer; }
        
        .bet-slip { position: fixed; bottom: 0; left: 0; right: 0; background: #111827; border-top: 2px solid #ff9800; padding: 15px; z-index: 1000; max-height: 200px; overflow-y: auto; }
        .slip-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .slip-title { color: #ff9800; font-weight: 600; }
        .slip-clear { color: #ff5252; font-size: 12px; cursor: pointer; }
        .slip-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #ffffff11; font-size: 12px; }
        .slip-remove { color: #ff5252; cursor: pointer; }
        .slip-total { display: flex; justify-content: space-between; padding: 10px 0; }
        .slip-total-odds { color: #ff9800; font-weight: bold; font-size: 16px; }
        .slip-place-btn { width: 100%; padding: 12px; background: #ff9800; color: black; border: none; border-radius: 10px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .slip-place-btn:disabled { opacity: 0.5; }
        
        .empty-state { text-align: center; padding: 50px; color: #a0a8c9; }
        .arabic { font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-top">
            <div class="header-left">
                <a href="betting-sport.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
                <h1 style="font-size:18px;"><i class="fas fa-futbol"></i> <span class="en">X Lodon Sports</span><span class="ar" style="display:none;">إكس لودون سبورت</span></h1>
            </div>
            <button class="lang-toggle" onclick="toggleLanguage()"><span class="en">🇸🇦 عربي</span><span class="ar" style="display:none;">🇬🇧 English</span></button>
        </div>
        <div class="tabs">
            <a href="betting-sport.html" class="tab"><span class="en">Home</span></a>
            <a href="live-matches.html" class="tab"><span class="en">Live</span></a>
            <a href="upcoming-matches.html" class="tab active"><span class="en">Upcoming</span></a>
            <a href="finished-matches.html" class="tab"><span class="en">Results</span></a>
            <a href="my-bets.html" class="tab"><span class="en">My Bets</span></a>
        </div>
    </div>
    
    <div class="container">
        <div class="selector-bar">
            <select id="league-filter" class="league-select" onchange="filterMatches()">
                <option value="all">All Leagues</option>
            </select>
        </div>
        
        <div class="day-tabs" id="day-tabs">
            <button class="day-tab active" data-days="0">Today</button>
            <button class="day-tab" data-days="1">Tomorrow</button>
            <button class="day-tab" data-days="2"></button>
            <button class="day-tab" data-days="3"></button>
            <button class="day-tab" data-days="4"></button>
            <button class="day-tab" data-days="5"></button>
            <button class="day-tab" data-days="6"></button>
        </div>
        
        <div id="matches-container"><div style="text-align:center; padding:30px;">Loading matches...</div></div>
    </div>
    
    <div class="bet-slip" id="bet-slip" style="display:none;">
        <div class="slip-header">
            <span class="slip-title"><i class="fas fa-layer-group"></i> Bet Slip (<span id="slip-count">0</span>)</span>
            <span class="slip-clear" onclick="clearSlip()"><i class="fas fa-trash"></i> Clear</span>
        </div>
        <div id="slip-items"></div>
        <div class="slip-total"><span>Total Odds:</span><span class="slip-total-odds" id="slip-total-odds">1.00</span></div>
        <button class="slip-place-btn" id="place-acc-btn" disabled onclick="placeAcc()">Add 2+ Selections</button>
    </div>

    <script src="../js/supabase-client.js"></script>
    <script src="../js/betting-engine.js"></script>
    <script>
        function toggleLanguage() {
            var isEn = document.querySelector('.en').style.display !== 'none';
            document.querySelectorAll('.en').forEach(el => el.style.display = isEn ? 'none' : '');
            document.querySelectorAll('.ar').forEach(el => el.style.display = isEn ? '' : 'none');
            document.documentElement.dir = isEn ? 'rtl' : 'ltr';
            localStorage.setItem('lang', isEn ? 'ar' : 'en');
        }
        if(localStorage.getItem('lang')==='ar'){setTimeout(toggleLanguage,10);}
        
        const SUPABASE_URL = 'https://jnazybaeajyynpyoszmy.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_WWHC2XIWlnDR9DsDpg52Vw_UIn2KopQ';
        const supaClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        let allMatches=[], currentDays=0, countdownInterval, accSlip=[];
        
        async function init(){
            await loadLeaguesFilter();
            setupDayTabs();
            await loadAllMatches();
        }
        
        async function loadLeaguesFilter(){
            try {
                const r = await fetch('https://millioner.onrender.com/api/leagues');
                const d = await r.json();
                if(d.success && d.data){
                    const select=document.getElementById('league-filter');
                    d.data.sort((a,b)=>(a.name||'').localeCompare(b.name||''));
                    d.data.forEach(l => { if(l.name){ const o=document.createElement('option'); o.value=l.id; o.textContent=l.name; select.appendChild(o); } });
                }
            } catch(e){}
        }
        
        function setupDayTabs(){
            const tabs=document.querySelectorAll('.day-tab');
            const today=new Date();
            tabs.forEach((tab,i)=>{
                const date=new Date(today); date.setDate(today.getDate()+i);
                tab.textContent = i===0 ? 'Today' : i===1 ? 'Tomorrow' : date.toLocaleDateString('en-US',{weekday:'short', month:'short', day:'numeric'});
                tab.addEventListener('click', function(){
                    document.querySelectorAll('.day-tab').forEach(t=>t.classList.remove('active'));
                    this.classList.add('active'); currentDays=parseInt(this.dataset.days); filterMatches();
                });
            });
        }
        
        async function loadAllMatches(){
            const now = new Date();
            const nextWeek = new Date(); nextWeek.setDate(now.getDate()+7);
            
            const { data } = await supaClient.from('sports_matches').select('*').eq('status','upcoming').gte('start_time',now.toISOString()).lte('start_time',nextWeek.toISOString()).order('start_time');
            allMatches = data || [];
            filterMatches();
        }
        
        function filterMatches(){
            const container=document.getElementById('matches-container');
            const leagueFilter=document.getElementById('league-filter').value;
            
            // Filter by day
            const targetDate = new Date(); targetDate.setDate(targetDate.getDate()+currentDays);
            const startDay = new Date(targetDate); startDay.setHours(0,0,0,0);
            const endDay = new Date(targetDate); endDay.setHours(23,59,59,999);
            
            let filtered = allMatches.filter(m => {
                const mt = new Date(m.start_time);
                return mt >= startDay && mt <= endDay;
            });
            
            // Filter by league
            if(leagueFilter !== 'all') filtered = filtered.filter(m => m.league_id == leagueFilter);
            
            if(filtered.length === 0){
                container.innerHTML = '<div class="empty-state"><i class="fas fa-calendar"></i><p>No matches found</p></div>';
                return;
            }
            
            // Group by league
            const grouped = {};
            filtered.forEach(m => {
                const league = m.league_name || 'Other';
                if(!grouped[league]) grouped[league] = [];
                grouped[league].push(m);
            });
            
            container.innerHTML = '';
            Object.keys(grouped).sort().forEach(league => {
                const group = document.createElement('div'); group.className = 'league-group';
                group.innerHTML = `
                    <div class="league-group-header" onclick="toggleLeague(this)">
                        <span class="name">${league}</span><span class="count">${grouped[league].length} matches</span><i class="fas fa-chevron-down"></i>
                    </div>
                    <div class="league-matches">${grouped[league].map(m => createMatchRow(m)).join('')}</div>`;
                container.appendChild(group);
            });
            
            startCountdowns(filtered);
        }
        
        function createMatchRow(m){
            const time = new Date(m.start_time);
            const homeName = m.home_team?.name || 'Home';
            const awayName = m.away_team?.name || 'Away';
            const odds = m.odds || {};
            
            return `
            <div class="match-row">
                <div class="match-time-col">
                    <div class="time">${time.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div>
                    <div class="countdown" id="cd-${m.fixture_id}">--:--:--</div>
                </div>
                <div class="team-col"><span class="names">${homeName} <span class="vs">vs</span> ${awayName}</span></div>
                <div class="odds-col">
                    <div class="odd-mini">1 <span>${odds.home||'2.00'}</span></div>
                    <div class="odd-mini">X <span>${odds.draw||'3.50'}</span></div>
                    <div class="odd-mini">2 <span>${odds.away||'3.80'}</span></div>
                </div>
                <button class="bet-btn" onclick="event.stopPropagation(); goToMatch(${m.fixture_id})">Bet</button>
                <button class="bet-btn" style="background:#ff9800; color:black;" onclick="event.stopPropagation(); addToSlip(${m.fixture_id},'${homeName}','${awayName}',${odds.home||2.00})">+Slip</button>
            </div>`;
        }
        
        function addToSlip(fixtureId, homeName, awayName, odds){
            if(accSlip.some(s => s.fixtureId === fixtureId)){ alert('Already in slip'); return; }
            accSlip.push({ fixtureId, matchName: `${homeName} vs ${awayName}`, betType:'home', betTypeName:'Home', odds });
            updateSlipUI();
        }
        
        function updateSlipUI(){
            const slip=document.getElementById('bet-slip');
            if(accSlip.length===0){ slip.style.display='none'; return; }
            slip.style.display='block';
            document.getElementById('slip-count').textContent = accSlip.length;
            
            let items='', totalOdds=1;
            accSlip.forEach((s,i)=>{ totalOdds*=s.odds; items+=`<div class="slip-item"><span>${s.matchName} @${s.odds}</span><span class="slip-remove" onclick="removeFromSlip(${i})"><i class="fas fa-times"></i></span></div>`; });
            document.getElementById('slip-items').innerHTML = items;
            document.getElementById('slip-total-odds').textContent = totalOdds.toFixed(2);
            document.getElementById('place-acc-btn').disabled = accSlip.length < 2;
            document.getElementById('place-acc-btn').textContent = accSlip.length < 2 ? 'Add 2+ Selections' : 'Place Accumulator';
        }
        
        function removeFromSlip(index){ accSlip.splice(index,1); updateSlipUI(); }
        function clearSlip(){ accSlip=[]; updateSlipUI(); }
        
        async function placeAcc(){
            if(accSlip.length<2) return;
            const amount = parseFloat(prompt('Enter stake amount ($):','10'));
            if(!amount || amount<1) return;
            try {
                const r = await placeAccumulatorBet(accSlip, amount);
                if(r.success){ alert('Accumulator placed!'); clearSlip(); location.href='my-bets.html'; }
                else alert(r.error);
            } catch(e){ alert('Error'); }
        }
        
        function goToMatch(fixtureId){ location.href = `match-details.html?id=${fixtureId}`; }
        
        function startCountdowns(matches){
            if(countdownInterval) clearInterval(countdownInterval);
            countdownInterval = setInterval(() => {
                matches.forEach(m => {
                    const el = document.getElementById('cd-'+m.fixture_id);
                    if(el){
                        const diff = new Date(m.start_time) - new Date();
                        if(diff <= 0) el.textContent = 'Starting';
                        else {
                            const h=Math.floor(diff/3600000), mn=Math.floor((diff%3600000)/60000), s=Math.floor((diff%60000)/1000);
                            el.textContent = `${h.toString().padStart(2,'0')}:${mn.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
                        }
                    }
                });
            }, 1000);
        }
        
        function toggleLeague(el){ el.classList.toggle('collapsed'); el.nextElementSibling.classList.toggle('collapsed'); }
        
        window.toggleLeague = toggleLeague;
        window.clearSlip = clearSlip;
        window.removeFromSlip = removeFromSlip;
        window.placeAcc = placeAcc;
        
        init();
        window.addEventListener('beforeunload',()=>{ if(countdownInterval) clearInterval(countdownInterval); });
    </script>
</body>
</html>
