<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Upcoming - X Lodon</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="../css/sports-betting.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0f1a; color: white; font-family: 'Segoe UI', sans-serif; min-height: 100vh; }
        .header { background: #111827; padding: 12px 15px; border-bottom: 2px solid #00ff9d; position: sticky; top: 0; z-index: 100; }
        .header-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .back-btn { color: #00ff9d; text-decoration: none; font-size: 20px; }
        .tabs { display: flex; gap: 5px; overflow-x: auto; white-space: nowrap; padding-bottom: 3px; }
        .tab { padding: 8px 12px; background: #1a2332; border-radius: 20px; color: white; text-decoration: none; font-size: 12px; }
        .tab.active { background: #00ff9d; color: black; }
        .container { max-width: 1200px; margin: 0 auto; padding: 15px; }
        .filter-select { width: 100%; padding: 15px; background: #111827; border: 1px solid #ffffff22; border-radius: 10px; color: white; font-size: 14px; margin-bottom: 20px; }
        .date-header { color: #00ff9d; font-size: 16px; margin: 20px 0 15px; padding-bottom: 8px; border-bottom: 1px solid #00ff9d33; display: flex; justify-content: space-between; }
        .match-card { background: #111827; border-radius: 12px; padding: 15px; margin-bottom: 12px; border-left: 4px solid #00ff9d; cursor: pointer; }
        .match-league { color: #a0a8c9; font-size: 13px; margin-bottom: 8px; }
        .match-teams { display: flex; align-items: center; justify-content: space-around; margin: 10px 0; }
        .team { text-align: center; flex: 1; font-weight: 600; }
        .vs { color: #ff9800; font-weight: bold; }
        .match-time { color: #a0a8c9; font-size: 12px; margin-top: 8px; }
        .odds { display: flex; gap: 8px; margin-top: 12px; }
        .odd { flex: 1; text-align: center; padding: 8px; background: #1a2332; border-radius: 6px; }
        .odd-value { color: #00ff9d; font-weight: bold; }
        .empty-state { text-align: center; padding: 50px; color: #a0a8c9; }
        .debug-bar { background: #1a2332; padding: 8px 15px; border-radius: 8px; margin-bottom: 15px; font-size: 12px; color: #00ff9d; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-top">
            <a href="betting-sport.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
            <h1 style="font-size:18px;"><i class="fas fa-futbol"></i> X Lodon Sports</h1>
        </div>
        <div class="tabs">
            <a href="betting-sport.html" class="tab">Home</a>
            <a href="live-matches.html" class="tab">Live</a>
            <a href="upcoming-matches.html" class="tab active">Upcoming <span id="upcoming-count">0</span></a>
            <a href="finished-matches.html" class="tab">Results</a>
            <a href="my-bets.html" class="tab">My Bets</a>
        </div>
    </div>
    
    <div class="container">
        <div class="debug-bar" id="debug-bar">
            <i class="fas fa-database"></i> Loading matches...
        </div>
        <select id="league-filter" class="filter-select">
            <option value="all">All Leagues</option>
        </select>
        
        <div id="matches-container"></div>
        <div id="empty-state" class="empty-state" style="display:none;">
            <i class="fas fa-calendar" style="font-size:48px; opacity:0.3;"></i>
            <p>No upcoming matches in next 7 days</p>
            <button onclick="window.syncNow()" style="margin-top:15px; padding:10px 20px; background:#00ff9d; color:black; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">
                <i class="fas fa-sync-alt"></i> Sync Now
            </button>
        </div>
    </div>

    <script src="../js/sports-api.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), db = firebase.firestore();
        let allMatches = [], leagues = new Set(), unsubscribe = null;
        
        auth.onAuthStateChanged(u => { if (!u) location.href = '../login.html'; else loadMatches(); });
        
        function loadMatches() {
            const container = document.getElementById('matches-container');
            const empty = document.getElementById('empty-state');
            const countEl = document.getElementById('upcoming-count');
            const debugBar = document.getElementById('debug-bar');
            const now = new Date();
            const nextWeek = new Date(now); nextWeek.setDate(now.getDate() + 7);
            
            unsubscribe = db.collection('sports_matches')
                .where('status', '==', 'upcoming')
                .where('startTime', '>=', now)
                .where('startTime', '<=', nextWeek)
                .orderBy('startTime', 'asc')
                .onSnapshot(snap => {
                    allMatches = []; leagues.clear();
                    snap.forEach(d => { const m = d.data(); allMatches.push(m); if (m.leagueName) leagues.add(m.leagueName); });
                    
                    countEl.textContent = allMatches.length;
                    debugBar.innerHTML = `<i class="fas fa-check-circle"></i> Found ${allMatches.length} upcoming matches`;
                    
                    if (allMatches.length === 0) { container.style.display = 'none'; empty.style.display = 'block'; }
                    else { container.style.display = 'block'; empty.style.display = 'none'; populateFilter(); displayMatches(allMatches); }
                }, e => { console.error(e); debugBar.innerHTML = `<i class="fas fa-exclamation-triangle"></i> Error: ${e.message}`; });
        }
        
        function populateFilter() {
            const select = document.getElementById('league-filter');
            select.innerHTML = '<option value="all">All Leagues</option>';
            Array.from(leagues).sort().forEach(l => { const o = document.createElement('option'); o.value = l; o.textContent = l; select.appendChild(o); });
            select.onchange = e => displayMatches(e.target.value === 'all' ? allMatches : allMatches.filter(m => m.leagueName === e.target.value));
        }
        
        function displayMatches(matches) {
            const container = document.getElementById('matches-container');
            const grouped = {};
            matches.forEach(m => { const k = m.startTime.toDate().toDateString(); if (!grouped[k]) grouped[k] = []; grouped[k].push(m); });
            container.innerHTML = '';
            Object.keys(grouped).sort().forEach(k => {
                const d = new Date(k); const today = new Date(); today.setHours(0,0,0,0);
                const tomorrow = new Date(today); tomorrow.setDate(today.getDate()+1);
                let label = d.toLocaleDateString('en-US', {weekday:'long', month:'short', day:'numeric'});
                if (d.toDateString() === today.toDateString()) label = '📅 TODAY - ' + label;
                else if (d.toDateString() === tomorrow.toDateString()) label = '📅 TOMORROW - ' + label;
                container.innerHTML += `<div class="date-header"><span>${label}</span><span>${grouped[k].length} matches</span></div>`;
                grouped[k].forEach(m => container.appendChild(createCard(m)));
            });
        }
        
        function createCard(m) {
            const card = document.createElement('div'); card.className = 'match-card';
            card.onclick = () => location.href = `match-details.html?id=${m.fixtureId}`;
            const time = m.startTime.toDate();
            card.innerHTML = `
                <div class="match-league"><i class="fas fa-trophy" style="color:#ff9800;"></i> ${m.leagueName||'League'}</div>
                <div class="match-teams"><span class="team">${m.homeTeam?.name||'Home'}</span><span class="vs">VS</span><span class="team">${m.awayTeam?.name||'Away'}</span></div>
                <div class="match-time"><i class="far fa-clock"></i> ${time.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})} • ${time.toLocaleDateString()}</div>
                <div class="odds"><div class="odd">H: <span class="odd-value">${m.odds?.home||'2.00'}</span></div><div class="odd">D: <span class="odd-value">${m.odds?.draw||'3.50'}</span></div><div class="odd">A: <span class="odd-value">${m.odds?.away||'3.80'}</span></div></div>
            `;
            return card;
        }
        
        window.addEventListener('beforeunload', () => { if (unsubscribe) unsubscribe(); });
    </script>
</body>
</html>
