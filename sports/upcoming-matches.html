<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Upcoming - X Lodon | المباريات القادمة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0f1a;
            color: #ffffff;
            font-family: 'Inter', 'Tajawal', sans-serif;
            min-height: 100vh;
        }

        .header {
            background: #0f1219;
            padding: 12px 16px;
            border-bottom: 2px solid #00ff9d;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn {
            color: #00ff9d;
            text-decoration: none;
            font-size: 20px;
        }

        .logo-title {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(135deg, #00ff9d, #00b8ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .lang-toggle {
            background: rgba(0, 255, 157, 0.1);
            border: 1px solid #00ff9d;
            color: #00ff9d;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .lang-toggle:hover {
            background: #00ff9d;
            color: #0a0f1a;
        }

        .tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .tab {
            padding: 8px 16px;
            background: #1a1f2e;
            border-radius: 30px;
            color: #a0a8c9;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .tab.active {
            background: #00ff9d;
            color: #0a0f1a;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
        }

        .date-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .date-tab {
            flex: 1;
            padding: 12px;
            background: #111827;
            border: 1px solid #2a3441;
            border-radius: 14px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .date-tab.active {
            background: #00ff9d;
            color: #0a0f1a;
            border-color: #00ff9d;
        }

        .calendar-input {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }

        .filter-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            align-items: center;
        }

        .league-select {
            flex: 1;
            padding: 12px 16px;
            background: #111827;
            border: 1px solid #2a3441;
            border-radius: 14px;
            color: white;
            font-size: 14px;
            cursor: pointer;
        }

        .refresh-btn {
            background: #1a2332;
            border: 1px solid #2a3441;
            color: #00ff9d;
            padding: 12px 16px;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .refresh-btn:hover {
            background: #00ff9d;
            color: #0a0f1a;
        }

        .league-group {
            margin-bottom: 24px;
            background: #0f1219;
            border-radius: 20px;
            overflow: hidden;
        }

        .league-header {
            background: #111827;
            padding: 14px 18px;
            color: #00ff9d;
            font-size: 16px;
            font-weight: 700;
            border-bottom: 1px solid #00ff9d22;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .league-header i {
            transition: transform 0.3s ease;
        }

        .league-header.collapsed i {
            transform: rotate(-90deg);
        }

        .league-matches {
            transition: max-height 0.3s ease;
            overflow: hidden;
        }

        .league-matches.collapsed {
            display: none;
        }

        .match-card {
            background: #111827;
            margin: 12px;
            border-radius: 20px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid #1f2937;
        }

        .match-card:hover {
            transform: translateY(-2px);
            border-color: #00ff9d;
            box-shadow: 0 4px 12px rgba(0, 255, 157, 0.15);
        }

        .match-teams {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .team {
            text-align: center;
            flex: 1;
        }

        .team-logo {
            width: 60px;
            height: 60px;
            margin: 0 auto 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a2332;
            border-radius: 50%;
            padding: 8px;
        }

        .team-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;
        }

        .team-name {
            font-weight: 600;
            font-size: 13px;
            color: #e5e7eb;
        }

        .vs {
            color: #ff9800;
            font-weight: 800;
            font-size: 14px;
            background: #1a2332;
            padding: 6px 12px;
            border-radius: 30px;
        }

        .countdown-box {
            background: #0a0f1a;
            border-radius: 16px;
            padding: 12px;
            margin-top: 14px;
            text-align: center;
            border: 1px solid #1f2937;
        }

        .countdown-label {
            color: #9ca3af;
            font-size: 11px;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .countdown-value {
            color: #00ff9d;
            font-size: 24px;
            font-weight: 800;
            font-family: monospace;
            letter-spacing: 2px;
        }

        .match-time {
            color: #9ca3af;
            font-size: 12px;
            margin-top: 6px;
        }

        .odds {
            display: flex;
            gap: 10px;
            margin-top: 14px;
        }

        .odd {
            flex: 1;
            text-align: center;
            padding: 8px;
            background: #0a0f1a;
            border-radius: 12px;
            font-size: 12px;
            color: #9ca3af;
        }

        .odd-value {
            color: #00ff9d;
            font-weight: 800;
            font-size: 16px;
            margin-left: 6px;
        }

        .empty-state, .loading {
            text-align: center;
            padding: 60px 20px;
            color: #9ca3af;
        }

        .stats-badge {
            background: #00ff9d20;
            color: #00ff9d;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            margin-left: 10px;
        }

        [dir="rtl"] .back-btn i {
            transform: rotate(180deg);
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-top">
            <div class="header-left">
                <a href="betting-sport.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
                <h1 class="logo-title"><i class="fas fa-futbol"></i> <span class="en">X Lodon Sports</span><span class="ar" style="display:none;">إكس لودون سبورت</span></h1>
            </div>
            <button class="lang-toggle" onclick="toggleLanguage()"><span class="en">🇸🇦 عربي</span><span class="ar" style="display:none;">🇬🇧 English</span></button>
        </div>
        <div class="tabs">
            <a href="betting-sport.html" class="tab"><span class="en">Home</span><span class="ar" style="display:none;">الرئيسية</span></a>
            <a href="live-matches.html" class="tab"><span class="en">Live</span><span class="ar" style="display:none;">مباشر</span></a>
            <a href="upcoming-matches.html" class="tab active"><span class="en">Upcoming</span><span class="ar" style="display:none;">قادم</span></a>
            <a href="finished-matches.html" class="tab"><span class="en">Results</span><span class="ar" style="display:none;">النتائج</span></a>
            <a href="my-bets.html" class="tab"><span class="en">My Bets</span><span class="ar" style="display:none;">رهاناتي</span></a>
        </div>
    </div>
    
    <div class="container">
        <div class="date-tabs">
            <button class="date-tab active" data-date="today"><span class="en">📅 Today</span><span class="ar" style="display:none;">📅 اليوم</span></button>
            <button class="date-tab" data-date="tomorrow"><span class="en">⏩ Tomorrow</span><span class="ar" style="display:none;">⏩ الغد</span></button>
            <button class="date-tab" id="pickDateBtn"><i class="fas fa-calendar-alt"></i> <span class="en">Pick Date</span><span class="ar" style="display:none;">اختر تاريخ</span></button>
            <input type="date" id="calendar-input" class="calendar-input">
        </div>
        
        <div class="filter-bar">
            <select id="league-select" class="league-select">
                <option value="all"><span class="en">🏆 All Leagues</span><span class="ar" style="display:none;">🏆 جميع الدوريات</span></option>
            </select>
            <button class="refresh-btn" onclick="refreshMatches()"><i class="fas fa-sync-alt"></i></button>
        </div>
        
        <div id="matches-container"><div class="loading"><i class="fas fa-spinner fa-pulse"></i> <span class="en">Loading matches...</span><span class="ar" style="display:none;">جاري التحميل...</span></div></div>
        <div id="empty-state" class="empty-state" style="display:none;">
            <i class="fas fa-calendar-times" style="font-size: 48px; margin-bottom: 16px; opacity: 0.5;"></i>
            <div><span class="en">No matches found for this date</span><span class="ar" style="display:none;">لا توجد مباريات في هذا التاريخ</span></div>
        </div>
    </div>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        
        // Global State
        let currentView = 'today';
        let selectedDate = null;
        let allMatches = [];
        let countdownInterval = null;
        let currentFilterLeague = 'all';
        
        // Language Toggle
        function toggleLanguage() {
            const isEn = document.querySelector('.en').style.display !== 'none';
            document.querySelectorAll('.en').forEach(el => el.style.display = isEn ? 'none' : '');
            document.querySelectorAll('.ar').forEach(el => el.style.display = isEn ? '' : 'none');
            document.documentElement.dir = isEn ? 'rtl' : 'ltr';
            localStorage.setItem('lang', isEn ? 'ar' : 'en');
        }
        
        if (localStorage.getItem('lang') === 'ar') toggleLanguage();
        
        // Auth Guard
        auth.onAuthStateChanged(user => {
            if (!user) {
                location.href = '../login.html';
            } else {
                initApp();
            }
        });
        
        async function initApp() {
            await loadLeagues();
            setupDateButtons();
            await loadMatches();
            setInterval(() => {
                if (typeof forceUpdateStatus === 'function') forceUpdateStatus();
            }, 30000);
        }
        
        // Load Leagues from API
        async function loadLeagues() {
            const select = document.getElementById('league-select');
            try {
                const response = await fetch('https://millioner.onrender.com/api/leagues');
                const data = await response.json();
                if (data.success && Array.isArray(data.data)) {
                    data.data.forEach(league => {
                        if (league.league && league.league.name) {
                            const option = document.createElement('option');
                            option.value = league.league.id;
                            option.textContent = league.league.name;
                            if (league.league.logo) {
                                option.setAttribute('data-logo', league.league.logo);
                            }
                            select.appendChild(option);
                        }
                    });
                }
            } catch (error) {
                console.warn('League API error:', error);
            }
            select.onchange = () => {
                currentFilterLeague = select.value;
                renderMatches();
            };
        }
        
        // Setup Date Buttons
        function setupDateButtons() {
            const todayBtn = document.querySelector('[data-date="today"]');
            const tomorrowBtn = document.querySelector('[data-date="tomorrow"]');
            const pickDateBtn = document.getElementById('pickDateBtn');
            const calendarInput = document.getElementById('calendar-input');
            
            todayBtn.addEventListener('click', () => {
                setActiveDateButton(todayBtn);
                currentView = 'today';
                selectedDate = null;
                calendarInput.value = '';
                loadMatches();
            });
            
            tomorrowBtn.addEventListener('click', () => {
                setActiveDateButton(tomorrowBtn);
                currentView = 'tomorrow';
                selectedDate = null;
                calendarInput.value = '';
                loadMatches();
            });
            
            pickDateBtn.addEventListener('click', () => {
                calendarInput.click();
            });
            
            calendarInput.addEventListener('change', (e) => {
                if (e.target.value) {
                    setActiveDateButton(null);
                    currentView = 'custom';
                    selectedDate = new Date(e.target.value);
                    loadMatches();
                }
            });
        }
        
        function setActiveDateButton(activeBtn) {
            document.querySelectorAll('.date-tab').forEach(btn => {
                btn.classList.remove('active');
            });
            if (activeBtn) activeBtn.classList.add('active');
        }
        
        function refreshMatches() {
            loadMatches();
        }
        
        // Get Date Range (Fixed for all timezones)
        function getDateRange() {
            const now = new Date();
            let startDate, endDate;
            
            if (currentView === 'today') {
                startDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0);
                endDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59);
            } 
            else if (currentView === 'tomorrow') {
                const tomorrow = new Date(now);
                tomorrow.setDate(now.getDate() + 1);
                startDate = new Date(tomorrow.getFullYear(), tomorrow.getMonth(), tomorrow.getDate(), 0, 0, 0);
                endDate = new Date(tomorrow.getFullYear(), tomorrow.getMonth(), tomorrow.getDate(), 23, 59, 59);
            } 
            else if (currentView === 'custom' && selectedDate) {
                startDate = new Date(selectedDate.getFullYear(), selectedDate.getMonth(), selectedDate.getDate(), 0, 0, 0);
                endDate = new Date(selectedDate.getFullYear(), selectedDate.getMonth(), selectedDate.getDate(), 23, 59, 59);
            }
            
            return { startDate, endDate };
        }
        
        // Load Matches from Firestore
        async function loadMatches() {
            const container = document.getElementById('matches-container');
            const emptyDiv = document.getElementById('empty-state');
            
            container.style.display = 'block';
            container.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-pulse"></i> Loading matches...</div>';
            emptyDiv.style.display = 'none';
            
            const range = getDateRange();
            if (!range) return;
            
            const { startDate, endDate } = range;
            
            try {
                // Create Firestore timestamps
                const startTimestamp = firebase.firestore.Timestamp.fromDate(startDate);
                const endTimestamp = firebase.firestore.Timestamp.fromDate(endDate);
                
                console.log(`Querying matches from ${startDate.toLocaleString()} to ${endDate.toLocaleString()}`);
                
                // Build query - get ALL matches in date range regardless of status
                // Then filter for upcoming only
                let query = db.collection('sports_matches')
                    .where('startTime', '>=', startTimestamp)
                    .where('startTime', '<=', endTimestamp);
                
                const snapshot = await query.orderBy('startTime', 'asc').get();
                
                allMatches = [];
                snapshot.forEach(doc => {
                    const match = doc.data();
                    // Filter for upcoming matches (status === 'upcoming' or startTime > now)
                    const matchTime = match.startTime?.toDate();
                    const isUpcoming = match.status === 'upcoming' || (matchTime && matchTime > new Date());
                    
                    if (match.homeTeam && match.awayTeam && match.startTime && isUpcoming) {
                        match.id = doc.id;
                        allMatches.push(match);
                    }
                });
                
                console.log(`Found ${allMatches.length} upcoming matches for ${currentView}`);
                
                // Apply league filter
                if (currentFilterLeague !== 'all') {
                    const filtered = allMatches.filter(m => m.leagueId == currentFilterLeague);
                    if (filtered.length > 0) {
                        allMatches = filtered;
                    }
                }
                
                if (allMatches.length === 0) {
                    container.style.display = 'none';
                    emptyDiv.style.display = 'block';
                    if (countdownInterval) clearInterval(countdownInterval);
                    return;
                }
                
                renderMatches();
                startCountdowns();
                
            } catch (error) {
                console.error('Firestore error:', error);
                container.innerHTML = `<div class="empty-state">Error: ${error.message}</div>`;
            }
        }
        
        function renderMatches() {
            const container = document.getElementById('matches-container');
            
            // Group by league
            const grouped = {};
            allMatches.forEach(match => {
                const leagueName = match.leagueName || 'Other Leagues';
                if (!grouped[leagueName]) grouped[leagueName] = [];
                grouped[leagueName].push(match);
            });
            
            container.innerHTML = '';
            
            // Sort leagues alphabetically
            Object.keys(grouped).sort().forEach(league => {
                const leagueDiv = document.createElement('div');
                leagueDiv.className = 'league-group';
                const leagueKey = league.replace(/[^a-zA-Z0-9]/g, '_');
                leagueDiv.innerHTML = `
                    <div class="league-header" onclick="toggleLeague(this)">
                        <span><i class="fas fa-trophy"></i> ${league} <span class="stats-badge">${grouped[league].length} matches</span></span>
                        <i class="fas fa-chevron-down"></i>
                    </div>
                    <div class="league-matches" id="league-${leagueKey}"></div>
                `;
                container.appendChild(leagueDiv);
                
                const matchesContainer = leagueDiv.querySelector('.league-matches');
                grouped[league].forEach(match => {
                    matchesContainer.appendChild(createMatchCard(match));
                });
            });
        }
        
        function createMatchCard(match) {
            const card = document.createElement('div');
            card.className = 'match-card';
            card.onclick = () => {
                window.location.href = `match-details.html?id=${match.id}`;
            };
            
            const matchTime = match.startTime.toDate();
            const formattedTime = matchTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const formattedDate = matchTime.toLocaleDateString([], { month: 'short', day: 'numeric' });
            const countdownId = `cd_${match.id}`;
            
            // Team logos with fallback
            const homeLogo = match.homeTeam?.logo || `https://ui-avatars.com/api/?background=1a2332&color=00ff9d&name=${encodeURIComponent(match.homeTeam?.name?.substring(0,2) || 'T1')}`;
            const awayLogo = match.awayTeam?.logo || `https://ui-avatars.com/api/?background=1a2332&color=00ff9d&name=${encodeURIComponent(match.awayTeam?.name?.substring(0,2) || 'T2')}`;
            
            card.innerHTML = `
                <div class="match-teams">
                    <div class="team">
                        <div class="team-logo">
                            <img src="${homeLogo}" alt="${match.homeTeam.name}" onerror="this.src='https://ui-avatars.com/api/?background=1a2332&color=00ff9d&name=${match.homeTeam.name.substring(0,2).toUpperCase()}'">
                        </div>
                        <div class="team-name">${match.homeTeam.name}</div>
                    </div>
                    <div class="vs">VS</div>
                    <div class="team">
                        <div class="team-logo">
                            <img src="${awayLogo}" alt="${match.awayTeam.name}" onerror="this.src='https://ui-avatars.com/api/?background=1a2332&color=00ff9d&name=${match.awayTeam.name.substring(0,2).toUpperCase()}'">
                        </div>
                        <div class="team-name">${match.awayTeam.name}</div>
                    </div>
                </div>
                <div class="countdown-box">
                    <div class="countdown-label"><i class="far fa-clock"></i> STARTS IN</div>
                    <div class="countdown-value" id="${countdownId}">--:--:--</div>
                    <div class="match-time"><i class="far fa-calendar-alt"></i> ${formattedDate} • ${formattedTime}</div>
                </div>
                <div class="odds">
                    <div class="odd">1 <span class="odd-value">${match.odds?.home || '2.00'}</span></div>
                    <div class="odd">X <span class="odd-value">${match.odds?.draw || '3.40'}</span></div>
                    <div class="odd">2 <span class="odd-value">${match.odds?.away || '3.80'}</span></div>
                </div>
            `;
            
            card.setAttribute('data-match-time', matchTime.getTime());
            card.setAttribute('data-countdown-id', countdownId);
            
            return card;
        }
        
        function startCountdowns() {
            if (countdownInterval) clearInterval(countdownInterval);
            
            function updateCountdowns() {
                const now = new Date().getTime();
                let needRefresh = false;
                
                allMatches.forEach(match => {
                    const matchTime = match.startTime.toDate().getTime();
                    const diff = matchTime - now;
                    const countdownSpan = document.getElementById(`cd_${match.id}`);
                    
                    if (countdownSpan) {
                        if (diff <= 0) {
                            countdownSpan.textContent = '00:00:00';
                            needRefresh = true;
                        } else {
                            const hours = Math.floor(diff / 3600000);
                            const minutes = Math.floor((diff % 3600000) / 60000);
                            const seconds = Math.floor((diff % 60000) / 1000);
                            countdownSpan.textContent = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                        }
                    }
                });
                
                if (needRefresh) {
                    setTimeout(() => loadMatches(), 3000);
                }
            }
            
            updateCountdowns();
            countdownInterval = setInterval(updateCountdowns, 1000);
        }
        
        // Global functions
        window.toggleLeague = function(element) {
            element.classList.toggle('collapsed');
            const matchesDiv = element.nextElementSibling;
            if (matchesDiv) {
                matchesDiv.classList.toggle('collapsed');
            }
        };
        
        window.refreshMatches = refreshMatches;
        window.toggleLanguage = toggleLanguage;
        
        window.addEventListener('beforeunload', () => {
            if (countdownInterval) clearInterval(countdownInterval);
        });
    </script>
</body>
</html>
