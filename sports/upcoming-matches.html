<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Upcoming - X Lodon | المباريات القادمة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0f1a; color: white; font-family: 'Segoe UI', 'Tajawal', sans-serif; min-height: 100vh; }
        
        .header { background: #111827; padding: 12px 15px; border-bottom: 2px solid #00ff9d; position: sticky; top: 0; z-index: 100; }
        .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; flex-wrap: wrap; gap: 10px; }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .back-btn { color: #00ff9d; text-decoration: none; font-size: 20px; }
        .lang-toggle { background: #1a2332; border: 1px solid #00ff9d; color: #00ff9d; padding: 5px 12px; border-radius: 20px; cursor: pointer; }
        .tabs { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 3px; }
        .tab { padding: 8px 12px; background: #1a2332; border-radius: 20px; color: white; text-decoration: none; font-size: 12px; }
        .tab.active { background: #00ff9d; color: black; }
        .container { max-width: 1400px; margin: 0 auto; padding: 15px; padding-bottom: 20px; }
        .balance-bar { background: #111827; padding: 10px 15px; border-radius: 12px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; border: 1px solid #00ff9d33; }
        .balance-amount { color: #00ff9d; font-weight: bold; font-size: 18px; }
        .selector-bar { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .league-select, .search-input, .date-filter { padding: 12px; background: #111827; border: 1px solid #ffffff22; border-radius: 12px; color: white; font-size: 13px; }
        .league-select { flex: 2; min-width: 180px; }
        .search-input { flex: 3; min-width: 200px; }
        .date-filter { flex: 1; min-width: 140px; }
        .debug-bar { background: #1a2332; padding: 8px 15px; border-radius: 8px; margin-bottom: 10px; font-size: 11px; color: #00ff9d; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .refresh-btn { background: #00ff9d; color: black; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 11px; }
        
        /* League filter banner */
        .league-filter-banner {
            background: linear-gradient(135deg, #00ff9d11, #00ff9d05);
            border: 1px solid #00ff9d33;
            border-radius: 12px;
            padding: 12px 15px;
            margin-bottom: 15px;
            display: none;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }
        .league-filter-banner.active { display: flex; }
        .league-filter-banner .league-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .league-filter-banner .league-logo {
            width: 40px;
            height: 40px;
            object-fit: contain;
            background: #1a2332;
            border-radius: 50%;
            padding: 5px;
        }
        .league-filter-banner .league-name {
            font-size: 16px;
            font-weight: 700;
            color: #ff9800;
        }
        .league-filter-banner .match-count {
            font-size: 12px;
            color: #a0a8c9;
        }
        .clear-filter-btn {
            background: #ff5252;
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .clear-filter-btn:hover { background: #ff3333; transform: scale(1.02); }
        
        /* Match Cards */
        .date-section { margin-bottom: 20px; }
        .date-header { background: linear-gradient(135deg, #00ff9d11, #00ff9d05); border-left: 3px solid #00ff9d; padding: 12px 15px; border-radius: 8px; margin-bottom: 10px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .date-title { font-weight: bold; font-size: 16px; color: #00ff9d; }
        .match-count { font-size: 12px; color: #a0a8c9; }
        .date-matches.collapsed { display: none; }
        .league-group { margin-bottom: 15px; background: #0f1420; border-radius: 12px; overflow: hidden; }
        .league-group-header { background: #1a2332; padding: 10px 15px; cursor: pointer; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; border-bottom: 1px solid #ffffff0a; }
        .league-logo { width: 24px; height: 24px; object-fit: contain; }
        .league-name { font-weight: 600; font-size: 14px; color: #ff9800; }
        .league-match-count { font-size: 11px; color: #a0a8c9; margin-left: auto; }
        .league-matches.collapsed { display: none; }
        
        .match-row { display: flex; align-items: center; gap: 10px; padding: 12px 15px; border-bottom: 1px solid #ffffff0a; transition: background 0.2s; flex-wrap: wrap; }
        .match-row:hover { background: #ffffff08; }
        .match-time-col { text-align: center; min-width: 90px; }
        .match-time { font-weight: bold; color: #00ff9d; font-size: 13px; }
        .match-countdown { font-size: 11px; font-weight: bold; font-family: monospace; background: #0a0f1a; padding: 3px 6px; border-radius: 6px; display: inline-block; margin-top: 4px; }
        .team-col { flex: 2; display: flex; align-items: center; gap: 8px; min-width: 220px; }
        .team-logo { width: 32px; height: 32px; object-fit: contain; border-radius: 50%; background: #1a2332; padding: 3px; }
        .team-name { font-weight: 500; font-size: 13px; }
        .vs { color: #ff9800; margin: 0 5px; font-size: 11px; font-weight: bold; }
        .odds-col { display: flex; gap: 6px; }
        .odd-mini { padding: 6px 12px; background: #0a0f1a; border-radius: 8px; text-align: center; min-width: 55px; border: 1px solid #ffffff11; cursor: pointer; transition: all 0.2s; }
        .odd-mini:hover { background: #00ff9d22; border-color: #00ff9d; transform: scale(1.02); }
        .odd-label { font-size: 10px; color: #a0a8c9; }
        .odd-value { font-weight: bold; color: #00ff9d; font-size: 14px; }
        .match-buttons { display: flex; gap: 8px; }
        .bet-btn, .slip-btn { padding: 6px 14px; border-radius: 25px; font-size: 11px; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; }
        .bet-btn { background: #00ff9d; color: black; }
        .bet-btn:hover { transform: scale(1.02); background: #00cc7d; }
        .slip-btn { background: #ff9800; color: black; }
        .slip-btn:hover { transform: scale(1.02); background: #e68900; }
        
        /* Floating Side Cart */
        .side-cart { position: fixed; right: -400px; top: 0; width: 380px; height: 100vh; background: #111827; border-left: 2px solid #ff9800; z-index: 1001; transition: right 0.3s ease; display: flex; flex-direction: column; box-shadow: -5px 0 20px rgba(0,0,0,0.5); }
        .side-cart.open { right: 0; }
        .cart-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 1000; display: none; }
        .cart-overlay.show { display: block; }
        .cart-header { padding: 15px; background: #1a2332; border-bottom: 1px solid #ff9800; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; }
        .cart-header h3 { color: #ff9800; font-size: 18px; }
        .cart-close { background: none; border: none; color: white; font-size: 24px; cursor: pointer; }
        .cart-close:hover { color: #ff5252; }
        .cart-items { flex: 1; overflow-y: auto; padding: 15px; }
        .cart-item { background: #1a2332; border-radius: 10px; padding: 10px; margin-bottom: 10px; position: relative; border-left: 3px solid #ff9800; }
        .cart-item-match { font-weight: bold; font-size: 13px; margin-bottom: 5px; }
        .cart-item-bet { font-size: 11px; color: #00ff9d; }
        .cart-item-odds { font-size: 12px; color: #ff9800; font-weight: bold; margin-top: 5px; }
        .cart-remove { position: absolute; top: 10px; right: 10px; background: none; border: none; color: #ff5252; cursor: pointer; font-size: 14px; }
        .cart-remove:hover { color: #ff8888; }
        .cart-footer { padding: 15px; background: #1a2332; border-top: 1px solid #ffffff22; }
        .cart-total { display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: bold; }
        .cart-total-odds { color: #ff9800; font-size: 18px; }
        .cart-stake { width: 100%; padding: 10px; background: #0a0f1a; border: 1px solid #ff9800; border-radius: 8px; color: white; margin: 10px 0; text-align: center; }
        .cart-potential { background: #00ff9d11; padding: 10px; border-radius: 8px; text-align: center; margin: 10px 0; }
        .cart-potential-value { font-size: 18px; font-weight: bold; color: #00ff9d; }
        .cart-place-btn { width: 100%; padding: 12px; background: #ff9800; color: black; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: all 0.2s; }
        .cart-place-btn:hover:not(:disabled) { background: #e68900; }
        .cart-place-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        /* Cart Icon */
        .cart-icon { position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px; background: #ff9800; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 999; box-shadow: 0 4px 15px rgba(0,0,0,0.3); transition: all 0.2s; }
        .cart-icon:hover { transform: scale(1.05); background: #e68900; }
        .cart-icon .badge { position: absolute; top: -5px; right: -5px; background: #ff5252; color: white; border-radius: 50%; width: 22px; height: 22px; font-size: 12px; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .cart-icon i { font-size: 24px; color: black; }
        
        .empty-state { text-align: center; padding: 60px; color: #a0a8c9; }
        .today-badge { background: #ff5252; color: white; font-size: 10px; padding: 2px 8px; border-radius: 12px; margin-left: 8px; animation: pulse 1s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.7; } }
        .loading-spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid #00ff9d; border-top-color: transparent; border-radius: 50%; animation: spin 0.6s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .notification { position: fixed; top: 20px; right: 20px; background: #00ff9d; color: black; padding: 10px 20px; border-radius: 8px; font-size: 12px; z-index: 2000; animation: slideIn 0.3s ease, fadeOut 0.3s ease 2.7s forwards; }
        .notification.error { background: #ff5252; color: white; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeOut { to { opacity: 0; visibility: hidden; } }
        
        @media (max-width: 768px) {
            .match-row { flex-direction: column; align-items: stretch; }
            .team-col { justify-content: center; }
            .odds-col { justify-content: center; }
            .match-buttons { justify-content: center; }
            .match-time-col { display: flex; justify-content: space-between; align-items: center; }
            .side-cart { width: 100%; right: -100%; }
            .league-filter-banner .league-info { flex-wrap: wrap; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-top">
            <div class="header-left">
                <a href="betting-sport.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
                <h1 style="font-size:18px;"><i class="fas fa-futbol"></i> X Lodon Sports</h1>
            </div>
            <button class="lang-toggle" onclick="toggleLanguage()">عربي</button>
        </div>
        <div class="tabs">
            <a href="betting-sport.html" class="tab">Home</a>
            <a href="live-matches.html" class="tab">Live</a>
            <a href="upcoming-matches.html" class="tab active">Upcoming</a>
            <a href="finished-matches.html" class="tab">Results</a>
            <a href="my-bets.html" class="tab">My Bets</a>
        </div>
    </div>
    
    <div class="container">
        <div class="balance-bar">
            <span><i class="fas fa-wallet"></i> Balance</span>
            <span class="balance-amount" id="balance-display">$0.00</span>
        </div>
        
        <!-- League Filter Banner (shows when filtering by league) -->
        <div class="league-filter-banner" id="league-filter-banner">
            <div class="league-info">
                <img class="league-logo" id="filter-league-logo" src="" alt="League Logo">
                <div>
                    <div class="league-name" id="filter-league-name">League Name</div>
                    <div class="match-count" id="filter-match-count">0 matches</div>
                </div>
            </div>
            <button class="clear-filter-btn" onclick="clearLeagueFilter()">
                <i class="fas fa-times"></i> Clear Filter
            </button>
        </div>
        
        <div class="selector-bar">
            <select id="league-filter" class="league-select"><option value="all">🏆 All Leagues</option></select>
            <input type="text" id="search-input" class="search-input" placeholder="🔍 Search team or league..." oninput="filterMatches()">
            <input type="date" id="date-filter" class="date-filter" onchange="filterByDate()">
        </div>
        
        <div class="debug-bar">
            <i class="fas fa-calendar-week"></i> <span id="debug-text">Loading upcoming matches...</span>
            <button class="refresh-btn" onclick="loadMatches()"><i class="fas fa-sync-alt"></i> Refresh</button>
        </div>
        
        <div id="matches-container"><div style="text-align:center;padding:50px;"><div class="loading-spinner"></div> Loading upcoming matches...</div></div>
    </div>
    
    <!-- Cart Icon (Floating) -->
    <div class="cart-icon" id="cart-icon" onclick="toggleCart()">
        <i class="fas fa-shopping-cart"></i>
        <span class="badge" id="cart-badge">0</span>
    </div>
    
    <!-- Floating Side Cart -->
    <div class="cart-overlay" id="cart-overlay" onclick="toggleCart()"></div>
    <div class="side-cart" id="side-cart">
        <div class="cart-header">
            <h3><i class="fas fa-layer-group"></i> Bet Slip</h3>
            <button class="cart-close" onclick="toggleCart()">&times;</button>
        </div>
        <div class="cart-items" id="cart-items">
            <div style="text-align:center; padding:20px; color:#a0a8c9;">No selections added</div>
        </div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>Total Odds:</span>
                <span class="cart-total-odds" id="cart-total-odds">1.00</span>
            </div>
            <input type="number" id="cart-stake" class="cart-stake" placeholder="Enter stake amount" min="1" step="1" value="10">
            <div class="cart-potential">
                <div>Potential Win</div>
                <div class="cart-potential-value" id="cart-potential">$0.00</div>
            </div>
            <button class="cart-place-btn" id="cart-place-btn" disabled onclick="placeAccumulatorBet()">Place Accumulator (2+ Selections)</button>
        </div>
    </div>

    <script>
        // ============================================
        // UPCOMING MATCHES - WITH LEAGUE FILTER FROM URL
        // ============================================
        
        // Supabase Configuration
        const SUPABASE_URL = 'https://jnazybaeajyynpyoszmy.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpuYXp5YmFlYWp5eW5weW9zem15Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyNzgwMDMsImV4cCI6MjA5Mjg1NDAwM30.P_8V-_s6DQDiYekZX1yaNup48WBRaLhb3ILAkvzTDTY';
        
        let supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        
        const db = firebase.firestore();
        const auth = firebase.auth();
        
        let allMatches = [];
        let upcomingMatches = [];
        let countdownInterval;
        let selectedLeague = 'all';
        let selectedDate = '';
        let isLoading = false;
        let accumulatorSlip = [];
        let filterLeagueId = null;
        let filterLeagueName = null;
        let filterLeagueLogo = null;
        
        const API_BASE = 'https://millioner.onrender.com';
        
        // ===== URL PARAMETER HANDLING =====
        function getUrlParams() {
            const params = new URLSearchParams(window.location.search);
            const leagueId = params.get('league');
            const leagueName = params.get('name');
            
            if (leagueId) {
                filterLeagueId = parseInt(leagueId);
                filterLeagueName = leagueName || 'League';
                selectedLeague = leagueId;
            }
        }
        
        function showLeagueFilterBanner(leagueId, leagueName, leagueLogo) {
            const banner = document.getElementById('league-filter-banner');
            banner.classList.add('active');
            document.getElementById('filter-league-logo').src = leagueLogo || 'https://via.placeholder.com/40/1a2332/00ff9d?text=L';
            document.getElementById('filter-league-logo').onerror = function() {
                this.src = 'https://via.placeholder.com/40/1a2332/00ff9d?text=L';
            };
            document.getElementById('filter-league-name').textContent = leagueName || 'League';
            
            // Update match count after rendering
            setTimeout(() => {
                const matchCount = document.querySelectorAll('.match-row').length;
                document.getElementById('filter-match-count').textContent = `${matchCount} matches`;
            }, 100);
        }
        
        function clearLeagueFilter() {
            filterLeagueId = null;
            filterLeagueName = null;
            filterLeagueLogo = null;
            selectedLeague = 'all';
            document.getElementById('league-filter').value = 'all';
            document.getElementById('league-filter-banner').classList.remove('active');
            
            // Update URL without parameters
            const url = new URL(window.location.href);
            url.search = '';
            window.history.pushState({}, '', url);
            
            renderMatches();
        }
        
        // ===== FIREBASE WALLET FUNCTIONS =====
        async function loadBalance() {
            try {
                const user = auth.currentUser;
                if (!user) return 0;
                
                const doc = await db.collection('wallets').doc(user.uid).get();
                const balance = doc.exists ? (doc.data().balance || 0) : 1000;
                
                if (!doc.exists) {
                    await db.collection('wallets').doc(user.uid).set({
                        balance: 1000,
                        created_at: new Date().toISOString(),
                        updated_at: new Date().toISOString()
                    });
                }
                
                document.getElementById('balance-display').textContent = `$${balance.toFixed(2)}`;
                return balance;
            } catch(e) { 
                console.error('Balance load error:', e); 
                return 0;
            }
        }
        
        async function updateWalletBalance(userId, amount) {
            const walletRef = db.collection('wallets').doc(userId);
            await walletRef.update({
                balance: firebase.firestore.FieldValue.increment(amount),
                updated_at: new Date().toISOString()
            });
        }
        
        // ===== SHOW NOTIFICATION =====
        function showNotification(message, type = 'success') {
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.innerHTML = `<i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}"></i> ${message}`;
            document.body.appendChild(notification);
            setTimeout(() => notification.remove(), 3000);
        }
        
        // ===== TOGGLE CART =====
        function toggleCart() {
            const cart = document.getElementById('side-cart');
            const overlay = document.getElementById('cart-overlay');
            cart.classList.toggle('open');
            overlay.classList.toggle('show');
        }
        
        // ===== UPDATE CART UI =====
        function updateCartUI() {
            const cartItemsContainer = document.getElementById('cart-items');
            const cartBadge = document.getElementById('cart-badge');
            const cartTotalOdds = document.getElementById('cart-total-odds');
            const cartPlaceBtn = document.getElementById('cart-place-btn');
            const stakeInput = document.getElementById('cart-stake');
            
            cartBadge.textContent = accumulatorSlip.length;
            
            if (accumulatorSlip.length === 0) {
                cartItemsContainer.innerHTML = '<div style="text-align:center; padding:20px; color:#a0a8c9;">No selections added<br>Click on odds to add</div>';
                cartTotalOdds.textContent = '1.00';
                cartPlaceBtn.disabled = true;
                cartPlaceBtn.textContent = 'Add selections (2+ needed)';
                document.getElementById('cart-potential').textContent = '$0.00';
                return;
            }
            
            let itemsHtml = '';
            let totalOdds = 1;
            
            accumulatorSlip.forEach((item, index) => {
                totalOdds *= item.odds;
                itemsHtml += `
                    <div class="cart-item">
                        <div class="cart-item-match">${escapeHtml(item.matchName)}</div>
                        <div class="cart-item-bet">${escapeHtml(item.betTypeName)}</div>
                        <div class="cart-item-odds">Odds: ${item.odds.toFixed(2)}</div>
                        <button class="cart-remove" onclick="removeFromSlip(${index})"><i class="fas fa-trash-alt"></i></button>
                    </div>
                `;
            });
            
            cartItemsContainer.innerHTML = itemsHtml;
            cartTotalOdds.textContent = totalOdds.toFixed(2);
            
            const stake = parseFloat(stakeInput.value) || 0;
            const potential = stake * totalOdds;
            document.getElementById('cart-potential').textContent = `$${potential.toFixed(2)}`;
            
            cartPlaceBtn.disabled = accumulatorSlip.length < 2;
            cartPlaceBtn.textContent = accumulatorSlip.length < 2 ? `Add ${2 - accumulatorSlip.length} more selection(s)` : 'Place Accumulator Bet';
        }
        
        // ===== ADD TO SLIP =====
        function addToSlip(fixtureId, betType, odds, homeTeam, awayTeam) {
            // If betType is null, prompt user to select
            if (!betType) {
                const selectedType = prompt('Select bet type:\n1 - Home Win\n2 - Draw\n3 - Away Win', '1');
                if (selectedType === '1') {
                    betType = 'home';
                    const match = upcomingMatches.find(m => m.fixture_id == fixtureId);
                    odds = match?.odds?.home || 2.50;
                } else if (selectedType === '2') {
                    betType = 'draw';
                    const match = upcomingMatches.find(m => m.fixture_id == fixtureId);
                    odds = match?.odds?.draw || 3.20;
                } else if (selectedType === '3') {
                    betType = 'away';
                    const match = upcomingMatches.find(m => m.fixture_id == fixtureId);
                    odds = match?.odds?.away || 2.80;
                } else {
                    showNotification('Invalid selection', 'error');
                    return;
                }
            }
            
            // Get match data
            const match = upcomingMatches.find(m => m.fixture_id == fixtureId);
            if (!match) return;
            
            let betTypeName = '';
            if (betType === 'home') betTypeName = `${homeTeam} to win`;
            else if (betType === 'draw') betTypeName = 'Draw';
            else if (betType === 'away') betTypeName = `${awayTeam} to win`;
            
            // Check if already in slip
            const existingIndex = accumulatorSlip.findIndex(s => s.fixtureId === fixtureId && s.betType === betType);
            if (existingIndex !== -1) {
                showNotification(`Already in slip: ${betTypeName}`, 'error');
                return;
            }
            
            accumulatorSlip.push({
                fixtureId: fixtureId,
                matchName: `${homeTeam} vs ${awayTeam}`,
                betType: betType,
                betTypeName: betTypeName,
                odds: parseFloat(odds)
            });
            
            updateCartUI();
            showNotification(`Added to slip: ${betTypeName} @ ${odds}`);
        }
        
        function removeFromSlip(index) {
            accumulatorSlip.splice(index, 1);
            updateCartUI();
            if (accumulatorSlip.length === 0) {
                // Optionally close cart when empty
            }
        }
        
        function clearAllSlip() { 
            accumulatorSlip = []; 
            updateCartUI();
            showNotification('Bet slip cleared');
        }
        
        // ===== PLACE ACCUMULATOR BET =====
        async function placeAccumulatorBet() {
            if (accumulatorSlip.length < 2) {
                showNotification(`Add at least 2 selections (currently ${accumulatorSlip.length})`, 'error');
                return;
            }
            
            const stake = parseFloat(document.getElementById('cart-stake').value);
            if (!stake || stake < 1) {
                showNotification('Please enter a valid stake amount (minimum $1)', 'error');
                return;
            }
            
            const user = auth.currentUser;
            if (!user) {
                showNotification('Please login', 'error');
                window.location.href = '../login.html';
                return;
            }
            
            const balance = await loadBalance();
            if (stake > balance) {
                showNotification(`Insufficient balance! Your balance: $${balance.toFixed(2)}`, 'error');
                return;
            }
            
            let totalOdds = 1;
            accumulatorSlip.forEach(s => totalOdds *= s.odds);
            const potentialWin = stake * totalOdds;
            
            if (!confirm(`Place accumulator bet?\nSelections: ${accumulatorSlip.length}\nTotal Odds: ${totalOdds.toFixed(2)}\nStake: $${stake.toFixed(2)}\nPotential Win: $${potentialWin.toFixed(2)}`)) {
                return;
            }
            
            const btn = document.getElementById('cart-place-btn');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<div class="loading-spinner"></div> Processing...';
            
            try {
                const betId = Date.now();
                const bet = {
                    id: betId,
                    user_id: user.uid,
                    fixture_id: null,
                    bet_type: 'accumulator',
                    bet_name: `${accumulatorSlip.length}-fold Accumulator`,
                    odds: totalOdds,
                    amount: stake,
                    potential_win: potentialWin,
                    status: 'active',
                    placed_at: new Date().toISOString(),
                    selections: accumulatorSlip
                };
                
                const { error } = await supabaseClient.from('bets').insert(bet);
                if (error) throw new Error(error.message);
                
                await updateWalletBalance(user.uid, -stake);
                
                showNotification(`✅ Accumulator bet placed! Potential win: $${potentialWin.toFixed(2)}`, 'success');
                
                accumulatorSlip = [];
                updateCartUI();
                toggleCart(); // Close cart after placing bet
                await loadBalance();
                
                setTimeout(() => {
                    if (confirm('View your active bets?')) {
                        window.location.href = 'my-bets.html';
                    }
                }, 1000);
                
            } catch(e) {
                console.error('Bet error:', e);
                showNotification(`Failed to place bet: ${e.message}`, 'error');
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        }
        
        // Listen for stake input changes
        document.getElementById('cart-stake')?.addEventListener('input', () => updateCartUI());
        
        // ===== LOAD MATCHES =====
        async function loadMatches() {
            if (isLoading) return;
            isLoading = true;
            
            try {
                document.getElementById('debug-text').innerHTML = '<div class="loading-spinner"></div> Loading upcoming matches...';
                
                const today = new Date();
                const dates = [];
                
                for (let i = 0; i <= 7; i++) {
                    const date = new Date(today);
                    date.setDate(today.getDate() + i);
                    const dateStr = date.toISOString().split('T')[0];
                    dates.push(dateStr);
                }
                
                const fetchPromises = dates.map(date => 
                    fetch(`${API_BASE}/api/fixtures/date/${date}`).then(r => r.json())
                );
                
                const results = await Promise.all(fetchPromises);
                allMatches = [];
                upcomingMatches = [];
                
                const now = new Date();
                
                for (let i = 0; i < results.length; i++) {
                    const data = results[i];
                    if (data.success && data.data && data.data.length > 0) {
                        data.data.forEach(m => {
                            const matchTime = new Date(m.fixture.date);
                            const statusShort = m.fixture.status?.short;
                            const isLive = statusShort === '1H' || statusShort === '2H' || statusShort === 'HT';
                            const isFinished = statusShort === 'FT' || statusShort === 'AET' || statusShort === 'PEN';
                            
                            if (!isLive && !isFinished && matchTime > now) {
                                const transformedMatch = {
                                    fixture_id: m.fixture.id,
                                    start_time: m.fixture.date,
                                    status: 'upcoming',
                                    league_id: m.league.id,
                                    league_name: m.league.name,
                                    league_logo: m.league.logo,
                                    home_team: {
                                        id: m.teams.home.id,
                                        name: m.teams.home.name,
                                        logo: m.teams.home.logo
                                    },
                                    away_team: {
                                        id: m.teams.away.id,
                                        name: m.teams.away.name,
                                        logo: m.teams.away.logo
                                    },
                                    odds: {
                                        home: (1.80 + ((m.fixture.id % 20) / 100)).toFixed(2),
                                        draw: (3.20 + ((m.fixture.id % 15) / 100)).toFixed(2),
                                        away: (2.80 + ((m.fixture.id % 25) / 100)).toFixed(2)
                                    }
                                };
                                allMatches.push(transformedMatch);
                                upcomingMatches.push(transformedMatch);
                            }
                        });
                    }
                }
                
                upcomingMatches.sort((a, b) => new Date(a.start_time) - new Date(b.start_time));
                
                document.getElementById('debug-text').innerHTML = `✅ ${upcomingMatches.length} upcoming matches | Next 7 days`;
                
                if (upcomingMatches.length === 0) {
                    document.getElementById('matches-container').innerHTML = '<div class="empty-state">No upcoming matches found for the next 7 days</div>';
                } else {
                    // Apply league filter from URL if present
                    if (filterLeagueId) {
                        // Set the league dropdown to match
                        document.getElementById('league-filter').value = filterLeagueId;
                        
                        // Find league info from matches
                        const leagueMatch = upcomingMatches.find(m => m.league_id == filterLeagueId);
                        if (leagueMatch) {
                            filterLeagueName = leagueMatch.league_name;
                            filterLeagueLogo = leagueMatch.league_logo;
                            showLeagueFilterBanner(filterLeagueId, filterLeagueName, filterLeagueLogo);
                        }
                    }
                    
                    renderMatches();
                    startCountdowns();
                }
                
            } catch(e) {
                console.error(e);
                document.getElementById('debug-text').innerHTML = `❌ Error: ${e.message}`;
            } finally {
                isLoading = false;
            }
        }
        
        function renderMatches() {
            if (upcomingMatches.length === 0) {
                document.getElementById('matches-container').innerHTML = '<div class="empty-state">No upcoming matches found</div>';
                return;
            }
            
            const filtered = filterMatchesArray(upcomingMatches);
            
            // Update match count in banner
            const matchCount = filtered.length;
            document.getElementById('filter-match-count').textContent = `${matchCount} matches`;
            
            if (filtered.length === 0) {
                document.getElementById('matches-container').innerHTML = '<div class="empty-state">No matches match your filters</div>';
                return;
            }
            
            const groupedByDate = {};
            filtered.forEach(m => {
                const date = new Date(m.start_time).toDateString();
                if (!groupedByDate[date]) groupedByDate[date] = [];
                groupedByDate[date].push(m);
            });
            
            const today = new Date().toDateString();
            const tomorrow = new Date(Date.now() + 86400000).toDateString();
            let html = '';
            
            Object.keys(groupedByDate).sort().forEach(dateKey => {
                const date = new Date(dateKey);
                let label = date.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
                let badge = '';
                
                if (dateKey === today) {
                    label = `📅 TODAY - ${label}`;
                    badge = '<span class="today-badge"><i class="fas fa-calendar-day"></i> TODAY</span>';
                } else if (dateKey === tomorrow) {
                    label = `📅 TOMORROW - ${label}`;
                    badge = '<span class="today-badge"><i class="fas fa-calendar-day"></i> TOMORROW</span>';
                }
                
                const groupedByLeague = {};
                groupedByDate[dateKey].forEach(m => {
                    const leagueName = m.league_name || 'Other Leagues';
                    if (!groupedByLeague[leagueName]) groupedByLeague[leagueName] = [];
                    groupedByLeague[leagueName].push(m);
                });
                
                let leaguesHtml = '';
                Object.keys(groupedByLeague).sort().forEach(leagueName => {
                    const leagueMatches = groupedByLeague[leagueName];
                    const leagueLogo = leagueMatches[0]?.league_logo || '';
                    let matchesHtml = '';
                    leagueMatches.forEach(m => { matchesHtml += createMatchRow(m); });
                    leaguesHtml += `
                        <div class="league-group">
                            <div class="league-group-header" onclick="this.classList.toggle('collapsed');this.nextElementSibling.classList.toggle('collapsed');">
                                ${leagueLogo ? `<img class="league-logo" src="${leagueLogo}" onerror="this.style.display='none'">` : '<i class="fas fa-trophy"></i>'}
                                <span class="league-name">${escapeHtml(leagueName)}</span>
                                <span class="league-match-count">${leagueMatches.length} matches</span>
                                <i class="fas fa-chevron-down"></i>
                            </div>
                            <div class="league-matches">${matchesHtml}</div>
                        </div>
                    `;
                });
                
                html += `
                    <div class="date-section">
                        <div class="date-header" onclick="this.classList.toggle('collapsed');this.nextElementSibling.classList.toggle('collapsed');">
                            <span class="date-title"><i class="far fa-calendar-alt"></i> ${label} ${badge}</span>
                            <span class="match-count">${groupedByDate[dateKey].length} matches</span>
                            <i class="fas fa-chevron-down"></i>
                        </div>
                        <div class="date-matches">${leaguesHtml}</div>
                    </div>
                `;
            });
            
            document.getElementById('matches-container').innerHTML = html;
        }
        
        function filterMatchesArray(matches) {
            const search = document.getElementById('search-input').value.toLowerCase();
            const dateFilter = selectedDate;
            
            let filtered = [...matches];
            
            if (selectedLeague !== 'all') {
                filtered = filtered.filter(m => m.league_id == selectedLeague);
            }
            
            if (search) {
                filtered = filtered.filter(m => 
                    (m.home_team?.name || '').toLowerCase().includes(search) || 
                    (m.away_team?.name || '').toLowerCase().includes(search) || 
                    (m.league_name || '').toLowerCase().includes(search)
                );
            }
            
            if (dateFilter) {
                const filterDate = new Date(dateFilter);
                filterDate.setHours(0, 0, 0, 0);
                filtered = filtered.filter(m => {
                    const d = new Date(m.start_time);
                    d.setHours(0, 0, 0, 0);
                    return d.getTime() === filterDate.getTime();
                });
            }
            
            return filtered;
        }
        
        function createMatchRow(m) {
            const time = new Date(m.start_time);
            const homeTeam = m.home_team || { name: 'Home', logo: '' };
            const awayTeam = m.away_team || { name: 'Away', logo: '' };
            const odds = m.odds || { home: 2.50, draw: 3.20, away: 2.80 };
            
            return `
                <div class="match-row" data-fixture="${m.fixture_id}" data-time="${m.start_time}">
                    <div class="match-time-col">
                        <div class="match-time">${time.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</div>
                        <div class="match-countdown" id="cd-${m.fixture_id}">--:--:--</div>
                    </div>
                    <div class="team-col">
                        ${homeTeam.logo ? `<img class="team-logo" src="${homeTeam.logo}" onerror="this.style.display='none'">` : '<i class="fas fa-shield-alt"></i>'}
                        <span class="team-name">${escapeHtml(homeTeam.name)}</span>
                        <span class="vs">vs</span>
                        <span class="team-name">${escapeHtml(awayTeam.name)}</span>
                        ${awayTeam.logo ? `<img class="team-logo" src="${awayTeam.logo}" onerror="this.style.display='none'">` : '<i class="fas fa-shield-alt"></i>'}
                    </div>
                    <div class="odds-col">
                        <div class="odd-mini" onclick="addToSlip(${m.fixture_id}, 'home', ${odds.home}, '${escapeHtml(homeTeam.name)}', '${escapeHtml(awayTeam.name)}')">
                            <div class="odd-label">1</div>
                            <div class="odd-value">${odds.home}</div>
                        </div>
                        <div class="odd-mini" onclick="addToSlip(${m.fixture_id}, 'draw', ${odds.draw}, '${escapeHtml(homeTeam.name)}', '${escapeHtml(awayTeam.name)}')">
                            <div class="odd-label">X</div>
                            <div class="odd-value">${odds.draw}</div>
                        </div>
                        <div class="odd-mini" onclick="addToSlip(${m.fixture_id}, 'away', ${odds.away}, '${escapeHtml(homeTeam.name)}', '${escapeHtml(awayTeam.name)}')">
                            <div class="odd-label">2</div>
                            <div class="odd-value">${odds.away}</div>
                        </div>
                    </div>
                    <div class="match-buttons">
                        <button class="bet-btn" onclick="goToMatch(${m.fixture_id})"><i class="fas fa-gavel"></i> Bet</button>
                        <button class="slip-btn" onclick="addToSlip(${m.fixture_id}, null, null, '${escapeHtml(homeTeam.name)}', '${escapeHtml(awayTeam.name)}')"><i class="fas fa-plus"></i> Slip</button>
                    </div>
                </div>
            `;
        }
        
        function goToMatch(fixtureId) { 
            location.href = `match-details.html?id=${fixtureId}`; 
        }
        
        function filterMatches() { 
            // If league filter changes, clear the banner
            const selected = document.getElementById('league-filter').value;
            if (selected !== 'all') {
                selectedLeague = selected;
                // Find league info
                const leagueMatch = upcomingMatches.find(m => m.league_id == selected);
                if (leagueMatch) {
                    filterLeagueId = parseInt(selected);
                    filterLeagueName = leagueMatch.league_name;
                    filterLeagueLogo = leagueMatch.league_logo;
                    showLeagueFilterBanner(filterLeagueId, filterLeagueName, filterLeagueLogo);
                }
                // Update URL
                const url = new URL(window.location.href);
                url.search = `?league=${selected}&name=${encodeURIComponent(filterLeagueName || 'League')}`;
                window.history.pushState({}, '', url);
            } else {
                clearLeagueFilter();
            }
            renderMatches(); 
        }
        
        function filterByDate() {
            const datePicker = document.getElementById('date-filter');
            selectedDate = datePicker.value;
            renderMatches();
        }
        
        function startCountdowns() {
            if (countdownInterval) clearInterval(countdownInterval);
            
            function updateCountdowns() {
                document.querySelectorAll('[id^="cd-"]').forEach(el => {
                    const fixtureId = el.id.replace('cd-', '');
                    const match = upcomingMatches.find(m => m.fixture_id == fixtureId);
                    if (match) {
                        const diff = new Date(match.start_time) - new Date();
                        if (diff <= 0) {
                            el.textContent = 'LIVE NOW!';
                            el.style.color = '#ff5252';
                            el.style.fontWeight = 'bold';
                            setTimeout(() => loadMatches(), 5000);
                        } else {
                            const hours = Math.floor(diff / 3600000);
                            const minutes = Math.floor((diff % 3600000) / 60000);
                            const seconds = Math.floor((diff % 60000) / 1000);
                            let display = hours > 0 ? `${hours}h ${minutes}m` : (minutes > 0 ? `${minutes}m ${seconds}s` : `${seconds}s`);
                            el.textContent = display;
                            el.style.color = '#a0a8c9';
                            
                            if (minutes < 5 && hours === 0) {
                                el.style.color = '#ff9800';
                                el.style.fontWeight = 'bold';
                            }
                        }
                    }
                });
            }
            
            updateCountdowns();
            countdownInterval = setInterval(updateCountdowns, 1000);
        }
        
        async function loadLeagues() {
            try {
                const res = await fetch(`${API_BASE}/api/leagues`);
                const data = await res.json();
                if (data.success && data.data) {
                    const select = document.getElementById('league-filter');
                    select.innerHTML = '<option value="all">🏆 All Leagues</option>';
                    data.data.slice(0, 40).forEach(league => {
                        const option = document.createElement('option');
                        option.value = league.id;
                        option.textContent = league.name;
                        select.appendChild(option);
                    });
                }
            } catch(e) { console.error(e); }
        }
        
        function startAutoRefresh() {
            setInterval(() => {
                loadMatches();
                loadBalance();
            }, 60000);
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        function toggleLanguage() {
            const isArabic = document.body.classList.toggle('arabic');
            localStorage.setItem('lang', isArabic ? 'ar' : 'en');
            document.documentElement.dir = isArabic ? 'rtl' : 'ltr';
        }
        
        if (localStorage.getItem('lang') === 'ar') toggleLanguage();
        
        // ===== INITIALIZATION =====
        auth.onAuthStateChanged(async (user) => {
            if (!user) { 
                window.location.href = '../login.html';
                return;
            }
            
            // Get URL parameters first
            getUrlParams();
            
            await loadBalance();
            await loadLeagues();
            await loadMatches();
            startAutoRefresh();
        });
        
        // Expose global functions
        window.goToMatch = goToMatch;
        window.filterMatches = filterMatches;
        window.filterByDate = filterByDate;
        window.loadMatches = loadMatches;
        window.toggleLanguage = toggleLanguage;
        window.addToSlip = addToSlip;
        window.removeFromSlip = removeFromSlip;
        window.clearAllSlip = clearAllSlip;
        window.placeAccumulatorBet = placeAccumulatorBet;
        window.toggleCart = toggleCart;
        window.clearLeagueFilter = clearLeagueFilter;
        
        console.log('✅ Upcoming matches page loaded - WITH LEAGUE FILTER');
        console.log(`   Filtering by league ID: ${filterLeagueId || 'none'}`);
        console.log('   Click odds or "Slip" button to add to cart');
        console.log('   Click cart icon to review selections');
        console.log('   Minimum 2 selections required for accumulator');
    </script>
</body>
</html>
