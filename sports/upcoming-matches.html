<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Upcoming - X Lodon | المباريات القادمة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="../css/sports-betting.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0f1a; color: white; font-family: 'Segoe UI', 'Tajawal', sans-serif; min-height: 100vh; }
        .header { background: #111827; padding: 12px 15px; border-bottom: 2px solid #00ff9d; position: sticky; top: 0; z-index: 100; }
        .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .back-btn { color: #00ff9d; text-decoration: none; font-size: 20px; }
        .lang-toggle { background: #1a2332; border: 1px solid #00ff9d; color: #00ff9d; padding: 5px 12px; border-radius: 20px; font-size: 14px; cursor: pointer; }
        .tabs { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 3px; }
        .tab { padding: 8px 12px; background: #1a2332; border-radius: 20px; color: white; text-decoration: none; font-size: 12px; }
        .tab.active { background: #00ff9d; color: black; }
        .container { max-width: 1200px; margin: 0 auto; padding: 15px; }
        
        .date-tabs { display: flex; gap: 5px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px; }
        .date-tab { padding: 10px 16px; background: #1a2332; border: none; border-radius: 25px; color: white; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
        .date-tab.active { background: #00ff9d; color: black; }
        
        .filter-row { display: flex; gap: 10px; margin-bottom: 15px; align-items: center; }
        .league-select { flex: 1; padding: 14px; background: #111827; border: 1px solid #ffffff22; border-radius: 10px; color: white; font-size: 14px; }
        .refresh-btn { background: transparent; border: 1px solid #00ff9d; color: #00ff9d; padding: 10px 15px; border-radius: 10px; cursor: pointer; }
        
        .league-group { margin-bottom: 25px; }
        .league-header { color: #00ff9d; font-size: 16px; font-weight: 600; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #00ff9d33; display: flex; justify-content: space-between; cursor: pointer; }
        .league-header i { transition: transform 0.3s; }
        .league-header.collapsed i { transform: rotate(-90deg); }
        .league-matches.collapsed { display: none; }
        
        .match-card { background: #111827; border-radius: 12px; padding: 15px; margin-bottom: 10px; border-left: 4px solid #00ff9d; cursor: pointer; }
        .match-teams { display: flex; align-items: center; justify-content: space-around; margin: 10px 0; }
        .team { text-align: center; flex: 1; }
        .team-logo { width: 40px; height: 40px; margin: 0 auto 5px; }
        .team-logo img { width: 100%; height: 100%; object-fit: contain; }
        .team-initials { width: 40px; height: 40px; margin: 0 auto 5px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; }
        .team-name { font-weight: 600; font-size: 13px; }
        .vs { color: #ff9800; font-weight: bold; }
        .match-datetime { color: #a0a8c9; font-size: 12px; margin: 8px 0; display: flex; justify-content: center; gap: 15px; }
        .countdown-box { background: #1a2332; border-radius: 8px; padding: 10px; text-align: center; }
        .countdown-value { color: #00ff9d; font-size: 18px; font-weight: bold; }
        .odds { display: flex; gap: 8px; margin-top: 12px; }
        .odd { flex: 1; text-align: center; padding: 8px; background: #0a0f1a; border-radius: 6px; }
        .odd-value { color: #00ff9d; font-weight: bold; }
        
        .empty-state { text-align: center; padding: 50px; color: #a0a8c9; }
        .arabic { font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-top">
            <div class="header-left">
                <a href="betting-sport.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
                <h1 style="font-size:18px;"><i class="fas fa-futbol"></i> <span class="en">X Lodon Sports</span><span class="ar" style="display:none;">إكس لودون سبورت</span></h1>
            </div>
            <button class="lang-toggle" onclick="toggleLanguage()"><span class="en">🇸🇦 عربي</span><span class="ar" style="display:none;">🇬🇧 English</span></button>
        </div>
        <div class="tabs">
            <a href="betting-sport.html" class="tab"><span class="en">Home</span><span class="ar" style="display:none;">الرئيسية</span></a>
            <a href="live-matches.html" class="tab"><span class="en">Live</span><span class="ar" style="display:none;">مباشر</span></a>
            <a href="upcoming-matches.html" class="tab active"><span class="en">Upcoming</span><span class="ar" style="display:none;">قادم</span></a>
            <a href="finished-matches.html" class="tab"><span class="en">Results</span><span class="ar" style="display:none;">النتائج</span></a>
            <a href="my-bets.html" class="tab"><span class="en">My Bets</span><span class="ar" style="display:none;">رهاناتي</span></a>
        </div>
    </div>
    
    <div class="container">
        <div class="date-tabs" id="date-tabs">
            <button class="date-tab active" data-days="0">Today</button>
            <button class="date-tab" data-days="1">Tomorrow</button>
            <button class="date-tab" data-days="2"></button>
            <button class="date-tab" data-days="3"></button>
            <button class="date-tab" data-days="4"></button>
            <button class="date-tab" data-days="5"></button>
            <button class="date-tab" data-days="6"></button>
        </div>
        
        <div class="filter-row">
            <select id="league-select" class="league-select">
                <option value="">All Leagues</option>
            </select>
            <button class="refresh-btn" onclick="refreshMatches()"><i class="fas fa-sync-alt"></i></button>
        </div>
        
        <div id="matches-container"></div>
        <div id="empty-state" class="empty-state" style="display:none;">
            <i class="fas fa-calendar" style="font-size:48px; opacity:0.3;"></i>
            <p>No matches found for this date</p>
        </div>
    </div>

    <script src="../js/sports-api.js"></script>
    <script>
        function toggleLanguage() {
            var isEn = document.querySelector('.en').style.display !== 'none';
            document.querySelectorAll('.en').forEach(el => el.style.display = isEn ? 'none' : '');
            document.querySelectorAll('.ar').forEach(el => el.style.display = isEn ? '' : 'none');
            document.documentElement.dir = isEn ? 'rtl' : 'ltr';
        }
        
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), db = firebase.firestore();
        
        let currentDays = 0, allMatches = [], selectedLeague = '', countdownInterval;
        
        auth.onAuthStateChanged(u => { if (!u) location.href = '../login.html'; else init(); });
        
        async function init() {
            setupDateTabs();
            await loadLeagues();
            loadMatches();
        }
        
        function setupDateTabs() {
            const tabs = document.querySelectorAll('.date-tab');
            const today = new Date();
            
            tabs.forEach((tab, i) => {
                const days = parseInt(tab.dataset.days);
                const date = new Date(today);
                date.setDate(today.getDate() + days);
                const dayName = date.toLocaleDateString('en-US', { weekday: 'short' });
                const dayMonth = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                tab.textContent = days === 0 ? 'Today' : days === 1 ? 'Tomorrow' : `${dayName} ${dayMonth}`;
                
                tab.addEventListener('click', function() {
                    document.querySelectorAll('.date-tab').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    currentDays = parseInt(this.dataset.days);
                    loadMatches();
                });
            });
        }
        
        async function loadLeagues() {
            const select = document.getElementById('league-select');
            if (typeof getLeagues === 'function') {
                const leagues = await getLeagues();
                leagues.forEach(l => { if (l.name) { const opt = document.createElement('option'); opt.value = l.id; opt.textContent = l.name; select.appendChild(opt); } });
            }
            select.onchange = function() { selectedLeague = this.value; filterAndDisplay(); };
        }
        
        function refreshMatches() { loadMatches(); if (typeof syncNow === 'function') syncNow(); }
        
        async function loadMatches() {
            const container = document.getElementById('matches-container');
            const empty = document.getElementById('empty-state');
            container.innerHTML = '<div style="padding:30px;text-align:center;">Loading...</div>';
            
            const targetDate = new Date();
            targetDate.setDate(targetDate.getDate() + currentDays);
            const startDate = new Date(targetDate); startDate.setHours(0,0,0,0);
            const endDate = new Date(targetDate); endDate.setHours(23,59,59,999);
            
            let query = db.collection('sports_matches').where('status', '==', 'upcoming').where('startTime', '>=', startDate).where('startTime', '<=', endDate).orderBy('startTime');
            
            try {
                const snap = await query.get();
                allMatches = []; snap.forEach(d => allMatches.push(d.data()));
                
                if (allMatches.length === 0) { container.style.display = 'none'; empty.style.display = 'block'; return; }
                container.style.display = 'block'; empty.style.display = 'none';
                filterAndDisplay();
            } catch(e) { container.innerHTML = '<div class="empty-state">Error loading matches</div>'; }
        }
        
        function filterAndDisplay() {
            const container = document.getElementById('matches-container');
            let filtered = allMatches;
            if (selectedLeague) filtered = allMatches.filter(m => m.leagueId == selectedLeague);
            
            if (filtered.length === 0) { container.innerHTML = '<div class="empty-state">No matches for this league</div>'; return; }
            
            const grouped = {};
            filtered.forEach(m => { const l = m.leagueName || 'Other'; if (!grouped[l]) grouped[l] = []; grouped[l].push(m); });
            
            container.innerHTML = '';
            Object.keys(grouped).sort().forEach(league => {
                const group = document.createElement('div'); group.className = 'league-group';
                group.innerHTML = `<div class="league-header" onclick="toggleLeague(this)"><span>${league} (${grouped[league].length})</span><i class="fas fa-chevron-down"></i></div><div class="league-matches">${grouped[league].map(m => createCardHTML(m)).join('')}</div>`;
                container.appendChild(group);
            });
            
            startCountdowns(filtered);
        }
        
        function toggleLeague(el) { el.classList.toggle('collapsed'); el.nextElementSibling.classList.toggle('collapsed'); }
        
        function getTeamColor(name) { let hash = 0; for (let i=0; i<name.length; i++) hash += name.charCodeAt(i); return 'hsl(' + (hash % 360) + ', 65%, 45%)'; }
        
        function createCardHTML(m) {
            const time = m.startTime.toDate();
            const id = 'cd-' + m.fixtureId;
            const homeLogo = m.homeTeam?.logo || '';
            const awayLogo = m.awayTeam?.logo || '';
            
            return `
                <div class="match-card" onclick="location.href='match-details.html?id=${m.fixtureId}'">
                    <div class="match-teams">
                        <div class="team">
                            <div class="team-logo">${homeLogo ? `<img src="${homeLogo}" onerror="this.parentElement.innerHTML='<div class=\\'team-initials\\' style=\\'background:${getTeamColor(m.homeTeam.name)}\\'>${m.homeTeam.name.substring(0,2).toUpperCase()}</div>'">` : `<div class="team-initials" style="background:${getTeamColor(m.homeTeam.name)}">${m.homeTeam.name.substring(0,2).toUpperCase()}</div>`}</div>
                            <div class="team-name">${m.homeTeam.name}</div>
                        </div>
                        <div class="vs">VS</div>
                        <div class="team">
                            <div class="team-logo">${awayLogo ? `<img src="${awayLogo}" onerror="this.parentElement.innerHTML='<div class=\\'team-initials\\' style=\\'background:${getTeamColor(m.awayTeam.name)}\\'>${m.awayTeam.name.substring(0,2).toUpperCase()}</div>'">` : `<div class="team-initials" style="background:${getTeamColor(m.awayTeam.name)}">${m.awayTeam.name.substring(0,2).toUpperCase()}</div>`}</div>
                            <div class="team-name">${m.awayTeam.name}</div>
                        </div>
                    </div>
                    <div class="match-datetime">
                        <span><i class="far fa-calendar"></i> ${time.toLocaleDateString()}</span>
                        <span><i class="far fa-clock"></i> ${time.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>
                    </div>
                    <div class="countdown-box">
                        <div class="countdown-value" id="${id}">--:--:--</div>
                    </div>
                    <div class="odds">
                        <div class="odd">1 <span class="odd-value">${m.odds?.home||'2.00'}</span></div>
                        <div class="odd">X <span class="odd-value">${m.odds?.draw||'3.50'}</span></div>
                        <div class="odd">2 <span class="odd-value">${m.odds?.away||'3.80'}</span></div>
                    </div>
                </div>
            `;
        }
        
        function startCountdowns(matches) {
            if (countdownInterval) clearInterval(countdownInterval);
            countdownInterval = setInterval(() => {
                matches.forEach(m => {
                    const el = document.getElementById('cd-' + m.fixtureId);
                    if (el) {
                        const diff = m.startTime.toDate() - new Date();
                        if (diff <= 0) { el.textContent = 'Starting...'; }
                        else { const h = Math.floor(diff / 3600000), mn = Math.floor((diff % 3600000) / 60000), s = Math.floor((diff % 60000) / 1000); el.textContent = `${h.toString().padStart(2,'0')}:${mn.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`; }
                    }
                });
            }, 1000);
        }
        
        window.toggleLeague = toggleLeague;
        window.refreshMatches = refreshMatches;
        window.addEventListener('beforeunload', () => { if (countdownInterval) clearInterval(countdownInterval); });
    </script>
</body>
</html>
