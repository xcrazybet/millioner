<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Upcoming - X Lodon | المباريات القادمة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <link rel="stylesheet" href="../css/sports-betting.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0f1a; color: white; font-family: 'Segoe UI', 'Tajawal', sans-serif; min-height: 100vh; }
        .header { background: #111827; padding: 12px 15px; border-bottom: 2px solid #00ff9d; position: sticky; top: 0; z-index: 100; }
        .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .back-btn { color: #00ff9d; text-decoration: none; font-size: 20px; }
        .lang-toggle { background: #1a2332; border: 1px solid #00ff9d; color: #00ff9d; padding: 5px 12px; border-radius: 20px; cursor: pointer; }
        .tabs { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 3px; }
        .tab { padding: 8px 12px; background: #1a2332; border-radius: 20px; color: white; text-decoration: none; font-size: 12px; }
        .tab.active { background: #00ff9d; color: black; }
        .container { max-width: 1200px; margin: 0 auto; padding: 15px; padding-bottom: 180px; }
        .balance-bar { background: #111827; padding: 10px 15px; border-radius: 12px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #00ff9d33; }
        .selector-bar { display: flex; gap: 10px; margin-bottom: 15px; }
        .league-select { flex: 1; padding: 12px; background: #111827; border: 1px solid #ffffff22; border-radius: 12px; color: white; font-size: 14px; }
        .search-input { flex: 2; padding: 12px; background: #111827; border: 1px solid #ffffff22; border-radius: 12px; color: white; font-size: 14px; }
        .debug-bar { background: #1a2332; padding: 8px 15px; border-radius: 8px; margin-bottom: 10px; font-size: 11px; color: #00ff9d; display: flex; align-items: center; gap: 8px; }
        .refresh-btn { background: #00ff9d; color: black; border: none; padding: 5px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 11px; margin-left: auto; }
        
        .date-section { margin-bottom: 15px; }
        .date-header { color: #00ff9d; font-size: 14px; font-weight: 600; margin-bottom: 8px; padding: 8px 10px; background: #0a0f1a; border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .date-header i { transition: transform 0.3s; font-size: 12px; }
        .date-header.collapsed i { transform: rotate(-90deg); }
        .date-matches.collapsed { display: none; }
        
        .match-row { display: flex; align-items: center; gap: 8px; padding: 8px; border-bottom: 1px solid #ffffff0a; font-size: 12px; }
        .match-time-col { text-align: center; min-width: 45px; }
        .match-time-col .time { font-weight: bold; color: #00ff9d; }
        .match-time-col .countdown { font-size: 10px; color: #a0a8c9; }
        .team-col { flex: 1; display: flex; align-items: center; gap: 6px; }
        .team-col img { width: 20px; height: 20px; object-fit: contain; }
        .team-col .names { font-weight: 500; }
        .team-col .names .vs { color: #ff9800; margin: 0 5px; }
        .odds-col { display: flex; gap: 4px; }
        .odd-mini { padding: 3px 6px; background: #0a0f1a; border-radius: 4px; font-size: 11px; text-align: center; min-width: 35px; cursor: pointer; border: 1px solid #ffffff11; }
        .odd-mini span { color: #00ff9d; font-weight: bold; }
        .bet-btn { padding: 5px 12px; background: #00ff9d; color: black; border: none; border-radius: 20px; font-size: 10px; font-weight: 600; cursor: pointer; }
        .slip-btn { padding: 5px 12px; background: #ff9800; color: black; border: none; border-radius: 20px; font-size: 10px; font-weight: 600; cursor: pointer; }
        
        .bet-slip { position: fixed; bottom: 0; left: 0; right: 0; background: #111827; border-top: 2px solid #ff9800; padding: 15px; z-index: 1000; max-height: 200px; overflow-y: auto; }
        .slip-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .slip-title { color: #ff9800; font-weight: 600; }
        .slip-clear { color: #ff5252; font-size: 12px; cursor: pointer; }
        .slip-item { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; border-bottom: 1px solid #ffffff11; font-size: 11px; }
        .slip-remove { color: #ff5252; cursor: pointer; }
        .slip-total { display: flex; justify-content: space-between; padding: 8px 0; }
        .slip-total-odds { color: #ff9800; font-weight: bold; font-size: 16px; }
        .slip-place-btn { width: 100%; padding: 12px; background: #ff9800; color: black; border: none; border-radius: 10px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .slip-place-btn:disabled { opacity: 0.5; }
        
        .empty-state { text-align: center; padding: 40px; color: #a0a8c9; }
        .arabic { font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-top">
            <div class="header-left">
                <a href="betting-sport.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
                <h1 style="font-size:18px;"><i class="fas fa-futbol"></i> X Lodon Sports</h1>
            </div>
            <button class="lang-toggle" onclick="toggleLanguage()">🇸🇦 عربي</button>
        </div>
        <div class="tabs">
            <a href="betting-sport.html" class="tab">Home</a>
            <a href="live-matches.html" class="tab">Live</a>
            <a href="upcoming-matches.html" class="tab active">Upcoming</a>
            <a href="finished-matches.html" class="tab">Results</a>
            <a href="my-bets.html" class="tab">My Bets</a>
        </div>
    </div>
    
    <div class="container">
        <div class="balance-bar">
            <span><i class="fas fa-wallet"></i> Balance</span>
            <span style="color:#00ff9d;font-weight:bold;font-size:18px;" id="balance-display">$0.00</span>
        </div>
        <div class="selector-bar">
            <select id="league-filter" class="league-select"><option value="all">All Leagues</option></select>
            <input type="text" id="search-input" class="search-input" placeholder="Search league or team..." oninput="filterMatches()">
        </div>
        <div class="debug-bar" id="debug-bar">
            <i class="fas fa-database"></i> <span id="debug-text">Loading from database...</span>
            <button class="refresh-btn" onclick="loadAllMatches()"><i class="fas fa-sync-alt"></i> Refresh</button>
        </div>
        <div id="matches-container"><div style="text-align:center;padding:30px;">Loading matches...</div></div>
    </div>
    
    <div class="bet-slip" id="bet-slip" style="display:none;">
        <div class="slip-header">
            <span class="slip-title"><i class="fas fa-layer-group"></i> Bet Slip (<span id="slip-count">0</span>)</span>
            <span class="slip-clear" onclick="clearSlip()"><i class="fas fa-trash"></i> Clear</span>
        </div>
        <div id="slip-items"></div>
        <div class="slip-total"><span>Total Odds:</span><span class="slip-total-odds" id="slip-total-odds">1.00</span></div>
        <button class="slip-place-btn" id="place-acc-btn" disabled onclick="placeAccumulator()">Add 2+ Selections</button>
    </div>

    <script src="../js/supabase-client.js"></script>
    <script src="../js/betting-engine.js"></script>
    <script>
        function toggleLanguage() {
            var isEn = document.querySelector('.en')?.style.display !== 'none';
            if(document.querySelector('.en')){
                document.querySelectorAll('.en').forEach(el => el.style.display = isEn ? 'none' : '');
                document.querySelectorAll('.ar').forEach(el => el.style.display = isEn ? '' : 'none');
                document.documentElement.dir = isEn ? 'rtl' : 'ltr';
                localStorage.setItem('lang', isEn ? 'ar' : 'en');
            }
        }
        
        const firebaseConfig = { apiKey:"AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM", authDomain:"x-bet-prod-jd.firebaseapp.com", projectId:"x-bet-prod-jd", storageBucket:"x-bet-prod-jd.firebasestorage.app", messagingSenderId:"499334334535", appId:"1:499334334535:web:bebc1bf817e24d9e3c4962" };
        if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        
        let allMatches=[], countdownInterval, selectedLeague='all', accSlip=[];
        
        firebase.auth().onAuthStateChanged(u => { if(!u) location.href='../login.html'; else init(); });
        
        async function init(){
            await loadBalance();
            await loadLeaguesFilter();
            await loadAllMatches();
        }
        
        async function loadBalance(){
            try {
                const db = firebase.firestore();
                const w = await db.collection('wallets').doc(firebase.auth().currentUser.uid).get();
                document.getElementById('balance-display').textContent = '$' + (w.exists ? (w.data().balance||0) : 0).toFixed(2);
            } catch(e){}
        }
        
        async function loadLeaguesFilter(){
            const select=document.getElementById('league-filter');
            try {
                const r = await fetch('https://millioner.onrender.com/api/leagues');
                const d = await r.json();
                if(d.success && d.data){
                    d.data.sort((a,b)=>(a.name||'').localeCompare(b.name||''));
                    d.data.forEach(l => { if(l.name){ const o=document.createElement('option'); o.value=l.id; o.textContent=l.name; select.appendChild(o); } });
                }
            } catch(e){}
            select.onchange = function(){ selectedLeague=this.value; filterMatches(); };
        }
        
        async function loadAllMatches(){
            if(!window.supaDB) return;
            
            // 🔥 LIGHTWEIGHT: Single Supabase call, no API loading
            const now = new Date();
            now.setHours(0, 0, 0, 0);
            const nextWeek = new Date(now);
            nextWeek.setDate(now.getDate() + 7);
            
            allMatches = await window.supaDB.getUpcomingByDate(now, nextWeek);
            
            document.getElementById('debug-text').textContent = `Loaded ${allMatches.length} matches from database`;
            filterMatches();
        }
        
        function filterMatches(){
            const container=document.getElementById('matches-container');
            const search = (document.getElementById('search-input').value || '').toLowerCase();
            
            let filtered = allMatches;
            if(selectedLeague !== 'all') filtered = filtered.filter(m => m.league_id == selectedLeague);
            if(search) filtered = filtered.filter(m => {
                const hn=(m.home_team?.name||'').toLowerCase(), an=(m.away_team?.name||'').toLowerCase();
                return hn.includes(search)||an.includes(search);
            });
            
            if(filtered.length===0){ 
                container.innerHTML='<div class="empty-state"><i class="fas fa-calendar"></i><p>No matches found</p></div>'; 
                return; 
            }
            
            // 🔥 DYNAMIC DATE GROUPING - Auto-calculates Today/Tomorrow
            const dateGrouped = {};
            filtered.forEach(m => {
                const d = new Date(m.start_time);
                const dateKey = d.toDateString();
                if(!dateGrouped[dateKey]) dateGrouped[dateKey] = [];
                dateGrouped[dateKey].push(m);
            });
            
            const today = new Date(); today.setHours(0,0,0,0);
            const tomorrow = new Date(today); tomorrow.setDate(today.getDate()+1);
            
            container.innerHTML = '';
            Object.keys(dateGrouped).sort().forEach(dateKey => {
                const date = new Date(dateKey);
                let label = date.toLocaleDateString('en-US', {weekday:'long', month:'short', day:'numeric'});
                if(date.toDateString() === today.toDateString()) label = '📅 TODAY - ' + label;
                else if(date.toDateString() === tomorrow.toDateString()) label = '📅 TOMORROW - ' + label;
                
                const section = document.createElement('div'); section.className = 'date-section';
                section.innerHTML = `<div class="date-header" onclick="this.classList.toggle('collapsed');this.nextElementSibling.classList.toggle('collapsed');"><span>${label}</span><span style="font-size:11px;color:#a0a8c9;">${dateGrouped[dateKey].length}</span><i class="fas fa-chevron-down"></i></div><div class="date-matches">${dateGrouped[dateKey].map(m => createMatchRow(m)).join('')}</div>`;
                container.appendChild(section);
            });
            
            startCountdowns(filtered);
        }
        
        function createMatchRow(m){
            const time=new Date(m.start_time);
            const hn=m.home_team?.name||'Home', an=m.away_team?.name||'Away';
            const hl=m.home_team?.logo||'', al=m.away_team?.logo||'';
            const odds=m.odds||{};
            return `<div class="match-row">
                <div class="match-time-col"><div class="time">${time.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div><div class="countdown" id="cd-${m.fixture_id}">--:--:--</div></div>
                <div class="team-col">${hl?`<img src="${hl}" onerror="this.style.display='none'">`:''}<span class="names">${hn} <span class="vs">vs</span> ${an}</span>${al?`<img src="${al}" onerror="this.style.display='none'">`:''}</div>
                <div class="odds-col">
                    <div class="odd-mini" onclick="event.stopPropagation();addToSlip(${m.fixture_id},'${hn.replace(/'/g,"\\'")}','${an.replace(/'/g,"\\'")}','home',${odds.home||2.00})">1 <span>${odds.home||'2.00'}</span></div>
                    <div class="odd-mini" onclick="event.stopPropagation();addToSlip(${m.fixture_id},'${hn.replace(/'/g,"\\'")}','${an.replace(/'/g,"\\'")}','draw',${odds.draw||3.50})">X <span>${odds.draw||'3.50'}</span></div>
                    <div class="odd-mini" onclick="event.stopPropagation();addToSlip(${m.fixture_id},'${hn.replace(/'/g,"\\'")}','${an.replace(/'/g,"\\'")}','away',${odds.away||3.80})">2 <span>${odds.away||'3.80'}</span></div>
                </div>
                <button class="bet-btn" onclick="event.stopPropagation();goToMatch(${m.fixture_id})">Bet</button>
                <button class="slip-btn" onclick="event.stopPropagation();showAccumulatorPopup(${m.fixture_id},'${hn.replace(/'/g,"\\'")}','${an.replace(/'/g,"\\'")}',${odds.home||2.00},${odds.draw||3.50},${odds.away||3.80})">+Slip</button>
            </div>`;
        }
        
        function addToSlip(fixtureId, homeName, awayName, betType, odds){
            const typeNames = { home: 'Home Win', draw: 'Draw', away: 'Away Win' };
            if(accSlip.some(s => s.fixtureId === fixtureId)){ alert('Already in slip'); return; }
            accSlip.push({ fixtureId, matchName: `${homeName} vs ${awayName}`, betType, betTypeName: typeNames[betType], odds: parseFloat(odds) });
            updateSlipUI();
        }
        
        function updateSlipUI(){
            const slip=document.getElementById('bet-slip');
            if(accSlip.length===0){slip.style.display='none';return;}
            slip.style.display='block';
            document.getElementById('slip-count').textContent=accSlip.length;
            let items='',totalOdds=1;
            accSlip.forEach((s,i)=>{totalOdds*=s.odds;items+=`<div class="slip-item"><span>${s.betTypeName} - ${s.matchName} @${s.odds.toFixed(2)}</span><span class="slip-remove" onclick="removeFromSlip(${i})"><i class="fas fa-times"></i></span></div>`;});
            document.getElementById('slip-items').innerHTML=items;
            document.getElementById('slip-total-odds').textContent=totalOdds.toFixed(2);
            document.getElementById('place-acc-btn').disabled=accSlip.length<2;
            document.getElementById('place-acc-btn').textContent=accSlip.length<2?'Add 2+':'Place Accumulator';
        }
        
        function removeFromSlip(index){ accSlip.splice(index,1); updateSlipUI(); }
        function clearSlip(){ accSlip=[]; updateSlipUI(); }
        
        async function placeAccumulator(){
            if(accSlip.length<2)return;
            const amount=parseFloat(prompt('Stake ($):','10'));
            if(!amount||amount<1)return;
            try{const r=await placeAccumulatorBet(accSlip,amount);if(r.success){alert('✅ Placed!');clearSlip();location.href='my-bets.html';}else alert(r.error);}
            catch(e){alert('Error');}
        }
        
        function goToMatch(id){ location.href=`match-details.html?id=${id}`; }
        
        function startCountdowns(matches){
            if(countdownInterval)clearInterval(countdownInterval);
            countdownInterval=setInterval(()=>{matches.forEach(m=>{const el=document.getElementById('cd-'+m.fixture_id);if(el){const diff=new Date(m.start_time)-new Date();if(diff<=0){el.textContent='Starting';el.style.color='#ff9800';}else{const h=Math.floor(diff/3600000),mn=Math.floor((diff%3600000)/60000),s=Math.floor((diff%60000)/1000);el.textContent=`${h.padStart(2,'0')}:${mn.padStart(2,'0')}:${s.padStart(2,'0')}`;el.style.color='#a0a8c9';}}});},1000);
        }
        
        window.loadAllMatches=loadAllMatches;
        window.addToSlip=addToSlip;
        window.removeFromSlip=removeFromSlip;
        window.clearSlip=clearSlip;
        window.placeAccumulator=placeAccumulator;
        window.updateSlipUI=updateSlipUI;
        window.addEventListener('beforeunload',()=>{if(countdownInterval)clearInterval(countdownInterval);});
    </script>
</body>
</html>
