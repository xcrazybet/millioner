<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Upcoming - X Lodon</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="../css/sports-betting.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0f1a; color: white; font-family: 'Segoe UI', sans-serif; min-height: 100vh; }
        .header { background: #111827; padding: 12px 15px; border-bottom: 2px solid #00ff9d; position: sticky; top: 0; z-index: 100; }
        .header-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .back-btn { color: #00ff9d; text-decoration: none; font-size: 20px; }
        .header h1 { font-size: 18px; color: white; }
        .tabs { display: flex; gap: 5px; overflow-x: auto; white-space: nowrap; padding-bottom: 3px; }
        .tab { padding: 8px 12px; background: #1a2332; border-radius: 20px; color: white; text-decoration: none; font-size: 12px; }
        .tab.active { background: #00ff9d; color: black; }
        .container { max-width: 1200px; margin: 0 auto; padding: 15px; }
        .filter-bar { margin-bottom: 15px; }
        .filter-select { width: 100%; padding: 14px; background: #111827; border: 1px solid #ffffff22; border-radius: 10px; color: white; font-size: 14px; }
        .date-section { margin-bottom: 25px; }
        .date-header { color: #00ff9d; font-size: 16px; font-weight: 600; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #00ff9d33; display: flex; justify-content: space-between; align-items: center; }
        .match-card { background: #111827; border-radius: 12px; padding: 15px; margin-bottom: 10px; border-left: 4px solid #00ff9d; cursor: pointer; transition: transform 0.2s; }
        .match-card:hover { transform: translateX(5px); }
        .match-league { color: #a0a8c9; font-size: 12px; margin-bottom: 8px; display: flex; align-items: center; gap: 5px; }
        .match-teams { display: flex; align-items: center; justify-content: space-around; margin: 12px 0; }
        .team { text-align: center; flex: 1; }
        .team-name { font-weight: 600; font-size: 15px; }
        .vs { color: #ff9800; font-weight: bold; font-size: 14px; }
        .match-time-box { background: #1a2332; border-radius: 8px; padding: 10px; margin-top: 12px; }
        .countdown { display: flex; align-items: center; justify-content: center; gap: 10px; }
        .countdown-label { color: #a0a8c9; font-size: 12px; }
        .countdown-value { color: #00ff9d; font-size: 20px; font-weight: bold; }
        .match-datetime { color: #a0a8c9; font-size: 11px; text-align: center; margin-top: 5px; }
        .odds-section { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
        .odd-item { background: #0a0f1a; padding: 10px 5px; border-radius: 8px; text-align: center; }
        .odd-label { font-size: 11px; color: #a0a8c9; }
        .odd-value { font-size: 16px; font-weight: bold; color: #00ff9d; }
        .empty-state { text-align: center; padding: 50px 20px; color: #a0a8c9; }
        .empty-state i { font-size: 48px; opacity: 0.3; margin-bottom: 15px; }
        .refresh-badge { font-size: 11px; color: #a0a8c9; text-align: right; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-top">
            <a href="betting-sport.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
            <h1><i class="fas fa-futbol"></i> X Lodon Sports</h1>
        </div>
        <div class="tabs">
            <a href="betting-sport.html" class="tab">Home</a>
            <a href="live-matches.html" class="tab">Live <span id="live-badge">0</span></a>
            <a href="upcoming-matches.html" class="tab active">Upcoming <span id="upcoming-count">0</span></a>
            <a href="finished-matches.html" class="tab">Results</a>
            <a href="my-bets.html" class="tab">My Bets</a>
        </div>
    </div>
    
    <div class="container">
        <div class="filter-bar">
            <select id="league-filter" class="filter-select">
                <option value="all">🏆 All Leagues</option>
            </select>
        </div>
        
        <div id="matches-container"></div>
        <div id="empty-state" class="empty-state" style="display:none;">
            <i class="far fa-calendar-alt"></i>
            <p>No upcoming matches in the next 7 days</p>
            <small style="color:#a0a8c9;">Check back later for new fixtures</small>
        </div>
        <div class="refresh-badge" id="update-timer">Updates every 7s</div>
    </div>
    
    <script src="../js/sports-api.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), db = firebase.firestore();
        
        let allMatches = [], leagues = new Set(), countdownInterval, countdownSeconds = 7;
        
        auth.onAuthStateChanged(u => { if (!u) location.href = '../login.html'; else loadData(); });
        
        async function loadData() {
            const liveSnap = await db.collection('sports_matches').where('status', '==', 'live').get();
            document.getElementById('live-badge').textContent = liveSnap.size;
            loadMatches();
        }
        
        function loadMatches() {
            const now = new Date();
            const nextWeek = new Date(now);
            nextWeek.setDate(now.getDate() + 7);
            nextWeek.setHours(23, 59, 59, 999);
            
            db.collection('sports_matches')
                .where('status', '==', 'upcoming')
                .where('startTime', '>=', now)
                .where('startTime', '<=', nextWeek)
                .orderBy('startTime', 'asc')
                .onSnapshot(snap => {
                    allMatches = []; leagues.clear();
                    
                    snap.forEach(d => {
                        const m = d.data();
                        if (m.isRealData !== false) {
                            allMatches.push(m);
                            if (m.leagueName) leagues.add(m.leagueName);
                        }
                    });
                    
                    document.getElementById('upcoming-count').textContent = allMatches.length;
                    
                    const container = document.getElementById('matches-container');
                    const empty = document.getElementById('empty-state');
                    
                    if (allMatches.length === 0) {
                        container.style.display = 'none';
                        empty.style.display = 'block';
                    } else {
                        container.style.display = 'block';
                        empty.style.display = 'none';
                        populateFilter();
                        displayMatches();
                    }
                    
                    countdownSeconds = 7;
                });
        }
        
        function populateFilter() {
            const select = document.getElementById('league-filter');
            select.innerHTML = '<option value="all">🏆 All Leagues</option>';
            Array.from(leagues).sort().forEach(l => {
                const opt = document.createElement('option');
                opt.value = l;
                opt.textContent = l;
                select.appendChild(opt);
            });
            select.onchange = () => displayMatches();
        }
        
        function displayMatches() {
            const filter = document.getElementById('league-filter').value;
            const filtered = filter === 'all' ? allMatches : allMatches.filter(m => m.leagueName === filter);
            
            const container = document.getElementById('matches-container');
            const grouped = {};
            
            filtered.forEach(m => {
                const d = m.startTime.toDate();
                const key = d.toDateString();
                if (!grouped[key]) grouped[key] = [];
                grouped[key].push(m);
            });
            
            container.innerHTML = '';
            
            Object.keys(grouped).forEach(key => {
                const date = new Date(key);
                const today = new Date(); today.setHours(0,0,0,0);
                const tomorrow = new Date(today); tomorrow.setDate(today.getDate()+1);
                
                let label = date.toLocaleDateString('en-US', {weekday:'long', month:'short', day:'numeric'});
                if (date.toDateString() === today.toDateString()) label = '📅 TODAY • ' + label;
                else if (date.toDateString() === tomorrow.toDateString()) label = '📅 TOMORROW • ' + label;
                
                const section = document.createElement('div');
                section.className = 'date-section';
                section.innerHTML = `
                    <div class="date-header">
                        <span><i class="far fa-calendar-alt"></i> ${label}</span>
                        <span style="font-size:13px; color:#a0a8c9;">${grouped[key].length} match${grouped[key].length>1?'es':''}</span>
                    </div>
                `;
                
                grouped[key].forEach(m => section.appendChild(createCard(m)));
                container.appendChild(section);
            });
            
            startCountdown();
        }
        
        function createCard(m) {
            const card = document.createElement('div');
            card.className = 'match-card';
            card.onclick = () => location.href = `match-details.html?id=${m.fixtureId}`;
            
            const time = m.startTime.toDate();
            const id = `cd-${m.fixtureId}`;
            
            card.innerHTML = `
                <div class="match-league">
                    <i class="fas fa-trophy" style="color:#ff9800;"></i> ${m.leagueName||'League'}
                </div>
                <div class="match-teams">
                    <div class="team"><span class="team-name">${m.homeTeam?.name||'Home'}</span></div>
                    <div class="vs">VS</div>
                    <div class="team"><span class="team-name">${m.awayTeam?.name||'Away'}</span></div>
                </div>
                <div class="match-time-box">
                    <div class="countdown">
                        <span class="countdown-label"><i class="far fa-clock"></i> Starts in</span>
                        <span class="countdown-value" id="${id}">--:--:--</span>
                    </div>
                    <div class="match-datetime">
                        ${time.toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric'})} • ${time.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}
                    </div>
                </div>
                <div class="odds-section">
                    <div class="odd-item"><div class="odd-label">Home</div><div class="odd-value">${m.odds?.home?.toFixed(2)||'2.00'}</div></div>
                    <div class="odd-item"><div class="odd-label">Draw</div><div class="odd-value">${m.odds?.draw?.toFixed(2)||'3.50'}</div></div>
                    <div class="odd-item"><div class="odd-label">Away</div><div class="odd-value">${m.odds?.away?.toFixed(2)||'3.80'}</div></div>
                </div>
            `;
            return card;
        }
        
        function startCountdown() {
            if (countdownInterval) clearInterval(countdownInterval);
            
            countdownInterval = setInterval(() => {
                allMatches.forEach(m => {
                    const el = document.getElementById(`cd-${m.fixtureId}`);
                    if (el) {
                        const diff = m.startTime.toDate() - new Date();
                        if (diff <= 0) {
                            el.textContent = 'Starting';
                            setTimeout(() => loadMatches(), 1000);
                        } else {
                            const h = Math.floor(diff / 3600000);
                            const m = Math.floor((diff % 3600000) / 60000);
                            const s = Math.floor((diff % 60000) / 1000);
                            el.textContent = `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
                        }
                    }
                });
                
                countdownSeconds--;
                if (countdownSeconds <= 0) countdownSeconds = 7;
                document.getElementById('update-timer').textContent = `Next update: ${countdownSeconds}s`;
            }, 1000);
        }
        
        setInterval(() => { if (typeof syncNow === 'function') syncNow(); }, 7000);
        window.addEventListener('beforeunload', () => { if (countdownInterval) clearInterval(countdownInterval); });
    </script>
</body>
</html>
