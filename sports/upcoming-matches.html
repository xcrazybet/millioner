<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Upcoming Matches - X Lodon Betting</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="../css/sports-betting.css">
    <style>body { background: #0a0f1a; color: white; min-height: 100vh; margin: 0; font-family: 'Segoe UI', 'Roboto', sans-serif; } .container { max-width: 1200px; margin: 0 auto; padding: 15px; } .page-header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; } .back-btn { width: 40px; height: 40px; background: #111827; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #00ff9d; text-decoration: none; font-size: 18px; border: 1px solid rgba(255, 255, 255, 0.1); } .page-title { font-size: 22px; font-weight: 700; color: #00ff9d; display: flex; align-items: center; gap: 10px; } .league-select { width: 100%; padding: 15px; background: #111827; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px; color: white; font-size: 16px; margin-bottom: 20px; } .date-group { margin-bottom: 25px; } .date-header { color: #00ff9d; font-size: 16px; font-weight: 600; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid rgba(0, 255, 157, 0.2); }</style>
</head>
<body>
    <header class="sports-header">
        <h1><i class="fas fa-futbol"></i> X Lodon Sports</h1>
        <div class="sports-tabs">
            <a href="betting-sport.html" class="sports-tab"><i class="fas fa-home"></i> Home</a>
            <a href="live-matches.html" class="sports-tab"><i class="fas fa-circle" style="color: #ff5252; font-size: 10px;"></i> Live</a>
            <a href="upcoming-matches.html" class="sports-tab active"><i class="fas fa-calendar"></i> Upcoming <span class="badge" id="upcoming-count">0</span></a>
            <a href="finished-matches.html" class="sports-tab"><i class="fas fa-check-circle"></i> Results</a>
            <a href="my-bets.html" class="sports-tab"><i class="fas fa-ticket-alt"></i> My Bets</a>
        </div>
    </header>
    <div class="container">
        <div class="page-header"><a href="betting-sport.html" class="back-btn"><i class="fas fa-arrow-left"></i></a><div class="page-title"><i class="fas fa-calendar"></i> Upcoming Matches</div></div>
        <select id="league-filter" class="league-select"><option value="all">All Leagues</option></select>
        <div id="matches-container"><div class="loading-spinner"><div class="spinner"></div><p>Loading upcoming matches...</p></div></div>
        <div id="empty-state" class="empty-state" style="display: none;"><i class="fas fa-calendar"></i><p>No upcoming matches found</p><small>Check back later for new fixtures</small></div>
    </div>
    <nav style="display: flex; justify-content: space-around; background: #111827; padding: 12px; border-top: 1px solid rgba(0, 255, 157, 0.2); margin-top: 30px;">
        <a href="../index.html" style="color: #a0a8c9; text-decoration: none;"><i class="fas fa-home"></i> Home</a>
        <a href="../games.html" style="color: #a0a8c9; text-decoration: none;"><i class="fas fa-gamepad"></i> Casino</a>
        <a href="betting-sport.html" style="color: #00ff9d; text-decoration: none;"><i class="fas fa-futbol"></i> Sports</a>
        <a href="../dashboard.html" style="color: #a0a8c9; text-decoration: none;"><i class="fas fa-user"></i> Account</a>
    </nav>
    <script>
        const firebaseConfig = { apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM", authDomain: "x-bet-prod-jd.firebaseapp.com", projectId: "x-bet-prod-jd", storageBucket: "x-bet-prod-jd.firebasestorage.app", messagingSenderId: "499334334535", appId: "1:499334334535:web:bebc1bf817e24d9e3c4962" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), db = firebase.firestore(); let allMatches = [], leagues = new Set(), unsubscribe = null;
        auth.onAuthStateChanged((user) => { if (!user) { window.location.href = '../login.html'; return; } loadUpcomingMatches(); });
        function loadUpcomingMatches() { const container = document.getElementById('matches-container'), emptyState = document.getElementById('empty-state'), upcomingCount = document.getElementById('upcoming-count'); unsubscribe = db.collection('sports_matches').where('status', '==', 'upcoming').orderBy('startTime', 'asc').onSnapshot((snapshot) => { allMatches = []; leagues.clear(); snapshot.forEach(doc => { const match = doc.data(); allMatches.push(match); leagues.add(match.leagueName); }); upcomingCount.textContent = snapshot.size; if (snapshot.empty) { container.style.display = 'none'; emptyState.style.display = 'block'; } else { container.style.display = 'block'; emptyState.style.display = 'none'; populateLeagueFilter(); displayMatches(allMatches); } }, (error) => { console.error('Error loading matches:', error); container.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Error loading matches</p></div>'; }); }
        function populateLeagueFilter() { const select = document.getElementById('league-filter'); select.innerHTML = '<option value="all">All Leagues</option>'; Array.from(leagues).sort().forEach(league => { const option = document.createElement('option'); option.value = league; option.textContent = league; select.appendChild(option); }); select.addEventListener('change', (e) => { displayMatches(e.target.value === 'all' ? allMatches : allMatches.filter(m => m.leagueName === e.target.value)); }); }
        function displayMatches(matches) { const container = document.getElementById('matches-container'), grouped = {}; matches.forEach(match => { const dateKey = match.startTime.toDate().toDateString(); if (!grouped[dateKey]) grouped[dateKey] = []; grouped[dateKey].push(match); }); container.innerHTML = ''; Object.keys(grouped).forEach(dateKey => { const dateGroup = document.createElement('div'); dateGroup.className = 'date-group'; const date = new Date(dateKey), today = new Date(), tomorrow = new Date(today); tomorrow.setDate(tomorrow.getDate() + 1); let dateLabel = date.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' }); if (date.toDateString() === today.toDateString()) dateLabel = 'Today - ' + dateLabel; else if (date.toDateString() === tomorrow.toDateString()) dateLabel = 'Tomorrow - ' + dateLabel; dateGroup.innerHTML = `<div class="date-header"><i class="fas fa-calendar-day"></i> ${dateLabel}</div>`; grouped[dateKey].forEach(match => { dateGroup.appendChild(createUpcomingMatchCard(match)); }); container.appendChild(dateGroup); }); }
        function createUpcomingMatchCard(match) { const card = document.createElement('div'); card.className = 'match-card upcoming'; card.onclick = () => window.location.href = `match-details.html?id=${match.fixtureId}`; const timeStr = match.startTime.toDate().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); card.innerHTML = `<div class="match-header"><div class="match-league"><i class="fas fa-trophy"></i> ${match.leagueName || 'League'}</div><div class="match-time upcoming">${timeStr}</div></div><div class="match-body"><div class="team"><div class="team-logo">${match.homeTeam.name.substring(0, 3).toUpperCase()}</div><div class="team-name">${match.homeTeam.name}</div></div><div class="vs-badge">VS</div><div class="team"><div class="team-logo">${match.awayTeam.name.substring(0, 3).toUpperCase()}</div><div class="team-name">${match.awayTeam.name}</div></div></div><div class="odds-section"><div class="odd-button"><div class="odd-label">Home</div><div class="odd-value">${match.odds?.home?.toFixed(2) || '2.00'}</div></div><div class="odd-button"><div class="odd-label">Draw</div><div class="odd-value">${match.odds?.draw?.toFixed(2) || '3.50'}</div></div><div class="odd-button"><div class="odd-label">Away</div><div class="odd-value">${match.odds?.away?.toFixed(2) || '3.80'}</div></div></div>`; return card; }
        window.addEventListener('beforeunload', () => { if (unsubscribe) unsubscribe(); });
    </script>
    <script src="../js/proxy.js"></script>
    <script src="../js/sports-api.js"></script>
</body>
</html>
