<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>X Lodon Sports</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="../css/sports-betting.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0f1a; color: white; font-family: 'Segoe UI', sans-serif; min-height: 100vh; }
        .header { background: linear-gradient(135deg, #111827, #0a0f1a); padding: 12px 15px; border-bottom: 2px solid #00ff9d; position: sticky; top: 0; z-index: 100; }
        .user-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .user-avatar { width: 40px; height: 40px; background: #00ff9d33; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #00ff9d; }
        .user-name { font-weight: 600; font-size: 14px; }
        .balance-badge { background: #00ff9d22; padding: 8px 15px; border-radius: 25px; border: 1px solid #00ff9d; }
        .balance-amount { color: #00ff9d; font-weight: 700; font-size: 18px; }
        .tabs { display: flex; gap: 5px; overflow-x: auto; white-space: nowrap; padding-bottom: 5px; }
        .tab { padding: 10px 15px; background: #1a2332; border-radius: 25px; color: white; text-decoration: none; font-size: 13px; }
        .tab.active { background: #00ff9d; color: black; }
        .container { max-width: 1200px; margin: 0 auto; padding: 15px; }
        .quick-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 15px 0; }
        .quick-card { background: #111827; padding: 15px 10px; border-radius: 12px; text-align: center; text-decoration: none; color: white; border: 1px solid #ffffff11; }
        .quick-card i { font-size: 24px; color: #00ff9d; margin-bottom: 5px; }
        .quick-card .count { font-size: 20px; font-weight: bold; color: #00ff9d; }
        .section-title { display: flex; justify-content: space-between; align-items: center; margin: 20px 0 15px; }
        .section-title h3 { color: #00ff9d; font-size: 18px; }
        .section-title a { color: #a0a8c9; text-decoration: none; font-size: 14px; }
        .match-card { background: #111827; border-radius: 12px; padding: 12px; margin-bottom: 10px; border-left: 4px solid #00ff9d; cursor: pointer; }
        .match-card.live { border-left-color: #ff5252; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%,100% { border-left-color: #ff5252; } 50% { border-left-color: #ff525255; } }
        .match-league { color: #a0a8c9; font-size: 12px; margin-bottom: 5px; }
        .match-teams { display: flex; align-items: center; justify-content: space-between; }
        .team { font-weight: 600; font-size: 14px; }
        .score { font-size: 18px; font-weight: bold; }
        .match-time { font-size: 12px; color: #00ff9d; }
        .live-badge { background: #ff5252; color: white; padding: 2px 8px; border-radius: 20px; font-size: 11px; }
        .bottom-nav { display: flex; justify-content: space-around; background: #111827; padding: 12px; position: sticky; bottom: 0; border-top: 1px solid #00ff9d33; }
        .nav-item { color: #a0a8c9; text-decoration: none; text-align: center; font-size: 12px; }
        .nav-item.active { color: #00ff9d; }
        .nav-item i { font-size: 20px; display: block; margin-bottom: 3px; }
        .empty-state { text-align: center; padding: 20px; color: #a0a8c9; }
    </style>
</head>
<body>
    <div class="header">
        <div class="user-bar">
            <div class="user-info">
                <div class="user-avatar"><i class="fas fa-user"></i></div>
                <div>
                    <div class="user-name" id="user-name">Loading...</div>
                    <div style="font-size: 11px; color: #a0a8c9;" id="user-email"></div>
                </div>
            </div>
            <div class="balance-badge">
                <i class="fas fa-wallet" style="margin-right: 5px;"></i>
                <span class="balance-amount" id="balance-display">$0.00</span>
            </div>
        </div>
        <div class="tabs">
            <a href="betting-sport.html" class="tab active"><i class="fas fa-home"></i> Home</a>
            <a href="live-matches.html" class="tab"><i class="fas fa-play"></i> Live <span id="live-count">0</span></a>
            <a href="upcoming-matches.html" class="tab"><i class="fas fa-calendar"></i> Upcoming</a>
            <a href="finished-matches.html" class="tab"><i class="fas fa-check"></i> Results</a>
            <a href="my-bets.html" class="tab"><i class="fas fa-ticket"></i> My Bets</a>
        </div>
    </div>
    
    <div class="container">
        <div class="quick-cards">
            <a href="live-matches.html" class="quick-card">
                <i class="fas fa-play-circle"></i>
                <div class="count" id="quick-live">0</div>
                <small>Live Now</small>
            </a>
            <a href="upcoming-matches.html" class="quick-card">
                <i class="fas fa-calendar"></i>
                <div class="count" id="quick-upcoming">0</div>
                <small>Upcoming</small>
            </a>
            <a href="my-bets.html" class="quick-card">
                <i class="fas fa-ticket-alt"></i>
                <div class="count" id="quick-active">0</div>
                <small>Active Bets</small>
            </a>
        </div>
        
        <div class="section-title">
            <h3><i class="fas fa-circle" style="color: #ff5252; font-size: 10px;"></i> Live Matches</h3>
            <a href="live-matches.html">View All <i class="fas fa-arrow-right"></i></a>
        </div>
        <div id="live-container"></div>
        
        <div class="section-title">
            <h3><i class="fas fa-calendar"></i> Upcoming Matches</h3>
            <a href="upcoming-matches.html">View All <i class="fas fa-arrow-right"></i></a>
        </div>
        <div id="upcoming-container"></div>
    </div>
    
    <div class="bottom-nav">
        <a href="../index.html" class="nav-item"><i class="fas fa-home"></i><span>Home</span></a>
        <a href="../games.html" class="nav-item"><i class="fas fa-gamepad"></i><span>Casino</span></a>
        <a href="betting-sport.html" class="nav-item active"><i class="fas fa-futbol"></i><span>Sports</span></a>
        <a href="../dashboard.html" class="nav-item"><i class="fas fa-user"></i><span>Account</span></a>
    </div>
    
    <script src="../js/sports-api.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), db = firebase.firestore();
        
        auth.onAuthStateChanged(async u => {
            if (!u) { location.href = '../login.html'; return; }
            
            document.getElementById('user-name').textContent = u.displayName || 'User';
            document.getElementById('user-email').textContent = u.email || '';
            
            const wallet = await db.collection('wallets').doc(u.uid).get();
            const balance = wallet.exists ? (wallet.data().balance || 0) : 0;
            document.getElementById('balance-display').textContent = `$${balance.toFixed(2)}`;
            
            loadCounts();
            loadLiveMatches();
            loadUpcomingMatches();
        });
        
        async function loadCounts() {
            const live = await db.collection('sports_matches').where('status', '==', 'live').get();
            const upcoming = await db.collection('sports_matches').where('status', '==', 'upcoming').where('startTime', '>=', new Date()).get();
            const active = await db.collection('bets').where('userId', '==', auth.currentUser.uid).where('status', '==', 'active').get();
            
            document.getElementById('live-count').textContent = live.size;
            document.getElementById('quick-live').textContent = live.size;
            document.getElementById('quick-upcoming').textContent = upcoming.size;
            document.getElementById('quick-active').textContent = active.size;
        }
        
        function loadLiveMatches() {
            db.collection('sports_matches').where('status', '==', 'live').limit(3).onSnapshot(snap => {
                const container = document.getElementById('live-container');
                const realMatches = [];
                snap.forEach(d => {
                    const m = d.data();
                    if (m.fixtureId < 1000000 && m.leagueId > 0 && m.homeTeam?.name !== 'Home') {
                        realMatches.push(m);
                    }
                });
                
                if (realMatches.length === 0) {
                    container.innerHTML = '<div class="empty-state"><i class="fas fa-futbol"></i><p>No live matches</p></div>';
                } else {
                    container.innerHTML = '';
                    realMatches.forEach(m => container.appendChild(createLiveCard(m)));
                }
                document.getElementById('live-count').textContent = realMatches.length;
                document.getElementById('quick-live').textContent = realMatches.length;
            });
        }
        
        function loadUpcomingMatches() {
            const nextWeek = new Date(); nextWeek.setDate(nextWeek.getDate() + 7);
            db.collection('sports_matches').where('status', '==', 'upcoming').where('startTime', '>=', new Date()).where('startTime', '<=', nextWeek).orderBy('startTime', 'asc').limit(5).onSnapshot(snap => {
                const container = document.getElementById('upcoming-container');
                const realMatches = [];
                snap.forEach(d => {
                    const m = d.data();
                    if (m.fixtureId < 1000000 && m.leagueId > 0) realMatches.push(m);
                });
                
                if (realMatches.length === 0) {
                    container.innerHTML = '<div class="empty-state"><i class="fas fa-calendar"></i><p>No upcoming matches</p></div>';
                } else {
                    container.innerHTML = '';
                    realMatches.forEach(m => container.appendChild(createUpcomingCard(m)));
                }
                document.getElementById('quick-upcoming').textContent = realMatches.length;
            });
        }
        
        function createLiveCard(m) {
            const card = document.createElement('div');
            card.className = 'match-card live';
            card.onclick = () => location.href = `match-details.html?id=${m.fixtureId}`;
            card.innerHTML = `
                <div class="match-league">${m.leagueName||''}</div>
                <div class="match-teams">
                    <span class="team">${m.homeTeam?.name||'Home'}</span>
                    <span class="score">${m.score?.home||0} - ${m.score?.away||0}</span>
                    <span class="team">${m.awayTeam?.name||'Away'}</span>
                </div>
                <div style="display:flex; justify-content:space-between; margin-top:5px;">
                    <span class="live-badge"><i class="fas fa-circle"></i> LIVE</span>
                </div>
            `;
            return card;
        }
        
        function createUpcomingCard(m) {
            const card = document.createElement('div');
            card.className = 'match-card';
            card.onclick = () => location.href = `match-details.html?id=${m.fixtureId}`;
            const time = m.startTime.toDate();
            const timeStr = time.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
            const dateStr = time.toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric'});
            card.innerHTML = `
                <div class="match-league">${m.leagueName||''}</div>
                <div class="match-teams">
                    <span class="team">${m.homeTeam?.name||'Home'}</span>
                    <span style="color:#ff9800;">VS</span>
                    <span class="team">${m.awayTeam?.name||'Away'}</span>
                </div>
                <div style="display:flex; justify-content:space-between; margin-top:5px;">
                    <span class="match-time"><i class="far fa-calendar"></i> ${dateStr}</span>
                    <span class="match-time"><i class="far fa-clock"></i> ${timeStr}</span>
                </div>
            `;
            return card;
        }
    </script>
</body>
</html>
