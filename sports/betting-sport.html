<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>X Lodon Sports Betting</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="../css/sports-betting.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0a0f1a; color: white; font-family: 'Segoe UI', sans-serif; min-height: 100vh; }
        .header { background: linear-gradient(135deg, #111827, #0a0f1a); padding: 12px 15px; border-bottom: 2px solid #00ff9d; position: sticky; top: 0; z-index: 100; }
        .user-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .user-avatar { width: 36px; height: 36px; background: #00ff9d33; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #00ff9d; }
        .user-name { font-weight: 600; font-size: 14px; }
        .balance-badge { background: #00ff9d22; padding: 8px 15px; border-radius: 25px; border: 1px solid #00ff9d; }
        .balance-amount { color: #00ff9d; font-weight: 700; font-size: 18px; }
        .tabs { display: flex; gap: 5px; overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch; padding-bottom: 5px; }
        .tab { padding: 10px 15px; background: #1a2332; border-radius: 25px; color: white; text-decoration: none; font-size: 13px; flex-shrink: 0; }
        .tab.active { background: #00ff9d; color: black; }
        .container { max-width: 1200px; margin: 0 auto; padding: 15px; }
        .quick-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 15px 0; }
        .quick-card { background: #111827; padding: 15px; border-radius: 12px; text-align: center; text-decoration: none; color: white; }
        .quick-card i { font-size: 24px; color: #00ff9d; margin-bottom: 5px; }
        .match-card { background: #111827; border-radius: 12px; padding: 15px; margin-bottom: 10px; border-left: 4px solid #00ff9d; cursor: pointer; }
        .match-card.live { border-left-color: #ff5252; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%,100% { border-left-color: #ff5252; } 50% { border-left-color: #ff525255; } }
        .section-title { color: #00ff9d; margin: 20px 0 15px; font-size: 18px; display: flex; align-items: center; gap: 10px; }
        .bottom-nav { display: flex; justify-content: space-around; background: #111827; padding: 12px; position: sticky; bottom: 0; border-top: 1px solid #00ff9d33; }
        .nav-item { color: #a0a8c9; text-decoration: none; text-align: center; font-size: 12px; }
        .nav-item.active { color: #00ff9d; }
        .nav-item i { font-size: 20px; display: block; margin-bottom: 3px; }
        
        @media (max-width: 480px) {
            .container { padding: 10px; }
            .tab { padding: 8px 12px; font-size: 12px; }
            .user-name { max-width: 120px; overflow: hidden; text-overflow: ellipsis; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="user-bar">
            <div class="user-info">
                <div class="user-avatar"><i class="fas fa-user"></i></div>
                <div>
                    <div class="user-name" id="user-name">Loading...</div>
                    <div style="font-size: 11px; color: #a0a8c9;" id="user-email"></div>
                </div>
            </div>
            <div class="balance-badge">
                <span style="font-size: 12px; color: #a0a8c9;"><i class="fas fa-wallet"></i></span>
                <span class="balance-amount" id="balance-display">$0.00</span>
            </div>
        </div>
        <div class="tabs">
            <a href="betting-sport.html" class="tab active"><i class="fas fa-home"></i> Home</a>
            <a href="live-matches.html" class="tab"><i class="fas fa-circle" style="color: #ff5252;"></i> Live <span id="live-count">0</span></a>
            <a href="upcoming-matches.html" class="tab"><i class="fas fa-calendar"></i> Upcoming <span id="upcoming-count">0</span></a>
            <a href="finished-matches.html" class="tab"><i class="fas fa-check-circle"></i> Results</a>
            <a href="my-bets.html" class="tab"><i class="fas fa-ticket-alt"></i> My Bets</a>
        </div>
    </div>
    
    <div class="container">
        <div class="quick-actions">
            <a href="live-matches.html" class="quick-card">
                <i class="fas fa-play-circle"></i>
                <div>Live Now</div>
                <small id="quick-live">0 matches</small>
            </a>
            <a href="upcoming-matches.html" class="quick-card">
                <i class="fas fa-calendar"></i>
                <div>Upcoming</div>
                <small id="quick-upcoming">0 matches</small>
            </a>
            <a href="my-bets.html" class="quick-card">
                <i class="fas fa-ticket-alt"></i>
                <div>My Bets</div>
                <small id="quick-active">0 active</small>
            </a>
        </div>
        
        <div class="section-title"><i class="fas fa-circle" style="color: #ff5252;"></i> Live Matches</div>
        <div id="live-container"></div>
        
        <div class="section-title"><i class="fas fa-calendar"></i> Upcoming Matches</div>
        <div id="upcoming-container"></div>
    </div>
    
    <div class="bottom-nav">
        <a href="../index.html" class="nav-item"><i class="fas fa-home"></i><span>Home</span></a>
        <a href="../games.html" class="nav-item"><i class="fas fa-gamepad"></i><span>Casino</span></a>
        <a href="betting-sport.html" class="nav-item active"><i class="fas fa-futbol"></i><span>Sports</span></a>
        <a href="../dashboard.html" class="nav-item"><i class="fas fa-user"></i><span>Account</span></a>
    </div>
    
    <script src="../js/sports-api.js"></script>
    <script src="../js/betting-engine.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), db = firebase.firestore();
        
        auth.onAuthStateChanged(async u => {
            if (!u) { location.href = '../login.html'; return; }
            
            document.getElementById('user-name').textContent = u.displayName || 'User';
            document.getElementById('user-email').textContent = u.email || '';
            
            const wallet = await db.collection('wallets').doc(u.uid).get();
            const balance = wallet.exists ? (wallet.data().balance || 0) : 0;
            document.getElementById('balance-display').textContent = `$${balance.toFixed(2)}`;
            
            loadCounts();
            loadMatches();
        });
        
        async function loadCounts() {
            const live = await db.collection('sports_matches').where('status', '==', 'live').get();
            const upcoming = await db.collection('sports_matches').where('status', '==', 'upcoming').where('startTime', '>=', new Date()).get();
            const active = await db.collection('bets').where('userId', '==', auth.currentUser.uid).where('status', '==', 'active').get();
            
            document.getElementById('live-count').textContent = live.size;
            document.getElementById('upcoming-count').textContent = upcoming.size;
            document.getElementById('quick-live').textContent = `${live.size} matches`;
            document.getElementById('quick-upcoming').textContent = `${upcoming.size} matches`;
            document.getElementById('quick-active').textContent = `${active.size} active`;
        }
        
        function loadMatches() {
            db.collection('sports_matches').where('status', '==', 'live').onSnapshot(snap => {
                const container = document.getElementById('live-container');
                if (snap.empty) {
                    container.innerHTML = '<p style="color:#a0a8c9; padding:20px; text-align:center;">No live matches</p>';
                } else {
                    container.innerHTML = '';
                    snap.forEach(d => container.appendChild(createCard(d.data())));
                }
                document.getElementById('live-count').textContent = snap.size;
            });
            
            const nextWeek = new Date(); nextWeek.setDate(nextWeek.getDate() + 7);
            db.collection('sports_matches').where('status', '==', 'upcoming').where('startTime', '>=', new Date()).where('startTime', '<=', nextWeek).orderBy('startTime', 'asc').limit(5).onSnapshot(snap => {
                const container = document.getElementById('upcoming-container');
                if (snap.empty) {
                    container.innerHTML = '<p style="color:#a0a8c9; padding:20px; text-align:center;">No upcoming matches</p>';
                } else {
                    container.innerHTML = '';
                    snap.forEach(d => container.appendChild(createCard(d.data())));
                }
                document.getElementById('upcoming-count').textContent = snap.size;
            });
        }
        
        function createCard(m) {
            const card = document.createElement('div');
            card.className = `match-card ${m.status}`;
            card.onclick = () => location.href = `match-details.html?id=${m.fixtureId}`;
            
            const time = m.status === 'live' ? '🔴 LIVE' : m.startTime.toDate().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
            
            card.innerHTML = `
                <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
                    <span style="color:#a0a8c9;">${m.leagueName||''}</span>
                    <span style="color:${m.status==='live'?'#ff5252':'#00ff9d'};">${time}</span>
                </div>
                <div style="display:flex; align-items:center; justify-content:space-around;">
                    <div style="text-align:center;"><strong>${m.homeTeam?.name||'Home'}</strong></div>
                    <div style="font-size:20px; font-weight:bold;">${m.status==='upcoming'?'VS':`${m.score?.home||0}-${m.score?.away||0}`}</div>
                    <div style="text-align:center;"><strong>${m.awayTeam?.name||'Away'}</strong></div>
                </div>
            `;
            return card;
        }
    </script>
</body>
</html>
