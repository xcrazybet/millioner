<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>X Lodon Sports Betting</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/sports-betting.css">
    
    <style>
        body {
            background: #0a0f1a;
            color: white;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', 'Roboto', sans-serif;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 15px;
        }
        
        .featured-section {
            margin-bottom: 30px;
        }
        
        .section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            font-size: 18px;
            font-weight: 700;
            color: #00ff9d;
        }
        
        .quick-links {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 30px;
        }
        
        .quick-link {
            background: #111827;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            text-decoration: none;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s;
        }
        
        .quick-link:hover {
            border-color: #00ff9d;
            transform: translateY(-2px);
        }
        
        .quick-link i {
            font-size: 32px;
            color: #00ff9d;
            margin-bottom: 10px;
        }
        
        .quick-link span {
            display: block;
            font-weight: 600;
        }
        
        .balance-bar {
            background: linear-gradient(135deg, #111827, #1a2332);
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #00ff9d;
        }
        
        .balance-label {
            color: #a0a8c9;
            font-size: 14px;
        }
        
        .balance-value {
            font-size: 28px;
            font-weight: 700;
            color: #00ff9d;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="sports-header">
        <h1>
            <i class="fas fa-futbol"></i>
            X Lodon Sports
        </h1>
        
        <!-- Tabs -->
        <div class="sports-tabs">
            <a href="index.html" class="sports-tab active">
                <i class="fas fa-home"></i>
                Home
            </a>
            <a href="live-matches.html" class="sports-tab">
                <i class="fas fa-circle" style="color: #ff5252; font-size: 10px;"></i>
                Live
                <span class="badge" id="live-count">0</span>
            </a>
            <a href="upcoming-matches.html" class="sports-tab">
                <i class="fas fa-calendar"></i>
                Upcoming
                <span class="badge" id="upcoming-count">0</span>
            </a>
            <a href="finished-matches.html" class="sports-tab">
                <i class="fas fa-check-circle"></i>
                Results
            </a>
            <a href="my-bets.html" class="sports-tab">
                <i class="fas fa-ticket-alt"></i>
                My Bets
            </a>
        </div>
    </header>
    
    <div class="container">
        <!-- Balance Display -->
        <div class="balance-bar">
            <div>
                <div class="balance-label">Available Balance</div>
                <div class="balance-value" id="balance-display">$0.00</div>
            </div>
            <i class="fas fa-wallet" style="font-size: 32px; color: #00ff9d; opacity: 0.5;"></i>
        </div>
        
        <!-- Quick Links -->
        <div class="quick-links">
            <a href="live-matches.html" class="quick-link">
                <i class="fas fa-play-circle"></i>
                <span>Live Now</span>
                <small id="quick-live-count" style="color: #a0a8c9;">0 matches</small>
            </a>
            <a href="upcoming-matches.html" class="quick-link">
                <i class="fas fa-clock"></i>
                <span>Upcoming</span>
                <small id="quick-upcoming-count" style="color: #a0a8c9;">0 matches</small>
            </a>
            <a href="my-bets.html" class="quick-link">
                <i class="fas fa-list"></i>
                <span>My Bets</span>
                <small id="quick-active-count" style="color: #a0a8c9;">0 active</small>
            </a>
        </div>
        
        <!-- Featured Live Matches -->
        <div class="featured-section">
            <div class="section-title">
                <i class="fas fa-circle" style="color: #ff5252; font-size: 12px;"></i>
                Live Matches
            </div>
            <div id="featured-live"></div>
        </div>
        
        <!-- Upcoming Matches -->
        <div class="featured-section">
            <div class="section-title">
                <i class="fas fa-calendar"></i>
                Upcoming Matches
            </div>
            <div id="featured-upcoming"></div>
        </div>
        
        <!-- Recent Results -->
        <div class="featured-section">
            <div class="section-title">
                <i class="fas fa-trophy"></i>
                Recent Results
            </div>
            <div id="recent-results"></div>
        </div>
    </div>
    
    <!-- Bottom Navigation -->
    <nav style="display: flex; justify-content: space-around; background: #111827; padding: 12px; border-top: 1px solid rgba(0, 255, 157, 0.2); margin-top: 30px;">
        <a href="../index.html" style="color: #a0a8c9; text-decoration: none;">
            <i class="fas fa-home"></i> Home
        </a>
        <a href="../games.html" style="color: #a0a8c9; text-decoration: none;">
            <i class="fas fa-gamepad"></i> Casino
        </a>
        <a href="index.html" style="color: #00ff9d; text-decoration: none;">
            <i class="fas fa-futbol"></i> Sports
        </a>
        <a href="../dashboard.html" style="color: #a0a8c9; text-decoration: none;">
            <i class="fas fa-user"></i> Account
        </a>
    </nav>
    
    <!-- Scripts -->
    <script src="../js/firebase-config.js"></script>
    <script src="../js/sports-api.js"></script>
    <script src="../js/wallet.js"></script>
    
    <script>
        // Firebase init
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        
        const auth = firebase.auth();
        const db = firebase.firestore();
        
        let currentUser = null;
        let userBalance = 0;
        
        // Auth check
        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = '../login.html';
                return;
            }
            currentUser = user;
            await loadBalance();
            loadCounts();
            loadFeaturedMatches();
        });
        
        async function loadBalance() {
            try {
                const doc = await db.collection('wallets').doc(currentUser.uid).get();
                if (doc.exists) {
                    userBalance = doc.data().balance || 0;
                    document.getElementById('balance-display').textContent = `$${userBalance.toFixed(2)}`;
                }
            } catch (error) {
                console.error('Error loading balance:', error);
            }
        }
        
        async function loadCounts() {
            try {
                // Live count
                const liveSnapshot = await db.collection('sports_matches')
                    .where('status', '==', 'live')
                    .get();
                const liveCount = liveSnapshot.size;
                document.getElementById('live-count').textContent = liveCount;
                document.getElementById('quick-live-count').textContent = `${liveCount} match${liveCount !== 1 ? 'es' : ''}`;
                
                // Upcoming count
                const upcomingSnapshot = await db.collection('sports_matches')
                    .where('status', '==', 'upcoming')
                    .get();
                const upcomingCount = upcomingSnapshot.size;
                document.getElementById('upcoming-count').textContent = upcomingCount;
                document.getElementById('quick-upcoming-count').textContent = `${upcomingCount} match${upcomingCount !== 1 ? 'es' : ''}`;
                
                // Active bets count
                const betsSnapshot = await db.collection('bets')
                    .where('userId', '==', currentUser.uid)
                    .where('status', '==', 'active')
                    .get();
                document.getElementById('quick-active-count').textContent = `${betsSnapshot.size} active`;
                
            } catch (error) {
                console.error('Error loading counts:', error);
            }
        }
        
        async function loadFeaturedMatches() {
            try {
                // Featured live (first 3)
                const liveSnapshot = await db.collection('sports_matches')
                    .where('status', '==', 'live')
                    .limit(3)
                    .get();
                
                const liveContainer = document.getElementById('featured-live');
                if (liveSnapshot.empty) {
                    liveContainer.innerHTML = '<div class="empty-state"><i class="fas fa-futbol"></i><p>No live matches</p></div>';
                } else {
                    liveContainer.innerHTML = '';
                    liveSnapshot.forEach(doc => {
                        const match = doc.data();
                        liveContainer.appendChild(createMatchCard(match));
                    });
                }
                
                // Upcoming (first 5)
                const upcomingSnapshot = await db.collection('sports_matches')
                    .where('status', '==', 'upcoming')
                    .orderBy('startTime')
                    .limit(5)
                    .get();
                
                const upcomingContainer = document.getElementById('featured-upcoming');
                if (upcomingSnapshot.empty) {
                    upcomingContainer.innerHTML = '<div class="empty-state"><i class="fas fa-calendar"></i><p>No upcoming matches</p></div>';
                } else {
                    upcomingContainer.innerHTML = '';
                    upcomingSnapshot.forEach(doc => {
                        const match = doc.data();
                        upcomingContainer.appendChild(createMatchCard(match));
                    });
                }
                
                // Recent results (last 3 finished)
                const finishedSnapshot = await db.collection('sports_matches')
                    .where('status', '==', 'finished')
                    .orderBy('updatedAt', 'desc')
                    .limit(3)
                    .get();
                
                const resultsContainer = document.getElementById('recent-results');
                if (finishedSnapshot.empty) {
                    resultsContainer.innerHTML = '<div class="empty-state"><i class="fas fa-trophy"></i><p>No recent results</p></div>';
                } else {
                    resultsContainer.innerHTML = '';
                    finishedSnapshot.forEach(doc => {
                        const match = doc.data();
                        resultsContainer.appendChild(createMatchCard(match));
                    });
                }
                
            } catch (error) {
                console.error('Error loading featured matches:', error);
            }
        }
        
        function createMatchCard(match) {
            const card = document.createElement('div');
            card.className = `match-card ${match.status}`;
            card.onclick = () => window.location.href = `match-details.html?id=${match.fixtureId}`;
            
            const timeDisplay = match.status === 'live' ? 
                `<span class="match-minute">LIVE</span>` :
                new Date(match.startTime.toDate()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            card.innerHTML = `
                <div class="match-header">
                    <div class="match-league">
                        <i class="fas fa-trophy"></i>
                        ${match.leagueName || 'League'}
                    </div>
                    <div class="match-time ${match.status}">${timeDisplay}</div>
                </div>
                <div class="match-body">
                    <div class="team">
                        <div class="team-logo">${match.homeTeam.name.substring(0, 3).toUpperCase()}</div>
                        <div class="team-name">${match.homeTeam.name}</div>
                    </div>
                    ${match.status === 'live' || match.status === 'finished' ? `
                        <div class="match-score">
                            <span class="score-display">${match.score?.home || 0}</span>
                            <span class="score-separator">-</span>
                            <span class="score-display">${match.score?.away || 0}</span>
                        </div>
                    ` : '<div class="vs-badge">VS</div>'}
                    <div class="team">
                        <div class="team-logo">${match.awayTeam.name.substring(0, 3).toUpperCase()}</div>
                        <div class="team-name">${match.awayTeam.name}</div>
                    </div>
                </div>
                ${match.status === 'upcoming' ? `
                    <div class="odds-section">
                        <div class="odd-button">
                            <div class="odd-label">Home</div>
                            <div class="odd-value">${match.odds?.home?.toFixed(2) || '2.00'}</div>
                        </div>
                        <div class="odd-button">
                            <div class="odd-label">Draw</div>
                            <div class="odd-value">${match.odds?.draw?.toFixed(2) || '3.50'}</div>
                        </div>
                        <div class="odd-button">
                            <div class="odd-label">Away</div>
                            <div class="odd-value">${match.odds?.away?.toFixed(2) || '3.80'}</div>
                        </div>
                    </div>
                ` : ''}
            `;
            
            return card;
        }
        
        // Real-time listeners
        db.collection('sports_matches').where('status', 'in', ['live', 'upcoming'])
            .onSnapshot(() => {
                loadCounts();
                loadFeaturedMatches();
            });
    </script>
</body>
</html>
