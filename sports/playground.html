<!DOCTYPE html>
<html>
<head>
    <title>Live Match Center - X Lodon</title>
    <style>
        /* Modern dark theme like Bet365 */
        :root {
            --bg: #0a0f1a;
            --card: #111827;
            --accent: #00ff9d;
            --danger: #ff4444;
        }
        
        .match-center {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 15px;
            padding: 15px;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .main-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .score-hero {
            background: var(--card);
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            border: 2px solid var(--danger);
        }
        
        .commentary-timeline {
            background: var(--card);
            border-radius: 16px;
            padding: 20px;
            max-height: 500px;
            overflow-y: auto;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        
        .odds-panel {
            background: var(--card);
            border-radius: 16px;
            padding: 20px;
            position: sticky;
            top: 15px;
        }
        
        .goal-animation {
            animation: goalFlash 0.5s ease;
        }
        
        @keyframes goalFlash {
            0% { color: #ff9800; text-shadow: 0 0 20px #ff9800; transform: scale(1.2); }
            100% { color: white; transform: scale(1); }
        }
        
        .odds-flash {
            animation: oddsChange 0.3s ease;
        }
        
        @keyframes oddsChange {
            0% { background: rgba(0,255,157,0.3); }
            100% { background: transparent; }
        }
    </style>
</head>
<body>
    <div class="match-center">
        <!-- Main Content -->
        <div class="main-panel">
            <!-- Score Hero -->
            <div class="score-hero" id="score-hero">
                <!-- Dynamic score display -->
            </div>
            
            <!-- Tabs: Commentary | Stats | Lineups | H2H -->
            <div class="tabs">
                <button onclick="showTab('commentary')">Live Commentary</button>
                <button onclick="showTab('stats')">Statistics</button>
                <button onclick="showTab('lineups')">Lineups</button>
                <button onclick="showTab('h2h')">H2H</button>
            </div>
            
            <!-- Commentary Timeline -->
            <div class="commentary-timeline" id="commentary-timeline">
                <!-- Events appear here -->
            </div>
            
            <!-- Statistics -->
            <div class="stats-grid" id="stats-panel" style="display:none;">
                <!-- Stats visualization -->
            </div>
        </div>
        
        <!-- Odds Sidebar -->
        <div class="odds-panel" id="odds-panel">
            <!-- Live betting odds -->
        </div>
    </div>
    
    <script>
        const MATCH_ID = new URLSearchParams(window.location.search).get('id');
        const API_BASE = 'https://api.xlodon.co.uk';
        
        // ===== FETCH ALL MATCH DATA =====
        async function loadMatchCenter() {
            try {
                // ONE CALL to get everything
                const response = await fetch(`${API_BASE}/api/fixture/master/${MATCH_ID}`);
                const data = await response.json();
                
                if (data.success) {
                    updateScoreHero(data.data);
                    updateCommentary(data.data.events);
                    updateStats(data.data.statistics);
                    updateLineups(data.data.lineups);
                }
            } catch(e) {
                console.error('Load error:', e);
            }
        }
        
        // ===== POLL FOR LIVE UPDATES =====
        function startPolling() {
            // Poll master data every 15 seconds
            setInterval(loadMatchCenter, 15000);
            
            // Poll live odds every 10 seconds
            setInterval(loadLiveOdds, 10000);
            
            // Poll events every 15 seconds for new goals
            setInterval(checkNewEvents, 15000);
        }
        
        // ===== DETECT GOAL SCORED =====
        let lastEventCount = 0;
        async function checkNewEvents() {
            const response = await fetch(`${API_BASE}/api/fixtures/events/${MATCH_ID}`);
            const data = await response.json();
            
            if (data.success && data.data.length > lastEventCount) {
                const newEvents = data.data.slice(lastEventCount);
                newEvents.forEach(event => {
                    if (event.type === 'Goal') {
                        showGoalAlert(event);
                        animateScore();
                    }
                });
                lastEventCount = data.data.length;
            }
        }
        
        // ===== GOAL ALERT ANIMATION =====
        function showGoalAlert(event) {
            const alert = document.createElement('div');
            alert.className = 'goal-alert';
            alert.innerHTML = `
                ⚽ GOAL! ${event.player.name} (${event.time.elapsed}')
            `;
            document.body.appendChild(alert);
            setTimeout(() => alert.remove(), 5000);
        }
        
        // ===== LIVE ODDS UPDATES =====
        async function loadLiveOdds() {
            const response = await fetch(`${API_BASE}/api/odds/live/${MATCH_ID}`);
            const data = await response.json();
            
            if (data.success) {
                updateOddsPanel(data.data);
            }
        }
        
        // Start everything
        loadMatchCenter();
        startPolling();
    </script>
</body>
</html>
