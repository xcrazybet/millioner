<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Results Dashboard - X Lodon</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0f1a; color: white; font-family: 'Segoe UI', sans-serif; min-height: 100vh; }
        .header { background: #111827; padding: 12px 15px; border-bottom: 2px solid #ff9800; position: sticky; top: 0; z-index: 100; }
        .header-top { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .back-btn { color: #00ff9d; text-decoration: none; font-size: 20px; }
        .tabs { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 3px; margin-top: 8px; }
        .tab { padding: 8px 12px; background: #1a2332; border-radius: 20px; color: white; text-decoration: none; font-size: 12px; white-space: nowrap; }
        .tab.active { background: #ff9800; color: black; }
        .container { max-width: 1400px; margin: 0 auto; padding: 15px; }
        .debug-info { background: #1a2332; padding: 15px; border-radius: 12px; font-size: 13px; margin-bottom: 20px; border: 1px solid #2a3344; font-family: monospace; max-height: 200px; overflow-y: auto; }
        .debug-info .error { color: #ff5252; }
        .debug-info .success { color: #00ff9d; }
        .debug-info .warning { color: #ffc107; }
        .debug-info pre { background: #0a0f1a; padding: 10px; border-radius: 8px; margin-top: 8px; overflow-x: auto; font-size: 11px; color: #a0a8c9; }
        .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 25px; }
        .stat-card { background: linear-gradient(135deg, #111827, #1a2332); border-radius: 16px; padding: 15px; border: 1px solid #ff980033; }
        .stat-card .icon { font-size: 22px; color: #ff9800; margin-bottom: 6px; }
        .stat-card .label { font-size: 10px; color: #a0a8c9; text-transform: uppercase; }
        .stat-card .value { font-size: 22px; font-weight: bold; margin-top: 3px; }
        .filter-bar { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; align-items: center; background: #111827; padding: 15px; border-radius: 16px; border: 1px solid #2a3344; }
        .search-group { flex: 2; min-width: 180px; position: relative; }
        .search-group input { width: 100%; padding: 10px 15px; background: #1a2332; border: 1px solid #2a3344; border-radius: 12px; color: white; font-size: 13px; }
        .filter-group select { padding: 10px 12px; background: #1a2332; border: 1px solid #2a3344; border-radius: 12px; color: white; font-size: 13px; cursor: pointer; min-width: 130px; }
        .btn-refresh { background: #2196f3; border: none; padding: 10px 20px; border-radius: 12px; color: white; cursor: pointer; font-weight: bold; }
        .btn-refresh:hover { background: #0b7dda; }
        .results-table-container { overflow-x: auto; border-radius: 16px; background: #111827; border: 1px solid #2a3344; max-height: 70vh; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 10px; text-align: left; border-bottom: 1px solid #2a3344; font-size: 12px; vertical-align: middle; }
        th { background: #0f1422; color: #ff9800; font-weight: 600; position: sticky; top: 0; z-index: 10; font-size: 11px; text-transform: uppercase; }
        tr:hover { background: #1a2332; cursor: pointer; }
        .badge-result { display: inline-block; padding: 3px 12px; border-radius: 20px; font-size: 10px; font-weight: bold; }
        .badge-home { background: #4caf50; color: white; }
        .badge-draw { background: #ffc107; color: black; }
        .badge-away { background: #2196f3; color: white; }
        .badge-live { background: #ff4444; color: white; animation: pulse 1.5s infinite; }
        .badge-upcoming { background: #00ff9d; color: black; }
        .badge-finished { background: #666; color: white; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }
        .loading-spinner { display: inline-block; width: 24px; height: 24px; border: 3px solid #ff9800; border-top-color: transparent; border-radius: 50%; animation: spin 0.6s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .empty-state { text-align: center; padding: 60px; }
        .empty-state i { font-size: 48px; opacity: 0.3; margin-bottom: 15px; }
        .pagination { display: flex; justify-content: center; gap: 6px; margin-top: 20px; flex-wrap: wrap; }
        .page-btn { background: #1a2332; border: 1px solid #2a3344; padding: 8px 14px; border-radius: 8px; color: white; cursor: pointer; }
        .page-btn.active { background: #ff9800; color: black; border-color: #ff9800; }
        .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        
        /* ===== MATCH DETAIL MODAL ===== */
        .modal-overlay { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.95); z-index:1000; display:none; align-items:center; justify-content:center; padding:20px; }
        .modal-overlay.show { display:flex; }
        .modal-content { background: #111827; border-radius: 24px; padding: 30px; max-width: 900px; width: 100%; max-height: 90vh; overflow-y: auto; border: 2px solid #ff9800; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #ff980033; padding-bottom: 15px; }
        .modal-header h3 { color: #ff9800; font-size: 20px; }
        .modal-close { background: none; border: none; color: #a0a8c9; font-size: 28px; cursor: pointer; transition: 0.2s; }
        .modal-close:hover { color: #ff5252; transform: rotate(90deg); }
        
        /* Match Result Display */
        .match-result-display { background: linear-gradient(135deg, #1a2332, #0f1422); border-radius: 20px; padding: 25px; margin-bottom: 20px; border: 1px solid #ff980033; }
        .match-result-teams { display: flex; align-items: center; justify-content: center; gap: 20px; flex-wrap: wrap; }
        .match-result-team { text-align: center; flex: 1; min-width: 120px; }
        .match-result-team .team-logo { width: 70px; height: 70px; object-fit: contain; border-radius: 50%; background: rgba(255,255,255,0.05); padding: 8px; margin-bottom: 8px; }
        .match-result-team .team-name { font-size: 16px; font-weight: bold; }
        .match-result-team .team-score { font-size: 42px; font-weight: bold; color: #ff9800; }
        .match-result-vs { font-size: 14px; color: #a0a8c9; font-weight: bold; }
        .match-result-status { text-align: center; margin-top: 15px; padding: 8px 20px; border-radius: 20px; display: inline-block; font-size: 12px; font-weight: bold; }
        .match-result-league { text-align: center; margin-top: 10px; color: #a0a8c9; font-size: 13px; }
        .match-result-league i { color: #ff9800; }
        .match-result-date { text-align: center; color: #a0a8c9; font-size: 12px; margin-top: 5px; }
        .match-result-winner { text-align: center; margin-top: 12px; padding: 10px; border-radius: 12px; font-weight: bold; font-size: 16px; }
        .match-result-winner.home-win { background: #4caf5022; color: #4caf50; border: 1px solid #4caf50; }
        .match-result-winner.away-win { background: #2196f322; color: #2196f3; border: 1px solid #2196f3; }
        .match-result-winner.draw { background: #ffc10722; color: #ffc107; border: 1px solid #ffc107; }
        .match-result-winner.not-played { background: #66666622; color: #a0a8c9; border: 1px solid #666; }
        
        /* Stats Grid */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin: 15px 0; }
        .stat-item { background: #1a2332; padding: 12px; border-radius: 12px; text-align: center; border: 1px solid #2a3344; }
        .stat-item .stat-icon { font-size: 18px; margin-bottom: 4px; }
        .stat-item .stat-label { font-size: 9px; color: #a0a8c9; text-transform: uppercase; }
        .stat-item .stat-value { font-size: 16px; font-weight: bold; margin-top: 2px; }
        .stat-item .stat-value.home-stat { color: #4caf50; }
        .stat-item .stat-value.away-stat { color: #2196f3; }
        .stat-item .stat-value.total-stat { color: #ff9800; }
        
        /* Detail Grid */
        .detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin: 15px 0; }
        .detail-item { background: #1a2332; padding: 12px 15px; border-radius: 12px; border: 1px solid #2a3344; }
        .detail-item .detail-label { font-size: 9px; color: #ff9800; text-transform: uppercase; }
        .detail-item .detail-value { font-size: 14px; font-weight: bold; margin-top: 4px; word-break: break-word; }
        .detail-item .detail-value .badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 10px; font-weight: bold; }
        .detail-item .detail-value .badge.won { background: #4caf50; color: white; }
        .detail-item .detail-value .badge.lost { background: #ff5252; color: white; }
        .detail-item .detail-value .badge.pending { background: #ffc107; color: black; }
        
        .modal-tabs { display: flex; gap: 8px; margin: 15px 0; flex-wrap: wrap; }
        .modal-tab { padding: 8px 16px; background: #1a2332; border: 1px solid #2a3344; border-radius: 20px; color: #a0a8c9; font-size: 12px; cursor: pointer; transition: 0.2s; }
        .modal-tab:hover { border-color: #ff9800; color: white; }
        .modal-tab.active { background: #ff9800; color: black; border-color: #ff9800; }
        .modal-tab-content { display: none; background: #0a0f1a; padding: 15px; border-radius: 12px; margin-top: 10px; }
        .modal-tab-content.active { display: block; }
        .modal-tab-content pre { font-size: 11px; color: #a0a8c9; white-space: pre-wrap; word-break: break-all; max-height: 200px; overflow-y: auto; }
        
        .notification { position: fixed; bottom: 20px; right: 20px; padding: 12px 20px; border-radius: 12px; z-index: 2000; animation: slideIn 0.3s ease; }
        .notification.success { background: #4caf50; color: white; }
        .notification.error { background: #ff5252; color: white; }
        .notification.info { background: #2196f3; color: white; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        
        @media (max-width: 768px) { 
            th, td { font-size: 10px; padding: 6px; }
            .match-result-teams { gap: 10px; }
            .match-result-team .team-logo { width: 40px; height: 40px; }
            .match-result-team .team-score { font-size: 28px; }
            .match-result-team .team-name { font-size: 13px; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-top">
            <div class="header-left">
                <a href="betting-sport.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
                <h1 style="font-size:18px;"><i class="fas fa-trophy"></i> Results Dashboard</h1>
            </div>
        </div>
        <div class="tabs">
            <a href="betting-sport.html" class="tab">Home</a>
            <a href="live-matches.html" class="tab">Live</a>
            <a href="upcoming-matches.html" class="tab">Upcoming</a>
            <a href="finished-matches.html" class="tab active">Results</a>
            <a href="my-bets.html" class="tab">My Bets</a>
        </div>
    </div>
    
    <div class="container">
        <div class="debug-info" id="debug-info">
            <i class="fas fa-spinner fa-pulse"></i> Connecting to Supabase...
        </div>
        
        <div class="stats-row" id="stats-row">
            <div class="stat-card"><div class="icon"><i class="fas fa-database"></i></div><div class="label">Total Matches</div><div class="value" id="total-matches">0</div></div>
            <div class="stat-card"><div class="icon"><i class="fas fa-check-circle"></i></div><div class="label">Finished</div><div class="value" id="finished-count" style="color:#4caf50;">0</div></div>
            <div class="stat-card"><div class="icon"><i class="fas fa-bolt"></i></div><div class="label">Live</div><div class="value" id="live-count" style="color:#ff4444;">0</div></div>
            <div class="stat-card"><div class="icon"><i class="fas fa-clock"></i></div><div class="label">Upcoming</div><div class="value" id="upcoming-count" style="color:#00ff9d;">0</div></div>
        </div>
        
        <div class="filter-bar">
            <div class="search-group">
                <input type="text" id="search-input" placeholder="Search by Fixture ID, Team, League..." oninput="applyFilters()">
            </div>
            <div class="filter-group">
                <select id="status-filter" onchange="applyFilters()">
                    <option value="all">All Status</option>
                    <option value="finished" selected>Finished</option>
                    <option value="live">Live</option>
                    <option value="upcoming">Upcoming</option>
                </select>
            </div>
            <div class="filter-group">
                <select id="result-filter" onchange="applyFilters()">
                    <option value="">All Results</option>
                    <option value="home">🏠 Home Win</option>
                    <option value="draw">🤝 Draw</option>
                    <option value="away">✈️ Away Win</option>
                </select>
            </div>
            <button class="btn-refresh" onclick="loadMatches()"><i class="fas fa-sync-alt"></i> Refresh</button>
        </div>
        
        <div class="results-table-container" id="results-container">
            <div style="text-align:center;padding:40px;"><div class="loading-spinner"></div> Loading matches...</div>
        </div>
        
        <div class="pagination" id="pagination"></div>
    </div>
    
    <!-- ===== MATCH DETAIL MODAL ===== -->
    <div class="modal-overlay" id="match-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-futbol"></i> Match Result Details</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div id="modal-details"></div>
        </div>
    </div>

    <script>
        // ==================== SUPABASE CONFIG ====================
        const SUPABASE_URL = 'https://jnazybaeajyynpyoszmy.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGlvbiI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpuYXp5YmFlYWp5eW5weW9zem15Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyNzgwMDMsImV4cCI6MjA5Mjg1NDAwM30.P_8V-_s6DQDiYekZX1yaNup48WBRaLhb3ILAkvzTDTY';
        
        let supabaseClient = null;
        let allMatches = [];
        let filteredMatches = [];
        let currentPage = 1;
        const rowsPerPage = 30;
        
        const firebaseConfig = { 
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM", 
            authDomain: "x-bet-prod-jd.firebaseapp.com", 
            projectId: "x-bet-prod-jd", 
            storageBucket: "x-bet-prod-jd.firebasestorage.app", 
            messagingSenderId: "499334334535", 
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962" 
        };
        if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        
        // ==================== DETECT FINISHED MATCHES ====================
        function isMatchFinished(match) {
            if (!match) return false;
            
            // Check status
            if (match.status) {
                const status = match.status.toLowerCase();
                if (['finished', 'ft', 'fulltime', 'complete', 'final', 'ended'].includes(status)) {
                    return true;
                }
            }
            
            // Check if result exists
            if (match.result && match.result !== 'NULL' && match.result !== '' && match.result !== null) {
                return true;
            }
            
            // Check if match has elapsed >= 90
            if (match.elapsed && match.elapsed >= 90) {
                return true;
            }
            
            // Check if match time is in the past AND we have score data
            if (match.start_time) {
                const matchDate = new Date(match.start_time);
                const now = new Date();
                if (now - matchDate > 2 * 60 * 60 * 1000) {
                    if (match.score) {
                        const hs = match.score.home;
                        const as = match.score.away;
                        if (hs !== undefined && hs !== null && as !== undefined && as !== null) {
                            return true;
                        }
                    }
                }
            }
            
            return false;
        }
        
        // ==================== GET RESULT TEXT ====================
        function getResultText(match) {
            const homeScore = match.score?.home;
            const awayScore = match.score?.away;
            
            if (homeScore === undefined || homeScore === null || awayScore === undefined || awayScore === null) {
                return { text: 'Not Played', class: 'not-played' };
            }
            
            if (homeScore > awayScore) {
                return { text: '🏠 HOME WIN', class: 'home-win' };
            } else if (homeScore < awayScore) {
                return { text: '✈️ AWAY WIN', class: 'away-win' };
            } else {
                return { text: '🤝 DRAW', class: 'draw' };
            }
        }
        
        // ==================== LOAD MATCHES ====================
        async function loadMatches() {
            const container = document.getElementById('results-container');
            const debugEl = document.getElementById('debug-info');
            
            container.innerHTML = `<div style="text-align:center;padding:40px;"><div class="loading-spinner"></div> Loading...</div>`;
            debugEl.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Connecting to Supabase...';
            
            try {
                if(!supabaseClient) {
                    supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
                        auth: { persistSession: false },
                        db: { schema: 'public' }
                    });
                }
                
                // Get all matches
                let allData = [];
                let page = 0;
                const pageSize = 1000;
                let hasMore = true;
                
                while(hasMore) {
                    const from = page * pageSize;
                    const to = from + pageSize - 1;
                    
                    const { data, error } = await supabaseClient
                        .from('sports_matches')
                        .select('*')
                        .order('start_time', { ascending: false })
                        .range(from, to);
                    
                    if(error) {
                        debugEl.innerHTML = `<span class="error">❌ Error: ${error.message}</span>`;
                        hasMore = false;
                        break;
                    }
                    
                    if(!data || data.length === 0) {
                        hasMore = false;
                        break;
                    }
                    
                    allData = [...allData, ...data];
                    debugEl.innerHTML = `<i class="fas fa-database"></i> Loaded ${allData.length} matches...`;
                    
                    if(data.length < pageSize) hasMore = false;
                    page++;
                    await new Promise(r => setTimeout(r, 50));
                }
                
                allMatches = allData;
                
                // Update debug
                if (allMatches.length > 0) {
                    const finished = allMatches.filter(m => isMatchFinished(m));
                    debugEl.innerHTML = `
                        <i class="fas fa-check-circle success"></i> Loaded ${allMatches.length} matches
                        <br><i class="fas fa-trophy"></i> Finished: ${finished.length} | Live: ${allMatches.filter(m => m.status === 'live').length} | Upcoming: ${allMatches.filter(m => m.status === 'upcoming').length}
                    `;
                } else {
                    debugEl.innerHTML = `<span class="warning">⚠️ No matches found in database</span>`;
                }
                
                // Update stats
                const finished = allMatches.filter(m => isMatchFinished(m));
                const live = allMatches.filter(m => m.status === 'live');
                const upcoming = allMatches.filter(m => m.status === 'upcoming');
                
                document.getElementById('total-matches').textContent = allMatches.length;
                document.getElementById('finished-count').textContent = finished.length;
                document.getElementById('live-count').textContent = live.length;
                document.getElementById('upcoming-count').textContent = upcoming.length;
                
                applyFilters();
                
                if (finished.length > 0) {
                    showNotification(`✅ Loaded ${finished.length} finished matches`, 'success');
                } else {
                    showNotification(`ℹ️ No finished matches found. Showing all matches.`, 'info');
                }
                
            } catch(e) {
                console.error('Error:', e);
                debugEl.innerHTML = `<span class="error">❌ Error: ${e.message}</span>`;
                container.innerHTML = `<div style="text-align:center;padding:40px;">Error: ${e.message}</div>`;
            }
        }
        
        // ==================== FILTERS ====================
        function applyFilters() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const statusFilter = document.getElementById('status-filter').value;
            const resultFilter = document.getElementById('result-filter').value;
            
            filteredMatches = allMatches.filter(match => {
                // Search
                if(searchTerm) {
                    const homeName = match.home_team?.name || '';
                    const awayName = match.away_team?.name || '';
                    const leagueName = match.league_name || '';
                    const fixtureId = match.fixture_id?.toString() || '';
                    if(!fixtureId.includes(searchTerm) && 
                       !homeName.toLowerCase().includes(searchTerm) && 
                       !awayName.toLowerCase().includes(searchTerm) &&
                       !leagueName.toLowerCase().includes(searchTerm)) return false;
                }
                
                // Status filter
                if(statusFilter !== 'all') {
                    if(statusFilter === 'finished' && !isMatchFinished(match)) return false;
                    if(statusFilter === 'live' && match.status !== 'live') return false;
                    if(statusFilter === 'upcoming' && match.status !== 'upcoming') return false;
                }
                
                // Result filter
                if(resultFilter && match.score) {
                    const homeScore = match.score?.home || 0;
                    const awayScore = match.score?.away || 0;
                    if(resultFilter === 'home' && homeScore <= awayScore) return false;
                    if(resultFilter === 'away' && awayScore <= homeScore) return false;
                    if(resultFilter === 'draw' && homeScore !== awayScore) return false;
                }
                
                return true;
            });
            
            currentPage = 1;
            renderTable();
            renderPagination();
        }
        
        // ==================== RENDER TABLE ====================
        function renderTable() {
            const container = document.getElementById('results-container');
            
            if(!filteredMatches.length) {
                container.innerHTML = `<div class="empty-state"><i class="fas fa-search"></i><h3>No matches found</h3><p>Try adjusting your filters</p></div>`;
                return;
            }
            
            const startIdx = (currentPage - 1) * rowsPerPage;
            const pageMatches = filteredMatches.slice(startIdx, startIdx + rowsPerPage);
            
            let html = `<table><thead><tr>
                <th>Fixture</th><th>League</th><th>Home</th><th>Score</th><th>Away</th><th>Status</th><th>Result</th>
            </tr></thead><tbody>`;
            
            for(const match of pageMatches) {
                const homeName = match.home_team?.name || 'Home';
                const awayName = match.away_team?.name || 'Away';
                const fixtureId = match.fixture_id || match.id || 'N/A';
                
                let homeScore = '?';
                let awayScore = '?';
                if (match.score) {
                    homeScore = match.score.home !== undefined ? match.score.home : '?';
                    awayScore = match.score.away !== undefined ? match.score.away : '?';
                }
                
                const isFinished = isMatchFinished(match);
                let statusClass = 'badge-upcoming';
                let statusText = match.status || 'unknown';
                if(isFinished) { 
                    statusClass = 'badge-finished'; 
                    statusText = '✅ FINISHED'; 
                } else if(match.status === 'live') { 
                    statusClass = 'badge-live'; 
                    statusText = '🔴 LIVE'; 
                } else if(match.status === 'upcoming') {
                    statusText = '⏳ UPCOMING';
                }
                
                let resultHtml = '-';
                if(homeScore !== '?' && awayScore !== '?' && homeScore !== null && awayScore !== null) {
                    const result = getResultText(match);
                    resultHtml = `<span class="badge-result badge-${result.class === 'home-win' ? 'home' : result.class === 'away-win' ? 'away' : 'draw'}">${result.text}</span>`;
                }
                
                html += `<tr onclick='showMatchDetails(${JSON.stringify(match).replace(/'/g, "&#39;")})'>
                    <td><strong>#${fixtureId}</strong></td>
                    <td>${escapeHtml(match.league_name || 'N/A')}</td>
                    <td>${escapeHtml(homeName)}</td>
                    <td style="font-weight:bold;color:#ff9800;text-align:center;font-size:16px;">${homeScore} - ${awayScore}</td>
                    <td>${escapeHtml(awayName)}</td>
                    <td><span style="padding:3px 12px;border-radius:12px;font-size:10px;font-weight:bold;display:inline-block;background:${statusClass === 'badge-finished' ? '#666' : statusClass === 'badge-live' ? '#ff4444' : '#00ff9d'};color:${statusClass === 'badge-upcoming' ? '#000' : '#fff'};">${statusText}</span></td>
                    <td>${resultHtml}</td>
                </tr>`;
            }
            
            html += `</tbody></table>`;
            container.innerHTML = html;
        }
        
        // ==================== PAGINATION ====================
        function renderPagination() {
            const totalPages = Math.ceil(filteredMatches.length / rowsPerPage);
            const paginationDiv = document.getElementById('pagination');
            if(totalPages <= 1) { paginationDiv.innerHTML = ''; return; }
            
            let html = `<button class="page-btn" onclick="goToPage(1)" ${currentPage===1?'disabled':''}>«</button>`;
            html += `<button class="page-btn" onclick="goToPage(${currentPage-1})" ${currentPage===1?'disabled':''}>‹</button>`;
            
            let startPage = Math.max(1, currentPage - 2);
            let endPage = Math.min(totalPages, currentPage + 2);
            for(let i=startPage; i<=endPage; i++) {
                html += `<button class="page-btn ${i===currentPage?'active':''}" onclick="goToPage(${i})">${i}</button>`;
            }
            
            html += `<button class="page-btn" onclick="goToPage(${currentPage+1})" ${currentPage===totalPages?'disabled':''}>›</button>`;
            html += `<button class="page-btn" onclick="goToPage(${totalPages})" ${currentPage===totalPages?'disabled':''}>»</button>`;
            paginationDiv.innerHTML = html;
        }
        
        function goToPage(page) {
            const totalPages = Math.ceil(filteredMatches.length / rowsPerPage);
            if(page < 1 || page > totalPages) return;
            currentPage = page;
            renderTable();
            renderPagination();
        }
        
        // ==================== SHOW MATCH DETAILS - FIXED ====================
        function showMatchDetails(match) {
            const modal = document.getElementById('match-modal');
            const detailsDiv = document.getElementById('modal-details');
            
            const homeName = match.home_team?.name || 'Home';
            const awayName = match.away_team?.name || 'Away';
            const homeLogo = match.home_team?.logo || '';
            const awayLogo = match.away_team?.logo || '';
            const homeScore = match.score?.home ?? '?';
            const awayScore = match.score?.away ?? '?';
            const isFinished = isMatchFinished(match);
            
            // Get result
            const result = getResultText(match);
            const resultClass = result.class;
            const resultText = result.text;
            
            // Determine status display
            let statusDisplay = match.status || 'Unknown';
            let statusColor = '#a0a8c9';
            if(isFinished) { statusDisplay = '✅ FINISHED'; statusColor = '#4caf50'; }
            else if(match.status === 'live') { statusDisplay = '🔴 LIVE'; statusColor = '#ff4444'; }
            else if(match.status === 'upcoming') { statusDisplay = '⏳ UPCOMING'; statusColor = '#00ff9d'; }
            
            // Winner display
            let winnerHtml = '';
            if(homeScore !== '?' && awayScore !== '?' && homeScore !== null && awayScore !== null) {
                if(homeScore > awayScore) {
                    winnerHtml = `<div class="match-result-winner home-win">🏆 ${escapeHtml(homeName)} Wins! (${homeScore}-${awayScore})</div>`;
                } else if(homeScore < awayScore) {
                    winnerHtml = `<div class="match-result-winner away-win">🏆 ${escapeHtml(awayName)} Wins! (${homeScore}-${awayScore})</div>`;
                } else {
                    winnerHtml = `<div class="match-result-winner draw">🤝 Match Drawn! (${homeScore}-${awayScore})</div>`;
                }
            } else {
                winnerHtml = `<div class="match-result-winner not-played">⏳ Match Not Yet Played</div>`;
            }
            
            // Build stats HTML
            let statsHtml = '';
            if (match.statistics) {
                const stats = match.statistics;
                const statItems = [
                    { icon: '⚽', label: 'Possession', home: stats.possession_home, away: stats.possession_away, suffix: '%' },
                    { icon: '🎯', label: 'Shots on Target', home: stats.shots_on_target_home, away: stats.shots_on_target_away },
                    { icon: '📊', label: 'Total Shots', home: stats.shots_home, away: stats.shots_away },
                    { icon: '🟨', label: 'Yellow Cards', home: stats.yellow_cards_home, away: stats.yellow_cards_away },
                    { icon: '🟥', label: 'Red Cards', home: stats.red_cards_home, away: stats.red_cards_away },
                    { icon: '🔄', label: 'Corners', home: stats.corners_home, away: stats.corners_away },
                    { icon: '🤕', label: 'Fouls', home: stats.fouls_home, away: stats.fouls_away }
                ];
                
                let hasStats = false;
                let statsGridHtml = '';
                for (const item of statItems) {
                    if (item.home !== undefined && item.home !== null && item.away !== undefined && item.away !== null) {
                        hasStats = true;
                        const homeVal = item.home + (item.suffix || '');
                        const awayVal = item.away + (item.suffix || '');
                        statsGridHtml += `
                            <div class="stat-item">
                                <div class="stat-icon">${item.icon}</div>
                                <div class="stat-label">${item.label}</div>
                                <div style="display:flex;justify-content:space-between;margin-top:4px;">
                                    <span class="stat-value home-stat">${homeVal}</span>
                                    <span style="color:#a0a8c9;font-size:11px;">vs</span>
                                    <span class="stat-value away-stat">${awayVal}</span>
                                </div>
                            </div>
                        `;
                    }
                }
                
                if (hasStats) {
                    statsHtml = `
                        <div style="margin:15px 0;">
                            <h4 style="color:#ff9800;margin-bottom:10px;"><i class="fas fa-chart-bar"></i> Match Statistics</h4>
                            <div class="stats-grid">${statsGridHtml}</div>
                        </div>
                    `;
                }
            }
            
            // Build detail items
            const detailItems = [
                { label: 'Fixture ID', value: `#${match.fixture_id || match.id || 'N/A'}` },
                { label: 'League', value: match.league_name || 'N/A' },
                { label: 'Status', value: `<span style="color:${statusColor};">${statusDisplay}</span>` },
                { label: 'Result', value: isFinished ? `<span class="badge badge-${resultClass === 'home-win' ? 'won' : resultClass === 'away-win' ? 'lost' : 'pending'}">${resultText}</span>` : '⏳ Pending' },
                { label: 'Date & Time', value: match.start_time ? new Date(match.start_time).toLocaleString() : 'TBD' },
                { label: 'Elapsed', value: match.elapsed ? match.elapsed + "'" : 'N/A' },
                { label: 'Bets Settled', value: match.bets_settled ? '✅ Yes' : '⏳ No' },
                { label: 'Bets Closed', value: match.bets_closed ? '🔒 Yes' : '🟢 No' }
            ];
            
            let detailGridHtml = '';
            for (const item of detailItems) {
                detailGridHtml += `
                    <div class="detail-item">
                        <div class="detail-label">${item.label}</div>
                        <div class="detail-value">${item.value}</div>
                    </div>
                `;
            }
            
            // Build modal HTML
            detailsDiv.innerHTML = `
                <!-- Match Result Display -->
                <div class="match-result-display">
                    <div class="match-result-teams">
                        <div class="match-result-team">
                            ${homeLogo ? `<img class="team-logo" src="${homeLogo}" onerror="this.style.display='none'">` : '<i class="fas fa-shield-alt" style="font-size:40px;opacity:0.3;"></i>'}
                            <div class="team-name">${escapeHtml(homeName)}</div>
                            <div class="team-score">${homeScore}</div>
                        </div>
                        <div class="match-result-vs">VS</div>
                        <div class="match-result-team">
                            ${awayLogo ? `<img class="team-logo" src="${awayLogo}" onerror="this.style.display='none'">` : '<i class="fas fa-shield-alt" style="font-size:40px;opacity:0.3;"></i>'}
                            <div class="team-name">${escapeHtml(awayName)}</div>
                            <div class="team-score">${awayScore}</div>
                        </div>
                    </div>
                    
                    ${winnerHtml}
                    
                    <div style="display:flex;justify-content:center;gap:15px;flex-wrap:wrap;margin-top:10px;">
                        <span class="match-result-status" style="background:${statusColor}22;color:${statusColor};border:1px solid ${statusColor};">${statusDisplay}</span>
                        ${match.league_name ? `<span class="match-result-league"><i class="fas fa-trophy"></i> ${escapeHtml(match.league_name)}</span>` : ''}
                        ${match.start_time ? `<span class="match-result-date"><i class="far fa-calendar-alt"></i> ${new Date(match.start_time).toLocaleString()}</span>` : ''}
                    </div>
                </div>
                
                ${statsHtml}
                
                <!-- Detail Grid -->
                <div style="margin:15px 0;">
                    <h4 style="color:#ff9800;margin-bottom:10px;"><i class="fas fa-info-circle"></i> Match Information</h4>
                    <div class="detail-grid">${detailGridHtml}</div>
                </div>
                
                <!-- Raw Data Toggle -->
                <div style="margin-top:15px;">
                    <button onclick="toggleRawData()" style="background:#1a2332;border:1px solid #2a3344;color:#a0a8c9;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:12px;">
                        <i class="fas fa-code"></i> Show Raw Data
                    </button>
                    <div id="raw-data-container" style="display:none;margin-top:10px;background:#0a0f1a;padding:15px;border-radius:12px;max-height:200px;overflow-y:auto;">
                        <pre style="color:#a0a8c9;font-size:11px;white-space:pre-wrap;word-break:break-all;">${JSON.stringify(match, null, 2)}</pre>
                    </div>
                </div>
            `;
            
            modal.classList.add('show');
        }
        
        // ==================== TOGGLE RAW DATA ====================
        function toggleRawData() {
            const container = document.getElementById('raw-data-container');
            if (container) {
                container.style.display = container.style.display === 'none' ? 'block' : 'none';
            }
        }
        
        // ==================== CLOSE MODAL ====================
        function closeModal() { 
            document.getElementById('match-modal').classList.remove('show'); 
        }
        
        // ==================== NOTIFICATIONS ====================
        function showNotification(msg, type) { 
            const n = document.createElement('div'); 
            n.className = `notification ${type}`; 
            n.innerHTML = msg; 
            document.body.appendChild(n); 
            setTimeout(()=>n.remove(), 3000); 
        }
        
        // ==================== ESCAPE HTML ====================
        function escapeHtml(str) { 
            if(!str) return ''; 
            return String(str).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); 
        }
        
        // ==================== INIT ====================
        firebase.auth().onAuthStateChanged(async (user) => {
            if(!user) { window.location.href = '../login.html'; return; }
            await loadMatches();
        });
        
        // Close modal on overlay click
        document.getElementById('match-modal').addEventListener('click', function(e) {
            if(e.target === this) closeModal();
        });
        
        // Escape key closes modal
        document.addEventListener('keydown', function(e) {
            if(e.key === 'Escape') closeModal();
        });
        
        // Make functions global
        window.applyFilters = applyFilters;
        window.goToPage = goToPage;
        window.showMatchDetails = showMatchDetails;
        window.closeModal = closeModal;
        window.loadMatches = loadMatches;
        window.toggleRawData = toggleRawData;
        
        console.log('✅ Results Dashboard with Beautiful Match Result Display');
        console.log('📊 Connected to:', SUPABASE_URL);
    </script>
</body>
</html>
