        .tab{padding:8px 12px;background:var(--bg3);border-radius:20px;color:var(--text);text-decoration:none;font-size:12px;white-space:nowrap;transition:0.3s}

        .debug-bar .dot.green{background:var(--green)}.debug-bar .dot.red{background:var(--red)}

        .stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:18px}
        .stat-card{background:linear-gradient(135deg,var(--bg2),var(--bg3));border-radius:14px;padding:15px;border:1px solid rgba(255,152,0,0.2);transition:0.3s;cursor:pointer}

        .stat-card .value{font-size:20px;font-weight:900;margin-top:3px}
        .stat-card .value.green{color:#4caf50}.stat-card .value.red{color:var(--red)}.stat-card .value.orange{color:var(--orange)}.stat-card .value.blue{color:var(--blue)}

        .detail-item .lbl{font-size:8px;color:var(--orange);text-transform:uppercase;letter-spacing:0.5px}
        .detail-item .val{font-size:13px;font-weight:600;margin-top:3px}

        .events-list{max-height:250px;overflow-y:auto}

        .events-list::-webkit-scrollbar-track{background:var(--bg3);border-radius:10px}
        .events-list::-webkit-scrollbar-thumb{background:var(--orange);border-radius:10px}
        .event-item{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;font-size:11px;background:var(--bg3);margin-bottom:3px}
        .event-item .event-min{font-family:monospace;font-size:10px;color:var(--text2);min-width:30px}
        .event-item .event-icon{font-size:13px}
        .event-item .event-text{flex:1}

        @media(max-width:768px){.stats-row{grid-template-columns:repeat(2,1fr)}.filter-bar{flex-direction:column;align-items:stretch}th,td{font-size:10px;padding:8px 6px}.team-cell .logo{width:18px;height:18px}.score-cell{font-size:13px;min-width:40px}.match-team-block .logo{width:40px;height:40px}.match-team-block .score-val{font-size:24px}.match-team-block .name{font-size:12px}.modal-body{padding:14px}}
    </style>

<script>
// ============================================
// RESULTS DASHBOARD v4.0 - API DIRECT
// Real cards, corners, goals from API
// ============================================
const API_BASE='https://muddy-wildflower-a70d.dilovantalan.workers.dev';
const SUPABASE_URL='https://jnazybaeajyynpyoszmy.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpuYXp5YmFlYWp5eW5weW9zem15Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyNzgwMDMsImV4cCI6MjA5Mjg1NDAwM30.P_8V-_s6DQDiYekZX1yaNup48WBRaLhb3ILAkvzTDTY';
let supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const fb={apiKey:"AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",authDomain:"x-bet-prod-jd.firebaseapp.com",projectId:"x-bet-prod-jd",storageBucket:"x-bet-prod-jd.firebasestorage.app",messagingSenderId:"499334334535",appId:"1:499334334535:web:bebc1bf817e24d9e3c4962"};
if(!firebase.apps.length)firebase.initializeApp(fb);
const auth=firebase.auth();

let allMatches=[],filteredMatches=[],currentPage=1,rowsPerPage=20,statsCache={};

function escapeHtml(s){if(!s)return'';return String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));}
function formatDate(d){if(!d)return'TBD';return new Date(d).toLocaleString('en-US',{weekday:'short',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});}
function showNotification(m,t='info'){const n=document.createElement('div');n.className=`notification ${t}`;n.innerHTML=m;document.body.appendChild(n);setTimeout(()=>n.remove(),3000);}
function isFinished(m){if(!m)return false;const s=(m.status||'').toLowerCase();if(['finished','ft','fulltime','final'].includes(s))return true;if(m.score&&m.score.home!==undefined&&m.score.away!==undefined){const d=new Date(m.start_time);if(Date.now()-d>3*60*60*1000)return true;}return false;}
function getResult(m){const h=m.score?.home,a=m.score?.away;if(h===undefined||h===null||a===undefined||a===null)return{text:'Pending',class:'pending'};if(h>a)return{text:'Home Win',class:'home-win'};if(h<a)return{text:'Away Win',class:'away-win'};return{text:'Draw',class:'draw'};}
function filterBy(s){document.getElementById('status-filter').value=s;applyFilters();}

// ===== FETCH STATS FROM API =====
async function fetchMatchStats(fid){
    if(statsCache[fid])return statsCache[fid];
    try{
        const[er,sr]=await Promise.all([fetch(`${API_BASE}/api/fixtures/events/${fid}`).catch(()=>null),fetch(`${API_BASE}/api/fixtures/statistics/${fid}`).catch(()=>null)]);
        let events=[],stats={};
        if(er&&er.ok){const d=await er.json();events=d.data||d.response||[];}
        if(sr&&sr.ok){const d=await sr.json();const raw=d.data||d.response||[];raw.forEach(r=>{const tn=r.team?.name||'?';r.statistics?.forEach(s=>{const k=s.type?.replace(/\s+/g,'_').toLowerCase();if(k){if(!stats[k])stats[k]={};stats[k][tn]=s.value;}});});}
        const res={events,stats,summary:genSummary(events,stats)};statsCache[fid]=res;return res;
    }catch(e){return{events:[],stats:{},summary:{}};}
}

function genSummary(ev,st){
    const s={goals:{home:0,away:0},yc:{home:0,away:0},rc:{home:0,away:0},corners:{home:0,away:0},fouls:{home:0,away:0},shots:{home:0,away:0},ontarget:{home:0,away:0}};
    ev.forEach(e=>{const side=e.team?.name?.toLowerCase().includes('home')?'home':'away';if(e.type==='Goal')s.goals[side]++;if(e.type==='Card'){if(e.detail?.includes('Yellow'))s.yc[side]++;if(e.detail?.includes('Red'))s.rc[side]++;}});
    const cd=st['corner_kicks'];if(cd){const ks=Object.keys(cd);if(ks[0])s.corners.home=parseInt(cd[ks[0]])||0;if(ks[1])s.corners.away=parseInt(cd[ks[1]])||0;}
    const fs=st['fouls'];if(fs){const ks=Object.keys(fs);if(ks[0])s.fouls.home=parseInt(fs[ks[0]])||0;if(ks[1])s.fouls.away=parseInt(fs[ks[1]])||0;}
    const sh=st['total_shots'];if(sh){const ks=Object.keys(sh);if(ks[0])s.shots.home=parseInt(sh[ks[0]])||0;if(ks[1])s.shots.away=parseInt(sh[ks[1]])||0;}
    const so=st['shots_on_goal'];if(so){const ks=Object.keys(so);if(ks[0])s.ontarget.home=parseInt(so[ks[0]])||0;if(ks[1])s.ontarget.away=parseInt(so[ks[1]])||0;}
    return s;
}

// ===== LOAD ALL DATA =====
async function loadAll(){
    const dc=document.getElementById('debug-text'),at=document.getElementById('api-time'),rc=document.getElementById('results-container');
    dc.innerHTML='<div class="loading-spinner" style="width:14px;height:14px;"></div> Fetching...';
    rc.innerHTML='<div style="text-align:center;padding:50px;"><div class="loading-spinner"></div> Loading...</div>';
    try{
        const td=new Date().toISOString().split('T')[0];
        const lw=new Date(Date.now()-7*86400000).toISOString().split('T')[0];
        const nw=new Date(Date.now()+3*86400000).toISOString().split('T')[0];
        const st=Date.now();
        const resp=await fetch(`${API_BASE}/api/fixtures/range/${lw}/${nw}`);
        const elapsed=Date.now()-st;at.textContent=`⏱️ ${elapsed}ms`;
        if(!resp.ok)throw new Error(`HTTP ${resp.status}`);
        const data=await resp.json();
        let fixtures=data.data||data.response||[];

        // Also get Supabase data
        try{const{data:sb}=await supabaseClient.from('sports_matches').select('*').order('start_time',{ascending:false}).limit(500);if(sb&&sb.length){const ids=new Set(fixtures.map(f=>f.fixture?.id||f.id));sb.forEach(m=>{if(!ids.has(m.fixture_id))fixtures.push({fixture:m,teams:{home:m.home_team,away:m.away_team},league:m});});}}catch(e){}

        allMatches=fixtures.map(f=>{
            const fix=f.fixture||f,teams=f.teams||{},lg=f.league||{};
            let ht=teams.home||f.home_team||{},at=teams.away||f.away_team||{};
            if(typeof ht==='string')try{ht=JSON.parse(ht)}catch(e){ht={name:ht};}
            if(typeof at==='string')try{at=JSON.parse(at)}catch(e){at={name:at};}
            const sc=fix.score||f.score||{};
            return{fixture_id:fix.id||f.id||0,status:fix.status?.short||fix.status||'NS',elapsed:fix.status?.elapsed||0,start_time:fix.date||f.start_time||'',home_team:ht,away_team:at,league_name:lg.name||f.league_name||'',score:{home:fix.goals?.home||sc.fulltime?.home||sc.home||0,away:fix.goals?.away||sc.fulltime?.away||sc.away||0}};
        });

        // Sort: finished first
        allMatches.sort((a,b)=>{const af=isFinished(a)?1:0,bf=isFinished(b)?1:0;if(af!==bf)return bf-af;return new Date(b.start_time)-new Date(a.start_time);});

        const fin=allMatches.filter(m=>isFinished(m)),live=allMatches.filter(m=>m.status==='live'||m.status==='1H'||m.status==='2H'),up=allMatches.filter(m=>!isFinished(m)&&m.status!=='live'&&m.status!=='1H'&&m.status!=='2H');
        document.getElementById('total-matches').textContent=allMatches.length;
        document.getElementById('finished-count').textContent=fin.length;
        document.getElementById('live-count').textContent=live.length;
        document.getElementById('upcoming-count').textContent=up.length;
        dc.innerHTML=`✅ <strong>${allMatches.length}</strong> matches | ✅${fin.length} | 🔴${live.length} | ⏳${up.length}`;

        // Enrich finished matches with stats
        await enrichMatches();
        applyFilters();
        showNotification(`✅ ${fin.length} results loaded`,'success');
    }catch(e){dc.innerHTML=`❌ ${e.message}`;rc.innerHTML=`<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><h3>Error</h3><p>${e.message}</p></div>`;}
}

async function enrichMatches(){
    const fin=allMatches.filter(m=>isFinished(m)).slice(0,30);
    for(const m of fin){try{m._stats=await fetchMatchStats(m.fixture_id);}catch(e){m._stats=null;}}
}

function applyFilters(){
    const search=(document.getElementById('search-input').value||'').toLowerCase(),sf=document.getElementById('status-filter').value,rf=document.getElementById('result-filter').value;
    filteredMatches=allMatches.filter(m=>{
        if(search){const hn=(m.home_team?.name||'').toLowerCase(),an=(m.away_team?.name||'').toLowerCase(),ln=(m.league_name||'').toLowerCase(),fid=(m.fixture_id?.toString()||'');if(!hn.includes(search)&&!an.includes(search)&&!ln.includes(search)&&!fid.includes(search))return false;}
        if(sf!=='all'){if(sf==='finished'&&!isFinished(m))return false;if(sf==='live'&&m.status!=='live'&&m.status!=='1H'&&m.status!=='2H')return false;if(sf==='upcoming'&&(isFinished(m)||m.status==='live'||m.status==='1H'||m.status==='2H'))return false;}
        if(rf&&m.score){const hs=m.score.home||0,as=m.score.away||0;if(rf==='home'&&hs<=as)return false;if(rf==='away'&&as<=hs)return false;if(rf==='draw'&&hs!==as)return false;}
        return true;
    });
    currentPage=1;renderTable();renderPagination();
}

function renderTable(){
    const c=document.getElementById('results-container');
    if(!filteredMatches.length){c.innerHTML='<div class="empty-state"><i class="fas fa-search"></i><h3>No matches</h3></div>';return;}
    const si=(currentPage-1)*rowsPerPage,pm=filteredMatches.slice(si,si+rowsPerPage);
    let h=`<table><thead><tr><th>#</th><th>League</th><th>Home</th><th>Score</th><th>Away</th><th>Stats</th><th>Status</th><th>Result</th></tr></thead><tbody>`;
    for(const m of pm){
        const hn=m.home_team?.name||'Home',an=m.away_team?.name||'Away',hl=m.home_team?.logo||'',al=m.away_team?.logo||'',fi=isFinished(m);
        let hs='?',as='?';if(m.score){hs=m.score.home!==undefined?m.score.home:'?';as=m.score.away!==undefined?m.score.away:'?';}
        let sc='upcoming',st='⏳ UPCOMING';if(fi){sc='finished';st='✅ FINISHED';}else if(m.status==='live'||m.status==='1H'||m.status==='2H'){sc='live';st='🔴 LIVE';}
        const res=getResult(m);
        let qs='-';if(m._stats&&m._stats.summary){const ss=m._stats.summary;qs=`<div class="quick-stats"><span class="quick-stat yellow">🟨${(ss.yc?.home||0)+(ss.yc?.away||0)}</span><span class="quick-stat red">🟥${(ss.rc?.home||0)+(ss.rc?.away||0)}</span><span class="quick-stat corner">🚩${(ss.corners?.home||0)+(ss.corners?.away||0)}</span><span class="quick-stat goal">⚽${(ss.goals?.home||0)+(ss.goals?.away||0)}</span></div>`;}
        h+=`<tr onclick="showDetails(${m.fixture_id})"><td><strong>#${m.fixture_id}</strong></td><td>${escapeHtml(m.league_name||'N/A')}</td><td><div class="team-cell">${hl?`<img class="logo" src="${hl}" onerror="this.style.display='none'">`:''}<span>${escapeHtml(hn)}</span></div></td><td class="score-cell">${hs} - ${as}</td><td><div class="team-cell">${al?`<img class="logo" src="${al}" onerror="this.style.display='none'">`:''}<span>${escapeHtml(an)}</span></div></td><td>${qs}</td><td><span class="badge-status ${sc}">${st}</span></td><td>${res.class!=='pending'?`<span class="badge-result ${res.class}">${res.text}</span>`:'<span style="color:var(--text2);font-size:10px;">⏳</span>'}</td></tr>`;
    }
    h+='</tbody></table>';c.innerHTML=h;
}

function renderPagination(){const tp=Math.ceil(filteredMatches.length/rowsPerPage),pd=document.getElementById('pagination');if(tp<=1){pd.innerHTML='';return;}let h=`<button class="page-btn" onclick="goToPage(1)" ${currentPage===1?'disabled':''}>«</button><button class="page-btn" onclick="goToPage(${currentPage-1})" ${currentPage===1?'disabled':''}>‹</button>`;let sp=Math.max(1,currentPage-2),ep=Math.min(tp,currentPage+2);for(let i=sp;i<=ep;i++)h+=`<button class="page-btn ${i===currentPage?'active':''}" onclick="goToPage(${i})">${i}</button>`;h+=`<button class="page-btn" onclick="goToPage(${currentPage+1})" ${currentPage===tp?'disabled':''}>›</button><button class="page-btn" onclick="goToPage(${tp})" ${currentPage===tp?'disabled':''}>»</button>`;pd.innerHTML=h;}
function goToPage(p){const tp=Math.ceil(filteredMatches.length/rowsPerPage);if(p<1||p>tp)return;currentPage=p;renderTable();renderPagination();}

// ===== SHOW MATCH DETAILS MODAL =====
async function showDetails(fid){
    const match=allMatches.find(m=>m.fixture_id==fid);
    if(!match)return;
    const modal=document.getElementById('match-modal'),body=document.getElementById('modal-body');
    document.getElementById('modal-fid').textContent=`#${fid}`;
    body.innerHTML='<div style="text-align:center;padding:30px;"><div class="loading-spinner"></div> Loading details...</div>';
    modal.classList.add('show');

    // Fetch fresh stats
    const stats=await fetchMatchStats(fid);
    match._stats=stats;

    const hn=match.home_team?.name||'Home',an=match.away_team?.name||'Away',hl=match.home_team?.logo||'',al=match.away_team?.logo||'';
    const hs=match.score?.home??'?',as=match.score?.away??'?';
    const fi=isFinished(match),res=getResult(match);
    const isNum=typeof hs==='number'&&typeof as==='number';
    const wc=isNum&&fi?(hs>as?'home-win':hs<as?'away-win':'draw'):'pending';
    const wt=isNum&&fi?(hs>as?`🏆 ${hn} Wins!`:hs<as?`🏆 ${an} Wins!`:`🤝 Match Drawn!`):'⏳ Not Played';

    let sd='Unknown',sc='#a0a8c9';if(fi){sd='✅ FINISHED';sc='#4caf50';}else if(match.status==='live'||match.status==='1H'||match.status==='2H'){sd='🔴 LIVE';sc='var(--red)';}

    // Stats tab
    const ss=stats.summary||{};
    let statsHtml='<div class="stats-grid">';
    const sitems=[
        {icon:'⚽',label:'Goals',h:ss.goals?.home||0,a:ss.goals?.away||0},
        {icon:'🎯',label:'Shots',h:ss.shots?.home||0,a:ss.shots?.away||0},
        {icon:'🥅',label:'On Target',h:ss.ontarget?.home||0,a:ss.ontarget?.away||0},
        {icon:'🟨',label:'Yellow',h:ss.yc?.home||0,a:ss.yc?.away||0},
        {icon:'🟥',label:'Red',h:ss.rc?.home||0,a:ss.rc?.away||0},
        {icon:'🚩',label:'Corners',h:ss.corners?.home||0,a:ss.corners?.away||0},
        {icon:'⚠️',label:'Fouls',h:ss.fouls?.home||0,a:ss.fouls?.away||0}
    ];
    sitems.forEach(s=>{const t=s.h+s.a||1,hp=(s.h/t)*100;statsHtml+=`<div class="stat-item"><div class="stat-icon">${s.icon}</div><div class="stat-label">${s.label}</div><div class="stat-values"><span class="home">${s.h}</span><span class="sep">vs</span><span class="away">${s.a}</span></div></div>`;});
    statsHtml+='</div>';

    // Events tab
    const ev=stats.events||[];
    let evHtml='';
    if(ev.length){evHtml='<div class="events-list">';ev.forEach(e=>{const icon=e.type==='Goal'?'⚽':e.detail==='Yellow Card'?'🟨':e.detail==='Red Card'?'🟥':'🔄';const txt=e.type==='Goal'?`${e.player?.name} scored`:e.detail==='Yellow Card'?`${e.player?.name} (Yellow)`:e.detail==='Red Card'?`${e.player?.name} (Red)`:`${e.player?.name} ↔ ${e.assist?.name||''}`;evHtml+=`<div class="event-item"><span class="event-min">${e.time?.elapsed||0}'</span><span class="event-icon">${icon}</span><span class="event-text">${txt}</span></div>`;});evHtml+='</div>';}else{evHtml='<div style="text-align:center;padding:20px;color:var(--text2);">No events available</div>';}

    // Details tab
    const dHtml=`<div class="detail-grid"><div class="detail-item"><div class="lbl">Fixture ID</div><div class="val">#${fid}</div></div><div class="detail-item"><div class="lbl">League</div><div class="val">${escapeHtml(match.league_name||'N/A')}</div></div><div class="detail-item"><div class="lbl">Status</div><div class="val" style="color:${sc}">${sd}</div></div><div class="detail-item"><div class="lbl">Date</div><div class="val">${formatDate(match.start_time)}</div></div><div class="detail-item"><div class="lbl">Elapsed</div><div class="val">${match.elapsed?match.elapsed+"'":'N/A'}</div></div><div class="detail-item"><div class="lbl">Result</div><div class="val">${isNum&&fi?`<span class="badge-result ${wc}">${res.text}</span>`:'⏳ Pending'}</div></div></div>`;

    body.innerHTML=`
        <div class="match-hero">
            <div class="match-teams">
                <div class="match-team-block">${hl?`<img class="logo" src="${hl}" onerror="this.style.display='none'">`:'<i class="fas fa-shield-alt" style="font-size:40px;opacity:0.3;"></i>'}<div class="name">${escapeHtml(hn)}</div><div class="score-val ${isNum&&fi&&hs>as?'winner':''}">${hs}</div></div>
                <div class="match-vs-text">VS</div>
                <div class="match-team-block">${al?`<img class="logo" src="${al}" onerror="this.style.display='none'">`:'<i class="fas fa-shield-alt" style="font-size:40px;opacity:0.3;"></i>'}<div class="name">${escapeHtml(an)}</div><div class="score-val ${isNum&&fi&&as>hs?'winner':''}">${as}</div></div>
            </div>
            <div class="match-winner-banner ${wc}">${wt}</div>
            <div class="match-meta-row"><span><i class="fas fa-trophy"></i>${escapeHtml(match.league_name||'N/A')}</span><span><i class="far fa-calendar-alt"></i>${formatDate(match.start_time)}</span><span><i class="fas fa-clock"></i>${sd}</span></div>
        </div>
        <div class="modal-tabs">
            <button class="modal-tab active" onclick="switchTab(this,'stats')"><i class="fas fa-chart-bar"></i>Stats</button>
            <button class="modal-tab" onclick="switchTab(this,'events')"><i class="fas fa-bolt"></i>Events (${ev.length})</button>
            <button class="modal-tab" onclick="switchTab(this,'details')"><i class="fas fa-info-circle"></i>Details</button>
        </div>
        <div class="tab-content active" id="tab-stats">${statsHtml}</div>
        <div class="tab-content" id="tab-events">${evHtml}</div>
        <div class="tab-content" id="tab-details">${dHtml}</div>
    `;
}

function switchTab(btn,tabId){document.querySelectorAll('.modal-tab').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));btn.classList.add('active');document.getElementById('tab-'+tabId).classList.add('active');}
function closeModal(e){if(!e||e.target===document.getElementById('match-modal'))document.getElementById('match-modal').classList.remove('show');}

auth.onAuthStateChanged(async u=>{if(!u){window.location.href='../login.html';return;}document.getElementById('user-email').textContent=u.email||'';await loadAll();setInterval(loadAll,120000);});
window.applyFilters=applyFilters;window.goToPage=goToPage;window.filterBy=filterBy;window.showDetails=showDetails;window.closeModal=closeModal;window.switchTab=switchTab;window.loadAll=loadAll;
console.log('✅ Results Dashboard v4.0 - API Direct Ready');
