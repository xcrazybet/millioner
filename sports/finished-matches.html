<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results - X Lodon</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="../css/sports-betting.css">
    <style>
        body { background: #0a0f1a; color: white; font-family: 'Segoe UI', sans-serif; margin: 0; }
        .container { max-width: 1200px; margin: 0 auto; padding: 15px; }
        .header { background: #111827; padding: 15px; border-bottom: 2px solid #00ff9d; }
        .tabs { display: flex; gap: 5px; margin-top: 10px; flex-wrap: wrap; }
        .tab { padding: 10px 15px; background: #1a2332; border-radius: 8px; color: white; text-decoration: none; font-size: 14px; }
        .tab.active { background: #00ff9d; color: black; }
        .match-card { background: #111827; border-radius: 10px; padding: 15px; margin: 10px 0; border-left: 4px solid #a0a8c9; }
        .teams { display: flex; align-items: center; justify-content: space-around; }
        .team { text-align: center; flex: 1; }
        .score { font-size: 24px; font-weight: bold; }
        .result-badge { padding: 2px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .result-badge.home { background: #4caf50; color: white; }
        .result-badge.draw { background: #ffc107; color: black; }
        .result-badge.away { background: #2196f3; color: white; }
        .section-title { color: #a0a8c9; margin: 20px 0 10px; font-size: 18px; }
        .empty-state { text-align: center; padding: 40px; color: #a0a8c9; }
        .info-banner { background: rgba(255,152,0,0.1); padding: 12px; border-radius: 10px; margin-bottom: 20px; color: #ff9800; border: 1px solid #ff980044; }
        .back-btn { color: #00ff9d; text-decoration: none; font-size: 20px; margin-right: 15px; }
    </style>
</head>
<body>
    <div class="header">
        <h1 style="margin: 0 0 10px 0;"><i class="fas fa-futbol"></i> X Lodon Sports</h1>
        <div class="tabs">
            <a href="betting-sport.html" class="tab"><i class="fas fa-home"></i> Home</a>
            <a href="live-matches.html" class="tab"><i class="fas fa-circle" style="color: #ff5252;"></i> Live</a>
            <a href="upcoming-matches.html" class="tab"><i class="fas fa-calendar"></i> Upcoming</a>
            <a href="finished-matches.html" class="tab active"><i class="fas fa-check-circle"></i> Results</a>
            <a href="my-bets.html" class="tab"><i class="fas fa-ticket-alt"></i> My Bets</a>
        </div>
    </div>
    
    <div class="container">
        <div style="display: flex; align-items: center; margin-bottom: 15px;">
            <a href="betting-sport.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
            <div class="section-title" style="margin: 0;"><i class="fas fa-check-circle"></i> Recent Results</div>
        </div>
        
        <div class="info-banner">
            <i class="fas fa-info-circle"></i> Results are displayed for 24 hours after match completion
        </div>
        
        <div id="matches-container"></div>
        <div id="empty-state" class="empty-state" style="display: none;">
            <i class="fas fa-trophy" style="font-size: 48px; opacity: 0.3;"></i>
            <p>No recent results</p>
        </div>
    </div>
    
    <nav style="display: flex; justify-content: space-around; background: #111827; padding: 12px; margin-top: 30px; border-top: 1px solid #00ff9d20;">
        <a href="../index.html" style="color: #a0a8c9; text-decoration: none;"><i class="fas fa-home"></i> Home</a>
        <a href="../games.html" style="color: #a0a8c9; text-decoration: none;"><i class="fas fa-gamepad"></i> Casino</a>
        <a href="betting-sport.html" style="color: #00ff9d; text-decoration: none;"><i class="fas fa-futbol"></i> Sports</a>
        <a href="../dashboard.html" style="color: #a0a8c9; text-decoration: none;"><i class="fas fa-user"></i> Account</a>
    </nav>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), db = firebase.firestore();
        let unsubscribe = null;
        
        auth.onAuthStateChanged(u => { if (!u) location.href = '../login.html'; else loadFinished(); });
        
        function loadFinished() {
            const container = document.getElementById('matches-container');
            const empty = document.getElementById('empty-state');
            const now = new Date();
            
            unsubscribe = db.collection('sports_matches')
                .where('status', '==', 'finished')
                .where('expiresAt', '>', now)
                .orderBy('expiresAt', 'desc')
                .onSnapshot(snap => {
                    if (snap.empty) {
                        container.style.display = 'none';
                        empty.style.display = 'block';
                    } else {
                        container.style.display = 'block';
                        empty.style.display = 'none';
                        container.innerHTML = '';
                        snap.forEach(doc => container.appendChild(createCard(doc.data())));
                    }
                }, e => { console.error(e); container.innerHTML = '<p class="empty-state">Error loading results</p>'; });
        }
        
        function createCard(m) {
            const card = document.createElement('div');
            card.className = 'match-card';
            
            const resultText = m.result === 'home' ? 'Home Win' : m.result === 'draw' ? 'Draw' : m.result === 'away' ? 'Away Win' : 'Unknown';
            const badgeClass = m.result || '';
            
            card.innerHTML = `
                <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                    <span style="color: #a0a8c9;">${m.leagueName || 'League'}</span>
                    <span style="color: #a0a8c9;">Final</span>
                </div>
                <div class="teams">
                    <div class="team"><strong>${m.homeTeam?.name || 'Home'}</strong></div>
                    <div class="score">${m.score?.home || 0} - ${m.score?.away || 0}</div>
                    <div class="team"><strong>${m.awayTeam?.name || 'Away'}</strong></div>
                </div>
                <div style="text-align: center; margin-top: 10px;">
                    <span class="result-badge ${badgeClass}">${resultText}</span>
                </div>
            `;
            return card;
        }
        
        window.addEventListener('beforeunload', () => unsubscribe?.());
    </script>
    <script src="../js/sports-api.js"></script>
</body>
</html>
