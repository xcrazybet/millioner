<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Results Dashboard - X Lodon | لوحة النتائج</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0f1a; color: white; font-family: 'Segoe UI', 'Tajawal', sans-serif; min-height: 100vh; }
        
        .header { background: #111827; padding: 12px 15px; border-bottom: 2px solid #ff9800; position: sticky; top: 0; z-index: 100; }
        .header-top { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .back-btn { color: #00ff9d; text-decoration: none; font-size: 20px; }
        .lang-toggle, .admin-badge { background: #1a2332; border: 1px solid #ff9800; color: #ff9800; padding: 5px 12px; border-radius: 20px; cursor: pointer; font-size: 12px; }
        .admin-badge { background: #ff980022; cursor: default; }
        .tabs { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 3px; margin-top: 8px; }
        .tab { padding: 8px 12px; background: #1a2332; border-radius: 20px; color: white; text-decoration: none; font-size: 12px; }
        .tab.active { background: #ff9800; color: black; }
        
        .container { max-width: 1400px; margin: 0 auto; padding: 15px; }
        .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .stat-card { background: linear-gradient(135deg, #111827, #1a2332); border-radius: 16px; padding: 15px; border: 1px solid #ff980033; }
        .stat-card .icon { font-size: 28px; color: #ff9800; margin-bottom: 8px; }
        .stat-card .label { font-size: 11px; color: #a0a8c9; text-transform: uppercase; }
        .stat-card .value { font-size: 24px; font-weight: bold; }
        
        .filter-bar { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; align-items: center; background: #111827; padding: 15px; border-radius: 16px; }
        .search-group { flex: 2; min-width: 200px; }
        .search-group input, .filter-group select { width: 100%; padding: 10px 15px; background: #1a2332; border: 1px solid #2a3344; border-radius: 12px; color: white; font-size: 14px; }
        .filter-group { flex: 1; min-width: 150px; }
        .date-range { display: flex; gap: 10px; flex-wrap: wrap; }
        .date-range input { background: #1a2332; border: 1px solid #2a3344; padding: 8px 12px; border-radius: 12px; color: white; }
        .btn-clear { background: #ff5252; border: none; padding: 8px 16px; border-radius: 12px; color: white; cursor: pointer; font-weight: bold; }
        
        .results-table-container { overflow-x: auto; border-radius: 16px; background: #111827; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 14px 12px; text-align: left; border-bottom: 1px solid #2a3344; font-size: 13px; vertical-align: middle; }
        th { background: #0f1422; color: #ff9800; font-weight: 600; position: sticky; top: 0; font-size: 12px; }
        tr:hover { background: #1a2332; cursor: pointer; }
        
        .badge-result { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: bold; }
        .badge-home { background: #4caf50; color: white; }
        .badge-draw { background: #ffc107; color: black; }
        .badge-away { background: #2196f3; color: white; }
        
        .stat-detail { font-size: 11px; color: #a0a8c9; display: flex; gap: 8px; flex-wrap: wrap; }
        .stat-detail span { background: #0a0f1a; padding: 2px 6px; border-radius: 8px; }
        
        .pagination { display: flex; justify-content: center; gap: 8px; margin-top: 25px; flex-wrap: wrap; }
        .page-btn { background: #1a2332; border: none; padding: 8px 14px; border-radius: 8px; color: white; cursor: pointer; transition: 0.2s; }
        .page-btn.active { background: #ff9800; color: black; }
        .page-btn:hover:not(.active) { background: #2a3344; }
        
        .modal-overlay { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.95); z-index:1000; display:none; align-items:center; justify-content:center; padding:20px; }
        .modal-overlay.show { display:flex; }
        .modal-content { background: #111827; border-radius: 24px; padding: 25px; max-width: 800px; width: 100%; max-height: 85vh; overflow-y: auto; border: 2px solid #ff9800; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #ff980033; padding-bottom: 12px; }
        .modal-close { background: none; border: none; color: #a0a8c9; font-size: 24px; cursor: pointer; }
        .detail-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin: 15px 0; }
        .detail-item { background: #1a2332; padding: 12px; border-radius: 12px; }
        .detail-label { font-size: 10px; color: #ff9800; text-transform: uppercase; }
        .detail-value { font-size: 18px; font-weight: bold; margin-top: 5px; }
        .notification { position: fixed; bottom: 20px; right: 20px; background: #4caf50; padding: 12px 20px; border-radius: 8px; z-index: 2000; animation: slideIn 0.3s ease; }
        .notification.error { background: #ff5252; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        
        @media (max-width: 768px) {
            th, td { font-size: 10px; padding: 8px 6px; }
            .stat-detail { display: none; }
        }
        
        .loading-spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid #ff9800; border-top-color: transparent; border-radius: 50%; animation: spin 0.6s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-top">
            <div class="header-left">
                <a href="betting-sport.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
                <h1 style="font-size:18px;"><i class="fas fa-trophy"></i> <span class="en">Results Dashboard</span><span class="ar" style="display:none;">لوحة النتائج</span></h1>
                <span class="admin-badge"><i class="fas fa-chart-line"></i> FULL HISTORY</span>
            </div>
            <button class="lang-toggle" onclick="toggleLanguage()"><span class="en">عربي</span><span class="ar" style="display:none;">English</span></button>
        </div>
        <div class="tabs">
            <a href="betting-sport.html" class="tab">Home</a>
            <a href="live-matches.html" class="tab">Live</a>
            <a href="upcoming-matches.html" class="tab">Upcoming</a>
            <a href="finished-matches.html" class="tab active">Results (All Time)</a>
            <a href="my-bets.html" class="tab">My Bets</a>
        </div>
    </div>
    
    <div class="container">
        <!-- Stats Summary -->
        <div class="stats-row" id="stats-row">
            <div class="stat-card"><div class="icon"><i class="fas fa-list"></i></div><div class="label">Total Matches</div><div class="value" id="total-matches">0</div></div>
            <div class="stat-card"><div class="icon"><i class="fas fa-chart-simple"></i></div><div class="label">Total Goals</div><div class="value" id="total-goals">0</div></div>
            <div class="stat-card"><div class="icon"><i class="fas fa-yellow-card"></i></div><div class="label">Yellow Cards</div><div class="value" id="total-yellow">0</div></div>
            <div class="stat-card"><div class="icon"><i class="fas fa-red-card"></i></div><div class="label">Red Cards</div><div class="value" id="total-red">0</div></div>
            <div class="stat-card"><div class="icon"><i class="fas fa-calendar-week"></i></div><div class="label">Date Range</div><div class="value" id="date-range-label">All</div></div>
        </div>
        
        <!-- Advanced Filter Bar -->
        <div class="filter-bar">
            <div class="search-group"><i class="fas fa-search"></i> <input type="text" id="search-input" placeholder="Search by Fixture ID, Team, League..."></div>
            <div class="filter-group"><select id="league-filter"><option value="">All Leagues</option></select></div>
            <div class="filter-group"><select id="result-filter"><option value="">All Results</option><option value="home">Home Win</option><option value="draw">Draw</option><option value="away">Away Win</option></select></div>
            <div class="date-range"><input type="date" id="date-from" placeholder="From"><input type="date" id="date-to" placeholder="To"></div>
            <button class="btn-clear" onclick="clearFilters()"><i class="fas fa-eraser"></i> Clear</button>
        </div>
        
        <!-- Results Table -->
        <div class="results-table-container">
            <table>
                <thead>
                    <tr>
                        <th>Fixture ID</th><th>Date / Time</th><th>League</th><th>Home Team</th><th>Score</th><th>Away Team</th><th>Result</th><th>Details</th>
                    </tr>
                </thead>
                <tbody id="results-tbody"><tr><td colspan="8" style="text-align:center;"><div class="loading-spinner"></div> Loading matches...</td></tr></tbody>
            </table>
        </div>
        
        <!-- Pagination -->
        <div class="pagination" id="pagination"></div>
    </div>
    
    <!-- Match Detail Modal -->
    <div class="modal-overlay" id="match-modal">
        <div class="modal-content">
            <div class="modal-header"><h3><i class="fas fa-futbol"></i> Match Full Details</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
            <div id="modal-details"></div>
        </div>
    </div>

    <script>
        // ==================== CORRECT SUPABASE CONFIGURATION ====================
        // USING THE CORRECT ANON KEY PROVIDED BY USER
        const SUPABASE_URL = 'https://jnazybaeajyynpyoszmy.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpuYXp5YmFlYWp5eW5weW9zem15Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyNzgwMDMsImV4cCI6MjA5Mjg1NDAwM30.P_8V-_s6DQDiYekZX1yaNup48WBRaLhb3ILAkvzTDTY';
        
        // Initialize Supabase client
        let supabaseClient = null;
        try {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
                auth: { persistSession: false }
            });
            console.log('✅ Supabase client initialized with correct key');
        } catch(e) { 
            console.error('Supabase init error:', e); 
        }
        
        // Firebase Config
        const firebaseConfig = { 
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM", 
            authDomain: "x-bet-prod-jd.firebaseapp.com", 
            projectId: "x-bet-prod-jd", 
            storageBucket: "x-bet-prod-jd.firebasestorage.app", 
            messagingSenderId: "499334334535", 
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962" 
        };
        if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        
        let allMatches = [];
        let filteredMatches = [];
        let currentPage = 1;
        const rowsPerPage = 20;
        
        // ==================== LANGUAGE TOGGLE ====================
        function toggleLanguage() {
            const isEn = document.querySelector('.en:not([style*="display: none"])') !== null;
            document.querySelectorAll('.en').forEach(el => el.style.display = isEn ? 'none' : '');
            document.querySelectorAll('.ar').forEach(el => el.style.display = isEn ? '' : 'none');
            document.documentElement.dir = isEn ? 'rtl' : 'ltr';
            localStorage.setItem('lang', isEn ? 'ar' : 'en');
        }
        if(localStorage.getItem('lang') === 'ar') setTimeout(toggleLanguage, 10);
        
        // ==================== LOAD FINISHED MATCHES (ALL TIME) ====================
        async function loadAllFinishedMatches() {
            const tbody = document.getElementById('results-tbody');
            tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;"><div class="loading-spinner"></div> Loading matches from database...</td></tr>';
            
            try {
                if(!supabaseClient) throw new Error('Supabase client not initialized');
                
                // Method 1: Try with status 'finished'
                let { data, error } = await supabaseClient
                    .from('sports_matches')
                    .select('*')
                    .eq('status', 'finished')
                    .order('start_time', { ascending: false });
                
                if(error) {
                    console.warn('Status "finished" query error:', error.message);
                    // Try alternative status values
                    const { data: altData, error: altError } = await supabaseClient
                        .from('sports_matches')
                        .select('*')
                        .in('status', ['FT', 'fulltime', 'FINISHED', 'complete'])
                        .order('start_time', { ascending: false });
                    
                    if(altError) throw altError;
                    data = altData;
                }
                
                if(data && data.length > 0) {
                    allMatches = data;
                    console.log(`✅ Loaded ${allMatches.length} finished matches`);
                } else {
                    // If no finished matches found, try to get all matches and filter by score presence
                    const { data: allData, error: allError } = await supabaseClient
                        .from('sports_matches')
                        .select('*')
                        .order('start_time', { ascending: false })
                        .limit(200);
                    
                    if(allError) throw allError;
                    
                    // Filter matches that have scores (indicating they are finished)
                    allMatches = (allData || []).filter(m => {
                        const hasScore = m.score && (m.score.home !== undefined || m.score.away !== undefined);
                        const isPast = m.start_time ? new Date(m.start_time) < new Date() : false;
                        return hasScore || isPast;
                    });
                    console.log(`✅ Loaded ${allMatches.length} matches with scores (finished implied)`);
                }
                
                if(allMatches.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;">No finished matches found in database</td></tr>';
                    updateStatistics();
                    return;
                }
                
                // Populate league filter dropdown
                const leagues = [...new Set(allMatches.map(m => m.league_name).filter(Boolean))];
                const leagueSelect = document.getElementById('league-filter');
                leagueSelect.innerHTML = '<option value="">All Leagues</option>' + 
                    leagues.map(l => `<option value="${escapeHtml(l)}">${escapeHtml(l)}</option>`).join('');
                
                updateStatistics();
                applyFilters();
                
            } catch(e) {
                console.error('Load matches error:', e);
                tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;color:#ff5252;">❌ Database error: ${e.message}. Please check connection.</td></tr>`;
                showNotification('Failed to load matches: ' + e.message, 'error');
            }
        }
        
        // ==================== STATISTICS ====================
        function updateStatistics() {
            const total = allMatches.length;
            let totalGoals = 0;
            let totalYellow = 0;
            let totalRed = 0;
            
            allMatches.forEach(m => {
                const homeScore = m.score?.home || 0;
                const awayScore = m.score?.away || 0;
                totalGoals += (homeScore + awayScore);
                totalYellow += (m.cards?.home_yellow || 0) + (m.cards?.away_yellow || 0);
                totalRed += (m.cards?.home_red || 0) + (m.cards?.away_red || 0);
            });
            
            document.getElementById('total-matches').textContent = total;
            document.getElementById('total-goals').textContent = totalGoals;
            document.getElementById('total-yellow').textContent = totalYellow;
            document.getElementById('total-red').textContent = totalRed;
            
            if(allMatches.length > 0) {
                const dates = allMatches.map(m => m.start_time).filter(Boolean).sort();
                if(dates.length) {
                    const firstDate = new Date(dates[dates.length-1]);
                    const lastDate = new Date(dates[0]);
                    const rangeLabel = `${firstDate.toLocaleDateString()} - ${lastDate.toLocaleDateString()}`;
                    document.getElementById('date-range-label').textContent = rangeLabel;
                }
            }
        }
        
        // ==================== FILTERS ====================
        function applyFilters() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const leagueVal = document.getElementById('league-filter').value;
            const resultVal = document.getElementById('result-filter').value;
            const dateFrom = document.getElementById('date-from').value;
            const dateTo = document.getElementById('date-to').value;
            
            filteredMatches = allMatches.filter(match => {
                const homeName = match.home_team?.name || '';
                const awayName = match.away_team?.name || '';
                const leagueName = match.league_name || '';
                const fixtureIdStr = match.fixture_id?.toString() || '';
                
                if(searchTerm && !fixtureIdStr.includes(searchTerm) && 
                   !homeName.toLowerCase().includes(searchTerm) && 
                   !awayName.toLowerCase().includes(searchTerm) &&
                   !leagueName.toLowerCase().includes(searchTerm)) return false;
                
                if(leagueVal && leagueName !== leagueVal) return false;
                
                if(resultVal) {
                    const homeScore = match.score?.home || 0;
                    const awayScore = match.score?.away || 0;
                    let matchResult = '';
                    if(homeScore > awayScore) matchResult = 'home';
                    else if(homeScore < awayScore) matchResult = 'away';
                    else matchResult = 'draw';
                    if(matchResult !== resultVal) return false;
                }
                
                if(dateFrom && match.start_time) {
                    const matchDate = new Date(match.start_time).toISOString().slice(0,10);
                    if(matchDate < dateFrom) return false;
                }
                if(dateTo && match.start_time) {
                    const matchDate = new Date(match.start_time).toISOString().slice(0,10);
                    if(matchDate > dateTo) return false;
                }
                return true;
            });
            
            currentPage = 1;
            renderTable();
            renderPagination();
        }
        
        function clearFilters() {
            document.getElementById('search-input').value = '';
            document.getElementById('league-filter').value = '';
            document.getElementById('result-filter').value = '';
            document.getElementById('date-from').value = '';
            document.getElementById('date-to').value = '';
            applyFilters();
        }
        
        // ==================== RENDER TABLE ====================
        function renderTable() {
            const tbody = document.getElementById('results-tbody');
            if(!filteredMatches.length) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;">No matches match your filters</td></tr>';
                return;
            }
            
            const start = (currentPage - 1) * rowsPerPage;
            const pageMatches = filteredMatches.slice(start, start + rowsPerPage);
            
            tbody.innerHTML = '';
            pageMatches.forEach(match => {
                const homeName = match.home_team?.name || 'Home Team';
                const awayName = match.away_team?.name || 'Away Team';
                const homeScore = match.score?.home ?? 0;
                const awayScore = match.score?.away ?? 0;
                let resultClass = '', resultText = '';
                if(homeScore > awayScore) { resultClass = 'badge-home'; resultText = 'HOME WIN'; }
                else if(homeScore < awayScore) { resultClass = 'badge-away'; resultText = 'AWAY WIN'; }
                else { resultClass = 'badge-draw'; resultText = 'DRAW'; }
                
                const matchDate = match.start_time ? new Date(match.start_time).toLocaleString() : 'Date TBD';
                const fixtureId = match.fixture_id || match.id || 'N/A';
                
                const yellowTotal = (match.cards?.home_yellow || 0) + (match.cards?.away_yellow || 0);
                const redTotal = (match.cards?.home_red || 0) + (match.cards?.away_red || 0);
                const possession = match.stats?.possession_home || '-';
                
                const row = document.createElement('tr');
                row.onclick = () => showMatchDetails(match);
                row.style.cursor = 'pointer';
                row.innerHTML = `
                    <td><strong>#${fixtureId}</strong></td>
                    <td style="font-size:11px;">${matchDate}</td>
                    <td>${escapeHtml(match.league_name || 'League')}</td>
                    <td>${escapeHtml(homeName)}</td>
                    <td style="font-weight:bold; font-size:18px;">${homeScore} - ${awayScore}</td>
                    <td>${escapeHtml(awayName)}</td>
                    <td><span class="badge-result ${resultClass}">${resultText}</span></td>
                    <td class="stat-detail">
                        <span><i class="fas fa-yellow-card"></i> ${yellowTotal}</span>
                        <span><i class="fas fa-red-card"></i> ${redTotal}</span>
                        <span><i class="fas fa-chart-line"></i> ${possession}%</span>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }
        
        function renderPagination() {
            const totalPages = Math.ceil(filteredMatches.length / rowsPerPage);
            const paginationDiv = document.getElementById('pagination');
            if(totalPages <= 1) { paginationDiv.innerHTML = ''; return; }
            
            let html = `<button class="page-btn" onclick="goToPage(1)" ${currentPage===1?'disabled style="opacity:0.5;"':''}><i class="fas fa-angle-double-left"></i></button>`;
            html += `<button class="page-btn" onclick="goToPage(${currentPage-1})" ${currentPage===1?'disabled style="opacity:0.5;"':''}><i class="fas fa-angle-left"></i></button>`;
            
            let startPage = Math.max(1, currentPage - 2);
            let endPage = Math.min(totalPages, currentPage + 2);
            for(let i=startPage; i<=endPage; i++) {
                html += `<button class="page-btn ${i===currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
            }
            
            html += `<button class="page-btn" onclick="goToPage(${currentPage+1})" ${currentPage===totalPages?'disabled style="opacity:0.5;"':''}><i class="fas fa-angle-right"></i></button>`;
            html += `<button class="page-btn" onclick="goToPage(${totalPages})" ${currentPage===totalPages?'disabled style="opacity:0.5;"':''}><i class="fas fa-angle-double-right"></i></button>`;
            paginationDiv.innerHTML = html;
        }
        
        function goToPage(page) {
            const totalPages = Math.ceil(filteredMatches.length / rowsPerPage);
            if(page < 1 || page > totalPages) return;
            currentPage = page;
            renderTable();
            renderPagination();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        
        // ==================== DETAIL MODAL ====================
        function showMatchDetails(match) {
            const modal = document.getElementById('match-modal');
            const detailsDiv = document.getElementById('modal-details');
            
            const homeName = match.home_team?.name || 'Home';
            const awayName = match.away_team?.name || 'Away';
            const homeLogo = match.home_team?.logo || '';
            const awayLogo = match.away_team?.logo || '';
            const homeScore = match.score?.home ?? 0;
            const awayScore = match.score?.away ?? 0;
            const homeYellow = match.cards?.home_yellow || 0;
            const awayYellow = match.cards?.away_yellow || 0;
            const homeRed = match.cards?.home_red || 0;
            const awayRed = match.cards?.away_red || 0;
            const htHome = match.score?.halftime_home ?? '-';
            const htAway = match.score?.halftime_away ?? '-';
            const stats = match.stats || {};
            
            detailsDiv.innerHTML = `
                <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:20px;">
                    <div style="text-align:center;">
                        ${homeLogo ? `<img src="${homeLogo}" style="width:50px; height:50px; object-fit:contain; border-radius:50%; background:#fff; padding:3px;" onerror="this.style.display='none'">` : '<i class="fas fa-shield-alt" style="font-size:40px;"></i>'}
                        <br><strong>${escapeHtml(homeName)}</strong>
                    </div>
                    <div style="font-size:32px; font-weight:bold;">${homeScore} - ${awayScore}</div>
                    <div style="text-align:center;">
                        ${awayLogo ? `<img src="${awayLogo}" style="width:50px; height:50px; object-fit:contain; border-radius:50%; background:#fff; padding:3px;" onerror="this.style.display='none'">` : '<i class="fas fa-shield-alt" style="font-size:40px;"></i>'}
                        <br><strong>${escapeHtml(awayName)}</strong>
                    </div>
                </div>
                <div class="detail-grid">
                    <div class="detail-item"><div class="detail-label">Fixture ID</div><div class="detail-value">#${match.fixture_id || match.id}</div></div>
                    <div class="detail-item"><div class="detail-label">Match Date / Time</div><div class="detail-value">${match.start_time ? new Date(match.start_time).toLocaleString() : 'N/A'}</div></div>
                    <div class="detail-item"><div class="detail-label">League / Round</div><div class="detail-value">${escapeHtml(match.league_name || 'N/A')} ${match.round ? `(${match.round})` : ''}</div></div>
                    <div class="detail-item"><div class="detail-label">Referee</div><div class="detail-value">${match.referee || 'N/A'}</div></div>
                    <div class="detail-item"><div class="detail-label">🏆 Half Time Score</div><div class="detail-value">${htHome} - ${htAway}</div></div>
                    <div class="detail-item"><div class="detail-label">⚽ Total Goals</div><div class="detail-value">${homeScore + awayScore}</div></div>
                    <div class="detail-item"><div class="detail-label">🟨 Yellow Cards</div><div class="detail-value">${homeYellow} (Home) | ${awayYellow} (Away) | Total: ${homeYellow+awayYellow}</div></div>
                    <div class="detail-item"><div class="detail-label">🟥 Red Cards</div><div class="detail-value">${homeRed} (Home) | ${awayRed} (Away) | Total: ${homeRed+awayRed}</div></div>
                    <div class="detail-item"><div class="detail-label">Possession</div><div class="detail-value">${stats.possession_home || '-'}% / ${stats.possession_away || '-'}%</div></div>
                    <div class="detail-item"><div class="detail-label">Shots on Target</div><div class="detail-value">${stats.shots_on_target_home || '-'} / ${stats.shots_on_target_away || '-'}</div></div>
                    <div class="detail-item"><div class="detail-label">Corners</div><div class="detail-value">${stats.corners_home || '-'} / ${stats.corners_away || '-'}</div></div>
                </div>
                <div style="margin-top:15px; background:#0a0f1a; padding:10px; border-radius:12px; font-size:12px;">
                    <i class="fas fa-flag-checkered"></i> <strong>Settlement Status:</strong> ${match.bets_settled ? '✅ Settled' : '⏳ Pending'}
                </div>
            `;
            modal.classList.add('show');
        }
        
        function closeModal() {
            document.getElementById('match-modal').classList.remove('show');
        }
        
        function showNotification(msg, type) {
            const n = document.createElement('div');
            n.className = `notification ${type || ''}`;
            n.innerHTML = `<i class="fas ${type==='error'?'fa-exclamation-circle':'fa-info-circle'}"></i> ${msg}`;
            document.body.appendChild(n);
            setTimeout(() => n.remove(), 3000);
        }
        
        function escapeHtml(str) { 
            if(!str) return ''; 
            return String(str).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); 
        }
        
        // ==================== INIT ====================
        firebase.auth().onAuthStateChanged(async (user) => {
            if(!user) { 
                window.location.href = '../login.html'; 
                return; 
            }
            await loadAllFinishedMatches();
        });
        
        // Event listeners
        document.getElementById('search-input').addEventListener('input', applyFilters);
        document.getElementById('league-filter').addEventListener('change', applyFilters);
        document.getElementById('result-filter').addEventListener('change', applyFilters);
        document.getElementById('date-from').addEventListener('change', applyFilters);
        document.getElementById('date-to').addEventListener('change', applyFilters);
        
        window.toggleLanguage = toggleLanguage;
        window.goToPage = goToPage;
        window.clearFilters = clearFilters;
        window.showMatchDetails = showMatchDetails;
        window.closeModal = closeModal;
        
        console.log('✅ Results Dashboard loaded with correct Supabase key');
    </script>
</body>
</html>
