<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results - X Lodon</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="../css/sports-betting.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0f1a; color: white; font-family: 'Segoe UI', sans-serif; min-height: 100vh; }
        .header { background: #111827; padding: 15px; border-bottom: 2px solid #a0a8c9; position: sticky; top: 0; z-index: 100; }
        .header h1 { font-size: 20px; display: flex; align-items: center; gap: 10px; }
        .back-btn { color: #00ff9d; text-decoration: none; margin-right: 10px; }
        .tabs { display: flex; gap: 5px; margin-top: 10px; overflow-x: auto; }
        .tab { padding: 10px 15px; background: #1a2332; border-radius: 25px; color: white; text-decoration: none; font-size: 13px; }
        .tab.active { background: #a0a8c9; color: black; }
        .container { max-width: 1200px; margin: 0 auto; padding: 15px; }
        .info-banner { background: #ff980022; padding: 12px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #ff980044; color: #ff9800; font-size: 13px; }
        .match-card { background: #111827; border-radius: 12px; padding: 15px; margin-bottom: 12px; border-left: 4px solid #a0a8c9; }
        .match-league { color: #a0a8c9; font-size: 13px; margin-bottom: 8px; }
        .match-teams { display: flex; align-items: center; justify-content: space-around; margin: 10px 0; }
        .team { text-align: center; flex: 1; font-weight: 600; }
        .score { font-size: 28px; font-weight: bold; }
        .result-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; margin-top: 8px; }
        .result-badge.home { background: #4caf50; color: white; }
        .result-badge.draw { background: #ffc107; color: black; }
        .result-badge.away { background: #2196f3; color: white; }
        .empty-state { text-align: center; padding: 50px; color: #a0a8c9; }
        .date-header { color: #a0a8c9; font-size: 14px; margin: 20px 0 15px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>
            <a href="betting-sport.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
            <i class="fas fa-futbol"></i> X Lodon Sports
        </h1>
        <div class="tabs">
            <a href="betting-sport.html" class="tab">Home</a>
            <a href="live-matches.html" class="tab">Live</a>
            <a href="upcoming-matches.html" class="tab">Upcoming</a>
            <a href="finished-matches.html" class="tab active">Results</a>
            <a href="my-bets.html" class="tab">My Bets</a>
        </div>
    </div>
    
    <div class="container">
        <div class="info-banner">
            <i class="fas fa-info-circle"></i> Results displayed for 24 hours after match completion
        </div>
        
        <div id="matches-container"></div>
        <div id="empty-state" class="empty-state" style="display:none;">
            <i class="fas fa-trophy" style="font-size:48px; opacity:0.3;"></i>
            <p>No recent results</p>
        </div>
    </div>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), db = firebase.firestore();
        
        auth.onAuthStateChanged(u => { if (!u) location.href = '../login.html'; else loadResults(); });
        
        function loadResults() {
            const now = new Date();
            
            db.collection('sports_matches')
                .where('status', '==', 'finished')
                .where('expiresAt', '>', now)
                .orderBy('expiresAt', 'desc')
                .onSnapshot(snap => {
                    const container = document.getElementById('matches-container');
                    const empty = document.getElementById('empty-state');
                    
                    if (snap.empty) {
                        container.style.display = 'none';
                        empty.style.display = 'block';
                    } else {
                        container.style.display = 'block';
                        empty.style.display = 'none';
                        
                        const grouped = {};
                        snap.forEach(d => {
                            const m = d.data();
                            const date = m.startTime.toDate();
                            const key = date.toDateString();
                            if (!grouped[key]) grouped[key] = [];
                            grouped[key].push(m);
                        });
                        
                        container.innerHTML = '';
                        
                        Object.keys(grouped).sort().reverse().forEach(key => {
                            const header = document.createElement('div');
                            header.className = 'date-header';
                            header.innerHTML = `<i class="far fa-calendar"></i> ${new Date(key).toLocaleDateString('en-US', {weekday:'long', month:'short', day:'numeric'})}`;
                            container.appendChild(header);
                            
                            grouped[key].forEach(m => container.appendChild(createCard(m)));
                        });
                    }
                });
        }
        
        function createCard(m) {
            const card = document.createElement('div');
            card.className = 'match-card';
            
            const resultText = m.result === 'home' ? 'HOME WIN' : m.result === 'draw' ? 'DRAW' : 'AWAY WIN';
            
            card.innerHTML = `
                <div class="match-league"><i class="fas fa-trophy"></i> ${m.leagueName||'League'}</div>
                <div class="match-teams">
                    <span class="team">${m.homeTeam?.name||'Home'}</span>
                    <span class="score">${m.score?.home||0} - ${m.score?.away||0}</span>
                    <span class="team">${m.awayTeam?.name||'Away'}</span>
                </div>
                <div style="text-align:center;">
                    <span class="result-badge ${m.result}">${resultText}</span>
                </div>
                <div style="color:#a0a8c9; font-size:11px; margin-top:10px; text-align:right;">
                    <i class="far fa-clock"></i> Final
                </div>
            `;
            return card;
        }
    </script>
</body>
</html>
