<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Results Dashboard - X Lodon | Latest Scores & Stats</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        :root{--bg:#0a0f1a;--bg2:#111827;--bg3:#1a2332;--green:#00ff9d;--orange:#ff9800;--red:#ff5252;--blue:#2196F3;--text:#fff;--text2:#a0a8c9;--border:rgba(255,255,255,0.08)}
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:var(--bg);color:var(--text);font-family:'Segoe UI','Tajawal',sans-serif;min-height:100vh}
        .header{background:var(--bg2);padding:12px 15px;border-bottom:2px solid var(--orange);position:sticky;top:0;z-index:100}
        .header-top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
        .header-left{display:flex;align-items:center;gap:10px}
        .back-btn{color:var(--green);text-decoration:none;font-size:20px;transition:transform 0.2s}
        .back-btn:hover{transform:scale(1.1)}
        .tabs{display:flex;gap:5px;overflow-x:auto;padding-bottom:3px;margin-top:8px}
        .tab{padding:8px 12px;background:var(--bg3);border-radius:20px;color:var(--text);text-decoration:none;font-size:12px;white-space:nowrap;transition:0.3s}
        .tab:hover{background:#2a3344}.tab.active{background:var(--orange);color:black}
        .container{max-width:1400px;margin:0 auto;padding:15px}
        
        .debug-bar{background:var(--bg3);padding:10px 15px;border-radius:12px;font-size:11px;margin-bottom:15px;border:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-family:monospace}
        .debug-bar .dot{width:8px;height:8px;border-radius:50%;animation:pulse 1.5s infinite}
        .debug-bar .dot.green{background:var(--green)}
        .debug-bar .dot.red{background:var(--red)}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
        
        .stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:20px}
        .stat-card{background:linear-gradient(135deg,var(--bg2),var(--bg3));border-radius:14px;padding:16px;border:1px solid rgba(255,152,0,0.2);transition:0.3s;cursor:pointer}
        .stat-card:hover{transform:translateY(-3px);border-color:var(--orange);box-shadow:0 8px 25px rgba(255,152,0,0.1)}
        .stat-card .icon{font-size:22px;margin-bottom:5px}
        .stat-card .label{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:0.5px}
        .stat-card .value{font-size:22px;font-weight:900;margin-top:3px}
        .stat-card .value.green{color:#4caf50}.stat-card .value.red{color:var(--red)}.stat-card .value.orange{color:var(--orange)}
        
        .filter-bar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px;align-items:center;background:var(--bg2);padding:14px 18px;border-radius:14px;border:1px solid var(--border)}
        .search-group{flex:2;min-width:160px;position:relative}
        .search-group input{width:100%;padding:10px 15px 10px 38px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:12px;transition:0.3s}
        .search-group input:focus{border-color:var(--orange);outline:none}
        .search-group i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text2)}
        .filter-group select{padding:10px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:12px;cursor:pointer;min-width:120px;transition:0.3s}
        .filter-group select:focus{border-color:var(--orange);outline:none}
        .btn-refresh{background:linear-gradient(135deg,var(--orange),#f57c00);border:none;padding:10px 22px;border-radius:10px;color:black;cursor:pointer;font-weight:700;transition:0.3s;font-size:12px}
        .btn-refresh:hover{transform:scale(1.03);box-shadow:0 4px 20px rgba(255,152,0,0.3)}
        .btn-playground{background:linear-gradient(135deg,var(--green),#00cc7d);border:none;padding:10px 22px;border-radius:10px;color:black;cursor:pointer;font-weight:700;transition:0.3s;font-size:12px}
        .btn-playground:hover{transform:scale(1.03);box-shadow:0 4px 20px rgba(0,255,157,0.3)}
        
        .results-table-container{overflow-x:auto;border-radius:14px;background:var(--bg2);border:1px solid var(--border);max-height:65vh;overflow-y:auto}
        table{width:100%;border-collapse:collapse}
        th,td{padding:10px 10px;text-align:left;border-bottom:1px solid var(--border);font-size:11px;vertical-align:middle}
        th{background:#0f1422;color:var(--orange);font-weight:700;position:sticky;top:0;z-index:10;font-size:10px;text-transform:uppercase}
        tr{transition:0.2s}tr:hover{background:var(--bg3);cursor:pointer}
        .team-cell{display:flex;align-items:center;gap:8px}
        .team-cell .logo{width:24px;height:24px;object-fit:contain;border-radius:50%;background:rgba(255,255,255,0.05);padding:2px}
        .score-cell{font-weight:900;color:var(--orange);text-align:center;font-size:16px;min-width:60px}
        .badge-status{display:inline-block;padding:3px 10px;border-radius:20px;font-size:9px;font-weight:700;text-transform:uppercase}
        .badge-status.finished{background:#4caf50;color:white}
        .badge-status.live{background:var(--red);color:white;animation:pulse 1.5s infinite}
        .badge-status.upcoming{background:var(--green);color:black}
        .badge-result{display:inline-block;padding:3px 10px;border-radius:20px;font-size:9px;font-weight:700}
        .badge-result.home-win{background:#4caf50;color:white}
        .badge-result.draw{background:#ffc107;color:black}
        .badge-result.away-win{background:var(--blue);color:white}
        
        .quick-stats{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
        .quick-stat{font-size:9px;background:rgba(0,0,0,0.3);padding:2px 8px;border-radius:10px;display:flex;align-items:center;gap:3px}
        .quick-stat i{font-size:9px}
        .quick-stat.yellow{color:#ffc107}.quick-stat.red{color:var(--red)}.quick-stat.corner{color:var(--blue)}
        
        .pagination{display:flex;justify-content:center;gap:6px;margin-top:18px;flex-wrap:wrap}
        .page-btn{background:var(--bg3);border:1px solid var(--border);padding:8px 14px;border-radius:8px;color:var(--text);cursor:pointer;transition:0.3s;font-weight:500}
        .page-btn:hover:not(:disabled){background:#2a3344;border-color:var(--orange)}
        .page-btn.active{background:var(--orange);color:black;border-color:var(--orange)}
        .page-btn:disabled{opacity:0.3;cursor:not-allowed}
        
        .empty-state{text-align:center;padding:60px 20px}
        .empty-state i{font-size:60px;opacity:0.2;margin-bottom:12px;color:var(--orange)}
        .empty-state h3{font-size:18px;margin-bottom:6px}
        .empty-state p{color:var(--text2)}
        
        .loading-spinner{display:inline-block;width:28px;height:28px;border:3px solid var(--orange);border-top-color:transparent;border-radius:50%;animation:spin 0.6s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
        
        .notification{position:fixed;bottom:25px;right:25px;padding:12px 20px;border-radius:10px;z-index:2000;animation:slideIn 0.4s ease;font-weight:600;box-shadow:0 6px 25px rgba(0,0,0,0.5)}
        .notification.success{background:#4caf50;color:white}
        .notification.error{background:var(--red);color:white}
        .notification.info{background:var(--blue);color:white}
        @keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
        
        @media(max-width:768px){.stats-row{grid-template-columns:repeat(2,1fr)}.filter-bar{flex-direction:column;align-items:stretch}th,td{font-size:10px;padding:8px 6px}.team-cell .logo{width:18px;height:18px}.score-cell{font-size:13px;min-width:40px}}
    </style>
</head>
<body>
    <div class="header">
        <div class="header-top">
            <div class="header-left">
                <a href="betting-sport.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
                <h1 style="font-size:18px;"><i class="fas fa-trophy"></i> Results Dashboard</h1>
            </div>
            <div style="display:flex;align-items:center;gap:8px;">
                <span id="user-email" style="font-size:11px;color:var(--text2);"></span>
                <button class="btn-playground" onclick="openPlayground()"><i class="fas fa-futbol"></i> Playground</button>
            </div>
        </div>
        <div class="tabs">
            <a href="betting-sport.html" class="tab">🏠 Home</a>
            <a href="live-matches.html" class="tab">🔴 Live</a>
            <a href="upcoming-matches.html" class="tab">⏳ Upcoming</a>
            <a href="finished-matches.html" class="tab active">✅ Results</a>
            <a href="my-bets.html" class="tab">📋 My Bets</a>
        </div>
    </div>
    
    <div class="container">
        <div class="debug-bar">
            <span class="dot green"></span>
            <span id="debug-text">Initializing...</span>
            <span style="margin-left:auto;font-size:10px;" id="api-time"></span>
        </div>
        
        <div class="stats-row" id="stats-row">
            <div class="stat-card" onclick="filterByStatus('all')"><div class="icon">📊</div><div class="label">Total Matches</div><div class="value orange" id="total-matches">0</div></div>
            <div class="stat-card" onclick="filterByStatus('finished')"><div class="icon">✅</div><div class="label">Finished</div><div class="value green" id="finished-count">0</div></div>
            <div class="stat-card" onclick="filterByStatus('live')"><div class="icon">🔴</div><div class="label">Live</div><div class="value red" id="live-count">0</div></div>
            <div class="stat-card" onclick="filterByStatus('upcoming')"><div class="icon">⏳</div><div class="label">Upcoming</div><div class="value blue" id="upcoming-count" style="color:var(--blue)">0</div></div>
        </div>
        
        <div class="filter-bar">
            <div class="search-group"><i class="fas fa-search"></i><input type="text" id="search-input" placeholder="Search teams, league, fixture..." oninput="applyFilters()"></div>
            <div class="filter-group"><select id="status-filter" onchange="applyFilters()"><option value="all">📊 All</option><option value="finished" selected>✅ Finished</option><option value="live">🔴 Live</option><option value="upcoming">⏳ Upcoming</option></select></div>
            <div class="filter-group"><select id="result-filter" onchange="applyFilters()"><option value="">🏆 All Results</option><option value="home">🏠 Home Win</option><option value="draw">🤝 Draw</option><option value="away">✈️ Away Win</option></select></div>
            <button class="btn-refresh" onclick="loadData()"><i class="fas fa-sync-alt"></i> Refresh</button>
        </div>
        
        <div class="results-table-container" id="results-container">
            <div style="text-align:center;padding:50px;"><div class="loading-spinner"></div> Loading...</div>
        </div>
        
        <div class="pagination" id="pagination"></div>
    </div>

    <script>
        // ============================================
        // RESULTS DASHBOARD v3.0 - API DIRECT
        // Real scores, cards, corners from API
        // ============================================
        const API_BASE='https://muddy-wildflower-a70d.dilovantalan.workers.dev';
        const SUPABASE_URL='https://jnazybaeajyynpyoszmy.supabase.co';
        const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpuYXp5YmFlYWp5eW5weW9zem15Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyNzgwMDMsImV4cCI6MjA5Mjg1NDAwM30.P_8V-_s6DQDiYekZX1yaNup48WBRaLhb3ILAkvzTDTY';
        let supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
        const firebaseConfig={apiKey:"AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",authDomain:"x-bet-prod-jd.firebaseapp.com",projectId:"x-bet-prod-jd",storageBucket:"x-bet-prod-jd.firebasestorage.app",messagingSenderId:"499334334535",appId:"1:499334334535:web:bebc1bf817e24d9e3c4962"};
        if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
        const auth=firebase.auth();
        
        let allMatches=[],filteredMatches=[],currentPage=1,rowsPerPage=20,apiStatsCache={},enrichedMatches=[];
        
        function escapeHtml(s){if(!s)return'';return String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));}
        function formatDate(d){if(!d)return'TBD';return new Date(d).toLocaleString('en-US',{weekday:'short',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});}
        function showNotification(m,t='info'){const n=document.createElement('div');n.className=`notification ${t}`;n.innerHTML=m;document.body.appendChild(n);setTimeout(()=>n.remove(),3000);}
        function isFinished(m){if(!m)return false;const s=(m.status||'').toLowerCase();if(['finished','ft','fulltime','complete','final','ended'].includes(s))return true;if(m.score&&m.score.home!==undefined&&m.score.away!==undefined){const d=new Date(m.start_time);if(Date.now()-d>2*60*60*1000)return true;}return false;}
        function getResult(m){const hs=m.score?.home,as=m.score?.away;if(hs===undefined||hs===null||as===undefined||as===null)return{text:'Pending',class:'pending',icon:'⏳'};if(hs>as)return{text:'Home Win',class:'home-win',icon:'🏠'};if(hs<as)return{text:'Away Win',class:'away-win',icon:'✈️'};return{text:'Draw',class:'draw',icon:'🤝'};}
        function filterByStatus(s){document.getElementById('status-filter').value=s;applyFilters();}
        function openPlayground(){const fid=prompt('Enter Fixture ID to open Playground:','');if(fid)window.open(`playground.html?id=${fid}`,'_blank');}
        
        // ===== FETCH MATCH STATS FROM API =====
        async function fetchMatchStats(fid){
            if(apiStatsCache[fid])return apiStatsCache[fid];
            try{
                const[evResp,stResp]=await Promise.all([
                    fetch(`${API_BASE}/api/fixtures/events/${fid}`).catch(()=>null),
                    fetch(`${API_BASE}/api/fixtures/statistics/${fid}`).catch(()=>null)
                ]);
                let events=[],stats={};
                if(evResp&&evResp.ok){const d=await evResp.json();events=d.data||d.response||[];}
                if(stResp&&stResp.ok){const d=await stResp.json();const raw=d.data||d.response||[];if(raw.length){raw.forEach(r=>{const tn=r.team?.name||'Unknown';(r.statistics||[]).forEach(s=>{const k=s.type?.replace(/\s+/g,'_').toLowerCase();if(k){if(!stats[k])stats[k]={};stats[k][tn]=s.value;}});});}}
                const result={events,stats,summary:genSummary(events,stats)};
                apiStatsCache[fid]=result;return result;
            }catch(e){return{events:[],stats:{},summary:{}};}
        }
        
        function genSummary(ev,st){
            const s={goals:{home:0,away:0},yellowCards:{home:0,away:0},redCards:{home:0,away:0},corners:{home:0,away:0},subs:0};
            ev.forEach(e=>{const side=e.team?.name?.toLowerCase().includes('home')?'home':'away';if(e.type==='Goal')s.goals[side]++;if(e.type==='Card'){if(e.detail?.includes('Yellow'))s.yellowCards[side]++;if(e.detail?.includes('Red'))s.redCards[side]++;}if(e.type==='subst')s.subs++;});
            const cd=st['corner_kicks'];if(cd){const ks=Object.keys(cd);if(ks[0])s.corners.home=parseInt(cd[ks[0]])||0;if(ks[1])s.corners.away=parseInt(cd[ks[1]])||0;}
            return s;
        }
        
        // ===== LOAD DATA =====
        async function loadData(){
            const dc=document.getElementById('debug-text'),at=document.getElementById('api-time'),rc=document.getElementById('results-container');
            dc.innerHTML='<div class="loading-spinner" style="width:14px;height:14px;"></div> Fetching...';
            rc.innerHTML='<div style="text-align:center;padding:50px;"><div class="loading-spinner"></div> Loading matches...</div>';
            
            try{
                const today=new Date().toISOString().split('T')[0];
                const lastWeek=new Date(Date.now()-7*86400000).toISOString().split('T')[0];
                const nextWeek=new Date(Date.now()+3*86400000).toISOString().split('T')[0];
                
                const st=Date.now();
                const resp=await fetch(`${API_BASE}/api/fixtures/range/${lastWeek}/${nextWeek}`);
                const elapsed=Date.now()-st;
                at.textContent=`⏱️ ${elapsed}ms`;
                
                if(!resp.ok)throw new Error(`HTTP ${resp.status}`);
                const data=await resp.json();
                let fixtures=data.data||data.response||[];
                
                // Also get from Supabase
                try{const{data:sbData}=await supabaseClient.from('sports_matches').select('*').order('start_time',{ascending:false}).limit(500);if(sbData&&sbData.length){const sbIds=new Set(fixtures.map(f=>f.fixture?.id||f.id));sbData.forEach(m=>{if(!sbIds.has(m.fixture_id)){fixtures.push({fixture:m,teams:{home:m.home_team,away:m.away_team},league:m,match:m});}});}}catch(e){}
                
                allMatches=fixtures.map(f=>{
                    const fix=f.fixture||f,fxId=fix.id||f.id||0,teams=f.teams||{},lg=f.league||{};
                    let homeTeam=teams.home||f.home_team||{},awayTeam=teams.away||f.away_team||{};
                    if(typeof homeTeam==='string')try{homeTeam=JSON.parse(homeTeam)}catch(e){homeTeam={name:homeTeam};}
                    if(typeof awayTeam==='string')try{awayTeam=JSON.parse(awayTeam)}catch(e){awayTeam={name:awayTeam};}
                    const sc=fix.score||f.score||{};
                    return{fixture_id:fxId,status:fix.status?.short||fix.status||'NS',elapsed:fix.status?.elapsed||0,start_time:fix.date||f.start_time||'',home_team:homeTeam,away_team:awayTeam,league_name:lg.name||f.league_name||'',score:{home:fix.goals?.home||sc.fulltime?.home||sc.home||0,away:fix.goals?.away||sc.fulltime?.away||sc.away||0}};
                });
                
                // Sort: finished first, then by date
                allMatches.sort((a,b)=>{const af=isFinished(a)?1:0,bf=isFinished(b)?1:0;if(af!==bf)return bf-af;return new Date(b.start_time)-new Date(a.start_time);});
                
                const fin=allMatches.filter(m=>isFinished(m)),live=allMatches.filter(m=>m.status==='live'||m.status==='1H'||m.status==='2H'),up=allMatches.filter(m=>!isFinished(m)&&m.status!=='live'&&m.status!=='1H'&&m.status!=='2H');
                
                document.getElementById('total-matches').textContent=allMatches.length;
                document.getElementById('finished-count').textContent=fin.length;
                document.getElementById('live-count').textContent=live.length;
                document.getElementById('upcoming-count').textContent=up.length;
                dc.innerHTML=`✅ <strong>${allMatches.length}</strong> matches | ✅${fin.length} finished | 🔴${live.length} live | ⏳${up.length} upcoming`;
                
                // Enrich with API stats (batch)
                await enrichMatches();
                applyFilters();
                showNotification(`✅ ${fin.length} results loaded`,'success');
            }catch(e){dc.innerHTML=`❌ ${e.message}`;rc.innerHTML=`<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><h3>Error</h3><p>${e.message}</p></div>`;}
        }
        
        async function enrichMatches(){
            const fin=allMatches.filter(m=>isFinished(m)).slice(0,30);
            for(const m of fin){
                try{const s=await fetchMatchStats(m.fixture_id);m._stats=s;}catch(e){m._stats=null;}
            }
        }
        
        function applyFilters(){
            const search=(document.getElementById('search-input').value||'').toLowerCase(),sf=document.getElementById('status-filter').value,rf=document.getElementById('result-filter').value;
            filteredMatches=allMatches.filter(m=>{
                if(search){const hn=(m.home_team?.name||'').toLowerCase(),an=(m.away_team?.name||'').toLowerCase(),ln=(m.league_name||'').toLowerCase(),fid=(m.fixture_id?.toString()||'');if(!hn.includes(search)&&!an.includes(search)&&!ln.includes(search)&&!fid.includes(search))return false;}
                if(sf!=='all'){if(sf==='finished'&&!isFinished(m))return false;if(sf==='live'&&m.status!=='live'&&m.status!=='1H'&&m.status!=='2H')return false;if(sf==='upcoming'&&(isFinished(m)||m.status==='live'||m.status==='1H'||m.status==='2H'))return false;}
                if(rf&&m.score){const hs=m.score.home||0,as=m.score.away||0;if(rf==='home'&&hs<=as)return false;if(rf==='away'&&as<=hs)return false;if(rf==='draw'&&hs!==as)return false;}
                return true;
            });
            currentPage=1;renderTable();renderPagination();
        }
        
        function renderTable(){
            const c=document.getElementById('results-container');
            if(!filteredMatches.length){c.innerHTML='<div class="empty-state"><i class="fas fa-search"></i><h3>No matches found</h3><p>Try different filters</p></div>';return;}
            const si=(currentPage-1)*rowsPerPage,pm=filteredMatches.slice(si,si+rowsPerPage);
            let h=`<table><thead><tr><th>#</th><th>League</th><th>Home</th><th>Score</th><th>Away</th><th>Cards/Corners</th><th>Status</th><th>Result</th><th>Play</th></tr></thead><tbody>`;
            for(const m of pm){
                const hn=m.home_team?.name||'Home',an=m.away_team?.name||'Away',hl=m.home_team?.logo||'',al=m.away_team?.logo||'',fi=isFinished(m);
                let hs='?',as='?';if(m.score){hs=m.score.home!==undefined?m.score.home:'?';as=m.score.away!==undefined?m.score.away:'?';}
                let sc='upcoming',st='⏳ UPCOMING';if(fi){sc='finished';st='✅ FINISHED';}else if(m.status==='live'||m.status==='1H'||m.status==='2H'){sc='live';st='🔴 LIVE';}
                const res=getResult(m);
                // Quick stats from API
                let qs='-';if(m._stats&&m._stats.summary){const ss=m._stats.summary;qs=`<div class="quick-stats"><span class="quick-stat yellow">🟨 ${(ss.yellowCards?.home||0)+(ss.yellowCards?.away||0)}</span><span class="quick-stat red">🟥 ${(ss.redCards?.home||0)+(ss.redCards?.away||0)}</span><span class="quick-stat corner">🚩 ${(ss.corners?.home||0)+(ss.corners?.away||0)}</span></div>`;}
                const fid=m.fixture_id||m.id||'';
                h+=`<tr onclick="openPlaygroundForMatch('${fid}')"><td><strong>#${fid}</strong></td><td>${escapeHtml(m.league_name||'N/A')}</td><td><div class="team-cell">${hl?`<img class="logo" src="${hl}" onerror="this.style.display='none'">`:''}<span>${escapeHtml(hn)}</span></div></td><td class="score-cell">${hs} - ${as}</td><td><div class="team-cell">${al?`<img class="logo" src="${al}" onerror="this.style.display='none'">`:''}<span>${escapeHtml(an)}</span></div></td><td>${qs}</td><td><span class="badge-status ${sc}">${st}</span></td><td>${res.class!=='pending'?`<span class="badge-result ${res.class}">${res.icon} ${res.text}</span>`:'<span style="color:var(--text2);font-size:10px;">⏳ Pending</span>'}</td><td><button class="btn-playground" style="padding:4px 10px;font-size:10px;" onclick="event.stopPropagation();openPlaygroundForMatch('${fid}')"><i class="fas fa-futbol"></i></button></td></tr>`;
            }
            h+='</tbody></table>';c.innerHTML=h;
        }
        
        function renderPagination(){const tp=Math.ceil(filteredMatches.length/rowsPerPage),pd=document.getElementById('pagination');if(tp<=1){pd.innerHTML='';return;}let h=`<button class="page-btn" onclick="goToPage(1)" ${currentPage===1?'disabled':''}>«</button><button class="page-btn" onclick="goToPage(${currentPage-1})" ${currentPage===1?'disabled':''}>‹</button>`;let sp=Math.max(1,currentPage-2),ep=Math.min(tp,currentPage+2);for(let i=sp;i<=ep;i++)h+=`<button class="page-btn ${i===currentPage?'active':''}" onclick="goToPage(${i})">${i}</button>`;h+=`<button class="page-btn" onclick="goToPage(${currentPage+1})" ${currentPage===tp?'disabled':''}>›</button><button class="page-btn" onclick="goToPage(${tp})" ${currentPage===tp?'disabled':''}>»</button><span style="color:var(--text2);font-size:11px;padding:8px;">${filteredMatches.length} matches</span>`;pd.innerHTML=h;}
        function goToPage(p){const tp=Math.ceil(filteredMatches.length/rowsPerPage);if(p<1||p>tp)return;currentPage=p;renderTable();renderPagination();}
        function openPlaygroundForMatch(fid){if(fid)window.open(`playground.html?id=${fid}`,'_blank');}
        
        auth.onAuthStateChanged(async u=>{if(!u){window.location.href='../login.html';return;}document.getElementById('user-email').textContent=u.email||'';await loadData();setInterval(loadData,120000);});
        window.applyFilters=applyFilters;window.goToPage=goToPage;window.filterByStatus=filterByStatus;window.openPlayground=openPlayground;window.openPlaygroundForMatch=openPlaygroundForMatch;window.loadData=loadData;
        console.log('✅ Results Dashboard v3.0 - API Direct Ready');
    </script>
</body>
</html>
