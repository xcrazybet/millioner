<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Results Dashboard - X Lodon</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0f1a; color: white; font-family: 'Segoe UI', 'Tajawal', sans-serif; min-height: 100vh; }
        
        /* ===== HEADER ===== */
        .header { background: #111827; padding: 12px 15px; border-bottom: 2px solid #ff9800; position: sticky; top: 0; z-index: 100; }
        .header-top { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .back-btn { color: #00ff9d; text-decoration: none; font-size: 20px; }
        .tabs { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 3px; margin-top: 8px; }
        .tab { padding: 8px 12px; background: #1a2332; border-radius: 20px; color: white; text-decoration: none; font-size: 12px; white-space: nowrap; transition: 0.3s; }
        .tab:hover { background: #2a3344; }
        .tab.active { background: #ff9800; color: black; }
        .container { max-width: 1400px; margin: 0 auto; padding: 15px; }
        
        /* ===== DEBUG ===== */
        .debug-info { background: #1a2332; padding: 12px 15px; border-radius: 12px; font-size: 12px; margin-bottom: 20px; border: 1px solid #2a3344; font-family: monospace; max-height: 80px; overflow-y: auto; display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        .debug-info .error { color: #ff5252; }
        .debug-info .success { color: #00ff9d; }
        .debug-info .warning { color: #ffc107; }
        
        /* ===== STATS ROW ===== */
        .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 25px; }
        .stat-card { background: linear-gradient(135deg, #111827, #1a2332); border-radius: 16px; padding: 18px; border: 1px solid #ff980033; transition: 0.3s; cursor: pointer; }
        .stat-card:hover { transform: translateY(-3px); border-color: #ff9800; box-shadow: 0 8px 25px rgba(255,152,0,0.1); }
        .stat-card .icon { font-size: 24px; margin-bottom: 6px; }
        .stat-card .label { font-size: 10px; color: #a0a8c9; text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-card .value { font-size: 24px; font-weight: 900; margin-top: 3px; }
        .stat-card .value.green { color: #4caf50; }
        .stat-card .value.red { color: #ff5252; }
        .stat-card .value.orange { color: #ff9800; }
        .stat-card .value.blue { color: #2196f3; }
        
        /* ===== FILTER BAR ===== */
        .filter-bar { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; align-items: center; background: #111827; padding: 15px 20px; border-radius: 16px; border: 1px solid #2a3344; }
        .search-group { flex: 2; min-width: 180px; position: relative; }
        .search-group input { width: 100%; padding: 10px 15px 10px 40px; background: #1a2332; border: 1px solid #2a3344; border-radius: 12px; color: white; font-size: 13px; transition: 0.3s; }
        .search-group input:focus { border-color: #ff9800; outline: none; box-shadow: 0 0 20px rgba(255,152,0,0.1); }
        .search-group i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #a0a8c9; }
        .filter-group select { padding: 10px 12px; background: #1a2332; border: 1px solid #2a3344; border-radius: 12px; color: white; font-size: 13px; cursor: pointer; min-width: 130px; transition: 0.3s; }
        .filter-group select:focus { border-color: #ff9800; outline: none; }
        .btn-refresh { background: linear-gradient(135deg, #ff9800, #f57c00); border: none; padding: 10px 24px; border-radius: 12px; color: black; cursor: pointer; font-weight: 700; transition: 0.3s; }
        .btn-refresh:hover { transform: scale(1.03); box-shadow: 0 4px 20px rgba(255,152,0,0.3); }
        
        /* ===== TABLE ===== */
        .results-table-container { overflow-x: auto; border-radius: 16px; background: #111827; border: 1px solid #2a3344; max-height: 65vh; overflow-y: auto; }
        .results-table-container::-webkit-scrollbar { width: 6px; height: 6px; }
        .results-table-container::-webkit-scrollbar-track { background: #0a0f1a; }
        .results-table-container::-webkit-scrollbar-thumb { background: #ff9800; border-radius: 10px; }
        
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 10px; text-align: left; border-bottom: 1px solid #2a3344; font-size: 12px; vertical-align: middle; }
        th { background: #0f1422; color: #ff9800; font-weight: 700; position: sticky; top: 0; z-index: 10; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
        tr { transition: 0.2s; }
        tr:hover { background: #1a2332; cursor: pointer; }
        tr.clicked { background: #ff980022; }
        
        .team-cell { display: flex; align-items: center; gap: 8px; }
        .team-cell .logo { width: 24px; height: 24px; object-fit: contain; border-radius: 50%; background: rgba(255,255,255,0.05); padding: 2px; }
        .team-cell .name { font-weight: 500; }
        
        .score-cell { font-weight: 900; color: #ff9800; text-align: center; font-size: 18px; min-width: 60px; }
        .score-cell .separator { color: #a0a8c9; margin: 0 4px; font-weight: 300; }
        
        .badge-status { display: inline-block; padding: 3px 12px; border-radius: 20px; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .badge-status.finished { background: #666; color: #fff; }
        .badge-status.live { background: #ff4444; color: #fff; animation: pulse-badge 1.5s infinite; }
        .badge-status.upcoming { background: #00ff9d; color: #000; }
        .badge-status.ht { background: #ff9800; color: #000; }
        
        @keyframes pulse-badge { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }
        
        .badge-result { display: inline-block; padding: 3px 12px; border-radius: 20px; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .badge-result.home-win { background: #4caf50; color: white; }
        .badge-result.draw { background: #ffc107; color: black; }
        .badge-result.away-win { background: #2196f3; color: white; }
        .badge-result.pending { background: #666; color: #a0a8c9; }
        
        /* ===== PAGINATION ===== */
        .pagination { display: flex; justify-content: center; gap: 6px; margin-top: 20px; flex-wrap: wrap; }
        .page-btn { background: #1a2332; border: 1px solid #2a3344; padding: 8px 16px; border-radius: 8px; color: white; cursor: pointer; transition: 0.3s; font-weight: 500; }
        .page-btn:hover:not(:disabled) { background: #2a3344; border-color: #ff9800; }
        .page-btn.active { background: #ff9800; color: black; border-color: #ff9800; }
        .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        
        /* ===== EMPTY STATE ===== */
        .empty-state { text-align: center; padding: 60px 20px; }
        .empty-state i { font-size: 64px; opacity: 0.2; margin-bottom: 15px; color: #ff9800; }
        .empty-state h3 { font-size: 20px; margin-bottom: 8px; }
        .empty-state p { color: #a0a8c9; }
        
        /* ===== LOADING ===== */
        .loading-spinner { display: inline-block; width: 30px; height: 30px; border: 3px solid #ff9800; border-top-color: transparent; border-radius: 50%; animation: spin 0.6s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* ============================================================
                   MODAL - PREMIUM MATCH DETAILS
                   ============================================================ */
        .modal-overlay { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.92); z-index:1000; display:none; align-items:center; justify-content:center; padding:20px; backdrop-filter: blur(4px); }
        .modal-overlay.show { display:flex; }
        .modal-content { background: #111827; border-radius: 24px; padding: 0; max-width: 1000px; width: 100%; max-height: 92vh; overflow-y: auto; border: 2px solid #ff9800; position: relative; }
        .modal-content::-webkit-scrollbar { width: 6px; }
        .modal-content::-webkit-scrollbar-track { background: #0a0f1a; border-radius: 0 0 24px 0; }
        .modal-content::-webkit-scrollbar-thumb { background: #ff9800; border-radius: 10px; }
        
        .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 20px 25px; border-bottom: 1px solid #ff980033; background: #0f1422; border-radius: 24px 24px 0 0; position: sticky; top: 0; z-index: 5; }
        .modal-header h3 { color: #ff9800; font-size: 18px; display: flex; align-items: center; gap: 10px; }
        .modal-header h3 span { font-weight: 300; color: #a0a8c9; font-size: 13px; }
        .modal-close { background: none; border: none; color: #a0a8c9; font-size: 28px; cursor: pointer; transition: 0.3s; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .modal-close:hover { color: #ff5252; background: #ff525222; transform: rotate(90deg); }
        
        .modal-body { padding: 25px; }
        
        /* Match Result Header */
        .match-result-header { background: linear-gradient(135deg, #0f1422, #1a2332); border-radius: 16px; padding: 25px; margin-bottom: 20px; border: 1px solid #2a3344; }
        .match-teams-display { display: flex; align-items: center; justify-content: center; gap: 15px; flex-wrap: wrap; }
        .match-team { text-align: center; flex: 1; min-width: 120px; }
        .match-team .logo { width: 70px; height: 70px; object-fit: contain; border-radius: 50%; background: rgba(255,255,255,0.05); padding: 8px; margin-bottom: 8px; border: 2px solid transparent; transition: 0.3s; }
        .match-team .logo:hover { border-color: #ff9800; transform: scale(1.05); }
        .match-team .name { font-size: 16px; font-weight: 700; }
        .match-team .score { font-size: 44px; font-weight: 900; color: #ff9800; line-height: 1.2; }
        .match-team .score.winner { color: #00ff9d; text-shadow: 0 0 30px rgba(0,255,157,0.2); }
        .match-vs { font-size: 14px; color: #a0a8c9; font-weight: 700; padding: 0 10px; }
        
        .match-meta { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin-top: 15px; padding-top: 15px; border-top: 1px solid #2a3344; }
        .match-meta .meta-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #a0a8c9; }
        .match-meta .meta-item i { color: #ff9800; width: 16px; }
        .match-meta .meta-item .highlight { color: #00ff9d; font-weight: 700; }
        
        .match-winner-banner { text-align: center; margin-top: 12px; padding: 10px 20px; border-radius: 12px; font-weight: 800; font-size: 18px; letter-spacing: 0.5px; }
        .match-winner-banner.home-win { background: #4caf5022; color: #4caf50; border: 1px solid #4caf50; }
        .match-winner-banner.away-win { background: #2196f322; color: #2196f3; border: 1px solid #2196f3; }
        .match-winner-banner.draw { background: #ffc10722; color: #ffc107; border: 1px solid #ffc107; }
        .match-winner-banner.pending { background: #66666622; color: #a0a8c9; border: 1px solid #666; }
        
        /* Tabs inside modal */
        .modal-tabs { display: flex; gap: 6px; margin-bottom: 20px; flex-wrap: wrap; border-bottom: 1px solid #2a3344; padding-bottom: 10px; }
        .modal-tab { padding: 8px 18px; background: transparent; border: none; border-radius: 20px; color: #a0a8c9; font-size: 12px; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .modal-tab:hover { color: white; background: #1a2332; }
        .modal-tab.active { background: #ff9800; color: black; }
        .modal-tab i { margin-right: 6px; }
        .modal-tab .count { background: #ff980033; padding: 0 8px; border-radius: 10px; font-size: 10px; margin-left: 4px; }
        .modal-tab.active .count { background: rgba(0,0,0,0.2); }
        
        .tab-content { display: none; animation: fadeIn 0.3s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Stats Grid */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
        .stat-item { background: #0f1422; padding: 14px; border-radius: 12px; text-align: center; border: 1px solid #2a3344; transition: 0.3s; }
        .stat-item:hover { border-color: #ff9800; }
        .stat-item .stat-icon { font-size: 20px; margin-bottom: 4px; }
        .stat-item .stat-label { font-size: 9px; color: #a0a8c9; text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-item .stat-values { display: flex; justify-content: space-between; margin-top: 4px; font-size: 14px; font-weight: 700; }
        .stat-item .stat-values .home { color: #4caf50; }
        .stat-item .stat-values .away { color: #2196f3; }
        .stat-item .stat-values .sep { color: #a0a8c9; font-weight: 300; font-size: 11px; }
        
        /* Detail Grid */
        .detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
        .detail-item { background: #0f1422; padding: 12px 16px; border-radius: 12px; border: 1px solid #2a3344; }
        .detail-item .label { font-size: 9px; color: #ff9800; text-transform: uppercase; letter-spacing: 0.5px; }
        .detail-item .value { font-size: 14px; font-weight: 700; margin-top: 4px; word-break: break-word; }
        .detail-item .value .badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 10px; font-weight: 700; }
        .detail-item .value .badge.yes { background: #4caf50; color: white; }
        .detail-item .value .badge.no { background: #ff5252; color: white; }
        .detail-item .value .badge.pending { background: #ffc107; color: black; }
        
        /* Betting Info */
        .betting-info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
        .betting-item { background: #0f1422; padding: 12px 16px; border-radius: 12px; border: 1px solid #2a3344; }
        .betting-item .label { font-size: 9px; color: #ff9800; text-transform: uppercase; letter-spacing: 0.5px; }
        .betting-item .value { font-size: 13px; font-weight: 600; margin-top: 4px; }
        
        /* Raw Data */
        .raw-data-toggle { background: transparent; border: 1px solid #2a3344; color: #a0a8c9; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 12px; transition: 0.3s; margin-top: 10px; }
        .raw-data-toggle:hover { border-color: #ff9800; color: white; }
        .raw-data-container { display: none; margin-top: 10px; background: #0a0f1a; padding: 15px; border-radius: 12px; max-height: 200px; overflow-y: auto; border: 1px solid #2a3344; }
        .raw-data-container pre { color: #a0a8c9; font-size: 11px; white-space: pre-wrap; word-break: break-all; font-family: monospace; }
        
        /* ===== NOTIFICATION ===== */
        .notification { position: fixed; bottom: 30px; right: 30px; padding: 14px 24px; border-radius: 12px; z-index: 2000; animation: slideIn 0.4s ease; font-weight: 600; box-shadow: 0 8px 30px rgba(0,0,0,0.5); }
        .notification.success { background: #4caf50; color: white; }
        .notification.error { background: #ff5252; color: white; }
        .notification.info { background: #2196f3; color: white; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        
        /* ============================================================
                   RESPONSIVE
                   ============================================================ */
        @media (max-width: 768px) {
            .stats-row { grid-template-columns: repeat(2, 1fr); }
            .filter-bar { flex-direction: column; align-items: stretch; }
            .search-group { min-width: auto; }
            .filter-group select { width: 100%; }
            th, td { font-size: 10px; padding: 8px 6px; }
            .team-cell .logo { width: 18px; height: 18px; }
            .score-cell { font-size: 14px; min-width: 40px; }
            .match-team .logo { width: 45px; height: 45px; }
            .match-team .score { font-size: 28px; }
            .match-team .name { font-size: 13px; }
            .match-vs { font-size: 11px; padding: 0 5px; }
            .modal-body { padding: 15px; }
            .modal-header { padding: 15px 20px; }
            .modal-header h3 { font-size: 15px; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .detail-grid { grid-template-columns: 1fr; }
            .betting-info-grid { grid-template-columns: 1fr; }
            .match-meta { gap: 10px; flex-direction: column; align-items: center; }
            .modal-tabs { gap: 4px; }
            .modal-tab { font-size: 10px; padding: 6px 12px; }
        }
        
        @media (max-width: 480px) {
            .match-teams-display { gap: 8px; }
            .match-team .logo { width: 35px; height: 35px; padding: 4px; }
            .match-team .score { font-size: 22px; }
            .match-team .name { font-size: 11px; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
            .stat-item { padding: 10px; }
            .stat-item .stat-values { font-size: 12px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-top">
            <div class="header-left">
                <a href="betting-sport.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
                <h1 style="font-size:18px;"><i class="fas fa-trophy"></i> Results Dashboard</h1>
            </div>
            <div style="display:flex;align-items:center;gap:10px;">
                <span id="user-email" style="font-size:12px;color:#a0a8c9;"></span>
            </div>
        </div>
        <div class="tabs">
            <a href="betting-sport.html" class="tab">🏠 Home</a>
            <a href="live-matches.html" class="tab">🔴 Live</a>
            <a href="upcoming-matches.html" class="tab">⏳ Upcoming</a>
            <a href="finished-matches.html" class="tab active">✅ Results</a>
            <a href="my-bets.html" class="tab">📋 My Bets</a>
        </div>
    </div>
    
    <div class="container">
        <!-- Debug Info -->
        <div class="debug-info" id="debug-info">
            <i class="fas fa-spinner fa-pulse"></i> Connecting to Supabase...
        </div>
        
        <!-- Stats Row -->
        <div class="stats-row" id="stats-row">
            <div class="stat-card" onclick="document.getElementById('status-filter').value='all';applyFilters();">
                <div class="icon">📊</div>
                <div class="label">Total Matches</div>
                <div class="value orange" id="total-matches">0</div>
            </div>
            <div class="stat-card" onclick="document.getElementById('status-filter').value='finished';applyFilters();">
                <div class="icon">✅</div>
                <div class="label">Finished</div>
                <div class="value green" id="finished-count">0</div>
            </div>
            <div class="stat-card" onclick="document.getElementById('status-filter').value='live';applyFilters();">
                <div class="icon">🔴</div>
                <div class="label">Live</div>
                <div class="value red" id="live-count">0</div>
            </div>
            <div class="stat-card" onclick="document.getElementById('status-filter').value='upcoming';applyFilters();">
                <div class="icon">⏳</div>
                <div class="label">Upcoming</div>
                <div class="value blue" id="upcoming-count">0</div>

        </div>
        
        <!-- Filter Bar -->
        <div class="filter-bar">

            <div class="filter-group">
                <select id="status-filter" onchange="applyFilters()">
                    <option value="all">📊 All Status</option>

                    <option value="live">🔴 Live</option>
                    <option value="upcoming">⏳ Upcoming</option>
                </select>
            </div>
            <div class="filter-group">
                <select id="result-filter" onchange="applyFilters()">
                    <option value="">🏆 All Results</option>
                    <option value="home">🏠 Home Win</option>
                    <option value="draw">🤝 Draw</option>
                    <option value="away">✈️ Away Win</option>
                </select>
            </div>
            <button class="btn-refresh" onclick="loadMatches()"><i class="fas fa-sync-alt"></i> Refresh</button>
        </div>
        
        <!-- Results Table -->
        <div class="results-table-container" id="results-container">
            <div style="text-align:center;padding:50px;"><div class="loading-spinner"></div> Loading matches...</div>
        </div>
        
        <!-- Pagination -->
        <div class="pagination" id="pagination"></div>
    </div>

            </div>
            <div class="modal-body" id="modal-body"></div>
        </div>
    </div>

            authDomain: "x-bet-prod-jd.firebaseapp.com", 
            projectId: "x-bet-prod-jd", 
            storageBucket: "x-bet-prod-jd.firebasestorage.app", 
            messagingSenderId: "499334334535", 
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962" 
        };
        if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        
        // ==================== HELPERS ====================
        function escapeHtml(str) { if(!str) return ''; return String(str).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }
        
        function isMatchFinished(match) {
            if (!match) return false;
            if (match.status) {
                const s = match.status.toLowerCase();
                if (['finished', 'ft', 'fulltime', 'complete', 'final', 'ended'].includes(s)) return true;
            }
            if (match.result && match.result !== 'NULL' && match.result !== '' && match.result !== null) return true;
            if (match.elapsed && match.elapsed >= 90) return true;
            if (match.start_time) {
                const matchDate = new Date(match.start_time);
                const now = new Date();
                if (now - matchDate > 2 * 60 * 60 * 1000 && match.score) {
                    const hs = match.score.home, as = match.score.away;
                    if (hs !== undefined && hs !== null && as !== undefined && as !== null) return true;
                }
            }
            return false;
        }
        
        function getResultData(match) {
            const hs = match.score?.home, as = match.score?.away;
            if (hs === undefined || hs === null || as === undefined || as === null) {
                return { text: '⏳ Pending', class: 'pending', icon: '⏳' };
            }
            if (hs > as) return { text: '🏆 Home Win', class: 'home-win', icon: '🏠' };
            if (hs < as) return { text: '🏆 Away Win', class: 'away-win', icon: '✈️' };
            return { text: '🤝 Draw', class: 'draw', icon: '🤝' };
        }
        
        function formatDate(dateStr) {
            if (!dateStr) return 'TBD';
            return new Date(dateStr).toLocaleString('en-US', { 
                weekday: 'short', month: 'short', day: 'numeric', 
                year: 'numeric', hour: '2-digit', minute: '2-digit' 
            });
        }
        
        // ==================== LOAD MATCHES ====================
        async function loadMatches() {
            const container = document.getElementById('results-container');
            const debugEl = document.getElementById('debug-info');
            
            container.innerHTML = `<div style="text-align:center;padding:50px;"><div class="loading-spinner"></div> Loading matches...</div>`;
            debugEl.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Connecting to Supabase...';
            
            try {
                if(!supabaseClient) {
                    supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
                        auth: { persistSession: false },
                        db: { schema: 'public' }
                    });
                }
                
                let allData = [];
                let page = 0;
                const pageSize = 1000;
                let hasMore = true;
                
                while(hasMore) {
                    const from = page * pageSize;
                    const to = from + pageSize - 1;
                    const { data, error } = await supabaseClient
                        .from('sports_matches')
                        .select('*')
                        .order('start_time', { ascending: false })
                        .range(from, to);
                    
                    if(error) { debugEl.innerHTML = `<span class="error">❌ Error: ${error.message}</span>`; hasMore = false; break; }
                    if(!data || data.length === 0) { hasMore = false; break; }
                    
                    allData = [...allData, ...data];
                    debugEl.innerHTML = `<i class="fas fa-database"></i> Loaded ${allData.length} matches...`;
                    if(data.length < pageSize) hasMore = false;
                    page++;
                    await new Promise(r => setTimeout(r, 50));
                }
                
                allMatches = allData;
                
                const finished = allMatches.filter(m => isMatchFinished(m));
                const live = allMatches.filter(m => m.status === 'live');
                const upcoming = allMatches.filter(m => m.status === 'upcoming');
                
                document.getElementById('total-matches').textContent = allMatches.length;
                document.getElementById('finished-count').textContent = finished.length;
                document.getElementById('live-count').textContent = live.length;
                document.getElementById('upcoming-count').textContent = upcoming.length;
                
                debugEl.innerHTML = `
                    <i class="fas fa-check-circle success"></i> <strong>${allMatches.length}</strong> matches loaded
                    <span style="color:#4caf50;">✅ ${finished.length} finished</span>
                    <span style="color:#ff5252;">🔴 ${live.length} live</span>
                    <span style="color:#2196f3;">⏳ ${upcoming.length} upcoming</span>
                    <span style="color:#a0a8c9;">| 📅 Latest: ${allMatches.length > 0 ? formatDate(allMatches[0].start_time) : 'N/A'}</span>
                `;
                
                // Auto-select finished if available
                if (finished.length > 0) {
                    document.getElementById('status-filter').value = 'finished';
                }
                
                applyFilters();
                
                if (finished.length > 0) {
                    showNotification(`✅ ${finished.length} finished matches loaded`, 'success');
                } else {
                    showNotification(`ℹ️ ${allMatches.length} matches loaded. Use filters to find results.`, 'info');
                }
                
            } catch(e) {
                console.error('Error:', e);
                debugEl.innerHTML = `<span class="error">❌ Error: ${e.message}</span>`;
                container.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><h3>Error Loading Matches</h3><p>${e.message}</p></div>`;
            }
        }
        
        // ==================== FILTERS ====================
        function applyFilters() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase().trim();
            const statusFilter = document.getElementById('status-filter').value;
            const resultFilter = document.getElementById('result-filter').value;
            
            filteredMatches = allMatches.filter(match => {
                // Search
                if(searchTerm) {
                    const homeName = match.home_team?.name || '';
                    const awayName = match.away_team?.name || '';
                    const leagueName = match.league_name || '';
                    const fixtureId = match.fixture_id?.toString() || '';
                    if(!fixtureId.includes(searchTerm) && 
                       !homeName.toLowerCase().includes(searchTerm) && 
                       !awayName.toLowerCase().includes(searchTerm) &&
                       !leagueName.toLowerCase().includes(searchTerm)) return false;
                }
                
                // Status
                if(statusFilter !== 'all') {
                    if(statusFilter === 'finished' && !isMatchFinished(match)) return false;
                    if(statusFilter === 'live' && match.status !== 'live') return false;
                    if(statusFilter === 'upcoming' && match.status !== 'upcoming') return false;
                }
                
                // Result
                if(resultFilter && match.score) {
                    const hs = match.score?.home || 0, as = match.score?.away || 0;
                    if(resultFilter === 'home' && hs <= as) return false;
                    if(resultFilter === 'away' && as <= hs) return false;
                    if(resultFilter === 'draw' && hs !== as) return false;
                }
                
                return true;
            });
            
            currentPage = 1;
            renderTable();
            renderPagination();
        }
        
        // ==================== RENDER TABLE ====================
        function renderTable() {
            const container = document.getElementById('results-container');
            
            if(!filteredMatches.length) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-search"></i>
                        <h3>No matches found</h3>
                        <p>Try adjusting your filters or refresh the page</p>
                    </div>
                `;
                return;
            }
            
            const startIdx = (currentPage - 1) * rowsPerPage;
            const pageMatches = filteredMatches.slice(startIdx, startIdx + rowsPerPage);
            
            let html = `<table><thead><tr>
                <th style="min-width:80px;">Fixture</th>
                <th style="min-width:100px;">League</th>
                <th style="min-width:150px;">Home</th>
                <th style="min-width:80px;text-align:center;">Score</th>
                <th style="min-width:150px;">Away</th>
                <th style="min-width:100px;">Status</th>
                <th style="min-width:120px;">Result</th>
            </tr></thead><tbody>`;
            
            for(const match of pageMatches) {
                const homeName = match.home_team?.name || 'Home';
                const awayName = match.away_team?.name || 'Away';
                const homeLogo = match.home_team?.logo || '';
                const awayLogo = match.away_team?.logo || '';
                const fixtureId = match.fixture_id || match.id || 'N/A';
                const isFinished = isMatchFinished(match);
                
                let hs = '?', as = '?';
                if (match.score) {
                    hs = match.score.home !== undefined ? match.score.home : '?';
                    as = match.score.away !== undefined ? match.score.away : '?';
                }
                
                // Status
                let statusClass = 'upcoming', statusText = '⏳ UPCOMING';
                if(isFinished) { statusClass = 'finished'; statusText = '✅ FINISHED'; }
                else if(match.status === 'live') { statusClass = 'live'; statusText = '🔴 LIVE'; }
                else if(match.status === 'ht') { statusClass = 'ht'; statusText = '⏸️ HT'; }
                
                // Result
                const result = getResultData(match);
                const resultText = result.text;
                const resultClass = result.class;
                
                html += `<tr onclick='showMatchDetails(${JSON.stringify(match).replace(/'/g, "&#39;")})'>
                    <td><strong>#${fixtureId}</strong></td>
                    <td>${escapeHtml(match.league_name || 'N/A')}</td>
                    <td>
                        <div class="team-cell">
                            ${homeLogo ? `<img class="logo" src="${homeLogo}" onerror="this.style.display='none'">` : ''}
                            <span class="name">${escapeHtml(homeName)}</span>
                        </div>
                    </td>
                    <td class="score-cell">${hs} <span class="separator">-</span> ${as}</td>
                    <td>
                        <div class="team-cell">
                            ${awayLogo ? `<img class="logo" src="${awayLogo}" onerror="this.style.display='none'">` : ''}
                            <span class="name">${escapeHtml(awayName)}</span>
                        </div>
                    </td>
                    <td><span class="badge-status ${statusClass}">${statusText}</span></td>
                    <td>${resultClass !== 'pending' ? `<span class="badge-result ${resultClass}">${resultText}</span>` : `<span style="color:#a0a8c9;font-size:11px;">${resultText}</span>`}</td>
                </tr>`;
            }
            
            html += `</tbody></table>`;
            container.innerHTML = html;
        }
        
        // ==================== PAGINATION ====================
        function renderPagination() {
            const totalPages = Math.ceil(filteredMatches.length / rowsPerPage);
            const paginationDiv = document.getElementById('pagination');
            if(totalPages <= 1) { paginationDiv.innerHTML = ''; return; }
            
            let html = `<button class="page-btn" onclick="goToPage(1)" ${currentPage===1?'disabled':''}>«</button>`;
            html += `<button class="page-btn" onclick="goToPage(${currentPage-1})" ${currentPage===1?'disabled':''}>‹</button>`;
            
            let startPage = Math.max(1, currentPage - 2);
            let endPage = Math.min(totalPages, currentPage + 2);
            for(let i=startPage; i<=endPage; i++) {
                html += `<button class="page-btn ${i===currentPage?'active':''}" onclick="goToPage(${i})">${i}</button>`;
            }
            
            html += `<button class="page-btn" onclick="goToPage(${currentPage+1})" ${currentPage===totalPages?'disabled':''}>›</button>`;
            html += `<button class="page-btn" onclick="goToPage(${totalPages})" ${currentPage===totalPages?'disabled':''}>»</button>`;
            html += `<span style="color:#a0a8c9;font-size:12px;padding:8px;">${filteredMatches.length} matches</span>`;
            paginationDiv.innerHTML = html;
        }
        
        function goToPage(page) {
            const totalPages = Math.ceil(filteredMatches.length / rowsPerPage);
            if(page < 1 || page > totalPages) return;
            currentPage = page;
            renderTable();
            renderPagination();
        }
        
        // ==================== SHOW MATCH DETAILS - PREMIUM ====================
        function showMatchDetails(match) {
            const modal = document.getElementById('match-modal');
            const body = document.getElementById('modal-body');
            document.getElementById('modal-fixture-id').textContent = `#${match.fixture_id || match.id || 'N/A'}`;
            
            const homeName = match.home_team?.name || 'Home';
            const awayName = match.away_team?.name || 'Away';
            const homeLogo = match.home_team?.logo || '';
            const awayLogo = match.away_team?.logo || '';
            const hs = match.score?.home ?? '?';
            const as = match.score?.away ?? '?';
            const isFinished = isMatchFinished(match);
            const result = getResultData(match);
            
            // Determine if scores are numbers
            const isNumeric = typeof hs === 'number' && typeof as === 'number';
            const winnerClass = isNumeric && isFinished ? 
                (hs > as ? 'home-win' : hs < as ? 'away-win' : 'draw') : 'pending';
            
            const winnerText = isNumeric && isFinished ?
                (hs > as ? `🏆 ${homeName} Wins!` : hs < as ? `🏆 ${awayName} Wins!` : `🤝 Match Drawn!`) :
                '⏳ Match Not Yet Played';
            
            // Status
            let statusDisplay = match.status || 'Unknown';
            let statusColor = '#a0a8c9';
            if(isFinished) { statusDisplay = '✅ FINISHED'; statusColor = '#4caf50'; }
            else if(match.status === 'live') { statusDisplay = '🔴 LIVE'; statusColor = '#ff4444'; }
            else if(match.status === 'upcoming') { statusDisplay = '⏳ UPCOMING'; statusColor = '#2196f3'; }
            else if(match.status === 'ht') { statusDisplay = '⏸️ HALF TIME'; statusColor = '#ff9800'; }
            
            // Build HTML
            let html = `
                <!-- Match Result Header -->
                <div class="match-result-header">
                    <div class="match-teams-display">
                        <div class="match-team">
                            ${homeLogo ? `<img class="logo" src="${homeLogo}" onerror="this.style.display='none'">` : '<i class="fas fa-shield-alt" style="font-size:40px;opacity:0.3;"></i>'}
                            <div class="name">${escapeHtml(homeName)}</div>
                            <div class="score ${isNumeric && isFinished && hs > as ? 'winner' : ''}">${hs}</div>
                        </div>
                        <div class="match-vs">VS</div>
                        <div class="match-team">
                            ${awayLogo ? `<img class="logo" src="${awayLogo}" onerror="this.style.display='none'">` : '<i class="fas fa-shield-alt" style="font-size:40px;opacity:0.3;"></i>'}
                            <div class="name">${escapeHtml(awayName)}</div>
                            <div class="score ${isNumeric && isFinished && as > hs ? 'winner' : ''}">${as}</div>
                        </div>
                    </div>
                    
                    <div class="match-winner-banner ${winnerClass}">${winnerText}</div>
                    
                    <div class="match-meta">
                        <span class="meta-item"><i class="fas fa-trophy"></i> ${escapeHtml(match.league_name || 'N/A')}</span>
                        <span class="meta-item"><i class="far fa-calendar-alt"></i> ${formatDate(match.start_time)}</span>
                        <span class="meta-item"><i class="fas fa-clock"></i> Status: <span class="highlight" style="color:${statusColor};">${statusDisplay}</span></span>
                        ${isNumeric ? `<span class="meta-item"><i class="fas fa-flag-checkered"></i> Result: <span class="highlight" style="color:${winnerClass === 'home-win' ? '#4caf50' : winnerClass === 'away-win' ? '#2196f3' : '#ffc107'};">${result.text}</span></span>` : ''}
                        ${match.elapsed ? `<span class="meta-item"><i class="fas fa-hourglass-half"></i> ${match.elapsed}'</span>` : ''}
                    </div>
                </div>
                
                <!-- Modal Tabs -->
                <div class="modal-tabs">
                    <button class="modal-tab active" data-tab="stats" onclick="switchTab(this, 'stats')"><i class="fas fa-chart-bar"></i> Statistics</button>
                    <button class="modal-tab" data-tab="details" onclick="switchTab(this, 'details')"><i class="fas fa-info-circle"></i> Details</button>
                    <button class="modal-tab" data-tab="betting" onclick="switchTab(this, 'betting')"><i class="fas fa-gavel"></i> Betting Info</button>
                    <button class="modal-tab" data-tab="raw" onclick="switchTab(this, 'raw')"><i class="fas fa-code"></i> Raw Data</button>
                </div>
            `;
            
            // === TAB 1: STATISTICS ===
            let statsHtml = `<div class="tab-content active" id="tab-stats">`;
            const stats = match.statistics || {};
            const statItems = [
                { icon: '⚽', label: 'Possession', home: stats.possession_home, away: stats.possession_away, suffix: '%' },
                { icon: '🎯', label: 'Shots on Target', home: stats.shots_on_target_home, away: stats.shots_on_target_away },
                { icon: '📊', label: 'Total Shots', home: stats.shots_home, away: stats.shots_away },
                { icon: '🟨', label: 'Yellow Cards', home: stats.yellow_cards_home, away: stats.yellow_cards_away },
                { icon: '🟥', label: 'Red Cards', home: stats.red_cards_home, away: stats.red_cards_away },
                { icon: '🔄', label: 'Corners', home: stats.corners_home, away: stats.corners_away },
                { icon: '🤕', label: 'Fouls', home: stats.fouls_home, away: stats.fouls_away }
            ];
            
            let hasStats = false;
            let statsGridHtml = '<div class="stats-grid">';
            for (const item of statItems) {
                if (item.home !== undefined && item.home !== null && item.away !== undefined && item.away !== null) {
                    hasStats = true;
                    const hVal = item.home + (item.suffix || '');
                    const aVal = item.away + (item.suffix || '');
                    statsGridHtml += `
                        <div class="stat-item">
                            <div class="stat-icon">${item.icon}</div>
                            <div class="stat-label">${item.label}</div>
                            <div class="stat-values">
                                <span class="home">${hVal}</span>
                                <span class="sep">vs</span>
                                <span class="away">${aVal}</span>
                            </div>
                        </div>
                    `;
                }
            }
            statsGridHtml += '</div>';
            
            if (hasStats) {
                statsHtml += statsGridHtml;
            } else {
                statsHtml += `
                    <div style="text-align:center;padding:30px;color:#a0a8c9;">
                        <i class="fas fa-chart-pie" style="font-size:40px;opacity:0.3;margin-bottom:10px;display:block;"></i>
                        No statistics available for this match yet.
                    </div>
                `;
            }
            statsHtml += `</div>`;
            
            // === TAB 2: DETAILS ===
            let detailsHtml = `<div class="tab-content" id="tab-details">`;
            const detailItems = [
                { label: 'Fixture ID', value: `#${match.fixture_id || match.id || 'N/A'}` },
                { label: 'League', value: match.league_name || 'N/A' },
                { label: 'Status', value: `<span style="color:${statusColor};">${statusDisplay}</span>` },
                { label: 'Result', value: isNumeric && isFinished ? `<span class="badge badge-${winnerClass === 'home-win' ? 'yes' : winnerClass === 'away-win' ? 'yes' : 'pending'}">${result.text}</span>` : '⏳ Pending' },
                { label: 'Date & Time', value: formatDate(match.start_time) },
                { label: 'Elapsed', value: match.elapsed ? match.elapsed + "'" : 'N/A' },
                { label: 'Bets Settled', value: match.bets_settled ? '<span class="badge yes">✅ Yes</span>' : '<span class="badge no">⏳ No</span>' },
                { label: 'Bets Closed', value: match.bets_closed ? '<span class="badge yes">🔒 Yes</span>' : '<span class="badge no">🟢 No</span>' },
                { label: 'Settled By', value: match.settled_by || 'N/A' },
                { label: 'Settled At', value: match.settled_at ? formatDate(match.settled_at) : 'N/A' },
            ];
            
            let detailGridHtml = '<div class="detail-grid">';
            for (const item of detailItems) {
                detailGridHtml += `
                    <div class="detail-item">
                        <div class="label">${item.label}</div>
                        <div class="value">${item.value}</div>
                    </div>
                `;
            }
            detailGridHtml += '</div>';
            detailsHtml += detailGridHtml;
            detailsHtml += `</div>`;
            
            // === TAB 3: BETTING INFO ===
            let bettingHtml = `<div class="tab-content" id="tab-betting">`;
            const odds = match.odds || {};
            const betItems = [
                { label: 'Home Win Odds', value: odds.home || 'N/A' },
                { label: 'Draw Odds', value: odds.draw || 'N/A' },
                { label: 'Away Win Odds', value: odds.away || 'N/A' },
                { label: 'Bets Closed', value: match.bets_closed ? '🔒 Yes' : '🟢 No' },
                { label: 'Bets Settled', value: match.bets_settled ? '✅ Yes' : '⏳ No' },
                { label: 'Manual Closed', value: match.manual_closed ? '🔒 Yes' : '🟢 No' },
                { label: 'Manually Settled', value: match.manually_settled ? '✅ Yes' : '⏳ No' },
            ];
            
            let betGridHtml = '<div class="betting-info-grid">';
            for (const item of betItems) {
                betGridHtml += `
                    <div class="betting-item">
                        <div class="label">${item.label}</div>
                        <div class="value">${item.value}</div>
                    </div>
                `;
            }
            betGridHtml += '</div>';
            
            // Card stats
            if (match.cards || match.yellow_cards_count || match.red_cards_count) {
                betGridHtml += `
                    <div style="margin-top:15px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;">
                        ${match.yellow_cards_count ? `<div class="betting-item"><div class="label">🟨 Total Yellow Cards</div><div class="value">${match.yellow_cards_count}</div></div>` : ''}
                        ${match.red_cards_count ? `<div class="betting-item"><div class="label">🟥 Total Red Cards</div><div class="value">${match.red_cards_count}</div></div>` : ''}
                        ${match.first_goal_team ? `<div class="betting-item"><div class="label">⚽ First Goal</div><div class="value">${match.first_goal_team}</div></div>` : ''}
                        ${match.penalties ? `<div class="betting-item"><div class="label">⚽ Penalties</div><div class="value">${match.penalties}</div></div>` : ''}
                    </div>
                `;
            }
            
            bettingHtml += betGridHtml;
            bettingHtml += `</div>`;
            
            // === TAB 4: RAW DATA ===
            let rawHtml = `
                <div class="tab-content" id="tab-raw">
                    <div style="background:#0a0f1a;padding:15px;border-radius:12px;max-height:400px;overflow-y:auto;border:1px solid #2a3344;">
                        <pre style="color:#a0a8c9;font-size:11px;white-space:pre-wrap;word-break:break-all;font-family:monospace;">${JSON.stringify(match, null, 2)}</pre>
                    </div>
                </div>
            `;
            
            html += statsHtml + detailsHtml + bettingHtml + rawHtml;
            body.innerHTML = html;
            modal.classList.add('show');
        }
        
        // ==================== TAB SWITCHING ====================
        function switchTab(btn, tabId) {
            document.querySelectorAll('.modal-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('tab-' + tabId).classList.add('active');
        }
        
        // ==================== CLOSE MODAL ====================
        function closeModal() { 
            document.getElementById('match-modal').classList.remove('show'); 
        }
        
        // ==================== NOTIFICATIONS ====================
        function showNotification(msg, type) { 
            const n = document.createElement('div'); 
            n.className = `notification ${type}`; 
            n.innerHTML = msg; 
            document.body.appendChild(n); 
            setTimeout(()=>n.remove(), 3000); 
        }
        
        // ==================== INIT ====================
        auth.onAuthStateChanged(async (user) => {
            if(!user) { window.location.href = '../login.html'; return; }
            document.getElementById('user-email').textContent = user.email || '';
            await loadMatches();
            
            // Auto-refresh every 60 seconds
            setInterval(loadMatches, 60000);
        });
        
        // Close modal on overlay click
        document.getElementById('match-modal').addEventListener('click', function(e) {
            if(e.target === this) closeModal();
        });
        
        document.addEventListener('keydown', function(e) {
            if(e.key === 'Escape') closeModal();
        });
        
        // Make functions global
        window.applyFilters = applyFilters;
        window.goToPage = goToPage;
        window.showMatchDetails = showMatchDetails;
        window.closeModal = closeModal;
        window.loadMatches = loadMatches;
        window.switchTab = switchTab;
        
        console.log('✅ Premium Results Dashboard loaded!');
    </script>
</body>
