<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Results Dashboard - X Lodon</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0f1a; color: white; font-family: 'Segoe UI', sans-serif; min-height: 100vh; }
        .header { background: #111827; padding: 12px 15px; border-bottom: 2px solid #ff9800; position: sticky; top: 0; z-index: 100; }
        .header-top { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .back-btn { color: #00ff9d; text-decoration: none; font-size: 20px; }
        .tabs { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 3px; margin-top: 8px; }
        .tab { padding: 8px 12px; background: #1a2332; border-radius: 20px; color: white; text-decoration: none; font-size: 12px; white-space: nowrap; }
        .tab.active { background: #ff9800; color: black; }
        .container { max-width: 1400px; margin: 0 auto; padding: 15px; }
        .debug-info { background: #1a2332; padding: 15px; border-radius: 12px; font-size: 13px; margin-bottom: 20px; border: 1px solid #2a3344; font-family: monospace; max-height: 200px; overflow-y: auto; }
        .debug-info .error { color: #ff5252; }
        .debug-info .success { color: #00ff9d; }
        .debug-info .warning { color: #ffc107; }
        .debug-info pre { background: #0a0f1a; padding: 10px; border-radius: 8px; margin-top: 8px; overflow-x: auto; font-size: 11px; color: #a0a8c9; }
        .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 25px; }
        .stat-card { background: linear-gradient(135deg, #111827, #1a2332); border-radius: 16px; padding: 15px; border: 1px solid #ff980033; }
        .stat-card .icon { font-size: 22px; color: #ff9800; margin-bottom: 6px; }
        .stat-card .label { font-size: 10px; color: #a0a8c9; text-transform: uppercase; }
        .stat-card .value { font-size: 22px; font-weight: bold; margin-top: 3px; }
        .filter-bar { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; align-items: center; background: #111827; padding: 15px; border-radius: 16px; border: 1px solid #2a3344; }
        .search-group { flex: 2; min-width: 180px; position: relative; }
        .search-group input { width: 100%; padding: 10px 15px; background: #1a2332; border: 1px solid #2a3344; border-radius: 12px; color: white; font-size: 13px; }
        .filter-group select { padding: 10px 12px; background: #1a2332; border: 1px solid #2a3344; border-radius: 12px; color: white; font-size: 13px; cursor: pointer; min-width: 130px; }
        .btn-refresh { background: #2196f3; border: none; padding: 10px 20px; border-radius: 12px; color: white; cursor: pointer; font-weight: bold; }
        .btn-refresh:hover { background: #0b7dda; }
        .results-table-container { overflow-x: auto; border-radius: 16px; background: #111827; border: 1px solid #2a3344; max-height: 70vh; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 10px; text-align: left; border-bottom: 1px solid #2a3344; font-size: 12px; vertical-align: middle; }
        th { background: #0f1422; color: #ff9800; font-weight: 600; position: sticky; top: 0; z-index: 10; font-size: 11px; text-transform: uppercase; }
        tr:hover { background: #1a2332; cursor: pointer; }
        .badge-result { display: inline-block; padding: 3px 12px; border-radius: 20px; font-size: 10px; font-weight: bold; }
        .badge-home { background: #4caf50; color: white; }
        .badge-draw { background: #ffc107; color: black; }
        .badge-away { background: #2196f3; color: white; }
        .badge-live { background: #ff4444; color: white; animation: pulse 1.5s infinite; }
        .badge-upcoming { background: #00ff9d; color: black; }
        .badge-finished { background: #666; color: white; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }
        .loading-spinner { display: inline-block; width: 24px; height: 24px; border: 3px solid #ff9800; border-top-color: transparent; border-radius: 50%; animation: spin 0.6s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .empty-state { text-align: center; padding: 60px; }
        .empty-state i { font-size: 48px; opacity: 0.3; margin-bottom: 15px; }
        .pagination { display: flex; justify-content: center; gap: 6px; margin-top: 20px; flex-wrap: wrap; }
        .page-btn { background: #1a2332; border: 1px solid #2a3344; padding: 8px 14px; border-radius: 8px; color: white; cursor: pointer; }
        .page-btn.active { background: #ff9800; color: black; border-color: #ff9800; }
        .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .modal-overlay { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.95); z-index:1000; display:none; align-items:center; justify-content:center; padding:20px; }
        .modal-overlay.show { display:flex; }
        .modal-content { background: #111827; border-radius: 24px; padding: 25px; max-width: 800px; width: 100%; max-height: 85vh; overflow-y: auto; border: 2px solid #ff9800; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #ff980033; padding-bottom: 12px; }
        .modal-close { background: none; border: none; color: #a0a8c9; font-size: 28px; cursor: pointer; }
        .detail-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin: 15px 0; }
        .detail-item { background: #1a2332; padding: 12px 15px; border-radius: 12px; border: 1px solid #2a3344; }
        .detail-label { font-size: 9px; color: #ff9800; text-transform: uppercase; }
        .detail-value { font-size: 15px; font-weight: bold; margin-top: 4px; word-break: break-word; }
        .notification { position: fixed; bottom: 20px; right: 20px; padding: 12px 20px; border-radius: 12px; z-index: 2000; animation: slideIn 0.3s ease; }
        .notification.success { background: #4caf50; color: white; }
        .notification.error { background: #ff5252; color: white; }
        .notification.info { background: #2196f3; color: white; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @media (max-width: 768px) { th, td { font-size: 10px; padding: 6px; } }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-top">
            <div class="header-left">
                <a href="betting-sport.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
                <h1 style="font-size:18px;"><i class="fas fa-trophy"></i> Results Dashboard</h1>
            </div>
        </div>
        <div class="tabs">
            <a href="betting-sport.html" class="tab">Home</a>
            <a href="live-matches.html" class="tab">Live</a>
            <a href="upcoming-matches.html" class="tab">Upcoming</a>
            <a href="finished-matches.html" class="tab active">Results</a>
            <a href="my-bets.html" class="tab">My Bets</a>
        </div>
    </div>
    
    <div class="container">
        <div class="debug-info" id="debug-info">
            <i class="fas fa-spinner fa-pulse"></i> Connecting to Supabase...
        </div>
        
        <div class="stats-row" id="stats-row">
            <div class="stat-card"><div class="icon"><i class="fas fa-database"></i></div><div class="label">Total Matches</div><div class="value" id="total-matches">0</div></div>
            <div class="stat-card"><div class="icon"><i class="fas fa-check-circle"></i></div><div class="label">Finished</div><div class="value" id="finished-count" style="color:#4caf50;">0</div></div>
            <div class="stat-card"><div class="icon"><i class="fas fa-bolt"></i></div><div class="label">Live</div><div class="value" id="live-count" style="color:#ff4444;">0</div></div>
            <div class="stat-card"><div class="icon"><i class="fas fa-clock"></i></div><div class="label">Upcoming</div><div class="value" id="upcoming-count" style="color:#00ff9d;">0</div></div>
        </div>
        
        <div class="filter-bar">
            <div class="search-group">
                <input type="text" id="search-input" placeholder="Search by Fixture ID, Team, League..." oninput="applyFilters()">
            </div>
            <div class="filter-group">
                <select id="status-filter" onchange="applyFilters()">
                    <option value="all">All Status</option>
                    <option value="finished">Finished</option>
                    <option value="live">Live</option>
                    <option value="upcoming">Upcoming</option>
                </select>
            </div>
            <div class="filter-group">
                <select id="result-filter" onchange="applyFilters()">
                    <option value="">All Results</option>
                    <option value="home">🏠 Home Win</option>
                    <option value="draw">🤝 Draw</option>
                    <option value="away">✈️ Away Win</option>
                </select>
            </div>
            <button class="btn-refresh" onclick="loadMatches()"><i class="fas fa-sync-alt"></i> Refresh</button>
        </div>
        
        <div class="results-table-container" id="results-container">
            <div style="text-align:center;padding:40px;"><div class="loading-spinner"></div> Loading matches...</div>
        </div>
        
        <div class="pagination" id="pagination"></div>
    </div>
    
    <div class="modal-overlay" id="match-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-futbol"></i> Match Details</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div id="modal-details"></div>
        </div>
    </div>

    <script>
        // ==================== SUPABASE CONFIG ====================
        const SUPABASE_URL = 'https://jnazybaeajyynpyoszmy.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpuYXp5YmFlYWp5eW5weW9zem15Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyNzgwMDMsImV4cCI6MjA5Mjg1NDAwM30.P_8V-_s6DQDiYekZX1yaNup48WBRaLhb3ILAkvzTDTY';
        
        let supabaseClient = null;
        let allMatches = [];
        let filteredMatches = [];
        let currentPage = 1;
        const rowsPerPage = 30;
        
        const firebaseConfig = { 
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM", 
            authDomain: "x-bet-prod-jd.firebaseapp.com", 
            projectId: "x-bet-prod-jd", 
            storageBucket: "x-bet-prod-jd.firebasestorage.app", 
            messagingSenderId: "499334334535", 
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962" 
        };
        if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        
        // ==================== DETECT FINISHED MATCHES ====================
        function isMatchFinished(match) {
            if (!match) return false;
            
            // 🔥 METHOD 1: Check if status is "finished"
            if (match.status) {
                const status = match.status.toLowerCase();
                if (['finished', 'ft', 'fulltime', 'complete', 'final', 'ended'].includes(status)) {
                    return true;
                }
            }
            
            // 🔥 METHOD 2: Check if 'result' column has a value
            if (match.result && match.result !== 'NULL' && match.result !== '' && match.result !== null) {
                return true;
            }
            
            // 🔥 METHOD 3: Check if score has numeric values
            if (match.score) {
                const homeScore = match.score.home;
                const awayScore = match.score.away;
                if (homeScore !== undefined && homeScore !== null && 
                    awayScore !== undefined && awayScore !== null) {
                    // If both scores are numbers (including 0), it's finished
                    if (typeof homeScore === 'number' && typeof awayScore === 'number') {
                        return true;
                    }
                }
            }
            
            // 🔥 METHOD 4: Check if match has elapsed >= 90 minutes
            if (match.elapsed && match.elapsed >= 90) {
                return true;
            }
            
            // 🔥 METHOD 5: If match time is in the past AND we have any score data
            if (match.start_time) {
                const matchDate = new Date(match.start_time);
                const now = new Date();
                // If match was more than 2 hours ago, assume it's finished
                if (now - matchDate > 2 * 60 * 60 * 1000) {
                    // Check if we have ANY score info
                    if (match.score || match.result) {
                        return true;
                    }
                }
            }
            
            return false;
        }
        
        // ==================== LOAD MATCHES ====================
        async function loadMatches() {
            const container = document.getElementById('results-container');
            const debugEl = document.getElementById('debug-info');
            
            container.innerHTML = `<div style="text-align:center;padding:40px;"><div class="loading-spinner"></div> Loading...</div>`;
            debugEl.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Connecting to Supabase...';
            
            try {
                if(!supabaseClient) {
                    supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
                        auth: { persistSession: false },
                        db: { schema: 'public' }
                    });
                }
                
                // 🔥 GET ALL MATCHES
                let allData = [];
                let page = 0;
                const pageSize = 1000;
                let hasMore = true;
                
                while(hasMore) {
                    const from = page * pageSize;
                    const to = from + pageSize - 1;
                    
                    const { data, error } = await supabaseClient
                        .from('sports_matches')
                        .select('*')
                        .order('start_time', { ascending: false })
                        .range(from, to);
                    
                    if(error) {
                        debugEl.innerHTML = `<span class="error">❌ Error: ${error.message}</span>`;
                        hasMore = false;
                        break;
                    }
                    
                    if(!data || data.length === 0) {
                        hasMore = false;
                        break;
                    }
                    
                    allData = [...allData, ...data];
                    debugEl.innerHTML = `<i class="fas fa-database"></i> Loaded ${allData.length} matches...`;
                    
                    if(data.length < pageSize) hasMore = false;
                    page++;
                    await new Promise(r => setTimeout(r, 50));
                }
                
                allMatches = allData;
                
                // 🔥 SHOW SAMPLE DATA
                if (allMatches.length > 0) {
                    const sample = allMatches[0];
                    const columns = Object.keys(sample);
                    debugEl.innerHTML = `
                        <i class="fas fa-check-circle success"></i> Loaded ${allMatches.length} matches
                        <br><i class="fas fa-table"></i> Columns: ${columns.join(', ')}
                        <br><i class="fas fa-info-circle"></i> Sample: fixture_id=${sample.fixture_id}, status="${sample.status}", has_score=${!!sample.score}
                        ${sample.score ? `, score=${JSON.stringify(sample.score)}` : ''}
                        ${sample.result ? `, result="${sample.result}"` : ''}
                    `;
                } else {
                    debugEl.innerHTML = `<span class="warning">⚠️ No matches found in database</span>`;
                }
                
                // 🔥 COUNT BY STATUS
                const finished = allMatches.filter(m => isMatchFinished(m));
                const live = allMatches.filter(m => m.status === 'live');
                const upcoming = allMatches.filter(m => m.status === 'upcoming');
                
                document.getElementById('total-matches').textContent = allMatches.length;
                document.getElementById('finished-count').textContent = finished.length;
                document.getElementById('live-count').textContent = live.length;
                document.getElementById('upcoming-count').textContent = upcoming.length;
                
                // 🔥 Auto-select "finished" filter if we have finished matches
                if (finished.length > 0) {
                    document.getElementById('status-filter').value = 'finished';
                }
                
                applyFilters();
                
                if (finished.length > 0) {
                    showNotification(`✅ Loaded ${finished.length} finished matches out of ${allMatches.length} total`, 'success');
                } else {
                    showNotification(`⚠️ No finished matches found. Check your data structure.`, 'info');
                }
                
            } catch(e) {
                console.error('Error:', e);
                debugEl.innerHTML = `<span class="error">❌ Error: ${e.message}</span>`;
                container.innerHTML = `<div style="text-align:center;padding:40px;">Error: ${e.message}</div>`;
            }
        }
        
        // ==================== FILTERS ====================
        function applyFilters() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const statusFilter = document.getElementById('status-filter').value;
            const resultFilter = document.getElementById('result-filter').value;
            
            filteredMatches = allMatches.filter(match => {
                // Search
                if(searchTerm) {
                    const homeName = match.home_team?.name || '';
                    const awayName = match.away_team?.name || '';
                    const leagueName = match.league_name || '';
                    const fixtureId = match.fixture_id?.toString() || '';
                    if(!fixtureId.includes(searchTerm) && 
                       !homeName.toLowerCase().includes(searchTerm) && 
                       !awayName.toLowerCase().includes(searchTerm) &&
                       !leagueName.toLowerCase().includes(searchTerm)) return false;
                }
                
                // Status filter
                if(statusFilter !== 'all') {
                    if(statusFilter === 'finished' && !isMatchFinished(match)) return false;
                    if(statusFilter === 'live' && match.status !== 'live') return false;
                    if(statusFilter === 'upcoming' && match.status !== 'upcoming') return false;
                }
                
                // Result filter (only for matches with scores)
                if(resultFilter && match.score) {
                    const homeScore = match.score?.home || 0;
                    const awayScore = match.score?.away || 0;
                    if(resultFilter === 'home' && homeScore <= awayScore) return false;
                    if(resultFilter === 'away' && awayScore <= homeScore) return false;
                    if(resultFilter === 'draw' && homeScore !== awayScore) return false;
                }
                
                return true;
            });
            
            currentPage = 1;
            renderTable();
            renderPagination();
        }
        
        // ==================== RENDER TABLE ====================
        function renderTable() {
            const container = document.getElementById('results-container');
            
            if(!filteredMatches.length) {
                container.innerHTML = `<div class="empty-state"><i class="fas fa-search"></i><h3>No matches found</h3><p>Try adjusting your filters</p></div>`;
                return;
            }
            
            const startIdx = (currentPage - 1) * rowsPerPage;
            const pageMatches = filteredMatches.slice(startIdx, startIdx + rowsPerPage);
            
            let html = `<table><thead><tr>
                <th>Fixture</th><th>League</th><th>Home</th><th>Score</th><th>Away</th><th>Status</th><th>Result</th>
            </tr></thead><tbody>`;
            
            for(const match of pageMatches) {
                const homeName = match.home_team?.name || 'Home';
                const awayName = match.away_team?.name || 'Away';
                const fixtureId = match.fixture_id || match.id || 'N/A';
                
                // Get score
                let homeScore = '?';
                let awayScore = '?';
                if (match.score) {
                    homeScore = match.score.home !== undefined ? match.score.home : '?';
                    awayScore = match.score.away !== undefined ? match.score.away : '?';
                }
                
                // Determine status
                let statusClass = 'badge-upcoming';
                let statusText = match.status || 'unknown';
                if(isMatchFinished(match)) { 
                    statusClass = 'badge-finished'; 
                    statusText = 'FINISHED'; 
                } else if(match.status === 'live') { 
                    statusClass = 'badge-live'; 
                    statusText = '🔴 LIVE'; 
                } else if(match.status === 'upcoming') {
                    statusText = 'UPCOMING';
                }
                
                // Determine result
                let resultClass = '', resultText = '';
                if(homeScore !== '?' && awayScore !== '?' && homeScore !== null && awayScore !== null) {
                    if(homeScore > awayScore) { resultClass = 'badge-home'; resultText = '🏠 HOME WIN'; }
                    else if(homeScore < awayScore) { resultClass = 'badge-away'; resultText = '✈️ AWAY WIN'; }
                    else { resultClass = 'badge-draw'; resultText = '🤝 DRAW'; }
                }
                
                html += `<tr onclick='showMatchDetails(${JSON.stringify(match).replace(/'/g, "&#39;")})'>
                    <td><strong>#${fixtureId}</strong></td>
                    <td>${escapeHtml(match.league_name || 'N/A')}</td>
                    <td>${escapeHtml(homeName)}</td>
                    <td style="font-weight:bold;color:#ff9800;text-align:center;font-size:16px;">${homeScore} - ${awayScore}</td>
                    <td>${escapeHtml(awayName)}</td>
                    <td><span style="padding:3px 12px;border-radius:12px;font-size:10px;font-weight:bold;display:inline-block;background:${statusClass === 'badge-finished' ? '#666' : statusClass === 'badge-live' ? '#ff4444' : '#00ff9d'};color:${statusClass === 'badge-upcoming' ? '#000' : '#fff'};">${statusText}</span></td>
                    <td>${resultText ? `<span class="badge-result ${resultClass}">${resultText}</span>` : '-'}</td>
                </tr>`;
            }
            
            html += `</tbody></table>`;
            container.innerHTML = html;
        }
        
        // ==================== PAGINATION ====================
        function renderPagination() {
            const totalPages = Math.ceil(filteredMatches.length / rowsPerPage);
            const paginationDiv = document.getElementById('pagination');
            if(totalPages <= 1) { paginationDiv.innerHTML = ''; return; }
            
            let html = `<button class="page-btn" onclick="goToPage(1)" ${currentPage===1?'disabled':''}>«</button>`;
            html += `<button class="page-btn" onclick="goToPage(${currentPage-1})" ${currentPage===1?'disabled':''}>‹</button>`;
            
            let startPage = Math.max(1, currentPage - 2);
            let endPage = Math.min(totalPages, currentPage + 2);
            for(let i=startPage; i<=endPage; i++) {
                html += `<button class="page-btn ${i===currentPage?'active':''}" onclick="goToPage(${i})">${i}</button>`;
            }
            
            html += `<button class="page-btn" onclick="goToPage(${currentPage+1})" ${currentPage===totalPages?'disabled':''}>›</button>`;
            html += `<button class="page-btn" onclick="goToPage(${totalPages})" ${currentPage===totalPages?'disabled':''}>»</button>`;
            paginationDiv.innerHTML = html;
        }
        
        function goToPage(page) {
            const totalPages = Math.ceil(filteredMatches.length / rowsPerPage);
            if(page < 1 || page > totalPages) return;
            currentPage = page;
            renderTable();
            renderPagination();
        }
        
        // ==================== MODAL ====================
        function showMatchDetails(match) {
            const modal = document.getElementById('match-modal');
            const detailsDiv = document.getElementById('modal-details');
            
            const homeName = match.home_team?.name || 'Home';
            const awayName = match.away_team?.name || 'Away';
            const homeScore = match.score?.home ?? '?';
            const awayScore = match.score?.away ?? '?';
            
            detailsDiv.innerHTML = `
                <div style="text-align:center;margin-bottom:20px;">
                    <div style="display:flex;justify-content:center;align-items:center;gap:20px;flex-wrap:wrap;">
                        <div><strong style="font-size:18px;">${escapeHtml(homeName)}</strong></div>
                        <div style="font-size:32px;font-weight:bold;color:#ff9800;">${homeScore} - ${awayScore}</div>
                        <div><strong style="font-size:18px;">${escapeHtml(awayName)}</strong></div>
                    </div>
                    <div style="color:#a0a8c9;margin-top:10px;">
                        ${match.start_time ? new Date(match.start_time).toLocaleString() : 'Date TBD'}
                        ${match.league_name ? ` | 🏆 ${escapeHtml(match.league_name)}` : ''}
                    </div>
                </div>
                <div class="detail-grid">
                    <div class="detail-item"><div class="detail-label">Fixture ID</div><div class="detail-value">#${match.fixture_id || match.id}</div></div>
                    <div class="detail-item"><div class="detail-label">Status</div><div class="detail-value">${match.status || 'Unknown'}</div></div>
                    <div class="detail-item"><div class="detail-label">Result</div><div class="detail-value">${match.result || 'N/A'}</div></div>
                    <div class="detail-item"><div class="detail-label">Settled</div><div class="detail-value">${match.bets_settled ? '✅ Yes' : '⏳ No'}</div></div>
                    <div class="detail-item"><div class="detail-label">Elapsed</div><div class="detail-value">${match.elapsed ? match.elapsed + "'" : 'N/A'}</div></div>
                    <div class="detail-item"><div class="detail-label">League</div><div class="detail-value">${escapeHtml(match.league_name || 'N/A')}</div></div>
                </div>
                <div style="margin-top:15px;background:#0a0f1a;padding:15px;border-radius:8px;font-size:11px;color:#a0a8c9;overflow-x:auto;max-height:200px;overflow-y:auto;">
                    <strong>📊 Full Data:</strong><br>
                    <pre style="white-space:pre-wrap;word-break:break-all;margin-top:5px;">${JSON.stringify(match, null, 2)}</pre>
                </div>
            `;
            modal.classList.add('show');
        }
        
        function closeModal() { document.getElementById('match-modal').classList.remove('show'); }
        
        function showNotification(msg, type) { 
            const n = document.createElement('div'); 
            n.className = `notification ${type}`; 
            n.innerHTML = msg; 
            document.body.appendChild(n); 
            setTimeout(()=>n.remove(), 3000); 
        }
        
        function escapeHtml(str) { 
            if(!str) return ''; 
            return String(str).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); 
        }
        
        // ==================== INIT ====================
        firebase.auth().onAuthStateChanged(async (user) => {
            if(!user) { window.location.href = '../login.html'; return; }
            await loadMatches();
        });
        
        document.getElementById('match-modal').addEventListener('click', function(e) {
            if(e.target === this) closeModal();
        });
        
        // Make functions global
        window.applyFilters = applyFilters;
        window.goToPage = goToPage;
        window.showMatchDetails = showMatchDetails;
        window.closeModal = closeModal;
        window.loadMatches = loadMatches;
        
        console.log('✅ Results Dashboard with Supabase connection');
        console.log('📊 Connected to:', SUPABASE_URL);
        console.log('🔑 Using anon key');
    </script>
</body>
</html>
