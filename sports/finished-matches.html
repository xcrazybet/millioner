<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Results - X Lodon | النتائج</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <link rel="stylesheet" href="../css/sports-betting.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0f1a; color: white; font-family: 'Segoe UI', 'Tajawal', sans-serif; min-height: 100vh; }
        .header { background: #111827; padding: 12px 15px; border-bottom: 2px solid #a0a8c9; position: sticky; top: 0; z-index: 100; }
        .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .back-btn { color: #00ff9d; text-decoration: none; font-size: 20px; }
        .lang-toggle { background: #1a2332; border: 1px solid #00ff9d; color: #00ff9d; padding: 5px 12px; border-radius: 20px; cursor: pointer; }
        .tabs { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 3px; }
        .tab { padding: 8px 12px; background: #1a2332; border-radius: 20px; color: white; text-decoration: none; font-size: 12px; }
        .tab.active { background: #a0a8c9; color: black; }
        .container { max-width: 1200px; margin: 0 auto; padding: 15px; }
        .info-banner { background: #ff980022; padding: 12px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #ff980044; color: #ff9800; font-size: 13px; }
        .date-header { color: #a0a8c9; font-size: 14px; margin: 20px 0 15px; }
        .match-card { background: #111827; border-radius: 12px; padding: 15px; margin-bottom: 12px; border-left: 4px solid #a0a8c9; }
        .match-league { color: #a0a8c9; font-size: 13px; margin-bottom: 8px; }
        .match-teams { display: flex; align-items: center; justify-content: space-around; margin: 10px 0; }
        .team { text-align: center; flex: 1; font-weight: 600; }
        .score { font-size: 28px; font-weight: bold; }
        .result-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; margin-top: 8px; }
        .result-badge.home { background: #4caf50; color: white; }
        .result-badge.draw { background: #ffc107; color: black; }
        .result-badge.away { background: #2196f3; color: white; }
        .empty-state { text-align: center; padding: 50px; color: #a0a8c9; }
        .arabic { font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-top">
            <div class="header-left">
                <a href="betting-sport.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
                <h1 style="font-size:18px;"><i class="fas fa-futbol"></i> <span class="en">X Lodon Sports</span><span class="ar" style="display:none;">إكس لودون سبورت</span></h1>
            </div>
            <button class="lang-toggle" onclick="toggleLanguage()"><span class="en">🇸🇦 عربي</span><span class="ar" style="display:none;">🇬🇧 English</span></button>
        </div>
        <div class="tabs">
            <a href="betting-sport.html" class="tab"><span class="en">Home</span></a>
            <a href="live-matches.html" class="tab"><span class="en">Live</span></a>
            <a href="upcoming-matches.html" class="tab"><span class="en">Upcoming</span></a>
            <a href="finished-matches.html" class="tab active"><span class="en">Results</span></a>
            <a href="my-bets.html" class="tab"><span class="en">My Bets</span></a>
        </div>
    </div>
    
    <div class="container">
        <div class="info-banner"><i class="fas fa-info-circle"></i> <span class="en">Results displayed for 24 hours after match completion</span><span class="ar" style="display:none;">يتم عرض النتائج لمدة 24 ساعة</span></div>
        <div id="matches-container"><div style="text-align:center;padding:30px;">Loading results...</div></div>
        <div id="empty-state" class="empty-state" style="display:none;"><i class="fas fa-trophy" style="font-size:48px; opacity:0.3;"></i><p>No recent results</p></div>
    </div>

    <script src="../js/supabase-client.js"></script>
    <script>
        function toggleLanguage() {
            var isEn = document.querySelector('.en').style.display !== 'none';
            document.querySelectorAll('.en').forEach(el => el.style.display = isEn ? 'none' : '');
            document.querySelectorAll('.ar').forEach(el => el.style.display = isEn ? '' : 'none');
            document.documentElement.dir = isEn ? 'rtl' : 'ltr';
        }
        
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        
        auth.onAuthStateChanged(u => { if (!u) location.href = '../login.html'; else loadResults(); });
        
        async function loadResults() {
            const container = document.getElementById('matches-container');
            const empty = document.getElementById('empty-state');
            
            if (!window.supaDB) {
                container.innerHTML = '<div class="empty-state">Supabase not connected</div>';
                return;
            }
            
            const matches = await window.supaDB.getFinishedMatches();
            
            if (matches.length === 0) {
                container.style.display = 'none';
                empty.style.display = 'block';
                return;
            }
            
            container.style.display = 'block';
            empty.style.display = 'none';
            
            const grouped = {};
            matches.forEach(m => {
                const d = new Date(m.start_time);
                const key = d.toDateString();
                if (!grouped[key]) grouped[key] = [];
                grouped[key].push(m);
            });
            
            container.innerHTML = '';
            Object.keys(grouped).sort().reverse().forEach(key => {
                container.innerHTML += `<div class="date-header"><i class="far fa-calendar"></i> ${new Date(key).toLocaleDateString('en-US', {weekday:'long', month:'short', day:'numeric'})}</div>`;
                grouped[key].forEach(m => container.appendChild(createCard(m)));
            });
        }
        
        function createCard(m) {
            const card = document.createElement('div'); card.className = 'match-card';
            const homeName = m.home_team?.name || 'Home';
            const awayName = m.away_team?.name || 'Away';
            const resultText = m.result === 'home' ? 'HOME WIN' : m.result === 'draw' ? 'DRAW' : 'AWAY WIN';
            card.innerHTML = `
                <div class="match-league"><i class="fas fa-trophy"></i> ${m.league_name||'League'}</div>
                <div class="match-teams"><span class="team">${homeName}</span><span class="score">${m.score?.home||0} - ${m.score?.away||0}</span><span class="team">${awayName}</span></div>
                <div style="text-align:center;"><span class="result-badge ${m.result}">${resultText}</span></div>
            `;
            return card;
        }
    </script>
</body>
</html>
