<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results - X Lodon</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="../css/sports-betting.css">
    <style>
        body { background: #0a0f1a; color: white; font-family: 'Segoe UI', sans-serif; margin: 0; }
        .container { max-width: 1200px; margin: 0 auto; padding: 15px; }
        .header { background: #111827; padding: 15px; border-bottom: 2px solid #00ff9d; }
        .tabs { display: flex; gap: 5px; flex-wrap: wrap; }
        .tab { padding: 10px 15px; background: #1a2332; border-radius: 8px; color: white; text-decoration: none; }
        .tab.active { background: #00ff9d; color: black; }
        .match-card { background: #111827; border-radius: 10px; padding: 15px; margin: 10px 0; border-left: 4px solid #a0a8c9; }
        .result-badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .result-badge.home { background: #4caf50; }
        .result-badge.draw { background: #ffc107; color: black; }
        .result-badge.away { background: #2196f3; }
        .info-banner { background: #ff980022; padding: 12px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #ff980044; }
    </style>
</head>
<body>
    <div class="header">
        <h1><i class="fas fa-futbol"></i> X Lodon Sports</h1>
        <div class="tabs">
            <a href="betting-sport.html" class="tab">Home</a>
            <a href="live-matches.html" class="tab">Live</a>
            <a href="upcoming-matches.html" class="tab">Upcoming</a>
            <a href="finished-matches.html" class="tab active">Results</a>
            <a href="my-bets.html" class="tab">My Bets</a>
        </div>
    </div>
    
    <div class="container">
        <div class="info-banner">
            <i class="fas fa-info-circle"></i> Results displayed for 24 hours after match completion
        </div>
        <div id="matches-container"></div>
        <div id="empty-state" style="display:none; text-align:center; padding:40px; color:#a0a8c9;">
            <i class="fas fa-trophy" style="font-size:48px; opacity:0.3;"></i>
            <p>No recent results</p>
        </div>
    </div>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), db = firebase.firestore();
        
        auth.onAuthStateChanged(u => { if (!u) location.href = '../login.html'; else loadResults(); });
        
        function loadResults() {
            const container = document.getElementById('matches-container');
            const empty = document.getElementById('empty-state');
            const now = new Date();
            
            db.collection('sports_matches')
                .where('status', '==', 'finished')
                .where('expiresAt', '>', now)
                .orderBy('expiresAt', 'desc')
                .onSnapshot(snap => {
                    if (snap.empty) {
                        container.style.display = 'none';
                        empty.style.display = 'block';
                    } else {
                        container.style.display = 'block';
                        empty.style.display = 'none';
                        container.innerHTML = '';
                        snap.forEach(d => container.appendChild(createCard(d.data())));
                    }
                });
        }
        
        function createCard(m) {
            const card = document.createElement('div');
            card.className = 'match-card';
            
            const resultText = m.result === 'home' ? 'Home Win' : m.result === 'draw' ? 'Draw' : 'Away Win';
            
            card.innerHTML = `
                <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                    <span style="color:#a0a8c9;">${m.leagueName||''}</span>
                    <span style="color:#a0a8c9;">Final</span>
                </div>
                <div style="display:flex; align-items:center; justify-content:space-around;">
                    <div><strong>${m.homeTeam?.name||'Home'}</strong></div>
                    <div style="font-size:24px; font-weight:bold;">${m.score?.home||0}-${m.score?.away||0}</div>
                    <div><strong>${m.awayTeam?.name||'Away'}</strong></div>
                </div>
                <div style="text-align:center; margin-top:10px;">
                    <span class="result-badge ${m.result}">${resultText}</span>
                </div>
            `;
            return card;
        }
    </script>
</body>
</html>
