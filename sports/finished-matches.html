<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Results - X Lodon Betting</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="../css/sports-betting.css">
    <style>body { background: #0a0f1a; color: white; min-height: 100vh; margin: 0; font-family: 'Segoe UI', 'Roboto', sans-serif; } .container { max-width: 1200px; margin: 0 auto; padding: 15px; } .page-header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; } .back-btn { width: 40px; height: 40px; background: #111827; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #00ff9d; text-decoration: none; font-size: 18px; border: 1px solid rgba(255, 255, 255, 0.1); } .page-title { font-size: 22px; font-weight: 700; color: #a0a8c9; display: flex; align-items: center; gap: 10px; } .info-banner { background: rgba(255, 152, 0, 0.1); padding: 12px 15px; border-radius: 10px; margin-bottom: 20px; color: #ff9800; font-size: 13px; display: flex; align-items: center; gap: 10px; border: 1px solid rgba(255, 152, 0, 0.2); } .result-badge { display: inline-block; padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; margin-left: 8px; } .result-badge.home { background: #4caf50; color: white; } .result-badge.draw { background: #ffc107; color: #000; } .result-badge.away { background: #2196f3; color: white; }</style>
</head>
<body>
    <header class="sports-header">
        <h1><i class="fas fa-futbol"></i> X Lodon Sports</h1>
        <div class="sports-tabs">
            <a href="betting-sport.html" class="sports-tab"><i class="fas fa-home"></i> Home</a>
            <a href="live-matches.html" class="sports-tab"><i class="fas fa-circle" style="color: #ff5252; font-size: 10px;"></i> Live</a>
            <a href="upcoming-matches.html" class="sports-tab"><i class="fas fa-calendar"></i> Upcoming</a>
            <a href="finished-matches.html" class="sports-tab active"><i class="fas fa-check-circle"></i> Results</a>
            <a href="my-bets.html" class="sports-tab"><i class="fas fa-ticket-alt"></i> My Bets</a>
        </div>
    </header>
    <div class="container">
        <div class="page-header"><a href="betting-sport.html" class="back-btn"><i class="fas fa-arrow-left"></i></a><div class="page-title"><i class="fas fa-check-circle"></i> Recent Results</div></div>
        <div class="info-banner"><i class="fas fa-info-circle"></i> Results are displayed for 24 hours after match completion</div>
        <div id="matches-container"><div class="loading-spinner"><div class="spinner"></div><p>Loading results...</p></div></div>
        <div id="empty-state" class="empty-state" style="display: none;"><i class="fas fa-trophy"></i><p>No recent results</p><small>Finished matches appear here for 24 hours</small></div>
    </div>
    <nav style="display: flex; justify-content: space-around; background: #111827; padding: 12px; border-top: 1px solid rgba(0, 255, 157, 0.2); margin-top: 30px;">
        <a href="../index.html" style="color: #a0a8c9; text-decoration: none;"><i class="fas fa-home"></i> Home</a>
        <a href="../games.html" style="color: #a0a8c9; text-decoration: none;"><i class="fas fa-gamepad"></i> Casino</a>
        <a href="betting-sport.html" style="color: #00ff9d; text-decoration: none;"><i class="fas fa-futbol"></i> Sports</a>
        <a href="../dashboard.html" style="color: #a0a8c9; text-decoration: none;"><i class="fas fa-user"></i> Account</a>
    </nav>
    <script>
        const firebaseConfig = { apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM", authDomain: "x-bet-prod-jd.firebaseapp.com", projectId: "x-bet-prod-jd", storageBucket: "x-bet-prod-jd.firebasestorage.app", messagingSenderId: "499334334535", appId: "1:499334334535:web:bebc1bf817e24d9e3c4962" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), db = firebase.firestore(); let unsubscribe = null;
        auth.onAuthStateChanged((user) => { if (!user) { window.location.href = '../login.html'; return; } loadFinishedMatches(); });
        function loadFinishedMatches() { const container = document.getElementById('matches-container'), emptyState = document.getElementById('empty-state'), now = new Date(); unsubscribe = db.collection('sports_matches').where('status', '==', 'finished').where('expiresAt', '>', now).orderBy('expiresAt', 'desc').onSnapshot((snapshot) => { if (snapshot.empty) { container.style.display = 'none'; emptyState.style.display = 'block'; } else { container.style.display = 'block'; emptyState.style.display = 'none'; container.innerHTML = ''; snapshot.forEach(doc => { container.appendChild(createFinishedMatchCard(doc.data())); }); } }, (error) => { console.error('Error loading results:', error); container.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Error loading results</p></div>'; }); }
        function createFinishedMatchCard(match) { const card = document.createElement('div'); card.className = 'match-card finished'; const resultText = match.result === 'home' ? 'Home Win' : match.result === 'draw' ? 'Draw' : match.result === 'away' ? 'Away Win' : 'Unknown'; card.innerHTML = `<div class="match-header"><div class="match-league"><i class="fas fa-trophy"></i> ${match.leagueName || 'League'}</div><div class="match-time">Final</div></div><div class="match-body"><div class="team"><div class="team-logo">${match.homeTeam.name.substring(0, 3).toUpperCase()}</div><div class="team-name">${match.homeTeam.name}</div></div><div class="match-score"><span class="score-display">${match.score?.home || 0}</span><span class="score-separator">-</span><span class="score-display">${match.score?.away || 0}</span></div><div class="team"><div class="team-logo">${match.awayTeam.name.substring(0, 3).toUpperCase()}</div><div class="team-name">${match.awayTeam.name}</div></div></div><div style="text-align: center; padding: 10px;"><span>Result: ${resultText}</span><span class="result-badge ${match.result}">${match.result?.toUpperCase() || '?'}</span></div>`; return card; }
        window.addEventListener('beforeunload', () => { if (unsubscribe) unsubscribe(); });
    </script>
    <script src="../js/proxy.js"></script>
    <script src="../js/sports-api.js"></script>
</body>
</html>
