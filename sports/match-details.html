        async function fetchMatchFromAPI(fid){
            try{
                const r=await fetch(`${API_BASE}/api/fixture/${fid}`);
                const d=await r.json();
                if(d.success&&d.fixture){
                    const ss=d.fixture.status?.short,isLive=ss==='1H'||ss==='2H'||ss==='HT',isFinished=ss==='FT'||ss==='AET'||ss==='PEN';
                    let status='upcoming';if(isLive)status='live';else if(isFinished)status='finished';
                    return{fixture_id:d.fixture.id,status,league_name:d.league?.name||'',league_logo:d.league?.logo||'',home_team:{id:d.teams?.home?.id||0,name:d.teams?.home?.name||'Home',logo:d.teams?.home?.logo||''},away_team:{id:d.teams?.away?.id||0,name:d.teams?.away?.name||'Away',logo:d.teams?.away?.logo||''},start_time:d.fixture.date,score:{home:d.goals?.home||0,away:d.goals?.away||0},elapsed:d.fixture.status?.elapsed||0,bets_closed:false,odds:generateOddsAll()};

        async function getMatch(fid){
            if(supabaseClient){try{const{data,error}=await supabaseClient.from('sports_matches').select('*').eq('fixture_id',parseInt(fid)).maybeSingle();if(!error&&data){if(typeof data.home_team==='string')try{data.home_team=JSON.parse(data.home_team);}catch(e){data.home_team={name:'Home',logo:''};}if(typeof data.away_team==='string')try{data.away_team=JSON.parse(data.away_team);}catch(e){data.away_team={name:'Away',logo:''};}if(typeof data.score==='string')try{data.score=JSON.parse(data.score);}catch(e){data.score={home:0,away:0};}if(!data.odds||typeof data.odds==='string')data.odds=generateOddsAll();return data;}}catch(e){}}
            const apiMatch=await fetchMatchFromAPI(fid);if(apiMatch){if(!apiMatch.odds)apiMatch.odds=generateOddsAll();return apiMatch;}
            return{fixture_id:parseInt(fid),status:'upcoming',league_name:'Match Details',league_logo:'',home_team:{name:'Home Team',logo:''},away_team:{name:'Away Team',logo:''},start_time:new Date().toISOString(),score:{home:0,away:0},elapsed:0,bets_closed:false,odds:generateOddsAll()};

        async function placeBet(betData){
            const user=auth.currentUser;if(!user)throw new Error('Not authenticated');
            const match=await getMatch(betData.fixture_id);
            if(match.status==='finished')throw new Error('🔒 Match already finished');
            if(match.status==='live'){const e=match.elapsed||0;if(e>=BETTING_CLOSE_MINUTE)throw new Error(`🔒 Betting closed at ${e}'`);if(match.bets_closed)throw new Error('🔒 Betting closed');}
            const bal=await getBalance(user.uid);if(bal<betData.amount)throw new Error(`Insufficient balance: ${fmt(bal)}`);
            const bet={id:`${Date.now()}_${Math.random().toString(36).substr(2,9)}`,user_id:user.uid,fixture_id:betData.fixture_id,bet_type:betData.bet_type,bet_name:betData.bet_name,odds:betData.odds,amount:betData.amount,potential_win:betData.amount*betData.odds,status:'active',placed_at:new Date().toISOString(),match_status_at_bet:match.status,match_score_at_bet:match.score||{home:0,away:0},match_elapsed_at_bet:match.elapsed||0};
            await deductBalance(user.uid,betData.amount,bet.id);
            if(supabaseClient){const{error}=await supabaseClient.from('bets').insert(bet);if(error)throw error;}
            return bet;
        }

        async function placeAccumulatorBet(){

            let totalOdds=1;accumulatorSlip.forEach(s=>totalOdds*=s.odds);const win=stake*totalOdds;
            if(!confirm(`Place accumulator?\n${accumulatorSlip.length} picks\nOdds: ${totalOdds.toFixed(2)}\nStake: $${stake}\nWin: ${fmt(win)}`))return;
            try{
                const bet={id:Date.now(),user_id:user.uid,bet_type:'accumulator',bet_name:`${accumulatorSlip.length}-fold Acc`,odds:totalOdds,amount:stake,potential_win:win,status:'active',placed_at:new Date().toISOString(),selections:accumulatorSlip};
                await deductBalance(user.uid,stake,bet.id);if(supabaseClient)await supabaseClient.from('bets').insert(bet);
                accumulatorSlip=[];updateCartUI();toggleCart();await updateBalanceDisplay();noty(`✅ Accumulator placed! Win: ${fmt(win)}`);
            }catch(e){noty(e.message,'error');}
        }

        function toggleCart(){document.getElementById('side-cart').classList.toggle('open');document.getElementById('cart-overlay').classList.toggle('show');}
        function updateCartUI(){
            document.getElementById('cart-badge').textContent=accumulatorSlip.length;
            let totalOdds=1;accumulatorSlip.forEach(s=>totalOdds*=s.odds);
            document.getElementById('cart-total-odds').textContent=totalOdds.toFixed(2);
            const stake=parseFloat(document.getElementById('cart-stake').value)||0;
            document.getElementById('cart-potential').textContent=fmt(stake*totalOdds);
            document.getElementById('cart-place-btn').disabled=accumulatorSlip.length<2;
            document.getElementById('cart-items').innerHTML=accumulatorSlip.length===0?'<div style="text-align:center;padding:20px;color:#a0a8c9;">No selections</div>':accumulatorSlip.map((s,i)=>`<div class="cart-item"><div class="cart-item-match">${esc(s.matchName)}</div><div class="cart-item-bet">${esc(s.betTypeName)}</div><div class="cart-item-odds">@${s.odds}</div><button class="cart-remove" onclick="removeFromSlip(${i})"><i class="fas fa-trash-alt"></i></button></div>`).join('');
        }
        function addToSlipFromMatch(betType,odds,betName){
            if(!currentMatch)return;if(checkIfBettingDisabled()){noty('Betting is closed','error');return;}
            const ht=currentMatch.home_team?.name||'Home',at=currentMatch.away_team?.name||'Away';
            if(accumulatorSlip.find(s=>s.fixtureId===currentMatch.fixture_id&&s.betType===betType)){noty('Already in slip','error');return;}
            accumulatorSlip.push({fixtureId:currentMatch.fixture_id,matchName:`${ht} vs ${at}`,betType,betTypeName:betName,odds:parseFloat(odds)});
            updateCartUI();noty(`Added to slip: ${betName}`);
        }
        function removeFromSlip(i){accumulatorSlip.splice(i,1);updateCartUI();}

        function goBack(){window.history.back();}
        function toggleLanguage(){const isArabic=document.body.classList.toggle('arabic');localStorage.setItem('lang',isArabic?'ar':'en');document.documentElement.dir=isArabic?'rtl':'ltr';document.querySelector('.lang-toggle').textContent=isArabic?'English':'عربي';}
        if(localStorage.getItem('lang')==='ar')toggleLanguage();

        function showError(m){const e=document.getElementById('error-message');e.innerHTML=`<i class="fas fa-exclamation-triangle"></i> ${m}`;e.style.display='block';setTimeout(()=>{e.style.display='none';},5000);}
        function showSuccess(m){const e=document.getElementById('success-message');e.innerHTML=`<i class="fas fa-check-circle"></i> ${m}`;e.style.display='block';setTimeout(()=>{e.style.display='none';},3000);}
        function formatMatchTime(d){const dt=new Date(d);return dt.toLocaleDateString()+' at '+dt.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});}

        function startBettingCountdown(){
            if(bettingCountdownInterval)clearInterval(bettingCountdownInterval);
            if(currentMatch&&currentMatch.status==='live'){
                document.getElementById('betting-countdown').style.display='block';
                function update(){const e=currentMatch.elapsed||0,r=Math.max(0,BETTING_CLOSE_MINUTE-e);const el=document.getElementById('betting-countdown');
                    if(e>=BETTING_CLOSE_MINUTE){el.innerHTML=`<i class="fas fa-ban"></i> Betting Closed - ${e}'`;el.style.color='#ff5252';document.getElementById('place-bet-btn').disabled=true;document.getElementById('add-to-slip-btn').disabled=true;document.querySelectorAll('.bet-option').forEach(o=>o.classList.add('disabled'));}
                    else{el.innerHTML=`<i class="fas fa-clock"></i> Open for ${r} more min`;el.style.color=r<=5?'#ff9800':'#00ff9d';}}
                update();bettingCountdownInterval=setInterval(update,1000);}
        }
        function startLiveTimer(){
            if(liveTimerInterval)clearInterval(liveTimerInterval);
            if(currentMatch&&currentMatch.status==='live'){
                document.getElementById('live-timer').style.display='block';
                function update(){const e=currentMatch.elapsed||0;let p='',de=e;const el=document.getElementById('live-timer');
                    if(e<45){p='1st Half';}else if(e<60){p='Half Time';de=0;}else if(e<90){p='2nd Half';de=e-45;}else{p='Added Time';de=e-90;}
                    el.innerHTML=p==='Half Time'?`<i class="fas fa-pause-circle"></i> ${p}`:`<i class="fas fa-clock"></i> ${p}: ${de}'`;el.style.color=e>=80?'#ff5252':'#ff9800';}
                update();liveTimerInterval=setInterval(update,1000);}
        }
        function startCountdown(){
            if(countdownInterval)clearInterval(countdownInterval);
            if(currentMatch&&currentMatch.status==='upcoming'){
                const mt=new Date(currentMatch.start_time);const el=document.getElementById('countdown-timer');
                function update(){const n=new Date(),d=mt-n;if(d<=0){el.innerHTML='<span style="color:#00ff9d;">Started! Refreshing...</span>';setTimeout(()=>location.reload(),3000);return;}
                    const h=Math.floor(d/3600000),m=Math.floor((d%3600000)/60000),s=Math.floor((d%60000)/1000);let ds=h>0?`${h}h ${m}m ${s}s`:(m>0?`${m}m ${s}s`:`${s}s`);
                    el.innerHTML=`<i class="fas fa-hourglass-half"></i> Starts in: ${ds}`;el.style.color=(m<5&&h===0)?'#ff9800':'#a0a8c9';}
                update();countdownInterval=setInterval(update,1000);}
        }

        async function loadMatch(){
            if(!fixtureId){showError('No match selected');document.getElementById('loading').innerHTML='<div class="no-data">No match selected</div>';return;}
            try{currentMatch=await getMatch(fixtureId);document.getElementById('loading').style.display='none';document.getElementById('content').style.display='block';
                renderMatchDetails();renderBetOptions();checkBettingAvailability();startLiveTimer();startBettingCountdown();startCountdown();
                if(currentMatch.status==='live')startAutoRefresh();}
            catch(e){document.getElementById('loading').innerHTML=`<div class="no-data">Error: ${e.message}<br><button onclick="location.reload()" style="background:#00ff9d;color:black;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;margin-top:10px;">Retry</button></div>`;}
        }

        function renderMatchDetails(){
            if(!currentMatch)return;
            const isLive=currentMatch.status==='live',isUpcoming=currentMatch.status==='upcoming';
            let ht=currentMatch.home_team,at=currentMatch.away_team;
            if(typeof ht==='string')try{ht=JSON.parse(ht);}catch(e){ht={name:'Home',logo:''};}
            if(typeof at==='string')try{at=JSON.parse(at);}catch(e){at={name:'Away',logo:''};}
            ht=ht||{name:'Home',logo:''};at=at||{name:'Away',logo:''};
            const score=currentMatch.score||{home:0,away:0};
            let statusHtml='';if(isLive)statusHtml=`<div class="live-status"><i class="fas fa-circle"></i> LIVE - ${currentMatch.elapsed||0}'</div>`;else if(isUpcoming)statusHtml='<div class="upcoming-status"><i class="fas fa-clock"></i> UPCOMING</div>';else statusHtml='<div class="finished-status"><i class="fas fa-check-circle"></i> FINISHED</div>';
            document.getElementById('match-stats-container').innerHTML=`<div class="match-detail-row"><span class="match-detail-label"><i class="fas fa-trophy"></i> League:</span><span class="match-detail-value">${esc(currentMatch.league_name)}</span></div><div class="match-detail-row"><span class="match-detail-label"><i class="far fa-calendar-alt"></i> Date:</span><span class="match-detail-value">${formatMatchTime(currentMatch.start_time)}</span></div>`;
            const logo1=ht.logo||'https://via.placeholder.com/80', logo2=at.logo||'https://via.placeholder.com/80';
            document.getElementById('match-hero').innerHTML=`<div class="teams-large"><div><img class="team-logo-lg" src="${logo1}" onerror="this.style.display='none'"><div class="team-name-lg">${esc(ht.name)}</div></div><div class="vs-large">${isLive?`<span class="live-score">${score.home||0} - ${score.away||0}</span>`:'VS'}</div><div><img class="team-logo-lg" src="${logo2}" onerror="this.style.display='none'"><div class="team-name-lg">${esc(at.name)}</div></div></div>${statusHtml}`;
        }

        function renderBetOptions(){
            if(!currentMatch)return;
            let odds=currentMatch.odds;if(typeof odds==='string')try{odds=JSON.parse(odds);}catch(e){odds=generateOddsAll();}
            odds=odds||generateOddsAll();
            const betTypes=BET_TYPES[currentTab]||BET_TYPES['1x2'];
            let html='<div class="bet-options">';
            betTypes.forEach(bet=>{let finalOdds=odds[bet.type]||generateOdds(odds,bet.type);html+=`<div class="bet-option" data-type="${bet.type}" data-odds="${finalOdds}" data-name="${bet.name}"><div class="bet-option-name">${bet.name}</div><div class="bet-option-odds">${finalOdds}</div></div>`;});
            html+='</div>';document.getElementById('bet-options-container').innerHTML=html;
            const disabled=checkIfBettingDisabled();
            document.querySelectorAll('.bet-option').forEach(opt=>{if(disabled)opt.classList.add('disabled');opt.addEventListener('click',function(){if(disabled){showError('Betting closed');return;}document.querySelectorAll('.bet-option').forEach(o=>o.classList.remove('selected'));this.classList.add('selected');selectedBet={type:this.dataset.type,name:this.dataset.name,odds:parseFloat(this.dataset.odds)};selectedOdds=selectedBet.odds;const amt=parseFloat(document.getElementById('bet-amount').value)||0;document.getElementById('potential-win').textContent=fmt(amt*selectedOdds);document.getElementById('place-bet-btn').disabled=false;document.getElementById('place-bet-btn').innerHTML='Place Bet';document.getElementById('add-to-slip-btn').disabled=false;document.getElementById('add-to-slip-btn').textContent='Add to Bet Slip';document.getElementById('add-to-slip-btn').style.background='#ff9800';});});
            if(disabled){document.getElementById('place-bet-btn').disabled=true;document.getElementById('place-bet-btn').innerHTML='Betting Closed';document.getElementById('add-to-slip-btn').disabled=true;}
        }

        function checkIfBettingDisabled(){if(!currentMatch)return true;if(currentMatch.status==='finished')return true;if(currentMatch.status==='live'){const e=currentMatch.elapsed||0;if(e>=BETTING_CLOSE_MINUTE)return true;if(currentMatch.bets_closed)return true;}return false;}

        function checkBettingAvailability(){
            if(!currentMatch)return;const isLive=currentMatch.status==='live',isUpcoming=currentMatch.status==='upcoming',isFinished=currentMatch.status==='finished',elapsed=currentMatch.elapsed||0;
            let msg='',cls='',enabled=true;
            if(isFinished){msg='🔒 Match finished';cls='betting-closed';enabled=false;}else if(isLive){if(elapsed>=BETTING_CLOSE_MINUTE){msg=`🔒 Closed at ${elapsed}'`;cls='betting-closed';enabled=false;}else{msg=`🟢 LIVE - ${BETTING_CLOSE_MINUTE-elapsed} min remaining`;cls='betting-open';}}else if(isUpcoming){msg='🟢 UPCOMING - Betting OPEN';cls='betting-open';}
            const d=document.getElementById('betting-info');d.innerHTML=`<i class="fas fa-info-circle"></i> ${msg}`;d.className=`info-note ${cls}`;
            if(!enabled){document.getElementById('place-bet-btn').disabled=true;document.getElementById('place-bet-btn').innerHTML='Betting Closed';document.getElementById('add-to-slip-btn').disabled=true;document.querySelectorAll('.bet-option').forEach(o=>o.classList.add('disabled'));}
        }

        function startAutoRefresh(){if(refreshInterval)clearInterval(refreshInterval);refreshInterval=setInterval(async()=>{if(currentMatch&&currentMatch.status==='live'){try{const fm=await getMatch(fixtureId);if(fm){currentMatch=fm;renderMatchDetails();checkBettingAvailability();if(currentMatch.odds)renderBetOptions();}}catch(e){}await updateBalanceDisplay();}},15000);}

        async function updateBalanceDisplay(){const user=auth.currentUser;if(user){document.getElementById('balance-display').textContent=fmt(await getBalance(user.uid));}}

        async function placeBetHandler(){
            if(!selectedBet){showError('Select an outcome');return;}
            const amt=parseFloat(document.getElementById('bet-amount').value);if(isNaN(amt)||amt<1){showError('Min $1');return;}
            const user=auth.currentUser;if(!user){showError('Login required');return;}
            const bal=await getBalance(user.uid);if(amt>bal){showError(`Insufficient: ${fmt(bal)}`);return;}
            if(!confirm(`Confirm:\n${selectedBet.name}\nOdds: ${selectedOdds}\nAmount: $${amt}\nWin: ${fmt(amt*selectedOdds)}`))return;
            try{await placeBet({fixture_id:parseInt(fixtureId),bet_type:selectedBet.type,bet_name:selectedBet.name,odds:selectedOdds,amount:amt});await updateBalanceDisplay();noty(`✅ Bet placed! Win: ${fmt(amt*selectedOdds)}`);selectedBet=null;selectedOdds=null;document.getElementById('bet-amount').value='10';document.getElementById('potential-win').textContent='$0.00';document.querySelectorAll('.bet-option').forEach(o=>o.classList.remove('selected'));document.getElementById('place-bet-btn').disabled=true;document.getElementById('place-bet-btn').innerHTML='Select Outcome';document.getElementById('add-to-slip-btn').disabled=true;}
            catch(e){showError(e.message);noty(e.message,'error');}
        }

        function addToSlipHandler(){if(!selectedBet){showError('Select outcome first');return;}addToSlipFromMatch(selectedBet.type,selectedOdds,selectedBet.name);}

        document.getElementById('bet-tabs').addEventListener('click',function(e){if(e.target.classList.contains('bet-type-tab')){document.querySelectorAll('.bet-type-tab').forEach(t=>t.classList.remove('active'));e.target.classList.add('active');currentTab=e.target.dataset.tab;selectedBet=null;selectedOdds=null;document.getElementById('potential-win').textContent='$0.00';document.getElementById('place-bet-btn').disabled=true;document.getElementById('place-bet-btn').innerHTML='Select Outcome';document.getElementById('add-to-slip-btn').disabled=true;renderBetOptions();}});
        document.querySelectorAll('.quick-amount').forEach(b=>{b.addEventListener('click',function(){const a=parseFloat(this.dataset.amount);document.getElementById('bet-amount').value=a;if(selectedOdds)document.getElementById('potential-win').textContent=fmt(a*selectedOdds);});});
        document.getElementById('bet-amount').addEventListener('input',function(){const a=parseFloat(this.value)||0;if(selectedOdds)document.getElementById('potential-win').textContent=fmt(a*selectedOdds);});
        document.getElementById('place-bet-btn').addEventListener('click',placeBetHandler);
        document.getElementById('add-to-slip-btn').addEventListener('click',addToSlipHandler);
        document.getElementById('cart-stake')?.addEventListener('input',()=>updateCartUI());

        auth.onAuthStateChanged(async user=>{if(user){await updateBalanceDisplay();loadMatch();}else{loadMatch();}});
        window.addEventListener('beforeunload',()=>{if(refreshInterval)clearInterval(refreshInterval);if(liveTimerInterval)clearInterval(liveTimerInterval);if(bettingCountdownInterval)clearInterval(bettingCountdownInterval);if(countdownInterval)clearInterval(countdownInterval);});

        window.goBack=goBack;window.toggleLanguage=toggleLanguage;window.toggleCart=toggleCart;window.removeFromSlip=removeFromSlip;window.placeAccumulatorBet=placeAccumulatorBet;window.addToSlipFromMatch=addToSlipFromMatch;window.placeBetHandler=placeBetHandler;window.addToSlipHandler=addToSlipHandler;
        console.log('✅ Match Details - 23 Categories, 150+ Bet Types Loaded');
    </script>
</body>
</html>
