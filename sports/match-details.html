<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Match Details - X Lodon | Sports Betting</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Firebase and Supabase Core Libraries -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0f1a; color: white; font-family: 'Segoe UI', 'Tajawal', sans-serif; min-height: 100vh; }
        
        .header { background: #111827; padding: 12px 15px; border-bottom: 2px solid #00ff9d; display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        .back-btn { color: #00ff9d; text-decoration: none; font-size: 20px; }
        .lang-toggle { background: #1a2332; border: 1px solid #00ff9d; color: #00ff9d; padding: 5px 12px; border-radius: 20px; cursor: pointer; margin-left: auto; }
        
        .container { max-width: 800px; margin: 0 auto; padding: 15px; padding-bottom: 100px; }
        
        .balance-bar { background: #111827; padding: 10px 15px; border-radius: 12px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #00ff9d33; }
        
        .match-hero { background: linear-gradient(135deg, #111827, #1a2332); border-radius: 20px; padding: 25px 15px; margin-bottom: 20px; text-align: center; border: 1px solid #00ff9d33; }
        .teams-large { display: flex; align-items: center; justify-content: center; gap: 15px; flex-wrap: wrap; }
        .team-logo-lg { width: 80px; height: 80px; object-fit: contain; border-radius: 50%; background: rgba(255,255,255,0.1); padding: 10px; }
        .team-name-lg { font-size: 20px; font-weight: bold; margin-top: 10px; max-width: 150px; word-wrap: break-word; }
        .vs-large { font-size: 24px; color: #ff9800; font-weight: bold; margin: 0 20px; }
        .live-score { font-size: 32px; color: #00ff9d; }
        .match-info { margin-top: 15px; color: #a0a8c9; font-size: 14px; }
        .live-status { display: inline-block; background: #ff4444; color: white; padding: 4px 12px; border-radius: 20px; font-size: 12px; margin-top: 10px; animation: pulse 1.5s infinite; }
        .upcoming-status { display: inline-block; background: #00ff9d; color: black; padding: 4px 12px; border-radius: 20px; font-size: 12px; margin-top: 10px; }
        .finished-status { display: inline-block; background: #a0a8c9; color: black; padding: 4px 12px; border-radius: 20px; font-size: 12px; margin-top: 10px; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
        
        .match-detail-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #ffffff11; font-size: 13px; }
        .match-detail-label { color: #a0a8c9; }
        .match-detail-value { font-weight: 500; color: #00ff9d; }
        
        .bet-type-tabs { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px; flex-wrap: wrap; }
        .bet-type-tab { padding: 10px 16px; background: #1a2332; border: none; border-radius: 25px; color: white; font-size: 13px; cursor: pointer; white-space: nowrap; transition: all 0.2s; }
        .bet-type-tab.active { background: #00ff9d; color: black; }
        .bet-type-tab:hover { background: #00ff9d44; }
        
        .bet-section { background: #111827; border-radius: 20px; padding: 20px; margin-bottom: 20px; }
        .bet-options { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .bet-option { background: #1a2332; border: 2px solid transparent; border-radius: 12px; padding: 15px; text-align: center; cursor: pointer; transition: all 0.2s; }
        .bet-option:hover { background: #00ff9d22; border-color: #00ff9d; transform: scale(1.02); }
        .bet-option.selected { background: #00ff9d; border-color: #00ff9d; color: black; }
        .bet-option.disabled { opacity: 0.5; cursor: not-allowed; pointer-events: none; }
        .bet-option-name { font-size: 14px; margin-bottom: 5px; }
        .bet-option-odds { font-size: 22px; font-weight: bold; }
        
        .amount-input { width: 100%; padding: 15px; background: #0a0f1a; border: 2px solid #ffffff22; border-radius: 12px; color: white; font-size: 20px; margin-bottom: 15px; text-align: center; }
        .quick-amounts { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin-bottom: 20px; }
        .quick-amount { padding: 12px; background: #1a2332; border-radius: 10px; text-align: center; cursor: pointer; font-weight: bold; transition: all 0.2s; }
        .quick-amount:hover { background: #00ff9d; color: black; }
        
        .potential-box { background: linear-gradient(135deg, #00ff9d11, #ff980011); padding: 15px; border-radius: 12px; text-align: center; margin-bottom: 20px; }
        .potential-value { font-size: 32px; font-weight: bold; color: #00ff9d; }
        
        .place-btn { width: 100%; padding: 18px; background: #00ff9d; color: black; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; transition: all 0.2s; }
        .place-btn:hover { transform: scale(1.02); background: #00cc7d; }
        .place-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        
        .error-msg { background: #ff525222; border: 1px solid #ff5252; border-radius: 10px; padding: 12px; margin-bottom: 15px; color: #ff5252; display: none; }
        .success-msg { background: #4caf5022; border: 1px solid #4caf50; border-radius: 10px; padding: 12px; margin-bottom: 15px; color: #4caf50; display: none; }
        
        .countdown-timer { text-align: center; margin-top: 10px; font-size: 14px; color: #ff9800; }
        .info-note { font-size: 11px; color: #a0a8c9; text-align: center; margin-top: 15px; padding: 10px; border-radius: 8px; }
        .info-note.betting-open { background: #4caf5022; color: #4caf50; border: 1px solid #4caf50; }
        .info-note.betting-closed { background: #ff525222; color: #ff5252; border: 1px solid #ff5252; }
        .info-note.betting-warning { background: #ff980022; color: #ff9800; border: 1px solid #ff9800; }
        
        .loading-spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid #00ff9d; border-top-color: transparent; border-radius: 50%; animation: spin 0.6s linear infinite; margin-right: 10px; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        #loading { text-align: center; padding: 40px; display: flex; justify-content: center; align-items: center; gap: 10px; flex-direction: column; }
        .no-data { color: #ff9800; text-align: center; padding: 40px; }
        .live-match-timer { font-family: monospace; font-size: 18px; font-weight: bold; color: #ff5252; margin-top: 10px; text-align: center; }
        .betting-countdown { font-family: monospace; font-size: 14px; font-weight: bold; margin-top: 10px; text-align: center; }
        
        @media (max-width: 600px) {
            .team-logo-lg { width: 50px; height: 50px; }
            .team-name-lg { font-size: 14px; max-width: 100px; }
            .vs-large { font-size: 18px; margin: 0 10px; }
            .live-score { font-size: 24px; }
            .quick-amounts { grid-template-columns: repeat(3, 1fr); }
            .bet-options { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="live-matches.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        <h1 style="font-size:18px;"><i class="fas fa-futbol"></i> Match Details</h1>
        <button class="lang-toggle" onclick="toggleLanguage()">عربي</button>
    </div>
    
    <div class="container">
        <div class="balance-bar">
            <span><i class="fas fa-wallet"></i> Balance</span>
            <span style="color:#00ff9d;font-weight:bold;font-size:18px;" id="balance-display">$0.00</span>
        </div>
        
        <div id="loading">
            <div class="loading-spinner"></div>
            <div>Loading match details...</div>
            <div style="font-size: 12px; color: #a0a8c9; margin-top: 10px;">Fixture ID: <span id="fixture-id-display"></span></div>
        </div>
        
        <div id="content" style="display:none;">
            <div class="match-hero" id="match-hero"></div>
            <div class="match-detail-row" id="match-stats-container" style="margin-bottom: 15px;"></div>
            <div class="countdown-timer" id="countdown-timer"></div>
            <div class="live-match-timer" id="live-timer" style="display:none;"></div>
            <div class="betting-countdown" id="betting-countdown" style="display:none;"></div>
            
            <div class="bet-type-tabs" id="bet-tabs">
                <button class="bet-type-tab active" data-tab="1x2">1X2</button>
                <button class="bet-type-tab" data-tab="double">Double Chance</button>
                <button class="bet-type-tab" data-tab="overunder">Over/Under 2.5</button>
                <button class="bet-type-tab" data-tab="btts">BTTS</button>
            </div>
            
            <div class="bet-section">
                <div id="bet-options-container"></div>
                
                <input type="number" class="amount-input" id="bet-amount" placeholder="Enter amount" min="1" step="1" value="10">
                
                <div class="quick-amounts">
                    <div class="quick-amount" data-amount="5">$5</div>
                    <div class="quick-amount" data-amount="10">$10</div>
                    <div class="quick-amount" data-amount="25">$25</div>
                    <div class="quick-amount" data-amount="50">$50</div>
                    <div class="quick-amount" data-amount="100">$100</div>
                    <div class="quick-amount" data-amount="500">$500</div>
                </div>
                
                <div class="potential-box">
                    <div>Potential Win</div>
                    <div class="potential-value" id="potential-win">$0.00</div>
                </div>
                
                <div class="error-msg" id="error-message"></div>
                <div class="success-msg" id="success-message"></div>
                
                <button class="place-btn" id="place-bet-btn" disabled>Select Outcome</button>
                
                <div class="info-note" id="betting-info">
                    <i class="fas fa-info-circle"></i> Loading betting information...
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // MATCH DETAILS PAGE - HIGH QUALITY VERSION
        // Betting Rules:
        // - Upcoming matches: OPEN until match starts
        // - Live matches: OPEN until 80th minute
        // - Finished matches: CLOSED
        // ============================================
        
        // Supabase Configuration
        const SUPABASE_URL = 'https://jnazybaeajyynpyoszmy.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpuYXp5YmFlYWp5eW5weW9zem15Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyNzgwMDMsImV4cCI6MjA5Mjg1NDAwM30.P_8V-_s6DQDiYekZX1yaNup48WBRaLhb3ILAkvzTDTY';
        
        let supabaseClient = null;
        try {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            console.log('✅ Supabase initialized');
        } catch(e) {
            console.error('Failed to initialize Supabase:', e);
        }
        
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        
        const db = firebase.firestore();
        const auth = firebase.auth();
        
        // Constants
        const BETTING_CLOSE_MINUTE = 80; // Only for live matches
        
        // Get fixture ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const fixtureId = urlParams.get('id');
        document.getElementById('fixture-id-display').textContent = fixtureId || 'Not provided';
        
        const API_BASE = 'https://millioner.onrender.com';
        
        // ===== FIREBASE WALLET FUNCTIONS =====
        async function getWalletBalance(userId) {
            try {
                const doc = await db.collection('wallets').doc(userId).get();
                if (doc.exists) {
                    return doc.data().balance || 0;
                } else {
                    await db.collection('wallets').doc(userId).set({
                        balance: 1000,
                        created_at: new Date().toISOString(),
                        updated_at: new Date().toISOString()
                    });
                    return 1000;
                }
            } catch(e) {
                console.error('Error getting balance:', e);
                return 0;
            }
        }
        
        async function deductBalance(userId, amount, betId) {
            const walletRef = db.collection('wallets').doc(userId);
            try {
                const result = await db.runTransaction(async (transaction) => {
                    const doc = await transaction.get(walletRef);
                    const currentBalance = doc.exists ? doc.data().balance : 0;
                    const newBalance = currentBalance - amount;
                    
                    if (newBalance < 0) throw new Error('Insufficient balance');
                    
                    transaction.update(walletRef, {
                        balance: newBalance,
                        updated_at: new Date().toISOString()
                    });
                    
                    const txRef = db.collection('transactions').doc();
                    transaction.set(txRef, {
                        user_id: userId,
                        amount: -amount,
                        type: 'bet_place',
                        bet_id: betId,
                        balance_before: currentBalance,
                        balance_after: newBalance,
                        timestamp: new Date().toISOString()
                    });
                    
                    return newBalance;
                });
                return result;
            } catch(e) {
                console.error('Balance deduct error:', e);
                throw e;
            }
        }
        
        // ===== FETCH MATCH FROM API DIRECTLY =====
        async function fetchMatchFromAPI(fixtureId) {
            try {
                console.log(`Fetching match ${fixtureId} directly from API...`);
                const response = await fetch(`${API_BASE}/api/fixture/${fixtureId}`);
                const data = await response.json();
                
                if (data.success && data.fixture) {
                    const statusShort = data.fixture.status?.short;
                    const isLive = statusShort === '1H' || statusShort === '2H' || statusShort === 'HT';
                    const isFinished = statusShort === 'FT' || statusShort === 'AET' || statusShort === 'PEN';
                    
                    let status = 'upcoming';
                    if (isLive) status = 'live';
                    else if (isFinished) status = 'finished';
                    
                    return {
                        fixture_id: data.fixture.id,
                        status: status,
                        result: null,
                        odds: {
                            home: (1.80 + ((data.fixture.id % 20) / 100)).toFixed(2),
                            draw: (3.20 + ((data.fixture.id % 15) / 100)).toFixed(2),
                            away: (2.80 + ((data.fixture.id % 25) / 100)).toFixed(2)
                        },
                        league_id: data.league?.id || 0,
                        league_name: data.league?.name || 'Unknown League',
                        league_logo: data.league?.logo || '',
                        home_team: {
                            id: data.teams?.home?.id || 0,
                            name: data.teams?.home?.name || 'Home',
                            logo: data.teams?.home?.logo || ''
                        },
                        away_team: {
                            id: data.teams?.away?.id || 0,
                            name: data.teams?.away?.name || 'Away',
                            logo: data.teams?.away?.logo || ''
                        },
                        start_time: data.fixture.date,
                        score: { home: data.goals?.home || 0, away: data.goals?.away || 0 },
                        elapsed: data.fixture.status?.elapsed || 0,
                        bets_closed: false
                    };
                }
                return null;
            } catch(e) {
                console.error('API fetch error:', e);
                return null;
            }
        }
        
        async function getMatch(fixtureId) {
            // First try Supabase
            if (supabaseClient) {
                try {
                    const { data, error } = await supabaseClient
                        .from('sports_matches')
                        .select('*')
                        .eq('fixture_id', parseInt(fixtureId))
                        .maybeSingle();
                    
                    if (!error && data) {
                        console.log('Match found in Supabase:', data);
                        return data;
                    }
                } catch(e) {
                    console.log('Supabase query error, trying API...', e.message);
                }
            }
            
            // If not in Supabase, fetch from API
            const apiMatch = await fetchMatchFromAPI(fixtureId);
            if (apiMatch) {
                if (supabaseClient) {
                    try {
                        await supabaseClient
                            .from('sports_matches')
                            .upsert(apiMatch, { onConflict: 'fixture_id' });
                        console.log('Match saved to Supabase');
                    } catch(e) {
                        console.log('Could not save to Supabase:', e);
                    }
                }
                return apiMatch;
            }
            
            throw new Error('Match not found');
        }
        
        async function placeBet(betData) {
            const user = auth.currentUser;
            if (!user) throw new Error('Not authenticated');
            
            const match = await getMatch(betData.fixture_id);
            if (!match) throw new Error('Match not found');
            
            // BETTING RULES:
            // 1. Finished matches - NO betting
            if (match.status === 'finished') {
                throw new Error('❌ Match already finished - Cannot place bets');
            }
            
            // 2. Live matches - betting closes at 80th minute
            if (match.status === 'live') {
                const elapsed = match.elapsed || 0;
                if (elapsed >= BETTING_CLOSE_MINUTE) {
                    throw new Error(`❌ Betting closed - Match has reached ${elapsed}' minute (closes at ${BETTING_CLOSE_MINUTE}')`);
                }
                if (match.bets_closed) {
                    throw new Error('❌ Betting closed for this match');
                }
            }
            
            // 3. Upcoming matches - ALWAYS OPEN until match starts
            if (match.status === 'upcoming') {
                const now = new Date();
                const matchTime = new Date(match.start_time);
                if (now >= matchTime) {
                    throw new Error('❌ Match has already started - Please refresh the page');
                }
                // No other restrictions for upcoming matches!
            }
            
            // Check balance
            const balance = await getWalletBalance(user.uid);
            if (balance < betData.amount) throw new Error(`Insufficient balance! Your balance: $${balance.toFixed(2)}`);
            
            // Create bet record
            const bet = {
                id: `${Date.now()}_${Math.random().toString(36).substr(2, 9)}`,
                user_id: user.uid,
                fixture_id: betData.fixture_id,
                bet_type: betData.bet_type,
                bet_name: betData.bet_name,
                odds: betData.odds,
                amount: betData.amount,
                potential_win: betData.amount * betData.odds,
                status: 'active',
                placed_at: new Date().toISOString(),
                match_status_at_bet: match.status,
                match_score_at_bet: match.score || { home: 0, away: 0 },
                match_elapsed_at_bet: match.elapsed || 0
            };
            
            await deductBalance(user.uid, betData.amount, bet.id);
            
            if (supabaseClient) {
                const { error } = await supabaseClient.from('bets').insert(bet);
                if (error) throw error;
            }
            
            return bet;
        }
        
        // ===== PAGE VARIABLES =====
        let currentMatch = null;
        let selectedBet = null;
        let selectedOdds = null;
        let currentTab = '1x2';
        let refreshInterval = null;
        let liveTimerInterval = null;
        let bettingCountdownInterval = null;
        
        // Language toggle
        window.toggleLanguage = function() {
            const isArabic = document.body.classList.toggle('arabic');
            localStorage.setItem('lang', isArabic ? 'ar' : 'en');
            document.documentElement.dir = isArabic ? 'rtl' : 'ltr';
            document.querySelector('.lang-toggle').textContent = isArabic ? 'English' : 'عربي';
        };
        
        if (localStorage.getItem('lang') === 'ar') toggleLanguage();
        
        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.innerHTML = `<i class="fas fa-exclamation-triangle"></i> ${message}`;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }
        
        function showSuccess(message) {
            const successDiv = document.getElementById('success-message');
            successDiv.innerHTML = `<i class="fas fa-check-circle"></i> ${message}`;
            successDiv.style.display = 'block';
            setTimeout(() => {
                successDiv.style.display = 'none';
            }, 3000);
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        function formatMatchTime(date) {
            const d = new Date(date);
            return d.toLocaleDateString() + ' at ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }
        
        // Update betting countdown for live matches
        function startBettingCountdown() {
            if (bettingCountdownInterval) clearInterval(bettingCountdownInterval);
            
            if (currentMatch && currentMatch.status === 'live') {
                const bettingCountdownEl = document.getElementById('betting-countdown');
                bettingCountdownEl.style.display = 'block';
                
                function updateCountdown() {
                    const elapsed = currentMatch.elapsed || 0;
                    const remainingForBetting = Math.max(0, BETTING_CLOSE_MINUTE - elapsed);
                    
                    if (elapsed >= BETTING_CLOSE_MINUTE) {
                        bettingCountdownEl.innerHTML = `<i class="fas fa-ban"></i> Betting Closed - Match at ${elapsed}' (closes at ${BETTING_CLOSE_MINUTE}')`;
                        bettingCountdownEl.style.color = '#ff5252';
                        bettingCountdownEl.style.fontWeight = 'bold';
                    } else {
                        bettingCountdownEl.innerHTML = `<i class="fas fa-clock"></i> Betting Open for ${remainingForBetting} more minutes (closes at ${BETTING_CLOSE_MINUTE}')`;
                        bettingCountdownEl.style.color = remainingForBetting <= 5 ? '#ff9800' : '#00ff9d';
                        bettingCountdownEl.style.fontWeight = 'normal';
                    }
                }
                
                updateCountdown();
                bettingCountdownInterval = setInterval(updateCountdown, 1000);
            } else {
                const bettingCountdownEl = document.getElementById('betting-countdown');
                bettingCountdownEl.style.display = 'none';
            }
        }
        
        // Live timer update
        function startLiveTimer() {
            if (liveTimerInterval) clearInterval(liveTimerInterval);
            
            if (currentMatch && currentMatch.status === 'live') {
                const timerEl = document.getElementById('live-timer');
                timerEl.style.display = 'block';
                
                function updateTimer() {
                    const elapsed = currentMatch.elapsed || 0;
                    let period = '';
                    let displayElapsed = elapsed;
                    
                    if (elapsed < 45) {
                        period = '1st Half';
                        displayElapsed = elapsed;
                    } else if (elapsed < 60) {
                        period = 'Half Time';
                        displayElapsed = elapsed - 45;
                    } else if (elapsed < 90) {
                        period = '2nd Half';
                        displayElapsed = elapsed - 45;
                    } else {
                        period = 'Added Time';
                        displayElapsed = elapsed - 90;
                    }
                    
                    timerEl.innerHTML = `<i class="fas fa-clock"></i> ${period}: ${displayElapsed}'`;
                    
                    if (elapsed >= 80) {
                        timerEl.style.color = '#ff5252';
                    } else if (elapsed >= 75) {
                        timerEl.style.color = '#ff9800';
                    } else {
                        timerEl.style.color = '#00ff9d';
                    }
                }
                
                updateTimer();
                liveTimerInterval = setInterval(updateTimer, 1000);
            } else {
                const timerEl = document.getElementById('live-timer');
                timerEl.style.display = 'none';
            }
        }
        
        // Load match
        async function loadMatch() {
            if (!fixtureId) {
                showError('No match selected');
                document.getElementById('loading').innerHTML = '<div class="no-data">No match selected<br><a href="live-matches.html" style="color:#00ff9d;">Go to Live Matches</a></div>';
                return;
            }
            
            try {
                console.log(`Loading match ${fixtureId}...`);
                currentMatch = await getMatch(fixtureId);
                console.log('Match loaded:', currentMatch);
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';
                
                renderMatchDetails();
                renderBetOptions();
                checkBettingAvailability();
                startLiveTimer();
                startBettingCountdown();
                
                if (currentMatch.status === 'live') {
                    startAutoRefresh();
                } else if (currentMatch.status === 'upcoming') {
                    startCountdown();
                }
                
            } catch(e) {
                console.error('Error:', e);
                document.getElementById('loading').innerHTML = `
                    <div class="no-data">
                        <i class="fas fa-exclamation-triangle"></i><br>
                        Error: ${e.message}<br><br>
                        <button onclick="location.reload()" style="background:#00ff9d; color:black; border:none; padding:10px 20px; border-radius:8px; cursor:pointer;">Retry</button>
                        <br><br>
                        <a href="live-matches.html" style="color:#00ff9d;">← Back to Live Matches</a>
                    </div>
                `;
            }
        }
        
        function renderMatchDetails() {
            if (!currentMatch) return;
            
            const isLive = currentMatch.status === 'live';
            const isUpcoming = currentMatch.status === 'upcoming';
            const isFinished = currentMatch.status === 'finished';
            let homeTeam = currentMatch.home_team;
            let awayTeam = currentMatch.away_team;
            
            if (typeof homeTeam === 'string') homeTeam = JSON.parse(homeTeam);
            if (typeof awayTeam === 'string') awayTeam = JSON.parse(awayTeam);
            
            homeTeam = homeTeam || { name: 'Home', logo: '' };
            awayTeam = awayTeam || { name: 'Away', logo: '' };
            
            const matchDate = new Date(currentMatch.start_time);
            const score = currentMatch.score || { home: 0, away: 0 };
            
            let statusHtml = '';
            if (isLive) {
                statusHtml = `<div class="live-status"><i class="fas fa-circle"></i> LIVE - ${currentMatch.elapsed || 0}'</div>`;
            } else if (isUpcoming) {
                statusHtml = `<div class="upcoming-status"><i class="fas fa-clock"></i> UPCOMING - Betting OPEN</div>`;
            } else if (isFinished) {
                statusHtml = `<div class="finished-status"><i class="fas fa-check-circle"></i> FINISHED</div>`;
            }
            
            const statsHtml = `
                <div class="match-detail-row">
                    <span class="match-detail-label"><i class="fas fa-trophy"></i> League:</span>
                    <span class="match-detail-value">${escapeHtml(currentMatch.league_name)}</span>
                </div>
                <div class="match-detail-row">
                    <span class="match-detail-label"><i class="far fa-calendar-alt"></i> Date & Time:</span>
                    <span class="match-detail-value">${formatMatchTime(currentMatch.start_time)}</span>
                </div>
                ${isLive ? `
                <div class="match-detail-row">
                    <span class="match-detail-label"><i class="fas fa-hourglass-half"></i> Elapsed:</span>
                    <span class="match-detail-value">${currentMatch.elapsed || 0}'</span>
                </div>
                ` : ''}
                <div class="match-detail-row">
                    <span class="match-detail-label"><i class="fas fa-info-circle"></i> Betting Status:</span>
                    <span class="match-detail-value" style="color: ${isLive && (currentMatch.elapsed || 0) >= 80 ? '#ff5252' : '#00ff9d'}">
                        ${isLive ? ((currentMatch.elapsed || 0) >= 80 ? '🔴 CLOSED' : '🟢 OPEN until 80th minute') : (isUpcoming ? '🟢 OPEN until match starts' : '⚫ CLOSED')}
                    </span>
                </div>
            `;
            
            document.getElementById('match-stats-container').innerHTML = statsHtml;
            
            document.getElementById('match-hero').innerHTML = `
                <div class="teams-large">
                    <div>
                        <img class="team-logo-lg" src="${homeTeam.logo || 'https://via.placeholder.com/80'}" 
                             onerror="this.src='https://via.placeholder.com/80?text=' + encodeURIComponent((homeTeam.name || 'Home').substring(0,2))">
                        <div class="team-name-lg">${escapeHtml(homeTeam.name)}</div>
                    </div>
                    <div class="vs-large">
                        ${isLive ? `<span class="live-score">${score.home || 0} - ${score.away || 0}</span>` : 'VS'}
                    </div>
                    <div>
                        <img class="team-logo-lg" src="${awayTeam.logo || 'https://via.placeholder.com/80'}" 
                             onerror="this.src='https://via.placeholder.com/80?text=' + encodeURIComponent((awayTeam.name || 'Away').substring(0,2))">
                        <div class="team-name-lg">${escapeHtml(awayTeam.name)}</div>
                    </div>
                </div>
                ${statusHtml}
            `;
        }
        
        function renderBetOptions() {
            if (!currentMatch) return;
            
            let odds = currentMatch.odds;
            if (typeof odds === 'string') odds = JSON.parse(odds);
            odds = odds || { home: 2.50, draw: 3.20, away: 2.80 };
            
            let html = '<div class="bet-options">';
            
            switch(currentTab) {
                case '1x2':
                    html += `
                        <div class="bet-option" data-type="home" data-odds="${odds.home}" data-name="Home Win">
                            <div class="bet-option-name">🏆 Home Win</div>
                            <div class="bet-option-odds">${odds.home}</div>
                        </div>
                        <div class="bet-option" data-type="draw" data-odds="${odds.draw}" data-name="Draw">
                            <div class="bet-option-name">🤝 Draw</div>
                            <div class="bet-option-odds">${odds.draw}</div>
                        </div>
                        <div class="bet-option" data-type="away" data-odds="${odds.away}" data-name="Away Win">
                            <div class="bet-option-name">🏆 Away Win</div>
                            <div class="bet-option-odds">${odds.away}</div>
                        </div>
                    `;
                    break;
                case 'double':
                    const homeDraw = 1 / ((1/odds.home) + (1/odds.draw));
                    const homeAway = 1 / ((1/odds.home) + (1/odds.away));
                    const drawAway = 1 / ((1/odds.draw) + (1/odds.away));
                    html += `
                        <div class="bet-option" data-type="1X" data-odds="${homeDraw.toFixed(2)}" data-name="Home or Draw">
                            <div class="bet-option-name">🏠 1X (Home or Draw)</div>
                            <div class="bet-option-odds">${homeDraw.toFixed(2)}</div>
                        </div>
                        <div class="bet-option" data-type="12" data-odds="${homeAway.toFixed(2)}" data-name="Home or Away">
                            <div class="bet-option-name">⚡ 12 (Home or Away)</div>
                            <div class="bet-option-odds">${homeAway.toFixed(2)}</div>
                        </div>
                        <div class="bet-option" data-type="X2" data-odds="${drawAway.toFixed(2)}" data-name="Draw or Away">
                            <div class="bet-option-name">🚀 X2 (Draw or Away)</div>
                            <div class="bet-option-odds">${drawAway.toFixed(2)}</div>
                        </div>
                    `;
                    break;
                case 'overunder':
                    html += `
                        <div class="bet-option" data-type="over25" data-odds="1.85" data-name="Over 2.5 Goals">
                            <div class="bet-option-name">⚽ Over 2.5 Goals</div>
                            <div class="bet-option-odds">1.85</div>
                        </div>
                        <div class="bet-option" data-type="under25" data-odds="1.95" data-name="Under 2.5 Goals">
                            <div class="bet-option-name">🥅 Under 2.5 Goals</div>
                            <div class="bet-option-odds">1.95</div>
                        </div>
                    `;
                    break;
                case 'btts':
                    html += `
                        <div class="bet-option" data-type="btts_yes" data-odds="1.90" data-name="Both Teams to Score">
                            <div class="bet-option-name">✅ BTTS - YES</div>
                            <div class="bet-option-odds">1.90</div>
                        </div>
                        <div class="bet-option" data-type="btts_no" data-odds="1.90" data-name="Both Teams to Score - NO">
                            <div class="bet-option-name">❌ BTTS - NO</div>
                            <div class="bet-option-odds">1.90</div>
                        </div>
                    `;
                    break;
            }
            
            html += '</div>';
            document.getElementById('bet-options-container').innerHTML = html;
            
            const isBettingDisabled = checkIfBettingDisabled();
            
            document.querySelectorAll('.bet-option').forEach(opt => {
                if (isBettingDisabled) {
                    opt.classList.add('disabled');
                }
                opt.addEventListener('click', function() {
                    if (isBettingDisabled) {
                        showError('Betting is currently closed for this match');
                        return;
                    }
                    document.querySelectorAll('.bet-option').forEach(o => o.classList.remove('selected'));
                    this.classList.add('selected');
                    selectedBet = {
                        type: this.dataset.type,
                        name: this.dataset.name,
                        odds: parseFloat(this.dataset.odds)
                    };
                    selectedOdds = selectedBet.odds;
                    const amount = parseFloat(document.getElementById('bet-amount').value) || 0;
                    document.getElementById('potential-win').textContent = `$${(amount * selectedOdds).toFixed(2)}`;
                    document.getElementById('place-bet-btn').disabled = false;
                });
            });
        }
        
        function checkIfBettingDisabled() {
            if (!currentMatch) return true;
            
            if (currentMatch.status === 'finished') return true;
            
            if (currentMatch.status === 'live') {
                const elapsed = currentMatch.elapsed || 0;
                if (elapsed >= BETTING_CLOSE_MINUTE) return true;
                if (currentMatch.bets_closed) return true;
            }
            
            return false;
        }
        
        function checkBettingAvailability() {
            if (!currentMatch) return;
            
            const isLive = currentMatch.status === 'live';
            const isUpcoming = currentMatch.status === 'upcoming';
            const isFinished = currentMatch.status === 'finished';
            const elapsed = currentMatch.elapsed || 0;
            
            let message = '';
            let messageClass = '';
            let bettingEnabled = true;
            
            if (isFinished) {
                message = '❌ Match finished - Betting closed';
                messageClass = 'betting-closed';
                bettingEnabled = false;
            } else if (isLive) {
                if (elapsed >= BETTING_CLOSE_MINUTE) {
                    message = `🔒 Betting closed - Match at ${elapsed}' minute (closes at ${BETTING_CLOSE_MINUTE}')`;
                    messageClass = 'betting-closed';
                    bettingEnabled = false;
                } else {
                    const remaining = BETTING_CLOSE_MINUTE - elapsed;
                    message = `🟢 LIVE - Betting OPEN! ${remaining} minutes remaining to bet (closes at ${BETTING_CLOSE_MINUTE}')`;
                    messageClass = 'betting-open';
                    bettingEnabled = true;
                }
            } else if (isUpcoming) {
                const now = new Date();
                const matchTime = new Date(currentMatch.start_time);
                const minutesUntilMatch = (matchTime - now) / 60000;
                
                message = `📅 UPCOMING - Betting OPEN! Place your bets now (${minutesUntilMatch > 0 ? Math.floor(minutesUntilMatch) + ' minutes until kickoff' : 'match starting soon'})`;
                messageClass = 'betting-open';
                bettingEnabled = true;
            }
            
            const infoDiv = document.getElementById('betting-info');
            infoDiv.innerHTML = `<i class="fas fa-info-circle"></i> ${message}`;
            infoDiv.className = `info-note ${messageClass}`;
            
            if (!bettingEnabled) {
                document.getElementById('place-bet-btn').disabled = true;
                document.querySelectorAll('.bet-option').forEach(opt => opt.classList.add('disabled'));
            }
        }
        
        function startAutoRefresh() {
            if (refreshInterval) clearInterval(refreshInterval);
            refreshInterval = setInterval(async () => {
                if (currentMatch && currentMatch.status === 'live') {
                    try {
                        const freshMatch = await getMatch(fixtureId);
                        if (freshMatch) {
                            const oldScore = currentMatch.score;
                            const oldElapsed = currentMatch.elapsed;
                            currentMatch = freshMatch;
                            renderMatchDetails();
                            checkBettingAvailability();
                            if (currentMatch.odds) {
                                renderBetOptions();
                            }
                            // Show goal animation if score changed
                            if (oldScore && JSON.stringify(oldScore) !== JSON.stringify(currentMatch.score)) {
                                const scoreEl = document.querySelector('.live-score');
                                if (scoreEl) {
                                    scoreEl.classList.add('goal-animation');
                                    setTimeout(() => scoreEl.classList.remove('goal-animation'), 500);
                                }
                            }
                            // Update betting status if elapsed changed significantly
                            if (oldElapsed !== currentMatch.elapsed) {
                                startLiveTimer();
                                startBettingCountdown();
                            }
                        }
                        await updateBalanceDisplay();
                    } catch(e) { console.error('Refresh error:', e); }
                }
            }, 10000);
        }
        
        function startCountdown() {
            const countdownEl = document.getElementById('countdown-timer');
            if (!countdownEl) return;
            
            const matchTime = new Date(currentMatch.start_time);
            
            function update() {
                const now = new Date();
                const diff = matchTime - now;
                
                if (diff <= 0) {
                    countdownEl.innerHTML = '<span style="color:#00ff9d;"><i class="fas fa-play"></i> Match Started! Refresh to see live action</span>';
                    setTimeout(() => location.reload(), 5000);
                } else {
                    const minutes = Math.floor(diff / 60000);
                    const seconds = Math.floor((diff % 60000) / 1000);
                    const hours = Math.floor(minutes / 60);
                    const remainingMinutes = minutes % 60;
                    
                    if (hours > 0) {
                        countdownEl.innerHTML = `<i class="fas fa-hourglass-half"></i> Match starts in: ${hours}h ${remainingMinutes}m ${seconds}s`;
                    } else {
                        countdownEl.innerHTML = `<i class="fas fa-hourglass-half"></i> Match starts in: ${minutes}m ${seconds}s`;
                    }
                    
                    if (minutes < 5 && minutes > 0) {
                        countdownEl.style.color = '#ff9800';
                        countdownEl.style.fontWeight = 'bold';
                    } else {
                        countdownEl.style.color = '#a0a8c9';
                        countdownEl.style.fontWeight = 'normal';
                    }
                }
            }
            update();
            const countdownInterval = setInterval(update, 1000);
        }
        
        async function updateBalanceDisplay() {
            const user = auth.currentUser;
            if (user) {
                const balance = await getWalletBalance(user.uid);
                document.getElementById('balance-display').textContent = `$${balance.toFixed(2)}`;
            }
        }
        
        async function placeBetHandler() {
            if (!selectedBet) { showError('Select an outcome'); return; }
            
            const amount = parseFloat(document.getElementById('bet-amount').value);
            if (isNaN(amount) || amount < 1) { showError('Minimum bet is $1'); return; }
            if (amount > 1000) { showError('Maximum bet is $1000 per transaction'); return; }
            
            const user = auth.currentUser;
            if (!user) { 
                showError('Please login to place bets');
                setTimeout(() => { window.location.href = '../login.html'; }, 2000);
                return; 
            }
            
            const balance = await getWalletBalance(user.uid);
            if (amount > balance) { showError(`Insufficient balance! Your balance: $${balance.toFixed(2)}`); return; }
            
            const btn = document.getElementById('place-bet-btn');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<div class="loading-spinner"></div> Processing...';
            
            try {
                const bet = await placeBet({
                    fixture_id: parseInt(fixtureId),
                    bet_type: selectedBet.type,
                    bet_name: selectedBet.name,
                    odds: selectedOdds,
                    amount: amount
                });
                
                await updateBalanceDisplay();
                showSuccess(`✅ Bet placed successfully! Potential win: $${(amount * selectedOdds).toFixed(2)}`);
                
                selectedBet = null;
                selectedOdds = null;
                document.getElementById('bet-amount').value = '10';
                document.getElementById('potential-win').textContent = '$0.00';
                document.querySelectorAll('.bet-option').forEach(o => o.classList.remove('selected'));
                btn.disabled = true;
                btn.innerHTML = 'Place Bet';
                
                setTimeout(() => {
                    if (confirm('Bet placed successfully! View your active bets?')) {
                        window.location.href = 'my-bets.html';
                    }
                }, 1000);
                
            } catch(e) {
                console.error('Bet error:', e);
                showError(e.message);
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        }
        
        function setupEventListeners() {
            document.querySelectorAll('.bet-type-tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    document.querySelectorAll('.bet-type-tab').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    currentTab = this.dataset.tab;
                    renderBetOptions();
                });
            });
            
            document.querySelectorAll('.quick-amount').forEach(btn => {
                btn.addEventListener('click', () => {
                    const amount = btn.dataset.amount;
                    document.getElementById('bet-amount').value = amount;
                    if (selectedOdds) {
                        document.getElementById('potential-win').textContent = `$${(parseFloat(amount) * selectedOdds).toFixed(2)}`;
                    }
                });
            });
            
            document.getElementById('bet-amount').addEventListener('input', (e) => {
                if (selectedOdds) {
                    const amount = parseFloat(e.target.value) || 0;
                    document.getElementById('potential-win').textContent = `$${(amount * selectedOdds).toFixed(2)}`;
                }
            });
            
            document.getElementById('place-bet-btn').addEventListener('click', placeBetHandler);
        }
        
        // Initialize
        auth.onAuthStateChanged(async (user) => {
            if (!user) { 
                window.location.href = '../login.html'; 
                return; 
            }
            await updateBalanceDisplay();
            await loadMatch();
            setupEventListeners();
            setInterval(updateBalanceDisplay, 30000);
        });
        
        window.addEventListener('beforeunload', () => {
            if (refreshInterval) clearInterval(refreshInterval);
            if (liveTimerInterval) clearInterval(liveTimerInterval);
            if (bettingCountdownInterval) clearInterval(bettingCountdownInterval);
        });
    </script>
</body>
</html>
