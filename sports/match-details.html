<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place Bet - X Lodon</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="../css/sports-betting.css">
    <style>
        body { background: #0a0f1a; color: white; font-family: 'Segoe UI', sans-serif; margin: 0; min-height: 100vh; }
        .container { max-width: 800px; margin: 0 auto; padding: 15px; }
        .back-btn { color: #00ff9d; text-decoration: none; font-size: 20px; margin-right: 15px; }
        .match-hero { background: linear-gradient(135deg, #111827, #1a2332); border-radius: 20px; padding: 30px 20px; margin: 20px 0; border: 1px solid #00ff9d33; text-align: center; }
        .teams-large { display: flex; align-items: center; justify-content: center; gap: 20px; }
        .team-large { flex: 1; }
        .team-large-name { font-size: 20px; font-weight: bold; }
        .vs-large { font-size: 24px; color: #ff9800; font-weight: bold; }
        .betting-section { background: #111827; border-radius: 20px; padding: 20px; border: 2px solid #00ff9d; }
        .balance-display { display: flex; justify-content: space-between; padding: 15px; background: #00000033; border-radius: 10px; margin-bottom: 20px; }
        .bet-options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .bet-option { background: #1a2332; border: 2px solid transparent; border-radius: 12px; padding: 15px; text-align: center; cursor: pointer; }
        .bet-option.selected { background: #00ff9d; border-color: #00ff9d; color: black; }
        .bet-option-odds { font-size: 24px; font-weight: bold; color: #00ff9d; }
        .bet-option.selected .bet-option-odds { color: black; }
        .amount-input { width: 100%; padding: 15px; background: #00000055; border: 1px solid #ffffff22; border-radius: 10px; color: white; font-size: 20px; margin-bottom: 15px; }
        .quick-amounts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 15px; }
        .quick-amount { padding: 10px; background: #1a2332; border-radius: 8px; text-align: center; cursor: pointer; }
        .potential-box { background: linear-gradient(135deg, #00ff9d11, #ff980011); padding: 15px; border-radius: 10px; text-align: center; margin-bottom: 20px; }
        .potential-value { font-size: 32px; font-weight: bold; color: #00ff9d; }
        .place-btn { width: 100%; padding: 18px; background: #00ff9d; color: black; border: none; border-radius: 10px; font-size: 20px; font-weight: bold; cursor: pointer; }
        .place-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .error-msg { background: #ff525222; border: 1px solid #ff5252; border-radius: 10px; padding: 15px; margin-bottom: 15px; color: #ff5252; display: none; }
        .success-msg { background: #4caf5022; border: 1px solid #4caf50; border-radius: 10px; padding: 15px; margin-bottom: 15px; color: #4caf50; display: none; }
        .countdown { font-size: 28px; font-weight: bold; color: #ff5252; text-align: center; margin: 15px 0; }
        .closed-section { text-align: center; padding: 40px; background: #ff525222; border: 2px solid #ff5252; border-radius: 15px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div style="display: flex; align-items: center; padding: 15px 0;">
            <a href="upcoming-matches.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
            <h2 id="page-title" style="margin: 0;">Loading...</h2>
        </div>
        
        <div class="match-hero" id="match-hero">
            <div id="match-loading">Loading match details...</div>
        </div>
        
        <div id="countdown-section" style="display: none;">
            <div class="countdown" id="countdown-timer">--:--:--</div>
        </div>
        
        <div class="betting-section" id="betting-section">
            <div class="balance-display">
                <span><i class="fas fa-wallet"></i> Your Balance</span>
                <span style="font-size: 22px; color: #00ff9d;" id="user-balance">$0.00</span>
            </div>
            
            <div class="bet-options">
                <div class="bet-option" data-type="home">
                    <div>Home Win</div>
                    <div class="bet-option-odds" id="odds-home">2.00</div>
                </div>
                <div class="bet-option" data-type="draw">
                    <div>Draw</div>
                    <div class="bet-option-odds" id="odds-draw">3.50</div>
                </div>
                <div class="bet-option" data-type="away">
                    <div>Away Win</div>
                    <div class="bet-option-odds" id="odds-away">3.80</div>
                </div>
            </div>
            
            <input type="number" class="amount-input" id="bet-amount" value="10" min="1" max="1000" step="1">
            
            <div class="quick-amounts">
                <div class="quick-amount" data-amount="5">$5</div>
                <div class="quick-amount" data-amount="10">$10</div>
                <div class="quick-amount" data-amount="25">$25</div>
                <div class="quick-amount" data-amount="50">$50</div>
            </div>
            
            <div class="potential-box">
                <div>Potential Win</div>
                <div class="potential-value" id="potential-win">$0.00</div>
            </div>
            
            <div class="error-msg" id="error-message"></div>
            <div class="success-msg" id="success-message"></div>
            
            <button class="place-btn" id="place-bet-btn" disabled>Select a bet type</button>
        </div>
        
        <div class="closed-section" id="betting-closed">
            <i class="fas fa-times-circle" style="font-size: 48px; color: #ff5252;"></i>
            <h3>Betting Closed</h3>
            <p id="closed-reason"></p>
        </div>
    </div>
    
    <script src="../js/betting-engine.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), db = firebase.firestore();
        
        const params = new URLSearchParams(location.search);
        const fixtureId = params.get('id');
        if (!fixtureId) location.href = 'upcoming-matches.html';
        
        let currentUser = null, currentMatch = null, selectedType = null, balance = 0, countdownInterval = null;
        
        auth.onAuthStateChanged(async u => {
            if (!u) { location.href = '../login.html'; return; }
            currentUser = u;
            await loadBalance();
            loadMatch();
        });
        
        async function loadBalance() {
            const doc = await db.collection('wallets').doc(currentUser.uid).get();
            balance = doc.exists ? (doc.data().balance || 0) : 0;
            document.getElementById('user-balance').textContent = `$${balance.toFixed(2)}`;
        }
        
        function loadMatch() {
            db.collection('sports_matches').doc(fixtureId).onSnapshot(doc => {
                if (!doc.exists) { location.href = 'upcoming-matches.html'; return; }
                currentMatch = doc.data();
                displayMatch();
                checkStatus();
            });
        }
        
        function displayMatch() {
            const m = currentMatch;
            document.getElementById('page-title').textContent = `${m.homeTeam.name} vs ${m.awayTeam.name}`;
            document.getElementById('match-hero').innerHTML = `
                <div class="teams-large">
                    <div class="team-large"><div class="team-large-name">${m.homeTeam.name}</div></div>
                    <div class="vs-large">VS</div>
                    <div class="team-large"><div class="team-large-name">${m.awayTeam.name}</div></div>
                </div>
                <div style="margin-top: 15px; color: #a0a8c9;">${m.leagueName || ''}</div>
            `;
            document.getElementById('odds-home').textContent = m.odds?.home?.toFixed(2) || '2.00';
            document.getElementById('odds-draw').textContent = m.odds?.draw?.toFixed(2) || '3.50';
            document.getElementById('odds-away').textContent = m.odds?.away?.toFixed(2) || '3.80';
        }
        
        function checkStatus() {
            const section = document.getElementById('betting-section');
            const closed = document.getElementById('betting-closed');
            const countdownSec = document.getElementById('countdown-section');
            
            if (currentMatch.status !== 'upcoming') {
                section.style.display = 'none';
                closed.style.display = 'block';
                document.getElementById('closed-reason').textContent = currentMatch.status === 'live' ? 'Match in progress' : 'Match finished';
                return;
            }
            
            const kickoff = currentMatch.startTime.toDate();
            const diff = kickoff - new Date();
            
            if (diff < 120000) {
                section.style.display = 'none';
                closed.style.display = 'block';
                document.getElementById('closed-reason').textContent = 'Too close to kickoff';
                return;
            }
            
            section.style.display = 'block';
            closed.style.display = 'none';
            countdownSec.style.display = 'block';
            startCountdown(kickoff);
        }
        
        function startCountdown(kickoff) {
            if (countdownInterval) clearInterval(countdownInterval);
            const timer = document.getElementById('countdown-timer');
            
            countdownInterval = setInterval(() => {
                const diff = kickoff - new Date();
                if (diff <= 0) { clearInterval(countdownInterval); checkStatus(); return; }
                
                const h = Math.floor(diff / 3600000);
                const m = Math.floor((diff % 3600000) / 60000);
                const s = Math.floor((diff % 60000) / 1000);
                timer.textContent = `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
            }, 1000);
        }
        
        // Event listeners
        document.querySelectorAll('.bet-option').forEach(o => {
            o.addEventListener('click', () => {
                document.querySelectorAll('.bet-option').forEach(x => x.classList.remove('selected'));
                o.classList.add('selected');
                selectedType = o.dataset.type;
                document.getElementById('place-bet-btn').disabled = false;
                document.getElementById('place-bet-btn').textContent = 'Place Bet';
                updatePotential();
            });
        });
        
        document.querySelectorAll('.quick-amount').forEach(b => {
            b.addEventListener('click', () => {
                document.getElementById('bet-amount').value = b.dataset.amount;
                updatePotential();
            });
        });
        
        document.getElementById('bet-amount').addEventListener('input', updatePotential);
        
        function updatePotential() {
            if (!selectedType || !currentMatch) return;
            const amount = parseFloat(document.getElementById('bet-amount').value) || 0;
            const odds = currentMatch.odds?.[selectedType] || 2.00;
            document.getElementById('potential-win').textContent = `$${(amount * odds).toFixed(2)}`;
        }
        
        document.getElementById('place-bet-btn').addEventListener('click', async () => {
            const amount = parseFloat(document.getElementById('bet-amount').value);
            const btn = document.getElementById('place-bet-btn');
            const err = document.getElementById('error-message');
            const suc = document.getElementById('success-message');
            
            if (!selectedType) {
                err.style.display = 'block';
                err.innerHTML = '<i class="fas fa-exclamation-circle"></i> Select a bet type';
                return;
            }
            
            if (amount > balance) {
                err.style.display = 'block';
                err.innerHTML = '<i class="fas fa-exclamation-circle"></i> Insufficient balance';
                return;
            }
            
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
            err.style.display = 'none';
            suc.style.display = 'none';
            
            try {
                const result = await placeBet(parseInt(fixtureId), selectedType, amount);
                
                if (result.success) {
                    suc.style.display = 'block';
                    suc.innerHTML = `<i class="fas fa-check-circle"></i> ${result.message}`;
                    await loadBalance();
                    setTimeout(() => location.href = 'my-bets.html', 2000);
                } else {
                    throw new Error(result.error);
                }
            } catch (e) {
                err.style.display = 'block';
                err.innerHTML = `<i class="fas fa-exclamation-circle"></i> ${e.message}`;
                btn.disabled = false;
                btn.innerHTML = 'Place Bet';
            }
        });
        
        window.addEventListener('beforeunload', () => { if (countdownInterval) clearInterval(countdownInterval); });
    </script>
</body>
</html>
