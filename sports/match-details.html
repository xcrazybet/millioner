<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Place Bet - X Lodon | رهان</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="../css/sports-betting.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0f1a; color: white; font-family: 'Segoe UI', 'Tajawal', sans-serif; min-height: 100vh; }
        .header { background: #111827; padding: 15px; border-bottom: 2px solid #00ff9d; display: flex; align-items: center; gap: 15px; }
        .back-btn { color: #00ff9d; text-decoration: none; font-size: 20px; }
        .lang-toggle { background: #1a2332; border: 1px solid #00ff9d; color: #00ff9d; padding: 5px 12px; border-radius: 20px; font-size: 14px; cursor: pointer; margin-left: auto; }
        .container { max-width: 800px; margin: 0 auto; padding: 15px; }
        
        .match-hero { background: linear-gradient(135deg, #111827, #1a2332); border-radius: 20px; padding: 25px 15px; margin-bottom: 20px; text-align: center; border: 1px solid #00ff9d33; }
        .teams-large { display: flex; align-items: center; justify-content: center; gap: 15px; }
        .team-large { flex: 1; }
        .team-name-large { font-size: 18px; font-weight: bold; }
        .vs-large { font-size: 20px; color: #ff9800; font-weight: bold; }
        .league-info { color: #a0a8c9; font-size: 13px; margin-top: 10px; }
        
        .bet-type-selector { display: flex; gap: 10px; margin-bottom: 20px; }
        .bet-type-btn { flex: 1; padding: 12px; background: #1a2332; border: 2px solid transparent; border-radius: 12px; text-align: center; cursor: pointer; font-weight: 600; }
        .bet-type-btn.active { background: #00ff9d; color: black; }
        
        .bet-section { background: #111827; border-radius: 20px; padding: 20px; margin-bottom: 20px; }
        .section-title { color: #00ff9d; font-size: 16px; margin-bottom: 15px; }
        .balance-row { display: flex; justify-content: space-between; padding: 12px; background: #0a0f1a; border-radius: 10px; margin-bottom: 20px; }
        
        .bet-options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .bet-option { background: #1a2332; border: 2px solid transparent; border-radius: 12px; padding: 15px 5px; text-align: center; cursor: pointer; }
        .bet-option.selected { background: #00ff9d; border-color: #00ff9d; color: black; }
        .bet-option-odds { font-size: 22px; font-weight: bold; color: #00ff9d; }
        .bet-option.selected .bet-option-odds { color: black; }
        
        .amount-input { width: 100%; padding: 15px; background: #0a0f1a; border: 2px solid #ffffff22; border-radius: 12px; color: white; font-size: 20px; margin-bottom: 15px; }
        .quick-amounts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 20px; }
        .quick-amount { padding: 12px; background: #1a2332; border-radius: 8px; text-align: center; cursor: pointer; }
        
        .potential-box { background: linear-gradient(135deg, #00ff9d11, #ff980011); padding: 15px; border-radius: 12px; text-align: center; margin-bottom: 20px; }
        .potential-value { font-size: 32px; font-weight: bold; color: #00ff9d; }
        
        .place-btn { width: 100%; padding: 18px; background: #00ff9d; color: black; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .place-btn:disabled { opacity: 0.5; cursor: not-allowed; background: #a0a8c9; }
        
        .error-msg { background: #ff525222; border: 1px solid #ff5252; border-radius: 10px; padding: 15px; margin-bottom: 15px; color: #ff5252; display: none; }
        .success-msg { background: #4caf5022; border: 1px solid #4caf50; border-radius: 10px; padding: 15px; margin-bottom: 15px; color: #4caf50; display: none; }
        
        .acc-section { display: none; }
        .acc-selections { margin-bottom: 15px; max-height: 300px; overflow-y: auto; }
        .acc-item { background: #1a2332; padding: 12px; border-radius: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .acc-remove { color: #ff5252; cursor: pointer; padding: 5px; }
        .add-current-btn { width: 100%; padding: 15px; background: transparent; border: 2px dashed #00ff9d; border-radius: 10px; color: #00ff9d; cursor: pointer; margin-bottom: 15px; }
        .browse-matches-btn { width: 100%; padding: 15px; background: transparent; border: 2px dashed #ff9800; border-radius: 10px; color: #ff9800; cursor: pointer; margin-bottom: 15px; }
        .total-odds-box { background: #0a0f1a; padding: 15px; border-radius: 10px; margin-bottom: 15px; text-align: center; }
        .total-odds-value { font-size: 24px; color: #ff9800; font-weight: bold; }
        
        .closed-section { text-align: center; padding: 40px; background: #ff525222; border: 2px solid #ff5252; border-radius: 15px; display: none; }
        .arabic { font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body>
    <div class="header">
        <a href="upcoming-matches.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        <h1 style="font-size:18px;"><i class="fas fa-futbol"></i> <span class="en">Place Bet</span><span class="ar" style="display:none;">ضع رهانك</span></h1>
        <button class="lang-toggle" onclick="toggleLanguage()"><span class="en">🇸🇦 عربي</span><span class="ar" style="display:none;">🇬🇧 English</span></button>
    </div>
    
    <div class="container">
        <div id="loading-state" style="text-align:center; padding:40px;"><i class="fas fa-spinner fa-spin"></i> Loading...</div>
        <div id="error-state" style="display:none; text-align:center; padding:40px; color:#ff5252;"><p id="error-text"></p></div>
        
        <div id="match-content" style="display:none;">
            <div class="match-hero" id="match-hero"></div>
            
            <div id="closed-section" class="closed-section">
                <i class="fas fa-times-circle" style="font-size:48px; color:#ff5252;"></i>
                <h3>Betting Closed</h3>
                <p id="closed-reason"></p>
                <a href="upcoming-matches.html" style="color:#00ff9d; margin-top:20px; display:inline-block;">Browse Other Matches</a>
            </div>
            
            <div id="betting-section">
                <div class="bet-type-selector">
                    <div class="bet-type-btn active" data-type="single"><i class="fas fa-ticket-alt"></i> Single Bet</div>
                    <div class="bet-type-btn" data-type="accumulator"><i class="fas fa-layer-group"></i> Accumulator</div>
                </div>
                
                <!-- SINGLE BET SECTION -->
                <div id="single-section" class="bet-section">
                    <div class="section-title"><i class="fas fa-ticket-alt"></i> Single Bet</div>
                    <div class="balance-row"><span><i class="fas fa-wallet"></i> Balance</span><span style="color:#00ff9d; font-weight:bold;" id="user-balance">$0.00</span></div>
                    
                    <div class="bet-options">
                        <div class="bet-option" data-type="home"><div>Home Win</div><div class="bet-option-odds" id="odds-home">2.00</div></div>
                        <div class="bet-option" data-type="draw"><div>Draw</div><div class="bet-option-odds" id="odds-draw">3.50</div></div>
                        <div class="bet-option" data-type="away"><div>Away Win</div><div class="bet-option-odds" id="odds-away">3.80</div></div>
                    </div>
                    
                    <input type="number" class="amount-input" id="bet-amount" value="10" min="1">
                    <div class="quick-amounts"><div class="quick-amount" data-amount="5">$5</div><div class="quick-amount" data-amount="10">$10</div><div class="quick-amount" data-amount="25">$25</div><div class="quick-amount" data-amount="50">$50</div></div>
                    
                    <div class="potential-box"><div>Potential Win</div><div class="potential-value" id="potential-win">$0.00</div></div>
                    
                    <div class="error-msg" id="error-message"></div>
                    <div class="success-msg" id="success-message"></div>
                    
                    <button class="place-btn" id="place-single-btn" disabled>Select Outcome</button>
                </div>
                
                <!-- ACCUMULATOR SECTION -->
                <div id="accumulator-section" class="bet-section acc-section">
                    <div class="section-title"><i class="fas fa-layer-group"></i> Accumulator Bet</div>
                    <div class="balance-row"><span><i class="fas fa-wallet"></i> Balance</span><span style="color:#00ff9d; font-weight:bold;" id="acc-balance">$0.00</span></div>
                    
                    <div class="acc-selections" id="acc-selections">
                        <div style="color:#a0a8c9; text-align:center; padding:20px;">No selections added yet</div>
                    </div>
                    
                    <button class="add-current-btn" id="add-current-to-acc"><i class="fas fa-plus"></i> Add Current Match to Accumulator</button>
                    <button class="browse-matches-btn" onclick="window.location.href='upcoming-matches.html'"><i class="fas fa-search"></i> Browse More Matches</button>
                    
                    <div class="total-odds-box"><div>Total Odds</div><div class="total-odds-value" id="total-odds">1.00</div></div>
                    
                    <input type="number" class="amount-input" id="acc-amount" value="10" min="1">
                    <div class="quick-amounts"><div class="quick-amount" data-amount="5">$5</div><div class="quick-amount" data-amount="10">$10</div><div class="quick-amount" data-amount="25">$25</div><div class="quick-amount" data-amount="50">$50</div></div>
                    
                    <div class="potential-box"><div>Potential Win</div><div class="potential-value" id="acc-potential">$0.00</div></div>
                    
                    <div class="error-msg" id="acc-error"></div>
                    <div class="success-msg" id="acc-success"></div>
                    
                    <button class="place-btn" id="place-acc-btn" disabled>Add 2+ Selections</button>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/betting-engine.js"></script>
    <script>
        function toggleLanguage() {
            var isEn = document.querySelector('.en').style.display !== 'none';
            document.querySelectorAll('.en').forEach(el => el.style.display = isEn ? 'none' : '');
            document.querySelectorAll('.ar').forEach(el => el.style.display = isEn ? '' : 'none');
            document.documentElement.dir = isEn ? 'rtl' : 'ltr';
        }
        
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), db = firebase.firestore();
        const params = new URLSearchParams(location.search);
        const fixtureId = params.get('id');
        
        let currentUser = null, currentMatch = null, selectedType = null, balance = 0;
        let accSelections = [];
        
        // Load saved accumulator from localStorage
        const savedAcc = localStorage.getItem('x_lodon_accumulator');
        if (savedAcc) { try { accSelections = JSON.parse(savedAcc); } catch(e) {} }
        
        if (!fixtureId) { document.getElementById('loading-state').style.display = 'none'; document.getElementById('error-state').style.display = 'block'; document.getElementById('error-text').textContent = 'No match selected'; }
        
        auth.onAuthStateChanged(async u => {
            if (!u) { location.href = '../login.html'; return; }
            currentUser = u;
            await loadBalance();
            if (fixtureId) loadMatch();
        });
        
        async function loadBalance() {
            const doc = await db.collection('wallets').doc(currentUser.uid).get();
            balance = doc.exists ? (doc.data().balance || 0) : 0;
            document.getElementById('user-balance').textContent = '$' + balance.toFixed(2);
            document.getElementById('acc-balance').textContent = '$' + balance.toFixed(2);
        }
        
        function loadMatch() {
            db.collection('sports_matches').doc(fixtureId).get().then(doc => {
                if (!doc.exists) { document.getElementById('loading-state').style.display = 'none'; document.getElementById('error-state').style.display = 'block'; document.getElementById('error-text').textContent = 'Match not found'; return; }
                currentMatch = doc.data();
                document.getElementById('loading-state').style.display = 'none';
                document.getElementById('match-content').style.display = 'block';
                
                if (currentMatch.status !== 'upcoming') {
                    document.getElementById('betting-section').style.display = 'none';
                    document.getElementById('closed-section').style.display = 'block';
                    document.getElementById('closed-reason').textContent = currentMatch.status === 'live' ? 'Match in progress' : 'Match finished';
                    return;
                }
                
                document.getElementById('match-hero').innerHTML = `<div class="teams-large"><div class="team-large"><div class="team-name-large">${currentMatch.homeTeam?.name||'Home'}</div></div><div class="vs-large">VS</div><div class="team-large"><div class="team-name-large">${currentMatch.awayTeam?.name||'Away'}</div></div></div><div class="league-info"><i class="fas fa-trophy"></i> ${currentMatch.leagueName||'League'} • ${currentMatch.startTime?.toDate().toLocaleString()||''}</div>`;
                document.getElementById('odds-home').textContent = currentMatch.odds?.home?.toFixed(2) || '2.00';
                document.getElementById('odds-draw').textContent = currentMatch.odds?.draw?.toFixed(2) || '3.50';
                document.getElementById('odds-away').textContent = currentMatch.odds?.away?.toFixed(2) || '3.80';
                
                renderAccSelections();
            });
        }
        
        // Bet type toggle
        document.querySelectorAll('.bet-type-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.bet-type-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                document.getElementById('single-section').style.display = this.dataset.type === 'single' ? 'block' : 'none';
                document.getElementById('accumulator-section').style.display = this.dataset.type === 'accumulator' ? 'block' : 'none';
            });
        });
        
        // Single bet
        document.querySelectorAll('#single-section .bet-option').forEach(o => o.addEventListener('click', function() {
            document.querySelectorAll('#single-section .bet-option').forEach(x => x.classList.remove('selected'));
            this.classList.add('selected'); selectedType = this.dataset.type;
            document.getElementById('place-single-btn').disabled = false;
            updatePotential();
        }));
        
        document.querySelectorAll('.quick-amount').forEach(b => b.addEventListener('click', function() {
            if (document.getElementById('single-section').style.display !== 'none') document.getElementById('bet-amount').value = this.dataset.amount;
            else document.getElementById('acc-amount').value = this.dataset.amount;
            updatePotential(); updateAccPotential();
        }));
        
        document.getElementById('bet-amount').addEventListener('input', updatePotential);
        document.getElementById('acc-amount').addEventListener('input', updateAccPotential);
        
        function updatePotential() { if (selectedType && currentMatch) { const a = parseFloat(document.getElementById('bet-amount').value)||0; document.getElementById('potential-win').textContent = '$' + (a * (currentMatch.odds?.[selectedType]||2)).toFixed(2); } }
        function updateAccPotential() { const a = parseFloat(document.getElementById('acc-amount').value)||0; const odds = accSelections.reduce((t,s) => t * s.odds, 1); document.getElementById('acc-potential').textContent = '$' + (a * odds).toFixed(2); }
        
        document.getElementById('place-single-btn').addEventListener('click', async () => {
            const amount = parseFloat(document.getElementById('bet-amount').value);
            if (!selectedType) return alert('Select outcome');
            if (amount > balance) return alert('Insufficient balance');
            
            const btn = document.getElementById('place-single-btn'); btn.disabled = true; btn.textContent = 'Processing...';
            try {
                const r = await placeSingleBet(parseInt(fixtureId), selectedType, amount);
                if (r.success) { alert('Bet placed!'); location.href = 'my-bets.html'; }
                else { alert(r.error); btn.disabled = false; btn.textContent = 'Place Bet'; }
            } catch(e) { alert('Error'); btn.disabled = false; btn.textContent = 'Place Bet'; }
        });
        
        // Accumulator
        document.getElementById('add-current-to-acc').addEventListener('click', function() {
            if (!selectedType) { alert('Select an outcome first (Home/Draw/Away)'); return; }
            if (!currentMatch) { alert('Match not loaded'); return; }
            if (accSelections.some(s => s.fixtureId === currentMatch.fixtureId)) { alert('Already in accumulator'); return; }
            
            accSelections.push({
                fixtureId: currentMatch.fixtureId,
                matchName: `${currentMatch.homeTeam.name} vs ${currentMatch.awayTeam.name}`,
                betType: selectedType,
                betTypeName: selectedType === 'home' ? 'Home' : selectedType === 'draw' ? 'Draw' : 'Away',
                odds: currentMatch.odds?.[selectedType] || 2.00
            });
            
            localStorage.setItem('x_lodon_accumulator', JSON.stringify(accSelections));
            renderAccSelections();
            document.querySelectorAll('#single-section .bet-option').forEach(x => x.classList.remove('selected'));
            selectedType = null;
        });
        
        function renderAccSelections() {
            const container = document.getElementById('acc-selections');
            if (accSelections.length === 0) { container.innerHTML = '<div style="color:#a0a8c9; text-align:center; padding:20px;">No selections added yet</div>'; document.getElementById('total-odds').textContent = '1.00'; document.getElementById('place-acc-btn').disabled = true; return; }
            
            let total = 1;
            container.innerHTML = accSelections.map((s,i) => { total *= s.odds; return `<div class="acc-item"><div><div>${s.matchName}</div><div style="color:#00ff9d; font-size:12px;">${s.betTypeName} @ ${s.odds.toFixed(2)}</div></div><span class="acc-remove" onclick="removeAcc(${i})"><i class="fas fa-times"></i></span></div>`; }).join('');
            document.getElementById('total-odds').textContent = total.toFixed(2);
            document.getElementById('place-acc-btn').disabled = accSelections.length < 2;
            document.getElementById('place-acc-btn').textContent = accSelections.length < 2 ? 'Add 2+ Selections' : 'Place Accumulator';
            updateAccPotential();
        }
        
        window.removeAcc = function(i) { accSelections.splice(i, 1); localStorage.setItem('x_lodon_accumulator', JSON.stringify(accSelections)); renderAccSelections(); };
        
        document.getElementById('place-acc-btn').addEventListener('click', async () => {
            const amount = parseFloat(document.getElementById('acc-amount').value);
            if (accSelections.length < 2) return alert('Add at least 2 selections');
            if (amount > balance) return alert('Insufficient balance');
            
            const btn = document.getElementById('place-acc-btn'); btn.disabled = true; btn.textContent = 'Processing...';
            try {
                const r = await placeAccumulatorBet(accSelections, amount);
                if (r.success) { localStorage.removeItem('x_lodon_accumulator'); alert('Accumulator placed!'); location.href = 'my-bets.html'; }
                else { alert(r.error); btn.disabled = false; btn.textContent = 'Place Accumulator'; }
            } catch(e) { alert('Error'); btn.disabled = false; btn.textContent = 'Place Accumulator'; }
        });
    </script>
</body>
</html>
