<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Place Bet - X Lodon | رهان</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="../css/sports-betting.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0f1a; color: white; font-family: 'Segoe UI', 'Tajawal', sans-serif; min-height: 100vh; }
        .header { background: #111827; padding: 15px; border-bottom: 2px solid #00ff9d; display: flex; align-items: center; gap: 15px; }
        .back-btn { color: #00ff9d; text-decoration: none; font-size: 20px; }
        .container { max-width: 800px; margin: 0 auto; padding: 15px; }
        
        .match-hero { background: linear-gradient(135deg, #111827, #1a2332); border-radius: 20px; padding: 25px 15px; margin-bottom: 20px; text-align: center; border: 1px solid #00ff9d33; }
        .teams-large { display: flex; align-items: center; justify-content: center; gap: 15px; }
        .team-large { flex: 1; }
        .team-name-large { font-size: 18px; font-weight: bold; }
        .vs-large { font-size: 20px; color: #ff9800; font-weight: bold; }
        .league-info { color: #a0a8c9; font-size: 13px; margin-top: 10px; }
        
        .bet-type-tabs { display: flex; gap: 5px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px; }
        .bet-type-tab { padding: 10px 14px; background: #1a2332; border: none; border-radius: 25px; color: white; font-size: 12px; cursor: pointer; white-space: nowrap; }
        .bet-type-tab.active { background: #00ff9d; color: black; }
        
        .bet-section { background: #111827; border-radius: 20px; padding: 20px; margin-bottom: 20px; }
        .balance-row { display: flex; justify-content: space-between; padding: 12px; background: #0a0f1a; border-radius: 10px; margin-bottom: 20px; }
        
        .bet-options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
        .bet-option { background: #1a2332; border: 2px solid transparent; border-radius: 12px; padding: 15px; text-align: center; cursor: pointer; }
        .bet-option.selected { background: #00ff9d; border-color: #00ff9d; color: black; }
        .bet-option-odds { font-size: 22px; font-weight: bold; color: #00ff9d; }
        .bet-option.selected .bet-option-odds { color: black; }
        
        .amount-input { width: 100%; padding: 15px; background: #0a0f1a; border: 2px solid #ffffff22; border-radius: 12px; color: white; font-size: 20px; margin-bottom: 15px; }
        .quick-amounts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 20px; }
        .quick-amount { padding: 12px; background: #1a2332; border-radius: 8px; text-align: center; cursor: pointer; }
        
        .potential-box { background: linear-gradient(135deg, #00ff9d11, #ff980011); padding: 15px; border-radius: 12px; text-align: center; margin-bottom: 20px; }
        .potential-value { font-size: 32px; font-weight: bold; color: #00ff9d; }
        
        .place-btn { width: 100%; padding: 18px; background: #00ff9d; color: black; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .place-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .error-msg { background: #ff525222; border: 1px solid #ff5252; border-radius: 10px; padding: 15px; margin-bottom: 15px; color: #ff5252; display: none; }
        .success-msg { background: #4caf5022; border: 1px solid #4caf50; border-radius: 10px; padding: 15px; margin-bottom: 15px; color: #4caf50; display: none; }
        .arabic { font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body>
    <div class="header">
        <a href="upcoming-matches.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        <h1 style="font-size:18px;"><i class="fas fa-futbol"></i> <span class="en">Place Bet</span><span class="ar" style="display:none;">ضع رهانك</span></h1>
    </div>
    
    <div class="container">
        <div id="loading" style="text-align:center; padding:40px;"><i class="fas fa-spinner fa-spin"></i> Loading...</div>
        <div id="error" style="display:none; text-align:center; padding:40px; color:#ff5252;"></div>
        
        <div id="content" style="display:none;">
            <div class="match-hero" id="match-hero"></div>
            
            <!-- BET TYPE TABS -->
            <div class="bet-type-tabs">
                <button class="bet-type-tab active" data-tab="1x2">1X2</button>
                <button class="bet-type-tab" data-tab="overunder">Over/Under 2.5</button>
                <button class="bet-type-tab" data-tab="btts">BTTS</button>
                <button class="bet-type-tab" data-tab="doublechance">Double Chance</button>
            </div>
            
            <div class="bet-section">
                <div class="balance-row"><span><i class="fas fa-wallet"></i> Balance</span><span style="color:#00ff9d; font-weight:bold;" id="user-balance">$0.00</span></div>
                
                <div id="bet-options-container"></div>
                
                <input type="number" class="amount-input" id="bet-amount" value="10" min="1">
                <div class="quick-amounts"><div class="quick-amount" data-amount="5">$5</div><div class="quick-amount" data-amount="10">$10</div><div class="quick-amount" data-amount="25">$25</div><div class="quick-amount" data-amount="50">$50</div></div>
                
                <div class="potential-box"><div>Potential Win</div><div class="potential-value" id="potential-win">$0.00</div></div>
                
                <div class="error-msg" id="error-message"></div>
                <div class="success-msg" id="success-message"></div>
                
                <button class="place-btn" id="place-bet-btn" disabled>Select Outcome</button>
            </div>
        </div>
    </div>

    <script src="../js/betting-engine.js"></script>
    <script src="../js/sports-api.js"></script>
    <script>
        const firebaseConfig = { apiKey:"AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM", authDomain:"x-bet-prod-jd.firebaseapp.com", projectId:"x-bet-prod-jd", storageBucket:"x-bet-prod-jd.firebasestorage.app", messagingSenderId:"499334334535", appId:"1:499334334535:web:bebc1bf817e24d9e3c4962" };
        if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth=firebase.auth(), db=firebase.firestore();
        const params=new URLSearchParams(location.search);
        const fixtureId=params.get('id');
        
        let currentUser=null, currentMatch=null, selectedType=null, balance=0, currentTab='1x2';
        
        if(!fixtureId){ document.getElementById('loading').style.display='none'; document.getElementById('error').style.display='block'; document.getElementById('error').textContent='No match selected'; }
        
        auth.onAuthStateChanged(async u=>{ if(!u){location.href='../login.html';return;} currentUser=u; await loadBalance(); if(fixtureId) loadMatch(); });
        
        async function loadBalance(){ const d=await db.collection('wallets').doc(currentUser.uid).get(); balance=d.exists?(d.data().balance||0):0; document.getElementById('user-balance').textContent='$'+balance.toFixed(2); }
        
        function loadMatch(){
            db.collection('sports_matches').doc(fixtureId).get().then(doc=>{
                if(!doc.exists){ document.getElementById('loading').style.display='none'; document.getElementById('error').style.display='block'; document.getElementById('error').textContent='Match not found'; return; }
                currentMatch=doc.data();
                document.getElementById('loading').style.display='none';
                document.getElementById('content').style.display='block';
                document.getElementById('match-hero').innerHTML=`<div class="teams-large"><div class="team-large"><div class="team-name-large">${currentMatch.homeTeam?.name||'Home'}</div></div><div class="vs-large">VS</div><div class="team-large"><div class="team-name-large">${currentMatch.awayTeam?.name||'Away'}</div></div></div><div class="league-info"><i class="fas fa-trophy"></i> ${currentMatch.leagueName||'League'}</div>`;
                renderBetOptions('1x2');
            });
        }
        
        function renderBetOptions(type){
            currentTab=type;
            const container=document.getElementById('bet-options-container');
            let html='';
            
            if(type==='1x2'){
                html=`
                    <div class="bet-options">
                        <div class="bet-option" data-type="home"><div>Home Win</div><div class="bet-option-odds">${currentMatch.odds?.home||'2.00'}</div></div>
                        <div class="bet-option" data-type="draw"><div>Draw</div><div class="bet-option-odds">${currentMatch.odds?.draw||'3.50'}</div></div>
                        <div class="bet-option" data-type="away"><div>Away Win</div><div class="bet-option-odds">${currentMatch.odds?.away||'3.80'}</div></div>
                    </div>`;
            } else if(type==='overunder'){
                html=`
                    <div class="bet-options">
                        <div class="bet-option" data-type="over25"><div>Over 2.5 Goals</div><div class="bet-option-odds">1.80</div></div>
                        <div class="bet-option" data-type="under25"><div>Under 2.5 Goals</div><div class="bet-option-odds">2.00</div></div>
                    </div>`;
            } else if(type==='btts'){
                html=`
                    <div class="bet-options">
                        <div class="bet-option" data-type="btts_yes"><div>Both Teams Score - Yes</div><div class="bet-option-odds">1.90</div></div>
                        <div class="bet-option" data-type="btts_no"><div>Both Teams Score - No</div><div class="bet-option-odds">1.85</div></div>
                    </div>`;
            } else if(type==='doublechance'){
                html=`
                    <div class="bet-options">
                        <div class="bet-option" data-type="1X"><div>Home or Draw (1X)</div><div class="bet-option-odds">1.40</div></div>
                        <div class="bet-option" data-type="12"><div>Home or Away (12)</div><div class="bet-option-odds">1.35</div></div>
                        <div class="bet-option" data-type="X2"><div>Draw or Away (X2)</div><div class="bet-option-odds">1.45</div></div>
                    </div>`;
            }
            
            container.innerHTML=html;
            document.querySelectorAll('.bet-option').forEach(o=>o.addEventListener('click',function(){
                document.querySelectorAll('.bet-option').forEach(x=>x.classList.remove('selected'));
                this.classList.add('selected'); selectedType=this.dataset.type;
                document.getElementById('place-bet-btn').disabled=false;
                updatePotential();
            }));
        }
        
        document.querySelectorAll('.bet-type-tab').forEach(t=>t.addEventListener('click',function(){
            document.querySelectorAll('.bet-type-tab').forEach(x=>x.classList.remove('active'));
            this.classList.add('active'); selectedType=null;
            document.getElementById('place-bet-btn').disabled=true;
            renderBetOptions(this.dataset.tab);
        }));
        
        document.querySelectorAll('.quick-amount').forEach(b=>b.addEventListener('click',()=>{ document.getElementById('bet-amount').value=b.dataset.amount; updatePotential(); }));
        document.getElementById('bet-amount').addEventListener('input',updatePotential);
        
        function updatePotential(){
            if(!selectedType||!currentMatch) return;
            const amount=parseFloat(document.getElementById('bet-amount').value)||0;
            const oddsMap={home:currentMatch.odds?.home||2,draw:currentMatch.odds?.draw||3.5,away:currentMatch.odds?.away||3.8,over25:1.8,under25:2,btts_yes:1.9,btts_no:1.85,'1X':1.4,'12':1.35,'X2':1.45};
            const odds=oddsMap[selectedType]||2;
            document.getElementById('potential-win').textContent='$'+(amount*odds).toFixed(2);
        }
        
        document.getElementById('place-bet-btn').addEventListener('click',async()=>{
            const amount=parseFloat(document.getElementById('bet-amount').value);
            if(!selectedType) return alert('Select outcome');
            if(amount>balance) return alert('Insufficient balance');
            
            const btn=document.getElementById('place-bet-btn'); btn.disabled=true; btn.textContent='Processing...';
            try {
                let result;
                if(['home','draw','away'].includes(selectedType)) result=await placeSingleBet(parseInt(fixtureId),selectedType,amount);
                else if(['over25','under25'].includes(selectedType)) result=await placeOverUnderBet(parseInt(fixtureId),selectedType,amount);
                else if(['btts_yes','btts_no'].includes(selectedType)) result=await placeBTTSBet(parseInt(fixtureId),selectedType,amount);
                else if(['1X','12','X2'].includes(selectedType)) result=await placeDoubleChanceBet(parseInt(fixtureId),selectedType,amount);
                
                if(result.success){ alert('Bet placed!'); location.href='my-bets.html'; }
                else { alert(result.error); btn.disabled=false; btn.textContent='Place Bet'; }
            } catch(e){ alert('Error'); btn.disabled=false; btn.textContent='Place Bet'; }
        });
    </script>
</body>
</html>
