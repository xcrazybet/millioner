            const n = document.createElement('div');
            n.className = `notification ${type}`;
            n.innerHTML = msg;
            document.body.appendChild(n);
            setTimeout(() => n.remove(), 3000);
        }

        function fmtCurrency(v) { return '$' + (parseFloat(v)||0).toFixed(2); }

            });

        // ===== WALLET =====
        async function getBalance(uid) {
            const doc = await db.collection('wallets').doc(uid).get();
            return doc.exists ? (doc.data().balance||0) : 1000;
        }
        async function deductBalance(uid, amt, betId) {
            const ref = db.collection('wallets').doc(uid);
            const doc = await ref.get();
            const bal = doc.exists ? (doc.data().balance||0) : 1000;
            if (bal < amt) throw new Error('Insufficient balance');
            await ref.update({ balance: bal - amt, updated_at: new Date().toISOString() });
            return bal - amt;
        }

        // ===== GET MATCH =====
        async function getMatch(fid) {
            // Try Supabase first
            if (supabaseClient) {
                try {
                    const { data } = await supabaseClient.from('sports_matches').select('*').eq('fixture_id', parseInt(fid)).maybeSingle();
                    if (data) {
                        let ht = data.home_team, at = data.away_team;
                        if (typeof ht === 'string') try { ht = JSON.parse(ht); } catch(e) { ht = { name: 'Home', logo: '' }; }
                        if (typeof at === 'string') try { at = JSON.parse(at); } catch(e) { at = { name: 'Away', logo: '' }; }
                        return { ...data, home_team: ht || { name: 'Home', logo: '' }, away_team: at || { name: 'Away', logo: '' }, score: data.score || { home: 0, away: 0 } };
                    }
                } catch(e) {}
            }
            // Try API
            try {
                const res = await fetch(`${API_BASE}/api/fixture/${fid}`);
                const json = await res.json();
                if (json.success && (json.fixture || json.data)) {
                    const d = json.fixture || json.data;
                    const status = d.fixture?.status?.short === 'FT' ? 'finished' : (d.fixture?.status?.short === '1H' || d.fixture?.status?.short === '2H' ? 'live' : 'upcoming');
                    return {
                        fixture_id: fid,
                        status,
                        league_name: d.league?.name || '',
                        league_logo: d.league?.logo || '',
                        home_team: { name: d.teams?.home?.name || 'Home', logo: d.teams?.home?.logo || '' },
                        away_team: { name: d.teams?.away?.name || 'Away', logo: d.teams?.away?.logo || '' },
                        start_time: d.fixture?.date || new Date().toISOString(),
                        score: { home: d.goals?.home || 0, away: d.goals?.away || 0 },
                        elapsed: d.fixture?.status?.elapsed || 0,
                        odds: genOdds()
                    };
                }
            } catch(e) {}
            throw new Error('Match not found');
        }

        // ===== LOAD MATCH =====
        async function loadMatch() {
            if (!fixtureId) {
                document.getElementById('loading').innerHTML = '<p style="color:#ff5252;">No match ID provided</p>';
                return;
            }
            try {
                currentMatch = await getMatch(fixtureId);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';
                if (!currentMatch.odds) currentMatch.odds = genOdds();
                renderHero();
                renderTabs();
                renderBetOptions();
                updateBalanceDisplay();
            } catch(e) {
                document.getElementById('loading').innerHTML = `<p style="color:#ff5252;">Error: ${e.message}</p><button onclick="location.reload()" style="background:#00ff9d;color:black;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;margin-top:10px;">Retry</button>`;
            }
        }

        function renderHero() {
            const m = currentMatch;
            const ht = m.home_team || { name: 'Home', logo: '' };
            const at = m.away_team || { name: 'Away', logo: '' };
            const isLive = m.status === 'live';
            const sc = m.score || { home: 0, away: 0 };
            const statusClass = isLive ? 'status-live' : (m.status === 'upcoming' ? 'status-upcoming' : 'status-finished');
            const statusText = isLive ? `LIVE ${m.elapsed || 0}'` : m.status.toUpperCase();
            
            document.getElementById('match-hero').innerHTML = `
                <div class="teams-large">
                    <div><img class="team-logo-lg" src="${ht.logo || ''}" onerror="this.style.display='none'"><div class="team-name-lg">${esc(ht.name)}</div></div>
                    <div class="vs-large">${isLive ? `<span class="live-score">${sc.home} - ${sc.away}</span>` : 'VS'}</div>
                    <div><img class="team-logo-lg" src="${at.logo || ''}" onerror="this.style.display='none'"><div class="team-name-lg">${esc(at.name)}</div></div>
                </div>
                <div class="status-badge ${statusClass}">${statusText}</div>
            `;
            document.getElementById('match-info').innerHTML = `🏆 ${esc(m.league_name)} | 📅 ${new Date(m.start_time).toLocaleString()}`;
        }

        function renderTabs() {
            const tabs = Object.keys(BET_CATEGORIES);
            document.getElementById('bet-tabs').innerHTML = tabs.map((k, i) => `
                <button class="bet-type-tab ${i===0?'active':''}" data-tab="${k}">${BET_CATEGORIES[k].icon} ${BET_CATEGORIES[k].name}</button>
            `).join('');
        }

        function renderBetOptions() {
            const cat = BET_CATEGORIES[currentTab];
            if (!cat) return;
            const odds = currentMatch.odds || genOdds();
            const disabled = currentMatch.status === 'finished' || (currentMatch.status === 'live' && currentMatch.elapsed >= 80);
            
            document.getElementById('bet-options-container').innerHTML = `
                <div class="bet-options">
                    ${cat.bets.map(b => `
                        <div class="bet-option ${disabled?'disabled':''}" data-type="${b}" data-odds="${odds[b] || '2.00'}">
                            <div class="bet-option-name">${esc(BET_NAMES[b] || b)}</div>
                            <div class="bet-option-odds">${odds[b] || '2.00'}</div>
                        </div>
                    `).join('')}
                </div>
            `;
            
            document.querySelectorAll('.bet-option:not(.disabled)').forEach(opt => {
                opt.addEventListener('click', function() {
                    document.querySelectorAll('.bet-option').forEach(o => o.classList.remove('selected'));
                    this.classList.add('selected');
                    selectedBet = { type: this.dataset.type, name: BET_NAMES[this.dataset.type] || this.dataset.type, odds: parseFloat(this.dataset.odds) };
                    updatePotential();
                    document.getElementById('place-bet-btn').disabled = false;
                    document.getElementById('place-bet-btn').innerHTML = 'Place Bet';
                    document.getElementById('add-to-slip-btn').disabled = false;
                });
            });
            
            if (disabled) {
                document.getElementById('place-bet-btn').disabled = true;
                document.getElementById('place-bet-btn').innerHTML = 'Betting Closed';
                document.getElementById('add-to-slip-btn').disabled = true;
            }
        }

        function updatePotential() {
            const amt = parseFloat(document.getElementById('bet-amount').value) || 0;
            const odds = selectedBet ? selectedBet.odds : 0;
            document.getElementById('potential-win').textContent = fmtCurrency(amt * odds);
        }

        // ===== PLACE SINGLE BET =====
        async function placeBetHandler() {
            if (!selectedBet) return noty('Select an outcome', 'error');
            const amt = parseFloat(document.getElementById('bet-amount').value);
            if (!amt || amt < 1) return noty('Minimum bet $1', 'error');
            const user = auth.currentUser;
            if (!user) return noty('Please login', 'error');
            
            const bal = await getBalance(user.uid);
            if (amt > bal) return noty(`Insufficient balance: ${fmtCurrency(bal)}`, 'error');
            
            const bet = {
                id: Date.now() + '_' + Math.random().toString(36).substr(2,6),
                user_id: user.uid,
                fixture_id: parseInt(fixtureId),
                bet_type: selectedBet.type,
                bet_name: selectedBet.name,
                odds: selectedBet.odds,
                amount: amt,
                potential_win: amt * selectedBet.odds,
                status: 'active',
                placed_at: new Date().toISOString()
            };
            
            try {
                await deductBalance(user.uid, amt, bet.id);
                if (supabaseClient) await supabaseClient.from('bets').insert(bet);
                await updateBalanceDisplay();
                noty(`✅ Bet placed! Win: ${fmtCurrency(bet.potential_win)}`);
                selectedBet = null;
                document.querySelectorAll('.bet-option').forEach(o => o.classList.remove('selected'));
                document.getElementById('place-bet-btn').disabled = true;
                document.getElementById('place-bet-btn').innerHTML = 'Select Outcome';
                document.getElementById('add-to-slip-btn').disabled = true;
                document.getElementById('potential-win').textContent = '$0.00';
            } catch(e) {
                noty(e.message, 'error');
            }
        }

        // ===== ADD TO SLIP =====
        function addToSlipHandler() {
            if (!selectedBet || !currentMatch) return noty('Select an outcome', 'error');
            const ht = currentMatch.home_team?.name || 'Home';
            const at = currentMatch.away_team?.name || 'Away';
            
            if (accumulatorSlip.find(s => s.fixtureId === currentMatch.fixture_id && s.betType === selectedBet.type)) {
                return noty('Already in slip', 'error');
            }
            
            accumulatorSlip.push({
                fixtureId: currentMatch.fixture_id,
                matchName: `${ht} vs ${at}`,
                betType: selectedBet.type,
                betTypeName: selectedBet.name,
                odds: selectedBet.odds
            });
            updateCartUI();
            noty('Added to slip!');
        }

        // ===== CART =====
        function toggleCart() {
            document.getElementById('side-cart').classList.toggle('open');
            document.getElementById('cart-overlay').classList.toggle('show');
        }
        function updateCartUI() {
            document.getElementById('cart-badge').textContent = accumulatorSlip.length;
            let totalOdds = 1;
            accumulatorSlip.forEach(s => totalOdds *= s.odds);
            document.getElementById('cart-total-odds').textContent = totalOdds.toFixed(2);
            const stake = parseFloat(document.getElementById('cart-stake').value) || 0;
            document.getElementById('cart-potential').textContent = fmtCurrency(stake * totalOdds);
            document.getElementById('cart-place-btn').disabled = accumulatorSlip.length < 2;
            
            document.getElementById('cart-items').innerHTML = accumulatorSlip.length === 0 
                ? '<div style="text-align:center;padding:20px;color:#a0a8c9;">No selections</div>'
                : accumulatorSlip.map((s, i) => `
                    <div class="cart-item">
                        <div><strong>${esc(s.matchName)}</strong></div>
                        <div style="color:#00ff9d;font-size:11px;">${esc(s.betTypeName)} @ ${s.odds}</div>
                        <button class="cart-remove" onclick="removeFromSlip(${i})"><i class="fas fa-trash"></i></button>
                    </div>
                `).join('');
        }
        function removeFromSlip(i) { accumulatorSlip.splice(i, 1); updateCartUI(); }

        // ===== PLACE ACCUMULATOR =====
        async function placeAccumulatorBet() {
            if (accumulatorSlip.length < 2) return noty('Need 2+ selections', 'error');
            const stake = parseFloat(document.getElementById('cart-stake').value);
            if (!stake || stake < 1) return noty('Min stake $1', 'error');
            const user = auth.currentUser;
            if (!user) return noty('Login required', 'error');
            
            const bal = await getBalance(user.uid);
            if (stake > bal) return noty(`Insufficient balance: ${fmtCurrency(bal)}`, 'error');
            
            let totalOdds = 1;
            accumulatorSlip.forEach(s => totalOdds *= s.odds);
            const win = stake * totalOdds;
            
            if (!confirm(`Place accumulator?\n${accumulatorSlip.length} picks\nOdds: ${totalOdds.toFixed(2)}\nStake: $${stake}\nWin: ${fmtCurrency(win)}`)) return;
            
            try {
                const bet = {
                    id: Date.now(),
                    user_id: user.uid,
                    bet_type: 'accumulator',
                    bet_name: `${accumulatorSlip.length}-fold Acc`,
                    odds: totalOdds,
                    amount: stake,
                    potential_win: win,
                    status: 'active',
                    placed_at: new Date().toISOString(),
                    selections: accumulatorSlip
                };
                await deductBalance(user.uid, stake, bet.id);
                if (supabaseClient) await supabaseClient.from('bets').insert(bet);
                accumulatorSlip = [];
                updateCartUI();
                toggleCart();
                await updateBalanceDisplay();
                noty(`✅ Accumulator placed! Win: ${fmtCurrency(win)}`);
            } catch(e) {
                noty(e.message, 'error');
            }
        }

        async function updateBalanceDisplay() {
            const user = auth.currentUser;
            if (user) {
                document.getElementById('balance-display').textContent = fmtCurrency(await getBalance(user.uid));
            }
        }

        // ===== EVENT LISTENERS =====
        document.getElementById('bet-tabs').addEventListener('click', function(e) {
            if (e.target.classList.contains('bet-type-tab')) {
                document.querySelectorAll('.bet-type-tab').forEach(t => t.classList.remove('active'));
                e.target.classList.add('active');
                currentTab = e.target.dataset.tab;
                selectedBet = null;
                document.getElementById('place-bet-btn').disabled = true;
                document.getElementById('place-bet-btn').innerHTML = 'Select Outcome';
                document.getElementById('add-to-slip-btn').disabled = true;
                document.getElementById('potential-win').textContent = '$0.00';
                renderBetOptions();
            }
        });
        
        document.getElementById('bet-amount').addEventListener('input', updatePotential);
        document.getElementById('cart-stake').addEventListener('input', updateCartUI);
        document.getElementById('place-bet-btn').addEventListener('click', placeBetHandler);
        document.getElementById('add-to-slip-btn').addEventListener('click', addToSlipHandler);
        
        document.getElementById('quick-amounts').innerHTML = [5,10,25,50,100,500].map(a => 
            `<div class="quick-amount" onclick="document.getElementById('bet-amount').value=${a};updatePotential()">$${a}</div>`
        ).join('');

        auth.onAuthStateChanged(async user => {
            if (user) { await updateBalanceDisplay(); loadMatch(); }
            else { document.getElementById('balance-display').textContent = '$0.00'; loadMatch(); }
        });

        window.toggleCart = toggleCart;
        window.removeFromSlip = removeFromSlip;
        window.placeAccumulatorBet = placeAccumulatorBet;
        console.log('✅ Match Details - ALL 23 Categories Loaded');
    </script>
</body>
</html>
