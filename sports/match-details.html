<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Place Bet - X Lodon</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="../css/sports-betting.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0f1a; color: white; font-family: 'Segoe UI', sans-serif; min-height: 100vh; }
        .header { background: #111827; padding: 15px; border-bottom: 2px solid #00ff9d; display: flex; align-items: center; gap: 15px; }
        .back-btn { color: #00ff9d; text-decoration: none; font-size: 20px; }
        .container { max-width: 800px; margin: 0 auto; padding: 15px; }
        .loading-state { text-align: center; padding: 60px 20px; }
        .spinner { width: 40px; height: 40px; border: 3px solid #00ff9d22; border-top-color: #00ff9d; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error-state { text-align: center; padding: 60px 20px; color: #ff5252; }
        .match-hero { background: linear-gradient(135deg, #111827, #1a2332); border-radius: 20px; padding: 25px 15px; margin-bottom: 20px; text-align: center; border: 1px solid #00ff9d33; }
        .teams-large { display: flex; align-items: center; justify-content: center; gap: 15px; }
        .team-large { flex: 1; }
        .team-name-large { font-size: 18px; font-weight: bold; }
        .vs-large { font-size: 20px; color: #ff9800; font-weight: bold; }
        .league-info { color: #a0a8c9; font-size: 13px; margin-top: 10px; }
        .bet-section { background: #111827; border-radius: 20px; padding: 20px; margin-bottom: 20px; }
        .section-title { color: #00ff9d; font-size: 16px; margin-bottom: 15px; }
        .balance-row { display: flex; justify-content: space-between; padding: 12px; background: #0a0f1a; border-radius: 10px; margin-bottom: 20px; }
        .bet-options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .bet-option { background: #1a2332; border: 2px solid transparent; border-radius: 12px; padding: 15px 5px; text-align: center; cursor: pointer; }
        .bet-option.selected { background: #00ff9d; border-color: #00ff9d; color: black; }
        .bet-option-odds { font-size: 22px; font-weight: bold; color: #00ff9d; }
        .bet-option.selected .bet-option-odds { color: black; }
        .amount-input-wrapper { display: flex; align-items: center; background: #0a0f1a; border: 2px solid #ffffff22; border-radius: 12px; padding: 5px 15px; margin-bottom: 15px; }
        .amount-input { flex: 1; padding: 15px 0; background: transparent; border: none; color: white; font-size: 20px; outline: none; }
        .quick-amounts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 20px; }
        .quick-amount { padding: 12px; background: #1a2332; border-radius: 8px; text-align: center; cursor: pointer; }
        .potential-box { background: linear-gradient(135deg, #00ff9d11, #ff980011); padding: 15px; border-radius: 12px; text-align: center; margin-bottom: 20px; }
        .potential-value { font-size: 32px; font-weight: bold; color: #00ff9d; }
        .place-btn { width: 100%; padding: 18px; background: #00ff9d; color: black; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .place-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .error-msg { background: #ff525222; border: 1px solid #ff5252; border-radius: 10px; padding: 15px; margin-bottom: 15px; color: #ff5252; display: none; }
        .success-msg { background: #4caf5022; border: 1px solid #4caf50; border-radius: 10px; padding: 15px; margin-bottom: 15px; color: #4caf50; display: none; }
        .closed-section { text-align: center; padding: 40px; background: #ff525222; border: 2px solid #ff5252; border-radius: 15px; display: none; }
    </style>
</head>
<body>
    <div class="header">
        <a href="upcoming-matches.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        <h1 style="font-size:18px;"><i class="fas fa-futbol"></i> Place Bet</h1>
    </div>
    
    <div class="container">
        <div id="loading-state" class="loading-state">
            <div class="spinner"></div>
            <p>Loading match details...</p>
        </div>
        
        <div id="error-state" class="error-state" style="display:none;">
            <i class="fas fa-exclamation-circle" style="font-size:48px;"></i>
            <p id="error-text">Match not found</p>
            <a href="upcoming-matches.html" style="color:#00ff9d; margin-top:20px; display:inline-block;">← Back to Upcoming</a>
        </div>
        
        <div id="match-content" style="display:none;">
            <div class="match-hero" id="match-hero"></div>
            
            <div id="closed-section" class="closed-section">
                <i class="fas fa-times-circle" style="font-size:48px; color:#ff5252;"></i>
                <h3>Betting Closed</h3>
                <p id="closed-reason"></p>
                <a href="upcoming-matches.html" style="color:#00ff9d; margin-top:20px; display:inline-block;">Browse Other Matches</a>
            </div>
            
            <div class="bet-section" id="betting-section">
                <div class="section-title"><i class="fas fa-ticket-alt"></i> Place Your Bet</div>
                <div class="balance-row">
                    <span><i class="fas fa-wallet"></i> Balance</span>
                    <span style="color:#00ff9d; font-weight:bold;" id="user-balance">$0.00</span>
                </div>
                
                <div class="bet-options">
                    <div class="bet-option" data-type="home">
                        <div>Home Win</div>
                        <div class="bet-option-odds" id="odds-home">2.00</div>
                    </div>
                    <div class="bet-option" data-type="draw">
                        <div>Draw</div>
                        <div class="bet-option-odds" id="odds-draw">3.50</div>
                    </div>
                    <div class="bet-option" data-type="away">
                        <div>Away Win</div>
                        <div class="bet-option-odds" id="odds-away">3.80</div>
                    </div>
                </div>
                
                <div class="amount-input-wrapper">
                    <span style="color:#00ff9d; font-size:20px; margin-right:5px;">$</span>
                    <input type="number" class="amount-input" id="bet-amount" value="10" min="1" max="1000">
                </div>
                <div class="quick-amounts">
                    <div class="quick-amount" data-amount="5">$5</div>
                    <div class="quick-amount" data-amount="10">$10</div>
                    <div class="quick-amount" data-amount="25">$25</div>
                    <div class="quick-amount" data-amount="50">$50</div>
                </div>
                
                <div class="potential-box">
                    <div>Potential Win</div>
                    <div class="potential-value" id="potential-win">$0.00</div>
                </div>
                
                <div class="error-msg" id="error-message"></div>
                <div class="success-msg" id="success-message"></div>
                
                <button class="place-btn" id="place-bet-btn" disabled>Select Outcome</button>
            </div>
        </div>
    </div>

    <script src="../js/betting-engine.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), db = firebase.firestore();
        
        const params = new URLSearchParams(location.search);
        const fixtureId = params.get('id');
        
        let currentUser = null, currentMatch = null, selectedType = null, balance = 0;
        
        if (!fixtureId) {
            document.getElementById('loading-state').style.display = 'none';
            document.getElementById('error-state').style.display = 'block';
            document.getElementById('error-text').textContent = 'No match selected';
        }
        
        auth.onAuthStateChanged(async u => {
            if (!u) { location.href = '../login.html'; return; }
            currentUser = u;
            await loadBalance();
            if (fixtureId) loadMatch();
        });
        
        async function loadBalance() {
            const doc = await db.collection('wallets').doc(currentUser.uid).get();
            balance = doc.exists ? (doc.data().balance || 0) : 0;
            document.getElementById('user-balance').textContent = `$${balance.toFixed(2)}`;
        }
        
        function loadMatch() {
            db.collection('sports_matches').doc(fixtureId).get().then(doc => {
                if (!doc.exists) {
                    document.getElementById('loading-state').style.display = 'none';
                    document.getElementById('error-state').style.display = 'block';
                    document.getElementById('error-text').textContent = 'Match not found';
                    return;
                }
                
                currentMatch = doc.data();
                currentMatch.id = doc.id;
                
                document.getElementById('loading-state').style.display = 'none';
                document.getElementById('match-content').style.display = 'block';
                
                displayMatch();
                checkStatus();
            }).catch(error => {
                console.error('Error loading match:', error);
                document.getElementById('loading-state').style.display = 'none';
                document.getElementById('error-state').style.display = 'block';
                document.getElementById('error-text').textContent = 'Error loading match';
            });
        }
        
        function displayMatch() {
            const m = currentMatch;
            document.getElementById('match-hero').innerHTML = `
                <div class="teams-large">
                    <div class="team-large"><div class="team-name-large">${m.homeTeam?.name||'Home'}</div></div>
                    <div class="vs-large">VS</div>
                    <div class="team-large"><div class="team-name-large">${m.awayTeam?.name||'Away'}</div></div>
                </div>
                <div class="league-info"><i class="fas fa-trophy"></i> ${m.leagueName||'League'} • ${m.startTime?.toDate().toLocaleString()||''}</div>
            `;
            
            document.getElementById('odds-home').textContent = m.odds?.home?.toFixed(2) || '2.00';
            document.getElementById('odds-draw').textContent = m.odds?.draw?.toFixed(2) || '3.50';
            document.getElementById('odds-away').textContent = m.odds?.away?.toFixed(2) || '3.80';
        }
        
        function checkStatus() {
            const bettingSection = document.getElementById('betting-section');
            const closedSection = document.getElementById('closed-section');
            
            if (currentMatch.status !== 'upcoming') {
                bettingSection.style.display = 'none';
                closedSection.style.display = 'block';
                document.getElementById('closed-reason').textContent = 
                    currentMatch.status === 'live' ? 'Match is currently in progress' : 
                    currentMatch.status === 'finished' ? 'Match has finished' : 'Betting closed';
                return;
            }
            
            const kickoff = currentMatch.startTime.toDate();
            const now = new Date();
            const minutesUntil = Math.floor((kickoff - now) / 60000);
            
            if (minutesUntil < 2) {
                bettingSection.style.display = 'none';
                closedSection.style.display = 'block';
                document.getElementById('closed-reason').textContent = 'Too close to kickoff';
                return;
            }
            
            bettingSection.style.display = 'block';
            closedSection.style.display = 'none';
        }
        
        // Event Listeners
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.bet-option').forEach(o => {
                o.addEventListener('click', () => {
                    document.querySelectorAll('.bet-option').forEach(x => x.classList.remove('selected'));
                    o.classList.add('selected');
                    selectedType = o.dataset.type;
                    document.getElementById('place-bet-btn').disabled = false;
                    updatePotential();
                });
            });
            
            document.querySelectorAll('.quick-amount').forEach(b => {
                b.addEventListener('click', () => {
                    document.getElementById('bet-amount').value = b.dataset.amount;
                    updatePotential();
                });
            });
            
            document.getElementById('bet-amount').addEventListener('input', updatePotential);
            document.getElementById('place-bet-btn').addEventListener('click', placeBet);
        });
        
        function updatePotential() {
            if (!selectedType || !currentMatch) return;
            const amount = parseFloat(document.getElementById('bet-amount').value) || 0;
            const odds = currentMatch.odds?.[selectedType] || 2.00;
            document.getElementById('potential-win').textContent = `$${(amount * odds).toFixed(2)}`;
        }
        
        async function placeBet() {
            const amount = parseFloat(document.getElementById('bet-amount').value);
            const btn = document.getElementById('place-bet-btn');
            const err = document.getElementById('error-message');
            const suc = document.getElementById('success-message');
            
            if (!selectedType) { err.style.display = 'block'; err.innerHTML = 'Select an outcome'; return; }
            if (amount > balance) { err.style.display = 'block'; err.innerHTML = 'Insufficient balance'; return; }
            if (amount < 1) { err.style.display = 'block'; err.innerHTML = 'Minimum bet $1'; return; }
            
            btn.disabled = true; btn.textContent = 'Processing...';
            err.style.display = 'none'; suc.style.display = 'none';
            
            try {
                const result = await placeSingleBet(parseInt(fixtureId), selectedType, amount);
                if (result.success) {
                    suc.style.display = 'block'; suc.innerHTML = '✅ Bet placed successfully!';
                    await loadBalance();
                    setTimeout(() => location.href = 'my-bets.html', 1500);
                } else {
                    err.style.display = 'block'; err.innerHTML = result.error || 'Failed to place bet';
                    btn.disabled = false; btn.textContent = 'Place Bet';
                }
            } catch (e) {
                err.style.display = 'block'; err.innerHTML = 'Error placing bet';
                btn.disabled = false; btn.textContent = 'Place Bet';
            }
        }
    </script>
</body>
</html>
