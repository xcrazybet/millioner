<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Place Bet - X Lodon Betting</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="../css/sports-betting.css">
    <style>body { background: #0a0f1a; color: white; min-height: 100vh; margin: 0; font-family: 'Segoe UI', 'Roboto', sans-serif; } .container { max-width: 800px; margin: 0 auto; padding: 15px; } .page-header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; } .back-btn { width: 40px; height: 40px; background: #111827; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #00ff9d; text-decoration: none; font-size: 18px; border: 1px solid rgba(255, 255, 255, 0.1); } .match-hero { background: linear-gradient(135deg, #111827, #1a2332); border-radius: 20px; padding: 30px 20px; margin-bottom: 20px; border: 1px solid rgba(0, 255, 157, 0.2); text-align: center; } .match-teams-large { display: flex; align-items: center; justify-content: center; gap: 20px; } .team-large { flex: 1; text-align: center; } .team-large-logo { width: 80px; height: 80px; background: rgba(0, 255, 157, 0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px; font-size: 28px; font-weight: 700; color: #00ff9d; border: 2px solid rgba(0, 255, 157, 0.3); } .team-large-name { font-size: 18px; font-weight: 600; } .vs-large { font-size: 24px; font-weight: 700; color: #ff9800; } .betting-section { background: #111827; border-radius: 20px; padding: 20px; border: 2px solid #00ff9d; } .bet-options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 25px; } .bet-option { background: rgba(0, 0, 0, 0.3); border: 2px solid transparent; border-radius: 15px; padding: 20px 10px; text-align: center; cursor: pointer; transition: all 0.3s; } .bet-option.selected { background: #00ff9d; border-color: #00ff9d; } .bet-option.selected .bet-option-label, .bet-option.selected .bet-option-odds { color: #000 !important; } .bet-option-label { font-size: 14px; color: #a0a8c9; margin-bottom: 8px; } .bet-option-odds { font-size: 28px; font-weight: 700; color: #00ff9d; } .amount-input-wrapper { display: flex; align-items: center; background: rgba(0, 0, 0, 0.5); border: 2px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 0 15px; margin: 15px 0; } .amount-input { flex: 1; padding: 18px 0; background: transparent; border: none; color: white; font-size: 20px; font-weight: 600; outline: none; } .quick-amounts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 15px 0; } .quick-amount { padding: 12px; background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; text-align: center; cursor: pointer; font-weight: 600; color: #a0a8c9; } .potential-win-box { background: linear-gradient(135deg, rgba(0, 255, 157, 0.1), rgba(255, 152, 0, 0.1)); padding: 20px; border-radius: 12px; margin: 20px 0; text-align: center; border: 1px solid rgba(0, 255, 157, 0.2); } .potential-value { font-size: 36px; font-weight: 700; color: #00ff9d; } .place-bet-btn { width: 100%; padding: 20px; background: linear-gradient(135deg, #00ff9d, #00cc7a); color: #000; border: none; border-radius: 12px; font-size: 20px; font-weight: 700; cursor: pointer; } .place-bet-btn:disabled { opacity: 0.5; cursor: not-allowed; background: #a0a8c9; } .balance-display { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(0, 0, 0, 0.3); border-radius: 10px; margin-bottom: 15px; } .balance-value { font-size: 22px; font-weight: 700; color: #00ff9d; } .countdown-value { font-size: 28px; font-weight: 700; color: #ff5252; text-align: center; }</style>
</head>
<body>
    <div class="container">
        <div class="page-header"><a href="upcoming-matches.html" class="back-btn"><i class="fas fa-arrow-left"></i></a><div class="page-title" id="page-title">Loading Match...</div></div>
        <div class="match-hero" id="match-hero"><div class="loading-spinner"><div class="spinner"></div><p>Loading match details...</p></div></div>
        <div id="countdown-section" style="display: none;"><div class="countdown-value" id="countdown-timer">--:--:--</div></div>
        <div class="betting-section" id="betting-section">
            <div class="balance-display"><span><i class="fas fa-wallet"></i> Your Balance</span><span class="balance-value" id="user-balance">$0.00</span></div>
            <div class="bet-options">
                <div class="bet-option" data-bet-type="home"><div class="bet-option-label">Home Win</div><div class="bet-option-odds" id="odds-home">2.00</div></div>
                <div class="bet-option" data-bet-type="draw"><div class="bet-option-label">Draw</div><div class="bet-option-odds" id="odds-draw">3.50</div></div>
                <div class="bet-option" data-bet-type="away"><div class="bet-option-label">Away Win</div><div class="bet-option-odds" id="odds-away">3.80</div></div>
            </div>
            <div class="amount-input-wrapper"><span>$</span><input type="number" class="amount-input" id="bet-amount" value="10" min="1" max="1000"></div>
            <div class="quick-amounts"><div class="quick-amount" data-amount="5">$5</div><div class="quick-amount" data-amount="10">$10</div><div class="quick-amount" data-amount="25">$25</div><div class="quick-amount" data-amount="50">$50</div></div>
            <div class="potential-win-box"><div>Potential Win</div><div class="potential-value" id="potential-win">$0.00</div></div>
            <div id="error-message" style="display: none; background: rgba(255,82,82,0.1); border: 1px solid #ff5252; border-radius: 10px; padding: 15px; margin-bottom: 15px; color: #ff5252;"></div>
            <div id="success-message" style="display: none; background: rgba(76,175,80,0.1); border: 1px solid #4caf50; border-radius: 10px; padding: 15px; margin-bottom: 15px; color: #4caf50;"></div>
            <button class="place-bet-btn" id="place-bet-btn" disabled><i class="fas fa-check"></i> Place Bet</button>
        </div>
        <div id="betting-closed" style="display: none; text-align: center; padding: 30px; background: rgba(255,82,82,0.1); border-radius: 15px; border: 2px solid #ff5252;"><i class="fas fa-times-circle" style="font-size: 48px; color: #ff5252;"></i><h3>Betting Closed</h3><p id="closed-reason"></p></div>
    </div>
    <script src="../js/proxy.js"></script>
    <script src="../js/sports-api.js"></script>
    <script src="../js/betting-engine.js"></script>
    <script src="../js/wallet.js"></script>
    <script>
        const firebaseConfig = { apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM", authDomain: "x-bet-prod-jd.firebaseapp.com", projectId: "x-bet-prod-jd", storageBucket: "x-bet-prod-jd.firebasestorage.app", messagingSenderId: "499334334535", appId: "1:499334334535:web:bebc1bf817e24d9e3c4962" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), db = firebase.firestore();
        let currentUser = null, currentMatch = null, selectedBetType = null, userBalance = 0, countdownInterval = null, unsubscribe = null;
        const urlParams = new URLSearchParams(window.location.search), fixtureId = urlParams.get('id');
        if (!fixtureId) window.location.href = 'upcoming-matches.html';
        auth.onAuthStateChanged(async (user) => { if (!user) { window.location.href = '../login.html'; return; } currentUser = user; await loadBalance(); loadMatchDetails(); });
        async function loadBalance() { try { const doc = await db.collection('wallets').doc(currentUser.uid).get(); if (doc.exists) { userBalance = doc.data().balance || 0; document.getElementById('user-balance').textContent = `$${userBalance.toFixed(2)}`; } } catch (error) { console.error('Error loading balance:', error); } }
        function loadMatchDetails() { unsubscribe = db.collection('sports_matches').doc(fixtureId).onSnapshot((doc) => { if (!doc.exists) { window.location.href = 'upcoming-matches.html'; return; } currentMatch = doc.data(); currentMatch.id = doc.id; displayMatchDetails(); checkBettingStatus(); }, (error) => { console.error('Error loading match:', error); }); }
        function displayMatchDetails() { const match = currentMatch; document.getElementById('page-title').textContent = `${match.homeTeam.name} vs ${match.awayTeam.name}`; document.getElementById('match-hero').innerHTML = `<div class="match-teams-large"><div class="team-large"><div class="team-large-logo">${match.homeTeam.name.substring(0, 3).toUpperCase()}</div><div class="team-large-name">${match.homeTeam.name}</div></div><div class="vs-large">VS</div><div class="team-large"><div class="team-large-logo">${match.awayTeam.name.substring(0, 3).toUpperCase()}</div><div class="team-large-name">${match.awayTeam.name}</div></div></div>`; document.getElementById('odds-home').textContent = match.odds?.home?.toFixed(2) || '2.00'; document.getElementById('odds-draw').textContent = match.odds?.draw?.toFixed(2) || '3.50'; document.getElementById('odds-away').textContent = match.odds?.away?.toFixed(2) || '3.80'; }
        function checkBettingStatus() { const bettingSection = document.getElementById('betting-section'), closedSection = document.getElementById('betting-closed'), countdownSection = document.getElementById('countdown-section'); if (currentMatch.status !== 'upcoming') { bettingSection.style.display = 'none'; closedSection.style.display = 'block'; document.getElementById('closed-reason').textContent = currentMatch.status === 'live' ? 'Match is currently in progress' : 'Match has finished'; return; } const now = new Date(), kickoff = currentMatch.startTime.toDate(), timeUntil = kickoff - now; if (timeUntil < 120000) { bettingSection.style.display = 'none'; closedSection.style.display = 'block'; document.getElementById('closed-reason').textContent = 'Betting closed - Too close to kickoff'; return; } bettingSection.style.display = 'block'; closedSection.style.display = 'none'; countdownSection.style.display = 'block'; startCountdown(kickoff); }
        function startCountdown(kickoff) { if (countdownInterval) clearInterval(countdownInterval); const timer = document.getElementById('countdown-timer'); countdownInterval = setInterval(() => { const diff = kickoff - new Date(); if (diff <= 0) { clearInterval(countdownInterval); timer.textContent = '00:00:00'; checkBettingStatus(); return; } const h = Math.floor(diff / 3600000), m = Math.floor((diff % 3600000) / 60000), s = Math.floor((diff % 60000) / 1000); timer.textContent = `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`; }, 1000); }
        document.addEventListener('DOMContentLoaded', () => { document.querySelectorAll('.bet-option').forEach(o => o.addEventListener('click', () => { document.querySelectorAll('.bet-option').forEach(x => x.classList.remove('selected')); o.classList.add('selected'); selectedBetType = o.dataset.betType; document.getElementById('place-bet-btn').disabled = false; updatePotentialWin(); })); document.querySelectorAll('.quick-amount').forEach(b => b.addEventListener('click', () => { document.getElementById('bet-amount').value = b.dataset.amount; updatePotentialWin(); })); document.getElementById('bet-amount').addEventListener('input', updatePotentialWin); document.getElementById('place-bet-btn').addEventListener('click', placeBet); });
        function updatePotentialWin() { if (!selectedBetType || !currentMatch) return; const amount = parseFloat(document.getElementById('bet-amount').value) || 0, odds = currentMatch.odds[selectedBetType]; document.getElementById('potential-win').textContent = `$${(amount * odds).toFixed(2)}`; const btn = document.getElementById('place-bet-btn'), err = document.getElementById('error-message'); if (amount > userBalance) { btn.disabled = true; err.style.display = 'block'; err.innerHTML = '<i class="fas fa-exclamation-circle"></i> Insufficient balance'; } else if (amount < 1) { btn.disabled = true; err.style.display = 'block'; err.innerHTML = '<i class="fas fa-exclamation-circle"></i> Minimum bet is $1'; } else { btn.disabled = false; err.style.display = 'none'; } }
        async function placeBet() { const amount = parseFloat(document.getElementById('bet-amount').value), btn = document.getElementById('place-bet-btn'), err = document.getElementById('error-message'), suc = document.getElementById('success-message'); if (!selectedBetType) { err.style.display = 'block'; err.innerHTML = '<i class="fas fa-exclamation-circle"></i> Select a bet type'; return; } btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...'; try { const result = await placeBet(parseInt(fixtureId), selectedBetType, amount); if (result.success) { suc.style.display = 'block'; suc.innerHTML = `<i class="fas fa-check-circle"></i> ${result.message}`; await loadBalance(); setTimeout(() => window.location.href = 'my-bets.html', 2000); } else { err.style.display = 'block'; err.innerHTML = `<i class="fas fa-exclamation-circle"></i> ${result.error}`; btn.disabled = false; btn.innerHTML = '<i class="fas fa-check"></i> Place Bet'; } } catch (e) { err.style.display = 'block'; err.innerHTML = '<i class="fas fa-exclamation-circle"></i> Error placing bet'; btn.disabled = false; btn.innerHTML = '<i class="fas fa-check"></i> Place Bet'; } }
        window.addEventListener('beforeunload', () => { if (countdownInterval) clearInterval(countdownInterval); if (unsubscribe) unsubscribe(); });
    </script>
</body>
</html>
