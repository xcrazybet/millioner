    <script>
        // ============================================
        // MATCH DETAILS - FULL BETTING TYPES v3.0
        // 13 Categories | 70+ Bet Types

        // ============================================
        
        // Supabase Configuration
        const SUPABASE_URL = 'https://jnazybaeajyynpyoszmy.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpuYXp5YmFlYWp5eW5weW9zem15Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyNzgwMDMsImV4cCI6MjA5Mjg1NDAwM30.P_8V-_s6DQDiYekZX1yaNup48WBRaLhb3ILAkvzTDTY';
        
        let supabaseClient = null;
        try {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            console.log('✅ Supabase initialized');
        } catch(e) {
            console.error('Failed to initialize Supabase:', e);
        }
        
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        
        const db = firebase.firestore();
        const auth = firebase.auth();
        
        // Constants
        const BETTING_CLOSE_MINUTE = 80;
        
        // Get fixture ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const fixtureId = urlParams.get('id');
        document.getElementById('fixture-id-display').textContent = fixtureId || 'Not provided';
        
        const API_BASE = 'https://millioner.onrender.com';
        
        // ===== ACCUMULATOR SLIP =====
        let accumulatorSlip = [];
        
        // ===== FIREBASE WALLET FUNCTIONS =====
        async function getWalletBalance(userId) {
            try {
                const doc = await db.collection('wallets').doc(userId).get();
                if (doc.exists) {
                    return doc.data().balance || 0;
                } else {
                    await db.collection('wallets').doc(userId).set({
                        balance: 1000,
                        created_at: new Date().toISOString(),
                        updated_at: new Date().toISOString()
                    });
                    return 1000;
                }
            } catch(e) {
                console.error('Error getting balance:', e);
                return 0;
            }
        }
        
        async function deductBalance(userId, amount, betId) {
            const walletRef = db.collection('wallets').doc(userId);
            try {
                const result = await db.runTransaction(async (transaction) => {
                    const doc = await transaction.get(walletRef);
                    const currentBalance = doc.exists ? doc.data().balance : 0;
                    const newBalance = currentBalance - amount;
                    
                    if (newBalance < 0) throw new Error('Insufficient balance');
                    
                    transaction.update(walletRef, {
                        balance: newBalance,
                        updated_at: new Date().toISOString()
                    });
                    
                    const txRef = db.collection('transactions').doc();
                    transaction.set(txRef, {
                        user_id: userId,
                        amount: -amount,
                        type: 'bet_place',
                        bet_id: betId,
                        balance_before: currentBalance,
                        balance_after: newBalance,
                        timestamp: new Date().toISOString()
                    });
                    
                    return newBalance;
                });
                return result;
            } catch(e) {
                console.error('Balance deduct error:', e);
                throw e;
            }
        }
        
        // ===== FETCH MATCH FROM API =====
        async function fetchMatchFromAPI(fixtureId) {
            try {
                console.log(`Fetching match ${fixtureId} directly from API...`);
                const response = await fetch(`${API_BASE}/api/fixture/${fixtureId}`);
                const data = await response.json();
                
                if (data.success && data.fixture) {
                    const statusShort = data.fixture.status?.short;
                    const isLive = statusShort === '1H' || statusShort === '2H' || statusShort === 'HT';
                    const isFinished = statusShort === 'FT' || statusShort === 'AET' || statusShort === 'PEN';
                    
                    let status = 'upcoming';
                    if (isLive) status = 'live';
                    else if (isFinished) status = 'finished';
                    
                    const matchDate = new Date(data.fixture.date);
                    const now = new Date();
                    if (!isLive && !isFinished && matchDate > now) {
                        status = 'upcoming';
                    }
                    
                    return {
                        fixture_id: data.fixture.id,
                        status: status,
                        result: null,
                        odds: {
                            home: (1.80 + ((data.fixture.id % 20) / 100)).toFixed(2),
                            draw: (3.20 + ((data.fixture.id % 15) / 100)).toFixed(2),
                            away: (2.80 + ((data.fixture.id % 25) / 100)).toFixed(2)
                        },
                        league_id: data.league?.id || 0,
                        league_name: data.league?.name || 'Unknown League',
                        league_logo: data.league?.logo || '',
                        home_team: {
                            id: data.teams?.home?.id || 0,
                            name: data.teams?.home?.name || 'Home',
                            logo: data.teams?.home?.logo || ''
                        },
                        away_team: {
                            id: data.teams?.away?.id || 0,
                            name: data.teams?.away?.name || 'Away',
                            logo: data.teams?.away?.logo || ''
                        },
                        start_time: data.fixture.date,
                        score: { home: data.goals?.home || 0, away: data.goals?.away || 0 },
                        elapsed: data.fixture.status?.elapsed || 0,
                        bets_closed: false
                    };
                }
                return null;
            } catch(e) {
                console.error('API fetch error:', e);
                return null;
            }
        }
        
        async function getMatch(fixtureId) {
            if (supabaseClient) {
                try {
                    const { data, error } = await supabaseClient
                        .from('sports_matches')
                        .select('*')
                        .eq('fixture_id', parseInt(fixtureId))
                        .maybeSingle();
                    
                    if (!error && data) {
                        console.log('Match found in Supabase:', data);
                        return data;
                    }
                } catch(e) {
                    console.log('Supabase query error, trying API...', e.message);
                }
            }
            
            const apiMatch = await fetchMatchFromAPI(fixtureId);
            if (apiMatch) {
                if (supabaseClient) {
                    try {
                        await supabaseClient
                            .from('sports_matches')
                            .upsert(apiMatch, { onConflict: 'fixture_id' });
                        console.log('Match saved to Supabase');
                    } catch(e) {
                        console.log('Could not save to Supabase:', e);
                    }
                }
                return apiMatch;
            }
            
            throw new Error('Match not found');
        }
        
        // ===== PLACE SINGLE BET =====
        async function placeBet(betData) {
            const user = auth.currentUser;
            if (!user) throw new Error('Not authenticated');
            
            const match = await getMatch(betData.fixture_id);
            if (!match) throw new Error('Match not found');
            
            if (match.status === 'finished') {
                throw new Error('🔒 Match already finished - Cannot place bets');
            }
            
            if (match.status === 'live') {
                const elapsed = match.elapsed || 0;
                if (elapsed >= BETTING_CLOSE_MINUTE) {
                    throw new Error(`🔒 Betting closed - Match has reached ${elapsed}' minute (closes at ${BETTING_CLOSE_MINUTE}')`);
                }
                if (match.bets_closed) {
                    throw new Error('🔒 Betting closed for this match');
                }
            }
            
            if (match.status === 'upcoming') {
                const now = new Date();
                const matchTime = new Date(match.start_time);
                if (now >= matchTime) {
                    throw new Error('⚠️ Match has already started - Please refresh the page');
                }
            }
            
            const balance = await getWalletBalance(user.uid);
            if (balance < betData.amount) throw new Error(`Insufficient balance! Your balance: $${balance.toFixed(2)}`);
            
            const bet = {
                id: `${Date.now()}_${Math.random().toString(36).substr(2, 9)}`,
                user_id: user.uid,
                fixture_id: betData.fixture_id,
                bet_type: betData.bet_type,
                bet_name: betData.bet_name,
                odds: betData.odds,
                amount: betData.amount,
                potential_win: betData.amount * betData.odds,
                status: 'active',
                placed_at: new Date().toISOString(),
                match_status_at_bet: match.status,
                match_score_at_bet: match.score || { home: 0, away: 0 },
                match_elapsed_at_bet: match.elapsed || 0
            };
            
            await deductBalance(user.uid, betData.amount, bet.id);
            
            if (supabaseClient) {
                const { error } = await supabaseClient.from('bets').insert(bet);
                if (error) throw error;
            }
            
            return bet;
        }
        
        // ===== PLACE ACCUMULATOR BET =====
        async function placeAccumulatorBet() {
            if (accumulatorSlip.length < 2) {
                showNotification(`Add at least 2 selections (currently ${accumulatorSlip.length})`, 'error');
                return;
            }
            
            const stake = parseFloat(document.getElementById('cart-stake').value);
            if (!stake || stake < 1) {
                showNotification('Please enter a valid stake amount (minimum $1)', 'error');
                return;
            }
            
            const user = auth.currentUser;
            if (!user) {
                showNotification('Please login', 'error');
                window.location.href = '../login.html';
                return;
            }
            
            const balance = await getWalletBalance(user.uid);
            if (stake > balance) {
                showNotification(`Insufficient balance! Your balance: $${balance.toFixed(2)}`, 'error');
                return;
            }
            
            let totalOdds = 1;
            accumulatorSlip.forEach(s => totalOdds *= s.odds);
            const potentialWin = stake * totalOdds;
            
            if (!confirm(`Place accumulator bet?\nSelections: ${accumulatorSlip.length}\nTotal Odds: ${totalOdds.toFixed(2)}\nStake: $${stake.toFixed(2)}\nPotential Win: $${potentialWin.toFixed(2)}`)) {
                return;
            }
            
            const btn = document.getElementById('cart-place-btn');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<div class="loading-spinner"></div> Processing...';
            
            try {
                const betId = Date.now();
                const bet = {
                    id: betId,
                    user_id: user.uid,
                    fixture_id: null,
                    bet_type: 'accumulator',
                    bet_name: `${accumulatorSlip.length}-fold Accumulator`,
                    odds: totalOdds,
                    amount: stake,
                    potential_win: potentialWin,
                    status: 'active',
                    placed_at: new Date().toISOString(),
                    selections: accumulatorSlip
                };
                
                if (supabaseClient) {
                    const { error } = await supabaseClient.from('bets').insert(bet);
                    if (error) throw new Error(error.message);
                }
                
                await deductBalance(user.uid, stake, betId);
                
                showNotification(`✅ Accumulator bet placed! Potential win: $${potentialWin.toFixed(2)}`, 'success');
                
                accumulatorSlip = [];
                updateCartUI();
                toggleCart();
                await updateBalanceDisplay();
                
                setTimeout(() => {
                    if (confirm('View your active bets?')) {
                        window.location.href = 'my-bets.html';
                    }
                }, 1000);
                
            } catch(e) {
                console.error('Bet error:', e);
                showNotification(`Failed to place bet: ${e.message}`, 'error');
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        // ===== BETTING COUNTDOWN =====
        function startBettingCountdown() {
            if (bettingCountdownInterval) clearInterval(bettingCountdownInterval);
            
            if (currentMatch && currentMatch.status === 'live') {
                const bettingCountdownEl = document.getElementById('betting-countdown');
                bettingCountdownEl.style.display = 'block';
                
                function updateCountdown() {
                    const elapsed = currentMatch.elapsed || 0;
                    const remainingForBetting = Math.max(0, BETTING_CLOSE_MINUTE - elapsed);
                    
                    if (elapsed >= BETTING_CLOSE_MINUTE) {
                        bettingCountdownEl.innerHTML = `<i class="fas fa-ban"></i> Betting Closed - Match at ${elapsed}' (closes at ${BETTING_CLOSE_MINUTE}')`;
                        bettingCountdownEl.style.color = '#ff5252';
                        bettingCountdownEl.style.fontWeight = 'bold';
                        document.getElementById('place-bet-btn').disabled = true;
                        document.getElementById('add-to-slip-btn').disabled = true;
                        document.querySelectorAll('.bet-option').forEach(opt => opt.classList.add('disabled'));
                    } else {
                        bettingCountdownEl.innerHTML = `<i class="fas fa-clock"></i> Betting Open for ${remainingForBetting} more minutes (closes at ${BETTING_CLOSE_MINUTE}')`;
                        bettingCountdownEl.style.color = remainingForBetting <= 5 ? '#ff9800' : '#00ff9d';
                        bettingCountdownEl.style.fontWeight = 'normal';
                    }
                }
                
                updateCountdown();
                bettingCountdownInterval = setInterval(updateCountdown, 1000);
            } else {
                const bettingCountdownEl = document.getElementById('betting-countdown');
                bettingCountdownEl.style.display = 'none';
            }
        }
        
        // ===== LIVE TIMER =====
        function startLiveTimer() {
            if (liveTimerInterval) clearInterval(liveTimerInterval);
            
            if (currentMatch && currentMatch.status === 'live') {
                const timerEl = document.getElementById('live-timer');
                timerEl.style.display = 'block';
                
                function updateTimer() {
                    const elapsed = currentMatch.elapsed || 0;
                    let period = '';
                    let displayElapsed = elapsed;
                    
                    if (elapsed < 45) {
                        period = '1st Half';
                        displayElapsed = elapsed;
                    } else if (elapsed < 60) {
                        period = 'Half Time';
                        displayElapsed = 0;
                    } else if (elapsed < 90) {
                        period = '2nd Half';
                        displayElapsed = elapsed - 45;
                    } else {
                        period = 'Added Time';
                        displayElapsed = elapsed - 90;
                    }
                    
                    if (period === 'Half Time') {
                        timerEl.innerHTML = `<i class="fas fa-pause-circle"></i> ${period}`;
                        timerEl.style.color = '#ff9800';
                    } else {
                        timerEl.innerHTML = `<i class="fas fa-clock"></i> ${period}: ${displayElapsed}'`;
                        timerEl.style.color = elapsed >= 80 ? '#ff5252' : '#ff9800';
                    }
                }
                
                updateTimer();
                liveTimerInterval = setInterval(updateTimer, 1000);
            } else {
                const timerEl = document.getElementById('live-timer');
                timerEl.style.display = 'none';
            }
        }
        
        // ===== COUNTDOWN FOR UPCOMING =====
        function startCountdown() {
            if (countdownInterval) clearInterval(countdownInterval);
            const countdownEl = document.getElementById('countdown-timer');
            
            if (currentMatch && currentMatch.status === 'upcoming') {
                const matchTime = new Date(currentMatch.start_time);
                
                function update() {
                    const now = new Date();
                    const diff = matchTime - now;
                    
                    if (diff <= 0) {
                        countdownEl.innerHTML = '<span style="color:#00ff9d;"><i class="fas fa-play"></i> Match Started! Refreshing...</span>';
                        setTimeout(() => location.reload(), 3000);
                        return;
                    }
                    
                    const hours = Math.floor(diff / 3600000);
                    const minutes = Math.floor((diff % 3600000) / 60000);
                    const seconds = Math.floor((diff % 60000) / 1000);
                    
                    let display = '';
                    if (hours > 0) {
                        display = `${hours}h ${minutes}m ${seconds}s`;
                    } else if (minutes > 0) {
                        display = `${minutes}m ${seconds}s`;
                    } else {
                        display = `${seconds}s`;
                    }
                    
                    countdownEl.innerHTML = `<i class="fas fa-hourglass-half"></i> Match starts in: ${display}`;
                    
                    if (minutes < 5 && hours === 0) {
                        countdownEl.style.color = '#ff9800';
                        countdownEl.style.fontWeight = 'bold';
                    } else {
                        countdownEl.style.color = '#a0a8c9';
                        countdownEl.style.fontWeight = 'normal';
                    }
                }
                
                update();
                countdownInterval = setInterval(update, 1000);
            } else {
                countdownEl.innerHTML = '';
            }
        }

        function renderBetOptions() {

                try { odds = JSON.parse(odds); } catch(e) { odds = { home: 2.50, draw: 3.20, away: 2.80 }; }
            }
            odds = odds || { home: 2.50, draw: 3.20, away: 2.80 };
            
            const betTypes = BET_TYPES[currentTab] || BET_TYPES['1x2'];
            let html = '<div class="bet-options">';

                } else {
                    finalOdds = generateOdds(odds, bet.type);
                }
                
                html += `
                    <div class="bet-option" data-type="${bet.type}" data-odds="${finalOdds}" data-name="${bet.name}">
                        <div class="bet-option-name">${bet.name}</div>

            document.querySelectorAll('.bet-option').forEach(opt => {
                if (isBettingDisabled) {
                    opt.classList.add('disabled');

                opt.addEventListener('click', function() {
                    if (isBettingDisabled) {
                        showError('Betting is currently closed for this match');
                        return;
                    }
                    document.querySelectorAll('.bet-option').forEach(o => o.classList.remove('selected'));
                    this.classList.add('selected');
                    selectedBet = {

                        name: this.dataset.name,
                        odds: parseFloat(this.dataset.odds)
                    };

                    document.getElementById('potential-win').textContent = `$${(amount * selectedOdds).toFixed(2)}`;

                    document.getElementById('add-to-slip-btn').disabled = false;

                    document.getElementById('add-to-slip-btn').style.background = '#ff9800';

        function checkIfBettingDisabled() {
            if (!currentMatch) return true;
            if (currentMatch.status === 'finished') return true;
            if (currentMatch.status === 'live') {
                const elapsed = currentMatch.elapsed || 0;
                if (elapsed >= BETTING_CLOSE_MINUTE) return true;
                if (currentMatch.bets_closed) return true;
            }
            return false;
        }
        
        function checkBettingAvailability() {
            if (!currentMatch) return;
            
            const isLive = currentMatch.status === 'live';
            const isUpcoming = currentMatch.status === 'upcoming';
            const isFinished = currentMatch.status === 'finished';
            const elapsed = currentMatch.elapsed || 0;
            
            let message = '';
            let messageClass = '';
            let bettingEnabled = true;
            
            if (isFinished) {
                message = '🔒 Match finished - Betting closed';
                messageClass = 'betting-closed';
                bettingEnabled = false;
            } else if (isLive) {
                if (elapsed >= BETTING_CLOSE_MINUTE) {
                    message = `🔒 Betting closed - Match at ${elapsed}' minute (closes at ${BETTING_CLOSE_MINUTE}')`;
                    messageClass = 'betting-closed';
                    bettingEnabled = false;
                } else {
                    const remaining = BETTING_CLOSE_MINUTE - elapsed;
                    message = `🟢 LIVE - Betting OPEN! ${remaining} minutes remaining to bet (closes at ${BETTING_CLOSE_MINUTE}')`;
                    messageClass = 'betting-open';
                    bettingEnabled = true;
                }
            } else if (isUpcoming) {
                const now = new Date();
                const matchTime = new Date(currentMatch.start_time);
                const minutesUntilMatch = Math.floor((matchTime - now) / 60000);
                
                message = `🟢 UPCOMING - Betting OPEN! Place your bets now${minutesUntilMatch > 0 ? ' (' + minutesUntilMatch + ' minutes until kickoff)' : ' (match starting soon)'}`;
                messageClass = 'betting-open';
                bettingEnabled = true;
            }
            
            const infoDiv = document.getElementById('betting-info');
            infoDiv.innerHTML = `<i class="fas fa-info-circle"></i> ${message}`;
            infoDiv.className = `info-note ${messageClass}`;
            
            if (!bettingEnabled) {
                document.getElementById('place-bet-btn').disabled = true;
                document.getElementById('place-bet-btn').innerHTML = 'Betting Closed';
                document.getElementById('add-to-slip-btn').disabled = true;
                document.querySelectorAll('.bet-option').forEach(opt => opt.classList.add('disabled'));
            } else {
                document.getElementById('add-to-slip-btn').disabled = true;
                document.getElementById('add-to-slip-btn').textContent = 'Select an outcome first';
            }
        }
        
        function startAutoRefresh() {
            if (refreshInterval) clearInterval(refreshInterval);
            refreshInterval = setInterval(async () => {
                if (currentMatch && currentMatch.status === 'live') {
                    try {
                        const freshMatch = await getMatch(fixtureId);
                        if (freshMatch) {
                            const oldElapsed = currentMatch.elapsed;
                            currentMatch = freshMatch;
                            renderMatchDetails();
                            checkBettingAvailability();
                            if (currentMatch.odds) {
                                renderBetOptions();
                            }
                            if (oldElapsed !== currentMatch.elapsed) {
                                startLiveTimer();
                                startBettingCountdown();
                            }
                        }
                        await updateBalanceDisplay();
                    } catch(e) { console.error('Refresh error:', e); }
                }
            }, 15000);
        }

        // ===== PLACE SINGLE BET HANDLER =====
        async function placeBetHandler() {
            if (!selectedBet) { showError('Select an outcome'); return; }
            
            const amount = parseFloat(document.getElementById('bet-amount').value);
            if (isNaN(amount) || amount < 1) { showError('Minimum bet is $1'); return; }
            if (amount > 1000) { showError('Maximum bet is $1000 per transaction'); return; }
            
            const user = auth.currentUser;
            if (!user) { 
                showError('Please login to place bets');
                setTimeout(() => { window.location.href = '../login.html'; }, 2000);
                return; 
            }
            
            const balance = await getWalletBalance(user.uid);
            if (amount > balance) { showError(`Insufficient balance! Your balance: $${balance.toFixed(2)}`); return; }
            
            if (!confirm(`Confirm bet:\n\n${selectedBet.name}\nOdds: ${selectedOdds}\nAmount: $${amount}\nPotential Win: $${(amount * selectedOdds).toFixed(2)}`)) {
                return;
            }
            
            const btn = document.getElementById('place-bet-btn');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<div class="loading-spinner"></div> Processing...';
            
            try {
                const bet = await placeBet({
                    fixture_id: parseInt(fixtureId),
                    bet_type: selectedBet.type,
                    bet_name: selectedBet.name,
                    odds: selectedOdds,
                    amount: amount
                });
                
                await updateBalanceDisplay();
                showNotification(`✅ Bet placed! Potential win: $${(amount * selectedOdds).toFixed(2)}`);
                showSuccess(`✅ Bet placed successfully! Potential win: $${(amount * selectedOdds).toFixed(2)}`);
                
                selectedBet = null;
                selectedOdds = null;
                document.getElementById('bet-amount').value = '10';
                document.getElementById('potential-win').textContent = '$0.00';
                document.querySelectorAll('.bet-option').forEach(o => o.classList.remove('selected'));
                btn.disabled = true;
                btn.innerHTML = 'Select Outcome';
                document.getElementById('add-to-slip-btn').disabled = true;
                document.getElementById('add-to-slip-btn').textContent = 'Select an outcome first';
                
                setTimeout(() => {
                    if (confirm('Bet placed successfully! View your active bets?')) {
                        window.location.href = 'my-bets.html';
                    }
                }, 1000);
                
            } catch(e) {
                console.error('Bet error:', e);
                showError(e.message);
                showNotification(e.message, 'error');
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        }

                document.getElementById('place-bet-btn').disabled = true;
                document.getElementById('add-to-slip-btn').disabled = true;
                
                let retries = 0;
                const maxRetries = 10;
                const checkAuth = setInterval(() => {
                    retries++;
                    if (auth.currentUser) {
                        clearInterval(checkAuth);
                        updateBalanceDisplay();
                        loadMatch();
                    } else if (retries >= maxRetries) {
                        clearInterval(checkAuth);
                        console.log('❌ Auth timeout, redirecting to login');
                        window.location.href = '../login.html';
                    }
                }, 500);
            }
        });
        
        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (refreshInterval) clearInterval(refreshInterval);
            if (liveTimerInterval) clearInterval(liveTimerInterval);
            if (bettingCountdownInterval) clearInterval(bettingCountdownInterval);
            if (countdownInterval) clearInterval(countdownInterval);
        });
        
        // Expose global functions
        window.goBack = goBack;
        window.toggleLanguage = toggleLanguage;
        window.toggleCart = toggleCart;
        window.removeFromSlip = removeFromSlip;
        window.placeAccumulatorBet = placeAccumulatorBet;
        window.addToSlipFromMatch = addToSlipFromMatch;
        window.placeBetHandler = placeBetHandler;
        window.addToSlipHandler = addToSlipHandler;
        
        console.log('✅ Match details page loaded with CARD MARKETS!');
        console.log('   13 Categories | 70+ Bet Types');
        console.log('   NEW: Total Cards, Yellow Cards, Red Cards, Team Cards, First Card');
        console.log('   Fixture ID:', fixtureId);
    </script>
</body>
