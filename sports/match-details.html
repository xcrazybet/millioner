<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Match Details - X Lodon | تفاصيل المباراة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <link rel="stylesheet" href="../css/sports-betting.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0f1a; color: white; font-family: 'Segoe UI', 'Tajawal', sans-serif; min-height: 100vh; }
        .header { background: #111827; padding: 12px 15px; border-bottom: 2px solid #00ff9d; display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        .back-btn { color: #00ff9d; text-decoration: none; font-size: 20px; }
        .lang-toggle { background: #1a2332; border: 1px solid #00ff9d; color: #00ff9d; padding: 5px 12px; border-radius: 20px; cursor: pointer; margin-left: auto; }
        .container { max-width: 1000px; margin: 0 auto; padding: 15px; padding-bottom: 100px; }
        .balance-bar { background: #111827; padding: 10px 15px; border-radius: 12px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #00ff9d33; }
        .match-hero { background: linear-gradient(135deg, #111827, #1a2332); border-radius: 20px; padding: 25px 15px; margin-bottom: 20px; text-align: center; border: 1px solid #00ff9d33; }
        .teams-large { display: flex; align-items: center; justify-content: center; gap: 15px; flex-wrap: wrap; }
        .team-logo-lg { width: 80px; height: 80px; object-fit: contain; border-radius: 50%; background: rgba(255,255,255,0.1); padding: 10px; }
        .team-name-lg { font-size: 20px; font-weight: bold; margin-top: 10px; }
        .vs-large { font-size: 24px; color: #ff9800; font-weight: bold; margin: 0 20px; }
        .match-info { margin-top: 15px; color: #a0a8c9; font-size: 14px; display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
        .match-status { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .match-status.upcoming { background: #00ff9d22; color: #00ff9d; }
        .match-status.live { background: #ff5252; color: white; animation: pulse 1s infinite; }
        .match-status.finished { background: #a0a8c9; color: black; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.7; } }
        .bet-type-tabs { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px; flex-wrap: wrap; }
        .bet-type-tab { padding: 10px 16px; background: #1a2332; border: none; border-radius: 25px; color: white; font-size: 13px; cursor: pointer; white-space: nowrap; transition: all 0.2s; }
        .bet-type-tab.active { background: #00ff9d; color: black; }
        .bet-type-tab:hover { background: #00ff9d44; }
        .bet-section { background: #111827; border-radius: 20px; padding: 20px; margin-bottom: 20px; }
        .bet-options { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .bet-option { background: #1a2332; border: 2px solid transparent; border-radius: 12px; padding: 15px; text-align: center; cursor: pointer; transition: all 0.2s; }
        .bet-option:hover { background: #00ff9d22; border-color: #00ff9d; transform: scale(1.02); }
        .bet-option.selected { background: #00ff9d; border-color: #00ff9d; color: black; }
        .bet-option-name { font-size: 14px; margin-bottom: 5px; }
        .bet-option-odds { font-size: 22px; font-weight: bold; }
        .bet-option-odds small { font-size: 11px; font-weight: normal; }
        .bet-option.selected .bet-option-odds { color: black; }
        .amount-input { width: 100%; padding: 15px; background: #0a0f1a; border: 2px solid #ffffff22; border-radius: 12px; color: white; font-size: 20px; margin-bottom: 15px; text-align: center; }
        .quick-amounts { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin-bottom: 20px; }
        .quick-amount { padding: 12px; background: #1a2332; border-radius: 10px; text-align: center; cursor: pointer; font-weight: bold; transition: all 0.2s; }
        .quick-amount:hover { background: #00ff9d; color: black; transform: scale(1.02); }
        .potential-box { background: linear-gradient(135deg, #00ff9d11, #ff980011); padding: 15px; border-radius: 12px; text-align: center; margin-bottom: 20px; }
        .potential-value { font-size: 32px; font-weight: bold; color: #00ff9d; }
        .place-btn { width: 100%; padding: 18px; background: #00ff9d; color: black; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; transition: all 0.2s; }
        .place-btn:hover { transform: scale(1.02); background: #00cc7d; }
        .place-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .place-btn.betting-closed { background: #a0a8c9; cursor: not-allowed; }
        .error-msg { background: #ff525222; border: 1px solid #ff5252; border-radius: 10px; padding: 12px; margin-bottom: 15px; color: #ff5252; display: none; }
        .success-msg { background: #4caf5022; border: 1px solid #4caf50; border-radius: 10px; padding: 12px; margin-bottom: 15px; color: #4caf50; display: none; }
        .countdown-timer { text-align: center; margin-top: 10px; font-size: 14px; color: #ff9800; padding: 8px; background: #1a2332; border-radius: 8px; }
        .info-note { font-size: 11px; color: #a0a8c9; text-align: center; margin-top: 15px; }
        .loading-spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid #00ff9d; border-top-color: transparent; border-radius: 50%; animation: spin 0.6s linear infinite; margin-right: 10px; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .betting-closed-badge { background: #ff5252; color: white; padding: 4px 12px; border-radius: 20px; font-size: 12px; margin-left: 10px; }
        @media (max-width: 600px) {
            .team-logo-lg { width: 50px; height: 50px; }
            .team-name-lg { font-size: 14px; }
            .vs-large { font-size: 18px; margin: 0 10px; }
            .bet-options { grid-template-columns: repeat(2, 1fr); }
            .quick-amounts { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="upcoming-matches.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        <h1 style="font-size:18px;"><i class="fas fa-futbol"></i> Match Details</h1>
        <button class="lang-toggle" onclick="toggleLanguage()">عربي</button>
    </div>
    
    <div class="container">
        <div class="balance-bar">
            <span><i class="fas fa-wallet"></i> Balance</span>
            <span style="color:#00ff9d;font-weight:bold;font-size:18px;" id="balance-display">$0.00</span>
        </div>
        
        <div id="loading" style="text-align:center;padding:40px;"><div class="loading-spinner"></div> Loading match details...</div>
        <div id="content" style="display:none;">
            <div class="match-hero" id="match-hero"></div>
            <div class="countdown-timer" id="countdown-timer"></div>
            
            <div class="bet-type-tabs" id="bet-tabs">
                <button class="bet-type-tab active" data-tab="1x2">🏆 1X2</button>
                <button class="bet-type-tab" data-tab="double">🔄 Double Chance</button>
                <button class="bet-type-tab" data-tab="overunder">⚽ Over/Under</button>
                <button class="bet-type-tab" data-tab="btts">🤝 BTTS</button>
                <button class="bet-type-tab" data-tab="handicap">🎯 Handicap</button>
                <button class="bet-type-tab" data-tab="corners">⛳ Corners</button>
                <button class="bet-type-tab" data-tab="cards">🟨 Cards</button>
                <button class="bet-type-tab" data-tab="htft">⏱️ HT/FT</button>
                <button class="bet-type-tab" data-tab="firstgoal">🥇 First Goal</button>
            </div>
            
            <div class="bet-section">
                <div id="bet-options-container"></div>
                <input type="number" class="amount-input" id="bet-amount" value="10" min="1" step="1">
                <div class="quick-amounts">
                    <div class="quick-amount" data-amount="5">$5</div>
                    <div class="quick-amount" data-amount="10">$10</div>
                    <div class="quick-amount" data-amount="25">$25</div>
                    <div class="quick-amount" data-amount="50">$50</div>
                    <div class="quick-amount" data-amount="100">$100</div>
                    <div class="quick-amount" data-amount="500">$500</div>
                </div>
                <div class="potential-box">
                    <div>Potential Win</div>
                    <div class="potential-value" id="potential-win">$0.00</div>
                </div>
                <div class="error-msg" id="error-message"></div>
                <div class="success-msg" id="success-message"></div>
                <button class="place-btn" id="place-bet-btn" disabled>Select Outcome</button>
                <div class="info-note"><i class="fas fa-info-circle"></i> Betting closes when match starts or at 80' minute for live matches</div>
            </div>
        </div>
    </div>

    <script src="../js/supabase-client.js"></script>
    <script src="../js/betting-engine.js"></script>
    <script>
        let currentMatch = null;
        let selectedBet = null;
        let selectedBetName = null;
        let selectedOdds = null;
        let currentTab = '1x2';
        let countdownInterval = null;
        let isBettingAllowed = true;
        
        // Get fixture ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const fixtureId = urlParams.get('id');
        
        // Check for pre-selected bet from upcoming page
        const preSelectedBet = sessionStorage.getItem('selectedBet');
        if (preSelectedBet) {
            const bet = JSON.parse(preSelectedBet);
            sessionStorage.removeItem('selectedBet');
            selectedBet = bet.betType;
            selectedOdds = bet.odds;
            selectedBetName = bet.betType === 'home' ? 'Home Win' : (bet.betType === 'draw' ? 'Draw' : 'Away Win');
        }
        
        function toggleLanguage() {
            const isArabic = document.body.classList.toggle('arabic');
            localStorage.setItem('lang', isArabic ? 'ar' : 'en');
            document.documentElement.dir = isArabic ? 'rtl' : 'ltr';
        }
        if (localStorage.getItem('lang') === 'ar') toggleLanguage();
        
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        
        if (!fixtureId) {
            document.getElementById('loading').innerHTML = '<div style="color:#ff5252;">No match selected</div>';
        }
        
        firebase.auth().onAuthStateChanged(async (u) => {
            if (!u) {
                location.href = '../login.html';
                return;
            }
            await loadBalance();
            if (fixtureId) await loadMatch();
        });
        
        async function loadBalance() {
            try {
                const db = firebase.firestore();
                const doc = await db.collection('wallets').doc(firebase.auth().currentUser.uid).get();
                const balance = doc.exists ? (doc.data().balance || 0) : 0;
                document.getElementById('balance-display').textContent = `$${balance.toFixed(2)}`;
            } catch(e) { console.error(e); }
        }
        
        async function loadMatch() {
            if (!window.supaDB) return;
            
            try {
                const match = await window.supaDB.getMatch(parseInt(fixtureId));
                if (!match) {
                    document.getElementById('loading').innerHTML = '<div style="color:#ff5252;text-align:center;padding:40px;">Match not found</div>';
                    return;
                }
                
                currentMatch = match;
                
                // Check betting eligibility
                const now = new Date();
                const matchTime = new Date(match.start_time);
                const isLive = match.status === 'live';
                let elapsedMinutes = 0;
                
                if (isLive) {
                    elapsedMinutes = Math.floor((now - matchTime) / 60000);
                    if (elapsedMinutes >= 80) {
                        isBettingAllowed = false;
                        document.getElementById('place-bet-btn').classList.add('betting-closed');
                        document.getElementById('place-bet-btn').innerHTML = '🔒 Betting Closed (Match in final minutes)';
                    }
                } else if (matchTime <= now) {
                    isBettingAllowed = false;
                    document.getElementById('place-bet-btn').classList.add('betting-closed');
                    document.getElementById('place-bet-btn').innerHTML = '🔒 Betting Closed - Match Started';
                }
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';
                
                const homeTeam = match.home_team || { name: 'Home', logo: '' };
                const awayTeam = match.away_team || { name: 'Away', logo: '' };
                const leagueName = match.league_name || 'League';
                const matchDate = new Date(match.start_time);
                
                // Match status badge
                let statusBadge = '';
                if (match.status === 'upcoming') {
                    statusBadge = '<span class="match-status upcoming"><i class="fas fa-clock"></i> UPCOMING</span>';
                } else if (match.status === 'live') {
                    statusBadge = `<span class="match-status live"><i class="fas fa-circle"></i> LIVE ${elapsedMinutes}'</span>`;
                } else {
                    statusBadge = '<span class="match-status finished"><i class="fas fa-check-circle"></i> FINISHED</span>';
                }
                
                document.getElementById('match-hero').innerHTML = `
                    <div class="teams-large">
                        <div>
                            <img class="team-logo-lg" src="${homeTeam.logo || 'https://via.placeholder.com/80?text=?'}" onerror="this.src='https://via.placeholder.com/80?text=${homeTeam.name.substring(0,2)}'">
                            <div class="team-name-lg">${escapeHtml(homeTeam.name)}</div>
                        </div>
                        <div class="vs-large">VS</div>
                        <div>
                            <img class="team-logo-lg" src="${awayTeam.logo || 'https://via.placeholder.com/80?text=?'}" onerror="this.src='https://via.placeholder.com/80?text=${awayTeam.name.substring(0,2)}'">
                            <div class="team-name-lg">${escapeHtml(awayTeam.name)}</div>
                        </div>
                    </div>
                    <div class="match-info">
                        <span><i class="fas fa-trophy"></i> ${escapeHtml(leagueName)}</span>
                        <span><i class="far fa-calendar"></i> ${matchDate.toLocaleDateString()}</span>
                        <span><i class="far fa-clock"></i> ${matchDate.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>
                        ${statusBadge}
                    </div>
                `;
                
                startCountdown(matchDate);
                renderBetOptions('1x2');
                
                // Tab switching
                document.querySelectorAll('.bet-type-tab').forEach(tab => {
                    tab.addEventListener('click', function() {
                        document.querySelectorAll('.bet-type-tab').forEach(t => t.classList.remove('active'));
                        this.classList.add('active');
                        renderBetOptions(this.dataset.tab);
                    });
                });
                
                // Quick amount buttons
                document.querySelectorAll('.quick-amount').forEach(btn => {
                    btn.addEventListener('click', () => {
                        document.getElementById('bet-amount').value = btn.dataset.amount;
                        updatePotential();
                    });
                });
                
                document.getElementById('bet-amount').addEventListener('input', updatePotential);
                
                if (selectedBet) {
                    setTimeout(() => {
                        const option = document.querySelector(`.bet-option[data-type="${selectedBet}"]`);
                        if (option) option.click();
                    }, 500);
                }
                
            } catch(e) {
                console.error(e);
                document.getElementById('loading').innerHTML = `<div style="color:#ff5252;text-align:center;padding:40px;">Error: ${e.message}</div>`;
            }
        }
        
        function startCountdown(matchTime) {
            if (countdownInterval) clearInterval(countdownInterval);
            
            function updateCountdown() {
                const now = new Date();
                const diff = matchTime - now;
                
                if (diff <= 0) {
                    document.getElementById('countdown-timer').innerHTML = '<span style="color:#ff9800;"><i class="fas fa-play"></i> Match Started!</span>';
                    if (countdownInterval) clearInterval(countdownInterval);
                } else {
                    const hours = Math.floor(diff / 3600000);
                    const minutes = Math.floor((diff % 3600000) / 60000);
                    const seconds = Math.floor((diff % 60000) / 1000);
                    document.getElementById('countdown-timer').innerHTML = `<i class="fas fa-hourglass-half"></i> Match starts in: ${hours}h ${minutes}m ${seconds}s`;
                }
            }
            
            updateCountdown();
            countdownInterval = setInterval(updateCountdown, 1000);
        }
        
        function renderBetOptions(tab) {
            currentTab = tab;
            selectedBet = null;
            selectedBetName = null;
            selectedOdds = null;
            const container = document.getElementById('bet-options-container');
            const odds = currentMatch.odds || { home: 2.50, draw: 3.20, away: 2.80 };
            
            let html = '<div class="bet-options">';
            
            switch(tab) {
                case '1x2':
                    html += `
                        <div class="bet-option" data-type="home" data-odds="${odds.home}" data-name="Home Win">
                            <div class="bet-option-name">🏠 Home Win</div>
                            <div class="bet-option-odds">${odds.home}</div>
                        </div>
                        <div class="bet-option" data-type="draw" data-odds="${odds.draw}" data-name="Draw">
                            <div class="bet-option-name">🤝 Draw</div>
                            <div class="bet-option-odds">${odds.draw}</div>
                        </div>
                        <div class="bet-option" data-type="away" data-odds="${odds.away}" data-name="Away Win">
                            <div class="bet-option-name">✈️ Away Win</div>
                            <div class="bet-option-odds">${odds.away}</div>
                        </div>
                    `;
                    break;
                    
                case 'double':
                    const homeDraw = 1 / ((1/odds.home) + (1/odds.draw));
                    const homeAway = 1 / ((1/odds.home) + (1/odds.away));
                    const drawAway = 1 / ((1/odds.draw) + (1/odds.away));
                    html += `
                        <div class="bet-option" data-type="1X" data-odds="${homeDraw.toFixed(2)}" data-name="1X (Home or Draw)">
                            <div class="bet-option-name">🏠 1X (Home or Draw)</div>
                            <div class="bet-option-odds">${homeDraw.toFixed(2)}</div>
                        </div>
                        <div class="bet-option" data-type="12" data-odds="${homeAway.toFixed(2)}" data-name="12 (Home or Away)">
                            <div class="bet-option-name">↔️ 12 (Home or Away)</div>
                            <div class="bet-option-odds">${homeAway.toFixed(2)}</div>
                        </div>
                        <div class="bet-option" data-type="X2" data-odds="${drawAway.toFixed(2)}" data-name="X2 (Draw or Away)">
                            <div class="bet-option-name">✈️ X2 (Draw or Away)</div>
                            <div class="bet-option-odds">${drawAway.toFixed(2)}</div>
                        </div>
                    `;
                    break;
                    
                case 'overunder':
                    html += `
                        <div class="bet-option" data-type="over05" data-odds="1.75" data-name="Over 0.5 Goals">
                            <div class="bet-option-name">⚽ Over 0.5 Goals</div>
                            <div class="bet-option-odds">1.75</div>
                        </div>
                        <div class="bet-option" data-type="under05" data-odds="2.05" data-name="Under 0.5 Goals">
                            <div class="bet-option-name">⚽ Under 0.5 Goals</div>
                            <div class="bet-option-odds">2.05</div>
                        </div>
                        <div class="bet-option" data-type="over15" data-odds="1.80" data-name="Over 1.5 Goals">
                            <div class="bet-option-name">⚽ Over 1.5 Goals</div>
                            <div class="bet-option-odds">1.80</div>
                        </div>
                        <div class="bet-option" data-type="under15" data-odds="2.00" data-name="Under 1.5 Goals">
                            <div class="bet-option-name">⚽ Under 1.5 Goals</div>
                            <div class="bet-option-odds">2.00</div>
                        </div>
                        <div class="bet-option" data-type="over25" data-odds="1.85" data-name="Over 2.5 Goals">
                            <div class="bet-option-name">⚽ Over 2.5 Goals</div>
                            <div class="bet-option-odds">1.85</div>
                        </div>
                        <div class="bet-option" data-type="under25" data-odds="1.95" data-name="Under 2.5 Goals">
                            <div class="bet-option-name">⚽ Under 2.5 Goals</div>
                            <div class="bet-option-odds">1.95</div>
                        </div>
                        <div class="bet-option" data-type="over35" data-odds="2.10" data-name="Over 3.5 Goals">
                            <div class="bet-option-name">⚽ Over 3.5 Goals</div>
                            <div class="bet-option-odds">2.10</div>
                        </div>
                        <div class="bet-option" data-type="under35" data-odds="1.70" data-name="Under 3.5 Goals">
                            <div class="bet-option-name">⚽ Under 3.5 Goals</div>
                            <div class="bet-option-odds">1.70</div>
                        </div>
                    `;
                    break;
                    
                case 'btts':
                    html += `
                        <div class="bet-option" data-type="btts_yes" data-odds="1.90" data-name="Both Teams to Score - YES">
                            <div class="bet-option-name">✅ YES - Both Score</div>
                            <div class="bet-option-odds">1.90</div>
                        </div>
                        <div class="bet-option" data-type="btts_no" data-odds="1.90" data-name="Both Teams to Score - NO">
                            <div class="bet-option-name">❌ NO - One or none score</div>
                            <div class="bet-option-odds">1.90</div>
                        </div>
                    `;
                    break;
                    
                case 'handicap':
                    html += `
                        <div class="bet-option" data-type="handicap_home" data-odds="1.92" data-name="Home -1.5">
                            <div class="bet-option-name">🏠 Asian Handicap -1.5</div>
                            <div class="bet-option-odds">1.92</div>
                        </div>
                        <div class="bet-option" data-type="handicap_away" data-odds="1.92" data-name="Away +1.5">
                            <div class="bet-option-name">✈️ Asian Handicap +1.5</div>
                            <div class="bet-option-odds">1.92</div>
                        </div>
                    `;
                    break;
                    
                case 'corners':
                    html += `
                        <div class="bet-option" data-type="corners_over" data-odds="1.88" data-name="Over 9.5 Corners">
                            <div class="bet-option-name">🎯 Over 9.5 Corners</div>
                            <div class="bet-option-odds">1.88</div>
                        </div>
                        <div class="bet-option" data-type="corners_under" data-odds="1.88" data-name="Under 9.5 Corners">
                            <div class="bet-option-name">🎯 Under 9.5 Corners</div>
                            <div class="bet-option-odds">1.88</div>
                        </div>
                    `;
                    break;
                    
                case 'cards':
                    html += `
                        <div class="bet-option" data-type="cards_over" data-odds="1.85" data-name="Over 4.5 Cards">
                            <div class="bet-option-name">🟨 Over 4.5 Cards</div>
                            <div class="bet-option-odds">1.85</div>
                        </div>
                        <div class="bet-option" data-type="cards_under" data-odds="1.95" data-name="Under 4.5 Cards">
                            <div class="bet-option-name">🟨 Under 4.5 Cards</div>
                            <div class="bet-option-odds">1.95</div>
                        </div>
                    `;
                    break;
                    
                case 'htft':
                    html += `
                        <div class="bet-option" data-type="ht_ft_home_home" data-odds="3.50" data-name="HT: Home / FT: Home">
                            <div class="bet-option-name">⏱️ HT: Home / FT: Home</div>
                            <div class="bet-option-odds">3.50</div>
                        </div>
                        <div class="bet-option" data-type="ht_ft_home_draw" data-odds="15.00" data-name="HT: Home / FT: Draw">
                            <div class="bet-option-name">⏱️ HT: Home / FT: Draw</div>
                            <div class="bet-option-odds">15.00</div>
                        </div>
                        <div class="bet-option" data-type="ht_ft_draw_draw" data-odds="5.00" data-name="HT: Draw / FT: Draw">
                            <div class="bet-option-name">⏱️ HT: Draw / FT: Draw</div>
                            <div class="bet-option-odds">5.00</div>
                        </div>
                        <div class="bet-option" data-type="ht_ft_away_away" data-odds="4.50" data-name="HT: Away / FT: Away">
                            <div class="bet-option-name">⏱️ HT: Away / FT: Away</div>
                            <div class="bet-option-odds">4.50</div>
                        </div>
                    `;
                    break;
                    
                case 'firstgoal':
                    html += `
                        <div class="bet-option" data-type="first_goal_home" data-odds="2.00" data-name="First Goal - Home Team">
                            <div class="bet-option-name">🥇 Home Team Scores First</div>
                            <div class="bet-option-odds">2.00</div>
                        </div>
                        <div class="bet-option" data-type="first_goal_away" data-odds="2.20" data-name="First Goal - Away Team">
                            <div class="bet-option-name">🥇 Away Team Scores First</div>
                            <div class="bet-option-odds">2.20</div>
                        </div>
                        <div class="bet-option" data-type="first_goal_none" data-odds="8.00" data-name="No Goal">
                            <div class="bet-option-name">🥇 No Goal (0-0)</div>
                            <div class="bet-option-odds">8.00</div>
                        </div>
                    `;
                    break;
            }
            
            html += '</div>';
            container.innerHTML = html;
            
            // Add click handlers
            document.querySelectorAll('.bet-option').forEach(opt => {
                opt.addEventListener('click', function() {
                    if (!isBettingAllowed) {
                        alert('Betting is closed for this match');
                        return;
                    }
                    document.querySelectorAll('.bet-option').forEach(o => o.classList.remove('selected'));
                    this.classList.add('selected');
                    selectedBet = this.dataset.type;
                    selectedBetName = this.dataset.name;
                    selectedOdds = parseFloat(this.dataset.odds);
                    updatePotential();
                    document.getElementById('place-bet-btn').disabled = false;
                    document.getElementById('place-bet-btn').innerHTML = 'Place Bet';
                });
            });
            
            updatePotential();
        }
        
        function updatePotential() {
            if (!selectedBet) return;
            
            const amount = parseFloat(document.getElementById('bet-amount').value) || 0;
            const potentialWin = (amount * selectedOdds).toFixed(2);
            
            document.getElementById('potential-win').innerHTML = `<i class="fas fa-chart-line"></i> $${potentialWin}`;
        }
        
        document.getElementById('place-bet-btn').addEventListener('click', async () => {
            if (!selectedBet) {
                alert('Please select an outcome');
                return;
            }
            
            if (!isBettingAllowed) {
                alert('Betting is closed for this match');
                return;
            }
            
            const amount = parseFloat(document.getElementById('bet-amount').value);
            const balanceText = document.getElementById('balance-display').textContent;
            const currentBalance = parseFloat(balanceText.replace('$', ''));
            
            if (amount > currentBalance) {
                alert('Insufficient balance!');
                return;
            }
            
            if (amount < 1) {
                alert('Minimum bet is $1');
                return;
            }
            
            if (amount > 10000) {
                alert('Maximum bet is $10,000');
                return;
            }
            
            const btn = document.getElementById('place-bet-btn');
            btn.disabled = true;
            btn.innerHTML = '<div class="loading-spinner"></div> Processing...';
            
            try {
                const result = await window.placeSingleBet(
                    parseInt(fixtureId), 
                    selectedBet, 
                    amount
                );
                
                if (result.success) {
                    document.getElementById('success-message').style.display = 'block';
                    document.getElementById('success-message').innerHTML = `✅ Bet placed! Potential win: $${result.potentialWin.toFixed(2)}`;
                    document.getElementById('error-message').style.display = 'none';
                    await loadBalance();
                    
                    setTimeout(() => {
                        window.location.href = 'my-bets.html';
                    }, 2000);
                } else {
                    document.getElementById('error-message').style.display = 'block';
                    document.getElementById('error-message').innerHTML = `❌ ${result.error}`;
                    btn.disabled = false;
                    btn.innerHTML = 'Place Bet';
                }
            } catch(e) {
                document.getElementById('error-message').style.display = 'block';
                document.getElementById('error-message').innerHTML = `❌ Error: ${e.message}`;
                btn.disabled = false;
                btn.innerHTML = 'Place Bet';
            }
        });
        
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        window.toggleLanguage = toggleLanguage;
        console.log('✅ Match details page loaded - Integrated with betting engine');
    </script>
</body>
</html>
