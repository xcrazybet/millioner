<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Match Details - X Lodon | Sports Betting</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0f1a; color: white; font-family: 'Segoe UI', 'Tajawal', sans-serif; min-height: 100vh; }
        .header { background: #111827; padding: 12px 15px; border-bottom: 2px solid #00ff9d; display: flex; align-items: center; gap: 15px; flex-wrap: wrap; position: sticky; top: 0; z-index: 100; }
        .back-btn { color: #00ff9d; background: none; border: none; cursor: pointer; font-size: 20px; }
        .lang-toggle { background: #1a2332; border: 1px solid #00ff9d; color: #00ff9d; padding: 5px 12px; border-radius: 20px; cursor: pointer; margin-left: auto; }
        .container { max-width: 800px; margin: 0 auto; padding: 15px; padding-bottom: 100px; }
        .balance-bar { background: #111827; padding: 10px 15px; border-radius: 12px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #00ff9d33; }
        .match-hero { background: linear-gradient(135deg, #111827, #1a2332); border-radius: 20px; padding: 25px 15px; margin-bottom: 20px; text-align: center; border: 1px solid #00ff9d33; }
        .teams-large { display: flex; align-items: center; justify-content: center; gap: 15px; flex-wrap: wrap; }
        .team-logo-lg { width: 80px; height: 80px; object-fit: contain; border-radius: 50%; background: rgba(255,255,255,0.1); padding: 10px; }
        .team-name-lg { font-size: 20px; font-weight: bold; margin-top: 10px; max-width: 150px; }
        .vs-large { font-size: 24px; color: #ff9800; font-weight: bold; margin: 0 20px; }
        .live-score { font-size: 32px; color: #00ff9d; font-weight: bold; }
        .live-status { display: inline-block; background: #ff4444; color: white; padding: 4px 12px; border-radius: 20px; font-size: 12px; margin-top: 10px; animation: pulse 1.5s infinite; }
        .upcoming-status { display: inline-block; background: #00ff9d; color: black; padding: 4px 12px; border-radius: 20px; font-size: 12px; margin-top: 10px; }
        .finished-status { display: inline-block; background: #a0a8c9; color: black; padding: 4px 12px; border-radius: 20px; font-size: 12px; margin-top: 10px; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
        .match-detail-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #ffffff11; font-size: 13px; }
        .match-detail-label { color: #a0a8c9; }
        .match-detail-value { font-weight: 500; color: #00ff9d; }
        .bet-type-tabs { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; flex-wrap: wrap; }
        .bet-type-tab { padding: 10px 16px; background: #1a2332; border: none; border-radius: 25px; color: white; font-size: 13px; cursor: pointer; }
        .bet-type-tab.active { background: #00ff9d; color: black; }
        .bet-section { background: #111827; border-radius: 20px; padding: 20px; margin-bottom: 20px; }
        .bet-options { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .bet-option { background: #1a2332; border: 2px solid transparent; border-radius: 12px; padding: 15px; text-align: center; cursor: pointer; transition: all 0.2s; }
        .bet-option:hover:not(.disabled) { background: #00ff9d22; border-color: #00ff9d; }
        .bet-option.selected { background: #00ff9d; border-color: #00ff9d; color: black; }
        .bet-option.disabled { opacity: 0.5; cursor: not-allowed; pointer-events: none; }
        .bet-option-name { font-size: 14px; margin-bottom: 5px; font-weight: bold; }
        .bet-option-odds { font-size: 22px; font-weight: bold; }
        .amount-input { width: 100%; padding: 15px; background: #0a0f1a; border: 2px solid #ffffff22; border-radius: 12px; color: white; font-size: 20px; margin-bottom: 15px; text-align: center; }
        .quick-amounts { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin-bottom: 20px; }
        .quick-amount { padding: 12px; background: #1a2332; border-radius: 10px; text-align: center; cursor: pointer; font-weight: bold; }
        .quick-amount:hover { background: #00ff9d; color: black; }
        .potential-box { background: linear-gradient(135deg, #00ff9d11, #ff980011); padding: 15px; border-radius: 12px; text-align: center; margin-bottom: 20px; }
        .potential-value { font-size: 32px; font-weight: bold; color: #00ff9d; }
        .place-btn { width: 100%; padding: 18px; background: #00ff9d; color: black; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .place-btn:hover:not(:disabled) { background: #00cc7d; }
        .place-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .error-msg { background: #ff525222; border: 1px solid #ff5252; border-radius: 10px; padding: 12px; margin-bottom: 15px; color: #ff5252; display: none; }
        .success-msg { background: #4caf5022; border: 1px solid #4caf50; border-radius: 10px; padding: 12px; margin-bottom: 15px; color: #4caf50; display: none; }
        .countdown-timer, .live-match-timer, .betting-countdown { text-align: center; margin-top: 10px; font-size: 14px; }
        .info-note { font-size: 11px; text-align: center; margin-top: 15px; padding: 10px; border-radius: 8px; }
        .info-note.betting-open { background: #4caf5022; color: #4caf50; border: 1px solid #4caf50; }
        .info-note.betting-closed { background: #ff525222; color: #ff5252; border: 1px solid #ff5252; }
        .loading-spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid #00ff9d; border-top-color: transparent; border-radius: 50%; animation: spin 0.6s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loading { text-align: center; padding: 40px; }
        @media (max-width: 600px) {
            .team-logo-lg { width: 50px; height: 50px; }
            .team-name-lg { font-size: 14px; }
            .vs-large { font-size: 18px; margin: 0 10px; }
            .live-score { font-size: 24px; }
            .quick-amounts { grid-template-columns: repeat(3, 1fr); }
            .bet-options { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div class="header">
        <button class="back-btn" id="back-btn"><i class="fas fa-arrow-left"></i></button>
        <h1 style="font-size:18px;"><i class="fas fa-futbol"></i> Match Details</h1>
        <button class="lang-toggle" onclick="toggleLanguage()">عربي</button>
    </div>
    
    <div class="container">
        <div class="balance-bar">
            <span><i class="fas fa-wallet"></i> Balance</span>
            <span style="color:#00ff9d;font-weight:bold;font-size:18px;" id="balance-display">$0.00</span>
        </div>
        
        <div id="loading">
            <div class="loading-spinner"></div>
            <div>Loading match details...</div>
            <div style="font-size: 12px; color: #a0a8c9; margin-top: 10px;">Fixture ID: <span id="fixture-id-display"></span></div>
        </div>
        
        <div id="content" style="display:none;">
            <div class="match-hero" id="match-hero"></div>
            <div id="match-stats-container"></div>
            <div class="countdown-timer" id="countdown-timer"></div>
            <div class="live-match-timer" id="live-timer" style="display:none;"></div>
            <div class="betting-countdown" id="betting-countdown" style="display:none;"></div>
            
            <div class="bet-type-tabs" id="bet-tabs">
                <button class="bet-type-tab active" data-tab="1x2">1X2</button>
                <button class="bet-type-tab" data-tab="double">Double Chance</button>
                <button class="bet-type-tab" data-tab="overunder">Over/Under</button>
                <button class="bet-type-tab" data-tab="btts">BTTS</button>
                <button class="bet-type-tab" data-tab="handicap">Handicap</button>

            <div class="bet-section">
                <div id="bet-options-container"></div>
                <input type="number" class="amount-input" id="bet-amount" placeholder="Enter amount" min="1" step="1" value="10">
                <div class="quick-amounts">
                    <div class="quick-amount" data-amount="5">$5</div>

                    <div class="quick-amount" data-amount="100">$100</div>

                </div>
                <div class="potential-box">
                    <div>Potential Win</div>
                    <div class="potential-value" id="potential-win">$0.00</div>
                </div>
                <div class="error-msg" id="error-message"></div>
                <div class="success-msg" id="success-message"></div>
                <button class="place-btn" id="place-bet-btn" disabled>Select Outcome</button>
                <div class="info-note" id="betting-info">Loading betting information...</div>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // MATCH DETAILS v32 - FIXED RELOAD LOOP
        // ============================================
        
        const SUPABASE_URL = 'https://jnazybaeajyynpyoszmy.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpuYXp5YmFlYWp5eW5weW9zem15Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyNzgwMDMsImV4cCI6MjA5Mjg1NDAwM30.P_8V-_s6DQDiYekZX1yaNup48WBRaLhb3ILAkvzTDTY';
        
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };
        
        const API_BASE = 'https://millioner.onrender.com';
        const BETTING_CLOSE_MINUTE = 80;
        
        let supabaseClient = null, db = null, auth = null;
        let currentMatch = null, selectedBet = null, selectedOdds = null, currentTab = '1x2';
        let refreshInterval = null, liveTimerInterval = null, countdownInterval = null;
        let authInitialized = false;
        
        function safeParseJSON(data, defaultValue = {}) {
            if (!data) return defaultValue;
            if (typeof data === 'object' && data !== null) return data;
            if (typeof data === 'string') {
                try { return JSON.parse(data); } catch(e) { return defaultValue; }
            }
            return defaultValue;
        }
        
        function initFirebase() {
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
            auth = firebase.auth();
        }
        
        function initSupabase() {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }
        
        async function getWalletBalance(userId) {
            try {
                const doc = await db.collection('wallets').doc(userId).get();
                if (doc.exists) return doc.data().balance || 0;
                await db.collection('wallets').doc(userId).set({ balance: 1000, created_at: new Date().toISOString(), updated_at: new Date().toISOString() });
                return 1000;
            } catch(e) { return 0; }
        }
        
        async function deductBalance(userId, amount, betId) {
            const walletRef = db.collection('wallets').doc(userId);
            return await db.runTransaction(async (transaction) => {
                const doc = await transaction.get(walletRef);
                const currentBalance = doc.exists ? doc.data().balance : 0;
                const newBalance = currentBalance - amount;
                if (newBalance < 0) throw new Error('Insufficient balance');
                transaction.update(walletRef, { balance: newBalance, updated_at: new Date().toISOString() });
                transaction.set(db.collection('wallet_transactions').doc(), {
                    user_id: userId, amount: -amount, type: 'bet_place', bet_id: betId,
                    balance_before: currentBalance, balance_after: newBalance, timestamp: new Date().toISOString()
                });
                return newBalance;
            });
        }
        
        async function updateBalanceDisplay() {
            const user = auth.currentUser;
            if (user) {
                const balance = await getWalletBalance(user.uid);
                document.getElementById('balance-display').textContent = `$${balance.toFixed(2)}`;
            }
        }
        
        async function getMatch(fixtureId) {
            if (supabaseClient) {
                try {
                    const { data, error } = await supabaseClient
                        .from('sports_matches')
                        .select('*')
                        .eq('fixture_id', parseInt(fixtureId))
                        .maybeSingle();
                    if (!error && data) return data;
                } catch(e) { console.log('Supabase error:', e.message); }
            }
            try {
                const response = await fetch(`${API_BASE}/api/fixture/${fixtureId}`);
                const data = await response.json();
                if (data.success && data.fixture) {
                    const statusShort = data.fixture.status?.short;
                    let status = 'upcoming';
                    if (statusShort === '1H' || statusShort === '2H' || statusShort === 'HT') status = 'live';
                    else if (statusShort === 'FT' || statusShort === 'AET' || statusShort === 'PEN') status = 'finished';
                    return {
                        fixture_id: data.fixture.id,
                        status: status,
                        league_name: data.league?.name || 'Unknown',
                        home_team: JSON.stringify({ name: data.teams?.home?.name || 'Home', logo: data.teams?.home?.logo || '' }),
                        away_team: JSON.stringify({ name: data.teams?.away?.name || 'Away', logo: data.teams?.away?.logo || '' }),
                        start_time: data.fixture.date,
                        score: JSON.stringify({ home: data.goals?.home || 0, away: data.goals?.away || 0 }),
                        elapsed: data.fixture.status?.elapsed || 0,
                        odds: JSON.stringify({ home: (1.80 + ((data.fixture.id % 20) / 100)).toFixed(2), draw: (3.20 + ((data.fixture.id % 15) / 100)).toFixed(2), away: (2.80 + ((data.fixture.id % 25) / 100)).toFixed(2) })
                    };
                }
            } catch(e) { console.error('API error:', e); }
            throw new Error('Match not found');
        }
        
        async function placeBet(betData) {
            const user = auth.currentUser;
            if (!user) throw new Error('Not authenticated');
            if (!supabaseClient) throw new Error('Supabase not initialized');
            
            const match = await getMatch(betData.fixture_id);
            if (match.status === 'finished') throw new Error('Match finished');
            if (match.status === 'live' && (match.elapsed || 0) >= BETTING_CLOSE_MINUTE) throw new Error('Betting closed');
            
            const balance = await getWalletBalance(user.uid);
            if (balance < betData.amount) throw new Error(`Insufficient balance`);
            
            const bet = {
                id: `${Date.now()}_${Math.random().toString(36).substr(2, 9)}`,
                user_id: user.uid,
                fixture_id: betData.fixture_id,
                bet_type: betData.bet_type,
                bet_name: betData.bet_name,
                odds: betData.odds,
                amount: betData.amount,
                potential_win: betData.amount * betData.odds,
                status: 'active',
                placed_at: new Date().toISOString()
            };
            
            await deductBalance(user.uid, betData.amount, bet.id);
            
            const { error } = await supabaseClient.from('bets').insert(bet);
            
            if (error) {
                await db.collection('wallets').doc(user.uid).update({ 
                    balance: firebase.firestore.FieldValue.increment(betData.amount) 
                });
                throw new Error(`Database error: ${error.message}`);
            }
            
            return bet;
        }
        
        function renderMatchDetails() {
            if (!currentMatch) return;
            const isLive = currentMatch.status === 'live';
            const isUpcoming = currentMatch.status === 'upcoming';
            let homeTeam = safeParseJSON(currentMatch.home_team, { name: 'Home', logo: '' });
            let awayTeam = safeParseJSON(currentMatch.away_team, { name: 'Away', logo: '' });
            let score = safeParseJSON(currentMatch.score, { home: 0, away: 0 });
            let odds = safeParseJSON(currentMatch.odds, { home: 1.80, draw: 3.20, away: 2.80 });
            currentMatch.parsedOdds = odds;
            
            const homeInitial = (homeTeam.name || 'H').substring(0, 2).toUpperCase();
            const awayInitial = (awayTeam.name || 'A').substring(0, 2).toUpperCase();
            
            let statusHtml = '';
            if (isLive) statusHtml = `<div class="live-status"><i class="fas fa-circle"></i> LIVE - ${currentMatch.elapsed || 0}'</div>`;
            else if (isUpcoming) statusHtml = `<div class="upcoming-status"><i class="fas fa-clock"></i> UPCOMING - Betting OPEN</div>`;
            else statusHtml = `<div class="finished-status"><i class="fas fa-check-circle"></i> FINISHED</div>`;
            
            document.getElementById('match-stats-container').innerHTML = `
                <div class="match-detail-row"><span class="match-detail-label">League:</span><span class="match-detail-value">${escapeHtml(currentMatch.league_name)}</span></div>
                <div class="match-detail-row"><span class="match-detail-label">Date & Time:</span><span class="match-detail-value">${new Date(currentMatch.start_time).toLocaleString()}</span></div>
                ${isLive ? `<div class="match-detail-row"><span class="match-detail-label">Elapsed:</span><span class="match-detail-value">${currentMatch.elapsed || 0}'</span></div>` : ''}
                <div class="match-detail-row"><span class="match-detail-label">Betting Status:</span><span class="match-detail-value">${isLive ? (currentMatch.elapsed >= 80 ? 'CLOSED' : 'OPEN until 80\'') : (isUpcoming ? 'OPEN until match starts' : 'CLOSED')}</span></div>
            `;
            
            document.getElementById('match-hero').innerHTML = `
                <div class="teams-large">
                    <div><img class="team-logo-lg" src="${homeTeam.logo || ''}" onerror="this.src='https://placehold.co/80x80?text=${homeInitial}'"><div class="team-name-lg">${escapeHtml(homeTeam.name)}</div></div>
                    <div class="vs-large">${isLive ? `<span class="live-score">${score.home} - ${score.away}</span>` : 'VS'}</div>
                    <div><img class="team-logo-lg" src="${awayTeam.logo || ''}" onerror="this.src='https://placehold.co/80x80?text=${awayInitial}'"><div class="team-name-lg">${escapeHtml(awayTeam.name)}</div></div>
                </div>
                ${statusHtml}
            `;
        }
        
        function renderBetOptions() {
            const odds = currentMatch?.parsedOdds || { home: 2.50, draw: 3.20, away: 2.80 };
            let html = '<div class="bet-options">';
            
            switch(currentTab) {
                case '1x2':
                    html += `<div class="bet-option" data-type="home" data-odds="${odds.home}" data-name="Home Win"><div class="bet-option-name">🏆 Home Win</div><div class="bet-option-odds">${odds.home}</div></div>`;
                    html += `<div class="bet-option" data-type="draw" data-odds="${odds.draw}" data-name="Draw"><div class="bet-option-name">🤝 Draw</div><div class="bet-option-odds">${odds.draw}</div></div>`;
                    html += `<div class="bet-option" data-type="away" data-odds="${odds.away}" data-name="Away Win"><div class="bet-option-name">🏆 Away Win</div><div class="bet-option-odds">${odds.away}</div></div>`;
                    break;
                case 'double':
                    const hd = 1 / ((1/odds.home) + (1/odds.draw));
                    const ha = 1 / ((1/odds.home) + (1/odds.away));
                    const da = 1 / ((1/odds.draw) + (1/odds.away));
                    html += `<div class="bet-option" data-type="1X" data-odds="${hd.toFixed(2)}" data-name="Home/Draw"><div class="bet-option-name">🏠 1X</div><div class="bet-option-odds">${hd.toFixed(2)}</div></div>`;
                    html += `<div class="bet-option" data-type="12" data-odds="${ha.toFixed(2)}" data-name="Home/Away"><div class="bet-option-name">⚡ 12</div><div class="bet-option-odds">${ha.toFixed(2)}</div></div>`;
                    html += `<div class="bet-option" data-type="X2" data-odds="${da.toFixed(2)}" data-name="Draw/Away"><div class="bet-option-name">🚀 X2</div><div class="bet-option-odds">${da.toFixed(2)}</div></div>`;
                    break;
                case 'overunder':
                    html += `<div class="bet-option" data-type="over25" data-odds="1.85" data-name="Over 2.5"><div class="bet-option-name">⚽ Over 2.5</div><div class="bet-option-odds">1.85</div></div>`;
                    html += `<div class="bet-option" data-type="under25" data-odds="1.95" data-name="Under 2.5"><div class="bet-option-name">🥅 Under 2.5</div><div class="bet-option-odds">1.95</div></div>`;
                    break;
                case 'btts':
                    html += `<div class="bet-option" data-type="btts_yes" data-odds="1.90" data-name="BTTS Yes"><div class="bet-option-name">✅ BTTS Yes</div><div class="bet-option-odds">1.90</div></div>`;
                    html += `<div class="bet-option" data-type="btts_no" data-odds="1.90" data-name="BTTS No"><div class="bet-option-name">❌ BTTS No</div><div class="bet-option-odds">1.90</div></div>`;
                    break;
                case 'handicap':
                    const hv = ((currentMatch?.fixture_id || 0) % 30 - 15) / 10;
                    html += `<div class="bet-option" data-type="handicap_home" data-odds="${(1.90 + hv * 0.1).toFixed(2)}" data-name="Home ${hv > 0 ? '+' : ''}${hv.toFixed(1)}"><div class="bet-option-name">🏠 ${hv > 0 ? '+' : ''}${hv.toFixed(1)}</div><div class="bet-option-odds">${(1.90 + hv * 0.1).toFixed(2)}</div></div>`;
                    html += `<div class="bet-option" data-type="handicap_away" data-odds="${(1.90 - hv * 0.1).toFixed(2)}" data-name="Away ${hv > 0 ? '-' : '+'}${Math.abs(hv).toFixed(1)}"><div class="bet-option-name">🚀 ${hv > 0 ? '-' : '+'}${Math.abs(hv).toFixed(1)}</div><div class="bet-option-odds">${(1.90 - hv * 0.1).toFixed(2)}</div></div>`;
                    break;
                case 'corners':
                    html += `<div class="bet-option" data-type="corners_over" data-odds="1.85" data-name="Over 9.5"><div class="bet-option-name">🔄 Over 9.5</div><div class="bet-option-odds">1.85</div></div>`;
                    html += `<div class="bet-option" data-type="corners_under" data-odds="1.95" data-name="Under 9.5"><div class="bet-option-name">🔄 Under 9.5</div><div class="bet-option-odds">1.95</div></div>`;
                    break;
                case 'cards':
                    html += `<div class="bet-option" data-type="cards_over" data-odds="1.90" data-name="Over 4.5"><div class="bet-option-name">🟨 Over 4.5</div><div class="bet-option-odds">1.90</div></div>`;
                    html += `<div class="bet-option" data-type="cards_under" data-odds="1.90" data-name="Under 4.5"><div class="bet-option-name">🟩 Under 4.5</div><div class="bet-option-odds">1.90</div></div>`;
                    break;
            }
            html += '</div>';
            document.getElementById('bet-options-container').innerHTML = html;
            
            const isDisabled = (currentMatch.status === 'finished') || (currentMatch.status === 'live' && currentMatch.elapsed >= BETTING_CLOSE_MINUTE);
            document.querySelectorAll('.bet-option').forEach(opt => {
                if (isDisabled) opt.classList.add('disabled');
                opt.addEventListener('click', function() {
                    if (isDisabled) { showError('Betting closed'); return; }
                    document.querySelectorAll('.bet-option').forEach(o => o.classList.remove('selected'));
                    this.classList.add('selected');
                    selectedBet = { type: this.dataset.type, name: this.dataset.name, odds: parseFloat(this.dataset.odds) };
                    selectedOdds = selectedBet.odds;
                    const amount = parseFloat(document.getElementById('bet-amount').value) || 0;
                    document.getElementById('potential-win').textContent = `$${(amount * selectedOdds).toFixed(2)}`;
                    document.getElementById('place-bet-btn').disabled = false;
                });
            });
        }
        
        function checkBettingAvailability() {
            const isLive = currentMatch.status === 'live';
            const elapsed = currentMatch.elapsed || 0;
            let message = '', msgClass = '';
            if (currentMatch.status === 'finished') { message = '❌ Match finished - Betting closed'; msgClass = 'betting-closed'; }
            else if (isLive && elapsed >= BETTING_CLOSE_MINUTE) { message = `🔒 Betting closed at ${elapsed}'`; msgClass = 'betting-closed'; }
            else if (isLive) { message = `🟢 LIVE - Betting OPEN (${BETTING_CLOSE_MINUTE - elapsed} min left)`; msgClass = 'betting-open'; }
            else if (currentMatch.status === 'upcoming') { message = `📅 UPCOMING - Betting OPEN`; msgClass = 'betting-open'; }
            document.getElementById('betting-info').innerHTML = `<i class="fas fa-info-circle"></i> ${message}`;
            document.getElementById('betting-info').className = `info-note ${msgClass}`;
        }
        
        function startCountdown() {
            if (!currentMatch || currentMatch.status !== 'upcoming') return;
            const matchTime = new Date(currentMatch.start_time);
            const interval = setInterval(() => {
                const diff = matchTime - new Date();
                if (diff <= 0) {
                    clearInterval(interval);
                    document.getElementById('countdown-timer').innerHTML = 'Match started! Refreshing...';
                    setTimeout(() => location.reload(), 2000);
                } else {
                    const h = Math.floor(diff / 3600000), m = Math.floor((diff % 3600000) / 60000), s = Math.floor((diff % 60000) / 1000);
                    document.getElementById('countdown-timer').innerHTML = h > 0 ? `Match starts in: ${h}h ${m}m ${s}s` : `Match starts in: ${m}m ${s}s`;
                }
            }, 1000);
            countdownInterval = interval;
        }
        
        function startLiveTimer() {
            if (!currentMatch || currentMatch.status !== 'live') return;
            const timerEl = document.getElementById('live-timer');
            timerEl.style.display = 'block';
            const interval = setInterval(() => {
                const elapsed = currentMatch.elapsed || 0;
                let period = '';
                if (elapsed < 45) period = '1st Half';
                else if (elapsed < 60) period = 'Half Time';
                else if (elapsed < 90) period = '2nd Half';
                else period = 'Added Time';
                timerEl.innerHTML = `<i class="fas fa-clock"></i> ${period}: ${elapsed}'`;
            }, 1000);
            liveTimerInterval = interval;
        }
        
        function startAutoRefresh() {
            if (refreshInterval) clearInterval(refreshInterval);
            refreshInterval = setInterval(async () => {
                if (currentMatch && currentMatch.status === 'live') {
                    try {
                        const fresh = await getMatch(currentMatch.fixture_id);
                        if (fresh) { 
                            currentMatch = fresh; 
                            renderMatchDetails(); 
                            renderBetOptions(); 
                            checkBettingAvailability();
                        }
                        await updateBalanceDisplay();
                    } catch(e) { console.error('Refresh error'); }
                }
            }, 10000);
        }
        
        function escapeHtml(str) { if (!str) return ''; return String(str).replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m])); }
        function showError(msg) { const el = document.getElementById('error-message'); el.innerHTML = msg; el.style.display = 'block'; setTimeout(() => el.style.display = 'none', 5000); }
        function showSuccess(msg) { const el = document.getElementById('success-message'); el.innerHTML = msg; el.style.display = 'block'; setTimeout(() => el.style.display = 'none', 3000); }
        
        async function placeBetHandler() {
            if (!selectedBet) { showError('Select an outcome'); return; }
            const amount = parseFloat(document.getElementById('bet-amount').value);
            if (amount < 1) { showError('Minimum bet $1'); return; }
            
            const btn = document.getElementById('place-bet-btn');
            btn.disabled = true; 
            btn.innerHTML = '<div class="loading-spinner"></div> Processing...';
            
            try {
                await placeBet({ 
                    fixture_id: parseInt(fixtureId), 
                    bet_type: selectedBet.type, 
                    bet_name: selectedBet.name, 
                    odds: selectedOdds, 
                    amount: amount 
                });
                await updateBalanceDisplay();
                showSuccess(`✅ Bet placed! Potential win: $${(amount * selectedOdds).toFixed(2)}`);
                
                selectedBet = null; 
                selectedOdds = null;
                document.getElementById('bet-amount').value = '10';
                document.getElementById('potential-win').textContent = '$0.00';
                document.querySelectorAll('.bet-option').forEach(o => o.classList.remove('selected'));
                btn.disabled = true; 
                btn.innerHTML = 'Place Bet';
            } catch(e) { 
                showError(e.message); 
                btn.disabled = false; 
                btn.innerHTML = 'Place Bet';
            }
        }
        
        async function loadMatch() {
            try {
                console.log(`Loading match ${fixtureId}...`);
                currentMatch = await getMatch(fixtureId);
                console.log('Match loaded successfully');
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';
                renderMatchDetails(); 
                renderBetOptions(); 
                checkBettingAvailability();
                if (currentMatch.status === 'live') { 
                    startLiveTimer(); 
                    startAutoRefresh(); 
                } else if (currentMatch.status === 'upcoming') {
                    startCountdown();
                }
            } catch(e) { 
                console.error('Load match error:', e);
                document.getElementById('loading').innerHTML = `<div class="error-msg" style="display:block;">Error: ${e.message}<br><button onclick="location.reload()">Retry</button></div>`; 
            }
        }
        
        function setupEventListeners() {
            document.querySelectorAll('.bet-type-tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    document.querySelectorAll('.bet-type-tab').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    currentTab = this.dataset.tab;
                    renderBetOptions();
                });
            });
            document.querySelectorAll('.quick-amount').forEach(btn => {
                btn.addEventListener('click', () => {
                    const amount = btn.dataset.amount;
                    document.getElementById('bet-amount').value = amount;
                    if (selectedOdds) document.getElementById('potential-win').textContent = `$${(parseFloat(amount) * selectedOdds).toFixed(2)}`;
                });
            });
            document.getElementById('bet-amount').addEventListener('input', (e) => {
                if (selectedOdds) {
                    const amount = parseFloat(e.target.value) || 0;
                    document.getElementById('potential-win').textContent = `$${(amount * selectedOdds).toFixed(2)}`;
                }
            });
            document.getElementById('place-bet-btn').addEventListener('click', placeBetHandler);
            
            // FIXED: Smart back button
            const backBtn = document.getElementById('back-btn');
            if (backBtn) {
                backBtn.addEventListener('click', function() {
                    // Check if we came from live matches (referrer contains 'live-matches')
                    if (document.referrer && document.referrer.includes('live-matches.html')) {
                        window.location.href = 'live-matches.html';
                    } else {
                        // Default to upcoming matches
                        window.location.href = 'upcoming-matches.html';
                    }
                });
            }
        }
        
        window.toggleLanguage = function() { 
            const isArabic = document.body.classList.toggle('arabic'); 
            localStorage.setItem('lang', isArabic ? 'ar' : 'en'); 
            document.documentElement.dir = isArabic ? 'rtl' : 'ltr';
            const toggleBtn = document.querySelector('.lang-toggle');
            if (toggleBtn) toggleBtn.textContent = isArabic ? 'English' : 'عربي';
        };
        if (localStorage.getItem('lang') === 'ar') toggleLanguage();
        
        const urlParams = new URLSearchParams(window.location.search);
        const fixtureId = urlParams.get('id');
        document.getElementById('fixture-id-display').textContent = fixtureId || 'Not provided';
        
        // FIXED: Prevent multiple initializations
        let isInitialized = false;
        
        function initialize() {
            if (isInitialized) return;
            isInitialized = true;
            
            initFirebase(); 
            initSupabase();
            
            auth.onAuthStateChanged(async (user) => {
                if (!user) { 
                    window.location.href = '../login.html'; 
                    return; 
                }
                console.log(`User authenticated: ${user.email}`);
                await updateBalanceDisplay();
                await loadMatch();
                setupEventListeners();
                setInterval(updateBalanceDisplay, 30000);
            });
        }
        
        // Start initialization
        initialize();
        
        window.addEventListener('beforeunload', () => {
            if (refreshInterval) clearInterval(refreshInterval);
            if (liveTimerInterval) clearInterval(liveTimerInterval);
            if (countdownInterval) clearInterval(countdownInterval);
        });
    </script>
</body>
</html>
