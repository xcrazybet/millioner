<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Match Details - X Lodon | Sports Betting</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <link rel="stylesheet" href="../css/sports-betting.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0f1a; color: white; font-family: 'Segoe UI', 'Tajawal', sans-serif; min-height: 100vh; }
        .header { background: #111827; padding: 12px 15px; border-bottom: 2px solid #00ff9d; display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        .back-btn { color: #00ff9d; text-decoration: none; font-size: 20px; }
        .lang-toggle { background: #1a2332; border: 1px solid #00ff9d; color: #00ff9d; padding: 5px 12px; border-radius: 20px; cursor: pointer; margin-left: auto; }
        .container { max-width: 800px; margin: 0 auto; padding: 15px; padding-bottom: 100px; }
        .balance-bar { background: #111827; padding: 10px 15px; border-radius: 12px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #00ff9d33; }
        .match-hero { background: linear-gradient(135deg, #111827, #1a2332); border-radius: 20px; padding: 25px 15px; margin-bottom: 20px; text-align: center; border: 1px solid #00ff9d33; }
        .teams-large { display: flex; align-items: center; justify-content: center; gap: 15px; flex-wrap: wrap; }
        .team-logo-lg { width: 80px; height: 80px; object-fit: contain; border-radius: 50%; background: rgba(255,255,255,0.1); padding: 10px; }
        .team-name-lg { font-size: 20px; font-weight: bold; margin-top: 10px; max-width: 150px; word-wrap: break-word; }
        .vs-large { font-size: 24px; color: #ff9800; font-weight: bold; margin: 0 20px; }
        .match-info { margin-top: 15px; color: #a0a8c9; font-size: 14px; }
        .live-status { display: inline-block; background: #ff4444; color: white; padding: 4px 12px; border-radius: 20px; font-size: 12px; margin-top: 10px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .bet-type-tabs { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px; flex-wrap: wrap; }
        .bet-type-tab { padding: 10px 16px; background: #1a2332; border: none; border-radius: 25px; color: white; font-size: 13px; cursor: pointer; white-space: nowrap; transition: all 0.2s; }
        .bet-type-tab.active { background: #00ff9d; color: black; }
        .bet-type-tab:hover { background: #00ff9d44; }
        .bet-type-tab.disabled { opacity: 0.5; cursor: not-allowed; }
        .bet-section { background: #111827; border-radius: 20px; padding: 20px; margin-bottom: 20px; }
        .bet-options { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .bet-option { background: #1a2332; border: 2px solid transparent; border-radius: 12px; padding: 15px; text-align: center; cursor: pointer; transition: all 0.2s; }
        .bet-option:hover { background: #00ff9d22; border-color: #00ff9d; }
        .bet-option.selected { background: #00ff9d; border-color: #00ff9d; color: black; }
        .bet-option.disabled { opacity: 0.5; cursor: not-allowed; pointer-events: none; }
        .bet-option-name { font-size: 14px; margin-bottom: 5px; }
        .bet-option-odds { font-size: 22px; font-weight: bold; }
        .bet-option.selected .bet-option-odds { color: black; }
        .amount-input { width: 100%; padding: 15px; background: #0a0f1a; border: 2px solid #ffffff22; border-radius: 12px; color: white; font-size: 20px; margin-bottom: 15px; text-align: center; }
        .quick-amounts { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin-bottom: 20px; }
        .quick-amount { padding: 12px; background: #1a2332; border-radius: 10px; text-align: center; cursor: pointer; font-weight: bold; transition: all 0.2s; }
        .quick-amount:hover { background: #00ff9d; color: black; }
        .potential-box { background: linear-gradient(135deg, #00ff9d11, #ff980011); padding: 15px; border-radius: 12px; text-align: center; margin-bottom: 20px; }
        .potential-value { font-size: 32px; font-weight: bold; color: #00ff9d; }
        .place-btn { width: 100%; padding: 18px; background: #00ff9d; color: black; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; transition: all 0.2s; }
        .place-btn:hover { transform: scale(1.02); background: #00cc7d; }
        .place-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .error-msg { background: #ff525222; border: 1px solid #ff5252; border-radius: 10px; padding: 12px; margin-bottom: 15px; color: #ff5252; display: none; }
        .success-msg { background: #4caf5022; border: 1px solid #4caf50; border-radius: 10px; padding: 12px; margin-bottom: 15px; color: #4caf50; display: none; }
        .countdown-timer { text-align: center; margin-top: 10px; font-size: 14px; color: #ff9800; }
        .info-note { font-size: 11px; color: #a0a8c9; text-align: center; margin-top: 15px; }
        .loading-spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid #00ff9d; border-top-color: transparent; border-radius: 50%; animation: spin 0.6s linear infinite; margin-right: 10px; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .arabic { font-family: 'Tajawal', sans-serif; }
        @media (max-width: 600px) {
            .team-logo-lg { width: 50px; height: 50px; }
            .team-name-lg { font-size: 14px; max-width: 100px; }
            .vs-large { font-size: 18px; margin: 0 10px; }
            .bet-options { grid-template-columns: repeat(2, 1fr); }
            .quick-amounts { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="upcoming-matches.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        <h1 style="font-size:18px;"><i class="fas fa-futbol"></i> <span class="en">Match Details</span><span class="ar" style="display:none;">تفاصيل المباراة</span></h1>
        <button class="lang-toggle" onclick="toggleLanguage()"><span class="en">عربي</span><span class="ar" style="display:none;">English</span></button>
    </div>
    
    <div class="container">
        <div class="balance-bar">
            <span><i class="fas fa-wallet"></i> <span class="en">Balance</span><span class="ar" style="display:none;">الرصيد</span></span>
            <span style="color:#00ff9d;font-weight:bold;font-size:18px;" id="balance-display">$0.00</span>
        </div>
        
        <div id="loading" style="text-align:center;padding:40px;"><div class="loading-spinner"></div> Loading match details...</div>
        <div id="content" style="display:none;">
            <div class="match-hero" id="match-hero"></div>
            <div class="countdown-timer" id="countdown-timer"></div>
            
            <div class="bet-type-tabs" id="bet-tabs">
                <button class="bet-type-tab active" data-tab="1x2">1X2</button>
                <button class="bet-type-tab" data-tab="double">Double Chance</button>
                <button class="bet-type-tab" data-tab="overunder">Over/Under 2.5</button>
                <button class="bet-type-tab" data-tab="btts">BTTS</button>
            </div>
            
            <div class="bet-section">
                <div id="bet-options-container"></div>
                <input type="number" class="amount-input" id="bet-amount" value="10" min="1" step="1" placeholder="Enter amount">
                <div class="quick-amounts">
                    <div class="quick-amount" data-amount="5">$5</div>
                    <div class="quick-amount" data-amount="10">$10</div>
                    <div class="quick-amount" data-amount="25">$25</div>
                    <div class="quick-amount" data-amount="50">$50</div>
                    <div class="quick-amount" data-amount="100">$100</div>
                    <div class="quick-amount" data-amount="500">$500</div>
                </div>
                <div class="potential-box">
                    <div><span class="en">Potential Win</span><span class="ar" style="display:none;">الربح المحتمل</span></div>
                    <div class="potential-value" id="potential-win">$0.00</div>
                </div>
                <div class="error-msg" id="error-message"></div>
                <div class="success-msg" id="success-message"></div>
                <button class="place-btn" id="place-bet-btn" disabled><span class="en">Select Outcome</span><span class="ar" style="display:none;">اختر النتيجة</span></button>
                <div class="info-note" id="betting-info"><i class="fas fa-info-circle"></i> <span class="en">Live matches only - Betting closes at 80th minute</span><span class="ar" style="display:none;">المباريات المباشرة فقط - الرهان يغلق عند الدقيقة 80</span></div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        // Make sure supabaseClient is available globally
        window.supabaseClient = supabaseClient;
        
        // Firebase config
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };
        
        // Initialize Firebase if not already
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        
        // Global variables
        let currentMatch = null;
        let selectedBet = null;
        let selectedBetName = null;
        let selectedOdds = null;
        let currentTab = '1x2';
        let countdownInterval = null;
        let balanceRefreshInterval = null;
        
        // Get fixture ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const fixtureId = urlParams.get('id');
        
        // Language handling
        function toggleLanguage() {
            const isArabic = document.body.classList.toggle('arabic');
            localStorage.setItem('lang', isArabic ? 'ar' : 'en');
            document.documentElement.dir = isArabic ? 'rtl' : 'ltr';
            document.querySelectorAll('.en').forEach(el => el.style.display = isArabic ? 'none' : '');
            document.querySelectorAll('.ar').forEach(el => el.style.display = isArabic ? '' : 'none');
        }
        
        if (localStorage.getItem('lang') === 'ar') toggleLanguage();
        
        // ===== INTEGRATION WITH EXISTING SYSTEMS =====
        
        // Load user balance from Firebase wallet
        async function loadBalance() {
            try {
                const user = firebase.auth().currentUser;
                if (!user) return 0;
                
                // Use WalletManager from betting-engine.js if available
                if (window.WalletManager) {
                    const balance = await window.WalletManager.getBalance(user.uid);
                    document.getElementById('balance-display').textContent = `$${balance.toFixed(2)}`;
                    return balance;
                }
                
                // Fallback to direct Firestore
                const db = firebase.firestore();
                const doc = await db.collection('wallets').doc(user.uid).get();
                const balance = doc.exists ? (doc.data().balance || 0) : 1000;
                
                // Create wallet if doesn't exist
                if (!doc.exists) {
                    await db.collection('wallets').doc(user.uid).set({
                        balance: 1000,
                        created_at: new Date().toISOString(),
                        updated_at: new Date().toISOString()
                    });
                }
                
                document.getElementById('balance-display').textContent = `$${balance.toFixed(2)}`;
                return balance;
            } catch(e) {
                console.error('Error loading balance:', e);
                return 0;
            }
        }
        
        // Update balance after bet
        async function refreshBalance() {
            await loadBalance();
        }
        
        // Load match from Supabase (using existing supabase-client)
        async function loadMatch() {
            if (!fixtureId) {
                document.getElementById('loading').innerHTML = '<div style="color:#ff5252;text-align:center;padding:40px;">No match selected</div>';
                return;
            }
            
            try {
                // Use supaDB from supabase-client.js if available
                let match = null;
                
                if (window.supaDB && window.supaDB.getMatch) {
                    match = await window.supaDB.getMatch(parseInt(fixtureId));
                } else {
                    // Direct Supabase query
                    const { data, error } = await supabaseClient
                        .from('sports_matches')
                        .select('*')
                        .eq('fixture_id', parseInt(fixtureId))
                        .single();
                    
                    if (error) throw error;
                    match = data;
                }
                
                if (!match) {
                    document.getElementById('loading').innerHTML = '<div style="color:#ff5252;text-align:center;padding:40px;">Match not found</div>';
                    return;
                }
                
                currentMatch = match;
                
                // Check if betting is allowed
                const isLive = match.status === 'live';
                const isBetsClosed = match.bets_closed;
                const elapsed = match.elapsed || 0;
                
                if (!isLive) {
                    document.getElementById('betting-info').innerHTML = '<i class="fas fa-info-circle"></i> Betting only available for LIVE matches';
                    document.getElementById('place-bet-btn').disabled = true;
                    document.querySelectorAll('.bet-option').forEach(opt => opt.classList.add('disabled'));
                } else if (isBetsClosed || elapsed >= 80) {
                    document.getElementById('betting-info').innerHTML = '<i class="fas fa-ban"></i> Betting closed - Match is in final minutes';
                    document.getElementById('place-bet-btn').disabled = true;
                    document.querySelectorAll('.bet-option').forEach(opt => opt.classList.add('disabled'));
                }
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';
                
                // Display match info
                const homeTeam = match.home_team || { name: 'Home', logo: '' };
                const awayTeam = match.away_team || { name: 'Away', logo: '' };
                const leagueName = match.league_name || 'League';
                const matchDate = new Date(match.start_time);
                const currentScore = match.score || { home: 0, away: 0 };
                
                document.getElementById('match-hero').innerHTML = `
                    <div class="teams-large">
                        <div>
                            <img class="team-logo-lg" src="${homeTeam.logo || 'https://via.placeholder.com/80?text=?'}" onerror="this.src='https://via.placeholder.com/80?text=' + encodeURIComponent((homeTeam.name || 'Home').substring(0,2))">
                            <div class="team-name-lg">${escapeHtml(homeTeam.name)}</div>
                        </div>
                        <div class="vs-large">${isLive ? `<span style="font-size:28px;">${currentScore.home} - ${currentScore.away}</span>` : 'VS'}</div>
                        <div>
                            <img class="team-logo-lg" src="${awayTeam.logo || 'https://via.placeholder.com/80?text=?'}" onerror="this.src='https://via.placeholder.com/80?text=' + encodeURIComponent((awayTeam.name || 'Away').substring(0,2))">
                            <div class="team-name-lg">${escapeHtml(awayTeam.name)}</div>
                        </div>
                    </div>
                    <div class="match-info">
                        <i class="fas fa-trophy"></i> ${escapeHtml(leagueName)} &nbsp;|&nbsp;
                        <i class="far fa-calendar"></i> ${matchDate.toLocaleDateString()} &nbsp;|&nbsp;
                        <i class="far fa-clock"></i> ${matchDate.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}
                    </div>
                    ${isLive ? `<div class="live-status"><i class="fas fa-circle"></i> LIVE ${elapsed || 0}'</div>` : ''}
                `;
                
                // Start countdown if not live
                if (!isLive && matchDate > new Date()) {
                    startCountdown(matchDate);
                } else if (isLive) {
                    document.getElementById('countdown-timer').innerHTML = '<span style="color:#00ff9d;"><i class="fas fa-play"></i> Match In Progress!</span>';
                }
                
                // Render betting options based on match odds
                renderBetOptions('1x2');
                
                // Setup tab switching
                document.querySelectorAll('.bet-type-tab').forEach(tab => {
                    tab.addEventListener('click', function() {
                        if (document.getElementById('place-bet-btn').disabled && !isLive) return;
                        document.querySelectorAll('.bet-type-tab').forEach(t => t.classList.remove('active'));
                        this.classList.add('active');
                        renderBetOptions(this.dataset.tab);
                    });
                });
                
                // Quick amount buttons
                document.querySelectorAll('.quick-amount').forEach(btn => {
                    btn.addEventListener('click', () => {
                        document.getElementById('bet-amount').value = btn.dataset.amount;
                        updatePotential();
                    });
                });
                
                // Amount input handler
                document.getElementById('bet-amount').addEventListener('input', updatePotential);
                
                // Start auto-refresh for live matches
                if (isLive) {
                    startAutoRefresh();
                }
                
            } catch(e) {
                console.error('Error loading match:', e);
                document.getElementById('loading').innerHTML = `<div style="color:#ff5252;text-align:center;padding:40px;">Error: ${e.message}</div>`;
            }
        }
        
        // Auto-refresh match data for live matches
        function startAutoRefresh() {
            setInterval(async () => {
                if (currentMatch && currentMatch.status === 'live') {
                    try {
                        const { data } = await supabaseClient
                            .from('sports_matches')
                            .select('score, elapsed, status, bets_closed')
                            .eq('fixture_id', currentMatch.fixture_id)
                            .single();
                        
                        if (data) {
                            currentMatch.score = data.score;
                            currentMatch.elapsed = data.elapsed;
                            currentMatch.status = data.status;
                            currentMatch.bets_closed = data.bets_closed;
                            
                            // Update score display
                            if (data.score) {
                                const vsElement = document.querySelector('.vs-large');
                                if (vsElement && currentMatch.status === 'live') {
                                    vsElement.innerHTML = `<span style="font-size:28px;">${data.score.home || 0} - ${data.score.away || 0}</span>`;
                                }
                            }
                            
                            // Check if bets closed
                            if (data.bets_closed && !document.getElementById('place-bet-btn').disabled) {
                                document.getElementById('place-bet-btn').disabled = true;
                                document.getElementById('betting-info').innerHTML = '<i class="fas fa-ban"></i> Betting closed';
                            }
                        }
                    } catch(e) {
                        console.error('Auto-refresh error:', e);
                    }
                }
            }, 10000);
        }
        
        // Start countdown timer
        function startCountdown(matchTime) {
            if (countdownInterval) clearInterval(countdownInterval);
            
            function updateCountdown() {
                const now = new Date();
                const diff = matchTime - now;
                
                if (diff <= 0) {
                    document.getElementById('countdown-timer').innerHTML = '<span style="color:#00ff9d;"><i class="fas fa-play"></i> Match Started - Betting Active!</span>';
                    document.getElementById('place-bet-btn').disabled = false;
                    document.getElementById('betting-info').innerHTML = '<i class="fas fa-info-circle"></i> Live betting active - Place your bets!';
                    if (countdownInterval) clearInterval(countdownInterval);
                } else {
                    const minutes = Math.floor(diff / 60000);
                    const seconds = Math.floor((diff % 60000) / 1000);
                    document.getElementById('countdown-timer').innerHTML = `<i class="fas fa-hourglass-half"></i> Match starts in: ${minutes}m ${seconds}s - Betting opens at kickoff`;
                }
            }
            
            updateCountdown();
            countdownInterval = setInterval(updateCountdown, 1000);
        }
        
        // Render betting options
        function renderBetOptions(tab) {
            currentTab = tab;
            selectedBet = null;
            selectedBetName = null;
            selectedOdds = null;
            
            const container = document.getElementById('bet-options-container');
            const odds = currentMatch.odds || { home: 2.50, draw: 3.20, away: 2.80 };
            
            let html = '<div class="bet-options">';
            
            switch(tab) {
                case '1x2':
                    html += `
                        <div class="bet-option" data-type="home" data-odds="${odds.home}" data-name="Home Win">
                            <div class="bet-option-name">🏆 Home Win</div>
                            <div class="bet-option-odds">${odds.home}</div>
                        </div>
                        <div class="bet-option" data-type="draw" data-odds="${odds.draw}" data-name="Draw">
                            <div class="bet-option-name">🤝 Draw</div>
                            <div class="bet-option-odds">${odds.draw}</div>
                        </div>
                        <div class="bet-option" data-type="away" data-odds="${odds.away}" data-name="Away Win">
                            <div class="bet-option-name">🏆 Away Win</div>
                            <div class="bet-option-odds">${odds.away}</div>
                        </div>
                    `;
                    break;
                    
                case 'double':
                    const homeDraw = 1 / ((1/odds.home) + (1/odds.draw));
                    const homeAway = 1 / ((1/odds.home) + (1/odds.away));
                    const drawAway = 1 / ((1/odds.draw) + (1/odds.away));
                    html += `
                        <div class="bet-option" data-type="1X" data-odds="${homeDraw.toFixed(2)}" data-name="1X (Home or Draw)">
                            <div class="bet-option-name">🏠 1X (Home or Draw)</div>
                            <div class="bet-option-odds">${homeDraw.toFixed(2)}</div>
                        </div>
                        <div class="bet-option" data-type="12" data-odds="${homeAway.toFixed(2)}" data-name="12 (Home or Away)">
                            <div class="bet-option-name">⚡ 12 (Home or Away)</div>
                            <div class="bet-option-odds">${homeAway.toFixed(2)}</div>
                        </div>
                        <div class="bet-option" data-type="X2" data-odds="${drawAway.toFixed(2)}" data-name="X2 (Draw or Away)">
                            <div class="bet-option-name">🚀 X2 (Draw or Away)</div>
                            <div class="bet-option-odds">${drawAway.toFixed(2)}</div>
                        </div>
                    `;
                    break;
                    
                case 'overunder':
                    html += `
                        <div class="bet-option" data-type="over25" data-odds="1.85" data-name="Over 2.5 Goals">
                            <div class="bet-option-name">⚽ Over 2.5 Goals</div>
                            <div class="bet-option-odds">1.85</div>
                        </div>
                        <div class="bet-option" data-type="under25" data-odds="1.95" data-name="Under 2.5 Goals">
                            <div class="bet-option-name">🥅 Under 2.5 Goals</div>
                            <div class="bet-option-odds">1.95</div>
                        </div>
                    `;
                    break;
                    
                case 'btts':
                    html += `
                        <div class="bet-option" data-type="btts_yes" data-odds="1.90" data-name="Both Teams to Score - YES">
                            <div class="bet-option-name">✅ BTTS - YES</div>
                            <div class="bet-option-odds">1.90</div>
                        </div>
                        <div class="bet-option" data-type="btts_no" data-odds="1.90" data-name="Both Teams to Score - NO">
                            <div class="bet-option-name">❌ BTTS - NO</div>
                            <div class="bet-option-odds">1.90</div>
                        </div>
                    `;
                    break;
            }
            
            html += '</div>';
            container.innerHTML = html;
            
            // Add click handlers
            document.querySelectorAll('.bet-option').forEach(opt => {
                opt.addEventListener('click', function() {
                    if (this.classList.contains('disabled')) return;
                    document.querySelectorAll('.bet-option').forEach(o => o.classList.remove('selected'));
                    this.classList.add('selected');
                    selectedBet = this.dataset.type;
                    selectedBetName = this.dataset.name;
                    selectedOdds = parseFloat(this.dataset.odds);
                    updatePotential();
                    document.getElementById('place-bet-btn').disabled = false;
                    document.getElementById('place-bet-btn').innerHTML = '<span class="en">Place Bet</span><span class="ar" style="display:none;">ضع الرهان</span>';
                });
            });
            
            updatePotential();
        }
        
        // Update potential win display
        function updatePotential() {
            if (!selectedOdds) return;
            
            const amount = parseFloat(document.getElementById('bet-amount').value) || 0;
            const potentialWin = (amount * selectedOdds).toFixed(2);
            document.getElementById('potential-win').textContent = `$${potentialWin}`;
        }
        
        // Place bet using integrated system
        async function placeBet() {
            if (!selectedBet) {
                showError('Please select an outcome');
                return;
            }
            
            const amount = parseFloat(document.getElementById('bet-amount').value);
            
            if (isNaN(amount) || amount < 1) {
                showError('Minimum bet is $1');
                return;
            }
            
            const balanceText = document.getElementById('balance-display').textContent;
            const currentBalance = parseFloat(balanceText.replace('$', ''));
            
            if (amount > currentBalance) {
                showError('Insufficient balance!');
                return;
            }
            
            const btn = document.getElementById('place-bet-btn');
            btn.disabled = true;
            btn.innerHTML = '<div class="loading-spinner"></div> Processing...';
            hideMessages();
            
            try {
                const user = firebase.auth().currentUser;
                if (!user) throw new Error('Please login to place bets');
                
                let betResult = null;
                
                // Use BetManager from betting-engine.js if available
                if (window.BetManager && window.BetManager.placeBet) {
                    betResult = await window.BetManager.placeBet({
                        fixture_id: parseInt(fixtureId),
                        bet_type: selectedBet,
                        odds: selectedOdds,
                        amount: amount
                    });
                    
                    if (betResult) {
                        showSuccess(`Bet placed! Potential win: $${(amount * selectedOdds).toFixed(2)}`);
                        await refreshBalance();
                        
                        setTimeout(() => {
                            window.location.href = 'my-bets.html';
                        }, 2000);
                    } else {
                        throw new Error('Bet placement failed');
                    }
                } 
                // Use window.placeSingleBet from betting-engine.js if available
                else if (window.placeSingleBet) {
                    const result = await window.placeSingleBet(
                        parseInt(fixtureId),
                        selectedBet,
                        selectedBetName,
                        selectedOdds,
                        amount
                    );
                    
                    if (result.success) {
                        showSuccess(`Bet placed! Potential win: $${result.potentialWin.toFixed(2)}`);
                        await refreshBalance();
                        
                        setTimeout(() => {
                            window.location.href = 'my-bets.html';
                        }, 2000);
                    } else {
                        throw new Error(result.error || 'Bet placement failed');
                    }
                }
                // Direct Supabase insertion as fallback
                else {
                    const betId = `${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
                    const bet = {
                        id: betId,
                        user_id: user.uid,
                        fixture_id: parseInt(fixtureId),
                        bet_type: selectedBet,
                        bet_name: selectedBetName,
                        odds: selectedOdds,
                        amount: amount,
                        potential_win: amount * selectedOdds,
                        status: 'active',
                        placed_at: new Date().toISOString(),
                        match_status: currentMatch.status,
                        match_score: currentMatch.score
                    };
                    
                    // Insert bet
                    const { error: insertError } = await supabaseClient
                        .from('bets')
                        .insert(bet);
                    
                    if (insertError) throw insertError;
                    
                    // Deduct from wallet
                    const db = firebase.firestore();
                    const walletRef = db.collection('wallets').doc(user.uid);
                    await walletRef.update({
                        balance: firebase.firestore.FieldValue.increment(-amount),
                        updated_at: new Date().toISOString()
                    });
                    
                    showSuccess(`Bet placed! Potential win: $${(amount * selectedOdds).toFixed(2)}`);
                    await refreshBalance();
                    
                    setTimeout(() => {
                        window.location.href = 'my-bets.html';
                    }, 2000);
                }
                
            } catch(e) {
                console.error('Bet error:', e);
                showError(e.message || 'Failed to place bet');
                btn.disabled = false;
                btn.innerHTML = '<span class="en">Place Bet</span><span class="ar" style="display:none;">ضع الرهان</span>';
            }
        }
        
        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.innerHTML = `<i class="fas fa-exclamation-triangle"></i> ${message}`;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }
        
        function showSuccess(message) {
            const successDiv = document.getElementById('success-message');
            successDiv.innerHTML = `<i class="fas fa-check-circle"></i> ${message}`;
            successDiv.style.display = 'block';
        }
        
        function hideMessages() {
            document.getElementById('error-message').style.display = 'none';
            document.getElementById('success-message').style.display = 'none';
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        // Event listeners
        document.getElementById('place-bet-btn').addEventListener('click', placeBet);
        
        // Initialize
        firebase.auth().onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = '../login.html';
                return;
            }
            await loadBalance();
            await loadMatch();
            
            // Start balance refresh every 30 seconds
            balanceRefreshInterval = setInterval(refreshBalance, 30000);
        });
        
        // Cleanup intervals on page unload
        window.addEventListener('beforeunload', () => {
            if (countdownInterval) clearInterval(countdownInterval);
            if (balanceRefreshInterval) clearInterval(balanceRefreshInterval);
        });
        
        window.toggleLanguage = toggleLanguage;
    </script>
</body>
</html>
