<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Place Bet - X Lodon Betting</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/sports-betting.css">
    
    <style>
        body {
            background: #0a0f1a;
            color: white;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', 'Roboto', sans-serif;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 15px;
        }
        
        .page-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .back-btn {
            width: 40px;
            height: 40px;
            background: #111827;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #00ff9d;
            text-decoration: none;
            font-size: 18px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .page-title {
            font-size: 20px;
            font-weight: 700;
            color: white;
        }
        
        .match-hero {
            background: linear-gradient(135deg, #111827, #1a2332);
            border-radius: 20px;
            padding: 30px 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(0, 255, 157, 0.2);
            text-align: center;
        }
        
        .match-teams-large {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }
        
        .team-large {
            flex: 1;
            text-align: center;
        }
        
        .team-large-logo {
            width: 80px;
            height: 80px;
            background: rgba(0, 255, 157, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 28px;
            font-weight: 700;
            color: #00ff9d;
            border: 2px solid rgba(0, 255, 157, 0.3);
        }
        
        .team-large-name {
            font-size: 18px;
            font-weight: 600;
        }
        
        .vs-large {
            font-size: 24px;
            font-weight: 700;
            color: #ff9800;
        }
        
        .match-info-bar {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .info-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #a0a8c9;
            font-size: 14px;
        }
        
        .info-item i {
            color: #00ff9d;
        }
        
        .countdown-section {
            background: rgba(255, 82, 82, 0.05);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 82, 82, 0.2);
        }
        
        .betting-section {
            background: #111827;
            border-radius: 20px;
            padding: 20px;
            border: 2px solid #00ff9d;
        }
        
        .section-label {
            font-size: 16px;
            font-weight: 600;
            color: #00ff9d;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .bet-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }
        
        .bet-option {
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid transparent;
            border-radius: 15px;
            padding: 20px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .bet-option:hover {
            background: rgba(0, 255, 157, 0.1);
            border-color: rgba(0, 255, 157, 0.3);
        }
        
        .bet-option.selected {
            background: #00ff9d;
            border-color: #00ff9d;
        }
        
        .bet-option.selected .bet-option-label,
        .bet-option.selected .bet-option-odds {
            color: #000 !important;
        }
        
        .bet-option-label {
            font-size: 14px;
            color: #a0a8c9;
            margin-bottom: 8px;
        }
        
        .bet-option-odds {
            font-size: 28px;
            font-weight: 700;
            color: #00ff9d;
        }
        
        .amount-section {
            margin-bottom: 20px;
        }
        
        .amount-input-wrapper {
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 0 15px;
        }
        
        .amount-input-wrapper:focus-within {
            border-color: #00ff9d;
        }
        
        .currency-symbol {
            font-size: 20px;
            font-weight: 600;
            color: #00ff9d;
            margin-right: 5px;
        }
        
        .amount-input {
            flex: 1;
            padding: 18px 0;
            background: transparent;
            border: none;
            color: white;
            font-size: 20px;
            font-weight: 600;
            outline: none;
        }
        
        .quick-amounts {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin: 15px 0;
        }
        
        .quick-amount {
            padding: 12px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            color: #a0a8c9;
            transition: all 0.2s;
        }
        
        .quick-amount:hover {
            background: #00ff9d;
            color: #000;
            border-color: #00ff9d;
        }
        
        .potential-win-box {
            background: linear-gradient(135deg, rgba(0, 255, 157, 0.1), rgba(255, 152, 0, 0.1));
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
            border: 1px solid rgba(0, 255, 157, 0.2);
        }
        
        .potential-label {
            font-size: 14px;
            color: #a0a8c9;
            margin-bottom: 8px;
        }
        
        .potential-value {
            font-size: 36px;
            font-weight: 700;
            color: #00ff9d;
        }
        
        .place-bet-btn {
            width: 100%;
            padding: 20px;
            background: linear-gradient(135deg, #00ff9d, #00cc7a);
            color: #000;
            border: none;
            border-radius: 12px;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .place-bet-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 30px rgba(0, 255, 157, 0.3);
        }
        
        .place-bet-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: #a0a8c9;
        }
        
        .balance-display {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            margin-bottom: 15px;
        }
        
        .balance-label {
            color: #a0a8c9;
            font-size: 14px;
        }
        
        .balance-value {
            font-size: 22px;
            font-weight: 700;
            color: #00ff9d;
        }
        
        .error-message {
            background: rgba(255, 82, 82, 0.1);
            border: 1px solid #ff5252;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            color: #ff5252;
            display: none;
        }
        
        .success-message {
            background: rgba(76, 175, 80, 0.1);
            border: 1px solid #4caf50;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            color: #4caf50;
            display: none;
        }
        
        .betting-closed {
            text-align: center;
            padding: 30px;
            background: rgba(255, 82, 82, 0.1);
            border-radius: 15px;
            border: 2px solid #ff5252;
        }
        
        .betting-closed i {
            font-size: 48px;
            color: #ff5252;
            margin-bottom: 15px;
        }
        
        .betting-closed h3 {
            color: #ff5252;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Page Header -->
        <div class="page-header">
            <a href="upcoming-matches.html" class="back-btn">
                <i class="fas fa-arrow-left"></i>
            </a>
            <div class="page-title" id="page-title">Loading Match...</div>
        </div>
        
        <!-- Match Hero -->
        <div class="match-hero" id="match-hero">
            <div class="loading-spinner">
                <div class="spinner"></div>
                <p>Loading match details...</p>
            </div>
        </div>
        
        <!-- Countdown -->
        <div class="countdown-section" id="countdown-section" style="display: none;">
            <div style="text-align: center;">
                <div style="color: #a0a8c9; font-size: 14px; margin-bottom: 10px;">
                    <i class="fas fa-clock"></i> Kickoff in
                </div>
                <div class="countdown-value" id="countdown-timer">--:--:--</div>
            </div>
        </div>
        
        <!-- Betting Section -->
        <div class="betting-section" id="betting-section">
            <div class="section-label">
                <i class="fas fa-ticket-alt"></i>
                Place Your Bet
            </div>
            
            <!-- Balance -->
            <div class="balance-display">
                <span class="balance-label"><i class="fas fa-wallet"></i> Your Balance</span>
                <span class="balance-value" id="user-balance">$0.00</span>
            </div>
            
            <!-- Bet Options -->
            <div class="bet-options">
                <div class="bet-option" data-bet-type="home">
                    <div class="bet-option-label">Home Win</div>
                    <div class="bet-option-odds" id="odds-home">2.00</div>
                </div>
                <div class="bet-option" data-bet-type="draw">
                    <div class="bet-option-label">Draw</div>
                    <div class="bet-option-odds" id="odds-draw">3.50</div>
                </div>
                <div class="bet-option" data-bet-type="away">
                    <div class="bet-option-label">Away Win</div>
                    <div class="bet-option-odds" id="odds-away">3.80</div>
                </div>
            </div>
            
            <!-- Amount Input -->
            <div class="amount-section">
                <div class="amount-input-wrapper">
                    <span class="currency-symbol">$</span>
                    <input type="number" class="amount-input" id="bet-amount" value="10" min="1" max="1000" step="1">
                </div>
                
                <div class="quick-amounts">
                    <div class="quick-amount" data-amount="5">$5</div>
                    <div class="quick-amount" data-amount="10">$10</div>
                    <div class="quick-amount" data-amount="25">$25</div>
                    <div class="quick-amount" data-amount="50">$50</div>
                </div>
            </div>
            
            <!-- Potential Win -->
            <div class="potential-win-box">
                <div class="potential-label">Potential Win</div>
                <div class="potential-value" id="potential-win">$0.00</div>
            </div>
            
            <!-- Messages -->
            <div class="error-message" id="error-message"></div>
            <div class="success-message" id="success-message"></div>
            
            <!-- Place Bet Button -->
            <button class="place-bet-btn" id="place-bet-btn" disabled>
                <i class="fas fa-check"></i> Place Bet
            </button>
        </div>
        
        <!-- Betting Closed Section (hidden by default) -->
        <div class="betting-closed" id="betting-closed" style="display: none;">
            <i class="fas fa-times-circle"></i>
            <h3>Betting Closed</h3>
            <p id="closed-reason">This match is no longer available for betting</p>
        </div>
    </div>
    
    <!-- Scripts -->
    <script src="../js/firebase-config.js"></script>
    <script src="../js/betting-engine.js"></script>
    <script src="../js/wallet.js"></script>
    
    <script>
        // Firebase init
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        
        const auth = firebase.auth();
        const db = firebase.firestore();
        
        let currentUser = null;
        let currentMatch = null;
        let selectedBetType = null;
        let userBalance = 0;
        let countdownInterval = null;
        let unsubscribe = null;
        
        // Get fixture ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const fixtureId = urlParams.get('id');
        
        if (!fixtureId) {
            window.location.href = 'upcoming-matches.html';
        }
        
        // Auth check
        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = '../login.html';
                return;
            }
            currentUser = user;
            await loadBalance();
            loadMatchDetails();
        });
        
        async function loadBalance() {
            try {
                const doc = await db.collection('wallets').doc(currentUser.uid).get();
                if (doc.exists) {
                    userBalance = doc.data().balance || 0;
                    document.getElementById('user-balance').textContent = `$${userBalance.toFixed(2)}`;
                }
            } catch (error) {
                console.error('Error loading balance:', error);
            }
        }
        
        function loadMatchDetails() {
            unsubscribe = db.collection('sports_matches').doc(fixtureId)
                .onSnapshot((doc) => {
                    if (!doc.exists) {
                        window.location.href = 'upcoming-matches.html';
                        return;
                    }
                    
                    currentMatch = doc.data();
                    currentMatch.id = doc.id;
                    
                    displayMatchDetails();
                    checkBettingStatus();
                    
                }, (error) => {
                    console.error('Error loading match:', error);
                    document.getElementById('match-hero').innerHTML = 
                        '<div class="error-message" style="display: block;">Error loading match details</div>';
                });
        }
        
        function displayMatchDetails() {
            const hero = document.getElementById('match-hero');
            const match = currentMatch;
            
            document.getElementById('page-title').textContent = 
                `${match.homeTeam.name} vs ${match.awayTeam.name}`;
            
            const kickoff = match.startTime.toDate();
            const dateStr = kickoff.toLocaleDateString('en-US', { 
                weekday: 'short', month: 'short', day: 'numeric' 
            });
            const timeStr = kickoff.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            hero.innerHTML = `
                <div class="match-teams-large">
                    <div class="team-large">
                        <div class="team-large-logo">${match.homeTeam.name.substring(0, 3).toUpperCase()}</div>
                        <div class="team-large-name">${match.homeTeam.name}</div>
                    </div>
                    <div class="vs-large">VS</div>
                    <div class="team-large">
                        <div class="team-large-logo">${match.awayTeam.name.substring(0, 3).toUpperCase()}</div>
                        <div class="team-large-name">${match.awayTeam.name}</div>
                    </div>
                </div>
                <div class="match-info-bar">
                    <div class="info-item">
                        <i class="fas fa-trophy"></i>
                        ${match.leagueName || 'League'}
                    </div>
                    <div class="info-item">
                        <i class="fas fa-calendar"></i>
                        ${dateStr}
                    </div>
                    <div class="info-item">
                        <i class="fas fa-clock"></i>
                        ${timeStr}
                    </div>
                </div>
            `;
            
            // Update odds
            document.getElementById('odds-home').textContent = match.odds?.home?.toFixed(2) || '2.00';
            document.getElementById('odds-draw').textContent = match.odds?.draw?.toFixed(2) || '3.50';
            document.getElementById('odds-away').textContent = match.odds?.away?.toFixed(2) || '3.80';
        }
        
        function checkBettingStatus() {
            const bettingSection = document.getElementById('betting-section');
            const closedSection = document.getElementById('betting-closed');
            const countdownSection = document.getElementById('countdown-section');
            const placeBtn = document.getElementById('place-bet-btn');
            
            if (currentMatch.status !== 'upcoming') {
                bettingSection.style.display = 'none';
                closedSection.style.display = 'block';
                document.getElementById('closed-reason').textContent = 
                    currentMatch.status === 'live' ? 'Match is currently in progress' : 'Match has finished';
                return;
            }
            
            const now = new Date();
            const kickoff = currentMatch.startTime.toDate();
            const timeUntilKickoff = kickoff - now;
            const twoMinutesInMs = 2 * 60 * 1000;
            
            if (timeUntilKickoff < twoMinutesInMs) {
                bettingSection.style.display = 'none';
                closedSection.style.display = 'block';
                document.getElementById('closed-reason').textContent = 'Betting closed - Too close to kickoff';
                return;
            }
            
            // Betting is open
            bettingSection.style.display = 'block';
            closedSection.style.display = 'none';
            countdownSection.style.display = 'block';
            
            startCountdown(kickoff);
        }
        
        function startCountdown(kickoff) {
            if (countdownInterval) clearInterval(countdownInterval);
            
            const timerElement = document.getElementById('countdown-timer');
            
            countdownInterval = setInterval(() => {
                const now = new Date();
                const diff = kickoff - now;
                
                if (diff <= 0) {
                    clearInterval(countdownInterval);
                    timerElement.textContent = '00:00:00';
                    checkBettingStatus();
                    return;
                }
                
                const hours = Math.floor(diff / (60 * 60 * 1000));
                const minutes = Math.floor((diff % (60 * 60 * 1000)) / (60 * 1000));
                const seconds = Math.floor((diff % (60 * 1000)) / 1000);
                
                timerElement.textContent = 
                    `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                
                // Warning when less than 5 minutes
                if (diff < 5 * 60 * 1000) {
                    timerElement.classList.add('warning');
                }
            }, 1000);
        }
        
        // Event Listeners
        document.addEventListener('DOMContentLoaded', () => {
            // Bet option selection
            document.querySelectorAll('.bet-option').forEach(option => {
                option.addEventListener('click', () => {
                    document.querySelectorAll('.bet-option').forEach(o => o.classList.remove('selected'));
                    option.classList.add('selected');
                    selectedBetType = option.dataset.betType;
                    
                    document.getElementById('place-bet-btn').disabled = false;
                    updatePotentialWin();
                });
            });
            
            // Quick amounts
            document.querySelectorAll('.quick-amount').forEach(btn => {
                btn.addEventListener('click', () => {
                    const amount = parseFloat(btn.dataset.amount);
                    document.getElementById('bet-amount').value = amount;
                    updatePotentialWin();
                });
            });
            
            // Amount input
            document.getElementById('bet-amount').addEventListener('input', updatePotentialWin);
            
            // Place bet
            document.getElementById('place-bet-btn').addEventListener('click', placeBet);
        });
        
        function updatePotentialWin() {
            if (!selectedBetType || !currentMatch) return;
            
            const amount = parseFloat(document.getElementById('bet-amount').value) || 0;
            const odds = currentMatch.odds[selectedBetType];
            const potential = amount * odds;
            
            document.getElementById('potential-win').textContent = `$${potential.toFixed(2)}`;
            
            // Validate amount
            const placeBtn = document.getElementById('place-bet-btn');
            const errorMsg = document.getElementById('error-message');
            
            if (amount > userBalance) {
                placeBtn.disabled = true;
                errorMsg.style.display = 'block';
                errorMsg.innerHTML = '<i class="fas fa-exclamation-circle"></i> Insufficient balance';
            } else if (amount < 1) {
                placeBtn.disabled = true;
                errorMsg.style.display = 'block';
                errorMsg.innerHTML = '<i class="fas fa-exclamation-circle"></i> Minimum bet is $1';
            } else {
                placeBtn.disabled = false;
                errorMsg.style.display = 'none';
            }
        }
        
        async function placeBet() {
            const amount = parseFloat(document.getElementById('bet-amount').value);
            const placeBtn = document.getElementById('place-bet-btn');
            const errorMsg = document.getElementById('error-message');
            const successMsg = document.getElementById('success-message');
            
            if (!selectedBetType) {
                errorMsg.style.display = 'block';
                errorMsg.innerHTML = '<i class="fas fa-exclamation-circle"></i> Please select a bet type';
                return;
            }
            
            if (amount > userBalance) {
                errorMsg.style.display = 'block';
                errorMsg.innerHTML = '<i class="fas fa-exclamation-circle"></i> Insufficient balance';
                return;
            }
            
            placeBtn.disabled = true;
            placeBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
            
            try {
                const result = await placeBet(
                    parseInt(fixtureId),
                    selectedBetType,
                    amount
                );
                
                if (result.success) {
                    successMsg.style.display = 'block';
                    successMsg.innerHTML = `<i class="fas fa-check-circle"></i> ${result.message}`;
                    
                    // Reload balance
                    await loadBalance();
                    
                    // Reset selection
                    document.querySelectorAll('.bet-option').forEach(o => o.classList.remove('selected'));
                    selectedBetType = null;
                    document.getElementById('bet-amount').value = 10;
                    document.getElementById('potential-win').textContent = '$0.00';
                    
                    // Redirect to my bets after 2 seconds
                    setTimeout(() => {
                        window.location.href = 'my-bets.html';
                    }, 2000);
                } else {
                    errorMsg.style.display = 'block';
                    errorMsg.innerHTML = `<i class="fas fa-exclamation-circle"></i> ${result.error}`;
                    placeBtn.disabled = false;
                    placeBtn.innerHTML = '<i class="fas fa-check"></i> Place Bet';
                }
            } catch (error) {
                console.error('Error placing bet:', error);
                errorMsg.style.display = 'block';
                errorMsg.innerHTML = '<i class="fas fa-exclamation-circle"></i> Error placing bet. Please try again.';
                placeBtn.disabled = false;
                placeBtn.innerHTML = '<i class="fas fa-check"></i> Place Bet';
            }
        }
        
        // Cleanup
        window.addEventListener('beforeunload', () => {
            if (countdownInterval) clearInterval(countdownInterval);
            if (unsubscribe) unsubscribe();
        });
    </script>
</body>
</html>
