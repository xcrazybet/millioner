<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Place Bet - X Lodon | رهان</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <link rel="stylesheet" href="../css/sports-betting.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0f1a; color: white; font-family: 'Segoe UI', 'Tajawal', sans-serif; min-height: 100vh; }
        .header { background: #111827; padding: 15px; border-bottom: 2px solid #00ff9d; display: flex; align-items: center; gap: 15px; }
        .back-btn { color: #00ff9d; text-decoration: none; font-size: 20px; }
        .lang-toggle { background: #1a2332; border: 1px solid #00ff9d; color: #00ff9d; padding: 5px 12px; border-radius: 20px; cursor: pointer; margin-left: auto; }
        .container { max-width: 800px; margin: 0 auto; padding: 15px; }
        
        .match-hero { background: linear-gradient(135deg, #111827, #1a2332); border-radius: 20px; padding: 25px 15px; margin-bottom: 20px; text-align: center; border: 1px solid #00ff9d33; }
        .teams-large { display: flex; align-items: center; justify-content: center; gap: 15px; }
        .team-name-large { font-size: 18px; font-weight: bold; }
        .vs-large { font-size: 20px; color: #ff9800; font-weight: bold; }
        .league-info { color: #a0a8c9; font-size: 13px; margin-top: 10px; }
        
        .bet-type-tabs { display: flex; gap: 5px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px; }
        .bet-type-tab { padding: 10px 14px; background: #1a2332; border: none; border-radius: 25px; color: white; font-size: 12px; cursor: pointer; white-space: nowrap; }
        .bet-type-tab.active { background: #00ff9d; color: black; }
        
        .bet-section { background: #111827; border-radius: 20px; padding: 20px; margin-bottom: 20px; }
        .balance-row { display: flex; justify-content: space-between; padding: 12px; background: #0a0f1a; border-radius: 10px; margin-bottom: 20px; }
        
        .bet-options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
        .bet-option { background: #1a2332; border: 2px solid transparent; border-radius: 12px; padding: 15px; text-align: center; cursor: pointer; }
        .bet-option.selected { background: #00ff9d; border-color: #00ff9d; color: black; }
        .bet-option-odds { font-size: 22px; font-weight: bold; color: #00ff9d; }
        .bet-option.selected .bet-option-odds { color: black; }
        
        .amount-input { width: 100%; padding: 15px; background: #0a0f1a; border: 2px solid #ffffff22; border-radius: 12px; color: white; font-size: 20px; margin-bottom: 15px; }
        .quick-amounts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 20px; }
        .quick-amount { padding: 12px; background: #1a2332; border-radius: 8px; text-align: center; cursor: pointer; }
        
        .potential-box { background: linear-gradient(135deg, #00ff9d11, #ff980011); padding: 15px; border-radius: 12px; text-align: center; margin-bottom: 20px; }
        .potential-value { font-size: 32px; font-weight: bold; color: #00ff9d; }
        
        .place-btn { width: 100%; padding: 18px; background: #00ff9d; color: black; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .place-btn:disabled { opacity: 0.5; cursor: not-allowed; background: #a0a8c9; }
        .add-slip-btn { width: 100%; padding: 12px; background: transparent; border: 2px dashed #ff9800; border-radius: 10px; color: #ff9800; cursor: pointer; margin-bottom: 15px; }
        
        .error-msg { background: #ff525222; border: 1px solid #ff5252; border-radius: 10px; padding: 15px; margin-bottom: 15px; color: #ff5252; display: none; }
        .success-msg { background: #4caf5022; border: 1px solid #4caf50; border-radius: 10px; padding: 15px; margin-bottom: 15px; color: #4caf50; display: none; }
        
        .acc-slip { position: fixed; bottom: 0; left: 0; right: 0; background: #111827; border-top: 2px solid #ff9800; padding: 15px; z-index: 1000; max-height: 200px; overflow-y: auto; }
        .acc-slip-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .acc-slip-title { color: #ff9800; font-weight: 600; }
        .acc-slip-clear { color: #ff5252; font-size: 12px; cursor: pointer; }
        .acc-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #ffffff11; font-size: 12px; }
        .acc-total { display: flex; justify-content: space-between; padding: 10px 0; }
        .acc-total-odds { color: #ff9800; font-weight: bold; font-size: 18px; }
        .acc-place-btn { width: 100%; padding: 15px; background: #ff9800; color: black; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .acc-place-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .arabic { font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body>
    <div class="header">
        <a href="upcoming-matches.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        <h1 style="font-size:18px;"><i class="fas fa-futbol"></i> <span class="en">Place Bet</span><span class="ar" style="display:none;">ضع رهانك</span></h1>
        <button class="lang-toggle" onclick="toggleLanguage()"><span class="en">🇸🇦 عربي</span><span class="ar" style="display:none;">🇬🇧 English</span></button>
    </div>
    
    <div class="container" style="padding-bottom:200px;">
        <div id="loading" style="text-align:center; padding:40px;"><i class="fas fa-spinner fa-spin"></i> Loading...</div>
        
        <div id="content" style="display:none;">
            <div class="match-hero" id="match-hero"></div>
            
            <div class="bet-type-tabs">
                <button class="bet-type-tab active" data-tab="1x2">1X2</button>
                <button class="bet-type-tab" data-tab="overunder">Over/Under 2.5</button>
                <button class="bet-type-tab" data-tab="btts">BTTS</button>
                <button class="bet-type-tab" data-tab="doublechance">Double Chance</button>
            </div>
            
            <div class="bet-section">
                <div class="balance-row"><span><i class="fas fa-wallet"></i> Balance</span><span style="color:#00ff9d; font-weight:bold;" id="user-balance">$0.00</span></div>
                <div id="bet-options-container"></div>
                <input type="number" class="amount-input" id="bet-amount" value="10" min="1">
                <div class="quick-amounts"><div class="quick-amount" data-amount="5">$5</div><div class="quick-amount" data-amount="10">$10</div><div class="quick-amount" data-amount="25">$25</div><div class="quick-amount" data-amount="50">$50</div></div>
                <div class="potential-box"><div>Potential Win</div><div class="potential-value" id="potential-win">$0.00</div></div>
                <div class="error-msg" id="error-message"></div>
                <div class="success-msg" id="success-message"></div>
                <button class="place-btn" id="place-bet-btn" disabled>Select Outcome</button>
                <button class="add-slip-btn" id="add-to-slip-btn" style="display:none;"><i class="fas fa-plus"></i> Add to Accumulator Slip</button>
            </div>
        </div>
    </div>
    
    <div class="acc-slip" id="acc-slip" style="display:none;">
        <div class="acc-slip-header">
            <span class="acc-slip-title"><i class="fas fa-layer-group"></i> Bet Slip (<span id="slip-count">0</span>)</span>
            <span class="acc-slip-clear" onclick="clearSlip()"><i class="fas fa-trash"></i> Clear</span>
        </div>
        <div id="slip-items"></div>
        <div class="acc-total"><span>Total Odds:</span><span class="acc-total-odds" id="slip-total-odds">1.00</span></div>
        <button class="acc-place-btn" id="place-acc-btn" disabled onclick="placeAccumulator()">Add 2+ Selections</button>
    </div>

    <script src="../js/supabase-client.js"></script>
    <script src="../js/betting-engine.js"></script>
    <script>
        const firebaseConfig = { apiKey:"AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM", authDomain:"x-bet-prod-jd.firebaseapp.com", projectId:"x-bet-prod-jd", storageBucket:"x-bet-prod-jd.firebasestorage.app", messagingSenderId:"499334334535", appId:"1:499334334535:web:bebc1bf817e24d9e3c4962" };
        if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth=firebase.auth();
        const params=new URLSearchParams(location.search), fixtureId=params.get('id');
        
        let currentMatch=null, selectedType=null, balance=0, currentTab='1x2';
        
        if(!fixtureId){ document.getElementById('loading').style.display='none'; document.getElementById('content').innerHTML='<div style="color:#ff5252; text-align:center; padding:40px;">No match selected</div>'; document.getElementById('content').style.display='block'; }
        
        auth.onAuthStateChanged(async u=>{ if(!u){location.href='../login.html';return;} await loadBalance(); if(fixtureId) loadMatch(); });
        
        async function loadBalance(){ const db=firebase.firestore(); const d=await db.collection('wallets').doc(auth.currentUser.uid).get(); balance=d.exists?(d.data().balance||0):0; document.getElementById('user-balance').textContent='$'+balance.toFixed(2); }
        
        async function loadMatch(){
            if (!window.supaDB) { document.getElementById('loading').innerHTML='<div style="color:#ff5252;">Supabase not connected</div>'; return; }
            
            const { data } = await supaClient.from('sports_matches').select('*').eq('fixture_id', parseInt(fixtureId)).single();
            if (!data) { document.getElementById('loading').style.display='none'; document.getElementById('content').style.display='block'; document.getElementById('content').innerHTML='<div style="color:#ff5252; text-align:center; padding:40px;">Match not found</div>'; return; }
            
            currentMatch = data;
            document.getElementById('loading').style.display='none';
            document.getElementById('content').style.display='block';
            
            const homeName = currentMatch.home_team?.name || 'Home';
            const awayName = currentMatch.away_team?.name || 'Away';
            document.getElementById('match-hero').innerHTML = `<div class="teams-large"><div><div class="team-name-large">${homeName}</div></div><div class="vs-large">VS</div><div><div class="team-name-large">${awayName}</div></div></div><div class="league-info"><i class="fas fa-trophy"></i> ${currentMatch.league_name||'League'}</div>`;
            renderBetOptions('1x2');
            updateSlipUI();
        }
        
        function renderBetOptions(type){
            currentTab=type; selectedType=null;
            const c=document.getElementById('bet-options-container');
            const odds=currentMatch.odds||{};
            let html='';
            if(type==='1x2') html=`<div class="bet-options"><div class="bet-option" data-type="home"><div>Home Win</div><div class="bet-option-odds">${odds.home||'2.00'}</div></div><div class="bet-option" data-type="draw"><div>Draw</div><div class="bet-option-odds">${odds.draw||'3.50'}</div></div><div class="bet-option" data-type="away"><div>Away Win</div><div class="bet-option-odds">${odds.away||'3.80'}</div></div></div>`;
            else if(type==='overunder') html=`<div class="bet-options"><div class="bet-option" data-type="over25"><div>Over 2.5</div><div class="bet-option-odds">1.80</div></div><div class="bet-option" data-type="under25"><div>Under 2.5</div><div class="bet-option-odds">2.00</div></div></div>`;
            else if(type==='btts') html=`<div class="bet-options"><div class="bet-option" data-type="btts_yes"><div>BTTS Yes</div><div class="bet-option-odds">1.90</div></div><div class="bet-option" data-type="btts_no"><div>BTTS No</div><div class="bet-option-odds">1.85</div></div></div>`;
            else if(type==='doublechance') html=`<div class="bet-options"><div class="bet-option" data-type="1X"><div>1X</div><div class="bet-option-odds">1.40</div></div><div class="bet-option" data-type="12"><div>12</div><div class="bet-option-odds">1.35</div></div><div class="bet-option" data-type="X2"><div>X2</div><div class="bet-option-odds">1.45</div></div></div>`;
            
            c.innerHTML=html;
            document.getElementById('place-bet-btn').disabled=true;
            document.getElementById('add-to-slip-btn').style.display='none';
            
            c.querySelectorAll('.bet-option').forEach(o=>o.addEventListener('click',function(){
                c.querySelectorAll('.bet-option').forEach(x=>x.classList.remove('selected'));
                this.classList.add('selected'); selectedType=this.dataset.type;
                document.getElementById('place-bet-btn').disabled=false;
                document.getElementById('add-to-slip-btn').style.display='block';
                updatePotential();
            }));
        }
        
        document.querySelectorAll('.bet-type-tab').forEach(t=>t.addEventListener('click',function(){
            document.querySelectorAll('.bet-type-tab').forEach(x=>x.classList.remove('active'));
            this.classList.add('active'); renderBetOptions(this.dataset.tab);
        }));
        
        document.querySelectorAll('.quick-amount').forEach(b=>b.addEventListener('click',()=>{document.getElementById('bet-amount').value=b.dataset.amount; updatePotential();}));
        document.getElementById('bet-amount').addEventListener('input',updatePotential);
        
        function updatePotential(){
            if(!selectedType) return;
            const amount=parseFloat(document.getElementById('bet-amount').value)||0;
            const om={home:2,draw:3.5,away:3.8,over25:1.8,under25:2,btts_yes:1.9,btts_no:1.85,'1X':1.4,'12':1.35,'X2':1.45};
            document.getElementById('potential-win').textContent='$'+(amount*(om[selectedType]||2)).toFixed(2);
        }
        
        document.getElementById('add-to-slip-btn').addEventListener('click',()=>{
            if(!selectedType||!currentMatch) return;
            const om={home:2,draw:3.5,away:3.8,over25:1.8,under25:2,btts_yes:1.9,btts_no:1.85,'1X':1.4,'12':1.35,'X2':1.45};
            const tn={home:'Home',draw:'Draw',away:'Away',over25:'Over 2.5',under25:'Under 2.5',btts_yes:'BTTS Yes',btts_no:'BTTS No','1X':'1X','12':'12','X2':'X2'};
            const sel={fixtureId:currentMatch.fixture_id, matchName:`${currentMatch.home_team?.name} vs ${currentMatch.away_team?.name}`, betType:selectedType, betTypeName:tn[selectedType]||selectedType, odds:om[selectedType]||2};
            if(addToSlip(sel)){ updateSlipUI(); document.getElementById('success-message').style.display='block'; document.getElementById('success-message').textContent='Added to slip!'; setTimeout(()=>document.getElementById('success-message').style.display='none',2000); }
        });
        
        function updateSlipUI(){
            const slip=document.getElementById('acc-slip');
            const count=window.ACCUMULATOR_SLIP.length;
            if(count===0){ slip.style.display='none'; return; }
            slip.style.display='block';
            document.getElementById('slip-count').textContent=count;
            let items=''; let totalOdds=1;
            window.ACCUMULATOR_SLIP.forEach((s,i)=>{ totalOdds*=s.odds; items+=`<div class="acc-item"><span>${s.matchName} - ${s.betTypeName} @${s.odds}</span><span style="color:#ff5252; cursor:pointer;" onclick="removeFromSlip(${i});updateSlipUI();"><i class="fas fa-times"></i></span></div>`; });
            document.getElementById('slip-items').innerHTML=items;
            document.getElementById('slip-total-odds').textContent=totalOdds.toFixed(2);
            document.getElementById('place-acc-btn').disabled=count<2;
        }
        
        window.clearSlip=()=>{clearSlip(); updateSlipUI();};
        window.placeAccumulator=async()=>{
            const amount=parseFloat(document.getElementById('bet-amount').value)||10;
            if(window.ACCUMULATOR_SLIP.length<2) return alert('Add 2+ selections');
            if(amount>balance) return alert('Insufficient balance');
            try { const r=await placeAccumulatorBet(window.ACCUMULATOR_SLIP,amount); if(r.success){ alert('Accumulator placed!'); location.href='my-bets.html'; } else alert(r.error); }
            catch(e){ alert('Error'); }
        };
        
        document.getElementById('place-bet-btn').addEventListener('click',async()=>{
            const amount=parseFloat(document.getElementById('bet-amount').value);
            if(!selectedType) return;
            if(amount>balance) return alert('Insufficient balance');
            const btn=document.getElementById('place-bet-btn'); btn.disabled=true; btn.textContent='Processing...';
            try { const r=await placeSingleBet(parseInt(fixtureId),selectedType,amount); if(r.success){ alert('Bet placed!'); location.href='my-bets.html'; } else { alert(r.error); btn.disabled=false; } }
            catch(e){ alert('Error'); btn.disabled=false; }
        });
    </script>
</body>
</html>
