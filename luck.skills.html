<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🔥 TrendCrash - XCrazyBet</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --primary: #00ff9d;
            --primary-dark: #00cc7a;
            --secondary: #ff9800;
            --secondary-dark: #cc7a00;
            --danger: #ff5252;
            --success: #4caf50;
            --warning: #ffc107;
            --bg: #0a0f1a;
            --surface: #111827;
            --surface-light: #1a2332;
            --text: #ffffff;
            --text-dim: #a0a8c9;
            --trend-fire: linear-gradient(135deg, #ff3300, #ff9900);
            --trend-crypto: linear-gradient(135deg, #00ccff, #9900ff);
            --trend-music: linear-gradient(135deg, #ff00cc, #ff0066);
            --trend-game: linear-gradient(135deg, #00ff99, #0099ff);
            --trend-global: linear-gradient(135deg, #ffcc00, #ff3300);
            --dark-bg: #000000;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Segoe UI', 'Roboto', system-ui, -apple-system, sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            touch-action: manipulation;
        }

        /* Fullscreen container */
        .game-container {
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Background Effects */
        .bg-effects {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: 
                radial-gradient(circle at 20% 30%, rgba(0, 255, 157, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(255, 152, 0, 0.08) 0%, transparent 50%),
                linear-gradient(135deg, var(--dark-bg) 0%, var(--bg) 100%);
        }

        /* Header */
        .game-header {
            background: rgba(17, 24, 39, 0.95);
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
            backdrop-filter: blur(10px);
            z-index: 1000;
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .home-btn {
            width: 36px;
            height: 36px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #000;
            font-size: 18px;
            transition: all 0.3s;
        }

        .home-btn:hover {
            background: var(--primary-dark);
            transform: scale(1.1);
        }

        .logo {
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--primary);
        }

        .logo i {
            color: var(--primary);
        }

        .balance-display {
            background: linear-gradient(45deg, #1a2332, #0f172a);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--primary);
            color: var(--primary);
            font-weight: 700;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Game Area */
        .game-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 15px;
            gap: 15px;
            overflow-y: auto;
        }

        /* Trend Display */
        .trend-display {
            background: rgba(17, 24, 39, 0.8);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            border: 2px solid rgba(255, 152, 0, 0.3);
            backdrop-filter: blur(10px);
        }

        .trend-name {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .trend-strength {
            font-size: 14px;
            color: var(--text-dim);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .strength-bar {
            flex: 1;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
        }

        .strength-fill {
            height: 100%;
            width: 0%;
            border-radius: 3px;
            transition: width 0.3s;
        }

        /* Multiplier Display */
        .multiplier-display {
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.7), rgba(20, 20, 40, 0.7));
            border-radius: 20px;
            padding: 30px 20px;
            text-align: center;
            border: 3px solid rgba(0, 255, 157, 0.3);
            margin: 10px 0;
            position: relative;
            overflow: hidden;
        }

        .multiplier-label {
            font-size: 16px;
            color: var(--text-dim);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .multiplier-value {
            font-size: 64px;
            font-weight: 900;
            color: var(--primary);
            text-shadow: 0 0 20px rgba(0, 255, 157, 0.5);
            line-height: 1;
            margin-bottom: 10px;
            transition: all 0.1s;
        }

        .multiplier-value.rising {
            animation: pulse 0.5s infinite alternate;
        }

        .multiplier-value.crash {
            color: var(--danger);
            animation: crashShake 0.5s;
            text-shadow: 0 0 30px rgba(255, 82, 82, 0.7);
        }

        .multiplier-timer {
            font-size: 14px;
            color: var(--text-dim);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        /* Trend Visualization */
        .trend-visualization {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 15px;
            padding: 20px;
            border: 2px solid rgba(255, 152, 0, 0.2);
            height: 200px;
            position: relative;
            overflow: hidden;
        }

        .trend-canvas {
            width: 100%;
            height: 100%;
            border-radius: 10px;
        }

        .trend-line {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 2px;
            transform-origin: left center;
            transform: scaleX(0);
            transition: transform 0.1s linear;
        }

        .crash-point {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 20px;
            background: var(--danger);
            opacity: 0.5;
        }

        /* Control Panel */
        .control-panel {
            background: rgba(17, 24, 39, 0.95);
            border-radius: 15px;
            padding: 20px;
            border: 2px solid rgba(255, 152, 0, 0.2);
            backdrop-filter: blur(10px);
            flex-shrink: 0;
        }

        /* Bet Controls */
        .bet-controls {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 15px;
            margin-bottom: 20px;
            align-items: center;
        }

        .bet-input-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .bet-input {
            flex: 1;
            padding: 15px;
            background: rgba(10, 15, 26, 0.8);
            border: 2px solid var(--primary);
            border-radius: 10px;
            color: var(--text);
            font-size: 18px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .bet-input:focus {
            outline: none;
            border-color: var(--secondary);
            box-shadow: 0 0 0 3px rgba(255, 152, 0, 0.1);
        }

        .currency {
            color: var(--primary);
            font-weight: 700;
            font-size: 18px;
        }

        /* Quick Bets */
        .quick-bets {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .quick-bet {
            padding: 12px;
            background: rgba(10, 15, 26, 0.8);
            border: 1px solid var(--primary);
            border-radius: 8px;
            color: var(--primary);
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
            user-select: none;
        }

        .quick-bet:hover, .quick-bet.active {
            background: var(--primary);
            color: #000;
            transform: translateY(-2px);
        }

        /* Start Game Button */
        .start-game-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: none;
            border-radius: 10px;
            color: #000;
            font-size: 18px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .start-game-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 255, 157, 0.3);
        }

        .start-game-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Auto Cashout */
        .auto-cashout {
            background: rgba(10, 15, 26, 0.8);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 152, 0, 0.3);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .auto-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toggle-switch {
            width: 50px;
            height: 26px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 13px;
            position: relative;
            cursor: pointer;
            transition: all 0.3s;
        }

        .toggle-switch.active {
            background: var(--primary);
        }

        .toggle-slider {
            width: 22px;
            height: 22px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 2px;
            left: 2px;
            transition: all 0.3s;
        }

        .toggle-switch.active .toggle-slider {
            left: 26px;
        }

        .auto-input-group {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .auto-input {
            flex: 1;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            color: var(--text);
            text-align: center;
        }

        .auto-label {
            color: var(--text-dim);
            font-size: 14px;
            white-space: nowrap;
        }

        /* Cashout Button */
        .cashout-button {
            width: 100%;
            padding: 25px;
            background: linear-gradient(135deg, var(--secondary), var(--secondary-dark));
            border: none;
            border-radius: 15px;
            color: #000;
            font-size: 28px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
            margin-bottom: 15px;
            user-select: none;
            touch-action: manipulation;
        }

        .cashout-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .cashout-button:not(:disabled):hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(255, 152, 0, 0.4);
        }

        .cashout-button.pulsing {
            animation: cashoutPulse 1s infinite;
        }

        .cashout-button i {
            margin-right: 15px;
        }

        /* Game Stats */
        .game-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat-item {
            background: rgba(0, 0, 0, 0.3);
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-label {
            color: var(--text-dim);
            font-size: 12px;
            margin-bottom: 5px;
        }

        .stat-value {
            color: var(--text);
            font-size: 16px;
            font-weight: 700;
        }

        /* History */
        .history-panel {
            background: rgba(17, 24, 39, 0.8);
            border-radius: 15px;
            padding: 15px;
            border: 1px solid rgba(255, 152, 0, 0.2);
            max-height: 120px;
            overflow-y: auto;
        }

        .history-title {
            font-size: 14px;
            color: var(--secondary);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 152, 0, 0.2);
        }

        .history-list {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 5px 0;
        }

        .history-item {
            min-width: 60px;
            padding: 8px;
            background: rgba(10, 15, 26, 0.5);
            border-radius: 8px;
            text-align: center;
            font-size: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .history-item.win {
            background: rgba(0, 255, 157, 0.1);
            border-color: var(--primary);
        }

        .history-item.lose {
            background: rgba(255, 82, 82, 0.1);
            border-color: var(--danger);
        }

        /* Result Overlay */
        .result-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .result-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .result-content {
            background: rgba(17, 24, 39, 0.95);
            padding: 30px;
            border-radius: 20px;
            border: 3px solid var(--primary);
            text-align: center;
            max-width: 350px;
            width: 90%;
            backdrop-filter: blur(20px);
            box-shadow: 0 0 40px rgba(0, 255, 157, 0.3);
        }

        .result-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .result-win {
            color: var(--primary);
        }

        .result-lose {
            color: var(--danger);
        }

        .result-details {
            font-size: 18px;
            margin: 15px 0;
            color: var(--text);
        }

        .result-amount {
            font-size: 42px;
            font-weight: 900;
            margin: 20px 0;
            color: var(--primary);
            text-shadow: 0 0 20px rgba(0, 255, 157, 0.5);
        }

        .result-amount.lose {
            color: var(--danger);
            text-shadow: 0 0 20px rgba(255, 82, 82, 0.5);
        }

        .result-multiplier {
            font-size: 24px;
            color: var(--secondary);
            margin-top: 10px;
        }

        /* Toast Notifications */
        .toast-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 300px;
            width: 90%;
        }

        .toast {
            padding: 15px;
            background: rgba(17, 24, 39, 0.95);
            border-radius: 10px;
            border-left: 4px solid var(--primary);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
            transform: translateY(100%);
            opacity: 0;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
            font-size: 14px;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.success {
            border-color: var(--primary);
        }

        .toast.error {
            border-color: var(--danger);
        }

        .toast.warning {
            border-color: var(--secondary);
        }

        /* Fullscreen Toggle */
        .fullscreen-toggle {
            position: fixed;
            top: 80px;
            right: 15px;
            width: 40px;
            height: 40px;
            background: rgba(17, 24, 39, 0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            font-size: 18px;
            cursor: pointer;
            z-index: 1001;
            border: 2px solid var(--primary);
        }

        /* Crash Animation */
        .crash-animation {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, var(--danger) 0%, transparent 70%);
            border-radius: 50%;
            opacity: 0;
            z-index: 1500;
            pointer-events: none;
        }

        .crash-animation.show {
            animation: explosion 0.8s ease-out forwards;
        }

        /* Animations */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @keyframes cashoutPulse {
            0%, 100% { 
                box-shadow: 0 0 0 0 rgba(255, 152, 0, 0.7);
                transform: scale(1);
            }
            50% { 
                box-shadow: 0 0 0 15px rgba(255, 152, 0, 0);
                transform: scale(1.02);
            }
        }

        @keyframes crashShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        @keyframes explosion {
            0% { transform: scale(0); opacity: 1; }
            100% { transform: scale(3); opacity: 0; }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .game-header {
                flex-direction: column;
                gap: 10px;
                padding: 10px;
            }

            .header-left {
                width: 100%;
                justify-content: space-between;
            }

            .balance-display {
                width: 100%;
            }

            .multiplier-value {
                font-size: 48px;
            }

            .cashout-button {
                padding: 20px;
                font-size: 24px;
            }

            .bet-controls {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .quick-bets {
                grid-template-columns: repeat(2, 1fr);
            }

            .game-stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .auto-cashout {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }
        }

        @media (max-width: 480px) {
            .multiplier-value {
                font-size: 36px;
            }

            .cashout-button {
                padding: 18px;
                font-size: 20px;
            }

            .trend-name {
                font-size: 18px;
            }

            .game-stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Background Effects -->
    <div class="bg-effects"></div>

    <!-- Fullscreen Toggle -->
    <div class="fullscreen-toggle" id="fullscreen-toggle" title="Toggle Fullscreen">
        <i class="fas fa-expand"></i>
    </div>

    <!-- Game Container -->
    <div class="game-container" id="game-container">
        <!-- Header -->
        <header class="game-header">
            <div class="header-left">
                <a href="https://xcrazybet.github.io/millioner" class="home-btn" title="Return to Home">
                    <i class="fas fa-home"></i>
                </a>
                <div class="logo">
                    <i class="fas fa-chart-line"></i>
                    TrendCrash
                </div>
            </div>
            <div class="balance-display">
                <i class="fas fa-wallet"></i>
                $<span id="balance-val">1000.00</span>
            </div>
        </header>

        <!-- Game Area -->
        <div class="game-area">
            <!-- Trend Display -->
            <div class="trend-display">
                <div class="trend-name" id="trend-name">🔥 Viral Trend</div>
                <div class="trend-strength">
                    <span>Strength:</span>
                    <div class="strength-bar">
                        <div class="strength-fill" id="strength-fill" style="width: 0%"></div>
                    </div>
                    <span id="strength-value">0%</span>
                </div>
                
                <!-- Multiplier Display -->
                <div class="multiplier-display">
                    <div class="multiplier-label">Current Multiplier</div>
                    <div class="multiplier-value" id="multiplier-value">1.00x</div>
                    <div class="multiplier-timer">
                        <i class="fas fa-clock"></i>
                        <span id="game-timer">Ready to play!</span>
                    </div>
                </div>
            </div>

            <!-- Trend Visualization -->
            <div class="trend-visualization">
                <canvas class="trend-canvas" id="trend-canvas"></canvas>
                <div class="trend-line" id="trend-line"></div>
            </div>

            <!-- Control Panel -->
            <div class="control-panel">
                <!-- Bet Controls -->
                <div class="bet-controls">
                    <div class="bet-input-group">
                        <input type="number" class="bet-input" id="bet-amount" value="5" min="1" max="1000" step="1">
                        <div class="currency">$</div>
                    </div>
                    <div class="bet-summary">
                        <div style="color: var(--text-dim); font-size: 14px;">Potential Win:</div>
                        <div style="color: var(--primary); font-weight: 700; font-size: 18px;" id="potential-win">$5.00</div>
                    </div>
                </div>

                <!-- Quick Bets -->
                <div class="quick-bets">
                    <div class="quick-bet" data-amount="1">$1</div>
                    <div class="quick-bet" data-amount="5">$5</div>
                    <div class="quick-bet" data-amount="10">$10</div>
                    <div class="quick-bet" data-amount="25">$25</div>
                </div>

                <!-- Start Game Button -->
                <button id="start-game-btn" class="start-game-btn">
                    <i class="fas fa-play"></i> START GAME
                </button>

                <!-- Auto Cashout -->
                <div class="auto-cashout">
                    <div class="auto-toggle">
                        <div class="toggle-switch" id="auto-toggle">
                            <div class="toggle-slider"></div>
                        </div>
                        <span class="auto-label">Auto Cashout</span>
                    </div>
                    <div class="auto-input-group">
                        <input type="number" class="auto-input" id="auto-cashout-value" value="2.00" min="1.01" max="100" step="0.1" disabled>
                        <span class="auto-label">x</span>
                    </div>
                </div>

                <!-- Cashout Button -->
                <button id="cashout-btn" class="cashout-button" disabled>
                    <i class="fas fa-money-check-alt"></i> CASH OUT
                </button>

                <!-- Game Stats -->
                <div class="game-stats">
                    <div class="stat-item">
                        <div class="stat-label">Games Played</div>
                        <div class="stat-value" id="games-played">0</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Win Rate</div>
                        <div class="stat-value" id="win-rate">0%</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">RTP</div>
                        <div class="stat-value">97%</div>
                    </div>
                </div>

                <!-- Recent Games -->
                <div class="history-panel">
                    <div class="history-title">
                        <i class="fas fa-history"></i> RECENT CRASHES
                    </div>
                    <div class="history-list" id="crash-history">
                        <div class="history-item lose">1.25x</div>
                        <div class="history-item">2.10x</div>
                        <div class="history-item lose">1.05x</div>
                        <div class="history-item">3.45x</div>
                        <div class="history-item">1.80x</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Result Overlay -->
    <div class="result-overlay" id="result-overlay">
        <div class="result-content">
            <div class="result-title" id="result-title">YOU CASHED OUT!</div>
            <div class="result-details" id="result-details">
                Multiplier: <span id="result-multiplier">1.00x</span>
            </div>
            <div class="result-amount" id="result-amount">+$0.00</div>
            <div class="result-multiplier" id="result-timer">Game lasted: 0s</div>
            <button id="play-again-btn" class="cashout-button" style="margin-top: 20px; padding: 15px; font-size: 20px;">
                <i class="fas fa-redo"></i> PLAY AGAIN
            </button>
        </div>
    </div>

    <!-- Crash Animation -->
    <div class="crash-animation" id="crash-animation"></div>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>

    <script>
        // ===== GAME STATE =====
        const gameState = {
            balance: 1000, // Starting balance
            betAmount: 5,
            currentMultiplier: 1.00,
            gameActive: false,
            gameTimer: 0,
            gameInterval: null,
            crashPoint: 1.00,
            cashoutAt: 0,
            autoCashout: false,
            autoCashoutValue: 2.00,
            
            // Hidden 90% lose rate system
            winProbability: 0.10,
            
            // Trend system
            currentTrend: 0,
            trends: [
                { name: "🔥 Viral Trend", color: "#ff3300" },
                { name: "💎 Crypto Buzz", color: "#00ccff" },
                { name: "🎵 Music Hit", color: "#ff00cc" },
                { name: "🎮 Game Hype", color: "#00ff99" },
                { name: "🌍 Global Topic", color: "#ffcc00" }
            ],
            
            // Game stats
            gamesPlayed: 0,
            gamesWon: 0,
            crashHistory: [1.25, 2.10, 1.05, 3.45, 1.80],
            
            // Current game
            currentGame: {
                bet: 0,
                multiplier: 0,
                win: false,
                crashed: false,
                duration: 0,
                winAmount: 0
            }
        };

        // ===== SOUND EFFECTS =====
        const SoundManager = {
            enabled: true,
            
            play: (type) => {
                if (!SoundManager.enabled) return;
                
                const sounds = {
                    bet: 'https://assets.mixkit.co/sfx/preview/mixkit-unlock-game-notification-253.mp3',
                    cashout: 'https://assets.mixkit.co/sfx/preview/mixkit-winning-chimes-2015.mp3',
                    crash: 'https://assets.mixkit.co/sfx/preview/mixkit-bomb-explosion-in-the-distance-2800.mp3',
                    tick: 'https://assets.mixkit.co/sfx/preview/mixkit-clock-ticking-close-up-1002.mp3',
                    button: 'https://assets.mixkit.co/sfx/preview/mixkit-select-click-1109.mp3',
                    bigwin: 'https://assets.mixkit.co/sfx/preview/mixkit-winning-trumpet-2018.mp3'
                };
                
                try {
                    const audio = new Audio(sounds[type] || sounds.button);
                    audio.volume = type === 'tick' ? 0.1 : 0.3;
                    audio.play().catch(e => console.log("Sound play failed"));
                } catch (e) {
                    console.log("Sound error:", e);
                }
            }
        };

        // ===== INITIALIZATION =====
        document.addEventListener('DOMContentLoaded', () => {
            console.log("🎮 TrendCrash Game Initializing...");
            
            // Initialize UI
            updateBalanceDisplay();
            updateCrashHistoryDisplay();
            updateGameStats();
            updatePotentialWin();
            initTrendCanvas();
            setupFullscreen();
            setupEventListeners();
            
            // Show welcome message
            setTimeout(() => {
                showToast('🎮 Welcome to TrendCrash! Place your bet and start playing!', 'success');
            }, 500);
            
            console.log("✅ Game initialized successfully!");
        });

        // ===== UI FUNCTIONS =====
        function updateBalanceDisplay() {
            document.getElementById('balance-val').textContent = gameState.balance.toFixed(2);
        }

        function updatePotentialWin() {
            const betAmount = parseFloat(document.getElementById('bet-amount').value) || 0;
            const multiplier = gameState.currentMultiplier;
            const potentialWin = (betAmount * multiplier).toFixed(2);
            document.getElementById('potential-win').textContent = `$${potentialWin}`;
        }

        function updateGameStats() {
            document.getElementById('games-played').textContent = gameState.gamesPlayed;
            
            const winRate = gameState.gamesPlayed > 0 
                ? Math.round((gameState.gamesWon / gameState.gamesPlayed) * 100)
                : 0;
            document.getElementById('win-rate').textContent = winRate + '%';
        }

        function updateCrashHistoryDisplay() {
            const historyList = document.getElementById('crash-history');
            historyList.innerHTML = '';
            
            gameState.crashHistory.forEach(crashPoint => {
                const historyItem = document.createElement('div');
                historyItem.className = 'history-item';
                
                // Color code based on crash point
                if (crashPoint < 1.5) {
                    historyItem.classList.add('lose');
                } else if (crashPoint < 3) {
                    historyItem.style.borderColor = 'var(--secondary)';
                } else {
                    historyItem.classList.add('win');
                }
                
                historyItem.textContent = crashPoint.toFixed(2) + 'x';
                historyList.appendChild(historyItem);
            });
        }

        // ===== GAME LOGIC =====
        function generateCrashPoint() {
            const random = Math.random();
            let crashPoint;
            
            // Apply 90% lose bias
            if (random < 0.90) { // 90% chance for quick crash
                if (random < 0.40) {
                    // Instant crash: 1.00-1.20x
                    crashPoint = 1.00 + (Math.random() * 0.20);
                } else if (random < 0.70) {
                    // Quick crash: 1.20-1.50x
                    crashPoint = 1.20 + (Math.random() * 0.30);
                } else {
                    // Medium crash: 1.50-2.00x
                    crashPoint = 1.50 + (Math.random() * 0.50);
                }
            } else { // 10% chance for decent win
                if (random < 0.94) {
                    // Rare win: 2.00-5.00x
                    crashPoint = 2.00 + (Math.random() * 3.00);
                } else if (random < 0.98) {
                    // Big win: 5.00-10.00x
                    crashPoint = 5.00 + (Math.random() * 5.00);
                } else {
                    // Jackpot: 10.00-50.00x
                    crashPoint = 10.00 + (Math.random() * 40.00);
                }
            }
            
            // Round to 2 decimal places
            crashPoint = Math.round(crashPoint * 100) / 100;
            
            // Add to crash history
            gameState.crashHistory.unshift(crashPoint);
            if (gameState.crashHistory.length > 20) {
                gameState.crashHistory.pop();
            }
            
            updateCrashHistoryDisplay();
            
            return crashPoint;
        }

        function startGame() {
            const betAmount = parseFloat(document.getElementById('bet-amount').value);
            
            // Validation
            if (betAmount < 1 || betAmount > Math.min(gameState.balance, 1000)) {
                showToast('Invalid bet amount', 'error');
                return;
            }
            
            if (gameState.gameActive) {
                showToast('Game already in progress', 'warning');
                return;
            }
            
            // Deduct bet
            gameState.balance -= betAmount;
            updateBalanceDisplay();
            
            // Play sound
            SoundManager.play('bet');
            
            // Reset game state
            gameState.gameActive = true;
            gameState.currentMultiplier = 1.00;
            gameState.gameTimer = 0;
            gameState.crashPoint = generateCrashPoint();
            gameState.cashoutAt = 0;
            gameState.betAmount = betAmount;
            gameState.currentTrend = (gameState.currentTrend + 1) % gameState.trends.length;
            
            // Update UI
            document.getElementById('bet-amount').disabled = true;
            document.getElementById('start-game-btn').disabled = true;
            document.getElementById('cashout-btn').disabled = false;
            document.getElementById('cashout-btn').classList.add('pulsing');
            document.getElementById('multiplier-value').classList.add('rising');
            document.getElementById('trend-name').textContent = gameState.trends[gameState.currentTrend].name;
            document.getElementById('game-timer').textContent = 'Game in progress...';
            document.getElementById('multiplier-value').textContent = '1.00x';
            document.getElementById('strength-fill').style.width = '0%';
            document.getElementById('strength-value').textContent = '0%';
            
            // Reset trend line
            document.getElementById('trend-line').style.transform = 'scaleX(0)';
            
            // Start game loop
            gameState.gameInterval = setInterval(updateGame, 100);
            
            // Update potential win
            updatePotentialWin();
            
            // Clear canvas
            clearTrendCanvas();
            
            // Save game start
            gameState.currentGame = {
                bet: betAmount,
                multiplier: 0,
                win: false,
                crashed: false,
                duration: 0,
                winAmount: 0
            };
            
            showToast('Game started! Cash out before crash!', 'success');
            console.log("🎮 Game started with crash point:", gameState.crashPoint.toFixed(2) + 'x');
        }

        function updateGame() {
            if (!gameState.gameActive) return;
            
            // Increment timer
            gameState.gameTimer += 0.1;
            
            // Increase multiplier (exponential growth)
            let increment = 0.01;
            if (gameState.currentMultiplier > 2) increment = 0.02;
            if (gameState.currentMultiplier > 5) increment = 0.05;
            if (gameState.currentMultiplier > 10) increment = 0.1;
            
            gameState.currentMultiplier = parseFloat((gameState.currentMultiplier + increment).toFixed(2));
            
            // Update UI
            document.getElementById('multiplier-value').textContent = gameState.currentMultiplier.toFixed(2) + 'x';
            document.getElementById('strength-value').textContent = Math.min(Math.round(gameState.currentMultiplier * 10), 100) + '%';
            document.getElementById('strength-fill').style.width = Math.min(gameState.currentMultiplier * 10, 100) + '%';
            
            // Update trend line
            const line = document.getElementById('trend-line');
            const progress = Math.min(gameState.currentMultiplier / 10, 1);
            line.style.transform = `scaleX(${progress})`;
            
            // Update potential win
            updatePotentialWin();
            
            // Play tick sound occasionally
            if (Math.random() < 0.1) {
                SoundManager.play('tick');
            }
            
            // Draw on canvas
            drawTrendCanvas();
            
            // Check for auto cashout
            if (gameState.autoCashout && gameState.currentMultiplier >= gameState.autoCashoutValue) {
                cashout();
                return;
            }
            
            // Check for crash
            if (gameState.currentMultiplier >= gameState.crashPoint) {
                crash();
                return;
            }
        }

        function cashout() {
            if (!gameState.gameActive) return;
            
            gameState.cashoutAt = gameState.currentMultiplier;
            const winAmount = parseFloat((gameState.betAmount * gameState.currentMultiplier).toFixed(2));
            
            // Stop game
            clearInterval(gameState.gameInterval);
            gameState.gameActive = false;
            
            // Update stats
            gameState.gamesPlayed++;
            gameState.gamesWon++;
            gameState.balance += winAmount;
            gameState.currentGame.win = true;
            gameState.currentGame.multiplier = gameState.cashoutAt;
            gameState.currentGame.winAmount = winAmount;
            gameState.currentGame.duration = gameState.gameTimer;
            
            // Play sound
            SoundManager.play('cashout');
            if (gameState.cashoutAt > 5) {
                SoundManager.play('bigwin');
            }
            
            // Update UI
            document.getElementById('cashout-btn').classList.remove('pulsing');
            document.getElementById('multiplier-value').classList.remove('rising');
            document.getElementById('game-timer').textContent = `Cashed out at ${gameState.cashoutAt.toFixed(2)}x`;
            
            // Update balance
            updateBalanceDisplay();
            updateGameStats();
            
            // Show result
            showResult(true);
            
            // Enable inputs for next game
            setTimeout(() => {
                document.getElementById('bet-amount').disabled = false;
                document.getElementById('start-game-btn').disabled = false;
            }, 1000);
            
            console.log("💰 Cashed out at:", gameState.cashoutAt.toFixed(2) + 'x', "Win: $" + winAmount);
        }

        function crash() {
            if (!gameState.gameActive) return;
            
            // Stop game
            clearInterval(gameState.gameInterval);
            gameState.gameActive = false;
            
            // Update stats
            gameState.gamesPlayed++;
            gameState.currentGame.crashed = true;
            gameState.currentGame.multiplier = gameState.crashPoint;
            gameState.currentGame.duration = gameState.gameTimer;
            
            // Play crash sound
            SoundManager.play('crash');
            showCrashAnimation();
            
            // Update UI
            document.getElementById('multiplier-value').classList.remove('rising');
            document.getElementById('multiplier-value').classList.add('crash');
            document.getElementById('multiplier-value').textContent = '💥 CRASH!';
            document.getElementById('game-timer').textContent = `Crashed at ${gameState.crashPoint.toFixed(2)}x`;
            document.getElementById('cashout-btn').classList.remove('pulsing');
            
            // Update stats
            updateGameStats();
            
            // Show result
            setTimeout(() => {
                showResult(false);
            }, 1000);
            
            // Enable inputs for next game
            setTimeout(() => {
                document.getElementById('bet-amount').disabled = false;
                document.getElementById('start-game-btn').disabled = false;
                document.getElementById('multiplier-value').classList.remove('crash');
            }, 2000);
            
            console.log("💥 Crashed at:", gameState.crashPoint.toFixed(2) + 'x');
        }

        function showResult(isWin) {
            const result = gameState.currentGame;
            
            if (isWin) {
                document.getElementById('result-title').textContent = '🎉 CASHOUT SUCCESS!';
                document.getElementById('result-title').className = 'result-title result-win';
                document.getElementById('result-amount').textContent = `+$${result.winAmount.toFixed(2)}`;
                document.getElementById('result-amount').className = 'result-amount';
            } else {
                document.getElementById('result-title').textContent = '💥 TREND CRASHED!';
                document.getElementById('result-title').className = 'result-title result-lose';
                document.getElementById('result-amount').textContent = `-$${result.bet.toFixed(2)}`;
                document.getElementById('result-amount').className = 'result-amount lose';
            }
            
            document.getElementById('result-multiplier').textContent = result.multiplier.toFixed(2) + 'x';
            document.getElementById('result-timer').textContent = `Game lasted: ${result.duration.toFixed(1)}s`;
            
            // Show overlay
            document.getElementById('result-overlay').classList.add('show');
        }

        function resetGame() {
            // Hide result overlay
            document.getElementById('result-overlay').classList.remove('show');
            
            // Reset multiplier display
            gameState.currentMultiplier = 1.00;
            document.getElementById('multiplier-value').textContent = '1.00x';
            document.getElementById('strength-value').textContent = '0%';
            document.getElementById('strength-fill').style.width = '0%';
            document.getElementById('game-timer').textContent = 'Ready to play!';
            
            // Reset trend line
            document.getElementById('trend-line').style.transform = 'scaleX(0)';
            
            // Clear canvas
            clearTrendCanvas();
            
            // Update potential win
            updatePotentialWin();
        }

        function showCrashAnimation() {
            const animation = document.getElementById('crash-animation');
            animation.classList.add('show');
            
            setTimeout(() => {
                animation.classList.remove('show');
            }, 800);
        }

        // ===== CANVAS FUNCTIONS =====
        let canvas, ctx;
        let points = [];
        
        function initTrendCanvas() {
            canvas = document.getElementById('trend-canvas');
            ctx = canvas.getContext('2d');
            
            // Set canvas size
            function resizeCanvas() {
                canvas.width = canvas.offsetWidth * window.devicePixelRatio;
                canvas.height = canvas.offsetHeight * window.devicePixelRatio;
                ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
                clearTrendCanvas();
            }
            
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
        }
        
        function clearTrendCanvas() {
            const width = canvas.width / window.devicePixelRatio;
            const height = canvas.height / window.devicePixelRatio;
            
            ctx.clearRect(0, 0, width, height);
            points = [];
            
            // Draw grid
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.lineWidth = 1;
            
            // Vertical lines
            for (let i = 0; i <= width; i += width / 10) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, height);
                ctx.stroke();
            }
            
            // Horizontal lines
            for (let i = 0; i <= height; i += height / 5) {
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(width, i);
                ctx.stroke();
            }
        }
        
        function drawTrendCanvas() {
            if (!gameState.gameActive) return;
            
            const width = canvas.width / window.devicePixelRatio;
            const height = canvas.height / window.devicePixelRatio;
            
            // Add new point
            const x = (gameState.gameTimer / 30) * width;
            const y = height - (gameState.currentMultiplier / 10) * height;
            
            points.push({ x, y });
            
            // Keep only last 100 points
            if (points.length > 100) {
                points.shift();
            }
            
            // Clear and redraw
            clearTrendCanvas();
            
            // Draw trend line
            if (points.length > 1) {
                const gradient = ctx.createLinearGradient(0, 0, width, 0);
                gradient.addColorStop(0, '#00ff9d');
                gradient.addColorStop(1, '#ff9800');
                
                ctx.strokeStyle = gradient;
                ctx.lineWidth = 3;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                
                ctx.beginPath();
                ctx.moveTo(points[0].x, points[0].y);
                
                for (let i = 1; i < points.length; i++) {
                    ctx.lineTo(points[i].x, points[i].y);
                }
                
                ctx.stroke();
            }
        }

        // ===== FULLSCREEN FUNCTIONS =====
        function setupFullscreen() {
            const toggleBtn = document.getElementById('fullscreen-toggle');
            
            toggleBtn.addEventListener('click', () => {
                const container = document.getElementById('game-container');
                
                if (!document.fullscreenElement) {
                    if (container.requestFullscreen) {
                        container.requestFullscreen();
                    } else if (container.webkitRequestFullscreen) {
                        container.webkitRequestFullscreen();
                    }
                    toggleBtn.innerHTML = '<i class="fas fa-compress"></i>';
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    } else if (document.webkitExitFullscreen) {
                        document.webkitExitFullscreen();
                    }
                    toggleBtn.innerHTML = '<i class="fas fa-expand"></i>';
                }
            });
            
            // Update button on fullscreen change
            document.addEventListener('fullscreenchange', updateFullscreenButton);
            document.addEventListener('webkitfullscreenchange', updateFullscreenButton);
        }
        
        function updateFullscreenButton() {
            const toggleBtn = document.getElementById('fullscreen-toggle');
            toggleBtn.innerHTML = document.fullscreenElement 
                ? '<i class="fas fa-compress"></i>' 
                : '<i class="fas fa-expand"></i>';
        }

        // ===== EVENT LISTENERS =====
        function setupEventListeners() {
            console.log("Setting up event listeners...");
            
            // Start game button
            document.getElementById('start-game-btn').addEventListener('click', startGame);
            
            // Cashout button
            document.getElementById('cashout-btn').addEventListener('click', cashout);
            
            // Quick bet buttons
            document.querySelectorAll('.quick-bet').forEach(btn => {
                btn.addEventListener('click', () => {
                    SoundManager.play('button');
                    const amount = parseFloat(btn.dataset.amount);
                    document.getElementById('bet-amount').value = amount;
                    gameState.betAmount = amount;
                    updatePotentialWin();
                    
                    // Visual feedback
                    document.querySelectorAll('.quick-bet').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                });
            });
            
            // Bet input
            document.getElementById('bet-amount').addEventListener('input', (e) => {
                let value = parseFloat(e.target.value) || 1;
                value = Math.max(1, Math.min(value, Math.min(gameState.balance, 1000)));
                e.target.value = value;
                gameState.betAmount = value;
                updatePotentialWin();
            });
            
            // Auto cashout toggle
            document.getElementById('auto-toggle').addEventListener('click', () => {
                SoundManager.play('button');
                gameState.autoCashout = !gameState.autoCashout;
                document.getElementById('auto-toggle').classList.toggle('active');
                document.getElementById('auto-cashout-value').disabled = !gameState.autoCashout;
            });
            
            // Auto cashout value
            document.getElementById('auto-cashout-value').addEventListener('input', (e) => {
                let value = parseFloat(e.target.value) || 2.00;
                value = Math.max(1.01, Math.min(value, 100));
                e.target.value = value.toFixed(2);
                gameState.autoCashoutValue = value;
            });
            
            // Play again button
            document.getElementById('play-again-btn').addEventListener('click', resetGame);
            
            // Enter key to start game
            document.getElementById('bet-amount').addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && !gameState.gameActive) {
                    startGame();
                }
            });
            
            // Keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                // Space to cashout
                if (e.code === 'Space' && gameState.gameActive) {
                    cashout();
                    e.preventDefault();
                }
                // Enter to start if not active
                if (e.code === 'Enter' && !gameState.gameActive && document.activeElement.id !== 'bet-amount') {
                    startGame();
                    e.preventDefault();
                }
                // Number keys for quick bets
                if (e.code === 'Digit1') setQuickBet(1);
                if (e.code === 'Digit2') setQuickBet(5);
                if (e.code === 'Digit3') setQuickBet(10);
                if (e.code === 'Digit4') setQuickBet(25);
            });
            
            // Touch feedback for mobile
            document.addEventListener('touchstart', handleTouch, { passive: true });
            
            console.log("✅ Event listeners setup complete!");
        }
        
        function setQuickBet(amount) {
            if (!gameState.gameActive) {
                SoundManager.play('button');
                document.getElementById('bet-amount').value = amount;
                gameState.betAmount = amount;
                updatePotentialWin();
                
                document.querySelectorAll('.quick-bet').forEach(btn => {
                    btn.classList.toggle('active', parseFloat(btn.dataset.amount) === amount);
                });
            }
        }
        
        function handleTouch(e) {
            // Visual feedback for touch
            if (e.target.tagName === 'BUTTON' || e.target.classList.contains('quick-bet')) {
                e.target.style.transform = 'scale(0.95)';
                setTimeout(() => {
                    e.target.style.transform = '';
                }, 100);
            }
        }

        // ===== TOAST NOTIFICATIONS =====
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.add('show');
            }, 10);
            
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => {
                    container.removeChild(toast);
                }, 300);
            }, 3000);
        }

        // ===== DEBUG INFO =====
        console.log("🎮 TrendCrash Game Loaded!");
        console.log("💰 Starting Balance: $" + gameState.balance);
        console.log("📱 Mobile Optimized: Yes");
        console.log("🎯 House Edge: 90% lose rate");
        console.log("🎵 Sound Effects: Enabled");
        console.log("🚀 Ready to play!");

        // Auto-start demo after 2 seconds
        setTimeout(() => {
            if (gameState.gamesPlayed === 0) {
                showToast('Click "START GAME" or press Enter to begin!', 'success');
            }
        }, 2000);
    </script>
