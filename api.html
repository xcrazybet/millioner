<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Betting Platform - X-Bet Pro</title>
    <!-- Import Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary: #3b82f6;
            --primary-dark: #1d4ed8;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --dark: #0f172a;
            --darker: #020617;
            --light: #e2e8f0;
            --lighter: #f1f5f9;
            --border: #334155;
            --card-bg: #1e293b;
            --text-muted: #94a3b8;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--dark) 0%, var(--darker) 100%);
            color: var(--light);
            min-height: 100vh;
            line-height: 1.6;
        }
        
        /* Header Styles */
        .header {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        
        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
        }
        
        .nav-menu {
            display: flex;
            gap: 2rem;
            align-items: center;
        }
        
        .nav-link {
            color: var(--text-muted);
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            transition: all 0.3s;
            font-weight: 500;
        }
        
        .nav-link:hover, .nav-link.active {
            color: var(--primary);
            background: rgba(59, 130, 246, 0.1);
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        .balance-display {
            background: linear-gradient(135deg, var(--success) 0%, #059669 100%);
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .user-menu {
            position: relative;
        }
        
        .user-btn {
            background: var(--primary);
            border: none;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 500;
            transition: all 0.3s;
        }
        
        .user-btn:hover {
            background: var(--primary-dark);
        }
        
        .dropdown-menu {
            position: absolute;
            top: 100%;
            right: 0;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            margin-top: 0.5rem;
            min-width: 200px;
            display: none;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        
        .dropdown-menu.show {
            display: block;
        }
        
        .dropdown-item {
            padding: 0.75rem 1rem;
            cursor: pointer;
            transition: background 0.3s;
            border-bottom: 1px solid var(--border);
        }
        
        .dropdown-item:hover {
            background: var(--dark);
        }
        
        .dropdown-item:last-child {
            border-bottom: none;
        }
        
        /* Main Layout */
        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 2rem;
        }
        
        /* Betting Area */
        .betting-area {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }
        
        /* Tab Navigation */
        .tab-nav {
            background: var(--card-bg);
            border-radius: 0.75rem;
            padding: 0.5rem;
            display: flex;
            gap: 0.5rem;
        }
        
        .tab-btn {
            flex: 1;
            padding: 0.75rem 1rem;
            background: transparent;
            border: none;
            color: var(--text-muted);
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        
        .tab-btn.active {
            background: var(--primary);
            color: white;
        }
        
        .tab-btn:hover:not(.active) {
            background: var(--dark);
        }
        
        /* Match Cards */
        .matches-container {
            background: var(--card-bg);
            border-radius: 0.75rem;
            padding: 1.5rem;
        }
        
        .match-card {
            background: var(--dark);
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            padding: 1.5rem;
            margin-bottom: 1rem;
            transition: all 0.3s;
        }
        
        .match-card:hover {
            border-color: var(--primary);
            box-shadow: 0 5px 15px rgba(59, 130, 246, 0.2);
        }
        
        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        
        .match-league {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-muted);
            font-size: 0.875rem;
        }
        
        .match-status {
            padding: 0.25rem 0.75rem;
            border-radius: 1rem;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .status-live {
            background: var(--danger);
            color: white;
            animation: pulse 2s infinite;
        }
        
        .status-upcoming {
            background: var(--warning);
            color: white;
        }
        
        .status-finished {
            background: var(--text-muted);
            color: white;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        .match-teams {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 1rem;
            align-items: center;
            margin-bottom: 1rem;
        }
        
        .team {
            text-align: center;
        }
        
        .team-name {
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
        }
        
        .team-score {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
        }
        
        .match-time {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.875rem;
        }
        
        .match-odds {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 0.75rem;
            margin-top: 1rem;
        }
        
        .odd-button {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            padding: 0.75rem;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }
        
        .odd-button:hover {
            border-color: var(--primary);
            background: rgba(59, 130, 246, 0.1);
        }
        
        .odd-button.selected {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }
        
        .odd-type {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 0.25rem;
        }
        
        .odd-value {
            font-weight: 700;
            font-size: 1.1rem;
        }
        
        /* Betting Slip */
        .betting-slip {
            position: sticky;
            top: 100px;
            height: fit-content;
        }
        
        .slip-container {
            background: var(--card-bg);
            border-radius: 0.75rem;
            padding: 1.5rem;
        }
        
        .slip-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }
        
        .slip-title {
            font-size: 1.25rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .slip-count {
            background: var(--primary);
            color: white;
            padding: 0.25rem 0.5rem;
            border-radius: 1rem;
            font-size: 0.75rem;
            font-weight: 600;
        }
        
        .slip-clear {
            background: transparent;
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 0.25rem 0.75rem;
            border-radius: 0.25rem;
            cursor: pointer;
            font-size: 0.875rem;
            transition: all 0.3s;
        }
        
        .slip-clear:hover {
            background: var(--danger);
            color: white;
        }
        
        .bet-item {
            background: var(--dark);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            padding: 1rem;
            margin-bottom: 0.75rem;
            position: relative;
        }
        
        .bet-remove {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            background: var(--danger);
            border: none;
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
        }
        
        .bet-match {
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
        }
        
        .bet-selection {
            color: var(--text-muted);
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
        }
        
        .bet-odds {
            color: var(--primary);
            font-weight: 600;
        }
        
        .stake-section {
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border);
        }
        
        .stake-input {
            width: 100%;
            padding: 0.75rem;
            background: var(--dark);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            color: var(--light);
            font-size: 1rem;
            margin-bottom: 1rem;
        }
        
        .stake-input:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        .quick-stakes {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        
        .quick-stake-btn {
            padding: 0.5rem;
            background: var(--dark);
            border: 1px solid var(--border);
            border-radius: 0.25rem;
            color: var(--light);
            cursor: pointer;
            font-size: 0.875rem;
            transition: all 0.3s;
        }
        
        .quick-stake-btn:hover {
            border-color: var(--primary);
            background: rgba(59, 130, 246, 0.1);
        }
        
        .return-summary {
            background: var(--dark);
            border-radius: 0.5rem;
            padding: 1rem;
            margin-bottom: 1rem;
        }
        
        .return-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
        }
        
        .return-row:last-child {
            margin-bottom: 0;
            padding-top: 0.5rem;
            border-top: 1px solid var(--border);
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--success);
        }
        
        .place-bet-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, var(--success) 0%, #059669 100%);
            border: none;
            border-radius: 0.5rem;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        
        .place-bet-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.3);
        }
        
        .place-bet-btn:disabled {
            background: var(--text-muted);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        /* Loading States */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem;
            color: var(--text-muted);
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 1rem;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Empty States */
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
        }
        
        .empty-state i {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }
        
        /* Toast Notifications */
        .toast-container {
            position: fixed;
            top: 100px;
            right: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        
        .toast {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            padding: 1rem;
            min-width: 300px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        .toast.success {
            border-color: var(--success);
        }
        
        .toast.error {
            border-color: var(--danger);
        }
        
        .toast.warning {
            border-color: var(--warning);
        }
        
        .toast.info {
            border-color: var(--primary);
        }
        
        .toast-icon {
            font-size: 1.25rem;
            margin-top: 0.125rem;
        }
        
        .toast.success .toast-icon {
            color: var(--success);
        }
        
        .toast.error .toast-icon {
            color: var(--danger);
        }
        
        .toast.warning .toast-icon {
            color: var(--warning);
        }
        
        .toast.info .toast-icon {
            color: var(--primary);
        }
        
        .toast-content {
            flex: 1;
        }
        
        .toast-title {
            font-weight: 600;
            margin-bottom: 0.25rem;
        }
        
        .toast-message {
            font-size: 0.875rem;
            color: var(--text-muted);
        }
        
        /* Mobile Responsive */
        @media (max-width: 1024px) {
            .main-container {
                grid-template-columns: 1fr;
            }
            
            .betting-slip {
                position: static;
                order: -1;
            }
        }
        
        @media (max-width: 768px) {
            .header-content {
                padding: 1rem;
            }
            
            .nav-menu {
                display: none;
            }
            
            .main-container {
                padding: 1rem;
            }
            
            .match-odds {
                grid-template-columns: 1fr;
            }
            
            .quick-stakes {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <i class="fas fa-football-ball"></i>
                <span>X-Bet Pro</span>

            <nav class="nav-menu">

    </header>
    
    <!-- Main Content -->
    <main class="main-container">
        <!-- Betting Area -->
        <div class="betting-area">
            <!-- Tab Navigation -->
            <div class="tab-nav">
                <button class="tab-btn active" data-tab="live">
                    <i class="fas fa-broadcast-tower"></i>

                </button>

                    <i class="fas fa-calendar"></i>

                <div id="slipContent">

                        <i class="fas fa-plus-circle"></i>

                    </div>
                </div>
            </div>
        </aside>
    </main>
    
    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>
    
    <script>
        // ===== CONFIGURATION =====
        const SPORTMONKS_API_TOKEN = "DkFdWG9jFZvH8XSEgLrRfGwczABWVg5rlV25GvIRyN06zdPsOI48Nsv9Wooy";
        const SPORTMONKS_BASE_URL = "https://api.sportmonks.com/v3";
        
        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962",
            measurementId: "G-PTV4XMYQ6P"
        };
        
        // ===== GLOBAL VARIABLES =====
        let auth, db;
        let currentUser = null;
        let userData = null;
        let bettingSlip = [];
        let currentTab = 'live';
        let matches = {};
        let updateInterval = null;
        
        // ===== INITIALIZATION =====
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                console.log("Initializing betting platform...");
                
                // Initialize Firebase
                firebase.initializeApp(firebaseConfig);
                auth = firebase.auth();
                db = firebase.firestore();
                
                console.log("Firebase initialized");
                
                // Setup event listeners
                setupEventListeners();
                
                // Check authentication
                auth.onAuthStateChanged(handleAuthStateChange);
                
            } catch (error) {
                console.error("Initialization error:", error);
                showToast('error', 'System Error', 'Failed to initialize application');
            }
        });
        
        // ===== AUTHENTICATION =====
        function handleAuthStateChange(user) {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            
            currentUser = user;
            console.log("User authenticated:", user.email);
            
            loadUserData();
            loadMatches();
            startRealTimeUpdates();
        }
        
        async function loadUserData() {
            try {
                const userDoc = await db.collection('wallets').doc(currentUser.uid).get();
                
                if (userDoc.exists) {
                    userData = userDoc.data();
                    updateUserUI();
                } else {
                    showToast('error', 'Wallet Error', 'User wallet not found');
                }
            } catch (error) {
                console.error("Error loading user data:", error);
                showToast('error', 'Load Error', 'Failed to load user data');
            }
        }
        
        function updateUserUI() {
            if (!userData) return;
            
            document.getElementById('userName').textContent = userData.username || currentUser.email.split('@')[0];
            document.getElementById('headerBalance').textContent = `$${(userData.balance || 0).toFixed(2)}`;
        }
        
        // ===== SPORTMONKS API =====
        async function fetchLiveMatches() {
            try {
                const url = `${SPORTMONKS_BASE_URL}/football/livescores/inplay?api_token=${SPORTMONKS_API_TOKEN}&include=state;lineups;events;statistics;periods;participants`;
                
                console.log("Fetching live matches...");
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.data) {
                    matches.live = data.data;
                    console.log(`Loaded ${data.data.length} live matches`);
                    return data.data;
                }
                
                return [];
            } catch (error) {
                console.error("Error fetching live matches:", error);
                showToast('error', 'API Error', 'Failed to load live matches');
                return [];
            }
        }
        
        async function fetchUpcomingMatches() {
            try {
                const today = new Date().toISOString().split('T')[0];
                const url = `${SPORTMONKS_BASE_URL}/football/fixtures/date/${today}?api_token=${SPORTMONKS_API_TOKEN}&include=participants;state;league`;
                
                console.log("Fetching upcoming matches...");
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.data) {
                    // Filter out live matches
                    const upcoming = data.data.filter(match => 
                        match.state_id === 1 || match.state_id === 45 // Scheduled or Postponed
                    );
                    
                    matches.upcoming = upcoming;
                    console.log(`Loaded ${upcoming.length} upcoming matches`);
                    return upcoming;
                }
                
                return [];
            } catch (error) {
                console.error("Error fetching upcoming matches:", error);
                showToast('error', 'API Error', 'Failed to load upcoming matches');
                return [];
            }
        }
        
        async function fetchFinishedMatches() {
            try {
                const today = new Date().toISOString().split('T')[0];
                const url = `${SPORTMONKS_BASE_URL}/football/fixtures/date/${today}?api_token=${SPORTMONKS_API_TOKEN}&include=participants;state;scores;events`;
                
                console.log("Fetching finished matches...");
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.data) {
                    // Filter finished matches
                    const finished = data.data.filter(match => 
                        match.state_id === 100 || match.state_id === 90 // Finished or Canceled
                    );
                    
                    matches.finished = finished;
                    console.log(`Loaded ${finished.length} finished matches`);
                    return finished;
                }
                
                return [];
            } catch (error) {
                console.error("Error fetching finished matches:", error);
                showToast('error', 'API Error', 'Failed to load finished matches');
                return [];
            }
        }
        
        async function fetchMatchOdds(fixtureId) {
            try {
                const url = `${SPORTMONKS_BASE_URL}/football/odds/pre-match?api_token=${SPORTMONKS_API_TOKEN}&filters=fixture:${fixtureId}`;
                
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.data && data.data.length > 0) {
                    return data.data[0]; // Return first odds set
                }
                
                // Generate sample odds if no real odds available
                return generateSampleOdds();
            } catch (error) {
                console.error("Error fetching match odds:", error);
                return generateSampleOdds();
            }
        }
        
        function generateSampleOdds() {
            return {
                '1': (Math.random() * 2 + 1.5).toFixed(2),
                'X': (Math.random() * 1 + 3).toFixed(2),
                '2': (Math.random() * 2 + 1.5).toFixed(2),
                'over_2.5': (Math.random() * 1 + 1.8).toFixed(2),
                'under_2.5': (Math.random() * 1 + 2).toFixed(2),
                'btts_yes': (Math.random() * 1 + 1.8).toFixed(2),
                'btts_no': (Math.random() * 1 + 2).toFixed(2)
            };
        }
        
        // ===== MATCHES LOADING =====
        async function loadMatches() {
            switch(currentTab) {
                case 'live':
                    await loadLiveMatches();
                    break;
                case 'upcoming':
                    await loadUpcomingMatches();
                    break;
                case 'finished':
                    await loadFinishedMatches();
                    break;
            }
        }
        
        async function loadLiveMatches() {
            showLoading();
            const liveMatches = await fetchLiveMatches();
            renderMatches(liveMatches, 'live');
        }
        
        async function loadUpcomingMatches() {
            showLoading();
            const upcomingMatches = await fetchUpcomingMatches();
            renderMatches(upcomingMatches, 'upcoming');
        }
        
        async function loadFinishedMatches() {
            showLoading();
            const finishedMatches = await fetchFinishedMatches();
            renderMatches(finishedMatches, 'finished');
        }
        
        // ===== UI RENDERING =====
        function showLoading() {
            document.getElementById('matchesContent').innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <span>Loading matches...</span>
                </div>
            `;
        }
        
        function renderMatches(matchesArray, type) {
            const container = document.getElementById('matchesContent');
            
            if (!matchesArray || matchesArray.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-futbol"></i>
                        <p>No ${type} matches available</p>
                        <p style="font-size: 0.875rem; margin-top: 0.5rem;">Check back later for updates</p>
                    </div>
                `;
                return;
            }
            
            let html = '';
            
            matchesArray.forEach(match => {
                html += renderMatchCard(match, type);
            });
            
            container.innerHTML = html;
            
            // Add event listeners to odds buttons
            document.querySelectorAll('.odd-button').forEach(btn => {
                btn.addEventListener('click', handleOddClick);
            });
        }
        
        function renderMatchCard(match, type) {
            const participants = match.participants || [];
            const homeTeam = participants.find(p => p.meta.location === 'home') || participants[0];
            const awayTeam = participants.find(p => p.meta.location === 'away') || participants[1];
            
            const leagueName = match.league?.name || 'Unknown League';
            const status = getMatchStatus(match.state_id);
            const statusClass = getStatusClass(match.state_id);
            
            let scoresHtml = '';
            if (type === 'live' || type === 'finished') {
                const homeScore = match.scores?.find(s => s.type === 'current' && s.participant === 'home')?.score || 0;
                const awayScore = match.scores?.find(s => s.type === 'current' && s.participant === 'away')?.score || 0;
                scoresHtml = `
                    <div class="team-score">${homeScore}</div>
                    <div class="match-time">${status}</div>
                    <div class="team-score">${awayScore}</div>
                `;
            } else {
                scoresHtml = `
                    <div class="team-name">${homeTeam?.name || 'Home Team'}</div>
                    <div class="match-time">${formatMatchTime(match.starting_at)}</div>
                    <div class="team-name">${awayTeam?.name || 'Away Team'}</div>
                `;
            }
            
            return `
                <div class="match-card" data-fixture-id="${match.id}">
                    <div class="match-header">
                        <div class="match-league">
                            <i class="fas fa-trophy"></i>
                            ${leagueName}
                        </div>
                        <div class="match-status ${statusClass}">${status}</div>
                    </div>
                    
                    <div class="match-teams">
                        <div class="team">
                            <div class="team-name">${homeTeam?.name || 'Home Team'}</div>
                            ${type === 'live' || type === 'finished' ? `<div class="team-score">${match.scores?.find(s => s.type === 'current' && s.participant === 'home')?.score || 0}</div>` : ''}
                        </div>
                        
                        <div class="match-time">
                            ${type === 'live' || type === 'finished' ? status : formatMatchTime(match.starting_at)}
                        </div>
                        
                        <div class="team">
                            <div class="team-name">${awayTeam?.name || 'Away Team'}</div>
                            ${type === 'live' || type === 'finished' ? `<div class="team-score">${match.scores?.find(s => s.type === 'current' && s.participant === 'away')?.score || 0}</div>` : ''}
                        </div>
                    </div>
                    
                    ${type !== 'finished' ? renderMatchOdds(match.id) : ''}
                </div>
            `;
        }
        
        function renderMatchOdds(fixtureId) {
            const odds = generateSampleOdds(); // Use sample odds for now
            
            return `
                <div class="match-odds">
                    <div class="odd-button" data-fixture="${fixtureId}" data-market="1x2" data-selection="1" data-odds="${odds['1']}">
                        <div class="odd-type">Home</div>
                        <div class="odd-value">${odds['1']}</div>
                    </div>
                    <div class="odd-button" data-fixture="${fixtureId}" data-market="1x2" data-selection="X" data-odds="${odds['X']}">
                        <div class="odd-type">Draw</div>
                        <div class="odd-value">${odds['X']}</div>
                    </div>
                    <div class="odd-button" data-fixture="${fixtureId}" data-market="1x2" data-selection="2" data-odds="${odds['2']}">
                        <div class="odd-type">Away</div>
                        <div class="odd-value">${odds['2']}</div>
                    </div>
                    <div class="odd-button" data-fixture="${fixtureId}" data-market="over_under" data-selection="over_2.5" data-odds="${odds['over_2.5']}">
                        <div class="odd-type">Over 2.5</div>
                        <div class="odd-value">${odds['over_2.5']}</div>
                    </div>
                    <div class="odd-button" data-fixture="${fixtureId}" data-market="over_under" data-selection="under_2.5" data-odds="${odds['under_2.5']}">
                        <div class="odd-type">Under 2.5</div>
                        <div class="odd-value">${odds['under_2.5']}</div>
                    </div>
                    <div class="odd-button" data-fixture="${fixtureId}" data-market="btts" data-selection="yes" data-odds="${odds['btts_yes']}">
                        <div class="odd-type">BTTS Yes</div>
                        <div class="odd-value">${odds['btts_yes']}</div>
                    </div>
                </div>
            `;
        }
        
        function getMatchStatus(stateId) {
            const statusMap = {
                1: 'Not Started',
                2: '1st Half',
                3: 'Half Time',
                4: '2nd Half',
                5: 'Extra Time',
                6: 'Penalty Shootout',
                7: 'Postponed',
                8: 'Suspended',
                9: 'Interrupted',
                10: 'Abandoned',
                11: 'Cancelled',
                12: 'Technical Loss',
                13: 'Walk Over',
                14: 'Coverage Lost',
                45: 'Postponed',
                46: 'Delayed',
                47: 'TBD',
                48: 'Awarded',
                49: 'No Coverage',
                50: 'Stopped',
                60: 'Var Review',
                70: 'To Be Determined',
                90: 'Canceled',
                100: 'Finished'
            };
            
            return statusMap[stateId] || 'Unknown';
        }
        
        function getStatusClass(stateId) {
            if ([2, 4, 5, 6].includes(stateId)) return 'status-live';
            if ([1, 45, 46, 47].includes(stateId)) return 'status-upcoming';
            if ([90, 100].includes(stateId)) return 'status-finished';
            return '';
        }
        
        function formatMatchTime(startTime) {
            if (!startTime) return 'Time TBD';
            
            const date = new Date(startTime);
            const now = new Date();
            const diffMs = date - now;
            const diffHours = Math.floor(diffMs / (1000 * 60 * 60));
            
            if (diffHours < 24) {
                return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            } else {
                return date.toLocaleDateString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
            }
        }
        
        // ===== BETTING SLIP =====
        function handleOddClick(event) {
            const button = event.currentTarget;
            const fixtureId = button.dataset.fixture;
            const market = button.dataset.market;
            const selection = button.dataset.selection;
            const odds = parseFloat(button.dataset.odds);
            
            // Get match info
            const matchCard = button.closest('.match-card');
            const leagueName = matchCard.querySelector('.match-league').textContent.trim();
            const teamNames = Array.from(matchCard.querySelectorAll('.team-name')).map(el => el.textContent.trim());
            const matchName = `${teamNames[0]} vs ${teamNames[1]}`;
            
            // Create bet object
            const bet = {
                id: `${fixtureId}_${market}_${selection}`,
                fixtureId: fixtureId,
                matchName: matchName,
                league: leagueName,
                market: market,
                selection: getSelectionText(market, selection, teamNames),
                odds: odds,
                stake: 0
            };
            
            // Add or remove from slip
            const existingIndex = bettingSlip.findIndex(b => b.id === bet.id);
            
            if (existingIndex > -1) {
                bettingSlip.splice(existingIndex, 1);
                button.classList.remove('selected');
            } else {
                // Remove conflicting bets (same market, different selection)
                bettingSlip = bettingSlip.filter(b => !(b.fixtureId === fixtureId && b.market === market));
                
                bettingSlip.push(bet);
                button.classList.add('selected');
            }
            
            updateBettingSlip();
        }
        
        function getSelectionText(market, selection, teamNames) {
            switch(market) {
                case '1x2':
                    if (selection === '1') return teamNames[0];
                    if (selection === 'X') return 'Draw';
                    if (selection === '2') return teamNames[1];
                    break;
                case 'over_under':
                    return selection.replace('_', ' ').toUpperCase();
                case 'btts':
                    return `BTTS ${selection.toUpperCase()}`;
                default:
                    return selection;
            }
        }
        
        function updateBettingSlip() {
            const slipContent = document.getElementById('slipContent');
            const slipCount = document.getElementById('slipCount');
            const clearBtn = document.getElementById('clearSlip');
            
            slipCount.textContent = bettingSlip.length;
            clearBtn.style.display = bettingSlip.length > 0 ? 'block' : 'none';
            
            if (bettingSlip.length === 0) {
                slipContent.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-plus-circle"></i>
                        <p>No bets selected</p>
                        <p style="font-size: 0.875rem; margin-top: 0.5rem;">Click on odds to add bets</p>
                    </div>
                `;
                return;
            }
            
            let html = '';
            let totalOdds = 1;
            
            bettingSlip.forEach(bet => {
                totalOdds *= bet.odds;
                html += `
                    <div class="bet-item">
                        <button class="bet-remove" onclick="removeBet('${bet.id}')">×</button>
                        <div class="bet-match">${bet.matchName}</div>
                        <div class="bet-selection">${bet.selection} - ${bet.league}</div>
                        <div class="bet-odds">Odds: ${bet.odds}</div>
                    </div>
                `;
            });
            
            html += `
                <div class="stake-section">
                    <input type="number" class="stake-input" id="stakeInput" placeholder="Enter stake amount" min="1" step="0.01">
                    <div class="quick-stakes">
                        <button class="quick-stake-btn" onclick="setStake(10)">$10</button>
                        <button class="quick-stake-btn" onclick="setStake(25)">$25</button>
                        <button class="quick-stake-btn" onclick="setStake(50)">$50</button>
                        <button class="quick-stake-btn" onclick="setStake(100)">$100</button>
                    </div>
                    <div class="return-summary">
                        <div class="return-row">
                            <span>Total Odds:</span>
                            <span id="totalOdds">${totalOdds.toFixed(2)}</span>
                        </div>
                        <div class="return-row">
                            <span>Potential Return:</span>
                            <span id="potentialReturn">$0.00</span>
                        </div>
                    </div>
                    <button class="place-bet-btn" id="placeBetBtn" onclick="placeBet()">
                        <i class="fas fa-check-circle"></i>
                        Place Bet
                    </button>
                </div>
            `;
            
            slipContent.innerHTML = html;
            
            // Setup stake input listener
            document.getElementById('stakeInput').addEventListener('input', calculateReturns);
        }
        
        function removeBet(betId) {
            bettingSlip = bettingSlip.filter(b => b.id !== betId);
            
            // Update UI
            document.querySelectorAll('.odd-button').forEach(btn => {
                const btnBetId = `${btn.dataset.fixture}_${btn.dataset.market}_${btn.dataset.selection}`;
                if (btnBetId === betId) {
                    btn.classList.remove('selected');
                }
            });
            
            updateBettingSlip();
        }
        
        function setStake(amount) {
            document.getElementById('stakeInput').value = amount;
            calculateReturns();
        }
        
        function calculateReturns() {
            const stake = parseFloat(document.getElementById('stakeInput').value) || 0;
            let totalOdds = 1;
            
            bettingSlip.forEach(bet => {
                totalOdds *= bet.odds;
            });
            
            const potentialReturn = stake * totalOdds;
            
            document.getElementById('totalOdds').textContent = totalOdds.toFixed(2);
            document.getElementById('potentialReturn').textContent = `$${potentialReturn.toFixed(2)}`;
        }
        
        async function placeBet() {
            if (!userData) {
                showToast('error', 'Authentication Error', 'Please login to place bets');
                return;
            }
            
            const stake = parseFloat(document.getElementById('stakeInput').value) || 0;
            
            if (stake <= 0) {
                showToast('error', 'Invalid Stake', 'Please enter a valid stake amount');
                return;
            }
            
            if (stake > (userData.balance || 0)) {
                showToast('error', 'Insufficient Balance', 'You do not have enough balance');
                return;
            }
            
            if (bettingSlip.length === 0) {
                showToast('error', 'No Bets', 'Please select at least one bet');
                return;
            }
            
            try {
                const button = document.getElementById('placeBetBtn');
                const originalText = button.innerHTML;
                button.disabled = true;
                button.innerHTML = '<div class="spinner" style="width: 20px; height: 20px; border-width: 2px; margin-right: 0.5rem;"></div> Placing Bet...';
                
                // Calculate total odds and potential return
                let totalOdds = 1;
                bettingSlip.forEach(bet => {
                    totalOdds *= bet.odds;
                });
                
                const potentialReturn = stake * totalOdds;
                
                // Create bet record
                const betData = {
                    userId: currentUser.uid,
                    userEmail: currentUser.email,
                    username: userData.username,
                    bets: bettingSlip,
                    stake: stake,
                    totalOdds: totalOdds,
                    potentialReturn: potentialReturn,
                    status: 'pending',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    type: 'multiple'
                };
                
                // Save bet to Firestore
                const betRef = await db.collection('bets').add(betData);
                
                // Update user balance
                await db.runTransaction(async (transaction) => {
                    const userRef = db.collection('wallets').doc(currentUser.uid);
                    const userDoc = await transaction.get(userRef);
                    
                    if (!userDoc.exists) {
                        throw new Error('User wallet not found');
                    }
                    
                    const currentBalance = userDoc.data().balance || 0;
                    const newBalance = currentBalance - stake;
                    
                    transaction.update(userRef, {
                        balance: newBalance,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    
                    // Create transaction record
                    const transactionData = {
                        userId: currentUser.uid,
                        userEmail: currentUser.email,
                        username: userData.username,
                        type: 'bet',
                        amount: -stake,
                        description: `Bet placed on ${bettingSlip.length} selections`,
                        status: 'completed',
                        betId: betRef.id,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                        previousBalance: currentBalance,
                        newBalance: newBalance
                    };
                    
                    await db.collection('transactions').add(transactionData);
                });
                
                // Update local data
                userData.balance -= stake;
                updateUserUI();
                
                // Clear betting slip
                bettingSlip = [];
                document.querySelectorAll('.odd-button').forEach(btn => {
                    btn.classList.remove('selected');
                });
                updateBettingSlip();
                
                showToast('success', 'Bet Placed', `Bet of $${stake.toFixed(2)} placed successfully!`);
                
            } catch (error) {
                console.error('Error placing bet:', error);
                showToast('error', 'Bet Failed', 'Failed to place bet. Please try again.');
            } finally {
                const button = document.getElementById('placeBetBtn');
                button.disabled = false;
                button.innerHTML = originalText;
            }
        }
        
        // ===== EVENT LISTENERS =====
        function setupEventListeners() {
            // Tab navigation
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    
                    currentTab = this.dataset.tab;
                    loadMatches();
                });
            });
            
            // User menu
            document.getElementById('userBtn').addEventListener('click', function() {
                document.getElementById('dropdownMenu').classList.toggle('show');
            });
            
            // Navigation items
            document.getElementById('profileBtn').addEventListener('click', () => {
                window.location.href = 'profile.html';
            });
            
            document.getElementById('walletBtn').addEventListener('click', () => {
                window.location.href = 'dashboard.html';
            });
            
            document.getElementById('logoutBtn').addEventListener('click', handleLogout);
            
            // Clear slip
            document.getElementById('clearSlip').addEventListener('click', function() {
                bettingSlip = [];
                document.querySelectorAll('.odd-button').forEach(btn => {
                    btn.classList.remove('selected');
                });
                updateBettingSlip();
            });
            
            // Close dropdowns
            document.addEventListener('click', function(e) {
                if (!e.target.closest('.user-menu')) {
                    document.getElementById('dropdownMenu').classList.remove('show');
                }
            });
        }
        
        // ===== REAL-TIME UPDATES =====
        function startRealTimeUpdates() {
            // Update live matches every 10 seconds
            updateInterval = setInterval(() => {
                if (currentTab === 'live') {
                    console.log("Updating live matches...");
                    fetchLiveMatches().then(matches => {
                        if (matches) {
                            renderMatches(matches, 'live');
                        }
                    });
                }
            }, 10000);
        }
        
        // ===== UTILITY FUNCTIONS =====
        async function handleLogout() {
            try {
                if (updateInterval) {
                    clearInterval(updateInterval);
                }
                
                await auth.signOut();
                window.location.href = 'login.html';
            } catch (error) {
                console.error('Logout error:', error);
                showToast('error', 'Logout Failed', 'Please try again');
            }
        }
        
        function showToast(type, title, message, duration = 5000) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            
            const iconMap = {
                success: 'fas fa-check-circle',
                error: 'fas fa-exclamation-circle',
                warning: 'fas fa-exclamation-triangle',
                info: 'fas fa-info-circle'
            };
            
            toast.innerHTML = `
                <div class="toast-icon">
                    <i class="${iconMap[type] || 'fas fa-info-circle'}"></i>
                </div>
                <div class="toast-content">
                    <div class="toast-title">${title}</div>
                    <div class="toast-message">${message}</div>
                </div>
            `;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100%)';
                setTimeout(() => {
                    if (toast.parentNode) {
                        toast.parentNode.removeChild(toast);
                    }
                }, 300);
            }, duration);
        }
    </script>
</body>
</html>
