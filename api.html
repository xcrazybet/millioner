<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Betting Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">
    <div class="max-w-6xl mx-auto">
        <h1 class="text-3xl font-bold text-center mb-8 text-blue-600">🏆 Simple Betting Platform</h1>
        
        <!-- Status Display -->
        <div id="status" class="bg-white p-4 rounded-lg shadow mb-6">
            <h2 class="text-xl font-semibold mb-2">API Status</h2>
            <div id="statusContent" class="text-gray-600">Checking connection...</div>
        </div>
        
        <!-- Match Display -->
        <div id="matches" class="bg-white p-4 rounded-lg shadow">
            <h2 class="text-xl font-semibold mb-4">Matches</h2>
            <div id="matchesContent" class="space-y-4">
                <div class="text-center py-8 text-gray-500">Loading matches...</div>
            </div>
        </div>
        
        <!-- Controls -->
        <div class="mt-6 bg-white p-4 rounded-lg shadow">
            <button onclick="loadLiveMatches()" class="bg-red-500 text-white px-4 py-2 rounded mr-2 hover:bg-red-600">
                🔥 Live Matches
            </button>
            <button onclick="loadUpcomingMatches()" class="bg-blue-500 text-white px-4 py-2 rounded mr-2 hover:bg-blue-600">
                📅 Upcoming
            </button>
            <button onclick="loadFinishedMatches()" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">
                🏁 Finished
            </button>
        </div>
    </div>

    <script>
        const API_TOKEN = 'DkFdWG9jFZvH8XSEgLrRfGwczABWVg5rlV25GvIRyN06zdPsOI48Nsv9Wooy';
        const BASE_URL = 'https://api.sportmonks.com/v3/football';
        
        // Simple status display
        function updateStatus(message, type = 'info') {
            const statusContent = document.getElementById('statusContent');
            const colors = {
                'success': 'text-green-600',
                'error': 'text-red-600',
                'warning': 'text-yellow-600',
                'info': 'text-blue-600'
            };
            
            statusContent.className = colors[type] || 'text-gray-600';
            statusContent.innerHTML = message;
        }
        
        // Simple match display
        function displayMatches(matches, title) {
            const matchesContent = document.getElementById('matchesContent');
            
            if (!matches || matches.length === 0) {
                matchesContent.innerHTML = `
                    <div class="text-center py-8 text-gray-500">
                        <div class="text-2xl mb-2">📋</div>
                        <div>No ${title} matches found</div>
                        <div class="text-sm mt-2">Try again later or check a different category</div>
                    </div>
                `;
                return;
            }
            
            let html = `<div class="text-lg font-semibold mb-4">${matches.length} ${title} matches found</div>`;
            
            matches.slice(0, 10).forEach(match => {
                const participants = match.participants || [];
                const homeTeam = participants.find(p => p.meta?.location === 'home') || participants[0];
                const awayTeam = participants.find(p => p.meta?.location === 'away') || participants[1];
                const scores = match.scores || {};
                const homeScore = scores.home_score || 0;
                const awayScore = scores.away_score || 0;
                const time = match.starting_at ? new Date(match.starting_at).toLocaleString() : 'Time TBD';
                
                html += `
                    <div class="border rounded-lg p-4 hover:bg-gray-50">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-sm text-gray-600">${match.league?.name || 'League'}</span>
                            <span class="text-sm text-gray-500">${time}</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <div class="flex-1 text-center">
                                <div class="font-semibold">${homeTeam?.name || 'Home Team'}</div>
                                <div class="text-xl font-bold text-blue-600">${homeScore}</div>
                            </div>
                            <div class="px-4 text-gray-400">VS</div>
                            <div class="flex-1 text-center">
                                <div class="font-semibold">${awayTeam?.name || 'Away Team'}</div>
                                <div class="text-xl font-bold text-blue-600">${awayScore}</div>
                            </div>
                        </div>
                        <div class="mt-2 text-center">
                            <span class="text-xs bg-gray-200 px-2 py-1 rounded">State: ${match.state_id || 'N/A'}</span>
                        </div>
                    </div>
                `;
            });
            
            matchesContent.innerHTML = html;
        }
        
        // Simple API call function
        async function callAPI(url) {
            try {
                updateStatus(`Fetching: ${url}`, 'info');
                console.log('📡 Calling:', url);
                
                const response = await fetch(url);
                console.log('📊 Response status:', response.status);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                console.log('📊 Response data:', data);
                
                updateStatus(`✅ Success! Found ${data.data?.length || 0} items`, 'success');
                return data;
                
            } catch (error) {
                console.error('💥 API Error:', error);
                updateStatus(`❌ Error: ${error.message}`, 'error');
                return null;
            }
        }
        
        // Load live matches
        async function loadLiveMatches() {
            updateStatus('Loading live matches...', 'info');
            
            // Try inplay first
            let data = await callAPI(`${BASE_URL}/livescores/inplay?api_token=${API_TOKEN}&include=state;participants;league;scores`);
            
            if (data && data.data && data.data.length > 0) {
                displayMatches(data.data, 'Live');
                return;
            }
            
            // Try general livescores
            data = await callAPI(`${BASE_URL}/livescores?api_token=${API_TOKEN}&include=state;participants;league;scores`);
            
            if (data && data.data && data.data.length > 0) {
                const liveMatches = data.data.filter(match => [2, 3, 4, 5, 6].includes(match.state_id));
                displayMatches(liveMatches, 'Live');
                return;
            }
            
            displayMatches([], 'Live');
        }
        
        // Load upcoming matches
        async function loadUpcomingMatches() {
            updateStatus('Loading upcoming matches...', 'info');
            
            const today = new Date().toISOString().split('T')[0];
            let data = await callAPI(`${BASE_URL}/fixtures/date/${today}?api_token=${API_TOKEN}&include=participants;state;league;scores&per_page=15`);
            
            if (data && data.data && data.data.length > 0) {
                const upcoming = data.data.filter(match => [1, 45, 46].includes(match.state_id));
                displayMatches(upcoming, 'Upcoming');
                return;
            }
            
            displayMatches([], 'Upcoming');
        }
        
        // Load finished matches
        async function loadFinishedMatches() {
            updateStatus('Loading finished matches...', 'info');
            
            let data = await callAPI(`${BASE_URL}/fixtures?api_token=${API_TOKEN}&include=participants;state;league;scores&per_page=20`);
            
            if (data && data.data && data.data.length > 0) {
                const finished = data.data.filter(match => [100, 90, 5].includes(match.state_id))
                    .sort((a, b) => new Date(b.starting_at) - new Date(a.starting_at))
                    .slice(0, 15);
                displayMatches(finished, 'Finished');
                return;
            }
            
            displayMatches([], 'Finished');
        }
        
        // Test API connection
        async function testAPI() {
            updateStatus('Testing API connection...', 'info');
            
            const data = await callAPI(`${BASE_URL}/../my/resources?api_token=${API_TOKEN}`);
            
            if (data) {
                updateStatus('✅ API connection successful!', 'success');
                console.log('🎯 API Test Result:', data);
            }
        }
        
        // Initialize on page load
        window.onload = function() {
            console.log('🚀 Simple Betting Platform Loaded');
            testAPI();
        };
    </script>
</body>
</html>
