<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Betting Live & Upcoming Matches</title>
  <style>
    body { font-family: Arial, sans-serif; background:#111; color:#eee; margin:0; padding:20px; }
    h1 { text-align:center; }
    .section { margin-top:30px; }
    .match { background:#222; margin:10px 0; padding:15px; border-radius:8px; }
    .teams { font-size:1.2em; font-weight:bold; }
    .info { margin-top:5px; font-size:0.9em; color:#ccc; }
    .countdown { color:#0f0; font-weight:bold; }
    pre { background:#333; color:#0f0; padding:10px; overflow:auto; }
  </style>
</head>
<body>
  <h1>⚽ Betting Matches</h1>

  <div class="section">
    <h2>Live Matches</h2>
    <div id="live"></div>
  </div>

  <div class="section">
    <h2>Upcoming Matches</h2>
    <div id="upcoming"></div>
  </div>

  <script>
    const token = "DkFdWG9jFZvH8XSEgLrRfGwczABWVg5rlV25GvIRyN06zdPsOI48Nsv9Wooy";

    async function fetchData(url, containerId, type) {
      try {
        const res = await fetch(url);
        const json = await res.json();
        console.log(json); // Debug: see full response in browser console
        const matches = json.data || [];
        const container = document.getElementById(containerId);
        container.innerHTML = "";

        if (matches.length === 0) {
          container.innerHTML = "<p>No " + type + " matches right now.</p><pre>" + JSON.stringify(json, null, 2) + "</pre>";
          return;
        }

        matches.forEach(match => {
          const home = match.participants?.[0]?.name || "Home";
          const away = match.participants?.[1]?.name || "Away";
          const startTime = new Date(match.starting_at);
          const now = new Date();
          const elapsed = Math.floor((now - startTime) / 60000);

          const div = document.createElement("div");
          div.className = "match";
          div.innerHTML = `
            <div class="teams">${home} vs ${away}</div>
            <div class="info">Date: ${startTime.toLocaleDateString()} | Time: ${startTime.toLocaleTimeString()}</div>
            <div class="info">Status: ${match.state?.name || "Unknown"}</div>
            <div class="countdown">${type === "live"
              ? (elapsed > 0 ? "Elapsed: " + elapsed + " min" : "Not started")
              : "Starts in " + Math.max(0, Math.floor((startTime - now) / 60000)) + " min"} </div>
          `;
          container.appendChild(div);
        });
      } catch (err) {
        console.error(err);
        document.getElementById(containerId).innerHTML = "<p>Error loading " + type + " matches.</p>";
      }
    }

    function refresh() {
      fetchData(
        "https://api.sportmonks.com/v3/football/livescores/inplay?api_token=" + token + "&include=participants;state",
        "live",
        "live"
      );
      fetchData(
        "https://api.sportmonks.com/v3/football/fixtures/upcoming?api_token=" + token + "&include=participants;state",
        "upcoming",
        "upcoming"
      );
    }

    refresh();
    setInterval(refresh, 30000);
  </script>
</body>
</html>
