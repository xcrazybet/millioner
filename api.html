<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XLODON | API Intelligence</title>
    <style>
        :root { --neon-green: #00ff88; --dark-bg: #0a0a0a; --card-bg: #161616; --text-gray: #a0a0a0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--dark-bg); color: white; margin: 0; padding: 20px; }
        .dashboard { max-width: 1000px; margin: auto; }
        
        /* Header & Controls */
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 20px; margin-bottom: 20px; }
        h1 { color: var(--neon-green); margin: 0; font-size: 24px; letter-spacing: 1px; }
        .btn-group button { background: #222; color: white; border: 1px solid #444; padding: 8px 16px; cursor: pointer; transition: 0.3s; }
        .btn-group button.active { background: var(--neon-green); color: black; border-color: var(--neon-green); }
        
        /* Status Bar */
        #status { padding: 12px; border-radius: 4px; margin-bottom: 20px; font-size: 14px; display: none; }
        .loading { display: block !important; background: #1a2a3a; color: #3498db; border: 1px solid #3498db; }
        .error { display: block !important; background: #3a1a1a; color: #e74c3c; border: 1px solid #e74c3c; }

        /* Table Styling */
        .table-container { background: var(--card-bg); border-radius: 8px; overflow: hidden; border: 1px solid #222; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #222; color: var(--text-gray); text-align: left; padding: 15px; font-size: 13px; text-transform: uppercase; }
        td { padding: 15px; border-bottom: 1px solid #222; font-size: 15px; }
        tr:last-child td { border-bottom: none; }
        .highlight { color: var(--neon-green); font-weight: bold; }
        .id-badge { font-family: monospace; color: #555; font-size: 12px; }
    </style>
</head>
<body>

<div class="dashboard">
    <header>
        <h1>XLODON <span style="font-weight: 100; color: white;">SYSTEMS</span></h1>
        <div class="btn-group">
            <button id="btn-stats" class="active" onclick="loadData('stats')">Round Statistics</button>
            <button id="btn-fixtures" onclick="loadData('fixtures')">World Cup Fixtures</button>
        </div>
    </header>

    <div id="status"></div>

    <div class="table-container">
        <table id="main-table">
            <thead id="table-head">
                </thead>
            <tbody id="table-body">
                </tbody>
        </table>
    </div>
</div>

<script>
    const API_TOKEN = "DkFdWG9jFZvH8XSEgLrRfGwczABWVg5rlV25GvIRyN06zdPsOI48Nsv9Wooy";
    const PROXY = "https://corsproxy.io/?url=";

    async function loadData(mode) {
        const status = document.getElementById('status');
        const tbody = document.getElementById('table-body');
        const thead = document.getElementById('table-head');
        
        // UI Reset
        status.className = "loading";
        status.innerText = `Fetching ${mode === 'stats' ? 'Statistics' : 'Fixtures'} via Proxy...`;
        tbody.innerHTML = "";
        document.querySelectorAll('.btn-group button').forEach(b => b.classList.remove('active'));
        document.getElementById(`btn-${mode}`).classList.add('active');

        // Choose Endpoint
        let targetUrl = "";
        if (mode === 'stats') {
            targetUrl = `https://api.sportmonks.com/v3/football/statistics/rounds/1?api_token=${API_TOKEN}&include=type`;
        } else {
            // Fetching World Cup Start Date (June 12, 2026)
            targetUrl = `https://api.sportmonks.com/v3/football/fixtures/date/2026-06-12?api_token=${API_TOKEN}&include=participants;league`;
        }

        try {
            const response = await fetch(PROXY + encodeURIComponent(targetUrl));
            if (!response.ok) throw new Error(`HTTP Error ${response.status}`);
            const result = await response.json();
            const data = result.data;

            if (!data || data.length === 0) {
                throw new Error("No data found for this selection.");
            }

            status.style.display = "none";

            if (mode === 'stats') {
                thead.innerHTML = `<tr><th>Statistic</th><th>Value</th><th>Type ID</th></tr>`;
                data.forEach(item => {
                    tbody.innerHTML += `
                        <tr>
                            <td class="highlight">${item.type?.name || 'Standard Stat'}</td>
                            <td>${item.value}</td>
                            <td class="id-badge">${item.type_id}</td>
                        </tr>`;
                });
            } else {
                thead.innerHTML = `<tr><th>Match</th><th>Competition</th><th>Time (UTC)</th></tr>`;
                data.forEach(item => {
                    tbody.innerHTML += `
                        <tr>
                            <td class="highlight">${item.name || 'TBD vs TBD'}</td>
                            <td>${item.league?.name || 'World Cup'}</td>
                            <td>${new Date(item.starting_at).toLocaleString()}</td>
                        </tr>`;
                });
            }

        } catch (err) {
            status.className = "error";
            status.innerText = `System Error: ${err.message}`;
        }
    }

    // Initial Load
    loadData('stats');
</script>

</body>
</html>
