            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",

            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962",
            measurementId: "G-PTV4XMYQ6P"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ============ FOOTBALL API ============

        class FootballAPI {
            constructor() {
                this.cache = {};
                this.cacheDuration = 10000; // 10 seconds cache
            }

            // Main request handler
            async handleRequest() {
                const urlParams = new URLSearchParams(window.location.search);
                const endpoint = urlParams.get('endpoint') || 'live';
                const format = urlParams.get('format') || 'json';
                const league = urlParams.get('league');
                const team = urlParams.get('team');
                const country = urlParams.get('country');
                const source = urlParams.get('source');
                const limit = urlParams.get('limit') || '50';
                const callback = urlParams.get('callback');

                const params = { league, team, country, source, limit };

                try {
                    const result = await this.getEndpointData(endpoint, params);
                    
                    // Add API metadata
                    result.api = {
                        version: '2.0',
                        name: 'Football Data Hub API',
                        documentation: 'https://xcrazybet.github.io/millioner/api.html',
                        endpoints: [
                            'live', 'fixtures', 'leagues', 'standings', 
                            'sources', 'status', 'help'
                        ],
                        rate_limit: '100 requests/hour',
                        cache: '10 seconds'
                    };

                    result.request = {
                        endpoint: endpoint,
                        params: params,
                        timestamp: new Date().toISOString(),
                        url: window.location.href
                    };

                    result.success = true;

                    // Output based on format
                    if (format === 'jsonp' && callback) {
                        this.outputJSONP(result, callback);
                    } else {
                        this.outputJSON(result);
                    }
                } catch (error) {
                    this.outputError(error);
                }
            }

            // Get data for specific endpoint
            async getEndpointData(endpoint, params) {
                const cacheKey = `${endpoint}_${JSON.stringify(params)}`;
                
                // Check cache
                if (this.cache[cacheKey] && 
                    Date.now() - this.cache[cacheKey].timestamp < this.cacheDuration) {
                    return { 
                        ...this.cache[cacheKey].data, 
                        cached: true,
                        cache_expires: new Date(Date.now() + this.cacheDuration).toISOString()
                    };
                }

                let data;
                switch(endpoint) {
                    case 'live':
                        data = await this.getLiveScores(params);
                        break;
                    case 'fixtures':
                        data = await this.getFixtures(params);
                        break;
                    case 'leagues':
                        data = await this.getLeagues(params);
                        break;
                    case 'standings':
                        data = await this.getStandings(params);
                        break;
                    case 'sources':
                        data = await this.getSourceStats(params);
                        break;
                    case 'status':
                        data = await this.getSystemStatus(params);
                        break;
                    case 'help':
                        data = this.getAPIHelp(params);
                        break;
                    default:
                        data = await this.getLiveScores(params);
                }

                // Cache the result
                this.cache[cacheKey] = {
                    data: data,
                    timestamp: Date.now()
                };

                return { ...data, cached: false };
            }

            // ============ CORE DATA FUNCTIONS ============

            async getLiveScores(params = {}) {
                try {
                    const firebaseData = await this.getFirebaseData();
                    
                    if (!firebaseData.success) {
                        return this.getFallbackData('live');
                    }

                    let matches = firebaseData.data.live_matches || [];
                    
                    // Apply filters
                    if (params.league) {
                        matches = matches.filter(m => 
                            m.league?.toLowerCase().includes(params.league.toLowerCase())
                        );
                    }
                    
                    if (params.team) {
                        const teamLower = params.team.toLowerCase();
                        matches = matches.filter(m => 
                            m.home_team?.toLowerCase().includes(teamLower) ||
                            m.away_team?.toLowerCase().includes(teamLower)
                        );
                    }
                    
                    if (params.country) {
                        matches = matches.filter(m => 
                            m.country?.toLowerCase().includes(params.country.toLowerCase())
                        );
                    }
                    
                    if (params.source) {
                        matches = matches.filter(m => 
                            m.source?.toLowerCase() === params.source.toLowerCase()
                        );
                    }
                    
                    // Apply limit
                    const limit = parseInt(params.limit) || 50;
                    matches = matches.slice(0, limit);

                    return {
                        endpoint: 'live',
                        data: matches,
                        count: matches.length,
                        filters_applied: params,
                        sources: firebaseData.data.stats?.sources || {},
                        updated: firebaseData.data.last_updated,
                        total_available: firebaseData.data.stats?.total_matches || 0
                    };
                } catch (error) {
                    console.error('Live scores error:', error);
                    return this.getFallbackData('live');
                }
            }

            async getFixtures(params = {}) {
                try {
                    const firebaseData = await this.getFirebaseData();
                    
                    if (!firebaseData.success) {
                        return this.getFallbackData('fixtures');
                    }

                    let fixtures = firebaseData.data.fixtures || [];
                    
                    if (params.league) {
                        fixtures = fixtures.filter(f => 
                            f.league?.toLowerCase().includes(params.league.toLowerCase())
                        );
                    }
                    
                    const limit = parseInt(params.limit) || 100;
                    fixtures = fixtures.slice(0, limit);

                    return {
                        endpoint: 'fixtures',
                        data: fixtures,
                        count: fixtures.length,
                        filters_applied: params,
                        updated: firebaseData.data.last_updated
                    };
                } catch (error) {
                    console.error('Fixtures error:', error);
                    return this.getFallbackData('fixtures');
                }
            }

            async getLeagues(params = {}) {
                try {
                    const firebaseData = await this.getFirebaseData();
                    
                    if (!firebaseData.success) {
                        return this.getFallbackData('leagues');
                    }

                    let leagues = firebaseData.data.leagues || [];
                    
                    if (params.country) {
                        leagues = leagues.filter(l => 
                            l.country?.toLowerCase().includes(params.country.toLowerCase())
                        );
                    }

                    return {
                        endpoint: 'leagues',
                        data: leagues,
                        count: leagues.length,
                        filters_applied: params,
                        updated: firebaseData.data.last_updated
                    };
                } catch (error) {
                    console.error('Leagues error:', error);
                    return this.getFallbackData('leagues');
                }
            }

            async getStandings(params = {}) {
                try {
                    const firebaseData = await this.getFirebaseData();
                    
                    if (!firebaseData.success) {
                        return this.getFallbackData('standings');
                    }

                    const allMatches = [
                        ...(firebaseData.data.live_matches || []),
                        ...(firebaseData.data.fixtures || [])
                    ];

                    const standings = {};
                    const league = params.league || 'Premier League';
                    
                    const leagueMatches = allMatches.filter(m => 
                        m.league?.toLowerCase().includes(league.toLowerCase()) && 
                        m.status === 'FINISHED'
                    );

                    // Calculate standings
                    const teams = {};
                    leagueMatches.forEach(match => {
                        if (!teams[match.home_team]) {
                            teams[match.home_team] = {
                                team: match.home_team,
                                played: 0, wins: 0, draws: 0, losses: 0,
                                gf: 0, ga: 0, points: 0
                            };
                        }
                        if (!teams[match.away_team]) {
                            teams[match.away_team] = {
                                team: match.away_team,
                                played: 0, wins: 0, draws: 0, losses: 0,
                                gf: 0, ga: 0, points: 0
                            };
                        }

                        const homeScore = parseInt(match.home_score) || 0;
                        const awayScore = parseInt(match.away_score) || 0;

                        teams[match.home_team].played++;
                        teams[match.away_team].played++;
                        
                        teams[match.home_team].gf += homeScore;
                        teams[match.home_team].ga += awayScore;
                        teams[match.away_team].gf += awayScore;
                        teams[match.away_team].ga += homeScore;

                        if (homeScore > awayScore) {
                            teams[match.home_team].wins++;
                            teams[match.home_team].points += 3;
                            teams[match.away_team].losses++;
                        } else if (homeScore < awayScore) {
                            teams[match.away_team].wins++;
                            teams[match.away_team].points += 3;
                            teams[match.home_team].losses++;
                        } else {
                            teams[match.home_team].draws++;
                            teams[match.away_team].draws++;
                            teams[match.home_team].points += 1;
                            teams[match.away_team].points += 1;
                        }
                    });

                    // Convert to array and sort
                    const standingsArray = Object.values(teams).map(team => ({
                        ...team,
                        goal_difference: team.gf - team.ga,
                        position: 0
                    }));

                    standingsArray.sort((a, b) => 
                        b.points - a.points || 
                        b.goal_difference - a.goal_difference ||
                        b.gf - a.gf
                    );
                    
                    standingsArray.forEach((team, index) => {
                        team.position = index + 1;
                    });

                    standings[league] = standingsArray;

                    return {
                        endpoint: 'standings',
                        data: standings,
                        league: league,
                        match_count: leagueMatches.length,
                        updated: firebaseData.data.last_updated
                    };
                } catch (error) {
                    console.error('Standings error:', error);
                    return this.getFallbackData('standings');
                }
            }

            async getSourceStats(params = {}) {
                try {
                    const gamesRef = collection(db, 'games');
                    const q = query(gamesRef, orderBy('saved_at', 'desc'), limit(1));
                    const snapshot = await getDocs(q);
                    
                    if (!snapshot.empty) {
                        const latestDoc = snapshot.docs[0];
                        const data = latestDoc.data();
                        
                        return {
                            endpoint: 'sources',
                            data: {
                                sources: ['espn', 'bbc', 'api-football'],
                                stats: data.stats?.sources || {},
                                total_extractions: data.extraction_id || 0,
                                last_extraction: data.saved_at,
                                last_data_update: data.last_updated
                            },
                            updated: new Date().toISOString()
                        };
                    }
                    
                    return {
                        endpoint: 'sources',
                        data: {
                            sources: ['espn', 'bbc', 'api-football'],
                            status: 'Waiting for first data extraction',
                            note: 'Check https://xcrazybet.github.io/millioner/fot.html'
                        },
                        updated: new Date().toISOString()
                    };
                    
                } catch (error) {
                    console.error('Source stats error:', error);
                    return {
                        endpoint: 'sources',
                        error: error.message,
                        updated: new Date().toISOString()
                    };
                }
            }

            async getSystemStatus(params = {}) {
                try {
                    const gamesRef = collection(db, 'games');
                    const q = query(gamesRef, orderBy('saved_at', 'desc'), limit(1));
                    const snapshot = await getDocs(q);
                    
                    const now = new Date();
                    let lastUpdate = null;
                    let dataAge = null;
                    let isOnline = false;
                    
                    if (!snapshot.empty) {
                        const latestDoc = snapshot.docs[0];
                        const data = latestDoc.data();
                        lastUpdate = data.last_updated;
                        
                        if (lastUpdate) {
                            const lastUpdateTime = new Date(lastUpdate);
                            dataAge = Math.floor((now - lastUpdateTime) / 1000 / 60); // minutes
                            isOnline = dataAge < 10; // Consider online if updated in last 10 minutes
                        }
                    }
                    
                    return {
                        endpoint: 'status',
                        data: {
                            system: 'Football Data Hub API',
                            status: isOnline ? 'online' : 'offline',
                            last_update: lastUpdate,
                            data_age_minutes: dataAge,
                            uptime: '100%',
                            firebase: 'connected',
                            cache_enabled: true,
                            cache_duration_seconds: this.cacheDuration / 1000,
                            endpoints_available: 7
                        },
                        updated: now.toISOString()
                    };
                    
                } catch (error) {
                    console.error('Status error:', error);
                    return {
                        endpoint: 'status',
                        data: {
                            system: 'Football Data Hub API',
                            status: 'error',
                            error: error.message
                        },
                        updated: new Date().toISOString()
                    };
                }
            }

                    },
                    updated: new Date().toISOString()

            }

            // ============ HELPER FUNCTIONS ============

            async getFirebaseData() {
                try {
                    const gamesRef = collection(db, 'games');
                    const q = query(gamesRef, orderBy('saved_at', 'desc'), limit(1));
                    const snapshot = await getDocs(q);
                    
                    if (!snapshot.empty) {
                        const latestDoc = snapshot.docs[0];
                        return {
                            success: true,
                            data: latestDoc.data(),
                            updated: latestDoc.data().last_updated
                        };
                    } else {
                        return {
                            success: false,
                            error: 'No data in Firebase. Start the collector first.',
                            help: 'Open https://xcrazybet.github.io/millioner/fot.html'
                        };
                    }
                } catch (error) {
                    console.error('Firebase fetch error:', error);
                    return {
                        success: false,
                        error: error.message
                    };
                }
            }

            getFallbackData(endpoint) {
                const fallbackData = {
                    live: {
                        endpoint: 'live',
                        data: [],
                        count: 0,
                        note: 'Fallback data - Firebase not available. Start the collector at https://xcrazybet.github.io/millioner/fot.html',
                        updated: new Date().toISOString()
                    },
                    fixtures: {
                        endpoint: 'fixtures',
                        data: [],
                        note: 'No fixture data available',
                        updated: new Date().toISOString()
                    },
                    leagues: {
                        endpoint: 'leagues',
                        data: [
                            { name: 'Premier League', country: 'England', match_count: 0 },
                            { name: 'La Liga', country: 'Spain', match_count: 0 },
                            { name: 'Serie A', country: 'Italy', match_count: 0 }
                        ],
                        note: 'Fallback league data',
                        updated: new Date().toISOString()
                    },
                    standings: {
                        endpoint: 'standings',
                        data: {},
                        note: 'No standings data available',
                        updated: new Date().toISOString()
                    }
                };

                return fallbackData[endpoint] || fallbackData.live;
            }

            // ============ OUTPUT FUNCTIONS ============

            outputJSON(data) {
                // Check if this is an API call or browser request
                const isAPICall = !document.referrer || 
                                 window.location.search.includes('format=json') ||
                                 window.location.search.includes('callback=');
                
                if (isAPICall) {
                    // Pure JSON for API calls
                    document.head.innerHTML = '';
                    document.body.innerHTML = '';
                    
                    const pre = document.createElement('pre');
                    pre.textContent = JSON.stringify(data, null, 2);
                    document.body.appendChild(pre);
                    
                    const style = document.createElement('style');
                    style.textContent = `
                        body { 
                            margin: 0; 
                            padding: 20px; 
                            background: #0f172a; 
                            color: #f8fafc; 
                            font-family: monospace; 
                            font-size: 14px;
                        }
                        pre { 
                            white-space: pre-wrap; 
                            word-wrap: break-word;
                            margin: 0;
                        }
                    `;
                    document.head.appendChild(style);
                } else {
                    // Enhanced display for browser
                    this.renderAPIDocumentation(data);
                }
            }

            outputJSONP(data, callback) {
                const script = document.createElement('script');
                script.textContent = `${callback}(${JSON.stringify(data)})`;
                document.body.appendChild(script);
            }

            outputError(error) {
                const errorData = {
                    success: false,
                    error: error.message,
                    endpoint: new URLSearchParams(window.location.search).get('endpoint') || 'unknown',
                    timestamp: new Date().toISOString(),
                    help: 'Check https://xcrazybet.github.io/millioner/api.html for documentation'
                };
                
                if (document.body) {
                    document.body.innerHTML = `<pre style="color: #ef4444; padding: 20px;">${JSON.stringify(errorData, null, 2)}</pre>`;
                }
            }

                        </div>
                        
                        <div style="margin-top: 25px; padding-top: 20px; border-top: 1px solid #e2e8f0;">
                            <h3 style="color: #0f172a; margin-bottom: 15px;">📊 Response Info</h3>
                            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
                                <div style="background: #f1f5f9; padding: 15px; border-radius: 8px;">
                                    <div style="font-size: 12px; color: #64748b;">Endpoint</div>
                                    <div style="font-weight: bold; color: #0f172a;">${data.endpoint || 'live'}</div>
                                </div>
                                <div style="background: #f1f5f9; padding: 15px; border-radius: 8px;">
                                    <div style="font-size: 12px; color: #64748b;">Status</div>
                                    <div style="font-weight: bold; color: ${data.success ? '#10b981' : '#ef4444'}">${data.success ? '✅ Success' : '❌ Error'}</div>
                                </div>
                                <div style="background: #f1f5f9; padding: 15px; border-radius: 8px;">
                                    <div style="font-size: 12px; color: #64748b;">Data Count</div>
                                    <div style="font-weight: bold; color: #0f172a;">${data.count || data.data?.length || 0}</div>
                                </div>
                                <div style="background: #f1f5f9; padding: 15px; border-radius: 8px;">
                                    <div style="font-size: 12px; color: #64748b;">Updated</div>
                                    <div style="font-weight: bold; color: #0f172a;">${new Date(data.updated || new Date()).toLocaleTimeString()}</div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    ${data.endpoint === 'live' || data.endpoint === 'fixtures' ? `
                    <div style="background: white; border-radius: 10px; padding: 25px; margin-top: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.1);">
                        <h3 style="color: #0f172a; margin-bottom: 15px;">⚽ Data Preview</h3>
                        <div style="display: grid; gap: 10px;" id="matches-preview">
                            ${this.renderMatchesPreview(data.data || [])}
                        </div>
                    </div>
                    ` : ''}
                `;
                
                content.appendChild(sidebar);
                content.appendChild(main);
                
                container.appendChild(header);
                container.appendChild(content);
                document.body.appendChild(container);
                
                // Add global functions
                window.copyJSON = () => {
                    const jsonText = JSON.stringify(data, null, 2);
                    navigator.clipboard.writeText(jsonText)
                        .then(() => alert('JSON copied to clipboard!'))
                        .catch(err => console.error('Copy failed:', err));
                };
                
                window.testEndpoint = () => {
                    const endpoint = data.endpoint || 'live';
                    const url = `api.html?endpoint=${endpoint}&format=json`;
                    fetch(url)
                        .then(res => res.json())
                        .then(testData => {
                            alert(`✅ API Test Successful!\nEndpoint: ${endpoint}\nCount: ${testData.count || testData.data?.length || 0}`);
                        })
                        .catch(err => {
                            alert(`❌ API Test Failed: ${err.message}`);
                        });
                };
            }

            renderMatchesPreview(matches) {
                if (!matches || !Array.isArray(matches) || matches.length === 0) {
                    return '<p style="color: #64748b; text-align: center; padding: 20px;">No match data available</p>';
                }
                
                return matches.slice(0, 5).map(match => `
                    <div style="display: flex; justify-content: space-between; align-items: center; padding: 15px; background: #f8fafc; border-radius: 8px; border-left: 4px solid #3b82f6;">
                        <div style="flex: 1;">
                            <div style="font-weight: bold; color: #0f172a;">${match.home_team || 'Unknown'} vs ${match.away_team || 'Unknown'}</div>
                            <div style="font-size: 12px; color: #64748b; margin-top: 5px;">
                                ${match.league || ''} • ${match.status || ''} • ${match.source || ''}
                            </div>
                        </div>
                        <div style="text-align: right;">
                            <div style="font-size: 24px; font-weight: bold; color: #0f172a;">${match.score || '0-0'}</div>
                            <div style="font-size: 12px; color: #64748b;">${match.minute || '0'}'</div>
                        </div>
                    </div>
                `).join('');
            }
        }

        // Initialize API when page loads
        document.addEventListener('DOMContentLoaded', () => {
            const api = new FootballAPI();
            api.handleRequest();
        });
    </script>
    
    <style>
        /* Loading animation */
        @keyframes spin { 
            to { transform: rotate(360deg); } 
        }
        
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f8fafc;
        }
    </style>
</head>
<body>
    <!-- Loading state (shown briefly) -->
    <div id="loading" style="display: flex; justify-content: center; align-items: center; height: 100vh; flex-direction: column;">
        <div style="width: 60px; height: 60px; border: 6px solid #e2e8f0; border-top-color: #3b82f6; border-radius: 50%; animation: spin 1s linear infinite;"></div>
        <h2 style="margin-top: 20px; color: #64748b;">Loading Football API...</h2>
        <p style="color: #94a3b8;">Fetching real-time data from Firebase</p>
    </div>
    
    <script>
        // Hide loading when content is ready
        setTimeout(() => {
            document.getElementById('loading').style.display = 'none';
        }, 500);
    </script>
</body>
</html>
