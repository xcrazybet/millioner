<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Betting Platform - Server Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(34, 197, 94, 0.3); }
            50% { box-shadow: 0 0 40px rgba(34, 197, 94, 0.6); }
        }
        .live-indicator {
            animation: pulse-glow 2s infinite;
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
        }
        .match-card {
            transition: all 0.3s ease;
            border: 1px solid #e5e7eb;
        }
        .match-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .odd-button {
            transition: all 0.2s ease;
        }
        .odd-button:hover {
            transform: scale(1.05);
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
        }
        .odd-button.selected {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
        }
        .toast {
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .loading-spinner {
            border: 3px solid #f3f4f6;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Header -->
    <header class="bg-gradient-to-r from-blue-600 to-purple-600 text-white shadow-lg">
        <div class="container mx-auto px-4 py-4">
            <div class="flex justify-between items-center">
                <div class="flex items-center space-x-3">
                    <i class="fas fa-futbol text-3xl"></i>
                    <h1 class="text-2xl font-bold">Live Betting Platform</h1>
                    <span class="bg-green-500 px-3 py-1 rounded-full text-sm font-semibold">SERVER MODE</span>
                </div>
                <div class="flex items-center space-x-4">
                    <button onclick="testAPI()" class="bg-white text-blue-600 px-4 py-2 rounded-lg font-semibold hover:bg-gray-100 transition">
                        <i class="fas fa-vial mr-2"></i>🧪 Test API
                    </button>
                    <div class="bg-white bg-opacity-20 px-4 py-2 rounded-lg">
                        <i class="fas fa-wallet mr-2"></i>
                        <span id="walletBalance">$1000.00</span>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-6">
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            <!-- Main Betting Area -->
            <div class="lg:col-span-3">
                <!-- Tab Navigation -->
                <div class="bg-white rounded-lg shadow-md mb-6">
                    <div class="flex border-b">
                        <button onclick="switchTab('live')" class="tab-btn flex-1 py-3 px-4 font-semibold text-center hover:bg-gray-50 transition border-b-2 border-blue-500 text-blue-600" data-tab="live">
                            <i class="fas fa-broadcast-tower mr-2"></i>🔥 Live
                        </button>
                        <button onclick="switchTab('upcoming')" class="tab-btn flex-1 py-3 px-4 font-semibold text-center hover:bg-gray-50 transition border-b-2 border-transparent" data-tab="upcoming">
                            <i class="fas fa-calendar-alt mr-2"></i>📅 Upcoming
                        </button>
                        <button onclick="switchTab('finished')" class="tab-btn flex-1 py-3 px-4 font-semibold text-center hover:bg-gray-50 transition border-b-2 border-transparent" data-tab="finished">
                            <i class="fas fa-flag-checkered mr-2"></i>🏁 Finished
                        </button>
                    </div>
                </div>

                <!-- Loading State -->
                <div id="loadingState" class="flex justify-center items-center py-12">
                    <div class="text-center">
                        <div class="loading-spinner mx-auto mb-4"></div>
                        <p class="text-gray-600 font-semibold">Loading matches...</p>
                    </div>
                </div>

                <!-- Matches Container -->
                <div id="matchesContainer" class="space-y-4">
                    <!-- Matches will be loaded here -->
                </div>
            </div>

            <!-- Betting Slip -->
            <div class="lg:col-span-1">
                <div class="bg-white rounded-lg shadow-md sticky top-4">
                    <div class="bg-gradient-to-r from-green-500 to-green-600 text-white p-4 rounded-t-lg">
                        <h3 class="font-bold text-lg">
                            <i class="fas fa-receipt mr-2"></i>Betting Slip
                        </h3>
                    </div>
                    <div class="p-4">
                        <div id="bettingSlip" class="space-y-2 mb-4">
                            <p class="text-gray-500 text-center py-4">No bets selected</p>
                        </div>
                        <div class="border-t pt-4">
                            <div class="mb-3">
                                <label class="block text-sm font-semibold mb-1">Stake Amount</label>
                                <input type="number" id="stakeAmount" value="10" min="1" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                            </div>
                            <div class="bg-gray-100 p-3 rounded-lg mb-3">
                                <div class="flex justify-between text-sm mb-1">
                                    <span>Total Odds:</span>
                                    <span id="totalOdds" class="font-bold">1.00</span>
                                </div>
                                <div class="flex justify-between text-sm mb-1">
                                    <span>Potential Win:</span>
                                    <span id="potentialWin" class="font-bold text-green-600">$0.00</span>
                                </div>
                            </div>
                            <button onclick="placeBet()" class="w-full bg-green-500 text-white py-2 rounded-lg font-semibold hover:bg-green-600 transition">
                                <i class="fas fa-check-circle mr-2"></i>Place Bet
                            </button>
                            <button onclick="clearBettingSlip()" class="w-full bg-gray-200 text-gray-700 py-2 rounded-lg font-semibold hover:bg-gray-300 transition mt-2">
                                <i class="fas fa-trash mr-2"></i>Clear All
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Toast Container -->
    <div id="toastContainer" class="fixed top-4 right-4 z-50 space-y-2"></div>

    <script>
        // Global variables
        let currentTab = 'live';
        let bettingSlip = [];
        let walletBalance = 1000;

        // API Base URL (using our server)
        const API_BASE = '';

        // Initialize app
        document.addEventListener('DOMContentLoaded', () => {
            console.log('🚀 Betting Platform Initializing...');
            loadMatches();
            updateBettingSlip();
        });

        // Tab switching
        function switchTab(tab) {
            currentTab = tab;
            
            // Update tab buttons
            document.querySelectorAll('.tab-btn').forEach(btn => {
                if (btn.dataset.tab === tab) {
                    btn.classList.add('border-blue-500', 'text-blue-600');
                    btn.classList.remove('border-transparent');
                } else {
                    btn.classList.remove('border-blue-500', 'text-blue-600');
                    btn.classList.add('border-transparent');
                }
            });
            
            // Load matches for selected tab
            loadMatches();
        }

        // Load matches based on current tab
        async function loadMatches() {
            const loadingState = document.getElementById('loadingState');
            const matchesContainer = document.getElementById('matchesContainer');
            
            // Show loading
            loadingState.style.display = 'block';
            matchesContainer.innerHTML = '';
            
            try {
                let endpoint = '';
                switch(currentTab) {
                    case 'live':
                        endpoint = '/api/livescores';
                        break;
                    case 'upcoming':
                        endpoint = '/api/upcoming';
                        break;
                    case 'finished':
                        endpoint = '/api/finished';
                        break;
                }
                
                console.log(`📡 Fetching from: ${endpoint}`);
                const response = await fetch(endpoint);
                const data = await response.json();
                
                console.log(`📊 Response:`, data);
                
                if (data.success && data.data && data.data.length > 0) {
                    renderMatches(data.data);
                    showToast('success', 'Success', `${data.data.length} matches loaded from ${data.source}`);
                } else {
                    renderEmptyState();
                    showToast('warning', 'No Matches', data.message || 'No matches available');
                }
                
            } catch (error) {
                console.error('💥 Load error:', error);
                renderEmptyState();
                showToast('error', 'Error', `Failed to load matches: ${error.message}`);
            } finally {
                loadingState.style.display = 'none';
            }
        }

        // Test API connection
        async function testAPI() {
            try {
                console.log('🧪 Testing API...');
                const response = await fetch('/api/test');
                const data = await response.json();
                
                console.log('📊 Test results:', data);
                
                if (data.success) {
                    showToast('success', 'API Test', 'All endpoints working!');
                    console.log('✅ Resources:', data.resources);
                    console.log('✅ Livescores:', data.livescores);
                    console.log('✅ Fixtures:', data.fixtures);
                } else {
                    showToast('error', 'API Test Failed', data.error);
                }
            } catch (error) {
                console.error('💥 Test error:', error);
                showToast('error', 'API Test Error', error.message);
            }
        }

        // Render matches
        function renderMatches(matches) {
            const container = document.getElementById('matchesContainer');
            container.innerHTML = '';
            
            matches.forEach(match => {
                const matchCard = createMatchCard(match);
                container.innerHTML += matchCard;
            });
        }

        // Render empty state
        function renderEmptyState() {
            const container = document.getElementById('matchesContainer');
            container.innerHTML = `
                <div class="text-center py-12 bg-white rounded-lg shadow">
                    <i class="fas fa-futbol text-6xl text-gray-300 mb-4"></i>
                    <h3 class="text-xl font-semibold text-gray-600 mb-2">No matches found</h3>
                    <p class="text-gray-500">No ${currentTab} matches available at the moment</p>
                </div>
            `;
        }

        // Create match card
        function createMatchCard(match) {
            const isLive = currentTab === 'live';
            const participants = match.participants || [];
            const scores = match.scores || {};
            
            const homeTeam = participants.find(p => p.meta?.location === 'home') || participants[0];
            const awayTeam = participants.find(p => p.meta?.location === 'away') || participants[1];
            
            const homeScore = scores.home_score || 0;
            const awayScore = scores.away_score || 0;
            
            const odds = generateRealisticOdds();
            
            return `
                <div class="match-card bg-white rounded-lg shadow-md p-6">
                    <div class="flex justify-between items-start mb-4">
                        <div class="flex items-center space-x-2">
                            ${isLive ? '<span class="live-indicator text-white px-2 py-1 rounded-full text-xs font-bold">LIVE</span>' : ''}
                            <span class="text-sm text-gray-600">${match.league?.name || 'League'}</span>
                        </div>
                        <span class="text-sm text-gray-500">${formatTime(match.starting_at)}</span>
                    </div>
                    
                    <div class="flex justify-between items-center mb-4">
                        <div class="flex-1 text-center">
                            <div class="font-semibold text-lg">${homeTeam?.name || 'Home Team'}</div>
                            ${isLive ? `<div class="text-2xl font-bold text-blue-600">${homeScore}</div>` : ''}
                        </div>
                        <div class="px-4">
                            ${isLive ? '<span class="text-gray-400">vs</span>' : '<span class="text-gray-400">vs</span>'}
                        </div>
                        <div class="flex-1 text-center">
                            <div class="font-semibold text-lg">${awayTeam?.name || 'Away Team'}</div>
                            ${isLive ? `<div class="text-2xl font-bold text-blue-600">${awayScore}</div>` : ''}
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-3 gap-2">
                        <button onclick="addToBettingSlip('${match.id}', '1', ${odds.homeWin}, '${homeTeam?.name} vs ${awayTeam?.name}')" class="odd-button bg-blue-50 hover:bg-blue-100 text-blue-700 py-2 px-3 rounded-lg font-semibold text-sm">
                            1<br>${odds.homeWin.toFixed(2)}
                        </button>
                        <button onclick="addToBettingSlip('${match.id}', 'X', ${odds.draw}, '${homeTeam?.name} vs ${awayTeam?.name}')" class="odd-button bg-gray-50 hover:bg-gray-100 text-gray-700 py-2 px-3 rounded-lg font-semibold text-sm">
                            X<br>${odds.draw.toFixed(2)}
                        </button>
                        <button onclick="addToBettingSlip('${match.id}', '2', ${odds.awayWin}, '${homeTeam?.name} vs ${awayTeam?.name}')" class="odd-button bg-blue-50 hover:bg-blue-100 text-blue-700 py-2 px-3 rounded-lg font-semibold text-sm">
                            2<br>${odds.awayWin.toFixed(2)}
                        </button>
                    </div>
                </div>
            `;
        }

        // Generate realistic odds
        function generateRealisticOdds() {
            const homeWin = 1.5 + Math.random() * 2.5;
            const awayWin = 1.5 + Math.random() * 2.5;
            const draw = 2.5 + Math.random() * 2.0;
            
            return {
                homeWin: parseFloat(homeWin.toFixed(2)),
                draw: parseFloat(draw.toFixed(2)),
                awayWin: parseFloat(awayWin.toFixed(2))
            };
        }

        // Format time
        function formatTime(timeString) {
            if (!timeString) return 'Time TBD';
            const date = new Date(timeString);
            return date.toLocaleString('en-US', { 
                month: 'short', 
                day: 'numeric', 
                hour: '2-digit', 
                minute: '2-digit' 
            });
        }

        // Add to betting slip
        function addToBettingSlip(matchId, selection, odds, matchName) {
            const existingBet = bettingSlip.find(bet => bet.matchId === matchId);
            
            if (existingBet) {
                existingBet.selection = selection;
                existingBet.odds = odds;
            } else {
                bettingSlip.push({
                    matchId,
                    selection,
                    odds,
                    matchName
                });
            }
            
            updateBettingSlip();
            showToast('success', 'Bet Added', `${selection} added to betting slip`);
        }

        // Update betting slip display
        function updateBettingSlip() {
            const slipContainer = document.getElementById('bettingSlip');
            const stakeAmount = parseFloat(document.getElementById('stakeAmount').value) || 0;
            
            if (bettingSlip.length === 0) {
                slipContainer.innerHTML = '<p class="text-gray-500 text-center py-4">No bets selected</p>';
                document.getElementById('totalOdds').textContent = '1.00';
                document.getElementById('potentialWin').textContent = '$0.00';
                return;
            }
            
            let totalOdds = 1;
            let slipHTML = '';
            
            bettingSlip.forEach((bet, index) => {
                totalOdds *= bet.odds;
                slipHTML += `
                    <div class="bg-gray-50 p-2 rounded flex justify-between items-center">
                        <div class="flex-1">
                            <div class="text-sm font-semibold">${bet.matchName}</div>
                            <div class="text-xs text-gray-600">Selection: ${bet.selection} @ ${bet.odds.toFixed(2)}</div>
                        </div>
                        <button onclick="removeFromBettingSlip(${index})" class="text-red-500 hover:text-red-700">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                `;
            });
            
            slipContainer.innerHTML = slipHTML;
            document.getElementById('totalOdds').textContent = totalOdds.toFixed(2);
            document.getElementById('potentialWin').textContent = `$${(stakeAmount * totalOdds).toFixed(2)}`;
        }

        // Remove from betting slip
        function removeFromBettingSlip(index) {
            bettingSlip.splice(index, 1);
            updateBettingSlip();
        }

        // Clear betting slip
        function clearBettingSlip() {
            bettingSlip = [];
            updateBettingSlip();
            showToast('info', 'Cleared', 'Betting slip cleared');
        }

        // Place bet
        function placeBet() {
            if (bettingSlip.length === 0) {
                showToast('warning', 'No Bets', 'Please add bets to your slip');
                return;
            }
            
            const stakeAmount = parseFloat(document.getElementById('stakeAmount').value) || 0;
            
            if (stakeAmount <= 0) {
                showToast('warning', 'Invalid Stake', 'Please enter a valid stake amount');
                return;
            }
            
            if (stakeAmount > walletBalance) {
                showToast('error', 'Insufficient Funds', 'Not enough balance for this bet');
                return;
            }
            
            const totalOdds = parseFloat(document.getElementById('totalOdds').textContent);
            const potentialWin = stakeAmount * totalOdds;
            
            walletBalance -= stakeAmount;
            document.getElementById('walletBalance').textContent = `$${walletBalance.toFixed(2)}`;
            
            showToast('success', 'Bet Placed!', `Bet of $${stakeAmount.toFixed(2)} placed. Potential win: $${potentialWin.toFixed(2)}`);
            clearBettingSlip();
        }

        // Show toast notification
        function showToast(type, title, message) {
            const toastContainer = document.getElementById('toastContainer');
            const toastId = Date.now();
            
            const bgColor = {
                success: 'bg-green-500',
                error: 'bg-red-500',
                warning: 'bg-yellow-500',
                info: 'bg-blue-500'
            }[type];
            
            const toast = `
                <div id="toast-${toastId}" class="toast ${bgColor} text-white p-4 rounded-lg shadow-lg min-w-[300px]">
                    <div class="flex justify-between items-start">
                        <div>
                            <div class="font-bold">${title}</div>
                            <div class="text-sm">${message}</div>
                        </div>
                        <button onclick="removeToast('toast-${toastId}')" class="ml-4 text-white hover:text-gray-200">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                </div>
            `;
            
            toastContainer.innerHTML += toast;
            
            setTimeout(() => {
                removeToast(`toast-${toastId}`);
            }, 5000);
        }

        // Remove toast
        function removeToast(toastId) {
            const toast = document.getElementById(toastId);
            if (toast) {
                toast.remove();
            }
        }
    </script>
</body>
</html>
