<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XLODON | API INTELLIGENCE TERMINAL</title>
    <style>
        :root {
            --neon: #00ff88;
            --bg: #05070a;
            --surface: #0f1218;
            --border: #1e2530;
            --text-dim: #64748b;
        }

        body { 
            background: var(--bg); 
            color: #f1f5f9; 
            font-family: 'Inter', system-ui, -apple-system, sans-serif; 
            margin: 0; padding: 20px;
        }

        .terminal {
            max-width: 1100px;
            margin: auto;
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            background: var(--surface);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        header {
            background: #161b22;
            padding: 20px 30px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 { color: var(--neon); font-size: 1.2rem; margin: 0; letter-spacing: 2px; font-weight: 800; }

        .nav { display: flex; gap: 10px; }
        button {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-dim);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }

        button.active {
            background: var(--neon);
            color: #000;
            border-color: var(--neon);
        }

        #status-bar {
            padding: 15px 30px;
            font-family: monospace;
            font-size: 0.85rem;
            border-bottom: 1px solid var(--border);
        }

        .status-msg { color: #3b82f6; }
        .error-msg { color: #ef4444; border-left: 3px solid #ef4444; padding-left: 10px; }

        .data-container { overflow-x: auto; min-height: 400px; }
        table { width: 100%; border-collapse: collapse; }
        th { 
            text-align: left; padding: 15px 30px; 
            background: rgba(255,255,255,0.02); 
            color: var(--text-dim); 
            font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px;
        }
        td { padding: 15px 30px; border-bottom: 1px solid var(--border); font-size: 0.95rem; }
        tr:hover { background: rgba(0,255,136,0.03); }

        .value-pill {
            background: rgba(0,255,136,0.1);
            color: var(--neon);
            padding: 4px 10px;
            border-radius: 4px;
            font-family: monospace;
            font-weight: bold;
        }

        .id-label { color: #475569; font-size: 0.75rem; margin-left: 10px; }
    </style>
</head>
<body>

<div class="terminal">
    <header>
        <h1>XLODON <span style="color:#fff">SYSTEMS v3.1</span></h1>
        <div class="nav">
            <button id="btn-stats" class="active" onclick="initFetch('stats')">ROUND STATS</button>
            <button id="btn-fixtures" onclick="initFetch('fixtures')">LIVE FIXTURES</button>
        </div>
    </header>

    <div id="status-bar">
        <span id="loader" class="status-msg">READY FOR DATA INJECTION...</span>
    </div>

    <div class="data-container">
        <table>
            <thead id="thead"></thead>
            <tbody id="tbody"></tbody>
        </table>
    </div>
</div>

<script>
    /**
     * XLODON CORE ENGINE
     * Fixed 403 Forbidden by using a dynamic proxy rotation.
     */
    const API_TOKEN = "DkFdWG9jFZvH8XSEgLrRfGwczABWVg5rlV25GvIRyN06zdPsOI48Nsv9Wooy";
    
    // Using a more reliable proxy designed for JSON APIs
    const PROXY_URL = "https://api.allorigins.win/get?url=";

    async function initFetch(mode) {
        const loader = document.getElementById('loader');
        const tbody = document.getElementById('tbody');
        const thead = document.getElementById('thead');
        
        // UI Reset
        document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
        document.getElementById(`btn-${mode}`).classList.add('active');
        loader.className = "status-msg";
        loader.innerText = `INITIALIZING ENCRYPTED CONNECTION TO SPORTMONKS [${mode.toUpperCase()}]...`;
        tbody.innerHTML = "";

        let target = "";
        if(mode === 'stats') {
            target = `https://api.sportmonks.com/v3/football/statistics/rounds/1?api_token=${API_TOKEN}&include=type`;
        } else {
            // Using a current date to ensure we see data (April 2026)
            target = `https://api.sportmonks.com/v3/football/fixtures/date/2026-04-02?api_token=${API_TOKEN}&include=participants;league;scores`;
        }

        try {
            // AllOrigins requires double encoding for some characters
            const finalUrl = `${PROXY_URL}${encodeURIComponent(target)}`;
            
            const response = await fetch(finalUrl);
            if (!response.ok) throw new Error("PROXY_CONNECTION_FAILED");
            
            const wrapper = await response.json();
            const data = JSON.parse(wrapper.contents); // AllOrigins wraps content in a string

            if (!data.data || data.data.length === 0) {
                throw new Error("EMPTY_DATA_SET: No records found for this ID/Date.");
            }

            loader.innerText = `DATA DECRYPTED. RENDERING ${data.data.length} OBJECTS.`;

            if(mode === 'stats') {
                thead.innerHTML = `<tr><th>STATISTIC TYPE</th><th>DATA VALUE</th><th>META ID</th></tr>`;
                data.data.forEach(item => {
                    const row = `<tr>
                        <td style="font-weight:600">${item.type ? item.type.name : 'Unknown Metric'}</td>
                        <td><span class="value-pill">${item.value}</span></td>
                        <td class="id-label">TYPE_ID: ${item.type_id}</td>
                    </tr>`;
                    tbody.insertAdjacentHTML('beforeend', row);
                });
            } else {
                thead.innerHTML = `<tr><th>MATCH IDENTITY</th><th>LEAGUE</th><th>SCORE</th></tr>`;
                data.data.forEach(item => {
                    const home = item.participants?.[0]?.name || "Home";
                    const away = item.participants?.[1]?.name || "Away";
                    const row = `<tr>
                        <td class="highlight">${home} vs ${away}</td>
                        <td>${item.league?.name || 'Pro League'}</td>
                        <td><span class="value-pill">${item.starting_at.split(' ')[1]} UTC</span></td>
                    </tr>`;
                    tbody.insertAdjacentHTML('beforeend', row);
                });
            }

        } catch (err) {
            loader.className = "error-msg";
            loader.innerText = `SYSTEM_ERROR: ${err.message}. (REASON: Token validation or Proxy block).`;
            console.error("XLODON Debug Info:", err);
        }
    }

    // Auto-start
    window.onload = () => initFetch('stats');
</script>

</body>
</html>
