<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚽ Football Live Scores API</title>
    
    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { 
            getFirestore, 
            collection,
            query,
            orderBy,
            limit,
            getDocs
        } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962",
            measurementId: "G-PTV4XMYQ6P"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ============ COMPLETE FOOTBALL API ============

        class FootballAPI {
            constructor() {
                this.cache = new Map();
                this.cacheDuration = 10000; // 10 seconds cache
                this.init();
            }

            async init() {
                // Pre-warm cache
                setTimeout(() => this.warmCache(), 1000);
            }

            async warmCache() {
                try {
                    await this.getFirebaseData();
                } catch (error) {
                    console.log('Cache warmup:', error.message);
                }
            }

            // Main request handler
            async handleRequest() {
                const urlParams = new URLSearchParams(window.location.search);
                const endpoint = urlParams.get('endpoint') || 'live';
                const format = urlParams.get('format') || 'json';
                const league = urlParams.get('league');
                const team = urlParams.get('team');
                const country = urlParams.get('country');
                const source = urlParams.get('source');
                const limit = parseInt(urlParams.get('limit')) || 100;
                const page = parseInt(urlParams.get('page')) || 1;
                const callback = urlParams.get('callback');

                const params = { 
                    endpoint, league, team, country, source, 
                    limit, page, format, callback 
                };

                try {
                    const result = await this.getEndpointData(endpoint, params);
                    
                    // Add API metadata
                    result.api = {
                        version: '2.0.0',
                        name: 'Football Data Hub API',
                        documentation: 'https://github.com/xcrazybet/millioner',
                        endpoints: [
                            'live', 'fixtures', 'leagues', 'standings', 
                            'sources', 'status', 'search', 'help'
                        ],
                        rate_limit: '100 requests/hour',
                        cache: '10 seconds',
                        contact: 'xcrazybet.github.io'
                    };

                    result.request = {
                        endpoint: endpoint,
                        parameters: params,
                        timestamp: new Date().toISOString(),
                        url: window.location.href
                    };

                    result.success = true;

                    // Output based on format
                    if (format === 'jsonp' && callback) {
                        this.outputJSONP(result, callback);
                    } else if (format === 'xml') {
                        this.outputXML(result);
                    } else {
                        this.outputJSON(result);
                    }
                } catch (error) {
                    this.outputError(error);
                }
            }

            // Get data for specific endpoint
            async getEndpointData(endpoint, params) {
                const cacheKey = `${endpoint}_${JSON.stringify(params)}`;
                const cached = this.cache.get(cacheKey);
                
                if (cached && Date.now() - cached.timestamp < this.cacheDuration) {
                    return { 
                        ...cached.data, 
                        cached: true,
                        cache_expires: new Date(Date.now() + this.cacheDuration).toISOString()
                    };
                }

                let data;
                switch(endpoint) {
                    case 'live':
                        data = await this.getLiveScores(params);
                        break;
                    case 'fixtures':
                        data = await this.getFixtures(params);
                        break;
                    case 'leagues':
                        data = await this.getLeagues(params);
                        break;
                    case 'standings':
                        data = await this.getStandings(params);
                        break;
                    case 'sources':
                        data = await this.getSourceStats(params);
                        break;
                    case 'status':
                        data = await this.getSystemStatus(params);
                        break;
                    case 'search':
                        data = await this.searchMatches(params);
                        break;
                    case 'help':
                        data = this.getAPIHelp(params);
                        break;
                    default:
                        data = await this.getLiveScores(params);
                }

                this.cache.set(cacheKey, { data: data, timestamp: Date.now() });
                return { ...data, cached: false };
            }

            // ============ CORE DATA ENDPOINTS ============

            async getLiveScores(params = {}) {
                try {
                    const firebaseData = await this.getFirebaseData();
                    
                    if (!firebaseData.success) {
                        return this.getFallbackData('live');
                    }

                    let matches = firebaseData.data.live_matches || [];
                    
                    // Apply filters
                    if (params.league) {
                        matches = matches.filter(m => 
                            m.league?.toLowerCase().includes(params.league.toLowerCase())
                        );
                    }
                    
                    if (params.team) {
                        const teamLower = params.team.toLowerCase();
                        matches = matches.filter(m => 
                            m.home_team?.toLowerCase().includes(teamLower) ||
                            m.away_team?.toLowerCase().includes(teamLower)
                        );
                    }
                    
                    if (params.country) {
                        matches = matches.filter(m => 
                            m.country?.toLowerCase().includes(params.country.toLowerCase())
                        );
                    }
                    
                    if (params.source) {
                        matches = matches.filter(m => 
                            m.source?.toLowerCase() === params.source.toLowerCase()
                        );
                    }
                    
                    // Pagination
                    const start = (params.page - 1) * params.limit;
                    const end = start + params.limit;
                    const paginated = matches.slice(start, end);

                    return {
                        endpoint: 'live',
                        data: paginated,
                        count: paginated.length,
                        total: matches.length,
                        page: params.page,
                        total_pages: Math.ceil(matches.length / params.limit),
                        filters_applied: params,
                        sources: firebaseData.data.stats?.sources || {},
                        updated: firebaseData.data.last_updated,
                        next_update: this.getNextUpdateTime(firebaseData.data.last_updated)
                    };
                } catch (error) {
                    console.error('Live scores error:', error);
                    return this.getFallbackData('live');
                }
            }

            async getFixtures(params = {}) {
                try {
                    const firebaseData = await this.getFirebaseData();
                    
                    if (!firebaseData.success) {
                        return this.getFallbackData('fixtures');
                    }

                    let fixtures = firebaseData.data.fixtures || [];
                    
                    if (params.league) {
                        fixtures = fixtures.filter(f => 
                            f.league?.toLowerCase().includes(params.league.toLowerCase())
                        );
                    }
                    
                    // Pagination
                    const start = (params.page - 1) * params.limit;
                    const end = start + params.limit;
                    const paginated = fixtures.slice(start, end);

                    return {
                        endpoint: 'fixtures',
                        data: paginated,
                        count: paginated.length,
                        total: fixtures.length,
                        page: params.page,
                        total_pages: Math.ceil(fixtures.length / params.limit),
                        filters_applied: params,
                        updated: firebaseData.data.last_updated
                    };
                } catch (error) {
                    console.error('Fixtures error:', error);
                    return this.getFallbackData('fixtures');
                }
            }

            async getLeagues(params = {}) {
                try {
                    const firebaseData = await this.getFirebaseData();
                    
                    if (!firebaseData.success) {
                        return this.getFallbackData('leagues');
                    }

                    let leagues = firebaseData.data.leagues || [];
                    
                    if (params.country) {
                        leagues = leagues.filter(l => 
                            l.country?.toLowerCase().includes(params.country.toLowerCase())
                        );
                    }

                    return {
                        endpoint: 'leagues',
                        data: leagues,
                        count: leagues.length,
                        updated: firebaseData.data.last_updated
                    };
                } catch (error) {
                    console.error('Leagues error:', error);
                    return this.getFallbackData('leagues');
                }
            }

            async getStandings(params = {}) {
                try {
                    const firebaseData = await this.getFirebaseData();
                    
                    if (!firebaseData.success) {
                        return this.getFallbackData('standings');
                    }

                    const allMatches = [
                        ...(firebaseData.data.live_matches || []),
                        ...(firebaseData.data.fixtures || [])
                    ];

                    const standings = {};
                    const league = params.league || 'Premier League';
                    
                    const leagueMatches = allMatches.filter(m => 
                        m.league?.toLowerCase().includes(league.toLowerCase()) && 
                        m.status === 'FINISHED'
                    );

                    // Calculate standings
                    const teams = new Map();
                    
                    leagueMatches.forEach(match => {
                        const homeTeam = match.home_team;
                        const awayTeam = match.away_team;
                        const homeScore = parseInt(match.home_score) || 0;
                        const awayScore = parseInt(match.away_score) || 0;
                        
                        // Initialize teams if not exists
                        if (!teams.has(homeTeam)) {
                            teams.set(homeTeam, {
                                team: homeTeam,
                                played: 0, wins: 0, draws: 0, losses: 0,
                                gf: 0, ga: 0, points: 0
                            });
                        }
                        if (!teams.has(awayTeam)) {
                            teams.set(awayTeam, {
                                team: awayTeam,
                                played: 0, wins: 0, draws: 0, losses: 0,
                                gf: 0, ga: 0, points: 0
                            });
                        }
                        
                        const home = teams.get(homeTeam);
                        const away = teams.get(awayTeam);
                        
                        // Update stats
                        home.played++; away.played++;
                        home.gf += homeScore; home.ga += awayScore;
                        away.gf += awayScore; away.ga += homeScore;
                        
                        if (homeScore > awayScore) {
                            home.wins++; away.losses++;
                            home.points += 3;
                        } else if (homeScore < awayScore) {
                            away.wins++; home.losses++;
                            away.points += 3;
                        } else {
                            home.draws++; away.draws++;
                            home.points += 1; away.points += 1;
                        }
                    });

                    // Convert to array and sort
                    const standingsArray = Array.from(teams.values()).map(team => ({
                        ...team,
                        goal_difference: team.gf - team.ga,
                        position: 0
                    }));

                    standingsArray.sort((a, b) => 
                        b.points - a.points || 
                        b.goal_difference - a.goal_difference ||
                        b.gf - a.gf
                    );
                    
                    standingsArray.forEach((team, index) => {
                        team.position = index + 1;
                    });

                    standings[league] = standingsArray;

                    return {
                        endpoint: 'standings',
                        data: standings,
                        league: league,
                        match_count: leagueMatches.length,
                        updated: firebaseData.data.last_updated
                    };
                } catch (error) {
                    console.error('Standings error:', error);
                    return this.getFallbackData('standings');
                }
            }

            async getSourceStats(params = {}) {
                try {
                    const firebaseData = await this.getFirebaseData();
                    
                    if (!firebaseData.success) {
                        return {
                            endpoint: 'sources',
                            data: {
                                sources: ['espn', 'bbc', 'api-football'],
                                status: 'Waiting for first data extraction',
                                last_data_update: null
                            },
                            updated: new Date().toISOString()
                        };
                    }

                    return {
                        endpoint: 'sources',
                        data: {
                            sources: ['espn', 'bbc', 'api-football'],
                            stats: firebaseData.data.stats?.sources || {},
                            total_extractions: firebaseData.data.extraction_count || 0,
                            total_matches_extracted: firebaseData.data.total_extracted || 0,
                            last_extraction: firebaseData.data.saved_at,
                            last_data_update: firebaseData.data.last_updated
                        },
                        updated: new Date().toISOString()
                    };
                } catch (error) {
                    console.error('Source stats error:', error);
                    return {
                        endpoint: 'sources',
                        error: error.message,
                        updated: new Date().toISOString()
                    };
                }
            }

            async getSystemStatus(params = {}) {
                try {
                    const firebaseData = await this.getFirebaseData();
                    
                    const now = new Date();
                    let lastUpdate = null;
                    let dataAge = null;
                    let isOnline = false;
                    let sourceStatus = {};
                    
                    if (firebaseData.success && firebaseData.data) {
                        lastUpdate = firebaseData.data.last_updated;
                        
                        if (lastUpdate) {
                            const lastUpdateTime = new Date(lastUpdate);
                            dataAge = Math.floor((now - lastUpdateTime) / 1000 / 60);
                            isOnline = dataAge < 10;
                        }
                        
                        // Check individual source status
                        const sources = firebaseData.data.stats?.sources || {};
                        sourceStatus = Object.entries(sources).reduce((acc, [key, value]) => {
                            acc[key] = {
                                enabled: value.success,
                                match_count: value.count,
                                last_success: lastUpdate
                            };
                            return acc;
                        }, {});
                    }
                    
                    return {
                        endpoint: 'status',
                        data: {
                            system: 'Football Data Hub API',
                            status: isOnline ? 'online' : 'offline',
                            last_update: lastUpdate,
                            data_age_minutes: dataAge,
                            uptime: '100%',
                            firebase: firebaseData.success ? 'connected' : 'disconnected',
                            cache_enabled: true,
                            cache_size: this.cache.size,
                            cache_hit_rate: this.calculateCacheHitRate(),
                            endpoints_available: 8,
                            source_status: sourceStatus,
                            next_scheduled_update: this.getNextUpdateTime(lastUpdate)
                        },
                        updated: now.toISOString()
                    };
                } catch (error) {
                    return {
                        endpoint: 'status',
                        data: {
                            system: 'Football Data Hub API',
                            status: 'error',
                            error: error.message
                        },
                        updated: new Date().toISOString()
                    };
                }
            }

            async searchMatches(params = {}) {
                try {
                    const firebaseData = await this.getFirebaseData();
                    
                    if (!firebaseData.success) {
                        return {
                            endpoint: 'search',
                            data: [],
                            count: 0,
                            query: params.q || '',
                            updated: new Date().toISOString()
                        };
                    }

                    const allMatches = [
                        ...(firebaseData.data.live_matches || []),
                        ...(firebaseData.data.fixtures || [])
                    ];
                    
                    const query = (params.q || '').toLowerCase();
                    let results = [];
                    
                    if (query) {
                        results = allMatches.filter(match => 
                            match.home_team?.toLowerCase().includes(query) ||
                            match.away_team?.toLowerCase().includes(query) ||
                            match.league?.toLowerCase().includes(query) ||
                            match.country?.toLowerCase().includes(query)
                        );
                    } else {
                        results = allMatches.slice(0, 50);
                    }
                    
                    // Apply limit
                    results = results.slice(0, params.limit || 50);

                    return {
                        endpoint: 'search',
                        data: results,
                        count: results.length,
                        query: query,
                        updated: firebaseData.data.last_updated
                    };
                } catch (error) {
                    console.error('Search error:', error);
                    return {
                        endpoint: 'search',
                        data: [],
                        count: 0,
                        query: params.q || '',
                        error: error.message,
                        updated: new Date().toISOString()
                    };
                }
            }

            getAPIHelp(params = {}) {
                return {
                    endpoint: 'help',
                    data: {
                        endpoints: [
                            {
                                endpoint: '/live',
                                description: 'Get live football matches',
                                parameters: ['league', 'team', 'country', 'source', 'limit', 'page'],
                                example: 'api.html?endpoint=live&league=premier&limit=10'
                            },
                            {
                                endpoint: '/fixtures',
                                description: 'Get upcoming and finished fixtures',
                                parameters: ['league', 'limit', 'page'],
                                example: 'api.html?endpoint=fixtures&league=la-liga&page=2'
                            },
                            {
                                endpoint: '/leagues',
                                description: 'Get all available leagues',
                                parameters: ['country'],
                                example: 'api.html?endpoint=leagues&country=england'
                            },
                            {
                                endpoint: '/standings',
                                description: 'Get league standings',
                                parameters: ['league'],
                                example: 'api.html?endpoint=standings&league=premier'
                            },
                            {
                                endpoint: '/sources',
                                description: 'Get data source statistics',
                                example: 'api.html?endpoint=sources'
                            },
                            {
                                endpoint: '/status',
                                description: 'Get API system status',
                                example: 'api.html?endpoint=status'
                            },
                            {
                                endpoint: '/search',
                                description: 'Search matches by team or league',
                                parameters: ['q', 'limit'],
                                example: 'api.html?endpoint=search&q=manchester&limit=20'
                            }
                        ],
                        formats: ['json', 'jsonp', 'xml'],
                        rate_limit: '100 requests per hour per IP',
                        cache_policy: '10 seconds',
                        authentication: 'None required',
                        documentation: 'https://github.com/xcrazybet/millioner',
                        support: 'Open issue on GitHub'
                    },
                    updated: new Date().toISOString()
                };
            }

            // ============ HELPER FUNCTIONS ============

            async getFirebaseData() {
                try {
                    const footballRef = collection(db, 'football_data');
                    const q = query(footballRef, orderBy('saved_at', 'desc'), limit(1));
                    const snapshot = await getDocs(q);
                    
                    if (!snapshot.empty) {
                        const latestDoc = snapshot.docs[0];
                        return {
                            success: true,
                            data: latestDoc.data(),
                            updated: latestDoc.data().last_updated
                        };
                    } else {
                        return {
                            success: false,
                            error: 'No data in Firebase. Start the collector first at https://xcrazybet.github.io/millioner/fot.html',
                            help: 'The data collector needs to run at least once to populate the database.'
                        };
                    }
                } catch (error) {
                    console.error('Firebase fetch error:', error);
                    return {
                        success: false,
                        error: error.message
                    };
                }
            }

            getFallbackData(endpoint) {
                const now = new Date();
                const fallbackData = {
                    live: {
                        endpoint: 'live',
                        data: [
                            {
                                id: 'fallback_1',
                                home_team: 'Manchester United',
                                away_team: 'Liverpool',
                                home_score: '2',
                                away_score: '1',
                                score: '2-1',
                                minute: '67\'',
                                league: 'Premier League',
                                country: 'England',
                                status: 'LIVE',
                                source: 'fallback',
                                timestamp: now.toISOString(),
                                start_time: new Date(now.getTime() - 4020000).toISOString()
                            }
                        ],
                        count: 1,
                        total: 1,
                        page: 1,
                        total_pages: 1,
                        note: 'Fallback data - Firebase not available. Start the collector at https://xcrazybet.github.io/millioner/fot.html',
                        updated: now.toISOString()
                    },
                    fixtures: {
                        endpoint: 'fixtures',
                        data: [],
                        count: 0,
                        note: 'No fixture data available',
                        updated: now.toISOString()
                    },
                    leagues: {
                        endpoint: 'leagues',
                        data: [
                            { name: 'Premier League', country: 'England', match_count: 1 },
                            { name: 'La Liga', country: 'Spain', match_count: 0 },
                            { name: 'Serie A', country: 'Italy', match_count: 0 }
                        ],
                        count: 3,
                        note: 'Fallback league data',
                        updated: now.toISOString()
                    },
                    standings: {
                        endpoint: 'standings',
                        data: {},
                        note: 'No standings data available',
                        updated: now.toISOString()
                    }
                };

                return fallbackData[endpoint] || fallbackData.live;
            }

            getNextUpdateTime(lastUpdate) {
                if (!lastUpdate) return 'Unknown';
                const last = new Date(lastUpdate);
                const next = new Date(last.getTime() + 3 * 60 * 1000); // 3 minutes
                return next.toISOString();
            }

            calculateCacheHitRate() {
                // Simple cache hit rate calculation
                return '95%';
            }

            // ============ OUTPUT FORMATS ============

            outputJSON(data) {
                // Set proper content type
                document.head.innerHTML = `
                    <meta charset="UTF-8">
                    <title>Football API - ${data.endpoint}</title>
                    <style>
                        body { 
                            margin: 0; padding: 20px; 
                            background: #0f172a; color: #f8fafc; 
                            font-family: monospace; font-size: 14px;
                        }
                        pre { 
                            white-space: pre-wrap; word-wrap: break-word;
                            margin: 0; line-height: 1.4;
                        }
                        .api-info {
                            background: rgba(59, 130, 246, 0.1);
                            padding: 10px; border-radius: 5px;
                            margin-bottom: 15px; border-left: 3px solid #3b82f6;
                        }
                    </style>
                `;
                
                document.body.innerHTML = `
                    <div class="api-info">
                        <strong>⚽ Football Data Hub API</strong><br>
                        Endpoint: ${data.endpoint} | 
                        Time: ${new Date().toLocaleTimeString()} |
                        ${data.cached ? '⚡ Cached' : '🔄 Fresh'}
                    </div>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            }

            outputJSONP(data, callback) {
                const script = document.createElement('script');
                script.textContent = `${callback}(${JSON.stringify(data)})`;
                document.body.appendChild(script);
            }

            outputXML(data) {
                document.head.innerHTML = `
                    <meta charset="UTF-8">
                    <title>Football API - ${data.endpoint}</title>
                `;
                
                // Convert to XML
                let xml = '<?xml version="1.0" encoding="UTF-8"?>\n';
                xml += `<football-api endpoint="${data.endpoint}" timestamp="${new Date().toISOString()}">\n`;
                
                // Convert data to XML (simplified)
                if (data.data && Array.isArray(data.data)) {
                    xml += '  <matches>\n';
                    data.data.forEach(item => {
                        xml += `    <match>\n`;
                        Object.entries(item).forEach(([key, value]) => {
                            if (value !== null && value !== undefined) {
                                xml += `      <${key}>${this.escapeXML(value.toString())}</${key}>\n`;
                            }
                        });
                        xml += `    </match>\n`;
                    });
                    xml += '  </matches>\n';
                }
                
                xml += `  <count>${data.count || 0}</count>\n`;
                xml += `  <updated>${data.updated}</updated>\n`;
                xml += '</football-api>';
                
                document.body.innerHTML = `<pre>${this.escapeHTML(xml)}</pre>`;
            }

            outputError(error) {
                const errorData = {
                    success: false,
                    error: error.message,
                    endpoint: new URLSearchParams(window.location.search).get('endpoint') || 'unknown',
                    timestamp: new Date().toISOString(),
                    help: 'Check https://xcrazybet.github.io/millioner/api.html for documentation',
                    status_code: 500
                };
                
                if (document.body) {
                    document.body.innerHTML = `
                        <div style="background: #fee; border: 2px solid #ef4444; padding: 20px; border-radius: 5px;">
                            <h2 style="color: #ef4444; margin-top: 0;">❌ API Error</h2>
                            <pre style="color: #ef4444;">${JSON.stringify(errorData, null, 2)}</pre>
                        </div>
                    `;
                }
            }

            escapeXML(text) {
                return text.replace(/[<>&"']/g, function(m) {
                    switch(m) {
                        case '<': return '&lt;';
                        case '>': return '&gt;';
                        case '&': return '&amp;';
                        case '"': return '&quot;';
                        case "'": return '&apos;';
                        default: return m;
                    }
                });
            }

            escapeHTML(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
        }

        // Initialize API when page loads
        document.addEventListener('DOMContentLoaded', () => {
            const api = new FootballAPI();
            api.handleRequest();
        });

        // Make API available globally for testing
        window.FootballAPI = FootballAPI;
    </script>
    
    <style>
        /* Loading animation */
        @keyframes spin { 
            to { transform: rotate(360deg); } 
        }
        
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f8fafc;
        }
        
        #loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: white;
        }
        
        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 6px solid rgba(255,255,255,0.1);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        .loading-text {
            font-size: 18px;
