<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>XLODON - Round Statistics Viewer</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; padding: 20px; }
        .container { max-width: 900px; margin: auto; }
        h2 { color: #00ff88; border-bottom: 2px solid #333; padding-bottom: 10px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #1e1e1e; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #333; }
        th { background: #252525; color: #00ff88; }
        tr:hover { background: #2a2a2a; }
        
        .status { padding: 10px; border-radius: 4px; margin-bottom: 10px; }
        .loading { background: #2c3e50; }
        .error { background: #c0392b; }
    </style>
</head>
<body>

<div class="container">
    <h2>Round 1 Statistics Feed</h2>
    <div id="status-msg" class="status loading">Connecting to Sportmonks API...</div>
    
    <table id="stats-table" style="display:none;">
        <thead>
            <tr>
                <th>Statistic Name</th>
                <th>Value</th>
                <th>Type ID</th>
            </tr>
        </thead>
        <tbody id="table-body"></tbody>
    </table>
</div>

<script>
    // Note: I added &include=type to your URL to get the human-readable names
    const API_URL = "https://api.sportmonks.com/v3/football/statistics/rounds/1?api_token=DkFdWG9jFZvH8XSEgLrRfGwczABWVg5rlV25GvIRyN06zdPsOI48Nsv9Wooy&include=type";

    async function fetchStats() {
        const statusEl = document.getElementById('status-msg');
        const tableEl = document.getElementById('stats-table');
        const tbody = document.getElementById('table-body');

        try {
            const response = await fetch(API_URL);
            const json = await response.json();

            if (!json.data || json.data.length === 0) {
                statusEl.className = "status error";
                statusEl.innerText = "No data found for this Round ID.";
                return;
            }

            // Hide loading, show table
            statusEl.style.display = "none";
            tableEl.style.display = "table";

            // Loop through statistics and build rows
            json.data.forEach(stat => {
                const row = document.createElement('tr');
                
                // If 'type' include worked, we show the name, otherwise the ID
                const statName = stat.type ? stat.type.name : "Unknown Stat";
                const statValue = stat.value || "0";

                row.innerHTML = `
                    <td><strong>${statName}</strong></td>
                    <td>${statValue}</td>
                    <td style="color: #888;">${stat.type_id}</td>
                `;
                tbody.appendChild(row);
            });

        } catch (error) {
            statusEl.className = "status error";
            statusEl.innerText = "Error: " + error.message;
        }
    }

    fetchStats();
</script>

</body>
</html>
