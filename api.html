        const firebaseConfig = {
            apiKey: "AIzaSyA72Yo_YGqno9PX25p3yQBvyflcaM-NqEM",
            authDomain: "x-bet-prod-jd.firebaseapp.com",
            projectId: "x-bet-prod-jd",
            storageBucket: "x-bet-prod-jd.firebasestorage.app",
            messagingSenderId: "499334334535",
            appId: "1:499334334535:web:bebc1bf817e24d9e3c4962",
            measurementId: "G-PTV4XMYQ6P"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ============ FOOTBALL API ============

        class FootballAPI {
            constructor() {
                this.cache = {};
                this.cacheDuration = 30000;
            }

            // Main handler
            async handleRequest() {
                const urlParams = new URLSearchParams(window.location.search);
                const endpoint = urlParams.get('endpoint') || 'live';
                const format = urlParams.get('format') || 'json';
                const league = urlParams.get('league');
                const team = urlParams.get('team');
                const country = urlParams.get('country');
                const source = urlParams.get('source');
                const callback = urlParams.get('callback');

                const params = { league, team, country, source };

                try {
                    const result = await this.getEndpointData(endpoint, params);
                    
                    // Add metadata
                    result.api = {
                        version: '2.0',
                        multi_source: true,
                        endpoints: ['live', 'fixtures', 'leagues', 'standings', 'sources', 'widgets'],
                        documentation: 'https://xcrazybet.github.io/millioner/'
                    };

                    result.request = {
                        endpoint: endpoint,
                        params: params,
                        timestamp: new Date().toISOString(),
                        url: window.location.href.split('?')[0]
                    };

                    // Output
                    if (format === 'jsonp' && callback) {
                        this.outputJSONP(result, callback);
                    } else {
                        this.outputJSON(result);
                    }
                } catch (error) {
                    this.outputError(error);
                }
            }

            // Get data for endpoint
            async getEndpointData(endpoint, params) {
                const cacheKey = `${endpoint}_${JSON.stringify(params)}`;
                
                // Check cache
                if (this.cache[cacheKey] && 
                    Date.now() - this.cache[cacheKey].timestamp < this.cacheDuration) {
                    return { ...this.cache[cacheKey].data, cached: true };
                }

                let data;
                switch(endpoint) {
                    case 'live':
                        data = await this.getLiveScores(params);
                        break;
                    case 'fixtures':
                        data = await this.getFixtures(params);
                        break;
                    case 'leagues':
                        data = await this.getLeagues(params);
                        break;
                    case 'standings':
                        data = await this.getStandings(params);
                        break;
                    case 'sources':
                        data = await this.getSourceStats(params);
                        break;
                    case 'widgets':
                        data = await this.getWidgetData(params);
                        break;
                    default:
                        data = await this.getLiveScores(params);
                }

                // Cache
                this.cache[cacheKey] = {
                    data: data,
                    timestamp: Date.now()
                };

                return { ...data, cached: false };
            }

            // ============ CORE FUNCTIONS ============

            async getLiveScores(params = {}) {
                try {
                    const firebaseData = await this.getFirebaseData();
                    
                    if (!firebaseData.success) {
                        return this.getFallbackData('live');
                    }

                    let matches = firebaseData.data.live_matches || [];
                    
                    // Apply filters
                    if (params.league) {
                        matches = matches.filter(m => 
                            m.league?.toLowerCase().includes(params.league.toLowerCase())
                        );
                    }
                    if (params.team) {
                        matches = matches.filter(m => 
                            m.home_team?.toLowerCase().includes(params.team.toLowerCase()) ||
                            m.away_team?.toLowerCase().includes(params.team.toLowerCase())
                        );
                    }
                    if (params.country) {
                        matches = matches.filter(m => 
                            m.country?.toLowerCase().includes(params.country.toLowerCase())
                        );
                    }
                    if (params.source) {
                        matches = matches.filter(m => 
                            m.source?.toLowerCase() === params.source.toLowerCase()
                        );
                    }

                    return {
                        success: true,
                        endpoint: 'live',
                        data: matches,
                        count: matches.length,
                        filters: params,
                        sources: firebaseData.data.stats?.sources || {},
                        updated: firebaseData.data.last_updated,
                        total_available: firebaseData.data.stats?.total_matches || 0
                    };
                } catch (error) {
                    console.error('Live scores error:', error);
                    return this.getFallbackData('live');
                }
            }

            async getFixtures(params = {}) {
                try {
                    const firebaseData = await this.getFirebaseData();
                    
                    if (!firebaseData.success) {
                        return this.getFallbackData('fixtures');
                    }

                    let fixtures = firebaseData.data.fixtures || [];
                    
                    // Apply filters
                    if (params.league) {
                        fixtures = fixtures.filter(f => 
                            f.league?.toLowerCase().includes(params.league.toLowerCase())
                        );
                    }

                    return {
                        success: true,
                        endpoint: 'fixtures',
                        data: fixtures,
                        count: fixtures.length,
                        filters: params,
                        updated: firebaseData.data.last_updated
                    };
                } catch (error) {
                    console.error('Fixtures error:', error);
                    return this.getFallbackData('fixtures');
                }
            }

            async getLeagues(params = {}) {
                try {
                    const firebaseData = await this.getFirebaseData();
                    
                    if (!firebaseData.success) {
                        return this.getFallbackData('leagues');
                    }

                    let leagues = firebaseData.data.leagues || [];
                    
                    if (params.country) {
                        leagues = leagues.filter(l => 
                            l.country?.toLowerCase().includes(params.country.toLowerCase())
                        );
                    }

                    return {
                        success: true,
                        endpoint: 'leagues',
                        data: leagues,
                        count: leagues.length,
                        filters: params,
                        updated: firebaseData.data.last_updated
                    };
                } catch (error) {
                    console.error('Leagues error:', error);
                    return this.getFallbackData('leagues');
                }
            }

            async getStandings(params = {}) {
                // Simple standings based on match results
                try {
                    const firebaseData = await this.getFirebaseData();
                    
                    if (!firebaseData.success) {
                        return this.getFallbackData('standings');
                    }

                    const allMatches = [
                        ...(firebaseData.data.live_matches || []),
                        ...(firebaseData.data.fixtures || [])
                    ];

                    // Calculate standings per league
                    const standings = {};
                    const league = params.league || 'Premier League';
                    
                    const leagueMatches = allMatches.filter(m => 
                        m.league?.toLowerCase().includes(league.toLowerCase()) && 
                        m.status === 'FINISHED'
                    );

                    // Simple points calculation
                    const teams = {};
                    leagueMatches.forEach(match => {
                        if (!teams[match.home_team]) {
                            teams[match.home_team] = { points: 0, played: 0, gf: 0, ga: 0 };
                        }
                        if (!teams[match.away_team]) {
                            teams[match.away_team] = { points: 0, played: 0, gf: 0, ga: 0 };
                        }

                        const homeScore = parseInt(match.home_score) || 0;
                        const awayScore = parseInt(match.away_score) || 0;

                        teams[match.home_team].played++;
                        teams[match.away_team].played++;
                        
                        teams[match.home_team].gf += homeScore;
                        teams[match.home_team].ga += awayScore;
                        teams[match.away_team].gf += awayScore;
                        teams[match.away_team].ga += homeScore;

                        if (homeScore > awayScore) {
                            teams[match.home_team].points += 3;
                        } else if (homeScore < awayScore) {
                            teams[match.away_team].points += 3;
                        } else {
                            teams[match.home_team].points += 1;
                            teams[match.away_team].points += 1;
                        }
                    });

                    // Convert to array and sort
                    const standingsArray = Object.entries(teams).map(([team, stats]) => ({
                        team: team,
                        position: 0,
                        played: stats.played,
                        wins: 0,
                        draws: 0,
                        losses: 0,
                        goals_for: stats.gf,
                        goals_against: stats.ga,
                        goal_difference: stats.gf - stats.ga,
                        points: stats.points
                    }));

                    standingsArray.sort((a, b) => b.points - a.points || b.goal_difference - a.goal_difference);
                    standingsArray.forEach((team, index) => {
                        team.position = index + 1;
                    });

                    standings[league] = standingsArray;

                    return {
                        success: true,
                        endpoint: 'standings',
                        data: standings,
                        league: league,
                        updated: firebaseData.data.last_updated
                    };
                } catch (error) {
                    console.error('Standings error:', error);
                    return this.getFallbackData('standings');
                }
            }

            async getSourceStats(params = {}) {
                try {
                    const apiDataRef = collection(db, 'api_live_data');
                    const q = query(apiDataRef, orderBy('updated_at', 'desc'), limit(1));
                    const snapshot = await getDocs(q);
                    
                    if (!snapshot.empty) {
                        const latestDoc = snapshot.docs[0];
                        const data = latestDoc.data();
                        
                        return {
                            success: true,
                            endpoint: 'sources',
                            data: {
                                source_stats: data.source_stats || {},
                                sources: data.sources || [],
                                extraction_count: data.extraction_count || 0,
                                last_extraction: data.updated_at
                            },
                            updated: new Date().toISOString()
                        };
                    }
                    
                    return {
                        success: true,
                        endpoint: 'sources',
                        data: {
                            sources: ['scorebat', 'api-football', 'espn', 'bbc'],
                            status: 'Waiting for first extraction'
                        },
                        updated: new Date().toISOString()
                    };
                    
                } catch (error) {
                    console.error('Source stats error:', error);
                    return {
                        success: false,
                        endpoint: 'sources',
                        error: error.message
                    };
                }
            }

            }

            // ============ HELPER FUNCTIONS ============

            async getFirebaseData() {
                try {
                    const apiDataRef = collection(db, 'api_live_data');
                    const q = query(apiDataRef, orderBy('updated_at', 'desc'), limit(1));
                    const snapshot = await getDocs(q);
                    
                    if (!snapshot.empty) {
                        const latestDoc = snapshot.docs[0];
                        return {
                            success: true,
                            data: latestDoc.data().data,
                            updated: latestDoc.data().updated_at
                        };
                    } else {
                        return {
                            success: false,
                            error: 'No data in Firebase'
                        };
                    }
                } catch (error) {
                    console.error('Firebase fetch error:', error);
                    return {
                        success: false,
                        error: error.message
                    };
                }
            }

            // ============ OUTPUT FUNCTIONS ============

            outputJSON(data) {
                // Check if this is an API call (no .html in referrer or has format=json)
                const isAPICall = !document.referrer || 
                                 !document.referrer.includes('.html') ||
                                 window.location.search.includes('format=json');
                
                if (isAPICall) {
                    // Pure JSON for API calls
                    document.head.innerHTML = '';
                    document.body.innerHTML = '';
                    
                    const pre = document.createElement('pre');
                    pre.textContent = JSON.stringify(data, null, 2);
                    document.body.appendChild(pre);
                    
                    const style = document.createElement('style');
                    style.textContent = `
                        body { 
                            margin: 0; 
                            padding: 20px; 
                            background: #0f172a; 
                            color: #f8fafc; 
                            font-family: monospace; 
                            font-size: 14px;
                        }
                        pre { 
                            white-space: pre-wrap; 
                            word-wrap: break-word;
                            margin: 0;
                        }
                    `;
                    document.head.appendChild(style);
                } else {
                    // Enhanced display for browser
                    this.renderAPIDocumentation(data);
                }
            }

            outputJSONP(data, callback) {
                const script = document.createElement('script');
                script.textContent = `${callback}(${JSON.stringify(data)})`;
                document.body.appendChild(script);
            }

            outputError(error) {
                const errorData = {
                    success: false,
                    error: error.message,
                    endpoint: new URLSearchParams(window.location.search).get('endpoint') || 'unknown',
                    timestamp: new Date().toISOString(),
                    help: 'Check https://xcrazybet.github.io/millioner/api.html for documentation'
                };
                
                document.body.innerHTML = `<pre style="color: #ef4444;">${JSON.stringify(errorData, null, 2)}</pre>`;
            }

                    ${data.endpoint === 'widgets' ? `
                    <div style="background: white; border-radius: 10px; padding: 25px; margin-top: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.1);">
                        <h3 style="color: #0f172a; margin-bottom: 15px;">📊 Widget Preview</h3>
                        <div style="display: grid; gap: 15px;">
                            <div>
                                <h4 style="color: #64748b; margin-bottom: 10px;">Live Games Widget</h4>
                                <api-sports-widget data-type="games" data-tab="live"></api-sports-widget>
                            </div>
                            <div>
                                <h4 style="color: #64748b; margin-bottom: 10px;">Leagues Widget</h4>
                                <api-sports-widget data-type="leagues"></api-sports-widget>
                            </div>
                        </div>
                    </div>
                    ` : ''}
                `;
                
                content.appendChild(sidebar);
                content.appendChild(main);
                
                container.appendChild(header);
                container.appendChild(content);
                document.body.appendChild(container);
                
                // Add copy function
                window.copyJSON = () => {
                    const jsonText = JSON.stringify(data, null, 2);
                    navigator.clipboard.writeText(jsonText)
                        .then(() => alert('JSON copied to clipboard!'))
                        .catch(err => console.error('Copy failed:', err));
                };
            }

            renderMatchesPreview(matches) {
                if (!matches || !Array.isArray(matches)) {
                    return '<p style="color: #64748b; text-align: center;">No match data available</p>';
                }
                
                return matches.slice(0, 3).map(match => `
                    <div style="display: flex; justify-content: space-between; align-items: center; padding: 15px; background: #f8fafc; border-radius: 8px; border-left: 4px solid #3b82f6;">
                        <div style="flex: 1;">
                            <div style="font-weight: bold; color: #0f172a;">${match.home_team || 'Unknown'} vs ${match.away_team || 'Unknown'}</div>
                            <div style="font-size: 12px; color: #64748b; margin-top: 5px;">
                                ${match.league || ''} • ${match.status || ''} • ${match.source || ''}
                            </div>
                        </div>
                        <div style="text-align: right;">
                            <div style="font-size: 24px; font-weight: bold; color: #0f172a;">${match.score || '0-0'}</div>
                            <div style="font-size: 12px; color: #64748b;">${match.minute || '0'}'</div>
                        </div>
                    </div>
                `).join('');
            }
        }

        // Initialize API
        document.addEventListener('DOMContentLoaded', () => {
            const api = new FootballAPI();
            api.handleRequest();
        });
    </script>
    
    <!-- Fallback -->
    <noscript>
        <style>
            body { font-family: sans-serif; padding: 40px; text-align: center; }
            .error-box { max-width: 600px; margin: 0 auto; padding: 40px; background: #fee; border: 2px solid #ef4444; border-radius: 10px; }
        </style>
        <div class="error-box">
            <h1>JavaScript Required</h1>
            <p>Enable JavaScript to use the Football API.</p>
            <p>Try direct endpoints:</p>
            <ul style="list-style: none; padding: 0;">
                <li><a href="?endpoint=live">/live</a></li>
                <li><a href="?endpoint=fixtures">/fixtures</a></li>
                <li><a href="?endpoint=leagues">/leagues</a></li>
            </ul>
        </div>
    </noscript>
</head>

    <div style="padding: 40px; text-align: center; color: #666;">
        <h1>Loading Football API...</h1>
        <p>Fetching multi-source data</p>
        <div style="margin-top: 20px;">
            <div style="display: inline-block; width: 40px; height: 40px; border: 4px solid #e2e8f0; border-top-color: #3b82f6; border-radius: 50%; animation: spin 1s linear infinite;"></div>
        </div>

            @keyframes spin { to { transform: rotate(360deg); } }
        </style>

</body>
